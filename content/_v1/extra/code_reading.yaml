          7. **第二次调用时** messages 是四条：system、user、带 tool_calls 的 assistant、tool 结果。模型基于工具结果生成「您的订单 SO20261101 已发货…」，这次没有 tool_calls，函数返回 `{"reply": ...}`。
      - id: x05-q2
        type: code
        question: |
          这段代码里哪些地方调用了外部服务？每一处可能抛出什么异常、当前代码会怎样处理？如果 LLM API 服务端「接受连接但一直不返回」，用户会等多久、最终看到什么？如果模型返回的 arguments 不是合法 JSON 呢？
        key_points:
          - {text: "指出两类外部调用：client.chat.completions.create 调用 LLM API，pool.acquire 与 fetchrow 访问数据库，启动时 create_pool 也是", dim: concept}
          - {text: "列出 LLM 侧异常：超时、连接错误、429、401、5xx，当前均未捕获会变成 500", dim: engineering}
          - {text: "说明未设 timeout 时 SDK 默认 10 分钟超时并自动重试 2 次，最坏约 30 分钟后才报错，期间连接和协程被占用", dim: principle}
          - {text: "说明非法 JSON 导致 json.loads 抛 JSONDecodeError，多余字段导致 TypeError，均未处理返回 500", dim: engineering}
          - {text: "指出前端或网关通常更早超时断开，而后端仍在等待，浪费资源", dim: engineering}
        reference: |
          **外部调用有三处**：
          - `client.chat.completions.create`：调用 LLM API，每轮一次，最多 5 轮。
          - `asyncpg.create_pool`（启动时）以及 `pool.acquire()`、`conn.fetchrow()`（每次工具调用）：访问 PostgreSQL。
          - 代码里没有任何 try/except，所以这些异常都会一路抛到 FastAPI，变成 500 Internal Server Error，用户看到的是一个没有任何解释的错误。

          **LLM 侧可能的异常**：`APITimeoutError`（超时）、`APIConnectionError`（连不上）、`RateLimitError`（429）、`AuthenticationError`（401，Key 错误）、`BadRequestError`（400，比如消息格式不对或上下文超长）、`InternalServerError`（5xx）。

          **API 一直不返回**：客户端创建时没有传 timeout，OpenAI Python SDK 默认超时是 10 分钟，并且会对超时自动重试 2 次。最坏情况下这一次模型调用要约 30 分钟才抛出 `APITimeoutError`，然后变成 500。实际上前端或 Nginx 通常 60 秒左右就超时断开了，用户看到「网关超时」，而后端协程还在傻等，占用内存和连接；用户再点一次，又多一个挂起的请求。

          **arguments 非法**：`call.function.arguments` 是模型生成的字符串，可能不是合法 JSON（被截断、多了注释），`json.loads` 抛 `JSONDecodeError`；即使是合法 JSON，模型多传一个字段（如 `{"order_no": "...", "detail": true}`），`**args` 展开时抛 `TypeError: unexpected keyword argument`。两种情况都直接 500，而且已经产生的模型调用费用白花了。正确做法是把解析错误作为 tool 消息返回给模型，让它修正参数。
      - id: x05-q3
        type: code
        question: |
          如果数据库连接失败，分别在「应用启动时」「运行中数据库突然重启」「连接池 10 个连接都被占满」三种情况下会发生什么？另外这段代码还有一个严重的安全问题。请给出完整的修复方案（可写关键代码）。
        key_points:
          - {text: "说明启动时 create_pool 抛异常导致应用启动失败，属于快速失败，需配合健康检查与重启策略", dim: principle}
          - {text: "说明运行中断开时 acquire 或 fetchrow 抛异常，当前变成 500，应捕获后作为工具错误交回模型", dim: engineering}
          - {text: "说明连接池耗尽时 acquire 默认无限等待，应设置 acquire 超时与查询超时", dim: engineering}
          - {text: "指出 user_id 由客户端传入且查询未按用户过滤导致越权，应从 JWT 获取并在 SQL 中限定", dim: engineering}
          - {text: "给出整体修复：LLM 超时与异常映射、参数解析容错、工具名分发校验、数据库异常处理", dim: project}
        reference: |
          **启动时连不上**：`lifespan` 里 `create_pool` 会抛出连接异常，lifespan 失败，应用直接启动失败。这其实是合理的「快速失败」，配合 Docker 的 `depends_on: condition: service_healthy` 和 `restart` 策略即可；不要吞掉异常让应用带病启动。

          **运行中数据库重启**：工具里 `pool.acquire()` 或 `fetchrow` 抛出 `ConnectionDoesNotExistError`、`OSError` 等异常，没有捕获，整个 `/chat` 返回 500，前面的模型调用费用白花，用户也得不到解释。应该捕获后返回一个错误结果给模型，让模型告诉用户「订单系统暂时不可用」。

          **连接池耗尽**：`pool.acquire()` 默认 timeout 为 None，会一直等待空闲连接；如果有慢查询占着连接，新请求全部挂起，表现为接口「卡死」。应设置 `acquire(timeout=3)` 和连接池的 `command_timeout`。

          **安全问题**：`user_id` 由客户端在请求体里传入，代码根本没用它；工具 SQL 只按订单号查，**任何人都能查任意订单的状态和金额**。用户还可以诱导模型「帮我查 SO2026…」遍历订单号。

          **修复要点**：

          ```python
          client = AsyncOpenAI(..., timeout=20.0, max_retries=1)

          async def get_order_status(pool, customer_id: int, order_no: str) -> dict:
              try:
                  async with pool.acquire(timeout=3) as conn:
                      row = await conn.fetchrow(
                          "SELECT order_no, status, amount FROM orders WHERE order_no = $1 AND customer_id = $2",
                          order_no, customer_id, timeout=3)
              except (asyncpg.PostgresError, asyncpg.InterfaceError, OSError, TimeoutError):
                  logger.exception("order_query_failed")
                  return {"error": "订单系统暂时不可用"}
              return dict(row) if row else {"error": "未找到该订单"}

          # chat 中：user 来自 Depends(get_current_user)，不再从请求体取 user_id
          for call in msg.tool_calls:
              if call.function.name != "get_order_status":
                  result = {"error": f"未知工具 {call.function.name}"}
              else:
                  try:
                      args = json.loads(call.function.arguments)
                      result = await get_order_status(pool, user.id, order_no=str(args["order_no"]))
                  except (json.JSONDecodeError, KeyError):
                      result = {"error": "参数格式错误，需要 order_no"}
              messages.append({"role": "tool", "tool_call_id": call.id, "content": json.dumps(result, ensure_ascii=False, default=str)})
          ```

          模型调用外层捕获 `openai.APITimeoutError`、`RateLimitError` 等，映射为 504、429 的统一错误格式；同时记录每轮调用的日志，便于排查。

  - id: x06
    title: LangGraph Agent：带 checkpoint 的 HR 助手
    level: 3
    unlock_day: 36
    scenario: |
      HR 助手接口：员工问「我还剩几天年假」，Agent 调用 `leave_balance` 工具查询后回答，同一 `session_id` 下支持多轮追问。上线前安全团队要求做代码审查，同时运维反馈压测时接口很慢、数据库连接数异常高。
    language: python
    code: |
      import os

      from fastapi import FastAPI
      from langchain_core.messages import HumanMessage
      from langchain_core.tools import tool
      from langchain_openai import ChatOpenAI
      from langgraph.checkpoint.postgres.aio import AsyncPostgresSaver
      from langgraph.graph import START, MessagesState, StateGraph
      from langgraph.prebuilt import ToolNode, tools_condition
      from pydantic import BaseModel

      from app.db import fetch_leave_balance   # async 函数：查询某员工剩余年假

      app = FastAPI()
      DB_URI = os.environ["CHECKPOINT_DB_URL"]


      @tool
      async def leave_balance(user_id: int) -> str:
          """查询员工剩余年假天数。"""
          days = await fetch_leave_balance(user_id)
          return f"员工 {user_id} 剩余年假 {days} 天"


      tools = [leave_balance]
      llm = ChatOpenAI(model=os.environ["LLM_MODEL"], timeout=30).bind_tools(tools)


      async def agent(state: MessagesState) -> dict:
          return {"messages": [await llm.ainvoke(state["messages"])]}


      builder = StateGraph(MessagesState)
      builder.add_node("agent", agent)
      builder.add_node("tools", ToolNode(tools))
      builder.add_edge(START, "agent")
      builder.add_conditional_edges("agent", tools_condition)
      builder.add_edge("tools", "agent")


      class AskIn(BaseModel):
          session_id: str
          question: str


      @app.post("/hr/ask")
      async def ask(body: AskIn, user_id: int) -> dict:   # user_id 来自网关注入的查询参数
          async with AsyncPostgresSaver.from_conn_string(DB_URI) as saver:
              await saver.setup()
              graph = builder.compile(checkpointer=saver)
              config = {"configurable": {"thread_id": body.session_id}}
              result = await graph.ainvoke(
                  {"messages": [HumanMessage(f"我的员工号是 {user_id}。{body.question}")]}, config)
          return {"answer": result["messages"][-1].content}
    walkthrough:
      function: |
        用 LangGraph 构建一个「模型 ⇄ 工具」循环的 Agent：agent 节点调用绑定了工具的模型，tools 节点执行工具，条件边决定继续调用工具还是结束；用 AsyncPostgresSaver 按 thread_id 保存对话状态，实现多轮对话。
      key_functions: |
        - `@tool leave_balance`：把异步函数包装成 LangChain 工具，函数签名生成参数 Schema，docstring 作为工具描述发给模型。
        - `bind_tools(tools)`：把工具 Schema 绑定到模型，调用时模型可以返回 tool_calls。
        - `agent`：节点函数，返回 `{"messages": [AIMessage]}`，由 MessagesState 的 reducer 追加到状态。
        - `ToolNode(tools)`：执行最后一条 AIMessage 中的 tool_calls，产生 ToolMessage。
        - `tools_condition`：有 tool_calls 返回 "tools"，否则返回 END。
        - `AsyncPostgresSaver.from_conn_string`：异步上下文管理器，建立数据库连接；`setup()` 创建或迁移 checkpoint 表。
      params: |
        - `body.session_id` 来自请求体，被直接用作 `thread_id`。
        - `user_id` 是查询参数（注释说由网关注入，但代码层面任何调用方都能传）。
        - `config["configurable"]["thread_id"]` 决定读取和写入哪一份 checkpoint。
        - 工具参数 `user_id: int` 会出现在给模型的 Schema 中，**由模型填写**。
        - 未传 `recursion_limit`，使用 LangGraph 默认值（1.1.4 起为 10007）。
      data_flow: |
        ```mermaid
        stateDiagram-v2
          [*] --> 读取checkpoint: ainvoke 按 thread_id
          读取checkpoint --> agent: 历史消息加新问题
          agent --> tools: AIMessage 含 tool_calls
          tools --> agent: 追加 ToolMessage
          agent --> 保存checkpoint: 无 tool_calls
          保存checkpoint --> [*]: 返回最后一条消息
        ```
      failure_points: |
        - **会话串号**：thread_id 直接用客户端传的 session_id，知道或猜到别人的 session_id 就能读到并续写别人的对话历史。
        - **身份可被模型篡改**：员工号写进用户消息、又作为工具参数由模型填写，用户说「我的员工号其实是 1002」就能查别人的年假。
        - **每个请求新建连接并执行 setup、编译图**：连接数随并发线性增长，setup 每次都检查迁移，拖慢请求。
        - **没有 recursion_limit**：默认 10007 步，模型反复调用工具时几乎不会被截断。
        - **ToolNode 默认错误处理**：只把参数错误转成消息，`fetch_leave_balance` 内部抛出的数据库异常会直接向上抛，接口 500。
      debugging: |
        - 用 `graph.aget_state(config)` 查看某个 thread 的当前状态，确认历史消息内容。
        - 用两个不同账号、相同 session_id 调用接口，观察第二个账号能否看到第一个账号的上下文。
        - 在数据库执行 `SELECT count(*) FROM pg_stat_activity` 观察压测时的连接数。
        - 在 `leave_balance` 中临时抛异常，观察接口返回 500 还是模型的说明。
      change_request: |
        - 需求「请假需要主管审批的操作先让员工确认」：在执行敏感工具前调用 LangGraph 的 `interrupt`，接口返回待确认信息，确认后用 `Command(resume=...)` 对同一 thread 恢复。
        - 需求「切换到 LangChain create_agent」：`create_agent(model, tools, checkpointer=...)` 可替代手写图，身份注入与 recursion_limit 的要求不变。
    questions:
      - id: x06-q1
        type: code
        question: |
          员工 A（user_id=1001）用 session_id="s1" 先问「我还剩几天年假」，再问「那明年会清零吗」。请说明两次请求中图的执行过程：每个节点做了什么、`tools_condition` 如何判断、checkpoint 在什么时候读和写、第二次请求时模型能看到哪些消息？
        key_points:
          - {text: "说明第一次请求从 START 进入 agent，模型返回 tool_calls，tools_condition 路由到 tools，ToolNode 执行后回到 agent 生成最终回答", dim: principle}
          - {text: "说明 MessagesState 的 reducer 追加消息而非覆盖，状态中依次有 Human、AI 含 tool_calls、Tool、AI 消息", dim: principle}
          - {text: "说明 checkpointer 按 thread_id 在开始时读取最新状态，并在每个 super-step 后保存", dim: principle}
          - {text: "说明第二次请求同一 thread_id 会加载前一轮全部消息，再追加新问题，模型能结合上下文回答", dim: concept}
        reference: |
          **第一次请求**：
          1. `ainvoke` 带着 `thread_id="s1"`，checkpointer 先查这个 thread 的最新 checkpoint，第一次不存在，状态从空开始；输入的 HumanMessage「我的员工号是 1001。我还剩几天年假」被 reducer 追加进 `messages`。
          2. 从 START 进入 agent 节点：调用绑定了工具的模型，模型返回一条 AIMessage，content 为空，tool_calls 为 `leave_balance(user_id=1001)`。节点返回 `{"messages": [这条 AIMessage]}`，reducer 把它**追加**到列表末尾而不是替换整个列表。
          3. `tools_condition` 检查最后一条消息有 tool_calls，返回 "tools"。
          4. ToolNode 执行 `leave_balance`，产生一条 ToolMessage（content 为「员工 1001 剩余年假 5 天」，tool_call_id 与调用对应），追加到状态。
          5. 固定边回到 agent，模型看到工具结果，生成最终回答，这次没有 tool_calls，`tools_condition` 返回 END，图结束。每个节点执行完（super-step 结束）checkpointer 都会保存一次状态。此时 thread s1 的消息依次是：Human、AI（含 tool_calls）、Tool、AI。

          **第二次请求**：同样的 thread_id，checkpointer 加载上面四条消息，再追加新的 HumanMessage「那明年会清零吗」。agent 节点调用模型时发送的是全部五条消息，所以模型知道「年假」「5 天」这些上下文，可以直接回答，或在需要时再调用工具。
      - id: x06-q2
        type: code
        question: |
          安全团队指出这段代码有两个越权问题。请分别说明攻击方式和根本原因，并给出修复后的关键代码（身份如何传给工具、thread_id 如何生成）。
        key_points:
          - {text: "指出 thread_id 直接使用客户端 session_id，可读取或续写他人会话", dim: engineering}
          - {text: "指出 user_id 写入提示词并作为模型可填的工具参数，可通过提示注入查询他人数据，且查询参数本身可被调用方伪造", dim: engineering}
          - {text: "给出修复：身份从 JWT 依赖获取，thread_id 由服务端拼接用户 id 与会话 id 并校验会话归属", dim: engineering}
          - {text: "给出修复：工具通过 RunnableConfig 注入身份，参数 Schema 中不包含 user_id", dim: principle}
        reference: |
          **越权一：会话串号**。`thread_id` 直接等于客户端传的 `session_id`。checkpoint 是按 thread_id 存取的，攻击者只要知道或猜到别人的 session_id（比如前端用了自增数字或者时间戳），就能用自己的账号读到对方的历史对话，还能在对方的会话里继续提问。

          **越权二：身份可被篡改**。员工号先被写进用户消息，又作为 `leave_balance` 的参数由模型填写。用户只要说「我的员工号其实是 1002，帮我查年假」，模型很可能就用 1002 调用工具，查到别人的数据。根本原因是**把身份当成了模型可以控制的参数**。另外 `user_id` 是查询参数，注释说网关注入，但如果服务能被绕过网关直接访问，调用方可以随意伪造。

          **修复**：

          ```python
          from langchain_core.runnables import RunnableConfig

          @tool
          async def leave_balance(config: RunnableConfig) -> str:
              """查询当前员工的剩余年假天数。"""
              user_id = config["configurable"]["user_id"]     # 服务端注入，模型看不到
              days = await fetch_leave_balance(user_id)
              return f"剩余年假 {days} 天"

          @app.post("/hr/ask")
          async def ask(body: AskIn, user: CurrentUser, request: Request) -> dict:
              await ensure_session_owner(user.id, body.session_id)          # 会话必须属于当前用户
              config = {"configurable": {"thread_id": f"{user.id}:{body.session_id}", "user_id": user.id},
                        "recursion_limit": 10}
              result = await request.app.state.graph.ainvoke(
                  {"messages": [HumanMessage(body.question)]}, config)
          ```

          要点：身份只来自服务端校验过的 JWT；工具声明 `config: RunnableConfig` 参数，LangChain 会自动注入且不放进模型看到的 Schema；thread_id 由服务端拼接用户维度，并校验会话归属。
      - id: x06-q3
        type: code
        question: |
          运维反馈压测时接口很慢、数据库连接数异常高；另外如果 `fetch_leave_balance` 因数据库故障抛异常，或模型反复调用工具，会怎样？请找出这段代码的稳定性和性能问题并给出修复。
        key_points:
          - {text: "指出每个请求都 from_conn_string 新建连接、执行 setup、编译图，导致连接数随并发增长且请求变慢", dim: engineering}
          - {text: "给出修复：在 lifespan 中创建一次 checkpointer、执行一次 setup、编译一次图放到 app.state，高并发时使用连接池", dim: engineering}
          - {text: "指出 ToolNode 默认会重新抛出工具内部异常导致 500，应设置 handle_tool_errors", dim: principle}
          - {text: "指出未设置 recursion_limit 时默认 10007 步，应显式设置并捕获 GraphRecursionError", dim: engineering}
        reference: |
          **性能问题**：`ask` 每次请求都执行 `AsyncPostgresSaver.from_conn_string`，它会新建一个数据库连接；接着 `setup()` 检查并执行迁移；再 `builder.compile` 编译图。并发 100 个请求就同时有 100 个新连接，加上建连和迁移检查的耗时，接口自然慢，连接数也会打满数据库的 max_connections。修复是在 lifespan 里只做一次：

          ```python
          @asynccontextmanager
          async def lifespan(app: FastAPI):
              async with AsyncPostgresSaver.from_conn_string(DB_URI) as saver:
                  await saver.setup()
                  app.state.graph = builder.compile(checkpointer=saver)
                  yield

          app = FastAPI(lifespan=lifespan)
          ```

          并发更高时，按官方说明改用 `psycopg_pool.AsyncConnectionPool`（autocommit=True、row_factory=dict_row）构造 `AsyncPostgresSaver(pool)`。

          **工具异常**：`ToolNode(tools)` 的默认错误处理只把「模型传错参数」转成错误消息，工具内部抛出的异常（比如数据库连接失败）会直接向上抛，整个请求 500。改为 `ToolNode(tools, handle_tool_errors=True)`，异常会变成 status 为 error 的 ToolMessage 交回模型，模型可以告诉员工「系统暂时无法查询」。工具内部也应有超时。

          **无限循环**：没有传 `recursion_limit`，LangGraph 从 1.1.4 起默认是 10007 步，模型如果反复调用工具，几乎不会被截断，Token 持续消耗。应在 config 顶层设置 `"recursion_limit": 10`，并捕获 `langgraph.errors.GraphRecursionError` 返回友好提示。

  - id: x07
    title: MCP Server：CRM 客户查询工具
    level: 4
    unlock_day: 38
    scenario: |
      销售团队希望 Agent 能查询 CRM 客户信息，同事用 MCP Python SDK v2 写了一个 MCP Server，并在 Agent 后端写了调用函数。Server 通过 Streamable HTTP 运行在 8001 端口。请你在接入生产 Agent 之前做安全和健壮性审查。
    language: python
    code: |
      # ===== crm_server.py（MCP Server，独立进程）=====
      import os
      from collections.abc import AsyncIterator
      from contextlib import asynccontextmanager
      from dataclasses import dataclass

      import asyncpg
      from mcp.server import MCPServer
      from mcp.server.mcpserver import Context


      @dataclass
      class AppContext:
          pool: asyncpg.Pool


      @asynccontextmanager
      async def lifespan(server: MCPServer) -> AsyncIterator[AppContext]:
          pool = await asyncpg.create_pool(os.environ["CRM_DSN"], min_size=1, max_size=5)
          try:
              yield AppContext(pool=pool)
          finally:
              await pool.close()


      mcp = MCPServer("crm", lifespan=lifespan)


      @mcp.tool()
      async def search_customers(ctx: Context[AppContext], keyword: str,
                                 order_by: str = "created_at") -> list[dict]:
          """按关键字搜索客户。order_by 可选 created_at / name / level。"""
          pool = ctx.request_context.lifespan_context.pool
          sql = (f"SELECT id, name, phone, id_card, level, created_at FROM customers "
                 f"WHERE name LIKE '%{keyword}%' ORDER BY {order_by} DESC")
          rows = await pool.fetch(sql)
          return [dict(r) for r in rows]


      @mcp.tool()
      async def update_customer_level(ctx: Context[AppContext], customer_id: int, level: str) -> str:
          """调整客户等级。"""
          pool = ctx.request_context.lifespan_context.pool
          await pool.execute("UPDATE customers SET level = $1 WHERE id = $2", level, customer_id)
          return "ok"


      if __name__ == "__main__":
          mcp.run(transport="streamable-http", host="0.0.0.0", port=8001)


      # ===== agent_side.py（Agent 后端调用）=====
      from mcp import Client


      async def call_crm(tool_name: str, args: dict) -> str:
          async with Client(os.environ["CRM_MCP_URL"]) as client:
              result = await client.call_tool(tool_name, args)
          return result.content[0].text
    walkthrough:
      function: |
        Server 端：用 `MCPServer` 暴露两个工具，`search_customers` 按关键字查询客户，`update_customer_level` 修改客户等级；`lifespan` 在服务启动时创建 asyncpg 连接池，供所有工具调用共享。Agent 端：`call_crm` 用 MCP `Client` 连接 Server，调用指定工具并返回第一段文本结果。
      key_functions: |
        - `MCPServer("crm", lifespan=...)`：MCP Python SDK v2 的服务端类（v1 中叫 FastMCP，v2 已改名，旧导入路径会报错）。
        - `@mcp.tool()`：根据函数名、docstring 和类型注解生成工具的 name、description 和 inputSchema。
        - `ctx: Context[AppContext]`：SDK 按注解注入的请求上下文，不会出现在 inputSchema 中；`ctx.request_context.lifespan_context` 是 lifespan yield 的对象。
        - `mcp.run(transport="streamable-http", ...)`：启动 HTTP 服务，默认端点 `/mcp`。
        - `Client(url)`：v2 的高层客户端，`call_tool` 返回 `CallToolResult`，包含 `content`、`structured_content`、`is_error`。
      params: |
        - `keyword`、`order_by`、`customer_id`、`level` 都由**模型**根据 inputSchema 填写，属于不可信输入。
        - `order_by` 的取值只写在 docstring 里，Schema 中只是任意字符串。
        - `CRM_DSN` 是数据库连接串，决定了 Server 用哪个数据库账号、有什么权限。
        - `result.content` 是内容块列表，元素可能是 TextContent、ImageContent 等不同类型。
      data_flow: |
        ```mermaid
        sequenceDiagram
          participant A as Agent 后端 call_crm
          participant S as MCPServer crm
          participant DB as CRM 数据库
          A->>S: 建立连接 Streamable HTTP /mcp
          A->>S: tools/call search_customers 参数
          S->>S: 按 inputSchema 校验参数 注入 ctx
          S->>DB: f-string 拼接的 SQL
          DB-->>S: 全部匹配行 含手机号身份证
          S-->>A: CallToolResult content structured_content
          A->>A: 取 content 第一个元素的 text
        ```
      failure_points: |
        - **SQL 注入**：`keyword` 和 `order_by` 用 f-string 拼进 SQL。
        - **敏感数据外泄**：返回 phone、id_card 等字段，会进入模型上下文和日志。
        - **没有行数限制**：关键字为空字符串时返回全表。
        - **写操作无控制**：`update_customer_level` 没有权限校验、没有人工确认，数据库账号可写。
        - **没有查询超时**：慢查询长期占用连接，5 个连接很快耗尽。
        - **网络暴露**：监听 0.0.0.0 且没有任何认证。
        - **客户端**：不检查 `is_error`；假设 `content[0]` 一定是 TextContent；每次调用新建连接；没有超时。
      debugging: |
        - 用 `uv run mcp dev crm_server.py` 打开 MCP Inspector，查看生成的 inputSchema，确认 ctx 不在其中、order_by 只是普通字符串。
        - 在 Inspector 中用 `keyword` 输入 `x%' OR '1'='1` 测试注入。
        - 用 pytest 加 `Client(mcp)` 内存直连做单元测试，无需起端口。
        - 打开 PostgreSQL 的 `log_statement = 'all'`，观察实际执行的 SQL 文本。
      change_request: |
        - 需求「销售只能查自己负责的客户」：MCP 不负责业务授权，由 Agent 后端从 JWT 取出销售 id 作为参数注入（模型不可见），Server 端 SQL 增加 `owner_id = $n` 条件。
        - 需求「修改客户等级需要主管确认」：写工具从这个 Server 移除，或在 Agent 侧用 interrupt 先让人工确认再调用，并记录审计日志。
    questions:
      - id: x07-q1
        type: code
        question: |
          请说明 Agent 端执行 `await call_crm("search_customers", {"keyword": "华星"})` 时完整的执行顺序：Server 何时创建连接池、工具的 name/description/inputSchema 从哪里来、为什么 `ctx` 不会出现在 Schema 里、`call_tool` 返回的对象包含哪些部分？
        key_points:
          - {text: "说明 lifespan 在 Server 启动时执行一次创建连接池，所有请求共享，关闭时释放", dim: principle}
          - {text: "说明 @mcp.tool 从函数名、docstring、类型注解生成 name、description、inputSchema，Context 类型参数由 SDK 注入不进入 Schema", dim: principle}
          - {text: "说明 Client 通过 Streamable HTTP 连接 /mcp，call_tool 发送 tools/call 请求，Server 校验参数后执行函数", dim: concept}
          - {text: "说明 CallToolResult 含 content 内容块列表、structured_content 结构化结果、is_error 标志", dim: concept}
        reference: |
          1. **Server 启动时**：执行 `mcp.run(transport="streamable-http", ...)`，在第一个请求到来前进入 `lifespan`，`asyncpg.create_pool` 创建连接池，yield 出 `AppContext(pool=...)`。这个对象在整个服务生命周期内被所有请求共享，服务关闭时执行 finally 里的 `pool.close()`。
          2. **工具注册**：`@mcp.tool()` 读取函数元信息：函数名 `search_customers` 成为工具名，docstring 成为描述，`keyword: str`、`order_by: str = "created_at"` 生成 inputSchema（keyword 必填、order_by 可选）。`ctx: Context[AppContext]` 被 SDK 按类型注解识别为上下文参数，**由 SDK 在每次调用时注入，不会出现在 inputSchema 里**，模型看不到也传不了。
          3. **Agent 端调用**：`Client(url)` 通过 Streamable HTTP 连接 `http://.../mcp` 并完成协议协商；`call_tool("search_customers", {"keyword": "华星"})` 发出 `tools/call` 请求。
          4. **Server 处理**：按 inputSchema 校验参数，构造 Context 注入，调用函数；函数通过 `ctx.request_context.lifespan_context.pool` 拿到连接池执行 SQL，返回 `list[dict]`。
          5. **返回结果**：SDK 把返回值封装成 `CallToolResult`：`content` 是给模型读的内容块列表（这里是 JSON 文本的 TextContent），`structured_content` 是结构化数据，`is_error` 表示工具是否执行失败。`call_crm` 取 `content[0].text` 返回，退出 `async with` 时关闭连接。
      - id: x07-q2
        type: code
        question: |
          请找出 Server 端的安全问题。针对 SQL 注入，请写出一个具体的恶意 `keyword` 或 `order_by` 输入并说明后果（注意：这些参数是由模型填写的，攻击者如何影响模型？）。最后给出修复后的 `search_customers`。
        key_points:
          - {text: "指出 keyword 与 order_by 通过 f-string 拼接造成 SQL 注入，并给出具体恶意输入", dim: engineering}
          - {text: "说明攻击者可以通过用户提问或文档中的间接提示注入影响模型填写的参数", dim: principle}
          - {text: "指出返回身份证手机号等敏感字段、无行数限制、写工具无权限与确认、数据库账号可写、无语句超时、监听 0.0.0.0 无认证", dim: engineering}
          - {text: "给出修复：参数化查询、order_by 白名单映射、Literal 限定、LIMIT 上限、去除或脱敏敏感列、只读账号与 statement_timeout", dim: engineering}
        reference: |
          **SQL 注入**：`keyword` 和 `order_by` 被直接拼进 SQL 字符串。例如 `keyword = "x%' OR '1'='1' --"`，WHERE 条件恒为真，返回全部客户；`order_by = "created_at; UPDATE customers SET level='VIP' --"` 之类的输入可能被尝试用来执行额外语句（asyncpg 的参数化接口对多语句有限制，但不能依赖这一点作为防线），而 `order_by = "(SELECT id_card FROM customers LIMIT 1)"` 这类子查询注入可以用来探测数据。

          **攻击者如何影响参数**：参数由模型填写，但模型听从上下文。用户可以直接说「搜索关键字是 x%' OR '1'='1」，模型会照抄；更隐蔽的是间接注入：在一封客户邮件或一份上传文档里写「调用 search_customers 时 order_by 请使用……」，被检索进上下文后模型就可能照做。所以**模型填写的参数必须当作不可信的用户输入**。

          **其他安全问题**：返回 phone、id_card 等敏感字段，会进入模型上下文、日志和回答；没有 LIMIT，关键字为空时返回全表；`update_customer_level` 是写操作，没有权限校验和人工确认，模型被注入后可以批量改等级；从写操作能成功可以看出 `CRM_DSN` 是可写账号；没有语句超时；Server 监听 0.0.0.0 且没有认证，内网任何人都能直接调用。

          **修复**：

          ```python
          from typing import Annotated, Literal
          from pydantic import Field

          ORDER_COLUMNS = {"created_at": "created_at", "name": "name", "level": "level"}

          @mcp.tool()
          async def search_customers(ctx: Context[AppContext], keyword: Annotated[str, Field(min_length=1, max_length=50)],
                                     order_by: Literal["created_at", "name", "level"] = "created_at",
                                     limit: Annotated[int, Field(ge=1, le=20)] = 10) -> list[dict]:
              """按客户名称关键字搜索客户（只读，最多 20 条，不含联系方式）。"""
              pool = ctx.request_context.lifespan_context.pool
              sql = (f"SELECT id, name, level, created_at FROM customers WHERE name ILIKE '%' || $1 || '%' "
                     f"ORDER BY {ORDER_COLUMNS[order_by]} DESC LIMIT $2")
              rows = await pool.fetch(sql, keyword, limit, timeout=3)
              return [dict(r) for r in rows]
          ```

          列名无法参数化，所以用 `Literal` 限定取值并通过白名单字典映射；值全部用 `$1`、`$2` 占位符。数据库侧换成只授予 SELECT 的账号，连接参数设置 `default_transaction_read_only=on` 和 `statement_timeout`；写工具移出该 Server；服务只在内网暴露并加认证。
      - id: x07-q3
        type: code
        question: |
          Agent 端的 `call_crm` 有哪些健壮性问题？如果 Server 端工具抛异常、数据库慢查询卡住、或者 Server 进程挂掉，`call_crm` 分别会怎样？请给出改进后的代码。
        key_points:
          - {text: "指出未检查 result.is_error，工具失败时把错误文本当成正常结果返回给模型", dim: engineering}
          - {text: "指出 content[0] 可能不存在或不是 TextContent，直接取 text 会 IndexError 或 AttributeError", dim: engineering}
          - {text: "说明未设超时时慢查询会让调用长时间挂起，Server 挂掉时 Client 连接抛异常未处理", dim: engineering}
          - {text: "给出改进：call_tool 设置 read_timeout_seconds、检查 is_error、按类型过滤内容块、捕获连接异常并返回明确错误、考虑复用长连接", dim: engineering}
        reference: |
          **工具抛异常**：Server 端工具内部抛出的异常会被 SDK 转成 `is_error=True` 的结果，content 里是错误信息。`call_crm` 不检查 `is_error`，把错误文本当成正常结果返回，Agent 可能把「数据库错误……」当作查询结果去解读，甚至编造答案。

          **内容块类型**：`content` 是列表，可能为空，元素也可能是 ImageContent、EmbeddedResource 等没有 `.text` 属性的类型，`content[0].text` 会抛 IndexError 或 AttributeError。官方示例都是先 `isinstance(block, TextContent)` 再取 text；有结构化输出时优先用 `structured_content`。

          **慢查询**：Server 端没有语句超时，Agent 端也没设置调用超时，一个慢查询会让这次工具调用长时间挂起，整轮对话跟着卡住。

          **Server 挂掉**：`Client(url)` 建连失败或请求中途断开会抛出连接相关异常，`call_crm` 没有捕获，会一路抛到 Agent 的工具节点，如果工具节点也没有错误处理，整个请求失败。

          **改进**：

          ```python
          import json
          import logging
          from mcp import Client
          from mcp.types import TextContent

          logger = logging.getLogger(__name__)

          async def call_crm(tool_name: str, args: dict) -> str:
              try:
                  async with Client(os.environ["CRM_MCP_URL"]) as client:
                      result = await client.call_tool(tool_name, args, read_timeout_seconds=10)
              except Exception:
                  logger.exception("crm_mcp_unavailable", extra={"tool": tool_name})
                  return "CRM 系统暂时不可用，请稍后再试。"
              text = "".join(b.text for b in result.content if isinstance(b, TextContent))
              if result.is_error:
                  logger.warning("crm_tool_error", extra={"tool": tool_name, "detail": text[:200]})
                  return f"查询失败：{text[:200]}"
              if result.structured_content is not None:
                  return json.dumps(result.structured_content, ensure_ascii=False, default=str)
              return text or "没有查询到结果。"
          ```

          此外，每次调用都新建 Client 连接有握手开销，高频调用时可以在应用 lifespan 中维持一个长连接复用，并在断开时重连。

  - id: x08
    title: 生产级流式问答：Redis 缓存、限流与 SSE
    level: 4
    unlock_day: 46
    scenario: |
      为了降低成本和抗住高峰流量，团队给流式问答接口加了 Redis 答案缓存和每用户限流，用 FastAPI 内置的 EventSourceResponse 推送 SSE。上线后出现三个问题：有员工在回答里看到了其他部门的制度内容；个别用户「永远被限流」；高峰期偶尔出现回答只显示一半就停住。
    language: python
    code: |
      import hashlib
      import json
      import os
      from collections.abc import AsyncIterable

      from fastapi import Depends, FastAPI, HTTPException
      from fastapi.sse import EventSourceResponse, ServerSentEvent
      from openai import AsyncOpenAI
      from pydantic import BaseModel
      from redis.asyncio import Redis

      from app.auth import CurrentUser          # 返回包含 id、dept_id 的当前用户
      from app.rag import build_messages        # 检索（带权限过滤）并组装 messages 与来源

      app = FastAPI()
      redis = Redis.from_url(os.environ["REDIS_URL"], decode_responses=True)
      llm = AsyncOpenAI(timeout=30.0, max_retries=1)
      MODEL = os.environ["LLM_MODEL"]


      class AskIn(BaseModel):
          question: str


      async def rate_limit(user: CurrentUser) -> None:
          key = f"rl:{user.id}"
          count = await redis.incr(key)
          if count == 1:
              await redis.expire(key, 60)
          if count > 20:
              raise HTTPException(429, "请求过于频繁")


      @app.post("/ask/stream", response_class=EventSourceResponse, dependencies=[Depends(rate_limit)])
      async def ask_stream(body: AskIn, user: CurrentUser) -> AsyncIterable[ServerSentEvent]:
          cache_key = "ans:" + hashlib.sha256(body.question.strip().encode()).hexdigest()
          cached = await redis.get(cache_key)
          if cached:
              yield ServerSentEvent(data=json.loads(cached), event="cached")
              return

          messages, sources = await build_messages(user, body.question)
          stream = await llm.chat.completions.create(model=MODEL, messages=messages, stream=True)
          parts: list[str] = []
          async for chunk in stream:
              if chunk.choices and chunk.choices[0].delta.content:
                  delta = chunk.choices[0].delta.content
                  parts.append(delta)
                  yield ServerSentEvent(data={"delta": delta}, event="token")

          answer = {"answer": "".join(parts), "sources": sources}
          await redis.set(cache_key, json.dumps(answer, ensure_ascii=False), ex=3600)
          yield ServerSentEvent(data={"sources": sources}, event="sources")
          yield ServerSentEvent(raw_data="[DONE]", event="done")
    walkthrough:
      function: |
        流式问答接口：先按用户做每分钟 20 次的限流；再按问题文本查 Redis 缓存，命中直接返回；未命中则检索并组装 messages，以 `stream=True` 调用大模型，把每个增量文本作为 SSE 的 token 事件推给前端，结束后写入缓存并推送来源和结束事件。
      key_functions: |
        - `rate_limit`：路由级依赖，用 Redis `INCR` 计数、首次计数时 `EXPIRE` 设置 60 秒窗口，超过 20 次抛 429。
        - `EventSourceResponse`：FastAPI 0.135 起内置的 SSE 响应类，路径函数 `yield` 的 `ServerSentEvent` 被编码为 `text/event-stream`，并自动设置禁止缓存、禁止代理缓冲的响应头和 keep-alive。
        - `llm.chat.completions.create(..., stream=True)`：返回异步流，每个 chunk 的 `choices[0].delta.content` 是增量文本。
        - `redis.get` / `redis.set(..., ex=3600)`：读取和写入答案缓存，1 小时过期。
      params: |
        - `user` 由 `CurrentUser` 依赖解析 JWT 得到，含 `id`、`dept_id`；`rate_limit` 和 `ask_stream` 都依赖它（同一请求内依赖结果会被缓存复用）。
        - `cache_key` 只由问题文本的 sha256 构成。
        - `messages, sources` 由 `build_messages` 返回，检索时已按用户部门过滤。
        - `parts` 收集所有增量文本，用于拼接完整答案写缓存。
      data_flow: |
        ```mermaid
        flowchart TB
          R["POST /ask/stream"] --> A["CurrentUser 解析 JWT"]
          A --> L["rate_limit INCR 首次 EXPIRE"]
          L -->|"超过 20"| E429["429"]
          L --> K["cache_key 仅由问题哈希构成"]
          K --> G{"Redis 命中"}
          G -->|"是"| C["推送 cached 事件 结束"]
          G -->|"否"| B["build_messages 带权限检索"]
          B --> S["stream=True 调用模型"]
          S --> T["逐个推送 token 事件"]
          T --> W["写入缓存 1 小时"]
          W --> SR["推送 sources 与 done"]
        ```
      failure_points: |
        - **缓存键缺少权限维度**：A 部门的答案和来源被缓存后，B 部门问同样的问题直接命中，泄露 A 部门内容。
        - **限流非原子**：`INCR` 成功后、`EXPIRE` 执行前如果进程崩溃或 Redis 调用超时，key 永远没有过期时间，计数只增不减，用户「永远被限流」。
        - **流式中途失败无处理**：模型流在中途超时或断开会抛异常，此时 200 已发出，前端只会看到连接中断，没有 error 事件；流消费过程中 SDK 不会自动重试。
        - **未检测客户端断开**：用户关掉页面后可能继续生成、继续计费。
        - **Redis 故障即整体不可用**：限流和缓存都是辅助功能，但 Redis 一挂所有请求都 500。
        - 文档更新后缓存最长 1 小时内仍返回旧答案。
      debugging: |
        - 用 `redis-cli TTL rl:<user_id>` 检查被投诉用户的限流 key，返回 -1 表示没有过期时间。
        - 用两个不同部门的账号问同一个问题，第二个账号收到 `cached` 事件即可复现泄露。
        - 用 mock LLM 服务在输出一半时断开连接，观察前端收到的事件序列和服务端日志。
        - `docker compose stop redis` 后请求接口，观察是否全部 500。
      change_request: |
        - 需求「文档更新后相关缓存立即失效」：缓存值中记录引用到的 document_id，维护 `doc:{id}:cache_keys` 集合，文档更新时删除集合中的所有缓存键。
        - 需求「限流改为每用户每分钟 20 次、每部门每分钟 200 次」：使用 Lua 脚本或 pipeline 一次性对两个 key 原子计数并设置过期。
    questions:
      - id: x08-q1
        type: code
        question: |
          请按执行顺序说明一次「缓存未命中」的请求从进入到结束的全过程：`CurrentUser`、`rate_limit`、`ask_stream` 的执行先后关系，前端会依次收到哪些 SSE 事件？如果同一个问题第二次被问到，执行路径有什么不同？
        key_points:
          - {text: "说明路由依赖 rate_limit 与其子依赖 CurrentUser 在路径函数执行前解析，同一请求内 CurrentUser 结果被复用", dim: principle}
          - {text: "说明限流与鉴权失败时在流开始前直接返回 401 或 429 普通响应", dim: principle}
          - {text: "说明未命中路径：检索组装、stream=True 调用、逐个 token 事件、写缓存、sources 事件、done 事件", dim: concept}
          - {text: "说明命中路径只推送一个 cached 事件后 return 结束，不调用模型", dim: concept}
        reference: |
          1. 请求进入后，FastAPI 先解析依赖：路由上的 `dependencies=[Depends(rate_limit)]` 需要 `CurrentUser`，于是先解析 JWT 得到 user；`ask_stream` 自己也声明了 `CurrentUser`，同一请求内 FastAPI 会缓存依赖结果，所以 JWT 只解析一次。
          2. `rate_limit` 执行 `INCR rl:{id}`，第一次计数时设置 60 秒过期，超过 20 次抛 429。鉴权失败或限流都发生在路径函数执行之前，客户端收到的是普通的 401 或 429 JSON 响应，而不是 SSE 流。
          3. 进入 `ask_stream`（这是一个异步生成器，响应开始后才逐步执行）：计算问题的哈希作为缓存键，`redis.get` 未命中。
          4. `build_messages` 做带权限过滤的检索并组装消息，`create(..., stream=True)` 返回异步流。
          5. 每收到一个带增量文本的 chunk，就 yield 一个 token 事件，前端收到多条 `event: token`、`data: {"delta": "..."}`。
          6. 流结束后拼接完整答案写入 Redis（1 小时过期），然后推送 `event: sources` 和 `event: done`（data 为原样的 `[DONE]`）。

          **第二次问同样的问题**：依赖解析和限流照常执行，`redis.get` 命中，只推送一个 `event: cached`（data 是缓存的答案和来源），然后 `return` 结束生成器，不检索也不调用模型。
      - id: x08-q2
        type: code
        question: |
          请解释「员工看到了其他部门的制度内容」和「个别用户永远被限流」分别是哪段代码导致的，触发条件是什么？如果 Redis 宕机，这个接口会怎样？请给出修复后的 `rate_limit` 和缓存键代码。
        key_points:
          - {text: "指出缓存键只包含问题哈希，没有部门或权限范围，导致跨部门命中他人答案与来源", dim: engineering}
          - {text: "指出 INCR 与 EXPIRE 是两次独立调用，中间失败会留下没有过期时间的 key，计数永不清零", dim: principle}
          - {text: "给出限流修复：用 pipeline 事务或 Lua 原子执行 INCR 与 EXPIRE，或使用 EXPIRE NX", dim: engineering}
          - {text: "给出缓存修复：缓存键加入部门等权限范围，或仅对公开资料启用缓存", dim: engineering}
          - {text: "指出 Redis 宕机时限流与缓存都抛异常导致全部 500，应捕获异常降级放行或跳过缓存", dim: engineering}
        reference: |
          **跨部门泄露**：`cache_key` 只由问题文本的哈希构成。虽然 `build_messages` 检索时做了权限过滤，但结果被缓存后，任何人问同一个问题都会命中。A 部门员工先问「项目奖金怎么算」，答案基于 A 部门的 dept 级文档并被缓存；B 部门员工一小时内问同样的问题，直接收到 A 部门的答案和来源。**缓存是权限过滤之后的数据，缓存键必须包含权限维度。**

          **永远被限流**：`INCR` 和 `EXPIRE` 是两次独立的网络调用。如果 `INCR` 成功（count 变成 1）之后，进程恰好重启、请求被取消，或者 `EXPIRE` 调用超时失败，这个 key 就没有过期时间。之后每次请求只会 INCR，count 不再等于 1，永远不会再设置过期，计数只增不减，超过 20 后该用户被永久限流。`redis-cli TTL` 返回 -1 就是这种情况。

          **Redis 宕机**：`rate_limit` 里的 `incr` 和 `ask_stream` 里的 `get` 都会抛连接异常，所有请求 500。限流和缓存是辅助能力，不应该让主功能跟着挂掉。

          **修复**：

          ```python
          import logging
          from redis.exceptions import RedisError
          logger = logging.getLogger(__name__)

          async def rate_limit(user: CurrentUser) -> None:
              key = f"rl:{user.id}"
              try:
                  async with redis.pipeline(transaction=True) as pipe:
                      pipe.incr(key)
                      pipe.expire(key, 60, nx=True)        # 只在没有过期时间时设置
                      count, _ = await pipe.execute()
              except RedisError:
                  logger.warning("rate_limit_degraded")    # 降级放行，并配合网关层限流兜底
                  return
              if count > 20:
                  raise HTTPException(429, "请求过于频繁")

          scope = f"dept:{user.dept_id}"
          cache_key = "ans:" + hashlib.sha256(f"{scope}|{body.question.strip()}".encode()).hexdigest()
          ```

          `pipeline(transaction=True)` 用 MULTI/EXEC 把两条命令作为一个事务发送；`EXPIRE ... NX` 需要 Redis 7.0 以上，也可以用 Lua 脚本实现。缓存读写同样包在 try/except 中，失败时跳过缓存直接走模型。更严格的做法是只对 visibility 为 public 的资料启用答案缓存。
      - id: x08-q3
        type: code
        question: |
          「回答只显示一半就停住」可能是什么原因？如果模型流在输出到一半时超时或断开、或者用户中途关闭页面，当前代码分别会怎样（包括缓存会不会被写入）？请给出修复后的流式部分代码。
        key_points:
          - {text: "说明流消费中途的超时或连接错误会抛异常，此时响应头 200 已发出，前端只看到中断，且 SDK 不会自动重试流消费", dim: principle}
          - {text: "说明异常发生后后续写缓存与 sources 和 done 都不会执行，前端无法区分完成与失败", dim: engineering}
          - {text: "说明未检测客户端断开可能继续生成并计费", dim: engineering}
          - {text: "给出修复：try except 捕获并发送 error 事件、检测 is_disconnected 后停止、只有完整成功才写缓存、记录日志", dim: engineering}
        reference: |
          **原因**：高峰期模型服务变慢，流式输出中途两次 chunk 之间的等待超过读超时，或者连接被对端断开，`async for chunk in stream` 会抛出 `APITimeoutError` 或 `APIConnectionError`。按 OpenAI SDK 文档，**流在消费过程中断开不会自动重试**，因为重放会产生重复输出。此时 HTTP 状态码 200 和前面的 token 早已发出，异常从生成器抛出后连接被中止，前端只看到流突然断了，没有任何 error 事件，也收不到 done，无法区分「已完成」还是「失败」。另外如果中间有 Nginx，`proxy_read_timeout` 太短也会造成同样的现象。

          **缓存会不会被写入**：中途抛异常时后面的 `redis.set` 不会执行，所以不会缓存半截答案，这一点是对的；但也意味着这次已经花费的 Token 完全浪费，且没有日志说明原因。

          **用户中途关闭页面**：代码没有主动检测断开。服务器要等到下一次写入失败才发现连接已关闭并取消生成器，在此之前模型仍在生成并计费；如果在完全生成后才发现，还会把答案写入缓存。

          **修复**：

          ```python
          @app.post("/ask/stream", response_class=EventSourceResponse, dependencies=[Depends(rate_limit)])
          async def ask_stream(body: AskIn, user: CurrentUser, request: Request) -> AsyncIterable[ServerSentEvent]:
              ...
              parts: list[str] = []
              completed = False
              try:
                  stream = await llm.chat.completions.create(model=MODEL, messages=messages, stream=True)
                  async for chunk in stream:
                      if await request.is_disconnected():
                          logger.info("client_disconnected")
                          break
                      if chunk.choices and chunk.choices[0].delta.content:
                          parts.append(chunk.choices[0].delta.content)
                          yield ServerSentEvent(data={"delta": parts[-1]}, event="token")
                  else:
                      completed = True
              except openai.APIError:
                  logger.exception("llm_stream_failed")
                  yield ServerSentEvent(data={"code": "STREAM_FAILED", "message": "生成中断，请重试"}, event="error")
              if completed:
                  await safe_cache_set(cache_key, {"answer": "".join(parts), "sources": sources})
                  yield ServerSentEvent(data={"sources": sources}, event="sources")
              yield ServerSentEvent(raw_data="[DONE]", event="done")
          ```

          `for ... else` 中的 else 只在循环没有被 break 时执行，用来标记「完整结束」；只有完整成功才写缓存和推送来源。前端收到 error 事件时提示用户重试。
