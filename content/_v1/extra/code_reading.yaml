        - **工具名未校验**：不论模型调用什么名字，都执行 `get_order_status`。
        - **数据库**：启动时连不上则 `create_pool` 抛异常、应用起不来；运行中断开则 `acquire`/`fetchrow` 抛异常；连接池耗尽时 `acquire()` 默认无超时，会一直等待。
        - **越权**：`user_id` 由客户端传入且查询不按用户过滤，任何人都能查任意订单。
      debugging: |
        - 在每次模型调用前后打日志：轮次、messages 条数、tool_calls 的名称和参数、耗时，用 request_id 串起来。
        - 用一个返回非法 JSON 参数的 mock LLM 服务复现 JSONDecodeError。
        - 把 `DATABASE_URL` 指向一个不存在的端口，分别测试启动时和运行中（启动后停掉数据库）的表现。
        - 把 `max_size` 设成 1，同时发 5 个请求，观察请求是否卡住。
      change_request: |
        - 需求「增加查询物流信息的工具」：在 `TOOLS` 增加定义，并建立 `name → 函数` 的注册表，按 `call.function.name` 分发，而不是写死一个函数。
