          **请求处理**：
          1. FastAPI 把请求体校验为 `ChatIn`，进入 `chat`。
          2. 构造 messages，**第一次调用时**是两条：`[{"role":"system","content":"你是客服助手…"}, {"role":"user","content":"帮我查一下订单 SO20261101…"}]`，同时传入 `tools=TOOLS`。`TOOLS` 是工具的 JSON Schema 描述，告诉模型「有一个叫 get_order_status 的工具，需要 order_no 参数」，它本身不执行任何东西。
          3. 模型判断需要查订单，返回的 assistant 消息 content 为空、`tool_calls` 里有一项：`id` 类似 `call_abc123`，`function.name` 为 `get_order_status`，`function.arguments` 为字符串 `'{"order_no":"SO20261101"}'`。模型**只返回调用意图，不会自己执行**。
          4. 因为有 tool_calls，代码把这条 assistant 消息 `model_dump` 后追加到 messages（必须追加，否则下一轮模型看不到自己发起过调用）。
          5. 遍历 tool_calls：`json.loads` 把参数字符串解析成字典，`**args` 展开为 `order_no="SO20261101"` 调用 `get_order_status`；工具从池中借连接执行参数化 SELECT，返回 `{"order_no": ..., "status": "shipped", "amount": Decimal(...)}`。
