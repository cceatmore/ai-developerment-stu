      failure_points: |
        - **LLM 调用**：未设置 timeout，SDK 默认 10 分钟、自动重试 2 次；可能抛 `APITimeoutError`、`APIConnectionError`、`RateLimitError`、`AuthenticationError` 等，代码都没捕获。
