  - id: m04
    name: 文本切片、Embedding 与向量入库
    unlock_day: 25
    features: [文本切片, Embedding, 向量数据库存储]
    goal: |
      把解析出的文本段切成合适大小的 chunk，**批量**调用 Embedding API 得到向量，在**一个事务里**替换该文档的全部 chunks 并建立 HNSW 索引。学完你应该能讲清：chunk size 和 overlap 怎么定、为什么批量、为什么用事务、HNSW 和 IVFFlat 怎么选。
    design: |
      **1. 切片：RecursiveCharacterTextSplitter**
      - 按分隔符优先级递归切：先按段落 `\n\n`，太长再按换行、中文句号等，最后才硬切字符。**尽量不把一句话切断**。
      - `chunk_size=800` 字符、`chunk_overlap=120`：中文制度类文档一段 300~800 字常见。**太大**：一个 chunk 混多个主题，向量被「平均」掉，检索不准，且占用上下文；**太小**：语义不完整，答案被切到两个 chunk。overlap 防止关键句恰好落在边界。
      - 注意 `chunk_size` 默认按 `len()` 计**字符**而不是 Token；要按 Token 控制可用 `from_tiktoken_encoder`。
      - 每个 chunk 带上元数据：document_id、页码、chunk_index、dept_id、visibility——**权限字段冗余到 chunk 上**，检索时一条 SQL 完成过滤。

      **2. Embedding：批量 + 保序**
      - 一次请求传一个列表（如 64 条），比逐条调用少几十倍的网络往返和限流压力。
      - 返回的 `data` 每项带 `index`，按 index 排序后再与 chunk 对应，**不要假设顺序**。
      - 维度必须与表定义一致（如 1536），换模型就要**重建全部向量**——不同模型的向量空间不可比。

      **3. 存储：pgvector**
      - 列类型 `VECTOR(1536)`，HNSW 索引 + `vector_cosine_ops`（余弦距离，配合 `<=>` 运算符）。
      - **HNSW vs IVFFlat**：HNSW 查询的速度-召回权衡更好、可以在空表上建；代价是建索引慢、占内存多。IVFFlat 需要先有数据训练聚类中心，数据分布变化大要重建。知识库场景写少读多，选 HNSW。
      - pgvector 限制：`vector` 类型建索引最多 2000 维，`halfvec` 最多 4000 维；高维模型可用 halfvec 半精度省一半空间。

      **4. 事务与顺序**
      - **先调 Embedding（网络慢），再开事务写库**：不要在事务里等网络，否则长时间持有锁和连接。
      - 事务内「删旧 chunks + 插新 chunks + 改 status=ready」原子完成：重复执行同一任务结果一致（幂等），中途失败不会留下半份数据。
    data_flow: |
      ```mermaid
      flowchart LR
        S["带页码的文本段"] --> C["RecursiveCharacterTextSplitter 800 120"]
        C --> M["附加元数据 页码 部门 可见性"]
        M --> B["按 64 条分批"]
        B --> E["embeddings.create 批量"]
        E --> O["按 index 排序 对齐 chunk"]
        O --> T["开启事务"]
        T --> D1["DELETE 该文档旧 chunks"]
        D1 --> I["INSERT 新 chunks 含向量"]
        I --> U["documents status ready"]
        U --> CM["COMMIT"]
        E -->|"失败"| F["status failed 记录 error"]
      ```
    key_code: |
      ```python
      # app/db/models.py（节选）
      from pgvector.sqlalchemy import VECTOR
      from sqlalchemy import ForeignKey, Index, Text
      from sqlalchemy.orm import Mapped, mapped_column

      from app.db.base import Base

      EMBED_DIM = 1536   # 必须与 Embedding 模型输出维度一致


      class Chunk(Base):
          __tablename__ = "chunks"
          id: Mapped[int] = mapped_column(primary_key=True)
          document_id: Mapped[int] = mapped_column(ForeignKey("documents.id", ondelete="CASCADE"), index=True)
          dept_id: Mapped[int | None] = mapped_column(index=True)
          visibility: Mapped[str]
          chunk_index: Mapped[int]
          page: Mapped[int | None]
          content: Mapped[str] = mapped_column(Text)
          embedding: Mapped[list[float]] = mapped_column(VECTOR(EMBED_DIM))

          __table_args__ = (
              Index("ix_chunks_embedding_hnsw", "embedding", postgresql_using="hnsw",
                    postgresql_with={"m": 16, "ef_construction": 64},
                    postgresql_ops={"embedding": "vector_cosine_ops"}),
          )
      ```

      ```python
      # app/services/ingest.py（节选）
      import asyncio
      import logging
      from pathlib import Path

      from langchain_text_splitters import RecursiveCharacterTextSplitter
      from sqlalchemy import delete, update

      from app.db.models import Chunk, Document
      from app.db.session import SessionLocal
      from app.services.llm import client
      from app.services.parsing import parse_file
      from app.core.config import settings

      logger = logging.getLogger("app.ingest")
      splitter = RecursiveCharacterTextSplitter(
          chunk_size=800, chunk_overlap=120,
          separators=["\n\n", "\n", "。", "！", "？", "；", " ", ""],
      )


      async def embed_texts(texts: list[str], batch: int = 64) -> list[list[float]]:
          vectors: list[list[float]] = []
          for i in range(0, len(texts), batch):
              resp = await client.embeddings.create(model=settings.embedding_model, input=texts[i:i + batch])
              vectors.extend(d.embedding for d in sorted(resp.data, key=lambda d: d.index))
          return vectors


      async def ingest_document(doc_id: int) -> None:
          async with SessionLocal() as session:
              doc = await session.get(Document, doc_id)
              if doc is None or doc.status == "ready":
                  return
              try:
                  doc.status = "parsing"
                  await session.commit()
                  sections = await asyncio.to_thread(parse_file, Path(doc.storage_path))
                  pieces = [(s.page, t) for s in sections for t in splitter.split_text(s.text)]

                  doc.status = "embedding"
                  await session.commit()
                  vectors = await embed_texts([t for _, t in pieces])

                  await session.execute(delete(Chunk).where(Chunk.document_id == doc.id))
                  session.add_all([
                      Chunk(document_id=doc.id, dept_id=doc.dept_id, visibility=doc.visibility,
                            chunk_index=i, page=page, content=text, embedding=vec)
                      for i, ((page, text), vec) in enumerate(zip(pieces, vectors, strict=True))
                  ])
                  doc.status, doc.error = "ready", None
                  await session.commit()
              except Exception as e:
                  await session.rollback()
                  logger.exception("ingest_failed", extra={"doc_id": doc_id})
                  await session.execute(
                      update(Document).where(Document.id == doc_id)
                      .values(status="failed", error=str(e)[:500]))
                  await session.commit()
      ```

      **读代码时重点看什么**
      - Embedding（网络调用）在 `delete/add_all` 之前完成；删旧、插新、改状态在**同一次 commit** 里，要么全成功要么全回滚。
      - `zip(..., strict=True)`：如果向量数量和 chunk 数量对不上会直接报错，而不是悄悄错位（Python 3.10+）。
      - `sorted(resp.data, key=lambda d: d.index)`：不假设返回顺序。
      - HNSW 索引参数 `m`、`ef_construction` 影响建索引速度和召回；查询时的 `hnsw.ef_search`（默认 40）影响查询召回。
      - `except` 里先 `rollback` 再用一条 `UPDATE` 改状态：rollback 后 `doc` 对象已过期，在异步会话里再读它的属性会触发隐式加载而报错。
      - 多次 `commit` 之后还能读 `doc.storage_path`，前提是 `SessionLocal` 配置了 `expire_on_commit=False`（见 m01）。
    tests:
      functional:
        - "上传一份 30 页 PDF，chunks 表记录数合理（每个 chunk 不超过 800 字符），page 字段正确"
        - "同一文档重复执行 ingest_document，chunks 数量不翻倍（幂等）"
        - "在 psql 中执行 EXPLAIN 查看按 embedding <=> 向量排序的查询，确认用上了 ix_chunks_embedding_hnsw"
        - "抽查相邻两个 chunk，确认结尾和开头有约 120 字符重叠"
