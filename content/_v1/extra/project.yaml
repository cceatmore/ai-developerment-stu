        reference: 先用调试接口看这个问题的 Top-K 片段和距离，确认年假条款有没有入库、排第几。若条款被切碎或和病假混在一个 chunk，就调整切片（按标题层级切、加标题前缀）。若是语义相近导致混淆，加 BM25 关键词检索做混合检索，再用 Rerank 模型重排；也可以先做 Query Rewrite 把口语问题改写成制度用语。所有改动都要在评估集上对比召回率，避免修好一个问题坏掉另一批。

  - id: m06
    name: LangGraph Agent 与工具调用
    unlock_day: 36
    features: [Agent 工具调用]
    goal: |
      用 LangGraph 搭一个「模型 ⇄ 工具」循环的 Agent：模型判断是查知识库（search_knowledge）还是查业务数据（query_orders，m07 实现），执行工具后把结果交回模型，直到给出最终回答；用 `AsyncPostgresSaver` 持久化对话状态，用 `recursion_limit` 防止无限循环。学完你应该能讲清 Agent 循环的每一步、状态如何保存、循环如何终止。
    design: |
      **1. 为什么用 LangGraph 而不是手写 while 循环**
      - 手写循环能跑，但**状态持久化、断点恢复、人工确认、流式输出每一步**都要自己造。LangGraph 把它们做成了图的能力：State（状态）、Node（节点函数）、Edge（边，含条件边）。
      - 备选：LangChain v1 的 `create_agent`（底层也是 LangGraph，封装好了模型-工具循环和中间件），适合标准场景；旧的 `langgraph.prebuilt.create_react_agent` 已标记弃用。本项目手写 StateGraph 是为了**看清机制**，生产里两者都可。

      **2. 图结构**
      - `MessagesState`：状态就是一个消息列表，节点返回的新消息会被**追加**（reducer 是 add_messages），不是覆盖。
      - `agent` 节点：调用绑定了工具的模型，返回 AIMessage（可能带 tool_calls）。
      - `tools` 节点：`ToolNode` 执行 tool_calls，每个调用产生一个 ToolMessage（带 tool_call_id 对应）。
      - 条件边 `tools_condition`：最后一条 AIMessage 有 tool_calls 就去 tools，否则结束。tools 执行完再回 agent。

      **3. 循环终止与失败处理**
      - **LangGraph 1.1.4 起默认 recursion_limit 是 10007 步**（早期版本是 25），对 Agent 来说几乎等于没有限制。必须在调用时显式传 `recursion_limit`（如 12），超出抛 `GraphRecursionError`，接口层捕获后返回友好提示。
      - **ToolNode 默认只把「模型传错参数」转成错误消息，工具内部抛出的异常会直接向上抛**，导致整个请求失败。设置 `handle_tool_errors=True` 让工具异常变成 ToolMessage 交回模型，模型可以换个方式或如实告知用户。
      - 工具自身也要有超时，否则一个卡住的工具会拖住整轮对话。

      **4. 用户身份如何传给工具**
      - **不能让模型传 user_id**（模型输出不可信，可被 Prompt 注入操纵）。身份由服务端放进 `config["configurable"]`，工具函数声明 `config: RunnableConfig` 参数，LangChain 会自动注入且**不出现在给模型的参数 Schema 里**。
      - 也可用 LangGraph 新的 `context_schema` + Runtime 传运行时上下文，写法以官方文档为准。

      **5. 持久化**
      - `AsyncPostgresSaver` 每个 super-step 后保存 checkpoint，按 `thread_id` 区分对话。`thread_id` 由服务端拼成 `user_id:conversation_id`，**不能直接用客户端传的值**，否则可以读别人的对话。
      - 在 FastAPI `lifespan` 里创建一次 checkpointer 并 `setup()` 建表，编译一次图，所有请求复用。
    data_flow: |
      ```mermaid
      stateDiagram-v2
        [*] --> agent: 用户消息加入 messages
        agent --> tools: 最后一条 AIMessage 含 tool_calls
        agent --> [*]: 无 tool_calls 输出最终回答
        tools --> agent: 追加 ToolMessage 成功或错误
        agent --> 超限: 步数超过 recursion_limit
        超限 --> [*]: GraphRecursionError 接口返回友好提示
      ```

      ```mermaid
      sequenceDiagram
        participant API as FastAPI
        participant G as 编译后的图
        participant CP as AsyncPostgresSaver
        participant L as LLM
        participant T as ToolNode
        API->>G: ainvoke 消息 config 含 thread_id 用户信息 recursion_limit
        G->>CP: 读取该 thread 的最新 checkpoint
        G->>L: agent 节点 带工具 Schema
        L-->>G: AIMessage tool_calls search_knowledge
        G->>CP: 保存 checkpoint
        G->>T: 执行工具 注入 config
        T-->>G: ToolMessage
        G->>L: agent 节点 再次调用
        L-->>G: 最终 AIMessage
        G->>CP: 保存 checkpoint
        G-->>API: 最终状态
      ```
    key_code: |
      ```python
      # app/agent/graph.py
      from langchain_core.messages import SystemMessage
      from langchain_core.runnables import RunnableConfig
      from langchain_core.tools import tool
      from langchain_openai import ChatOpenAI
      from langgraph.graph import END, START, MessagesState, StateGraph
      from langgraph.prebuilt import ToolNode, tools_condition

      from app.core.config import settings
      from app.db.session import SessionLocal
      from app.services.rag import build_context
      from app.services.retrieval import retrieve_for   # 问题向量化 + m05 的 retrieve
      from app.agent.mcp_tools import query_orders     # m07 实现

      SYSTEM = SystemMessage(
          "你是企业助手。制度、流程、产品问题用 search_knowledge；订单、客户等实时业务数据用 query_orders。"
          "回答时保留检索结果中的 [编号]。工具返回错误时如实告知用户，不要编造数据。"
      )


      @tool
      async def search_knowledge(query: str, config: RunnableConfig) -> str:
          """在企业知识库中检索制度、流程、产品资料。query 为改写后的检索语句。"""
          user_ctx = config["configurable"]           # 服务端注入，不来自模型
          async with SessionLocal() as session:
              hits = await retrieve_for(session, user_id=user_ctx["user_id"],
                                        dept_id=user_ctx["dept_id"], query=query)
          return build_context(hits) if hits else "知识库中没有找到相关资料。"


      TOOLS = [search_knowledge, query_orders]
      model = ChatOpenAI(model=settings.llm_model, base_url=settings.llm_base_url,
                         api_key=settings.llm_api_key, temperature=0, timeout=30, max_retries=2)
      model_with_tools = model.bind_tools(TOOLS)


      async def agent(state: MessagesState) -> dict:
          response = await model_with_tools.ainvoke([SYSTEM, *state["messages"]])
          return {"messages": [response]}


      def build_graph(checkpointer):
          builder = StateGraph(MessagesState)
          builder.add_node("agent", agent)
          builder.add_node("tools", ToolNode(TOOLS, handle_tool_errors=True))
          builder.add_edge(START, "agent")
          builder.add_conditional_edges("agent", tools_condition)
          builder.add_edge("tools", "agent")
          return builder.compile(checkpointer=checkpointer)
      ```

      ```python
      # app/main.py（节选）与调用方式
      from contextlib import asynccontextmanager

      from fastapi import FastAPI
      from langchain_core.messages import HumanMessage
      from langgraph.checkpoint.postgres.aio import AsyncPostgresSaver
      from langgraph.errors import GraphRecursionError

      from app.agent.graph import build_graph
      from app.core.config import settings
      from app.core.errors import AppError


      @asynccontextmanager
      async def lifespan(app: FastAPI):
          async with AsyncPostgresSaver.from_conn_string(settings.checkpoint_db_url) as checkpointer:
              await checkpointer.setup()
              app.state.graph = build_graph(checkpointer)
              yield

      app = FastAPI(lifespan=lifespan)


      async def run_agent(graph, user, conversation_id: int, question: str) -> str:
          config = {
              "configurable": {"thread_id": f"{user.id}:{conversation_id}",
                               "user_id": user.id, "dept_id": user.dept_id, "role": user.role},
              "recursion_limit": 12,
          }
          try:
              state = await graph.ainvoke({"messages": [HumanMessage(question)]}, config)
          except GraphRecursionError:
              raise AppError("AGENT_TOO_MANY_STEPS", "问题较复杂，请拆分后再问", 422)
          return state["messages"][-1].content
      ```

      **读代码时重点看什么**
      - `search_knowledge` 的 `config: RunnableConfig` 参数不会出现在给模型的工具 Schema 里，模型只能看到 `query`。
      - 工具的 docstring 就是给模型看的工具描述，写不清楚模型就会选错工具。
      - `agent` 节点返回 `{"messages": [response]}`：是**追加**而不是替换整个列表。
      - `recursion_limit` 放在 config 顶层，不在 `configurable` 里；不设就是 10007。
      - `thread_id` 由服务端用 `user.id` 拼接，客户端只能传自己的 conversation_id，并且接口层还要校验这个会话属于该用户。
      - `from_conn_string` 是异步上下文管理器，要在 lifespan 里 `async with` 保持整个应用生命周期。
