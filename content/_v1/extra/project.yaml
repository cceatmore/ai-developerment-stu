      # app/api/documents.py
      import asyncio
      import hashlib
      import uuid
      from pathlib import Path

      from fastapi import APIRouter, BackgroundTasks, UploadFile, status
      from sqlalchemy import select

      from app.core.config import settings
      from app.core.errors import AppError
      from app.core.security import CurrentUser, SessionDep
      from app.db.models import Document
      from app.services.ingest import ingest_document

      router = APIRouter(prefix="/documents", tags=["documents"])
      ALLOWED = {".pdf", ".docx", ".txt", ".md"}
      MAX_BYTES = 20 * 1024 * 1024


      @router.post("", status_code=status.HTTP_202_ACCEPTED)
      async def upload(file: UploadFile, background: BackgroundTasks,
                       user: CurrentUser, session: SessionDep) -> dict:
          suffix = Path(file.filename or "").suffix.lower()
          if suffix not in ALLOWED:
              raise AppError("UNSUPPORTED_TYPE", f"仅支持 {sorted(ALLOWED)}", 415)
          data = await file.read(MAX_BYTES + 1)
          if len(data) > MAX_BYTES:
              raise AppError("FILE_TOO_LARGE", "文件不能超过 20MB", 413)
          if not data:
              raise AppError("EMPTY_FILE", "文件为空", 400)

          sha = hashlib.sha256(data).hexdigest()
          dup = await session.scalar(
              select(Document.id).where(Document.owner_id == user.id, Document.sha256 == sha))
          if dup:
              return {"id": dup, "status": "duplicate"}

          path = Path(settings.upload_dir) / f"{uuid.uuid4().hex}{suffix}"
          await asyncio.to_thread(path.write_bytes, data)
          doc = Document(owner_id=user.id, dept_id=user.dept_id, title=file.filename,
                         visibility="dept", sha256=sha, storage_path=str(path), status="pending")
          session.add(doc)
          await session.commit()
          background.add_task(ingest_document, doc.id)
          return {"id": doc.id, "status": doc.status}
      ```

      ```python
      # app/services/parsing.py
      from dataclasses import dataclass
      from pathlib import Path

      import docx                     # python-docx
      from pypdf import PdfReader


      @dataclass
      class Section:
          text: str
          page: int | None = None


      class ParseError(Exception):
          pass


      def parse_file(path: Path) -> list[Section]:
          suffix = path.suffix.lower()
          if suffix == ".pdf":
              reader = PdfReader(path)
              sections = [Section(p.extract_text() or "", page=i + 1) for i, p in enumerate(reader.pages)]
          elif suffix == ".docx":
              d = docx.Document(str(path))
              parts = [p.text for p in d.paragraphs if p.text.strip()]
              for table in d.tables:
                  parts += [" | ".join(c.text for c in row.cells) for row in table.rows]
              sections = [Section("\n".join(parts))]
          else:
              raw = path.read_bytes()
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  text = raw.decode("gb18030")
              sections = [Section(text)]
          sections = [s for s in sections if s.text.strip()]
          if not sections:
              raise ParseError("未提取到文字，可能是扫描件，需要 OCR")
          return sections
      ```

      **读代码时重点看什么**
      - `file.read(MAX_BYTES + 1)` 为什么要 +1；`UploadFile` 底层是 SpooledTemporaryFile，大文件会先落临时盘。
      - 存储路径用 uuid，**原始文件名只进数据库**；想想如果直接用 `file.filename` 拼路径会发生什么。
      - `background.add_task(ingest_document, doc.id)` 只传 id：任务内部重新从数据库读文档，状态以数据库为准。
      - `parse_file` 是同步函数，调用方要用 `await asyncio.to_thread(parse_file, path)`，否则大 PDF 解析会卡住所有请求。
      - Word 的表格单独处理：很多制度文档的关键信息在表格里，`paragraphs` 读不到。
