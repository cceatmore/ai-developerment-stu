      reference: |
        上传接口只做轻量的同步工作：校验、落盘、写 documents 表（status=pending）、投递后台任务，然后返回 202 和文档 id。因为解析和向量化一份长 PDF 可能要几十秒，如果同步做，请求会被网关超时切断，用户还会重复点击导致重复入库。前端拿到 id 后轮询 GET /documents/{id} 看 status 从 pending、parsing、embedding 到 ready 或 failed。

        **校验**：后缀白名单不通过返回 415；用 read(MAX+1) 多读 1 字节判断是否超过 20MB，超出返回 413，避免把超大文件全部读进内存；空文件返回 400；对内容算 sha256，同一用户重复上传直接返回已有文档，省掉重复的 Embedding 费用。

        **安全**：落盘文件名用 uuid，原始文件名只存数据库展示，防止「../」路径穿越覆盖系统文件；写文件和解析 PDF 都是阻塞操作，用 asyncio.to_thread 放到线程池，否则一个大文件就能卡住所有请求。

        **解析**：PDF 用 pypdf 按页提取并保留页码，供后面引用来源使用；Word 用 python-docx 读段落和表格；TXT 先试 UTF-8 再试 GB18030。提取不到文字的扫描件直接标记 failed 并写明需要 OCR，不让空文本进入向量库。

        **失败与重启**：任务里任何异常都会捕获并写 status=failed 和 error。起步用 FastAPI 的 BackgroundTasks，它的问题是进程重启会丢任务、没有重试。所以我让任务只接收 doc_id，从数据库重新读状态，并且可重复执行，这样以后可以无痛迁移到 Redis 队列加独立 worker。
