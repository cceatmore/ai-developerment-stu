  - id: m03
    name: 文档上传与解析
    unlock_day: 22
    features: [文档上传, 文档解析]
    goal: |
      实现 PDF / Word / TXT / Markdown 的上传接口，做好**类型与大小校验、去重、安全落盘**，并在后台任务里把文档解析成「带页码的文本段」，用 `status` 字段跟踪进度。学完你应该能讲清：为什么上传接口要立刻返回 202、解析失败怎么让用户知道。
    design: |
      **1. 上传接口快速返回 202 Accepted**
      - 解析 + 向量化一份 100 页 PDF 可能要几十秒，**不能让 HTTP 请求一直挂着**（网关超时、用户重复点击）。
      - 接口只做：校验 → 落盘 → 写 documents(status=pending) → 投递后台任务 → 返回 202 和文档 id。前端轮询 `GET /documents/{id}` 看状态。

      **2. 校验放在最前面**
      - 白名单后缀（.pdf/.docx/.txt/.md），超出返回 415；**大小限制**（如 20MB）超出返回 413；空文件返回 400。
      - `await file.read(MAX + 1)`：多读 1 字节判断是否超限，避免把超大文件整个读进内存。
      - 生产上还应在 Nginx/网关层限制 body 大小，应用层是第二道防线。

      **3. 安全落盘**
      - **不用用户上传的文件名做路径**（可能含 `../` 路径穿越或特殊字符），用 uuid 生成存储名，原文件名只存数据库展示用。
      - 写文件是阻塞 IO，用 `asyncio.to_thread` 避免阻塞事件循环。

      **4. 去重**：对文件内容算 sha256，同一用户重复上传直接返回已有文档，**省一次 Embedding 费用**。

      **5. 解析策略**
      - PDF 用 `pypdf` 按页提取，保留页码用于后续引用；扫描件提取不到文字时标记 `failed: 需要 OCR`，而不是静默入库空文本。
      - Word 用 `python-docx` 读段落和表格；TXT 先试 UTF-8，失败再试 GB18030（国内老文档常见）。
      - 解析是 CPU/阻塞操作，放进 `asyncio.to_thread`。

      **6. 后台任务选型**
      - 起步用 FastAPI `BackgroundTasks`：简单，但**进程重启会丢任务、无重试、和 API 抢资源**。
      - Day 42 之后可换成 Redis 队列（arq / Celery / RQ）独立 worker：可重试、可水平扩展、API 进程不受影响。本模块的 `ingest_document(doc_id)` 只接收 id、从数据库重新读取状态，就是为了**以后无痛迁移到队列**（任务参数可序列化、幂等）。
