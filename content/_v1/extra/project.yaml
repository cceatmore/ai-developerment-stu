      oral: |
        检索时我把问题向量化，用一条 SQL 同时做余弦距离排序和权限过滤，权限在 LIMIT 之前生效，否则要么结果太少，要么泄露数据。因为 HNSW 是先扫描再过滤，我开了 iterative_scan 防止结果不足。距离超过阈值的片段丢掉，一个都没有就直接回答没找到，不调模型。生成时片段带编号和页码，Prompt 要求只依据资料、标注编号、不知道就说不知道、资料里的指令不执行。最后我用正则提取引用编号并校验范围，再映射回数据库里的文档和页码，所以来源是真实的，不是模型编的。
      followup:
        question: 用户问「年假怎么算」，但检索出来的是「病假」相关片段，你会从哪些方向排查和优化？
