        - "无检索结果时是否跳过了模型调用"
    retell:
      id: proj-m05-retell
      type: oral
      category: rag
      difficulty: 3
      question: 用户问一个问题，你的系统是怎么检索、怎么让大模型基于资料回答、又怎么保证回答里的引用是真实的？权限是在哪里控制的？
      key_points:
        - {text: "说明问题向量化后用余弦距离排序，权限条件和 Top-K 在同一条 SQL 中，先过滤再取 K", dim: principle}
        - {text: "指出 HNSW 过滤发生在索引扫描后可能导致结果不足，用 iterative_scan 缓解", dim: principle}
        - {text: "说明距离阈值过滤与无结果时不调用模型直接返回", dim: engineering}
        - {text: "说明 Prompt 约束：只依据资料、标注编号、不知道就说不知道、资料内指令不执行", dim: project}
        - {text: "说明引用编号经正则提取和范围校验后映射回数据库中的文档和页码，模型不能伪造来源", dim: engineering}
