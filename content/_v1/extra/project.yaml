  - id: m07
    name: 数据库查询工具（MCP Server）
    unlock_day: 38
    features: [数据库查询工具]
    goal: |
      把「查询业务数据库」做成一个独立进程的 **MCP Server**，只暴露**参数化、只读、限量**的查询工具；Agent 端通过 MCP Client 调用并把结果交给模型。学完你应该能讲清：为什么不让模型直接写 SQL、为什么要用 MCP 隔离、如何做到只读和按部门限定范围。
    design: |
      **1. 不让模型写 SQL（Text-to-SQL）的原因**
      - 模型生成的 SQL 可能**越权**（查别的部门）、**破坏数据**（DELETE/UPDATE）、**拖垮数据库**（全表扫描、笛卡尔积）、被 **Prompt 注入**操纵。
      - 本项目采用「**预定义查询工具**」：每个工具对应一条写死的参数化 SQL，模型只能填参数。灵活性低一些，但安全可控。真要做 Text-to-SQL，也要加只读账号、SQL 解析白名单、行数限制、人工确认。

      **2. 为什么用 MCP 而不是直接在 Agent 里写函数**
      - **凭证隔离**：业务库的连接串只在 MCP Server 进程里，API 进程拿不到；API 被攻破也不能直接连业务库。
      - **复用**：同一个 MCP Server 可以给 Cursor、Claude Desktop、其他 Agent 使用，工具定义只写一次。
      - **标准化**：工具的名称、描述、参数 JSON Schema、结构化返回都由协议定义。
      - 代价：多一个进程和一次网络跳转；工具很少且不复用时，直接写函数更简单。

      **3. MCP Python SDK 当前写法（v2）**
      - SDK v2（2026 年发布，当前 2.3.x）把 `FastMCP` 改名为 `MCPServer`（`from mcp.server import MCPServer`），旧的 `mcp.server.fastmcp` 导入会报 ModuleNotFoundError；装饰器 `@mcp.tool()` 用法不变。
      - 用 `lifespan` 在启动时创建 asyncpg 连接池，工具通过 `ctx.request_context.lifespan_context` 拿到。
      - 传输用 Streamable HTTP（默认端点 `/mcp`）；客户端用 `Client("http://mcp:8001/mcp")`，`call_tool` 返回 `CallToolResult`（`content`、`structured_content`、`is_error`）。

      **4. 三层防护**
      - **数据库层**：专用只读账号（只授予 SELECT），连接参数设 `default_transaction_read_only=on`、`statement_timeout=3000ms`。
      - **工具层**：参数化查询（`$1`），状态用 `Literal` 枚举，`limit` 上限 50，返回 `truncated` 标记。
      - **调用层**：`dept_id` 由 Agent 后端从用户上下文注入，**不暴露给模型**；角色没有 `db:query` 权限直接拒绝。
      - MCP Server 只监听内网，不对公网暴露。ctx.headers 是客户端可控输入，**不能当作身份凭证**。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant L as LLM
        participant A as Agent 后端 query_orders 包装
        participant C as MCP Client
        participant S as MCP Server biz-db
        participant DB as 业务库 只读账号
        L->>A: tool_call query_orders 客户名 状态 limit
        A->>A: 检查角色权限 注入 dept_id
        A->>C: call_tool 带超时
        C->>S: Streamable HTTP POST /mcp
        S->>S: 参数校验 limit 不超过 50
        S->>DB: 参数化 SELECT 3 秒语句超时
        DB-->>S: 行数据
        S-->>C: structured_content 与 truncated
        C-->>A: CallToolResult
        A->>A: is_error 为真则返回错误文本
        A-->>L: ToolMessage JSON 字符串
      ```
    key_code: |
      ```python
      # mcp_server/server.py —— 独立进程
      import os
      from collections.abc import AsyncIterator
      from contextlib import asynccontextmanager
      from dataclasses import dataclass
      from datetime import date
      from typing import Annotated, Literal

      import asyncpg
      from pydantic import BaseModel, Field
      from mcp.server import MCPServer
      from mcp.server.mcpserver import Context


      @dataclass
      class AppContext:
          pool: asyncpg.Pool


      @asynccontextmanager
      async def lifespan(server: MCPServer) -> AsyncIterator[AppContext]:
          pool = await asyncpg.create_pool(
              os.environ["BIZ_READONLY_DSN"], min_size=1, max_size=5, command_timeout=5,
              server_settings={"default_transaction_read_only": "on", "statement_timeout": "3000"},
          )
          try:
              yield AppContext(pool=pool)
          finally:
              await pool.close()


      mcp = MCPServer("biz-db", lifespan=lifespan)


      class OrderRow(BaseModel):
          order_no: str
          customer: str
          amount: float
          status: str
          created_on: date


      class OrdersResult(BaseModel):
          rows: list[OrderRow]
          truncated: bool


      @mcp.tool()
      async def query_orders(
          ctx: Context[AppContext],
          customer_name: str,
          dept_id: int,
          status: Literal["paid", "shipped", "refunded"] | None = None,
          limit: Annotated[int, Field(ge=1, le=50)] = 20,
      ) -> OrdersResult:
          """按客户名称查询订单（只读）。customer_name 支持模糊匹配，status 可选。"""
          pool = ctx.request_context.lifespan_context.pool
          rows = await pool.fetch(
              """SELECT order_no, customer, amount, status, created_at::date AS created_on
                 FROM orders
                 WHERE dept_id = $1 AND customer ILIKE '%' || $2 || '%'
                   AND ($3::text IS NULL OR status = $3)
                 ORDER BY created_at DESC LIMIT $4""",
              dept_id, customer_name, status, limit + 1,
          )
          return OrdersResult(rows=[OrderRow(**dict(r)) for r in rows[:limit]], truncated=len(rows) > limit)


      if __name__ == "__main__":
          mcp.run(transport="streamable-http", host="0.0.0.0", port=8001)
      ```

      ```python
      # app/agent/mcp_tools.py —— Agent 端包装，模型看不到 dept_id
      import json

      from langchain_core.runnables import RunnableConfig
      from langchain_core.tools import tool
      from mcp import Client
      from mcp.types import TextContent

      from app.core.config import settings
      from app.core.security import has_permission


      @tool
      async def query_orders(customer_name: str, config: RunnableConfig,
                             status: str | None = None, limit: int = 20) -> str:
          """查询某客户的订单。status 可选 paid/shipped/refunded，limit 最大 50。"""
          ctx = config["configurable"]
          if not has_permission(ctx["role"], "db:query"):
              return "当前账号没有查询业务数据的权限。"
          args = {"customer_name": customer_name, "dept_id": ctx["dept_id"],
                  "status": status, "limit": min(limit, 50)}
          async with Client(settings.mcp_url) as client:
              result = await client.call_tool("query_orders", args, read_timeout_seconds=10)
          if result.is_error:
              text = "".join(b.text for b in result.content if isinstance(b, TextContent))
              return f"查询失败：{text}"
          return json.dumps(result.structured_content, ensure_ascii=False, default=str)
      ```

      **读代码时重点看什么**
      - SQL 用 `$1..$4` 占位符，用户输入从不拼进 SQL 字符串；`ILIKE '%' || $2 || '%'` 是在数据库里拼接。
      - `limit + 1` 多查一行，用来判断是否被截断，告诉模型「还有更多」。
      - 只读和语句超时在**连接参数**里设置，即使工具代码写错也无法写库或长时间占用。
      - `ctx: Context[AppContext]` 由 SDK 注入，不会出现在工具的输入 Schema 中。
      - Agent 端包装函数的参数里**没有 dept_id**，模型看不到也传不了；dept_id 来自服务端 config。
      - 每次调用都新建 `Client` 连接，简单但有开销；高并发时可在 lifespan 里维持长连接（审查清单会问到）。
    tests:
      functional:
        - "用 uv run mcp dev mcp_server/server.py 打开 MCP Inspector，能看到 query_orders 及其参数 Schema（不含 ctx）"
        - "在 Inspector 中调用 query_orders，返回 rows 与 truncated，limit=1 时 truncated=true（数据多于 1 条时）"
        - "Agent 问「华星科技最近有哪些已发货订单」，最终回答中的订单号与数据库一致"
