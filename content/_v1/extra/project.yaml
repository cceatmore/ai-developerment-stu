        **检索**：先把问题向量化，然后执行一条 SQL：按余弦距离排序取 Top-6，同时 WHERE 里限定文档状态为 ready，且片段是公开的、或属于用户所在部门、或是用户本人上传的。权限条件必须在 LIMIT 之前生效，如果先取 Top-K 再在 Python 里过滤，结果可能所剩无几；忘了过滤就是数据泄露。HNSW 是近似索引，过滤发生在索引扫描之后，默认只拿 40 个候选，过滤掉大半时结果不足，所以我在事务里设置 hnsw.iterative_scan=relaxed_order，让它继续扫描凑够数量，取回后再按距离重排。

