      reference: |
        **图的组成**：状态用 MessagesState，就是一个消息列表，节点返回的消息通过 add_messages 追加。agent 节点调用绑定了工具的模型；tools 节点是 ToolNode，负责执行模型给出的 tool_calls；从 agent 出来走 tools_condition 条件边：最后一条 AIMessage 有 tool_calls 就去 tools，否则结束；tools 执行完固定回到 agent。

        **一次问答**：用户问「客户华星最近的订单」，接口调用 graph.ainvoke，config 里有 thread_id、用户信息和 recursion_limit。图先从 checkpointer 读出这个 thread 的历史消息，agent 节点把系统提示、历史和新问题发给模型；模型返回带 tool_calls 的 AIMessage，指定调用 query_orders 和参数；ToolNode 执行工具，产生带 tool_call_id 的 ToolMessage；回到 agent，模型看到工具结果后生成最终回答，没有 tool_calls，图结束。每一步结束都会保存 checkpoint。

        **状态保存**：用 AsyncPostgresSaver，在 lifespan 里创建一次并 setup 建表，图也只编译一次。thread_id 由服务端拼成「用户 id:会话 id」，接口还会校验会话归属，客户端不能直接指定别人的 thread。

        **防死循环和工具失败**：LangGraph 从 1.1.4 起默认 recursion_limit 是 10007 步，对 Agent 几乎等于不设限，所以我在调用时显式传 12，超出会抛 GraphRecursionError，接口返回「问题较复杂，请拆分」。ToolNode 默认只把参数错误转成消息，工具内部异常会直接抛出导致请求失败，所以我设置 handle_tool_errors=True，把异常转成 ToolMessage 交回模型，让模型如实告知用户；工具内部也设了超时。

        **身份传递**：工具声明 config: RunnableConfig 参数，LangChain 自动注入，且不会出现在模型看到的参数 Schema 里。身份只来自服务端的 JWT 解析结果，模型无法通过参数伪造 user_id。
