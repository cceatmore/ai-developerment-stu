title: 企业智能知识库 + Agent 助手
intro: |
  ## 项目目标

  做一个**能写进简历、能经得起面试官深挖**的企业级 AI 应用：员工上传制度、产品手册、FAQ 等文档，系统自动解析、切片、向量化入库；员工用自然语言提问，系统检索相关片段，由大模型生成**带引用来源**的回答；遇到「查一下客户 A 最近的订单」这类需要实时数据的问题，Agent 会调用**数据库查询工具**拿到结果再回答。

  **技术栈**：Python 3.12+、FastAPI、PostgreSQL + pgvector、Redis、LangChain、LangGraph、OpenAI 兼容 LLM API（OpenAI / DeepSeek / 通义 / 本地 vLLM 均可，只要兼容 Chat Completions）、MCP、Docker Compose。

  **覆盖的 17 个功能**：用户注册与登录、文档上传、文档解析、文本切片、Embedding、向量数据库存储、RAG 检索、大模型回答、引用知识来源、Agent 工具调用、数据库查询工具、会话历史、SSE 流式响应、错误处理、日志记录、基础权限控制、Docker 部署。

  ## 学习方式（重要）

  - **你可以让 AI 写大部分代码**，这就是今天真实的开发方式。但这个项目**不是 AI 代码生成练习**。
  - 每个模块你必须做到四件事：
    1. **讲得清架构**：这个模块在整体里处于什么位置、上下游是谁。
    2. **讲得清数据流**：一个请求进来，数据经过哪些函数、变成什么形状、存到哪里。
    3. **读得懂关键代码**：模块里的 `key_code` 必须逐行读懂，能指出哪里会出错。
    4. **讲得清技术决策**：为什么这样做、备选方案是什么、代价是什么。
  - 每个模块按「目标 → 设计 → 数据流 → 关键代码 → 测试清单 → 原理复述」组织。**测试清单要真的跑一遍**，原理复述题要**先自己说一遍再看参考答案**。
  - 模块按课程进度解锁（`unlock_day`）：学完相关天数的课再做对应模块，前面的模块是后面的地基。

  ## 给 AI 下需求的建议

  - 一次只让 AI 写一个模块，把本模块的「设计要点」和「关键代码」贴给它作为约束。
  - 让 AI 写完后，你**自己**对照「代码审查清单」逐条检查，不要只看能不能跑通。
  - 遇到报错先自己读堆栈、定位到函数，再问 AI；面试官问的就是你定位问题的能力。

  ## 做完能得到什么

  - 一个可 `docker compose up` 一键启动的完整项目。
  - 一份面向面试官的架构说明、部署文档和 1 分钟 / 3 分钟项目介绍（见 materials）。
  - 10 道原理复述题 + 一场项目深挖模拟面试，覆盖面试官最常追问的点。

architecture: |
  ## 一、整体架构

  系统分为**接入层、应用层、AI 编排层、数据层、外部服务**五层。核心思路：**FastAPI 只做编排与鉴权，重活（解析、向量化）放后台任务，AI 调用统一走 LLM 网关，数据库查询工具通过 MCP 隔离在独立进程**。

  ```mermaid
  flowchart TB
    subgraph Client["接入层"]
      W["Web 前端 / curl"]
    end
    subgraph App["应用层 FastAPI"]
      AUTH["鉴权与权限依赖"]
      DOC["文档接口"]
      CHAT["对话接口 SSE"]
      MW["请求日志与统一异常"]
    end
    subgraph AI["AI 编排层"]
      ING["入库管道 解析 切片 向量化"]
      RAG["RAG 检索与带引用生成"]
      AG["LangGraph Agent"]
      GW["LLM 网关 超时 重试 计量"]
    end
    subgraph Tools["工具进程"]
      MCP["MCP Server 只读业务库查询"]
    end
    subgraph Data["数据层"]
      PG[("PostgreSQL + pgvector")]
      RD[("Redis 缓存 限流 会话")]
      FS[("文件存储 本地卷或对象存储")]
      BIZ[("业务库 只读账号")]
    end
    LLM["OpenAI 兼容 LLM 与 Embedding API"]

    W --> MW --> AUTH
    AUTH --> DOC
    AUTH --> CHAT
    DOC --> FS
    DOC --> ING
    ING --> GW
    ING --> PG
    CHAT --> AG
    AG --> RAG
    AG --> MCP
    RAG --> PG
    AG --> GW
    GW --> LLM
    MCP --> BIZ
    CHAT --> RD
    AG --> PG
  ```

  ## 二、两条核心数据流

  **离线入库**（上传后异步执行）：上传 → 落盘 → 记录 documents(status=pending) → 后台任务解析 → 切片 → 批量 Embedding → 事务内替换该文档的 chunks → status=ready。

  **在线问答**（一次对话请求）：

  ```mermaid
  sequenceDiagram
    participant U as 用户
    participant API as FastAPI
    participant G as LangGraph Agent
    participant R as RAG 检索
    participant M as MCP 数据库工具
    participant L as LLM API
    participant DB as PostgreSQL
    U->>API: POST 会话消息 带 JWT
    API->>API: 校验 JWT 与会话归属
    API->>G: astream 传入问题 thread_id 用户上下文
    G->>L: 带工具定义调用模型
    L-->>G: 返回 tool_calls 例如 search_knowledge
    G->>R: 执行检索工具
    R->>DB: 向量检索 加权限过滤
    DB-->>R: Top-K 片段
    R-->>G: 带编号的片段
    G->>L: 携带工具结果再次调用
    L-->>G: 也可能再调 query_orders
    G->>M: call_tool 注入部门范围
    M-->>G: 结构化查询结果
    G->>L: 生成最终回答
    L-->>API: 流式 token
    API-->>U: SSE token 事件 sources 事件 done
    API->>DB: 保存消息与引用
  ```

  ## 三、目录结构建议

  ```text
  kb-agent/
  ├── app/
  │   ├── main.py              # 创建 FastAPI、lifespan、中间件、异常处理、路由注册
  │   ├── core/
  │   │   ├── config.py        # pydantic-settings 读取环境变量
  │   │   ├── logging.py       # JSON 日志、request_id 过滤器
  │   │   ├── errors.py        # AppError 与统一异常处理
  │   │   └── security.py      # 密码哈希、JWT、权限依赖
  │   ├── db/
  │   │   ├── session.py       # async engine、SessionLocal、get_session
  │   │   └── models.py        # User/Document/Chunk/Conversation/Message/AuditLog
  │   ├── api/                 # auth.py documents.py chat.py health.py
  │   ├── services/
  │   │   ├── llm.py           # LLM 网关（AsyncOpenAI 封装）
  │   │   ├── ingest.py        # 解析、切片、向量化、入库
  │   │   ├── retrieval.py     # 向量检索与权限过滤
  │   │   ├── rag.py           # Prompt 组装、引用解析
  │   │   └── history.py       # 会话历史（PG + Redis 缓存）
  │   └── agent/
  │       ├── graph.py         # LangGraph 图定义
  │       └── tools.py         # search_knowledge、query_orders 工具
  ├── mcp_server/server.py     # 独立进程的 MCP Server（只读业务库）
  ├── migrations/              # Alembic 迁移
  ├── tests/                   # pytest：单元、接口、异常
  ├── Dockerfile
  ├── docker-compose.yml
  ├── .env.example
  └── pyproject.toml / uv.lock
  ```

  ## 四、核心表结构

  ```mermaid
  erDiagram
    DEPARTMENTS ||--o{ USERS : "包含"
    USERS ||--o{ DOCUMENTS : "上传"
    DOCUMENTS ||--o{ CHUNKS : "切分为"
    USERS ||--o{ CONVERSATIONS : "拥有"
    CONVERSATIONS ||--o{ MESSAGES : "包含"
    USERS ||--o{ AUDIT_LOGS : "产生"
    DEPARTMENTS {
      bigint id PK
      string name
    }
    USERS {
      bigint id PK
      string email UK
      string hashed_password
      string role
      bigint dept_id FK
      int token_version
      bool is_active
    }
    DOCUMENTS {
      bigint id PK
      bigint owner_id FK
      bigint dept_id FK
      string title
      string visibility
      string sha256
      string storage_path
      string status
      string error
      timestamptz created_at
    }
    CHUNKS {
      bigint id PK
      bigint document_id FK
      bigint dept_id
      string visibility
      int chunk_index
      int page
      text content
      vector embedding
    }
    CONVERSATIONS {
      bigint id PK
      bigint user_id FK
      string title
      timestamptz updated_at
    }
    MESSAGES {
      bigint id PK
      bigint conversation_id FK
      string role
      text content
      jsonb citations
      string status
      int prompt_tokens
      int completion_tokens
    }
    AUDIT_LOGS {
      bigint id PK
      bigint user_id FK
      string action
      jsonb detail
      timestamptz created_at
    }
  ```

  **表设计要点**：

  - `chunks` 冗余存 `dept_id`、`visibility`：检索时**权限过滤和向量排序在同一条 SQL 里完成**，不用先查全部再在 Python 里过滤（那样 Top-K 会被过滤掉一大半）。
  - `documents.sha256`：同一用户重复上传同一文件直接返回已有记录，省 Embedding 费用。
  - `documents.status`：`pending → parsing → embedding → ready / failed`，前端轮询或订阅状态；`error` 字段记录失败原因。
  - `messages.citations` 用 jsonb 保存「回答引用了哪些 chunk」，用于审计和效果评估。
  - LangGraph 的 checkpoint 表由 `AsyncPostgresSaver.setup()` 自动创建，与业务表放同一个库但不要手改。

  ## 五、关键技术决策速览

  | 决策 | 选择 | 主要理由 |
  |---|---|---|
  | 向量库 | pgvector | 与业务数据同库，权限过滤用 SQL，事务一致，少一个组件 |
  | Agent 编排 | LangGraph | 显式状态图、可控循环、checkpoint 持久化、可中断 |
  | 工具隔离 | MCP Server | 数据库凭证与查询逻辑隔离在独立进程，可复用给其他 Agent |
  | 流式 | SSE | 单向推送足够，基于 HTTP，穿透代理简单 |
  | 异步任务 | 先 BackgroundTasks，量大换队列 | 起步简单；任务可靠性要求高时换 Redis 队列 |

modules:
  - id: m01
    name: 项目骨架、用户注册登录与基础权限
    unlock_day: 10
    features: [用户注册与登录, 基础权限控制]
    goal: |
      搭起 FastAPI + PostgreSQL 的项目骨架，实现**邮箱注册、密码登录、签发 JWT、按角色拦截接口**的最小闭环。学完本模块你应该能讲清：密码为什么要用慢哈希、JWT 里放什么不放什么、FastAPI 依赖注入如何把「当前用户」传给每个接口。
    design: |
      **1. 密码存储：Argon2 慢哈希（pwdlib）**
      - FastAPI 官方教程当前推荐 `pwdlib[argon2]`（旧教程用的 passlib 已不再推荐）。
      - **为什么要慢哈希**：数据库泄露后，MD5/SHA256 这类快哈希每秒可试数十亿次；Argon2 故意又慢又耗内存，暴力破解成本高几个数量级。
      - 每个密码自带随机盐，相同密码哈希结果也不同。

      **2. 登录凭证：JWT（PyJWT）而不是服务端 Session**
      - JWT 自包含、无状态，多实例部署不需要共享 Session 存储。
      - **代价**：签发后无法直接撤销。本模块先用短有效期（30 分钟）缓解；m10 引入 `token_version` 实现强制下线。
      - payload 只放 `sub`（用户 id，**必须是字符串**，PyJWT 2.10+ 会校验）、`role`、`exp`；**不放密码、手机号等敏感信息**，因为 JWT 只是 Base64 编码，任何人都能解开看。
      - 备选：Session + Redis（可随时撤销，但多一次存储查询）；OAuth2/OIDC 接企业 SSO（企业落地常见，本项目不展开）。

      **3. 防账号枚举与时序侧信道**
      - 用户不存在时也做一次哈希校验（对假哈希），让「用户不存在」和「密码错误」耗时接近、返回同样的错误文案。

      **4. 基础权限：角色 + 资源归属**
      - 注册默认 `viewer`，**部门和角色只能由管理员分配**（不能让用户注册时自己填部门，否则可以自选部门看别人的文档）。
      - `require_roles(...)` 是一个**依赖工厂**：返回一个依赖函数，FastAPI 在进入接口前执行它，不满足就 403。
      - 401 和 403 要分清：**401 = 你是谁我不知道**（未登录/token 无效），**403 = 我知道你是谁，但你没权限**。

      **5. 数据库会话：每个请求一个 AsyncSession**
      - `get_session` 用 `yield` 依赖，请求结束自动关闭，避免连接泄漏。
      - `SessionLocal = async_sessionmaker(engine, expire_on_commit=False)`：异步会话里**不能隐式懒加载**，默认 commit 后对象过期，再读 `user.id` 会报 MissingGreenlet，所以关闭提交后过期。
      - 邮箱唯一性靠**数据库唯一索引**兜底，先查再插只是为了友好提示，并发注册时仍可能撞上唯一约束，要捕获 `IntegrityError` 返回 409。
    data_flow: |
      注册与登录的数据流：

      ```mermaid
      sequenceDiagram
        participant C as 客户端
        participant A as auth 路由
        participant H as pwdlib Argon2
        participant DB as PostgreSQL
        C->>A: POST /auth/register 邮箱 密码
        A->>H: hash 密码
        A->>DB: INSERT users 默认 viewer
        DB-->>A: 新用户 id 或唯一约束冲突
        A-->>C: 201 或 409
        C->>A: POST /auth/login 表单 username password
        A->>DB: 按邮箱查用户
        A->>H: verify 密码与哈希
        A-->>C: 200 access_token 或 401
        C->>A: 任意接口 带 Authorization Bearer
        A->>A: get_current_user 解码 JWT 查用户
        A->>A: require_roles 判断角色
        A-->>C: 业务结果 或 401 或 403
      ```
    key_code: |
      ```python
      # app/core/security.py
      from datetime import datetime, timedelta, timezone
      from typing import Annotated

      import jwt
      from fastapi import Depends, HTTPException, status
      from fastapi.security import OAuth2PasswordBearer
      from jwt.exceptions import InvalidTokenError
      from pwdlib import PasswordHash
      from sqlalchemy.ext.asyncio import AsyncSession

      from app.core.config import settings
      from app.db.models import User
      from app.db.session import get_session

      password_hash = PasswordHash.recommended()          # Argon2
      DUMMY_HASH = password_hash.hash("dummy-password")
      oauth2_scheme = OAuth2PasswordBearer(tokenUrl="/auth/login")
      SessionDep = Annotated[AsyncSession, Depends(get_session)]


      def create_access_token(user: User) -> str:
          expire = datetime.now(timezone.utc) + timedelta(minutes=settings.jwt_expire_minutes)
          payload = {"sub": str(user.id), "role": user.role, "exp": expire}
          return jwt.encode(payload, settings.jwt_secret, algorithm="HS256")


      async def get_current_user(
          token: Annotated[str, Depends(oauth2_scheme)], session: SessionDep
      ) -> User:
          cred_exc = HTTPException(
              status.HTTP_401_UNAUTHORIZED, "认证失败", headers={"WWW-Authenticate": "Bearer"}
          )
          try:
              payload = jwt.decode(token, settings.jwt_secret, algorithms=["HS256"])
              user_id = int(payload["sub"])
          except (InvalidTokenError, KeyError, ValueError):
              raise cred_exc
          user = await session.get(User, user_id)
          if user is None or not user.is_active:
              raise cred_exc
          return user


      CurrentUser = Annotated[User, Depends(get_current_user)]


      def require_roles(*roles: str):
          async def checker(user: CurrentUser) -> User:
              if user.role not in roles:
                  raise HTTPException(status.HTTP_403_FORBIDDEN, "权限不足")
              return user
          return checker
      ```

      ```python
      # app/api/auth.py
      from typing import Annotated

      from fastapi import APIRouter, Depends, HTTPException, status
      from fastapi.security import OAuth2PasswordRequestForm
      from pydantic import BaseModel, EmailStr, Field
      from sqlalchemy import select
      from sqlalchemy.exc import IntegrityError

      from app.core.security import (
          DUMMY_HASH, SessionDep, create_access_token, password_hash,
      )
      from app.db.models import User

      router = APIRouter(prefix="/auth", tags=["auth"])


      class RegisterIn(BaseModel):
          email: EmailStr                      # 需要安装 pydantic[email]
          password: str = Field(min_length=8, max_length=128)


      @router.post("/register", status_code=status.HTTP_201_CREATED)
      async def register(body: RegisterIn, session: SessionDep) -> dict:
          user = User(email=body.email, hashed_password=password_hash.hash(body.password), role="viewer")
          session.add(user)
          try:
              await session.commit()
          except IntegrityError:
              await session.rollback()
              raise HTTPException(status.HTTP_409_CONFLICT, "邮箱已注册")
          return {"id": user.id, "email": user.email}


      @router.post("/login")
      async def login(
          form: Annotated[OAuth2PasswordRequestForm, Depends()], session: SessionDep
      ) -> dict:
          user = await session.scalar(select(User).where(User.email == form.username))
          if user is None:
              password_hash.verify(form.password, DUMMY_HASH)
              raise HTTPException(status.HTTP_401_UNAUTHORIZED, "邮箱或密码错误")
          if not password_hash.verify(form.password, user.hashed_password):
              raise HTTPException(status.HTTP_401_UNAUTHORIZED, "邮箱或密码错误")
          return {"access_token": create_access_token(user), "token_type": "bearer"}
      ```

      **读代码时重点看什么**
      - `get_current_user` 依赖了 `oauth2_scheme` 和 `get_session`，**依赖可以嵌套**：FastAPI 先解析子依赖，再调用父依赖。
      - `require_roles` 返回的是**函数**，用法是 `Depends(require_roles("admin"))`；想清楚为什么不能直接写 `Depends(require_roles)`。
      - `jwt.decode` 必须传 `algorithms=[...]`，否则可能被「alg 混淆攻击」利用；`exp` 过期会抛 `ExpiredSignatureError`（是 `InvalidTokenError` 的子类）。
      - 登录接口用 `OAuth2PasswordRequestForm`，所以请求体是**表单**而不是 JSON，字段名固定叫 `username`。
      - 注册没有让用户填 `role`/`dept_id`，这是有意的权限设计。
    tests:
      functional:
        - "注册新邮箱成功，数据库 users 表里 hashed_password 以 $argon2id$ 开头，不是明文"
        - "用正确密码登录拿到 access_token，到 jwt.io 解码能看到 sub、role、exp 三个字段，没有密码或邮箱"
        - "带 token 访问 /users/me 返回当前用户信息；不带 token 返回 401"
        - "viewer 访问仅 admin 可用的 /admin/users 返回 403；管理员把其角色改为 admin 并重新登录后返回 200"
      api:
        - |-
          curl -i -X POST http://localhost:8000/auth/register -H 'Content-Type: application/json' -d '{"email":"a@corp.com","password":"Passw0rd!"}'  期望 201；再执行一次期望 409
        - |-
          curl -i -X POST http://localhost:8000/auth/login -d 'username=a@corp.com&password=Passw0rd!'  期望 200，响应含 access_token 和 token_type=bearer
        - |-
          curl -i -X POST http://localhost:8000/auth/login -d 'username=a@corp.com&password=wrong'  期望 401，文案与「用户不存在」时完全相同
        - |-
          curl -i http://localhost:8000/users/me -H 'Authorization: Bearer <token>'  期望 200；把 token 最后一个字符改掉期望 401
      exception:
        - "密码少于 8 位或邮箱格式错误：期望 422，且响应里不回显密码"
        - "token 过期（把 jwt_expire_minutes 临时改成 0 再请求）：期望 401 而不是 500"
        - "伪造 token：把 payload 的 role 改成 admin 后重新 Base64 拼接，签名校验失败，期望 401"
        - "并发注册同一邮箱 10 次（用 asyncio.gather 或 ab 工具）：只有 1 次 201，其余 409，没有 500"
        - "数据库停掉时调用登录：期望统一错误格式的 503/500，日志里有异常堆栈，响应里没有数据库连接串"
      review:
        - "SECRET 是否从环境变量读取、长度足够（openssl rand -hex 32），代码和 Git 仓库里没有硬编码"
        - "jwt.decode 是否显式指定 algorithms，是否处理了过期与签名错误"
        - "注册接口是否禁止客户端指定 role、dept_id 等权限字段"
        - "登录失败的错误文案和耗时是否不区分「用户不存在」与「密码错误」"
        - "邮箱唯一性是否有数据库唯一索引兜底，而不是只靠先查后插"
    retell:
      id: proj-m01-retell
      type: oral
      category: python_backend
      difficulty: 3
      question: 请复述你项目里「注册 → 登录 → 带 token 访问受保护接口」的完整原理：密码怎么存、JWT 里有什么、FastAPI 如何在每个接口拿到当前用户并做角色校验？
      key_points:
        - {text: "说明密码用 Argon2 等慢哈希加盐存储，并解释为什么不能用 MD5/SHA256 这类快哈希", dim: principle}
        - {text: "说明 JWT 由 header.payload.signature 组成，payload 只是编码不是加密，所以不能放敏感信息", dim: concept}
        - {text: "说明 get_current_user 依赖解码校验 JWT 并查库确认用户仍有效，require_roles 是依赖工厂", dim: principle}
        - {text: "区分 401（身份无效）与 403（身份有效但无权限）", dim: concept}
        - {text: "指出 JWT 无法直接撤销及缓解方案（短有效期、token_version 或黑名单）", dim: engineering}
        - {text: "提到注册时不允许用户自选角色和部门，防止越权", dim: project}
      reference: |
        **密码存储**：注册时用 pwdlib 的 Argon2 对密码做慢哈希，每个哈希自带随机盐。数据库泄露时，攻击者拿到的只是哈希；Argon2 故意又慢又耗内存，暴力破解成本比 SHA256 高几个数量级，而快哈希每秒能试数十亿次，等于没保护。

        **登录**：用户提交表单（OAuth2PasswordRequestForm，字段叫 username/password），后端按邮箱查用户，用 verify 比对哈希。用户不存在时也对一个假哈希做一次 verify，让两种失败的耗时和文案一致，防止账号枚举。验证通过后签发 JWT：payload 里只有 sub（用户 id 字符串）、role 和 exp，用服务端密钥 HS256 签名。JWT 的 payload 只是 Base64 编码，任何人都能解开，所以不能放密码、手机号。

        **访问受保护接口**：客户端在 Authorization 头带 Bearer token。get_current_user 是一个 FastAPI 依赖，它又依赖 oauth2_scheme（从头里取 token）和 get_session（拿数据库会话）。它先校验签名和过期时间，再用 sub 查库，确认用户存在且未禁用——这一步保证被禁用的账号即使 token 没过期也进不来。require_roles 是依赖工厂，返回一个检查角色的依赖，角色不符返回 403；token 无效返回 401。

        **权衡**：JWT 无状态、多实例不用共享 Session，但签发后无法直接撤销，所以有效期设 30 分钟，后续用 users.token_version 实现强制下线。另外注册接口不接收 role 和 dept_id，部门和角色只能由管理员分配，否则用户能自选部门看到别的部门的文档。
      oral: |
        我项目里的鉴权分三步。第一，密码用 Argon2 慢哈希加盐存储，数据库泄露也很难暴力破解。第二，登录成功后签发 JWT，payload 只放用户 id、角色和过期时间，因为 JWT 只是编码不是加密。第三，每个受保护接口都依赖 get_current_user，它校验签名和过期，再查库确认用户没被禁用；需要角色的接口再叠一层 require_roles 依赖工厂，身份无效回 401，没权限回 403。JWT 的短板是不能撤销，我用 30 分钟短有效期加 token_version 来做强制下线。另外注册时不允许用户自己填部门和角色，这是防越权的第一道关。
      followup:
        question: 如果要支持「管理员禁用某个员工后立即失效」，在不引入 Session 的情况下怎么做？
        key_points: [users 表加 token_version 并写入 JWT, get_current_user 比对版本不一致即 401, 也可用 Redis 黑名单记录 jti 直到过期]
        reference: 在 users 表加 token_version，签发 JWT 时写入 ver 字段；禁用或改密码时把 token_version 加 1。get_current_user 本来就会查库，顺便比对 payload 的 ver 与库里是否一致，不一致直接 401。若想避免每次查库，可把用户状态缓存到 Redis 并在禁用时删除缓存，或用 Redis 黑名单记录 jti 直到 token 自然过期。

  - id: m02
    name: LLM 网关、统一错误处理与日志
    unlock_day: 20
    features: [错误处理, 日志记录]
    goal: |
      把所有大模型调用收口到一个**LLM 网关**（超时、重试、错误分类、Token 计量），并建立全局的**统一错误格式**和**带 request_id 的结构化日志**。学完你应该能讲清：外部 API 失败有哪几类、哪些该重试、日志怎么串起一次请求的全链路。
    design: |
      **1. 为什么要 LLM 网关，而不是在业务代码里直接调 SDK**
      - 超时、重试、限流、计费、切换模型提供商这些横切关注点**只写一次**。
      - 业务代码只关心「给消息、拿结果」；换成 DeepSeek / 本地 vLLM 只需改 `base_url` 和模型名（它们兼容 OpenAI Chat Completions 协议）。

      **2. 超时与重试**
      - OpenAI Python SDK（当前 3.x）**默认超时 10 分钟、默认重试 2 次**（对连接错误、408、409、429、5xx 自动指数退避重试）。10 分钟对在线接口太长，必须显式设置 `timeout`。
      - **流式响应在消费过程中不会自动重试**（SDK 文档明确说明，因为重放会导致重复输出），流式中途断开要业务层自己处理。
      - 400（参数错误）、401（密钥错误）**不要重试**，重试一万次也是错。

      **3. 错误分类与映射**
      - SDK 异常层级：`APIError` ← `APIConnectionError` ← `APITimeoutError`；`APIStatusError` ← `RateLimitError`(429) / `BadRequestError`(400) / `InternalServerError`(5xx) 等。
      - **捕获顺序**：子类在前。`APITimeoutError` 是 `APIConnectionError` 的子类，写反了超时永远被当成连接错误。
      - 统一映射成业务异常 `AppError(code, message, status, retryable)`，对外返回固定格式：`{"error": {"code", "message", "request_id"}}`。**对外不暴露堆栈、SQL、密钥**，对内日志记录完整堆栈。

      **4. 结构化日志 + request_id**
      - 中间件为每个请求生成或透传 `X-Request-ID`，放进 `ContextVar`；日志 Filter 自动把它注入每条日志。
      - **为什么用 ContextVar 而不是全局变量**：asyncio 下多个请求在同一线程交替执行，全局变量会串号；ContextVar 每个任务有独立副本。
      - 每次 LLM 调用记录：模型名、耗时、prompt/completion tokens、是否重试、错误码——这是后面做成本统计和故障排查的基础。
      - 备选：structlog / OpenTelemetry（生产推荐接入 trace），本项目先用标准库 logging + JSON 格式化。
    data_flow: |
      ```mermaid
      flowchart LR
        A["请求进入"] --> B["中间件 生成 request_id 写入 ContextVar"]
        B --> C["路由与业务"]
        C --> D["LLM 网关 chat"]
        D -->|"成功"| E["记录耗时与 tokens"]
        D -->|"超时 429 5xx"| F["SDK 自动重试 最多 2 次"]
        F -->|"仍失败"| G["映射为 AppError retryable"]
        D -->|"400 401"| H["映射为 AppError 不重试"]
        G --> I["全局异常处理器"]
        H --> I
        C -->|"未知异常"| J["兜底处理器 记录堆栈 返回 500"]
        I --> K["统一错误 JSON 带 request_id"]
        J --> K
        E --> L["正常响应 头部带 X-Request-ID"]
      ```
    key_code: |
      ```python
      # app/core/errors.py + app/core/logging.py（节选）
      import logging
      import time
      import uuid
      from contextvars import ContextVar

      from fastapi import FastAPI, Request
      from fastapi.responses import JSONResponse

      request_id_var: ContextVar[str] = ContextVar("request_id", default="-")
      logger = logging.getLogger("app")


      class RequestIdFilter(logging.Filter):
          def filter(self, record: logging.LogRecord) -> bool:
              record.request_id = request_id_var.get()
              return True


      class AppError(Exception):
          def __init__(self, code: str, message: str, status: int = 400, retryable: bool = False):
              super().__init__(message)
              self.code, self.message, self.status, self.retryable = code, message, status, retryable


      def install(app: FastAPI) -> None:
          @app.middleware("http")
          async def request_context(request: Request, call_next):
              rid = request.headers.get("X-Request-ID") or uuid.uuid4().hex
              token = request_id_var.set(rid)
              start = time.perf_counter()
              try:
                  response = await call_next(request)
                  response.headers["X-Request-ID"] = rid
                  logger.info("access", extra={"path": request.url.path, "status": response.status_code,
                                               "ms": round((time.perf_counter() - start) * 1000)})
                  return response
              finally:
                  request_id_var.reset(token)

          @app.exception_handler(AppError)
          async def app_error_handler(request: Request, exc: AppError) -> JSONResponse:
              logger.warning("app_error", extra={"code": exc.code})
              return JSONResponse(status_code=exc.status, content={"error": {
                  "code": exc.code, "message": exc.message, "request_id": request_id_var.get()}})

          @app.exception_handler(Exception)
          async def unhandled(request: Request, exc: Exception) -> JSONResponse:
              logger.exception("unhandled_error")
              return JSONResponse(status_code=500, content={"error": {
                  "code": "INTERNAL", "message": "服务内部错误", "request_id": request_id_var.get()}})
      ```

      ```python
      # app/services/llm.py
      import logging
      import time

      import openai
      from openai import AsyncOpenAI

      from app.core.config import settings
      from app.core.errors import AppError

      logger = logging.getLogger("app.llm")
      client = AsyncOpenAI(
          base_url=settings.llm_base_url,       # 兼容 OpenAI 协议的任意服务
          api_key=settings.llm_api_key,
          timeout=30.0,                          # SDK 默认 10 分钟，在线接口必须改小
          max_retries=2,
      )


      async def chat(messages: list[dict], **kwargs) -> str:
          start = time.perf_counter()
          try:
              resp = await client.chat.completions.create(
                  model=settings.llm_model, messages=messages, **kwargs
              )
          except openai.APITimeoutError as e:          # 必须写在 APIConnectionError 之前
              raise AppError("LLM_TIMEOUT", "模型响应超时，请稍后重试", 504, retryable=True) from e
          except openai.APIConnectionError as e:
              raise AppError("LLM_UNAVAILABLE", "模型服务暂不可用", 502, retryable=True) from e
          except openai.RateLimitError as e:
              raise AppError("LLM_RATE_LIMITED", "请求过多，请稍后再试", 429, retryable=True) from e
          except openai.APIStatusError as e:
              logger.error("llm_status_error", extra={"status": e.status_code})
              raise AppError("LLM_ERROR", "模型调用失败", 502) from e
          finally:
              logger.info("llm_call", extra={"model": settings.llm_model,
                                             "ms": round((time.perf_counter() - start) * 1000)})
          usage = resp.usage
          if usage:
              logger.info("llm_usage", extra={"prompt_tokens": usage.prompt_tokens,
                                              "completion_tokens": usage.completion_tokens})
          return resp.choices[0].message.content or ""
      ```

      **读代码时重点看什么**
      - 中间件里 `try/finally` 保证 `request_id_var.reset` 一定执行；`set` 返回的 token 用于精确还原。
      - `except` 的顺序：`APITimeoutError` → `APIConnectionError` → `RateLimitError` → `APIStatusError`，子类在前。
      - `raise ... from e` 保留原始异常链，日志里能看到根因。
      - `finally` 里的耗时日志在成功和失败时都会打，失败时 SDK 已经内部重试过，所以耗时可能是 timeout 的 3 倍——想一想对用户体验意味着什么。
      - `message.content or ""`：模型返回工具调用时 content 可能是 None。
    tests:
      functional:
        - "任意接口的响应头都带 X-Request-ID；请求时自带 X-Request-ID: test-123，响应和日志里都是 test-123"
        - "调用一次问答后，日志里能按 request_id 搜到 access、llm_call、llm_usage 三条记录"
        - "所有业务错误响应都符合 {error: {code, message, request_id}} 格式"
      api:
        - |-
          curl -i http://localhost:8000/healthz -H 'X-Request-ID: test-123'  期望 200，响应头 X-Request-ID: test-123
        - |-
          LLM_API_KEY 改成错误值后 curl -i -X POST http://localhost:8000/chat/ask -H 'Authorization: Bearer <token>' -H 'Content-Type: application/json' -d '{"question":"你好"}'  期望 502，code=LLM_ERROR，响应里不含密钥
        - |-
          LLM_BASE_URL 指向一个不监听的端口后重复上面的请求  期望 502，code=LLM_UNAVAILABLE
      exception:
        - "模拟超时：LLM_BASE_URL 指向一个只接受连接不返回的 mock 服务，timeout 设 2 秒，期望约 6 秒（含 2 次重试）后返回 504 LLM_TIMEOUT"
        - "模拟 429：mock 服务返回 429，确认日志里能看到重试，最终返回 429 LLM_RATE_LIMITED"
        - "业务代码里故意 raise ValueError：期望 500 INTERNAL，响应里没有堆栈，日志里有完整堆栈和 request_id"
        - "并发 50 个请求：抽查日志，每条日志的 request_id 与其所属请求一致，没有串号"
      review:
        - "是否显式设置了 timeout，而不是依赖 SDK 默认的 10 分钟"
        - "异常捕获顺序是否子类在前；是否对 400/401 做了不重试处理"
        - "对外错误信息是否脱敏（无堆栈、SQL、密钥、内部地址）"
        - "日志是否记录了模型名、耗时、tokens，且没有记录完整 Prompt 中的用户隐私数据"
        - "是否用 ContextVar 而不是全局变量保存 request_id"
    retell:
      id: proj-m02-retell
      type: oral
      category: engineering
      difficulty: 3
      question: 你项目里的大模型调用失败了会怎样？请讲清 LLM 网关的超时、重试、错误分类设计，以及线上出问题时你怎么通过日志定位到具体是哪次调用。
      key_points:
        - {text: "说明所有 LLM 调用收口到网关，统一处理超时、重试、计量和提供商切换", dim: engineering}
        - {text: "说明 SDK 默认超时 10 分钟、默认重试 2 次，必须显式设置较短超时", dim: principle}
        - {text: "区分可重试错误（超时、连接、429、5xx）与不可重试错误（400、401），并说明流式中途失败不会自动重试", dim: principle}
        - {text: "说明异常映射为统一业务错误格式，对外脱敏、对内记录完整堆栈", dim: engineering}
        - {text: "说明 request_id 经中间件写入 ContextVar 并注入每条日志，用来串联一次请求", dim: project}
      reference: |
        我把所有大模型调用都收口到一个 LLM 网关模块，业务代码只调用 chat(messages)。这样超时、重试、Token 计量、切换提供商只写一次；换成兼容 OpenAI 协议的 DeepSeek 或本地 vLLM，只改 base_url 和模型名。

        **超时与重试**：OpenAI Python SDK 默认超时是 10 分钟、默认重试 2 次，会对连接错误、408、409、429 和 5xx 做指数退避重试。10 分钟对在线接口不可接受，所以我把 timeout 设为 30 秒。要注意最坏情况下用户等待时间约等于超时乘以（重试次数 + 1），所以超时和重试要一起算。400 参数错误、401 密钥错误重试没有意义；流式响应在消费过程中断开，SDK 不会自动重试，因为重放会导致重复输出，需要业务层给前端发 error 事件。

        **错误分类**：SDK 的异常层级里 APITimeoutError 是 APIConnectionError 的子类，所以 except 顺序必须子类在前。我把它们映射为 AppError（code、message、status、retryable），例如 LLM_TIMEOUT 对应 504、LLM_RATE_LIMITED 对应 429。全局异常处理器把 AppError 转成固定格式的 JSON；未知异常走兜底处理器，返回 500 和通用文案，对外不暴露堆栈和密钥，对内用 logger.exception 记录完整堆栈。

        **定位问题**：中间件为每个请求生成或透传 X-Request-ID，写进 ContextVar，日志 Filter 自动注入每条日志。用户报错时把响应里的 request_id 给我，我按它搜日志，就能看到 access 日志、每次 llm_call 的耗时和 tokens、以及异常堆栈。用 ContextVar 而不是全局变量，是因为 asyncio 下多个请求在同一线程交替执行，全局变量会串号。
      oral: |
        我把所有大模型调用都收到一个 LLM 网关里。首先是超时：SDK 默认 10 分钟，我改成 30 秒，同时清楚最坏等待时间是超时乘以重试次数加一。然后是错误分类：超时、连接失败、429、5xx 可以重试，400、401 不重试；流式中途断开 SDK 不会重试，我会给前端发 error 事件。所有异常映射成统一的 AppError 格式，对外脱敏，对内记完整堆栈。排查时靠 request_id：中间件把它放进 ContextVar 并注入每条日志，用户给我一个 request_id，我就能串起这次请求的接口日志、模型耗时、Token 和堆栈。
