day: 10
phase: 1
title: 数据库：SQL、PostgreSQL、索引、事务与 ORM
goals:
  - 能解释 B-Tree 索引为什么能加速查询、复合索引的列顺序如何影响使用，并用 EXPLAIN ANALYZE 验证
  - 能说清 ACID、PostgreSQL 的默认隔离级别与 MVCC，并用条件更新或行锁解决并发扣减问题
  - 能读懂 SQLAlchemy 2.x 的 Mapped / select() / AsyncSession 写法，识别并修复 N+1 查询
  - 能完整讲述一个请求从进入 FastAPI 到写库再返回的全过程，并据此排查接口报错与变慢（第一阶段综合）
knowledge_points:
  - id: d10-k1
    name: SQL 与 PostgreSQL 基础
    level: P1
    summary: 关系型数据库用表、主外键和约束保证数据正确；PostgreSQL 因 JSONB、扩展生态（如 pgvector）成为 AI 后端的首选
    why: |
      AI 应用的「业务数据」——用户、对话、消息、知识库、文档、计费、权限——全部存放在关系型数据库中；后面的 RAG 课程还会用 pgvector 把向量也存进 PostgreSQL（Day 25）。
      学员有接口集成经验，但对 SQL 执行、约束、参数化查询理解不深，而 AI 工具生成的 SQL 和 ORM 代码常常存在性能与安全问题，必须能读懂、能审查。
    problem: |
      解决「**如何可靠地存储和查询结构化数据**」的问题：多个请求同时读写时数据不能错、不能丢；数据之间的关系（对话属于用户、消息属于对话）要能被约束和高效查询；同时防止 SQL 注入这类安全问题。
    principle: |
      **一、关系模型的核心概念**

      - **表（table）**：一类实体，如 `conversations`；**行**是一条记录，**列**是一个属性。
      - **主键（PK）**：唯一标识一行，如 `id BIGINT` 或 `UUID`。
      - **外键（FK）**：引用另一张表的主键，如 `messages.conversation_id → conversations.id`，数据库保证不会出现「孤儿消息」。
      - **约束**：`NOT NULL`、`UNIQUE`、`CHECK (remaining >= 0)`。**约束是最后一道防线**，应用代码有 bug 时数据库仍能拒绝错误数据（Day 08 的幂等键就依赖 UNIQUE）。

      ```mermaid
      erDiagram
        USERS ||--o{ CONVERSATIONS : "拥有"
        CONVERSATIONS ||--o{ MESSAGES : "包含"
        USERS ||--|| USER_QUOTAS : "配额"
        USERS {
          bigint id PK
          text email
        }
        CONVERSATIONS {
          bigint id PK
          bigint user_id FK
          text title
          timestamptz updated_at
        }
        MESSAGES {
          bigint id PK
          bigint conversation_id FK
          text role
          text content
          timestamptz created_at
        }
        USER_QUOTAS {
          bigint user_id PK
          int remaining
        }
      ```

      **二、一条 SELECT 的逻辑执行顺序**

      书写顺序是 `SELECT ... FROM ... WHERE ... GROUP BY ... HAVING ... ORDER BY ... LIMIT`，但逻辑上的执行顺序是：**FROM / JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT**。所以 WHERE 里不能使用 SELECT 中定义的别名，而 ORDER BY 可以。

      **三、PostgreSQL 的特点（为什么 AI 后端常选它）**

      - **MVCC 多版本并发控制**：读不阻塞写、写不阻塞读（事务部分详解）。
      - **丰富类型**：`JSONB`（存模型返回的结构化数据、工具调用参数）、数组、`timestamptz`、`UUID`。
      - **扩展生态**：`pgvector` 存储与检索向量（Day 25）、`pg_trgm` 模糊匹配、全文检索，一个数据库同时支撑业务数据和检索。
      - **版本**：截至 2026-11，**PostgreSQL 18 是当前稳定大版本**（2025-09 发布），引入了异步 I/O、B-Tree skip scan、`uuidv7()` 等；PostgreSQL 19 处于发布候选阶段，官方计划 2026-11-19 正式发布；PostgreSQL 14 于 2026-11-12 停止支持。

      **四、参数化查询：防 SQL 注入的唯一正确方式**

      ```python
      # 错误：字符串拼接，title 为 x' OR '1'='1 时可以读出全部数据
      sql = f"SELECT * FROM conversations WHERE title = '{title}'"

      # 正确：参数化，数据库驱动把值作为数据而不是 SQL 语法传递
      await session.execute(text("SELECT * FROM conversations WHERE title = :t"), {"t": title})
      ```

      AI 场景的额外风险：**Text-to-SQL**（让 LLM 生成 SQL）时，模型可能被 Prompt Injection 诱导生成 `DROP TABLE` 或越权查询。必须使用只读账号、限制可访问的表和视图、设置语句超时，并在执行前做白名单校验（Day 40、Day 47）。
    scenarios: |
      - **对话系统数据模型**：users、conversations、messages、user_quotas 四张表，外键约束保证引用正确，`CHECK (remaining >= 0)` 防止配额被扣成负数。
      - **存储模型输出**：把结构化输出和工具调用参数存进 JSONB 列，便于后续分析和回放。
      - **RAG 元数据**：文档表存版本、部门、权限标签，检索时作为过滤条件（Day 27、Day 30）。
    code: |
      ```sql
      CREATE TABLE conversations (
          id          BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          user_id     BIGINT NOT NULL REFERENCES users(id),
          title       TEXT NOT NULL DEFAULT '新对话',
          updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      CREATE TABLE messages (
          id               BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
          conversation_id  BIGINT NOT NULL REFERENCES conversations(id) ON DELETE CASCADE,
          role             TEXT NOT NULL CHECK (role IN ('user', 'assistant', 'tool')),
          content          TEXT NOT NULL,
          meta             JSONB,                      -- 模型名、Token 用量、工具调用等
          created_at       TIMESTAMPTZ NOT NULL DEFAULT now()
      );

      CREATE TABLE user_quotas (
          user_id    BIGINT PRIMARY KEY REFERENCES users(id),
          remaining  INT NOT NULL CHECK (remaining >= 0)
      );
      ```
    pitfalls: |
      - **用字符串拼接 SQL**：哪怕「只是内部接口」，也可能被注入；ORM 的 `text()` 同样要用绑定参数。
      - **不加外键和约束，完全依赖应用代码**：并发或 bug 时出现孤儿数据、负数配额，事后很难修复。
      - **时间用 `timestamp` 不带时区**：多时区部署时数据混乱，推荐 `timestamptz`。
      - **误区：用了 ORM 就不用懂 SQL。** 性能问题和锁问题最终都要看 ORM 生成的 SQL 才能定位。
      - **让 LLM 生成的 SQL 直接用高权限账号执行**：极易造成数据泄露或破坏。
    interview_asks:
      - 为什么 AI 应用后端常选 PostgreSQL？
      - 什么是 SQL 注入？如何防范？Text-to-SQL 场景要额外注意什么？
      - SELECT 语句的逻辑执行顺序是怎样的？
    freshness: |
      核对于 2026-11：PostgreSQL 18 为当前稳定大版本（首发 2025-09-25，支持至 2030-11），2026-11 发布了 18.7 小版本更新；PostgreSQL 19 已发布 RC 版本，官方计划 2026-11-19 正式发布（发布前功能可能仍有变动，以官方公告为准）；PostgreSQL 14 于 2026-11-12 结束支持。PostgreSQL 18 新增：异步 I/O 子系统（`io_method`）、多列 B-Tree 索引 skip scan、`uuidv7()`、虚拟生成列成为生成列默认方式、RETURNING 支持 OLD/NEW。
    sources:
      - {title: "PostgreSQL - Versioning Policy", url: "https://www.postgresql.org/support/versioning/"}
      - {title: "PostgreSQL 18 Release Notes", url: "https://www.postgresql.org/docs/current/release-18.html"}
      - {title: "PostgreSQL 19 RC 1 Released", url: "https://www.postgresql.org/about/news/postgresql-19-rc-1-released-3409/"}
    project_example: |
      一个内部知识助手提供「按标题搜索对话」功能，最初的实现是 `f"SELECT ... WHERE user_id = {uid} AND title LIKE '%{kw}%'"`。
      安全测试中，关键词输入 `%' OR '1'='1' --` 就返回了所有用户的对话。修复为参数化查询并加上 `user_id` 绑定参数；同时给 messages 表加上外键和 `role` 的 CHECK 约束，在后续一次代码 bug 中，数据库直接拒绝了非法的 role 写入，避免了脏数据进入训练评估集。
  - id: d10-k2
    name: 索引与 B-Tree
    level: P0
    summary: 索引是一棵按键排好序的 B-Tree，把全表扫描变成几次树查找；复合索引讲究列顺序，每个索引都有写入和存储成本
    why: |
      AI 应用的数据增长很快：消息表、调用日志、文档切片表动辄千万行。没有合适的索引，「加载最近 20 条对话历史」这样简单的查询都会从毫秒级退化到秒级，并在高并发下拖垮数据库。
      「索引原理」「为什么索引没生效」「联合索引怎么建」是后端面试的高频题，也是线上慢查询排查的第一步。
    problem: |
      解决「**如何在大量数据中快速定位少量行**」的问题。
      没有索引时，数据库只能逐行扫描整张表（Seq Scan），时间与表大小成正比；有了索引，查找时间与数据量的对数成正比，百万行和千万行的差别只是多一两层树。
    principle: |
      **一、B-Tree 的结构**

      PostgreSQL 默认的索引类型是 B-Tree（`CREATE INDEX` 不指定类型时就是它）。可以把它想象成一本书末尾的「按字母排序的索引页」，只是分了多层：

      ```mermaid
      flowchart TD
        R["根节点 分隔键 1000 与 2000"] --> A["内部节点 小于 1000"]
        R --> B["内部节点 1000 到 2000"]
        R --> C["内部节点 大于 2000"]
        B --> L1["叶子页 1000 到 1099 每项为 键值加行位置"]
        B --> L2["叶子页 1100 到 1199"]
        L1 <--> L2
        L1 --> H["表数据页 heap 根据行位置取出整行"]
      ```

      - **内部节点**存分隔键，指向下一层；**叶子节点**存「索引键 + 行位置（TID）」，并且叶子之间双向链接。
      - **等值查找**：从根往下走几层就到叶子，通常 3~4 层就能覆盖上亿行。
      - **范围查询与排序**：找到起点后沿叶子链表顺序读取，所以 `ORDER BY created_at DESC LIMIT 20` 可以直接按索引顺序取前 20 条，不需要排序整个结果。
      - 找到行位置后还要回到**表数据（heap）**取整行；如果查询需要的列都在索引里，可能走 **Index Only Scan**，省去回表。

      **二、复合索引与列顺序**

      索引 `(user_id, created_at)` 先按 user_id 排序，user_id 相同的再按 created_at 排序：

      - `WHERE user_id = 42 ORDER BY created_at DESC LIMIT 20`：**最佳**，定位到 user_id=42 的区间后按时间倒序读 20 条即停。
      - `WHERE user_id = 42`：可用（最左前缀）。
      - `WHERE created_at > '2026-11-01'`（没有 user_id 条件）：传统上**无法高效使用**这个索引。PostgreSQL 18 引入 **skip scan**，在首列不同值较少时可以「跳着」使用多列索引，但首列基数高（如用户 ID）时收益很小，不能依赖。
      - 经验法则：**等值条件的列放前面，范围或排序的列放后面**。

      **三、索引什么时候不生效**

      - **对列做函数或类型转换**：`WHERE lower(email) = ...`、`WHERE created_at::date = ...`，普通索引用不上（可建表达式索引）。
      - **前导通配符模糊查询**：`LIKE '%退款%'` 无法使用 B-Tree（需要 `pg_trgm` 的 GIN 索引或全文检索）。
      - **选择性太低**：`WHERE status = 'active'` 而 95% 的行都是 active，优化器会判断全表扫描更便宜。
      - **统计信息过期**：大量导入后没有 ANALYZE，优化器估算错误。

      **四、用 EXPLAIN ANALYZE 验证**

      ```sql
      EXPLAIN (ANALYZE, BUFFERS)
      SELECT id, content FROM messages
      WHERE conversation_id = 42 ORDER BY created_at DESC LIMIT 20;
      ```

      关注：节点类型（`Seq Scan` 全表扫描 / `Index Scan` / `Bitmap Heap Scan`）、`rows` 估算与实际是否差距巨大、`actual time`、`Buffers` 读取量。**不要凭感觉加索引，要看执行计划。** 注意 `ANALYZE` 会真正执行语句，对 UPDATE/DELETE 要放在事务里执行后回滚。

      **五、索引的代价**

      - **写放大**：每次 INSERT/UPDATE/DELETE 都要同步维护所有相关索引，索引越多写入越慢。
      - **存储与内存**：索引占磁盘和缓存，挤占热数据空间。
      - **线上建索引会锁表**：普通 `CREATE INDEX` 会阻塞写入，生产环境大表用 `CREATE INDEX CONCURRENTLY`（更慢但不阻塞写，不能在事务块中执行）。

      **六、其他索引类型（了解）**

      GIN（JSONB、数组、全文检索、pg_trgm）、BRIN（按时间追加的超大日志表）、pgvector 的 HNSW / IVFFlat（向量近似检索，Day 25）。
    scenarios: |
      - **加载对话历史**：`messages(conversation_id, created_at)` 复合索引，取最近 N 条消息毫秒级返回。
      - **对话列表**：`conversations(user_id, updated_at DESC)`，按最近活跃排序分页。
      - **幂等键去重**：`UNIQUE (user_id, idempotency_key)` 既是约束也是索引（Day 08）。
      - **文档元数据过滤**：`documents(kb_id, status)` 加速「某知识库中已入库的文档」查询。
    code: |
      ```sql
      -- 对话历史：等值列在前，排序列在后
      CREATE INDEX CONCURRENTLY idx_messages_conv_created
          ON messages (conversation_id, created_at DESC);

      -- 对话列表
      CREATE INDEX CONCURRENTLY idx_conversations_user_updated
          ON conversations (user_id, updated_at DESC);

      -- 不区分大小写查邮箱：表达式索引，查询必须使用同样的表达式
      CREATE UNIQUE INDEX idx_users_email_lower ON users (lower(email));

      -- 验证执行计划
      EXPLAIN (ANALYZE, BUFFERS)
      SELECT id, role, content FROM messages
      WHERE conversation_id = 42
      ORDER BY created_at DESC
      LIMIT 20;
      ```
    pitfalls: |
      - **误区：索引越多越好。** 每个索引都会拖慢写入，消息表这类写多的表尤其要克制；定期检查未使用的索引（`pg_stat_user_indexes` 中扫描次数为 0）。
      - **误区：建了索引查询就一定走索引。** 函数包裹列、类型不一致、前导通配符、低选择性都会让索引失效，要用 EXPLAIN 确认。
      - **复合索引列顺序随意**：`(created_at, user_id)` 对「某用户最近的消息」几乎没有帮助。
      - **生产大表直接 CREATE INDEX**：会阻塞写入数分钟甚至更久，应使用 CONCURRENTLY 并在低峰期执行。
      - **混淆：主键自带索引，外键不会自动建索引。** PostgreSQL 不会为外键列自动创建索引，`messages.conversation_id` 需要手动建（否则按对话查询和级联删除都会很慢）。
    interview_asks:
      - 索引为什么能加快查询？B-Tree 是怎么组织的？
      - 联合索引 (a, b) 在哪些查询中能用上？为什么要把等值列放在前面？
      - 你遇到过索引不生效的情况吗？怎么排查？
      - 索引有什么代价？
    freshness: |
      核对于 2026-11：PostgreSQL 18 新增多列 B-Tree 索引的 skip scan，使首列没有等值条件时也可能使用多列索引，但效果取决于被跳过列的不同值数量；该特性仅适用于 B-Tree。PostgreSQL 18 同时新增 `uuidv7()`（时间有序 UUID，对 B-Tree 主键的写入局部性比随机 UUIDv4 更友好）。
    sources:
      - {title: "PostgreSQL 18 Release Notes", url: "https://www.postgresql.org/docs/current/release-18.html"}
      - {title: "PostgreSQL 18 Press Kit", url: "https://www.postgresql.org/about/press/presskit18/en/"}
    project_example: |
      一个对话产品的消息表增长到 3000 万行后，打开历史对话的接口 P99 从 30ms 涨到 2.5 秒，数据库 CPU 长期 80%。
      `EXPLAIN ANALYZE` 显示 `SELECT ... WHERE conversation_id = ? ORDER BY created_at DESC LIMIT 20` 走的是 `Seq Scan` 然后排序——原来 `conversation_id` 只是外键，没有建索引。
      用 `CREATE INDEX CONCURRENTLY idx_messages_conv_created ON messages (conversation_id, created_at DESC)` 在低峰期建好索引后，执行计划变为 `Index Scan`，接口 P99 降到 8ms，数据库 CPU 降到 25%。同时删掉了两个从未被使用的单列索引，写入延迟也略有下降。
  - id: d10-k3
    name: 事务、ACID 与隔离级别
    level: P0
    summary: 事务把多步操作变成「要么全成功、要么全回滚」；PostgreSQL 默认 Read Committed，并发的读-改-写要靠条件更新或行锁兜底
    why: |
      AI 应用里处处是「多步写入必须一致」的场景：扣配额 + 写消息、创建文档 + 创建入库任务、幂等记录 + 业务结果。
      并发下处理不当会出现超额使用、重复扣费、数据只写了一半。理解事务和隔离级别，才能写出正确的并发代码；「PostgreSQL 默认隔离级别是什么」「如何防止超卖」也是面试常考点。
    problem: |
      解决两个问题：
      1. **原子性与一致性**：一个业务操作包含多条 SQL，中途失败（进程崩溃、异常、网络断开）时不能留下半成品。
      2. **并发隔离**：多个事务同时读写同一份数据时，各自看到什么、谁会覆盖谁，需要明确规则，否则会出现丢失更新等异常。
    principle: |
      **一、ACID**

      - **原子性 Atomicity**：事务中的操作要么全部生效，要么全部回滚。
      - **一致性 Consistency**：事务前后数据满足约束（外键、CHECK、UNIQUE）。
      - **隔离性 Isolation**：并发事务之间互不干扰的程度，由隔离级别决定。
      - **持久性 Durability**：提交成功后即使数据库崩溃也不丢失（依靠预写日志 WAL）。

      **二、MVCC：PostgreSQL 如何做到读写不互相阻塞**

      每次更新不会原地覆盖，而是写入行的**新版本**，旧版本保留到没有事务需要它为止（之后由 VACUUM 清理）。每个事务根据自己的**快照**判断哪个版本可见。所以普通 SELECT 不会被写入阻塞，写入也不会被读取阻塞；但**两个事务更新同一行时**，后来者要等前者提交或回滚。

      **三、隔离级别（PostgreSQL 实现）**

      | 级别 | 快照时机 | 说明 |
      |---|---|---|
      | Read Uncommitted | — | 在 PostgreSQL 中行为等同 Read Committed，**不会读到未提交数据** |
      | **Read Committed（默认）** | **每条语句**开始时 | 同一事务内两次 SELECT 可能看到不同结果（其他事务在中间提交了） |
      | Repeatable Read | 事务中**第一条语句**开始时 | 整个事务看到同一快照；PostgreSQL 的实现**也不会出现幻读**；并发更新同一行时后者报序列化错误 |
      | Serializable | 同上 + 冲突检测 | 保证结果等价于某种串行执行；检测到冲突时报错（SQLSTATE 40001），**应用必须重试** |

      **四、经典问题：丢失更新（lost update）**

      「读出配额 → 在 Python 里减一 → 写回」，在 Read Committed 下两个并发请求会互相覆盖：

      ```mermaid
      sequenceDiagram
        participant A as 请求 A 事务
        participant DB as user_quotas 表
        participant B as 请求 B 事务
        A->>DB: SELECT remaining 得到 1
        B->>DB: SELECT remaining 得到 1
        Note over A,B: 两者都认为还有额度 都去调用 LLM
        A->>DB: UPDATE remaining = 0 并提交
        B->>DB: UPDATE remaining = 0 并提交
        Note over DB: 用了 2 次 只扣了 1 次 后写覆盖先写
      ```

      **五、三种正确做法**

      1. **原子条件更新（首选）**：把判断和修改放进一条 SQL，由数据库保证原子性：
         `UPDATE user_quotas SET remaining = remaining - 1 WHERE user_id = :uid AND remaining > 0 RETURNING remaining;`
         返回 0 行说明额度不足。并发时第二个事务会等第一个提交后，基于最新值重新判断 WHERE 条件。
      2. **悲观锁 `SELECT ... FOR UPDATE`**：先锁住这一行，其他事务想修改或加锁就要等待，适合需要在 Python 中做复杂判断的场景。锁持有到事务结束，所以**事务要短**。
      3. **乐观锁（版本号）**：`UPDATE ... SET ..., version = version + 1 WHERE id = :id AND version = :v`，影响 0 行说明被别人改过，重读后重试。适合冲突少的场景。

      数据库约束 `CHECK (remaining >= 0)` 作为最后一道防线。

      **六、AI 场景的关键原则：不要在事务里等 LLM**

      事务打开期间会占用一个数据库连接，持有的行锁会阻塞其他事务。如果在事务中调用 30 秒的 LLM，就会出现大量 `idle in transaction` 连接、锁等待和连接池耗尽。正确顺序是：**短事务预扣额度（或校验）→ 提交 → 调用 LLM → 短事务写入结果（失败则退还额度）**。
    scenarios: |
      - **扣配额**：原子条件更新，额度不足返回 429 或 402 一类的业务错误（团队约定）。
      - **写消息 + 更新对话的 updated_at**：放在同一个事务中，保证列表排序与消息一致。
      - **文档重新入库**：删除旧切片 + 插入新切片放在一个事务里，避免检索时看到「一半新一半旧」（RAG 数据更新见 Day 30）。
      - **余额充值与扣费对账**：Serializable 或行锁 + 流水表，保证账实相符。
    code: |
      ```python
      from sqlalchemy import update
      from sqlalchemy.ext.asyncio import AsyncSession

      from .models import UserQuota  # ORM 模型

      async def try_consume_quota(session: AsyncSession, user_id: int, cost: int = 1) -> int | None:
          """原子扣减额度：成功返回剩余额度，额度不足返回 None。"""
          stmt = (
              update(UserQuota)
              .where(UserQuota.user_id == user_id, UserQuota.remaining >= cost)
              .values(remaining=UserQuota.remaining - cost)
              .returning(UserQuota.remaining)
          )
          remaining = await session.scalar(stmt)   # 判断与修改在同一条 SQL 中完成
          await session.commit()                    # 尽快提交，释放行锁和连接
          return remaining
      ```
    pitfalls: |
      - **误区：PostgreSQL 默认是 Repeatable Read。** 默认是 Read Committed（MySQL InnoDB 的默认才是 Repeatable Read），面试中很容易说错。
      - **在 Python 中读-改-写**：先 SELECT 再在代码里计算后 UPDATE，并发时丢失更新。
      - **长事务**：事务里调用 LLM、等待用户输入、做大量计算，导致锁等待、连接耗尽、VACUUM 无法清理旧版本造成表膨胀。
      - **使用 Serializable 却不写重试逻辑**：并发冲突时直接返回 500。
      - **混淆：SQLAlchemy 的 Session 自动开启事务。** 第一次执行 SQL 时就开启事务（autobegin），直到 commit/rollback 才结束；只读查询后忘记结束事务，同样会长时间占用连接。
    interview_asks:
      - 什么是 ACID？PostgreSQL 默认隔离级别是什么？
      - 如何防止并发扣减额度时超额使用？
      - 为什么不建议在数据库事务中调用 LLM？
      - MVCC 是什么？它解决了什么问题？
    sources:
      - {title: "PostgreSQL Docs - Transaction Isolation", url: "https://www.postgresql.org/docs/current/transaction-iso.html"}
    project_example: |
      一个按次计费的 AI 助手，在一次营销活动中发现部分免费用户的额度被用成了 -3、-5。
      代码是 `quota = await db.get(UserQuota, uid); if quota.remaining > 0: ...调用 LLM... ; quota.remaining -= 1; await db.commit()`：先读后写，并且读和写之间夹着 10 秒的 LLM 调用，用户在多个标签页同时提问就绕过了判断。
      修复：调用前用 `UPDATE ... WHERE remaining > 0 RETURNING` 原子预扣并立即提交；LLM 调用失败时用另一个短事务退还额度；表上增加 `CHECK (remaining >= 0)`。上线后负额度消失，数据库中 `idle in transaction` 连接也从高峰期的 40 多个降到接近 0。
  - id: d10-k4
    name: ORM 与 SQLAlchemy 2.x（含 N+1 问题）
    level: P0
    summary: ORM 把表映射成类、把 SQL 封装成对象操作；SQLAlchemy 2.x 用 Mapped + select() 写法，必须警惕懒加载引发的 N+1 查询
    why: |
      Python AI 后端几乎都用 SQLAlchemy（或基于它的 SQLModel）访问数据库。AI 工具生成的代码里新旧写法混杂（`session.query` 与 `select()`、`declarative_base` 与 `DeclarativeBase`），学员需要能分辨。
      ORM 最大的隐患是「看起来是属性访问，实际在发 SQL」：一个列表接口悄悄发出几百条查询（N+1），在 AsyncSession 下还会直接报错。这是面试和线上排查的高频问题。
    problem: |
      解决「**在 Python 对象和关系表之间来回转换**」的繁琐与易错问题：自动生成参数化 SQL、跟踪对象变化并在提交时批量写入、管理关系加载。
      同时要解决 ORM 自身带来的问题：隐式查询导致的性能下降，以及异步环境中的隐式 I/O 限制。
    principle: |
      **一、SQLAlchemy 2.x 的现代写法**

      ```python
      from sqlalchemy import ForeignKey, String, select
      from sqlalchemy.ext.asyncio import AsyncAttrs
      from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, relationship

      class Base(AsyncAttrs, DeclarativeBase):
          pass

      class Conversation(Base):
          __tablename__ = "conversations"
          id: Mapped[int] = mapped_column(primary_key=True)
          user_id: Mapped[int] = mapped_column(index=True)
          title: Mapped[str] = mapped_column(String(200))
          messages: Mapped[list["Message"]] = relationship(back_populates="conversation")

      class Message(Base):
          __tablename__ = "messages"
          id: Mapped[int] = mapped_column(primary_key=True)
          conversation_id: Mapped[int] = mapped_column(ForeignKey("conversations.id"), index=True)
          content: Mapped[str]
          conversation: Mapped[Conversation] = relationship(back_populates="messages")
      ```

      | 用途 | 旧写法（1.x 风格） | 2.x 写法 |
      |---|---|---|
      | 声明基类 | `Base = declarative_base()` | `class Base(DeclarativeBase)` |
      | 列定义 | `id = Column(Integer, primary_key=True)` | `id: Mapped[int] = mapped_column(primary_key=True)` |
      | 查询 | `session.query(User).filter(...).all()` | `session.scalars(select(User).where(...)).all()` |
      | 按主键取 | `session.query(User).get(1)` | `session.get(User, 1)` |

      **二、Session：工作单元与身份映射**

      - **工作单元（Unit of Work）**：`session.add(obj)`、修改对象属性后，Session 记录这些变化，在 `flush`（提交前或查询前自动触发）时生成 INSERT/UPDATE，在 `commit` 时提交事务。
      - **身份映射（Identity Map）**：同一个 Session 中，同一主键只对应一个 Python 对象，重复 `get` 不会重复查库。
      - **autobegin**：Session 第一次执行 SQL 时自动开启事务，直到 `commit()` / `rollback()`。
      - **expire_on_commit**：默认提交后对象属性过期，下次访问会重新查询；异步场景下通常设置 `async_sessionmaker(engine, expire_on_commit=False)`，避免提交后访问属性触发隐式 I/O。

      **三、N+1 查询问题**

      ```python
      convs = (await session.scalars(select(Conversation).where(Conversation.user_id == uid))).all()  # 1 条查询
      for c in convs:
          msgs = await c.awaitable_attrs.messages   # 每个对话再查 1 次：共 N 次
      ```

      ```mermaid
      sequenceDiagram
        participant App as 应用代码
        participant ORM as SQLAlchemy
        participant DB as PostgreSQL
        App->>ORM: 查询用户的 50 个对话
        ORM->>DB: SELECT conversations WHERE user_id
        DB-->>ORM: 50 行
        loop 每个对话访问 messages 属性
          App->>ORM: 访问 c.messages
          ORM->>DB: SELECT messages WHERE conversation_id 等于当前 ID
          DB-->>ORM: 若干行
        end
        Note over App,DB: 共 1 加 50 次往返 网络延迟被放大 50 倍
      ```

      - 同步 Session 下，访问未加载的关系属性会**悄悄触发懒加载查询**，代码看不出来。
      - **AsyncSession 下不允许隐式 I/O**：直接访问未加载的关系会抛出 `MissingGreenlet` 之类的错误；要么预加载，要么显式 `await obj.awaitable_attrs.xxx`（后者仍然是 N+1）。

      **四、解决 N+1：预加载（eager loading）**

      - `selectinload(Conversation.messages)`：先查对话，再用一条 `WHERE conversation_id IN (...)` 查出所有消息，**共 2 条 SQL**，适合一对多集合。
      - `joinedload(Message.conversation)`：用 JOIN 一次查出，适合多对一。
      - **只要统计值时不要加载整个集合**：用 `func.count()` + `GROUP BY` 子查询，一条 SQL 完成。
      - 在关系上设置 `lazy="raise"`，任何意外的懒加载都会立即报错，在开发阶段暴露 N+1。

      **五、异步用法**

      ```python
      engine = create_async_engine("postgresql+asyncpg://user:pwd@host/db", pool_pre_ping=True)
      SessionLocal = async_sessionmaker(engine, expire_on_commit=False)

      async with SessionLocal() as session:
          stmt = select(Conversation).where(Conversation.user_id == uid).options(selectinload(Conversation.messages))
          convs = (await session.scalars(stmt)).all()
      ```

      SQLAlchemy 2.1（2026-09 发布）起，asyncio 依赖的 greenlet 不再默认安装，需要 `pip install "sqlalchemy[asyncio]"`。
    scenarios: |
      - **对话列表 + 最后一条消息预览**：用子查询或窗口函数一次查出，而不是循环访问 `c.messages[-1]`。
      - **RAG 检索结果回填文档信息**：检索得到 50 个切片后，`selectinload(Chunk.document)` 一次性加载所属文档的标题和权限。
      - **批量写入**：入库时 `session.add_all(chunks)` 或使用 `insert()` 批量语句，避免逐条提交。
    pitfalls: |
      - **在循环里访问关系属性**：最常见的 N+1 来源；在 Jinja 模板、Pydantic 响应模型序列化（`from_attributes=True`）时访问关系也会触发。
      - **混用新旧写法**：AI 生成的 `session.query()` 在 AsyncSession 中不能用（AsyncSession 只支持 2.0 风格的 `execute` / `scalars`）。
      - **提交后访问属性报错**：AsyncSession 默认 `expire_on_commit=True` 时，提交后访问属性需要重新查询，异步下会报错；设置 `expire_on_commit=False` 或重新查询。
      - **误区：ORM 生成的 SQL 一定高效。** 打开 `echo=True` 或用 SQL 日志观察实际语句数量和形状。
      - **把一个 Session 跨请求或跨协程共享**：Session 不是并发安全的，每个请求、每个并发任务各用一个。
    interview_asks:
      - 什么是 N+1 查询？如何发现和解决？
      - SQLAlchemy 2.0 的写法和 1.x 有什么区别？
      - selectinload 和 joinedload 有什么区别？各适合什么场景？
      - 为什么 AsyncSession 下访问关系属性会报错？
    freshness: |
      核对于 2026-11：SQLAlchemy 2.1.0 于 2026-09-24 发布并成为 `pip install sqlalchemy` 的默认版本（当前 2.1.8），2.0 系列仍在维护（2.0.57）。2.1 的主要变化：最低 Python 3.11；asyncio 所需的 greenlet 不再默认安装，需安装 `sqlalchemy[asyncio]`；`postgresql://` 未指定驱动时默认使用 psycopg（psycopg 3）；新增 `tstring()` 支持 Python 3.14 的 t-string 模板 SQL、Session 级 execution_options 等。2.0 风格写法（`DeclarativeBase`、`Mapped`、`mapped_column`、`select()`）在 2.1 中继续适用；`session.query()` 属于旧式（legacy）API。
    sources:
      - {title: "SQLAlchemy 2.0 - ORM Quick Start", url: "https://docs.sqlalchemy.org/en/20/orm/quickstart.html"}
      - {title: "SQLAlchemy 2.0 - asyncio ORM example", url: "https://docs.sqlalchemy.org/en/20/_modules/examples/asyncio/async_orm.html"}
      - {title: "What's New in SQLAlchemy 2.1", url: "https://docs.sqlalchemy.org/en/21/changelog/migration_21.html"}
      - {title: "SQLAlchemy 2.1.0 Released", url: "https://www.sqlalchemy.org/blog/2026/09/24/sqlalchemy-2.1.0-released/"}
    project_example: |
      对话列表接口 `GET /v1/conversations` 需要返回每个对话的消息数和最后一条消息预览。最初实现是查出用户的对话后，在列表推导式中 `await c.awaitable_attrs.messages` 再取 `len()` 和最后一条。
      重度用户有 300 个对话时，接口发出 301 条 SQL，并把几万条消息全部加载到内存，耗时 4 秒。
      改为一条 SQL：用子查询 `SELECT conversation_id, count(*), max(created_at) FROM messages GROUP BY conversation_id` 与对话表关联，预览内容用 `DISTINCT ON (conversation_id)` 取最新一条。SQL 数量降为 2 条，耗时降到 60ms；同时在关系上设置 `lazy="raise"`，CI 测试中出现任何隐式懒加载都会直接失败。
  - id: d10-k5
    name: 数据库连接池
    level: P1
    summary: 建连接很贵，连接池复用已建立的连接；池大小必须按 worker 数和数据库上限计算，长时间占用连接会让整个服务排队
    why: |
      「连接池耗尽」是 AI 后端最常见的线上故障之一：LLM 调用慢、事务没及时结束、流式接口长时间持有 Session，都会把连接占满，表现为所有接口一起超时。
      理解连接池的参数和计算方法，才能正确配置多 worker 部署，并在故障时快速定位。
    problem: |
      解决「**每次请求都新建数据库连接太慢、太耗资源**」的问题：新建 PostgreSQL 连接需要 TCP 握手、认证、在数据库端创建一个后端进程，代价很高；数据库能承受的连接数也有限（默认 `max_connections = 100`）。连接池在应用侧维护一组长连接重复使用，并限制最大并发连接数。
    principle: |
      **一、SQLAlchemy QueuePool 的默认参数**

      | 参数 | 默认值 | 含义 |
      |---|---|---|
      | `pool_size` | 5 | 池中保持的常驻连接数（按需创建，不会预先建好） |
      | `max_overflow` | 10 | 超出 pool_size 后最多再临时创建的连接数，归还时直接关闭 |
      | `pool_timeout` | 30 秒 | 获取连接的最长等待时间，超时抛出错误 |
      | `pool_recycle` | -1（不回收） | 连接存活超过该秒数后在下次取用时重建 |
      | `pool_pre_ping` | False | 取出连接时先做一次轻量探测，发现断开就替换 |

      所以默认单个 Engine 最多同时 15 个连接。

      **二、连接的借与还**

      ```mermaid
      flowchart LR
        A["请求开始 Session 第一次执行 SQL"] --> B{"池中有空闲连接吗"}
        B -- "有" --> C["借出连接 开启事务"]
        B -- "没有 且未达上限" --> D["新建连接 计入 overflow"]
        B -- "已达上限" --> E["排队等待 最多 pool_timeout 秒"]
        E -- "超时" --> F["抛出连接池超时错误 接口 500"]
        D --> C
        C --> G["commit 或 rollback 或 Session 关闭"]
        G --> H["连接归还池中 overflow 连接直接关闭"]
      ```

      **关键认识**：连接被占用的时长 = 从第一条 SQL 到事务结束（或 Session 关闭）的时长，**不是**SQL 执行的时长。在事务里等 LLM 30 秒，就占用连接 30 秒。

      **三、容量计算**

      - 总连接数上限 ≈ **worker 进程数 × (pool_size + max_overflow) × 服务实例数**，必须小于数据库 `max_connections` 减去运维、迁移、监控预留的连接。
      - 例：3 台机器 × 4 个 worker × (10 + 5) = 180，超过默认的 100 → 要么减小池，要么在数据库前加 **PgBouncer**（连接池代理，事务级复用连接）。
      - 池并不是越大越好：数据库并发执行的查询过多会争抢 CPU 和锁，反而变慢。

      **四、常见故障与特征**

      - **连接池耗尽**：日志出现类似 `QueuePool limit of size 5 overflow 10 reached, connection timed out` 的错误；所有用数据库的接口一起变慢，等待约 30 秒后报错。原因通常是长事务、连接泄漏（Session 没关闭）、并发突增。
      - **连接被中间设备断开**：云数据库、负载均衡会关闭空闲连接，应用拿到失效连接时报错；开启 `pool_pre_ping=True` 或设置小于空闲超时的 `pool_recycle`。
      - **数据库端排查**：`SELECT state, count(*) FROM pg_stat_activity GROUP BY state;` 大量 `idle in transaction` 说明有事务未及时结束。
    scenarios: |
      - **多 worker 部署配置**：按机器数和 worker 数反推每个 Engine 的 `pool_size` 与 `max_overflow`。
      - **异步任务 worker**：入库任务进程有自己的 Engine 和连接池，要计入总量。
      - **故障排查**：所有接口约 30 秒后集体 500，先查连接池超时日志与 `pg_stat_activity`。
    pitfalls: |
      - **为每个请求创建 Engine**：每个 Engine 都是新的连接池，连接数迅速爆炸（Day 09 lifespan）。
      - **只调大 pool_size 解决耗尽**：如果根因是长事务或连接泄漏，调大只是推迟故障，还可能压垮数据库。
      - **忘记计算多 worker 与多实例**：单个服务看着只有 15 个连接，实际部署后是几百个。
      - **误区：连接池等于并发上限。** 只有访问数据库的那段时间才需要连接；把 LLM 调用移出事务，同样的池可以支撑多得多的并发请求。
    interview_asks:
      - 为什么需要数据库连接池？SQLAlchemy 默认参数是多少？
      - 线上报连接池超时，你会怎么排查？
      - 多 worker、多实例部署时，连接池大小怎么定？
    sources:
      - {title: "SQLAlchemy - Engine Configuration (pool parameters)", url: "https://docs.sqlalchemy.org/en/21/core/engines.html?highlight=database"}
      - {title: "SQLAlchemy - Connection Pooling (pooling.rst)", url: "https://github.com/sqlalchemy/sqlalchemy/blob/d3a85fbd/doc/build/core/pooling.rst"}
    project_example: |
      一个 RAG 服务在 LLM 供应商响应变慢（从 5 秒变成 20 秒）的那天，整站接口（包括不调用模型的「我的知识库」页面）都在约 30 秒后返回 500，日志里全是连接池超时。
      根因：问答接口在同一个 Session 中先查权限和历史，再调用 LLM，最后写入回答——LLM 等待期间连接一直被占用，4 个 worker × 15 个连接在高峰期被问答请求全部占满。
      修复：查询完成后立即提交释放连接，LLM 调用结束后再用新的短事务写入；连接池按「2 台 × 4 worker × (8 + 2) = 80」重新配置并开启 `pool_pre_ping`；增加连接池使用率与 `idle in transaction` 数量监控。之后再遇到上游变慢，只有问答接口变慢，其他页面不受影响。
quiz:
  - id: d10-q1
    kp: d10-k2
    type: single
    question: messages 表上有复合索引 (conversation_id, created_at)。下列哪条查询最能充分利用这个索引？
    options:
      - "SELECT * FROM messages WHERE conversation_id = 42 ORDER BY created_at DESC LIMIT 20"
      - "SELECT * FROM messages WHERE content LIKE '%退款%'"
      - "SELECT * FROM messages WHERE created_at::date = '2026-11-12'"
      - "SELECT * FROM messages WHERE conversation_id::text = '42'"
    answer: [0]
    explain: |
      A 中首列是等值条件，定位到 conversation_id=42 的区间后，索引本身已经按 created_at 排好序，可以倒序读取 20 条即停止，无需额外排序，是复合索引的最佳用法。
      B 是前导通配符模糊查询，B-Tree 无法使用，而且 content 不在索引中。C 对 created_at 做了类型转换且缺少首列条件，普通索引用不上。D 对索引列做了类型转换，表达式与索引不匹配，同样无法使用。
  - id: d10-q2
    kp: d10-k3
    type: judge
    question: PostgreSQL 的默认事务隔离级别是 Repeatable Read，因此在默认配置下，同一事务内两次执行相同的 SELECT 一定会得到相同的结果。
    answer: false
    explain: |
      PostgreSQL 的默认隔离级别是 Read Committed（官方文档明确说明），每条语句开始时获取新的快照，所以同一事务内两次 SELECT 之间如果有其他事务提交了修改，第二次会看到新数据。
      Repeatable Read 是 MySQL InnoDB 的默认级别，容易混淆。如果需要整个事务看到同一快照，应显式设置 Repeatable Read 或 Serializable，并处理可能出现的序列化错误。
  - id: d10-q3
    kp: d10-k4
    type: multi
    question: 关于 SQLAlchemy 2.x 与 N+1 查询，下列说法正确的有：
    options:
      - 查出 50 个对话后在循环中逐个访问未加载的 messages 关系，会额外产生约 50 条查询
      - "selectinload(Conversation.messages) 会用一条 WHERE conversation_id IN (...) 的查询批量加载所有对话的消息"
      - 在 AsyncSession 中直接访问未预加载的关系属性，会像同步 Session 一样自动执行懒加载
      - 只需要每个对话的消息数量时，用 func.count 加 GROUP BY 比加载整个 messages 集合更合适
      - session.query(User).filter(...) 是 SQLAlchemy 2.x 推荐的 AsyncSession 查询写法
    answer: [0, 1, 3]
    explain: |
      A 描述了 N+1 的成因；B 是 selectinload 的工作方式，共 2 条 SQL；D 正确，只要统计值时加载整个集合浪费内存和带宽。
      C 错：AsyncSession 不允许隐式 I/O，访问未加载的关系会报错（如 MissingGreenlet），需要预加载或显式 await awaitable_attrs。E 错：session.query 是旧式 API，AsyncSession 只支持 2.0 风格的 select() 配合 execute 或 scalars。
  - id: d10-q4
    kp: d10-k1
    type: short
    question: 有同事为了「方便」，用 f-string 拼接 SQL 实现按标题搜索对话，还说「我们是内部系统，不会有人攻击」。请说明风险、正确写法，以及如果这个查询是由 LLM 根据用户问题生成的（Text-to-SQL），还需要哪些额外防护。
    key_points:
      - {text: "说明拼接 SQL 会把用户输入当作 SQL 语法执行，导致越权读取、修改或删除数据", dim: concept}
      - {text: "给出参数化查询写法，说明驱动把值作为数据传递", dim: principle}
      - {text: "指出内部系统同样存在风险，例如内部人员或上游数据被污染", dim: engineering}
      - {text: "针对 Text-to-SQL 提出只读账号、表与视图白名单、语句超时与执行前校验等防护", dim: engineering}
    reference: |
      **风险：** f-string 拼接会把用户输入直接拼进 SQL 文本。例如标题输入 `x' OR '1'='1`，WHERE 条件就变成恒真，返回所有用户的对话；更恶意的输入可以通过分号或 UNION 读取其他表，甚至修改、删除数据。「内部系统」并不安全：内部人员误用或恶意操作、上游系统写入的脏数据、被攻破的前端都可能带来恶意输入。
      **正确写法：** 使用参数化查询，例如 ORM 的 `select(Conversation).where(Conversation.title == title)`，或 `text("... WHERE title = :t")` 配合 `{"t": title}`。数据库驱动把参数作为数据单独传递，不会被解析成 SQL 语法。同时查询必须带上当前用户的 `user_id` 条件。
      **Text-to-SQL 额外防护：** LLM 生成的 SQL 本身就是「不可信代码」，用户可以通过 Prompt Injection 诱导模型生成破坏性语句。需要：使用只读数据库账号；只开放专门的视图，且视图中已按租户或用户过滤；执行前用 SQL 解析器校验只允许 SELECT 并限定可访问的表；设置 `statement_timeout` 和返回行数上限；记录生成的 SQL 用于审计；高风险操作要求人工确认（Day 40）。
  - id: d10-q5
    kp: d10-k3
    type: scenario
    question: |
      AI 助手按次扣额度，代码如下：先 `quota = await db.get(UserQuota, uid)`，判断 `quota.remaining > 0`，然后调用 LLM（约 10 秒），成功后 `quota.remaining -= 1` 并 `await db.commit()`。
      活动期间发现部分用户额度变成负数，同时数据库中出现大量 idle in transaction 连接。请解释两个现象的成因，并给出修复方案。
    key_points:
      - {text: "指出先读后写在 Read Committed 下存在丢失更新与检查失效，多个并发请求都通过 remaining 大于 0 的判断", dim: principle}
      - {text: "指出 db.get 已开启事务，10 秒的 LLM 调用期间事务未结束，连接处于 idle in transaction", dim: principle}
      - {text: "提出原子条件更新 UPDATE WHERE remaining 大于等于 cost RETURNING 预扣并立即提交", dim: engineering}
      - {text: "提出 LLM 调用移出事务，失败时用短事务退还额度，并加 CHECK 约束兜底", dim: engineering}
      - {text: "提到监控 pg_stat_activity 与连接池使用率验证修复效果", dim: engineering}
    reference: |
      **额度变负数：** 这是典型的「检查后操作」并发问题。同一用户在多个标签页同时提问，几个请求几乎同时执行 `db.get`，都读到 `remaining = 1`，都通过了判断，都去调用 LLM。之后各自在 Python 中把对象的值减一并提交。由于 ORM 更新语句的写法与提交时机不同，结果可能是后提交的覆盖先提交的（丢失更新），也可能逐个扣减直到变成负数；无论哪种，判断都已经失效，用户实际用的次数超过了额度。Read Committed 不会阻止这种情况。
      **idle in transaction：** `db.get` 执行 SELECT 时 Session 自动开启事务并占用一个连接，此后 10 秒 LLM 调用期间事务既没提交也没回滚，数据库中这个连接就显示为 idle in transaction。高并发时大量连接被这样占住，连接池很快耗尽，其他接口也会排队。
      **修复：**
      1. 调用 LLM 前，用一条原子 SQL 预扣：`UPDATE user_quotas SET remaining = remaining - 1 WHERE user_id = :uid AND remaining >= 1 RETURNING remaining`，返回空表示额度不足，直接返回业务错误；然后立即 `commit` 释放连接。
      2. 调用 LLM 时不持有任何事务。
      3. LLM 失败时，用新的短事务把额度加回去（或记录待补偿流水）；成功时用短事务写入消息。
      4. 表上增加 `CHECK (remaining >= 0)` 作为最后防线。
      5. 上线后监控 `pg_stat_activity` 中 idle in transaction 的数量和连接池使用率，验证效果。
    followup:
      question: 如果业务要求「生成失败不扣费」，又不想先扣后退，你还能怎么做？各有什么代价？
      key_points:
        - 预占额度 冻结与确认两阶段
        - 事后扣费需接受少量超额风险
        - 行锁持有期间不能调用 LLM
      reference: 可以使用「预占 / 确认」两阶段：调用前把额度从 remaining 转到 reserved（原子更新），成功后确认扣除，失败后释放预占，并用定时任务清理超时未确认的预占。也可以事后扣费（先生成再原子扣减），代价是并发时可能少量超额，需要业务能接受。不能用 SELECT FOR UPDATE 锁住行再去调用 LLM，那样锁和连接都会被长时间占用。
  - id: d10-q6
    kp: d10-k5
    type: scenario
    question: |
      周五晚高峰，监控显示：所有访问数据库的接口在约 30 秒后集中返回 500，日志中大量出现「QueuePool limit of size 10 overflow 5 reached, connection timed out, timeout 30」；不访问数据库的 /healthz 正常。当天下午 LLM 供应商平均响应时间从 6 秒升到 25 秒。服务部署为 2 台机器、每台 4 个 worker。请说明你的排查思路和修复方案。
    key_points:
      - {text: "根据错误信息判断为连接池耗尽，并解释 30 秒对应 pool_timeout", dim: concept}
      - {text: "将 LLM 变慢与连接占用时长关联，推断存在在事务或 Session 中等待 LLM 的代码", dim: principle}
      - {text: "给出排查手段：pg_stat_activity 统计 idle in transaction、查看长事务的 query 与 xact_start、对照代码", dim: engineering}
      - {text: "给出修复：缩短事务把 LLM 调用移出事务，流式接口提前释放 Session，排查连接泄漏", dim: engineering}
      - {text: "给出容量与监控改进：按 worker 数核算总连接数、pool_pre_ping、连接池使用率告警", dim: engineering}
    reference: |
      **判断：** 错误信息说明单个 Engine 的 10 个常驻连接加 5 个溢出连接全部被占用，新请求等待 30 秒（`pool_timeout`）仍拿不到连接而报错，所以表现为约 30 秒后集体 500。/healthz 不用数据库所以正常。这是连接池耗尽，而不是数据库挂了。
      **关联：** 当天 LLM 响应从 6 秒升到 25 秒，同时连接池耗尽，强烈提示有代码在持有数据库连接（事务未结束或 Session 未关闭）期间等待 LLM。连接占用时长从 6 秒变成 25 秒，同样的并发需要的连接数就变成原来的 4 倍多。
      **排查：**
      1. 在数据库执行 `SELECT state, count(*) FROM pg_stat_activity GROUP BY state`，看到大量 `idle in transaction`；再查询这些连接的 `xact_start` 和最后一条 `query`，定位是哪个接口的查询（例如加载对话历史）。
      2. 对照代码找到「查询 → 调用 LLM → 写库」都在同一个 Session 事务中的接口；同时检查流式接口是否在整个推流期间持有 Session，以及是否存在没有关闭 Session 的代码（连接泄漏）。
      3. 核算容量：2 台 × 4 worker × 15 = 120 个连接，可能已经超过数据库 `max_connections` 或接近上限。
      **修复：** 把 LLM 调用移出事务：先读取并提交（释放连接），调用 LLM，再用短事务写入；流式接口在推流前完成数据库读取并关闭 Session；修复泄漏。容量上按「实例 × worker ×（pool_size + max_overflow）< max_connections - 预留」重新配置，必要时引入 PgBouncer；开启 `pool_pre_ping`。监控上增加连接池使用率、等待时间、idle in transaction 数量的告警，并给 LLM 调用加超时，防止上游变慢无限拖住请求。
  - id: d10-q7
    kp: d10-k2
    type: design
    question: |
      为对话系统设计数据表与索引，需要支持以下查询：(1) 用户的对话列表按最近活跃时间倒序分页；(2) 打开某个对话加载最近 50 条消息；(3) 发送消息时的幂等去重；(4) 按用户扣减额度。请给出关键字段、约束和索引，并说明每个索引服务于哪个查询、为什么列是这个顺序。
    key_points:
      - {text: "conversations 建立 user_id 与 updated_at 降序的复合索引，服务对话列表并支持游标分页", dim: engineering}
      - {text: "messages 建立 conversation_id 与 created_at 的复合索引，等值列在前排序列在后，并指出外键不会自动建索引", dim: principle}
      - {text: "幂等记录表使用 user_id 与 idempotency_key 的唯一约束", dim: engineering}
      - {text: "额度表以 user_id 为主键并加 CHECK remaining 大于等于 0，配合原子条件更新", dim: engineering}
      - {text: "说明索引的写入代价与线上用 CONCURRENTLY 创建，并用 EXPLAIN 验证", dim: concept}
    reference: |
      **conversations**：`id` 主键，`user_id` 外键非空，`title`，`updated_at timestamptz`。索引 `(user_id, updated_at DESC)`：查询「某用户按最近活跃倒序」时，先等值定位 user_id，再按 updated_at 有序读取，支持游标分页（`WHERE user_id = ? AND (updated_at, id) < (?, ?) ORDER BY updated_at DESC, id DESC LIMIT 20`，为保证排序唯一可以把 id 也加入索引末尾）。
      **messages**：`id` 主键，`conversation_id` 外键（`ON DELETE CASCADE`），`role` 带 CHECK，`content`，`meta JSONB`，`created_at`。索引 `(conversation_id, created_at DESC)`：加载某对话最近 50 条消息时等值定位后直接按时间倒序读取 50 条，不需要排序。PostgreSQL 不会为外键自动建索引，没有这个索引时按对话查询和级联删除都要全表扫描。
      **idempotency_records**：`user_id`、`idempotency_key`、`request_hash`、`status`、`response JSONB`、`expires_at`，约束 `UNIQUE (user_id, idempotency_key)`。唯一约束既保证并发下只有一个请求能占位，也作为查询索引；`expires_at` 可加索引供定期清理。
      **user_quotas**：`user_id` 主键，`remaining INT NOT NULL CHECK (remaining >= 0)`。扣减用 `UPDATE ... WHERE user_id = ? AND remaining >= ? RETURNING remaining`，主键索引保证快速定位，CHECK 是最后防线。
      **注意：** 消息表写入频繁，不要随意增加索引；线上新增索引使用 `CREATE INDEX CONCURRENTLY`；上线前用 EXPLAIN ANALYZE 验证每个关键查询走了预期的索引。
interview:
  - id: d10-i1
    kp: d10-k2
    type: oral
    difficulty: 1
    question: 数据库索引为什么能加快查询？它有什么代价？
    key_points:
      - {text: "说明 B-Tree 索引按键有序组织，等值查找只需走几层，范围与排序可顺序读取叶子", dim: principle}
      - {text: "说明复合索引最左前缀与等值列在前的原则", dim: concept}
      - {text: "说明代价：写入维护开销、存储与内存占用、建索引可能阻塞写入", dim: engineering}
      - {text: "结合项目说明通过 EXPLAIN 发现缺失索引并优化的经历", dim: project}
    reference: |
      PostgreSQL 默认的 B-Tree 索引是一棵按索引键排好序的多层平衡树：内部节点存分隔键，叶子节点存「键 + 行位置」并相互链接。等值查找从根节点走 3~4 层就能定位，时间与数据量的对数成正比；范围查询和 ORDER BY 可以沿着叶子顺序读取，配合 LIMIT 读够就停，不需要扫描和排序全表。
      复合索引按列顺序排序，遵循最左前缀：索引 (conversation_id, created_at) 能高效服务「某对话最近 N 条消息」，但不能高效服务只按 created_at 过滤的查询（PostgreSQL 18 的 skip scan 在首列基数低时有帮助，但不能依赖）。所以等值条件的列放前面，范围和排序的列放后面。
      代价有三方面：每次写入都要同步维护索引，索引越多写得越慢；索引占用磁盘和缓存；普通 CREATE INDEX 会阻塞写入，生产大表要用 CONCURRENTLY。另外函数包裹列、类型转换、前导通配符会让索引失效。
      在项目中，我曾遇到消息表 3000 万行后打开对话变慢，EXPLAIN ANALYZE 显示是 Seq Scan，原因是外键列没有索引，补上复合索引后 P99 从 2.5 秒降到 8 毫秒。
    oral: |
      索引快的原因是它把数据按键排好序，组织成一棵 B-Tree。查一个值只要从根走三四层，范围查询和排序也能沿着叶子顺序读，配合 LIMIT 读够就停，不用扫全表。
      复合索引要注意列顺序，等值的列放前面，排序或范围的列放后面。
      代价主要是写入变慢、占空间，还有大表直接建索引会锁写入，所以线上要用 CONCURRENTLY。
      我遇到过一个例子：消息表三千万行以后，打开对话要两秒多，EXPLAIN 一看是全表扫描，原来外键列没建索引，PostgreSQL 不会自动给外键建。补了对话 ID 加创建时间的复合索引后，降到了几毫秒。
  - id: d10-i2
    kp: d10-k3
    type: oral
    difficulty: 2
    question: 什么是事务和 ACID？PostgreSQL 的默认隔离级别是什么？如何避免并发扣减额度时的超额使用？
    key_points:
      - {text: "说明事务与 ACID 四个特性的含义", dim: concept}
      - {text: "准确说出 PostgreSQL 默认 Read Committed，并说明各隔离级别及 Read Uncommitted 等同 Read Committed", dim: concept}
      - {text: "用丢失更新或检查后操作解释并发扣减问题的成因，提及 MVCC 快照", dim: principle}
      - {text: "给出原子条件更新、SELECT FOR UPDATE、乐观锁三种方案及适用场景，并加 CHECK 约束兜底", dim: engineering}
      - {text: "强调不要在事务中调用 LLM，保持事务短小", dim: project}
    reference: |
      事务是把一组数据库操作作为一个整体执行，ACID 指：原子性（全成功或全回滚）、一致性（事务前后满足约束）、隔离性（并发事务互不干扰的程度）、持久性（提交后不丢失，依靠 WAL）。
      PostgreSQL 默认隔离级别是 Read Committed，每条语句看到语句开始时已提交的数据；Repeatable Read 整个事务使用同一快照，在 PostgreSQL 中也不会出现幻读；Serializable 在此基础上检测冲突，冲突时报序列化错误需要应用重试；Read Uncommitted 在 PostgreSQL 中行为等同 Read Committed。PostgreSQL 用 MVCC 实现，读写互不阻塞，但更新同一行时后者要等待。
      并发扣减的问题在于「先读再判断再写」：两个请求同时读到剩余 1 次，都通过判断，都去使用，最终超额。解决方案：首选原子条件更新 `UPDATE ... SET remaining = remaining - 1 WHERE user_id = ? AND remaining > 0 RETURNING remaining`，判断和修改在一条语句中完成；需要复杂判断时用 `SELECT ... FOR UPDATE` 锁行；冲突很少时用版本号乐观锁并重试。再加上 `CHECK (remaining >= 0)` 作为最后防线。
      AI 场景中最重要的一点是：不要在事务里调用 LLM。正确做法是短事务预扣并提交，调用 LLM，再用短事务写结果，失败时退还。
    oral: |
      事务就是把几步操作当成一个整体，ACID 是原子性、一致性、隔离性、持久性。PostgreSQL 默认是 Read Committed，每条语句看到的是它开始时已提交的数据，这点经常和 MySQL 的 Repeatable Read 搞混。
      并发扣额度的问题是先读后写：两个请求都读到剩一次，都通过判断，就超额了。我的首选方案是一条条件更新，remaining 大于零才减一，用 RETURNING 拿结果，判断和修改在一条 SQL 里由数据库保证原子；需要复杂判断时才用 FOR UPDATE 锁行。表上再加一个 CHECK 不能小于零兜底。
      还有一点我会特别强调：不能在事务里调模型。我们之前就是查了额度然后调十秒模型再写回，结果既超额又占满了连接池。现在是预扣、提交、调模型、再写结果。
  - id: d10-i3
    kp: d10-k4
    type: oral
    difficulty: 3
    question: 什么是 ORM 的 N+1 问题？在 SQLAlchemy 2.x（尤其是 AsyncSession）中如何发现和解决？
    key_points:
      - {text: "说明 N+1 是先查 N 个父对象，再在循环中访问关系触发 N 次懒加载查询", dim: concept}
      - {text: "说明 AsyncSession 不允许隐式 IO，访问未加载关系会报错，awaitable_attrs 仍是 N+1", dim: principle}
      - {text: "给出解决方案：selectinload 用于集合、joinedload 用于多对一、只要统计值时用聚合查询", dim: engineering}
      - {text: "给出发现手段：echo 或 SQL 日志统计语句数、lazy raise、测试中断言查询次数", dim: engineering}
      - {text: "结合项目说明优化前后的 SQL 数量与耗时", dim: project}
    reference: |
      N+1 指先用 1 条查询取出 N 个对象，再在循环里访问每个对象未加载的关系属性，每次访问触发一次懒加载查询，总共 N+1 次数据库往返。比如列出 300 个对话再逐个取消息，就是 301 条 SQL，网络往返延迟被放大几百倍，还可能把大量不需要的数据加载到内存。它很隐蔽，因为代码看起来只是在访问属性；Pydantic 用 from_attributes 序列化响应时访问关系也会触发。
      在同步 Session 下懒加载会悄悄执行；在 AsyncSession 下不允许隐式 I/O，直接访问未加载的关系会抛出 MissingGreenlet 之类的错误。可以用 `await obj.awaitable_attrs.messages` 显式加载，但在循环里这样写仍然是 N+1。
      解决方式：一对多集合用 `select(Conversation).options(selectinload(Conversation.messages))`，共 2 条 SQL（第二条用 IN 批量查询）；多对一关系用 joinedload 一次 JOIN 查出；如果只需要计数或最新一条，就用 `func.count()` + GROUP BY 子查询或窗口函数，一条 SQL 完成，不加载整个集合。
      发现手段：开发环境打开 `echo=True` 或 SQL 日志，观察一个接口发出的语句数量；在关系上设置 `lazy="raise"`，任何意外懒加载立即报错；在测试中统计执行的 SQL 次数并断言上限。
      项目中我把对话列表接口从 301 条 SQL、4 秒优化成 2 条 SQL、60 毫秒。
    oral: |
      N+1 就是先查出 N 个对象，然后循环里访问它们的关系属性，每访问一次就发一条查询，加起来 N+1 次。它很隐蔽，因为代码看着只是在读属性。
      在 AsyncSession 里更明显，因为异步不允许隐式 I/O，直接访问没加载的关系会报错；用 awaitable_attrs 能绕过去，但循环里用还是 N+1。
      解决办法是预加载：一对多用 selectinload，两条 SQL 搞定；多对一用 joinedload。如果只是要个数，就别加载集合，直接 count 加 group by。
      发现的话，我会开 SQL 日志看一个接口发了多少条语句，再给关系设置 lazy raise，测试里一旦有隐式加载就直接失败。我们对话列表就是这么从三百多条 SQL、四秒，降到两条 SQL、六十毫秒的。
  - id: d10-i4
    kp: d10-k4
    type: oral
    difficulty: 4
    question: 请完整讲述：用户在前端点击「发送」后，一个问答请求从进入 FastAPI，到读写 PostgreSQL、调用 LLM，再返回给前端的全过程。每一步可能出什么问题？（第一阶段综合）
    key_points:
      - {text: "网络与入口：HTTP 请求经网关或 Nginx 到 uvicorn worker，ASGI 交给 FastAPI，中间件生成请求 ID", dim: concept}
      - {text: "框架层：路由匹配、依赖解析（鉴权、yield Session）、Pydantic 校验失败返回 422", dim: principle}
      - {text: "数据层：Session 首次执行 SQL 时从连接池借连接并开启事务，归属校验、额度原子预扣后立即提交", dim: principle}
      - {text: "外部调用：在事件循环中 await 异步 HTTP 客户端调用 LLM，整体超时与 429 502 504 处理，不持有事务", dim: engineering}
      - {text: "写回与返回：短事务写入消息并提交，按响应模型序列化，响应发送后 yield 依赖关闭 Session 归还连接", dim: engineering}
      - {text: "逐步指出故障点：阻塞事件循环、422、越权、连接池耗尽、上游错误映射、N+1 与慢查询，并说明对应排查手段", dim: project}
    reference: |
      **1. 网络与入口：** 前端发送 `POST /v1/conversations/{id}/messages`，携带 Bearer Token、JSON 请求体和幂等键。请求经过负载均衡或 Nginx 转发到某台机器的某个 uvicorn worker 进程。uvicorn 解析 HTTP，按 ASGI 协议交给 FastAPI。中间件生成或透传 X-Request-ID，写入日志上下文。可能的问题：worker 全部崩溃时 Nginx 返回 502；请求体过大返回 413。
      **2. 框架层：** Starlette 路由匹配方法和路径；FastAPI 解析依赖树：`current_user` 依赖解析并验证 Token（失败 401）；`get_db` yield 依赖创建 AsyncSession（此时还未占用连接）；请求体交给 Pydantic 校验（缺字段、超长、越界返回 422，路由不执行）。路由是 async def，在事件循环中执行，任何阻塞调用都会拖慢整个 worker（Day 06）。
      **3. 读库与预扣：** 第一次执行 SQL 时，Session 从连接池借出连接并自动开启事务。先插入幂等记录占位（唯一约束冲突则返回已有结果或 409，Day 08）；查询对话并校验 `user_id` 归属（不属于则 404，防止越权，Day 09）；用 `UPDATE ... WHERE remaining > 0 RETURNING` 原子预扣额度（不足返回业务错误）；用 `(conversation_id, created_at)` 索引加载最近 N 条历史（缺索引会变慢查询，循环访问关系会 N+1）。然后立即 commit，连接归还连接池。
      **4. 调用 LLM：** 使用 lifespan 中创建的共享 httpx.AsyncClient，在 `asyncio.timeout` 预算内 await 调用；等待期间事件循环服务其他请求。处理 429（遵守 Retry-After 或返回 503）、502/503（有限重试或切换备用模型）、504 或超时（非幂等请求不盲目重试），失败时用短事务退还额度。关键点：这一步不持有事务和连接，否则上游变慢时连接池会被耗尽，所有接口约 30 秒后集体 500（Day 10）。
      **5. 写回与返回：** 用新的短事务写入用户消息和助手消息、更新对话 updated_at、把幂等记录标记完成并保存响应，然后 commit。路由返回响应模型，FastAPI 过滤字段并序列化为 JSON，返回 201。默认情况下响应发送后 `get_db` 的退出代码执行，关闭 Session。流式输出时要在推流前释放 Session。
      **排查思路：** 用 request_id 串起网关日志、应用日志、LLM 调用日志；看状态码判断层级（502 看进程、422 看请求体、500 看异常堆栈、504 看上游耗时）；看连接池等待、pg_stat_activity 和慢查询日志判断数据库层问题。
    oral: |
      我按五段来讲。第一段入口：请求经过 Nginx 到某个 uvicorn worker，ASGI 交给 FastAPI，中间件打上 request ID。这里进程挂了用户会看到 502。
      第二段框架：路由匹配，依赖解析，鉴权失败 401，yield 依赖准备 Session，Pydantic 校验不过直接 422，路由都不执行。路由是 async 的，所以里面绝对不能有阻塞调用。
      第三段读库：Session 第一次执行 SQL 才从连接池借连接、开事务。我会先占幂等记录，再带 user_id 查对话防越权，用条件更新原子预扣额度，用复合索引取历史，然后马上提交，把连接还回去。
      第四段调模型：用共享的异步客户端，在总超时内调用，429、502、504 分别处理，失败退额度。这一步一定不占事务，否则模型一慢，连接池就被打满，全站三十秒后集体 500，我们就踩过。
      第五段写回：新开短事务写消息、标记幂等完成、提交，按响应模型序列化返回 201，响应发完 Session 关闭。排查时用 request ID 串日志，按状态码判断是哪一层的问题。
  - id: d10-i5
    kp: d10-k5
    type: oral
    difficulty: 4
    question: 线上问答接口突然大量报错或变慢，你会如何系统地排查？请结合第一阶段学过的并发、HTTP、FastAPI、数据库知识说明你的思路。（第一阶段综合）
    key_points:
      - {text: "先看现象与范围：哪些接口、什么状态码、从何时开始、是否与发布或上游变化相关", dim: engineering}
      - {text: "按状态码分层定位：502 进程或网关、504 上游或处理超时、500 应用异常、422 请求契约、429 限流", dim: concept}
      - {text: "区分所有接口一起慢与单接口慢：前者考虑事件循环阻塞或连接池耗尽，后者考虑慢查询或上游", dim: principle}
      - {text: "给出数据库侧手段：连接池超时日志、pg_stat_activity 中 idle in transaction 与长事务、慢查询与 EXPLAIN ANALYZE", dim: engineering}
      - {text: "给出应用侧手段：request_id 串联日志、asyncio debug 慢回调、py-spy、LLM 调用耗时与状态码分布", dim: engineering}
      - {text: "先止血再根治：回滚、降级、限流、扩容，之后修复根因并补监控与复盘", dim: project}
    reference: |
      **第一步，确认现象和范围：** 哪些接口受影响（全部还是只有问答）、状态码分布（500/502/504/429/422）、开始时间、是否与发布、配置变更、流量突增或上游 LLM 变慢同时发生。监控面板上对比 QPS、延迟分位数、错误率、CPU、数据库连接数。
      **第二步，按状态码分层：**
      - 502：网关连不上 worker，看进程是否崩溃、OOM、启动失败，健康检查是否因事件循环阻塞而失败导致实例被摘除。
      - 504：网关等待超时，看应用侧耗时分布，通常是上游 LLM 变慢或处理被阻塞。
      - 500：应用未处理异常，按 request_id 查堆栈；常见的有连接池超时、上游错误未映射、KeyError。
      - 422 激增：客户端发布了不兼容的请求格式。
      - 429：自身限流或上游限流转发。
      **第三步，区分「所有接口一起慢」和「单个接口慢」：**
      - 所有接口一起慢且 CPU 不高：优先怀疑事件循环被阻塞（async 路由中的同步调用，Day 06），用 asyncio debug 模式的慢回调日志和 py-spy dump 确认；或者连接池耗尽（日志中的 QueuePool 超时，约 30 秒集体报错）。
      - 单个接口慢：看该接口的 SQL（慢查询日志、EXPLAIN ANALYZE 是否全表扫描、是否 N+1）和外部调用耗时（LLM 的 P99、429 次数）。
      **第四步，数据库侧：** `pg_stat_activity` 统计状态，大量 idle in transaction 说明事务未及时结束（多半是在事务里等 LLM）；查找长事务和锁等待；核对总连接数是否超出 `max_connections`。
      **第五步，止血与根治：** 止血手段包括回滚最近发布、切换备用模型或降级、开启限流保护数据库、临时扩容；根治包括把 LLM 调用移出事务、修复阻塞调用、补索引、修复错误映射。最后补充监控（连接池使用率、事件循环延迟、上游状态码分布）和告警，并写复盘文档。
    oral: |
      我的排查一般分三步走。第一步看范围：是所有接口还是单个接口，什么状态码，从什么时候开始，跟发布或者上游变化有没有关系。
      第二步按状态码分层：502 先看进程是不是挂了或者被健康检查摘掉；504 看上游和处理耗时；500 拿 request ID 查堆栈；422 突然变多一般是前端发版不兼容。
      第三步区分是不是所有接口一起慢。一起慢、CPU 又不高，我首先怀疑两件事：事件循环被同步调用阻塞，或者连接池耗尽。前者看 asyncio 的慢回调日志和 py-spy；后者看 QueuePool 超时日志，再查 pg_stat_activity 里有没有大量 idle in transaction。单个接口慢就看慢查询、EXPLAIN 和 LLM 的耗时分布。
      处理上先止血，比如回滚、切备用模型、限流，再修根因，最后补监控和复盘。我们之前那次模型变慢导致全站报错，就是这样定位到在事务里调模型的。
code_reading:
  id: d10-c1
  kp: [d10-k3, d10-k4, d10-k5]
  title: 带额度扣减的问答接口与对话列表接口
  scenario: |
    这是企业 AI 助手的两个核心接口：`POST /v1/conversations/{conv_id}/messages` 发送问题（校验归属、检查额度、加载历史、调用 LLM、扣额度并保存回答）；`GET /v1/conversations` 返回当前用户的对话列表及每个对话的消息数。
    使用 SQLAlchemy 2.x AsyncSession（`expire_on_commit=False`，模型基类混入了 AsyncAttrs），连接池 `pool_size=10, max_overflow=5`，4 个 worker。最近出现：个别用户额度为负、LLM 变慢时全站接口超时、重度用户打开对话列表要好几秒。
  language: python
  code: |
    from fastapi import APIRouter, HTTPException, Request
    from pydantic import BaseModel, Field
    from sqlalchemy import select

    from .deps import DB, UserId
    from .llm import generate_answer
    from .models import Conversation, Message, UserQuota

    router = APIRouter(prefix="/v1")


    class AskIn(BaseModel):
        content: str = Field(min_length=1, max_length=4000)


    @router.post("/conversations/{conv_id}/messages", status_code=201)
    async def ask(conv_id: int, body: AskIn, db: DB, user_id: UserId, request: Request) -> dict:
        conv = await db.scalar(
            select(Conversation).where(Conversation.id == conv_id, Conversation.user_id == user_id)
        )
        if conv is None:
            raise HTTPException(status_code=404, detail="conversation not found")

        quota = await db.scalar(select(UserQuota).where(UserQuota.user_id == user_id))
        if quota is None or quota.remaining <= 0:
            raise HTTPException(status_code=429, detail="quota exceeded")

        history = (await db.scalars(
            select(Message).where(Message.conversation_id == conv_id)
            .order_by(Message.created_at.desc()).limit(10)
        )).all()

        answer = await generate_answer(request.app.state.http, list(reversed(history)), body.content)

        quota.remaining -= 1
        db.add(Message(conversation_id=conv_id, role="user", content=body.content))
        msg = Message(conversation_id=conv_id, role="assistant", content=answer)
        db.add(msg)
        await db.commit()
        return {"message_id": msg.id, "answer": answer, "remaining": quota.remaining}


    @router.get("/conversations")
    async def list_conversations(db: DB, user_id: UserId) -> list[dict]:
        convs = (await db.scalars(
            select(Conversation).where(Conversation.user_id == user_id)
            .order_by(Conversation.updated_at.desc())
        )).all()
        return [
            {"id": c.id, "title": c.title, "count": len(await c.awaitable_attrs.messages)}
            for c in convs
        ]
  walkthrough:
    function: |
      `ask`：校验对话属于当前用户 → 读取额度并判断是否用完 → 加载最近 10 条历史 → 调用 LLM（5~30 秒）→ 在 Python 中扣减额度、新增用户消息和助手消息 → 一次提交 → 返回消息 ID、回答和剩余额度。
      `list_conversations`：查询当前用户的全部对话（按最近活跃倒序），对每个对话加载全部消息并计数后返回。
    key_functions: |
      - `db.scalar(select(...))`：执行 2.x 风格查询并返回第一行的第一个对象；`db.scalars(...).all()` 返回对象列表。
      - `generate_answer`：封装的 LLM 调用（使用 lifespan 中的共享 httpx 客户端），把历史和问题组装成 Prompt。
      - `quota.remaining -= 1`：修改 ORM 对象属性，提交时由工作单元生成 UPDATE。
      - `c.awaitable_attrs.messages`：AsyncAttrs 提供的显式异步加载关系属性的方式，每次访问触发一次查询。
    params: |
      - `conv_id` 来自路径，`body` 经 `AskIn` 校验，`db`（AsyncSession）与 `user_id` 来自依赖注入（Day 09）。
      - 历史消息按时间倒序取 10 条后用 `reversed` 恢复为正序，再连同问题传给 `generate_answer`。
      - `request.app.state.http` 是 lifespan 中创建的共享 HTTP 客户端。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant API as ask 路由
        participant S as AsyncSession
        participant Pool as 连接池
        participant PG as PostgreSQL
        participant L as LLM
        API->>S: 查询对话 带 user_id 条件
        S->>Pool: 借出连接 自动开启事务
        S->>PG: SELECT conversation
        API->>S: SELECT user_quotas 读取 remaining
        API->>S: SELECT 最近 10 条消息
        Note over S,Pool: 事务未结束 连接持续被占用
        API->>L: generate_answer 等待 5 到 30 秒
        L-->>API: 回答
        API->>S: Python 中 remaining 减一 并新增两条消息
        API->>S: commit
        S->>PG: UPDATE quota 与 INSERT messages 后 COMMIT
        S->>Pool: 事务结束 连接可再次使用
      ```
    failure_points: |
      - **问题 1：额度检查与扣减是「先读后写」，存在并发超额**。两个并发请求都读到 `remaining = 1`，都通过 `<= 0` 判断并调用 LLM；之后各自在 Python 中减一并提交。ORM 生成的 UPDATE 写入的是 Python 中计算出的值，后提交的会覆盖先提交的（丢失更新），用户实际使用次数超过额度；在其他写法下也可能被扣成负数。
      - **问题 2：调用 LLM 期间事务一直打开，长时间占用连接**。第一次 `db.scalar` 时 Session 已借出连接并开启事务，直到 `commit` 才结束，中间夹着 5~30 秒的 LLM 调用。每个 worker 最多 15 个连接，LLM 变慢时很快全部被问答请求占满，其他请求等待 `pool_timeout`（30 秒）后报错——对应「LLM 变慢时全站超时」。数据库中这些连接显示为 idle in transaction。
      - **问题 3（列表接口）：N+1 查询并加载全部消息**。`list_conversations` 先 1 条查询取出所有对话，再对每个对话 `await c.awaitable_attrs.messages` 触发一次查询，并把该对话的全部消息加载进内存只为了计数；对话没有分页，重度用户一次请求数百条 SQL——对应「打开对话列表要好几秒」。
      - LLM 调用失败时会抛出异常，事务回滚，额度未扣但也没有记录失败；用户消息也没有保存，前端重试会重新生成（缺幂等键，Day 08）。
      - 如果 `messages(conversation_id, created_at)` 没有索引，加载历史会全表扫描。
    debugging: |
      - **复现超额**：给测试用户额度 1，用脚本并发发送 5 个请求（mock LLM 延迟 2 秒），观察成功次数和最终 remaining。
      - **观察连接占用**：压测时在数据库执行 `SELECT state, count(*) FROM pg_stat_activity GROUP BY state`，看到大量 `idle in transaction`；应用日志出现 QueuePool 超时错误。
      - **统计 SQL 数量**：开发环境开启 `echo=True` 或 SQL 日志，调用列表接口，统计执行的 SELECT 条数是否与对话数量成正比。
      - **验证索引**：对历史查询执行 `EXPLAIN (ANALYZE, BUFFERS)`，确认是 Index Scan 而不是 Seq Scan。
    change_request: |
      **需求：保证额度不超用、LLM 变慢不影响其他接口、对话列表在 100ms 内返回。**
      - `ask` 拆成三段：第一段短事务——校验归属、执行 `update(UserQuota).where(UserQuota.user_id == user_id, UserQuota.remaining >= 1).values(remaining=UserQuota.remaining - 1).returning(UserQuota.remaining)` 原子预扣、加载历史，然后 `await db.commit()` 释放连接；第二段调用 LLM（不持有事务，设置整体超时）；第三段短事务写入两条消息并提交。LLM 失败时用短事务退还额度。额度表增加 `CHECK (remaining >= 0)`。
      - `list_conversations` 改为一条聚合查询：`select(Conversation.id, Conversation.title, func.count(Message.id)).outerjoin(Message).where(Conversation.user_id == user_id).group_by(Conversation.id).order_by(Conversation.updated_at.desc()).limit(20)`，并支持游标分页；在关系上设置 `lazy="raise"` 防止回归。
      - 确认 `messages(conversation_id, created_at)` 与 `conversations(user_id, updated_at)` 索引存在。
  questions:
    - id: d10-c1-q1
      kp: d10-k3
      type: code
      question: 用户剩余额度为 1，在两个浏览器标签页几乎同时发送问题。请按时间顺序描述两个请求在 `ask` 中的执行过程（包括事务、读取到的值、提交时生成的 SQL），说明最终的 remaining 和实际使用次数，并给出修复代码思路。
      key_points:
        - {text: "说明两个请求各自开启事务并都读到 remaining 等于 1，均通过额度判断", dim: concept}
        - {text: "说明在 Read Committed 与 MVCC 下读取互不阻塞，两个请求都调用了 LLM", dim: principle}
        - {text: "说明 ORM 提交时 UPDATE 写入 Python 计算的值 0，后提交覆盖先提交，最终 remaining 为 0 但实际使用 2 次", dim: principle}
        - {text: "给出修复：原子条件更新预扣并立即提交，失败退还，加 CHECK 约束", dim: engineering}
      reference: |
        时间线：请求 A 和 B 各自有独立的 AsyncSession。A 执行 `select(UserQuota)`，Session 借出连接并开启事务，读到 `remaining = 1`；几乎同时 B 也开启事务读到 `remaining = 1`。PostgreSQL 默认 Read Committed，基于 MVCC 的普通 SELECT 不加锁，读取互不阻塞，所以两者都通过 `quota.remaining <= 0` 的判断，都去调用 LLM。
        A 的 LLM 先返回：Python 中 `quota.remaining -= 1` 得到 0，`commit` 时工作单元生成 `UPDATE user_quotas SET remaining = 0 WHERE user_id = ...`，并插入两条消息，提交成功。B 的 LLM 随后返回：它的对象里 remaining 仍然是读取时的 1，减一得到 0，提交时同样生成 `UPDATE ... SET remaining = 0`。A 已提交，B 的 UPDATE 不会被阻塞，直接写入 0。
        结果：remaining 为 0，但用户实际使用了 2 次，产生了两次 LLM 费用——典型的丢失更新。如果有更多并发请求，超用会更多。
        修复：在调用 LLM 之前用一条原子 SQL 预扣：`update(UserQuota).where(UserQuota.user_id == user_id, UserQuota.remaining >= 1).values(remaining=UserQuota.remaining - 1).returning(UserQuota.remaining)`，结果为 None 则直接返回额度不足；随即 commit。并发时第二个事务的 UPDATE 会等待第一个提交，然后基于最新值重新判断 WHERE 条件，结果影响 0 行。LLM 失败时用短事务加回额度。表上增加 `CHECK (remaining >= 0)`。
    - id: d10-c1-q2
      kp: d10-k5
      type: code
      question: 假设某天 LLM 平均耗时从 6 秒变成 25 秒，每个 worker 同时有 20 个用户在提问，另有用户在访问对话列表。请结合 AsyncSession 的事务开启时机和连接池参数（pool_size=10, max_overflow=5, 默认 pool_timeout=30），说明这个 worker 上会发生什么，以及为什么连对话列表这种不调用 LLM 的接口也会报错。
      key_points:
        - {text: "说明 Session 在第一条 SQL 时借出连接并开启事务，直到 commit 才结束，期间包含 LLM 调用", dim: principle}
        - {text: "计算单 worker 最多 15 个连接，20 个并发问答中前 15 个占满连接，其余等待", dim: engineering}
        - {text: "说明等待超过 30 秒抛出连接池超时，接口返回 500", dim: concept}
        - {text: "说明对话列表同样需要从同一连接池借连接，因此被饿死并报错", dim: principle}
        - {text: "给出修复：缩短事务把 LLM 调用移出事务，并配合监控与容量核算", dim: engineering}
      reference: |
        `ask` 中第一次执行 `db.scalar` 时，AsyncSession 从 Engine 的连接池借出一个连接并自动开启事务。之后的读取都在这个事务里，直到 `await db.commit()` 才结束事务、归还连接。中间夹着 25 秒的 LLM 调用，这段时间连接被占用却不做任何事（idle in transaction）。
        连接池参数决定单个 worker 最多同时持有 10 + 5 = 15 个连接。20 个用户同时提问时，前 15 个请求各占一个连接并进入 25 秒的 LLM 等待；第 16~20 个请求在第一次执行 SQL 时需要借连接，只能排队。默认 `pool_timeout` 为 30 秒，而前面的请求要 25 秒以上才能归还连接，排队者很可能在等待 30 秒后抛出连接池超时错误，接口返回 500。
        对话列表接口虽然不调用 LLM，但它使用同一个 Engine 的同一个连接池，执行查询前同样要借连接，于是被问答请求「饿死」，同样在约 30 秒后报错。这就是「LLM 变慢导致全站超时」的原因：问题不在数据库性能，而在连接被长时间无意义地占用。4 个 worker 的情况相同。
        修复：把 LLM 调用移出事务——读取与预扣后立即 commit 归还连接，LLM 返回后再用短事务写入。这样连接占用时间从几十秒降到几十毫秒，同样的连接池可以支撑多得多的并发。另外按实例数、worker 数与 `max_connections` 核算连接池大小，监控连接池等待时间和 idle in transaction 数量，并给 LLM 调用设置超时上限。
    - id: d10-c1-q3
      kp: d10-k4
      type: code
      question: 某重度用户有 300 个对话、共 6 万条消息。说明调用 `list_conversations` 时会执行多少条 SQL、加载多少数据、为什么能在 AsyncSession 下正常运行而不报错，并写出你改造后的查询思路。
      key_points:
        - {text: "说明先 1 条查询取出 300 个对话，再对每个对话通过 awaitable_attrs 触发 1 条查询，共 301 条", dim: concept}
        - {text: "说明为计数把 6 万条消息全部加载为 ORM 对象，内存与网络开销巨大", dim: principle}
        - {text: "说明 awaitable_attrs 是显式异步加载所以不报 MissingGreenlet，但本质仍是 N+1", dim: principle}
        - {text: "给出改造：count 加 group by 的聚合查询或子查询、分页、lazy raise 防回归", dim: engineering}
      reference: |
        执行过程：第一条 SQL 查询该用户的全部 300 个对话。然后在列表推导式中对每个对话执行 `await c.awaitable_attrs.messages`，每次触发一条 `SELECT ... FROM messages WHERE conversation_id = ?`，共 300 条。总计 301 条 SQL，每条都有一次数据库往返，即使每条只要 5 毫秒，也要 1.5 秒以上。
        数据量：为了得到消息数量，代码把每个对话的全部消息都加载成 ORM 对象，一共 6 万个 Message 对象（包括完整的 content 文本），占用大量内存和网络带宽，序列化与垃圾回收也会拖慢 worker。对话列表没有分页，返回 300 条也让前端渲染变慢。
        为什么不报错：AsyncSession 不允许隐式 I/O，直接访问 `c.messages` 会报 MissingGreenlet。这里用的是 AsyncAttrs 提供的 `awaitable_attrs`，它把关系加载变成一个显式的可等待操作，所以能正常运行——但这只是让懒加载在异步环境中「合法」，并没有解决 N+1。
        改造：只需要计数时，用一条聚合查询完成：`select(Conversation.id, Conversation.title, func.count(Message.id)).outerjoin(Message, Message.conversation_id == Conversation.id).where(Conversation.user_id == user_id).group_by(Conversation.id).order_by(Conversation.updated_at.desc()).limit(20)`，并基于 `(updated_at, id)` 做游标分页。如果确实需要消息本身，用 `selectinload(Conversation.messages)` 把查询降为 2 条。最后在关系上设置 `lazy="raise"`，并在测试中断言接口执行的 SQL 数量，防止回归。
