day: 14
phase: 2
title: Embedding
goals:
  - 能用「语义空间」的直觉解释 Embedding 是什么，并说清 Embedding 模型与生成模型的区别
  - 能手算并解释余弦相似度、点积、欧氏距离的关系，说明归一化为什么重要
  - 能说出主流 Embedding 模型（OpenAI text-embedding-3、BGE-M3）的维度与输入长度，并说明维度选择和模型一致性的约束
  - 能分析「相似度高但答非所问」的原因，并说明何时需要关键词检索、Rerank 等补充手段
knowledge_points:
  - id: d14-k1
    name: Embedding：把文本变成语义空间中的向量
    level: P0
    summary: Embedding 把一段文本映射成固定长度的向量，语义越接近的文本，向量在空间中越靠近
    why: |
      Embedding 是 RAG、语义搜索、推荐、聚类、去重的共同基础。第 3 阶段的知识库项目（Day 21~30）几乎每一步都依赖它。
      不理解 Embedding，你会把「向量检索」当成黑盒：不知道为什么搜不到、为什么搜到不相关的内容、为什么换模型后必须全部重建索引。
    problem: |
      传统关键词搜索只能匹配字面：搜「电脑开不了机」找不到写着「笔记本无法启动」的文档。
      Embedding 把文本转成能**计算语义距离**的向量，让「意思相近但用词不同」的内容也能被找出来，同时把「比较两段文本」变成快速的数学运算，可以在百万级数据里检索。
    principle: |
      **一、直觉：给每段文本一个「坐标」**

      - 想象一个有很多维度的空间，每段文本是空间中的一个点（向量），例如 1024 维或 1536 维的一组浮点数。
      - Embedding 模型的训练目标是：**意思相近的文本坐标靠近，意思无关的文本坐标远离**。
      - 单个维度通常没有可解释的含义，有意义的是**向量之间的方向和距离**。

      ```mermaid
      flowchart LR
        T1["笔记本无法启动"] --> M["Embedding 模型"]
        T2["电脑开不了机"] --> M
        T3["如何申请年假"] --> M
        M --> V1["向量 A"]
        M --> V2["向量 B"]
        M --> V3["向量 C"]
        V1 --> S["语义空间 A 与 B 距离近 与 C 距离远"]
        V2 --> S
        V3 --> S
      ```

      **二、它是怎么训练出来的（直觉）**

      - 常见做法是**对比学习**：给模型大量「相关文本对」（问题与答案、标题与正文、同义句），训练它把相关对的向量拉近，把不相关的推远。
      - 模型结构多为 Transformer 编码器（Day 12）：读入整段文本，经过多层注意力后把所有 Token 的表示汇总（池化）成**一个固定长度的向量**。
      - 所以**无论输入是 5 个字还是 5000 个字，输出向量的维度都一样**——这也意味着长文本被压缩得更厉害，细节更容易丢失（Day 23 切片会用到这一点）。

      **三、Embedding 模型 vs 生成模型**

      | 对比项 | Embedding 模型 | 生成模型（LLM） |
      |---|---|---|
      | 输出 | 一个固定长度的向量 | 一段文本（逐 Token 生成） |
      | 用途 | 检索、相似度、聚类、分类特征 | 回答、写作、推理、工具调用 |
      | 成本 | 低，可批量处理大量文本 | 高，按输入输出 Token 计费 |
      | 能否回答问题 | 不能 | 能 |

      在 RAG 中两者分工：**Embedding 负责「找」，LLM 负责「答」**。

      **四、一个 RAG 中的位置**

      ```mermaid
      sequenceDiagram
        participant D as 文档切片
        participant E as Embedding 模型
        participant V as 向量库
        participant U as 用户
        D->>E: 离线 批量向量化
        E->>V: 存入向量与原文
        U->>E: 在线 问题向量化
        E->>V: 用问题向量检索
        V-->>U: 返回最相近的若干片段 交给 LLM 生成
      ```

      **不理解会怎样**：试图让 Embedding 模型直接回答问题；把向量当作可读的特征去做规则判断；不知道长文本向量会「稀释」细节，切片太大导致检索不准。
    scenarios: |
      - **知识库检索**：文档切片向量化入库，用户问题向量化后检索最相近的片段（Day 21~26）。
      - **FAQ 智能匹配**：把用户的自由提问与标准问题做相似度匹配，命中则直接返回标准答案。
      - **工单去重与聚类**：计算新工单与历史工单的相似度，合并重复问题，发现高频问题类别。
      - **意图路由**：把用户问题与各意图的示例句比较，决定交给哪个处理流程。
    pitfalls: |
      - **误区：Embedding 模型可以生成回答。** 它只输出向量，回答需要生成模型。
      - **误区：向量的每一维代表某个具体含义。** 单个维度一般不可解释，不能拿来做规则判断。
      - **误区：文本越长向量信息越多。** 维度固定，长文本被压缩得更多，主题混杂时向量会变得「什么都像一点」。
      - **混淆：Token ID、模型内部的 Token 嵌入、Embedding 模型输出的句向量。** 前两个是生成模型内部概念，句向量才是检索使用的东西。
    interview_asks:
      - 什么是 Embedding？它在 RAG 中起什么作用？
      - Embedding 模型和大语言模型有什么区别？
      - 为什么不管文本多长，Embedding 向量的维度都一样？这会带来什么问题？
    project_example: |
      在一个**IT 服务台 FAQ 机器人**中，原来用关键词匹配，员工问「电脑开不了机」匹配不到标题为「笔记本无法启动处理指南」的条目，命中率很低。
      改为把 300 多条标准问题向量化，用户提问时计算相似度并返回最相近的 3 条供确认。同义表达的命中率明显提升，大量简单问题不再需要转人工。对于没有命中的问题，系统记录下来，每周补充到 FAQ 库。
  - id: d14-k2
    name: 相似度计算：余弦、点积、欧氏距离与归一化
    level: P0
    summary: 余弦看方向、点积同时受方向和长度影响；向量归一化到长度 1 后，三者给出的排序一致
    why: |
      向量检索的核心就是「算相似度、排序取 Top-K」。选错度量、忘记归一化，会导致检索结果排序错乱、阈值失效，而且这类问题**不报错**，只是效果变差，非常难排查。
      面试中「余弦相似度和点积有什么区别」是 Embedding 相关的高频题。
    problem: |
      有了向量之后，需要一个数学方法回答「两个向量有多像」，并且计算要足够快，能在海量向量中检索。
      还要解决一个实际问题：向量库支持多种距离度量（余弦、内积、L2），建索引时选哪个、与模型是否匹配、阈值怎么定。
    principle: |
      **一、三种度量（不推导，只讲直觉和计算）**

      设两个向量 a、b：

      - **点积（内积）**：`a·b = Σ aᵢ × bᵢ`。越大越相似，同时受**方向**和**长度**影响。
      - **余弦相似度**：`cos = a·b / (|a| × |b|)`。只看**方向夹角**，范围 -1 到 1，越接近 1 越相似。
      - **欧氏距离**：`|a − b|`。两点之间的直线距离，越小越相似。

      **二、手算一个例子**

      a = (1, 0)，b = (0.6, 0.8)，c = (2, 0)：

      - a·b = 0.6，|a| = 1，|b| = 1 → cos(a, b) = **0.6**
      - a·c = 2，|c| = 2 → cos(a, c) = **1**（方向完全相同）
      - 如果只看点积：a·c = 2 > a·b = 0.6，结论一样；但如果有 d = (0.5, 0)，a·d = 0.5 < a·b，点积会认为 b 比 d 更像 a，而余弦认为 d（方向完全相同）更像 a。

      结论：**向量长度不统一时，点积会被长度干扰**。

      **三、归一化：把向量长度变为 1**

      归一化（L2 normalize）就是 `v / |v|`。所有向量长度都为 1 时：

      - 余弦 = 点积（分母为 1）；
      - 欧氏距离² = 2 − 2 × 余弦，所以**三者的排序完全一致**；
      - 点积计算最便宜，所以很多系统「先归一化，再用内积」。

      ```mermaid
      flowchart TD
        A["拿到 Embedding 向量"] --> B{"模型输出已归一化吗"}
        B -->|"是 如 OpenAI 官方说明"| C["可直接用点积 等价于余弦"]
        B -->|"否或不确定"| D["自己做 L2 归一化"]
        D --> C
        C --> E{"是否手动截断了维度"}
        E -->|"是"| F["截断后必须重新归一化"]
        E -->|"否"| G["建索引时选择与之匹配的度量"]
        F --> G
      ```

      **四、已核实的厂商说明（2026-11）**

      - OpenAI 官方：其 Embedding 输出已归一化到长度 1，因此余弦可以用点积更快地计算，余弦与欧氏距离排序一致；官方推荐余弦相似度。
      - OpenAI 官方：使用 `dimensions` 参数缩短的向量同样已归一化；但如果你**拿到向量后自己截断**，必须重新归一化。
      - BGE-M3 的官方推理类 `M3Embedder` 中 `normalize_embeddings` 默认为 True；官方示例直接用 `embeddings_1 @ embeddings_2.T`（点积）计算相似度。

      **五、分数的绝对值不通用**

      - 不同模型的分数分布不同：有的模型不相关文本也有 0.7，有的相关文本只有 0.5。
      - 所以**阈值必须针对具体模型和数据用标注样本校准**，换模型、改维度后要重新校准。

      **不这样做会怎样**：手动截断后不归一化，点积排序出错；照搬别人的 0.8 阈值，结果全部被过滤或全部放行；向量库度量与模型不匹配，召回率莫名下降。
    scenarios: |
      - **建向量索引**：pgvector 等向量库需要选择距离度量（Day 25），与 Embedding 是否归一化要匹配。
      - **FAQ 匹配阈值**：用 200 条标注的「相关 / 不相关」样本画出分数分布，选出兼顾准确和召回的阈值。
      - **降维存储**：为节省存储用较低维度时，优先用 API 的 `dimensions` 参数；自己截断则必须重新归一化。
    pitfalls: |
      - **误区：余弦相似度 0.8 就一定相关。** 分数分布因模型而异，阈值要校准。
      - **误区：点积和余弦永远一样。** 只有向量都归一化时才等价。
      - **误区：手动截断向量后可以直接用点积。** 截断后长度不再是 1，必须重新归一化。
      - **混淆：距离和相似度方向相反。** 欧氏距离、余弦距离越小越相似，余弦相似度、点积越大越相似，排序时别写反。
    interview_asks:
      - 余弦相似度和点积有什么区别？什么时候它们等价？
      - 为什么要对向量做归一化？
      - 向量检索的相似度阈值怎么确定？
    code: |
      ```python
      import numpy as np

      def cosine(a: np.ndarray, b: np.ndarray) -> float:
          return float(a @ b / (np.linalg.norm(a) * np.linalg.norm(b)))

      def l2_normalize(m: np.ndarray) -> np.ndarray:
          norms = np.linalg.norm(m, axis=-1, keepdims=True)
          return m / np.clip(norms, 1e-12, None)   # 防止除以 0

      a, b = np.array([1.0, 0.0]), np.array([0.6, 0.8])
      print(cosine(a, b))   # 0.6
      ```
    project_example: |
      在一个**产品问题聚类**任务中，同事为节省内存把 3072 维向量直接切成前 256 维再用点积比较，结果聚类结果非常混乱，相似度最高的往往不是同一类问题。
      排查发现截断后向量长度不再为 1，点积被长度干扰。改为调用 API 时直接传 `dimensions=256`（官方返回已归一化的向量），并在代码中对所有向量统一做 L2 归一化作为保护，聚类质量恢复正常；同时用标注样本重新校准了合并阈值。
    freshness: |
      核对于 2026-11：OpenAI Embeddings 指南与 FAQ 说明 OpenAI Embedding 已 L2 归一化到长度 1（含通过 dimensions 参数缩短的向量），点积等价于余弦、与欧氏距离排序一致，官方推荐余弦；手动截断后需要重新归一化。BGE 官方文档中 M3Embedder 的 normalize_embeddings 默认 True。
    sources:
      - {title: "OpenAI Docs - Vector embeddings", url: "https://developers.openai.com/api/docs/guides/embeddings"}
      - {title: "OpenAI Help - Embeddings FAQ", url: "https://help-lb.openai.com/en/articles/6824809-embeddings-faq"}
      - {title: "BGE Docs - M3Embedder", url: "https://bge-model.com/API/inference/embedder/encoder_only/M3Embedder.html"}
  - id: d14-k3
    name: 主流 Embedding 模型、维度选择与模型一致性
    level: P1
    summary: 维度越高通常表达越细但存储和计算越贵；查询和文档必须用同一模型、同一维度，换模型就要全量重建
    why: |
      选 Embedding 模型是 RAG 项目的第一个技术决策，直接影响检索效果、存储成本、是否能私有化部署。
      「换 Embedding 模型要做什么」是很多团队踩过的坑，也是面试中考察工程经验的常见问题。
    problem: |
      解决三个问题：选哪个模型（云 API 还是开源自部署、中文和多语言效果）、用多少维（效果与存储、检索速度的权衡）、模型如何演进（升级或更换时不出事故）。
    principle: |
      **一、两个代表性模型（核对于 2026-11）**

      | 模型 | 默认维度 | 可调维度 | 单条最大输入 | 特点 |
      |---|---|---|---|---|
      | OpenAI text-embedding-3-small | 1536 | 支持 `dimensions` 缩短 | 8192 Token | 便宜、云 API |
      | OpenAI text-embedding-3-large | 3072 | 支持 `dimensions` 缩短 | 8192 Token | 效果更好、更贵 |
      | BAAI/bge-m3 | 1024（稠密向量） | 固定 | 8192 Token | 开源可私有化；支持 100 多种语言；同时输出稠密、稀疏、多向量三种表示 |

      补充：OpenAI Embeddings 接口单次请求最多 2048 条输入、所有输入合计不超过 30 万 Token，且输入不能为空字符串。

      **二、维度怎么选**

      - 维度越高，通常能保留更多语义细节，但**存储、内存、检索计算量都按维度线性增长**。
      - OpenAI 官方举例：text-embedding-3-large 缩短到 256 维，在 MTEB 评测上仍优于未缩短的 1536 维 ada-002；向量库只支持 1024 维时，可以用 large 并指定 `dimensions=1024`。
      - 建议：先用默认维度建立评估基线，再测试降维后的召回率，用数据决定。

      **三、模型一致性：最容易出事故的地方**

      ```mermaid
      flowchart LR
        subgraph OK["正确"]
          D1["文档 用模型 A 1024 维"] --> S1[("向量库")]
          Q1["问题 用模型 A 1024 维"] --> S1
        end
        subgraph BAD["错误"]
          D2["文档 用模型 A"] --> S2[("向量库")]
          Q2["问题 用模型 B"] --> S2
        end
      ```

      - 不同模型的向量空间**完全不同**，即使维度相同，模型 A 的向量和模型 B 的向量也**没有可比性**。
      - 同一模型的不同维度设置也不能混用。
      - 所以：**换模型或改维度 = 全量重新向量化 + 重建索引**。

      **四、工程建议**

      - 向量记录中保存 `embedding_model` 和 `dimensions` 元数据，检索时校验。
      - 模型名、维度放在配置中统一管理，入库和查询共用。
      - 更换模型时采用「新旧两套索引并行 → 评估对比 → 切换 → 保留回滚」的流程。
      - BGE-M3 这类模型的稀疏向量可用于关键词匹配类检索，与稠密向量组合做混合检索（Day 26）。
    scenarios: |
      - **私有化项目**：数据不能出内网时，选择 BGE-M3 等开源模型本地部署。
      - **多语言知识库**：中英文混合文档，选择多语言能力强的模型并用双语样本评估。
      - **存储受限**：向量数量达到千万级时，评估降维对召回率的影响以控制存储成本。
    pitfalls: |
      - **误区：维度越高效果一定越好。** 不同模型之间不能只比维度，要在自己的数据上评估。
      - **误区：同样是 1024 维，两个模型的向量可以混用。** 向量空间不同，结果没有意义且不会报错。
      - **误区：换模型只需要改配置。** 存量向量必须全部重新生成，否则新旧向量混在一起检索结果错乱。
      - **遗漏：忽略输入长度上限。** 超过 8192 Token 的文本需要先切片，否则报错或被截断。
    interview_asks:
      - 你们用的什么 Embedding 模型？为什么选它？维度是多少？
      - 如果要更换 Embedding 模型，需要做哪些工作？
    project_example: |
      在一个**制造企业私有化知识库**项目中，客户要求数据不出内网，团队选择本地部署 BGE-M3（1024 维）。上线后半年，客户希望试用新的开源模型。
      因为入库时在每条向量记录中保存了模型名和维度，迁移时新建了一套索引并后台全量重新向量化，用 300 条标注问题对比两套索引的召回率，确认新模型更好后切换读流量，旧索引保留两周用于回滚，整个过程没有影响线上问答。
    freshness: |
      核对于 2026-11：OpenAI Embeddings 指南列出 text-embedding-3-small 默认 1536 维、text-embedding-3-large 默认 3072 维，最大输入 8192 Token，dimensions 参数仅 text-embedding-3 及之后模型支持；API 参考说明单次请求最多 2048 条输入、合计不超过 300,000 Token、输入不能为空字符串；API 参考中的 Embedding 模型枚举仍为 text-embedding-ada-002 与 text-embedding-3-small/large。BGE-M3 模型卡显示稠密向量 1024 维、最大序列长度 8192、支持 100 多种语言、支持稠密/稀疏/多向量检索。
    sources:
      - {title: "OpenAI Docs - Vector embeddings", url: "https://developers.openai.com/api/docs/guides/embeddings"}
      - {title: "OpenAI API Reference - Embeddings", url: "https://developers.openai.com/api/reference/resources/embeddings"}
      - {title: "OpenAI - New embedding models and API updates", url: "https://openai.com/index/new-embedding-models-and-api-updates/"}
      - {title: "Hugging Face - BAAI/bge-m3", url: "https://huggingface.co/BAAI/bge-m3"}
  - id: d14-k4
    name: Embedding 的局限：相似不等于相关
    level: P1
    summary: 向量相似度衡量的是「话题像不像」，对否定、数字、专有编号、精确条件不敏感，需要关键词检索、过滤和 Rerank 补位
    why: |
      很多 RAG 项目效果差，根源是把「语义相似」当成了「能回答问题」。
      提前理解 Embedding 的局限，你才能在第 3 阶段设计混合检索、Metadata 过滤、Rerank（Day 26、Day 27），也能在面试中回答「为什么检索到的内容不对」。
    problem: |
      解决「检索到的内容看起来相关，其实答非所问」的问题：问「不支持退款的情况」却检索到「支持退款的情况」；搜型号「X200-B」却返回「X200-A」；问 2024 年的制度返回 2021 年的版本。
    principle: |
      **一、为什么会这样**

      - Embedding 把整段文本压缩成一个向量，捕捉的是**整体主题和语义倾向**。
      - 「支持退款」和「不支持退款」话题完全一致，只差一个否定词，向量往往非常接近。
      - 型号、编号、金额、日期这类「精确值」在语义上差别很小（X200-A 与 X200-B），但业务上完全不同。
      - 向量相似度不知道「时间、版本、权限」这些业务条件。

      **二、补救手段（第 3 阶段详讲）**

      ```mermaid
      flowchart TD
        Q["用户问题"] --> A["向量检索 找语义相近"]
        Q --> B["关键词检索 找精确匹配"]
        A --> C["合并候选"]
        B --> C
        C --> D["Metadata 过滤 版本 时间 权限"]
        D --> E["Rerank 精排 判断是否真能回答"]
        E --> F["送入 LLM 生成"]
      ```

      - **混合检索**：向量检索 + 关键词检索（如 BM25），兼顾语义和精确匹配（Day 26）。
      - **Metadata 过滤**：按年份、版本、部门、权限过滤（Day 27）。
      - **Rerank**：用交叉编码器等重排模型对「问题—片段」逐对打分，比向量相似度更能判断相关性（Day 27）。
      - **Query 改写**：把口语化问题改写成更适合检索的形式（Day 27）。

      **三、评估思路**

      不要凭感觉判断检索效果。准备「问题 → 应命中的片段」标注集，计算召回率等指标（Day 29），每次调整模型、维度、切片、阈值都回归测试。
    scenarios: |
      - **产品型号检索**：设备手册问答中型号查询必须加入关键词检索或精确过滤。
      - **制度版本问答**：入库时记录生效日期和版本，检索时只取现行版本。
      - **否定类问题**：「哪些情况不能报销」这类问题依赖 Rerank 和 LLM 阅读原文判断，而不是只靠向量相似度。
    pitfalls: |
      - **误区：相似度最高的片段一定包含答案。** 相似只代表话题接近，是否能回答需要 Rerank 或模型阅读判断。
      - **误区：换一个更大的 Embedding 模型就能解决所有检索问题。** 否定、精确编号、业务条件是方法层面的局限，需要组合手段。
      - **误区：检索不准就调阈值。** 阈值只能控制数量，不能纠正排序错误。
    interview_asks:
      - 为什么向量检索会召回「看起来相关但答非所问」的内容？怎么解决？
      - 什么情况下需要关键词检索配合向量检索？
    project_example: |
      在一个**设备维修手册问答**项目中，维修人员搜索「E-302 报警处理」，向量检索返回了 E-301、E-305 的处理步骤，因为这些片段在语义上几乎一样。
      改为混合检索：故障码用正则识别后走关键词精确匹配，其余语义部分走向量检索，合并后再 Rerank。故障码类问题的命中率大幅提升，维修人员反馈「终于能直接查到对应步骤了」。
quiz:
  - id: d14-q1
    kp: d14-k2
    type: single
    question: 已知某 Embedding 模型输出的向量都已归一化为长度 1。下列关于相似度度量的说法哪项正确？
    options:
      - 余弦相似度和点积数值相等，但与欧氏距离给出的排序可能不同
      - 余弦相似度、点积给出的排序一致，欧氏距离（越小越相似）给出的排序也一致
      - 点积一定比余弦相似度更准确，因为它包含了长度信息
      - 归一化后向量丢失了语义信息，只能使用欧氏距离
    answer: [1]
    explain: |
      向量长度均为 1 时，余弦 = 点积，且欧氏距离的平方 = 2 − 2 × 余弦，所以三者排序完全一致，这也是 OpenAI 官方文档的说明。
      A 错在认为欧氏距离排序不同；C 错，长度信息对语义检索往往是干扰；D 错，归一化只改变长度不改变方向，语义信息主要由方向承载。
  - id: d14-q2
    kp: d14-k4
    type: judge
    question: 用户问题与某个文档片段的向量余弦相似度高达 0.9，说明这个片段一定包含该问题的答案，可以直接交给模型作为依据。
    answer: false
    explain: |
      向量相似度衡量的是整体话题和语义是否接近，不保证片段能回答问题。例如「不支持退款的情况」与「支持退款的情况」相似度可能很高；不同型号、不同版本的文档也可能极其相似。
      需要结合关键词检索、Metadata 过滤、Rerank，以及让模型基于原文判断，并且分数阈值本身也因模型而异。
  - id: d14-q3
    kp: d14-k3
    type: multi
    question: 团队计划把知识库的 Embedding 模型从 A 换成 B（两者都输出 1024 维向量）。以下哪些说法正确？
    options:
      - 因为维度相同，已有的 A 向量可以继续使用，只有新文档用 B 向量化即可
      - 需要用模型 B 对全部文档重新向量化并重建索引
      - 用户问题的向量化也必须切换到模型 B，且与文档使用相同的维度设置
      - 原来用标注样本校准的相似度阈值可以直接沿用
      - 建议在向量记录中保存模型名和维度，并用评估集对比新旧索引后再切换
    answer: [1, 2, 4]
    explain: |
      B、C、E 正确。不同模型的向量空间完全不同，即使维度相同也不可比较，所以 A 错，必须全量重建，查询也要使用同一模型和维度。
      D 错：不同模型的分数分布不同，阈值需要重新校准。E 是降低迁移风险的工程实践：元数据便于校验，评估对比后再切换并保留回滚。
  - id: d14-q4
    kp: d14-k1
    type: short
    question: 产品经理问：「我们已经有大模型了，为什么做知识库检索还要单独用一个 Embedding 模型？直接让大模型去找不行吗？」请解释两者的区别和分工。
    key_points:
      - {text: "说明 Embedding 模型输出固定长度向量，用于计算语义相似度，不能生成回答", dim: concept}
      - {text: "说明生成模型逐 Token 输出文本，成本高、速度慢，不适合对海量文档逐一比较", dim: principle}
      - {text: "说明向量可以预先离线计算并建索引，在线只需向量化问题并做快速检索", dim: principle}
      - {text: "说明 RAG 中 Embedding 负责找、LLM 负责答的分工", dim: engineering}
    reference: |
      两者输出和用途不同。**Embedding 模型**把一段文本变成固定长度的向量，语义相近的文本向量也相近，它只负责「衡量像不像」，不能生成回答；**生成模型**逐 Token 生成文本，擅长理解和表达，但每次调用都按 Token 计费、速度较慢。
      如果让大模型「直接去找」，就要把海量文档都放进上下文或逐篇判断，既超出窗口、又贵又慢。而 Embedding 可以**离线**对所有文档切片预先计算向量并建索引，在线时只需把问题向量化，在向量库里毫秒级检索出最相近的若干片段。
      所以 RAG 中的分工是：**Embedding 负责「找」，LLM 负责基于找到的内容「答」**。
  - id: d14-q5
    kp: d14-k4
    type: scenario
    question: |
      某电商售后知识库只用向量检索。测试中发现两类问题：
      1. 用户问「哪些情况下不支持七天无理由退货」，检索 Top-1 是「支持七天无理由退货的商品范围」；
      2. 用户问「SKU-88231 的保修期」，返回的是 SKU-88213 的保修说明。
      请分析原因并给出改进方案。
    key_points:
      - {text: "指出否定词对整体语义向量影响很小，支持与不支持的片段话题一致因此相似度高", dim: principle}
      - {text: "指出编号类精确值在语义上差异极小，向量检索无法区分", dim: principle}
      - {text: "提出编号类查询加入关键词检索或精确过滤，与向量检索形成混合检索", dim: engineering}
      - {text: "提出用 Rerank 对候选逐对判断相关性，并让 LLM 基于原文判断能否回答", dim: engineering}
      - {text: "提出构建包含否定和编号类问题的评估集持续回归", dim: project}
    reference: |
      **原因**：Embedding 把整段文本压缩成一个向量，主要反映话题和语义倾向。「支持七天无理由退货」和「不支持七天无理由退货」话题完全一致，只差否定词，向量非常接近；SKU-88231 和 SKU-88213 这类编号在语义上几乎没有差别，向量检索无法区分，但业务上是两个商品。
      **改进**：
      1. **混合检索**：识别出编号、型号等精确值时，走关键词检索或直接按 SKU 字段过滤，与向量检索结果合并（Day 26）。
      2. **Rerank**：对候选片段用重排模型逐对判断与问题的相关性，比单纯的向量相似度更能识别否定关系（Day 27）。
      3. **生成约束**：让 LLM 基于原文作答，并要求原文不能回答时明确说明。
      4. **数据侧**：入库时把 SKU、商品类目等作为 Metadata 存储，便于过滤。
      5. **评估**：在评估集中专门加入否定类和编号类问题，作为每次调整的回归用例。
  - id: d14-q6
    kp: d14-k2
    type: short
    question: |
      有三个未归一化的向量：a = (1, 0)，b = (0.6, 0.8)，d = (0.5, 0)。
      请分别计算 a 与 b、a 与 d 的点积和余弦相似度，说明两种度量给出的「谁更像 a」是否一致，并解释原因和工程启示。
    key_points:
      - {text: "正确计算 a·b 等于 0.6 且余弦为 0.6", dim: concept}
      - {text: "正确计算 a·d 等于 0.5 且余弦为 1", dim: concept}
      - {text: "指出点积认为 b 更像 a，余弦认为 d 更像 a，结论相反，原因是 d 的长度只有 0.5", dim: principle}
      - {text: "得出工程启示：向量未归一化时点积受长度干扰，应先归一化或使用余弦", dim: engineering}
    reference: |
      **计算**：
      - a·b = 1×0.6 + 0×0.8 = **0.6**；|a| = 1，|b| = √(0.36+0.64) = 1，余弦 = **0.6**。
      - a·d = 1×0.5 + 0×0 = **0.5**；|d| = 0.5，余弦 = 0.5 / (1×0.5) = **1**。
      **结论相反**：按点积，b（0.6）比 d（0.5）更像 a；按余弦，d（1，方向完全相同）比 b（0.6）更像 a。原因是 d 的方向与 a 完全一致，只是长度短，点积把长度也算进去了。
      **工程启示**：Embedding 的语义主要由方向承载，长度差异往往是干扰。向量未归一化时用点积会导致排序错误；应先做 L2 归一化（之后点积就等于余弦），或者直接用余弦相似度。手动截断维度后也要重新归一化。
  - id: d14-q7
    kp: d14-k2
    type: judge
    question: OpenAI 的 3072 维 Embedding 已归一化，所以为了省存储，把向量手动截取前 256 维后，仍然可以直接用点积代替余弦相似度。
    answer: false
    explain: |
      手动截取部分维度后，向量长度不再是 1，点积不再等于余弦，排序会受长度干扰。OpenAI 官方文档明确指出：手动改变维度时需要重新归一化；更推荐的做法是调用 API 时直接传 dimensions 参数，返回的缩短向量官方已做归一化。
code_reading:
  id: d14-c1
  kp: [d14-k2, d14-k3]
  title: FAQ 语义匹配器
  scenario: IT 服务台机器人在启动时把全部标准问题向量化并缓存在内存中，员工提问时调用 `FaqMatcher.match` 找到最相近的标准问题并返回答案。为了省内存，同事对向量做了「降维」。上线后发现几乎所有问题都匹配不到。
  language: python
  code: |
    import logging
    import os

    import numpy as np
    from openai import OpenAI

    logger = logging.getLogger(__name__)
    client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])

    EMBED_MODEL = "text-embedding-3-large"  # 默认 3072 维，已归一化
    STORE_DIM = 256


    def embed(texts: list[str]) -> np.ndarray:
        resp = client.embeddings.create(model=EMBED_MODEL, input=texts)
        return np.array([d.embedding for d in resp.data], dtype=np.float32)


    class FaqMatcher:
        def __init__(self, faqs: list[dict], threshold: float = 0.8) -> None:
            self.faqs = faqs
            self.threshold = threshold
            vecs = embed([f["question"] for f in faqs])
            self.matrix = vecs[:, :STORE_DIM]  # 为节省内存只保留前 256 维

        def match(self, query: str, top_k: int = 3) -> list[dict]:
            q = embed([query])[0][:STORE_DIM]
            scores = self.matrix @ q  # 向量已归一化，点积即余弦
            order = np.argsort(-scores)[:top_k]
            results = [
                {**self.faqs[i], "score": float(scores[i])}
                for i in order
                if scores[i] >= self.threshold
            ]
            logger.info("query=%r best=%.3f hits=%d", query, scores[order[0]], len(results))
            return results
  walkthrough:
    function: |
      启动时把所有 FAQ 标准问题向量化并截取前 256 维存入矩阵；查询时把员工问题向量化、同样截取，计算与所有标准问题的点积，取分数最高的 top_k 条中超过阈值的返回。
    key_functions: |
      - `embed`：调用 OpenAI Embeddings 接口，把一批文本转成 numpy 矩阵（每行一个向量）。
      - `FaqMatcher.__init__`：保存 FAQ 和阈值，批量向量化标准问题并截断维度。
      - `FaqMatcher.match`：向量化查询、矩阵乘法一次算出所有分数、`argsort` 降序取前 top_k、按阈值过滤并记录日志。
    params: |
      - `faqs` 是字典列表，每项至少有 `question`（和答案等字段）；`threshold` 默认 0.8。
      - `query` 为员工原始提问；`top_k` 默认 3。
      - `STORE_DIM` 和 `EMBED_MODEL` 是模块常量，入库和查询共用，保证了模型和维度的一致性。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant S as 服务启动
        participant M as FaqMatcher
        participant E as Embeddings API
        participant U as 员工提问
        S->>M: faqs 列表
        M->>E: 全部标准问题
        E-->>M: N 行 3072 维向量
        M->>M: 截取前 256 维存为 matrix
        U->>M: match query
        M->>E: 查询文本
        E-->>M: 1 行 3072 维向量
        M->>M: 截取 256 维 与 matrix 做点积
        M->>M: 排序 取 top_k 按阈值过滤
        M-->>U: 结果列表 可能为空
      ```
    failure_points: |
      - **截断后未重新归一化**：截取前 256 维后向量长度小于 1，点积不再等于余弦，注释里「点积即余弦」不成立。分数整体偏小且受长度干扰，排序也可能出错。
      - **阈值失效**：0.8 是按完整归一化向量的经验值，截断后分数普遍远低于 0.8，于是几乎所有查询返回空列表——这正是「匹配不到」的根因。
      - **批量限制**：`embed` 一次发送全部 FAQ，超过单次 2048 条或合计 30 万 Token 的接口限制会报错；FAQ 中有空字符串也会报错。
      - **启动依赖外部服务**：构造函数里调用 API，网络故障会导致服务启动失败，且每次重启都重新计费向量化。
      - `scores[order[0]]` 在 faqs 为空时会越界。
    debugging: |
      - 先看日志中的 `best` 值：如果最相关的问题也只有 0.3~0.5，说明分数尺度有问题而不是数据问题。
      - 打印 `np.linalg.norm(self.matrix, axis=1)[:5]`，会发现长度明显小于 1。
      - 取 20 对人工标注的「相关 / 不相关」问题，分别计算截断前、截断后、截断并归一化后的余弦，比较分布。
      - 构造 3000 条 FAQ 调用构造函数，复现批量限制错误。
    change_request: |
      如果需求改为「FAQ 每天会更新、且要支持 5000 条以上」：
      1. 改用 API 的 `dimensions=256` 参数获取已归一化的短向量，或截断后统一 L2 归一化；
      2. `embed` 按批次（如每批几百条）调用并处理空字符串；
      3. 向量连同模型名、维度持久化到数据库或向量库（Day 25），启动时加载而不是重新计算，FAQ 变更时只增量向量化；
      4. 用标注样本重新校准阈值。
  questions:
    - id: d14-c1-q1
      kp: d14-k2
      type: code
      question: 按执行过程解释为什么上线后「几乎所有问题都匹配不到」。日志里 best 分数大多只有 0.3 左右，这说明了什么？应该怎么修？
      key_points:
        - {text: "说明 API 返回的 3072 维向量已归一化，但截取前 256 维后长度小于 1", dim: principle}
        - {text: "指出截断后点积不等于余弦，分数整体缩小，注释的假设不成立", dim: principle}
        - {text: "指出阈值 0.8 是按完整归一化向量设定的，截断后分数达不到，过滤掉了所有结果", dim: engineering}
        - {text: "给出修复：调用时传 dimensions 参数或截断后重新 L2 归一化，并用标注样本重新校准阈值", dim: engineering}
      reference: |
        执行过程：`embed` 返回的每个 3072 维向量长度都是 1；`__init__` 和 `match` 都只保留前 256 维。截断后的向量只保留了一部分分量，**长度小于 1**（各维平方和只是原来的一部分）。`self.matrix @ q` 计算的是两个「短于 1」的向量的点积，数值自然远小于真实的余弦相似度，而且不同向量缩短的比例不同，排序也会受长度干扰。
        日志中 best 只有 0.3 左右，说明连最相关的标准问题分数也被整体压低了——这是**分数尺度问题**而不是数据问题。随后 `scores[i] >= 0.8` 把所有候选都过滤掉，返回空列表，表现为「匹配不到」。
        修复：1）调用 Embeddings 时直接传 `dimensions=256`，OpenAI 返回的缩短向量已经归一化；或者截断后对每行做 L2 归一化；2）用一批标注样本重新画分数分布并校准阈值；3）加单元测试断言向量长度接近 1。
    - id: d14-c1-q2
      kp: d14-k3
      type: code
      question: 同事提议：「为了省钱，把查询改用便宜的 text-embedding-3-small，FAQ 那边的向量保持 large 不变，反正都截成 256 维了。」请说明这样做的后果，并结合这段代码说明如何从工程上防止这类问题。
      key_points:
        - {text: "指出不同模型的向量空间不同，即使维度相同也不可比较，分数没有意义且不会报错", dim: principle}
        - {text: "指出这类错误是静默错误，表现为检索效果变差而非异常", dim: engineering}
        - {text: "提出模型名和维度集中配置，入库和查询共用同一配置", dim: engineering}
        - {text: "提出向量记录保存模型名与维度元数据，查询时校验不一致则报错", dim: engineering}
      reference: |
        后果：text-embedding-3-small 和 text-embedding-3-large 是两个不同的模型，各自的向量空间完全不同。即使都截成 256 维、矩阵乘法不会报错，算出的分数也**没有语义意义**——相当于拿两套不同坐标系的坐标求距离。结果是匹配结果随机化，而且系统不会抛任何异常，只会表现为「效果莫名变差」，排查成本很高。
        当前代码用模块常量 `EMBED_MODEL`、`STORE_DIM` 同时服务入库和查询，这是一种保护；如果有人为查询单独改模型，就破坏了这种一致性。
        工程防护：1）模型名和维度集中在配置中，入库与查询使用同一个配置对象；2）持久化向量时保存 `embedding_model`、`dimensions` 元数据，查询前校验与当前配置一致，不一致直接报错；3）需要更换模型时走全量重建流程，而不是只改一边；4）回归评估集会在效果下降时及时报警。
    - id: d14-c1-q3
      kp: d14-k3
      type: code
      question: FAQ 从 300 条增长到 6000 条，并且每天都有修改。请指出当前 `__init__` 和 `embed` 在这种规模下会出现的问题，并说明如何改造。
      key_points:
        - {text: "指出单次请求最多 2048 条输入且合计不超过 30 万 Token，6000 条一次发送会报错", dim: engineering}
        - {text: "指出每次启动都全量调用 API，费用和启动时间随规模增长，网络故障导致启动失败", dim: engineering}
        - {text: "指出 FAQ 修改后内存中的向量不会更新，需要增量机制", dim: engineering}
        - {text: "提出分批调用、向量持久化并保存模型和维度、按内容哈希增量更新", dim: engineering}
      reference: |
        问题：
        1. **接口限制**：`embed` 把全部标准问题一次性发送，OpenAI Embeddings 单次请求最多 2048 条输入、合计不超过 30 万 Token，6000 条会直接报错；任何一条为空字符串也会报错。
        2. **启动成本与可用性**：每次服务启动都全量向量化，既花钱又拖慢启动；Embeddings API 不可用时服务直接起不来。
        3. **数据过期**：向量只在启动时计算一次，FAQ 白天修改后，内存中仍是旧向量，直到下次重启。
        改造：
        - `embed` 改为按批次调用（例如每批几百条），过滤或校验空文本，加超时和重试；
        - 把向量和模型名、维度、内容哈希一起持久化到数据库或向量库（Day 25），启动时加载；
        - FAQ 新增或修改时，按内容哈希判断是否需要重新向量化，只处理变化的条目；
        - 数据量继续增长时，用向量索引代替内存全量矩阵乘法。
interview:
  - id: d14-i1
    kp: d14-k1
    type: oral
    difficulty: 1
    question: 什么是 Embedding？它在 RAG 系统中起什么作用？
    key_points:
      - {text: "说明 Embedding 把文本映射为固定长度向量，语义相近的文本向量距离近", dim: concept}
      - {text: "说明常见训练思路为对比学习，结构多为编码器加池化，输出维度固定", dim: principle}
      - {text: "说明在 RAG 中离线向量化文档、在线向量化问题并检索相似片段", dim: engineering}
      - {text: "结合项目举例，如 FAQ 匹配或知识库检索效果提升", dim: project}
    reference: |
      Embedding 是把一段文本映射成固定长度浮点向量的技术，训练目标是让语义相近的文本向量靠近、无关文本远离，因此可以用向量间的距离或夹角衡量语义相似度。常见训练方法是对比学习，用大量相关文本对把相关的拉近、不相关的推远；模型结构多为 Transformer 编码器，最后把所有 Token 的表示池化成一个向量，所以不论文本多长，输出维度都相同。
      在 RAG 中它负责「找」：离线阶段把文档切片后批量向量化，连同原文存入向量库；在线阶段把用户问题向量化，在向量库中检索最相近的若干片段，再交给大模型基于这些片段生成回答。
      它的优势是能匹配同义表达，比如「电脑开不了机」能找到「笔记本无法启动」；局限是相似不等于相关，需要配合关键词检索和 Rerank。
    oral: |
      Embedding 就是把一段文本变成一个固定长度的向量，意思越接近的文本，向量在空间里越靠近。它一般用对比学习训练，结构是编码器加池化，所以不管文本多长维度都一样。
      在 RAG 里它负责「找」：文档切片离线向量化存进向量库，用户提问时把问题也向量化，检索最相近的片段交给大模型去「答」。
      我在 IT 服务台项目里用它替换了关键词匹配，员工说「电脑开不了机」也能匹配到「笔记本无法启动」的指南，大量简单问题不再转人工。
  - id: d14-i2
    kp: d14-k2
    type: oral
    difficulty: 2
    question: 余弦相似度、点积和欧氏距离有什么区别？为什么经常要对向量做归一化？
    key_points:
      - {text: "说明余弦只看方向，点积受方向和长度影响，欧氏距离是空间直线距离", dim: concept}
      - {text: "说明归一化后余弦等于点积，且三者排序一致", dim: principle}
      - {text: "说明 OpenAI 等模型输出已归一化，手动截断后必须重新归一化", dim: engineering}
      - {text: "说明阈值依赖模型和数据，需要用标注样本校准", dim: engineering}
    reference: |
      **点积**是对应维度相乘再求和，同时受方向和长度影响；**余弦相似度**是点积除以两个向量长度的乘积，只看方向夹角，范围 -1 到 1；**欧氏距离**是两点间直线距离，越小越相似。
      当向量都归一化为长度 1 时，余弦等于点积，欧氏距离的平方等于 2 减 2 倍余弦，三者给出的排序完全一致，而点积计算最快，所以常见做法是先归一化再用内积检索。
      归一化的意义在于：语义主要由方向承载，长度差异往往是干扰；不归一化时点积会让「长」向量占便宜。OpenAI 官方说明其 Embedding 已归一化，可以直接用点积；但如果手动截断维度，长度就不再是 1，必须重新归一化。
      另外分数的绝对值因模型而异，阈值要用标注样本校准，换模型或改维度后重新校准。
    oral: |
      点积是对应位相乘求和，会受向量长度影响；余弦只看方向；欧氏距离是空间里的直线距离。三者在向量都归一化成长度 1 的时候排序完全一致，而且点积最快，所以通常先归一化再用内积。
      我踩过一个坑：同事为了省内存把 3072 维向量直接截成前 256 维，然后用点积，结果聚类一团乱。原因就是截断后长度不再是 1。后来改成调用时直接传 dimensions 参数，官方会返回归一化好的短向量，再统一加一道 L2 归一化保护，并重新校准了阈值。
  - id: d14-i3
    kp: d14-k3
    type: oral
    difficulty: 3
    question: 你会如何为一个中文企业知识库选择 Embedding 模型和向量维度？如果之后要更换模型，需要做哪些工作？
    key_points:
      - {text: "列出选型维度：中文与多语言效果、私有化要求、成本、最大输入长度、维度与存储", dim: concept}
      - {text: "给出代表模型的事实：text-embedding-3-small 1536 维、large 3072 维可缩短，BGE-M3 1024 维 8192 Token", dim: concept}
      - {text: "说明用自有标注集评估召回率，而不是只看公开榜单或维度", dim: engineering}
      - {text: "说明换模型必须全量重新向量化并重建索引，查询与文档使用同一模型和维度", dim: principle}
      - {text: "说明迁移流程：保存模型元数据、新旧索引并行、评估对比、切换与回滚", dim: project}
    reference: |
      **选型维度**：1）中文及多语言效果；2）是否必须私有化（数据不能出内网）；3）成本与吞吐；4）最大输入长度（影响切片大小）；5）向量维度带来的存储和检索成本。
      **候选示例（2026-11 核对）**：OpenAI text-embedding-3-small 默认 1536 维、large 默认 3072 维，都支持 `dimensions` 缩短，单条最大 8192 Token，适合可以使用云 API 的场景；BGE-M3 是开源模型，稠密向量 1024 维、最长 8192 Token、支持 100 多种语言，还能输出稀疏向量，适合私有化和混合检索。
      **决策方法**：准备几百条真实问题和应命中片段的标注集，分别测试候选模型在不同维度下的召回率，同时估算存储和费用，用数据决定，而不是只看维度或公开榜单。
      **更换模型**：不同模型向量空间不可比，所以必须对全部文档重新向量化并重建索引，查询侧同步切换。流程：向量记录保存模型名和维度；新建索引后台全量重建；用评估集对比新旧索引；切换读流量并保留旧索引一段时间用于回滚；重新校准相似度阈值。
    oral: |
      我选 Embedding 模型主要看五点：中文效果、能不能私有化、成本、最大输入长度、维度带来的存储成本。比如能用云 API 就考虑 OpenAI 的 3-small 或 3-large，large 默认 3072 维还能用 dimensions 参数缩短；必须私有化就考虑 BGE-M3，1024 维、最长 8192 Token，还带稀疏向量方便做混合检索。最后一定用自己的标注集测召回率来定。
      换模型的关键是：向量空间不可比，必须全量重建。我在制造企业项目里做过迁移，因为入库时存了模型名和维度，我们新建索引后台重算，用 300 条标注问题对比，确认更好再切流量，旧索引留两周回滚，线上没受影响。
  - id: d14-i4
    kp: d14-k4
    type: oral
    difficulty: 3
    question: 向量检索经常召回「看起来相关但答非所问」的内容，你认为原因是什么？有哪些手段可以改进？
    key_points:
      - {text: "说明 Embedding 压缩整体语义，衡量话题接近而非能否回答", dim: principle}
      - {text: "举出典型失败：否定词、编号型号、版本时间、权限等业务条件", dim: concept}
      - {text: "给出改进：混合检索、Metadata 过滤、Rerank、Query 改写", dim: engineering}
      - {text: "说明用标注评估集量化检索效果并回归", dim: engineering}
      - {text: "结合项目说明改进效果", dim: project}
    reference: |
      **原因**：Embedding 把一整段文本压缩成一个向量，反映的是整体话题和语义倾向，相似度衡量的是「像不像」，而不是「能不能回答」。
      典型失败：否定词（支持 / 不支持退款）对向量影响很小；编号、型号、金额这类精确值在语义上几乎无差别；版本、时间、权限等业务条件向量完全感知不到；切片过大时向量被稀释，「什么都像一点」。
      **改进手段**：
      1. 混合检索：向量检索 + 关键词检索（BM25 或稀疏向量），兼顾语义和精确匹配；
      2. Metadata 过滤：按版本、生效日期、部门、权限过滤；
      3. Rerank：用重排模型对问题和候选片段逐对打分；
      4. Query 改写：把口语化或含指代的问题改写成适合检索的形式；
      5. 调整切片大小，让每个切片主题单一。
      **评估**：建立包含否定、编号、版本类问题的标注集，用召回率等指标衡量每次调整。
    oral: |
      我认为根本原因是 Embedding 衡量的是「话题像不像」，而不是「能不能回答」。它把整段文本压成一个向量，所以否定词、型号编号、版本时间这些对业务很关键的细节，它基本感知不到。
      我在设备维修手册项目里就遇到过，搜 E-302 报警，返回的是 E-301、E-305 的步骤。后来改成混合检索：故障码用正则识别走关键词精确匹配，语义部分走向量，合并后再 Rerank，故障码类问题命中率大幅提升。
      其他手段还有 Metadata 过滤版本和权限、Query 改写。每次调整我都会用包含这些难例的标注集回归。
  - id: d14-i5
    kp: d14-k3
    type: design
    difficulty: 4
    question: 公司知识库已有 200 万个文档切片，使用模型 A 的向量。现在要升级到效果更好的模型 B，要求迁移过程中问答服务不中断、出问题能快速回滚。请设计迁移方案。
    key_points:
      - {text: "明确约束：模型 A 与 B 向量不可混用，必须全量重新向量化", dim: principle}
      - {text: "设计双索引：新建 B 索引，后台分批重算，记录进度并支持断点续跑", dim: engineering}
      - {text: "处理迁移期间的新增和修改：双写到 A 与 B 两套索引", dim: engineering}
      - {text: "切换前用评估集对比召回率与延迟，重新校准阈值，并用灰度切流量", dim: project}
      - {text: "保留 A 索引用于回滚，确认稳定后下线，并估算重算成本和时间", dim: engineering}
    reference: |
      **核心约束**：A 和 B 的向量空间不可比，不能「新文档用 B、老文档用 A」，必须对全部 200 万切片用 B 重新向量化，查询侧也必须与索引使用同一模型。
      **方案**：
      1. **准备**：向量记录增加 `embedding_model`、`dimensions` 字段；配置中支持按索引指定模型。估算重算成本（Token 量 × 单价或 GPU 时间）和耗时。
      2. **建新索引**：新建 B 索引，后台任务分批读取切片原文调用模型 B（控制并发、处理限流、失败重试），记录进度以支持断点续跑。
      3. **双写**：迁移期间新增或修改的文档同时写入 A、B 两套索引，避免重算完成后 B 缺数据。
      4. **评估**：B 索引全量完成后，用标注评估集对比两套索引的召回率、Top-K 命中、检索延迟；重新校准相似度阈值和 Rerank 配置。
      5. **灰度切换**：按比例把查询流量切到 B（如 5% → 50% → 100%），监控答案质量反馈、拒答率、延迟。
      6. **回滚与下线**：出现问题时一键切回 A；稳定运行一段时间后停止双写并下线 A 索引，释放存储。
    oral: |
      首先要明确一个约束：A 和 B 的向量不能混用，200 万切片必须全部用 B 重算，查询也必须同步切换。
      我的方案是双索引。先给向量记录加上模型名和维度字段，新建 B 索引，后台分批重算，控制并发、处理限流、记录进度可以断点续跑。迁移期间的新增和修改双写两套索引。重算完后用标注集对比召回率和延迟，重新校准阈值，然后按 5%、50%、100% 灰度切流量，出问题一键切回 A，稳定后再下线 A。
      这套流程我在制造企业知识库项目里实际跑过，整个过程线上问答没有受影响。
