day: 30
phase: 3
title: RAG 综合架构：企业知识库的完整设计、权限隔离、数据更新与性能
goals:
  - 能画出并讲清企业知识库的完整架构：离线入库、在线问答、管理与评估三条链路
  - 能设计多租户与用户级权限隔离方案，说明为什么必须在检索层过滤而不能依赖 Prompt
  - 能设计文档新增、更新、删除的增量同步与版本切换机制
  - 能分析 RAG 延迟与成本构成并给出缓存与优化方案，能按链路系统地定位幻觉根因
knowledge_points:
  - id: d30-k1
    name: 企业知识库的完整架构
    level: P0
    summary: 三条链路：离线入库（解析切片向量化）、在线问答（改写检索精排生成）、治理闭环（权限同步评估监控）
    why: |
      Day 21~29 分别讲了 RAG 的每个零件，但企业项目和面试考的是**把零件装成一台能长期运行的机器**：
      数据怎么进来、权限怎么跟着走、文档变了怎么办、效果怎么持续变好。「请画一下你们的 RAG 架构」几乎是 RAG 岗位面试的必答题。
    problem: |
      - Demo 版 RAG 只有「上传 → 切片 → 检索 → 生成」，上线后马上遇到：文档天天更新、不同人能看的不一样、回答越来越慢、出错了不知道是哪一环。
      - 没有统一架构时，入库脚本、问答接口、权限系统各自为政，任何一处改动都可能引入越权或数据不一致。
    principle: |
      **一、整体架构**

      ```mermaid
      flowchart TB
        subgraph ING["离线入库链路"]
          S1["数据源 网盘 Wiki OA 上传"] --> S2["连接器 增量拉取 带 ACL"]
          S2 --> S3["任务队列"]
          S3 --> S4["解析 清洗 切片"]
          S4 --> S5["Embedding 批量"]
          S5 --> S6[("PostgreSQL 文档 版本 chunk 向量 全文索引 ACL")]
        end
        subgraph QA["在线问答链路"]
          U["用户"] --> G["网关 鉴权 限流"]
          G --> A["问答服务"]
          A --> R1["Query Rewrite"]
          R1 --> R2["混合检索 带权限与版本过滤"]
          S6 --> R2
          R2 --> R3["Rerank 与阈值"]
          R3 --> R4["Prompt 组装 引用映射"]
          R4 --> L["LLM 流式生成"]
          L --> U
        end
        subgraph GOV["治理闭环"]
          M1["问答日志与追踪"] --> M2["评估集与回归"]
          M3["用户反馈"] --> M2
          M2 --> M4["调参 改切片 换模型"]
        end
        A --> M1
      ```

      **二、离线入库链路**（Day 22~25）

      - **连接器**：从各数据源增量拉取文档和**原始权限（ACL）**，记录来源 ID、修改时间、内容哈希。
      - **异步任务**：解析、切片、向量化耗时长，必须走队列（Day 42），不能阻塞上传接口；任务要幂等、可重试，有失败状态。
      - **存储**：documents（文档与版本、状态、ACL）、chunks（正文、向量、tsvector、出处元数据、tenant_id、allowed_groups、doc_version）。用 PostgreSQL + pgvector 时，业务数据、权限和向量在同一个库，可以在一个事务里完成版本切换。

      **三、在线问答链路**（Day 26~28）

      鉴权 → 多轮改写 → 由服务端身份生成过滤条件 → 混合检索（两路共用过滤）→ RRF → Rerank → 阈值拒答 → 按 Token 预算组装 Prompt 并生成引用映射 → 流式生成 → 解析校验引用 → 记录追踪日志。

      **四、治理闭环**（Day 29）

      - **追踪日志**：每次请求记录原问题、改写结果、过滤条件、各路名次与分数、送入的 chunk id、Prompt 版本、模型版本、引用、耗时与 Token。这是排查一切问题的基础。
      - **评估与回归**：分层评估集 + 基线 + 每次改动回归。
      - **反馈回流**：点踩、拒答、无效引用样本进入评估集。

      **五、关键架构决策**

      | 决策 | 常见选择 | 依据 |
      |---|---|---|
      | 向量库 | PostgreSQL + pgvector；数据量或 QPS 很大时独立向量库 | 规模、团队运维能力、是否需要与业务数据事务一致 |
      | 关键词检索 | PG 全文检索 / BM25 扩展；或 Elasticsearch | 中文分词、排序质量、运维成本 |
      | Rerank | 自部署开源模型 / 托管 API | 数据是否可出域、延迟、GPU |
      | 生成模型 | 按任务路由大小模型 | 效果、成本、合规 |
      | 权限 | 检索层过滤 + 数据库 RLS 兜底 | 安全边界不能依赖模型 |

      **六、架构演进**：先把上述「普通 RAG」做扎实并有评估；评估证明多跳或全局性问题占比高时，再引入 Agentic RAG 或 GraphRAG（Day 27），而不是一开始就上复杂方案。
    scenarios: |
      - **集团制度问答**：多个子公司（租户），每个子公司内部再按部门授权，文档来自 OA 与网盘，每天增量同步。
      - **SaaS 知识库产品**：成百上千个客户各自上传文档，严格隔离，按客户套餐限制容量和 QPS。
      - **客服知识库**：FAQ 频繁更新，要求更新后几分钟内生效，高并发、低延迟。
    pitfalls: |
      - **入库同步执行**：上传大文件时接口超时，失败也无法重试。
      - **没有追踪日志**：用户说「答错了」，无法复现当时检索到了什么。
      - **权限只在前端或 Prompt 中处理**：检索层不过滤，就一定会泄露。
      - **一开始就上 GraphRAG / 多 Agent**：复杂度高、成本高，基础指标反而没有做好。
      - **向量和业务数据分库却没有一致性设计**：文档删除了，向量还在。
    interview_asks:
      - 请画一下你们企业知识库的整体架构，并讲讲数据是怎么流动的。
      - 为什么选择 PostgreSQL + pgvector 而不是专门的向量数据库？
      - 你们的 RAG 系统出问题时怎么排查？有哪些日志？
    project_example: |
      在一个约 5000 人集团的制度知识库项目中，架构为：OA 与网盘连接器每 10 分钟增量拉取文档和 ACL，经 Redis 队列交给入库 Worker，
      在 PostgreSQL 16（pgvector + pg_jieba）中保存文档版本、chunk、向量与全文索引；在线链路为 FastAPI 问答服务，改写 → 带权限过滤的混合检索 → 自部署 Rerank → 流式生成。
      每次请求写入一条追踪记录，评估集 400 余条，每次发版回归。上线半年，P95 首字延迟约 1.6 秒，越权事件为 0，回答正确率从首版 0.74 提升到 0.89。
  - id: d30-k2
    name: 多租户与权限隔离
    level: P0
    summary: 权限在检索层用服务端身份过滤，再用数据库行级安全兜底；缓存、日志、引用链接都要带权限范围
    why: |
      企业知识库最严重的事故不是答错，而是**越权**：普通员工看到了薪酬明细、A 客户看到了 B 客户的合同。
      这是安全、合规乃至法律问题，也是企业客户最先问的问题。面试官问「多租户怎么隔离」，就是在考你有没有安全边界意识。
    problem: |
      - 同一个向量库里存放多个租户、多个部门的数据，检索时稍不注意就会混入不该看到的内容。
      - 用户的权限会变化（调岗、离职），文档的可见范围也会变化，权限数据需要同步。
      - 除了检索结果，还有很多「旁路」会泄露数据：缓存、日志、引用跳转、历史会话、评估数据导出。
    principle: |
      **一、两层权限模型**

      - **租户隔离**（硬隔离）：不同公司/客户之间的数据绝不能互通。
      - **租户内授权**（细粒度）：同一公司内按部门、角色、项目组决定可见范围，通常用文档级 ACL，chunk 继承所属文档的 ACL。

      **二、为什么必须在检索层过滤，而不能靠 Prompt**

      - Prompt 是概率性的「请求」，不是强制约束；模型可能不遵守，也可能被提示注入绕过。
      - 一旦无权数据进入上下文，它就可能出现在回答、引用、摘要中，也已经流经日志、缓存和 Rerank 服务。
      - 安全边界必须是**确定性的代码和数据库约束**：没有权限的数据从一开始就不被读出来。

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant GW as 网关
        participant SVC as 问答服务
        participant IAM as 身份与权限服务
        participant DB as PostgreSQL
        U->>GW: 携带令牌提问
        GW->>SVC: 校验令牌 解析出租户和用户
        SVC->>IAM: 查询用户当前所属组
        IAM-->>SVC: 组列表
        SVC->>DB: 开启事务 设置当前租户 执行检索 WHERE 租户 且 组有交集 且 生效版本
        DB-->>SVC: 只返回有权限的 chunk
        SVC-->>U: 回答与引用 引用链接再次鉴权
      ```

      **三、实现要点**

      1. **过滤条件只来自服务端身份**：tenant_id、用户组从令牌和权限服务获得，**绝不**使用请求参数里的 tenant_id，也不使用 LLM 抽取的结果。
      2. **在 SQL 中前置过滤**：`WHERE tenant_id = :tid AND allowed_groups && :groups AND status = 'active'`；allowed_groups 建 GIN 索引；向量路、关键词路共用同一个过滤构造函数（Day 26、27）。
      3. **数据库行级安全（RLS）兜底**：

      ```sql
      ALTER TABLE chunks ENABLE ROW LEVEL SECURITY;
      CREATE POLICY tenant_isolation ON chunks
        USING (tenant_id = current_setting('app.tenant_id')::bigint);
      -- 每个事务开头：SET LOCAL app.tenant_id = '42';
      ```
      应用代码忘了加租户条件时，RLS 仍能挡住跨租户读取。使用连接池时必须用 `SET LOCAL`（事务级），否则设置会残留到下一个使用该连接的请求。应用连接所用的数据库角色不能是表的所有者或超级用户，否则默认不受 RLS 约束。

      4. **隔离级别选择**：

      | 方案 | 隔离强度 | 成本 | 适用 |
      |---|---|---|---|
      | 共享表 + tenant_id 过滤 + RLS | 中 | 低 | 大量中小租户 |
      | 按租户分区 / 独立 schema | 较高 | 中 | 租户数据量差异大，需要独立索引 |
      | 独立数据库 / 实例 | 高 | 高 | 金融、政务等强合规大客户 |

      共享索引时还要注意：BM25 的 IDF 等**语料统计量**是全表计算的，有第三方测试显示其他租户的数据会影响本租户的得分，理论上可被用来推测其他租户是否含某个词；强合规场景应使用按租户隔离的索引。

      5. **旁路同样要带权限**：缓存键包含租户与权限范围；日志脱敏且按租户隔离访问；引用跳转和文档预览接口**再次鉴权**；共享会话链接不能把原用户可见的引用展示给无权限的人。

      6. **权限变化**：授权给组而不是个人；员工调岗只改「用户-组」关系，查询时实时获取；文档 ACL 变化时由同步任务更新该文档全部 chunk 的 allowed_groups（无需重新向量化），并使相关缓存失效。
    scenarios: |
      - **SaaS 多客户**：共享集群 + tenant_id + RLS，头部金融客户单独实例。
      - **集团内多子公司**：company_id 硬隔离，子公司内部按部门组授权。
      - **项目制咨询公司**：项目文档只对项目组可见，项目结束后自动收回权限。
    code: |
      ```python
      def build_acl_filter(user) -> tuple[str, dict]:
          # 唯一的过滤构造入口：向量路、关键词路、文档预览都调用它
          sql = "tenant_id = %(tid)s AND allowed_groups && %(groups)s AND status = 'active'"
          return sql, {"tid": user.tenant_id, "groups": list(user.groups)}  # 均来自服务端令牌与权限服务
      ```
    pitfalls: |
      - **误区：在 System Prompt 里写「不要透露无权内容」就够了。** Prompt 不是安全边界。
      - **检索后再过滤**：结果被筛光，且无权数据已经出库（Day 27）。
      - **使用请求体里的 tenant_id**：攻击者改个参数就能跨租户。
      - **缓存键不含权限范围**：A 的结果被缓存后直接返回给 B。
      - **RLS 配合连接池使用 SET 而非 SET LOCAL**：租户设置残留到其他请求。
      - **引用链接不鉴权**：拿到 doc_id 就能直接打开原文。
      - **只隔离检索，不隔离日志和评估导出**：运维和数据分析成为泄露渠道。
    interview_asks:
      - 多租户知识库怎么做数据隔离？为什么不能靠 Prompt 控制权限？
      - 员工调岗或离职后，权限怎么及时生效？
      - 除了检索结果，还有哪些地方可能泄露数据？
    project_example: |
      某 SaaS 知识库上线安全评审时，渗透测试发现：两个租户用同样的问题提问，第二个租户会命中第一个租户的缓存结果——缓存键只包含问题和知识库 ID。
      修复方案：缓存键加入 tenant_id 与「权限范围哈希」（用户组排序后哈希）；检索 SQL 统一走过滤构造函数；chunks 表启用 RLS，
      并用 `SET LOCAL app.tenant_id` 设置租户；文档预览接口二次鉴权。之后在 CI 中加入跨租户、跨部门越权测试用例，每次发版必跑。
    freshness: |
      核对于 2026-11：PostgreSQL 行级安全（CREATE POLICY / ENABLE ROW LEVEL SECURITY）为长期稳定特性；表所有者和超级用户默认绕过 RLS（可用 FORCE ROW LEVEL SECURITY 让所有者也受约束），以官方文档为准。
      BM25 语料统计跨租户影响得分的现象来自第三方对 pg_search 与 pg_textsearch 的测试报告，不同实现可能不同，强合规场景应自行验证。
    sources:
      - {title: "PostgreSQL Docs - Row Security Policies", url: "https://www.postgresql.org/docs/current/ddl-rowsecurity.html"}
      - {title: "pg_search vs pg_textsearch 第三方测评（含 RLS 与 BM25 统计量观察）", url: "https://particula.tech/blog/pg-search-vs-pg-textsearch-bm25-postgres"}
  - id: d30-k3
    name: 文档增量同步、删除与版本管理
    level: P0
    summary: 用内容哈希判断变更，新版本完整入库后在一个事务里切换生效，删除先软删立即不可检索再异步清理
    why: |
      企业文档每天都在变：制度修订、FAQ 更新、文件删除。如果知识库不能及时、正确地同步，就会出现「回答引用已废止制度」「删除的敏感文件还能被搜到」这类严重问题。
      面试中「文档更新了怎么办」「删除怎么保证彻底」是考察工程深度的经典问题。
    problem: |
      - 每次全量重建索引成本高、耗时长，大知识库可能要几个小时。
      - 更新过程中如果先删旧再写新，中间时段用户查不到；如果先写新再删旧，中间时段新旧两版同时被检索到。
      - 删除不彻底：原文件删了，但 chunk、向量、全文索引、缓存、派生摘要都还在。
      - 入库任务失败或重复执行，导致数据重复或缺失。
    principle: |
      **一、变更检测**

      - 数据源支持事件（Webhook、消息）时用事件驱动；否则定时扫描「修改时间 + 内容哈希」。
      - 文档级哈希不变 → 跳过；变化 → 生成新版本。chunk 级哈希可用于只重新向量化变化的片段（前提是切片规则稳定）。
      - 只有 ACL 变化 → 只更新权限元数据，不重新向量化。

      **二、文档状态机**

      ```mermaid
      stateDiagram-v2
        state "待处理" as Pending
        state "解析切片中" as Parsing
        state "向量化中" as Embedding
        state "已就绪 未生效" as Ready
        state "生效中" as Active
        state "已被新版本替代" as Superseded
        state "已软删除" as Deleted
        state "失败" as Failed
        [*] --> Pending
        Pending --> Parsing
        Parsing --> Embedding
        Embedding --> Ready
        Ready --> Active: 事务内切换生效版本
        Active --> Superseded: 新版本生效
        Active --> Deleted: 源文件删除
        Parsing --> Failed
        Embedding --> Failed
        Failed --> Pending: 重试
        Superseded --> [*]: 保留期后物理清理
        Deleted --> [*]: 异步清理向量 索引 缓存
      ```

      **三、版本切换（避免中间态）**

      1. 新版本的 chunk 以 `status='ready'` 完整写入（此时不可检索）。
      2. 在**一个数据库事务**里：新版本 chunk 改为 active、旧版本改为 superseded（或更新 documents 表的 active_version 指针，检索时 JOIN 过滤）。
      3. 使与该文档相关的缓存失效。
      4. 旧版本保留一段时间（便于历史会话的引用回看、回滚），之后物理删除。

      这就是向量库与业务库放在同一个 PostgreSQL 中的一个优势：版本切换可以是原子的。如果向量存放在独立系统，就需要「先写新、再切别名/指针、后删旧」并处理两边不一致的补偿逻辑。

      **四、删除**

      - **先软删**：立即把文档及其 chunk 标记为 deleted，检索过滤条件中排除，**秒级生效**。
      - **再硬删**：异步清理向量、全文索引条目、缓存、派生数据（摘要、问答对、GraphRAG 图谱等）。
      - **合规删除**：涉及个人信息或要求「彻底删除」的数据，还要覆盖问答日志、评估集、备份的保留策略。

      **五、任务可靠性**

      - 任务以 (doc_id, version) 为幂等键，重复执行不会产生重复数据。
      - 失败重试有上限，超过进入死信队列并告警。
      - 记录每个阶段的耗时和失败原因，前端展示「解析失败：PDF 加密」等可读状态。

      **六、Embedding 模型升级**：新旧模型的向量不可混用（Day 24），需要全量重建：新建一列或一张新表做「影子索引」，后台全量向量化，评估集验证后切换读路径，再删除旧向量。
    scenarios: |
      - **制度修订**：新版制度发布后 10 分钟内生效，旧版保留 30 天供历史会话引用回看。
      - **误传敏感文件**：管理员删除后立即不可检索，后台清理任务在 1 小时内完成向量与缓存清理。
      - **更换 Embedding 模型**：影子索引全量重建一周，评估通过后切换。
    pitfalls: |
      - **先删旧再写新**：中间时段用户查不到任何内容。
      - **先写新但不切换状态**：新旧版本同时被检索，回答自相矛盾。
      - **删除只删原文件**：chunk 和向量仍可被检索。
      - **忘记清缓存**：更新后用户仍看到旧答案。
      - **任务不幂等**：重试导致 chunk 重复，检索结果出现大量重复片段。
      - **新旧 Embedding 模型的向量混在同一个索引里**：相似度失去意义。
    interview_asks:
      - 知识库里的文档更新了，你们怎么同步？会不会出现新旧版本同时被检索到？
      - 文档删除怎么保证彻底？
      - 换 Embedding 模型要怎么做？
    project_example: |
      某制度知识库早期每晚全量重建索引，耗时 3 小时，白天修订的制度第二天才生效，且重建期间检索结果不稳定。
      改为增量同步：连接器每 10 分钟按修改时间 + 内容哈希检测变更，新版本 chunk 以 ready 状态写入，在同一事务中切换 documents.active_version，
      删除走「软删立即生效 + 异步清理」。生效延迟降到 15 分钟以内，评估集中「旧版本被引用」的问题从 9 条降到 0。
  - id: d30-k4
    name: 性能优化、缓存与成本
    level: P1
    summary: 延迟大头在 LLM，先流式降首字延迟、再并行和裁剪步骤；缓存要带权限范围和知识库版本
    why: |
      RAG 一次问答要串联改写、检索、Rerank、生成多个步骤，很容易做到 5~10 秒，用户体验很差；Token 成本也会随用户量线性增长。
      性能和成本是 RAG 能否从试点推广到全员的关键，也是架构面试中必问的「非功能性需求」。
    problem: |
      - 用户感知的等待时间太长，尤其是首字出现之前。
      - 多个外部调用（LLM、Rerank、Embedding）串行，任何一个慢都拖累整体。
      - 高频重复问题每次都完整走一遍，浪费成本。
      - 缓存设计不当会返回旧答案，甚至造成越权。
    principle: |
      **一、延迟构成（数量级，需实测）**

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant S as 问答服务
        participant RW as 改写模型
        participant DB as 检索
        participant RR as Rerank
        participant L as 生成模型
        U->>S: 提问
        S->>RW: 多轮时改写 约几百毫秒
        RW-->>S: 独立问题
        S->>DB: 问题向量化加混合检索 几十毫秒
        DB-->>S: 候选
        S->>RR: 精排 几十到几百毫秒
        RR-->>S: 前几条
        S->>L: Prompt
        L-->>U: 首字 通常零点几秒到数秒 之后流式输出
      ```

      **二、优化手段（按性价比）**

      1. **流式输出**（Day 17、43）：总时长不变，但首字延迟（TTFT）决定体验。
      2. **减少串行步骤**：首轮完整问题跳过改写；向量与关键词检索、多查询**并发**；Rerank 设超时降级。
      3. **缩短输入**：控制资料预算（Day 28）、历史摘要，输入 Token 越少首字越快、成本越低。
      4. **模型路由**：改写、分类用小模型；复杂问题才用大模型。
      5. **提示缓存**：固定的 system 前缀放最前，利用模型服务商的 prompt caching 降低成本和首字延迟。
      6. **检索层调优**：HNSW 参数、iterative scan、过滤索引（Day 25~27）、连接池。
      7. **入库与在线隔离**：入库 Worker 独立部署，批量向量化不抢占在线资源。

      **三、缓存分层**

      | 缓存 | 键 | 风险与注意 |
      |---|---|---|
      | 问题向量缓存 | 规范化问题文本 + Embedding 模型版本 | 换模型要失效 |
      | 检索结果缓存 | 问题 + **租户 + 权限范围** + 知识库版本 | 不含权限范围会越权；文档更新要失效 |
      | 答案缓存（精确匹配） | 规范化问题 + 权限范围 + 知识库版本 + Prompt 版本 | 适合高频 FAQ |
      | 语义缓存（相似问题复用答案） | 问题向量相似度 | 「年假几天」和「病假几天」可能很相似却答案不同；需要高阈值和权限隔离，慎用 |

      **知识库版本**：每个知识库维护一个版本号，任何文档变更时递增，缓存键包含它，文档更新后旧缓存自然失效。

      **四、成本**：成本主要来自生成模型的输入 Token（资料 + 历史）。控制手段：资料预算、阈值拒答（不调用模型）、模型路由、提示缓存、答案缓存；按租户统计 Token 用量并设置配额。
    scenarios: |
      - **客服高峰**：FAQ 答案缓存命中率 40%，大幅降低 LLM 调用量。
      - **全员推广**：按部门统计 Token 成本，对简单问题路由到小模型。
      - **低延迟要求**：P95 首字 < 2 秒，改写只在多轮时启用，Rerank 超时 300ms 降级。
    pitfalls: |
      - **缓存键不含权限范围或租户**：直接造成越权。
      - **文档更新不失效缓存**：返回旧答案。
      - **语义缓存阈值过低**：把相似但不同的问题当成同一个。
      - **只优化总时长不做流式**：用户感知改善不明显。
      - **所有步骤都用最大的模型**：成本和延迟都偏高。
    interview_asks:
      - 你们的 RAG 一次问答多久？延迟主要花在哪里？怎么优化？
      - RAG 系统里可以缓存什么？缓存要注意什么？
    project_example: |
      某内部助手首版平均总耗时 7.8 秒、首字 4.5 秒。通过流式输出、首轮跳过改写、两路检索并发、Rerank 候选从 100 降到 40、
      资料预算从 8000 降到 3000 Token，首字 P95 降到 1.7 秒；再对 Top 200 高频问题做答案缓存（键含租户、权限范围哈希和知识库版本），
      LLM 调用量下降约 30%。
  - id: d30-k5
    name: RAG 幻觉的根因分析
    level: P1
    summary: 幻觉不只是模型的问题；沿着数据、切片、召回、排序、组装、生成逐层排查，用追踪日志定位
    why: |
      「RAG 还是会胡说八道，怎么办？」是 RAG 面试的终极问题。只回答「改 Prompt」「换大模型」说明没有系统思维；
      能按链路逐层归因、给出每层的证据和对策，才体现工程能力。这也是 Day 21~29 知识的综合运用。
    problem: |
      - 用户只看到「答错了」，但错误可能发生在数据、切片、检索、排序、组装、生成任意一环。
      - 不同根因的修复方法完全不同，盲目改 Prompt 可能毫无作用。
    principle: |
      **一、按链路归因**

      ```mermaid
      flowchart TB
        E["一条错误回答"] --> T["取出追踪日志 还原检索与 Prompt"]
        T --> D1{"知识库里有正确且最新的资料吗"}
        D1 -->|没有或过期冲突| F1["数据问题 补文档 版本治理"]
        D1 -->|有| D2{"资料被正确解析和切片了吗"}
        D2 -->|否| F2["解析切片问题 表格丢失 答案被切断"]
        D2 -->|是| D3{"正确片段在召回候选里吗"}
        D3 -->|否| F3["召回问题 混合检索 改写 过滤条件"]
        D3 -->|是| D4{"正确片段进入了 Prompt 吗"}
        D4 -->|否| F4["排序或预算问题 Rerank 预算 去重"]
        D4 -->|是| D5{"回答与资料一致吗"}
        D5 -->|否| F5["生成问题 规则 模型 温度 引用校验"]
        D5 -->|是| F6["问题理解或期望不一致 澄清 拒答策略"]
      ```

      **二、每层的典型表现与对策**

      | 层 | 典型表现 | 对策 |
      |---|---|---|
      | 数据 | 引用了废止制度；两份文件互相矛盾 | 版本与生效状态治理、冲突提示 |
      | 解析/切片 | 表格数字错位；条件和结论被切到两个 chunk | 改解析器、按结构切片、父子块（Day 22、23） |
      | 召回 | 编号类、追问类问题找不到 | 混合检索、Query Rewrite、检查过滤（Day 26、27） |
      | 排序/组装 | 正确片段排第 12 没进 Prompt；引用编号错位 | Rerank、预算、去重、编号映射测试（Day 27、28） |
      | 生成 | 资料没有的金额被编出来；过度概括 | 「只依据资料」规则、阈值拒答、低温度、引用校验（Day 28） |
      | 问题 | 问题有歧义；超出知识库范围 | 澄清提问、明确拒答 |

      **三、度量与闭环**：用 Context Recall / Recall@K 判断检索层，用 Faithfulness 判断生成层（Day 29）；每个坏例标注根因类别，统计各类占比，**优先修复占比最高的一层**；修复后加入评估集回归。

      **四、关于「换更强的模型」**：只能改善生成层的一部分问题；对数据过期、召回失败、权限错误毫无帮助，且成本更高。
    scenarios: |
      - **周度质量复盘**：抽取 50 条点踩样本，逐条标注根因层级，形成占比图，决定下周优化方向。
      - **重大投诉处理**：通过请求 ID 还原当时的检索结果和 Prompt，确认是数据问题还是模型问题，给业务方明确答复。
    pitfalls: |
      - **一出问题就改 Prompt 或换模型**：多数情况下根因在数据和检索。
      - **没有追踪日志**：无法还原现场，只能猜。
      - **只看单个案例**：不统计根因分布，容易优化错方向。
      - **把 Faithfulness 高当作没有幻觉问题**：资料错了，忠实复述也是错答。
    interview_asks:
      - RAG 系统还是会产生幻觉，你怎么排查和解决？
      - 换一个更强的模型能解决 RAG 幻觉吗？
    project_example: |
      某制度助手上线一个月后对 120 条点踩样本做根因标注：数据过期或冲突 31%、解析切片 18%、召回失败 24%、排序与组装 12%、生成编造 10%、问题歧义 5%。
      团队原本计划换更大的生成模型，但统计显示生成层只占 10%。于是优先做了版本治理和混合检索，两周后点踩率下降约 45%；
      最后才针对生成层增加阈值拒答和引用校验。
quiz:
  - id: d30-q1
    kp: d30-k2
    type: single
    question: 在多租户企业知识库中，关于权限控制的落点，下列做法最合理的是？
    options:
      - "在 System Prompt 中写明「只能回答当前用户有权限查看的内容」，由模型判断"
      - "检索时用服务端从令牌解析出的租户和用户组在 SQL 中前置过滤，并启用数据库行级安全兜底"
      - "前端请求中带上 tenant_id 和 groups，后端据此在 SQL 中过滤"
      - "全库检索 Top-20 后，在应用层按用户权限筛掉无权片段再送给模型"
    answer: [1]
    explain: |
      B 让安全边界落在确定性的代码与数据库约束上，过滤条件来自可信的服务端身份，RLS 防止代码遗漏。
      A 把安全交给概率性的模型，可能被忽略或被提示注入绕过；C 的过滤条件来自客户端，用户改参数即可越权；D 是后置过滤，结果可能被筛光，且无权数据已被读取，可能进入日志、缓存或 Rerank 服务。
  - id: d30-q2
    kp: d30-k3
    type: judge
    question: 管理员在知识库后台删除一份敏感文档时，只要删除原始文件和 documents 表中的记录，这份文档的内容就不会再出现在任何回答中。
    answer: false
    explain: |
      文档内容还存在于 chunks 表（正文、向量、全文索引）、检索与答案缓存、派生数据（摘要、问答对、图谱）中，甚至在问答日志和评估集里。
      正确做法是先把文档及其所有 chunk 软删并从检索中排除（立即生效），再异步清理向量、索引、缓存和派生数据，并按合规要求处理日志与备份。
  - id: d30-q3
    kp: d30-k4
    type: multi
    question: 为企业知识库设计「检索结果缓存」时，缓存键中应包含哪些信息？
    options:
      - "规范化后的问题文本"
      - "租户 ID 与用户权限范围（如排序后用户组的哈希）"
      - "知识库版本号（任何文档变更都会递增）"
      - "用户在前端传入的 top_k 参数，且只要包含它就不需要权限信息"
      - "检索配置版本（如 Embedding 模型版本、过滤规则版本）"
    answer: [0, 1, 2, 4]
    explain: |
      问题文本决定查询内容；租户与权限范围保证不同权限的人不会共享结果（否则越权）；知识库版本让文档更新后旧缓存自然失效；检索配置版本保证换模型或改规则后不复用旧结果。
      D 错在后半句：top_k 可以作为键的一部分，但绝不能替代权限信息，缺少权限范围的缓存会把有权用户的结果返回给无权用户。
  - id: d30-q4
    kp: d30-k3
    type: single
    question: 一份制度文档发布了新版本。以下哪种更新流程能避免「新旧版本同时被检索到」和「中间时段查不到」两个问题？
    options:
      - "先删除旧版本所有 chunk，再解析写入新版本 chunk"
      - "直接写入新版本 chunk（立即可检索），等写完后再删除旧版本"
      - "新版本 chunk 以不可检索的 ready 状态完整写入，然后在一个数据库事务中把新版本设为生效、旧版本设为已替代，并使相关缓存失效"
      - "每晚全量重建整个索引，白天不做任何更新"
    answer: [2]
    explain: |
      C 先完整准备好新版本但不暴露，再原子切换，任何时刻只有一个版本生效，切换后清理缓存。
      A 在删除与写入之间存在查不到的窗口，且写入失败时连旧版本都没了；B 在写入期间新旧版本同时可检索，回答可能自相矛盾；D 生效延迟长达一天，且重建期间结果不稳定。
  - id: d30-q5
    kp: d30-k2
    type: scenario
    question: |
      某 SaaS 知识库的检索服务上线后，安全测试发现：租户 B 的用户提交 `{"kb_id": 1001, "query": "年度预算"}`（1001 是租户 A 的知识库），竟然拿到了租户 A 的内容。
      日志显示这次请求命中了缓存，缓存键是 hash(kb_id + query)，而检索代码本身会按用户租户过滤。请分析漏洞成因，并给出完整修复方案。
    key_points:
      - {text: "指出缓存键不含租户与权限范围，A 的过滤后结果被缓存后直接返回给 B", dim: principle}
      - {text: "指出 kb_id 来自请求且未校验该知识库是否属于当前租户", dim: engineering}
      - {text: "修复：缓存键加入租户和权限范围哈希及知识库版本，读缓存前先做鉴权", dim: engineering}
      - {text: "修复：检索层前置过滤加 RLS 兜底，引用与预览接口二次鉴权", dim: engineering}
      - {text: "补充跨租户越权自动化测试并排查历史日志评估影响范围", dim: project}
    reference: |
      **成因**：
      1. 租户 A 的用户先查询「年度预算」，检索层按 A 的身份过滤后得到结果，以 hash(1001 + 年度预算) 为键写入缓存。
      2. 租户 B 的用户构造了相同的 kb_id 和问题，服务**先查缓存**，命中后直接返回，根本没有执行检索层的租户过滤。
      3. 服务也没有校验 kb_id=1001 是否属于当前租户——过滤只在检索 SQL 里，而缓存绕过了它。
      **修复**：
      - 请求进入后先鉴权：校验 kb_id 属于当前用户的租户且用户有权访问，否则 403；
      - 缓存键包含 tenant_id、权限范围哈希（用户组排序后哈希）、kb_id、知识库版本号和规范化问题；
      - 检索 SQL 统一使用服务端身份构造的过滤条件，并启用 RLS 兜底；
      - 引用跳转、文档预览接口再次鉴权；
      - 增加自动化越权测试（跨租户、跨部门、构造他人 kb_id）；
      - 排查历史日志中缓存命中但租户不一致的请求，评估泄露范围并按安全流程上报。
    followup:
      question: 为什么不建议干脆按用户 ID 做缓存键来解决这个问题？
      key_points:
        - "按用户缓存命中率极低，失去缓存意义"
        - "权限范围相同的用户可以安全共享，用权限范围哈希更合适"
      reference: 按用户 ID 做键虽然安全，但每个人的缓存只能自己用，命中率极低，缓存几乎失去意义。真正决定可见结果的是「租户 + 权限范围」，组成相同的用户看到的结果相同，用权限范围哈希做键既安全又能在同权限用户之间共享缓存。
  - id: d30-q6
    kp: d30-k5
    type: scenario
    question: |
      用户问「试用期员工能请年假吗？」，系统回答「可以，试用期员工享有 5 天年假 [1]」。实际制度是「试用期满后方可申请年假」。
      追踪日志显示：送入 Prompt 的 [1] 是《年假管理办法》中「员工享有 5 天年假」这一段；「试用期满后方可申请」位于同一文档的下一个 chunk，召回候选中排第 9，未进入 Prompt。
      请按链路分析根因，并给出改进方案。
    key_points:
      - {text: "判断数据本身正确，问题不在数据层", dim: principle}
      - {text: "指出切片把条件和结论切到了两个 chunk，属于切片问题", dim: principle}
      - {text: "指出正确片段在候选第 9 未进入 Prompt，属于排序或预算问题", dim: principle}
      - {text: "指出生成层把不完整资料过度概括为可以，属于生成问题", dim: principle}
      - {text: "给出分层对策：按条款结构切片或相邻合并、Rerank、规则要求注意限制条件、加入评估集", dim: engineering}
    reference: |
      **逐层分析**：
      1. 数据层：制度文档正确且是最新版，没有问题。
      2. 切片层：「员工享有 5 天年假」和「试用期满后方可申请」本属于同一条款，却被切到两个 chunk，条件与结论分离——这是根本原因之一（Day 23）。
      3. 召回层：正确片段在候选中（第 9 名），召回没有问题。
      4. 排序/组装层：第 9 名没有进入 Prompt，说明排序没有把「试用期」相关片段提前，或预算只取了前几条（Day 27、28）。
      5. 生成层：资料只说「享有 5 天年假」，并没有说「试用期员工可以」，模型做了过度推断，违反「只依据资料」。
      **改进**：
      - 切片按条款结构切分，或在组装时合并同一文档相邻片段（父子块）；
      - 引入或调优 Rerank，问题中的「试用期」与片段的匹配能被 cross-encoder 捕捉；
      - Prompt 规则中要求「注意适用条件和例外，资料未明确覆盖问题中的人群时说明不确定」；
      - 把这个样本加入评估集的「条件限制类」问题，回归验证。
  - id: d30-q7
    kp: d30-k4
    type: short
    question: 某 RAG 问答首版平均首字延迟 4.5 秒，链路为：每次都做 Query Rewrite（大模型）→ 向量检索 → BM25 检索（串行）→ Rerank 100 条 → 资料 8000 Token 送入大模型、非流式返回。请给出至少 5 个优化点，并说明各自的原理和风险。
    key_points:
      - {text: "改为流式输出，降低首字延迟感知", dim: engineering}
      - {text: "首轮完整问题跳过改写，改写用小模型并设超时回退", dim: engineering}
      - {text: "两路检索并发执行", dim: engineering}
      - {text: "Rerank 候选降到 30~50 并设超时降级，资料预算降到 2000~4000 Token", dim: engineering}
      - {text: "说明每项优化都需用评估集确认效果没有明显下降", dim: principle}
    reference: |
      1. **流式输出**：首字在生成开始后立即返回，用户感知大幅改善；风险是引用需在流结束后解析（Day 28 方案）。
      2. **改写按需启用**：首轮完整问题跳过改写，多轮时用小模型、设置 1~1.5 秒超时并回退原问题；风险是改写质量下降，需评估追问类指标。
      3. **并发检索**：向量与 BM25 互不依赖，用 asyncio.gather 并发，检索阶段耗时取两者最大值。
      4. **减少 Rerank 候选**：从 100 降到 40 左右，cross-encoder 计算量近似线性下降；设置超时降级到 RRF 顺序；风险是 Recall@候选数下降，需看评估。
      5. **缩小资料预算**：8000 → 3000 Token，输入越少首字越快、成本越低；用评估集确认正确率。
      6. **提示缓存与模型路由**：固定 system 前缀利用提示缓存；简单问题路由到小模型。
      7. **答案缓存**：高频问题按「问题 + 权限范围 + 知识库版本」缓存，命中时直接返回。
      所有改动逐个上线并回归评估集，同时监控 P95 首字延迟和降级率。
  - id: d30-q8
    kp: d30-k1
    type: design
    question: 请为一家 3000 人、有 5 个子公司的制造企业设计企业知识库的整体架构。要求：文档来自 OA 和网盘，每天约 200 份更新；子公司之间数据隔离、子公司内按部门授权；更新 30 分钟内生效；P95 首字延迟 2 秒以内；回答必须带可点击的引用。请给出架构图要点和关键设计。
    key_points:
      - {text: "离线链路：连接器增量拉取文档与 ACL、队列、解析切片向量化、版本切换", dim: engineering}
      - {text: "在线链路：鉴权、改写、带权限的混合检索、Rerank、预算组装、流式生成、引用解析", dim: engineering}
      - {text: "权限：company_id 硬隔离加 RLS，部门组 ACL 前置过滤，缓存与预览带权限", dim: principle}
      - {text: "时效与性能：增量检测、事务切换、缓存失效、并发与流式满足 2 秒", dim: engineering}
      - {text: "治理：追踪日志、分层评估集、回归、反馈回流", dim: project}
    reference: |
      **离线链路**：OA 与网盘连接器每 10 分钟按修改时间 + 内容哈希增量拉取文档和 ACL → 写入任务队列（幂等键 doc_id+version）→ Worker 解析（PDF/Word，保留页码和表格结构）、按条款结构切片、批量 Embedding → PostgreSQL（pgvector + 中文分词全文索引）中以 ready 状态写入 → 事务内切换生效版本 → 递增知识库版本号使缓存失效。删除走软删 + 异步清理。端到端 30 分钟内生效。
      **在线链路**：网关校验令牌 → 问答服务从令牌取 company_id、从权限服务取用户部门组 → 多轮时小模型改写 → 构造统一过滤条件（company_id、allowed_groups、status=active）→ 向量与关键词并发检索各 40 条 → RRF → 自部署 Rerank（超时降级）→ 阈值拒答 → 按 3000 Token 预算组装 Prompt 并生成引用映射 → 流式生成 → 结束后解析校验引用、发送 citations 事件 → 前端可点击跳转（预览接口二次鉴权）。
      **权限**：5 个子公司用 company_id 硬隔离 + RLS；子公司内文档 ACL 按部门组同步到 chunk；权限变化只更新元数据；缓存键含 company_id 与权限范围哈希。
      **性能**：流式、首轮跳过改写、并发检索、控制候选和预算、FAQ 答案缓存、HNSW 与 iterative scan 调优、入库 Worker 与在线服务分开部署，满足 P95 首字 2 秒。
      **治理**：每次请求写追踪日志；分层评估集（含越权与旧版本样本）每次发版回归；点踩样本按根因标注回流。
interview:
  - id: d30-i1
    kp: d30-k1
    type: oral
    difficulty: 1
    question: 请完整讲一下一个企业知识库 RAG 系统从文档入库到用户得到回答的全流程。
    key_points:
      - {text: "离线链路：数据源、解析、切片、Embedding、存储（含元数据与 ACL）", dim: concept}
      - {text: "在线链路：改写、带过滤的混合检索、Rerank、Prompt 组装、生成、引用", dim: concept}
      - {text: "说明每一步解决的关键问题，如过滤保证权限、Rerank 提升排序", dim: principle}
      - {text: "提到追踪日志与评估闭环", dim: engineering}
    reference: |
      **离线入库**：连接器从 OA、网盘等数据源拉取文档及其权限 → 进入任务队列异步处理 → 解析（保留页码、标题、表格结构）→ 按结构切片（控制大小与重叠）→ 批量 Embedding → 写入数据库：chunk 正文、向量、全文索引、出处元数据、租户、权限组、版本状态。
      **在线问答**：用户提问 → 网关鉴权 → 多轮时把追问改写成独立问题 → 用服务端身份生成权限与版本过滤条件 → 向量 + 关键词混合检索并用 RRF 融合 → Rerank 精排，最高分低于阈值则拒答 → 按 Token 预算组装 Prompt（规则、带编号的资料、问题）并生成引用映射 → 模型流式生成 → 解析校验引用并渲染为可点击来源。
      **治理闭环**：每次请求记录追踪日志；用分层评估集回归每次改动；用户反馈回流评估集。
    oral: |
      我分两条链路讲。离线这边，连接器从 OA 和网盘增量拉文档和权限，进队列异步处理，解析时保留页码和标题，按条款结构切片，批量做 Embedding，最后把正文、向量、全文索引、出处和权限信息一起存进 PostgreSQL。
      在线这边，用户提问先鉴权，多轮的话先把追问改写成完整问题，然后用服务端拿到的身份生成权限和版本过滤，做向量加关键词的混合检索，RRF 融合后 Rerank 精排，分数太低就直接拒答，否则按 Token 预算组装 Prompt，模型流式输出，最后解析编号生成可点击的引用。
      另外每次请求都有追踪日志，配合评估集做回归，这样出了问题能定位、改了能验证。
  - id: d30-i2
    kp: d30-k5
    type: oral
    difficulty: 2
    question: 你们的 RAG 系统还是会出现幻觉或答错，你一般怎么排查？
    key_points:
      - {text: "先用追踪日志还原当时的检索结果与 Prompt", dim: engineering}
      - {text: "按链路逐层判断：数据、解析切片、召回、排序组装、生成、问题理解", dim: principle}
      - {text: "给出各层对应的对策", dim: engineering}
      - {text: "说明统计根因分布、优先修复占比最高的层，并加入评估集回归", dim: project}
    reference: |
      **还原现场**：通过请求 ID 取出追踪日志：改写后的问题、过滤条件、各路名次与分数、送入 Prompt 的 chunk 和编号映射、模型与 Prompt 版本。
      **逐层判断**：① 知识库里有没有正确且最新的资料（没有或过期 → 数据治理）；② 资料是否被正确解析和切片（表格错位、条件被切断 → 改解析和切片）；③ 正确片段是否在召回候选中（不在 → 混合检索、改写、检查过滤）；④ 是否进入 Prompt（没进 → Rerank、预算、去重）；⑤ 回答是否与资料一致（不一致 → 规则、阈值拒答、引用校验、模型）；⑥ 都正常则是问题歧义或期望不一致 → 澄清或拒答。
      **闭环**：每个坏例标注根因层级，统计占比，优先修复占比最高的一层；修复后把样本加入评估集回归。换更强的模型只能解决生成层的一部分问题。
    oral: |
      我第一步一定是拿请求 ID 把当时的现场还原出来：改写成了什么、检索到了哪些片段、哪些进了 Prompt、模型回答了什么。
      然后沿着链路一层层看：资料本身对不对、有没有过期；切片有没有把条件和结论切开；正确片段有没有被召回；召回了有没有进 Prompt；进了 Prompt 模型有没有忠实使用。每一层的对策都不一样。
      我们做过一次 120 条点踩样本的根因统计，生成层编造只占 10%，数据过期和召回失败加起来超过一半，所以我们没有去换大模型，而是先做了版本治理和混合检索，点踩率降了四成多。
  - id: d30-i3
    kp: d30-k3
    type: oral
    difficulty: 3
    question: 知识库里的文档会频繁更新和删除，你怎么设计同步机制？怎么保证不出现新旧版本同时被检索到？
    key_points:
      - {text: "变更检测：事件驱动或修改时间加内容哈希，ACL 变化只更新元数据", dim: engineering}
      - {text: "版本切换：新版本 ready 状态写入，事务内切换生效，缓存失效，旧版本保留期后清理", dim: principle}
      - {text: "删除：软删立即生效，异步清理向量、索引、缓存、派生数据", dim: engineering}
      - {text: "任务可靠性：幂等键、重试、死信、状态可见", dim: engineering}
      - {text: "提到 Embedding 模型升级需影子索引全量重建", dim: project}
    reference: |
      **变更检测**：数据源有事件就事件驱动，否则定时按修改时间 + 内容哈希扫描；哈希不变跳过；只有 ACL 变化时只更新 chunk 的权限元数据。
      **版本切换**：新版本的 chunk 先以 ready 状态完整写入（不可检索）；写完后在一个事务里把新版本设为 active、旧版本设为 superseded（或切换 documents.active_version 指针）；递增知识库版本号让缓存失效；旧版本保留一段时间供历史引用和回滚，再物理删除。这样任何时刻只有一个版本可检索。向量和业务数据在同一个 PostgreSQL 中，这个切换是原子的。
      **删除**：先软删，过滤条件立即排除；再异步清理向量、全文索引、缓存、派生数据；合规场景还要覆盖日志与评估集。
      **可靠性**：任务以 (doc_id, version) 为幂等键，失败有限重试后进死信队列告警，前端展示每个文档的处理状态。
      **模型升级**：新旧 Embedding 不可混用，建影子索引全量重建，评估通过后切换读路径。
    oral: |
      同步我分三块。检测变更用修改时间加内容哈希，内容没变就跳过，只是权限变了就只改元数据，不用重新向量化。
      更新的时候新版本的 chunk 先以 ready 状态写进去，用户检索不到；全部写完后在一个事务里把新版本设成生效、旧版本设成已替代，再让缓存失效，所以任何时刻只有一个版本能被检索到。旧版本保留 30 天给历史会话回看。删除是先软删立即不可见，再异步清理向量、索引和缓存。
      任务用文档 ID 加版本做幂等，失败重试后进死信队列。我们从每晚全量重建改成这套增量方案后，生效延迟从一天降到 15 分钟以内。
  - id: d30-i4
    kp: d30-k2
    type: oral
    difficulty: 4
    question: 请设计一个多租户企业知识库的权限隔离方案。为什么不能依赖 Prompt 来控制权限？除了检索结果，还有哪些泄露渠道？
    key_points:
      - {text: "说明两层模型：租户硬隔离与租户内 ACL，chunk 继承文档 ACL", dim: concept}
      - {text: "说明 Prompt 不是安全边界：概率性、可被注入绕过、数据已流经日志缓存", dim: principle}
      - {text: "说明实现：服务端身份、SQL 前置过滤、统一过滤函数、RLS 兜底与 SET LOCAL", dim: engineering}
      - {text: "列举旁路：缓存、日志、引用预览、共享会话、评估导出、BM25 统计量", dim: engineering}
      - {text: "说明隔离级别选择、权限变化同步与越权测试", dim: project}
    reference: |
      **模型**：租户之间硬隔离；租户内按部门/角色/项目组授权，文档级 ACL，chunk 继承所属文档的 ACL（allowed_groups），权限授给组而不是个人。
      **不能靠 Prompt**：Prompt 只是概率性的指令，模型可能不遵守，也可能被提示注入绕过；一旦无权数据进入上下文，就可能出现在回答、引用、摘要中，且已经流经日志、缓存、Rerank 服务。安全边界必须是确定性的代码与数据库约束。
      **实现**：租户与用户组只从令牌和权限服务获取；所有检索路径使用同一个过滤构造函数，在 SQL 中前置过滤 `tenant_id = :tid AND allowed_groups && :groups AND status='active'`；PostgreSQL 启用 RLS，每个事务 `SET LOCAL app.tenant_id`，应用使用非表所有者角色；隔离级别按租户规模与合规要求选择共享表、分区/schema 或独立实例。
      **旁路**：缓存键必须含租户和权限范围；日志脱敏、按租户隔离访问；引用跳转与文档预览二次鉴权；共享会话不展示接收者无权的引用；评估集与数据导出受控；共享 BM25 索引的语料统计可能跨租户影响得分，强合规场景按租户隔离索引。
      **持续保障**：ACL 变化由同步任务更新元数据并失效缓存；CI 中跑跨租户、跨部门越权用例；定期安全审计。
    oral: |
      我的方案是两层：租户之间硬隔离，租户内部按部门组用文档级 ACL，chunk 继承文档的权限。
      落地上，租户和用户组只从令牌和权限服务拿，绝不用请求参数；所有检索走同一个过滤函数，在 SQL 里前置过滤，再开 PostgreSQL 的行级安全兜底，每个事务用 SET LOCAL 设租户。Prompt 不能当安全边界，因为模型可能不听，也可能被注入绕过，而且数据一旦读出来就已经进了日志和缓存。
      旁路我们重点查了缓存、日志、引用预览和共享会话。之前渗透测试就发现过缓存键没带租户导致跨租户命中，修复后我们把越权用例放进 CI，每次发版必跑。
  - id: d30-i5
    kp: d30-k1
    type: design
    difficulty: 4
    question: 阶段综合题：如果让你从 0 到 1 负责一个企业知识库 RAG 项目，从需求到上线再到持续优化，你会怎么推进？请覆盖技术选型、关键设计、评估、上线与迭代，并说明你会如何回应「为什么不直接用超长上下文或微调」的质疑。
    key_points:
      - {text: "需求阶段明确用户、文档规模、权限、时效、延迟与成本指标，先建评估集作为验收标准", dim: project}
      - {text: "选型与设计：PG 加 pgvector 与全文检索、Rerank、权限过滤、增量同步、引用", dim: engineering}
      - {text: "评估体系：检索、生成、拒答、引用、工程指标，基线与回归", dim: principle}
      - {text: "上线：灰度、监控、追踪日志、降级策略、安全测试", dim: engineering}
      - {text: "回应质疑：长上下文成本延迟高且无权限和引用，微调不适合频繁更新的事实知识", dim: principle}
    reference: |
      **1. 需求与验收**：明确用户群、文档规模与类型、权限结构、更新频率与生效时效、P95 延迟和成本预算；和业务专家整理首版评估集（含无答案、编号、多轮、越权样本），作为验收标准。
      **2. 选型**：PostgreSQL + pgvector + 中文分词全文检索（权限与向量同库，事务一致、运维简单）；Embedding 与 Rerank 在自有评估集上比较，按数据能否出域选自部署或 API；生成模型按任务路由。
      **3. 关键设计**：离线增量同步（哈希检测、队列、幂等、事务切换版本、软删）；在线链路（改写、统一权限过滤 + RLS、混合检索 + RRF、Rerank + 阈值拒答、预算组装、引用映射与校验、流式）；缓存键带权限范围与知识库版本；追踪日志。
      **4. 评估**：检索（Recall@50/5、MRR）、生成（Faithfulness、正确性）、拒答（正确拒答率、误拒率）、引用（无效引用率）、工程（P95、成本）；建立基线，每次改动回归；LLM 裁判人工校准。
      **5. 上线**：安全测试（越权、注入）；灰度到一个部门；监控延迟、错误率、拒答率、点踩率；Rerank、改写超时降级。
      **6. 迭代**：每周按根因统计坏例，优先修复占比最高的层，样本回流评估集；评估证明有大量多跳/全局问题时再评估 Agentic RAG 或 GraphRAG。
      **回应质疑**：超长上下文每次都要把大量文档送入模型，成本和延迟高，无关内容会干扰模型，而且无法按用户做权限过滤、难以提供精确引用；微调把知识写进参数，适合学习风格和格式，不适合频繁更新的事实知识，更新和删除都要重新训练，也无法溯源和按人控制权限。RAG 在时效、权限、可追溯和成本上更适合企业知识库。
    oral: |
      我会先把验收标准定下来：用户是谁、文档多少、权限怎么分、更新多久要生效、延迟和成本预算多少，然后和业务专家先做一版评估集，里面一定要有没答案的、编号类的、多轮的和越权的问题。
      技术上我会用 PostgreSQL 加 pgvector 和中文全文检索，离线做增量同步和事务切换版本，在线是改写、带权限的混合检索、Rerank 加阈值拒答、按预算组装、带引用的流式生成。评估分检索、生成、拒答、引用和性能五类，每次改动都回归。上线先做越权和注入测试，灰度一个部门，之后每周按根因统计坏例来迭代。
      如果有人问为什么不直接用长上下文或者微调，我会说长上下文成本和延迟高，还没法按人过滤权限、没法精确引用；微调适合学风格，不适合天天变的制度知识，改了删了都得重训，也没法溯源。
code_reading:
  id: d30-c1
  kp: [d30-k2, d30-k4]
  title: 带权限过滤与缓存的检索服务
  level: 3
  scenario: |
    多租户 SaaS 知识库的检索接口 `/search`，被问答服务和前端「搜索」功能共同调用。get_current_user 从 JWT 解析出 tenant_id、user_id 和用户组；
    retriever.hybrid_search 是 Day 26 的混合检索（按 kb_id 检索），返回带 tenant_id、allowed_groups 的 Pydantic 模型；结果缓存在 Redis 中 10 分钟。
  language: python
  code: |
    import hashlib
    import json
    import logging

    from fastapi import APIRouter, Depends
    from pydantic import BaseModel
    from redis.asyncio import Redis

    from app.auth import CurrentUser, get_current_user  # 从 JWT 解析 tenant_id、user_id、groups
    from app.deps import get_redis, get_retriever
    from app.retrieval import Retriever

    logger = logging.getLogger("rag.search")
    router = APIRouter()
    CACHE_TTL = 600


    class SearchRequest(BaseModel):
        query: str
        kb_id: int
        top_k: int = 5


    @router.post("/search")
    async def search(req: SearchRequest,
                     user: CurrentUser = Depends(get_current_user),
                     redis: Redis = Depends(get_redis),
                     retriever: Retriever = Depends(get_retriever)) -> dict:
        raw_key = f"{req.kb_id}:{req.query.strip()}:{req.top_k}"
        key = "search:" + hashlib.sha256(raw_key.encode()).hexdigest()
        if cached := await redis.get(key):
            return json.loads(cached)

        hits = await retriever.hybrid_search(req.query, kb_id=req.kb_id, limit=req.top_k * 2)
        allowed = [
            h for h in hits
            if h.tenant_id == user.tenant_id and set(h.allowed_groups) & set(user.groups)
        ]
        result = {"hits": [h.model_dump() for h in allowed[: req.top_k]]}
        await redis.set(key, json.dumps(result, ensure_ascii=False), ex=CACHE_TTL)
        logger.info("search user=%s kb=%s raw=%d allowed=%d",
                    user.user_id, req.kb_id, len(hits), len(allowed))
        return result
  walkthrough:
    function: |
      接收检索请求，先用 (kb_id, 问题, top_k) 的哈希查 Redis 缓存，命中直接返回；未命中则按 kb_id 做混合检索取 top_k×2 条，
      在应用层筛掉租户不符或用户组没有交集的片段，取前 top_k 条写入缓存（10 分钟过期）并返回。
    key_functions: |
      - `get_current_user`：FastAPI 依赖，从 JWT 解析当前用户（tenant_id、user_id、groups），令牌无效时抛 401。
      - `get_redis` / `get_retriever`：依赖注入 Redis 客户端和检索器，便于测试替换。
      - `retriever.hybrid_search`：按 kb_id 做向量 + 关键词混合检索，不感知用户权限。
      - 列表推导 `allowed`：应用层权限过滤——租户相同且 allowed_groups 与用户组有交集。
      - `redis.get` / `redis.set(..., ex=CACHE_TTL)`：读写缓存，过期时间 600 秒。
    params: |
      请求体经 Pydantic 校验得到 query、kb_id、top_k（默认 5）；用户身份由依赖从请求头的 JWT 中解析，不来自请求体。
      kb_id 和 query 传给检索器，limit 为 top_k 的 2 倍；user.tenant_id 与 user.groups 只在检索后的筛选中使用。缓存键只由 kb_id、去空格后的 query、top_k 组成。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant C as 调用方
        participant API as search 接口
        participant R as Redis
        participant RT as 混合检索
        C->>API: query kb_id top_k 加 JWT
        API->>API: 解析用户 计算缓存键 不含租户和权限
        API->>R: GET 缓存键
        alt 命中
          R-->>API: 缓存结果 可能是其他用户的
          API-->>C: 直接返回 未做任何权限判断
        else 未命中
          API->>RT: 按 kb_id 检索 top_k 乘 2 条 不带权限条件
          RT-->>API: hits 含其他部门或租户数据
          API->>API: 应用层按租户和用户组筛选
          API->>R: SET 缓存键 结果 600 秒
          API-->>C: 筛选后的前 top_k 条
        end
      ```
    failure_points: |
      - **缓存键不含租户与权限范围（严重越权）**：HR 用户先查询，结果（含 HR 可见片段）被缓存；普通员工用相同 kb_id 和问题查询时命中缓存，直接拿到 HR 的结果。其他租户的用户如果构造了相同的 kb_id 和问题，同样会命中——缓存分支完全绕过了权限判断。
      - **权限过滤在检索之后（效果 + 安全）**：检索不带权限条件，只取 top_k×2 条；用户可见文档占比小时，筛选后可能只剩 0~1 条（结果被筛光）；无权数据已经从数据库读出进入服务内存。
      - **kb_id 未鉴权**：没有校验该知识库是否属于当前租户、用户是否有权访问，只靠事后筛选兜底。
      - **缓存不随数据变化失效**：文档删除、权限收回后最长 10 分钟内仍可能返回旧结果。
      - **top_k 无上限**：调用方传 top_k=10000 会放大检索成本，应在 Pydantic 中用 `Field(ge=1, le=20)` 限制。
      - Redis 不可用时 get/set 抛异常，整个检索接口失败，没有降级。
    debugging: |
      - 复现越权：用 HR 账号和普通员工账号依次调用相同 kb_id 与 query，对比返回内容；再用另一租户账号构造相同请求。
      - 看日志中的 raw 与 allowed：allowed 远小于 raw 说明后置过滤在大量丢弃数据；同时注意缓存命中的请求根本不会打印这条日志（命中分支直接 return），所以日志里看不到越权的请求——这本身就是可观测性缺陷。
      - 在 Redis 中用 `TTL` 和 `GET` 检查具体键，确认内容属于哪个用户的权限范围。
      - 编写集成测试：两个不同权限的用户、相同请求，断言结果不同且普通用户看不到 HR 文档。
    change_request: |
      - **鉴权前置**：先校验 kb_id 属于 user.tenant_id 且用户可访问，否则返回 403。
      - **检索层过滤**：hybrid_search 接收由服务端身份构造的过滤条件（tenant_id、allowed_groups、status），在 SQL 中前置过滤，并启用 RLS 兜底；删除应用层筛选或保留为断言。
      - **缓存键**：加入 tenant_id、权限范围哈希（排序后的用户组哈希）、知识库版本号：`f"{tid}:{acl_hash}:{kb_id}:{kb_version}:{query}:{top_k}"`；文档或权限变更时递增 kb_version。
      - **可观测性**：缓存命中也记录日志（含用户与租户），便于审计。
      - **参数校验与降级**：top_k 加上限；Redis 异常时跳过缓存继续检索。
  questions:
    - id: d30-c1-q1
      kp: d30-k2
      type: code
      question: 按执行顺序说明：同一租户内，HR 专员（用户组 hr、all）先搜索「2026 调薪方案」，5 分钟后普通员工（用户组 all）用相同的 kb_id 和问题搜索，两次请求分别发生了什么？普通员工最终看到了什么？
      key_points:
        - {text: "第一次：缓存未命中，检索后按 hr 和 all 组筛选，结果含 HR 专属片段并写入缓存", dim: principle}
        - {text: "第二次：缓存键相同，命中后直接返回，未执行任何权限判断", dim: principle}
        - {text: "结论：普通员工看到 HR 专属内容，发生越权，且没有日志记录", dim: engineering}
        - {text: "修复：缓存键加入租户和权限范围哈希，过滤下推检索层", dim: engineering}
      reference: |
        **第一次（HR）**：计算缓存键 hash("kb:2026 调薪方案:5")，Redis 未命中；hybrid_search 取 10 条；应用层筛选保留 tenant_id 相同且 allowed_groups 与 {hr, all} 有交集的片段，其中包括仅 hr 可见的调薪预算片段；取前 5 条写入 Redis（TTL 600 秒），记录日志并返回。
        **第二次（普通员工，5 分钟后）**：问题、kb_id、top_k 都相同，缓存键完全一样；`redis.get` 命中，`json.loads` 后**直接返回**——没有执行检索，也没有执行权限筛选，甚至没有打印日志。
        **结果**：普通员工看到了仅 HR 可见的调薪预算片段，发生越权；而且命中分支不记日志，事后审计也看不到这次访问。
        **修复**：缓存键包含 tenant_id 与权限范围哈希（如 sha256(排序后的用户组)），不同权限范围的用户使用不同缓存；检索层前置过滤；缓存命中也记录审计日志。
    - id: d30-c1-q2
      kp: d30-k2
      type: code
      question: 某小部门员工反馈「搜索总是只有一两条结果，甚至没有结果，但我确定有相关文档」。结合代码解释原因，并说明为什么把过滤下推到检索层同时解决了效果和安全两个问题。
      key_points:
        - {text: "指出检索不带权限条件且只取 top_k 乘 2 条，大部分是其他部门的", dim: principle}
        - {text: "说明应用层筛选后结果被筛光，召回率下降", dim: principle}
        - {text: "说明下推后在可见范围内取满候选，效果恢复", dim: engineering}
        - {text: "说明下推后无权数据不出库，消除内存、日志、缓存等泄露面", dim: engineering}
      reference: |
        hybrid_search 只按 kb_id 检索，不知道用户是谁，取 top_k×2 = 10 条。小部门的文档在整个知识库中占比很小，这 10 条大多属于其他部门；应用层按 allowed_groups 筛选后只剩一两条甚至 0 条——不是没有相关文档，而是它们排在第 11 名之后，根本没进入候选。
        **下推到检索层**：在 SQL 的 WHERE 中加入 `tenant_id = :tid AND allowed_groups && :groups AND status='active'`，检索在用户可见的范围内进行，10 个候选全部是有权限的文档，小部门用户也能取满结果（需要时配合 pgvector iterative scan 避免过滤后不足数）。
        **安全收益**：无权数据从一开始就不被读出数据库，不会进入服务内存、日志、缓存或下游 Rerank 服务；再配合 RLS，即使某处代码忘了加条件也能兜底。效果和安全都依赖同一个改动：权限是检索条件，而不是事后筛子。
    - id: d30-c1-q3
      kp: d30-k4
      type: code
      question: 需求变更：「文档删除或权限收回后，搜索结果必须在 1 分钟内反映变化；同时希望同权限用户之间仍能共享缓存。」请说明应如何修改缓存设计，并解释为什么不直接把 TTL 改成 60 秒。
      key_points:
        - {text: "引入知识库版本号，文档或 ACL 变更时递增，缓存键包含版本号", dim: engineering}
        - {text: "缓存键包含租户与权限范围哈希，实现同权限共享", dim: engineering}
        - {text: "指出仅缩短 TTL 只能限制陈旧时间上限，仍会返回已删除内容且降低命中率", dim: principle}
        - {text: "删除场景先软删并递增版本，确保立即失效", dim: engineering}
      reference: |
        **设计**：
        1. 每个知识库维护 `kb_version`（存在数据库或 Redis 中），任何文档新增、更新、删除、ACL 变更都在同一事务/流程中递增它。
        2. 缓存键：`search:{tenant_id}:{acl_hash}:{kb_id}:{kb_version}:{normalized_query}:{top_k}`，其中 acl_hash 是排序后用户组的哈希。权限范围相同的用户共享缓存；版本递增后旧键不再被访问，自然失效（旧键靠 TTL 回收）。
        3. 删除流程：先软删文档与 chunk，再递增 kb_version，下一次请求就会走新键、重新检索，秒级生效。
        4. 用户组变化时 acl_hash 随之变化，自动使用新的缓存键。
        **为什么不只改 TTL**：TTL=60 秒只是把「最多返回多久的旧数据」限制在 60 秒内，删除后的这段时间内仍会返回已删除或已收回权限的内容；同时缓存命中率大幅下降。版本号方案是**主动失效**，既能立即反映变化，又能在数据不变时保持较长 TTL 和较高命中率。
