day: 21
phase: 3
title: RAG 原理
goals:
  - 能用自己的话讲清为什么需要 RAG，以及为什么不能把所有文档直接塞进 Prompt
  - 能画出并解释 RAG 的两条链路：离线入库与在线问答，说出每一步的产物和常见故障
  - 能对比 RAG、微调、长上下文直塞三种方案，并根据需求给出选型理由
  - 能解释为什么向量相似度高不代表答案正确，并提出至少三种工程治理手段
knowledge_points:
  - id: d21-k1
    name: 为什么需要 RAG
    level: P0
    summary: 模型不知道你的私有数据和最新变化；RAG 先查资料，再把相关证据交给模型回答
    why: |
      企业 AI 项目里最常见的需求是「**基于公司内部资料回答问题**」：制度问答、客服知识库、售前方案助手、运维手册助手。
      这些项目几乎都用 RAG 实现。面试中「为什么要 RAG」「百万上下文还要不要 RAG」是 RAG 方向的**第一道必考题**，答不清楚会直接被判定为「只会调框架」。
    problem: |
      大模型参数里的知识有四个硬伤：**有截止日期、没有你的私有数据、会一本正经地编、无法给出出处**。
      最朴素的补救是「把文档全塞进 Prompt」，但企业资料动辄上千万 Token，而且有权限、有版本、要控制成本和延迟。
      RAG 解决的就是：**每次只把和问题相关的少量证据，在回答前交给模型**。
    principle: |
      **一、模型自身知识的四个天然缺陷**

      - **时效性**：模型知识停在训练数据截止日期，上个月改的报销制度它不知道。
      - **私有性**：公司内部文档、合同、工单从未进入训练数据，模型不可能「记得」。
      - **幻觉**：模型的目标是生成「看起来合理」的下一个 Token（见 Day 11），不知道时也会编，而且语气很自信。
      - **不可溯源**：模型无法告诉你「这句话出自哪份文件第几页」，企业场景（法务、财务、医疗）无法接受。

      **二、为什么不能把所有文档都塞进 Prompt**

      上下文窗口变大以后，常有人问「直接全塞进去不就行了？」。不行，原因有六个：

      1. **装不下**：一家中型企业的制度、手册、工单、合同，总量轻松超过几千万 Token，任何窗口都装不下，而且每天还在增长。
      2. **贵且慢**：API 按输入 Token 计费，每问一次都要为全部文档付费；输入越长，首 Token 延迟越高（见 Day 13、Day 20）。
      3. **装得下不等于用得好**：输入越长，模型越容易忽略中间部分的信息（常被称为 lost in the middle），无关内容还会干扰判断，**注意力被稀释**。
      4. **权限无法控制**：全塞进去意味着普通员工的提问也带上了薪酬制度、法务合同，模型可能直接说出来。
      5. **版本冲突**：新旧两版制度同时在上下文里，模型可能混用。
      6. **难以溯源和评估**：答案出错时，不知道是哪段资料导致的。

      **三、RAG 的核心思想：把闭卷考试变成开卷考试**

      RAG = Retrieval-Augmented Generation，检索增强生成：

      - **Retrieval 检索**：根据问题，从知识库里找出最相关的几段资料（通常 3~10 段）。
      - **Augmented 增强**：把这些资料和问题一起拼进 Prompt，作为「证据」。
      - **Generation 生成**：要求模型**只依据证据**回答，并标注出处；证据不足就说不知道。

      ```mermaid
      flowchart LR
        subgraph 闭卷
          Q1["用户问题"] --> M1["LLM 凭参数记忆回答"] --> A1["可能过时或编造 无出处"]
        end
        subgraph 开卷
          Q2["用户问题"] --> R["检索知识库 Top-K"] --> P["问题加证据拼成 Prompt"] --> M2["LLM 依据证据回答"] --> A2["带引用的答案"]
        end
      ```

      **四、RAG 带来的工程收益**

      - **知识更新 = 更新知识库**：改了制度，重新入库即可，不用重新训练模型。
      - **可溯源**：每个答案都能附上「来源文件 + 页码」，用户可以点开核对。
      - **可控权限**：检索时按用户身份过滤，模型根本看不到无权限的资料。
      - **成本可控**：每次只输入几千 Token 的相关证据，而不是整个知识库。

      **五、RAG 不是万能的**

      - **检索不到就答不出**：RAG 的上限由检索决定，后面几天（Day 22~29）都在解决「怎么检索得更准」。
      - **不适合全局统计类问题**：「今年一共签了多少份合同」需要遍历全部数据，应该走 SQL 或结构化查询，而不是 Top-K 检索。
      - **不改变模型的推理能力**：证据给对了，模型仍可能读错、算错，需要生成阶段的约束和评估（Day 28、29）。

      一句话：**RAG 用「检索」解决「模型不知道」，用「证据 + 引用」解决「模型乱说」**。
    scenarios: |
      - **企业制度问答**：员工问「试用期能不能请年假」，系统检索人事制度相关条款并附上出处。
      - **客服知识库**：根据产品手册和历史工单回答用户问题，知识每周更新也不需要重训模型。
      - **售前/投标助手**：从历史方案、产品白皮书里找到相似案例和参数。
      - **运维助手**：根据故障手册和 Runbook 给出排查步骤。
    pitfalls: |
      - **误区：上下文够大就不需要 RAG。** 装得下不等于用得好，而且成本、延迟、权限、版本问题都没解决。
      - **误区：RAG 能解决所有问答。** 统计、聚合、跨全部数据的问题应该走结构化查询。
      - **误区：接上向量库就是 RAG 了。** 没有引用、没有「证据不足就拒答」的约束，模型照样会编。
      - **混淆：RAG 改的是模型的「输入」，微调改的是模型的「参数」。** 两者解决的问题不同（见本日 RAG vs 微调）。
    interview_asks:
      - 什么是 RAG？它解决了大模型的哪些问题？
      - 现在上下文窗口已经很大了，为什么还需要 RAG？
      - 哪些问题不适合用 RAG 解决？
    project_example: |
      某制造企业的「制度问答助手」：知识库包含人事、财务、行政制度约 3000 份文档。
      最初方案是把员工手册整本塞进 Prompt，结果每次请求输入超过 10 万 Token，单次成本高、响应慢，而且新旧制度混用。
      改为 RAG 后：文档解析切片入库，每次只检索 5 段相关条款，回答附「制度名称 + 条款号 + 页码」；制度更新时只重新入库对应文件。
      上线后平均响应时间和单次成本都大幅下降，员工能点开出处核对，投诉「答错」时也能定位到具体是哪段资料的问题。
  - id: d21-k2
    name: RAG 完整流程：离线入库与在线问答两条链路
    level: P0
    summary: 离线链路把文档变成带 metadata 的向量；在线链路把问题变成向量去检索，再让模型依据证据回答
    why: |
      面试官最常让你「画一下 RAG 的架构」。能把两条链路、每一步的产物和故障点讲清楚，说明你真正理解系统，而不是只会调用一个现成框架。
      后面 Day 22~30 的每一天都对应这张图上的一个环节，这张图就是 RAG 阶段的「地图」。
    problem: |
      RAG 的问题往往不出在 LLM，而出在**链路中间的某一步**：解析乱码、切片切断条款、换了 Embedding 模型没重建索引、检索没有过滤权限。
      只有把链路拆清楚，出问题时才知道看哪一步的日志和中间产物。
    principle: |
      **一、为什么是两条链路**

      RAG 把工作拆成两部分，因为它们的**触发时机、性能要求、失败处理方式完全不同**：

      - **离线入库（Indexing）**：文档上传或更新时触发，可以慢（分钟级），可以重试，结果是「准备好的知识库」。
      - **在线问答（Query）**：用户提问时触发，要快（通常要求几秒内出首字），失败要有兜底。

      ```mermaid
      flowchart LR
        subgraph 离线入库
          D["原始文档 PDF Word TXT"] --> P1["解析与清洗"] --> C["切片 Chunk"] --> M["补充 metadata 来源 页码 标题 权限 版本"] --> E1["Embedding 向量化"] --> V[("向量库 pgvector")]
        end
        subgraph 在线问答
          Q["用户问题"] --> QR["问题改写 可选"] --> E2["问题向量化 同一模型"] --> S["向量检索 Top-K 加权限过滤"]
          V --> S
          S --> RR["重排序 可选"] --> PB["组装 Prompt"] --> L["LLM 生成"] --> A["答案加引用"]
        end
      ```

      **二、离线入库：每一步的产物与常见故障**

      | 步骤 | 产物 | 常见故障 | 详见 |
      |---|---|---|---|
      | 解析 | 纯文本 + 结构 | 扫描件无文字、表格错乱、编码乱码 | Day 22 |
      | 切片 | 若干 chunk | 太大语义稀释、太小断章取义 | Day 23 |
      | metadata | 来源、页码、标题路径、权限、版本 | 缺失导致无法引用、无法过滤 | Day 23 |
      | 向量化 | 每个 chunk 一个向量 | 限流、超长、模型不一致 | Day 24 |
      | 入库 | 向量 + 原文 + metadata | 索引选错、维度不匹配 | Day 25 |

      **三、在线问答：一次请求的完整过程**

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant API as 问答服务
        participant EM as Embedding 服务
        participant DB as 向量库
        participant LLM as 大模型
        U->>API: 提问 携带用户身份
        API->>EM: 问题向量化
        EM-->>API: 查询向量
        API->>DB: 相似度检索 Top-K 并按权限过滤
        DB-->>API: 片段 原文 来源 页码 距离
        API->>API: 阈值判断 去重 拼接 Prompt
        API->>LLM: 系统指令 证据 问题
        LLM-->>API: 带引用编号的回答
        API-->>U: 答案和出处链接
      ```

      **四、两条链路之间的「契约」**

      离线和在线是两套代码、可能由两个服务执行，但必须遵守同一份约定，否则检索会悄悄变差而不报错：

      - **同一个 Embedding 模型和版本**：查询向量和文档向量必须在同一个向量空间里，换模型必须全量重建（Day 24）。
      - **同一套文本预处理**：比如全角半角统一、繁简转换，离线做了在线也要做。
      - **metadata 字段口径一致**：离线写入 `dept_id`，在线就要按 `dept_id` 过滤，字段名和取值规范要统一。
      - **距离度量与索引一致**：用余弦距离建索引，查询就要用余弦距离运算符（Day 25）。

      **五、用「链路视角」排查问题**

      回答错误时，按顺序问三个问题：

      1. **该找的资料入库了吗？**（解析、切片是否正确，去库里搜原文）
      2. **入库了，检索到了吗？**（看 Top-K 结果里有没有正确 chunk）
      3. **检索到了，模型用对了吗？**（看 Prompt 和回答是否忠实于证据）

      这三步分别对应「入库问题、检索问题、生成问题」，定位到哪一步就改哪一步。
    scenarios: |
      - **新项目搭建**：先画两条链路图，和客户确认文档来源、更新频率、权限模型，再分别估算离线入库耗时和在线延迟预算。
      - **线上排障**：用户反馈答错，按「入库 → 检索 → 生成」三步定位，保存每次请求的检索结果和 Prompt 作为日志。
      - **知识更新**：制度改版时只对变化的文件重跑离线链路，并让旧版本 chunk 失效。
    pitfalls: |
      - **只建了在线链路，离线入库靠手工脚本**：没有重试、没有记录，文档更新后知识库悄悄过期。
      - **离线和在线用了不同的 Embedding 模型**（比如开发环境用 A，生产用 B），检索结果几乎随机，但系统不会报错。
      - **metadata 只存了文本，没有存来源和页码**，上线后无法做引用，只能返工重新入库。
      - **把权限过滤放在 LLM 回答之后做**：模型已经看到了无权限资料，过滤为时已晚。
    interview_asks:
      - 请画一下你们 RAG 系统的架构，离线和在线分别做了什么？
      - 用户说答案错了，你怎么定位是哪个环节的问题？
      - 离线入库和在线问答之间有哪些必须保持一致的约定？
    project_example: |
      在一个客服知识库项目中，离线链路用任务队列执行：上传文件 → 解析 → 切片 → 批量向量化 → 写入 pgvector，每步都把中间产物（解析后的文本、chunk 列表）存档，失败可从断点重跑。
      在线链路的每次请求都记录「问题、检索到的 chunk id 和距离、最终 Prompt、回答」。
      有一次用户反馈退货政策答错，查日志发现 Top-5 里根本没有新政策的 chunk，再往前查发现新政策 PDF 是扫描件，解析出来是空文本——问题在入库环节，补上 OCR 后解决。
  - id: d21-k3
    name: RAG vs 微调 vs 长上下文
    level: P1
    summary: RAG 改输入解决「知道什么」，微调改参数解决「怎么说」，长上下文适合少量文档一次性分析
    why: |
      客户和老板经常问「为什么不直接微调一个公司专属模型」「为什么不直接全塞进去」。
      你需要能给出有理有据的选型建议，这是 AI 应用工程师和解决方案岗位的核心能力，也是面试高频题。
    problem: |
      三种方案都能「让模型用上你的知识」，但成本、更新速度、可溯源性、权限控制差别很大。
      选错方案的代价很高：微调了半天发现制度一更新又要重训，或者长上下文方案上线后成本失控。
    principle: |
      **一、三种方案分别改变了什么**

      - **RAG**：不改模型，改的是**每次请求的输入**——在问题前面放上检索到的证据。
      - **微调（Fine-tuning）**：用你的数据继续训练，改的是**模型参数**，让模型学会某种行为、风格、格式或领域语感。
      - **长上下文直塞**：不检索，把整份（或几份）文档直接放进 Prompt。

      **二、对比**

      | 维度 | RAG | 微调 | 长上下文直塞 |
      |---|---|---|---|
      | 擅长 | 注入大量、常变化的事实知识 | 固定输出格式、语气、领域术语习惯 | 少量文档的整体阅读、对比、总结 |
      | 知识更新 | 重新入库即可，分钟级 | 需要重新训练和评估 | 换文档即可 |
      | 可溯源 | 能给出处 | 基本不能 | 能，但定位粗 |
      | 权限控制 | 检索时过滤 | 训练进参数后无法按人隔离 | 要在拼接前控制 |
      | 删除知识 | 删 chunk 即可 | 很难「遗忘」 | 不放即可 |
      | 成本 | 建库成本 + 每次少量 Token | 训练成本 + 维护成本 | 每次大量 Token |

      **三、为什么「用微调灌知识」通常不划算**

      - 微调更擅长改变「怎么回答」，对「准确记住大量具体事实」效果不稳定，仍会幻觉。
      - 知识一变就要重训，而企业知识每天都在变。
      - 合规要求删除某份资料时，参数里的知识无法精确删除。

      **四、组合使用才是常态**

      - RAG 提供事实 + 微调（或强 Prompt）约束输出格式。
      - 微调 Embedding 或 Rerank 模型，提升特定领域的检索效果（属于进阶优化）。
      - 两三份合同对比这种一次性任务，直接用长上下文更简单。

      **选型口诀**：知识多且常变 → RAG；行为、格式要稳定 → 微调或结构化输出；文档少且一次性 → 长上下文。
    scenarios: |
      - **客服知识库**：产品政策每月变化，选 RAG。
      - **工单自动分类并输出固定 JSON**：知识不多但格式要稳，先试结构化输出（Day 19），不够再考虑微调。
      - **法务对比两份合同差异**：文档少、一次性，直接长上下文。
      - **医疗术语检索效果差**：在 RAG 基础上微调 Embedding 模型。
    pitfalls: |
      - **误区：微调后模型就「记住」了公司知识，不用 RAG。** 事实记忆不稳定、无法溯源、更新要重训。
      - **误区：RAG 和微调二选一。** 实际项目常组合使用。
      - **误区：长上下文永远更好。** 只适合少量文档；大规模知识库仍需检索。
      - **忽视合规**：训练进参数的敏感数据无法按需删除。
    interview_asks:
      - 你们为什么用 RAG 而不是微调？
      - 什么情况下你会建议客户做微调？
      - RAG 和长上下文能不能结合使用？
    project_example: |
      某保险公司想做「理赔条款助手」，最初计划拿 2 万份条款文档微调模型。
      评估后发现条款每季度更新，且回答必须给出条款编号供审核，微调无法满足溯源要求。
      最终方案：RAG 负责检索条款原文并给出处；用结构化输出约束回答格式（结论、依据条款、免责提示）；仅对 Embedding 模型做了小规模领域微调以提升保险术语的检索效果。
  - id: d21-k4
    name: 为什么向量相似度高不代表答案正确
    level: P0
    summary: 相似度只说明「话题接近」，不保证片段包含答案、版本有效、事实正确
    why: |
      很多人以为「相似度 0.9 就一定对」，于是只调 Top-K 和阈值，答错时束手无策。
      理解相似度的本质边界，才能理解为什么需要 metadata 过滤、混合检索、Rerank 和评估，这是 RAG 优化（Day 26~29）的出发点，也是面试拉开差距的问题。
    problem: |
      向量检索返回的是「语义上最接近」的片段，但用户要的是「能回答问题、且正确有效」的片段。
      两者之间的差距导致了 RAG 最常见的线上问题：**引用看起来很相关，答案却是错的**。
    principle: |
      **一、相似度到底衡量了什么**

      Embedding 模型（见 Day 14）在训练时学的是：**语义相关的文本，向量要靠近**。所以相似度回答的问题是「这两段话在聊同一件事吗？」，而不是：

      - 这段话**包含**问题的答案吗？
      - 这段话的内容**正确、有效**吗？
      - 这段话属于**当前版本、当前用户有权限**的文档吗？

      **二、五类典型「相似但错误」**

      1. **版本冲突**：2021 版和 2024 版《差旅报销制度》几乎一模一样，只有金额不同，向量几乎重合。
      2. **数字和实体差异**：「A 型号额定功率 5kW」和「B 型号额定功率 5kW」相似度很高，但问的是 A。
      3. **否定和条件**：「试用期员工**可以**请年假」和「试用期员工**不可以**请年假」向量非常接近。
      4. **问题匹配问题**：FAQ 里有一条和用户问题几乎相同的「问题」，相似度最高，但答案写在另一个 chunk 里。
      5. **泛泛而谈的段落**：制度的「总则」「目的」段落覆盖很多关键词，常常相似度很高却没有具体答案。

      **三、从「相关」到「正确」要过几道关**

      ```mermaid
      flowchart LR
        V["向量检索只保证第一关"] -.-> A
        A["话题相关 向量相似"] --> B["包含答案 片段里有具体信息"] --> C["有效 当前版本未作废"] --> D["有权限 用户可见"] --> E["被正确使用 模型没读错"]
      ```

      向量检索只负责第一关，后面每一关都需要额外的机制。

      **四、工程治理手段（后续天数展开）**

      - **metadata 过滤**：按版本、生效日期、部门、权限过滤，解决版本和权限问题（Day 27）。
      - **混合检索**：向量检索 + 关键词检索（BM25 / 全文检索），型号、编号、条款号这类「必须精确匹配」的词由关键词检索兜底（Day 26）。
      - **Rerank 重排序**：用 Cross-Encoder 把「问题 + 片段」放在一起判断是否真正回答了问题，比只比较两个独立向量更精细（Day 27）。
      - **阈值与拒答**：最高相似度都很低时，直接回答「知识库中没有找到相关资料」。
      - **生成约束**：Prompt 要求「只依据证据回答、标注引用、证据不足就说不知道」（Day 28）。
      - **评估**：建立问题—标准答案—标准出处的评估集，分别评估检索命中率和答案忠实度（Day 29）。

      **五、一个容易忽略的点：相似度分数不是概率**

      余弦相似度 0.85 并不表示「85% 正确」。不同模型的分数分布不同：有的模型无关文本也有 0.7，有的相关文本只有 0.5。**阈值必须在自己的数据上标定，换模型要重新标定**。
    scenarios: |
      - **制度问答**：新旧版本制度并存，必须按生效状态过滤，否则引用旧版。
      - **产品手册问答**：型号众多、参数相近，需要关键词检索或型号字段过滤兜底。
      - **FAQ 机器人**：问题与问题相似度高，要把「问题 + 答案」作为一个 chunk 入库。
      - **合规审核**：回答必须附出处，审核员发现引用错误时可回溯检索日志。
    pitfalls: |
      - **误区：相似度越高答案越可靠。** 只代表话题接近。
      - **误区：把阈值设成固定的 0.8 就行。** 分数分布因模型而异，必须用自己的数据标定。
      - **误区：答错了就调大 Top-K。** 更多无关片段反而会干扰模型，而且挤占上下文。
      - **混淆「相关性」和「可回答性」**：Rerank 和评估要关注的是后者。
    interview_asks:
      - 为什么向量相似度高，答案还是错的？举例说明。
      - 你们怎么处理新旧版本文档同时存在的问题？
      - 相似度阈值你们是怎么定的？
    project_example: |
      某设备厂商的售后助手上线后，用户问「X200 的保修期」，系统引用了「X100 保修期 2 年」的段落并回答 2 年，实际 X200 是 3 年。
      排查发现两款产品手册结构相同、措辞几乎一致，向量相似度 0.91 vs 0.90。
      修复：入库时为每个 chunk 写入 `product_model` 字段，在线先从问题中抽取型号做过滤；同时加入关键词检索兜底型号精确匹配。
      此后同类问题的错误显著减少，团队也把「型号相近题」加入了评估集做回归测试。
quiz:
  - id: d21-q1
    kp: d21-k1
    type: judge
    question: 只要模型的上下文窗口足够大，就可以不用 RAG，把全部文档放进 Prompt 效果一定更好。
    answer: false
    explain: |
      错误。即使装得下，也有四个问题：每次请求都为全部文档付费且延迟高；输入越长模型越容易忽略中间信息、被无关内容干扰；无法按用户权限隔离资料；新旧版本混在一起会混用。
      而且企业知识库总量通常远超任何窗口。长上下文适合少量文档的一次性分析，不能替代检索。
  - id: d21-q2
    kp: d21-k3
    type: single
    question: 以下哪个需求最适合优先考虑「微调」而不是 RAG？
    options:
      - 让客服机器人回答每月都会更新的退货政策
      - 让模型稳定地用公司规定的语气和固定结构输出工单处理意见
      - 让模型回答员工手册里的具体条款并给出页码
      - 让模型只回答当前用户有权限看到的文档内容
    answer: [1]
    explain: |
      微调擅长改变模型的「行为」：语气、风格、固定结构（实际项目中也可以先试结构化输出和 Prompt，不够再微调）。
      A 知识常变，微调要反复重训；C 需要出处，微调无法溯源；D 需要按人隔离，训练进参数的知识无法按权限控制。这三项都应该用 RAG。
  - id: d21-q3
    kp: d21-k2
    type: multi
    question: 以下哪些步骤属于 RAG 的「离线入库」链路？
    options:
      - 把 PDF、Word 解析成文本并清洗
      - 切片并为每个 chunk 记录来源、页码、标题路径
      - 把用户的问题转成向量
      - 对每个 chunk 做 Embedding 并写入向量库
      - 把检索到的片段拼进 Prompt 交给 LLM
    answer: [0, 1, 3]
    explain: |
      离线入库发生在文档上传或更新时：解析清洗、切片加 metadata、向量化入库。
      「问题向量化」和「拼接 Prompt」都发生在用户提问时，属于在线问答链路。容易混淆的是向量化：文档向量化在离线，问题向量化在在线，但必须用同一个模型。
  - id: d21-q4
    kp: d21-k4
    type: scenario
    question: 用户问「2024 年差旅报销标准是多少」，系统却引用了 2021 年的旧制度并给出旧金额。请分析可能是哪些环节的问题，以及如何修复。
    key_points:
      - {text: "指出新旧两版制度语义几乎相同，向量相似度无法区分年份和版本", dim: principle}
      - {text: "提出入库时记录版本、生效日期、是否作废等 metadata，检索时按有效状态过滤", dim: engineering}
      - {text: "提出制度更新时让旧版本 chunk 下线或标记失效的数据更新机制", dim: engineering}
      - {text: "提到可用关键词检索或 Rerank 辅助，但根因是缺少版本信息", dim: concept}
    reference: |
      **原因**：两份制度结构和措辞几乎一样，只有金额和年份不同。Embedding 衡量的是话题相关性，两段文本向量非常接近，检索时谁排在前面带有偶然性；如果旧版文档还在库里且没有任何「版本」信息，系统就无法区分。
      **修复**：
      1. **入库阶段**：为每个 chunk 写入 `doc_version`、`effective_date`、`status`（有效/作废）等 metadata。
      2. **检索阶段**：默认只检索 `status = 有效` 的 chunk；如果问题里明确提到年份，再按年份过滤。
      3. **更新机制**：新制度发布时，旧版本自动标记作废或删除，而不是让两版并存。
      4. **辅助手段**：Prompt 中展示每段证据的生效日期，让模型在冲突时优先采用最新版本；评估集中加入「新旧版本」类问题做回归。
    followup:
      question: 如果只能改一处，你会改入库阶段还是检索阶段？为什么？
      key_points:
        - 优先改入库阶段补版本 metadata，这是根因修复
        - 没有 metadata，检索阶段无从过滤
      reference: 优先改入库阶段。检索阶段的过滤依赖 metadata，入库时没有记录版本和生效状态，检索阶段无论怎么调参数都无法稳定区分新旧版本。补齐 metadata 后，检索过滤只是一行 WHERE 条件。
  - id: d21-q5
    kp: d21-k2
    type: short
    question: 离线入库和在线问答通常是两套代码。请说明它们之间必须保持一致的「契约」有哪些，不一致会出现什么现象。
    key_points:
      - {text: "必须使用同一个 Embedding 模型和版本，否则向量不在同一空间", dim: principle}
      - {text: "文本预处理规则需一致，例如全半角、大小写、繁简转换", dim: engineering}
      - {text: "metadata 字段名和取值口径一致，否则过滤失效", dim: engineering}
      - {text: "指出不一致时系统通常不报错，只是检索质量悄悄下降，很难发现", dim: concept}
    reference: |
      主要有四类契约：
      1. **Embedding 模型一致**：文档向量和查询向量必须由同一模型、同一版本、同一维度生成。不一致时向量不在同一空间，检索结果接近随机。
      2. **预处理一致**：离线做了全角转半角、去除多余空白，在线也要对问题做相同处理，否则同一个词被表示成不同形式。
      3. **metadata 口径一致**：离线写 `dept_id = "HR"`，在线按 `dept = "人事部"` 过滤，结果就是过滤后什么都查不到或过滤失效。
      4. **距离度量与索引一致**：建索引用余弦距离，查询也必须用余弦距离运算符。
      最危险的是：这些不一致**通常不会报错**，系统照常返回结果，只是质量变差，所以要通过配置集中管理、在 chunk 上记录模型名，并用评估集回归测试。
  - id: d21-q6
    kp: d21-k1
    type: design
    question: 公司有约 3 万份内部文档（制度、手册、合同），老板说「现在有百万上下文的模型了，直接把文档全塞进去就行，不用做 RAG」。请你回应并给出一个最小可行的方案。
    key_points:
      - {text: "估算总量远超窗口，并指出成本和延迟按输入 Token 线性增长", dim: engineering}
      - {text: "指出长上下文存在注意力稀释、中间信息被忽略、版本混用等问题", dim: principle}
      - {text: "指出全塞无法实现按部门或角色的权限隔离，合同等敏感资料会泄露", dim: engineering}
      - {text: "给出 RAG 最小方案：解析切片入库、检索 Top-K 加权限过滤、带引用回答、证据不足拒答", dim: project}
    reference: |
      **回应**：3 万份文档按每份平均几千到上万 Token 估算，总量在亿级 Token，远超任何上下文窗口；即使只塞一部分，每次提问都要为几十万 Token 付费，延迟也会明显变长。
      更关键的是三点：一是窗口很长时模型容易忽略中间内容、被无关资料干扰，准确率不升反降；二是合同、薪酬等敏感资料会被所有人「问出来」，无法做权限控制；三是新旧制度混在一起，模型会混用。
      **最小方案**：
      1. 离线：解析文档 → 按标题和长度切片 → 记录来源、页码、部门、版本 → 向量化写入 pgvector。
      2. 在线：问题向量化 → 按用户权限和「有效版本」过滤后检索 Top-5 → 拼接 Prompt，要求只依据证据回答并标注出处 → 最高相似度低于阈值时直接回答「未找到相关资料」。
      3. 先选 50~100 个真实问题做评估集，验证检索命中率和答案正确率，再迭代。
      长上下文可以保留给「两三份合同对比」这类少量文档的一次性任务。
  - id: d21-q7
    kp: d21-k3
    type: short
    question: 同事提议「把 5000 份制度文档拿去微调模型，这样就不需要做 RAG 了」。请指出这个方案的主要问题。
    key_points:
      - {text: "微调更擅长改变行为和风格，对大量具体事实的记忆不稳定，仍会幻觉", dim: principle}
      - {text: "制度更新后需要重新训练和评估，更新周期长、成本高", dim: engineering}
      - {text: "无法给出答案出处，不满足溯源和审核要求", dim: concept}
      - {text: "无法按用户权限隔离，也难以删除特定知识，存在合规风险", dim: engineering}
    reference: |
      主要有四个问题：
      1. **事实记忆不可靠**：微调主要改变模型「怎么回答」，让它准确记住 5000 份文档中的具体数字和条款并不稳定，仍然会编造。
      2. **更新成本高**：制度每次修订都要重新准备数据、训练、评估、部署，而 RAG 只需重新入库变化的文件。
      3. **不能溯源**：模型无法说明答案出自哪份制度第几条，审核和员工核对都做不到。
      4. **权限与合规**：所有员工共用同一个模型参数，无法按部门隔离；某份文档需要下线时，也无法从参数中精确删除。
      更合理的做法是 RAG 提供事实依据；如果需要统一回答格式或语气，再考虑结构化输出或小规模微调。
code_reading:
  id: d21-c1
  kp: [d21-k2, d21-k4]
  title: 最小 RAG 问答管道
  scenario: 内部制度问答服务的核心函数。FastAPI 接口收到员工问题后调用 answer()，它负责问题向量化、到 pgvector 检索、拼接 Prompt、调用大模型并返回答案和引用。
  language: python
  code: |
    import logging
    import os
    from dataclasses import dataclass

    import psycopg
    from openai import OpenAI
    from pgvector import Vector

    logger = logging.getLogger(__name__)

    client = OpenAI()  # 从环境变量 OPENAI_API_KEY 读取密钥
    EMBED_MODEL = "text-embedding-3-small"
    CHAT_MODEL = os.environ["CHAT_MODEL"]

    SYSTEM_PROMPT = (
        "你是公司制度问答助手。只依据【资料】回答，用 [编号] 标注引用。"
        "资料中没有答案时，回答：未在制度中找到相关规定。"
    )


    @dataclass
    class Hit:
        chunk_id: int
        source: str
        page: int | None
        content: str
        distance: float


    def retrieve(conn: psycopg.Connection, question: str, k: int = 5) -> list[Hit]:
        emb = client.embeddings.create(model=EMBED_MODEL, input=question).data[0].embedding
        rows = conn.execute(
            "SELECT id, source, page, content, embedding <=> %s AS distance "
            "FROM chunks ORDER BY distance LIMIT %s",
            (Vector(emb), k),
        ).fetchall()
        return [Hit(*row) for row in rows]


    def answer(conn: psycopg.Connection, question: str) -> dict:
        hits = retrieve(conn, question)
        logger.info("retrieved ids=%s", [(h.chunk_id, round(h.distance, 3)) for h in hits])
        context = "\n\n".join(
            f"[{i}] 《{h.source}》第{h.page}页\n{h.content}" for i, h in enumerate(hits, 1)
        )
        resp = client.responses.create(
            model=CHAT_MODEL,
            instructions=SYSTEM_PROMPT,
            input=f"【资料】\n{context}\n\n【问题】{question}",
        )
        return {
            "answer": resp.output_text,
            "citations": [{"source": h.source, "page": h.page} for h in hits],
        }
  walkthrough:
    function: |
      实现一次完整的在线问答：把员工问题转成向量，在 `chunks` 表中按余弦距离找最近的 5 个片段，把片段编号后拼进 Prompt，调用大模型生成带引用编号的答案，最后返回答案和引用列表。
    key_functions: |
      - `retrieve()`：调用 Embedding 接口得到问题向量，用 pgvector 的 `<=>`（余弦距离）排序取 Top-K，封装成 `Hit`。
      - `answer()`：编排整个流程——检索、记录日志、拼接上下文、调用 Responses API、组装返回值。
      - `SYSTEM_PROMPT`：约束模型只依据资料回答、标注引用、资料不足时拒答。
    params: |
      - `conn` 由调用方（FastAPI 依赖注入）传入，`retrieve` 复用同一个连接。
      - `question` 原样传给 Embedding 接口和 Prompt。
      - `k` 默认 5，决定送进 Prompt 的片段数量。
      - 模型名一个写死在代码里（`EMBED_MODEL`），一个来自环境变量（`CHAT_MODEL`）。
    data_flow: |
      ```mermaid
      flowchart LR
        Q["question 字符串"] --> E["embeddings.create"] --> V["1536 维查询向量"]
        V --> S["SQL 按余弦距离升序 LIMIT 5"]
        S --> H["list Hit 含距离"]
        H --> C["拼接带编号的 context"]
        C --> R["responses.create"]
        R --> O["answer 和 citations"]
      ```
      数据依次经历「字符串 → 向量 → 数据库行 → 文本上下文 → 模型输出」五种形态，每次形态转换都是一个可能出错、值得打日志的位置。
    failure_points: |
      - **没有相似度阈值（值得审查）**：无论距离多大都取 5 条送给模型。知识库里没有相关内容时，模型拿到 5 段无关资料，仍可能「凑」出一个答案；citations 也会列出 5 个无关出处，误导用户。
      - **没有超时控制（值得审查）**：`OpenAI()` 未设置 `timeout`，SDK 默认超时很长（README 写的是 10 分钟），上游慢时请求线程被长期占住。
      - **没有权限过滤**：SQL 没有任何 WHERE 条件，所有员工都能检索到所有文档。
      - **外部服务失败**：Embedding 或 LLM 调用抛出 `openai.APIError` 系列异常时没有捕获，接口直接 500。
      - **page 为 None** 时会拼出「第None页」。
    debugging: |
      - 先看 `retrieved ids` 日志：Top-5 的 chunk id 和距离是否合理，正确的 chunk 是否在里面。
      - 把距离分布打出来，对比「有答案的问题」和「无关问题」的最小距离，用来标定阈值。
      - 在 `client.responses.create` 前打断点，把完整 Prompt 复制出来单独测试，判断是检索问题还是生成问题。
      - 用一个知识库里肯定没有的问题（如「公司火星分部的报销标准」）复现「无相关资料仍回答」的问题。
    change_request: |
      - **要求无相关资料时直接拒答**：在 `answer()` 中检索后判断 `hits[0].distance` 是否超过标定的阈值（或过滤掉超阈值的 hit），为空则直接返回固定话术，不调用 LLM。
      - **要求按部门过滤**：`retrieve()` 增加 `dept_id` 参数，SQL 加 `WHERE dept_id = %s`，并注意过滤与近似索引的冲突（Day 25）。
      - **要求超时**：创建客户端时传入 `timeout`，并捕获超时异常返回友好提示。
  questions:
    - id: d21-c1-q1
      kp: d21-k2
      type: code
      question: 按执行顺序说明调用 `answer(conn, "试用期可以请年假吗")` 时，数据经过了哪些转换，每一步的输入和输出分别是什么。
      key_points:
        - {text: "问题字符串先经 embeddings.create 变成查询向量，且模型与入库时一致", dim: principle}
        - {text: "向量包装成 Vector 传入 SQL，按 <=> 余弦距离升序取前 5 行", dim: concept}
        - {text: "数据库行被封装为 Hit，再拼成带编号、来源、页码的 context 文本", dim: concept}
        - {text: "context 与问题一起送入 responses.create，返回 output_text 与 citations", dim: engineering}
      reference: |
        1. `answer()` 调用 `retrieve()`，问题字符串传给 `client.embeddings.create`，返回 1536 维浮点向量（text-embedding-3-small 默认维度），它必须和入库时用的模型一致。
        2. 向量用 `Vector(emb)` 包装后作为 SQL 参数，`embedding <=> %s` 计算每行与问题的余弦距离，`ORDER BY distance LIMIT 5` 取最近的 5 行。
        3. 每行 `(id, source, page, content, distance)` 解包成 `Hit` 对象，`answer()` 记录 id 和距离日志。
        4. 用 `enumerate(hits, 1)` 给片段编号，拼成「[1] 《来源》第 N 页 + 原文」的 context。
        5. context 和问题拼成 `input`，系统指令放在 `instructions`，调用 `responses.create`，从 `output_text` 取回答案。
        6. 返回答案和 5 条引用（来源 + 页码）。
    - id: d21-c1-q2
      kp: d21-k4
      type: code
      question: 如果员工问了一个知识库里完全没有的问题，这段代码会怎样表现？问题出在哪里？应该怎么改？
      key_points:
        - {text: "指出检索总会返回 5 条结果，无论距离多大，没有阈值判断", dim: principle}
        - {text: "指出模型拿到无关资料后仍可能编造答案，且 citations 列出无关出处误导用户", dim: concept}
        - {text: "提出用标定后的距离阈值过滤，无结果时不调用 LLM 直接返回拒答话术", dim: engineering}
        - {text: "提出阈值需在自己的数据和当前模型上标定，换模型要重新标定", dim: engineering}
      reference: |
        **表现**：向量检索是「找最近的 K 个」，不是「找相关的」，所以无论问什么都会返回 5 条。系统会把 5 段无关资料交给模型。虽然 Prompt 里写了「没有答案就拒答」，但模型面对看似相关的资料时仍可能硬凑答案；更糟的是 `citations` 固定返回 5 个出处，用户会以为答案有依据。
        **问题根源**：缺少「相关性下限」，把相似度排序误当成了相关性判断。
        **修改**：在 `answer()` 中过滤 `distance` 超过阈值的 hit；过滤后为空就直接返回「未在制度中找到相关规定」，不调用 LLM、也不返回 citations。阈值要用一批「有答案 / 无答案」的问题在当前 Embedding 模型上标定，换模型后重新标定。更进一步可以加 Rerank 打分作为判断依据。
    - id: d21-c1-q3
      kp: d21-k2
      type: code
      question: 这段代码在生产环境中还有哪些稳定性和安全问题？请至少指出三处并说明修改方式。
      key_points:
        - {text: "OpenAI 客户端未设置超时，上游变慢时请求被长时间占住", dim: engineering}
        - {text: "Embedding 和 LLM 调用的异常未处理，接口直接 500 且无降级提示", dim: engineering}
        - {text: "SQL 没有权限过滤，任何员工都能检索全部文档", dim: engineering}
        - {text: "page 为 None 时拼出错误文本，EMBED_MODEL 写死不利于与入库配置保持一致", dim: concept}
      reference: |
        1. **超时**：`OpenAI()` 没有设置 `timeout`，SDK 默认超时很长。应在创建客户端时传入合理超时（例如 Embedding 10 秒、生成 30 秒），并配合有限重试。
        2. **异常处理**：`embeddings.create` 和 `responses.create` 可能抛出限流、超时、服务端错误，当前没有捕获。应捕获后记录日志并返回「服务繁忙，请稍后重试」。
        3. **权限**：检索 SQL 没有任何过滤条件，薪酬、合同类文档对所有人可见。应从登录态取出用户部门或角色，在 SQL 中过滤。
        4. **细节**：`page` 为 None 时显示「第None页」；`EMBED_MODEL` 写死在在线代码中，若离线入库改了模型而这里没改，检索会悄悄失效，应从统一配置读取，并在 chunk 表记录模型名做校验。
interview:
  - id: d21-i1
    kp: d21-k1
    type: oral
    difficulty: 1
    question: 什么是 RAG？它解决了大模型的哪些问题？
    key_points:
      - {text: "说明 RAG 是检索增强生成：先检索相关资料，再让模型依据资料生成", dim: concept}
      - {text: "说出模型的时效性、私有数据缺失、幻觉、不可溯源等问题", dim: concept}
      - {text: "说明 RAG 通过外部知识库实现知识更新、引用出处、权限控制", dim: principle}
      - {text: "结合一个项目场景说明 RAG 的作用", dim: project}
    reference: |
      RAG（Retrieval-Augmented Generation，检索增强生成）的思路是：用户提问时，先从外部知识库中检索出和问题最相关的几段资料，把它们作为证据和问题一起放进 Prompt，再让模型依据证据生成答案并标注出处。
      它主要解决大模型自身知识的四个问题：一是**时效性**，模型知识停在训练截止日期；二是**私有数据缺失**，企业内部文档从未进入训练数据；三是**幻觉**，不知道也会编；四是**不可溯源**，无法给出答案依据。
      RAG 把「知识」从模型参数中剥离到知识库里，带来的工程收益是：知识更新只需重新入库；答案可以附来源和页码；检索时可以按用户权限过滤；每次只输入少量相关证据，成本可控。
    oral: |
      我理解 RAG 就是把大模型的「闭卷考试」变成「开卷考试」。
      用户提问时，系统先去知识库里检索最相关的几段资料，把它们和问题一起交给模型，要求模型只依据这些资料回答，并标注出处。
      它解决的是模型的四个短板：知识过时、不知道企业私有数据、会幻觉、给不出依据。
      比如我做过的制度问答助手，制度经常更新，用 RAG 以后只要重新入库就能生效，每个回答都带「制度名称 + 页码」，员工可以点开核对，出错时也能定位是哪段资料的问题。
  - id: d21-i2
    kp: d21-k1
    type: oral
    difficulty: 2
    question: 现在的模型上下文窗口已经很长了，为什么还需要 RAG？什么情况下可以不用 RAG？
    key_points:
      - {text: "指出企业知识总量远超窗口，且持续增长", dim: concept}
      - {text: "指出长输入成本高、延迟高，注意力被稀释、中间信息易被忽略", dim: principle}
      - {text: "指出全塞无法做权限隔离、版本控制和精确溯源", dim: engineering}
      - {text: "给出可以不用 RAG 的场景：少量文档的一次性分析、对比、总结", dim: project}
    reference: |
      需要 RAG 的原因有四层：
      1. **容量**：企业知识库总量通常是千万到亿级 Token，并且持续增长，任何窗口都装不下。
      2. **成本和延迟**：按输入 Token 计费，每次请求都带上全部资料，成本和首字延迟都会大幅上升。
      3. **效果**：装得下不等于用得好，输入越长，模型越容易忽略中间部分、被无关内容干扰，准确率可能反而下降。
      4. **治理**：全塞进去无法按用户权限隔离，新旧版本混在一起会混用，答错时也难以定位是哪段资料导致的。
      可以不用 RAG 的情况：文档数量少、任务一次性，比如对比两份合同、总结一份报告，这时直接放进上下文更简单。两者也可以结合：先检索出相关文档，再把整篇相关文档放进长上下文，而不只是放几个小片段。
    oral: |
      我的结论是：长上下文降低了对 RAG 的依赖，但替代不了它。
      第一是装不下，企业知识动辄上亿 Token；第二是贵和慢，每次都为全部资料付费；第三是效果，输入越长模型越容易漏掉中间信息；第四是治理，权限隔离、版本控制、溯源都做不了。
      当然，如果只是对比两份合同、总结一份报告，我会直接用长上下文。
      在实际项目里我们也会结合：先检索到相关文档，再把相关章节完整放进上下文，兼顾准确率和成本。
  - id: d21-i3
    kp: d21-k3
    type: oral
    difficulty: 2
    question: RAG 和微调分别适合什么场景？你会如何给客户做选型建议？
    key_points:
      - {text: "说明 RAG 改输入、注入事实知识；微调改参数、调整行为和风格", dim: concept}
      - {text: "从知识更新、可溯源、权限、删除知识、成本几个维度对比", dim: principle}
      - {text: "指出两者可以组合，例如 RAG 加微调 Embedding 或输出格式", dim: engineering}
      - {text: "给出一个具体的选型案例和理由", dim: project}
    reference: |
      **本质区别**：RAG 不改模型，改的是每次请求的输入，适合注入大量且经常变化的事实知识；微调改的是模型参数，适合让模型稳定地表现某种行为，比如固定格式、特定语气、领域术语习惯。
      **对比维度**：知识更新上，RAG 重新入库即可，微调要重训；溯源上，RAG 能给出处，微调不能；权限上，RAG 可以检索时过滤，微调后的知识所有人共享；删除知识上，RAG 删 chunk 即可，微调很难让模型「遗忘」；成本上，RAG 有建库和检索成本，微调有训练、评估、维护成本。
      **选型建议**：知识多且常变、需要出处 → RAG；输出格式、风格要求高 → 先用 Prompt 和结构化输出，不够再微调；两者常组合使用，比如 RAG 提供事实，再微调 Embedding 模型提升领域检索效果。
    oral: |
      我一般用一句话区分：RAG 解决「模型知道什么」，微调解决「模型怎么说」。
      选型时我会问客户三个问题：知识会不会经常变？需不需要给出处？不同人能看到的资料是否不同？只要有一个答案是「是」，事实知识就应该放在 RAG 里。
      微调我会留给格式和风格这类需求，而且会先试 Prompt 和结构化输出。
      比如一个保险条款助手，条款每季度更新还要给条款编号，我们用 RAG 做事实依据，只对 Embedding 模型做了领域微调来提升术语检索效果。
  - id: d21-i4
    kp: d21-k2
    type: oral
    difficulty: 3
    question: 请讲一下 RAG 的完整链路，离线入库和在线问答分别有哪些步骤？每一步最容易出什么问题？
    key_points:
      - {text: "离线：解析、清洗、切片、补 metadata、向量化、入库，能说出每步产物", dim: concept}
      - {text: "在线：问题处理、向量化、带过滤的检索、重排、组装 Prompt、生成带引用回答", dim: concept}
      - {text: "说出每步典型故障，如扫描件无文本、切片断章取义、模型不一致、权限未过滤", dim: engineering}
      - {text: "说明两条链路的契约和按入库、检索、生成三步定位问题的方法", dim: project}
    reference: |
      **离线入库**：文档上传或更新时触发。① 解析：把 PDF、Word 转成文本和结构，扫描件需要 OCR，表格、页眉页脚、多栏排版容易出错；② 清洗与切片：按标题和长度切成 chunk，太大语义稀释，太小断章取义；③ 补 metadata：来源、页码、标题路径、部门、版本，缺了就无法引用和过滤；④ 向量化：批量调用 Embedding，要处理限流和超长；⑤ 入库：写入 pgvector 并建索引，注意维度和距离度量。
      **在线问答**：用户提问时触发。① 问题预处理和可选的改写；② 用同一个 Embedding 模型向量化；③ 带权限和版本过滤的 Top-K 检索；④ 可选 Rerank；⑤ 阈值判断后组装 Prompt；⑥ 生成带引用的回答，证据不足则拒答。
      **契约**：两条链路必须使用同一模型、同一预处理、同一 metadata 口径。
      **排障**：按「资料入库了吗 → 检索到了吗 → 模型用对了吗」三步定位，分别对应入库、检索、生成问题，所以每次请求都要记录检索结果和最终 Prompt。
    oral: |
      RAG 我会拆成两条链路来讲。
      离线入库是文档上传时跑的：解析、切片、补 metadata、向量化、写入向量库。最容易出问题的是解析和切片，比如扫描件解析出空文本、表格被拍平、条款被切成两半。
      在线问答是用户提问时跑的：问题向量化、带权限过滤的检索、可选重排、拼 Prompt、生成带引用的答案，最容易出问题的是检索不准和没有拒答机制。
      两条链路之间要保证同一个 Embedding 模型和同一套 metadata 口径。
      我们项目里排障就按「入库了吗、检索到了吗、用对了吗」三步走，有一次答错，查到最后是新政策 PDF 是扫描件没做 OCR。
  - id: d21-i5
    kp: d21-k4
    type: oral
    difficulty: 4
    question: 线上用户反馈「引用的资料看起来很相关，但答案是错的」。请分析原因，并给出一套系统性的治理方案。
    key_points:
      - {text: "指出向量相似度只衡量话题相关，不保证包含答案、版本有效、事实正确", dim: principle}
      - {text: "列举版本冲突、数字或型号差异、否定句、问题匹配问题等典型原因", dim: concept}
      - {text: "提出 metadata 过滤、混合检索、Rerank、阈值拒答、生成约束等多层治理手段", dim: engineering}
      - {text: "提出用评估集分别度量检索和生成，并把线上 bad case 纳入回归测试", dim: project}
    reference: |
      **原因分析**：向量相似度衡量的是「两段文字是否在谈同一件事」，不判断片段是否包含答案、是否是有效版本、是否正确。常见情况有：新旧版本制度措辞几乎相同；不同型号的参数段落结构一致；肯定句和否定句向量接近；FAQ 中「问题」与用户问题最像，但答案在别的 chunk；总则类段落关键词多但没有具体答案。另外也可能是检索对了，生成阶段模型读错或混用了多段证据。
      **治理方案（分层）**：
      1. **入库层**：补齐版本、生效日期、产品型号、部门等 metadata；FAQ 按「问题 + 答案」整体入库；旧版本下线。
      2. **检索层**：按 metadata 过滤；向量 + 关键词混合检索，型号和编号精确匹配；Rerank 判断片段是否真正回答问题；阈值以下拒答。
      3. **生成层**：Prompt 要求只依据证据、逐句引用、冲突时说明并优先最新版本；证据不足就说不知道。
      4. **评估与运营**：建立评估集，分别度量检索命中率（Recall@K）和答案忠实度；把线上 bad case 加入评估集做回归，每次调整切片、模型、阈值都跑一遍。
    oral: |
      我会先说结论：相似度高只代表话题相关，不代表答案正确。
      常见原因有新旧版本措辞一样、不同型号参数段落长得一样、肯定句和否定句向量很接近，还有 FAQ 里的问题和用户问题最像但答案在别处。
      治理我分四层做：入库层补版本、型号等 metadata；检索层做过滤、混合检索和 Rerank，再加阈值拒答；生成层要求逐句引用、证据不足就说不知道；最后用评估集分别看检索和生成，把 bad case 加入回归。
      我们遇到过 X100 和 X200 保修期答混的问题，就是靠型号 metadata 过滤加关键词检索兜底解决的。
