day: 3
phase: 1
title: 函数与面向对象
goals:
  - 能解释 Python 参数的绑定规则（位置、关键字、默认值、*args、**kwargs、仅关键字参数），并识别可变默认参数陷阱
  - 能说清 LEGB 作用域和闭包的工作方式，为 Day 05 的装饰器打基础
  - 能读懂类、实例属性与类属性、继承与 super()，判断哪些状态会在实例之间共享
  - 能解释类型注解在运行时不强制，但 FastAPI/Pydantic 如何读取注解做校验，并在 dataclass 与 Pydantic 之间做选择
knowledge_points:
  - id: d03-k1
    name: 函数参数机制与可变默认参数陷阱
    level: P0
    summary: 参数按位置、关键字、*args、**kwargs 绑定；默认值在 def 时只求值一次，可变默认值会被所有调用共享
    why: |
      AI 生成的后端代码里，函数签名往往很复杂：`def call_llm(prompt, *, model="x", retries=3, **kwargs)`。**看不懂参数绑定规则，就判断不了某个参数到底从哪来、会不会被覆盖。** 可变默认参数更是 Python 面试必考题，也是线上「数据串号」事故的常见根源。
    problem: |
      Python 的参数机制让一个函数既能被简单调用，又能灵活扩展（透传参数给下游 SDK、强制关键字参数提高可读性）。理解它能让你读懂包装函数如何把参数一层层传下去，并发现「默认值被意外共享」「参数被 kwargs 吞掉」这类问题。
    principle: |
      **一、五种参数，按固定顺序声明**

      ```python
      def f(a, b=2, /, c=3, *args, d, e=5, **kwargs): ...
      ```

      - `a, b`（在 `/` 之前）：**仅位置参数**，调用方不能写 `a=1`。
      - `c`：普通参数，位置或关键字都可以。
      - `*args`：把**多余的位置参数**收集成一个 **tuple**。
      - `d, e`（在 `*args` 或单独的 `*` 之后）：**仅关键字参数**，必须写 `d=...`。AI 后端代码常用 `def chat(messages, *, model, temperature=0.7)` 强制调用方写清参数名，避免位置传错。
      - `**kwargs`：把**多余的关键字参数**收集成一个 **dict**。

      **二、调用时的绑定过程**

      ```mermaid
      flowchart TB
        CALL["调用 f 传入实参"] --> P["按顺序把位置实参绑定到位置形参"]
        P --> EXTRA{"还有多余位置实参吗"}
        EXTRA -->|"有且定义了 *args"| A["收集进 args 元组"]
        EXTRA -->|"有但没有 *args"| ERR1["TypeError 参数过多"]
        EXTRA -->|"没有"| K["按名字绑定关键字实参"]
        A --> K
        K --> DUP{"同一形参被绑定两次吗"}
        DUP -->|"是"| ERR2["TypeError got multiple values"]
        DUP -->|"否"| KW{"有未知名字的关键字实参吗"}
        KW -->|"有且定义了 **kwargs"| KD["收集进 kwargs 字典"]
        KW -->|"有但没有 **kwargs"| ERR3["TypeError unexpected keyword"]
        KW -->|"没有"| DEF["未绑定的形参使用默认值"]
        KD --> DEF
        DEF --> MISS{"仍有必填形参未绑定吗"}
        MISS -->|"是"| ERR4["TypeError missing argument"]
        MISS -->|"否"| RUN["执行函数体"]
      ```

      调用方也可以用 `*` 和 `**` **解包**：`f(*items, **options)` 把列表展开成位置参数、把 dict 展开成关键字参数。包装函数里常见 `return client.create(*args, **kwargs)` 原样透传。

      **三、传参的本质：传对象引用**

      形参是函数局部命名空间里的新名字，绑定到调用方传入的**同一个对象**（Day 01 的名字绑定模型）。所以：

      - 在函数里 `items.append(x)`：原地修改，**调用方能看到**。
      - 在函数里 `items = [x]`：只是让局部名字指向新对象，**调用方不受影响**。

      **四、可变默认参数陷阱**

      **默认值表达式在 `def` 语句执行时求值一次**，结果保存在函数对象的 `__defaults__` 里，之后每次调用都复用同一个对象。

      ```python
      def add_tag(tag, tags=[]):
          tags.append(tag)
          return tags

      add_tag("a")   # ['a']
      add_tag("b")   # ['a', 'b']  上一次的结果还在
      print(add_tag.__defaults__)   # (['a', 'b'],)
      ```

      `def` 通常在模块导入时执行一次，所以这个默认列表会在**整个进程生命周期、所有请求之间共享**。标准写法：

      ```python
      def add_tag(tag: str, tags: list[str] | None = None) -> list[str]:
          tags = [] if tags is None else tags
          tags.append(tag)
          return tags
      ```

      同样的道理：`def log(ts=datetime.now())` 的时间永远是导入时那一刻。

      **五、为什么这样设计**

      默认值只求值一次是为了性能和语义简单：函数对象创建时就确定默认值，调用时不需要重新执行表达式。代价就是可变默认值会被共享。**Pydantic 模型字段不受此影响**（不可哈希的默认值会为每个实例深拷贝），**dataclass 会直接拒绝**不可哈希的默认值，但**普通函数和普通类的 `__init__` 没有任何保护**。

      **不这样理解会怎样**：会写出「第一个用户的请求头被所有用户复用」「缓存的列表越积越多」这类只在线上长时间运行后才暴露的 bug；也会看不懂 `**kwargs` 透传时某个参数为什么被静默忽略或重复传入。
    scenarios: |
      - **SDK 包装**：`def chat(messages, **kwargs): return client.chat.completions.create(model=MODEL, messages=messages, **kwargs)`，如果调用方也传了 `model=`，会触发 `got multiple values for keyword argument 'model'`。
      - **强制关键字参数**：`def search(query, *, top_k=5, filters=None)` 防止 `search("q", 10)` 这种含义不明的调用。
      - **可变默认值审查**：看到 `=[]`、`={}`、`=set()`、`=datetime.now()` 作为普通函数默认值，直接标记为问题。
    code: |
      ```python
      from typing import Any

      def call_llm(prompt: str, *, model: str = "chat-default", temperature: float = 0.7, **extra: Any) -> dict:
          payload = {"model": model, "temperature": temperature,
                     "messages": [{"role": "user", "content": prompt}], **extra}
          return payload

      print(call_llm("你好", temperature=0, max_tokens=256))
      # {'model': 'chat-default', 'temperature': 0, 'messages': [...], 'max_tokens': 256}

      try:
          call_llm("你好", 0.2)          # 仅关键字参数不能按位置传
      except TypeError as e:
          print(e)

      opts = {"model": "m2", "top_p": 0.9}
      print(call_llm("hi", **opts)["model"])   # m2，dict 解包成关键字参数

      def bad(headers: dict = {}) -> dict:
          headers.setdefault("X-Count", 0)
          headers["X-Count"] += 1
          return headers

      bad(); print(bad())                     # {'X-Count': 2}，默认 dict 被共享
      ```
    pitfalls: |
      - **误区：默认值每次调用都会重新创建。** 只在 def 执行时创建一次。
      - **误区：`*args` 是 list。** 它是 tuple；`**kwargs` 是 dict。
      - **误区：`**kwargs` 透传很安全。** 拼错的参数名（如 `temprature`）会被静默收进 kwargs，直到下游 SDK 报错甚至被忽略。
      - **误区：Python 是值传递所以函数里改参数不影响外部。** 原地修改可变对象会影响调用方。
      - **混淆：`*` 在 def 中是「收集」，在调用中是「解包」。**
    interview_asks:
      - "Python 函数默认参数为什么不能用可变对象？背后的原理是什么？"
      - "*args 和 **kwargs 分别是什么类型？什么时候用？"
      - "仅关键字参数和仅位置参数有什么用？"
    project_example: |
      一个多租户网关里有 `def build_headers(tenant_key, headers={}): headers["Authorization"] = f"Bearer {tenant_key}"; return headers`。调用方多数时候不传 headers，于是所有租户拿到的是同一个 dict。并发高峰时，租户 A 的请求在发出前被租户 B 覆盖了 Authorization，导致 A 的调用记到了 B 的账上。修复为 `headers: dict | None = None` 并在函数内新建 dict，同时加了 ruff 的 B006 规则（禁止可变默认参数）到 CI。

  - id: d03-k2
    name: 作用域与闭包
    level: P1
    summary: 名字按 LEGB 顺序查找；闭包让内层函数记住外层变量，是装饰器的基础
    why: |
      AI 生成的重试、缓存、限流代码几乎都依赖闭包；Day 05 的装饰器本质就是「返回一个闭包」。**不理解作用域，就看不懂为什么函数里改全局变量会报 UnboundLocalError，也看不懂循环里创建的回调为什么都拿到最后一个值。**
    problem: |
      作用域规则决定一个名字在函数里指向哪个对象；闭包让函数可以携带私有状态（比如重试次数、计数器、配置），而不必定义一个类或使用全局变量。这让工具函数和装饰器可以写得很简洁。
    principle: |
      **一、LEGB 查找顺序**

      读取一个名字时，Python 依次查找：

      1. **L**ocal：当前函数的局部变量。
      2. **E**nclosing：外层（嵌套）函数的局部变量。
      3. **G**lobal：当前模块的全局变量。
      4. **B**uilt-in：内置名字（`len`、`print`）。

      **二、赋值决定作用域（编译期决定）**

      只要函数体里**任何位置**对某个名字赋值，编译器就把它当成局部变量。所以下面代码会报 `UnboundLocalError`：

      ```python
      count = 0
      def inc():
          count += 1      # count 被视为局部变量，但读取时还没赋值
      ```

      需要修改模块级变量用 `global count`，修改外层函数变量用 `nonlocal count`。**在后端代码里看到 `global`，通常意味着跨请求共享的可变状态，要警惕线程安全和多进程不一致。**

      **三、闭包：函数 + 它记住的外层变量**

      ```python
      def make_counter():
          n = 0
          def inc():
              nonlocal n
              n += 1
              return n
          return inc

      c = make_counter()
      c(); c()        # 2
      ```

      `make_counter` 返回后，局部变量 `n` 本应消失，但因为 `inc` 引用了它，Python 把 `n` 存进一个 **cell 对象**，挂在 `inc.__closure__` 上。每次调用 `make_counter()` 都会创建新的 cell，所以不同计数器互不影响。

      **四、晚绑定陷阱**

      闭包记住的是**变量本身**，而不是定义时的值：

      ```python
      handlers = [lambda: i for i in range(3)]
      print([h() for h in handlers])    # [2, 2, 2]
      ```

      三个 lambda 共享同一个变量 i，调用时 i 已经是 2。修复：`lambda i=i: i`（利用默认值在定义时求值）或 `functools.partial`。

      **五、函数是一等对象**

      函数可以赋值给变量、放进 dict、作为参数传递、作为返回值。工具注册表 `TOOLS = {"search": search_docs}`、回调 `on_token=print`、`sorted(key=...)` 都依赖这一点，也是装饰器能工作的前提。
    scenarios: |
      - **工具路由**：Agent 中用 `{"search": search_fn, "calc": calc_fn}` 按工具名分发调用（见 Day 33）。
      - **配置化工厂**：`make_retry(max_attempts=3)` 返回一个记住配置的函数。
      - **排查 UnboundLocalError**：函数里给全局变量赋值却没写 global。
      - **审查回调**：循环中批量注册回调时检查是否有晚绑定问题。
    pitfalls: |
      - **误区：函数里能读全局变量，就也能直接改。** 赋值会让它变成局部变量，需要 global/nonlocal。
      - **误区：闭包捕获的是当时的值。** 捕获的是变量，调用时才读取当前值。
      - **误区：用 global 保存请求状态很方便。** 多线程下会互相覆盖，多进程下各进程不一致。
      - **混淆：推导式有自己的作用域，循环变量不会泄露；但普通 for 循环的变量在循环结束后仍可访问。**
    interview_asks:
      - "什么是闭包？Python 中闭包是怎么保存外层变量的？"
      - "为什么在函数里修改全局变量会报 UnboundLocalError？global 和 nonlocal 有什么区别？"
    project_example: |
      在一个 Agent 项目中，开发者在循环里为每个工具注册回调：`for name in tool_names: callbacks[name] = lambda args: run_tool(name, args)`。结果无论模型调用哪个工具，实际执行的都是最后一个工具。原因是所有 lambda 共享循环变量 name。改为 `lambda args, name=name: run_tool(name, args)` 后恢复正常，并补了「每个工具名分发到正确函数」的测试。

  - id: d03-k3
    name: 类与对象：属性、封装、继承与 super()
    level: P0
    summary: 实例属性每个对象一份，类属性所有实例共享；封装靠约定，继承按 MRO 查找方法
    why: |
      AI 后端中到处是类：`LLMClient`、`VectorStore`、`Settings`、Pydantic 模型、SQLAlchemy 模型、自定义异常。**读懂一个类的关键，是判断哪些状态属于单个实例、哪些被所有实例共享**，以及子类调用的方法到底来自哪一层。这直接决定了多租户、并发场景下数据会不会串。
    problem: |
      类把数据和操作数据的方法绑定在一起，用于建模有状态的组件（一个带连接池的数据库客户端、一个带重试配置的 LLM 客户端）；继承和组合用于复用和扩展行为。理解类的机制后，你能读懂框架的扩展点（比如继承 `BaseModel`、`Exception`），并发现共享状态 bug。
    principle: |
      **一、类、实例与 self**

      - `class LLMClient:` 执行时创建一个**类对象**；`client = LLMClient(...)` 调用类对象，先 `__new__` 创建实例，再 `__init__(self, ...)` 初始化。
      - `self` 就是实例本身，Python 不会隐式绑定 this，必须显式写。`client.chat(q)` 等价于 `LLMClient.chat(client, q)`。和 JS 不同，Python 的方法从实例上取出时就已经绑定了 self，不存在「this 丢失」的问题。

      **二、实例属性 vs 类属性（最重要）**

      ```python
      class Client:
          cache = {}               # 类属性：定义在类体里，所有实例共享一份
          def __init__(self, model):
              self.model = model   # 实例属性：每个实例各一份
      ```

      **属性查找顺序**：先找实例的 `__dict__`，找不到再找类，再沿继承链找父类。所以：

      - `self.cache["k"] = v`：先查到类属性那个 dict，再**原地修改**它 —— **所有实例都看到了**。
      - `self.cache = {}`：在实例上新建同名属性，遮蔽了类属性，只影响这一个实例。

      类属性适合放**常量**（如 `DEFAULT_TIMEOUT = 30`），**绝不应放可变的业务状态**（缓存、请求头、计数器），除非你明确希望进程内全局共享并处理好线程安全。

      **三、封装：靠约定而不是强制**

      - `_name`：约定为内部使用，外部「不应该」访问，但语言不阻止。
      - `__name`：触发**名称改写（name mangling）**，变成 `_类名__name`，主要用于避免子类意外覆盖，不是真正的私有。
      - `@property`：把方法伪装成属性，用于只读属性或在读写时加校验。
      - `@classmethod`（第一个参数是 cls，常用作替代构造器 `from_env()`）、`@staticmethod`（不需要 self/cls 的工具函数）。

      **四、继承、super() 与 MRO**

      ```mermaid
      classDiagram
        class BaseLLMClient {
          +str model
          +float timeout
          +chat(messages) str
          #_post(payload) dict
        }
        class OpenAICompatClient {
          +str base_url
          +chat(messages) str
        }
        class TenantClient {
          +str tenant_id
          +chat(messages) str
        }
        BaseLLMClient <|-- OpenAICompatClient
        OpenAICompatClient <|-- TenantClient
      ```

      - 子类没定义的方法沿继承链向上查找。查找顺序叫 **MRO**（方法解析顺序），可用 `TenantClient.__mro__` 查看。多继承时 Python 用 **C3 线性化**保证每个类只出现一次、子类先于父类。
      - `super().__init__(...)` 调用的是 **MRO 中的下一个类**，而不是简单的「父类」。子类重写 `__init__` 却忘了调用 `super().__init__()`，父类里设置的属性就不存在，之后访问会抛 `AttributeError`。

      **五、常用魔术方法**

      `__repr__`（调试打印）、`__eq__`/`__hash__`（比较与哈希，Day 02）、`__len__`、`__iter__`（Day 05）、`__enter__`/`__exit__`（Day 05）、`__call__`（让实例可以像函数一样调用）。框架大量依赖这些「协议」，而不是依赖接口继承——这叫**鸭子类型**：只要有对应方法就能用。

      **六、组合优于继承**

      继承层次一深，就很难判断某个方法来自哪里。工程上更推荐**组合**：`RAGService` 持有一个 `retriever` 和一个 `llm_client`，而不是继承它们。这样替换实现（换向量库、换模型供应商）只需传入不同对象，测试时也能传入假对象。

      **不这样理解会怎样**：会把租户的 API Key、缓存写进类属性导致跨租户共享；会因为子类忘记调用 super().__init__ 出现奇怪的 AttributeError；会把 `__x` 当成安全的私有属性。
    scenarios: |
      - **客户端封装**：`LLMClient` 保存 base_url、超时、重试配置（实例属性），`DEFAULT_TIMEOUT` 作为类常量。
      - **替代构造器**：`Settings.from_env()` 用 classmethod 从环境变量构建实例。
      - **自定义异常体系**：`class LLMError(Exception)`，`class LLMTimeoutError(LLMError)`，按继承层次捕获（见 Day 04）。
      - **组合**：`RAGService(retriever, llm, reranker)`，测试时注入假的 retriever。
    code: |
      ```python
      class BaseClient:
          DEFAULT_TIMEOUT = 30.0            # 类常量：合理
          shared_cache: dict[str, str] = {} # 类属性里的可变状态：危险

          def __init__(self, model: str, timeout: float | None = None) -> None:
              self.model = model
              self.timeout = timeout or self.DEFAULT_TIMEOUT

          @classmethod
          def from_env(cls) -> "BaseClient":
              import os
              return cls(model=os.getenv("LLM_MODEL", "chat-default"))

          def __repr__(self) -> str:
              return f"{type(self).__name__}(model={self.model!r})"

      class TenantClient(BaseClient):
          def __init__(self, tenant_id: str, **kwargs) -> None:
              super().__init__(**kwargs)    # 忘记这行，self.model 就不存在
              self.tenant_id = tenant_id

      a, b = TenantClient("t1", model="m"), TenantClient("t2", model="m")
      a.shared_cache["q"] = "t1 的答案"
      print(b.shared_cache)                 # {'q': 't1 的答案'}，跨租户共享
      print(TenantClient.__mro__)           # TenantClient -> BaseClient -> object
      ```
    pitfalls: |
      - **误区：类体里定义的 `cache = {}` 是每个实例一份。** 它是类属性，所有实例共享。
      - **误区：`__private` 是真正的私有。** 只是名称改写，`obj._Class__private` 照样能访问。
      - **误区：`super()` 就是父类。** 它是 MRO 中的下一个类，多继承时可能不是你以为的那个。
      - **误区：子类重写 `__init__` 会自动调用父类的。** 不会，必须显式 `super().__init__()`。
      - **设计误区：为了复用一个方法就继承。** 优先组合，继承层次越深越难读。
    interview_asks:
      - "类属性和实例属性有什么区别？类属性里放可变对象会有什么问题？"
      - "Python 有真正的私有属性吗？_x 和 __x 有什么区别？"
      - "super() 的作用是什么？什么是 MRO？"
      - "继承和组合你怎么选？"
    project_example: |
      某 RAG 服务的 `Retriever` 类在类体里定义了 `_cache = {}` 来缓存检索结果，key 只用了问题文本。服务为每个租户创建一个 Retriever 实例，开发者以为缓存是各自隔离的。结果租户 B 问了和租户 A 一样的问题时，直接拿到了 A 的私有文档片段。修复为在 `__init__` 中 `self._cache = {}`，并把租户 ID 加入缓存 key，同时补了跨租户隔离测试。

  - id: d03-k4
    name: 类型注解、dataclass 与 Pydantic
    level: P0
    summary: 类型注解默认不在运行时强制；FastAPI/Pydantic 读取注解做校验和文档，dataclass 只生成样板代码
    why: |
      FastAPI 的路由参数、请求体、依赖注入，以及 LLM 结构化输出，**全部建立在类型注解之上**。看不懂 `Annotated[str, Query(max_length=50)]`、`list[Message] | None = None`，就看不懂接口的输入输出契约；分不清 dataclass 和 Pydantic，就会在需要校验外部数据的地方用了不校验的 dataclass。
    problem: |
      类型注解解决「让人和工具都知道每个值应该是什么类型」的问题：编辑器补全、静态检查（mypy/pyright）提前发现错误；框架在运行时读取注解，自动完成请求解析、类型转换、校验和 OpenAPI 文档生成。dataclass 和 Pydantic 则省去手写 `__init__`、`__repr__`、`__eq__` 和校验逻辑的样板代码。
    principle: |
      **一、注解本身不做任何事**

      ```python
      def f(x: int) -> int:
          return x * 2

      f("ab")   # 返回 'abab'，不会报错
      ```

      注解只是元数据，存放在 `f.__annotations__`（3.14 起推荐用 `annotationlib.get_annotations()` 读取）。**Python 解释器不检查类型**，这和 TS 一样（TS 类型在编译后被擦除），区别是 Python 的注解在运行时**可以被读取**——这正是 FastAPI 和 Pydantic 的基础。

      **二、FastAPI/Pydantic 如何利用注解**

      ```mermaid
      flowchart LR
        A["路由函数签名与 Pydantic 模型注解"] --> B["启动时 FastAPI 用 inspect 读取签名和注解"]
        B --> C["生成每个参数的校验规则 由 pydantic-core 执行"]
        B --> D["生成 OpenAPI 文档 /docs"]
        R["HTTP 请求 JSON 与查询参数"] --> E["按规则解析与类型转换"]
        C --> E
        E -->|"校验失败"| F["自动返回 422 和错误明细"]
        E -->|"校验通过"| G["以正确类型的对象调用路由函数"]
      ```

      - `q: str | None = None` → 可选查询参数；`body: ChatRequest` → JSON 请求体按模型校验。
      - `Annotated[int, Query(ge=1, le=50)]`：`Annotated` 的第一个参数是真实类型，后面是给框架的元数据。FastAPI 官方推荐这种写法。
      - Pydantic 默认是**宽松模式**：`"123"` 可以被转换成 `int` 123；需要严格时用 `strict=True`。

      **三、dataclass：标准库的样板代码生成器**

      ```python
      from dataclasses import dataclass, field

      @dataclass(frozen=True, slots=True)
      class Chunk:
          doc_id: str
          text: str
          score: float = 0.0
          tags: list[str] = field(default_factory=list)
      ```

      - 根据注解自动生成 `__init__`、`__repr__`、`__eq__`；`frozen=True` 时实例不可修改并自动生成 `__hash__`（可放进 set）；`slots=True` 节省内存。
      - **不做类型校验**：`Chunk(doc_id=123, text=None)` 照样创建成功。
      - **可变默认值必须用 `field(default_factory=list)`**：写 `tags: list[str] = []` 会在类定义时直接抛 `ValueError`（3.11 起凡是不可哈希的默认值都会被拒绝）。

      **四、Pydantic BaseModel：带校验的数据模型（v2 写法）**

      - 创建实例时校验并转换类型，失败抛 `ValidationError`，FastAPI 会把它变成 422 响应。
      - 用 `Field(min_length=1, ge=0, le=2)` 声明约束；用 `@field_validator` 写自定义校验。
      - 配置用 `model_config = ConfigDict(...)`；序列化用 `model_dump()` / `model_dump_json()`。**旧写法** `class Config:`、`.dict()`、`.json()`、`@validator` 是 Pydantic v1 的，仍兼容但已弃用。
      - 不可哈希的默认值（如 `[]`）Pydantic 会**为每个实例深拷贝**，所以 `history: list[Message] = []` 是安全的。

      **五、怎么选**

      | 场景 | 选择 |
      |---|---|
      | 外部输入：HTTP 请求体、LLM 结构化输出、配置 | Pydantic（需要校验） |
      | 内部传递、已确定可信的数据，追求轻量 | dataclass |
      | 数据库表映射 | ORM 模型（SQLAlchemy / SQLModel，见 Day 10） |

      **不这样理解会怎样**：会以为写了 `-> int` 就保证返回 int；会用 dataclass 接收 LLM 返回的 JSON，脏数据一路流进数据库；会照抄网上的 Pydantic v1 写法，在新项目里留下一堆弃用警告甚至在 Python 3.14 上无法运行。
    scenarios: |
      - **接口契约**：`class ChatRequest(BaseModel): question: str = Field(min_length=1, max_length=2000)`，空问题直接 422。
      - **LLM 结构化输出**：用 Pydantic 模型校验模型返回的 JSON（见 Day 19）。
      - **内部数据**：检索层返回 `list[Chunk]`（frozen dataclass），轻量且可哈希去重。
      - **配置**：pydantic-settings 的 `BaseSettings` 从环境变量按注解解析类型。
    code: |
      ```python
      from dataclasses import dataclass, field
      from typing import Annotated

      from fastapi import FastAPI, Query
      from pydantic import BaseModel, ConfigDict, Field, ValidationError

      @dataclass(frozen=True)
      class Chunk:
          doc_id: str
          score: float
          tags: list[str] = field(default_factory=list)

      class Message(BaseModel):
          role: str
          content: str

      class ChatRequest(BaseModel):
          model_config = ConfigDict(extra="forbid")       # 未知字段直接报错
          question: str = Field(min_length=1, max_length=2000)
          temperature: float = Field(default=0.7, ge=0, le=2)
          history: list[Message] = []                     # Pydantic 会为每个实例复制

      try:
          ChatRequest(question="", temperature="3")
      except ValidationError as e:
          print(e.error_count())                          # 2

      req = ChatRequest(question="年假几天", temperature="0.2")
      print(req.temperature, type(req.temperature))       # 0.2 <class 'float'>，宽松模式转换
      print(req.model_dump())

      app = FastAPI()

      @app.get("/search")
      def search(q: Annotated[str, Query(min_length=1)], top_k: Annotated[int, Query(ge=1, le=50)] = 5):
          return {"q": q, "top_k": top_k}
      ```
    pitfalls: |
      - **误区：写了类型注解，Python 运行时就会检查。** 只有 Pydantic/FastAPI 等主动读取注解的库才会校验。
      - **误区：dataclass 会校验字段类型。** 不会，它只生成样板方法。
      - **误区：Pydantic 字段 `= []` 和函数默认参数 `= []` 一样危险。** Pydantic 会复制默认值，函数默认参数不会。
      - **旧写法：`class Config`、`.dict()`、`@validator`** 属于 Pydantic v1，新代码应使用 `model_config`、`model_dump()`、`@field_validator`。
      - **混淆：`Optional[str]` 不等于「可以不传」。** 是否必填取决于有没有默认值，`str | None` 没有默认值时仍是必填。
    interview_asks:
      - "Python 的类型注解在运行时有作用吗？FastAPI 是怎么利用它的？"
      - "dataclass 和 Pydantic BaseModel 有什么区别？各自适合什么场景？"
      - "Pydantic v1 和 v2 的常见写法有哪些不同？"
    project_example: |
      一个工单分类服务让 LLM 输出 JSON，开发者用 `@dataclass class Ticket: category: str; priority: int` 承接 `Ticket(**json.loads(text))`。某次模型返回了 `"priority": "高"`，dataclass 不做校验照样创建成功，字符串一路写进数据库的整数列才报错，且已有部分数据入库。改为 Pydantic 模型 `priority: int = Field(ge=1, le=5)` 后，校验失败会在解析阶段立即抛出 ValidationError，由上层触发重新生成。
    freshness: |
      核对于 2026-11：Pydantic 最新为 v2.14.x（v2.14.0 于 2026-10-08 发布）；v2 写法为 `model_config = ConfigDict(...)`、`model_dump()`、`@field_validator`，v1 的 `class Config` 仍支持但已弃用；官方说明 Pydantic V1 与 Python 3.14 及以上不兼容。Python 3.14 起注解改为延迟求值（PEP 649/749），前向引用不再需要加引号，可用 `annotationlib` 读取；`from __future__ import annotations` 仍会把注解变为字符串。FastAPI 官方文档推荐 `Annotated` 风格声明参数元数据。
    sources:
      - {title: "FastAPI - Python Types Intro", url: "https://fastapi.tiangolo.com/python-types/"}
      - {title: "Pydantic - Fields（Mutable default values）", url: "https://pydantic.dev/docs/validation/latest/concepts/fields/"}
      - {title: "Pydantic - Configuration", url: "https://pydantic.dev/docs/validation/latest/concepts/config/"}
      - {title: "Pydantic - Changelog", url: "https://pydantic.dev/docs/validation/latest/get-started/changelog"}
      - {title: "Python 文档 - dataclasses", url: "https://docs.python.org/3/library/dataclasses.html"}
      - {title: "What's new in Python 3.14 - PEP 649 deferred annotations", url: "https://docs.python.org/3/whatsnew/3.14.html"}

quiz:
  - id: d03-q1
    kp: d03-k1
    type: single
    question: |
      下面代码连续调用两次后，第二次 `print` 的输出是什么？

      ```python
      def collect(item, bucket=[]):
          bucket.append(item)
          return bucket

      collect("a")
      print(collect("b"))
      ```
    options:
      - "`['b']`，因为每次调用都会重新创建空列表"
      - "`['a', 'b']`，因为默认列表只在 def 时创建一次并被复用"
      - "抛出 TypeError，因为默认参数不能是列表"
      - "`['a', 'b']`，但只在同一线程内会出现，跨线程调用时各自独立"
    answer: [1]
    explain: |
      默认值表达式在 def 语句执行时只求值一次，保存在 collect.__defaults__ 中，之后每次不传 bucket 的调用都复用同一个列表，所以第二次输出 ['a', 'b']。A 是最常见的误解；C 错误，语法上完全允许；D 错误，默认值属于函数对象，在整个进程内所有线程间共享，并不按线程隔离。
  - id: d03-q2
    kp: d03-k3
    type: multi
    question: |
      关于下面的类，哪些说法正确？

      ```python
      class Retriever:
          cache = {}
          top_k = 5
          def __init__(self, tenant):
              self.tenant = tenant
      ```
    options:
      - "`r1.cache[\"q\"] = 1` 之后，`r2.cache` 里也能看到 \"q\""
      - "`r1.top_k = 10` 之后，`r2.top_k` 仍然是 5"
      - "`r1.cache = {}` 之后，`r1` 和 `r2` 的 cache 互不影响"
      - "每个实例创建时都会得到一个全新的 cache 字典"
      - "`Retriever.top_k = 8` 之后，没有设置过 top_k 的实例读到的都是 8"
    answer: [0, 1, 2, 4]
    explain: |
      cache 是类属性，r1.cache["q"] = 1 先查到类上的那个 dict 再原地修改，所有实例共享，所以 A 对、D 错。r1.top_k = 10 是给实例新建同名属性，遮蔽类属性，不影响 r2，B 对。r1.cache = {} 同理是在实例上新建属性，此后 r1 用自己的 dict，C 对。修改类属性 Retriever.top_k 后，凡是实例上没有同名属性的都会沿查找链读到新值，E 对。
  - id: d03-q3
    kp: d03-k4
    type: judge
    question: |
      函数签名写成 `def score(x: float) -> float`，调用 `score("0.5")` 时 Python 解释器会抛出类型错误。
    answer: false
    explain: |
      Python 的类型注解默认只是元数据，解释器运行时不检查，`score("0.5")` 会照常执行，直到函数体里的运算遇到不兼容类型才可能报错。只有 Pydantic、FastAPI 这类主动读取注解的库，或者 mypy/pyright 这类静态检查工具，才会利用注解做校验。
  - id: d03-q4
    kp: d03-k2
    type: short
    question: |
      解释下面代码为什么输出 `[2, 2, 2]` 而不是 `[0, 1, 2]`，并给出两种修改方法。

      ```python
      fs = [lambda: i for i in range(3)]
      print([f() for f in fs])
      ```
    key_points:
      - {text: "指出闭包捕获的是变量本身而不是定义时的值（晚绑定）", dim: principle}
      - {text: "说明三个 lambda 共享同一个循环变量，调用时它的值已经是 2", dim: concept}
      - {text: "给出用默认参数 lambda i=i: i 在定义时固定值的修改", dim: engineering}
      - {text: "给出用 functools.partial 或工厂函数创建独立作用域的修改", dim: engineering}
    reference: |
      lambda 在函数体里引用了 i，但 i 不是 lambda 自己的局部变量，而是外层（推导式作用域）的变量。闭包保存的是对这个变量的引用，调用时才去读当前值。推导式执行完毕后 i 停在 2，三个 lambda 读到的都是 2。这叫晚绑定。修改方法一：`lambda i=i: i`，利用默认值在定义时求值一次的特性，把当时的 i 固定为每个 lambda 自己的参数。修改方法二：写一个工厂函数 `def make(i): return lambda: i`，每次调用 make 都会创建新的作用域；或者用 `functools.partial(func, i)` 绑定参数。在 Agent 工具注册、批量回调这类代码中要特别注意这个问题。
  - id: d03-q5
    kp: d03-k1
    type: scenario
    question: |
      多租户网关偶发「租户 A 的调用被计到了租户 B 的账上」，且只在并发高峰出现。相关代码如下，请分析原因并给出修复和预防措施。

      ```python
      def build_headers(api_key: str, headers: dict = {}) -> dict:
          headers["Authorization"] = f"Bearer {api_key}"
          headers.setdefault("Content-Type", "application/json")
          return headers
      ```
    key_points:
      - {text: "指出默认参数 {} 在 def 时只创建一次，所有不传 headers 的调用共享同一个 dict", dim: principle}
      - {text: "说明并发时 A 拿到 headers 后、发出请求前，B 的调用覆盖了同一个 dict 的 Authorization", dim: concept}
      - {text: "给出改为 headers: dict | None = None 并在函数内创建新 dict 的修复", dim: engineering}
      - {text: "提出用 ruff B006 等静态规则和并发测试来预防同类问题", dim: engineering}
    reference: |
      根因是可变默认参数：`headers: dict = {}` 只在函数定义时创建一次，存在 build_headers.__defaults__ 里。所有不传 headers 的调用拿到的都是同一个 dict，函数返回的也是这个 dict 本身。低并发时，A 构造完 headers 立即发请求，问题不明显；高并发时，A 拿到 headers 后还没发出请求，B 调用 build_headers 把同一个 dict 的 Authorization 改成了 B 的 key，A 的请求就带着 B 的 key 发出去了，账单也就记到 B 名下。这同时是严重的安全问题。修复：`def build_headers(api_key: str, headers: dict | None = None) -> dict: result = dict(headers or {}); result["Authorization"] = ...; return result`，每次返回新 dict，也不修改调用方传入的 dict。预防：在 CI 中开启 ruff 的 B006（可变默认参数）规则；编写并发测试，用不同 key 并发调用并断言返回的 headers 各不相同。
    followup:
      question: 为什么返回值也不能直接返回调用方传入的 headers？
      key_points: ["原地修改调用方的 dict 会产生副作用", "调用方可能复用该 dict 给其他租户"]
      reference: 如果调用方传入了一个自己维护的 headers（比如全局的公共请求头），函数直接修改并返回它，就会把 Authorization 写进调用方的对象，之后调用方用它给其他租户发请求时会带上错误的 key。所以应先复制一份再修改。
  - id: d03-q6
    kp: d03-k4
    type: design
    question: 你要为一个「LLM 结构化输出 → 写入工单数据库」的流程定义数据模型。LLM 返回 JSON，包含 category、priority（1~5）、summary、tags（可选列表）。请说明你会用 dataclass 还是 Pydantic、模型怎么定义、校验失败时流程怎么走。
    key_points:
      - {text: "选择 Pydantic，因为 LLM 输出属于不可信的外部数据，需要运行时校验", dim: concept}
      - {text: "说明 dataclass 只生成样板代码、不校验类型，脏数据会流入数据库", dim: principle}
      - {text: "给出字段约束设计，例如 priority 用 Field(ge=1, le=5)，tags 默认空列表，category 用 Literal 或枚举", dim: engineering}
      - {text: "说明校验失败捕获 ValidationError 后记录日志并重试生成或降级，而不是写入数据库", dim: engineering}
    reference: |
      我会用 Pydantic。LLM 的输出和 HTTP 请求一样是不可信的外部输入，可能缺字段、类型错误、取值越界，必须在进入数据库之前做运行时校验；dataclass 只根据注解生成 __init__ 等方法，不做任何校验，`priority="高"` 也能创建成功，问题要到写库时才暴露，甚至已经写入了一部分。模型示例：`class Ticket(BaseModel): category: Literal["账号", "支付", "故障", "其他"]; priority: int = Field(ge=1, le=5); summary: str = Field(min_length=1, max_length=500); tags: list[str] = []`，可加 `model_config = ConfigDict(extra="forbid")` 拒绝未知字段。流程上用 `Ticket.model_validate_json(text)` 解析；捕获 ValidationError 后记录原始输出和错误明细，把错误信息反馈给模型重试一到两次，仍失败则标记为人工处理，绝不写入数据库。校验通过后再用 `model_dump()` 转成 ORM 需要的结构入库。

code_reading:
  id: d03-c1
  kp: [d03-k1, d03-k3, d03-k4]
  title: 多租户 LLM 客户端封装
  scenario: |
    这是一个多租户 AI 助手后端的 `llm_client.py`。平台为每个租户创建一个 `TenantLLMClient`，使用租户自己的 API Key 调用 OpenAI 兼容的聊天接口；FastAPI 路由收到请求后用 `ChatRequest` 校验请求体，再调用 `client.chat(req, user_id=...)`。为了省钱，代码对相同问题做了内存缓存。
  language: python
  code: |
    import logging
    import os
    from dataclasses import asdict, dataclass
    from typing import Any

    import httpx
    from pydantic import BaseModel, Field

    logger = logging.getLogger(__name__)


    @dataclass
    class ChatMessage:
        role: str
        content: str


    class ChatRequest(BaseModel):
        question: str = Field(min_length=1, max_length=2000)
        temperature: float = Field(default=0.7, ge=0, le=2)
        history: list[ChatMessage] = []


    class LLMClient:
        _cache: dict[str, str] = {}

        def __init__(self, base_url: str, model: str, headers: dict = {}, **options: Any) -> None:
            self.base_url = base_url
            self.model = model
            self.headers = headers
            self.headers["Authorization"] = f"Bearer {os.environ['LLM_API_KEY']}"
            self.options = {"timeout": 30.0, **options}

        def chat(self, req: ChatRequest, *, user_id: str) -> str:
            key = f"{self.model}:{req.question}"
            if key in self._cache:
                return self._cache[key]
            messages = [asdict(m) for m in req.history]
            messages.append({"role": "user", "content": req.question})
            resp = httpx.post(
                f"{self.base_url}/chat/completions",
                headers=self.headers,
                json={"model": self.model, "messages": messages, "temperature": req.temperature},
                timeout=self.options["timeout"],
            )
            resp.raise_for_status()
            answer = resp.json()["choices"][0]["message"]["content"]
            self._cache[key] = answer
            logger.info("user=%s model=%s cache_size=%d", user_id, self.model, len(self._cache))
            return answer


    class TenantLLMClient(LLMClient):
        def __init__(self, tenant_id: str, api_key: str, **kwargs: Any) -> None:
            super().__init__(**kwargs)
            self.tenant_id = tenant_id
            self.headers["Authorization"] = f"Bearer {api_key}"
  walkthrough:
    function: |
      封装对 OpenAI 兼容聊天接口的调用：`ChatRequest` 校验请求体；`LLMClient.chat()` 把历史消息和当前问题组装成 messages，带上鉴权头发送 HTTP 请求，取出回答并缓存；`TenantLLMClient` 继承 `LLMClient`，为每个租户换成自己的 API Key。
    key_functions: |
      - `ChatMessage`（dataclass）：内部消息结构，`asdict()` 把它转成 dict 用于 JSON。
      - `ChatRequest`（Pydantic）：校验 question 长度、temperature 范围；history 的每个元素会被校验并转换成 ChatMessage。
      - `LLMClient.__init__`：保存 base_url、model、headers，并写入默认 API Key；`**options` 收集额外配置并与默认超时合并。
      - `LLMClient.chat`：先查缓存，未命中则调用接口，`raise_for_status()` 在 4xx/5xx 时抛 `httpx.HTTPStatusError`。
      - `TenantLLMClient.__init__`：通过 `super().__init__(**kwargs)` 把 base_url、model 等透传给父类，再覆盖 Authorization。
    params: |
      - 创建客户端：`TenantLLMClient(tenant_id="t1", api_key="sk-t1", base_url=..., model=...)`，`tenant_id`、`api_key` 被子类签名接收，其余进入 `**kwargs` 再解包给父类；父类没有收到 `headers`，于是使用默认值 `{}`。
      - 调用：`client.chat(req, user_id="u1")`，`user_id` 是仅关键字参数（`*` 之后），只能按名字传。
      - `req.temperature` 由 Pydantic 保证在 0~2 之间，直接放进请求 JSON。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant R as FastAPI 路由
        participant P as ChatRequest 校验
        participant C as TenantLLMClient
        participant K as 类属性 _cache
        participant L as LLM 接口
        R->>P: 请求 JSON
        P-->>R: 校验通过的 req 或 422
        R->>C: chat(req, user_id)
        C->>K: 用 model 和 question 拼 key 查询
        alt 命中缓存
          K-->>C: 返回缓存答案 可能来自其他租户
        else 未命中
          C->>L: POST 带 self.headers 中的 Authorization
          L-->>C: choices 中的回答
          C->>K: 写入缓存
        end
        C-->>R: answer
      ```
    failure_points: |
      - **问题一（值得审查）：`headers: dict = {}` 可变默认参数。** 所有没传 headers 的客户端共享同一个 dict。每创建一个 `TenantLLMClient`，都会把这个共享 dict 的 Authorization 改成自己的 key，**最后创建的租户的 key 会被所有租户使用**，造成计费错乱和越权。
      - **问题二（值得审查）：`_cache` 是类属性，且 key 只有 model 和 question。** 所有实例、所有租户共享同一个缓存，租户 B 问同样的问题会拿到租户 A 的回答（可能包含 A 的私有数据）；key 也没包含 history 和 temperature，不同上下文得到同一答案；缓存没有上限，会持续占用内存。
      - `os.environ['LLM_API_KEY']` 在父类里强制读取，即使租户有自己的 key，没配这个环境变量也会 `KeyError`。
      - `resp.json()["choices"][0]...` 在接口返回结构异常时抛 `KeyError`/`IndexError`；`httpx.post` 超时会抛 `httpx.TimeoutException`，这里都没有转换成业务异常。
    debugging: |
      - 创建两个租户客户端后打印 `c1.headers is c2.headers`，为 True 即证明共享；再打印 `LLMClient.__init__.__defaults__` 能看到被写入了 key 的 dict。
      - 打印 `c1._cache is c2._cache` 和 `"_cache" in vars(c1)`（False 说明读到的是类属性）。
      - 在日志中临时输出 Authorization 的前 6 位（不要输出完整 key），对比租户 ID 和实际使用的 key 是否一致。
      - 单元测试中用 `httpx.MockTransport` 或 respx 模拟接口，断言每个租户发出的请求头。
    change_request: |
      - 修复问题一：签名改为 `headers: dict | None = None`，在 `__init__` 中 `self.headers = {**(headers or {}), "Authorization": ...}`；子类把 api_key 作为参数传给父类，而不是事后修改共享 dict。
      - 修复问题二：在 `__init__` 中 `self._cache = {}` 改为实例属性；key 改为对 `(tenant_id, model, temperature, history, question)` 做 sha256；需要跨进程或带过期时间时换成 Redis（见 Day 41）。
      - 如果需求改成「支持异步高并发」，应改用 `httpx.AsyncClient` 并复用同一个客户端实例的连接池（见 Day 06）。
  questions:
    - id: d03-c1-q1
      kp: d03-k1
      type: code
      question: 依次执行 `c1 = TenantLLMClient("t1", "sk-t1", base_url=URL, model="m")` 和 `c2 = TenantLLMClient("t2", "sk-t2", base_url=URL, model="m")`，然后调用 `c1.chat(...)`。按执行顺序说明参数如何传递、`self.headers` 指向哪个对象，以及 c1 的请求实际带的是哪个 key。
      key_points:
        - {text: "说明 tenant_id 和 api_key 被子类按位置接收，base_url 和 model 进入 kwargs 再解包传给父类", dim: concept}
        - {text: "指出父类未收到 headers，使用 def 时创建的同一个默认 dict，c1 与 c2 的 self.headers 是同一个对象", dim: principle}
        - {text: "说明 c2 初始化时把共享 dict 的 Authorization 改成 sk-t2，因此 c1 的请求带的是 sk-t2", dim: principle}
        - {text: "指出这会导致计费错乱和越权，并给出 None 默认值加创建新 dict 的修复", dim: engineering}
      reference: |
        创建 c1 时，"t1" 和 "sk-t1" 按位置绑定到子类的 tenant_id、api_key，base_url 和 model 被收集进 kwargs。`super().__init__(**kwargs)` 把它们解包成关键字参数传给父类；父类签名中的 headers 没有收到实参，于是使用默认值——那个在 def 执行时就创建好、保存在 `__defaults__` 中的 dict。父类先写入环境变量里的默认 key，子类再改成 sk-t1。创建 c2 时同样拿到**同一个默认 dict**，最后把 Authorization 改成 sk-t2。此时 c1.headers 和 c2.headers 是同一个对象，c1 调用 chat 时发出的请求带的是 sk-t2，费用记到租户 t2 名下，t1 也可能借此访问 t2 的额度或资源。修复：`headers: dict | None = None`，在 `__init__` 中构造新 dict，并把 api_key 作为参数传给父类。
    - id: d03-c1-q2
      kp: d03-k3
      type: code
      question: 租户 t1 先问了「我们公司 Q3 营收是多少」，随后租户 t2 问了同样的问题。按代码执行过程说明 t2 会得到什么结果、为什么；如果只把 `_cache` 改成在 `__init__` 中创建，还有哪些问题没解决？
      key_points:
        - {text: "指出 _cache 是类属性，self._cache 读到的是所有实例共享的同一个 dict", dim: principle}
        - {text: "说明 key 只由 model 和 question 组成，t2 的查询命中 t1 写入的缓存，直接拿到 t1 的回答", dim: concept}
        - {text: "指出这是跨租户数据泄露", dim: engineering}
        - {text: "指出改为实例属性后 key 仍未包含 history 和 temperature，且缓存无上限、多进程不共享", dim: engineering}
      reference: |
        `_cache` 定义在类体中，是 LLMClient 的类属性。实例上没有同名属性，所以 `self._cache` 沿查找链找到类上的那个 dict，`self._cache[key] = answer` 是原地修改，所有实例（包括所有租户的 TenantLLMClient）共享。t1 提问后缓存写入 key 为 "m:我们公司 Q3 营收是多少"。t2 使用相同 model 问相同问题，拼出同一个 key，直接命中并返回 t1 的回答，其中可能包含 t1 的内部财务数据，这是严重的跨租户数据泄露。只把 `_cache` 改到 `__init__` 中能实现按实例隔离，但还有问题：key 没有包含 history 和 temperature，同一个问题在不同上下文下会返回同一个答案；缓存没有容量上限和过期时间，内存会持续增长；多 worker 部署时每个进程各一份，命中率低且不一致。更合理的做法是把租户 ID、模型参数和上下文一起做哈希作为 key，并使用带 TTL 的外部缓存。
    - id: d03-c1-q3
      kp: d03-k4
      type: code
      question: |
        前端发送 `{"question": "你好", "temperature": "0.3", "history": [{"role": "user", "content": "hi"}]}`，以及另一个请求 `{"question": "", "temperature": 5}`。说明两个请求分别会怎样被 `ChatRequest` 处理；`history` 中的元素最终是什么类型？为什么 `history: list[ChatMessage] = []` 在这里是安全的？
      key_points:
        - {text: "说明第一个请求通过校验，temperature 字符串在宽松模式下被转换为 float 0.3", dim: principle}
        - {text: "说明 history 中的 dict 被 Pydantic 校验并转换成 ChatMessage dataclass 实例，因此 asdict 可用", dim: concept}
        - {text: "说明第二个请求 question 长度和 temperature 范围都不满足，抛 ValidationError，FastAPI 返回 422", dim: concept}
        - {text: "说明 Pydantic 会为每个实例复制不可哈希的默认值，不同于函数默认参数", dim: principle}
      reference: |
        第一个请求：question 满足 1~2000 字符；temperature 是字符串 "0.3"，Pydantic 默认的宽松模式会把它转换成 float 0.3，并检查在 0~2 范围内；history 声明为 list[ChatMessage]，Pydantic 支持标准库 dataclass 作为字段类型，会把每个 dict 校验并构造成 ChatMessage 实例，所以后面 `asdict(m)` 可以正常工作。第二个请求：question 为空字符串违反 min_length=1，temperature=5 违反 le=2，Pydantic 抛出包含两条错误的 ValidationError，FastAPI 自动返回 422 和错误明细，路由函数根本不会执行。`history: list[ChatMessage] = []` 安全的原因是：Pydantic 对不可哈希的默认值会在创建每个模型实例时深拷贝一份，每个请求拿到的是独立的空列表；这和普通函数或普通类 `__init__` 的默认参数不同，后者只在 def 时创建一次并共享。

interview:
  - id: d03-i1
    kp: d03-k1
    type: oral
    difficulty: 1
    question: 为什么 Python 函数的默认参数不能用可变对象？正确的写法是什么？
    key_points:
      - {text: "说明默认值在 def 执行时求值一次，保存在函数的 __defaults__ 中，之后每次调用复用", dim: principle}
      - {text: "说明可变默认值被原地修改后，后续调用会看到上次的结果", dim: concept}
      - {text: "给出用 None 作为默认值并在函数内创建新对象的写法", dim: engineering}
      - {text: "结合后端场景说明默认值在整个进程、所有请求间共享的危害，并提到 ruff B006 等静态检查", dim: project}
    reference: |
      Python 在执行 def 语句时就会计算默认值表达式，结果保存在函数对象的 __defaults__ 里。之后每次调用如果没传该参数，用的都是同一个对象。如果这个对象是 list、dict、set 这样的可变对象，并且函数里对它做了原地修改（append、赋值键），那么修改会保留下来，下一次调用就会看到上一次的残留数据。正确写法是用 None 作为默认值：`def f(items: list | None = None): items = [] if items is None else items`，每次调用在函数内部创建新对象。在后端服务里，def 通常在模块导入时只执行一次，所以这个默认对象会在整个进程生命周期、所有请求和线程之间共享，可能造成请求头、缓存、标签在用户之间串号。我会在 CI 里开启 ruff 的 B006 规则自动拦截这种写法。另外 Pydantic 模型字段的 `= []` 是安全的，因为 Pydantic 会为每个实例复制默认值；dataclass 则会直接拒绝不可哈希的默认值，要求用 default_factory。
    oral: |
      因为默认值只在 def 执行时算一次，存在函数的 __defaults__ 里，之后所有调用共用这一个对象。如果是列表或字典，函数里一 append，下次调用就能看到上次的数据。正确写法是默认值写 None，在函数里判断后新建对象。在后端服务里这个问题更严重，因为 def 在导入时只执行一次，默认对象是整个进程共享的。我见过多租户网关用 headers={} 当默认值，结果高峰期租户之间串了 API Key。现在我们在 CI 里开了 ruff 的 B006 规则自动拦截。
  - id: d03-i2
    kp: d03-k3
    type: oral
    difficulty: 2
    question: 类属性和实例属性有什么区别？如果把缓存放在类属性里会发生什么？
    key_points:
      - {text: "说明类属性定义在类体中所有实例共享，实例属性在 __init__ 中通过 self 设置、每个实例一份", dim: concept}
      - {text: "说明属性查找顺序：实例 __dict__、类、父类（MRO）", dim: principle}
      - {text: "区分 self.attr[k] = v 原地修改类属性与 self.attr = v 新建实例属性遮蔽类属性", dim: principle}
      - {text: "指出类属性缓存会跨实例、跨租户共享，导致数据泄露，且需要考虑线程安全", dim: engineering}
      - {text: "结合项目给出修复：改为实例属性，缓存 key 包含租户等维度，或使用外部缓存", dim: project}
    reference: |
      类属性定义在 class 语句体中，存在类对象的 __dict__ 里，所有实例共享一份；实例属性一般在 __init__ 中通过 self.x = ... 设置，存在每个实例自己的 __dict__ 里。读取 obj.x 时先查实例，再查类，再沿 MRO 查父类。这导致两种写法效果不同：`self.cache[k] = v` 会先找到类上的 dict 再原地修改，所有实例都能看到；`self.cache = {}` 则是在实例上新建同名属性，遮蔽类属性，只影响这个实例。所以类属性适合放常量，不适合放可变的业务状态。把缓存放在类属性里，所有实例共享同一个缓存，在多租户系统里会出现租户 B 命中租户 A 的缓存、拿到 A 的私有数据的问题；多线程下还要考虑并发读写的一致性。我在 RAG 项目里遇到过 Retriever 的类属性缓存导致跨租户泄露，修复是改成在 __init__ 里创建实例属性、缓存 key 加入租户 ID，并补跨租户隔离测试；多实例部署时则改用带 TTL 的 Redis。
    oral: |
      类属性写在类体里，所有实例共用一份；实例属性在 __init__ 里用 self 设置，每个实例一份。读属性的时候先找实例、再找类、再找父类。关键的坑是：self.cache[k] = v 这种写法其实是改了类上的那个字典，所有实例都受影响。我们之前 RAG 服务的检索器就是这样，每个租户一个实例，但缓存放在类属性里，结果租户 B 问同样的问题，拿到了 A 的私有文档。后来改成在 __init__ 里创建，并把租户 ID 放进缓存 key，再加了跨租户隔离的测试。
  - id: d03-i3
    kp: d03-k4
    type: oral
    difficulty: 3
    question: Python 的类型注解在运行时有作用吗？FastAPI 和 Pydantic 是如何利用类型注解的？dataclass 和 Pydantic 你怎么选？
    key_points:
      - {text: "说明注解默认只是元数据，解释器不做运行时类型检查，可被 inspect 或 annotationlib 读取", dim: concept}
      - {text: "说明 FastAPI 启动时读取路由函数签名和注解，生成校验规则和 OpenAPI 文档，请求时校验失败返回 422", dim: principle}
      - {text: "说明 Pydantic 按注解校验并转换类型，默认宽松模式，可用 Field 约束和 field_validator", dim: principle}
      - {text: "说明 dataclass 只生成 __init__ 等样板代码、不校验，适合内部可信数据；外部输入用 Pydantic", dim: engineering}
      - {text: "提到 Pydantic v2 写法（model_config、model_dump）与 v1 旧写法的区别及在 Python 3.14 上的兼容性", dim: engineering}
    reference: |
      类型注解本身只是存储在函数或类上的元数据，Python 解释器运行时不检查类型，`def f(x: int)` 传字符串照样执行；但注解在运行时可以被读取（inspect.signature、3.14 起的 annotationlib），这就是框架能利用它的原因。FastAPI 在注册路由时读取函数签名：根据注解和默认值判断参数来自路径、查询、请求体还是依赖，用 Pydantic 生成校验器，并生成 OpenAPI 文档；请求到来时按规则解析和转换，失败则自动返回 422 和错误详情，通过才以正确类型调用路由函数。`Annotated[int, Query(ge=1)]` 中第一个参数是真实类型，后面是给 FastAPI 的元数据。Pydantic 在实例化模型时按注解校验和转换，默认宽松模式会把 "1" 转成 1，可以用 Field 声明长度、范围约束，用 field_validator 写自定义规则。dataclass 只是根据注解生成 __init__、__repr__、__eq__，不做校验，适合内部已经可信的数据结构，轻量且可以 frozen 后哈希；HTTP 请求、LLM 结构化输出、配置这些外部输入必须用 Pydantic。另外新代码要用 Pydantic v2 的 model_config = ConfigDict(...)、model_dump()、field_validator，v1 的 class Config 和 .dict() 已弃用，而且官方说明 Pydantic V1 不兼容 Python 3.14 及以上。
    oral: |
      注解本身在运行时不做检查，Python 不会因为你写了 int 就拦住字符串。但注解可以在运行时被读取，FastAPI 就是这样做的：启动时读路由函数签名，判断每个参数来自路径、查询还是请求体，交给 Pydantic 生成校验规则，同时生成 OpenAPI 文档；请求进来先校验，失败直接 422。dataclass 和 Pydantic 我的原则是：外部进来的数据，比如请求体、LLM 输出的 JSON，一律用 Pydantic；内部可信的数据结构用 dataclass，更轻量。我们做工单分类时最开始用 dataclass 接 LLM 输出，结果优先级返回了字符串一路写到数据库才报错，换成 Pydantic 后在解析阶段就拦住了，还能把错误反馈给模型重试。
  - id: d03-i4
    kp: d03-k3
    type: design
    difficulty: 4
    question: 你需要设计一个支持多个模型供应商（OpenAI 兼容接口、某国产大模型、私有化部署模型）和多租户的 LLM 调用层。请说明类怎么设计，继承和组合怎么取舍，哪些状态放在哪里。
    key_points:
      - {text: "定义统一的抽象接口或协议（如 chat 方法），各供应商实现各自的适配类", dim: concept}
      - {text: "说明业务层通过组合持有客户端对象，而非继承具体供应商类，便于替换和测试注入", dim: principle}
      - {text: "明确状态归属：租户 key、超时等放实例属性，类属性只放常量，连接池按客户端实例复用", dim: engineering}
      - {text: "说明构造参数避免可变默认值，敏感信息用 SecretStr 且不进入日志", dim: engineering}
      - {text: "提到用工厂或注册表按配置创建客户端，以及统一的异常转换和缓存隔离（key 含租户）", dim: project}
    reference: |
      我会先定义一个统一接口，比如用 typing.Protocol 或抽象基类声明 `chat(messages, *, temperature, max_tokens) -> ChatResult`，每个供应商写一个适配类（OpenAICompatClient、VendorXClient、LocalModelClient），负责把统一参数转换成各家的请求格式，并把各家的错误转换成统一的业务异常（如 LLMTimeoutError、LLMRateLimitError）。继承只用在「适配类实现统一接口」这一层，层次保持浅；业务层（RAGService、AgentRunner）通过组合持有一个客户端对象，构造时注入，这样换供应商只需注入另一个实现，单元测试时注入假客户端。状态归属上：租户的 API Key、base_url、超时、重试配置都是实例属性，在 __init__ 中设置，构造参数用 None 作默认值避免共享；类属性只放 DEFAULT_TIMEOUT 这类常量；HTTP 连接池（httpx.Client/AsyncClient）作为实例属性，在同一客户端的多次调用间复用。API Key 用 Pydantic 的 SecretStr 保存，__repr__ 和日志中脱敏。创建方式用一个工厂或注册表：根据租户配置 `{"provider": "openai_compat", ...}` 查表创建对应客户端并缓存实例。如果要做响应缓存，缓存 key 必须包含租户 ID、模型和参数，且放在外部缓存中设置 TTL。
    oral: |
      我会先定一个统一接口，比如 Protocol 里定义 chat 方法，每个供应商写一个适配类，负责参数转换和把各家错误转成统一的业务异常。继承只用在这一层，保持很浅。业务层比如 RAG 服务是通过组合拿到客户端的，构造时注入，换供应商或者写测试都很方便。状态上，租户的 key、超时这些都是实例属性，构造参数不用可变默认值；类属性只放常量；连接池放在实例上复用。key 用 SecretStr，日志脱敏。创建客户端用一个注册表按租户配置生成。之前我们就是因为把 headers 用了可变默认值、缓存放在类属性里，出现过租户串 key 和串数据的问题，所以这几点我会特别注意。

