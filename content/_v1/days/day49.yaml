day: 49
phase: 5
title: 系统架构设计
goals:
  - 能画出一个包含网关、鉴权、FastAPI、任务队列、pgvector、Redis、LangGraph Agent、MCP 工具和可观测性的企业 AI 助手参考架构，并说清每个组件为什么存在
  - 能按时间顺序讲清文档入库、RAG 问答、Agent 执行三条数据流，以及每条流的关键状态与失败处理
  - 能做容量估算，讲出系统从 100 用户扩展到 1 万用户时每个阶段的瓶颈与改造
  - 能列出主要故障点、降级策略和成本控制手段，回答系统设计类面试题
knowledge_points:
  - id: d49-k1
    name: 企业 AI 助手参考架构：每个组件为什么存在
    level: P0
    summary: 架构图上每个框都要能回答「去掉它会怎样」；无状态服务 + 有状态存储 + 异步任务是骨架
    why: |
      系统设计题是 AI 应用岗位中高级面试的核心环节：「设计一个企业知识库 + Agent 助手」几乎必考。
      面试官看的不是你背了多少组件名，而是你能否说清**为什么需要它、不用会怎样、它带来什么代价**。
      这一天把前 48 天的知识串成一张图。
    problem: |
      解决「把 RAG、Agent、数据库、缓存、队列、安全、观测组合成一个可上线、可扩展、可维护的系统」的问题。
      没有清晰架构时常见的结果是：所有逻辑塞在一个 FastAPI 进程里，上传大文件把问答拖慢，扩容时状态丢失，出了问题无从排查。
    principle: |
      **一、参考架构全景**

      ```mermaid
      flowchart LR
        U["Web 与企业IM客户端"] --> GW["API网关 TLS WAF 粗粒度限流"]
        GW --> API["FastAPI 应用 无状态 多副本"]
        IDP["企业身份系统 OIDC"] -.->|"签发JWT"| U
        API --> R[("Redis 缓存 限流 锁 队列")]
        API --> PG[("PostgreSQL 业务数据 pgvector 检查点")]
        API --> Q["任务队列"]
        Q --> WK["入库Worker 解析 切片 向量化"]
        WK --> OBJ[("对象存储 原始文件")]
        WK --> PG
        API --> AG["LangGraph Agent 运行时"]
        AG --> MCP["MCP 工具服务 Streamable HTTP"]
        MCP --> SYS["企业系统 工单 CRM OA"]
        AG --> LGW["LLM 网关 路由 重试 计量"]
        API --> LGW
        WK --> LGW
        LGW --> LLM["模型厂商 或 私有模型"]
        API -.-> OBS["可观测 OTel Trace 指标 日志"]
      ```

      **二、每个组件为什么存在**

      | 组件 | 职责 | 去掉它会怎样 |
      |---|---|---|
      | API 网关 | TLS 终止、WAF、按 IP 或 Key 粗限流、路由 | 每个服务自己处理证书和防刷，规则不一致 |
      | 身份认证（OIDC + JWT） | 统一登录，Token 中携带用户、租户、角色（Day 45） | 权限无从谈起，检索无法按租户过滤 |
      | FastAPI 应用 | 业务编排：鉴权、检索、调模型、流式输出 | — 核心；必须**无状态**才能水平扩展 |
      | Redis | 缓存、分布式限流、会话锁、队列 broker（Day 41） | 多副本间计数和锁不一致，重复计算多 |
      | 任务队列 + Worker | 解析、切片、向量化等耗时任务异步执行（Day 42） | 上传 200 页 PDF 时 HTTP 超时，且拖慢问答 |
      | PostgreSQL + pgvector | 业务数据、文档元数据、向量、权限，一个库做事务一致（Day 25） | 向量和权限分库存储，删除文档时难以保证一致 |
      | 对象存储 | 原始文件，支持重新解析 | 换切片策略时找不到原文 |
      | LangGraph Agent | 有状态的多步推理与工具调用，Checkpoint 持久化（Day 35、36） | 长任务中断后无法恢复，无法人工审批后继续 |
      | MCP 工具服务 | 以标准协议暴露企业系统能力，独立部署和授权（Day 38） | 每个 Agent 各自对接企业系统，重复开发、权限分散 |
      | LLM 网关 | 多模型路由、统一重试与超时、Key 管理、按租户计量 | 每个服务各自管理 Key 和重试，成本无法归因 |
      | 可观测性 | Trace、指标、日志、成本与质量信号（Day 48） | 出问题只能猜 |

      **三、三条架构原则**

      1. **计算无状态、状态外置**：API 副本不保存会话和计数，状态放 Redis、PostgreSQL、Checkpoint，任意副本可处理任意请求。
      2. **快慢分离**：在线问答（秒级、需低延迟）与入库、批量评估（分钟级、可排队）走不同的进程和资源池，互不拖累。
      3. **权限在模型之外**：鉴权在网关与应用层，数据过滤在检索 SQL 与 RLS，工具调用携带用户身份（Day 47）。

      **四、为什么起步选 PostgreSQL + pgvector 而不是专用向量库**

      - 事务一致：文档删除时元数据、片段、向量在同一事务中删除。
      - 权限过滤与向量检索在一条 SQL 中完成。
      - 少维护一个系统。
      - 代价：超大规模（数亿向量）或极高检索 QPS 时，专用向量数据库可能更合适，届时再按评估结果迁移。

      **五、MCP 在架构中的位置**

      MCP 服务把「查工单」「建审批」等能力封装成工具，Agent 运行时作为 MCP Client 调用。远程部署时使用 Streamable HTTP 传输，授权遵循规范中的 OAuth 2.1 流程，服务端校验 Token 受众是自己。2026-07-28 版规范移除了协议层会话，服务端更容易做无状态水平扩展（细节见 freshness）。
    scenarios: |
      - 面试系统设计题「设计一个企业内部知识库 + 办事助手」：先画上图，再按数据流逐条讲。
      - 新项目技术评审：用「去掉它会怎样」逐个审查组件，避免过度设计（100 用户的内部试点可能不需要独立 LLM 网关）。
      - 从单体原型演进：先把入库拆成 Worker，再把限流与会话状态迁到 Redis，最后接入可观测性。
    pitfalls: |
      - **误区：组件越多越专业。** 100 人试点用 Docker Compose 单机部署完全合理，面试中要说明「按阶段演进」。
      - **误区：API 服务在内存里保存会话历史。** 多副本时请求落到其他副本就丢上下文，重启全部丢失。
      - **误区：入库在请求线程里同步完成。** 大文件导致 HTTP 超时，用户重试又重复入库。
      - **误区：Agent 直接持有各业务系统的管理员 Key。** 权限过大且分散，应通过 MCP 服务统一、按用户授权。
    interview_asks:
      - 请设计一个企业知识库 + Agent 助手系统，画出架构图。
      - 为什么用 pgvector 而不是专门的向量数据库？
      - 为什么要有任务队列？为什么要有 LLM 网关？
      - MCP 在你的架构里起什么作用？
    project_example: |
      某制造企业的内部助手：网关 + 企业微信登录（OIDC）签发 JWT；FastAPI 3 副本；Redis 负责限流、缓存和 Celery broker；PostgreSQL + pgvector 存 40 万个片段；入库 Worker 2 个副本独立扩缩；LangGraph Agent 用 AsyncPostgresSaver 持久化，审批类操作中断等待人工确认；工单和 OA 能力通过两个 MCP 服务暴露；所有调用经 LLM 网关统一计量。
      上线半年，入库高峰（月底制度更新）不再影响问答延迟，成本可以按部门出账。
    freshness: |
      核对于 2026-11：MCP 最新规范版本为 2026-07-28，标准传输为 stdio 与 Streamable HTTP；该版本对 Streamable HTTP 做了不兼容调整：移除 GET 流端点、移除协议层会话，服务器对每个请求返回 JSON 或该请求范围内的 SSE 流。HTTP 传输的授权为可选，若支持则遵循 OAuth 2.1，服务端必须校验 Token 受众。
      pgvector 当前最新发布版本为 0.8.7（2026-10-01），0.8.0 起支持迭代索引扫描以改善带过滤条件的近似检索。
      LangGraph 生产环境推荐使用 langgraph-checkpoint-postgres 的 PostgresSaver / AsyncPostgresSaver，首次使用需调用 setup() 建表；支持 exit、async、sync 三种持久化模式。
    sources:
      - {title: "MCP Specification 2026-07-28 - Transports", url: "https://modelcontextprotocol.io/specification/2026-07-28/basic/transports"}
      - {title: "MCP Specification 2026-07-28 - Streamable HTTP", url: "https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http"}
      - {title: "MCP Specification 2026-07-28 - Authorization", url: "https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization"}
      - {title: "pgvector GitHub README", url: "https://github.com/pgvector/pgvector/"}
      - {title: "LangGraph - Checkpointers", url: "https://docs.langchain.com/oss/python/langgraph/checkpointers"}
  - id: d49-k2
    name: 三条核心数据流：入库、问答、Agent 执行
    level: P0
    summary: 入库是可重试的状态机，问答是低延迟的流式管道，Agent 是可中断可恢复的循环
    why: |
      架构图只是静态结构，面试官一定会追问「用户上传一个文件后发生了什么」「一个问题从进来到出答案经过哪些步骤」。
      能按时间顺序讲清数据流、每一步失败怎么办，是区分「画过图」和「真做过」的关键。
    problem: |
      解决「请求在系统中如何流动、状态存在哪里、中途失败怎么恢复」的问题。
      数据流没设计好会出现：重复入库、半截入库、问答拿到半更新的文档、Agent 执行到一半崩溃后重复调用工具。
    principle: |
      **一、文档入库流：异步 + 状态机 + 幂等**

      ```mermaid
      stateDiagram-v2
        state "已上传" as uploaded
        state "解析中" as parsing
        state "向量化中" as embedding
        state "已发布" as ready
        state "失败" as failed
        [*] --> uploaded
        uploaded --> parsing : Worker 领取任务
        parsing --> embedding : 切片完成
        embedding --> ready : 新版本片段写入并切换
        parsing --> failed : 解析错误
        embedding --> failed : 重试耗尽
        failed --> parsing : 人工重试
        ready --> parsing : 文档更新
      ```

      关键点：
      - 上传接口只做三件事：存原文到对象存储、写 documents 记录（状态 uploaded、内容哈希）、投递任务，然后**立即返回 202**。
      - **幂等**：任务携带 document_id 与版本号，Worker 重复消费时检查状态；同内容哈希的文件不重复处理。
      - **原子切换**：新版本片段全部写完后，在一个事务中把旧版本标记失效、新版本标记生效，问答永远看不到「一半新一半旧」。
      - 任务消息体中携带 tenant_id，Worker 写入时校验（Day 47）。

      **二、RAG 问答流：低延迟、流式、可降级**

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant A as FastAPI
        participant R as Redis
        participant P as PostgreSQL与pgvector
        participant L as LLM网关
        U->>A: 提问 携带JWT
        A->>A: 校验JWT 取user与tenant
        A->>R: 限流检查 与 检索缓存查询
        A->>L: 问题向量化
        A->>P: 带租户与权限条件的向量检索
        P-->>A: Top-K 片段
        A->>L: 组装Prompt 流式生成
        L-->>A: Token流
        A-->>U: SSE 逐段推送 最后附引用
        A->>P: 异步写消息记录与用量
      ```

      关键点：鉴权与限流最先做；检索带权限条件；生成用流式降低感知延迟（Day 43）；消息落库与用量结算不阻塞响应；每一步都有超时与降级（Day 46）。

      **三、Agent 执行流：可中断、可恢复、有边界**

      - 每个会话对应一个 LangGraph `thread_id`，状态由 Checkpointer（如 AsyncPostgresSaver）在每一步后持久化。
      - 工具调用通过 MCP 服务执行，携带当前用户身份；写操作前用 interrupt 暂停等待人工确认（Day 40），确认后用同一 thread_id 恢复。
      - 边界：最大步数（recursion_limit）、总超时、单工具超时、每会话 Token 预算（Day 37）。
      - **同一 thread 同一时刻只允许一个执行**（用 Redis 锁或数据库行锁），否则两个请求同时推进同一份状态会互相覆盖。
      - 进程崩溃后，可根据 Checkpoint 从最后一步恢复；有副作用的工具要求幂等键，避免恢复时重复执行。
    scenarios: |
      - 面试追问「用户上传文件后发生了什么」：按入库状态机讲，重点说异步、幂等、原子切换。
      - 排查「问答偶尔引用了已删除的文档」：检查是否缺少原子切换，或检索缓存未按知识库版本失效。
      - 设计「请假申请 Agent」：查询类工具自动执行，提交申请前 interrupt 等待用户确认。
    pitfalls: |
      - **误区：上传接口等入库完成才返回。** 大文件超时，用户重试导致重复入库。
      - **误区：更新文档时先删旧片段再写新片段。** 中间窗口内检索不到该文档，或失败后文档丢失。
      - **误区：Agent 状态只在内存中。** 进程重启或请求落到另一个副本就丢失，人工确认后无法继续。
      - **误区：允许同一会话并发执行。** 状态互相覆盖、工具被重复调用。
    interview_asks:
      - 用户上传一份文档后，系统内部发生了什么？
      - 文档更新时，怎么保证用户不会检索到一半旧一半新的内容？
      - Agent 执行到一半服务重启了，怎么办？
    project_example: |
      制度库入库曾出现「更新期间员工搜不到该制度」的投诉，原因是先删后写。
      改为版本化写入：新版本片段写入时标记为未生效，全部成功后在一个事务中切换生效版本，再异步清理旧片段。
      Agent 侧为每个 thread 加 Redis 锁，工具调用携带幂等键，服务重启后从 Checkpoint 恢复未出现重复提交。
  - id: d49-k3
    name: 扩展性：从 100 用户到 1 万用户
    level: P0
    summary: 先算账再扩容；1 万用户的 Web QPS 不高，真正的瓶颈是 LLM 配额、成本、向量检索和入库峰值
    why: |
      「你的系统怎么从 100 人扩到 1 万人」是系统设计面试最常见的追问，考察容量估算、瓶颈识别和演进思路。
      很多候选人一上来就说「上 K8s、上微服务、分库分表」，却说不出数字依据，这是面试中的扣分点。
    problem: |
      解决「用户量增长 100 倍时，系统哪里先撑不住、按什么顺序改造、花多少钱」的问题。
      不做估算就扩容，要么过度设计浪费成本，要么在错误的地方用力（加了 10 台应用服务器，结果卡在模型配额上）。
    principle: |
      **一、先做容量估算**（数字为示例假设，实际以业务数据为准）

      以 1 万名员工的企业助手为例：
      - 日活约 30%：3000 人；人均每天 15 个问题：约 **4.5 万次问答 / 天**。
      - 高峰小时约占全天 20%：约 9000 次 / 小时，平均 2.5 QPS；考虑分钟级尖峰再乘以 4：约 **10 QPS 峰值**。
      - 平均耗时 8 秒：按 Little 定律，峰值并发约 **80 个流式连接**（Day 46）。
      - Token：每次输入约 4000（含检索片段与历史）、输出约 500，每天约 **2 亿 Token**；成本 = Token 数 × 所选模型单价，这往往是最大的一笔支出。
      - 向量：5 万份文档 × 平均 40 个片段 = 200 万个向量；以 1024 维 float32 计，原始向量约 8GB，HNSW 索引还需额外内存。

      **结论**：1 万用户对 Web 层只是「中等流量」，几个 FastAPI 副本就够；**真正的压力在 LLM 配额与成本、向量索引内存、入库峰值、长连接数**。

      **二、分阶段演进**

      ```mermaid
      flowchart LR
        S1["阶段一 100人试点 单机Compose 一个应用 一个PG 一个Redis"] --> S2["阶段二 1000人 应用多副本 入库Worker独立 托管PG 可观测接入"]
        S2 --> S3["阶段三 1万人 自动扩缩 PgBouncer 读副本 LLM网关多模型 租户配额"]
      ```

      | 维度 | 100 人 | 1000 人 | 1 万人 |
      |---|---|---|---|
      | 应用层 | 单实例 | 2~3 副本 + 负载均衡 | 按 CPU 与并发连接数自动扩缩 |
      | 入库 | 同进程后台任务 | 独立 Worker + 队列 | Worker 按队列长度扩缩，大批量导入限速 |
      | 数据库 | 单实例 | 托管 PG、备份、连接池计算 | PgBouncer、读副本承担检索、HNSW 参数调优、按租户分区 |
      | 缓存 | 可选 | Redis 限流与缓存 | Redis 高可用、热点 key 拆分 |
      | LLM | 单 Key | 统一超时重试 | LLM 网关：多 Key / 多区域 / 多模型路由、租户 TPM 配额 |
      | Agent | 内存 Checkpoint 仅限试验 | PostgresSaver | Agent 执行改为队列化，限制同时运行数 |
      | 观测 | 日志 | Trace + 大盘 | 成本归因到租户与部门、告警与值班 |

      **三、各层的扩展要点**

      - **应用层**：保持无状态，扩副本即可；SSE 长连接注意负载均衡的空闲超时和每实例连接上限。
      - **数据库**：总连接数 = 副本 × worker × 池大小（Day 46），用 PgBouncer 收敛；检索读多写少，可走读副本。带租户过滤的 HNSW 检索，默认 `hnsw.ef_search` 为 40，过滤后结果可能不足，pgvector 0.8.0 起可开启迭代索引扫描，或对大租户使用分区 / 部分索引（见 Day 25、Day 26）。
      - **LLM**：最先触顶的通常是配额；用 LLM 网关做多 Key 负载、主备模型、按任务路由（分类、改写用小模型，生成用大模型）。
      - **Agent**：长任务不要占用 HTTP 请求，改为提交任务 + 进度推送；限制全局同时运行的 Agent 数。
      - **MCP 工具服务**：按工具调用量独立扩缩；新版规范移除协议层会话后，可直接放在负载均衡后无粘滞扩展（旧版本使用会话 ID 时需要粘滞或共享会话存储）。
    scenarios: |
      - 面试题「从 100 人扩到 1 万人」：先给估算数字，指出瓶颈不在 Web 层，再按阶段讲改造。
      - 集团推广前评估：用试点期的人均问题数和 Token 数推算全员上线后的配额与月度预算。
      - 月底制度批量更新导致入库队列堆积：Worker 按队列长度扩缩，并对单租户导入限速。
    pitfalls: |
      - **误区：一上来就微服务 + K8s + 分库分表。** 没有数字依据的过度设计，面试中应先估算再演进。
      - **误区：只扩应用副本。** 每加一个副本数据库连接数就上涨，上游配额却不变。
      - **误区：忽视向量索引内存。** HNSW 索引放不进内存时检索延迟陡增。
      - **误区：Agent 长任务挂在 HTTP 请求上。** 网关超时、连接被占满、扩缩容时任务中断。
    interview_asks:
      - 你的系统从 100 个用户扩展到 1 万个用户，需要做哪些改变？
      - 1 万用户大概需要多少 QPS、多少 Token？你怎么估算的？
      - 系统的第一个瓶颈会出现在哪里？
    project_example: |
      企业助手从 300 人试点推广到 8000 人：试点数据显示人均每天 11 个问题、平均输入 3500 Token。
      估算全员上线后峰值约 8 QPS、每天约 1.5 亿 Token，判断瓶颈在模型配额和成本而不是应用服务器。
      于是优先做了 LLM 网关多 Key 负载、问题改写改用小模型、检索结果缓存与租户月度预算，应用层只从 2 副本扩到 4 副本；推广后 P95 延迟基本不变，单次问答成本下降约 35%。
  - id: d49-k4
    name: 成本控制
    level: P1
    summary: 成本 = 调用次数 × 每次 Token × 单价；三个因子分别用缓存、裁剪、路由去压
    why: |
      AI 应用的边际成本远高于传统软件：每次提问都要真金白银付给模型厂商。规模化后成本常常成为项目能否继续的决定因素。
      面试中「你们怎么控制成本」是 AI 应用岗位的高频题，回答需要有方法和数字。
    problem: |
      解决「用户量和功能增长时，模型成本线性甚至超线性增长」的问题。
      不控制时：Agent 循环十几步、历史消息无限增长、所有任务都用最贵的模型，月度账单远超预算且无法归因到具体租户或功能。
    principle: |
      **一、成本公式拆解**

      ```mermaid
      flowchart LR
        C["总成本"] --> N["调用次数"]
        C --> T["每次Token数"]
        C --> P["单价"]
        N --> N1["缓存 去重 限流 Agent步数上限"]
        T --> T1["历史截断或摘要 Top-K与片段长度 max_tokens 前缀缓存"]
        P --> P1["按任务路由模型 批处理接口 私有部署"]
      ```

      **二、常用手段**

      - **减少调用次数**：Embedding 缓存、检索与答案缓存（Day 46）；Agent 设置最大步数与重复调用检测；入库时内容哈希去重。
      - **减少每次 Token**：会话历史按 Token 预算截断或滚动摘要；Top-K 与片段长度按评估结果调到「够用」；限制 max_tokens；把稳定的长前缀放在 Prompt 最前面以利用厂商前缀缓存（计费规则以厂商文档为准）。
      - **降低单价**：意图分类、问题改写、评审等简单任务用小模型；离线任务（批量摘要、评估）使用厂商的批处理接口（如有）；高调用量且数据敏感时评估私有部署的总成本。
      - **预算与归因**：每个 LLM 调用记录租户、功能、Prompt 版本和 Token（Day 48），按租户设置月度预算和 TPM 限额，超额告警或降级。

      **三、成本与质量的取舍**

      每项省钱措施都要用评估集验证质量影响：Top-K 从 8 降到 4 省了 40% 输入 Token，但如果检索召回明显下降，就得不偿失。
    scenarios: |
      - 月度账单超预算 50%：按租户与功能归因，发现「自动摘要」功能占 40%，改用小模型并改为按需触发。
      - 长对话成本高：历史超过 6000 Token 时生成滚动摘要替代早期消息。
      - 夜间批量为新文档生成摘要，使用批处理接口降低单价。
    pitfalls: |
      - **误区：所有环节都用最强模型。** 分类、改写等简单任务用小模型通常质量差异很小。
      - **误区：降本只看单价。** 调用次数和每次 Token 往往影响更大。
      - **误区：降本措施不经评估直接上线。** 质量下降导致用户重复提问，成本反而更高。
    interview_asks:
      - 你们怎么控制 LLM 调用成本？效果如何？
      - 如何把成本归因到具体的租户或功能？
    project_example: |
      知识库助手单次问答平均成本过高：分析发现输入 Token 中 55% 来自会话历史，30% 来自检索片段。
      引入历史滚动摘要、Top-K 由 8 调到 5 并截断过长片段、问题改写改用小模型，评估集通过率下降不到 1 个百分点，单次成本下降约 45%。
  - id: d49-k5
    name: 故障点与高可用设计
    level: P1
    summary: 列出每个依赖挂掉时的表现，提前决定是降级、排队还是失败，并设置超时预算
    why: |
      AI 应用依赖链长（网关、Redis、数据库、向量检索、Rerank、模型厂商、MCP 工具、企业系统），任何一个出问题都可能导致整体不可用。
      面试官常问「某某挂了会怎样」，能逐个回答说明你真正理解了系统。
    problem: |
      解决「局部故障演变成全局故障」的问题。
      没有设计时：模型厂商抖动导致所有请求卡满超时、连接池耗尽，连不依赖模型的页面也打不开；Redis 故障时限流失效或全部拒绝；Agent 工具超时导致会话永久卡住。
    principle: |
      **一、故障点清单**

      | 依赖 | 故障表现 | 设计决策 |
      |---|---|---|
      | 模型厂商 | 超时、429、5xx | 超时 + 有限重试 + 熔断，切换备用模型或返回缓存 |
      | Rerank 服务 | 超时 | 跳过 Rerank，直接用向量 Top-K |
      | Redis | 连接失败 | 限流降级为进程内粗限流并告警，缓存失效则直连数据库 |
      | PostgreSQL | 主库故障 | 托管服务自动主备切换；只读功能可走读副本 |
      | 任务队列积压 | 入库延迟 | 按队列长度扩 Worker，界面展示处理进度 |
      | MCP 工具或企业系统 | 超时、报错 | 单工具超时，错误作为观察结果返回给 Agent，不无限重试 |
      | Agent 运行时崩溃 | 执行中断 | 从 Checkpoint 恢复，工具幂等键防重复 |

      **二、超时预算**

      ```mermaid
      flowchart LR
        T["用户可接受总时长 例如30秒"] --> A["检索 不超过2秒"]
        T --> B["Rerank 不超过1秒 超时跳过"]
        T --> C["LLM 首Token 不超过8秒 超时切备用"]
        T --> D["单个工具 不超过10秒"]
      ```

      从用户可接受的总时长倒推每一层的超时，内层超时必须小于外层，否则外层已经放弃，内层还在占用资源。重试也要计入预算。

      **三、高可用的基本手段**

      多副本 + 健康检查；有状态组件用托管服务的主备；熔断与降级（Day 46）；限流保护（Day 46）；Checkpoint 与幂等（k2）；定期故障演练，验证降级开关真的可用。
    scenarios: |
      - 模型厂商区域性故障：熔断主模型 5 分钟，切换另一厂商模型，界面提示精简模式。
      - 企业 OA 系统维护：MCP 工具返回「系统维护中」，Agent 告知用户稍后再试，而不是反复重试。
      - 季度故障演练：手动停掉 Redis，验证限流降级与告警是否按预期工作。
    pitfalls: |
      - **误区：所有依赖都用同一个默认超时。** 内外层超时倒挂，资源被无效占用。
      - **误区：降级方案从未演练。** 真故障时发现备用模型配额为零或配置早已过期。
      - **误区：工具失败就让 Agent 无限重试。** 形成循环，消耗 Token 且阻塞会话。
    interview_asks:
      - 如果模型厂商挂了，你的系统会怎样？
      - Redis 挂了呢？限流和缓存怎么处理？
      - 你怎么设置各层的超时时间？
    project_example: |
      一次模型厂商故障持续 40 分钟。熔断器在连续失败后切换到备用模型，问答功能保持可用，只有 Agent 中依赖函数调用质量的复杂流程被暂时关闭。
      复盘发现内层 LLM 超时（60 秒）大于网关超时（30 秒），用户已看到超时页面后后端仍在等待，随后统一按超时预算重新配置。
quiz:
  - id: d49-q1
    kp: d49-k1
    type: single
    question: 在企业 AI 助手架构中，把文档解析、切片、向量化放进「任务队列 + 独立 Worker」，最主要解决的问题是什么？
    options:
      - "让向量检索的结果更准确"
      - "避免耗时的入库任务阻塞在线问答请求，并支持失败重试与独立扩缩"
      - "减少 PostgreSQL 中存储的向量数量"
      - "替代 Redis 做分布式限流"
    answer: [1]
    explain: |
      入库是分钟级、CPU 和外部调用密集的任务，放在请求线程里会导致 HTTP 超时并抢占在线问答的资源；放进队列后可以立即返回、失败重试、按队列长度独立扩缩 Worker，实现快慢分离。
      它不改变检索准确度，也不减少向量数量，更不是限流组件。
  - id: d49-q2
    kp: d49-k2
    type: multi
    question: 关于文档更新时的入库设计，以下哪些做法是正确的？
    options:
      - "新版本片段全部写入后，在一个事务中切换生效版本，再异步清理旧片段"
      - "任务携带 document_id 与版本号，Worker 重复消费时检查状态以保证幂等"
      - "先删除旧片段再写入新片段，这样最简单且不会有问题"
      - "知识库版本变化后，让检索缓存通过版本号自然失效"
      - "上传接口同步完成解析与向量化后再返回，以便用户立即可以检索"
    answer: [0, 1, 3]
    explain: |
      版本化写入 + 事务切换保证检索永远看到完整的一个版本；幂等检查防止消息重复投递导致重复入库；缓存 key 带知识库版本号可让旧缓存自然失效。
      先删后写在写入窗口期检索不到文档，失败时还会丢失文档；同步完成入库会导致大文件超时与用户重复上传。
  - id: d49-q3
    kp: d49-k3
    type: judge
    question: 一家 1 万名员工的企业上线 AI 助手，最先撑不住的通常是 FastAPI 应用服务器的 CPU，因此扩容的第一步应该是增加应用副本数。
    answer: false
    explain: |
      按常见使用强度估算，1 万员工的峰值问答 QPS 通常只有个位数到十几，应用层多是 I/O 等待，几个副本即可承载。
      更早触顶的通常是模型厂商的 RPM/TPM 配额与成本、向量索引内存、入库峰值和长连接数。盲目加副本还会成倍增加数据库连接数。
  - id: d49-q4
    kp: d49-k5
    type: single
    question: 网关对用户请求的超时是 30 秒，后端调用 LLM 的超时配置为 60 秒并会重试 2 次。这样的配置最直接的问题是什么？
    options:
      - "LLM 输出质量会下降"
      - "网关已向用户返回超时后，后端仍在等待和重试，白白占用连接与配额"
      - "会导致 JWT 过期"
      - "会让向量检索结果不一致"
    answer: [1]
    explain: |
      内层超时（60 秒且含重试）大于外层超时（30 秒），用户早已收到超时错误，后端仍在占用协程、连接和上游配额，甚至为已无人等待的请求付费。
      超时应按预算从外向内递减，重试时间也计入预算。它与输出质量、JWT 和检索一致性无关。
  - id: d49-q5
    kp: d49-k3
    type: design
    question: |
      某公司内部知识库助手目前 100 人试点：单机 Docker Compose 部署（1 个 FastAPI、1 个 PostgreSQL + pgvector、1 个 Redis），入库在 FastAPI 后台任务中完成。
      半年后要推广到 1 万人。请给出容量估算思路、关键瓶颈判断和分阶段改造方案。
    key_points:
      - {text: "给出容量估算：日活、人均问题数、峰值 QPS、并发数、每日 Token 与成本、向量规模", dim: engineering}
      - {text: "判断瓶颈主要在 LLM 配额与成本、向量索引内存、入库峰值而不是 Web 层", dim: principle}
      - {text: "入库拆为队列加独立 Worker，应用无状态多副本，状态放 Redis 与 PostgreSQL", dim: engineering}
      - {text: "数据库层：连接数核算与 PgBouncer、读副本、HNSW 与过滤检索调优或分区", dim: engineering}
      - {text: "LLM 层：LLM 网关多 Key 与多模型路由、租户配额、缓存与成本归因", dim: engineering}
    reference: |
      估算：假设日活 30%（3000 人）、人均 15 问，约 4.5 万次/天；高峰小时占 20% 且有 4 倍分钟级尖峰，峰值约 10 QPS；平均 8 秒，峰值并发约 80。每次输入约 4000、输出约 500 Token，每天约 2 亿 Token，按模型单价算出月度预算。文档 5 万份 × 40 片段 = 200 万向量，1024 维约 8GB 原始数据加 HNSW 索引内存。
      瓶颈判断：Web 层压力不大；首先是模型配额与成本，其次是向量索引能否常驻内存与带过滤检索的召回，以及推广初期集中导入文档造成的入库峰值。
      改造：阶段一（1000 人）入库拆为任务队列 + 独立 Worker，上传接口返回 202 并展示进度；FastAPI 改为无状态 2~3 副本，限流与会话锁放 Redis；数据库换托管 PostgreSQL 并核算连接数；接入 OpenTelemetry。阶段二（1 万人）应用自动扩缩；PgBouncer 收敛连接、读副本承担检索；HNSW 参数按评估调优，带租户或部门过滤时开启迭代扫描或分区；LLM 网关做多 Key 负载、主备模型、问题改写等用小模型；按部门设置 TPM 与月度预算；缓存 Embedding 与检索结果；Agent 长任务队列化。每一步都用压测与评估集验证。
    followup:
      question: 如果预算只够支撑估算值的一半，你会优先砍哪些开销？
      key_points: [先做缓存与历史截断等不影响质量的优化, 简单任务改用小模型, 按部门设置配额并评估质量影响]
      reference: 先做不影响质量的：Embedding 与检索缓存、历史摘要、Top-K 与片段长度按评估调优、限制 max_tokens；再把意图分类、改写等简单任务换成小模型；最后按部门设置配额并对低优先级功能（如自动摘要）按需触发。每项都用评估集确认质量下降在可接受范围内。
  - id: d49-q6
    kp: d49-k1
    type: short
    question: 为什么说企业 AI 助手中的 FastAPI 应用层必须「无状态」？请列出哪些状态应该外置到哪里，并说明不这样做的后果。
    key_points:
      - {text: "说明无状态后任意副本都能处理任意请求，才能水平扩展和滚动发布", dim: principle}
      - {text: "会话历史和 Agent 状态外置到 PostgreSQL 或 Checkpointer", dim: engineering}
      - {text: "限流计数、缓存、分布式锁外置到 Redis，上传文件放对象存储", dim: engineering}
      - {text: "指出不外置会导致多副本状态不一致、重启丢失、扩缩容时会话中断", dim: principle}
    reference: |
      无状态指应用进程本身不保存跨请求的数据，任意副本可以处理任意请求。这样负载均衡不需要粘滞，扩缩容、滚动发布、实例崩溃时都不会丢数据。
      应外置的状态：会话消息历史写 PostgreSQL；Agent 执行状态由 LangGraph Checkpointer 持久化到 PostgreSQL；限流计数、缓存、会话执行锁放 Redis；上传的原始文件放对象存储；入库任务进度写数据库。
      不外置的后果：用户下一条消息落到另一个副本时丢失上下文；每个进程各自限流导致实际阈值随副本数成倍放大；重启或发布时正在进行的 Agent 任务和人工审批全部丢失；上传到本地磁盘的文件在其他副本上找不到。
  - id: d49-q7
    kp: d49-k4
    type: scenario
    question: 知识库助手上线三个月后，月度模型费用是预算的 2 倍。你会如何定位原因并降低成本？请给出步骤与至少四项措施。
    key_points:
      - {text: "先按租户、功能、Prompt 版本归因 Token 与成本，找出最大开销来源", dim: engineering}
      - {text: "分析输入 Token 构成，如历史消息、检索片段、System Prompt 占比", dim: principle}
      - {text: "措施：缓存、历史截断或摘要、调整 Top-K 与 max_tokens、简单任务用小模型、Agent 步数上限", dim: engineering}
      - {text: "每项措施用评估集验证质量影响，并设置租户预算与告警", dim: engineering}
    reference: |
      定位：在可观测平台中按租户、功能（问答、摘要、Agent）、Prompt 版本、模型聚合 Token 与成本，找出占比最高的部分；再看单次调用的输入 Token 构成（System Prompt、历史、检索片段）以及调用次数是否异常（重复提问、Agent 循环、重复向量化）。
      常见发现与措施：① 历史消息无限累积：按 Token 预算截断或滚动摘要；② 检索片段过多过长：按评估结果调低 Top-K、截断片段；③ 所有环节都用大模型：分类、改写、摘要改用小模型；④ Agent 循环调用：设置最大步数与重复调用检测；⑤ 重复计算：Embedding 与检索缓存、入库内容哈希去重；⑥ 输出过长：限制 max_tokens 并在 Prompt 中要求简洁；⑦ 稳定的长前缀放在 Prompt 开头利用前缀缓存。
      保障：每项措施在评估集上验证质量；按租户设置月度预算与 TPM 限额，日成本环比异常告警。
code_reading:
  id: d49-c1
  kp: [d49-k2, d49-k5]
  title: Agent 对话入口：配额、会话锁与 LangGraph 调用
  scenario: 企业 AI 助手的 Agent 对话接口。应用启动时已用 AsyncPostgresSaver 编译好 LangGraph 图放在 `app.state.graph`，Redis 客户端放在 `app.state.redis`。前端首次对话不传 thread_id，之后带上返回的 thread_id 继续对话。图中的工具通过 MCP 服务调用企业工单系统。
  language: python
  code: |
    import logging
    import uuid

    from fastapi import APIRouter, Depends, HTTPException, Request
    from pydantic import BaseModel, Field

    from app.auth import CurrentUser, get_current_user
    from app.quota import QuotaExceeded, reserve_tokens

    logger = logging.getLogger(__name__)
    router = APIRouter()


    class ChatIn(BaseModel):
        message: str = Field(min_length=1, max_length=4000)
        thread_id: str | None = Field(default=None, max_length=200)


    @router.post("/agent/chat")
    async def agent_chat(
        body: ChatIn,
        request: Request,
        user: CurrentUser = Depends(get_current_user),
    ) -> dict:
        graph = request.app.state.graph
        redis = request.app.state.redis
        thread_id = body.thread_id or f"{user.tenant_id}:{user.id}:{uuid.uuid4()}"

        try:
            await reserve_tokens(redis, user.tenant_id, estimate=len(body.message) + 2000)
        except QuotaExceeded:
            raise HTTPException(status_code=429, detail="本月额度已用完")

        lock_key = f"lock:thread:{thread_id}"
        if not await redis.set(lock_key, "1", nx=True, ex=120):
            raise HTTPException(status_code=409, detail="该会话正在处理中，请稍候")

        config = {
            "configurable": {"thread_id": thread_id, "user_id": user.id, "tenant_id": user.tenant_id},
            "recursion_limit": 12,
        }
        try:
            state = await graph.ainvoke({"messages": [("user", body.message)]}, config=config)
        finally:
            await redis.delete(lock_key)

        reply = state["messages"][-1].content
        logger.info("agent done thread=%s messages=%d", thread_id, len(state["messages"]))
        return {"thread_id": thread_id, "reply": reply}
  walkthrough:
    function: |
      Agent 对话入口：鉴权后为请求确定 thread_id（新会话生成、旧会话沿用），预扣租户 Token 配额，用 Redis 锁保证同一会话同一时刻只有一个执行，然后调用 LangGraph 图执行一轮 Agent（可能包含多次模型调用与 MCP 工具调用），返回最后一条消息。
    key_functions: |
      - `get_current_user`：解析 JWT，得到用户 ID 与租户 ID。
      - `reserve_tokens`：在 Redis 中按租户预扣 Token 配额，不足抛 `QuotaExceeded`。
      - `redis.set(..., nx=True, ex=120)`：只有 key 不存在时才设置，作为 120 秒过期的会话锁。
      - `graph.ainvoke`：以 `thread_id` 为键从 Checkpointer 读取历史状态，追加用户消息后运行图，每一步写入 Checkpoint；`recursion_limit` 限制最大步数。
    params: |
      - `body.thread_id` 来自客户端，可为空；为空时用 `租户:用户:UUID` 生成新的 thread_id。
      - `configurable` 中的 `thread_id` 供 Checkpointer 定位会话，`user_id`、`tenant_id` 供图中的节点和工具读取（例如 MCP 调用时携带用户身份）。
      - `recursion_limit=12` 通过 config 传给 LangGraph，超过会抛出递归超限错误。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant C as 客户端
        participant A as agent_chat
        participant R as Redis
        participant G as LangGraph图
        participant S as Checkpointer PG
        participant M as MCP工具服务
        C->>A: message 与 可选thread_id
        A->>R: 预扣租户Token
        A->>R: SET lock NX EX 120
        A->>G: ainvoke 带thread_id
        G->>S: 读取该thread的检查点
        G->>M: 调用工单工具 可能多次
        G->>S: 每步写入检查点
        G-->>A: 最终状态
        A->>R: 删除锁
        A-->>C: thread_id 与 reply
      ```
    failure_points: |
      - **会话归属未校验（重点）**：客户端传入的 thread_id 直接使用，没有校验它是否属于当前用户与租户。拿到或猜到他人 thread_id 的用户可以读取对方会话历史（Checkpoint 中的消息会进入上下文并影响回答），还能以对方会话状态继续执行工具调用。
      - **缺少总超时（重点）**：`graph.ainvoke` 没有整体超时，模型或 MCP 工具卡住时请求可能挂到网关超时；而锁 120 秒后自动过期，此时原执行可能仍在进行，新请求拿到锁后两个执行同时推进同一 thread，Checkpoint 互相覆盖、工具被重复调用。
      - 预扣的 Token 没有在结束后按实际用量结算，失败时也没有退还，额度会被逐渐「吃掉」。
      - `finally` 中无条件 `delete` 锁，可能删掉锁过期后别人重新获得的锁（应校验锁的持有者）。
      - 图执行异常（如递归超限、上游 429）未分类处理，统一变成 500。
    debugging: |
      - 复现越权：用户 A 发起会话拿到 thread_id，用户 B 带着这个 thread_id 请求，观察回答是否引用了 A 的历史内容。
      - 复现并发执行：在 MCP 工具中注入 150 秒延迟，第 130 秒时再发一次同 thread 请求，观察是否出现两次工具调用。
      - 在 Trace 中为每次 ainvoke 记录 thread_id、步数、工具调用次数、耗时，排查卡住的会话。
    change_request: |
      若需求改为「Agent 执行可能超过 1 分钟，需要改成异步任务 + 进度推送」：
      - 接口只校验归属、预扣配额、投递任务（携带 thread_id、user_id、tenant_id），返回 202 和 task_id；
      - Worker 端获取会话锁并带超时执行 `graph.ainvoke`，期间用心跳续期锁；
      - 进度通过 SSE 或轮询接口推送（Day 43）；
      - 结束后按实际 usage 结算配额。
  questions:
    - id: d49-c1-q1
      kp: d49-k2
      type: code
      question: 用户 B 通过分享截图看到了用户 A 的 thread_id，并在自己的请求中带上它。请按代码执行顺序说明会发生什么，以及应该如何修改。
      key_points:
        - {text: "说明 B 的 JWT 校验通过，thread_id 取自请求体，未与 B 的身份比对", dim: principle}
        - {text: "说明 B 能拿到锁，ainvoke 以 A 的 thread_id 从 Checkpointer 读取 A 的历史状态继续执行", dim: principle}
        - {text: "指出 A 的历史进入上下文可被套出，且工具调用可能基于 A 的会话状态执行", dim: principle}
        - {text: "修改：用会话归属表或前缀校验 thread_id 属于当前用户与租户，否则返回 404 或 403", dim: engineering}
      reference: |
        执行过程：B 的请求携带 B 自己合法的 JWT，`get_current_user` 返回 B 的身份；`body.thread_id` 非空，于是 thread_id 直接取 A 的值。预扣的是 B 所在租户的额度，锁 key 基于 A 的 thread_id，若 A 当前没在执行，B 成功拿到锁。`graph.ainvoke` 用 A 的 thread_id 从 Checkpointer 读取 A 的全部历史消息，把 B 的新消息追加进去继续执行。B 可以要求模型「总结一下我们之前聊过的内容」，从而读到 A 的会话；图中的工具若依赖状态中的信息（如之前查到的工单号），也可能基于 A 的上下文执行操作。同时 A 的会话被 B 的消息污染。
        修改：建立会话表 `conversations(thread_id, tenant_id, user_id)`，新建会话时写入；收到 thread_id 时查询并校验 tenant_id 与 user_id 都匹配，否则返回 404（不暴露是否存在）。也可以校验 thread_id 前缀与当前用户一致，但前缀可预测，仍建议以服务端记录为准。工具中使用的用户身份始终取自 JWT 而不是状态。
    - id: d49-c1-q2
      kp: d49-k5
      type: code
      question: 假设某次执行中 MCP 工具服务卡住了 150 秒。请按时间线说明这段代码中锁、请求、图执行分别会发生什么，并给出修改方案。
      key_points:
        - {text: "说明 ainvoke 没有整体超时，请求一直等待，网关可能先超时返回给用户", dim: principle}
        - {text: "说明第 120 秒锁自动过期，用户重试时拿到新锁，两个执行并发推进同一 thread", dim: principle}
        - {text: "说明原执行结束后 finally 删除了新请求持有的锁", dim: principle}
        - {text: "修改：asyncio.timeout 包裹 ainvoke 且小于锁 TTL，工具设置单独超时，锁带持有者标识并续期或校验后删除", dim: engineering}
      reference: |
        时间线：t=0 请求 1 拿到锁（120 秒过期），开始 ainvoke，执行到 MCP 工具调用时卡住。若网关超时为 60 秒，t=60 用户看到超时，但后端协程仍在等待。t=120 锁自动过期。用户在 t=125 重试，请求 2 成功拿到锁，也开始以同一 thread_id 执行，从 Checkpoint 读到的是工具调用前的状态，于是再次调用同一个工具。t=150 请求 1 的工具返回，继续执行并写 Checkpoint，随后在 finally 中删除锁——删掉的其实是请求 2 的锁，请求 3 又可以进入。结果是同一会话并发执行、Checkpoint 互相覆盖、工单可能被重复创建。
        修改：① 用 `async with asyncio.timeout(45):` 包住 `graph.ainvoke`，总超时小于网关超时与锁 TTL；② MCP 工具调用设置单独超时（如 10 秒），失败作为观察结果返回给模型；③ 锁的值写入唯一 token，删除时用 Lua 脚本校验是自己的锁再删除，长任务用心跳续期；④ 有副作用的工具使用幂等键（如 thread_id + 步骤序号）；⑤ 超时后返回明确错误，提示用户稍后查看结果。
    - id: d49-c1-q3
      kp: d49-k2
      type: code
      question: 代码中 `reserve_tokens` 按「消息长度 + 2000」预扣了租户配额。请说明这个预扣在成功、失败、超过递归上限三种情况下各会怎样，以及如何改成准确的结算。
      key_points:
        - {text: "指出成功时实际 Token 可能远超或低于预估，但没有按实际用量结算", dim: principle}
        - {text: "指出失败或抛出递归超限时预扣不退还，额度被逐渐吃掉，且递归超限时实际已消耗多次调用", dim: principle}
        - {text: "提出从各次模型调用的 usage 汇总实际 Token，在 finally 中多退少补", dim: engineering}
      reference: |
        成功时：一次 Agent 执行可能包含多次模型调用（例如 4 次，每次带完整历史），实际 Token 可能是预估的数倍，但代码没有按实际用量补扣，配额形同虚设；也可能实际更少却没有退还。
        失败时（上游 429、工具异常导致 ainvoke 抛错）：异常向上抛出，预扣的额度不退还，租户额度被无效占用。
        递归超限时：LangGraph 抛出递归超限错误，此时已经发生了 12 步左右的模型调用，真实消耗很大，却既不补扣也不退还，最终账单与配额系统对不上。
        改法：在图的模型节点或 LLM 网关中累计本次执行每次调用返回的 usage（输入与输出 Token），通过回调或返回值汇总；在 finally 中调用 `settle_tokens(tenant_id, reserved, actual)` 多退少补；失败也按已产生的实际消耗结算。配额与成本数据同时写入 Trace，便于对账。
interview:
  - id: d49-i1
    kp: d49-k1
    type: oral
    difficulty: 2
    question: 请设计一个企业内部知识库 + 办事 Agent 的系统，讲一下整体架构和每个组件的作用。
    key_points:
      - {text: "画出网关、鉴权、FastAPI、Redis、任务队列与 Worker、PostgreSQL 加 pgvector、Agent、MCP、LLM 网关、可观测", dim: concept}
      - {text: "说明每个组件存在的理由与去掉的后果", dim: principle}
      - {text: "说明无状态应用、快慢分离、权限在模型之外三条原则", dim: principle}
      - {text: "说明按阶段演进而非一次到位，并结合项目规模", dim: project}
    reference: |
      我会先说原则，再讲组件。原则三条：应用无状态、状态外置；在线问答与入库等慢任务分离；权限在模型之外校验。
      组件：① API 网关负责 TLS、WAF、粗限流；② 企业 OIDC 登录签发 JWT，携带用户、租户、角色；③ FastAPI 多副本无状态，负责鉴权、检索、调用模型、SSE 流式输出；④ Redis 做缓存、分布式限流、会话锁和队列 broker；⑤ 任务队列 + Worker 负责解析、切片、向量化，上传接口立即返回；⑥ PostgreSQL + pgvector 存业务数据、文档元数据、向量和权限，检索时权限条件写在 SQL 中，好处是事务一致、少维护一个系统；⑦ LangGraph Agent 用 PostgresSaver 持久化状态，支持中断后人工确认再恢复；⑧ MCP 服务把工单、OA 能力标准化为工具，独立部署、按用户授权；⑨ LLM 网关统一路由、重试、Key 管理和按租户计量；⑩ OpenTelemetry 采集 Trace、Token、成本与反馈。
      演进：100 人试点用单机 Compose 即可，1000 人拆出 Worker、多副本，1 万人再加 PgBouncer、LLM 网关多模型路由和租户配额。
    oral: |
      我先讲三条原则：应用无状态、快慢任务分离、权限不交给模型。
      然后按请求路径讲组件：网关做 TLS 和粗限流；企业登录签发 JWT；FastAPI 多副本负责鉴权、检索和流式输出；Redis 放缓存、限流和会话锁；上传的文档走任务队列，Worker 异步解析和向量化；PostgreSQL 加 pgvector 同时存元数据、向量和权限，检索时权限直接写在 SQL 里；Agent 用 LangGraph，状态存到 Postgres，需要审批时可以暂停再恢复；企业系统通过 MCP 服务暴露成工具；所有模型调用走 LLM 网关统一计量；最后是 OpenTelemetry 观测。
      我在制造企业的项目就是这个结构，但试点阶段是单机部署，推广时才逐步拆开的。
  - id: d49-i2
    kp: d49-k2
    type: oral
    difficulty: 3
    question: 用户上传一份 200 页的 PDF，到他能在问答中检索到这份文档，系统内部发生了什么？中途失败怎么办？
    key_points:
      - {text: "上传接口存原文、写记录、投递任务后立即返回 202，前端展示进度", dim: engineering}
      - {text: "Worker 按状态机执行解析、切片、向量化并分批写入，每步更新状态", dim: principle}
      - {text: "幂等：document_id 与版本号、内容哈希去重，重复消费安全", dim: engineering}
      - {text: "原子切换生效版本，检索永远看到完整版本，缓存按版本失效", dim: engineering}
      - {text: "失败处理：有限重试、记录失败原因、人工重试、租户 ID 校验", dim: engineering}
    reference: |
      ① 上传：API 校验 JWT 和文件类型大小，原文存入对象存储，documents 表写一条记录（tenant_id、内容哈希、版本号、状态 uploaded），投递入库任务，立即返回 202 和 document_id，前端轮询或订阅进度。若内容哈希已存在则直接提示重复。
      ② 解析：Worker 领取任务，校验任务中的 tenant_id 与记录一致，状态改为 parsing，解析 PDF（文本、表格、页码），失败时记录原因并标记 failed。
      ③ 切片与向量化：按切片策略生成片段，分批调用 Embedding（带缓存与限速），分批写入 chunks 表，片段标记为新版本且未生效；状态 embedding。单批失败有限次重试。
      ④ 发布：全部片段写入成功后，在一个事务中把新版本标记生效、旧版本标记失效，状态改为 ready，知识库版本号自增让检索缓存失效；旧片段异步清理。
      ⑤ 失败恢复：任务可重复消费，Worker 根据状态和版本号跳过已完成步骤；重试耗尽进入 failed，管理员可在后台重试。整个过程在 Trace 中可查，问答侧在发布前永远只看到旧版本或没有该文档，不会看到一半。
    oral: |
      整个过程是异步的状态机。上传接口只做三件事：原文存对象存储、写一条文档记录、投递任务，然后马上返回 202，前端显示进度。
      Worker 领到任务后先校验租户，然后解析、切片、分批向量化，每一步都更新状态。新片段先以未生效的版本写入，全部成功后在一个事务里切换生效版本，再让检索缓存按版本号失效。这样用户永远不会搜到一半新一半旧的内容。
      失败的话，任务带着文档 ID 和版本号，重复消费是幂等的，重试耗尽就标记失败让管理员重试。我们之前就踩过先删后写的坑，改成版本切换后才解决。
  - id: d49-i3
    kp: d49-k3
    type: oral
    difficulty: 4
    question: 你的 AI 助手现在有 100 个用户，老板说半年后要支持 1 万个用户。你会怎么规划？
    key_points:
      - {text: "先做容量估算并给出量级：峰值 QPS、并发、每日 Token 与成本、向量规模", dim: engineering}
      - {text: "判断瓶颈在 LLM 配额与成本、向量检索、入库峰值，而不是 Web QPS", dim: principle}
      - {text: "分阶段演进：拆 Worker、无状态多副本、PgBouncer、读副本、LLM 网关、租户配额", dim: engineering}
      - {text: "成本控制与降级预案同步规划", dim: engineering}
      - {text: "用压测和评估集验证每一步，并用试点数据校准估算", dim: project}
    reference: |
      第一步算账，用试点数据校准：假设日活 30%、人均 15 问，1 万人每天约 4.5 万次问答，峰值约 10 QPS、并发约 80；每次约 4500 Token，每天约 2 亿 Token，算出月度成本；200 万左右向量加 HNSW 索引的内存需求。
      第二步判断瓶颈：Web 层压力不大；首先是模型配额与成本，其次是向量索引内存与带权限过滤的检索召回，再次是推广初期集中导入的入库峰值和长连接数。
      第三步分阶段改造：1000 人阶段拆出入库 Worker、应用无状态多副本、Redis 限流与锁、托管数据库、接入 Trace；1 万人阶段应用自动扩缩、PgBouncer、检索走读副本、HNSW 参数调优与过滤检索迭代扫描或分区、LLM 网关多 Key 多模型路由、按部门 TPM 与预算、Agent 长任务队列化。
      第四步成本与可靠性：缓存、历史摘要、小模型处理简单任务；熔断、备用模型、降级开关并演练。
      第五步验证：每阶段用回放压测验证 P95/P99，用评估集确认降本措施不影响质量，按实际增长节奏推进而不是一次到位。
    oral: |
      我会先算账而不是先加机器。用试点数据推算，1 万人每天大概 4.5 万次问答，峰值也就 10 QPS 左右，并发 80 上下，但每天会有约 2 亿 Token。所以瓶颈不在 Web 层，而在模型配额和成本、向量索引内存，以及推广初期集中导入文档。
      改造分两步：先拆出入库 Worker、应用改成无状态多副本、状态放 Redis 和 Postgres；再上 PgBouncer、检索走读副本、LLM 网关做多 Key 和多模型路由、按部门设预算。
      同时准备降本和降级方案，每一步都用压测和评估集验证。我之前从 300 人推广到 8000 人，应用只从 2 副本扩到 4 副本，主要功夫都花在模型配额和成本上。
  - id: d49-i4
    kp: d49-k5
    type: oral
    difficulty: 4
    question: 在你设计的架构中，挑三个最可能出故障的点，讲讲故障时系统表现和你的应对设计。
    key_points:
      - {text: "模型厂商故障：超时、有限重试、熔断、备用模型或缓存降级", dim: engineering}
      - {text: "Redis 故障：限流降级为进程内粗限流并告警，缓存失效直连数据库，锁失效时的处理", dim: engineering}
      - {text: "MCP 工具或企业系统故障：单工具超时、错误作为观察返回、步数上限、幂等键", dim: engineering}
      - {text: "说明超时预算由外向内递减，并定期故障演练", dim: principle}
      - {text: "给出真实故障或演练的经历", dim: project}
    reference: |
      ① 模型厂商：最常见。表现为超时、429、5xx。设计：LLM 网关统一设置短于外层的超时、带抖动的有限重试、连续失败触发熔断，熔断期间切换备用模型；备用也不可用时返回缓存答案或友好提示并记录问题。Agent 中对模型能力要求高的复杂流程可暂时关闭。
      ② Redis：表现为限流、缓存、会话锁不可用。设计：限流降级为进程内粗限流（总阈值除以进程数）并告警，不静默放行；缓存未命中直接查数据库，注意数据库承压时配合限流；会话锁不可用时对 Agent 写操作采用保守策略（暂停写类工具），只读问答继续服务。
      ③ MCP 工具或企业系统：表现为工具超时、报错。设计：每个工具单独超时，失败以结构化错误作为观察结果返回给模型，让 Agent 告知用户而不是无限重试；recursion_limit 与重复调用检测防止循环；有副作用的工具使用幂等键，结合 Checkpoint 恢复时不会重复提交。
      共性：从用户可接受总时长倒推各层超时，内层小于外层；所有降级都有开关和指标；每季度做故障演练。我们曾在一次厂商故障中靠熔断切换维持了问答可用，复盘时发现内层超时大于网关超时，随后统一按预算重新配置。
    oral: |
      我挑三个。第一是模型厂商，这是最常见的。我们在 LLM 网关里统一做超时、有限重试和熔断，熔断后切备用模型，再不行就返回缓存答案。我们真遇到过一次 40 分钟的厂商故障，问答一直可用。
      第二是 Redis。限流降级成进程内的粗限流并告警，绝不静默放行；缓存直接回源数据库；会话锁不可用时暂停写类工具，只读问答照常。
      第三是 MCP 工具背后的企业系统。每个工具单独超时，失败作为结果返回给模型，让它告诉用户，不无限重试，有副作用的工具带幂等键。
      另外超时要从外往里递减，我们复盘时就发现过内层超时比网关还长的问题。
