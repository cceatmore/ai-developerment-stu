day: 32
phase: 4
title: Agent 核心机制：ReAct
goals:
  - 能讲清 ReAct 中思考（Thought）、行动（Action）、观察（Observation）三者如何交替，以及它比纯 CoT、纯 Act 好在哪
  - 能对比「文本格式 ReAct」与「原生 Tool Calling」两种实现，说出解析、停止、可靠性上的差异
  - 能分析 ReAct 循环的上下文膨胀问题，并给出截断、摘要、步数上限等对策
  - 能读懂一个手写 ReAct 循环，指出其中的失败点
knowledge_points:
  - id: d32-k1
    name: ReAct 范式：推理与行动交替
    level: P0
    summary: ReAct 让模型先写一句思考、再做一个动作、再读观察结果，循环推进，用真实反馈纠正推理
    why: |
      ReAct 是几乎所有现代 Agent 框架的默认循环结构（LangChain 的 create_agent、各家 Agent SDK 本质上都是它的变体）。
      面试中「讲讲 ReAct」「ReAct 和 CoT 有什么区别」是 Agent 岗位的基础题，答不清就很难往后聊工具调用和 LangGraph。
    problem: |
      推理和行动分开时各有缺陷：
      - **只推理（CoT）**：模型在脑子里一步步推，但用的全是训练数据里的知识，推到一半事实错了也不知道，**幻觉会沿着推理链传播**。
      - **只行动（Act-only）**：模型直接调用搜索、点击，但没有中间思考，不知道为什么做这一步，搜到无关结果也不会调整计划。
      ReAct 把两者交织：思考指导行动，行动的结果又修正思考。
    principle: |
      **一、来源**

      ReAct（Reason + Act）出自 Yao 等人 2022 年的论文《ReAct: Synergizing Reasoning and Acting in Language Models》（ICLR 2023）。核心思想：让 LLM **交替生成推理轨迹和具体动作**。

      - 推理轨迹帮助模型**制定、跟踪、更新行动计划，并处理异常**；
      - 动作让模型**从外部知识库或环境获取信息**。

      **二、一个完整轨迹长什么样**

      以论文中的 HotpotQA 多跳问答为例（动作只有 search、lookup、finish 三种）：

      ```text
      Question: 公司 A 的创始人毕业于哪所大学？
      Thought 1: 我需要先找到公司 A 的创始人是谁。
      Action 1: search[公司 A]
      Observation 1: 公司 A 由张三于 2010 年创立……
      Thought 2: 创始人是张三，接下来查张三的教育背景。
      Action 2: search[张三]
      Observation 2: 张三，毕业于某某大学计算机系……
      Thought 3: 已经找到答案。
      Action 3: finish[某某大学]
      ```

      ```mermaid
      sequenceDiagram
        participant M as LLM
        participant R as 运行时
        participant E as 环境或工具
        M->>R: Thought 加 Action：search 公司 A
        R->>E: 执行 search
        E-->>R: 搜索结果
        R->>M: Observation 追加到上下文
        M->>R: Thought 加 Action：search 张三
        R->>E: 执行 search
        E-->>R: 搜索结果
        R->>M: Observation 追加到上下文
        M->>R: Thought 加 Action：finish 答案
        R-->>R: 识别到 finish，结束循环
      ```

      **三、三个角色由谁产生**

      | 部分 | 谁生成 | 作用 |
      |---|---|---|
      | Thought | 模型 | 分解问题、总结观察、决定下一步、发现走错了要换方向 |
      | Action | 模型 | 选工具和参数，是**意图**，不是执行 |
      | Observation | **运行时 / 环境** | 工具真实返回的结果，是模型唯一可信的外部事实来源 |

      最容易忽略的一点：**Observation 必须由你的代码填写**。如果让模型自己续写 Observation，它会编造一个看起来合理的结果，等于回到了纯 CoT 的幻觉问题。

      **四、为什么比 CoT 和 Act-only 好**

      论文的观察：
      - 在 HotpotQA、FEVER 这类知识任务上，ReAct 的过程**更基于事实（grounded）**；CoT 推理结构好，但容易出现幻觉事实。论文因此还提出了 ReAct 与 CoT 自洽投票互相回退的组合策略。
      - 在 ALFWorld、WebShop 这类交互决策任务上，ReAct 只用少量示例，成功率就明显超过模仿学习和强化学习基线。
      - 推理轨迹人类可读，**便于调试和建立信任**。

      **五、它在现代框架中的样子**

      今天大多数产品不再让模型输出「Thought: / Action:」文本，而是用原生 Tool Calling（结构化的工具调用字段），但循环结构完全一样：**模型决策 → 运行时执行 → 结果作为观察回传 → 再决策**。LangChain 文档对 Agent 的定义「a model calling tools in a loop」正是 ReAct 循环。

      **六、不这样做会怎样**

      - 没有 Thought：模型选工具缺少规划，碰到无关结果就乱试，日志里也看不出它为什么这么做。
      - 没有 Observation 回传：模型无法根据真实结果修正，等于盲目连续行动。
      - 没有 finish 动作或终止判断：循环不知道何时结束。
    scenarios: |
      - **多跳问答**：「我们去年签约金额最大的客户，负责销售是谁」需要先查合同、再查客户、再查负责人。
      - **故障排查**：思考「CPU 正常但延迟高，可能是数据库慢查询」→ 查慢查询日志 → 根据观察再决定是否查锁等待。
      - **代码 Agent**：思考要改哪个文件 → 读文件 → 修改 → 跑测试 → 根据测试结果继续。
    pitfalls: |
      - **误区：ReAct 是一个框架或库。** 它是一种提示与控制循环的范式，任何语言都能手写。
      - **误区：Observation 可以让模型生成。** 必须由运行时填真实结果，否则就是幻觉。
      - **误区：Thought 越长越好。** 冗长的思考会占用上下文、增加成本，且不保证更准。
      - **混淆 ReAct 和 CoT**：CoT 只有推理，不与外部交互；ReAct 的关键是推理和外部反馈交替。
    interview_asks:
      - 讲一下 ReAct 的原理，Thought、Action、Observation 分别是什么？
      - ReAct 和 Chain-of-Thought 有什么区别？各自的问题是什么？
      - 为什么 Observation 不能让模型自己生成？
    project_example: |
      在合同检索助手中，用户问「和 A 公司最近一份合同的付款周期是多少」。纯 RAG 经常检索到 A 公司的旧合同。
      改成 ReAct 后，模型先思考「需要先确定最近一份合同」，调用 list_contracts 按日期排序；观察到合同编号后，再调用 get_contract_clause 查付款条款。
      上线后我们在 trace 中保留每步 Thought，业务方复核时能直接看到模型为什么选了这份合同，信任度明显提高。
    freshness: |
      核对于 2026-11：论文信息来自 arXiv 2210.03629（ICLR 2023 版本）。论文在 HotpotQA 和 FEVER 中把 ReAct 的最大步数分别设为 7 和 5，并指出更多步数不会提高效果，这也是「必须设步数上限」的早期依据。
    sources:
      - {title: "ReAct: Synergizing Reasoning and Acting in Language Models (arXiv)", url: "https://arxiv.org/abs/2210.03629"}
      - {title: "LangChain Docs - Agents", url: "https://docs.langchain.com/oss/python/langchain/agents"}

  - id: d32-k2
    name: 思考、行动、观察的工程实现：文本 ReAct 与原生 Tool Calling
    level: P0
    summary: 文本 ReAct 靠 Prompt 约定格式加正则解析；原生 Tool Calling 由 API 返回结构化调用，更可靠，是当前主流
    why: |
      很多老教程和面试题里的 ReAct 是「Thought: / Action: / Observation:」文本格式，而现在生产系统几乎都用原生 Tool Calling。
      你需要同时看懂两种实现，才能读旧代码、解释框架内部，并在面试中说清「为什么现在不用正则解析了」。
    problem: |
      ReAct 循环的运行时必须回答三个问题：
      - 模型这一步是想**调用工具**还是**给出最终答案**？
      - 如果调用工具，**工具名和参数是什么**？
      - 工具结果**以什么格式**交回模型，模型才能和对应的调用对上？
      文本格式靠约定和解析，容易出错；原生 Tool Calling 把这三件事变成了 API 协议。
    principle: |
      **一、文本 ReAct：Prompt 约定 + 解析**

      做法：
      1. System Prompt 写清格式：每步输出 Thought、Action（tool_name[参数]），或者 Final Answer。
      2. 模型生成后，运行时**只保留到 Action 为止**，丢弃模型可能自己编的 Observation（老做法是用 API 的 stop 参数在 Observation 处截断；有些模型或接口不支持 stop，就在代码里截断）。
      3. 用正则解析 Action，执行工具，把「Observation: 结果」拼到 scratchpad（草稿区）。
      4. 把整个 scratchpad 作为下一轮输入。

      **问题**：
      - 模型格式不稳定：漏写 Action、参数带括号、同时写 Action 和 Final Answer；
      - 参数是自由文本，复杂参数（嵌套 JSON）很难解析；
      - 一次只能一个动作，不支持并行。

      **二、原生 Tool Calling：结构化协议**

      Day 18 学过 API 层：请求里声明 tools（名称、描述、JSON Schema），模型返回结构化的工具调用。以 OpenAI Responses API 为例：

      - 模型输出项 `type` 为 `function_call`，带 `name`、`arguments`（JSON 字符串）和 `call_id`；
      - 运行时执行后追加 `{"type": "function_call_output", "call_id": ..., "output": ...}`；
      - 输出里没有 function_call 时，`output_text` 就是最终答案。

      对应关系：

      | ReAct 概念 | 文本实现 | 原生 Tool Calling |
      |---|---|---|
      | Thought | 文本 Thought 行 | 模型的文字输出或推理模型的内部推理 |
      | Action | 正则解析 tool[参数] | function_call 项，参数受 Schema 约束 |
      | Observation | 拼接 Observation 文本 | function_call_output，靠 call_id 配对 |
      | 结束 | 解析到 Final Answer | 不再返回工具调用 |

      ```mermaid
      flowchart LR
        subgraph T["文本 ReAct"]
          T1["模型输出整段文本"] --> T2["截断到 Action"] --> T3["正则解析工具名和参数"] --> T4["拼接 Observation 文本"]
        end
        subgraph N["原生 Tool Calling"]
          N1["模型输出 function_call 项"] --> N2["JSON 解析 arguments 并校验 Schema"] --> N3["按 call_id 回传结果"]
        end
      ```

      **三、推理模型带来的变化**

      推理模型（如 OpenAI 的 GPT-5 系列、o 系列）会在内部「思考」，不需要你在 Prompt 里要求写 Thought。OpenAI 文档特别说明：**推理模型在带工具调用的响应中返回的 reasoning 项，必须和工具结果一起回传**，否则会丢失推理上下文。简单做法是像官方示例那样把 `response.output` 整体追加回输入。

      **四、选择建议**

      - 新项目：**一律用原生 Tool Calling**（或框架封装，如 LangChain create_agent）。
      - 文本 ReAct 只在模型不支持工具调用（某些本地小模型）、或做教学演示时使用。
      - 即使用原生方式，仍可以让模型在调用工具前用一句话说明意图，便于日志审计。

      **五、不这样做会怎样**

      用正则解析做生产系统，线上会出现大量「解析失败」：模型多输出一个空格、把参数放在引号里、用中文冒号，都可能导致解析不到 Action，循环要么崩溃要么空转。
    scenarios: |
      - **读老项目代码**：看到 `Thought:`、`Action Input:`、`AgentExecutor`、`initialize_agent` 等字样，就知道是旧版 LangChain 的文本 ReAct 风格（现已迁到 langchain-classic，属旧写法）。
      - **本地小模型部署**：部分开源小模型工具调用能力弱，可能仍需文本格式 + 宽容解析 + 格式错误重试。
      - **新项目**：直接用 API 原生工具调用或 create_agent。
    pitfalls: |
      - **误区：原生 Tool Calling 不是 ReAct。** 它是 ReAct 循环的结构化实现，思想完全一样。
      - **忘记丢弃模型自编的 Observation**：文本 ReAct 中如果不截断，模型会伪造工具结果。
      - **忘记 call_id 配对**：并行调用多个工具时，结果必须用 call_id 对应，不能只按顺序拼。
      - **推理模型丢 reasoning 项**：只回传工具结果、不回传 reasoning 项，可能导致效果下降或报错，以官方文档为准。
    interview_asks:
      - 文本格式的 ReAct 和原生 Function Calling 实现的 Agent 有什么区别？
      - 如果模型输出格式不符合约定、解析失败，你怎么处理？
      - 用推理模型做 Agent 时，还需要在 Prompt 里要求它写 Thought 吗？
    project_example: |
      接手的一个老项目用 initialize_agent 的文本 ReAct，线上日志里约 8% 的请求报「Could not parse LLM output」。
      排查发现模型经常在 Action Input 外加中文引号。迁移到原生 Tool Calling 后，参数由 JSON Schema 约束，解析失败基本消失；对极少数参数校验失败的情况，把校验错误作为工具结果回传，让模型自己修正参数。
    freshness: |
      核对于 2026-11：OpenAI 官方 Function calling 指南以 Responses API 为主，工具调用项为 `function_call`（含 `call_id`、`name`、JSON 字符串 `arguments`），回传项为 `function_call_output`；文档写明推理模型返回的 reasoning 项需与工具结果一并回传。旧写法：OpenAI SDK 0.x 的 `openai.ChatCompletion.create`、LangChain 0.x 的 `initialize_agent` / `AgentExecutor` 文本 ReAct（LangChain 1.x 中已移入 langchain-classic，标记为 2.0 移除）。
    sources:
      - {title: "OpenAI Docs - Function calling", url: "https://platform.openai.com/docs/guides/function-calling"}
      - {title: "LangChain v1 migration guide", url: "https://docs.langchain.com/oss/python/migrate/langchain-v1"}

  - id: d32-k3
    name: 循环终止与上下文膨胀
    level: P1
    summary: ReAct 每步都把观察追加进上下文，步数越多越贵越慢越容易跑偏，必须设上限并压缩观察
    why: |
      Agent 上线后最常见的两类事故：**死循环**和**成本暴涨**，根源都在循环控制和上下文管理。
      这也是面试官区分「跑过 Demo」和「上过生产」的关键问题，Day 37 会系统讲控制机制，今天先理解成因。
    problem: |
      ReAct 每一轮的输入 = 系统提示 + 工具定义 + 用户问题 + **之前所有的 Thought、Action、Observation**。
      - 一次网页搜索的 Observation 可能有上万字符，几轮下来上下文就接近上限；
      - 每轮都要重新发送全部历史，**Token 成本随步数近似平方增长**；
      - 上下文太长时，模型容易忽略早期的关键信息（Day 13 讲过的长上下文问题），开始重复调用或跑偏。
    principle: |
      **一、为什么成本近似平方增长**

      设每步新增约 k 个 Token，第 n 步的输入长度约为 n×k，总输入 Token 约为 k×(1+2+…+n)，也就是约 k×n²/2。
      步数从 5 增加到 10，输入 Token 约变成 4 倍，而不是 2 倍。

      ```mermaid
      flowchart LR
        S1["第 1 步输入：系统提示加问题"] --> S2["第 2 步输入：加上第 1 步的思考、动作、观察"]
        S2 --> S3["第 3 步输入：再加第 2 步全部内容"]
        S3 --> SN["第 n 步：包含前 n-1 步全部历史"]
      ```

      **二、停止条件（至少要有这些）**

      - **正常结束**：模型给出最终答案（不再调用工具）。
      - **最大步数**：例如 6~10 步，超出走兜底（转人工、返回部分结果）。ReAct 论文本身就设了 7 步和 5 步上限。
      - **超时与预算**：整体墙钟时间、累计 Token 或费用上限。
      - **重复检测**：连续多次相同工具 + 相同参数，判定为空转。

      **三、控制上下文膨胀的手段**

      | 手段 | 做法 | 代价 |
      |---|---|---|
      | 截断观察 | 工具结果超过 N 字符就截断，并注明已截断 | 可能丢信息 |
      | 工具只返回必要字段 | 在工具层过滤，而不是把原始 JSON 全塞给模型 | 需要设计工具 |
      | 摘要旧步骤 | 超过阈值时把早期步骤压缩成摘要 | 多一次 LLM 调用 |
      | 外置存储 | 大结果存起来，只给模型一个引用 ID 和摘要 | 实现复杂 |

      LangChain v1 也提供了 SummarizationMiddleware 等中间件处理这个问题（Day 34 简介），但原理就是上面这些。
    scenarios: |
      - **网页搜索 Agent**：搜索结果截断到前 2000 字符并只保留标题、摘要、链接。
      - **日志排查 Agent**：日志查询工具默认只返回最近 50 条匹配行和总数，模型需要更多时再翻页。
      - **长对话客服**：超过 20 轮时把早期对话压缩成「用户诉求与已确认信息」的摘要。
    pitfalls: |
      - **误区：上下文窗口够大就不用管。** 窗口大不等于成本低，也不等于模型能用好长上下文。
      - **截断不提示**：截断后不告诉模型「结果已截断」，模型会误以为数据就这么多。
      - **只有最大步数，没有兜底**：到上限后直接抛异常，用户看到 500，应该返回部分结论或转人工。
    interview_asks:
      - ReAct 循环跑得越来越慢、越来越贵，可能是什么原因？怎么优化？
      - Agent 的停止条件有哪些？
    project_example: |
      日志排查 Agent 上线初期，单次会话平均消耗约 6 万 Token，P95 延迟 50 秒。trace 显示 search_logs 每次返回上千行日志原文。
      我们把工具改为返回「匹配总数 + 前 30 行 + 错误类型聚合统计」，超过 3000 字符截断并标注；同时设置最多 8 步。之后平均 Token 降到约 1.5 万，延迟降到 15 秒左右，定位准确率没有下降。

  - id: d32-k4
    name: ReAct 的局限与常见变体
    level: P2
    summary: ReAct 每步只看眼前，长任务易跑偏；Plan-and-Execute、Reflexion 等变体分别补规划和反思
    why: |
      面试中常被追问「ReAct 有什么缺点」「除了 ReAct 还知道哪些 Agent 模式」，知道变体的思路能体现视野。
    problem: |
      ReAct 是「走一步看一步」：长任务里容易遗忘总体目标、在局部反复尝试；每一步都调用大模型，成本高；失败后也不会总结教训。
    principle: |
      **常见变体思路**：

      - **Plan-and-Execute（先规划后执行）**：先让模型生成完整计划（步骤列表），再逐步执行，必要时重新规划。优点是目标清晰、可以让小模型执行步骤；缺点是计划可能一开始就错。
      - **Reflexion（反思）**：任务失败后让模型用自然语言总结「哪里做错了」，把反思写进记忆，下次尝试时参考。
      - **ReAct + 规划工具**：给 Agent 一个「写 / 更新待办清单」的工具，让它自己维护计划（很多编码 Agent 采用，LangChain v1 也有 TodoListMiddleware）。

      ```mermaid
      flowchart LR
        P["规划器：生成步骤列表"] --> E["执行器：逐步 ReAct"]
        E --> C{"计划还成立吗"}
        C -- "是" --> E
        C -- "否" --> P
        E --> F["完成并汇总"]
      ```

      选择时同样遵循「够用即止」：大部分业务 Agent 用 ReAct 加好的停止条件就够了。
    scenarios: |
      - 调研报告类长任务：Plan-and-Execute，先列大纲再逐节检索撰写。
      - 代码修复：失败后反思测试报错原因，再尝试修复。
      - 普通客服、查询类 Agent：标准 ReAct 即可。
    pitfalls: |
      - **误区：变体一定比 ReAct 好。** 多出来的规划和反思步骤同样消耗 Token，需要评估证明收益。
      - **误区：反思能让模型真的学会。** Reflexion 只是把文字经验放进上下文，不会改变模型参数。
    interview_asks:
      - ReAct 有什么局限？
      - 你了解 Plan-and-Execute 吗？和 ReAct 有什么区别？
    project_example: |
      做竞品调研报告 Agent 时，纯 ReAct 经常只调研了两三个竞品就开始写结论。改为先生成「竞品列表 + 每个竞品要查的维度」的计划，再逐项执行，最后汇总，报告覆盖度明显提升。
    sources:
      - {title: "ReAct: Synergizing Reasoning and Acting in Language Models (arXiv)", url: "https://arxiv.org/abs/2210.03629"}

quiz:
  - id: d32-q1
    kp: d32-k1
    type: single
    question: 在 ReAct 循环中，Observation（观察）应该由谁产生？
    options:
      - "由模型在输出 Action 后继续生成，代表它预期的工具结果"
      - "由运行时执行工具后，把工具真实返回的结果填入"
      - "由模型在下一轮的 Thought 中总结得到"
      - "由 System Prompt 预先写好的示例提供"
    answer: [1]
    explain: |
      Observation 是模型获取外部真实信息的唯一渠道，必须由运行时执行工具后填入真实结果。A 是文本 ReAct 中最危险的错误：模型自己续写的「结果」是编造的，等于回到 CoT 的幻觉问题，所以要在 Action 处截断。C 中 Thought 是对观察的总结，不是观察本身；D 的示例只用于教格式。
  - id: d32-q2
    kp: d32-k2
    type: judge
    question: 使用 OpenAI 原生 Function Calling 实现的 Agent 不属于 ReAct，因为它不再输出「Thought / Action / Observation」文本。
    answer: false
    explain: |
      ReAct 的本质是「模型决策 → 运行时执行 → 结果作为观察回传 → 再决策」的循环，与是否使用文本格式无关。原生 Function Calling 用结构化的 function_call 项表达 Action、用 function_call_output 表达 Observation，是 ReAct 循环更可靠的实现方式。
  - id: d32-q3
    kp: d32-k3
    type: multi
    question: 一个 ReAct Agent 每步平均新增约 2000 Token 的观察内容，以下哪些说法是正确的？
    options:
      - "步数从 5 增加到 10，累计输入 Token 大约变成原来的 4 倍"
      - "只要模型上下文窗口足够大，就不需要控制观察长度"
      - "工具层只返回必要字段、对超长结果截断并标注，是降低成本的有效手段"
      - "上下文过长时，模型可能忽略早期关键信息，出现重复调用工具"
    answer: [0, 2, 3]
    explain: |
      每轮都要重发全部历史，累计输入约与步数平方成正比，5 到 10 步约为 4 倍，A 正确。B 错：窗口够大不代表成本可接受，也不代表模型能用好长上下文。C 在源头减少观察内容，是最有效的手段之一。D 是长上下文中常见现象，会导致 Agent 跑偏或空转。
  - id: d32-q4
    kp: d32-k1
    type: short
    question: ReAct 相比纯 Chain-of-Thought（CoT）和纯 Act-only 分别解决了什么问题？请各举一个失败例子说明。
    key_points:
      - {text: "指出 CoT 只依赖模型内部知识，不与外部交互，事实错误会沿推理链传播", dim: principle}
      - {text: "指出 Act-only 缺少中间推理，不能根据观察调整计划或处理异常", dim: principle}
      - {text: "说明 ReAct 用思考指导行动、用观察修正思考，过程更基于事实", dim: concept}
      - {text: "给出具体失败例子，例如 CoT 编造创始人学历、Act-only 搜到同名人物后不会调整", dim: project}
    reference: |
      **CoT 的问题**：只在模型内部推理，不获取外部信息。例如问「公司 A 创始人毕业于哪所大学」，模型可能凭记忆推出一个错误的创始人，再基于这个错误推出学校，**幻觉沿着推理链传播**，而且看起来逻辑严密。

      **Act-only 的问题**：直接连续调用工具，没有中间思考。例如搜索「张三」得到了一个同名演员的资料，它不会意识到「这不是我要找的人，应该加上公司名再搜」，只会继续执行或直接给出错误答案。

      **ReAct 的改进**：思考帮助模型分解问题、跟踪计划、发现异常（「搜到的是同名演员，需要换关键词」）；行动从外部拿到真实观察，修正推理中的事实。论文中 ReAct 在知识类任务上过程更基于事实，在交互决策任务上成功率显著高于基线，而且轨迹人类可读，便于调试。
  - id: d32-q5
    kp: d32-k2
    type: scenario
    question: |
      你接手了一个基于文本格式 ReAct 的老 Agent（模型输出「Thought / Action: tool[参数] / Final Answer」，代码用正则解析）。线上日志显示：约 8% 请求报解析失败；有些请求中，模型在 Action 后面自己写了 Observation 和最终答案，答案是编造的。
      请分析原因并给出短期修复和长期方案。
    key_points:
      - {text: "指出解析失败源于文本格式不稳定，如引号、冒号、多余空格或缺少 Action", dim: principle}
      - {text: "指出模型自写 Observation 是因为没有在 Action 处截断，导致伪造工具结果", dim: principle}
      - {text: "短期：在 Action 处截断输出，解析失败时把格式错误作为观察回传让模型重试并计入步数", dim: engineering}
      - {text: "长期：迁移到原生 Tool Calling，由 JSON Schema 约束参数，用 call_id 配对结果", dim: engineering}
      - {text: "提出迁移后用评估集对比解析失败率和任务成功率", dim: project}
    reference: |
      **原因**：
      1. 文本格式靠模型「自觉」遵守，模型会加中文引号、用全角冒号、漏写 Action、或同时写 Action 和 Final Answer，正则就匹配不到。
      2. 模型生成完 Action 后没有被截断，它会按 Prompt 里示例的格式继续写 Observation，于是**伪造了工具结果**，甚至直接给出基于伪造结果的答案。

      **短期修复**：
      - 生成后只保留到 Action 行为止（或使用接口的 stop 参数在 Observation 处截断），丢弃后续内容；
      - 解析失败时不要崩溃，把「格式错误，请按 Action: 工具名[参数] 输出」作为 Observation 回传，让模型重试，并计入最大步数；
      - 正则放宽，兼容全角符号和引号。

      **长期方案**：迁移到原生 Tool Calling（或 LangChain 1.x 的 create_agent）。工具调用是结构化字段，参数由 JSON Schema 约束，结果用 call_id 配对，从协议层面消除解析问题。迁移前后用同一评估集对比解析失败率、任务成功率和平均步数。
    followup:
      question: 迁移到原生 Tool Calling 后，还会出现「参数不合法」的情况吗？怎么处理？
      key_points: [Schema 约束能减少但不保证业务合法性, 在工具内做业务校验, 校验错误作为工具结果回传让模型修正]
      reference: 会。Schema 只保证类型和必填字段，业务层面的不合法（订单号不存在、日期范围倒置）仍会出现。应在工具内部校验，把清晰的错误信息作为工具结果回传，让模型修正参数，而不是抛异常中断循环。
  - id: d32-q6
    kp: d32-k3
    type: design
    question: |
      请为一个「网页调研 Agent」设计循环控制与上下文管理方案：它可调用 web_search（返回 10 条结果）和 fetch_page（返回网页正文，可能几万字）。要求单次任务成本可控、不会死循环。
    key_points:
      - {text: "设计停止条件：最大步数、整体超时、Token 或费用预算、重复调用检测", dim: engineering}
      - {text: "fetch_page 在工具层做正文提取、截断并标注已截断，或先摘要再返回", dim: engineering}
      - {text: "web_search 只返回标题、摘要、链接等必要字段", dim: engineering}
      - {text: "超过阈值时压缩早期步骤为摘要，或把大结果外置只回传引用", dim: principle}
      - {text: "达到上限时返回已收集信息的部分结论而不是直接报错", dim: project}
    reference: |
      **停止条件**：
      - 最多 12 步；整体 120 秒超时；累计输入 Token 超过预算（例如 8 万）就停止；
      - 同一 URL 不重复 fetch；连续 3 次相同搜索词判定为空转并提示模型换方向。

      **工具层瘦身**：
      - web_search 只返回标题、摘要、URL，不返回原始 HTML；
      - fetch_page 先做正文抽取（去导航、广告），超过 4000 字符时截断并在末尾写明「内容已截断，共 N 字」；更好的做法是用一个便宜模型针对当前问题先做摘要再返回。

      **上下文管理**：
      - 每轮检查累计长度，超过阈值时把早期步骤压缩成「已确认事实 + 来源列表」；
      - 网页全文存到缓存，只把摘要和引用 ID 放进上下文，需要时再读取。

      **兜底**：触发任何上限时，不抛异常，而是让模型基于已收集的信息生成「部分结论 + 未完成事项」，并在日志中记录触发原因。
    followup:
      question: 为什么不能只靠「最大步数」一个条件？
      key_points: [单步可能很慢需要超时, 单步可能很贵需要 Token 预算, 空转在步数内也会浪费需要重复检测]
      reference: 单步可能因为外部网页很慢而耗时很久，需要整体超时；单步也可能返回巨大内容导致 Token 激增，需要预算上限；模型在步数上限内反复做同样的事也浪费资源，需要重复检测。几个条件互相补充。
code_reading:
  id: d32-c1
  kp: [d32-k1, d32-k2, d32-k3]
  title: 手写文本格式 ReAct 循环
  scenario: |
    内部知识助手的早期版本：部署的模型不稳定支持原生工具调用，团队手写了文本格式的 ReAct 循环。模型按「Thought / Action: 工具名[参数] / Final Answer」输出，代码解析后执行 search_wiki 或 get_employee 工具。
  language: python
  code: |
    import logging
    import os
    import re
    from typing import Callable

    from openai import OpenAI

    logger = logging.getLogger("react")
    client = OpenAI()
    MODEL = os.environ["OPENAI_MODEL"]
    MAX_STEPS = 6
    ACTION_RE = re.compile(r"Action:\s*(\w+)\[(.*)\]")

    REACT_PROMPT = """你可以使用工具：search_wiki[关键词]、get_employee[工号]。
    每一步先输出 Thought: 你的思考，再输出 Action: 工具名[参数]。
    得到足够信息后输出 Final Answer: 最终答案。不要自己编写 Observation。"""

    def run_react(question: str, tools: dict[str, Callable[[str], str]]) -> str:
        scratchpad = f"Question: {question}\n"
        for step in range(1, MAX_STEPS + 1):
            resp = client.responses.create(model=MODEL, instructions=REACT_PROMPT, input=scratchpad)
            text = resp.output_text.split("Observation:")[0].strip()   # 丢弃模型自编的观察
            scratchpad += text + "\n"
            if "Final Answer:" in text:
                return text.split("Final Answer:")[-1].strip()

            name, arg = ACTION_RE.search(text).groups()
            logger.info("step=%d action=%s arg=%s", step, name, arg)
            if name not in tools:
                observation = f"未知工具 {name}，可用工具：{', '.join(tools)}"
            else:
                try:
                    observation = tools[name](arg)
                except Exception as exc:
                    logger.warning("tool %s failed: %s", name, exc)
                    observation = f"工具执行失败：{exc}"
            scratchpad += f"Observation: {observation}\n"

        logger.warning("react reached max steps, question=%s", question)
        return "抱歉，暂时无法回答这个问题，已转交人工处理。"
  walkthrough:
    function: |
      用纯文本协议实现 ReAct：模型每轮输出 Thought 和 Action，代码解析 Action、执行工具、把真实结果作为 Observation 拼回 scratchpad，直到模型输出 Final Answer 或达到最大步数。
    key_functions: |
      - `REACT_PROMPT`：约定输出格式，相当于文本版的「工具定义」。
      - `ACTION_RE`：从模型文本中提取工具名和参数。
      - `run_react`：主循环，维护 scratchpad（全部历史），负责截断模型输出、解析、执行工具、拼接观察、判断终止。
      - `tools`：调用方传入的「工具名 → 函数」字典，函数接收字符串参数并返回字符串。
    params: |
      `question` 是用户问题；`tools` 由调用方注入，便于测试时替换为 mock。模型看不到 Python 函数，只能从 REACT_PROMPT 的文字知道有哪些工具。
      每轮把整个 `scratchpad` 字符串作为 `input` 传给模型；工具参数是正则从文本里截出来的原始字符串，没有任何类型校验。
    data_flow: |
      ```mermaid
      stateDiagram-v2
        state "调用模型" as CallLLM
        state "截断到 Observation 之前" as Trim
        state "解析 Action" as Parse
        state "执行工具" as Exec
        state "拼接 Observation" as Append
        state "返回最终答案" as Done
        state "返回兜底话术" as Fallback
        [*] --> CallLLM
        CallLLM --> Trim
        Trim --> Done: 包含 Final Answer
        Trim --> Parse: 不包含 Final Answer
        Parse --> Exec
        Exec --> Append
        Append --> CallLLM: step 小于等于 MAX_STEPS
        Append --> Fallback: 步数用完
        Done --> [*]
        Fallback --> [*]
      ```
      scratchpad 只增不减：第 n 轮的输入包含之前 n-1 轮的全部 Thought、Action 和 Observation。
    failure_points: |
      - **解析失败直接崩溃**：模型漏写 Action、用了全角括号或加了引号时，`ACTION_RE.search(text)` 返回 None，`.groups()` 抛 AttributeError，整个请求失败。应把格式错误作为 Observation 回传让模型重试。
      - **Observation 不截断导致上下文膨胀**：search_wiki 可能返回整篇文档，原样拼进 scratchpad，几轮后 Token 暴涨、延迟变长，甚至超过上下文窗口导致 API 报错。
      - 正则 `(.*)` 是贪婪匹配，参数里出现 `]` 时会截错；同一段文本中有多个 Action 时只处理第一个。
      - 模型同时输出 Action 和 Final Answer 时，代码直接返回最终答案，忽略了它想调用的工具。
      - 做得好的地方：有 MAX_STEPS 和兜底话术；未知工具和工具异常会作为 Observation 回传，不会中断循环；截断了模型自编的 Observation。
    debugging: |
      - 打开 debug 日志，每轮记录 `len(scratchpad)`，观察输入长度增长曲线，判断是否膨胀。
      - 保存每轮模型原始输出 `resp.output_text`（截断前），解析失败时能看到模型到底输出了什么。
      - 单元测试：用固定字符串 mock 模型输出，覆盖「无 Action」「全角括号」「Action 和 Final Answer 同时出现」等情况。
      - 用一个返回 5 万字符的 mock 工具，复现上下文超限错误。
    change_request: |
      如果需求改成「支持原生工具调用的新模型上线，要迁移」：用 tools 参数声明 search_wiki 和 get_employee 的 JSON Schema，循环里改为读取 `function_call` 项、按 `call_id` 回传 `function_call_output`，删除 REACT_PROMPT 中的格式约定和正则解析。
      如果要求「单次观察最多 3000 字符」：在拼接 Observation 前截断，并追加「内容已截断」提示。
  questions:
    - id: d32-c1-q1
      kp: d32-k1
      type: code
      question: 假设用户问「工号 E1024 的员工所在部门负责人是谁」，请按执行顺序说明前两轮循环中 scratchpad 的变化，以及代码在每一步做了什么。
      key_points:
        - {text: "初始 scratchpad 只有 Question 一行，第一轮模型输出 Thought 和 Action get_employee[E1024]", dim: concept}
        - {text: "代码截断 Observation 之后的内容，把模型文本追加到 scratchpad，并用正则解析出工具名和参数", dim: principle}
        - {text: "执行 get_employee 后把真实结果以 Observation 行追加到 scratchpad", dim: principle}
        - {text: "第二轮把包含第一轮全部内容的 scratchpad 发给模型，模型据部门信息再次调用工具", dim: principle}
      reference: |
        **初始**：scratchpad = 「Question: 工号 E1024 的员工所在部门负责人是谁」。

        **第 1 轮**：
        1. 把 scratchpad 发给模型，模型输出「Thought: 先查这个员工的部门。Action: get_employee[E1024]」，可能还会继续编一段 Observation。
        2. 代码 `split("Observation:")[0]` 丢弃自编观察，把剩余文本追加到 scratchpad。
        3. 没有 Final Answer，正则解析得到 name=get_employee、arg=E1024，记录日志。
        4. 工具存在，执行得到「E1024 张三，部门：支付组」，追加「Observation: E1024 张三，部门：支付组」。

        **第 2 轮**：scratchpad 已包含问题、第 1 轮的 Thought、Action 和真实 Observation。模型据此输出「Thought: 需要查支付组负责人。Action: search_wiki[支付组 负责人]」，代码同样截断、解析、执行、追加。
        之后模型拿到负责人信息就会输出 Final Answer，代码提取答案返回。
    - id: d32-c1-q2
      kp: d32-k3
      type: code
      question: 这段代码有两个值得审查的问题：一个会让请求直接失败，一个会让成本和延迟随步数快速上升。请指出它们、说明触发条件，并给出修改方式。
      key_points:
        - {text: "指出 ACTION_RE.search 返回 None 时调用 groups 会抛 AttributeError，请求整体失败", dim: engineering}
        - {text: "说明触发条件：模型漏写 Action、使用全角括号或其他格式偏差", dim: principle}
        - {text: "指出 Observation 原样拼接且 scratchpad 只增不减，导致每轮输入越来越长", dim: principle}
        - {text: "给出修改：解析失败回传格式错误观察并计入步数；观察截断并标注，必要时摘要旧步骤", dim: engineering}
      reference: |
        **问题一：解析失败直接崩溃。** `ACTION_RE.search(text)` 在没匹配到时返回 None，紧接着 `.groups()` 抛 AttributeError。触发条件很常见：模型只写了 Thought 没写 Action、用了全角「［］」、参数外加了引号等。后果是整个请求 500，前面几步的工作全部浪费。
        修改：先判断 `m = ACTION_RE.search(text)`，为 None 时设置 `observation = "格式错误：请输出 Action: 工具名[参数] 或 Final Answer"`，追加到 scratchpad 后继续下一轮（这一轮计入步数，避免无限重试）。

        **问题二：上下文膨胀。** 工具结果原样拼进 scratchpad，而 scratchpad 每轮完整发送。search_wiki 返回整篇文档时，每轮新增上万字符，累计输入 Token 随步数近似平方增长，延迟和费用快速上升，最终可能超过上下文窗口导致 API 报错。
        修改：拼接前把 observation 截断到例如 3000 字符并注明「已截断」；工具层只返回必要字段；scratchpad 超过阈值时把早期步骤压缩成摘要。
interview:
  - id: d32-i1
    kp: d32-k1
    type: oral
    difficulty: 1
    question: 请讲一下 ReAct 的原理。
    key_points:
      - {text: "说明 ReAct 是推理和行动交替进行的范式，来自 2022 年 Yao 等人的论文", dim: concept}
      - {text: "解释 Thought、Action、Observation 三部分的含义和产生者", dim: concept}
      - {text: "强调 Observation 由运行时执行工具后填入真实结果", dim: principle}
      - {text: "说明现代原生 Tool Calling 是 ReAct 循环的结构化实现", dim: principle}
      - {text: "结合项目说明一个多步 ReAct 过程或步数上限设置", dim: project}
    reference: |
      ReAct 是 Reason + Act，来自 2022 年 Yao 等人的论文，核心是让模型**交替进行推理和行动**。

      每一步包含三部分：
      - **Thought**：模型的思考，分解问题、总结上一步结果、决定下一步；
      - **Action**：模型选择的工具和参数，只是意图；
      - **Observation**：运行时执行工具后的**真实结果**，回填到上下文。

      然后模型基于新的观察继续思考，直到给出最终答案。它比纯 CoT 好在推理能被外部真实信息纠正，比纯行动好在有规划和纠错能力。

      现在的生产系统一般用原生 Tool Calling 实现，模型返回结构化的工具调用，结果用 call_id 回传，但循环结构就是 ReAct。

      项目中我们的查询 Agent 先查员工、再查部门负责人，每步保留思考便于审计，最多 6 步，超出转人工。
    oral: |
      ReAct 就是 Reason 加 Act，让模型交替地推理和行动。每一步模型先写一个思考，比如「我需要先查这个员工的部门」，然后给出一个行动，也就是调用哪个工具、参数是什么。我们的代码执行工具，把真实结果作为观察填回上下文，模型再基于观察继续思考，直到给出答案。
      关键是观察必须是真实结果，不能让模型自己编。现在一般用原生 Function Calling 来实现，本质还是这个循环。
      我们项目里的查询 Agent 就是这样，先查员工再查负责人，限制最多 6 步，超出转人工。
  - id: d32-i2
    kp: d32-k2
    type: oral
    difficulty: 2
    question: 早期用 Prompt 让模型输出「Thought / Action」文本的 ReAct，和现在用原生 Function Calling 的 Agent 相比，有什么区别？为什么现在不推荐文本方式？
    key_points:
      - {text: "说明文本方式依赖 Prompt 约定和正则解析，原生方式由 API 返回结构化调用", dim: concept}
      - {text: "指出文本方式的问题：格式不稳定、参数难解析、模型可能伪造 Observation、难以并行", dim: principle}
      - {text: "说明原生方式参数受 JSON Schema 约束、用 call_id 配对结果、支持并行调用", dim: principle}
      - {text: "提到推理模型需要回传 reasoning 项等新约束，或旧版 LangChain 文本 Agent 已属旧写法", dim: engineering}
      - {text: "结合项目说明迁移前后解析失败率等指标的变化", dim: project}
    reference: |
      **文本方式**：在 System Prompt 里约定格式，模型输出一段文本，代码截断到 Action、用正则解析出工具名和参数，再把结果拼成「Observation: …」文本放回去。
      **问题**：格式靠模型自觉，经常出现漏写、全角符号、多余引号导致解析失败；参数是自由文本，复杂参数没法表达；如果不截断，模型会自己续写 Observation，伪造结果；一次只能一个动作。

      **原生 Function Calling**：请求中声明工具的 JSON Schema，模型返回结构化的 function_call 项，带 name、JSON 参数和 call_id；执行后用 call_id 回传结果。参数受 Schema 约束，不存在解析问题；可以一次返回多个调用并行执行；协议上就区分了「调用工具」和「最终回答」。

      **其他变化**：推理模型内部会思考，不需要 Prompt 要求写 Thought，但 OpenAI 要求带工具调用的 reasoning 项要一起回传。LangChain 旧的 initialize_agent / AgentExecutor 文本 Agent 在 1.x 已移到 langchain-classic，属于旧写法，新项目用 create_agent。

      我接手的老项目迁移后，解析失败率从约 8% 降到几乎为零。
    oral: |
      文本方式是在 Prompt 里约定格式，让模型输出 Thought 和 Action 文本，代码用正则解析。问题很多：格式不稳定会解析失败，参数复杂就没法表达，不截断的话模型还会自己编 Observation，而且一次只能一个动作。
      原生 Function Calling 是 API 直接返回结构化的工具调用，参数受 JSON Schema 约束，结果用 call_id 回传，还支持并行。现在推理模型自己会思考，不需要 Prompt 让它写 Thought，但要注意把 reasoning 项一起回传。
      我接手过一个用旧版 initialize_agent 的项目，大约 8% 请求解析失败，迁移到原生工具调用后基本消失了。
  - id: d32-i3
    kp: d32-k3
    type: oral
    difficulty: 3
    question: 你的 Agent 上线后，单次会话 Token 消耗和延迟都远超预期。你会怎么定位和优化？
    key_points:
      - {text: "解释 ReAct 每轮重发全部历史，累计输入 Token 随步数近似平方增长", dim: principle}
      - {text: "通过 trace 统计每步输入长度、工具结果长度、步数分布定位问题", dim: engineering}
      - {text: "在工具层只返回必要字段、截断超长结果并标注", dim: engineering}
      - {text: "摘要或裁剪旧步骤，大结果外置存储只回传引用", dim: engineering}
      - {text: "加最大步数、预算和重复检测，并用评估集确认优化不降低成功率", dim: project}
    reference: |
      **先理解成因**：ReAct 每轮都要把系统提示、工具定义和之前所有步骤重发给模型。每步新增 k 个 Token，n 步累计输入约 k×n²/2，步数和单步观察长度都会被放大。

      **定位**：看 trace，统计每步输入 Token、每个工具返回长度、步数分布、重复调用比例。通常会发现两类问题：某个工具返回了大段原始数据；或者模型在某些问题上空转。

      **优化**：
      1. **工具层瘦身**：只返回模型需要的字段，日志只给匹配数和前 N 行，网页先抽正文；
      2. **截断并标注**：超过阈值截断，告诉模型「已截断，共 N 条，可翻页」；
      3. **历史压缩**：超过阈值时把早期步骤摘要为「已确认事实」；大结果存缓存，只放引用 ID；
      4. **控制循环**：最大步数、Token 预算、相同调用重复检测；
      5. **模型分工**：摘要等辅助步骤用便宜模型。

      每项改动都用评估集验证，确保成功率不下降。日志排查 Agent 中，我们把日志工具改为聚合返回后，平均 Token 从约 6 万降到 1.5 万。
    oral: |
      我会先从 ReAct 的成本结构看：每一轮都要把全部历史重发，所以累计 Token 和步数近似平方关系，单步观察越长放大得越厉害。
      定位上我看 trace，统计每一步的输入长度、每个工具返回多长、步数分布。通常是某个工具返回大量原始数据，或者模型在空转。
      优化分三层：工具层只返回必要字段并截断标注；上下文层把旧步骤摘要、大结果外置；循环层加最大步数、预算和重复检测。改完用评估集确认成功率没降。
      我们日志排查 Agent 把日志工具改成聚合返回后，平均 Token 从 6 万左右降到 1.5 万。
  - id: d32-i4
    kp: d32-k4
    type: design
    difficulty: 4
    question: 如果让你从零设计一个生产级 ReAct 运行时（不依赖框架），你会包含哪些模块？ReAct 在长任务上有什么局限，你会怎么补？
    key_points:
      - {text: "列出核心模块：上下文组装、模型调用、工具调用解析、工具执行器、状态存储、终止控制", dim: concept}
      - {text: "工具执行器负责参数校验、超时、异常转为观察回传、结果截断", dim: engineering}
      - {text: "终止控制包含最大步数、超时、预算、重复检测和兜底输出", dim: engineering}
      - {text: "可观测性：每步 trace 记录输入长度、工具参数、结果、耗时、成本", dim: engineering}
      - {text: "指出 ReAct 走一步看一步，长任务易遗忘目标，可用 Plan-and-Execute 或待办清单工具补规划", dim: principle}
      - {text: "结合项目说明选择依据并用评估集验证变体收益", dim: project}
    reference: |
      **模块设计**：
      1. **上下文组装器**：系统提示 + 工具定义 + 历史消息；负责历史裁剪和摘要。
      2. **模型调用层**：超时、重试、限流（Day 20），记录 Token 用量。
      3. **调用解析**：读取原生 function_call 项，校验工具名存在、参数符合 Schema。
      4. **工具执行器**：单工具超时、异常捕获并转成可读的错误观察回传、结果截断；写操作需要确认（Day 33 详讲）。
      5. **状态存储**：消息历史和中间变量，支持按会话恢复（Day 36 的 checkpoint 思想）。
      6. **终止控制**：最终答案、最大步数、整体超时、Token 预算、重复调用检测，超限时生成部分结论或转人工。
      7. **可观测性**：每步 trace（输入长度、模型输出、工具参数和结果摘要、耗时、成本），串成会话链路。

      **ReAct 的局限**：走一步看一步，长任务容易忘记整体目标、在局部反复试错；每步都调用大模型成本高；失败后不会总结经验。

      **补充方式**：
      - **Plan-and-Execute**：先生成步骤计划，再逐步执行，偏离时重新规划；
      - **待办清单工具**：让模型自己维护计划，每步更新状态；
      - **反思（Reflexion）**：失败后总结原因写入记忆，下次参考。

      选择上，普通查询类 Agent 用 ReAct 足够；调研报告这类长任务我用过 Plan-and-Execute，覆盖度明显提升。每种变体都要在评估集上证明收益才上线。
    oral: |
      如果从零做，我会拆成七个模块：上下文组装、模型调用、调用解析、工具执行器、状态存储、终止控制和可观测性。其中工具执行器负责参数校验、超时、把异常转成观察回传、截断结果；终止控制包括最大步数、超时、预算和重复检测，超限给部分结论或转人工；每一步都记 trace。
      ReAct 的局限是走一步看一步，长任务容易忘目标、反复试错。我会用先规划后执行，或者给 Agent 一个待办清单工具让它维护计划。
      我做竞品调研 Agent 时就从纯 ReAct 改成先规划再执行，报告覆盖度提升明显，当然这是用评估集验证过才上线的。
