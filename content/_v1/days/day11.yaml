day: 11
phase: 2
title: 大语言模型基础
goals:
  - 能用「下一个 Token 预测 + 自回归」讲清 LLM 从收到问题到吐出完整回答的过程
  - 能说清预训练、指令微调、偏好对齐（RLHF 等）分别给模型带来了什么，以及它们和应用开发的关系
  - 能分析幻觉、知识截止的成因，并给出至少 3 种应用层的应对手段
  - 能区分「推理（Inference，一次模型调用）」与「推理模型（Reasoning Model）」，并说清后者对成本和延迟的影响
knowledge_points:
  - id: d11-k1
    name: LLM 的本质：下一个 Token 预测与自回归生成
    level: P0
    summary: LLM 每一步只做一件事：根据前面所有 Token 预测下一个 Token，再把它接回去继续预测
    why: |
      你之前用 Cursor 写代码时看到的「逐字流出」、偶尔前后矛盾、同一问题两次答案不一样，**全部源自这一个机制**。
      不理解它，你会把模型当成「查数据库」或「执行函数」，在设计系统时对它抱有错误预期：以为它会**查证**、会**回头修改**、会**保证一致**。
      面试中「LLM 是怎么生成文本的」几乎是必问开场题。
    problem: |
      它解决的是「如何用一个统一的方法处理几乎所有文本任务」：翻译、摘要、问答、写代码，本质都被改写成「给定前文，续写后文」。
      对应用开发者来说，理解它能回答这些实际问题：**为什么输出是流式的**、为什么输出越长越慢越贵、为什么模型会一本正经地胡说、为什么不能指望它自己发现前面写错了。
    principle: |
      **一、模型在做什么：给下一个 Token 打分**

      - 输入文本先被切成 **Token**（词片段，Day 13 详讲），每个 Token 是一个整数 ID。
      - 模型（一个巨大的神经网络，Day 12 讲内部结构）读入全部 Token，输出一个**概率分布**：词表里每个 Token 作为「下一个」的可能性。
      - 例如前文是「北京是中国的」，模型可能给出：「首都」0.92、「城市」0.03、「一个」0.02……
      - **模型本身只负责打分**，从分布里挑哪个 Token 由「采样策略」决定（贪心取最大、按概率随机抽，Temperature/Top-P 见 Day 16）。

      **二、自回归：把预测结果接回输入，循环**

      「自回归（autoregressive）」的意思是：**每一步的输出会成为下一步的输入**。

      ```mermaid
      flowchart LR
        A["输入 Token 序列"] --> B["模型前向计算"]
        B --> C["下一个 Token 的概率分布"]
        C --> D["采样选出 1 个 Token"]
        D --> E{"是结束符 EOS 或达到上限"}
        E -->|"否"| F["把新 Token 追加到序列末尾"]
        F --> B
        E -->|"是"| G["返回完整回答"]
      ```

      所以生成 300 个 Token 的回答，模型要**循环约 300 次**。这直接带来几个工程后果：

      - **输出是流式的**：每算出一个 Token 就可以推给前端，这就是 SSE 流式输出的基础（Day 17、Day 43）。
      - **输出越长越慢**：生成阶段是串行的，第 N 个 Token 必须等第 N-1 个算完；输出 Token 通常也比输入 Token 贵（Day 13）。
      - **不会回头改**：已经输出的 Token 就固定了，后面只能「将错就错」或另起一句纠正。所以让模型「先给结论再解释」时，如果结论错了，后面的解释往往会为错误结论找理由。
      - **每一步都可能有随机性**：采样带来不确定性，同一个问题两次回答不同是正常现象，不是 Bug。

      **三、为什么「预测下一个词」能产生看似智能的行为**

      要在海量文本上把「下一个词」预测准，模型被迫学会语法、常识、事实关联、代码结构甚至一定的推理模式——因为这些都能帮它降低预测误差。
      但要记住：**它学到的是「什么样的续写最像训练数据」，而不是「什么是真的」**。这句话是理解幻觉（d11-k3）的钥匙。

      **四、对话也是续写**

      Chat 接口里的 system / user / assistant 消息，最终会被拼成一条带特殊分隔符的长序列，模型做的仍然是「续写 assistant 的下一段」。
      这意味着：**多轮对话的「记忆」完全来自你每次请求时重新发送的历史消息**，模型本身是无状态的（Day 13 讲上下文窗口如何限制这件事）。

      **不这样理解会怎样**：你会写出「让模型自己查一下数据库再回答」的需求（它没有这个能力，除非你给它工具，Day 18）；会以为模型「记得」上一次会话；会对输出长度和延迟的关系毫无概念，导致接口超时设置错误。
    scenarios: |
      - **流式输出接口设计**：知道 Token 是逐个生成的，才会在客服、写作助手里用 SSE 把内容边生成边推给前端，首字延迟从几秒降到几百毫秒。
      - **控制输出长度降成本**：摘要、分类这类任务明确要求「只输出标签」或限制长度，因为输出 Token 是串行生成且单价更高。
      - **多轮对话服务**：后端必须自己保存会话历史并在每次请求时带上，否则模型「失忆」。
      - **排查「前后矛盾」**：长回答中后半段与前半段冲突时，知道它不会回头修改，就会改用「先列要点再展开」或分步调用。
    pitfalls: |
      - **误区：模型会先想好整段答案再输出。** 普通模型是一个 Token 一个 Token 生成的，没有「整段草稿」；推理模型会先生成隐藏的推理 Token，但本质仍是自回归。
      - **误区：模型有记忆。** 模型参数在调用时不变，「记住上文」只是因为你把上文又发了一遍。
      - **误区：同一输入必定同一输出。** 采样有随机性；即使 Temperature 设得很低，服务端实现也不保证逐字一致。
      - **混淆：Token 不等于字或词。** 一个汉字可能是 1 个或多个 Token，英文单词也可能被拆开（Day 13）。
    interview_asks:
      - 大语言模型是怎么生成一段回答的？请讲清一次请求的完整过程。
      - 为什么 LLM 的输出可以流式返回？为什么输出越长越慢？
      - LLM 有记忆吗？多轮对话是怎么实现的？
    project_example: |
      在一个**合同条款问答助手**里，最初接口是「等模型生成完再一次性返回」，长回答要等 15 秒以上，前端经常超时。
      理解自回归后做了两件事：1）改为 SSE 流式返回，首个 Token 约 1 秒内到达前端；2）要求模型先输出「结论一句话 + 依据条款编号」，再按需展开，平均输出 Token 从约 900 降到约 350，延迟和费用都明显下降。
      同时后端用会话表保存历史消息，每轮请求只带最近若干轮 + 摘要，解决了「模型不记得上一轮」的投诉。
  - id: d11-k2
    name: 训练三阶段：预训练、指令微调、偏好对齐
    level: P1
    summary: 预训练给知识和语言能力，指令微调教它听指令，偏好对齐让它更有用、更安全
    why: |
      你不需要会训练模型，但需要知道**模型的能力和毛病分别来自哪个阶段**：知识从哪来、为什么会拒答、为什么会「讨好」用户、为什么知识有截止日期。
      这决定了你遇到问题时是去改 Prompt、做 RAG、换模型，还是考虑微调。
    problem: |
      一个只做过预训练的「基座模型」只会续写：你问「怎么请假？」它可能续写出一串类似的问题，而不是回答你。
      指令微调和偏好对齐解决的就是「从会续写到会对话、会按要求办事、会拒绝危险请求」。理解这条链路，才能解释为什么同一家厂商的模型会有不同版本、不同风格。
    principle: |
      **三个阶段（只讲到应用开发者需要的程度）**

      ```mermaid
      flowchart LR
        A["海量公开文本与代码"] --> B["预训练 Pretraining"]
        B --> C["基座模型 只会续写"]
        C --> D["指令微调 SFT"]
        D --> E["会按指令回答的模型"]
        E --> F["偏好对齐 RLHF 等"]
        F --> G["对话模型 更有用更安全"]
      ```

      **1. 预训练（Pretraining）**
      - 目标：在万亿级 Token 的文本上做 next-token prediction（d11-k1）。
      - 带来：语言能力、世界知识、代码能力。**模型的「知识」基本都在这一步固化进参数**。
      - 副作用：数据有截止时间 → **知识截止（knowledge cutoff）**；数据里有错误和偏见 → 模型也会学到。
      - 成本极高，应用开发者基本不会碰。

      **2. 指令微调（SFT，Supervised Fine-Tuning）**
      - 用大量「指令 → 高质量回答」样例继续训练，让模型学会**理解任务并以回答者身份输出**。
      - 带来：听懂「用三句话总结」「输出 JSON」这类指令的能力。

      **3. 偏好对齐（RLHF / 其他偏好优化方法）**
      - 让人（或模型）对多个回答排序，训练模型更倾向输出被偏好的回答。
      - 带来：更有帮助、更礼貌、会拒绝有害请求。
      - 副作用：可能**过度讨好**（顺着用户的错误前提说）、**过度拒答**，以及在不确定时仍给出「看起来令人满意」的答案。

      **应用开发者的结论**
      - 知识缺失或过时 → 用 **RAG / 工具调用** 补（Day 21、Day 18），而不是指望模型「知道」。
      - 格式、风格不稳定 → 先改 Prompt 和结构化输出（Day 15、Day 19），微调是最后手段。
      - 推理模型在此基础上还额外用强化学习训练了「先思考再回答」的能力（d11-k4）。
    scenarios: |
      - **技术选型**：领导问「我们要不要自己微调一个模型」，你能说明知识注入优先用 RAG，微调更适合固定格式、风格、领域术语。
      - **解释模型行为**：用户反映模型「拒绝回答正常的医疗问题」，你能定位到对齐阶段的安全倾向，用 System Prompt 说明业务场景来缓解。
      - **评估开源模型**：区分 base 版本和 instruct/chat 版本，业务对话一定选后者。
    pitfalls: |
      - **误区：微调可以把公司文档「教」给模型。** 微调更擅长改变行为和格式；大量事实知识注入效果不稳定，且文档一更新就要重训，RAG 更合适。
      - **误区：RLHF 让模型变得更「正确」。** 它让模型更符合人类偏好，偏好不等于事实正确，甚至可能鼓励自信的错误回答。
      - **混淆：base 模型与 chat 模型。** 直接用 base 模型做问答，会出现续写问题而不是回答问题的现象。
    interview_asks:
      - 预训练、指令微调、RLHF 分别解决什么问题？
      - 你们的知识库问答为什么用 RAG 而不是微调？
    project_example: |
      在一个**售后工单分类**项目中，团队一开始想微调模型来「学会公司产品知识」。分析后发现：分类标签只有 12 个、格式固定，问题主要是输出格式不稳定；产品知识每月更新。
      最终方案：产品知识用 RAG 检索后注入，分类用结构化输出约束标签枚举，没有做微调，上线周期从预估的一个多月缩短到一周，准确率满足验收要求。
  - id: d11-k3
    name: 模型能力边界：幻觉、知识截止与不擅长的事
    level: P0
    summary: LLM 追求「像真的」而不是「是真的」；它不知道训练之后的事，也不擅长精确计算和自我核验
    why: |
      企业 AI 应用最大的事故来源就是**把模型输出当事实**：编造政策条款、编造接口参数、编造引用。
      作为 AI 应用开发工程师，你的核心价值之一就是**在系统层面兜住模型的能力边界**，而不是写一个漂亮的 Prompt 祈祷它不出错。面试官非常看重你是否有这种「不信任模型」的工程意识。
    problem: |
      它要解决的是：**什么问题可以直接交给模型，什么问题必须由检索、工具、规则或人来兜底**。
      不清楚边界，就会出现：问「今天汇率多少」模型给出一个看似合理的旧数字；问「我们公司年假几天」模型按常识编一个；让它算一笔账结果差了几位数；让它自查答案它说「没问题」。
    principle: |
      **一、幻觉（Hallucination）：自信地输出不真实的内容**

      成因可以从三个层面理解：

      1. **机制层面**：模型按「最可能的续写」生成（d11-k1）。当它没有可靠知识时，概率分布依然会给出一个「看起来通顺」的 Token，而不会自动停下来说不知道。
      2. **训练层面**：OpenAI 2025 年的研究指出，常见训练和评测方式以「答对率」为主，**猜一个答案比说『不知道』得分更高**，模型因此被鼓励在不确定时猜测（见 sources）。
      3. **数据层面**：训练数据本身有错误、冲突；低频事实（某个小公司的规章、某个冷门库的参数）在数据里出现太少，模型记不准却「记得大概样子」。

      常见形态：编造事实、编造引用和链接、编造 API 参数、在用户的错误前提上继续推理（「为什么 Python 4 取消了 GIL？」）。

      **二、知识截止（Knowledge Cutoff）**

      - 预训练数据有截止日期，之后发生的事模型不知道。不同模型、不同版本截止日期不同，**以官方模型页为准**（例如 OpenAI 官方模型页对每个模型列出 knowledge cutoff）。
      - 更隐蔽的问题：模型**不知道「现在」是什么时候**，会把截止前的「最新版本」当成现在的最新版本。这正是 AI 写代码时常用过时 API 的原因之一。
      - 企业私有数据（内部制度、客户数据）从来不在训练集中，对模型来说永远是「截止之后」。

      **三、其他典型短板**

      - **精确计算与计数**：多位数运算、数字符个数容易出错（Token 化也有影响，Day 13）。应交给代码执行或工具。
      - **自我核验不可靠**：让同一个模型检查自己的答案，常常只会「确认」。需要外部证据或规则校验。
      - **长上下文中漏信息**：上下文很长时，中间部分信息容易被忽略（Day 13 的 lost in the middle）。
      - **一致性**：采样随机性导致同问不同答，关键业务需要结构化输出 + 校验。

      **四、应用层的应对（系统兜底，而不是只靠 Prompt）**

      ```mermaid
      flowchart TD
        Q["用户问题"] --> R{"需要事实或实时数据吗"}
        R -->|"私有或最新知识"| S["RAG 检索证据 Day 21"]
        R -->|"实时数据或计算"| T["工具调用 Day 18"]
        R -->|"开放创作"| U["直接生成"]
        S --> V["要求基于证据回答并给引用"]
        T --> V
        V --> W["输出校验 格式与规则"]
        U --> W
        W --> X{"证据不足或校验失败"}
        X -->|"是"| Y["明确告知不确定或转人工"]
        X -->|"否"| Z["返回答案"]
      ```

      - **给证据**：RAG 注入原文，并要求「只依据给定资料回答，资料中没有就说明」。
      - **给工具**：日期、汇率、库存、计算交给 API 或代码。
      - **要引用**：输出必须带来源编号，前端可点击核对。
      - **做校验**：结构化输出 + Pydantic 校验（Day 19）、关键数字与数据库比对。
      - **留退路**：低置信度时转人工或拒答。

      **不这样做会怎样**：在 System Prompt 里写「不要编造」能减少一部分幻觉，但**不能消除**；没有证据和校验的系统，上线后一定会出现编造内容，而且是以非常自信的语气。
    scenarios: |
      - **企业制度问答**：必须用 RAG 提供制度原文，并在回答中引用条款编号；没有检索到就回复「未找到相关制度」。
      - **报表与数据分析助手**：数字一律来自 SQL 查询结果，模型只负责解释，不负责计算。
      - **AI 编程辅助**：生成的代码涉及第三方库时，要以官方文档核对 API 是否存在、是否过时。
      - **客服机器人**：涉及退款金额、订单状态的回答必须来自业务接口，不能来自模型自由生成。
    pitfalls: |
      - **误区：在 Prompt 里写「不知道就说不知道」就能解决幻觉。** 模型并不总能意识到自己不知道，这只能缓解。
      - **误区：模型说「我确定」就可信。** 语气自信程度与正确率没有可靠关系。
      - **误区：用更大的模型就没有幻觉了。** 更强的模型幻觉率通常更低，但不会为零；私有知识它根本不可能知道。
      - **误区：知识截止只影响新闻类问题。** 它同样影响技术问题：库版本、API 写法、价格、模型列表都会过时。
      - **混淆：幻觉与检索错误。** RAG 系统答错，可能是检索没找到（检索问题），也可能是找到了但模型没用好（生成问题），排查方法不同（Day 29）。
    interview_asks:
      - 什么是幻觉？为什么会产生？你在项目中怎么减少幻觉？
      - 模型的知识截止会给应用带来哪些问题？怎么解决？
      - 哪些任务你不会直接交给 LLM 做？为什么？
    project_example: |
      某**人事制度问答机器人**上线首周，员工问「试用期能请年假吗」，模型给出了一个通用劳动法式的回答，和公司制度不一致，引发投诉。
      整改：1）接入制度文档 RAG，回答必须引用制度编号和条款；2）检索相似度低于阈值时直接回复「未在现行制度中找到，请联系 HR」；3）对含天数、金额的回答做规则抽检，抽样结果进周报。
      整改后同类投诉基本消失，而且「找不到」的问题被记录下来，反过来推动 HR 补齐制度文档。
  - id: d11-k4
    name: 推理（Inference）与推理模型（Reasoning Model）
    level: P1
    summary: Inference 指一次模型调用；推理模型会先生成隐藏的推理 Token 再回答，更强但更慢更贵
    why: |
      中文里「推理」一词有两种含义，面试和技术文档里经常混用：**Inference（模型推理/调用）** 和 **Reasoning（思考能力）**。
      当前主流厂商都提供推理模型，它们的计费、超时、Prompt 写法都和普通模型不同，不理解就会出现「费用暴涨」「请求超时」「返回空内容」等问题。
    problem: |
      解决两个实际问题：
      1. **术语沟通**：别人说「推理成本」「推理服务」时，你要知道指的是模型调用（Inference）的算力和费用。
      2. **模型选型与配置**：什么任务值得用推理模型、如何设置思考强度和输出上限、如何估算它多出来的 Token 成本。
    principle: |
      **一、Inference：一次模型调用**

      - 训练（Training）是改参数，Inference 是**用固定参数做计算得到输出**。你调 API 的每一次请求都是一次 Inference。
      - 所谓「推理服务」「推理集群」「推理成本」都指这个，费用主要取决于输入 Token、输出 Token 数量（Day 13）。

      **二、Reasoning Model：先想再答**

      - 推理模型在输出可见答案前，会先生成一段**推理 Token（reasoning tokens）**，相当于内部草稿，用于拆解问题、尝试多种思路、自我检查。
      - 本质仍然是自回归生成（d11-k1），只是多了一段「不给你看全文的输出」。

      ```mermaid
      sequenceDiagram
        participant App as 应用后端
        participant M as 推理模型
        App->>M: 输入 Token 指令与问题
        M->>M: 生成推理 Token 不直接返回
        M->>M: 继续推理与自检
        M-->>App: 可见输出 Token
        M-->>App: usage 含 reasoning_tokens
      ```

      **三、对工程的影响（已核对 OpenAI 官方文档，2026-11）**

      - **计费**：推理 Token 不可见，但**按输出 Token 计费**，并且**占用上下文窗口**。
      - **输出上限**：`max_output_tokens` 限制的是全部生成 Token（含推理 Token）。上限设太小，可能推理还没结束就被截断，返回 `status` 为 `incomplete`，**甚至没有任何可见文本，却已经产生费用**。官方建议刚开始实验时为推理和输出预留至少 25,000 Token。
      - **思考强度**：OpenAI 用 `reasoning.effort` 调节（可选值随模型不同，如 none/low/medium/high 等）；Anthropic 新模型使用 adaptive thinking 并用 effort 参数调节。effort 越高越慢越贵。
      - **Prompt 写法**：推理模型更适合「给目标、约束、输出格式」，不需要再写「请一步一步思考」（Day 15 详讲）。

      **四、怎么选**

      - 简单分类、抽取、改写、闲聊：普通模型或低 effort，快且便宜。
      - 多步规划、复杂代码、需要权衡的分析、Agent 工具编排：推理模型或较高 effort。
      - 先用评估集比较效果和成本，再决定（Day 20、Day 48）。
    scenarios: |
      - **成本评估**：估算月费用时，必须从 usage 里统计 reasoning tokens，否则预算会严重低估。
      - **超时配置**：推理模型首个可见 Token 可能要等更久，网关和前端的超时要单独配置。
      - **分级路由**：简单问题走低成本模型，复杂问题再升级到推理模型或更高 effort。
    pitfalls: |
      - **误区：推理模型返回空 = 模型坏了。** 常见原因是输出上限太小，推理 Token 耗尽了额度，应检查 `status` 和 `incomplete_details`。
      - **误区：看不到推理过程就不收费。** 推理 Token 按输出计费。
      - **混淆：「推理成本」里的推理通常指 Inference，而不是 Reasoning。**
      - **误区：所有任务都用最强推理模型更稳。** 延迟和费用可能高出数倍，简单任务效果并不更好。
    interview_asks:
      - 推理模型和普通对话模型有什么区别？你会怎么选？
      - 用推理模型时，成本和超时上要注意什么？
    project_example: |
      在一个**代码评审助手**里，团队把所有请求都切到推理模型并保留原来的 `max_output_tokens=800`，结果大量请求返回空结果，且月账单翻倍。
      排查 usage 发现推理 Token 占了输出的大头。调整：1）按任务分级，格式检查类走普通模型，逻辑缺陷分析才走推理模型；2）推理模型的输出上限放宽并监控 incomplete 比例；3）在报表中单列 reasoning tokens。调整后空结果基本消失，费用回落到可接受范围。
    freshness: |
      核对于 2026-11：OpenAI Reasoning 文档说明推理 Token 不可见但占用上下文并按输出 Token 计费；`max_output_tokens` 包含推理 Token，超限时返回 status=incomplete、reason=max_output_tokens，建议实验初期预留至少 25,000 Token；`reasoning.effort` 可选值随模型而异。Anthropic 文档说明 Claude 4.6 及之后模型使用 adaptive thinking，部分最新模型思考始终开启，旧的 `budget_tokens` 写法已弃用（在 Claude 4.7 及以后会报错）。具体参数以各家最新文档为准。
    sources:
      - {title: "OpenAI Docs - Reasoning models", url: "https://developers.openai.com/api/docs/guides/reasoning"}
      - {title: "OpenAI Docs - Reasoning best practices", url: "https://developers.openai.com/api/docs/guides/reasoning-best-practices"}
      - {title: "Anthropic Docs - Prompting best practices（thinking 部分）", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}
quiz:
  - id: d11-q1
    kp: d11-k1
    type: single
    question: 模型针对一个问题生成了 200 个 Token 的回答。关于模型内部的计算过程，下列哪项描述最准确？
    options:
      - 模型先在内部生成完整的 200 个 Token，再一次性返回
      - 模型大约要循环 200 次，每次预测 1 个 Token 并把它接回输入
      - 模型循环次数等于输入的 Token 数，与输出长度无关
      - 模型按句子生成，每次输出一整句，所以循环次数等于句子数
    answer: [1]
    explain: |
      LLM 是自回归生成：每一步根据已有序列预测下一个 Token，再把新 Token 追加回去继续预测，所以生成 200 个 Token 大约需要 200 步。
      A 错在以为模型有「整段草稿」；C 混淆了输入处理和输出生成，输入可以一次性并行处理，但输出必须逐个生成；D 错在模型的最小生成单位是 Token 而不是句子。
  - id: d11-q2
    kp: d11-k3
    type: judge
    question: 只要在 System Prompt 中写明「如果不知道答案就回答不知道，禁止编造」，就可以从根本上消除模型幻觉。
    answer: false
    explain: |
      这类指令只能**缓解**幻觉。模型按「最可能的续写」生成，它并不总能意识到自己不知道；训练和评测方式也让模型倾向于猜测。
      根本手段是系统层面的兜底：提供检索证据（RAG）、使用工具获取实时数据、要求引用、做输出校验，以及证据不足时拒答或转人工。
  - id: d11-q3
    kp: d11-k2
    type: multi
    question: 关于大模型的训练阶段，以下哪些说法是正确的？
    options:
      - 模型的大部分世界知识来自预训练阶段
      - 指令微调让模型学会理解并执行「总结」「翻译」「输出 JSON」等指令
      - 偏好对齐（如 RLHF）保证了模型输出的事实一定正确
      - 想让模型掌握每月更新的公司产品知识，优先方案通常是 RAG 而不是微调
      - 只做过预训练的基座模型，最适合直接拿来做客服问答
    answer: [0, 1, 3]
    explain: |
      A、B、D 正确。C 错：偏好对齐让输出更符合人类偏好（有帮助、礼貌、安全），偏好不等于事实正确，甚至可能鼓励自信的错误回答。
      E 错：基座模型只会续写，常把问题续写成更多问题，业务对话应使用 instruct/chat 版本。D 中 RAG 适合频繁更新的知识，微调更适合改变格式和风格。
  - id: d11-q4
    kp: d11-k1
    type: short
    question: 用户反馈：「同一个问题我问了两次，模型给的答案措辞甚至结论都不一样；而且问了上一轮的内容它说不记得。」请用 LLM 的生成机制解释这两个现象。
    key_points:
      - {text: "指出模型每一步输出的是概率分布，通过采样选 Token，存在随机性", dim: principle}
      - {text: "指出自回归生成中早期 Token 的差异会影响后续所有内容，导致结论也可能不同", dim: principle}
      - {text: "指出模型本身无状态，多轮记忆依赖后端每次重新发送历史消息", dim: concept}
      - {text: "给出工程手段：保存并携带会话历史，关键场景用结构化输出和校验保证一致性", dim: engineering}
    reference: |
      第一个现象来自**采样随机性 + 自回归**。模型每一步只输出「下一个 Token 的概率分布」，具体选哪个由采样策略决定，带有随机性；而且生成是自回归的，第一句选了不同的词，后续所有 Token 都以它为前提，所以措辞乃至结论都可能不同。
      第二个现象是因为**模型本身没有记忆**，调用时参数不变，它「记得上文」只是因为请求里带上了历史消息。如果后端没有保存会话、没有在请求中带上上一轮内容，模型自然不知道。
      工程上：后端保存会话历史并按上下文窗口策略携带；对一致性要求高的场景，用结构化输出、低随机性参数并加校验，必要时把确定性逻辑放在代码里。
    followup:
      question: 如果业务要求「同样的问题必须给出完全相同的答案」，你会怎么设计？
      key_points:
        - "对高频标准问题做答案缓存或标准答案库"
        - "确定性逻辑放在代码和数据里，模型只做理解和表达"
      reference: 不能依赖模型保证逐字一致。可以对标准问题建立 FAQ 或缓存（以规范化后的问题为键），命中直接返回；模型负责意图识别和改写，金额、规则等确定内容由代码和数据给出。
  - id: d11-q5
    kp: d11-k3
    type: scenario
    question: |
      某电商客服机器人直接调用大模型回答用户问题（没有接入任何业务数据）。上线后出现两类投诉：
      1. 用户问「你们的退货期限是几天」，机器人回答「30 天无理由退货」，而公司实际政策是 7 天；
      2. 用户问「我的订单现在到哪了」，机器人编了一个物流状态。
      请分析原因，并给出整改方案。
    key_points:
      - {text: "指出公司政策是私有知识，不在训练数据中，模型按常见电商政策生成了看似合理的内容", dim: principle}
      - {text: "指出订单状态是实时数据，模型不可能知道，只能编造", dim: concept}
      - {text: "提出政策类问题接入 RAG 并要求引用原文，检索不到时明确告知", dim: engineering}
      - {text: "提出订单类问题通过工具调用查询业务接口，模型只负责组织语言", dim: engineering}
      - {text: "提出上线前用真实问题集测试，并对金额、天数等关键信息做校验或抽检", dim: project}
    reference: |
      **原因**：两类问题都超出了模型能力边界。退货政策是公司私有知识，从未出现在训练数据中，模型按「最像电商政策的续写」生成了 30 天，这是典型幻觉；订单物流是实时数据，模型根本没有获取途径，只能编造一个看起来合理的状态。
      **整改**：
      1. 政策类问题接入 RAG：把退换货制度切片入库，回答时注入原文，并要求「只依据资料回答、引用条款」；检索不到相关内容就回复「未找到相关政策，已为您转人工」。
      2. 订单类问题走工具调用：模型识别意图并提取订单号，后端调用订单/物流接口取真实数据，模型只负责把结果组织成自然语言。
      3. 系统兜底：对回答中的天数、金额等关键字段做规则校验；上线前用真实客服问题集回归测试；保留转人工入口。
    followup:
      question: 如果用户没有提供订单号，机器人应该怎么处理？
      key_points:
        - "不能让模型猜测订单号"
        - "应追问用户或根据登录态查询用户最近订单让其选择"
      reference: 缺少必要参数时不能让模型编造或猜测，应追问用户提供订单号，或在已登录情况下由后端查询该用户最近订单列表供用户选择，再调用物流接口。
  - id: d11-q6
    kp: d11-k4
    type: short
    question: 同事把一个分析任务从普通模型切换到推理模型，`max_output_tokens` 保持 500 不变。结果很多请求返回的文本为空，但账单上依然有输出 Token 费用。请解释原因并给出处理方式。
    key_points:
      - {text: "指出推理模型会先生成不可见的推理 Token，且推理 Token 按输出 Token 计费", dim: principle}
      - {text: "指出 max_output_tokens 限制包含推理 Token，额度可能在推理阶段就被耗尽", dim: principle}
      - {text: "提出检查响应 status 是否为 incomplete 及 incomplete_details 的原因", dim: engineering}
      - {text: "提出放宽输出上限或降低 effort，并按任务分级选择模型、监控推理 Token", dim: engineering}
    reference: |
      推理模型在输出可见答案前会生成推理 Token，这部分不返回给你，但**占用上下文并按输出 Token 计费**。`max_output_tokens` 限制的是全部生成 Token（包含推理 Token），设置为 500 时，模型可能还在推理阶段就把额度用完了，于是返回 `status=incomplete`、原因是 `max_output_tokens`，可见文本为空，但推理 Token 已经产生费用。
      处理：1）代码里检查 status 和 incomplete_details，不要把空文本当正常结果；2）放宽输出上限（官方建议实验初期预留至少 25,000 Token），或降低 reasoning effort；3）评估任务是否真的需要推理模型，简单任务回退到普通模型；4）在监控里单独统计 reasoning tokens 和 incomplete 比例。
  - id: d11-q7
    kp: d11-k4
    type: judge
    question: 技术文档中提到的「推理成本」「推理服务」，通常指的是模型调用（Inference）所需的算力和费用，而不专指推理模型的思考能力。
    answer: true
    explain: |
      Inference 指使用训练好的模型做计算得到输出，每次 API 调用都是一次 Inference，「推理成本」通常指这部分算力和 Token 费用。
      Reasoning（推理模型的思考能力）是另一个概念，中文都叫「推理」，所以阅读文档和面试表达时要根据上下文区分，必要时说英文原词避免歧义。
code_reading:
  id: d11-c1
  kp: [d11-k1, d11-k3, d11-k4]
  title: 一个「直接问模型」的 HR 助手
  scenario: 内部 HR 小程序的后端接口调用这个模块回答员工的制度问题（年假、报销、试用期等），由新人用 AI 生成后直接上线，现在需要你做代码审查。
  language: python
  code: |
    import logging
    import os
    from functools import lru_cache

    from openai import OpenAI

    logger = logging.getLogger(__name__)
    client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
    MODEL = os.environ.get("LLM_MODEL", "gpt-6-astra")  # 推理模型

    SYSTEM_PROMPT = "你是公司 HR 助手，回答员工关于公司制度的问题，回答要专业、简洁、肯定。"


    @lru_cache(maxsize=1024)
    def ask_hr_bot(question: str) -> str:
        """回答员工的制度类问题，返回纯文本答案。"""
        try:
            resp = client.responses.create(
                model=MODEL,
                instructions=SYSTEM_PROMPT,
                input=question,
                max_output_tokens=300,
            )
        except Exception:
            logger.exception("LLM 调用失败")
            return "系统繁忙，请稍后再试"

        usage = resp.usage
        logger.info("tokens in=%s out=%s", usage.input_tokens, usage.output_tokens)
        return resp.output_text.strip()


    def answer(question: str) -> dict:
        text = ask_hr_bot(question.strip())
        return {
            "question": question,
            "answer": text,
            "confident": "不确定" not in text,
        }
  walkthrough:
    function: |
      对外暴露 `answer(question)`：把员工的问题交给大模型，返回答案文本和一个「是否有把握」的标记。内部用 `lru_cache` 缓存同一问题的答案，减少重复调用。
    key_functions: |
      - `ask_hr_bot`：组装 instructions（System Prompt）和用户问题，调用 OpenAI Responses API，记录 Token 用量，返回 `output_text`。
      - `answer`：清洗问题，调用 `ask_hr_bot`，用关键词「不确定」判断置信度，组装成字典返回给接口层。
    params: |
      - `question` 从接口层传入，`answer` 里先 `strip()` 再传给 `ask_hr_bot`；`lru_cache` 以这个字符串为缓存键。
      - `MODEL` 来自环境变量 `LLM_MODEL`，默认是推理模型；`SYSTEM_PROMPT` 以 `instructions` 参数传入；`max_output_tokens=300` 限制全部生成 Token。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant API as 接口层
        participant A as answer
        participant C as lru_cache
        participant M as LLM
        API->>A: question
        A->>C: ask_hr_bot 清洗后的问题
        alt 缓存命中
          C-->>A: 缓存的文本
        else 未命中
          C->>M: instructions 加 question
          M-->>C: output_text 与 usage
          C-->>A: 文本并写入缓存
        end
        A-->>API: question answer confident
      ```
    failure_points: |
      - **没有任何制度数据**：模型只能按常识编造公司制度，而 Prompt 还要求「肯定」，进一步放大幻觉。
      - **异常兜底被缓存**：调用失败时返回的「系统繁忙」也会被 `lru_cache` 记住，之后同一问题永远返回这句话，直到进程重启。
      - **推理模型输出上限过小**：300 Token 可能在推理阶段就耗尽，`output_text` 为空但没有检查 `status`。
      - **置信度判断无效**：模型不会可靠地输出「不确定」，关键词判断几乎总是 True。
      - 缓存没有过期：制度更新后旧答案仍被返回；`except Exception` 吞掉了所有错误类型，无法区分限流、超时和鉴权失败。
    debugging: |
      - 在日志中补充 `resp.status`、`resp.incomplete_details`、`usage.output_tokens_details.reasoning_tokens`，复现「空答案」。
      - 用 `ask_hr_bot.cache_info()` 查看缓存命中情况；临时断网或用错误 Key 复现一次失败，再恢复后调用同一问题，确认是否一直返回「系统繁忙」。
      - 准备 10 个有标准答案的制度问题，对比模型输出与制度原文，统计编造比例。
    change_request: |
      如果需求改成「必须依据公司制度回答并给出条款出处」：
      1. 在 `ask_hr_bot` 之前增加检索步骤，把相关制度片段放进 input，并修改 SYSTEM_PROMPT 为「只依据资料回答，资料中没有就说明」；
      2. 返回结构里增加 `sources` 字段；
      3. 去掉 `lru_cache` 或改为带过期时间且只缓存成功结果的缓存；
      4. 检查 `status`，incomplete 时重试或降级。
  questions:
    - id: d11-c1-q1
      kp: d11-k3
      type: code
      question: 员工问「试用期可以请年假吗？」，按执行顺序说明这段代码会如何产生答案，并指出这个答案为什么不可信、代码中哪两处设计放大了这个问题。
      key_points:
        - {text: "说明执行顺序：answer 清洗问题、查缓存、未命中时调用 Responses API、返回 output_text", dim: concept}
        - {text: "指出请求中没有任何公司制度资料，模型只能按通用知识生成，属于幻觉风险", dim: principle}
        - {text: "指出 System Prompt 要求回答「肯定」会让模型在不确定时也给出确定语气", dim: principle}
        - {text: "指出 confident 字段用关键词判断无效，会给前端错误的可信信号", dim: engineering}
      reference: |
        执行顺序：`answer` 对问题 `strip()` 后调用 `ask_hr_bot`；`lru_cache` 先按字符串查缓存，未命中则调用 `client.responses.create`，把 SYSTEM_PROMPT 作为 instructions、问题作为 input；拿到响应后记录 usage 并返回 `output_text`；`answer` 再用「不确定」关键词计算 confident 并返回字典。
        不可信的原因：请求里**没有任何公司制度内容**，模型不可能知道这家公司的规定，只能按训练数据中常见的劳动法或其他公司规定「续写」一个看似合理的答案，这就是幻觉。
        放大问题的设计：一是 SYSTEM_PROMPT 要求「专业、简洁、肯定」，鼓励模型在没有依据时也用确定语气；二是 `confident` 只看文本里有没有「不确定」，模型几乎不会主动这样写，结果绝大多数编造答案都被标成可信，前端可能据此展示「已核实」之类的信号。
    - id: d11-c1-q2
      kp: d11-k4
      type: code
      question: 上线后发现：部分问题返回空字符串；另外有一次 OpenAI 服务短暂故障后，某些问题即使服务恢复也一直返回「系统繁忙，请稍后再试」。请结合代码分别解释原因，并给出修改方案。
      key_points:
        - {text: "指出默认模型是推理模型，max_output_tokens=300 包含推理 Token，可能在推理阶段耗尽导致可见文本为空", dim: principle}
        - {text: "指出代码没有检查 resp.status 与 incomplete_details", dim: engineering}
        - {text: "指出 lru_cache 会缓存异常分支的返回值，故障期间的兜底文案被永久缓存", dim: engineering}
        - {text: "给出修改：放宽上限或降低 effort、检查 incomplete、失败时抛异常或不缓存、缓存加过期时间", dim: engineering}
      reference: |
        **空字符串**：默认模型是推理模型，它会先生成不可见的推理 Token。`max_output_tokens=300` 限制的是推理 Token 加可见输出的总和，复杂问题可能在推理阶段就把 300 用完，响应 `status` 为 `incomplete`、原因为 `max_output_tokens`，`output_text` 为空。代码没有检查状态，直接把空串当答案返回，而且这部分推理 Token 照样计费。
        **一直返回系统繁忙**：`lru_cache` 缓存的是函数返回值，不区分成功还是失败。故障期间 `except` 分支返回的兜底文案被当作正常结果缓存起来，之后同一问题直接命中缓存，不再调用模型，直到进程重启或缓存被挤出。
        **修改**：1）放宽输出上限或降低 reasoning effort，并检查 `resp.status`，incomplete 时记录日志并重试或降级；2）失败时抛出业务异常，由接口层返回兜底文案，而不是在被缓存的函数里返回；3）换成只缓存成功结果、带 TTL 的缓存（如 Redis，Day 41），制度更新时可主动失效；4）区分超时、限流、鉴权等异常类型。
    - id: d11-c1-q3
      kp: d11-k1
      type: code
      question: 产品经理希望前端能「边生成边显示」，并且要求员工追问「那转正后呢？」时机器人能理解上下文。按当前代码这两个需求都做不到，请说明原因，并指出要改哪些地方。
      key_points:
        - {text: "指出当前代码等待完整响应后一次性返回，没有利用逐 Token 生成的特性做流式输出", dim: principle}
        - {text: "指出每次请求只发送当前问题，模型无状态，因此无法理解追问", dim: principle}
        - {text: "提出改为流式调用并通过 SSE 推送给前端", dim: engineering}
        - {text: "提出后端保存会话历史并在请求中携带，同时缓存键不能只用当前问题", dim: engineering}
      reference: |
        **流式**：模型本身是逐 Token 生成的，但代码调用的是非流式接口，要等全部 Token 生成完才拿到 `output_text`，再整体返回给接口层，前端只能等。要改成流式调用（Responses API 支持流式事件），在接口层用 SSE 把增量文本推给前端（Day 17、Day 43）；同时 `lru_cache` 这种「返回完整字符串」的缓存方式也要调整。
        **上下文**：模型无状态，「记得上文」完全依赖请求里带上历史消息。现在每次只发送当前问题「那转正后呢？」，模型不知道「那」指的是年假，只能瞎猜。需要后端按会话 ID 保存历史消息，请求时把最近几轮一起放进 input。
        另外，引入上下文后**缓存键不能只是当前问题**，否则不同会话里相同的追问会命中同一个缓存，返回错误答案。
interview:
  - id: d11-i1
    kp: d11-k1
    type: oral
    difficulty: 1
    question: 什么是大语言模型？它是怎么一步步生成一段回答的？
    key_points:
      - {text: "说明 LLM 本质是基于海量文本训练的下一个 Token 预测模型", dim: concept}
      - {text: "讲清自回归循环：输出概率分布、采样、追加回输入、直到结束符或上限", dim: principle}
      - {text: "说出由此带来的特性：流式输出、输出越长越慢、存在随机性、不会回头修改", dim: principle}
      - {text: "结合项目说明这些特性如何影响接口设计，如 SSE 流式和控制输出长度", dim: project}
    reference: |
      大语言模型是在海量文本和代码上训练出来的神经网络，核心任务只有一个：**给定前面的 Token，预测下一个 Token 的概率分布**。
      生成过程是自回归的：输入先被切成 Token，模型算出下一个 Token 的分布，按采样策略选出一个，把它追加到序列末尾，再预测下一个，直到生成结束符或达到输出上限。
      这个机制带来几个工程上很重要的特性：一是输出天然可以流式返回；二是输出越长越慢，因为生成阶段是串行的；三是采样有随机性，同问不同答是正常的；四是已经输出的内容不会被回头修改；五是模型无状态，多轮对话靠每次重新发送历史。
      另外，它学到的是「什么续写最像训练数据」，而不是「什么是真的」，这也是幻觉的根源。
    oral: |
      我理解大语言模型本质上是一个「下一个 Token 预测器」。它在海量文本上训练，学会了给定前文后，下一个 Token 出现的概率。
      生成回答时是自回归的：先把输入切成 Token，模型算出下一个 Token 的分布，选一个接到末尾，再算下一个，一直循环到结束符或者达到长度上限。
      这个机制直接影响我做接口设计。比如我做合同问答助手时，就是因为它逐 Token 生成，我改成了 SSE 流式返回，首字延迟降到一秒左右；也因为输出串行生成、单价更高，我要求模型先给一句结论再展开，把平均输出长度砍了一半多。
      另外它是无状态的，多轮对话的历史由我们后端保存并在每次请求时带上。
  - id: d11-i2
    kp: d11-k2
    type: oral
    difficulty: 2
    question: 预训练、指令微调、RLHF 分别解决什么问题？作为应用开发者，你为什么要关心这些？
    key_points:
      - {text: "说明预训练提供语言能力和世界知识，并带来知识截止", dim: concept}
      - {text: "说明指令微调让模型从续写变为按指令回答", dim: concept}
      - {text: "说明偏好对齐让输出更有用更安全，但可能带来讨好或过度拒答，不保证事实正确", dim: principle}
      - {text: "结合工程选择：知识问题用 RAG，格式问题先用 Prompt 和结构化输出，微调作为最后手段", dim: engineering}
    reference: |
      预训练是在海量文本上做下一个 Token 预测，给模型带来语言能力、世界知识和代码能力，模型的知识基本固化在这一步，因此有知识截止日期，也会继承数据中的错误。
      指令微调用「指令到回答」的样例继续训练，让模型从「只会续写」变成「能理解任务并以回答者身份输出」，比如听懂「输出 JSON」「三句话总结」。
      偏好对齐（如 RLHF）通过人类或模型的偏好排序，让模型输出更有帮助、更礼貌、会拒绝有害请求；副作用是可能讨好用户、顺着错误前提回答，或者过度拒答，而且偏好不等于事实正确。
      应用开发者关心这些，是因为它决定了**遇到问题时往哪个方向解决**：知识缺失或过时用 RAG 和工具；格式和风格问题先改 Prompt、用结构化输出；只有在格式、风格、领域术语需要稳定改变且 Prompt 无法解决时，才考虑微调；业务对话不要误用 base 模型。
    oral: |
      我一般分三层讲。预训练给了模型语言能力和知识，但也决定了它有知识截止日期；指令微调让它从「只会续写」变成「能听懂指令做事」；偏好对齐让它更有用、更安全，但也可能讨好用户或者过度拒答，而且它并不保证事实正确。
      我关心这些，是因为它决定了我解决问题的方向。之前做售后工单分类，团队想微调让模型学产品知识，我分析后发现真正的问题是输出格式不稳定，而产品知识每月都更新，所以最后用 RAG 注入知识、用结构化输出约束标签，一周就上线了，没有走微调。
  - id: d11-i3
    kp: d11-k3
    type: oral
    difficulty: 2
    question: 什么是幻觉？它为什么会产生？你在项目里是怎么控制幻觉的？
    key_points:
      - {text: "定义：模型以自信语气输出不真实或无依据的内容", dim: concept}
      - {text: "成因：按最可能续写生成、训练评测鼓励猜测、低频或私有知识缺失", dim: principle}
      - {text: "说明 Prompt 约束只能缓解，必须系统兜底", dim: principle}
      - {text: "给出系统手段：RAG 证据、工具获取实时数据、引用、输出校验、拒答或转人工", dim: engineering}
      - {text: "结合项目说明效果或指标，例如投诉下降、未命中问题记录", dim: project}
    reference: |
      幻觉是指模型以很自信的语气输出不真实或没有依据的内容，比如编造政策条款、API 参数、引用链接。
      成因有三层：机制上，模型按「最可能的续写」生成，没有可靠知识时也会给出通顺但错误的内容；训练和评测上，以答对率为主的评测让「猜一个」比「说不知道」得分更高，模型被鼓励猜测；数据上，私有知识和低频事实在训练数据中缺失或很少。
      控制幻觉不能只靠 Prompt 里写「不要编造」，那只能缓解。我的做法是系统兜底：私有知识用 RAG 提供原文并要求引用；实时数据和计算交给工具；输出用结构化格式加规则校验；检索不到或校验失败时明确告知或转人工；上线后通过抽检和评估集持续监控。
    oral: |
      幻觉就是模型一本正经地说错话。它产生的根本原因是模型追求「像真的」而不是「是真的」，没有知识时也会给出最通顺的续写；而且训练评测更奖励猜答案，私有知识它也根本没见过。
      所以我不靠 Prompt 解决，而是靠系统兜底。之前做人事制度问答，上线首周出现过编造年假规则的投诉。我们接入了制度 RAG，要求每条回答引用条款编号，检索相似度低于阈值就直接说「未找到，请联系 HR」，还对含天数和金额的回答做抽检。之后同类投诉基本消失，「找不到」的问题还反过来推动 HR 补文档。
  - id: d11-i4
    kp: d11-k4
    type: oral
    difficulty: 3
    question: 推理模型和普通对话模型有什么区别？在生产环境中使用推理模型，成本、延迟和稳定性上要注意什么？
    key_points:
      - {text: "说明推理模型会先生成不可见的推理 Token，再输出可见答案", dim: concept}
      - {text: "说明推理 Token 按输出计费并占用上下文，max_output_tokens 包含推理 Token", dim: principle}
      - {text: "提出检查 incomplete 状态、单独监控 reasoning tokens、为推理模型单独配置超时", dim: engineering}
      - {text: "提出按任务复杂度分级路由并用评估集比较效果与成本", dim: engineering}
      - {text: "区分 Inference 与 Reasoning 两种「推理」含义", dim: concept}
    reference: |
      先区分概念：Inference 是一次模型调用；推理模型（Reasoning Model）是指在回答前会先生成一段推理 Token 来拆解问题、尝试思路、自我检查的模型，本质仍是自回归生成。
      生产中要注意：
      1. **成本**：推理 Token 不可见，但按输出 Token 计费，复杂问题可能产生大量推理 Token，预算必须从 usage 中统计 reasoning tokens。
      2. **输出上限**：`max_output_tokens` 包含推理 Token，设置过小会导致 `status=incomplete`、没有可见输出却已计费；需要检查状态并预留足够额度（OpenAI 建议实验初期预留至少 25,000）。
      3. **延迟**：首个可见 Token 更晚，网关、前端超时要单独配置，必要时给用户展示「正在思考」。
      4. **选型**：通过 effort 参数调节思考强度；按任务分级路由，简单任务走普通模型或低 effort，复杂规划和代码分析才用高 effort；用评估集比较效果和成本再决定。
    oral: |
      推理模型和普通模型最大的区别是它在回答前会先生成一段我们看不到的推理 Token，相当于先打草稿再回答，所以复杂任务效果更好，但更慢更贵。
      生产上我主要盯三件事。第一是成本，推理 Token 按输出计费，我会在监控里单列 reasoning tokens。第二是输出上限，我们做代码评审助手时就踩过坑，沿用了 800 的上限，结果大量请求 incomplete、返回空内容还照样收费，后来放宽上限并监控 incomplete 比例。第三是延迟，推理模型的超时要单独配。
      选型上我按任务分级，格式检查走普通模型，逻辑分析才走推理模型，用评估集对比后再定。
  - id: d11-i5
    kp: d11-k3
    type: design
    difficulty: 4
    question: 你要为一家 5000 人的公司设计内部「制度与流程问答助手」。请从模型能力边界出发，说明架构上如何处理幻觉、知识截止、私有数据和实时数据这几类问题，以及如何证明系统是可信的。
    key_points:
      - {text: "按问题类型分流：制度类走 RAG、实时业务数据走工具、开放问题直接生成", dim: engineering}
      - {text: "生成阶段要求基于证据回答并给出引用，证据不足时拒答或转人工", dim: principle}
      - {text: "数据更新机制：文档版本管理、失效文档下线、缓存失效", dim: engineering}
      - {text: "权限：检索和工具调用按员工身份过滤，防止越权看到其他部门数据", dim: engineering}
      - {text: "可信度证明：评估集、引用可点击核对、抽检与反馈闭环、关键指标监控", dim: project}
    reference: |
      **核心思路：模型只负责理解和表达，事实来自系统。**
      1. **意图分流**：先识别问题类型。制度、流程类走 RAG；请假余额、报销进度等实时个人数据走工具调用（调用 HR 系统接口）；闲聊或写作类直接生成。
      2. **RAG 生成约束**：注入检索到的制度原文和元数据（制度名、版本、生效日期），要求「只依据资料回答并标注引用」，相似度低于阈值或资料不足时明确告知并给出 HR 联系方式。
      3. **知识截止与更新**：模型自身知识不作为事实来源；制度文档有版本和生效日期，新版本入库时旧版本下线或标记失效，相关缓存失效。
      4. **私有数据与权限**：检索和工具调用都带上员工身份，按部门、职级过滤，不能把权限控制交给 Prompt。
      5. **输出校验**：天数、金额等关键字段与资料比对，结构化输出加校验，失败则降级。
      6. **证明可信**：建设覆盖主要制度的评估集，上线前回归测试；前端展示引用并可跳转原文；收集「有帮助/没帮助」反馈；监控拒答率、引用率、抽检错误率，未命中问题回流给 HR 补文档。
    oral: |
      我的原则是「模型只负责理解和表达，事实全部来自系统」。
      架构上我先做意图分流：制度类问题走 RAG，请假余额这种个人实时数据走工具调用 HR 接口，闲聊才直接生成。RAG 部分要求只依据检索到的制度原文回答、必须标注引用，相似度不够就直说没找到并给 HR 联系方式。
      知识截止和更新靠文档版本管理解决，新制度入库时旧版本下线、缓存失效。权限一定在检索和工具层按员工身份过滤，不能靠 Prompt。
      怎么证明可信？我会准备覆盖主要制度的评估集做回归，前端展示可点击的引用，并监控拒答率、抽检错误率。之前人事问答项目就是靠这套机制把编造类投诉基本清零的。
