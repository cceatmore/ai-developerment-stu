day: 50
phase: 5
title: 综合模拟面试
goals:
  - 能用「结论先行 + STAR + 技术取舍」的结构组织任何一道面试回答
  - 能用「背景-架构-难点-数据-反思」五段式在 3 分钟内讲清一个 AI 项目，并扛住追问
  - 能把 50 天的知识串成一条请求链路，回答横跨 Python 后端、LLM、RAG、Agent、MCP、工程化的综合题
  - 能诚实地处理不会的问题，完成一份个人薄弱项复盘与目标岗位匹配评估
knowledge_points:
  - id: d50-k1
    name: 面试表达方法：结论先行、STAR 与技术取舍
    level: P0
    summary: 先给结论，再给理由和例子；讲技术选择时一定说出「代价」和「什么情况下我会换方案」
    why: |
      很多候选人技术够用，却在面试中「讲不清楚」：从背景绕起、三分钟还没到重点，面试官只能打断。
      面试的本质是在有限时间内让对方相信你能胜任，**表达结构直接决定了你的知识能被听到多少**。
      对有阅读障碍、习惯用 AI 写代码的你来说，固定的回答模板能显著降低临场组织语言的负担。
    problem: |
      解决「知道但说不清、说了但没重点、被追问就乱」的问题。
      没有结构时常见表现：先讲历史再讲结论；只讲做了什么不讲为什么；技术选择只说优点不说代价，被面试官一句「那为什么不用 X」问住。
    principle: |
      **一、结论先行（金字塔结构）**

      第一句话直接回答问题，然后给 2~3 个理由或要点，最后用一个例子落地。

      ```mermaid
      flowchart TB
        A["第一句 结论 一句话回答问题"] --> B["要点1 原理或原因"]
        A --> C["要点2 工程做法"]
        A --> D["要点3 代价或边界"]
        B --> E["一个项目例子 带数字"]
        C --> E
        D --> E
      ```

      对比：
      - ❌「RAG 这个东西呢，最早是 2020 年提出的，然后大模型有知识截止……」
      - ✅「RAG 是先检索再生成，解决模型不知道私有和最新知识的问题。它分离线入库和在线问答两段……我在知识库项目里……」

      **二、STAR：讲经历类问题**

      | 字母 | 含义 | 要点 |
      |---|---|---|
      | S 情境 | 什么项目、什么背景 | 一两句话，别展开 |
      | T 任务 | 你负责什么、目标是什么 | 说清「我」的职责 |
      | A 行动 | 你具体做了什么、为什么这么做 | 占一半以上篇幅，讲判断过程 |
      | R 结果 | 带数字的结果 + 反思 | 没有数字就说可观察的变化 |

      适用问题：「讲一个你解决过的难题」「你和同事意见不一致时怎么办」「你做过最有成就感的事」。

      **三、技术取舍的讲法：选择 + 理由 + 代价 + 切换条件**

      模板：「我选了 **A**，因为在我们的场景下 **（约束条件）**，A 的 **（优势）** 更重要；代价是 **（缺点）**，我们用 **（缓解措施）** 弥补；如果 **（条件变化）**，我会换成 **B**。」

      例：「向量库我选了 pgvector 而不是专用向量数据库，因为我们只有两百万向量，且需要权限过滤和文档删除的事务一致性；代价是超大规模时性能不如专用库，我们用 HNSW 参数调优和分区缓解；如果向量涨到数亿或检索 QPS 上千，我会评估迁移。」

      面试官问「为什么不用 X」时，**不要否定 X**，而是说明在你的约束下的权衡——这正是高级工程师和初级工程师的区别。

      **四、被追问时**

      - 听清问题，必要时复述确认：「您是想问检索阶段的权限，还是生成阶段的安全？」
      - 回答不超过两分钟，留出让面试官追问的空间；追问说明他感兴趣，是好事。
      - 不确定时说出推理过程，而不是沉默或编造（见 d50-k4）。
    scenarios: |
      - 回答技术概念题：「什么是 Function Calling」——一句定义 + 原理 + 一个项目用法。
      - 回答经历题：「讲一次线上故障」——用 STAR，行动部分讲排查思路。
      - 回答选型题：「为什么用 LangGraph 不用自己写循环」——用取舍模板说出代价和切换条件。
    pitfalls: |
      - **误区：先铺垫背景显得全面。** 面试官会在第 30 秒失去耐心，结论必须在第一句。
      - **误区：只讲优点。** 不讲代价的技术选择听起来像「只会这一个」。
      - **误区：STAR 中 A 部分说「我们」。** 面试官想知道「你」做了什么判断，要说「我」。
      - **误区：背诵标准答案。** 背出来的回答经不起一次追问，要用自己的项目例子。
    interview_asks:
      - 用一分钟介绍一下你自己。
      - 讲一个你在项目中做过的技术选型，为什么这么选？
      - 讲一次你解决过的最难的问题。
    project_example: |
      模拟面试中被问「为什么用 Redis 做限流」。原回答从 Redis 是什么讲起，用了两分钟。
      改写后：「因为多副本部署时限流计数必须全局共享，Redis 单线程执行 Lua 脚本能保证原子性，而且我们本来就用它做缓存，没有新增组件；代价是 Redis 故障时限流会受影响，所以我们设计了进程内粗限流降级并告警；如果是网关层的简单限流，我会直接用网关自带的插件。」用时 40 秒，面试官随后追问了 Lua 脚本细节。
  - id: d50-k2
    name: 项目讲解框架：背景-架构-难点-数据-反思
    level: P0
    summary: 项目介绍不是功能清单，而是「一个问题如何被你解决」的故事，且每个数字都经得起追问
    why: |
      几乎每场面试都有「介绍一个你的项目」，它往往决定了后面 30 分钟的追问方向。
      讲得好，面试官顺着你准备好的难点追问；讲得散，面试官只能随机提问，你就容易被问到薄弱处。
    problem: |
      解决「项目讲成功能罗列、讲不出自己的贡献、数据经不起追问」的问题。
      常见失败：「我们做了一个知识库，有上传、问答、管理后台……」——面试官听不出难度、听不出你的判断，只能礼貌地进入下一题。
    principle: |
      **一、五段式框架（总时长 2~3 分钟）**

      ```mermaid
      flowchart LR
        A["背景 20秒 谁的什么问题 为什么需要AI"] --> B["架构 40秒 一张图 关键选型"]
        B --> C["难点 60秒 1到2个 怎么分析 怎么解决"]
        C --> D["数据 20秒 效果与规模 可验证"]
        D --> E["反思 20秒 不足与重做会怎样"]
      ```

      1. **背景**：用户是谁、原来的问题是什么、为什么用 AI 解决。「公司 3000 名员工查制度要翻几十个 PDF，IT 服务台一半工单是重复问题。」
      2. **架构**：一句话概括 + 关键组件，提前准备好能在白板上 1 分钟画完的图（Day 49）。重点说 1~2 个关键选型及理由。
      3. **难点**：选 1~2 个**真正有技术含量**的问题，讲清「现象 → 分析 → 方案 → 验证」。例如权限隔离、检索召回不足、Agent 循环、成本超标。这是整段最重要的部分。
      4. **数据**：效果指标（评估集通过率、检索命中率、点踩率）、性能指标（P95、TTFT）、业务指标（工单下降比例）、规模（文档数、日活）。
      5. **反思**：哪里做得不够好、重做会怎么改。体现你的成长性与判断力。

      **二、为每个难点准备「三层追问」**

      面试官会顺着难点一路追问，提前准备：
      - 第一层「为什么」：为什么出现这个问题？
      - 第二层「怎么做」：具体代码或配置怎么改的？
      - 第三层「还有别的办法吗」：其他方案的取舍是什么？

      **三、数据的诚实原则**

      - **只讲真实的、能解释来源的数字**：「评估集 300 条，通过率从 78% 到 89%」，并能说出评估集怎么建的、怎么评的（Day 48）。
      - 没有精确数字时说量级和观察方式：「没有做严格 A/B，但服务台同类工单在两个月内明显减少，大约少了三分之一，数据来自工单系统统计」。
      - **绝不编造数字**：面试官追问一句「怎么测的」就会露馅，比不说更伤。

      **四、讲清「我」的贡献**

      团队项目中明确说出自己负责的模块和做出的判断。用 AI 编程工具完成的代码，要能讲清它的逻辑、你审查发现了什么问题、你如何验证（见 d50-k4）。
    scenarios: |
      - 一面「介绍一下你的项目」：用五段式控制在 3 分钟，主动把话题引向准备好的难点。
      - 二面技术深挖：对每个难点准备三层追问的答案和一张架构图。
      - 简历撰写：项目描述也按「背景-方案-难点-数据」组织，每条都能在面试中展开。
    pitfalls: |
      - **误区：按功能模块逐个介绍。** 听起来像需求文档，没有技术判断。
      - **误区：难点选「接入了 LangChain」这种工作量型内容。** 难点要有分析与权衡。
      - **误区：数据凭印象估计或夸大。** 一追问来源就失去信任。
      - **误区：不讲不足。** 「完美」的项目反而不可信，反思体现成熟度。
    interview_asks:
      - 介绍一个你最有代表性的项目。
      - 这个项目里最难的问题是什么？你怎么解决的？
      - 如果让你重新做这个项目，你会改什么？
      - 你在项目中具体负责哪部分？
    project_example: |
      五段式示例（企业知识库）：背景——3000 名员工查制度难，服务台重复问题多；架构——FastAPI + PostgreSQL/pgvector + Redis + 异步入库 Worker，选 pgvector 是为了权限过滤与事务一致；难点——部门权限隔离（检索前过滤 + RLS 兜底）与制度新旧版本混淆（版本化入库 + 原子切换）；数据——评估集 300 条通过率 78% 到 89%，问答 P95 4 秒，服务台同类工单约减少三分之一；反思——早期没有评估集，前两个月优化全凭感觉，重做会第一周就建评估集。
  - id: d50-k3
    name: 五阶段知识串联：一次请求穿过整个技术栈
    level: P0
    summary: 用一条请求把 50 天串起来：Python 后端承载、LLM 生成、RAG 供给证据、Agent 执行动作、工程化兜底
    why: |
      综合面试中，面试官常从一个点一路追问到底：「流式输出怎么实现」→「SSE 和 WebSocket 区别」→「多副本下怎么做」→「模型超时怎么办」。
      知识点孤立地记，会在跨阶段的追问中断线；用一条请求链路把它们挂起来，任何一个点都能接上前后文。
    problem: |
      解决「每个知识点都学过，但串不起来、综合题答得零散」的问题。
      面试中的系统设计、故障排查、项目深挖题都是跨阶段的，只能回答单点问题的候选人很难通过中高级岗位的面试。
    principle: |
      **一、一条请求的完整旅程**

      场景：员工在企业助手中问「帮我查一下上周我提的报销工单进度，顺便告诉我差旅住宿标准」。

      ```mermaid
      sequenceDiagram
        participant U as 员工
        participant G as 网关与FastAPI
        participant R as Redis
        participant A as LangGraph Agent
        participant V as PG与pgvector
        participant M as MCP工单服务
        participant L as LLM
        U->>G: HTTPS请求 携带JWT
        G->>G: 校验JWT RBAC 取租户 Day45
        G->>R: 令牌桶限流 Day46
        G->>A: 按thread_id恢复检查点 Day36
        A->>L: 带工具定义的请求 Day18
        L-->>A: 两个工具调用 查工单 查制度
        A->>M: 以用户身份调用查工单 Day38
        A->>V: 带权限过滤的混合检索 Day26
        A->>L: 观察结果加资料 生成回答 Day28
        L-->>G: Token流
        G-->>U: SSE流式输出与引用 Day43
        G->>G: Trace Token 成本 Day48
      ```

      **二、按阶段对应知识点**

      | 阶段 | 在这条请求中的位置 | 面试高频追问 |
      |---|---|---|
      | 1 Python 与后端 | FastAPI 异步路由、Pydantic 校验、依赖注入、连接池、事务、索引 | async 与 GIL、阻塞调用、N+1、事务隔离 |
      | 2 LLM 应用 | Token 预算、Prompt 组装、Function Calling、结构化输出、流式、超时重试 | 上下文窗口、温度、工具调用原理、JSON 不合法怎么办 |
      | 3 RAG | 入库切片、Embedding、pgvector 检索、混合检索、Rerank、引用、评估 | 召回不足怎么查、Chunk 大小、权限过滤、幻觉 |
      | 4 Agent | ReAct 循环、LangGraph 状态与检查点、终止条件、MCP 工具、人工确认 | 何时用 Agent、怎么防循环、MCP 与 Function Calling 的关系 |
      | 5 生产工程 | Redis 限流缓存、队列、SSE、Docker、JWT/RBAC、性能、安全、评估、架构 | 扩容、故障、注入、泄露、回归测试 |

      **三、四个最容易被串联追问的主线**

      1. **「慢」主线**：TTFT 与 Token 数（Day 13、46）→ 流式输出 SSE（Day 17、43）→ async 与阻塞（Day 06、46）→ 缓存与降级（Day 41、46）。
      2. **「错」主线**：幻觉（Day 11）→ RAG 检索召回与引用（Day 26~29）→ 结构化输出校验（Day 19）→ 评估集与回归（Day 29、48）。
      3. **「越权」主线**：JWT/RBAC（Day 45）→ 检索前权限过滤与 RLS（Day 30、47）→ 工具最小权限与人工确认（Day 40、47）→ 审计（Day 47）。
      4. **「失控」主线**：Agent 终止条件（Day 37）→ 检查点恢复（Day 36）→ 限流与预算（Day 20、46）→ 熔断与降级（Day 49）。

      **四、Python 运行机制的更新点**

      GIL 的基本结论（Day 07）在面试中仍然成立：默认构建下 CPU 密集任务用多进程，I/O 密集用 async。补充现状：Python 3.13 起提供可选的无 GIL（free-threaded）构建，3.14 起进入官方支持阶段（PEP 779），但**仍是可选构建，默认解释器依旧带 GIL**，部分 C 扩展在该构建下会重新启用 GIL。面试中说清这个现状即可，不要说「Python 已经没有 GIL 了」。
    scenarios: |
      - 面试官问「流式输出怎么做的」：从 LLM 的 stream 参数讲到 SSE、Nginx 缓冲、断线处理，再到多副本无状态。
      - 故障排查题「回答错了」：沿「错」主线从检索到生成到评估逐层排查。
      - 自我复习：拿一条请求从头到尾讲，卡住的地方就是薄弱项。
    pitfalls: |
      - **误区：按天背知识点。** 面试题不按课程顺序出，要按请求链路和主线组织。
      - **误区：说「Python 3.14 已经去掉 GIL」。** free-threaded 是可选构建，默认仍有 GIL。
      - **误区：综合题只讲自己熟悉的那一层。** 要主动说出上下游的影响。
    interview_asks:
      - 从用户发出一个问题到看到回答，你的系统里发生了什么？越详细越好。
      - 用户说回答错了，你怎么排查？
      - 你的系统里哪些地方用了异步？为什么？
    project_example: |
      复习时用「查工单 + 查制度」这条请求做自测：从 JWT 校验讲到 SSE 输出，每讲到一个环节就自问「这里失败了会怎样」。
      第一次自测卡在「Checkpoint 恢复时工具会不会重复调用」和「Nginx 对 SSE 的缓冲」两处，回到 Day 36、Day 43 补课后再讲，整条链路可以连贯讲 8 分钟。
    freshness: |
      核对于 2026-11：Python 3.14（2025-10 发布）起 free-threaded 构建依据 PEP 779 获得官方支持，但仍为可选构建，默认构建保留 GIL；部分未声明支持的 C 扩展导入时会自动重新启用 GIL。
    sources:
      - {title: "PEP 779 - Criteria for supported status for free-threaded Python", url: "https://peps.python.org/pep-0779/"}
      - {title: "Python 官方文档 - Python support for free threading", url: "https://docs.python.org/3/howto/free-threading-python.html"}
  - id: d50-k4
    name: 诚实表达不会的问题与薄弱项复盘
    level: P1
    summary: 不会就说不会，但要说出你知道的边界、推理思路和补齐计划；编造是最大的减分项
    why: |
      面试中一定会遇到不会的问题。面试官考察的不只是知识，还有**诚信和面对未知的思考方式**。
      你的真实情况是「主要靠 AI 写代码、读代码能力在补」，这在面试中一定会被触及，提前想好如何诚实且有力地表达，比回避更有利。
    problem: |
      解决「遇到不会的问题时慌乱、沉默或编造」以及「不清楚自己哪里薄弱」的问题。
      编造会在下一个追问时暴露，并让面试官怀疑你之前所有回答的真实性；沉默则浪费了展示思考能力的机会。
    principle: |
      **一、不会的问题：四步回答法**

      ```mermaid
      flowchart LR
        A["承认边界 这个我没有实际做过"] --> B["说出已知 相关的我知道什么"]
        B --> C["推理思路 如果让我做 我会怎么查怎么想"]
        C --> D["补齐计划 或 反问确认"]
      ```

      例：被问「vLLM 的 PagedAttention 原理」。
      「这个我没有在生产中用过，只了解大意。我知道推理时 KV Cache 会占大量显存，PagedAttention 应该是借鉴操作系统分页的思路来管理这部分显存、减少碎片，从而提高并发。具体的块管理细节我说不准，如果工作中要用，我会先读官方文档和论文，再用压测对比吞吐。」

      **二、关于「用 AI 写代码」的诚实表达**

      - 不要隐瞒，也不要自我贬低。可以说：「日常编码我大量使用 Cursor 等 AI 工具，我的工作重点是拆解需求、设计接口和数据流、审查和验证 AI 生成的代码。」
      - 关键是证明你**能读懂、能审查、能验证**：准备 2~3 个「AI 生成的代码有问题、被我发现并修正」的真实例子，例如异常被吞、async 里调同步库、权限没校验、可变默认参数（本周代码阅读就在练这个）。
      - 面试中如被要求手写或现场读代码，坦然说出思路，边写边解释。

      **三、薄弱项复盘方法**

      1. 按五个阶段列出知识点，用三档自评：**能讲清并举例 / 能说概念但讲不深 / 说不清**。
      2. 结合本系统的掌握度数据和模拟面试中被追问卡住的地方，找出前 5 个薄弱项。
      3. 对每个薄弱项写出：现在能说到哪一步、目标说到哪一步、用什么方式补（重读哪天、做一个小实验、读一段源码）。
      4. 面试前一周只补对目标岗位最关键的 2~3 个，不追求全部补齐。
    scenarios: |
      - 面试被问到没接触过的技术（如某个推理框架、某种微调方法）：用四步回答法。
      - 面试官问「你平时写代码多吗」：诚实说明使用 AI 工具的方式，并给出审查发现问题的例子。
      - 面试复盘：把卡住的问题记录下来，归入薄弱项清单。
    pitfalls: |
      - **误区：不会也硬编一个答案。** 面试官通常比你懂，追问一句就暴露。
      - **误区：只说「不知道」就停下。** 失去了展示推理能力的机会。
      - **误区：回避使用 AI 工具的事实。** 被追问细节时更被动；正面讲审查能力反而是加分项。
      - **误区：薄弱项想全部补齐。** 时间有限，优先补目标岗位最常考的。
    interview_asks:
      - 这个问题你不太熟悉的话，可以说说你的思路吗？
      - 你平时是怎么使用 AI 编程工具的？如何保证代码质量？
      - 你觉得自己技术上最大的短板是什么？在怎么补？
    project_example: |
      模拟面试中被问到「LangGraph 的 checkpoint 是在每个节点之后保存还是每个超步之后保存」，没有把握。
      回答：「我记得是按步骤保存，用于恢复和人工中断，但具体是节点级还是超步级我不确定。我的理解是并行分支在同一步内执行，所以按超步保存更合理，我会回去查文档确认。」面试官认可了推理过程。复盘后查阅官方文档确认 Checkpointer 在每个超步保存快照，并记入薄弱项已补清单。
  - id: d50-k5
    name: 求职能力评估与 JD 匹配
    level: P1
    summary: 把岗位 JD 拆成能力项，逐项对照自己的证据，找到「最匹配的岗位」和「最该补的一项」
    why: |
      AI 应用相关岗位名称五花八门（AI 应用开发、Agent 开发、大模型应用、Python AI 后端、AI 解决方案），要求差异很大。
      不做匹配就海投，既浪费精力，也会在不擅长的方向上反复受挫。你的前端/全栈和需求沟通经验，在部分岗位上是明显优势。
    problem: |
      解决「不知道该投哪类岗位、简历怎么突出优势、面试前该重点准备什么」的问题。
      没有能力地图时，准备方向会被最近一次面试的问题牵着走，缺乏系统性。
    principle: |
      **一、岗位能力地图**

      | 岗位方向 | 核心能力 | 你的已有优势 | 需重点准备 |
      |---|---|---|---|
      | AI 应用开发（全栈向） | 前后端、LLM 集成、流式交互、产品落地 | 前端/全栈、需求沟通、部署调试 | Python 后端深度、RAG 评估 |
      | AI Agent 开发 | Agent 架构、LangGraph、工具与 MCP、可控性 | 接口集成经验 | 状态管理、终止与恢复、安全 |
      | 大模型应用 / RAG 工程 | 文档处理、检索优化、评估体系 | 业务理解 | 检索调优与评估数据 |
      | Python AI 后端 | FastAPI、数据库、并发、性能、队列 | 部署与现场调试 | 代码阅读、异步与数据库调优 |
      | 企业 AI 解决方案 | 需求分析、架构方案、安全合规、交付 | 需求沟通、现场经验 | 架构表达、安全与成本方案 |

      **二、JD 拆解四步**

      ```mermaid
      flowchart LR
        J["收集10份目标JD"] --> K["拆出能力项并统计频次"]
        K --> S["逐项自评 并写出证据 项目 代码 数据"]
        S --> G["找出高频且自评低的差距项"]
        G --> P["制定两周补齐计划 与 简历调整"]
      ```

      - 能力项要具体：「FastAPI 异步与依赖注入」「RAG 检索评估」「LangGraph 检查点」，而不是「熟悉大模型」。
      - **证据**是关键：每个能力项都要能对应一个项目片段、一段你能讲清的代码或一个数据。没有证据的能力项，面试中很难自证。

      **三、简历与面试准备的对齐**

      简历上写的每个技术词都可能被追问三层；写不出证据的词宁可不写。项目描述用 d50-k2 的五段式压缩版。
    scenarios: |
      - 投递前：收集 10 份「AI 应用开发」JD，发现 8 份要求 RAG 评估经验，于是用两周补做评估集与回归脚本。
      - 选择方向：全栈背景 + 需求沟通优势，优先投「AI 应用开发（全栈向）」和「企业 AI 解决方案」岗位。
      - 面试前一天：对照该公司 JD 的前 5 个能力项，各准备一个项目例子。
    pitfalls: |
      - **误区：简历堆满技术名词。** 每个词都可能被深挖，写了说不清比不写更糟。
      - **误区：所有岗位用同一份简历。** 应按方向调整项目描述的侧重点。
      - **误区：忽视非技术优势。** 需求拆解、客户沟通、现场交付在解决方案和应用岗中很有价值。
    interview_asks:
      - 你为什么想做 AI 应用开发？你的优势是什么？
      - 你对我们这个岗位的理解是什么？
      - 你还需要多长时间能独立负责一个 AI 功能模块？
    project_example: |
      对 12 份目标 JD 拆解后统计：「RAG」出现 11 次、「Agent/工作流」9 次、「FastAPI/Python 后端」10 次、「评估与监控」7 次、「前端交互」5 次。
      自评后发现「评估与监控」高频且证据最弱，于是用一周为知识库项目补建 150 条评估集和 CI 回归脚本，简历中新增一条带数据的描述，之后两场面试都被问到并顺利展开。
quiz:
  - id: d50-q1
    kp: d50-k3
    type: single
    question: |
      某 RAG 服务中有如下 Python 函数，在同一个 worker 进程中被两个不同用户的请求先后调用：
      ```python
      def build_history(msg: str, history: list[str] = []) -> list[str]:
          history.append(msg)
          return history

      build_history("用户A：我的工资是多少")
      print(build_history("用户B：报销标准是什么"))
      ```
      输出是什么？
    options:
      - "['用户B：报销标准是什么']"
      - "['用户A：我的工资是多少', '用户B：报销标准是什么']"
      - "抛出 TypeError，因为默认参数不能是列表"
      - "每次调用结果随机，取决于垃圾回收时机"
    answer: [1]
    explain: |
      Python 的默认参数在函数定义时只求值一次，之后每次省略该参数的调用共享同一个列表对象（可变对象与默认参数，见 Day 02、Day 03）。
      第一次调用把 A 的消息追加进这个共享列表，第二次调用继续追加，输出包含两条。在 Web 服务中这意味着不同用户的消息会串到一起，既是 Token 不断增长的性能问题，也是跨用户数据泄露。正确写法是默认值用 None 并在函数内新建列表。
  - id: d50-q2
    kp: d50-k3
    type: multi
    question: 以下横跨多个阶段的说法，哪些是正确的？
    options:
      - "Embedding 相似度高只说明语义接近，不能保证片段中包含问题的答案"
      - "LangGraph 使用 InMemorySaver 时，多个副本之间可以共享会话检查点"
      - "SSE 是基于普通 HTTP 响应的服务器到客户端单向推送"
      - "JWT 的 payload 默认是加密的，所以可以放入密码等敏感信息"
      - "Function Calling 中模型本身不执行函数，只生成函数名和参数，由应用执行并回传结果"
    answer: [0, 2, 4]
    explain: |
      向量相似度衡量语义接近，不保证包含答案（Day 14、26）；SSE 是 HTTP 长响应上的单向事件流（Day 43）；Function Calling 中模型只输出调用意图与参数，执行由应用完成（Day 18、33）。
      InMemorySaver 把检查点存在进程内存中，进程之间不共享、重启即丢失，生产应使用 PostgresSaver 等持久化实现（Day 36）；常见 JWT（JWS）只是 Base64URL 编码加签名，任何人都能解码 payload，不能放敏感信息（Day 45）。
  - id: d50-q3
    kp: d50-k3
    type: judge
    question: 在 RAG 系统中，把 Chunk Size 调得越大，每个片段包含的上下文越完整，所以回答质量一定越好。
    answer: false
    explain: |
      片段越大，单个向量要概括的内容越多，语义被稀释，检索精度下降；同时同样的 Token 预算能放入的片段数变少，无关内容增多，还会增加成本与 TTFT。
      Chunk Size 需要结合文档结构与评估集数据选择，并可配合 Overlap、按标题结构切分、父子片段等策略（Day 23、29）。
  - id: d50-q4
    kp: d50-k3
    type: single
    question: 在 Transformer 的自注意力中，某个 Token 的输出表示是如何得到的？
    options:
      - "直接取该 Token 的 Embedding，不受其他 Token 影响"
      - "用该 Token 的 Query 与所有 Token 的 Key 计算相似度，经 softmax 得到权重，再对所有 Token 的 Value 加权求和"
      - "用该 Token 的 Key 与所有 Token 的 Value 点积后取最大值"
      - "把所有 Token 的 Embedding 简单平均"
    answer: [1]
    explain: |
      自注意力的计算流程是：每个 Token 生成 Query、Key、Value；用当前 Token 的 Query 与所有 Token 的 Key 做点积并缩放，softmax 得到注意力权重，再对所有 Value 加权求和，得到融合了上下文的新表示（Day 12）。
      其他选项要么忽略了上下文，要么混淆了 Q、K、V 的角色；简单平均没有「按相关性分配权重」这一核心机制。
  - id: d50-q5
    kp: d50-k1
    type: short
    question: |
      面试官问：「你们为什么选择 LangGraph 来做 Agent？」某候选人回答：
      「LangGraph 是 LangChain 团队做的，LangChain 很流行，然后它有 State、Node、Edge，我们之前也用过 LangChain，所以就用了，它功能挺多的。」
      请指出这个回答的问题，并用「结论先行 + 取舍模板」重写一个 1 分钟版本。
    key_points:
      - {text: "指出原回答没有结论先行，理由是流行和用过，缺少与业务约束相关的原因", dim: concept}
      - {text: "指出原回答没有说明代价与替代方案，无法体现技术判断", dim: concept}
      - {text: "重写版本第一句给出结论，并给出与需求相关的理由，如检查点恢复、人工中断、可控流程", dim: principle}
      - {text: "重写版本说明代价与切换条件，如学习成本、简单场景直接写循环", dim: engineering}
    reference: |
      问题：① 没有结论先行，绕到第三句才说「所以就用了」；② 理由是「流行」「用过」「功能多」，与业务需求无关，听不出判断；③ 没有说代价，也没有说什么情况下不用它，面试官很容易追问「那为什么不自己写一个循环」而让候选人卡住。
      重写：「我们选 LangGraph，主要是因为业务需要可中断、可恢复的多步流程。具体有两点：第一，报销 Agent 在提交前要等员工确认，LangGraph 的检查点加 interrupt 能让流程暂停几小时后用同一个 thread 继续；第二，我们把流程画成显式的状态图，哪些步骤走模型、哪些走固定逻辑一目了然，比一个大 while 循环好调试。代价是有学习成本，版本更新也快，我们锁定了版本并封装了一层。如果只是单轮的工具调用，我会直接用模型 SDK 写一个带最大步数的循环，不引入框架。」
  - id: d50-q6
    kp: d50-k4
    type: scenario
    question: |
      面试中你被问到：「讲讲你们系统里 PostgreSQL 的 MVCC 是怎么工作的，以及它和 VACUUM 的关系。」你只知道 MVCC 是「多版本并发控制」，细节说不清。
      请写出你会如何回答，并说明这样回答的理由。
    key_points:
      - {text: "先坦诚说明掌握程度，不编造细节", dim: concept}
      - {text: "说出已知的相关知识，如读写不互相阻塞、更新会产生旧版本行", dim: principle}
      - {text: "给出合理推理，如旧版本需要清理所以需要 VACUUM，并说明与自己项目的关联", dim: principle}
      - {text: "说明补齐计划或验证方式，体现学习方法", dim: engineering}
    reference: |
      回答示例：「这块我没有深入研究过，先说我确定知道的部分。MVCC 是多版本并发控制，核心效果是读不阻塞写、写不阻塞读：更新一行时不是原地覆盖，而是产生一个新版本，旧版本对还在进行中的事务仍然可见。由此我推测，旧版本行在没有事务需要之后要被清理，否则表会越来越大，这应该就是 VACUUM（和自动 VACUUM）的作用之一。在我们项目里，消息表更新不多，主要是插入，所以我没有遇到相关问题；如果工作中遇到表膨胀，我会先查官方文档关于 VACUUM 的章节，再看表的死元组统计来确认。」
      理由：坦诚说明边界避免了追问时露馅；说出确定知道的部分展示了基础；基于已知做合理推理展示了思考方式，并明确标注是推测；结合项目说明实际接触范围；最后给出验证路径，体现学习能力。比沉默或编造都好得多。
  - id: d50-q7
    kp: d50-k3
    type: design
    question: |
      员工在企业 AI 助手中输入：「帮我查一下上周我提的报销工单进度，顺便告诉我差旅住宿标准。」
      请从请求进入系统到用户看到流式回答，按顺序讲出经过的每个环节，并在每个环节指出一个可能的失败点和对应处理。要求至少覆盖：鉴权、限流、Agent 状态、工具调用、检索、生成、流式输出、观测。
    key_points:
      - {text: "鉴权与限流：JWT 校验与 RBAC 取用户与租户，Redis 令牌桶，失败返回 401 或 429", dim: engineering}
      - {text: "Agent：按 thread_id 恢复检查点并校验归属，模型通过 Function Calling 决定调用两个工具，设置步数上限", dim: principle}
      - {text: "工具与检索：MCP 工单工具以用户身份调用并设置超时，制度检索带权限过滤与版本，失败作为观察结果返回", dim: engineering}
      - {text: "生成与流式：组装 Prompt 引用来源，SSE 推送，处理客户端断开与模型超时降级", dim: engineering}
      - {text: "观测与安全：Trace 记录 Token 与成本，内容脱敏，工单内容视为不可信防间接注入", dim: engineering}
    reference: |
      ① 网关与鉴权：HTTPS 进入网关，FastAPI 依赖校验 JWT，取 user_id、tenant_id、角色。失败点：Token 过期，返回 401 让前端刷新。
      ② 限流：Redis Lua 令牌桶按用户与租户 TPM 检查。失败点：Redis 不可用，降级为进程内粗限流并告警。
      ③ Agent 状态：根据 thread_id 校验会话归属后，从 PostgresSaver 恢复检查点，并获取会话锁。失败点：同会话并发，返回 409。
      ④ 规划：LLM 收到带工具定义的请求，返回两个工具调用：查工单、查制度。失败点：参数不符合 Schema，校验后把错误作为观察返回让模型修正，并受 recursion_limit 约束。
      ⑤ 查工单：通过 MCP 服务（Streamable HTTP + OAuth）以员工身份查询，只能看到自己的工单。失败点：工单系统超时，单工具 10 秒超时，返回「暂时无法查询」作为观察。工单内容中的文本视为不可信数据，防止间接注入。
      ⑥ 查制度：问题向量化 + 关键词混合检索，WHERE 带租户与部门权限，只检索生效版本，Rerank 后取 Top-K。失败点：Rerank 超时，跳过直接用向量结果。
      ⑦ 生成：把两个观察结果与制度片段组装成带引用的 Prompt，流式生成。失败点：模型 429 或超时，熔断后切备用模型。
      ⑧ 流式输出：SSE 逐段推送，结束时附引用列表；客户端断开时取消上游请求避免浪费 Token。
      ⑨ 收尾与观测：异步写消息记录、按 usage 结算配额；Trace 中记录各 Span 耗时、Token、成本、Prompt 版本，内容默认不采集；审计日志记录访问的工单 ID 与文档 ID。
    followup:
      question: 如果模型在第 ④ 步只调用了查制度工具而漏掉了查工单，你会如何发现并改进？
      key_points: [评估集中加入多意图问题并检查工具调用轨迹, 线上 Trace 统计工具调用与意图不匹配的比例, 改进工具描述或增加意图拆分步骤]
      reference: 发现：在评估集中加入多意图问题，断言工具调用轨迹包含两个工具；线上通过 Trace 统计含「工单」关键词但未调用工单工具的比例。改进：优化工具描述的适用场景说明，在 System Prompt 中要求逐一处理用户提出的每个诉求，或在图中增加意图拆分节点，把多意图拆成子任务分别执行，修改后用评估集回归验证。
  - id: d50-q8
    kp: d50-k2
    type: short
    question: 请用「背景-架构-难点-数据-反思」五段式，为你在本课程中完成的企业知识库实践项目写一份 3 分钟的讲稿提纲。每一段写出具体内容要点，数据部分只写你能解释来源的指标。
    key_points:
      - {text: "背景说明用户、原问题和为什么用 AI，控制在一两句话", dim: project}
      - {text: "架构给出关键组件与 1 到 2 个选型理由，如 pgvector 与权限过滤、异步入库", dim: project}
      - {text: "难点选择有技术含量的问题，并按现象、分析、方案、验证展开", dim: principle}
      - {text: "数据给出评估集通过率、延迟等可解释来源的指标，反思指出不足与改进", dim: engineering}
    reference: |
      提纲示例：
      背景：公司员工查制度要翻多个 PDF，同类问题反复问 HR 和 IT；目标是做一个能按部门权限回答并给出处的知识助手。
      架构：FastAPI 异步服务 + PostgreSQL/pgvector + Redis + 任务队列入库 Worker + LLM 调用与 SSE 流式。选 pgvector 是因为权限过滤和文档删除需要与业务数据在同一事务中；入库异步是因为 PDF 解析耗时，不能阻塞问答。
      难点一：部门权限隔离——现象是测试中跨部门检索到文档；分析发现检索后过滤会让片段进入上下文；方案是检索前 WHERE 过滤 + RLS 兜底 + 跨部门探测用例；验证是探测用例全部通过。难点二（备选）：新旧制度混淆——版本化入库与原子切换。
      数据：评估集 N 条（说明来源与评审方式），通过率从 X 到 Y；问答 P95 延迟 Z 秒（压测条件说明）。没有测过的指标不写。
      反思：评估集建得太晚，早期优化靠感觉；Trace 接入不完整，排查慢请求困难；重做会第一周就建评估集并统一埋点。
code_reading:
  id: d50-c1
  kp: [d50-k3, d50-k4]
  title: 综合审查：带结构化输出和审计上报的问答接口
  scenario: 这是一段由 AI 编程工具生成、已通过本地手工测试的问答接口，准备合并到生产分支。它结合了 FastAPI、检索、LLM 结构化输出、引用校验和审计上报。请像面试中的「现场代码审查」一样，找出跨阶段的问题。
  language: python
  code: |
    import logging
    import os
    import time

    import requests
    from fastapi import APIRouter, Depends, HTTPException
    from openai import AsyncOpenAI
    from pydantic import BaseModel, ValidationError

    from app.auth import CurrentUser, get_current_user
    from app.retrieval import search_chunks

    logger = logging.getLogger(__name__)
    router = APIRouter()
    llm = AsyncOpenAI(timeout=30.0, max_retries=1)
    SYSTEM = "只依据资料回答。输出 JSON，字段为 answer（字符串）和 cited_ids（资料编号列表）。"


    class Answer(BaseModel):
        answer: str
        cited_ids: list[str]


    def build_messages(question: str, chunks: list[dict], history: list[dict] = []) -> list[dict]:
        context = "\n".join(f"[{c['id']}] {c['text']}" for c in chunks)
        history.append({"role": "user", "content": f"资料：\n{context}\n\n问题：{question}"})
        return [{"role": "system", "content": SYSTEM}] + history


    @router.post("/qa")
    async def qa(question: str, user: CurrentUser = Depends(get_current_user)) -> Answer:
        chunks = await search_chunks(question, tenant_id=user.tenant_id, k=5)
        if not chunks:
            return Answer(answer="资料中没有找到相关内容。", cited_ids=[])

        resp = await llm.chat.completions.create(
            model=os.environ["LLM_MODEL"],
            messages=build_messages(question, chunks),
            response_format={"type": "json_object"},
            temperature=0,
        )
        try:
            result = Answer.model_validate_json(resp.choices[0].message.content or "")
        except ValidationError:
            logger.exception("invalid llm output")
            raise HTTPException(status_code=502, detail="模型输出格式错误，请重试")

        valid_ids = {c["id"] for c in chunks}
        result.cited_ids = [i for i in result.cited_ids if i in valid_ids]

        started = time.perf_counter()
        requests.post(os.environ["AUDIT_URL"], json={"user": user.id, "cited": result.cited_ids}, timeout=5)
        logger.info("audit sent in %.0fms", (time.perf_counter() - started) * 1000)
        return result
  walkthrough:
    function: |
      实现一个带引用的问答接口：按当前用户租户检索 5 个片段，无结果时直接返回；否则组装消息调用 LLM，要求 JSON 输出，用 Pydantic 校验结构，过滤掉不属于本次检索结果的引用编号，最后同步上报审计服务并返回结果。
    key_functions: |
      - `build_messages`：把片段拼成带编号的资料文本，与问题一起追加到历史列表，前面加上 System 消息。
      - `qa`：路由主体，依次完成检索、调用模型、结构化校验、引用过滤、审计上报。
      - `Answer.model_validate_json`：Pydantic v2 的 JSON 解析与校验（Day 19），失败抛 `ValidationError`。
      - `requests.post`：同步 HTTP 调用审计服务。
    params: |
      - `question` 没有放在 Pydantic 请求体模型中，FastAPI 会把它当作查询参数（Day 09），长问题放在 URL 中可能超长，也会进入访问日志。
      - `tenant_id` 取自鉴权后的 `user`，这一点是正确的（Day 47）。
      - `history` 是带默认值的可变参数，调用方没有传入，始终使用默认列表。
    data_flow: |
      ```mermaid
      flowchart TB
        Q["question 查询参数"] --> S["search_chunks 按租户检索"]
        S -->|"无结果"| E["直接返回 无相关内容"]
        S --> B["build_messages 追加到默认history列表"]
        B --> L["LLM JSON模式"]
        L --> V["Pydantic 校验"]
        V -->|"失败"| X["502"]
        V --> F["过滤不在本次检索结果中的引用"]
        F --> AU["requests.post 同步审计 最长5秒"]
        AU --> R["返回 Answer"]
      ```
    failure_points: |
      - **可变默认参数（重点）**：`history: list[dict] = []` 在函数定义时只创建一次，同一 worker 进程内所有请求共享这个列表。每次请求都往里追加，导致：① 后续请求的 Prompt 中包含之前所有用户的问题和检索资料——跨用户、跨租户数据泄露；② 消息越来越多，Token 与延迟线性增长，最终超过上下文窗口报错；③ 多副本、多进程间表现不一致，难以复现。
      - **async 中的同步阻塞调用（重点）**：`requests.post` 是同步调用，审计服务慢时最长阻塞 5 秒，期间整个事件循环停止，同进程所有请求一起变慢；审计服务异常时抛出的异常未处理，会让已经生成好的回答变成 500。
      - `question` 作为查询参数，长度不受控也可能被记录进访问日志。
      - 引用过滤后，若 cited_ids 为空但 answer 有内容，没有提示「回答缺少依据」。
    debugging: |
      - 复现可变默认参数：在本地连续发起两个不同问题的请求，在 `build_messages` 返回前打印 `len(history)`，或在 Trace 中观察输入 Token 随请求次数单调增长。
      - 复现阻塞：用一个故意延迟 5 秒的假审计服务，同时发起 20 个请求，观察总耗时是否接近 20 × 5 秒的串行效果。
      - 加单元测试：连续调用 `build_messages` 两次，断言第二次返回的消息中不包含第一次的问题。
    change_request: |
      若需求改为「支持多轮对话，携带最近 5 轮历史」：
      - 请求体改为 Pydantic 模型，包含 `question` 与 `conversation_id`；
      - 历史从数据库按 conversation_id 读取，并校验会话属于当前用户；
      - `build_messages` 的 history 参数改为必传或默认 None，在函数内新建列表，按 Token 预算截断历史；
      - 审计上报改为异步客户端或投递到队列，失败不影响主流程。
  questions:
    - id: d50-c1-q1
      kp: d50-k3
      type: code
      question: 同一个 worker 进程先后收到用户 A（租户 X）和用户 B（租户 Y）的提问。请按执行顺序说明第二次调用 `build_messages` 时返回的消息列表包含什么，以及这会带来哪些安全、性能和稳定性问题。最后给出修复代码思路。
      key_points:
        - {text: "解释默认参数在定义时只创建一次，A 的请求把资料和问题追加进共享列表", dim: principle}
        - {text: "指出 B 的消息列表包含 system 加 A 的资料问题加 B 的资料问题，A 租户的资料泄露给 B", dim: principle}
        - {text: "指出列表持续增长导致 Token、成本、TTFT 上升，最终超出上下文窗口报错，且多进程间表现不一致", dim: engineering}
        - {text: "修复：默认值改为 None 并在函数内新建列表，历史从数据库按会话读取并截断", dim: engineering}
      reference: |
        执行过程：模块加载时 `def build_messages` 被执行，默认参数 `[]` 此时被创建并绑定到函数对象上。A 的请求调用 `build_messages(question, chunks)` 未传 history，使用这个默认列表，把「资料（租户 X 的片段）+ A 的问题」追加进去，返回 `[system, A消息]`。B 的请求再次调用，仍然拿到同一个列表对象（里面已有 A 消息），再追加 B 的内容，返回 `[system, A消息, B消息]`。
        问题：① 安全：B 的 Prompt 中包含租户 X 的资料和 A 的问题，模型可能在回答中引用或被 B 诱导输出，属于跨租户数据泄露（Day 47），尽管检索本身是按租户过滤的；② 性能与成本：每个请求都携带之前所有请求的内容，输入 Token 单调增长，成本和 TTFT 随之上升（Day 46）；③ 稳定性：最终超过上下文窗口导致 API 报错，进程重启后又恢复正常，问题时有时无；不同 worker 的列表各自增长，现象难以复现。
        修复：`def build_messages(question, chunks, history: list[dict] | None = None)`，函数内 `messages = list(history) if history else []`，不修改传入的列表；多轮历史从数据库按 conversation_id 读取并校验归属，按 Token 预算截断。补充单元测试断言连续两次调用互不影响。
    - id: d50-c1-q2
      kp: d50-k3
      type: code
      question: 假设审计服务响应变慢，每次需要 4 秒。此时有 20 个请求同时到达同一个 worker 进程。请结合事件循环说明这些请求的实际执行情况与总体耗时，并给出两种改法及取舍。
      key_points:
        - {text: "说明 requests.post 是同步阻塞调用，执行期间事件循环无法切换到其他协程", dim: principle}
        - {text: "说明 20 个请求在审计这一步被串行化，后到的请求要额外等待前面所有请求的审计时间，总计可达约 80 秒", dim: principle}
        - {text: "指出审计服务异常时抛出的异常会让已生成的回答变成 500", dim: engineering}
        - {text: "给出改法：改用 httpx.AsyncClient 并捕获异常，或投递到队列或后台任务异步上报，并说明可靠性取舍", dim: engineering}
      reference: |
        执行情况：20 个请求的协程在检索和 LLM 调用阶段可以并发，因为这些都是 await 的异步调用。但当某个请求执行到 `requests.post` 时，它在当前线程中同步等待 4 秒，事件循环被占住，其他协程即使模型结果已返回也无法继续；下一个请求执行到这一步时又阻塞 4 秒。审计步骤被完全串行化，最后一个请求可能要多等约 19 × 4 = 76 秒，加上自身约 80 秒；期间这个进程的所有其他接口（包括健康检查）都没有响应，可能被编排系统判定为不健康而重启。审计服务报错或超时时，`requests` 抛出的异常没有被捕获，已生成的回答变成 500。
        改法一：使用在 lifespan 中创建的 `httpx.AsyncClient`，`await client.post(..., timeout=2)`，并用 try/except 捕获异常记录日志与指标。优点是简单、仍同步得知结果；缺点是审计慢时仍会拉长用户请求耗时。
        改法二：把审计事件投递到任务队列或 Redis Stream（Day 42），由独立消费者写入审计服务，失败可重试。优点是不影响用户延迟、可靠性更高；缺点是引入异步链路，需要监控积压，审计有短暂延迟。审计属于合规要求时推荐改法二，并保证至少一次投递。
    - id: d50-c1-q3
      kp: d50-k4
      type: code
      question: 这段代码由 AI 工具生成并「通过了本地手工测试」。如果面试官问你：「为什么手工测试没发现这两个问题？你平时如何审查 AI 生成的代码？」请结合本段代码回答。
      key_points:
        - {text: "解释手工测试通常是单用户、少量请求、审计服务正常，触发不了共享状态与阻塞问题", dim: principle}
        - {text: "说出审查清单：可变默认参数与全局状态、async 中的同步调用、异常处理、权限与租户、超时", dim: engineering}
        - {text: "说出验证手段：针对性单元测试、并发压测、故障注入如延迟的假服务", dim: engineering}
        - {text: "诚实说明使用 AI 工具的方式，并强调自己负责审查与验证", dim: project}
      reference: |
        为什么没发现：本地手工测试一般是一个人、一次问一个问题、审计服务也在本机且响应很快。可变默认参数的问题需要「同一进程内连续多次请求」并检查 Prompt 内容才会暴露，单次测试回答看起来完全正常；阻塞问题需要「并发 + 下游变慢」才会显现，单请求时 4 秒内的审计耗时也不明显。这两类问题都属于「功能正确但并发与状态错误」，正是手工点测最容易漏掉的。
        我的审查方式：日常编码我大量使用 AI 工具，我把自己的职责定位在设计和审查。拿到生成代码后按清单过一遍：① 有没有模块级或默认参数的可变状态；② async 函数里有没有同步 I/O（requests、同步 SDK、time.sleep）；③ 异常是否被吞掉或未处理，下游失败是否影响主流程；④ 租户与权限是否来自鉴权身份；⑤ 外部调用是否都有超时。然后用测试验证：针对状态写「连续调用互不影响」的单元测试，用压测工具做小规模并发，并用故意变慢或报错的假服务做故障注入。本段代码按这个清单在审查阶段就能发现两处问题。
interview:
  - id: d50-i1
    kp: d50-k3
    type: oral
    difficulty: 2
    category: python_backend
    question: Python 的 GIL 是什么？它对 AI 后端服务有什么影响？FastAPI 的异步和多 worker 是怎么配合解决并发问题的？
    key_points:
      - {text: "解释 GIL 让同一进程同一时刻只有一个线程执行 Python 字节码，I/O 等待时会释放", dim: concept}
      - {text: "说明 AI 后端以 I/O 等待为主，async 足以支撑高并发，CPU 密集任务用多进程或任务队列", dim: principle}
      - {text: "说明 async 中的同步阻塞会卡住事件循环，多 worker 用于利用多核与隔离，并注意连接数", dim: engineering}
      - {text: "准确说明 free-threaded 构建在 3.14 起官方支持但仍为可选，默认构建仍有 GIL", dim: concept}
    reference: |
      GIL 是 CPython 的全局解释器锁，同一进程中同一时刻只有一个线程在执行 Python 字节码；线程在等待 I/O 时会释放 GIL，所以多线程对 I/O 密集任务有效，对纯 Python 的 CPU 密集任务无法并行。
      AI 后端的大部分时间在等模型、等向量库、等 Redis，是典型的 I/O 密集场景。FastAPI 的 async 路由让一个进程用单线程事件循环同时挂住几百个等待中的请求；多 worker（`fastapi run --workers` 或 uvicorn `--workers`）启动多个进程，用满多核并隔离故障。CPU 密集的 PDF 解析、批量预处理放到任务队列的独立 worker。
      注意点：async 函数里调用同步阻塞库会卡住整个事件循环；多进程间不共享内存，连接池和缓存乘以进程数，限流计数要放 Redis。
      现状补充：Python 3.13 起有可选的 free-threaded（无 GIL）构建，3.14 起依据 PEP 779 获得官方支持，但仍是可选构建，默认解释器依旧有 GIL，部分 C 扩展会重新启用 GIL，所以目前生产中的结论不变。
    oral: |
      GIL 是 CPython 的全局解释器锁，同一进程同一时刻只有一个线程跑 Python 字节码，但等 I/O 时会释放。AI 后端绝大部分时间在等模型和数据库，所以 GIL 影响不大，用 async 一个进程就能挂住几百个请求；再用多个 worker 进程吃满多核。CPU 重的活，比如 PDF 解析，我放到任务队列里。
      要小心的是在 async 函数里调同步库，会把整个事件循环卡住，我在代码审查里专门查这个。
      顺便说一下现状：3.14 起无 GIL 构建已经官方支持，但还是可选的，默认版本仍然有 GIL。
  - id: d50-i2
    kp: d50-k3
    type: oral
    difficulty: 3
    category: llm
    question: 以一次「带工具调用、要求 JSON 输出、流式返回」的 LLM API 调用为例，讲讲 Token、上下文窗口、温度、Function Calling、结构化输出、流式响应和错误处理分别在哪里起作用。
    key_points:
      - {text: "说明输入 Token 包含 System、历史、资料和工具定义，受上下文窗口限制并决定成本与 TTFT", dim: concept}
      - {text: "说明 Function Calling 是模型生成调用意图和参数，应用执行后回传结果，可能多轮", dim: principle}
      - {text: "说明结构化输出用 Schema 约束并用 Pydantic 校验，失败要有重试或降级", dim: engineering}
      - {text: "说明温度对确定性的影响，以及流式用 SSE 降低感知延迟", dim: concept}
      - {text: "说明超时、429 退避重试、max_tokens 截断等错误处理", dim: engineering}
    reference: |
      ① Token 与上下文窗口：一次请求的输入 = System Prompt + 历史消息 + 检索资料 + 工具定义（工具的 JSON Schema 同样占 Token）+ 用户问题；输入加输出不能超过上下文窗口。输入越长，成本越高、TTFT 越长，所以要有 Token 预算和历史截断（Day 13）。
      ② 温度：控制采样随机性，工具调用和 JSON 输出场景用低温度提高稳定性（Day 16）。
      ③ Function Calling：请求中声明工具，模型返回「要调用哪个工具、参数是什么」，应用校验参数、执行、把结果作为工具消息回传，模型再决定继续调用还是作答，这是一个循环（Day 18、33）。
      ④ 结构化输出：用 JSON Schema 约束最终回答格式，应用侧用 Pydantic 校验，失败时带错误信息重试一次或降级（Day 19）。
      ⑤ 流式：stream 模式下逐块返回 Token，服务端转成 SSE 推给前端，显著降低用户感知延迟；工具调用参数在流中也是分块到达的，需要拼接完整再解析（Day 17、43）。
      ⑥ 错误处理：设置合理超时；对 429 和 5xx 做带抖动的指数退避且只在一层重试；检查结束原因，长度截断导致 JSON 不完整时要处理；记录 usage 用于成本统计（Day 20）。
    oral: |
      我按请求的生命周期讲。发出去之前，System、历史、资料、工具定义和问题都算输入 Token，要在上下文窗口内，也直接决定成本和首 Token 时间，所以我们有 Token 预算。参数上，工具调用和 JSON 场景温度设低。
      模型返回时，如果要调工具，它只给出工具名和参数，我们校验后执行，再把结果回传，可能来回几轮。最终回答用 JSON Schema 约束，再用 Pydantic 校验，失败就带着错误重试一次。
      全程用流式，转成 SSE 推给前端；注意工具参数在流里是分块到的，要拼完整再解析。错误处理上有超时、429 退避、只在一层重试，还要检查是不是因为长度被截断导致 JSON 不完整。
  - id: d50-i3
    kp: d50-k3
    type: oral
    difficulty: 3
    category: rag
    question: 用户反馈你的 RAG 系统「回答错了」。请系统地讲你的排查方法，以及对应的优化手段。
    key_points:
      - {text: "先定位是检索问题还是生成问题：查看 Trace 中检索到的片段是否包含正确答案", dim: principle}
      - {text: "检索侧排查：文档是否入库与解析正确、切片、Embedding、Top-K、权限过滤、版本", dim: engineering}
      - {text: "检索优化：混合检索、Query Rewrite、Rerank、Metadata Filter", dim: engineering}
      - {text: "生成侧排查与优化：Prompt 约束、引用要求、上下文过长或冲突、忠实度", dim: engineering}
      - {text: "把案例加入评估集，用检索与生成指标回归验证", dim: project}
    reference: |
      第一步分层定位：根据会话找到 Trace，看检索返回的片段。如果片段里根本没有正确答案，是检索问题；如果片段里有答案但回答错了，是生成问题。
      检索问题排查：① 文档是否已入库、解析是否正确（表格、扫描件常出问题）；② 切片是否把答案切断；③ 问题与文档用词差异大导致向量检索召回不到；④ Top-K 太小或 Rerank 排错；⑤ 权限或 Metadata 过滤过严；⑥ 新旧版本文档同时存在，检索到了旧版本。优化：混合检索（关键词 + 向量）、Query Rewrite、Rerank、按版本和时间的 Metadata Filter、调整切片策略（Day 23~27）。
      生成问题排查：Prompt 是否要求只依据资料、是否要求引用；资料中是否有相互冲突的内容；上下文是否过长导致关键信息被忽略；是否混入了模型自身知识（幻觉）。优化：强化指令与引用、减少无关片段、冲突时要求说明来源、低温度（Day 28）。
      最后：把这个案例和同类问题加入评估集，用检索命中率、Faithfulness 等指标验证修复，并在 CI 中回归（Day 29、48）。
    oral: |
      我第一步先分层：找到这次对话的 Trace，看检索回来的片段里有没有正确答案。没有，就是检索的问题；有但答错了，就是生成的问题。
      检索问题我会依次查：文档有没有正确入库和解析、答案有没有被切断、用户用词和文档差别大不大、Top-K 和 Rerank、权限过滤是不是太严、是不是检索到了旧版本。对应的手段是混合检索、问题改写、Rerank 和按版本过滤。
      生成问题就看 Prompt 有没有要求只依据资料和给出引用、资料之间有没有冲突、上下文是不是太长。
      最后一定把这个案例放进评估集。我们之前遇到新旧报销制度混淆，就是靠版本过滤加原子切换解决，然后用评估集验证的。
  - id: d50-i4
    kp: d50-k3
    type: oral
    difficulty: 4
    category: agent
    question: 你会在什么情况下用 Agent，什么情况下用固定工作流？如果用 LangGraph 做一个能操作企业系统的 Agent，你怎么保证它可控、可恢复、安全？MCP 在其中扮演什么角色？
    key_points:
      - {text: "说明取舍：步骤确定用工作流，步骤需要根据中间结果动态决定时用 Agent，可混合", dim: principle}
      - {text: "可控：状态图显式建模、recursion_limit、总超时、单工具超时、重复调用检测、Token 预算", dim: engineering}
      - {text: "可恢复：Checkpointer 持久化、interrupt 人工确认后同一 thread 恢复、工具幂等键、会话锁", dim: engineering}
      - {text: "安全：用户委托授权、最小权限工具、写操作确认、外部内容视为不可信、审计", dim: engineering}
      - {text: "MCP 作为标准化工具层：独立部署与授权，Agent 作为 Client 调用，传输与授权遵循规范", dim: concept}
    reference: |
      取舍：步骤固定、可预先画出流程的（如「上传 → 解析 → 审核 → 发布」）用工作流，可预测、成本低、好测试；只有当下一步需要根据中间结果动态决定（如排查问题需要视结果决定查哪个系统）时才用 Agent。实际常混合：整体是工作流，某个节点内部是受限的 Agent。
      可控：在 LangGraph 中把关键步骤建模为显式节点和条件边，而不是一个无限循环；设置 recursion_limit、整体超时、每个工具超时、重复调用检测和每会话 Token 预算（Day 37）。
      可恢复：生产用 PostgresSaver/AsyncPostgresSaver 持久化检查点；写操作前 interrupt 等待人工确认，确认后用同一 thread_id 恢复；有副作用的工具使用幂等键，防止恢复时重复执行；同一 thread 加锁避免并发推进（Day 36、49）。
      安全：工具以当前用户身份调用（委托授权），工具粒度最小化，不可逆操作人工确认；工具返回和外部文档中的文本视为不可信数据，防间接注入；校验 thread 归属；审计记录每次工具调用（Day 40、47）。
      MCP 的角色：把企业系统能力封装为标准化的工具服务，独立部署、独立授权、可被多个 Agent 复用；Agent 运行时作为 MCP Client 调用。远程场景使用 Streamable HTTP 传输，授权遵循规范中的 OAuth 2.1 流程，服务端校验 Token 受众；2026-07-28 版规范去掉了协议层会话，更易于水平扩展（Day 38、49）。
    oral: |
      我的原则是能用工作流就不用 Agent。步骤能提前画出来的就用工作流，只有下一步要根据中间结果临时决定的才用 Agent，而且常常是工作流里嵌一个受限的 Agent 节点。
      可控性靠显式的状态图加各种上限：步数、总超时、单工具超时、Token 预算。可恢复靠 Postgres 检查点，写操作前中断等人确认，确认后同一个 thread 继续；工具带幂等键，会话加锁。
      安全上，工具都用用户本人的授权，粒度尽量小，工具返回的内容当作不可信数据。
      MCP 是我们的工具层，把工单、OA 这些能力做成独立服务，Agent 作为客户端去调，授权按规范走 OAuth。新版规范去掉了协议层会话，扩容也更方便。
  - id: d50-i5
    kp: d50-k2
    type: oral
    difficulty: 4
    category: architecture
    question: 请完整介绍一个你最有代表性的 AI 项目。介绍完后，面试官会追问：最难的问题是什么？效果怎么衡量的？如果重做会改什么？
    key_points:
      - {text: "按背景、架构、难点、数据、反思五段式组织，3 分钟内讲完", dim: project}
      - {text: "架构部分给出关键选型及理由与代价", dim: principle}
      - {text: "难点按现象、分析、方案、验证展开，体现个人判断", dim: project}
      - {text: "数据可解释来源，如评估集构建方式、压测条件，不夸大", dim: engineering}
      - {text: "反思具体且有改进方案，体现成长性", dim: engineering}
    reference: |
      参考结构（企业知识库 + 办事助手）：
      背景：3000 名员工查制度要翻多个 PDF，服务台约一半工单是重复问题；目标是按部门权限回答并给出处，同时能查询工单进度。
      架构：FastAPI 异步服务 + PostgreSQL/pgvector + Redis + 异步入库 Worker + LangGraph Agent + MCP 工单服务 + SSE 流式 + OpenTelemetry。选 pgvector 是因为权限过滤与文档删除需要与业务数据事务一致，规模在两百万向量以内；代价是超大规模时不如专用库。
      最难的问题：部门权限隔离。现象是测试时跨部门检索到文档；分析发现原方案是检索后过滤，片段已进入上下文和缓存；方案是权限条件写进检索 SQL、数据库 RLS 兜底、缓存 key 加入权限范围、评估集加入跨部门探测用例；验证是探测用例全部通过并纳入 CI。
      效果衡量：评估集约 300 条（日志抽样 + 专家编写 + 安全用例），基于参考要点的 LLM 评审并经过人工校准，通过率从约 78% 提升到 89%；回放压测下问答 P95 约 4 秒；服务台同类工单两个月内约减少三分之一（工单系统统计，非严格 A/B）。
      反思：评估集建得太晚，前期优化靠感觉；Trace 埋点不统一，排查慢请求费时；重做会第一周建评估集、统一用 OpenTelemetry 埋点，并更早设计租户预算。
    oral: |
      我介绍一下企业知识库加办事助手这个项目。背景是三千名员工查制度很难，服务台一半工单是重复问题。
      架构是 FastAPI 异步服务、Postgres 加 pgvector、Redis、异步入库、LangGraph Agent 和一个 MCP 工单服务。选 pgvector 是因为部门权限过滤和文档删除需要跟业务数据在同一个事务里。
      最难的是权限隔离。一开始是检索完再过滤，测试时发现片段已经进了上下文和缓存。我改成权限写进检索 SQL，数据库加行级安全兜底，缓存 key 加权限范围，再加跨部门探测用例放进 CI。
      效果上，我们有三百条左右的评估集，通过率从 78% 提到 89%，P95 大约四秒，服务台同类工单两个月少了约三分之一，这个是工单系统统计的，不是严格 A/B。
      如果重做，我会第一周就建评估集，前期很多优化其实是凭感觉做的。
