      ## 解析要求
      - vitest：读 `out_dir/vitest.json`；遍历 testResults[]，文件路径去掉 `/app/work/` 前缀；每个 assertionResults 生成 TestCase；status 为 failed 的生成 CheckError（rule 用用例 fullName，message 取 failureMessages 第一条的第一行）。某个测试文件整体失败（例如 import 报错）且没有 assertionResults 时，也生成一条 CheckError。报告文件不存在 → infra_error。
      - eslint：读 `out_dir/eslint.json`；只收集 severity 为 2 的消息作为错误；ok 由「错误数为 0」判断。
      - typecheck：正则 `^(.+?)\((\d+),(\d+)\): error (TS\d+): (.+)$`；退出码非 0 但解析不到错误 → infra_error。
      - 退出码 125/126/127 一律 infra_error。

      ## CI 要求（.github/workflows/ci.yml）
      - 触发：push、pull_request。job 1：安装 uv，`uv run pytest -m "not docker"`。job 2：安装 Node 22，在 fixtures/vue-demo 构建沙箱镜像，再跑 `uv run pytest -m docker`。
      - 不在 CI 里调用真实模型。

      ## 验收标准
      - 在 fixture 里故意写一个类型错误，`run_check("typecheck")` 返回 ok=False，errors 里文件、行号、TS 错误码都正确。
      - 故意让一个 vitest 用例失败，结果里能看到用例全名和失败信息首行。
      - 检查前后宿主仓库 `git status` 没有任何新增文件。
      - 本地 `uv run pytest` 全绿；有 Docker 的机器上 `uv run pytest -m docker` 也全绿。
