      2. `compact.py`：实现两级压缩，每次压缩写一条 `compaction` 事件（level、压缩前后估算 Token）。摘要调用失败时只保留第一级结果并记录 warning，任务继续。
      3. `skills.py`：SKILL.md 文件头是 `---` 包围的 YAML，含 `name`、`description`；system 里只列「name：description」；`load_skill(name)` 返回全文，名字不存在返回 ERROR 并列出可用技能。两个示例 SKILL.md 你来写：一个写 Vue SFC 规范（script setup + TS、props 用类型声明、emit 必须声明、不直接改 props），一个写 @vue/test-utils + vitest 的组件测试写法。
      4. 在 m1 的循环里接入：任务开始时组装上下文（system 补充 = AGENTS.md + 技能目录 + repo map + 文件树，总预算默认 6000 Token），每次调模型前调用 `compact`。

      ## 验收标准
      - `uv run pytest` 全绿，不调用真实模型（摘要用 FakeLLM）。
      - 在 fixtures/vue-demo 里问「哪个组件 emit 了 update:modelValue」，事件日志显示模型先调用 search 再 read_file，而不是逐个文件读。
      - 构造 60 步长对话后触发压缩，压缩后估算 Token 低于阈值。

      ## 必须写的测试
      - `test_search.py`：有匹配 / 无匹配（退出码 1）/ 正则错误（退出码 2）/ pattern 以 `-` 开头 / rg 不存在（monkeypatch subprocess.run 抛 FileNotFoundError）。
