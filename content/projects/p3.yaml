        **两层循环**：内层是 m1 的 Agent 循环，模型在一轮里自主读文件、搜索、修改。外层由 Harness 控制：每轮结束**强制**在沙箱里跑 typecheck、lint、test，因为模型常常没测试就宣布完成。失败时只把精简反馈（最多十几条错误）交给下一轮，任务原文仍在对话开头。

        **停止**：判定顺序是通过 → 环境错误（修代码没用）→ 无进展（失败签名和上一轮一样；签名是失败项集合的哈希，不含行号，因为行号随编辑漂移）→ 超 Token 预算 → 超最大轮次。每种都有明确的结束状态和报告。

        **防作弊**：测试文件、eslint/tsconfig/vitest 配置、package.json 在工具层写保护；每轮再用 git diff 复核；新增 ts-ignore 或 eslint-disable 直接判失败。

        **恢复**：每轮先判定状态，再原子写 messages.json、patch.diff、state.json（临时文件 + os.replace，state 最后写作为提交点）。resume 时读 state，已结束就退出；比较当前 git diff 与 patch.diff，不一致先让用户确认；然后恢复 messages，从下一轮继续。恢复粒度是轮，因为轮内只有本地编辑；以后加有外部副作用的工具要配幂等键。
      oral: |
        我的修复循环分两层：模型在内层自己读和改，外层由我强制跑类型检查、lint 和测试，因为模型很容易没测就说做完了。停止条件全写在代码里：通过、环境错误、两轮失败签名一样、超预算、超轮次。签名故意不含行号，避免假进展。防作弊靠测试和配置写保护、git diff 复核和禁止 ts-ignore。每轮原子写 checkpoint，state 最后写，崩了能 resume 从下一轮接着跑。

  - id: p3-m5
    name: "PR 审查子 Agent + 20 任务评测集"
    unlock_day: 48
    minutes: 90
    features:
      - "审查子 Agent：只读工具集、独立上下文；输入 git diff，输出结构化审查意见（Pydantic 校验，失败重试一次）"
      - "降噪：只保留落在改动行附近、置信度达标的意见，并去重"
      - "主 Agent 编排：修复循环通过后调用审查子 Agent，blocker 级问题触发一轮额外修复"
      - "评测集：20 个组件级任务（YAML），每个任务带隐藏测试（FAIL_TO_PASS）+ 原有检查（PASS_TO_PASS）"
      - "任务质量校验：基准代码上隐藏测试必须失败，应用参考答案后必须全部通过"
      - "评测运行器：每个任务在全新副本里跑，统计通过率、平均轮次、Token、耗时、失败归类，输出 report.json 和 Markdown 报告"
      - "审查评测：埋点缺陷 diff 统计召回，干净 diff 统计误报"
    goal: |
      两件事：
      1. 写一个**只读的审查子 Agent**：输入 PR diff，输出结构化、只针对改动行的审查意见；主 Agent 在修复通过后调用它。
      2. 建一个**20 个组件级任务的评测集**：像 SWE-bench 一样用隐藏测试判定是否解决，产出能写进简历、经得起追问的报告。

      做完你能回答：**「子 Agent 怎么编排」「你的通过率怎么测出来的、为什么可信」**。
    design: |
      **Part 1：审查子 Agent**

      **为什么做成子 Agent**
      - 审查要读很多上下文（被改组件的使用方、类型定义、相关测试）。放在主 Agent 里做，会把主上下文塞满。
      - 子 Agent 用**独立上下文**深挖，只把精简结论回传。Anthropic 上下文工程文章的描述是：子 Agent 可能用掉几万 Token 探索，但只返回约 1000~2000 Token 的总结。Claude Code 的 subagent 也是独立上下文窗口，结束时把摘要交回主对话。
      - **权限最小化**：子 Agent 只注册 `read_file / search / list_dir`，没有编辑和运行检查的能力。

      **输出结构**

      | 字段 | 取值 |
      |---|---|
      | file / line | 新版本文件中的位置 |
      | severity | blocker / major / minor / nit |
      | category | bug / type / reactivity / a11y / security / perf / style |
      | message / suggestion | 问题说明 / 修改建议 |
      | confidence | 0~1 |

      **Vue 专项检查清单**（写进审查 prompt，这是你的前端经验变成产品能力的地方）
      - 直接修改 props；把 props 或 reactive 对象解构后丢失响应式（Vue 3.5 起 `defineProps` 解构在编译时保持响应式，要看项目的 Vue 版本，以官方文档为准）
      - `v-for` 没有 key，或列表会重排时用 index 做 key；`v-if` 和 `v-for` 写在同一元素上
      - `onMounted` 里加的监听、定时器没有在 `onUnmounted` 清理；watch 的副作用没清理
      - `v-html` 渲染了未转义的用户内容（XSS）
      - emit 的事件没在 `defineEmits` 声明；用 `any` 绕过类型
      - 可访问性：图标按钮没有可读名称，图片没有 alt

      **降噪**（误报多了开发者会直接无视，审查 Agent 就失去价值）
      - 只保留落在**改动行 ±3 行**内的意见（解析 diff 的 hunk 得到新增行号）。
      - 置信度低于 0.6 的丢弃；同文件、同类别、同一行的去重。

      **编排**：修复循环 passed → 调用审查子 Agent → 有 blocker 就把它作为反馈再跑**一轮**修复（只此一次，防止审查和修复互相拉扯）→ 最终报告附审查意见。也可单独使用：`vca review --base main`。

      **Part 2：评测集（借鉴 SWE-bench）**
      - SWE-bench 的做法：每个样本有问题描述和基准提交；**测试对 Agent 不可见**；评测时应用补丁，跑 FAIL_TO_PASS（修复前失败、修复后应通过）和 PASS_TO_PASS（修复前后都应通过）两组测试，**全部通过才算 resolved**；没跑到的测试按失败算。主指标是 resolved 百分比。
      - 我们的映射：隐藏测试 = FAIL_TO_PASS；fixture 原有测试 + typecheck + lint = PASS_TO_PASS；另外加一条「没有改受保护文件」。

      **20 个任务的分布**

      | 类别 | 数量 | 例子 |
      |---|---|---|
      | props / emit 契约 | 4 | 给分页组件加 pageSize，切换时 emit update:pageSize 并把当前页重置为 1 |
      | v-model / defineModel | 2 | 把自定义输入框改成支持 v-model |
      | 响应式与 computed / watch | 3 | 修复搜索框防抖 watch 没有清理定时器 |
      | 插槽与组合 | 2 | 给卡片组件加具名插槽 header，并提供默认内容 |
      | composable 抽取 | 2 | 把列表分页逻辑抽成 usePagination |
      | Pinia store | 2 | 购物车 store 增加数量上限和合计 getter |
      | 表单校验 | 2 | 手机号格式和必填校验，并显示错误信息 |
      | 类型修复 | 2 | 消除 any、补全 props 类型，让 vue-tsc 通过 |
      | 可访问性 | 1 | 图标按钮加 aria-label，并支持键盘操作 |

      **任务入库前的质量校验**（SWE-bench 构建数据集时也会筛掉没有 fail-to-pass 测试的样本）
      - 基准代码上，隐藏测试必须**失败**（否则任务不需要做任何事）。
      - 应用你写的参考答案后，隐藏测试 + 原有检查必须**全部通过**（否则测试本身有问题）。

      **指标**
      - 主指标：resolved 率。辅助：平均轮次、平均 Token、平均耗时、结束状态分布、失败归类（理解错需求 / 类型错误 / 改坏旧功能 / 无进展 / 环境问题）。
      - 可选 pass@k：每题跑 k 次（见 Day 42）。
      - 审查评测：10 个埋了已知缺陷的 diff + 5 个干净 diff；召回 = 找到的埋点缺陷 / 全部埋点；误报 = 干净 diff 上的 blocker 和 major 数量。
      - **诚实**：20 题样本小，波动大。报告写清样本数、模型名、日期、每题跑几次。

      ```mermaid
      flowchart TD
        A["读取 tasks 目录下 20 个任务 YAML"] --> B["为每个任务创建全新副本 git worktree"]
        B --> C["运行修复循环 Agent 看不到隐藏测试"]
        C --> D["拷入隐藏测试"]
        D --> E["沙箱跑 typecheck lint test"]
        E --> F{"隐藏测试全部通过 FAIL_TO_PASS"}
        F -- 否 --> X["unresolved 记录失败归类"]
        F -- 是 --> G{"原有测试 类型 lint 全部通过 且未改受保护文件 PASS_TO_PASS"}
        G -- 否 --> X
        G -- 是 --> Y["resolved"]
        X --> H["汇总 report.json 与 Markdown 报告"]
        Y --> H
      ```
    data_flow: |
      **审查**：`git diff base...HEAD` → `changed_lines()` 解析出每个文件的新增行号 → 子 Agent（只读工具、独立 messages）读 diff 并按需查看上下文 → 输出 JSON → `Review.model_validate_json` 校验（失败把错误回传重试一次）→ `keep_finding()` 过滤 → 去重 → 返回给主 Agent 或打印成报告。

      **评测**：读取任务 YAML → 从 fixture 的基准提交创建全新工作副本 → 跑修复循环（`--yes` 自动审批，记录轮次、Token、耗时）→ 拷入隐藏测试 → 沙箱跑三项检查 → `grade()` 算出 fail_to_pass 和 pass_to_pass → 写入 TaskOutcome → 全部跑完 `summarize()` 生成 report.json 和 report.md。
    key_code: |
      **① 解析 diff 得到改动行，过滤审查意见**

      ```python
      # src/vca/review/diff.py
      import re

      HUNK = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@")

      def changed_lines(diff: str) -> dict[str, set[int]]:
          out: dict[str, set[int]] = {}
          path: str | None = None
          lineno = 0
          for raw in diff.splitlines():
              if raw.startswith("+++ "):
                  target = raw[4:].strip()
                  path = None if target == "/dev/null" else target.removeprefix("b/")
                  if path:
                      out.setdefault(path, set())
              elif raw.startswith(("--- ", "diff --git", "index ", "\\")):
                  continue
              elif m := HUNK.match(raw):
                  lineno = int(m.group(1))
              elif path is None:
                  continue
              elif raw.startswith("+"):
                  out[path].add(lineno)
                  lineno += 1
              elif raw.startswith("-"):
                  continue                      # 删除的行在新文件里不存在，不推进行号
              else:
                  lineno += 1                   # 上下文行
          return out

      def keep_finding(f, changed: dict[str, set[int]], min_conf: float = 0.6, slack: int = 3) -> bool:
          lines = changed.get(f.file)
          if not lines or f.confidence < min_conf:
              return False
          return any(abs(f.line - n) <= slack for n in lines)
      ```

      - hunk 头 `@@ -旧起始,旧行数 +新起始,新行数 @@` 里的**新起始行号**是计数起点；新增行和上下文行推进行号，删除行不推进。
      - 删除的文件（`+++ /dev/null`）没有新行号，直接跳过。
      - 已知简化：新增行内容恰好以 `++ ` 开头时会被误认为文件头。更稳的做法是按 hunk 头里的行数计数，面试可以主动提这个取舍。
      - `keep_finding` 是降噪核心：模型很爱评论没改动的老代码，开发者会觉得「跟我这次 PR 无关」。

      **② 评测判定：FAIL_TO_PASS + PASS_TO_PASS**

      ```python
      # src/vca/eval/grade.py
      from collections import Counter
      from dataclasses import dataclass

      @dataclass
      class TaskOutcome:
          task_id: str
          resolved: bool
          fail_to_pass: bool
          pass_to_pass: bool
          status: str            # 修复循环的结束状态
          rounds: int
          tokens: int
          seconds: float
          category: str | None = None   # 失败归类

      def grade(hidden: set[str], test, others: list, touched: list[str]) -> tuple[bool, bool]:
          passed = {t.file for t in test.tests if t.status == "passed"}
          failed = {t.file for t in test.tests if t.status == "failed"}
          f2p = hidden <= passed and not (hidden & failed)     # 隐藏测试必须真的跑到且全部通过
          p2p = (not (failed - hidden)                          # 原有测试一个都不能挂
                 and all(r.ok for r in others)                  # typecheck、lint 也要过
                 and not test.infra_error
                 and not touched)                               # 没动受保护文件
          return f2p, p2p

      def summarize(outcomes: list[TaskOutcome]) -> dict:
          n = len(outcomes)
          solved = [o for o in outcomes if o.resolved]
          return {
              "total": n,
              "resolved": len(solved),
              "resolved_rate": round(len(solved) / n, 3) if n else 0.0,
              "avg_rounds_resolved": round(sum(o.rounds for o in solved) / len(solved), 2) if solved else None,
              "avg_tokens": round(sum(o.tokens for o in outcomes) / n) if n else 0,
              "by_status": dict(Counter(o.status for o in outcomes)),
              "by_category": dict(Counter(o.category or "unlabeled" for o in outcomes if not o.resolved)),
          }
      ```

      - `hidden <= passed`：集合「是子集」判断。**没跑到的隐藏测试也算失败**（和 SWE-bench 一样），防止 Agent 把测试文件弄得加载不了却被算成「没有失败」。
      - 只统计 `status == "failed"` 为失败：原仓库里被 skip 的用例不应该拖累结果。
      - 隐藏测试在修复循环**结束后**才拷进去，Agent 全程看不到，所以不可能「对着答案改」。
      - `avg_rounds_resolved` 只在成功任务上算，失败任务的轮次被上限截断，混在一起会失真。
    ai_prompt: |
      # 任务：实现 PR 审查子 Agent 与评测运行器（在 m1~m4 基础上修改）

      ## 目标
      1. `vca review --base main`：审查当前分支相对 base 的 diff，输出结构化意见（终端表格 + JSON 文件）。
      2. 修复循环通过后自动调用审查子 Agent；有 blocker 时追加一轮修复（最多一次）。
      3. `vca eval --tasks evals/tasks --runs 1`：跑评测集，输出 `evals/results/<时间戳>/report.json` 和 `report.md`。

      ## 约束
      - 审查子 Agent 复用 m1 的循环，但用**新的 messages** 和**只读工具注册表**（read_file、search、list_dir），最多 12 步。
      - 输出用 Pydantic 定义 `Finding(file, line, severity, category, message, suggestion, confidence)` 和 `Review(summary, findings)`；请求时使用 `response_format={"type": "json_object"}`（DeepSeek、通义等兼容接口支持 JSON 模式；如果用 OpenAI 官方模型，可改用 json_schema 结构化输出，以官方文档为准）。解析前去掉可能的 markdown 代码块包裹；校验失败把错误信息发回去重试一次，再失败返回空结果并记录事件。
      - 审查 prompt 里写入 Vue 专项检查清单（直接改 props、解构丢响应式、v-for key、v-if 与 v-for 同元素、未清理的监听和定时器、v-html、未声明的 emit、any、可访问性），并要求「只评论本次改动引入的问题」。
      - 评测时 Agent 绝对不能看到隐藏测试：隐藏测试放在 `evals/tasks/<id>/hidden/`，修复循环结束后才拷进工作副本。
      - 每个任务用 `git worktree add` 从 fixture 的基准提交创建全新副本，跑完删除；任务之间互不影响。

      ## 任务 YAML 格式（evals/tasks/<id>/task.yaml）
      ```yaml
      id: t07-pagination-page-size
      category: props-emit
      prompt: 给 src/components/BasePagination.vue 增加 pageSize 属性和每页条数下拉框，切换时 emit update:pageSize，并把当前页重置为 1
      hidden_tests:
        - src/components/__tests__/BasePagination.hidden.spec.ts
      max_rounds: 4
      ```
      同目录下 `hidden/` 放隐藏测试，`solution.patch` 放参考答案。

      ## 文件结构（新增）
      ```
      src/vca/review/
        diff.py        # changed_lines、keep_finding、dedupe
        models.py      # Finding、Review
        prompts.py     # REVIEW_SYSTEM（含 Vue 检查清单）
        reviewer.py    # review(diff, llm, ws) -> Review
      src/vca/eval/
        tasks.py       # 加载任务 YAML；validate_task：基准上隐藏测试必须失败、应用 solution.patch 后必须全部通过
        runner.py      # run_task、run_all（串行即可），记录耗时、Token、轮次
        grade.py       # TaskOutcome、grade、summarize
        report.py      # 生成 report.md：总表、按类别通过率、失败任务列表与归类、模型名、日期、样本数
      evals/
        tasks/         # 先写 5 个任务跑通流程，再补到 20 个
        review_cases/  # 审查评测：bad_*.diff（附 expected.yaml 标注缺陷文件和行）与 clean_*.diff
      tests/
        test_diff.py  test_grade.py  test_reviewer.py  test_eval_runner.py
      ```

      ## 验收标准
      - `uv run vca eval --validate-only` 能对每个任务执行质量校验，并列出不合格的任务。
      - `uv run vca eval` 跑完后生成 report.md，含总通过率、按类别通过率、失败归类、模型名、日期、样本数。
      - `uv run vca review --base main` 在一个故意写了 v-for 无 key 和直接修改 props 的分支上，能给出对应意见。
      - 单元测试全部用 FakeLLM / FakeSandbox，不调用真实模型。

      ## 必须写的测试
      - `test_diff.py`：新增文件、删除文件、多个 hunk、只删不增、末尾 `\ No newline at end of file` 这五种 diff，行号都正确。
      - `test_grade.py`：隐藏测试没跑到 → f2p=False；原有测试失败 → p2p=False；lint 失败 → p2p=False；改了受保护文件 → p2p=False；全部通过 → 两者都为 True；summarize 在 0 个任务时不报除零错误。
      - `test_reviewer.py`：FakeLLM 返回不合法 JSON 后再返回合法 JSON → 成功解析；落在未改动行的意见被过滤；置信度 0.5 的意见被过滤。
      - `test_eval_runner.py`：用 FakeSandbox 跑 2 个任务，断言隐藏测试是在修复循环结束后才拷入工作副本的（比如记录拷贝时间和修复循环结束时间）。
    tests:
      functional:
        - "vca review --base main：在故意写了 v-for 无 key、直接修改 props 的分支上给出对应意见"
        - "vca eval --validate-only：能找出「基准上隐藏测试已通过」或「参考答案也过不了」的坏任务"
        - "vca eval 跑完 20 个任务，生成 report.md，含总通过率、分类通过率、失败归类、模型名、日期、样本数"
        - "修复循环通过后自动调用审查子 Agent；有 blocker 时追加一轮修复，且最多一次"
      api:
        - "Finding 字段：file、line、severity（blocker/major/minor/nit）、category、message、suggestion、confidence"
        - "report.json 字段：total、resolved、resolved_rate、avg_rounds_resolved、avg_tokens、by_status、by_category"
        - "任务 YAML 字段：id、category、prompt、hidden_tests、max_rounds；同目录 hidden/ 与 solution.patch"
        - "审查子 Agent 的工具注册表里只有 read_file、search、list_dir"
      exception:
        - "审查模型返回不合法 JSON：重试一次；再失败返回空结果并记录事件，主流程不中断"
        - "diff 为空：直接返回「没有改动」，不调用模型"
        - "某个任务运行中抛异常：该任务记为 error 并继续跑下一个，最后报告里列出"
        - "worktree 创建失败或残留：运行前清理同名 worktree，运行后无论成功失败都删除"
      review:
        - "能解释 FAIL_TO_PASS 和 PASS_TO_PASS 各自证明什么，为什么没跑到的测试算失败"
        - "能说出为什么隐藏测试必须在修复循环结束后才拷入"
        - "能说出审查子 Agent 为什么只读、为什么用独立上下文"
        - "检查报告里写明了样本数、模型名、日期、每题跑几次"
        - "能主动说出 changed_lines 的已知简化和更稳的做法"
    retell:
      id: p3-m5-r1
      type: oral
      category: eval
      question: "讲清楚两件事：你的 PR 审查为什么做成子 Agent、怎么降噪？你的评测集怎么判定一个任务「解决了」，为什么这个结果可信？"
      difficulty: 3
      key_points:
        - {text: "子 Agent 用独立上下文和只读工具深挖，只回传结构化精简结论，避免撑爆主上下文且权限最小", dim: principle}
        - {text: "降噪：只保留改动行附近、置信度达标的意见并去重；Vue 专项清单提升有效问题比例", dim: engineering}
        - {text: "判定借鉴 SWE-bench：隐藏测试 FAIL_TO_PASS 全过 + 原有测试与类型、lint PASS_TO_PASS 全过 + 未改受保护文件", dim: principle}
        - {text: "可信性：隐藏测试对 Agent 不可见、任务入库前做双向校验、每任务全新副本、报告写明样本数和模型", dim: project}
      reference: |
        **审查子 Agent**：审查要读很多上下文，比如被改组件的使用方、类型定义。如果放在主 Agent 里，主上下文会被塞满。所以我让它在独立的 messages 里运行，只注册 read_file、search、list_dir 三个只读工具，最后只回传结构化的 Finding 列表。这就是 Anthropic 说的子 Agent 架构：子 Agent 深挖，主 Agent 只拿总结。降噪方面：解析 diff 的 hunk 得到新增行号，只保留落在改动行 ±3 行内、置信度 ≥0.6 的意见，再去重；prompt 里写了 Vue 专项清单，比如直接改 props、v-for 缺 key、未清理的监听。

        **评测判定**借鉴 SWE-bench：每个任务有隐藏测试，修复循环结束后才拷进去。隐藏测试必须真的跑到且全部通过（FAIL_TO_PASS）；原有测试、vue-tsc、eslint 也必须全部通过（PASS_TO_PASS）；并且不能改受保护文件。两组都过才算 resolved。

        **为什么可信**：Agent 看不到隐藏测试；每个任务入库前做双向校验——基准代码上隐藏测试必须失败、参考答案上必须通过；每个任务都在全新的 git worktree 里跑；报告写清样本数、模型、日期和运行次数，不夸大 20 个样本的结论。
      oral: |
        审查我做成了子 Agent：独立上下文、只有只读工具，深挖完只回传结构化意见，不污染主上下文。为了不让开发者烦，我只保留改动行附近、置信度够高的意见。评测借鉴 SWE-bench：隐藏测试在修复结束后才拷进去，必须全过；原有测试、类型检查、lint 也必须全过，并且没改测试文件，才算解决。每个任务入库前我都验证过：基准上会失败，参考答案能通过。

  - id: p3-m6
    name: "交付与包装：Web 面板、README、演示与面试材料"
    unlock_day: 49
    minutes: 90
    features:
      - "Web 面板：FastAPI + SSE 推送事件时间线；Vue3 页面展示步骤、diff、检查结果，按钮审批"
      - "跨线程审批：WebApprover 用 threading.Event 等待，超时按拒绝（fail closed）"
      - "会话回放：面板读 events.jsonl，任何历史会话都能重新播放；断线重连按 Last-Event-ID 续传"
      - "安全默认值：只监听 127.0.0.1，会话 ID 正则校验防路径穿越"
      - "README：一句话介绍、架构图、快速开始、安全模型、评测结果表（用你的评测结果填写）、局限与下一步"
      - "演示与求职材料：3 分钟录屏脚本、简历条目、面试讲稿"
    goal: |
      把项目变成**面试官 3 分钟能看懂、你 10 分钟能讲透**的作品：一个能实时看执行过程、在网页上审批 diff 的 Vue3 面板；一份带架构图和评测结果的 README；一段演示录屏；简历条目和讲稿。

      Web 面板是你的主场：前端经验 + Agent 运行时，正好对上 JD 里的「会话回放、事件重放、调试面板」。
    design: |
      **为什么要做 Web 面板**
      - 发挥前端优势，面试演示比终端直观得多。
      - 对应 Harness 岗位 JD 的「会话回放、事件重放、调试面板」。
      - 审批在网页上做更自然，也为「多人协作的 Agent 平台」留出扩展空间。

      **后端接口（FastAPI）**

      | 接口 | 作用 |
      |---|---|
      | `POST /api/sessions` `{task, repo}` | 后台线程启动修复循环，返回 sid |
      | `GET /api/sessions` | 历史会话列表（扫描 .vca/sessions） |
      | `GET /api/sessions/{sid}/events` | SSE：按行推送 events.jsonl；`id:` 为行号 |
      | `POST /api/approvals/{aid}` `{approved}` | 提交审批结果 |

      **关键设计**
      - **单一事实来源**：CLI、Web、评测都读写同一个 `events.jsonl`。面板只是「渲染事件流」，所以历史会话天然可以回放，不需要额外存储。
      - **断线续传**：SSE 每条消息带 `id:`（行号）。浏览器的 EventSource 断线后会自动重连，并在请求头里带上 `Last-Event-ID`，后端从那一行之后继续推。
      - **跨线程审批**：Agent 在工作线程里**同步**运行；`WebApprover` 写一条 `approval_required` 事件后用 `threading.Event.wait(timeout)` 阻塞；HTTP 请求到来时 `resolve()` 唤醒它。超时（默认 10 分钟）按拒绝处理。请求和结果都写进事件日志，可审计。
      - **安全默认值**：只监听 127.0.0.1（面板没有登录，绝不能暴露到局域网）；sid 用正则校验，防止 `../` 读到其他目录；要给团队用时再加 Day 46 的 JWT 和 RBAC。

      **前端页面（Vue3 + Vite）**
      - 左侧：会话列表（状态徽标：running / passed / max_rounds…）。
      - 中间：时间线，assistant、tool、check_result、compaction、approval 事件用不同颜色；长输出默认折叠。
      - 右侧：diff 查看（可用 diff2html，或自己按 `+`/`-` 行着色）+ 同意 / 拒绝按钮。
      - 顶部：当前轮次、累计 Token、结束状态。

      ```mermaid
      sequenceDiagram
        participant B as 浏览器 Vue3
        participant API as FastAPI
        participant W as 工作线程 修复循环
        participant L as events.jsonl
        B->>API: POST /api/sessions
        API->>W: 启动线程
        API-->>B: sid
        B->>API: GET events SSE
        W->>L: 追加事件
        API->>L: 轮询新行
        API-->>B: id 行号 data 事件
        W->>L: approval_required 含 diff
        W->>W: Event.wait 阻塞 最多 10 分钟
        API-->>B: 推送审批事件
        B->>API: POST /api/approvals 同意
        API->>W: resolve 唤醒
        W->>L: approval_resolved
      ```

      **交付物清单**

      | 交付物 | 内容 |
      |---|---|
      | README.md | 一句话、架构图、30 秒快速开始、安全模型表、评测结果表、局限与下一步 |
      | docs/eval-report.md | m5 生成的报告 + 你的失败归类分析 + 一次「改动前后对照」 |
      | demo 录屏（3 分钟） | 提任务 → 时间线滚动 → 审批 diff → 检查失败 → 自动修复 → 通过 → 审查意见 |
      | 简历条目 / 面试讲稿 | 见本项目 resume 与 materials |
    data_flow: |
      1. 浏览器 `POST /api/sessions` → 后端校验 repo 路径 → 生成 sid → 在新线程里运行 `fix_loop`，审批器用 `WebApprover`。
      2. 浏览器用 EventSource 连接 `/api/sessions/{sid}/events`；后端从 `Last-Event-ID`（没有则从 0）开始读 events.jsonl，逐行推送，没有新行就每 0.3 秒轮询一次。
      3. 工作线程需要写文件时：WebApprover 写 `approval_required` 事件（含 aid 和 diff）→ 阻塞等待。
      4. 前端收到事件，显示 diff 和按钮 → 用户点击 → `POST /api/approvals/{aid}` → `resolve()` 唤醒工作线程 → 写 `approval_resolved` 事件 → 工具继续执行。
      5. 会话结束写 `stop` 事件；SSE 推送完所有行后发 `event: end`，前端关闭连接。打开历史会话时走同一流程，就是回放。
    key_code: |
      **① 跨线程审批：阻塞等待 + 超时拒绝**

      ```python
      # src/vca/web/approver.py
      import threading
      import uuid

      class WebApprover:
          def __init__(self, store, timeout: float = 600) -> None:
              self.store = store
              self.timeout = timeout
              self._lock = threading.Lock()
              self._pending: dict[str, tuple[threading.Event, list[bool]]] = {}

          def __call__(self, path: str, diff: str) -> bool:        # 在 Agent 工作线程里调用
              aid = uuid.uuid4().hex[:12]
              done, box = threading.Event(), [False]
              with self._lock:
                  self._pending[aid] = (done, box)
              self.store.event("approval_required", id=aid, path=path, diff=diff)
              answered = done.wait(self.timeout)                   # 阻塞，直到 resolve 或超时
              with self._lock:
                  self._pending.pop(aid, None)
              approved = box[0] if answered else False             # 超时按拒绝
              self.store.event("approval_resolved", id=aid, approved=approved, timeout=not answered)
              return approved

          def resolve(self, aid: str, approved: bool) -> bool:     # 在 HTTP 请求线程里调用
              with self._lock:
                  item = self._pending.get(aid)
              if item is None:
                  return False                                     # 已超时、已处理或 id 不存在
              item[1][0] = approved
              item[0].set()
              return True
      ```

      - 它和 m1 的 `ConsoleApprover` 实现同一个接口 `(path, diff) -> bool`，所以 Agent 代码**一行不用改**，只是换了审批器（依赖注入，类似 Vue 的 provide/inject）。
      - `threading.Event`：工作线程 `wait()`，请求线程 `set()`。`box` 是一个单元素列表，用来把结果从请求线程带回工作线程。
      - `_lock` 保护字典：两个线程同时读写 dict 时，加锁让逻辑清晰、不出竞态。
      - **fail closed**：没人点、页面关了、超时，一律按拒绝处理，并在日志里记 `timeout=True`。

      **② SSE 推送事件，支持断线续传**

      ```python
      # src/vca/web/app.py（节选）
      import asyncio
      import re

      from fastapi import FastAPI, HTTPException, Request
      from fastapi.responses import StreamingResponse

      app = FastAPI()
      SID = re.compile(r"^[a-z0-9-]{8,40}$")

      @app.get("/api/sessions/{sid}/events")
      async def stream_events(sid: str, request: Request):
          if not SID.fullmatch(sid):
              raise HTTPException(400, "bad session id")
          last = request.headers.get("last-event-id", "0")
          start = int(last) if last.isdigit() else 0

          async def gen():
              pos = start
              while not await request.is_disconnected():
                  lines = sessions.read_events(sid, start=pos)     # 读第 pos 行之后的新行
                  for line in lines:
                      pos += 1
                      yield f"id: {pos}\ndata: {line}\n\n"
                  if not lines and sessions.is_finished(sid):
                      yield "event: end\ndata: {}\n\n"
                      return
                  await asyncio.sleep(0.3)

          return StreamingResponse(gen(), media_type="text/event-stream",
                                   headers={"Cache-Control": "no-cache", "X-Accel-Buffering": "no"})
      ```

      - SSE 格式：每条消息 `id:`、`data:`，以**空行**结束；`event: end` 是自定义事件名，前端用 `addEventListener('end', ...)` 监听。
      - `id` 用行号：浏览器重连时自动带 `Last-Event-ID`，后端从那里续传，不重复、不丢失。
      - `X-Accel-Buffering: no`：如果前面有 nginx，告诉它别缓冲，否则事件会攒一批才到浏览器（你在 nginx 部署时可能踩过）。
      - sid 必须正则校验：它会被拼进文件路径。

      **③ 前端：用 composable 订阅事件流**

      ```ts
      // web/src/composables/useSessionEvents.ts
      import { ref, onUnmounted } from 'vue'

      export interface AgentEvent { ts: string; type: string; [k: string]: unknown }

      export function useSessionEvents(sid: string) {
        const events = ref<AgentEvent[]>([])
        const finished = ref(false)
        const es = new EventSource(`/api/sessions/${sid}/events`)
        es.onmessage = (e) => events.value.push(JSON.parse(e.data))
        es.addEventListener('end', () => { finished.value = true; es.close() })
        onUnmounted(() => es.close())
        return { events, finished }
      }
      ```

      - `onmessage` 只接收没有 `event:` 字段的默认消息；`end` 要单独 `addEventListener`。
      - 断线后 EventSource 会自己重连并带上 `Last-Event-ID`，前端不用写重连逻辑。
      - 待审批的 diff 从 events 里筛出 `approval_required` 且还没有对应 `approval_resolved` 的那条，用 computed 实现。
    ai_prompt: |
