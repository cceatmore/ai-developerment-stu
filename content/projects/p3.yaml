        test_fixloop.py
        test_store.py
        test_resume.py
        test_protected.py
      ```

      ## feedback_prompt 模板
      「第 N 轮检查未通过。请只修复下面的问题，优先修第一个。不要修改测试文件和配置文件，不要添加 @ts-ignore 或 eslint-disable。\n<to_feedback 输出>」

      ## vca resume 逻辑
      1. 读取 state.json；status 不是 running 时打印结果并退出。
      2. 计算当前 `git diff` 的 sha256，与 patch.diff 比较；不一致时用 Rich 提示，让用户选择「继续 / 放弃」。
      3. 读取 messages.json 恢复 CodingAgent，调用 `fix_loop(..., state=state)`。

      ## 验收标准
      - `uv run pytest` 全绿（全部用 FakeLLM + FakeSandbox，不需要 Docker 和真实模型）。
      - 真实手测：给 fixture 一个需要改两处才能通过的任务，观察轮次和每轮反馈；第 2 轮中途 Ctrl+C，再 `vca resume <sid>` 能继续并最终结束。
      - 失败退出时生成 `.vca/sessions/<sid>/report.md`。

      ## 必须写的测试
