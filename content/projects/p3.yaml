id: p3
title: "前端 Coding Agent：会自己跑测试、自己修的 Vue3 + TS 编码智能体"
role: "Agent 运行时 / Harness 工程师、Coding Agent 开发工程师（也可作为 AI 应用开发岗的工程化项目）"

intro: |
  **一句话**：用 Python 从零写一个专门处理 **Vue3 + TypeScript 仓库** 的 Coding Agent。它能读仓库、检索上下文、改组件，在 **Docker 沙箱** 里跑 `vitest / eslint / vue-tsc`，失败就读报错**自己修**；还能**审查 PR diff**，并用 **20 个组件级任务的评测集** 证明效果。

  **为什么做这个项目**
  - 2026 年国内大厂在大量招 **Agent Harness / Agent 运行时** 工程师，JD 反复出现：agent loop、工具注册、上下文压缩、沙箱、权限、断点恢复、子 Agent、评测。这个项目把**每一项都亲手做一个最小可用版**。
  - 你有 5 年以上 Vue/TS 经验，**最懂「一个 Vue 组件改得对不对」**：props/emit 契约、响应式陷阱、类型检查、ESLint 规则。别人做通用 Coding Agent，你做**懂 Vue 的 Coding Agent**，评测任务也由你来出，这就是差异化。
  - 和 p2（智慧园区运营 Agent）互补：p2 偏业务 Agent（LangGraph、MCP、审批），p3 偏**运行时底座**（不用框架，手写 Harness）。

  **最终产出**

  | 产出 | 说明 |
  |---|---|
  | `vca` 命令行 | `vca run "任务" --repo 路径`、`vca resume 会话ID`、`vca review --base main`、`vca eval` |
  | 简单 Web 面板 | Vue3 页面实时看 Agent 每一步、看 diff、点按钮审批、回放历史会话 |
  | 评测报告 | 20 个任务的通过率、平均轮次、Token、失败归因（数字用你的评测结果填写） |
  | 面试材料 | 架构图、安全模型、深挖题答案、简历条目、讲稿 |

  **6 个模块**（只在工作日做，每个 60~90 分钟；AI 写大部分代码，你负责**读懂关键代码 + 验收**）

  | 模块 | 解锁 | 做什么 |
  |---|---|---|
  | m1 最小循环 | Day 40 | 工具注册 + Agent 循环 + 安全编辑（diff 确认）+ 事件日志 |
  | m2 仓库上下文 | Day 41 | 文件树、ripgrep 检索、Vue repo map、预算裁剪、压缩、Skill 按需加载 |
  | m3 沙箱与 CI | Day 44 | Docker 断网沙箱跑 vitest/eslint/vue-tsc，结果结构化回传；CI |
  | m4 生成-测试-修复 | Day 47 | 修复循环、最大轮次、无进展检测、防改测试、checkpoint 断点恢复 |
  | m5 PR 审查 + 评测 | Day 48 | 审查子 Agent、20 任务评测集与报告 |
  | m6 交付与包装 | Day 49 | Web 面板（SSE + 审批）、README、演示、简历与面试讲稿 |

  > **每个模块的用法**：先看 **goal 和 design 里的图** → 把 **ai_prompt** 整段粘给 Cursor → AI 写完后**对照 key_code 逐段读懂** → 按 **tests** 勾选验收 → 用 **retell** 口述一遍。

market: |
  **结论：Coding Agent 是「Agent Harness」能力最集中的载体。2026 年的 Harness / Agent Runtime 岗位，几乎都把它写进了 JD。**

  **2026 年 JD 摘录**（检索于 2026-11，以招聘页面为准）

  | 公司 / 岗位 | JD 要点 | 本项目对应 |
  |---|---|---|
  | 阿里 千问办公 · AI Agent Harness 工程师 | 会话生命周期、Turn/Event 流、工具调用、文件上下文、**沙箱执行**、插件/技能加载；**会话回放、事件重放**、调试面板；**以评测驱动 Harness 迭代**；加分：深度使用过 Codex、Claude Code、Cursor | m1 事件日志、m2 Skill 加载、m3 沙箱、m5 评测、m6 回放面板 |
  | 滴滴 · 资深研发工程师-AI 方向（Agent Runtime / Sandbox） | 理解 **Agent Loop、工具调用、上下文管理、Session、状态持久化、权限控制和任务恢复**；能解释 Coding Agent 的**文件操作、命令执行、上下文压缩、Sandbox、长任务执行机制** | 整个项目就是这条要求的答案 |
  | 阶跃星辰 · Agent Harness 开发工程师 | 推理-行动-观察循环、**子代理编排与错误恢复**、**上下文压缩（compaction）**；AI 编程工具重度用户，对其原理与局限有切身认知 | m1 循环、m2 压缩、m4 恢复、m5 子 Agent |
  | 月之暗面 · Harness 研发工程师 | Agent Loop、模型输出解析、上下文构造、**沙箱隔离、权限控制、容错重试与终止机制**；关心 solve rate、recoverability、安全边界；把失败样本转成评测集 | m3/m4 终止与恢复、m5 评测与失败归因 |
  | 小红书 · AI Agent 工程师（harness 系统） | Agent Loop 架构、**云端 Agent 沙箱**、评测体系、Code Agent 落地 | m3 沙箱、m5 评测 |

  **命中的 JD 关键词**
  - **Harness 核心**：Agent Loop、Tool Registry / Function Calling、终止条件、错误回传、事件流
  - **上下文工程**：Repo Map、ripgrep 检索、Token 预算、Compaction、工具结果清理、Skill 渐进加载
  - **执行与安全**：Docker 沙箱、断网、只读根文件系统、命令白名单、路径限制、人工审批（Human-in-the-loop）、Prompt Injection 防护
  - **长任务**：Checkpoint、断点恢复、无进展检测、预算控制
  - **多 Agent**：审查子 Agent、上下文隔离、结构化结果回传
  - **评测**：类 SWE-bench 的 FAIL_TO_PASS / PASS_TO_PASS 判定、通过率、失败归因、CI 门禁

  **为什么市场需要（面试时可以这样说）**
  - Claude Code 官方文档把「模型外面那一层：提供工具、管理模型看到的上下文」直接称为 **agentic harness**。模型能力逐渐趋同，**Harness 的质量决定产品体验**。
  - 企业把 Coding Agent 接进内部研发流程，最担心两件事：**安全**（乱执行命令、泄露代码）和**可控**（跑飞了能停、断了能续、效果能量化）。这正是 Harness 工程师的工作。
  - 前端仓库是 Coding Agent 最高频的场景之一。**「懂前端工程 + 懂 Agent 运行时」**的人少，这就是你的定位。

tech_stack: |
  | 层 | 选型 | 为什么 / 前端类比 |
  |---|---|---|
  | 语言与包管理 | **Python 3.12+、uv** | Agent 生态主流在 Python；uv ≈ pnpm（锁文件 + 虚拟环境） |
  | 模型接入 | **openai 官方 SDK**，`base_url` 指向 OpenAI 兼容接口（DeepSeek / 通义 / OpenAI 均可） | 用 Chat Completions 的 `tools` 做函数调用；Key 只从环境变量读 |
  | 数据校验 | **Pydantic v2** | ≈ zod：工具参数模型既生成 JSON Schema，又校验模型输出 |
  | CLI | **Typer + Rich**（Rich 渲染彩色 diff） | ≈ commander + chalk |
  | 检索 | **ripgrep（rg）** 子进程，`--json` 输出 | 和 VS Code 全局搜索是同一个引擎 |
  | 沙箱 | **Docker**（Windows 用 Docker Desktop + WSL2 后端），`docker run` 加固参数 | 构建期联网装依赖，运行期断网 |
  | 被操作的仓库 | `fixtures/vue-demo`：用 create-vue 生成的 **Vue3 + Vite + TS + Vitest + ESLint** 项目 | 你最熟的技术栈，评测任务也基于它 |
  | 检查工具 | **vitest**（JSON reporter）、**eslint**（`-f json`）、**vue-tsc**（类型检查） | 输出统一解析成 CheckResult |
  | Web 面板 | **FastAPI + SSE**（后端）、**Vue3 + Vite**（前端） | SSE ≈ EventSource，发挥你的前端优势 |
  | 测试 | **pytest** + 脚本化的 FakeLLM | 单测不调真实模型：不花钱、结果稳定 |
  | CI | **GitHub Actions** | 跑 pytest、构建沙箱镜像；真实模型评测手动触发 |

  > **为什么不用 LangChain / LangGraph**：这个项目的卖点就是「手写 Harness，知道框架替你做了什么」。LangGraph 已经在 p2 里覆盖。

architecture: |
  **分层：入口层（CLI / Web）→ Harness 核心 → 工具层 → 执行环境；会话存储和评测贯穿全程。**

  ```mermaid
  flowchart TB
    subgraph UI["入口层"]
      CLI["vca 命令行"]
      WEB["Web 面板 Vue3 + SSE"]
    end
    subgraph H["Harness 核心"]
      FIX["生成-测试-修复循环 m4"]
      LOOP["Agent 循环 m1"]
      CTX["上下文组装与压缩 m2"]
      REG["工具注册表 m1"]
      APP["审批器 diff 确认"]
      SUB["审查子 Agent m5"]
    end
    subgraph T["工具层"]
      FS["read_file / edit_file / write_file"]
      SR["search ripgrep 与 repo map"]
      CK["run_check 白名单"]
      SK["load_skill"]
    end
    subgraph E["执行环境"]
      WS["工作区 路径限制"]
      DK["Docker 沙箱 断网 只读"]
      LLM["OpenAI 兼容模型"]
    end
    STORE["会话存储 events.jsonl 与 checkpoint"]
    EVAL["评测运行器 20 个任务"]
    CLI --> FIX
    WEB --> FIX
    FIX --> LOOP
    LOOP --> CTX
    LOOP --> LLM
    LOOP --> REG
    REG --> FS
    REG --> SR
    REG --> CK
    REG --> SK
    FS --> APP
    FS --> WS
    SR --> WS
    CK --> DK
    FIX --> SUB
    LOOP --> STORE
    FIX --> STORE
    WEB --> STORE
    EVAL --> FIX
  ```

  **一次任务怎么跑**

  ```mermaid
  sequenceDiagram
    participant U as 开发者
    participant F as 修复循环
    participant A as Agent 循环
    participant M as 模型
    participant T as 工具层
    participant S as Docker 沙箱
    U->>F: vca run 任务
    F->>A: 第 1 轮 任务原文
    loop 每一步 最多 max_steps
      A->>M: 上下文 + 工具 Schema
      M-->>A: 工具调用 或 最终回答
      A->>T: 执行工具 路径校验 diff 审批
      T-->>A: 结果或错误文本
    end
    F->>S: typecheck lint test
    S-->>F: 结构化检查结果
    alt 全部通过
      F->>U: 完成 + 审查意见
    else 失败且未超轮次
      F->>A: 下一轮 只给失败摘要
    else 无进展或超预算
      F->>U: 失败退出报告
    end
  ```

  **关键设计决策**

  | 决策 | 选择 | 理由 |
  |---|---|---|
  | 编辑方式 | search/replace，原文必须唯一匹配 | 与 Claude Code Edit 工具、Aider 的 diff 格式同思路：省 Token、能生成 diff、失败信息可读 |
  | 命令执行 | 不给通用 shell，只给 `run_check(kind)` | 白名单写死在代码里，模型只能选检查名；再叠加 Docker 断网隔离 |
  | 上下文 | 规则文件预加载 + 工具按需检索 + 预算裁剪 + 分层压缩 | 与 Anthropic 上下文工程文章推荐的「混合策略」一致 |
  | 状态 | 事件日志只追加 + 每轮原子写 checkpoint | 可回放、可恢复；CLI、Web、评测共用一份数据 |
  | 评测 | 隐藏测试 FAIL_TO_PASS + 原有检查 PASS_TO_PASS | 借鉴 SWE-bench 的判定方式，结果可复现 |

resume: |
  **项目名**：前端 Coding Agent（Vue3 + TS 仓库自修复编码智能体）｜个人项目｜Python、OpenAI 兼容 API、Docker、ripgrep、FastAPI、Vue3

  **一句话描述**（简历第一行）
  > 从零手写 Coding Agent 运行时（不依赖 Agent 框架），面向 Vue3 + TS 仓库实现「检索上下文 → 修改组件 → Docker 沙箱运行 vitest/eslint/vue-tsc → 读报错自修复 → PR 审查」闭环，并用自建 20 任务评测集量化效果。

  **要点模板**（按「做了什么 + 怎么做 + 结果」写；**数字一律用你的评测结果填写，不要估**）
  - **Agent 循环与工具注册**：基于 Pydantic 定义工具参数并自动生成 JSON Schema，实现 ReAct 式循环（最大步数、错误作为观察回传、事件日志）；编辑采用 search/replace 唯一匹配 + diff 人工确认，编辑失败后自我纠正成功率 **【用你的评测结果填写】**。
  - **仓库上下文工程**：ripgrep 检索 + Vue SFC 感知的 repo map（props/emits/导出符号排序）+ Token 预算裁剪 + 分层压缩（工具结果清理 → 结构化摘要），长任务平均上下文 Token **【用你的评测结果填写】**。
  - **沙箱与权限**：Docker 断网、只读根文件系统、去除全部 capability、资源限额、非 root；命令白名单 + 路径限制 + 受保护文件；红队用例拦截 **【用你的评测结果填写，如 x/x】**。
  - **生成-测试-修复循环**：结构化回传 vitest/eslint/vue-tsc 失败信息，最大轮次 + 失败签名无进展检测 + Token 预算；每轮 checkpoint，中断后可 `resume` 继续。
  - **PR 审查子 Agent**：只读工具 + 独立上下文，输出结构化意见并只保留改动行附近的高置信问题；在埋点缺陷集上召回率 **【用你的评测结果填写】**、干净 diff 误报 **【用你的评测结果填写】**。
  - **评测体系**：参考 SWE-bench 设计 20 个组件级任务（隐藏测试 FAIL_TO_PASS + 原有检查 PASS_TO_PASS），通过率 **【用你的评测结果填写】**、平均修复轮次 **【用你的评测结果填写】**；按失败原因归类驱动迭代（如某项改动使通过率从 **【前】** 到 **【后】**）。
  - **Web 面板**：FastAPI + SSE 推送事件流，Vue3 展示执行时间线、diff 与审批按钮，支持断线续传与历史会话回放。

  **写法提醒**
  - 没测过的数字**宁可不写**。面试官一定追问「怎么测的、样本多少、跑了几次」，答不上来比不写更伤。
  - 写「从 A 提升到 B」，必须能说清是**哪一个改动**带来的（做过对照实验）。

modules:
  - id: p3-m1
    name: "最小 Harness：Agent 循环 + 工具注册 + 安全编辑"
    unlock_day: 40
    minutes: 90
    features:
      - "ToolRegistry：用 Pydantic 模型声明工具参数，自动生成 JSON Schema 交给模型"
      - "Agent 循环：模型提议工具调用 → 代码执行 → 结果回传；最大步数与终止条件"
      - "4 个文件工具：list_dir / read_file（带行号、分段读）/ edit_file（search-replace，唯一匹配）/ write_file（只能新建）"
      - "工作区路径限制：路径 resolve 后必须在仓库根目录内；拒绝 .git、node_modules、.env"
      - "修改前展示 unified diff，人工输入 y 才落盘（默认拒绝）"
      - "JSONL 事件日志：每一步写一行，后面的断点恢复、Web 回放都读它"
    goal: |
      跑通一个**不依赖任何 Agent 框架**的最小 Coding Agent：给它一句需求（如「给按钮组件加 loading 属性」），它自己列目录、读文件、提出修改；**你在终端看到 diff 并输入 y 后**，文件才真正被改。

      读懂这个模块，你就能回答面试最常见的两问：**「Agent 循环怎么写」「Harness 和模型怎么分工」**。
    design: |
      **核心思想：模型只负责「提议」；Harness（你写的 Python 代码）负责「执行、校验、记录、拦截」。**

      **五个部件**

      | 部件 | 职责 | 前端类比 |
      |---|---|---|
      | `LLM` 适配层 | 把 OpenAI 兼容接口包成 `chat(messages, tools) -> AssistantTurn`；测试时换成 FakeLLM | axios 实例 + mock adapter |
      | `ToolRegistry` | 注册工具；Pydantic 参数模型 → JSON Schema；按名字分发并校验参数 | 路由表 + zod 校验 |
      | Agent 循环 | 调模型 → 有工具调用就执行并回填 → 没有就结束；最多 `max_steps` 步 | 事件循环 / 状态机 |
      | `Workspace` | 路径先 `resolve()` 再判断是否在仓库内；拒绝 `.git`、`node_modules`、`.env` | 路由守卫 |
      | `Approver` | 写文件前展示 unified diff，返回 True 才落盘；默认拒绝 | 二次确认弹窗 |

      **为什么这样设计（都有公开出处）**
      - **编辑用 search/replace，原文必须唯一匹配**：Claude Code 的 Edit 工具要求 `old_string` 逐字出现且只出现一次；Aider 的 diff 格式是 SEARCH/REPLACE 块；MCP 官方 filesystem server 的 `edit_file` 也是 `oldText/newText`，并提供 `dryRun` 预览。好处：只传改动部分，省 Token；能直接算出 diff 给人看；匹配失败能给出清楚的错误让模型重试。
      - **读文件带行号、分段读**：SWE-agent 的经验是文件查看器每次只展示约 100 行效果最好，整文件 `cat` 容易淹没模型。本项目 `read_file` 默认最多 200 行，可传 `start_line` 继续读。
      - **错误当作工具结果返回**：参数不合法、路径越界、匹配失败，都返回 `ERROR: ...` 文本。模型下一步能看到并纠正。只有程序 bug 才抛异常。
      - **审批默认拒绝（fail closed）**：用户没明确输入 y、超时、出异常，一律按「不写」处理。
      - **事件日志只追加**：每一步写一行 JSON 到 `.vca/sessions/<会话ID>/events.jsonl`。m4 的断点恢复、m6 的 Web 回放都读它。

      ```mermaid
      sequenceDiagram
        participant U as 开发者
        participant L as Agent 循环
        participant M as 模型
        participant R as 工具注册表
        participant W as 工作区与审批
        U->>L: 任务 + 仓库路径
        L->>M: messages + 工具 Schema
        M-->>L: tool_calls read_file
        L->>R: call read_file
        R->>W: resolve 路径校验
        W-->>R: 带行号的文件内容
        R-->>L: tool 消息
        L->>M: 追加结果后再次调用
        M-->>L: tool_calls edit_file
        L->>R: call edit_file
        R->>W: 唯一匹配 + 生成 diff
        W->>U: 展示 diff 等待 y 或 n
        U-->>W: y
        W-->>L: OK 已修改
        L->>M: 再次调用
        M-->>L: 无工具调用 给出说明
        L-->>U: 结束 status=done
      ```

      **本模块不做**：沙箱跑命令（m3）、上下文压缩（m2）、修复循环（m4）。先把最小闭环跑通。
    data_flow: |
      1. CLI 读取 `--repo`、任务文本和环境变量（`VCA_API_KEY`、`VCA_BASE_URL`、`VCA_MODEL`），生成会话 ID，创建 `events.jsonl`。
      2. `messages = [system, user(任务)]`，连同 `registry.schemas()` 发给模型。
      3. 模型返回 `AssistantTurn`：**没有** `tool_calls` → 记录最终回答，结束；**有** → 把 assistant 消息（含 tool_calls）追加到 messages。
      4. 对每个工具调用：`registry.call(name, arguments_json)` → Pydantic 校验参数 → 工具内部 `workspace.resolve()` 校验路径 →（编辑类）算 diff → `approver(path, diff)` → 写盘或拒绝。
      5. 工具输出（成功内容或 `ERROR:` 文本）以 `role=tool` + 对应 `tool_call_id` 追加到 messages，同时写一行事件日志。
      6. 回到第 2 步，直到模型不再调用工具，或达到 `max_steps`。
    key_code: |
      **① 工具注册表：参数校验 + 错误变成文本**

      ```python
      # src/vca/tools/registry.py
      from dataclasses import dataclass
      from typing import Callable

      from pydantic import BaseModel, ValidationError


      class ToolError(Exception):
          """可预期的工具失败：信息原样回传给模型，让它自己纠正。"""


      @dataclass
      class Tool:
          name: str
          description: str
          args_model: type[BaseModel]
          fn: Callable[..., str]

          def schema(self) -> dict:
              return {
                  "type": "function",
                  "function": {
                      "name": self.name,
                      "description": self.description,
                      "parameters": self.args_model.model_json_schema(),
                  },
              }


      class ToolRegistry:
          def __init__(self) -> None:
              self._tools: dict[str, Tool] = {}

          def register(self, tool: Tool) -> None:
              if tool.name in self._tools:
                  raise ValueError(f"duplicate tool: {tool.name}")
              self._tools[tool.name] = tool

          def schemas(self) -> list[dict]:
              return [t.schema() for t in self._tools.values()]

          def call(self, name: str, raw_args: str) -> str:
              tool = self._tools.get(name)
              if tool is None:
                  return f"ERROR: unknown tool '{name}'. Available: {', '.join(self._tools)}"
              try:
                  args = tool.args_model.model_validate_json(raw_args or "{}")
              except ValidationError as e:
                  return f"ERROR: invalid arguments for {name}: {e.errors(include_url=False)}"
              try:
                  return tool.fn(**args.model_dump())
              except ToolError as e:
                  return f"ERROR: {e}"
      ```

      - `schema()`：Chat Completions 的 `tools` 参数要求 `{"type": "function", "function": {...}}` 结构；`model_json_schema()` 把 Pydantic 模型转成 JSON Schema，**参数定义只写一份**（类似用 zod schema 同时生成类型和校验）。
      - `model_validate_json(raw_args)`：模型给的 `arguments` 是**字符串**，可能不是合法 JSON、可能缺字段。校验失败**不抛异常**，返回 `ERROR:` 文本，模型下一步能看到哪里错了。
      - 只捕获 `ToolError`（可预期的失败）。其他异常是你的 bug，开发期让它直接崩，方便发现。

      **② Agent 循环：调模型 → 执行工具 → 回填 → 直到结束或超步数**

      ```python
      # src/vca/loop.py
      from dataclasses import dataclass

      @dataclass
      class AgentResult:
          status: str            # done | max_steps
          answer: str | None
          steps: int
          tokens: int


      def run_agent(task: str, llm, registry, log, system_prompt: str,
                    max_steps: int = 25) -> AgentResult:
          messages: list[dict] = [
              {"role": "system", "content": system_prompt},
              {"role": "user", "content": task},
          ]
          tokens = 0
          for step in range(1, max_steps + 1):
              turn = llm.chat(messages, registry.schemas())
              tokens += turn.total_tokens
              log.append("assistant", step=step, content=turn.content,
                         tool_calls=[c.name for c in turn.tool_calls])
              if not turn.tool_calls:
                  return AgentResult("done", turn.content, step, tokens)
              messages.append(turn.to_message())
              for call in turn.tool_calls:
                  output = registry.call(call.name, call.arguments)
                  log.append("tool", step=step, name=call.name,
                             args=call.arguments, output=output[:500])
                  messages.append({"role": "tool", "tool_call_id": call.id, "content": output})
          return AgentResult("max_steps", None, max_steps, tokens)
      ```

      - **终止条件有两个**：模型不再调用工具（任务完成）；达到 `max_steps`（防止死循环烧钱）。
      - `turn.to_message()` 必须把 `tool_calls` 原样放回 messages，下一条 `tool` 消息的 `tool_call_id` 要和它一一对应，否则 API 直接报错。
      - 一次回复可能有**多个**工具调用（并行调用，见 Day 17），要逐个执行、逐个回填。
      - 日志里 `output` 只存前 500 字符，防止日志膨胀；完整内容在 messages 里。

      **③ 工作区守卫 + 带审批的编辑**

      ```python
      # src/vca/workspace.py
      from fnmatch import fnmatch
      from pathlib import Path

      from .tools.registry import ToolError

      DENY_DIRS = {".git", "node_modules", ".vca"}
      DENY_FILES = (".env", ".env.*", "*.pem", "*.key")

      class Workspace:
          def __init__(self, root: str | Path) -> None:
              self.root = Path(root).resolve()

          def resolve(self, rel: str) -> Path:
              p = (self.root / rel).resolve()          # 展开 .. 和符号链接
              if not p.is_relative_to(self.root):
                  raise ToolError(f"path '{rel}' is outside the repository")
              if any(part in DENY_DIRS for part in p.relative_to(self.root).parts):
                  raise ToolError(f"path '{rel}' is in a denied directory")
              if any(fnmatch(p.name, pat) for pat in DENY_FILES):
                  raise ToolError(f"'{p.name}' may contain secrets and is not accessible")
              return p
      ```

      ```python
      # src/vca/tools/fs.py（节选）
      import difflib

      def edit_file(path: str, old_str: str, new_str: str) -> str:
          p = ws.resolve(path)
          if not p.is_file():
              raise ToolError(f"{path} does not exist; use write_file to create new files")
          if not old_str:
              raise ToolError("old_str must not be empty")
          text = p.read_bytes().decode("utf-8")
          n = text.count(old_str)
          if n == 0:
              raise ToolError("old_str not found. Re-read the file and copy the exact text, including indentation.")
          if n > 1:
              raise ToolError(f"old_str appears {n} times. Include more surrounding lines to make it unique.")
          new_text = text.replace(old_str, new_str, 1)
          diff = "".join(difflib.unified_diff(
              text.splitlines(keepends=True), new_text.splitlines(keepends=True),
              fromfile=f"a/{path}", tofile=f"b/{path}"))
          if not approve(path, diff):
              return "REJECTED: the user did not approve this change. File unchanged."
          p.write_bytes(new_text.encode("utf-8"))
          return f"OK: edited {path}\n{diff[:3000]}"
      ```

      - `(root / rel).resolve()` 之后再判断 `is_relative_to(root)`：同时挡住 `../../`、绝对路径（`root / "C:/x"` 结果就是 `C:/x`）和指向仓库外的符号链接。**先拼接再判断字符串前缀是错误写法**（`/repo-evil` 也以 `/repo` 开头）。
      - **唯一匹配**：0 次说明模型记错了原文，让它重新读；多次说明会改错位置，让它带更多上下文。错误信息写成「下一步该怎么做」，模型更容易自我纠正。
      - 用 `read_bytes/write_bytes`：Windows 上 `write_text` 会把 `\n` 转成 `\r\n`，整份文件出现在 diff 里。
      - `approve` 返回 False 时**返回文本而不是抛异常**：模型知道被拒了，可以问用户想怎么改。
