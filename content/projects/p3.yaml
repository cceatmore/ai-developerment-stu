      （粘给 Cursor 前先准备：空目录执行 `uv init vca`，进入 vca 目录；再用 `npm create vue@latest fixtures/vue-demo` 生成示例仓库，勾选 TypeScript、Vitest、ESLint，并在里面执行一次 `npm install` 和 `git init && git add -A && git commit -m init`）

      # 任务：实现 vca 的最小 Harness（Python 3.12+，uv 管理依赖）

      ## 目标
      做一个命令行 Coding Agent：`uv run vca run "<任务>" --repo fixtures/vue-demo`。它通过工具调用读取和修改 Vue3 + TS 仓库；每次修改文件前在终端展示彩色 unified diff，用户输入 y 才写入。

      ## 约束
      - 不使用 LangChain / LangGraph 等 Agent 框架。模型调用用 `openai` 官方 SDK 的 Chat Completions + `tools` 参数；`api_key`、`base_url`、`model` 分别从环境变量 `VCA_API_KEY`、`VCA_BASE_URL`、`VCA_MODEL` 读取（兼容 DeepSeek / 通义等 OpenAI 兼容接口）。Key 不能出现在代码、日志、异常信息里。
      - 循环只依赖一个 `LLM` 协议：`chat(messages: list[dict], tools: list[dict]) -> AssistantTurn`。`AssistantTurn` 是 dataclass，字段 `content: str | None`、`tool_calls: list[ToolCall]`（ToolCall 含 `id`、`name`、`arguments: str`）、`total_tokens: int`；提供 `to_message()` 生成 assistant 消息字典，**没有工具调用时不要带 `tool_calls` 键**。tools 为空列表时调用 SDK 不要传 tools 参数。
      - 工具参数用 Pydantic v2 模型定义，`model_json_schema()` 生成 parameters。参数校验失败、路径越界、匹配失败一律返回以 `ERROR:` 开头的字符串，不抛异常；只有程序 bug 才抛。
      - 所有路径都经过 `Workspace.resolve()`：`(root / rel).resolve()` 后必须 `is_relative_to(root)`；拒绝路径中含 `.git`、`node_modules`、`.vca` 的目录；拒绝 `.env`、`.env.*`、`*.pem`、`*.key` 文件。
      - 读写文件用 `read_bytes().decode("utf-8")` 和 `write_bytes()`，保持原换行符。
      - 审批默认拒绝：只有用户输入 `y` 才返回 True。提供 `--yes` 自动同意（仅测试用，启动时用红字打印警告）。

      ## 文件结构
      ```
      src/vca/
        __init__.py
        cli.py            # Typer：vca run TASK --repo PATH --max-steps 25 --yes
        config.py         # 读取环境变量与默认值
        llm.py            # LLM 协议、ToolCall、AssistantTurn、OpenAICompatLLM
        loop.py           # run_agent(...) -> AgentResult(status, answer, steps, tokens)
        events.py         # EventLog.append(kind, **data)：追加一行 JSON，含 UTC 时间戳
        workspace.py      # Workspace（从 tools/registry.py 导入 ToolError）
        approval.py       # Approver = Callable[[str, str], bool]；ConsoleApprover 用 Rich 渲染 diff
        prompts.py        # SYSTEM_PROMPT：先读后改、一次只改一处、不确定先问、完成后简要说明改了什么
        tools/
          registry.py     # ToolError、Tool、ToolRegistry（register / schemas / call）
          fs.py           # list_dir、read_file、edit_file、write_file
      tests/
        fakes.py          # FakeLLM：构造时传入 AssistantTurn 列表，按顺序返回，并记录收到的 messages
        test_registry.py
        test_workspace.py
        test_fs_tools.py
        test_loop.py
      ```

      ## 工具要求
      - `list_dir(path=".", depth=2)`：跳过 node_modules、dist、.git，最多返回 200 条，超出提示总数。
      - `read_file(path, start_line=1, max_lines=200)`：输出带行号；没读完时末尾提示「还有 N 行，用 start_line=X 继续读」。
      - `edit_file(path, old_str, new_str)`：old_str 为空、0 次匹配、多次匹配分别返回可读错误；唯一匹配时用 `difflib.unified_diff` 生成 diff → 调 approver → 同意才写入；返回值附带 diff（截断到 3000 字符）。
      - `write_file(path, content)`：只能创建新文件，已存在时返回错误并提示改用 edit_file；父目录不存在时自动创建；同样要经过 diff 审批。
      - 每个工具的 description 写清三件事：什么时候用、参数含义、失败了下一步怎么办。

      ## 验收标准
      1. `uv run pytest` 全部通过；测试不访问网络、不调用真实模型。
      2. 真实模型执行 `uv run vca run "给 src/components 里的按钮组件增加 loading 属性，loading 时禁用按钮" --repo fixtures/vue-demo`：终端出现 diff，按 y 后文件被修改，按 n 时文件不变。
      3. `fixtures/vue-demo/.vca/sessions/<id>/events.jsonl` 每一步一行，能看出模型调用了哪些工具。

      ## 必须写的测试
      - `test_workspace.py`：`../../etc/passwd`、绝对路径、指向仓库外的符号链接（Windows 无权限创建符号链接时 `pytest.skip`）、`.env`、`node_modules/x` 都被拒绝；正常相对路径通过。
