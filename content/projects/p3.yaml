      - "两级压缩：先清理旧的工具结果，仍超预算再让模型写结构化摘要；切分点不能拆开工具调用和它的结果"
    goal: |
      让 Agent 在**几百个文件的 Vue 仓库**里也能快速找到该改的地方，并且**长任务不会把上下文窗口撑爆**。

      做完你能回答：「上下文窗口不够怎么办」「Coding Agent 怎么找到相关代码」——这两题是 Harness 岗位的必考题。
    design: |
      **问题**
      - 整个仓库塞进上下文：贵、慢，而且上下文越长模型越容易忽略中间信息（context rot，见 Day 13）。
      - 只靠模型自己 `read_file`：盲目翻文件，步数和 Token 都爆炸。

      **解法：混合策略**（Anthropic《Effective context engineering for AI agents》：Claude Code 把 CLAUDE.md 直接放进上下文，同时用 glob/grep 让模型即时检索）

      | 层 | 放什么 | 何时进入上下文 |
      |---|---|---|
      | 常驻 | system prompt、项目规则 `AGENTS.md`（有就读）、技能目录（只有名字和描述） | 每次都在 |
      | 概览 | 文件树 + Vue repo map（受 Token 预算限制） | 任务开始时 |
      | 即时 | `search`（ripgrep）、`read_file` 分段读、`load_skill` | 模型需要时调用工具 |

      **Repo map（借鉴 Aider）**
      - Aider 的 repo map = 文件列表 + 每个文件的关键符号和签名，用图排序算法挑出最重要的部分，装进 Token 预算（`--map-tokens` 默认 1k）。
      - 我们做 Vue 版简化实现：
        - `.vue`：组件文件名、`defineProps` / `defineEmits` / `defineModel` 所在行原文、`<script setup>` 里的 import。
        - `.ts`：`export function / const / class / interface / type` 所在行。
        - 排序分 = 与任务关键词命中数 × 2 + 被其他文件 import 的次数。
      - 先用正则提取，够用；进阶可换 tree-sitter（Aider 就是用它解析语法树）。

      **搜索输出要短**
      - SWE-agent 的经验：搜索工具只简洁地列出命中文件效果最好，给太多上下文反而让模型困惑。
      - 我们按文件聚合：最多 20 个文件、每个文件最多 5 行，命中多的文件排前面。

      **预算裁剪**：每段上下文带优先级。超预算时从**低优先级**开始截断，保留头尾，中间写「已省略，需要时用 read_file 分段读」。

      **两级压缩**（Anthropic：compaction 是上下文工程的第一杠杆；最轻、最安全的一种是清理旧的工具结果）
      1. 估算 Token 超过窗口的 80% → 把较早的 tool 消息内容替换成一行占位「已清理，需要时重新调用工具」。
      2. 还不够 → 让模型把早期对话写成**结构化摘要**（目标、已改文件、已确认事实、失败尝试、未解决错误、下一步），替换早期消息。
      3. **切分点不能落在 assistant(tool_calls) 和它的 tool 结果之间**，否则 API 报错。
      4. system 和原始任务**永远保留原文**。关键约束放在 system / AGENTS.md，不要只靠对话历史。

      **Skill 按需加载**（参考 Agent Skills 的渐进加载：Claude Code 会话开始只看到技能描述，用到时才加载全文）
      - 目录 `skills/<name>/SKILL.md`，文件头写 `name` 和 `description`。
      - 例子：`vue-sfc-conventions`（团队组件规范）、`vitest-component-testing`（@vue/test-utils 写法）。
      - 上下文里只放「名字 + 一句话描述」，模型调用 `load_skill(name)` 才返回全文。

      ```mermaid
      flowchart TD
        A["新任务"] --> B["扫描仓库 文件树与符号 按修改时间缓存"]
        B --> C["按任务关键词与引用次数排序 生成 repo map"]
        C --> D["按优先级和 Token 预算组装 system 补充内容"]
        D --> E["Agent 循环每一步"]
        E --> F{"估算 Token 超过窗口 80 百分比"}
        F -- 否 --> G["调用模型"]
        F -- 是 --> H["第一级 清理旧工具结果"]
        H --> I{"仍然超过"}
        I -- 否 --> G
        I -- 是 --> J["第二级 结构化摘要替换早期对话"]
        J --> G
        G --> K["模型按需调用 search 或 read_file 或 load_skill"]
        K --> E
      ```
    data_flow: |
      1. 任务开始：`RepoIndex` 扫描仓库（遵守 .gitignore，按文件修改时间缓存），得到文件树和每个文件的符号行。
      2. 用任务文本里的关键词（组件名、属性名、中文词的英文对应）给文件打分，取前 N 个文件的符号拼成 repo map。
      3. `assemble(sections, budget)` 按优先级拼装：system（必留）→ AGENTS.md → 技能目录 → repo map → 文件树，超预算的段落被截断或丢弃。
      4. 进入 Agent 循环。模型用 `search` 定位文件，用 `read_file` 分段读，用 `load_skill` 加载规范。
      5. 每次调模型前执行 `compact(messages)`：未超阈值直接返回；超了先清理旧工具结果，再不够就做结构化摘要；同时写一条 `compaction` 事件（压缩前后 Token 估算）。
    key_code: |
      **① ripgrep 搜索：短而准的输出**

      ```python
      # src/vca/context/search.py
      import json
      import subprocess
      from collections import defaultdict

      def rg_search(ws, pattern: str, glob: str | None = None,
                    max_files: int = 20, per_file: int = 5) -> str:
          cmd = ["rg", "--json", "--max-count", str(per_file), "--max-columns", "200",
                 "-g", "!*.lock", "-g", "!dist/**"]
          if glob:
              cmd += ["-g", glob]
          cmd += ["-e", pattern, "."]          # -e：pattern 以 - 开头也不会被当成选项
          try:
              proc = subprocess.run(cmd, cwd=ws.root, capture_output=True, text=True,
                                    encoding="utf-8", errors="replace", timeout=15)
          except FileNotFoundError:
              raise ToolError("ripgrep (rg) is not installed on this machine")
          if proc.returncode == 1:
              return f"no matches for /{pattern}/"
          if proc.returncode != 0:
              raise ToolError(f"rg failed: {proc.stderr.strip()[:300]}")

          hits: dict[str, list[str]] = defaultdict(list)
          for line in proc.stdout.splitlines():
              ev = json.loads(line)
              if ev["type"] != "match":
                  continue
              data = ev["data"]
              path = data["path"]["text"].removeprefix("./")
              text = data["lines"].get("text", "").rstrip()
              hits[path].append(f"  {data['line_number']}: {text}")

          files = sorted(hits, key=lambda p: -len(hits[p]))
          out = [f"{len(files)} files matched" + (f", showing top {max_files}" if len(files) > max_files else "")]
          for p in files[:max_files]:
              out.append(p)
              out.extend(hits[p])
          return "\n".join(out)
      ```

      - rg 退出码：**0 有匹配、1 无匹配、2 出错**。1 不是错误，要单独处理。
      - **显式传 `.` 作为搜索路径**：不传路径时，如果标准输入不是终端，rg 可能去搜标准输入，结果为空还不报错。
      - rg **默认遵守 .gitignore**，node_modules 一般已被忽略；`-g "!dist/**"` 再兜底。`--max-columns` 防止压缩过的单行 js 撑爆输出。
      - `--json` 每行一个事件，只取 `type == "match"`；非 UTF-8 内容没有 `text` 字段，用 `.get` 兜底。

      **② 按优先级和预算组装上下文**

      ```python
      # src/vca/context/budget.py
      from dataclasses import dataclass

      def estimate_tokens(text: str) -> int:
          # 粗估：中英混合约 3 字符 1 Token；运行后用模型返回的 usage 校准系数
          return len(text) // 3 + 1

      @dataclass
      class Section:
          name: str
          text: str
          priority: int            # 0 最重要；数字越大越先被裁
          required: bool = False   # system、任务原文：必须完整保留

      def truncate_middle(text: str, max_chars: int) -> str:
          if len(text) <= max_chars:
              return text
          head, tail = text[: max_chars * 2 // 3], text[-(max_chars // 3):]
          return f"{head}\n...[省略 {len(text) - max_chars} 字符，需要时用 read_file 分段读取]...\n{tail}"

      def assemble(sections: list[Section], budget: int) -> list[Section]:
          kept, used = [], 0
          for s in sorted(sections, key=lambda s: s.priority):
              cost = estimate_tokens(s.text)
              if s.required or used + cost <= budget:
                  kept.append(s)
                  used += cost
              elif budget - used > 300:            # 剩余空间还够放一段截断版
                  kept.append(Section(s.name, truncate_middle(s.text, (budget - used) * 3), s.priority))
                  used = budget
          return kept
      ```

      - 先排序再装箱：**重要的先放**，放不下的低优先级段落被截断或丢弃。
      - `required` 段即使超预算也保留（任务原文丢了，Agent 就不知道要干什么）。
      - 截断保留头尾：文件开头通常是 import 和 props 定义，结尾常是导出，中间最可省。

      **③ 两级压缩，切分点不拆开工具调用**

      ```python
      # src/vca/context/compact.py
      def safe_split(messages: list[dict], keep_last: int) -> int:
          """messages[:i] 可压缩，messages[i:] 原样保留。
          保留段不能以 tool 消息开头，否则它和发起调用的 assistant 消息分家，API 会报错。"""
          i = max(2, len(messages) - keep_last)
          while i > 2 and messages[i]["role"] == "tool":
              i -= 1
          return i

      def compact(messages: list[dict], llm, limit: int, keep_last: int = 8) -> list[dict]:
          if estimate_messages(messages) < limit * 0.8:
              return messages
          i = safe_split(messages, keep_last)
          for m in messages[2:i]:                              # 第一级：清理旧工具结果
              if m["role"] == "tool" and not m["content"].startswith("[cleared]"):
                  m["content"] = f"[cleared] 早期工具输出已清理（原 {len(m['content'])} 字符），需要时重新调用工具。"
          if estimate_messages(messages) < limit * 0.8:
              return messages
          summary = llm.chat([                                 # 第二级：结构化摘要
              {"role": "system", "content": SUMMARY_PROMPT},
              {"role": "user", "content": render_for_summary(messages[2:i])},
          ], tools=[]).content
          note = {"role": "user", "content": f"【前情摘要，由系统生成】\n{summary}"}
          return messages[:2] + [note] + messages[i:]          # system 与任务原文永远保留
      ```

      - `messages[:2]` 是 system 和原始任务，**永远不压缩**。
      - `safe_split` 往前挪，直到保留段的第一条不是 tool 消息：assistant(tool_calls) 和它的 tool 结果必须同进同退。
      - 第一级只换内容、保留 `tool_call_id`，消息结构不变，几乎没有风险；第二级会丢细节，所以 `SUMMARY_PROMPT` 要求按固定栏目写：目标、已改文件及原因、已确认的事实（如组件 props）、失败过的尝试、当前未解决的错误、下一步。
    ai_prompt: |
      # 任务：给 vca 增加仓库上下文能力（在 m1 代码基础上修改）

      ## 目标
      让 Agent 在较大的 Vue3 + TS 仓库里能快速定位相关代码，并在长对话中自动压缩上下文。

      ## 约束
      - 搜索用系统安装的 ripgrep（`rg`），通过 subprocess 调用 `rg --json`，命令参数用列表传递，不用 shell=True；pattern 用 `-e` 传入，搜索路径显式传 `.`。
