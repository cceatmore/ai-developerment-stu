      - 压缩时 `messages[0]`（system）和 `messages[1]`（任务原文）永远不改。
      - 不引入向量数据库；repo map 用正则提取（tree-sitter 作为后续优化，代码里留 TODO 即可）。

      ## 文件结构（新增）
      ```
