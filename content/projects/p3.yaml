      ## 详细要求
      1. `repo_map.py`：
         - `.vue` 文件提取：`defineProps`、`defineEmits`、`defineModel` 所在行（多行时取到配对的括号或尖括号结束，最多 8 行）、`<script setup>` 内的 import 行。
