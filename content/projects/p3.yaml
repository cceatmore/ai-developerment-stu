  - id: p3-m4
    name: "生成-测试-修复循环 + Checkpoint 断点恢复"
    unlock_day: 47
    minutes: 90
    features:
      - "外层修复循环：编辑 → 沙箱检查 → 失败信息结构化回传 → 再修复；有最大轮次，失败会退出"
      - "无进展检测：失败签名连续两轮相同就提前停止"
      - "受保护文件：测试文件、eslint/tsconfig/vitest 配置、package.json 禁止修改，并用 git diff 复核"
      - "Token 预算：累计超预算直接停止并报告"
      - "Checkpoint：每轮结束原子写 state.json + messages.json + patch.diff；vca resume 从下一轮继续"
      - "失败退出报告：做了什么、卡在哪、建议下一步"
    goal: |
      把 m1 的内层循环（读、搜、改）和 m3 的检查组合成**外层修复循环**：改完自动检查，失败就把精简报错喂回去再修。它必须**有上限、会止损、可恢复**。

      做完你能回答：**「长任务断了怎么恢复」「Agent 一直修不好怎么办」「怎么防止 Agent 改测试作弊」**。
    design: |
      **两层循环**
      - **内层**（m1）：一轮之内，模型自主读、搜、改，直到它认为改完了。
      - **外层**（本模块）：Harness **强制**跑 typecheck → lint → test，再决定继续还是停止。
      - 为什么检查必须由 Harness 强制执行，而不是交给模型决定：Anthropic 的长任务 harness 文章总结了两个典型失败——模型倾向于**没有充分测试就把功能标记为完成**，以及**过早宣布整个任务完成**。

      ```mermaid
      stateDiagram-v2
        state "编辑 内层 Agent 循环" as Edit
        state "沙箱检查" as Check
        state "判定" as Decide
        state "通过" as Passed
        state "失败退出" as Stopped
        [*] --> Edit
        Edit --> Check : 本轮修改完成
        Check --> Decide : 写 checkpoint
        Decide --> Passed : 全部通过且未碰受保护文件
        Decide --> Edit : 有新错误且未超轮次和预算
        Decide --> Stopped : 无进展 或 超轮次 或 超预算 或 环境错误
        Passed --> [*]
        Stopped --> [*]
      ```

      **止损条件（任一满足即停）**

      | 条件 | 结束状态 | 说明 |
      |---|---|---|
      | 全部检查通过，且没有改受保护文件 | passed | 成功 |
      | 达到 `max_rounds`（默认 4） | max_rounds | 给出失败报告 |
      | 本轮失败签名和上一轮相同 | no_progress | 签名 = 失败项（检查类型、文件、错误码或用例名）集合的哈希，**不含行号** |
      | 累计 Token 超过预算 | over_budget | 防止烧钱 |
      | 检查器本身出问题 | env_error | 再改代码也没用，交给人 |

      **防「作弊」**：模型为了让测试变绿，可能改测试、删断言、关 ESLint 规则、加 `// @ts-ignore`。
      1. Workspace 把 `*.spec.ts`、`*.test.ts`、`__tests__` 目录、`eslint.config.*`、`tsconfig*.json`、`vitest.config.*`、`package*.json` 设为**写保护**（编辑工具直接拒绝）。
      2. 每轮再用 `git diff --name-only HEAD` 复核一遍（纵深防御：万一以后加了别的写文件途径）。
      3. 新增的 `@ts-ignore`、`eslint-disable` 写进反馈并判定本轮失败（可配置）。

      **Checkpoint 与恢复**
      - 每轮结束写三个文件：`state.json`（轮次、状态、签名、历史、Token）、`messages.json`、`patch.diff`。
      - **原子写**：先写 `.tmp`，再 `os.replace` 替换；`state.json` **最后写**，它是这一轮的「提交点」。进程在任何时刻被杀，磁盘上的 state.json 都是完整的上一份。
      - **先判定状态再保存**：这样恢复时看到的状态一定和磁盘上的历史一致。
      - `vca resume <sid>`：读 state → 已结束就直接退出 → 比较当前 `git diff` 和 `patch.diff` 的哈希，不一致先警告让用户选择 → 恢复 messages → 从下一轮继续。
      - **恢复粒度是「轮」**：一轮内的操作都是本地文件编辑，可以从 patch 重建。将来如果加了有外部副作用的工具（自动提 PR、发通知），要加**幂等键**（见 Day 09、Day 33），恢复时先查是否已经执行过。

      **反馈 prompt**：第 2 轮起不重复整段任务（任务原文还在 messages 开头），只给「上一轮失败摘要 + 约束：不要改测试和配置、优先修第一个错误」。

      **和 Anthropic 长任务 harness 对照**：他们用 progress 文件 + git 提交 + JSON 格式的功能清单，让新的上下文窗口快速接上之前的工作；我们的 `state.json` + `patch.diff` + `events.jsonl` 是同一类「交接物」。
    data_flow: |
      1. `vca run` 创建会话，`FixState(round=0, status=running)`。
      2. 第 N 轮：生成本轮 prompt（第 1 轮是任务原文，之后是失败摘要）→ 内层 Agent 循环修改代码 → 累加 Token。
      3. `protected_changes()` 用 git diff 复核受保护文件；沙箱依次跑 typecheck、lint、test，得到三个 CheckResult。
      4. 计算失败签名，写入 history；`decide()` 得出新状态（passed / env_error / no_progress / over_budget / running）。
      5. `save_checkpoint()` 原子写 messages.json、patch.diff、state.json；写 `round_end` 事件。
      6. 状态不是 running 就退出；否则进入下一轮。轮次用完仍是 running → 改为 max_rounds 并保存。
      7. 中断后 `vca resume <sid>`：读 state.json 与 messages.json，校验工作区 diff，从 `round + 1` 继续第 2 步。
    key_code: |
      **① 状态、失败签名、停止判定**

      ```python
      # src/vca/fixloop.py
      import hashlib
      from dataclasses import dataclass, field

      CHECK_ORDER = ("typecheck", "lint", "test")

      @dataclass
      class FixState:
          task_id: str
          round: int = 0
          status: str = "running"   # running | passed | max_rounds | no_progress | over_budget | env_error
          tokens: int = 0
          last_signature: str | None = None
          history: list[dict] = field(default_factory=list)

      def failure_signature(results, touched: list[str]) -> str:
          keys: set[str] = set()
          for r in results:
              if r.ok:
                  continue
              if r.timed_out:
                  keys.add(f"{r.kind}|timeout")
              for e in r.errors:
                  keys.add(f"{r.kind}|{e.file}|{e.rule}")      # 故意不含行号
          keys |= {f"protected|{p}" for p in touched}
          return hashlib.sha1("\n".join(sorted(keys)).encode()).hexdigest()[:12]

      def decide(state: FixState, ok: bool, results, sig: str, token_budget: int) -> str:
          if ok:
              return "passed"
          if any(r.infra_error for r in results):
              return "env_error"
          if sig == state.last_signature:
              return "no_progress"
          if state.tokens > token_budget:
              return "over_budget"
          return "running"
      ```

      - 签名**不含行号**：模型在文件上方加了几行，同一个错误的行号就变了，但本质没修好；含行号会误判成「有进展」。代价是：同一文件同一规则的错误从 3 条修到 1 条，也会被判成无进展——所以只在**连续两轮完全相同**时才停。
      - `decide` 的顺序有讲究：先判成功，再判环境错误（再修代码没用），再判无进展，最后判预算。
      - `decide` 必须在更新 `last_signature` **之前**调用，否则永远是「和自己比」。

      **② 外层循环：先判定、再保存、再决定是否退出**

      ```python
      def fix_loop(task, agent, sandbox, store, *, max_rounds: int = 4,
                   token_budget: int = 300_000, state: FixState | None = None) -> FixState:
          state = state or FixState(task_id=task.id)
          while state.round < max_rounds and state.status == "running":
              state.round += 1
              store.event("round_start", round=state.round)
              prompt = task.prompt if state.round == 1 else feedback_prompt(state.history[-1])
              result = agent.run(prompt)                   # 内层循环，messages 接着上一轮
              state.tokens += result.tokens

              touched = protected_changes(agent.ws.root)   # git diff 复核受保护文件
              results = [sandbox.check(kind, agent.ws) for kind in CHECK_ORDER]
              ok = all(r.ok for r in results) and not touched
              sig = failure_signature(results, touched)
              state.history.append({"round": state.round, "ok": ok, "signature": sig,
                                    "feedback": to_feedback(results) + protected_note(touched)})
              state.status = decide(state, ok, results, sig, token_budget)
              state.last_signature = sig
              store.save_checkpoint(state, agent.messages, git_diff(agent.ws.root))
              store.event("round_end", round=state.round, status=state.status, signature=sig)

          if state.status == "running":                    # 轮次用完仍未成功
              state.status = "max_rounds"
              store.save_checkpoint(state, agent.messages, git_diff(agent.ws.root))
          store.event("stop", status=state.status, rounds=state.round, tokens=state.tokens)
          return state
      ```

      - `while` 条件同时看轮次和状态：恢复时如果 state 已经是 passed，循环一次都不会进。
      - 第 2 轮起只给失败摘要，**不重复任务原文**（它还在 messages 开头），省 Token，也让模型聚焦。
      - 受保护文件被改动时 `ok` 一定是 False，并且写进反馈：「你修改了测试文件 X，这是不允许的，请恢复并修改业务代码」。

      **③ 原子写 checkpoint**

      ```python
      # src/vca/session/store.py
      import json
      import os
      from dataclasses import asdict
      from datetime import datetime, timezone
      from pathlib import Path

      class SessionStore:
          def __init__(self, repo: Path, sid: str) -> None:
              self.dir = repo / ".vca" / "sessions" / sid
              self.dir.mkdir(parents=True, exist_ok=True)

          def event(self, kind: str, **data) -> None:
              line = json.dumps({"ts": datetime.now(timezone.utc).isoformat(), "type": kind, **data},
                                ensure_ascii=False)
              with open(self.dir / "events.jsonl", "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          def _atomic_write(self, name: str, text: str) -> None:
              tmp = self.dir / f"{name}.tmp"
              tmp.write_text(text, encoding="utf-8", newline="")   # newline="" 不做换行转换
              os.replace(tmp, self.dir / name)                      # 同目录替换：要么旧的，要么新的

          def save_checkpoint(self, state, messages: list[dict], patch: str) -> None:
              self._atomic_write("messages.json", json.dumps(messages, ensure_ascii=False))
              self._atomic_write("patch.diff", patch)
              self._atomic_write("state.json", json.dumps(asdict(state), ensure_ascii=False, indent=2))
      ```

      - 直接 `write_text` 覆盖时进程被杀，会留下半截 JSON，下次 resume 直接解析失败。写临时文件再 `os.replace`，磁盘上永远是完整的旧版或新版。
      - **state.json 最后写**：如果在写 messages 之后、写 state 之前崩溃，state 仍指向上一轮，恢复时重做这一轮，最多浪费一轮，但不会状态错乱。
      - `.vca` 目录在 m1 的 Workspace 里是禁止访问的：Agent 无法篡改自己的 checkpoint 和日志。m1 的 EventLog 在这里并入 SessionStore。
    ai_prompt: |
      # 任务：实现生成-测试-修复循环与断点恢复（在 m1~m3 基础上修改）

      ## 目标
      `vca run` 改为外层修复循环：每轮让 Agent 修改代码，然后在沙箱里依次跑 typecheck、lint、test；失败就把精简反馈交给下一轮；满足止损条件就停止。每轮保存 checkpoint，`vca resume <sid>` 能从中断处继续。

      ## 约束
      - 外层循环不调用模型做判断，停止条件全部由代码决定（见下方表格）。
      - 内层沿用 m1 的 Agent 循环；把它包成 `CodingAgent` 类，持有 `messages`、`ws`、`registry`，`run(prompt)` 在已有 messages 后追加一条 user 消息再进入循环，返回 AgentResult。
      - 受保护文件模式：`*.spec.ts`、`*.test.ts`、`*/__tests__/*`、`eslint.config.*`、`tsconfig*.json`、`vitest.config.*`、`package.json`、`package-lock.json`。用 `fnmatch.fnmatchcase` 对相对路径（统一用 `/` 分隔）匹配。edit_file / write_file 遇到受保护文件返回 ERROR；每轮再用 `git diff --name-only HEAD` 复核。
      - 新增代码中出现 `@ts-ignore`、`@ts-expect-error`、`eslint-disable` 时，在反馈里列出并判定本轮失败（配置项 `forbid_suppressions=True`）。
      - checkpoint 原子写：临时文件 + `os.replace`，`state.json` 最后写。
      - 停止条件与状态：passed、env_error、no_progress、over_budget、max_rounds（判定顺序与此相同）。

      ## 文件结构（新增或修改）
      ```
      src/vca/agent.py          # CodingAgent（封装 m1 的循环，保留 messages）
      src/vca/fixloop.py        # FixState、failure_signature、decide、fix_loop、feedback_prompt
      src/vca/gitutil.py        # git_diff(root)、changed_files(root)、protected_changes(root)、new_suppressions(root)
      src/vca/session/store.py  # SessionStore：event、save_checkpoint、load；并替换 m1 的 EventLog
      src/vca/cli.py            # vca run 增加 --max-rounds 4 --token-budget 300000；新增 vca resume SID、vca status SID
      src/vca/report.py         # 失败退出时生成 Markdown 报告：每轮做了什么、最后的失败摘要、建议下一步
