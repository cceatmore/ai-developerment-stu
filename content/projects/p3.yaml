      **两层防线，缺一不可**

      **第一层：命令白名单（应用层）**
      - 不提供通用 shell 工具。`run_check(kind)` 只有 `test / lint / typecheck` 三种，argv 写死在代码里。
      - 模型只能追加**仓库内已存在的文件路径**；以 `-` 开头的一律拒绝，防止参数注入（例如 `--config=恶意文件`）。
      - 为什么白名单还不够：Claude Code 官方文档明确写着，按命令文本匹配的 Bash 规则**不是安全边界**（同一个程序换种调用方式就绕过了），真正的边界要靠 OS 级沙箱。

      **第二层：容器隔离（系统层）**

      | 参数 | 防什么 |
      |---|---|
      | `--network none` | 断网：恶意依赖或被注入的代码无法把源码传出去 |
      | `--read-only` + `--tmpfs /tmp` | 根文件系统只读；只有 /tmp 和挂载的快照目录可写 |
      | `--cap-drop ALL` | 去掉全部 Linux capability（Docker 官方建议：只保留进程明确需要的） |
      | `--security-opt no-new-privileges` | 禁止进程通过 setuid 等方式提权 |
      | `--pids-limit` / `--memory` / `--cpus` | 防 fork 炸弹、内存泄漏、死循环拖垮宿主机 |
      | `--user 1000:1000` | 非 root 运行（官方 node 镜像里的 node 用户） |
      | `--rm` + 唯一 `--name` | 用完即删；超时后能按名字 `docker kill` |

      **快照而不是挂载真实仓库**：每次检查把工作区复制到临时目录（排除 node_modules、.git、dist、.vca），只把快照挂进容器。容器里发生什么都不影响你的仓库。

      **依赖两阶段**
      - **构建镜像时联网**：`npm ci` 把依赖装进镜像的 `/app/node_modules`；镜像 tag 带 lockfile 哈希，lockfile 变了才重建。
      - **运行时断网**：快照挂到 `/app/work`，Node 解析模块时会向上查找，能找到 `/app/node_modules`。
      - 这和 SWE-bench 用 Docker 镜像固定评测环境、Codex 云端「setup 阶段可联网装依赖、agent 阶段默认离线」是同一思路。
      - 坑：**不能把 Windows 主机的 node_modules 挂进 Linux 容器**，esbuild、rollup 这类带原生二进制的包平台不同，会直接报错。

      **结构化结果**

      | 检查 | 命令（容器内） | 解析方式 |
      |---|---|---|
      | test | `vitest run --reporter=json --outputFile=/out/vitest.json` | Jest 兼容 JSON：testResults[].assertionResults[] 的 status、fullName、failureMessages |
      | lint | `eslint <目标> -f json -o /out/eslint.json` | 每个文件的 messages[]：ruleId、severity、line、message |
      | typecheck | 以 fixture 的 type-check 脚本为准：create-vue 默认 `vue-tsc --build`；单 tsconfig 项目用 `vue-tsc --noEmit` | 文本 `文件(行,列): error TSxxxx: 信息`，正则解析 |

      统一成 `CheckResult(kind, ok, errors[], tests[], timed_out, infra_error, summary)`。

      **回传给模型要短而准**
      - 每类最多 12 条，每条截断到 300 字符，去重，按文件排序。
      - 退出码非 0、却一条错误都没解析到，或者退出码是 125/126/127（Docker 自身出错、命令无法执行、命令找不到）→ 标记 `infra_error`，明确告诉模型「这是环境问题，不是你的代码问题」，避免它去乱改业务代码。
      - **超时陷阱**：`subprocess.run(timeout=...)` 超时只杀掉了 docker 客户端进程，**容器还在跑**，必须 `docker kill <name>`。

      **CI（GitHub Actions）**
      - push 时：跑 Agent 自身的 pytest（FakeLLM，不耗 Token）→ 构建沙箱镜像 → 在 fixture 上跑一次三项检查做冒烟。
      - 真实模型评测用 `workflow_dispatch` 手动触发，Key 放仓库 Secrets（m5 接入）。

      ```mermaid
      sequenceDiagram
        participant A as Agent 循环
        participant R as run_check 工具
        participant S as 快照目录
        participant D as Docker 容器
        participant P as 结果解析器
        A->>R: run_check kind=test files
        R->>R: 校验 kind 在白名单 文件路径合法
        R->>S: 复制工作区 排除 node_modules 和 .git
        R->>D: docker run 断网 只读 限资源 非 root
        alt 正常结束
          D-->>R: 退出码 + /out 下的 JSON
          R->>P: 解析 vitest eslint vue-tsc 输出
          P-->>A: 精简反馈 最多 12 条
        else 超时
          R->>D: docker kill 容器名
          R-->>A: timed_out 可能有死循环
        end
      ```
    data_flow: |
      1. 模型调用 `run_check(kind="test", files=["src/components/__tests__/BaseButton.spec.ts"])`。
      2. 工具校验：kind 必须在白名单；每个文件必须在快照目录内、已存在、不以 `-` 开头；typecheck 不接受文件参数。
      3. `make_snapshot()` 把工作区复制到新的临时目录；同时新建一个空的输出目录（**每次都是新的**，避免读到上一次的旧报告）。
      4. 组装 `docker run --rm --name vca-test-xxxx <加固参数> -v 快照:/app/work -v 输出目录:/out 镜像 命令`，带超时执行。
      5. 正常结束 → 按 kind 调用解析器读 `/out/*.json` 或 stdout → `CheckResult`；超时 → `docker kill` → `timed_out=True`。
      6. `to_feedback()` 把 CheckResult 变成精简文本回传给模型，完整结果写入事件日志（`check_result` 事件），临时目录清理。
    key_code: |
      **① 白名单 + 加固参数 + 超时处理**

      ```python
      # src/vca/sandbox/runner.py
      import subprocess
      import uuid
      from pathlib import Path
      from typing import Literal

      from ..tools.registry import ToolError
      from .models import CheckResult
      from .parsers import PARSERS

      CheckKind = Literal["test", "lint", "typecheck"]
      BIN = "/app/node_modules/.bin"

      COMMANDS: dict[str, list[str]] = {             # 白名单：模型只能选 kind
          "test": [f"{BIN}/vitest", "run", "--reporter=json", "--outputFile=/out/vitest.json"],
          "lint": [f"{BIN}/eslint", "-f", "json", "-o", "/out/eslint.json"],
          "typecheck": [f"{BIN}/vue-tsc", "--build", "--force"],
      }

      HARDEN = [
          "--network", "none",
          "--read-only", "--tmpfs", "/tmp:rw,size=256m",
          "--cap-drop", "ALL",
          "--security-opt", "no-new-privileges",
          "--pids-limit", "256", "--memory", "1g", "--cpus", "1",
          "--user", "1000:1000",
      ]

      def run_check(kind: CheckKind, snapshot: Path, out_dir: Path, image: str,
                    files: list[str] | None = None, timeout: int = 180) -> CheckResult:
          root = snapshot.resolve()
          targets: list[str] = []
          for f in files or []:
              p = (root / f).resolve()
              if f.startswith("-") or not p.is_relative_to(root) or not p.exists():
                  raise ToolError(f"illegal file argument: {f}")
              targets.append(p.relative_to(root).as_posix())
          if kind == "typecheck" and targets:
              raise ToolError("typecheck always checks the whole project; do not pass files")
          argv = COMMANDS[kind] + (targets or (["."] if kind == "lint" else []))

          name = f"vca-{kind}-{uuid.uuid4().hex[:8]}"
          cmd = ["docker", "run", "--rm", "--name", name, *HARDEN,
                 "-v", f"{root}:/app/work:rw", "-v", f"{out_dir.resolve()}:/out:rw",
                 "-w", "/app/work", "-e", "CI=1", image, *argv]
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, encoding="utf-8",
                                    errors="replace", timeout=timeout)
          except subprocess.TimeoutExpired:
              subprocess.run(["docker", "kill", name], capture_output=True)
              return CheckResult(kind=kind, ok=False, timed_out=True,
                                 summary=f"{kind} timed out after {timeout}s (possible infinite loop)")
          except FileNotFoundError:
              return CheckResult(kind=kind, ok=False, infra_error=True,
                                 summary="docker CLI not found; install or start Docker Desktop")
          return PARSERS[kind](proc.returncode, proc.stdout, proc.stderr, out_dir)
      ```

      - `COMMANDS` 是**唯一**能被执行的命令来源。模型传进来的只有 kind 和文件路径，而且路径要过三关：不以 `-` 开头、在快照内、真实存在。
      - 参数用**列表**传给 subprocess，不经过 shell，模型无法用 `;`、`&&`、`$( )` 拼接命令。
      - 容器内直接调用 `/app/node_modules/.bin/vitest`，不用 `npx`：断网环境下 npx 找不到本地包时会尝试联网下载。
      - `TimeoutExpired` 后必须 `docker kill`：超时只杀了 docker 客户端，容器还会在后台继续跑满 CPU。
      - typecheck 不接受文件参数：给 vue-tsc 传单个文件会绕过 tsconfig，得出和 CI 不一致的结论。

      **② 解析 vue-tsc 输出，并区分「代码错误」和「环境错误」**

      ```python
      # src/vca/sandbox/parsers.py（节选）
      import re

      TSC_LINE = re.compile(
          r"^(?P<file>.+?)\((?P<line>\d+),(?P<col>\d+)\): error (?P<code>TS\d+): (?P<msg>.+)$")

      def parse_typecheck(code: int, stdout: str, stderr: str, out_dir) -> CheckResult:
          if code in (125, 126, 127):                    # Docker 自身或命令本身出了问题
              return CheckResult(kind="typecheck", ok=False, infra_error=True,
                                 summary=tail(stderr or stdout, 1500))
          errors = [
              CheckError(file=m["file"].removeprefix("/app/work/"), line=int(m["line"]),
                         rule=m["code"], message=m["msg"])
              for m in map(TSC_LINE.match, stdout.splitlines()) if m
          ]
          if code != 0 and not errors:                   # 失败却解析不出任何错误：多半是配置问题
              return CheckResult(kind="typecheck", ok=False, infra_error=True,
                                 summary=tail(stdout + stderr, 1500))
          return CheckResult(kind="typecheck", ok=code == 0, errors=errors)
      ```

      - 容器没分配终端（没有 `-t`），TypeScript 默认输出非彩色的 `文件(行,列): error TSxxxx: 信息` 格式，正则就能解析。
      - **infra_error 是关键设计**：如果把「配置文件写错」「Docker 没启动」也当成代码错误喂给模型，它会去乱改组件代码，越修越坏。m4 遇到 infra_error 会直接停止。
      - vitest 解析同理：读 `/out/vitest.json`；文件不存在说明 vitest 在生成报告前就崩了（比如配置错误）→ infra_error。注意 JSON 里的文件路径是容器内绝对路径，要去掉 `/app/work/` 前缀。

      **③ 反馈给模型：有上限、有优先级**

      ```python
      def to_feedback(results: list[CheckResult], max_errors: int = 12) -> str:
          lines: list[str] = []
          for r in results:
              if r.ok:
                  lines.append(f"[{r.kind}] PASS")
              elif r.infra_error:
                  lines.append(f"[{r.kind}] ENVIRONMENT PROBLEM, not caused by your code: {r.summary}")
              elif r.timed_out:
                  lines.append(f"[{r.kind}] TIMEOUT: {r.summary}")
              else:
                  lines.append(f"[{r.kind}] FAIL ({len(r.errors)} errors)")
                  for e in r.errors[:max_errors]:
                      lines.append(f"  {e.file}:{e.line} {e.rule} {e.message[:300]}")
                  if len(r.errors) > max_errors:
                      lines.append(f"  ... {len(r.errors) - max_errors} more; fix the ones above first")
          return "\n".join(lines)
      ```

      - 100 条 ESLint 错误全塞给模型只会稀释注意力。先给最前面 12 条，修完再看下一批。
      - 超时单独说明「可能有死循环」：比如模型写了一个会无限触发自身的 watch，这是代码问题，要让模型去修。
