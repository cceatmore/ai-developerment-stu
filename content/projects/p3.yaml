      - `test_fs_tools.py`：edit_file 的空 old_str / 0 次 / 多次 / 唯一匹配；approver 返回 False 时文件不变；CRLF 文件编辑后仍是 CRLF；write_file 不能覆盖已有文件。
      - `test_loop.py`：FakeLLM 脚本「read_file → edit_file → 结束」完整跑通；模型一直调用工具时在 max_steps 停止并返回 `status="max_steps"`；每个 tool 消息的 tool_call_id 与对应调用一致。
