      reference: |
        **上传**：接口只做轻活。校验扩展名白名单和大小（多读 1 字节判断是否超限），计算 sha256，同部门有相同文件直接返回已有记录。然后写入 documents（pending），flush 拿到 id，按 id 生成存储路径落盘，**提交事务后**再把 id 推进 Redis 队列，立即返回 202。顺序很重要：如果先入队，Worker 可能在事务提交前就去查，查不到记录。存储路径用 id 而不是用户的文件名，防止路径穿越。

        **为什么独立 Worker**：解析一份上百页的 PDF 要很久，放在 API 进程的 BackgroundTasks 里会抢 CPU 拖慢问答，API 重启任务就丢。独立 Worker 进程从 Redis 取任务，可以单独扩容。

        **不重复不丢失**：Worker 取到 id 后用一条 `UPDATE ... WHERE status IN (pending, failed) RETURNING id` 抢占，只有一个 Worker 能成功，重复投递也只执行一次。进程崩溃会让文档卡在 parsing，所以 Worker 启动时把超时的中间状态重置并重新入队。BRPOP 取出后崩溃消息会丢，靠这个恢复兜底，更可靠可以换 Redis Stream 消费组。

        **解析的坑**：Word 必须用 `iter_inner_content` 按文档顺序拿段落和表格，只读 paragraphs 会丢掉表格；标题通过样式名识别层级，表格转 Markdown。PDF 逐页抽取保留页码，删除在一半以上页面重复的短行（页眉页脚）和独立页码行，中文 PDF 常在句中断行，按句末标点合并。平均每页抽不到 20 个字判定为扫描件，标记 NEEDS_OCR 告诉用户。

        所有格式最后都输出统一的 Block 列表（类型、文本、页码、层级），切片只依赖 Block，新增格式只要加一个解析函数。我还做了预览接口，亲眼检查解析质量。
      oral: |
        上传接口只做校验、sha256 去重、写库和落盘，提交事务后才把 id 推到 Redis 队列，然后直接返回 202。解析放在独立 Worker 里，不抢 API 的 CPU，API 重启也不丢任务。Worker 用一条带状态条件的 UPDATE 抢占任务，保证同一文档只处理一次，启动时还会恢复卡死的任务。解析上，Word 要按文档顺序读段落和表格，否则表格会丢；PDF 要去页眉页脚、页码，合并句中断行；扫描件我识别出来标记成需要 OCR。所有格式都统一成 Block 列表，切片只认这个结构。

  - id: p1-m7
    name: 切片、向量化入库与文档更新
    unlock_day: 23
    minutes: 90
    features: [按结构切片, 长段落递归切分, 重叠, 章节路径上下文前缀, 表格切片, jieba 分词, 批量 Embedding, 事务内版本替换, 文档更新与删除]
    goal: |
      把 m6 的 Block 列表切成适合检索的切片：**先按标题结构分节，节内按长度递归切分并保留重叠**，每片附带「文档标题 > 章节路径」作为上下文前缀；然后 **jieba 分词**写入关键词列、**批量调用 Embedding** 写入向量列，**在一个事务里替换**该文档的全部切片。同时支持**重新上传更新文档**和**删除文档**。

      完成后文档状态从 `indexing` 变成 `ready`，知识库第一次真正「有内容可查」。
    design: |
      **1. 切片的目标**（见 Day 23）：每一片**自身语义完整、长度适中**。太长 → 一片里混了多个主题，向量被「平均」，检索不准，还浪费上下文；太短 → 丢上下文，「它」「上述规定」指代不明。

      **2. 三层切法**

      | 层次 | 规则 | 理由 |
      |---|---|---|
      | 结构 | 遇到 heading 就结束当前片，更新章节路径 | 不跨章节，主题不混 |
      | 长度 | 同一节内累积段落到 `max_chars`（默认 600 字）就切 | 控制大小 |
      | 递归 | 单个段落超长时在句末标点处切，相邻片重叠 `overlap`（默认 80 字） | 不在句子中间断开；重叠防止答案正好被切在边界 |

      **600 / 80 只是起点**：最佳值和文档类型、Embedding 模型有关，m11 用评测集对比 400 / 600 / 900 再定。

      **3. 章节路径前缀（轻量版 contextual retrieval）**
      - 切片「满一年可休 5 天」单独看不知道在说什么；加上前缀「员工手册 > 第三章 假期 > 年假」就清楚了。
      - **前缀参与 Embedding 和分词，但 `content` 只存正文**，展示给用户的引用片段干净。
      - Anthropic 的 Contextual Retrieval 用 LLM 为每个切片生成一段上下文说明，效果更好但每片多一次模型调用；我们先用零成本的章节路径，作为进阶选项写进 deep_dive。

      **4. 表格**：整张表 ≤ 1.5 倍 `max_chars` 时作为一片；更长时**按行切分，每片都重复表头**——否则第二片只剩「| 10-20 年 | 10 天 |」，看不出列含义。

      **5. 分词与向量化**
      - `jieba.cut_for_search` 切词（会额外产出长词的子词，召回更全），只保留字母数字汉字组成的词，小写，空格连接写入 `content_tokens`。**数据库生成列自动算出 tsv**。
      - 公司专有名词（产品名、系统名、编号）用 `jieba.load_userdict` 加入自定义词典，否则会被切碎。
      - Embedding 分批调用（百炼 `text-embedding-v4` 一次最多 10 条，按厂商限制配置），**按返回的 `index` 排序**后与切片一一对应，并校验维度。

      **6. 事务内替换 = 文档更新的核心**
      - 先在**事务外**完成解析、切片、向量化（慢、要调外部 API）。
      - 再开**一个短事务**：删除该文档旧切片 → 插入新切片 → `version + 1` → `status = ready`。
      - PostgreSQL 的 MVCC 保证：提交前其他查询看到的是旧切片，提交后看到新切片，**不会出现「一半新一半旧」或「短暂查不到」**。
      - 如果把 Embedding 调用放进事务里，事务会持续几十秒，长时间持有锁和连接——这是常见反模式。

      **7. 更新与删除**
      - `PUT /api/documents/{id}/file`：重新上传。sha256 没变 → 直接返回「内容未变化」；变了 → 覆盖文件、状态置 pending、入队，Worker 重跑 m6 + m7。**旧切片在新切片就绪前一直可检索**。
      - `DELETE /api/documents/{id}`：删除文档行（切片级联删除）和文件。
      - 每次入库成功或删除后 `INCR kb:version`（Redis），m12 的答案缓存键包含它，内容变化后旧缓存自然失效。
    data_flow: |
      ```mermaid
