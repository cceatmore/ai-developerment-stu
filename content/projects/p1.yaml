id: p1
title: 企业知识库问答系统（RAG）
role: AI 应用开发工程师（同时覆盖 AI Agent 岗常问的路由、检索决策与评测能力）
intro: |
  ## 一句话

  员工上传公司制度、产品手册、FAQ 等文档，系统自动**解析 → 切片 → 入库**；员工用自然语言提问，系统用**混合检索（向量 + 关键词 + RRF）+ 重排**找到相关片段，大模型生成**带引用来源**的回答，资料里没有就**明确拒答**；不同部门**只能检索到有权限的文档**；效果用**评测集 + 评测脚本**量化，改进前后有数据对比。

  ## 为什么做这个项目

  - **RAG 是 2026 年 AI 应用岗 JD 出现频率最高的能力**，而且面试官会一路追问到「切片怎么定」「为什么要重排」「怎么证明效果」「权限怎么隔离」——这个项目就是按这些追问点设计的（见 market）。
  - **你的前端背景直接变成优势**：流式聊天、引用卡片、停止生成、文档管理页，都是你最熟的东西；很多后端出身的候选人这里做得很粗糙。
  - **对 Agent 岗同样有用**：意图路由（m5）就是 workflow 的「路由模式」（见 Day 31）；查询改写和拒答是 Agentic RAG（见 Day 28）的基础；评测脚本的思路和 Agent 评测（见 Day 41~42）一致。

  ## 学习方式（重要）

  你可以**让 AI 写大部分代码**，但每个模块你自己必须做到 4 件事：

  1. **讲得清架构**：这个模块在整体里处于什么位置，上下游是谁。
  2. **讲得清数据流**：一个请求进来，数据经过哪些函数、变成什么形状、存到哪里。
  3. **读得懂 `key_code`**：逐段读懂，能指出「哪一行改错了会出什么事」。
  4. **讲得清技术决策**：为什么这样做、备选方案是什么、代价是什么。

  **每个模块的固定流程（30~90 分钟）**：

  | 步骤 | 做什么 | 时间 |
  |---|---|---|
  | 1 | 读 goal / design / data_flow | 10 分钟 |
  | 2 | 把 `ai_prompt` 整段粘给 Cursor，让它实现 | 15~40 分钟 |
  | 3 | 对照 `key_code` 读 AI 写出来的代码，不一致就问 AI 为什么 | 10 分钟 |
  | 4 | 按 tests 四类清单逐条跑（功能 / 接口 / 异常 / 代码审查） | 10~20 分钟 |
  | 5 | **先自己口述** retell，再看参考答案 | 5 分钟 |
  | 6 | `git commit -m "p1-mN: 模块名"`，面试时可以展示演进过程 | 1 分钟 |

  > 时间不够就做到第 4 步，下次从第 5 步继续。**tests 一定要真的跑**，面试官问的「你怎么验证的」就靠它。

  ## 12 个模块一览

  | 模块 | 解锁 | 产出 |
  |---|---|---|
  | m1 | Day 07 | FastAPI 骨架：分层、配置、统一错误、request_id |
  | m2 | Day 08 | 数据模型：文档、切片（含权限字段）、会话表与 Alembic 迁移 |
  | m3 | Day 10 | Docker Compose（PG + Redis + API）与 SSE 流式接口、最小前端 |
  | m4 | Day 14 | LLM 客户端：OpenAI 兼容封装、超时重试、流式、错误映射 |
  | m5 | Day 16 | 意图识别：结构化输出 + Pydantic 校验 + 路由 |
  | m6 | Day 22 | 文档上传与解析：PDF / Word / Markdown，清洗与元数据 |
  | m7 | Day 23 | 切片、向量化入库、文档更新（版本替换） |
  | m8 | Day 25 | 混合检索：向量 + 关键词 + RRF 融合，全程带权限过滤 |
  | m9 | Day 26 | 重排与查询改写（多轮指代消解） |
  | m10 | Day 27 | 带引用回答、拒答策略、Vue3 流式聊天界面 |
  | m11 | Day 29 | 评测集与评测脚本：Recall@K、MRR、拒答准确率、faithfulness |
  | m12 | Day 30 | ACL 权限隔离加固、JWT 登录、生产部署 |

  ## 做完你手里有什么

  - 一个 `docker compose up -d` 就能启动的完整系统（前端 + 后端 + Worker + PG + Redis）。
  - 一份**你自己跑出来的评测报告**：基线 vs 混合检索 vs 加重排，Recall@K、拒答准确率、faithfulness 的对比表。
  - 架构说明、部署文档、1 分钟 / 3 分钟项目介绍（见 materials），以及 14 道面试官深挖题（见 deep_dive）。

market: |
  ## 为什么市场需要这个项目

  **企业落地大模型，第一个场景几乎都是「内部知识库问答」**：制度、流程、产品资料分散，员工找信息靠问人。但「能跑的 Demo」和「能上线的系统」差距很大，招聘方要的是后者。下面是检索到的 2026 年真实 JD 原文要点（2026-11 检索）：

  | 公司 / 岗位（发布时间） | JD 原文要点 |
  |---|---|
  | 深圳市广厦人工智能技术 · AI 应用开发工程师（前程无忧，2026-08） | 「负责 RAG 知识库建设，包括**文档解析、文本切分、向量化、检索、Rerank、查询改写、引用溯源**及召回效果优化」；「熟悉 FastAPI」；「了解 Vue、React」 |
  | 摩尔线程 · 智能 Agent 大模型开发工程师（2026-06） | 「主导企业级 RAG 系统全链路……**多轮召回重排、知识库权限隔离、增量更新、混合检索优化**」；向量库列出 Milvus / Chroma / **PgVector** |
  | 曙光信息 · AI Agent 工程师 - 组件与评测（猎聘，2026-11 更新） | 「数据接入、解析清洗、**索引更新、混合检索、重排、权限治理和引用溯源**」；「评测体系覆盖……**知识检索质量**」；「具备**评测集构建、指标设计**、自动化测试、Tracing 和问题归因能力」 |
  | 成都某教育集团 · 高级 AI 应用工程师（知识库 / Agent 方向，2026-11） | 「持续优化**召回、重排、引用溯源、无答案处理**及回答准确性」；「熟悉 REST、**SSE**……Redis」；「建立 AI 应用评测体系，包括**评测数据集、自动化回归**」；「**权限隔离**、敏感信息脱敏」 |
  | 软通动力 · AI 应用开发工程师（智联招聘） | 「chunk 策略、召回优化（过滤 / **混合检索**）、重排（rerank）、**引用溯源与防幻觉**」；加分项「**pgvector**」「**Ragas** / DeepEval 等，并能做回归评测」 |

  **共同信号**：

  - JD 不再写「会用 LangChain 搭 RAG」，而是写**具体环节**：解析、切分、混合检索、重排、改写、引用、拒答。
  - **「怎么证明效果」成为硬要求**：评测集、指标、回归。没有数字的 RAG 项目在面试里很难过深挖。
  - **权限隔离、增量更新**是「企业级」的分水岭，Demo 项目几乎都没有。
  - AI 应用岗普遍要求「了解前端、能联调」，你的 Vue 背景是加分项，不是短板。

  ## 本项目命中的 JD 关键词

  | JD 关键词 | 对应模块 | 你能讲出的具体做法 |
  |---|---|---|
  | 文档解析 / 清洗 | m6 | PDF 按页、Word 段落与表格按顺序、页眉页脚去重、扫描件识别 |
  | 文本切分 / chunk 策略 | m7 | 按标题结构切 + 长段落递归切 + 重叠；章节路径作为上下文前缀 |
  | Embedding / 向量检索 / pgvector | m2、m7、m8 | HNSW + 余弦距离；过滤导致结果不足用 iterative scan |
  | 混合检索 / BM25 | m8 | 向量 + 关键词两路召回，RRF 按名次融合 |
  | Rerank / 重排 | m9 | Cross-encoder 对 Top-30 精排取 Top-6，超时降级 |
  | 查询改写 / 多轮 | m9 | 多轮指代消解成独立问题，改写结果可观测 |
  | 引用溯源 / 防幻觉 / 无答案处理 | m10 | 编号引用 + 引用校验 + 检索前后两道拒答闸门 |
  | 结构化输出 / 意图识别 | m5 | Pydantic 校验 + 修复重试 + 兜底路由 |
  | SSE 流式 | m3、m10 | 事件协议 meta / token / citations / done / error |
  | 评测集 / 指标 / 回归 / Ragas | m11 | Recall@K、MRR、拒答准确率、faithfulness，多配置对比 |
  | 权限隔离 / 权限治理 | m8、m12 | 权限条件下沉到检索 SQL，两路召回都过滤，缓存键含权限范围 |
  | 增量更新 / 索引更新 | m7、m12 | sha256 去重、版本号、事务内替换切片 |
  | Docker / 部署 | m3、m12 | Compose 编排、健康检查、nginx 反代 SSE |

tech_stack: |
  ## 技术栈与选型理由

  | 层 | 技术 | 为什么选它 | 备选 |
  |---|---|---|---|
  | 语言与包管理 | Python 3.12+、uv | 课程统一；uv ≈ pnpm，锁文件可复现 | pip + venv |
  | Web 框架 | FastAPI（≥ 0.135，自带 `fastapi.sse`） | 异步、Pydantic v2 校验、原生 SSE | Flask（无原生异步校验） |
  | ORM 与迁移 | SQLAlchemy 2（async）+ Alembic + psycopg 3 | 主流写法，类型注解友好 | SQLModel |
  | 数据库 | PostgreSQL 18 + pgvector 0.8.x | **向量、全文索引、业务数据、权限字段在同一个库**，一条 SQL 完成「权限过滤 + 排序」，入库一个事务 | Milvus / Qdrant（多一个组件，数据同步成本） |
  | 中文关键词检索 | jieba 预分词 + PG 全文索引（tsvector + GIN） | 零额外组件，用官方 pgvector 镜像即可 | ParadeDB `pg_search`（真 BM25，`pdb.jieba` 分词器）、zhparser 扩展 |
  | 缓存 / 队列 / 限流 | Redis | 入库任务队列、限流计数、答案缓存 | RabbitMQ（本项目不需要） |
  | 大模型 | OpenAI 兼容 Chat Completions（DeepSeek / 通义百炼 / OpenAI 均可） | 换厂商只改 `base_url`、`api_key`、`model` 三个环境变量 | 各厂商原生 SDK |
  | Embedding | OpenAI 兼容 `/embeddings`（如百炼 `text-embedding-v4`，默认 1024 维） | 中文效果好、可选维度；用 OpenAI SDK 直接调 | 本地 bge-m3 |
  | 重排 | 百炼 `qwen3-rerank`（OpenAI 兼容 `/reranks`）或本地 `BAAI/bge-reranker-v2-m3` | API 免运维；本地版免费、数据不出内网 | Cohere / Jina Rerank |
  | 评测 | 自写 Recall@K / MRR + RAGAS 0.4（`ragas.metrics.collections.Faithfulness`） | 检索指标自己算最透明；faithfulness 用成熟实现 | DeepEval |
  | 前端 | Vue3 + TypeScript + Vite | 你的主场；fetch + ReadableStream 解析 SSE | — |
  | 部署 | Docker Compose + nginx | 一键启动；nginx 托管前端并反代 API | K8s（规模不需要） |

  ## 技术核对记录（2026-11，写代码前 AI 可能给你旧写法，以此为准）

  - **pgvector**：当前 0.8.7，官方镜像标签如 `pgvector/pgvector:pg18-trixie`。`vector` 类型建索引最多 2000 维，`halfvec` 最多 4000 维。HNSW 默认 `hnsw.ef_search = 40`；**带过滤条件时近似索引是先扫再过滤**，结果可能不足，0.8.0 起用 `SET hnsw.iterative_scan = relaxed_order` 让它继续扫描（上限 `hnsw.max_scan_tuples`，默认 20000）。
  - **PostgreSQL 18 官方镜像**：数据目录改为 `/var/lib/postgresql/18/docker`，Compose 里的卷要挂到 **`/var/lib/postgresql`**（旧写法 `/var/lib/postgresql/data` 会导致启动报错或数据不在你以为的位置）。
  - **PostgreSQL 全文检索排序**：`ts_rank` / `ts_rank_cd` 只看词频、邻近度和位置，**不使用全库统计（没有 IDF），所以不是标准 BM25**。本项目默认方案叫「关键词通道」，要真 BM25 用 ParadeDB（见 m8 进阶）。
  - **FastAPI SSE**：0.135.0 起有 `from fastapi.sse import EventSourceResponse, ServerSentEvent`，自动每 15 秒发 ping 注释、设置 `Cache-Control: no-cache` 和 `X-Accel-Buffering: no`。旧写法是第三方 `sse-starlette` 或手拼 `StreamingResponse`。
  - **OpenAI Python SDK**：当前 3.x。默认超时 **10 分钟**、默认自动重试 2 次；**流式消费过程中断不会自动重试**。生命周期用 `lifespan`，不要用旧的 `@app.on_event`。
  - **DeepSeek**：OpenAI 兼容 `base_url` 为 `https://api.deepseek.com`；JSON Output 需要 `response_format={"type": "json_object"}`，且提示词里必须出现 `json` 字样，可能返回空内容需要兜底重试。模型名会变，**一律放环境变量**。
  - **百炼**：Embedding 与 Chat 的 OpenAI 兼容地址形如 `https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1`（以控制台为准）；`text-embedding-v4` 一次最多 10 条。`qwen3-rerank` 的 OpenAI 兼容接口是 `/compatible-api/v1/reranks`，单次最多 500 个文档；**官方说明其分数是本次请求内的相对分数，不能跨请求当绝对值比较**。`gte-rerank` 已于 2026-05-30 下线。
  - **RAGAS**：当前 0.4.3。新写法 `from ragas.llms import llm_factory`、`from ragas.metrics.collections import Faithfulness`、`await scorer.ascore(user_input=..., response=..., retrieved_contexts=...)`，结果取 `.value`。旧的 `SingleTurnSample` + `single_turn_ascore` 将在 1.0 移除。

  **参考链接（实际打开核对过）**：
  - pgvector：https://github.com/pgvector/pgvector
  - pgvector-python（SQLAlchemy、RRF 示例）：https://github.com/pgvector/pgvector-python
  - PostgreSQL 全文检索排序：https://www.postgresql.org/docs/current/textsearch-controls.html
  - PG18 镜像数据目录变更：https://github.com/docker-library/postgres/pull/1259
  - FastAPI SSE：https://fastapi.tiangolo.com/tutorial/server-sent-events/
  - OpenAI Python SDK：https://github.com/openai/openai-python
  - DeepSeek API：https://api-docs.deepseek.com/zh-cn/ ，JSON Output：https://api-docs.deepseek.com/zh-cn/guides/json_mode
  - 百炼 Embedding：https://help.aliyun.com/zh/model-studio/embedding-interfaces-compatible-with-openai
  - 百炼 文本排序：https://help.aliyun.com/zh/model-studio/text-rerank-api
  - bge-reranker-v2-m3：https://huggingface.co/BAAI/bge-reranker-v2-m3
  - ParadeDB Jieba 分词器：https://www.paradedb.com/docs/reference/tokenizers/available-tokenizers/jieba
  - RAGAS Faithfulness：https://docs.ragas.io/en/v0.4.3/concepts/metrics/available_metrics/faithfulness/
  - Anthropic Contextual Retrieval：https://www.anthropic.com/news/contextual-retrieval

architecture: |
  ## 一、整体架构

  核心思路：**API 只做编排与鉴权；重活（解析、向量化）交给独立 Worker；检索与权限过滤在同一个 PostgreSQL 里完成；所有模型调用走统一客户端**。

  ```mermaid
  flowchart TB
    subgraph FE["前端 Vue3 + TS"]
      UI["聊天页 流式渲染 引用卡片"]
      ADM["文档管理页 上传 状态 权限"]
    end
    subgraph API["FastAPI 应用"]
      MW["中间件 request_id 统一异常 限流"]
      AUTH["鉴权依赖 当前用户与部门"]
      DOCAPI["文档接口 上传 更新 删除"]
      CHAT["问答接口 SSE"]
    end
    subgraph RAG["RAG 编排"]
      INT["意图识别 结构化输出"]
      RW["查询改写 指代消解"]
      HY["混合检索 向量加关键词 RRF"]
      RR["重排 Cross-encoder"]
      GEN["生成 引用校验 拒答"]
    end
    subgraph ING["入库 Worker 独立进程"]
      PARSE["解析 清洗"]
      CHUNK["切片 分词 向量化"]
    end
    subgraph DATA["数据层"]
      PG[("PostgreSQL pgvector 全文索引")]
      RD[("Redis 队列 限流 缓存")]
      FS[("文件卷 原始文档")]
    end
    LLM["OpenAI 兼容 LLM"]
    EMB["Embedding 与 Rerank 服务"]
    UI --> MW
    ADM --> MW
    MW --> AUTH
    AUTH --> DOCAPI
    AUTH --> CHAT
    DOCAPI --> FS
    DOCAPI --> PG
    DOCAPI --> RD
    RD --> PARSE
    PARSE --> CHUNK
    CHUNK --> EMB
    CHUNK --> PG
    CHAT --> INT
    INT --> RW
    RW --> HY
    HY --> PG
    HY --> RR
    RR --> EMB
    RR --> GEN
    GEN --> LLM
    INT --> LLM
  ```

  ## 二、两条主数据流

  **离线入库**（上传后异步）：上传 → 校验类型大小 → sha256 去重 → 落盘 → `documents(status=pending)` → 提交事务后投递 Redis 队列 → Worker 抢占任务 → 解析清洗 → 按结构切片 → jieba 分词 + 批量 Embedding → **一个事务内**删旧切片、插新切片、版本号加 1 → `status=ready`。

  **在线问答**（一次提问）：

  ```mermaid
  sequenceDiagram
    participant U as 浏览器
    participant A as FastAPI
    participant L as LLM
    participant P as PostgreSQL
    participant R as Rerank 服务
    U->>A: POST /api/chat/stream 问题和 JWT
    A->>A: 鉴权 限流 读取最近几轮对话
    A->>L: 意图识别与查询改写 输出 JSON
    L-->>A: intent 和独立问题
    A->>P: 向量通道 Top-30 带权限条件
    A->>P: 关键词通道 Top-30 带权限条件
    A->>A: RRF 融合 取 Top-30
    A->>R: 问题加 30 个候选
    R-->>A: 相关度排序
    A->>A: 拒答闸门 一 证据不足直接拒答
    A->>L: 编号片段加规则 流式生成
    L-->>A: token 流
    A-->>U: SSE token 事件
    A->>A: 拒答闸门 二 校验引用编号
    A-->>U: SSE citations 和 done 事件
    A->>P: 保存消息 引用 耗时 token 用量
  ```

  ## 三、核心表结构

  ```mermaid
  erDiagram
    DEPARTMENTS ||--o{ USERS : "包含"
    DEPARTMENTS ||--o{ DOCUMENTS : "归属"
    USERS ||--o{ DOCUMENTS : "上传"
    DOCUMENTS ||--o{ CHUNKS : "切分为"
    USERS ||--o{ CONVERSATIONS : "拥有"
    CONVERSATIONS ||--o{ MESSAGES : "包含"
    DEPARTMENTS {
      bigint id PK
      string name
    }
    USERS {
      bigint id PK
      string email UK
      string password_hash
      bigint dept_id FK
      string role
    }
    DOCUMENTS {
      bigint id PK
      string title
      bigint dept_id FK
      bigint owner_id FK
      string visibility
      bigint_array allowed_user_ids
      string sha256
      int version
      string status
      string error
      string storage_path
    }
    CHUNKS {
      bigint id PK
      bigint document_id FK
      int doc_version
      int chunk_index
      int page
      text heading_path
      text content
      text content_tokens
      tsvector tsv
      vector embedding
      bigint dept_id
      string visibility
      bigint_array allowed_user_ids
    }
    CONVERSATIONS {
      bigint id PK
      bigint user_id FK
      string title
    }
    MESSAGES {
      bigint id PK
      bigint conversation_id FK
      string role
      text content
      jsonb citations
      jsonb trace
    }
  ```

  **表设计要点**：

  - `chunks` **冗余**存 `dept_id`、`visibility`、`allowed_user_ids`：检索时权限条件和排序写在**同一条 SQL** 里，先过滤再取 Top-K。如果先取 Top-K 再在 Python 里过滤，结果会被过滤掉一大半，甚至泄露（日志、缓存里出现无权内容）。
  - `content_tokens` 存 jieba 分词结果（空格连接），`tsv` 是由它生成的列（`GENERATED ALWAYS AS ... STORED`），建 GIN 索引。
  - `documents.version` + `chunks.doc_version`：文档更新时版本加 1，便于排查「这个回答引用的是哪一版」。
  - `messages.trace` 记录改写后的问题、两路召回名次、重排分数、是否拒答，**线上排查和评测都靠它**。

  ## 四、目录结构

  ```text
  kb-rag/
  ├── backend/
  │   ├── app/
  │   │   ├── main.py              # 创建 FastAPI、lifespan、中间件、异常处理、注册路由
  │   │   ├── core/                # config.py errors.py logging.py security.py
  │   │   ├── db/                  # session.py models.py
  │   │   ├── api/                 # health.py chat.py documents.py auth.py
  │   │   ├── schemas/             # Pydantic 请求与响应模型
  │   │   ├── services/
  │   │   │   ├── llm.py           # LLM 与 Embedding 客户端
  │   │   │   ├── intent.py        # 意图识别（结构化输出）
  │   │   │   ├── parsing.py       # 文档解析与清洗
  │   │   │   ├── chunking.py      # 切片
  │   │   │   ├── indexing.py      # 分词、向量化、事务入库
  │   │   │   ├── retrieval.py     # 向量通道、关键词通道、RRF
  │   │   │   ├── rerank.py        # 重排器（API 版 / 本地版）
  │   │   │   ├── rewrite.py       # 查询改写
  │   │   │   └── answer.py        # Prompt 组装、引用校验、拒答
  │   │   └── worker.py            # 入库 Worker 进程入口
  │   ├── migrations/              # Alembic
  │   ├── evals/                   # 评测集 JSONL、评测脚本、报告
  │   ├── tests/                   # pytest
  │   └── pyproject.toml / uv.lock
  ├── frontend/                    # Vue3 + TS + Vite
  ├── deploy/nginx.conf
  ├── docker-compose.yml
  └── .env.example
  ```

  ## 五、关键技术决策速览

  | 决策 | 选择 | 主要理由 | 代价 |
  |---|---|---|---|
  | 向量库 | pgvector | 权限过滤与排序同一条 SQL；入库一个事务；少一个组件 | 千万级以上或高 QPS 时要拆专用库 |
  | 关键词检索 | jieba + PG 全文索引 | 不换镜像、不加组件 | 排序不是标准 BM25，需用评测验证效果 |
  | 融合 | RRF（按名次） | 两路分数量纲不同，名次融合不用调权重 | 丢掉了分数的绝对大小信息 |
  | 重排 | Cross-encoder 精排 Top-30 | 召回求全、重排求准 | 增加一次调用的延迟和费用，要超时降级 |
  | 拒答 | 检索后 + 生成后两道闸门 | 证据不足不调模型；引用不合法不放行 | 阈值需要用评测集校准，存在误拒 |
  | 入库 | Redis 队列 + 独立 Worker | 长任务不阻塞 API，Worker 可单独扩容 | 多一个进程；需要幂等与卡死恢复 |
  | 流式 | SSE（POST + fetch 读流） | 单向推送足够，基于 HTTP，好穿代理 | 浏览器 EventSource 只支持 GET，要自己解析 |

