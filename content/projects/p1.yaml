    key_code: |
      ```python
      # evals/metrics.py
      import math
      import re

      _WS = re.compile(r"\s+")


      def norm(s: str) -> str:
          return _WS.sub("", s).lower()


      def covered(evidence: str, texts: list[str]) -> bool:
          e = norm(evidence)
          return any(e in norm(t) for t in texts)


      def recall_at_k(ranked_texts: list[str], evidences: list[str], k: int) -> float:
          if not evidences:
              return math.nan                       # 无答案题不参与检索指标
          top = ranked_texts[:k]
          return sum(covered(e, top) for e in evidences) / len(evidences)


      def reciprocal_rank(ranked_texts: list[str], evidences: list[str]) -> float:
          if not evidences:
              return math.nan
          for i, t in enumerate(ranked_texts, start=1):
              if any(norm(e) in norm(t) for e in evidences):
                  return 1.0 / i
          return 0.0


      def mean(xs: list[float]) -> float:
          xs = [x for x in xs if not math.isnan(x)]
          return sum(xs) / len(xs) if xs else math.nan
      ```

      ```python
      # evals/run.py（核心循环节选）
      from openai import AsyncOpenAI
      from ragas.llms import llm_factory
      from ragas.metrics.collections import Faithfulness

      from app.api.deps import UserCtx
      from app.services.pipeline import answer_once, retrieve_with_config


      async def eval_case(case: dict, config: str, session, faith: Faithfulness | None) -> dict:
          user = UserCtx(id=case["as_user"]["id"], dept_id=case["as_user"]["dept_id"])
          cands, trace = await retrieve_with_config(session, case["question"], [], user, config)
          texts = [c.content for c in cands]
          row = {"id": case["id"], "type": case["type"], "config": config,
                 "retrieve_ms": trace["retrieve_ms"],
                 "r@1": recall_at_k(texts, case["evidence"], 1),
                 "r@5": recall_at_k(texts, case["evidence"], 5),
                 "mrr": reciprocal_rank(texts, case["evidence"]),
                 "top_rerank": cands[0].rerank_score if cands and hasattr(cands[0], "rerank_score") else None}
          if case["type"] == "permission":
              row["leaks"] = sum(not visible_to(c, user) for c in cands)   # 逐条按 ACL 规则复核
          verdict, answer = await answer_once(case["question"], [], cands, trace)
          row.update(refused=verdict.refused, grounded=verdict.grounded)
          if faith and not verdict.refused and texts:
              res = await faith.ascore(user_input=case["question"], response=answer,
                                       retrieved_contexts=texts[:6])
              row["faithfulness"] = res.value
          return row


      def make_judge() -> Faithfulness:
          client = AsyncOpenAI(api_key=settings.judge_api_key, base_url=settings.judge_base_url)
          return Faithfulness(llm=llm_factory(settings.judge_model, client=client))
      ```

      ```python
      # evals/calibrate.py：在候选阈值上计算正确拒答率与误拒率
      def sweep(rows: list[dict], thresholds: list[float]) -> list[tuple[float, float, float]]:
          out = []
          for t in thresholds:
              should = [r for r in rows if r["type"] == "unanswerable"]
              can = [r for r in rows if r["type"] not in ("unanswerable", "permission")]
              correct_refuse = mean([float((r["top_rerank"] or 0) < t) for r in should])
              false_refuse = mean([float((r["top_rerank"] or 0) < t) for r in can])
              out.append((t, correct_refuse, false_refuse))
          return out
      ```

      **逐段读懂**

      - **`norm` 去掉所有空白再比较**：PDF 抽取经常在中文里插入空格或换行，不去空白会大量误判「未命中」。
      - **`recall_at_k` 对无答案题返回 `nan`，`mean` 跳过 `nan`**：无答案题没有证据，不应把它算成 0 拉低召回。这种「分母里放哪些题」的细节，面试官问「你的 Recall 怎么算的」时必须讲清。
      - **多证据题按「覆盖比例」**：多跳题有两条证据，只召回一条得 0.5，比「命中一条就算 1」更能反映多跳能力。
      - **以 `as_user` 身份检索**：越权题必须用「无权部门」的身份跑；`visible_to` 用独立于 SQL 的 Python 规则**再判一次**，相当于用第二种实现交叉验证 SQL 的权限条件。
      - **直接调用 service 层**：m1 定下「service 不依赖 FastAPI」的规矩，这里就能在脚本里直接调用，不用起服务、不受限流影响。
      - **RAGAS 0.4 新写法**：`llm_factory(模型名, client=AsyncOpenAI(...))` + `Faithfulness(llm=...)` + `await ascore(user_input=, response=, retrieved_contexts=)`，结果取 `.value`。评判模型通过 `judge_*` 配置独立于生成模型。拒答的题不算 faithfulness（没有陈述可评）。如果评判模型名不能被自动识别厂商，按 RAGAS 文档补充参数（以官方文档为准）。
      - **`sweep` 只是统计**：脚本不替你做决定，你根据业务能接受的误拒率选阈值。
    ai_prompt: |
      建立 RAG 评测体系：评测集、评测脚本、阈值校准和对比报告。

      ## 评测集（需要我参与，请先生成草稿再由我审核）
      - `evals/gen_candidates.py`：从已入库的切片中随机抽 40 片，调用 LLM 为每片生成 1 个问题和 1 段 10~40 字的原文证据（证据必须是切片正文的子串，程序校验），输出到 `evals/candidates.jsonl` 供我人工筛选和改写成口语。
      - 最终文件 `evals/rag_cases.jsonl`：字段 id、type（factual/colloquial/term/multi_hop/unanswerable/permission）、question、as_user{id, dept_id}、evidence（字符串列表，无答案题为空）、answer_points（可选）。各类型最少条数：25/10/6/5/8/6。另建 `evals/multiturn_cases.jsonl`（≥6 组，每组 history + question + evidence）。
      - `evals/check_cases.py`：校验每条证据确实能在数据库某个切片正文中找到（去空白后子串匹配），找不到的列出来。

      ## 评测脚本
      - `evals/metrics.py`：norm、covered、recall_at_k、reciprocal_rank、mean（跳过 nan）。
      - `app/services/pipeline.py` 增加 `retrieve_with_config(session, question, history, user, config)`，config 取 vector / keyword / hybrid / hybrid_rerank / hybrid_rerank_rewrite；以及 `answer_once(question, history, cands, trace)`：非流式生成并返回 (Verdict, answer)，内部复用 m10 的 build_messages / gate_before / check_answer。
      - `evals/run.py`：命令行参数 `--configs`（逗号分隔）、`--faithfulness-sample N`（默认 20，0 为关闭）、`--out`、`--holdout`（是否包含保留集，默认否）。逐题逐配置运行（并发上限 4），每题记录 r@1、r@3、r@5、r@10、mrr、retrieve_ms、total_ms、top_rerank、refused、grounded、leaks（permission 题，用独立的 Python 函数 visible_to 按 ACL 规则复核）、faithfulness（抽样，使用 RAGAS 0.4：`from ragas.llms import llm_factory`、`from ragas.metrics.collections import Faithfulness`、`await scorer.ascore(user_input=..., response=..., retrieved_contexts=...)`，`.value` 取分）。
      - 评判模型配置 `judge_base_url`、`judge_api_key`、`judge_model`，必须可以与生成模型不同。
      - 输出：`evals/reports/{日期}_{configs}.md`（对比表：每配置一行；按 type 分组的 Recall@5；P50/P95 延迟；失败题列表含问题、期望证据、实际前 3 个结果片段）和同名 `.jsonl` 明细。
      - `evals/calibrate.py`：读取明细，对 hybrid_rerank 在阈值 0.05 到 0.6（步长 0.05）上打印正确拒答率与误拒率。
      - `evals/baseline.json`：保存当前最佳配置的关键指标；`evals/compare.py` 对比新结果与基线，Recall@5 下降超过 0.03 或越权泄露大于 0 时以非零退出码结束（为 Day 44 的 CI 门禁做准备）。

      ## 必须写的测试
      - metrics：证据含空格与不含空格时匹配一致；无答案题 recall 为 nan 且不影响平均；两证据只命中一条时 recall 为 0.5；mrr 在第 3 名命中为 1/3。
      - `visible_to` 与 SQL 的 acl() 在同一组测试数据上判断一致（参数化测试覆盖 public/dept/restricted）。

      ## 验收标准
      - 至少跑出 vector、hybrid、hybrid_rerank 三个配置的报告，越权泄露为 0。
      - 根据 calibrate 结果把 `REFUSE_RERANK_THRESHOLD` 写入配置，重新跑一次，报告中拒答率变化可见。
      - 写一段 200 字的「评测结论」放在报告开头：哪个改动带来最大提升、还剩哪类问题失败、下一步做什么。**数字必须来自报告本身**。
