        - "评测集中 LLM 生成的问题经过人工改写，至少 10 条是口语化表达"
    retell:
      id: p1-m11-retell
      type: scenario
      category: eval
      difficulty: 4
      question: 面试官问：「你说你的 RAG 效果提升了，怎么证明？」请完整复述你的评测方案：评测集怎么建、怎么标注、有哪些指标、分母是什么、怎么保证结论可信，以及你用评测结果做了哪些决策。
      key_points:
        - {text: "说明评测集分类型构建，包含无答案和越权题，并说明各类型的检验目的", dim: project}
        - {text: "说明用证据原文片段而不是 chunk_id 标注，原因是切片参数变化后 id 会变", dim: principle}
        - {text: "分层说明检索指标 Recall@K 和 MRR、生成指标拒答率误拒率和 faithfulness，以及各自的分母", dim: concept}
        - {text: "说明保证可信的做法：评判模型与生成模型分离、重复运行看波动、保留集防止过拟合", dim: engineering}
        - {text: "说明用评测结果做的决策，例如选择配置、校准拒答阈值、建立回归基线", dim: project}
      reference: |
        **评测集**：我建了 60 多条，分六类：事实类、口语化同义、编号术语、多跳、无答案、越权。每类有明确目的：口语题检验向量通道，编号题检验关键词通道，多跳题检验 Top-K 够不够，无答案题检验拒答，越权题用无权部门的身份去问只有另一个部门文档里才有的内容，检验权限过滤。题目一部分由 LLM 根据切片生成候选，我人工审核并改写成口语，因为 LLM 出题容易照抄原文用词，会高估关键词检索。

        **标注方式**：每题标一到两段 10~40 字的原文证据，检索结果正文包含证据（去掉空白后比较）就算命中。没用 chunk_id 是因为调整切片参数、重新入库后 id 全变了，用证据片段就能用同一份评测集比较不同切片方案。证据要短，否则可能被切在两片之间。

        **指标与分母**：检索层看 Recall@K（每题被前 K 个结果覆盖的证据比例，再求平均）和 MRR，只算可回答题；生成层看无答案题的正确拒答率、可回答题的误拒率、未拒答题的 faithfulness（用 RAGAS，把回答拆成陈述，看被资料支持的比例）和 grounded 率；越权题统计泄露次数，必须为 0。分层看才知道问题出在检索还是生成。

        **可信性**：评判模型和生成模型用不同的，减少自评偏高；同一配置跑两次看波动，波动比改进还大就不下结论；留 20% 作保留集，只在最后看一次，防止对着评测集调参过拟合。评测脚本直接调用 service 层，不受接口限流影响，可复现。

        **用它做的决策**：对比了仅向量、混合、混合加重排三个配置，选定了最终方案（具体提升以我的报告为准）；用无答案题和可回答题的最高重排分做阈值扫描，选了一个误拒率可接受的拒答阈值；每个失败题做归因，决定下一步优化哪一层；最后保存基线，以后改动 Recall@5 下降超过 0.03 或出现越权泄露就判定回归。
      oral: |
        我用一套自己建的评测集证明。60 多条题分六类，包括无答案题和越权题，越权题用无权部门的身份去问。标注用文档里的一小段原文证据，而不是切片 id，因为调切片参数后 id 会变。指标分两层：检索层看 Recall@K 和 MRR，只算可回答题；生成层看正确拒答率、误拒率和 RAGAS 的 faithfulness，越权泄露必须是 0。为了可信，评判模型和生成模型分开，同一配置跑两次看波动，还留了保留集。我用结果选定了混合加重排的方案，校准了拒答阈值，并存成回归基线。

  - id: p1-m12
    name: ACL 权限隔离加固、JWT 登录与生产部署
    unlock_day: 30
    minutes: 90
    features: [JWT 登录, 文档级 ACL, 权限变更同步切片, 全入口权限检查, 答案缓存与权限范围, 审计日志, 生产 Compose, nginx 反代 SSE, 迁移与备份]
    goal: |
      把系统从「开发版」变成「可上线版」：用 **JWT 登录**替换开发版身份；把文档级 ACL（公开 / 部门 / 指定人员）**贯穿所有入口**（检索、问答、预览、切片调试、引用详情、会话历史）；实现**权限变更**时文档与切片在一个事务里同步；加入**带权限范围的答案缓存**和**审计日志**；最后用 **nginx + 生产 Compose** 部署，正确代理 SSE。

      做完用 m11 的越权评测再跑一遍，**越权泄露必须是 0**。
    design: |
      **1. 权限模型（见 Day 30，RBAC 与多租户深入见 Day 46）**

      | 可见性 | 谁能检索到 | 典型文档 |
      |---|---|---|
      | `public` | 全员 | 员工手册、公司介绍 |
      | `dept` | 文档所属部门 | 部门流程、内部 FAQ |
      | `restricted` | `allowed_user_ids` 里的人（上传者默认在内） | 薪酬方案、合同模板 |

      **管理权限和检索权限分开**：admin 可以在管理页看到和修改所有文档的元数据，但**问答检索仍按同一套 ACL**——否则管理员的问答会混入大量无关部门内容，而且一旦管理员账号泄露，问答就成了批量导出接口。

      **2. 为什么权限必须在检索阶段过滤**
      - 生成后过滤：模型已经读过无权内容，可能在回答里转述出来，**过滤不掉**。
      - 检索后、生成前在 Python 里过滤：Top-K 被过滤掉大半，召回变差；无权内容还会进入日志、trace、缓存。
      - 所以权限条件写进检索 SQL，**先过滤再排序**（m8 已做），本模块负责**所有其他入口**也遵守。

      **3. 全入口清单**：检索与问答、文档列表、预览、切片调试、引用详情（点击角标加载片段的接口也要校验，否则可以遍历 chunk_id 读全库）、文件下载、会话与消息（只能看自己的）、调试接口（仅 admin）。**每个按 id 取资源的接口都要带权限条件**，查不到统一返回 404，不暴露「存在但无权」。

      **4. 权限变更**：`PATCH /api/documents/{id}/acl` 在**一个事务**里更新 documents 和它所有 chunks 的三列权限字段，提交后 `INCR kb:version`。事务保证不会出现「文档已改成 restricted、切片还是 dept」的窗口。

      **5. 答案缓存与权限**
      - 缓存键 = 哈希（规范化问题 + **部门 id** + kb:version + 配置版本）。kb:version 变化（任何文档入库、删除、改权限）旧缓存自然失效。
      - **候选里只要出现 restricted 切片就不缓存**：restricted 的可见范围是「人」而不是「部门」，同部门其他人命中缓存就会泄露。
      - 多轮对话（有历史）不缓存，答案依赖上下文。
      - 这是「缓存导致越权」的经典坑，面试高频。

      **6. JWT（精简版，见 Day 46）**：`POST /api/auth/login` 校验邮箱密码（Argon2 哈希，pwdlib），签发 HS256 JWT，`sub` 为用户 id **字符串**，有效期 2 小时。`get_current_user` 解码后**查库**取 dept_id、role、是否禁用——部门和角色以数据库为准，不信任 token 里的旧值。开发版请求头身份在 `APP_ENV=prod` 下彻底不可用。

      **7. 审计**：每次问答记录 user_id、时间、问题哈希、引用的 document_id 列表、是否拒答；权限变更记录操作人与前后值。出了「谁看到了什么」的问题能查。

      **8. 生产部署**

      | 组件 | 要点 |
      |---|---|
      | nginx | 托管前端 dist；`/api/` 反代到 api；SSE 路径 `proxy_buffering off`、`proxy_read_timeout` 调长、`proxy_http_version 1.1`；`client_max_body_size` 与上传上限一致 |
      | migrate | **一次性服务**执行 `alembic upgrade head`，api 和 worker 依赖它成功完成——多副本 api 同时跑迁移会冲突 |
      | api / worker | `restart: unless-stopped`；不对外暴露端口（只有 nginx 暴露） |
      | db / redis | 不暴露端口；Redis 设密码；数据卷持久化；每日 `pg_dump` 备份 |
      | 配置 | 所有密钥放 `.env`（不进仓库）；`APP_ENV=prod` |
    data_flow: |
      ```mermaid
      flowchart TD
        L["POST /api/auth/login"] --> J["签发 JWT sub 为用户 id"]
        J --> REQ["任意请求 带 Bearer"]
        REQ --> DEP["get_current_user 解码 查库 取部门 角色"]
        DEP --> CACHE{"答案缓存 键含部门 与 kb:version"}
        CACHE -->|"命中"| OUT["直接返回 并记审计"]
        CACHE -->|"未命中"| RET["检索 SQL 内置 acl 条件"]
        RET --> GEN["生成 带引用"]
        GEN --> SAVE{"候选含 restricted 或 有历史"}
        SAVE -->|"否"| PUT["写入缓存"]
        SAVE -->|"是"| SKIP["不缓存"]
        GEN --> AUD["审计日志"]
        ACLCHG["PATCH 文档权限"] --> TX["一个事务 更新 documents 与全部 chunks"]
        TX --> VER["kb:version 加一 旧缓存失效"]
      ```

      部署拓扑：浏览器 → nginx（443/80，前端静态文件 + `/api` 反代）→ api（多个 uvicorn worker）/ worker → db、redis（仅内网）。
    key_code: |
      ```python
      # app/core/security.py
      from datetime import datetime, timedelta, timezone
      from typing import Annotated

      import jwt
      from fastapi import Depends
      from fastapi.security import OAuth2PasswordBearer
      from jwt.exceptions import InvalidTokenError
      from pwdlib import PasswordHash

      from app.api.deps import UserCtx
      from app.core.config import settings
      from app.core.errors import AppError
      from app.db.models import User
      from app.db.session import SessionDep

      password_hash = PasswordHash.recommended()            # Argon2
      oauth2 = OAuth2PasswordBearer(tokenUrl="/api/auth/login", auto_error=False)


      def create_token(user: User) -> str:
          exp = datetime.now(timezone.utc) + timedelta(minutes=settings.jwt_expire_minutes)
          return jwt.encode({"sub": str(user.id), "exp": exp}, settings.jwt_secret, algorithm="HS256")


      async def get_current_user(token: Annotated[str | None, Depends(oauth2)], session: SessionDep) -> UserCtx:
          if not token:
              raise AppError("AUTH_REQUIRED", "请先登录", 401)
          try:
              payload = jwt.decode(token, settings.jwt_secret, algorithms=["HS256"])
              uid = int(payload["sub"])
          except (InvalidTokenError, KeyError, ValueError):
              raise AppError("AUTH_INVALID", "登录已失效，请重新登录", 401)
          user = await session.get(User, uid)
          if user is None or not user.is_active:
              raise AppError("AUTH_INVALID", "登录已失效，请重新登录", 401)
          return UserCtx(id=user.id, dept_id=user.dept_id, role=user.role)   # 部门以数据库为准
      ```

      ```python
      # app/api/documents.py（权限变更）
      @router.patch("/documents/{doc_id}/acl")
      async def update_acl(doc_id: int, body: AclUpdate, user: CurrentUser, session: SessionDep) -> dict:
          doc = await session.get(Document, doc_id)
          if doc is None or not can_manage(user, doc):
              raise AppError("NOT_FOUND", "文档不存在", 404)          # 不区分「不存在」和「无权」
          before = {"visibility": doc.visibility, "allowed": list(doc.allowed_user_ids)}
          allowed = sorted(set(body.allowed_user_ids) | {doc.owner_id})
          doc.visibility, doc.allowed_user_ids = body.visibility, allowed
          await session.execute(
              update(Chunk).where(Chunk.document_id == doc_id)
              .values(visibility=body.visibility, allowed_user_ids=allowed, dept_id=doc.dept_id))
          session.add(AuditLog(user_id=user.id, action="acl_update", target_id=doc_id,
                               detail={"before": before, "after": body.model_dump()}))
          await session.commit()                                      # 文档、切片、审计一次提交
          await redis_client.incr("kb:version")
          return {"id": doc_id, "visibility": body.visibility}
      ```

      ```python
      # app/services/cache.py
      import hashlib
      import json


      async def cache_key(question: str, user, config_version: str) -> str:
          kb_ver = await redis_client.get("kb:version") or b"0"
          raw = "|".join([" ".join(question.split()).lower(), str(user.dept_id), kb_ver.decode(), config_version])
          return "ans:" + hashlib.sha256(raw.encode()).hexdigest()


      def cacheable(cands: list, history: list) -> bool:
          return not history and all(c.visibility != "restricted" for c in cands)
      ```

      ```nginx
      # deploy/nginx.conf（节选）
      server {
        listen 80;
        client_max_body_size 20m;
        root /usr/share/nginx/html;
        location / { try_files $uri /index.html; }
        location /api/chat/stream {
          proxy_pass http://api:8000;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 300s;
          proxy_set_header X-Request-ID $request_id;
        }
        location /api/ {
          proxy_pass http://api:8000;
          proxy_set_header X-Request-ID $request_id;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
      ```

      **逐段读懂**

      - **`algorithms=["HS256"]` 必须显式传**：否则可能被「改 header 里的算法」类攻击利用；PyJWT 要求 `sub` 是字符串，所以签发时 `str(user.id)`。
      - **解码后查库**：token 里不放 dept_id 和 role。员工调岗、被禁用后，下一个请求立即按新部门过滤，而不是等 token 过期。代价是每个请求多一次主键查询（可加短 TTL 缓存）。
      - **`not can_manage(...)` 也返回 404**：攻击者无法通过 403 和 404 的差异枚举「哪些 id 存在」。
      - **`allowed | {doc.owner_id}`**：上传者永远保有访问权，防止把自己锁在外面。
      - **一次 `commit` 包含文档、全部切片、审计日志**：要么全改，要么全不改。`INCR kb:version` 在提交之后，确保缓存失效时数据已经是新的。
      - **缓存键含 `dept_id` 和 `kb:version`**：不同部门互不命中；任何内容或权限变化后旧缓存自动作废，不需要逐条删除。
      - **`cacheable` 排除 restricted 和多轮**：restricted 的可见范围是具体的人，按部门缓存会泄露给同部门其他人。
      - **nginx 的 SSE 配置**：`proxy_buffering off` 让 token 立即转发（FastAPI 也会发 `X-Accel-Buffering: no` 头，两边都设更保险）；`proxy_read_timeout` 默认 60 秒，长回答或慢模型会被切断；`Connection ""` 配合 HTTP/1.1 使用上游长连接。
    ai_prompt: |
      完成权限加固、JWT 登录、答案缓存、审计日志和生产部署。

      ## 技术约束
      - 依赖：pyjwt、pwdlib[argon2]（不要用 passlib），`password_hash = PasswordHash.recommended()`；登录时用户不存在也要对一个预先算好的 DUMMY_HASH 执行一次 verify，防止按响应时间枚举账号。JWT 使用 HS256，`sub` 为用户 id 字符串，有效期配置 `jwt_expire_minutes`（默认 120），密钥 `jwt_secret` 从环境变量读取，启动时长度不足 32 字符直接报错。
      - `app/core/security.py` 的 `get_current_user` 替换 m1 的开发版（保持 `CurrentUser` 别名不变）：解码 token → 查库 → 返回 UserCtx（dept_id、role 以数据库为准，禁用用户 401）。`APP_ENV=dev` 时仍可选择保留请求头方式，但 prod 下代码路径必须不可达。
      - 新增 `users.is_active` 字段与迁移；新增 `audit_logs` 表（id、user_id、action、target_id、detail jsonb、created_at）与迁移。

      ## 权限
      - 提供 `can_view(user, doc_or_chunk)` 与 `can_manage(user, doc)` 两个函数（与 SQL 的 acl() 规则一致：public 全员、dept 同部门、restricted 在 allowed_user_ids 中；管理权限为同部门 owner 或 admin）。
      - 审查并修改所有按 id 取资源的接口：文档详情、预览、切片调试、文件下载、`GET /api/chunks/{id}`（引用详情，新增）、会话与消息。无权一律返回 404。调试接口仅 admin。
      - `PATCH /api/documents/{id}/acl`（body：visibility、allowed_user_ids）：一个事务内更新 documents、该文档全部 chunks 的权限三列、写审计日志；提交后 INCR kb:version。owner 始终保留在 allowed_user_ids 中。
      - 问答审计：每次问答写一条 audit_logs（action=chat，detail 含问题 sha256、引用 document_id 列表、refused）。

      ## 答案缓存
      - `app/services/cache.py`：键为 sha256(规范化问题 | dept_id | kb:version | 配置版本)；仅当无历史且候选中没有 restricted 切片时写入；TTL 配置默认 3600 秒；命中时仍按流式事件协议输出（一次性发 token、citations、done），并在 meta 中标记 cached=true。

      ## 部署
      - `frontend/Dockerfile`：多阶段构建，Node 构建 dist，nginx 镜像托管；`deploy/nginx.conf` 按上述 SSE 配置。
      - `docker-compose.prod.yml`：nginx（唯一暴露 80 端口）、migrate（一次性执行 alembic upgrade head）、api（依赖 migrate 成功完成，即 `condition: service_completed_successfully`）、worker、db、redis（设置密码，均不暴露端口），全部 `restart: unless-stopped`，数据卷持久化。
      - `scripts/backup.sh`：用 pg_dump 导出到带日期的文件，保留最近 7 份。
      - `docs/deploy.md`：从零部署步骤、环境变量说明、升级步骤、回滚步骤、常见问题。

      ## 必须写的测试
      1. 登录：密码正确返回 token；错误 401；token 篡改或过期 401；禁用用户的有效 token 401。
      2. 越权：部门 20 的用户访问部门 10 文档的预览、切片、引用详情、下载、消息接口全部 404；restricted 文档仅 allowed 用户可检索。
      3. 权限变更：把 dept 文档改为 restricted 后，同部门非 allowed 用户立即检索不到；数据库中该文档所有 chunks 的 visibility 均已更新；审计日志有一条记录。
      4. 缓存：同部门两用户问同一 public 问题第二次命中缓存；候选含 restricted 时不写缓存；修改任意文档权限后同一问题不再命中旧缓存。
      5. 用 m11 评测脚本跑 permission 类题目，越权泄露为 0。

      ## 验收标准
      - `docker compose -f docker-compose.prod.yml up -d --build` 后只能通过 http://localhost 访问；前端登录、提问、流式输出、引用点击均正常；`docker compose ps` 中 migrate 显示已退出且退出码为 0。
      - 在 nginx 后面流式输出仍是逐字出现（不是最后一次性出现）。
      - 越权评测泄露 0，并把结果附到 m11 报告里。
    tests:
      functional:
        - "生产 Compose 启动后浏览器访问 http://localhost ，登录后提问，回答逐字出现；把 nginx 配置里的 proxy_buffering off 注释掉重启，观察是否变成一次性出现（理解缓冲的影响后再改回）"
        - "管理员把一份 dept 文档改成 restricted 且只允许用户 A：同部门用户 B 再问相关问题被拒答或答不出该内容，用户 A 仍能得到带引用的回答"
        - "同部门两个用户先后问同一个 public 问题：第二次 meta 中 cached 为 true，响应明显更快"
        - "用 m11 评测脚本只跑 permission 类：越权泄露为 0，结果附到报告"
      api:
        - "curl.exe -X POST http://localhost/api/auth/login -d \"username=a@corp.com&password=你的密码\" 返回 access_token；用错误密码返回 401"
        - "curl.exe http://localhost/api/chunks/某个其他部门的切片id -H \"Authorization: Bearer 你的token\" 返回 404，而不是 403 或正文"
        - "把 token 的最后一个字符改掉再请求任意接口：返回 401，code 为 AUTH_INVALID"
        - "在 prod 环境带 X-User-Id 请求头而不带 token：返回 401，证明开发版身份已不可用"
        - "docker compose -f docker-compose.prod.yml ps ：只有 nginx 映射了宿主机端口"
      exception:
        - "权限变更事务中途失败（在更新 chunks 后人为抛异常）：documents 与 chunks 都保持原值，没有半更新"
        - "Redis 不可用时提问：缓存被跳过但问答正常（缓存故障不能影响主流程），日志有 warning"
        - "JWT_SECRET 少于 32 字符启动：应用直接报错退出，而不是带着弱密钥运行"
        - "迁移失败时：api 与 worker 不会启动（依赖 migrate 成功完成），日志能看到迁移报错"
        - "长回答超过 60 秒：在 nginx 后不会被切断（proxy_read_timeout 已调大）"
      review:
        - "全局搜索所有按 id 查询 Document、Chunk、Conversation、Message 的地方，每处都带了权限条件或 can_view 检查"
        - "can_view 与 SQL acl() 的规则一致，且有参数化测试证明一致"
        - "jwt.decode 显式指定 algorithms；token 中不包含部门与角色"
        - "缓存键包含 dept_id 与 kb:version，含 restricted 候选不写缓存"
        - "生产 Compose 中 db、redis 未暴露端口，Redis 有密码，.env 未提交"
    retell:
      id: p1-m12-retell
      type: design
      category: engineering
      difficulty: 4
      question: 请复述你的权限隔离方案：权限模型是什么、为什么必须在检索阶段过滤？除了检索还有哪些入口容易漏？权限变更和答案缓存怎么处理才不会泄露？部署时 SSE 要注意什么？
      key_points:
        - {text: "说明 public、dept、restricted 三级可见性，管理权限与检索权限分离", dim: concept}
        - {text: "说明生成后过滤无法撤回模型已读内容、检索后过滤影响召回并污染日志缓存，所以在检索 SQL 中先过滤再排序", dim: principle}
        - {text: "列举引用详情、预览、下载、会话等按 id 取资源的入口，并统一返回 404", dim: engineering}
        - {text: "说明权限变更在一个事务内同步文档与切片，缓存键含部门与版本号且 restricted 结果不缓存", dim: project}
        - {text: "说明 nginx 关闭代理缓冲、调长读超时，迁移用一次性服务执行", dim: engineering}
      reference: |
        **权限模型**：文档有三级可见性：public 全员可见，dept 只有所属部门可见，restricted 只有指定人员可见（上传者始终在内）。管理权限和检索权限分开：管理员可以管理所有文档的元数据，但问答检索仍然按同一套规则，否则管理员账号就成了批量导出全库的入口。

        **为什么在检索阶段过滤**：如果生成后再过滤，模型已经读过无权内容，可能转述在回答里，撤不回来；如果检索后在 Python 里过滤，Top-K 会被过滤掉大半，召回变差，而且无权内容已经进入日志、trace 和缓存。所以权限条件直接写进检索 SQL，先过滤再排序，两个召回通道和回表用同一个 acl() 函数。

        **容易漏的入口**：检索只是其中之一。点击引用角标加载片段的接口、文档预览、切片调试、文件下载、会话和消息，每个按 id 取资源的地方都要带权限条件，否则别人遍历 id 就能读全库。无权统一返回 404，不暴露资源是否存在。我还用 Python 写了一个独立的 can_view，和 SQL 规则做参数化测试交叉验证，评测集里的越权题泄露为 0。

        **权限变更**：在一个事务里更新文档和它所有切片的冗余权限字段，并写审计日志，提交后 Redis 的 kb:version 加一。

        **缓存**：答案缓存键包含规范化问题、部门 id、kb:version 和配置版本，不同部门互不命中，任何内容或权限变化后旧缓存自动失效。restricted 的可见范围是具体的人，所以候选里只要有 restricted 切片就不缓存；多轮对话也不缓存。

        **身份**：JWT 只放用户 id，每次请求查库取部门和角色，调岗或禁用立即生效。

        **部署**：nginx 是唯一对外入口，SSE 路径关闭代理缓冲、读超时调到 300 秒，否则流式会变成一次性输出或长回答被切断；数据库迁移用一次性的 migrate 服务执行，api 依赖它成功完成，避免多副本同时迁移；数据库和 Redis 不暴露端口，Redis 设密码，每日备份。
      oral: |
        权限上我用三级可见性：公开、部门、指定人员，权限条件写进检索 SQL，先过滤再排序，因为生成后过滤撤不回模型已经读到的内容。除了检索，引用详情、预览、下载、会话这些按 id 取数据的接口我都加了同样的条件，无权统一返回 404，还用独立的 Python 实现交叉验证，越权评测泄露为 0。改权限时文档和切片在一个事务里同步，并让版本号加一，答案缓存键里有部门和版本号，含指定人员可见的结果不缓存。部署时 nginx 要关掉代理缓冲、调大读超时，迁移用一次性服务执行。

