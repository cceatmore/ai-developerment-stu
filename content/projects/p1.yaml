    retell:
      id: p1-m8-retell
      type: design
      category: rag
      difficulty: 4
      question: 请复述你的混合检索：为什么要向量和关键词两个通道？向量通道带权限过滤时会遇到什么问题、你怎么解决？为什么用 RRF 而不是分数加权？你的关键词通道是 BM25 吗？
      key_points:
        - {text: "说明向量擅长同义改写、关键词擅长编号和专有名词，两路互补", dim: concept}
        - {text: "说明 HNSW 先扫描再过滤导致结果不足，用 iterative scan 和提高 ef_search 解决", dim: principle}
        - {text: "说明两路分数量纲不同，RRF 只按名次融合，公式为一除以 k 加名次求和", dim: principle}
        - {text: "诚实说明 ts_rank_cd 没有 IDF 不是标准 BM25，并给出 ParadeDB 等升级方案", dim: engineering}
        - {text: "说明权限条件在两个通道和回表中都生效，先过滤再排序", dim: project}
      reference: |
        **为什么两个通道**：向量检索擅长语义相近、措辞不同的问题，比如「请假要提前多久说」能找到「休假申请需提前三个工作日」；但它对编号、产品名这类精确字符不敏感。关键词检索正好相反，「ERP-2031 报错」这种问题它能精确命中。两路各召回 30 条，互相弥补盲区。

        **向量通道的过滤问题**：HNSW 是近似索引，查询时先在图里找 ef_search 个近邻（默认 40），再套用 WHERE 条件。如果用户只能看到 10% 的文档，平均只剩 4 条，Top-K 凑不满，召回率断崖下降。我用 pgvector 0.8 的 iterative scan，`SET LOCAL hnsw.iterative_scan = relaxed_order`，结果不够时继续扫描，同时把 ef_search 提到 100。relaxed 模式结果可能略乱序，我用 MATERIALIZED CTE 包一层再按距离排序。SET LOCAL 只在当前事务生效，不影响连接池里其他连接。

        **为什么 RRF**：余弦距离越小越好，ts_rank_cd 越大越好，量纲完全不同，加权相加要先归一化还要调权重。RRF 只看名次，每个文档的分数是它在各通道中 `1/(k+名次)` 的和，k 取 60。两路都靠前的得分最高，只在一路出现的也有机会进入候选。它没有需要调的权重，缺点是丢掉了分数的绝对大小信息。

        **是不是 BM25**：我得诚实说不是。我用 jieba 分词后存进 tsvector，用 ts_rank_cd 排序，它只考虑词频和词距，不用全库统计，没有 IDF，「公司」这种高频词权重和「年假」一样。我通过停用词表缓解，并用评测验证了它对编号类问题的价值。如果要真 BM25，可以换 ParadeDB 的 pg_search，它支持 jieba 分词器，和 pgvector 在同一个镜像里。

        **权限**：权限条件只定义一次，向量通道、关键词通道、按 id 回表三处都带上，先过滤再排序，用户和部门 id 用绑定参数。
      oral: |
        我的检索是两路召回：向量通道解决同义改写，关键词通道解决编号和专有名词，各取 30 条，用 RRF 按名次融合，因为两路分数量纲不同，RRF 不用调权重。向量通道带权限过滤时有个坑：HNSW 先扫描后过滤，过滤多了结果凑不满，我开了 pgvector 0.8 的 iterative scan 并调高 ef_search。关键词通道我得说明一下，PG 原生的 ts_rank_cd 没有 IDF，不是严格的 BM25，我用停用词缓解，真要 BM25 可以换 ParadeDB。权限条件在两路和回表三处都生效，先过滤再排序。

  - id: p1-m9
    name: 重排与查询改写：Cross-encoder 精排、多轮指代消解、超时降级
    unlock_day: 26
    minutes: 75
    features: [Cross-encoder 重排, 重排器抽象（API 版与本地版）, 超时降级, 多轮查询改写, 改写守护, HyDE 开关, 链路 trace]
    goal: |
      在混合检索之后加 **重排**：把融合后的 30 个候选和问题一起交给 Cross-encoder 重排模型逐对打分，取前 6 个送给大模型。在检索之前加 **查询改写**：多轮对话里「那出国呢？」「它要提前多久？」这类依赖上文的问题，先改写成**独立完整的问题**再检索。两步都要有**失败降级**，并把「原问题 / 改写后问题 / 重排前后名次 / 是否降级」写进 trace。

      学完你应该能讲清：**为什么「召回 + 重排」两阶段比一步到位好**、**重排分数能不能直接当拒答阈值**、**改写改错了怎么办**。
    design: |
      **1. 为什么要重排（见 Day 26）**

      | | 双塔（Embedding） | Cross-encoder（重排） |
      |---|---|---|
      | 计算方式 | 问题和文档**分别**编码成向量，再算距离 | 问题和文档**拼在一起**送进模型，直接输出相关度 |
      | 文档向量 | 可以离线算好、建索引 | 每次查询都要现算 |
      | 速度 | 毫秒级查百万 | 一次只能打几十到几百对 |
      | 精度 | 粗：只比较「大意」 | 细：能看出「这段是否真的回答了这个问题」 |

      所以分两阶段：**召回求全**（混合检索取 30），**重排求准**（Cross-encoder 精选 6）。Anthropic 的 Contextual Retrieval 实验里，加重排后检索失败率进一步下降——**你项目里的提升幅度用 m11 自己测**。

      **2. 两种重排器，同一个接口**

      | 实现 | 说明 | 适合 |
      |---|---|---|
      | `ApiReranker` | OpenAI 兼容的 `/reranks` 接口（如百炼 `qwen3-rerank`：请求体 model、query、documents、top_n，返回 results 里的 index 和 relevance_score） | 默认，免运维 |
      | `LocalReranker` | `FlagEmbedding` 加载 `BAAI/bge-reranker-v2-m3`（约 0.6B 参数），`compute_score(pairs, normalize=True)` 用 sigmoid 映射到 0~1 | 数据不能出内网；有 GPU 或能接受 CPU 延迟 |

      **3. 重排分数能不能当拒答阈值？要小心**
      - 百炼文档明确说明 `qwen3-rerank` 的分数是**本次请求内的相对分数，不能跨请求当绝对值比较**。
      - bge-reranker 经 sigmoid 后更接近「绝对相关度」，但阈值仍和模型绑定，换模型要重新校准。
      - 所以 m10 的拒答闸门把重排分数作为**信号之一**，阈值在 m11 用评测集校准，而不是拍一个 0.5。

      **4. 超时降级**：重排设 3 秒超时；超时或报错时**直接用 RRF 顺序**取前 6，trace 标记 `rerank_degraded=true`。宁可略差，不能让整个问答失败。

      **5. 查询改写（多轮指代消解）**
      - **什么时候改写**：有历史对话，且问题较短（如少于 15 字）或含指代词（它、这个、那、上面、刚才、还有呢）。其他情况跳过，省一次模型调用。
      - **怎么改写**：最近 2~3 轮对话 + 当前问题 → 结构化输出 `{"standalone": "...", "changed": true}`，temperature=0。
      - **只用改写结果去检索**，生成回答时仍把**用户原话 + 历史**给模型，避免改写偏差直接变成答非所问。
      - **守护规则**：改写失败、为空、长度超过原问题 5 倍 → 用原问题。
      - **可选合并**：改写和 m5 的意图识别都要读历史，可以合并成一次结构化调用（输出 intent + standalone），省一次往返；代价是 Prompt 更复杂、单次失败影响两件事。先分开做，用 trace 里的耗时数据决定要不要合并。

      **6. HyDE（选做，默认关闭）**：先让模型写一段「假设的答案」，用它的向量去检索。对「问题措辞和文档差别很大」的场景有效，但多一次模型调用，而且假答案里的错误信息会把检索带偏。做成开关，m11 用数据决定开不开。
    data_flow: |
