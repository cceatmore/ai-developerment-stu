    retell:
      id: p1-m1-retell
      type: oral
      category: python_backend
      difficulty: 2
      question: 用你自己的话复述：一个 POST /api/chat 请求进入 FastAPI 后依次经过哪些环节？统一错误格式是怎么实现的？为什么在骨架阶段就要把「当前用户」做成依赖？
      key_points:
        - {text: "按顺序说出中间件、路由匹配、Pydantic 校验、依赖解析、业务函数、响应序列化", dim: principle}
        - {text: "说明 AppError 由 service 抛出、exception_handler 统一转成 code/message/request_id 的 JSON，未知异常只返回通用文案", dim: engineering}
        - {text: "说明 request_id 的作用是把一次请求的日志和用户反馈串起来", dim: engineering}
        - {text: "说明当前用户依赖让后续权限过滤拿到 dept_id，且换成 JWT 时调用方不用改", dim: project}
      reference: |
        请求进来先经过 **request_id 中间件**：有 X-Request-ID 就沿用，没有就生成，放进 request.state，响应时写回响应头。然后 FastAPI **匹配路由**，用 `ChatRequest` 这个 Pydantic 模型**校验请求体**：去掉首尾空格、检查长度，不合法直接抛 `RequestValidationError`。接着**解析依赖**：`get_current_user` 从请求里拿到用户信息，返回 `UserCtx`；拿不到就抛 `AppError(401)`。依赖都准备好后才调用接口函数，接口函数只做一件事——调用 `chat_service.answer`，返回值按 `response_model` 序列化成 JSON。

        **统一错误**：业务层只抛 `AppError(code, message, status)`，不关心 HTTP。`main.py` 注册了三个异常处理器：AppError 按自带的状态码返回；参数校验错误统一成 422 + `VALIDATION_ERROR`；其他未知异常返回 500 和通用文案，堆栈只写日志。三种响应体字段一致，都带 request_id，前端可以像 axios 拦截器那样统一处理，用户反馈时报 request_id 就能在日志里找到完整堆栈。

        **为什么提前做用户依赖**：后面检索时要按部门做权限过滤，SQL 需要 dept_id。现在就让每个接口通过依赖拿到 `UserCtx`，m12 换成 JWT 校验时只改 `get_current_user` 的内部实现，所有接口签名都不变。开发版只在 dev 环境生效，避免生产环境被请求头冒充。
      oral: |
        我的骨架是标准分层：api 层只收参数和返回，service 层写业务、不依赖 FastAPI，core 放配置和错误。一个请求先过 request_id 中间件，再做 Pydantic 校验，再解析依赖拿到当前用户，最后调 service。错误统一成 code、message、request_id 三个字段：业务错误抛 AppError，参数错误转 422，未知异常只回通用文案、堆栈进日志。我在第一天就把当前用户做成依赖，因为后面检索要按部门过滤，换 JWT 时只改依赖内部，接口一行不动。

  - id: p1-m2
    name: 数据模型：文档、切片（含权限字段）、会话表与迁移
    unlock_day: 8
    minutes: 75
    features: [数据模型, 数据库迁移, 文档版本与状态机, 权限字段冗余, 向量列与全文索引列]
    goal: |
      用 **SQLAlchemy 2（async）+ Alembic** 建好系统的全部核心表：部门、用户、文档、切片、会话、消息。重点是 `chunks` 表：它同时放**正文、分词结果、全文索引列、向量列、冗余的权限字段**，并建好 **HNSW 向量索引**和 **GIN 全文索引**。

      向量和 HNSW 的原理到 Day 18 / Day 24 才学，**今天只需要知道「这一列存一串浮点数，用来算语义相似度」**，把表结构一次设计对，后面不用改表。
    design: |
      **1. 为什么所有东西放一个 PostgreSQL**
      - 检索时要「按权限过滤 + 按相似度排序」，放一个库就能写成**一条 SQL**。
      - 入库时「删旧切片 + 插新切片 + 改文档状态」在**一个事务**里完成，不会出现「文档说已更新、向量库还是旧的」。
      - 少一个组件，备份、监控、权限都复用 PG 的体系。代价和切换时机见 deep_dive。

      **2. `documents` 表：状态机 + 版本**
      - `status`：`pending → parsing → indexing → ready`，任一步失败 → `failed`（`error` 字段写原因）。前端文档列表就显示这个状态。
      - `sha256`：同部门重复上传同一文件直接返回已有记录，省解析和 Embedding 费用。
      - `version`：每次重新入库加 1；`chunks.doc_version` 记录切片属于哪一版。

      **3. `chunks` 表：为检索而设计**

      | 字段 | 用途 |
      |---|---|
      | `content` | 切片正文，送给大模型、展示给用户 |
      | `heading_path` | 「文档标题 > 章节 > 小节」，作为上下文前缀（m7） |
      | `content_tokens` | jieba 分词后用空格连接的文本（m7 写入） |
      | `tsv` | 由 `content_tokens` **自动生成**的 `tsvector`，建 GIN 索引，供关键词检索 |
      | `embedding` | `vector(1024)`，维度必须和你用的 Embedding 模型一致，建 HNSW 索引 |
      | `dept_id` / `visibility` / `allowed_user_ids` | 从文档**冗余**过来的权限字段，检索 SQL 直接过滤 |
      | `page` | 来源页码，引用展示用 |

      **4. 为什么权限字段要冗余到 chunks**：如果只在 documents 上，检索就要 JOIN；更关键的是向量索引扫描时过滤条件最好在同一张表上。代价是**改文档权限时要同步更新它的所有切片**（m12 在一个事务里做）。

      **5. 迁移用 Alembic，不用 `create_all`**
      - 生产库不能删了重建；每次改表都是一个可回滚的迁移文件，和前端的 git 提交一样可追溯。
      - 第一个迁移里先执行 `CREATE EXTENSION IF NOT EXISTS vector`，再建表。
      - 自动生成的迁移文件里会出现 `pgvector.sqlalchemy` 的类型，**文件顶部要 `import pgvector.sqlalchemy`**，否则执行时报 NameError。

      **6. 异步会话的两个坑**
      - `async_sessionmaker(engine, expire_on_commit=False)`：默认提交后对象过期，异步里再读属性会触发懒加载而报错。
      - 一个请求一个 `AsyncSession`（`yield` 依赖），**同一个 session 不能被两个协程并发使用**（m8 会再提到）。
    data_flow: |
      今天的「数据流」是**表结构如何支撑后面每个环节**：

      ```mermaid
      flowchart LR
        UP["上传 m6"] -->|"写入 pending"| DOC["documents"]
        DOC -->|"Worker 解析切片 m7"| CH["chunks"]
        CH -->|"content_tokens 生成 tsv"| GIN["GIN 全文索引"]
        CH -->|"embedding"| HNSW["HNSW 向量索引"]
        Q["提问 m8"] -->|"权限条件加排序"| CH
        Q --> MSG["messages 保存回答 引用 trace"]
        MSG --> CONV["conversations"]
      ```

      一行 chunk 的形状示例：`{document_id: 12, doc_version: 2, chunk_index: 5, page: 3, heading_path: "员工手册 > 第三章 假期 > 年假", content: "...", content_tokens: "员工 年假 天数 ...", embedding: [0.012, -0.03, ...1024 个], dept_id: 10, visibility: "dept", allowed_user_ids: []}`。
    key_code: |
      ```python
      # app/db/models.py
      from datetime import datetime

      from pgvector.sqlalchemy import VECTOR
      from sqlalchemy import BigInteger, Computed, DateTime, ForeignKey, Index, String, Text, func
      from sqlalchemy.dialects.postgresql import ARRAY, JSONB, TSVECTOR
      from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column

      EMBED_DIM = 1024   # 必须与 Embedding 模型输出维度一致；改维度 = 重建列和索引 + 全量重新向量化


      class Base(DeclarativeBase):
          pass


      class Document(Base):
          __tablename__ = "documents"
          id: Mapped[int] = mapped_column(BigInteger, primary_key=True)
          title: Mapped[str] = mapped_column(String(300))
          dept_id: Mapped[int] = mapped_column(ForeignKey("departments.id"), index=True)
          owner_id: Mapped[int] = mapped_column(ForeignKey("users.id"))
          visibility: Mapped[str] = mapped_column(String(16), default="dept")   # public / dept / restricted
          allowed_user_ids: Mapped[list[int]] = mapped_column(ARRAY(BigInteger), default=list)
          sha256: Mapped[str] = mapped_column(String(64), index=True)
          version: Mapped[int] = mapped_column(default=0)
          status: Mapped[str] = mapped_column(String(16), default="pending")
          error: Mapped[str | None] = mapped_column(Text)
          storage_path: Mapped[str] = mapped_column(Text, default="")
          created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())
          updated_at: Mapped[datetime] = mapped_column(
              DateTime(timezone=True), server_default=func.now(), onupdate=func.now())


      class Chunk(Base):
          __tablename__ = "chunks"
          id: Mapped[int] = mapped_column(BigInteger, primary_key=True)
          document_id: Mapped[int] = mapped_column(
              ForeignKey("documents.id", ondelete="CASCADE"), index=True)
          doc_version: Mapped[int]
          chunk_index: Mapped[int]
          page: Mapped[int | None]
          heading_path: Mapped[str] = mapped_column(Text, default="")
          content: Mapped[str] = mapped_column(Text)
          content_tokens: Mapped[str] = mapped_column(Text)
          tsv: Mapped[str] = mapped_column(
              TSVECTOR, Computed("to_tsvector('simple', content_tokens)", persisted=True))
          embedding: Mapped[list[float]] = mapped_column(VECTOR(EMBED_DIM))
          # 以下三列从 documents 冗余而来，检索 SQL 直接用它们过滤
          dept_id: Mapped[int] = mapped_column(index=True)
          visibility: Mapped[str] = mapped_column(String(16))
          allowed_user_ids: Mapped[list[int]] = mapped_column(ARRAY(BigInteger), default=list)

          __table_args__ = (
              Index("ix_chunks_embedding_hnsw", "embedding",
                    postgresql_using="hnsw",
                    postgresql_with={"m": 16, "ef_construction": 64},
                    postgresql_ops={"embedding": "vector_cosine_ops"}),
              Index("ix_chunks_tsv_gin", "tsv", postgresql_using="gin"),
          )


      class Message(Base):
          __tablename__ = "messages"
          id: Mapped[int] = mapped_column(BigInteger, primary_key=True)
          conversation_id: Mapped[int] = mapped_column(
              ForeignKey("conversations.id", ondelete="CASCADE"), index=True)
          role: Mapped[str] = mapped_column(String(16))          # user / assistant
          content: Mapped[str] = mapped_column(Text)
          citations: Mapped[list[dict]] = mapped_column(JSONB, default=list)
          trace: Mapped[dict] = mapped_column(JSONB, default=dict)
          created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())
      ```

      ```python
      # app/db/session.py
      from collections.abc import AsyncIterator
      from typing import Annotated

      from fastapi import Depends
      from sqlalchemy.ext.asyncio import AsyncSession, async_sessionmaker, create_async_engine

      from app.core.config import settings

      engine = create_async_engine(settings.database_url, pool_size=10, pool_pre_ping=True)
      SessionLocal = async_sessionmaker(engine, expire_on_commit=False)


      async def get_session() -> AsyncIterator[AsyncSession]:
          async with SessionLocal() as session:
              yield session          # 请求结束自动关闭，连接还回池


      SessionDep = Annotated[AsyncSession, Depends(get_session)]
      ```

      ```python
      # migrations/versions/0001_init.py（节选）
      import pgvector.sqlalchemy  # noqa: F401  自动生成的迁移会用到它，缺了会 NameError
      from alembic import op


      def upgrade() -> None:
          op.execute("CREATE EXTENSION IF NOT EXISTS vector")
          # ... op.create_table(...) 由 alembic revision --autogenerate 生成，人工检查后保留
      ```

      **逐段读懂**

      - **`Mapped[int | None]`**：类型注解决定列是否可空，`| None` 就是 nullable，和 TS 的 `number | null` 一个意思。
      - **`Computed(..., persisted=True)`**：生成列。你只写 `content_tokens`，数据库自动算出 `tsv`，**应用层永远不要手动写 tsv**。表达式里显式写了 `'simple'` 配置，才满足「生成列必须是确定性函数」的要求。
      - **`'simple'` 配置**：只做小写化，不做词干化、不删停用词。中文分词交给 jieba，PG 只负责建倒排索引。
      - **`vector_cosine_ops`**：索引按余弦距离组织。查询时必须用余弦距离运算符 `<=>` 才能走这个索引（用 `<->` 欧氏距离会全表扫描）。
      - **`m=16, ef_construction=64`**：HNSW 建图参数（pgvector 默认值），Day 24 再学含义；今天记住「建索引时定死，查询时还有 ef_search 可调」。
      - **`ondelete="CASCADE"`**：删文档自动删切片，但 ORM 里还要配合 `passive_deletes` 或直接用 SQL 删除，否则 ORM 可能先逐条加载再删。
      - **`expire_on_commit=False`**：提交后还能直接读 `doc.id`；不加这句，异步代码里常见 `MissingGreenlet` 报错。
    ai_prompt: |
      在已有的 FastAPI 骨架（backend/）上加入数据库层。先用这条命令起一个带 pgvector 的 PostgreSQL（m3 会改成 Compose）：
      `docker run -d --name kb-pg -e POSTGRES_USER=kb -e POSTGRES_PASSWORD=kb -e POSTGRES_DB=kb -p 5432:5432 -v kb_pgdata:/var/lib/postgresql pgvector/pgvector:pg18-trixie`
      （注意 PG18 镜像的卷要挂到 /var/lib/postgresql，不是 /var/lib/postgresql/data）

      ## 目标
      用 SQLAlchemy 2 async + Alembic 建好 departments、users、documents、chunks、conversations、messages 六张表及索引。

      ## 技术约束
      - 依赖：sqlalchemy[asyncio]、psycopg[binary]、alembic、pgvector。连接串格式 `postgresql+psycopg://kb:kb@localhost:5432/kb`，放进 Settings 的 database_url。
      - 全部使用 SQLAlchemy 2 的 `DeclarativeBase` + `Mapped[...]` + `mapped_column` 写法。
      - `async_sessionmaker(engine, expire_on_commit=False)`；提供 `get_session` yield 依赖与 `SessionDep` 别名。
      - Alembic 使用 async 模板（`alembic init -t async migrations`），`env.py` 里从 settings 读连接串、`target_metadata = Base.metadata`。
      - 第一个迁移：先 `CREATE EXTENSION IF NOT EXISTS vector`；迁移文件顶部 `import pgvector.sqlalchemy`。

      ## 表结构要求
      - documents：id、title、dept_id(FK)、owner_id(FK)、visibility（public/dept/restricted，加 CHECK 约束）、allowed_user_ids bigint[]、sha256（索引）、version int 默认 0、status（pending/parsing/indexing/ready/failed，加 CHECK 约束）、error、storage_path、created_at、updated_at。(dept_id, sha256) 唯一约束。
      - chunks：id、document_id（FK，ON DELETE CASCADE，索引）、doc_version、chunk_index、page 可空、heading_path、content、content_tokens、tsv（生成列 `to_tsvector('simple', content_tokens)` STORED）、embedding `vector(1024)`（维度用常量 EMBED_DIM）、dept_id（索引）、visibility、allowed_user_ids bigint[]。索引：embedding 上 HNSW（vector_cosine_ops，m=16，ef_construction=64），tsv 上 GIN。
      - users：id、email 唯一、password_hash、dept_id、role（member/admin）。
      - conversations：id、user_id、title、created_at；messages：id、conversation_id（CASCADE）、role、content、citations jsonb、trace jsonb、created_at。

      ## 额外交付
      - `scripts/seed.py`：插入 2 个部门（人事部 id=10、技术部 id=20）、每个部门 2 个用户。
      - `GET /healthz` 增加数据库检查：执行 `SELECT 1`，失败返回 503 和 code `DB_UNAVAILABLE`。

      ## 必须写的测试（tests/test_models.py，连接真实测试库，测试前建表、测试后清理）
      1. 插入一个 chunk 后读取，`tsv` 列自动有值；`SELECT to_tsvector('simple', '年假 跨年 使用')` 返回 3 个词。
      2. 删除 document 后其 chunks 被级联删除。
      3. 同一部门插入相同 sha256 的两个文档触发唯一约束 IntegrityError。
      4. 插入维度不是 1024 的向量会报错。
      5. 用 `EXPLAIN` 查询 `ORDER BY embedding <=> 某向量 LIMIT 5`，在关闭顺序扫描（`SET enable_seqscan = off`）时计划里出现 `ix_chunks_embedding_hnsw`。

      ## 验收标准
      `uv run alembic upgrade head` 成功；`uv run alembic downgrade base` 能回滚干净；pytest 全部通过；用中文写出每张表的一句话用途。
