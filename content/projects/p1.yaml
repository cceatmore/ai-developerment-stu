    retell:
      id: p1-m5-retell
      type: oral
      category: llm
      difficulty: 3
      question: 请复述你的意图识别模块：为什么需要它？JSON mode 和 JSON Schema 有什么区别、为什么还要 Pydantic 校验？校验失败时怎么修复和兜底，兜底为什么选 kb_qa？你怎么证明它分得准？
      key_points:
        - {text: "说明意图识别是路由模式，用于省成本、避免无关问题硬检索硬编", dim: concept}
        - {text: "区分 JSON mode 只保证合法 JSON、Schema 模式约束结构，两者都需要 Pydantic 兜底校验", dim: principle}
        - {text: "说明修复重试把原输出和错误信息回传给模型，最多两次，之后兜底", dim: engineering}
        - {text: "说明兜底选 kb_qa 是因为误拒正常问题的代价高于多检索一次，且后面有拒答闸门", dim: principle}
        - {text: "说明用 20 条意图评测集算准确率并对比修改前后的结果", dim: project}
      reference: |
        意图识别是问答的第一步，本质是 workflow 里的**路由模式**：先判断问题类型，再分派到不同的处理链。寒暄不需要检索；和公司无关的问题检索出来全是噪声，模型容易硬编；信息不全的问题应该先反问。这样既省 Token，又减少幻觉。

        输出结构是 `QueryIntent`：intent 是四选一的枚举，加上关键词、文档类型、置信度和简短理由。约束输出有两种方式：**JSON mode** 只保证输出是合法 JSON，不保证字段名和取值对；**JSON Schema 模式**按给定结构约束输出，但并非所有厂商和模型都支持，strict 模式对 Schema 写法也有限制。所以不管用哪种，我都用 Pydantic 的 `model_validate_json` 再校验一遍，模型输出了枚举外的值或缺字段都会被拦下。

        **修复与兜底**：第一次校验失败，我把模型的原输出作为 assistant 消息、把 Pydantic 的前三条错误作为 user 消息追加进去，要求它只输出修正后的 JSON；DeepSeek 的 JSON Output 还可能返回空内容，我也当作失败。最多试两次，还不行就兜底为 kb_qa、置信度 0。选 kb_qa 是因为错误代价不对称：走检索最坏是检索不到然后拒答，而误判成 out_of_scope 会直接拒掉正常问题。同理，非 kb_qa 但置信度低于 0.5 时也改走检索。

        **怎么证明分得准**：我建了 20 条意图评测集，每类至少 4 条，还有两条提示词注入样例。脚本跑真实模型，输出准确率和错例；改 Prompt 后再跑一次，对比前后结果并记录在报告里。
      oral: |
        意图识别是我问答链路的第一步，属于路由模式：寒暄直接回，无关问题礼貌拒绝，信息不全先反问，只有知识库问题才检索，既省 Token 又减少硬编。输出我用 JSON mode 加 Pydantic 校验，因为 JSON mode 只保证是合法 JSON，不保证字段对。校验失败就把原输出和错误回传让模型修一次，再失败就兜底成知识库问题，因为误拒正常问题比多检索一次代价大，后面还有拒答闸门兜着。我用 20 条意图评测集算准确率，改 Prompt 前后都跑一遍对比。

  - id: p1-m6
    name: 文档上传与解析：PDF / Word / Markdown、清洗与异步任务
    unlock_day: 22
    minutes: 90
    features: [文档上传, 类型与大小校验, sha256 去重, Redis 任务队列, 独立 Worker, PDF 解析, Word 解析（含表格）, 文本清洗, 扫描件识别, 解析预览]
    goal: |
      实现 `POST /api/documents` 上传接口（校验、去重、落盘、立即返回 202），和一个**独立的 Worker 进程**从 Redis 队列取任务，把 PDF / Word / Markdown / TXT 解析成**带结构的块列表**（标题、段落、表格 + 页码），做**清洗**（页眉页脚、页码、断行），识别**扫描件**。提供解析预览接口，让你**亲眼检查解析质量**。

      **RAG 效果的上限在入库阶段就决定了**：解析错了，后面检索和生成再好也救不回来（见 Day 22）。
    design: |
      **1. 上传接口只做轻活，立即返回 202**
      - 校验扩展名白名单（`.pdf .docx .md .txt`）和大小（如 20MB）。**不信任前端传的 Content-Type**。
      - 计算 sha256：同部门已有相同文件 → 直接返回已有文档，`duplicate=true`。
      - 先写 `documents(status=pending)` 拿到 id → 按 id 落盘 → **提交事务之后**再 `LPUSH` 到 Redis 队列。顺序反了，Worker 可能比事务先跑，查不到这条记录。

      **2. 为什么用独立 Worker，而不是 FastAPI BackgroundTasks**

      | | BackgroundTasks | Redis 队列 + Worker |
      |---|---|---|
      | 进程 | 和 API 同一个进程 | 独立进程，可单独扩容 |
      | 大文件解析 | 抢 API 的 CPU，拖慢问答 | 不影响 API |
      | API 重启 | 任务丢失 | 任务在 Redis 里 |
      | 复杂度 | 最低 | 多一个进程 |

      **3. 任务幂等：抢占式更新**
      - Worker 取到 id 后执行 `UPDATE documents SET status='parsing' WHERE id=:id AND status IN ('pending','failed') RETURNING id`。返回空说明别人在处理或已完成，直接跳过。
      - **卡死恢复**：Worker 启动时把 `parsing / indexing` 超过 15 分钟的文档重置为 `pending` 并重新入队（进程崩溃时任务会卡在中间状态）。
      - 已知不足：`BRPOP` 取出后 Worker 崩溃，消息就丢了，靠卡死恢复兜底；更可靠的做法是 `BLMOVE` 到处理中列表或用 Redis Stream 消费组（Day 09）。

      **4. 统一的解析输出**：不管什么格式，都变成 `list[Block]`，每块有 `kind`（heading / paragraph / table）、`text`、`page`、`level`。**切片（m7）只认 Block，不关心原始格式**——新增格式只加一个解析函数。

      **5. 各格式要点**

      | 格式 | 库 | 要点 |
      |---|---|---|
      | PDF | `pypdf` | 逐页 `extract_text()`，保留页码；中文 PDF 常在句中断行，需要合并 |
      | Word | `python-docx` | 用 `Document.iter_inner_content()` **按文档顺序**拿段落和表格（只用 `.paragraphs` 会丢表格、打乱顺序）；标题样式识别层级；表格转 Markdown |
      | Markdown | 按 `#` 识别标题层级 | 代码块整体保留 |
      | TXT | 按空行分段 | 无结构 |

      **6. 清洗规则**
      - **页眉页脚**：在超过一半页面重复出现的短行（≤40 字）删除。
      - **页码**：匹配「第 3 页」「3 / 20」「- 3 -」这类独立行删除。
      - **断行合并**：上一行不以句末标点结尾就直接拼接（中文不需要加空格；英文要加空格，这里简化处理）。
      - **扫描件识别**：平均每页抽出的文字少于 20 个字 → 标记 `failed`，`error=NEEDS_OCR`。OCR 是可选进阶（可接 Docling、PaddleOCR 等，以各自文档为准），**先做到「识别出来并告诉用户」**。

      **7. 元数据**：标题（默认文件名）、上传人、部门、可见性（public / dept / restricted）、指定可见用户。**可见性的强制执行在检索阶段（m8、m12）**，这里只负责正确记录。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant U as 前端
        participant A as 上传接口
        participant P as PostgreSQL
        participant F as 文件卷
        participant Q as Redis 队列
        participant W as Worker
        U->>A: multipart 文件 可见性
        A->>A: 扩展名 大小 sha256
        A->>P: 查同部门同 sha256
        P-->>A: 已存在则返回 duplicate
        A->>P: INSERT documents pending
        A->>F: 写入 文档id 加扩展名
        A->>P: COMMIT
        A->>Q: LPUSH 文档 id
        A-->>U: 202 id 和 pending
        W->>Q: BRPOP
        W->>P: 抢占 UPDATE status parsing
        W->>F: 读文件
        W->>W: 解析为 Block 列表 清洗
        W->>P: 成功 status indexing 或 失败 failed 加原因
        U->>A: GET 文档状态 与 预览
      ```

      Block 示例：`{kind: "heading", text: "第三章 假期", level: 1}`、`{kind: "paragraph", text: "员工入职满一年...", page: 5}`、`{kind: "table", text: "| 工龄 | 年假天数 |\n|---|---|\n| 1-10 年 | 5 天 |", page: 6}`。
