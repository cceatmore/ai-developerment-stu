        - {text: "说明 tsv 由 content_tokens 自动生成，应用层只写分词结果，避免两列不一致", dim: concept}
        - {text: "说明向量索引用 vector_cosine_ops，查询要用余弦距离运算符才能走索引", dim: principle}
        - {text: "指出权限字段冗余的代价：改文档权限要同步更新所有切片，需要放在事务里", dim: engineering}
        - {text: "提到维度与 Embedding 模型绑定，换模型要全量重新向量化", dim: project}
      reference: |
        chunks 是检索的主表。检索时我需要同时做两件事：**按用户权限过滤**，再**按相似度或关键词得分排序**取前 K 个。如果向量放在另一个库，就得先取 Top-K 再回业务库过滤，过滤完可能只剩几条，甚至中间环节已经接触到无权内容。把向量、全文索引列和权限字段放在同一张表，一条 SQL 就能「先过滤、再排序」。入库时删除旧切片、插入新切片、更新文档状态也能放在一个事务里，不会出现两边不一致。

        **tsv 是生成列**：应用只写 `content_tokens`（jieba 分好的词，用空格连接），数据库用 `to_tsvector('simple', content_tokens)` 自动生成 tsv 并建 GIN 索引。这样不可能出现「分词更新了但 tsv 没更新」。用 simple 配置是因为中文分词已经在应用层做了，PG 只需要建倒排索引。

        **向量列**是 `vector(1024)`，维度必须等于 Embedding 模型输出，HNSW 索引用 `vector_cosine_ops`，查询时要用 `<=>` 余弦距离才能用上索引。

        **代价**：权限字段是冗余的，文档权限变化时要在一个事务里同步更新它所有切片的这三列；换 Embedding 模型或维度，要改列、重建索引、全量重新向量化，所以维度只定义一个常量。
      oral: |
        chunks 表我把正文、分词结果、全文索引列、向量列和权限字段放在一起，核心目的是让检索变成一条 SQL：先按部门和可见性过滤，再按向量距离或关键词得分排序。全文索引列是生成列，应用只写 jieba 分词结果，数据库自动生成 tsvector，避免两列不一致。向量索引是 HNSW 加余弦距离。代价是权限字段冗余，改文档权限时要在事务里同步所有切片；另外维度和模型绑定，换模型要全量重建。

  - id: p1-m3
    name: Docker Compose 编排与 SSE 流式接口
    unlock_day: 10
    minutes: 90
    features: [Docker Compose, 健康检查, Redis 限流, SSE 流式输出, 流式事件协议, Vue3 最小聊天页]
    goal: |
      用 **Docker Compose** 把 PostgreSQL（pgvector）、Redis、API 一键拉起；实现 `POST /api/chat/stream` **SSE 流式接口**（先用假 token 模拟），定义整个项目沿用的**流式事件协议**；用 Redis 做每用户限流；搭一个 **Vue3 最小聊天页**，用 `fetch` + `ReadableStream` 逐字显示。

      学完你应该能讲清：**为什么选 SSE 不选 WebSocket**、**为什么 POST 流式不能直接用 EventSource**、**限流为什么必须放在流开始之前**。
    design: |
      **1. Compose 服务**

      | 服务 | 镜像 | 要点 |
      |---|---|---|
      | `db` | `pgvector/pgvector:pg18-trixie` | 卷挂 `/var/lib/postgresql`（PG18 改了数据目录）；`pg_isready` 健康检查 |
      | `redis` | `redis:7` 或更新 | `redis-cli ping` 健康检查 |
      | `api` | 本地 Dockerfile 构建 | `depends_on` 用 `condition: service_healthy`，等数据库真正可用再启动；启动命令先 `alembic upgrade head` 再起 uvicorn |

      容器之间用**服务名**互访：API 里的连接串写 `db:5432`、`redis:6379`，不是 `localhost`（容器里的 localhost 是它自己）。

      **2. 为什么 SSE 而不是 WebSocket**
      - 问答是「客户端问一次，服务端推一串」，**单向**推送 SSE 足够。
      - SSE 就是普通 HTTP 响应，鉴权、日志、nginx 反代都沿用 HTTP 那套；WebSocket 要单独处理握手、心跳和代理配置。
      - 浏览器原生 `EventSource` **只支持 GET 且不能自定义请求头**；我们要 POST 一个 JSON 问题并带 Authorization，所以前端用 `fetch` 读 `ReadableStream`，自己解析 SSE 文本格式。

      **3. 事件协议（全项目沿用，前后端共同遵守）**

      | event | data | 时机 |
      |---|---|---|
      | `meta` | `{request_id, conversation_id}` | 第一条 |
      | `token` | `{text}` | 每个增量片段 |
      | `citations` | `[{n, document_id, title, page, snippet}]` | 生成结束、引用校验后（m10） |
      | `done` | `{refused, finish_reason}` | 最后一条 |
      | `error` | `{code, message}` | 中途出错，之后关闭流 |

      **4. 流开始后不能再改状态码**：SSE 响应一旦发出第一个字节，HTTP 状态码已经是 200。所以**能提前判断的错误（未登录、限流、参数错误）必须放在依赖里**，在生成器开始 `yield` 之前抛出；流开始后的错误只能用 `error` 事件告诉前端。

      **5. Redis 限流（固定窗口）**：`INCR rate:{user_id}:{当前分钟}`，第一次时设置 `EXPIRE 60`，超过阈值返回 429。简单够用，缺点是窗口边界处可能瞬间放过 2 倍请求（Day 09 讲过滑动窗口）。

      **6. 客户端断开**：用户关页面或点「停止」，后端要感知并停止生成，否则还在白白消耗 LLM token。循环里检查 `await request.is_disconnected()`。
    data_flow: |
      ```mermaid
      sequenceDiagram
        participant V as Vue 聊天页
        participant A as FastAPI
        participant R as Redis
        V->>A: fetch POST /api/chat/stream
        A->>A: 校验请求体 解析当前用户
        A->>R: INCR 限流计数
        R-->>A: 当前次数
        A-->>V: 超限则 429 JSON 流不开始
        A-->>V: 200 text/event-stream
        A-->>V: event meta
        loop 每个片段
          A-->>V: event token
          V->>V: 追加到当前气泡
        end
        A-->>V: event done
        V->>A: 用户点停止 AbortController 断开
        A->>A: is_disconnected 为真 停止生成
      ```

      前端拿到的原始字节形如：`event: token` 换行 `data: {"text":"年假"}` 再空一行。**两个换行分隔一个事件**，以冒号开头的行是注释（FastAPI 每 15 秒发一次 ping 注释保活），解析时要忽略。
    key_code: |
      ```python
      # app/api/chat.py（流式部分）
      import asyncio
      import logging
      import time
      from collections.abc import AsyncIterable
      from typing import Annotated

      from fastapi import APIRouter, Depends, Request
      from fastapi.sse import EventSourceResponse, ServerSentEvent

      from app.api.deps import CurrentUser, UserCtx
      from app.core.errors import AppError
      from app.core.redis import redis_client
      from app.schemas.chat import ChatRequest

      logger = logging.getLogger("kb.chat")
      router = APIRouter(tags=["chat"])
      RATE_LIMIT_PER_MIN = 20


      async def rate_limited_user(user: CurrentUser) -> UserCtx:
          minute = int(time.time() // 60)          # 墙上时间，多实例共享同一个窗口
          key = f"rate:chat:{user.id}:{minute}"
          count = await redis_client.incr(key)
          if count == 1:
              await redis_client.expire(key, 60)
          if count > RATE_LIMIT_PER_MIN:
              raise AppError("RATE_LIMITED", "提问太频繁，请稍后再试", 429)
          return user


      async def fake_tokens(question: str) -> AsyncIterable[str]:
          for ch in f"（占位）你问的是：{question}":
              await asyncio.sleep(0.03)
              yield ch


      @router.post("/chat/stream", response_class=EventSourceResponse)
      async def chat_stream(
          body: ChatRequest,
          request: Request,
          user: Annotated[UserCtx, Depends(rate_limited_user)],
      ) -> AsyncIterable[ServerSentEvent]:
          rid = request.state.request_id
          yield ServerSentEvent(data={"request_id": rid}, event="meta")
          try:
              async for piece in fake_tokens(body.question):
                  if await request.is_disconnected():
                      logger.info("client disconnected rid=%s", rid)
                      return
                  yield ServerSentEvent(data={"text": piece}, event="token")
              yield ServerSentEvent(data={"refused": False, "finish_reason": "stop"}, event="done")
          except Exception:
              logger.exception("stream failed rid=%s", rid)
              yield ServerSentEvent(data={"code": "STREAM_ERROR", "message": "生成中断，请重试"}, event="error")
      ```

      ```ts
      // frontend/src/api/stream.ts
      export type Handlers = Partial<Record<'meta' | 'token' | 'citations' | 'done' | 'error', (data: any) => void>>

      export async function streamChat(body: { question: string }, on: Handlers, signal: AbortSignal) {
        const res = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify(body),
          signal,
        })
        if (!res.ok || !res.body) {
          const err = await res.json().catch(() => ({ message: `HTTP ${res.status}` }))
          throw new Error(err.message)               // 429、401 在流开始前就以 JSON 返回
        }
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader()
        let buf = ''
        for (;;) {
          const { value, done } = await reader.read()
          if (done) break
          buf += value.replace(/\r\n/g, '\n')
          let idx: number
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const raw = buf.slice(0, idx)
            buf = buf.slice(idx + 2)
            let event = 'message'
            const dataLines: string[] = []
            for (const line of raw.split('\n')) {
              if (line.startsWith(':')) continue                     // 保活注释
              if (line.startsWith('event:')) event = line.slice(6).trim()
              else if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart())
            }
            if (dataLines.length) on[event as keyof Handlers]?.(JSON.parse(dataLines.join('\n')))
          }
        }
      }
      ```

      ```yaml
      # docker-compose.yml（节选）
      services:
        db:
          image: pgvector/pgvector:pg18-trixie
          environment: { POSTGRES_USER: kb, POSTGRES_PASSWORD: kb, POSTGRES_DB: kb }
          volumes: [ "pgdata:/var/lib/postgresql" ]
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
            interval: 5s
            retries: 10
        redis:
          image: redis:7
          healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
        api:
          build: ./backend
          env_file: .env
          environment:
            DATABASE_URL: postgresql+psycopg://kb:kb@db:5432/kb
            REDIS_URL: redis://redis:6379/0
          command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          depends_on:
            db: { condition: service_healthy }
            redis: { condition: service_healthy }
          ports: [ "8000:8000" ]
      volumes:
        pgdata: {}
      ```

      **逐段读懂**

      - **限流放在依赖 `rate_limited_user` 里**：依赖在响应开始前执行，抛 `AppError` 还能返回 429 JSON。如果写在生成器函数体里，第一行 `yield` 之前虽然也能抛，但很容易被后来者挪到 `yield` 之后，那时状态码已经是 200 了。
      - **`INCR` 后才 `EXPIRE`**：先自增、首次才设过期。两条命令不是原子的，极端情况下（自增后进程崩溃）key 永不过期；更严谨的做法是用 Lua 脚本或 `SET key 0 EX 60 NX` 再 `INCR`。面试被问到要能说出来。
      - **`ServerSentEvent(data=..., event=...)`**：`data` 会被 FastAPI 编码成 JSON；`event` 是事件名，前端据此分发。
      - **`request.is_disconnected()`**：前端 `AbortController.abort()` 或关闭页面后为真，及时 `return` 停止生成。
      - **`except` 只能发 `error` 事件**：此时状态码早已是 200，前端必须监听 `error` 事件，而不是只看 `res.ok`。
      - **前端解析**：按 `\n\n` 切事件、忽略冒号开头的注释行、多行 `data:` 用换行拼接（SSE 规范），然后 `JSON.parse`。`buf` 保留不完整的尾巴，等下一块数据到来——网络分块可能把一个事件切成两半。
      - **Compose**：`depends_on` + `service_healthy` 只保证启动顺序；运行中数据库重启，应用仍要靠连接池的 `pool_pre_ping` 和重试自愈。
    ai_prompt: |
      在现有 backend 项目上完成三件事：Docker Compose 编排、SSE 流式接口、Vue3 最小聊天页。

      ## 一、Docker Compose
      - 根目录新建 `docker-compose.yml`，服务 db（`pgvector/pgvector:pg18-trixie`，命名卷挂到 `/var/lib/postgresql`，pg_isready 健康检查）、redis（官方镜像，redis-cli ping 健康检查）、api（`backend/Dockerfile` 构建）。
      - Dockerfile：基于官方 `python:3.12-slim`，用 uv 安装依赖（先复制 pyproject.toml 和 uv.lock 再 `uv sync --frozen --no-dev`，利用分层缓存），非 root 用户运行。
      - api 启动命令先执行 `alembic upgrade head` 再启动 uvicorn；`depends_on` 使用 `condition: service_healthy`。
      - 容器内连接串用服务名 db、redis；本机开发仍可用 localhost。

      ## 二、SSE 流式接口
      - FastAPI 版本 ≥ 0.135，使用 `from fastapi.sse import EventSourceResponse, ServerSentEvent`，**不要引入 sse-starlette，也不要手拼 StreamingResponse**。
      - `POST /api/chat/stream`，请求体沿用 ChatRequest；事件协议：meta `{request_id}` → 多个 token `{text}` → done `{refused:false, finish_reason:"stop"}`；中途异常发 error `{code, message}`。
      - 先用假生成器逐字输出「（占位）你问的是：{question}」，每字间隔 30ms。
      - 每个循环检查 `await request.is_disconnected()`，断开即停止并记日志。
      - Redis：新建 `app/core/redis.py`，在 lifespan 中创建 `redis.asyncio.Redis.from_url(settings.redis_url)` 并在关闭时 `aclose()`。
      - 限流写成依赖 `rate_limited_user`：每用户每分钟 20 次（配置项），超限抛 AppError 429 `RATE_LIMITED`。**限流和鉴权必须在流开始前完成**。
      - `/healthz` 增加 Redis 检查。

      ## 三、Vue3 最小聊天页
      - `frontend/` 用 Vite 创建 Vue3 + TS 项目；vite.config 配置 `/api` 代理到 http://localhost:8000。
      - `src/api/stream.ts`：用 fetch + `res.body.pipeThrough(new TextDecoderStream())` 解析 SSE（按空行分事件、忽略冒号开头注释、支持多行 data、保留不完整尾巴），按 event 名分发回调；非 2xx 时读取 JSON 错误并抛出。
      - `src/views/ChatView.vue`：输入框、发送按钮、停止按钮（AbortController）、消息列表；token 事件追加到当前助手气泡；error 事件在气泡下显示红字。开发阶段在请求头加 X-User-Id、X-Dept-Id。

      ## 必须写的测试
      - 后端 `tests/test_stream.py`：用 TestClient 发流式请求，断言响应头 content-type 以 `text/event-stream` 开头，响应文本里依次出现 `event: meta`、`event: token`、`event: done`；连续请求 21 次第 21 次返回 429（用 fakeredis 或测试专用 Redis 库，测试前清空）。
      - 前端 `src/api/stream.spec.ts`（vitest）：构造一个把 SSE 文本拆成多段（故意在事件中间切断）的 ReadableStream，断言回调收到的事件顺序与内容正确，注释行被忽略。

      ## 验收标准
      - `docker compose up -d --build` 后三个服务都是 healthy；`docker compose down` 再 `up`，数据库数据仍在。
      - 浏览器打开前端页面提问，文字逐字出现；点停止后后端日志出现 client disconnected。
      - 后端和前端测试全部通过。
