      一个切片入库前的形状：`ChunkDraft(text="入职满一年不满十年的员工，每年可休年假 5 天……", header="员工手册 > 第三章 假期 > 年假", page=5)` → 嵌入文本 `"员工手册 > 第三章 假期 > 年假\n入职满一年……"` → 1024 维向量；分词结果 `"员工 手册 第三章 假期 年假 入职 满 一年 ..."`。
    key_code: |
      ```python
      # app/services/chunking.py
      from dataclasses import dataclass

      from app.services.parsing import Block

      SENT_END = "。！？；!?;\n"


      @dataclass
      class ChunkDraft:
          text: str              # 正文：入库、展示、送给模型
          header: str            # 文档标题 > 章节路径：参与 Embedding 和分词
          page: int | None


      def split_long(text: str, max_chars: int, overlap: int) -> list[str]:
          if len(text) <= max_chars:
              return [text]
          parts, start = [], 0
          while start < len(text):
              end = min(start + max_chars, len(text))
              if end < len(text):
                  cut = max(text.rfind(ch, start + max_chars // 2, end) for ch in SENT_END)
                  if cut > 0:
                      end = cut + 1                     # 在句末标点之后断开
              parts.append(text[start:end])
              if end >= len(text):
                  break
              start = max(end - overlap, start + 1)     # 回退 overlap 个字，且保证向前推进
          return parts


      def chunk_blocks(blocks: list[Block], title: str,
                       max_chars: int = 600, overlap: int = 80) -> list[ChunkDraft]:
          drafts: list[ChunkDraft] = []
          path: list[str] = []
          buf, page = "", None

          def header() -> str:
              return " > ".join([title, *path])

          def flush() -> None:
              nonlocal buf, page
              if buf.strip():
                  for piece in split_long(buf.strip(), max_chars, overlap):
                      drafts.append(ChunkDraft(piece, header(), page))
              buf, page = "", None

          for b in blocks:
              if b.kind == "heading":
                  flush()
                  path = path[: max(b.level - 1, 0)] + [b.text]
              elif b.kind == "table":
                  flush()
                  for piece in split_table(b.text, max_chars):
                      drafts.append(ChunkDraft(piece, header(), b.page))
              else:
                  if buf and len(buf) + len(b.text) > max_chars:
                      flush()
                  if page is None:
                      page = b.page
                  buf += b.text + "\n"
          flush()
          return drafts
      ```

      ```python
      # app/services/indexing.py
      import re

      import jieba
      from openai import AsyncOpenAI
      from sqlalchemy import delete

      from app.core.config import settings
      from app.core.errors import AppError
      from app.db.models import EMBED_DIM, Chunk, Document

      WORD = re.compile(r"[0-9A-Za-z\u4e00-\u9fff]+")


      def tokenize(text: str) -> list[str]:
          return [t.lower() for t in jieba.cut_for_search(text) if WORD.fullmatch(t)]


      class Embedder:
          def __init__(self) -> None:
              self._client = AsyncOpenAI(api_key=settings.embed_api_key, base_url=settings.embed_base_url,
                                         timeout=30, max_retries=2)

          async def embed(self, texts: list[str]) -> list[list[float]]:
              out: list[list[float]] = []
              for i in range(0, len(texts), settings.embed_batch_size):
                  resp = await self._client.embeddings.create(
                      model=settings.embed_model, input=texts[i:i + settings.embed_batch_size],
                      dimensions=EMBED_DIM, encoding_format="float")
                  vecs = [d.embedding for d in sorted(resp.data, key=lambda d: d.index)]
                  if any(len(v) != EMBED_DIM for v in vecs):
                      raise AppError("EMBED_DIM_MISMATCH", "向量维度与表结构不一致", 500)
                  out.extend(vecs)
              return out


      async def index_document(session, embedder: Embedder, doc: Document, drafts: list) -> int:
          texts = [f"{d.header}\n{d.text}" for d in drafts]
          vectors = await embedder.embed(texts)            # 慢操作：在事务之外完成
          new_version = doc.version + 1
          rows = [
              Chunk(document_id=doc.id, doc_version=new_version, chunk_index=i, page=d.page,
                    heading_path=d.header, content=d.text,
                    content_tokens=" ".join(tokenize(t)), embedding=v,
                    dept_id=doc.dept_id, visibility=doc.visibility,
                    allowed_user_ids=list(doc.allowed_user_ids))
              for i, (d, t, v) in enumerate(zip(drafts, texts, vectors, strict=True))
          ]
          try:
              await session.execute(delete(Chunk).where(Chunk.document_id == doc.id))
              session.add_all(rows)
              doc.version, doc.status, doc.error = new_version, "ready", None
              await session.commit()                       # 删旧 + 插新 + 改状态：一次提交
          except Exception:
              await session.rollback()
              raise
          return len(rows)
      ```

      **逐段读懂**

      - **`split_long` 的 `rfind` 区间从 `start + max_chars // 2` 开始**：只在后半段找句末，避免切出很短的碎片；找不到（`rfind` 返回 -1）就按长度硬切。
      - **`start = max(end - overlap, start + 1)`**：回退 overlap 形成重叠；`start + 1` 保证每轮至少前进 1 个字，**防止死循环**——这是让 AI 写切片时最容易出的 bug。
      - **`path[: b.level - 1] + [b.text]`**：遇到二级标题就保留一级标题、替换二级，路径始终是「当前所在位置」。
      - **段落累积前先判断 `len(buf) + len(b.text) > max_chars`**：尽量让一片由完整段落组成，而不是先拼再切。
      - **`header` 只用于 Embedding 和分词**，`content` 存纯正文；引用卡片展示正文，章节路径单独展示。
      - **`sorted(resp.data, key=lambda d: d.index)`**：接口返回的每条结果带 `index`，按它排序再与输入对应，不依赖返回顺序。
      - **`zip(..., strict=True)`**（Python 3.10+）：三个列表长度不一致时直接报错，而不是悄悄截断，导致「第 37 片的向量配到了第 38 片」这种极难排查的错位。
      - **事务边界**：`embed()` 在任何写操作之前完成；之后的删除、插入、改状态在同一次 `commit` 里。失败就 `rollback`，旧切片原样保留。
      - **`list(doc.allowed_user_ids)`**：复制一份，避免多个 ORM 对象共享同一个可变列表（见 Day 02 可变对象）。
    ai_prompt: |
      实现切片、分词、向量化入库，并让 Worker 在解析成功后继续完成入库；同时实现文档更新与删除接口。

      ## 技术约束
      - 依赖：jieba；Embedding 使用官方 openai SDK 的 `AsyncOpenAI.embeddings.create`（OpenAI 兼容接口，例如百炼 text-embedding-v4），配置项 `embed_base_url`、`embed_api_key`、`embed_model`、`embed_batch_size`（默认 10）、`embed_send_dimensions`（默认 true，为 false 时不传 dimensions 参数）。
      - 不使用 LangChain 的 TextSplitter，切片逻辑自己实现为纯函数，便于测试。
      - Embedding 调用必须在数据库事务之外；删旧、插新、版本加 1、状态置 ready 在同一次 commit 中。

      ## 文件
      - `app/services/chunking.py`：`ChunkDraft(text, header, page)`；`split_long(text, max_chars, overlap)`（优先在句末标点处切，后半段找不到则硬切，相邻重叠 overlap，必须保证循环前进）；`split_table(md, max_chars)`（≤1.5 倍 max_chars 整表一片，否则按行切且每片重复表头两行）；`chunk_blocks(blocks, title, max_chars=600, overlap=80)`（heading 结束当前片并更新章节路径；table 单独成片；段落累积到上限即切）。max_chars、overlap 做成配置项。
      - `app/services/indexing.py`：`tokenize(text)`（jieba.cut_for_search，只保留字母数字汉字，小写）；启动时若存在 `data/userdict.txt` 则 `jieba.load_userdict`；`Embedder.embed(texts)`（分批、按 index 排序、校验维度）；`index_document(session, embedder, doc, drafts)`（嵌入文本与分词文本均为「header 换行 正文」，content 只存正文，权限三列从文档复制）。
      - `app/worker.py`：解析成功后读取 Block → 切片 → 入库 → ready；失败置 failed + error（EMBED_ERROR / INDEX_ERROR）。入库成功后 Redis `INCR kb:version`。
      - `PUT /api/documents/{id}/file`：同部门才能更新；sha256 未变返回 `{changed: false}`；变化则覆盖文件、更新 sha256、状态置 pending、入队，返回 202。**更新期间旧切片保持可检索**。
      - `DELETE /api/documents/{id}`：同部门的 owner 或 admin 才能删除；删除记录（切片级联）与文件，`INCR kb:version`，返回 204。
      - `GET /api/documents/{id}/chunks?limit=20`：调试用，返回切片的 chunk_index、page、heading_path、content 前 100 字、content_tokens 前 100 字。

      ## 必须写的测试
      1. `split_long`：长度 2000 的无标点文本、长度 2000 的有句号文本、长度刚好等于 max 的文本，都能结束（加超时断言），每片长度 ≤ max_chars，相邻片有重叠。
      2. `chunk_blocks`：两个一级标题下各有段落时，不会产生跨章节的切片；header 正确反映章节路径。
      3. `split_table`：30 行的长表被切成多片，每片前两行都是表头和分隔行。
      4. `tokenize("请问OA系统报销流程")` 结果包含 oa 且只含字母数字汉字。
      5. `index_document`：用 FakeEmbedder 返回固定向量，先入库一版，再用不同内容入库第二版：切片全部替换、doc_version 为 2、旧切片不存在；让 FakeEmbedder 抛异常时旧切片仍然存在、状态不是 ready。
      6. Embedder 收到乱序 data 时按 index 正确对齐（mock 返回）。

      ## 验收标准
      - 上传 m6 用过的 PDF 和 Word，状态变为 ready；用 chunks 调试接口检查：切片不跨章节、表格片带表头、header 路径正确。
      - 修改 Word 中一段文字后重新上传：version 加 1，chunks 里只有新版本；更新过程中（Worker 处理时）检索接口仍能返回旧内容。
      - 写下你对 3 个切片质量问题的观察到 `docs/chunk_check.md`。
