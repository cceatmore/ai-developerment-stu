      review:
        - "acl() 只定义一次，三处 SQL 都调用它；没有任何检索路径绕过它"
        - "SQL 中用户相关值全部是绑定参数，SET LOCAL 里的数字经过 int 强转"
        - "没有对同一个 session 使用 asyncio.gather 并发执行两条 SQL"
        - "rrf_fuse 有单测，且同分排序稳定"
