      CLAIM = text("""UPDATE documents SET status = 'parsing', error = NULL, updated_at = now()
                      WHERE id = :id AND status IN ('pending', 'failed') RETURNING id""")


      async def handle(doc_id: int) -> None:
          async with SessionLocal() as session:
              if (await session.execute(CLAIM, {"id": doc_id})).first() is None:
                  return                                   # 别人在处理或已完成：幂等跳过
              await session.commit()
              doc = await session.get(Document, doc_id)
