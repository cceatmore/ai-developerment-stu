modules:
  - id: p1-m1
    name: 项目骨架：FastAPI 分层、统一错误与请求追踪
    unlock_day: 7
    minutes: 60
    features: [项目骨架, 配置管理, 统一错误格式, request_id 追踪, 健康检查, 当前用户依赖]
    goal: |
      用 uv 初始化后端项目，搭起 FastAPI 分层骨架：**配置、路由、Pydantic v2 模型、依赖注入、统一错误格式、request_id**。先实现一个返回「假回答」的 `POST /api/chat`，把「请求 → 校验 → 依赖 → 业务 → 响应 / 错误」整条链路跑通。后面 11 个模块都往这个骨架里填内容。

      学完你应该能讲清：**一个请求在 FastAPI 里经过了哪些环节**，以及**为什么现在就要把「当前用户」做成依赖**。
    design: |
      **1. 目录分层（对照前端）**

      | 后端目录 | 职责 | 前端类比 |
      |---|---|---|
      | `api/` | 接收参数、调用 service、返回响应 | 页面组件只管交互 |
      | `services/` | 业务逻辑，不知道 HTTP 的存在 | composables / store actions |
      | `schemas/` | Pydantic 请求与响应模型 | TS 类型 + zod 校验 |
      | `core/` | 配置、错误、日志 | axios 封装与拦截器 |

      **规则**：`services/` 里不准 `import fastapi`。这样评测脚本（m11）可以直接调用 service，不用起 HTTP 服务。

      **2. 配置：pydantic-settings**
      - 从环境变量和 `.env` 读取，带类型校验，缺了必填项启动就报错（比运行到一半才发现强）。
      - `.env` 进 `.gitignore`，仓库里只提交 `.env.example`。

      **3. 统一错误格式** `{"code": "...", "message": "...", "request_id": "..."}`
      - 业务错误抛 `AppError(code, message, status)`，一个 `exception_handler` 统一转 JSON。
      - 参数校验失败（`RequestValidationError`）也转成同一格式，`code=VALIDATION_ERROR`，附上字段错误列表。
      - 未知异常返回 500 + 通用文案，**堆栈只进日志不进响应**（防止泄露 SQL、路径、密钥）。
      - 前端拿到 `code` 做分支，拿到 `request_id` 让用户截图反馈——和你做 axios 响应拦截器是一回事。

      **4. request_id 中间件**：优先用请求头 `X-Request-ID`（nginx 或前端传入），没有就生成；写进响应头和每条日志。线上排查「这个用户刚才那次提问」全靠它。

      **5. 当前用户依赖（开发版）**
      - `get_current_user` 现在先从请求头 `X-User-Id`、`X-Dept-Id` 读取，返回 `UserCtx(id, dept_id, role)`，**只在 `APP_ENV=dev` 时允许**。
      - **为什么现在就做**：m8 的检索 SQL 要用 `dept_id` 做权限过滤。提前让每个接口都通过依赖拿到用户上下文，m12 只需把实现换成 JWT 校验，**调用方一行都不用改**。这就是依赖注入的价值。

      **6. 生命周期用 `lifespan`**：`@app.on_event("startup")` 是旧写法。后面数据库连接池、Redis、HTTP 客户端都在 lifespan 里创建和关闭。
    data_flow: |
      一次 `POST /api/chat` 的完整路径：

      ```mermaid
      sequenceDiagram
        participant C as 客户端
        participant M as request_id 中间件
        participant R as 路由与校验
        participant D as 依赖 get_current_user
        participant S as chat_service
        participant H as 异常处理器
        C->>M: POST /api/chat JSON
        M->>M: 读取或生成 request_id
        M->>R: 进入路由
        R->>R: Pydantic 校验 ChatRequest
        R->>D: 解析依赖
        D-->>R: UserCtx 或抛 AppError 401
        R->>S: answer 问题 与 用户
        S-->>R: ChatResponse
        R-->>M: 200 JSON
        M-->>C: 响应头带 X-Request-ID
        R->>H: 任一环节抛错
        H-->>C: 统一错误 JSON 带 request_id
      ```

      **数据形状变化**：原始 JSON → `ChatRequest`（已去首尾空格、长度校验）→ `UserCtx` 注入 → service 返回 `ChatResponse` → FastAPI 按 `response_model` 序列化为 JSON。
    key_code: |
      ```python
      # app/core/errors.py
      class AppError(Exception):
          """业务错误：code 给前端做分支，message 给用户看，status 是 HTTP 状态码。"""

          def __init__(self, code: str, message: str, status: int = 400) -> None:
              super().__init__(message)
              self.code = code
              self.message = message
              self.status = status
      ```

      ```python
      # app/main.py
      import logging
      import uuid
      from contextlib import asynccontextmanager

      from fastapi import FastAPI, Request
      from fastapi.exceptions import RequestValidationError
      from fastapi.responses import JSONResponse

      from app.api import chat, health
      from app.core.config import settings
      from app.core.errors import AppError

      logger = logging.getLogger("kb")


      @asynccontextmanager
      async def lifespan(app: FastAPI):
          logger.info("starting %s env=%s", settings.app_name, settings.app_env)
          yield                      # yield 之前是启动，之后是关闭
          logger.info("shutdown")


      app = FastAPI(title="kb-rag", lifespan=lifespan)


      @app.middleware("http")
      async def request_id_middleware(request: Request, call_next):
          rid = request.headers.get("X-Request-ID") or uuid.uuid4().hex
          request.state.request_id = rid
          response = await call_next(request)
          response.headers["X-Request-ID"] = rid
          return response


      def _error(request: Request, status: int, code: str, message: str, **extra) -> JSONResponse:
          body = {"code": code, "message": message,
                  "request_id": getattr(request.state, "request_id", None), **extra}
          return JSONResponse(status_code=status, content=body)


      @app.exception_handler(AppError)
      async def handle_app_error(request: Request, exc: AppError):
          return _error(request, exc.status, exc.code, exc.message)


      @app.exception_handler(RequestValidationError)
      async def handle_validation(request: Request, exc: RequestValidationError):
          fields = [{"loc": e["loc"], "msg": e["msg"]} for e in exc.errors()]
          return _error(request, 422, "VALIDATION_ERROR", "请求参数不合法", errors=fields)


      @app.exception_handler(Exception)
      async def handle_unknown(request: Request, exc: Exception):
          logger.exception("unhandled error rid=%s", getattr(request.state, "request_id", None))
          return _error(request, 500, "INTERNAL_ERROR", "服务内部错误，请稍后重试")


      app.include_router(health.router)
      app.include_router(chat.router, prefix="/api")
      ```

      ```python
      # app/api/deps.py
      from dataclasses import dataclass
      from typing import Annotated

      from fastapi import Depends, Header

      from app.core.config import settings
      from app.core.errors import AppError


      @dataclass(frozen=True)
      class UserCtx:
          id: int
          dept_id: int
          role: str = "member"


      async def get_current_user(
          x_user_id: Annotated[int | None, Header()] = None,
          x_dept_id: Annotated[int | None, Header()] = None,
      ) -> UserCtx:
          if settings.app_env != "dev":
              raise AppError("AUTH_REQUIRED", "请先登录", 401)   # m12 换成 JWT 校验
          if x_user_id is None or x_dept_id is None:
              raise AppError("AUTH_REQUIRED", "缺少用户信息", 401)
          return UserCtx(id=x_user_id, dept_id=x_dept_id)


      CurrentUser = Annotated[UserCtx, Depends(get_current_user)]
      ```

      ```python
      # app/schemas/chat.py 与 app/api/chat.py
      from fastapi import APIRouter
      from pydantic import BaseModel, ConfigDict, Field

      from app.api.deps import CurrentUser
      from app.services import chat_service


      class ChatRequest(BaseModel):
          model_config = ConfigDict(str_strip_whitespace=True)
          question: str = Field(min_length=1, max_length=2000)
          conversation_id: int | None = None


      class ChatResponse(BaseModel):
          answer: str
          citations: list[dict] = []
          refused: bool = False


      router = APIRouter(tags=["chat"])


      @router.post("/chat", response_model=ChatResponse)
      async def chat(body: ChatRequest, user: CurrentUser) -> ChatResponse:
          return await chat_service.answer(body.question, user)
      ```

      **逐段读懂**

      - **`AppError`**：只携带「给谁看的什么信息」，不关心 HTTP 怎么返回。service 层抛它，handler 负责翻译成 HTTP——这就是分层。
      - **`lifespan`**：`yield` 把函数分成启动和关闭两半。后面模块在 `yield` 前创建数据库引擎、Redis、HTTP 客户端，`yield` 后关闭。
      - **中间件**：`call_next(request)` 之前是「请求拦截」，之后是「响应拦截」，和 axios 拦截器的 request / response 两个钩子一一对应。
      - **三个 exception_handler 的顺序无关**：FastAPI 按异常类型匹配**最具体**的处理器，`AppError` 不会落到 `Exception` 那个里。
      - **`Header()` 参数名转换**：`x_user_id` 会自动对应请求头 `x-user-id`（下划线转连字符、大小写不敏感）。
      - **`CurrentUser = Annotated[..., Depends(...)]`**：把「类型 + 怎么获取」打包成一个别名，接口签名里写 `user: CurrentUser` 就行。m12 只改 `get_current_user` 内部。
      - **`str_strip_whitespace=True`**：`"   "` 会先被去成空串，再被 `min_length=1` 拒掉——所以纯空格的问题返回 422 而不是进入业务。
    ai_prompt: |
      你是资深 Python 后端工程师。请在 `backend/` 目录用 uv 初始化一个 FastAPI 项目（Python 3.12+），这是「企业知识库问答系统」的骨架，后续会逐步加入数据库、RAG、流式输出。

      ## 目标
      搭好分层骨架，实现 `GET /healthz` 和返回假回答的 `POST /api/chat`，统一错误格式和 request_id 全部跑通。

      ## 技术约束
      - 依赖：fastapi、uvicorn[standard]、pydantic-settings；测试用 pytest、httpx（用 `fastapi.testclient.TestClient`）。用 `uv add` 安装，提交 `uv.lock`。
      - Pydantic v2 写法：`model_config = ConfigDict(...)` / `SettingsConfigDict(...)`，**禁止** `class Config` 和 `.dict()`。
      - 生命周期用 `lifespan`，**禁止** `@app.on_event`。
      - `services/` 目录下的代码**不允许 import fastapi**。

      ## 文件结构
      ```text
      backend/app/main.py            # FastAPI 实例、lifespan、request_id 中间件、3 个异常处理器、注册路由
      backend/app/core/config.py     # Settings：app_name、app_env（dev/prod，默认 dev）、log_level
      backend/app/core/errors.py     # AppError(code, message, status)
      backend/app/core/logging.py    # 日志格式包含时间、级别、request_id
      backend/app/api/deps.py        # UserCtx 数据类；get_current_user 开发版：仅 app_env=dev 时从 X-User-Id、X-Dept-Id 头读取，否则 401；导出 CurrentUser 别名
      backend/app/api/health.py      # GET /healthz -> {"status": "ok"}
      backend/app/api/chat.py        # POST /api/chat
      backend/app/schemas/chat.py    # ChatRequest(question 1~2000 字，去首尾空格；conversation_id 可选)、ChatResponse(answer, citations, refused)
      backend/app/services/chat_service.py  # async answer(question, user) 返回「（占位回答）你问的是：xxx」
      backend/.env.example
      backend/tests/test_skeleton.py
      ```

      ## 错误格式
      所有错误响应体统一为 `{"code": str, "message": str, "request_id": str}`；参数校验错误额外带 `errors` 列表，code 为 `VALIDATION_ERROR`，状态 422；未知异常返回 500、code 为 `INTERNAL_ERROR`，**响应里不能出现异常堆栈或异常原文**，堆栈写日志。

      ## 必须写的测试（tests/test_skeleton.py）
      1. `/healthz` 返回 200 和 `{"status":"ok"}`。
      2. 带 `X-User-Id: 1`、`X-Dept-Id: 10` 调 `/api/chat` 返回 200，answer 包含问题原文。
      3. 不带用户头返回 401，code 为 `AUTH_REQUIRED`，响应体含 request_id。
      4. question 为 3 个空格时返回 422，code 为 `VALIDATION_ERROR`。
      5. 请求头传 `X-Request-ID: test-123`，响应头原样返回 `test-123`。
      6. 用 monkeypatch 让 `chat_service.answer` 抛 `RuntimeError("db password=xxx")`，返回 500，响应体里**不包含** `password`。（提示：TestClient 需 `raise_server_exceptions=False`）

      ## 验收标准
      - `uv run pytest` 全部通过；`uv run uvicorn app.main:app --reload` 后打开 `/docs` 能看到两个接口。
      - 写完后用 5 行中文说明：一个请求依次经过了哪些函数。
    tests:
      functional:
        - "uv run uvicorn app.main:app --reload 启动后，浏览器打开 http://localhost:8000/docs 能看到 /healthz 和 /api/chat 两个接口"
        - "在 /docs 里带 X-User-Id=1、X-Dept-Id=10 调用 /api/chat，返回的 answer 包含你的问题原文"
