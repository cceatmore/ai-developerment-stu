      # app/api/documents.py（上传）
      import hashlib
      from pathlib import Path
      from typing import Annotated

      from fastapi import APIRouter, Form, UploadFile
      from sqlalchemy import select

      from app.api.deps import CurrentUser
      from app.core.config import settings
      from app.core.errors import AppError
      from app.core.redis import redis_client
      from app.db.models import Document
      from app.db.session import SessionDep

      router = APIRouter(tags=["documents"])
      ALLOWED = {".pdf", ".docx", ".md", ".txt"}
      QUEUE = "ingest:queue"


      @router.post("/documents", status_code=202)
      async def upload(
          file: UploadFile,
          user: CurrentUser,
          session: SessionDep,
          visibility: Annotated[str, Form()] = "dept",
      ) -> dict:
          ext = Path(file.filename or "").suffix.lower()
          if ext not in ALLOWED:
              raise AppError("UNSUPPORTED_TYPE", f"不支持的文件类型：{ext or '无扩展名'}", 415)
          if visibility not in ("public", "dept", "restricted"):
              raise AppError("BAD_VISIBILITY", "可见性取值不合法", 422)
          data = await file.read(settings.max_upload_bytes + 1)
          if len(data) > settings.max_upload_bytes:
              raise AppError("FILE_TOO_LARGE", "文件超过大小限制", 413)
          digest = hashlib.sha256(data).hexdigest()

          dup = await session.scalar(select(Document).where(
              Document.dept_id == user.dept_id, Document.sha256 == digest))
          if dup:
              return {"id": dup.id, "status": dup.status, "duplicate": True}

          doc = Document(title=Path(file.filename).stem, dept_id=user.dept_id, owner_id=user.id,
                         visibility=visibility, allowed_user_ids=[user.id], sha256=digest)
          session.add(doc)
          await session.flush()                     # 拿到自增 id，但还没提交
          path = settings.upload_dir / f"{doc.id}{ext}"
          path.write_bytes(data)
          doc.storage_path = str(path)
          await session.commit()
          await redis_client.lpush(QUEUE, doc.id)   # 必须在 commit 之后
          return {"id": doc.id, "status": "pending", "duplicate": False}
      ```

      ```python
      # app/services/parsing.py（节选）
      import re
      from collections import Counter
      from dataclasses import dataclass
      from pathlib import Path

      from docx import Document as DocxDocument
      from docx.table import Table
      from docx.text.paragraph import Paragraph
      from pypdf import PdfReader


      @dataclass
      class Block:
          kind: str                 # heading / paragraph / table
          text: str
          page: int | None = None
          level: int = 0            # 标题层级，正文为 0


      class ParseError(Exception):
          def __init__(self, code: str, message: str) -> None:
              super().__init__(message)
              self.code = code


      PAGE_NO = re.compile(r"^\s*(第\s*\d+\s*页|\d+\s*/\s*\d+|-?\s*\d+\s*-?)\s*$")
      SENT_END = tuple("。！？；：.!?;:")


      def parse_pdf(path: Path) -> list[Block]:
          reader = PdfReader(path)
          pages = [p.extract_text() or "" for p in reader.pages]
          if sum(len(t.strip()) for t in pages) / max(len(pages), 1) < 20:
              raise ParseError("NEEDS_OCR", "疑似扫描件，未抽取到文字")
          lines = [[l.strip() for l in t.splitlines() if l.strip()] for t in pages]
          counts = Counter(l for ls in lines for l in set(ls) if len(l) <= 40)
          repeated = {l for l, n in counts.items() if len(pages) >= 3 and n / len(pages) >= 0.5}
          blocks: list[Block] = []
          for page_no, ls in enumerate(lines, start=1):
              kept = [l for l in ls if l not in repeated and not PAGE_NO.match(l)]
              for para in merge_broken_lines(kept):
                  blocks.append(Block("paragraph", para, page=page_no))
          return blocks


      def merge_broken_lines(lines: list[str]) -> list[str]:
          paras, buf = [], ""
          for l in lines:
              buf += l
              if buf.endswith(SENT_END):
                  paras.append(buf)
                  buf = ""
          if buf:
              paras.append(buf)
          return paras


      def parse_docx(path: Path) -> list[Block]:
          blocks: list[Block] = []
          for item in DocxDocument(str(path)).iter_inner_content():
              if isinstance(item, Paragraph):
                  text = item.text.strip()
                  if not text:
                      continue
                  style = item.style.name if item.style is not None else ""
                  m = re.match(r"^(Heading|标题)\s*(\d)", style)
                  if m:
                      blocks.append(Block("heading", text, level=int(m.group(2))))
                  else:
                      blocks.append(Block("paragraph", text))
              elif isinstance(item, Table):
                  md = table_to_markdown(item)
                  if md:
                      blocks.append(Block("table", md))
          return blocks


      def table_to_markdown(table: Table) -> str:
          rows = [[c.text.strip().replace("\n", " ") for c in r.cells] for r in table.rows]
          if not rows:
              return ""
          head, body = rows[0], rows[1:]
          out = ["| " + " | ".join(head) + " |", "|" + "---|" * len(head)]
          out += ["| " + " | ".join(r) + " |" for r in body]
          return "\n".join(out)
      ```

