      trace 示例：`{"question": "那出国呢", "standalone": "出国出差的住宿标准是多少", "rewrite_ms": 420, "candidates": [{"chunk_id": 381, "vec_rank": 2, "kw_rank": 1, "rerank": 0.91}, ...], "rerank_ms": 310, "rerank_degraded": false}`。
    key_code: |
      ```python
      # app/services/rerank.py
      import asyncio
      import logging
      from typing import Protocol

      import httpx

      from app.core.config import settings

      log = logging.getLogger("kb.rerank")


      class Reranker(Protocol):
          async def rerank(self, query: str, docs: list[str], top_n: int) -> list[tuple[int, float]]:
              """返回 (候选下标, 分数)，按分数从高到低。"""


      class ApiReranker:
          """OpenAI 兼容的 /reranks 接口，例如百炼 qwen3-rerank；地址与模型名放配置。"""

          def __init__(self, http: httpx.AsyncClient) -> None:
              self.http = http

          async def rerank(self, query, docs, top_n):
              resp = await self.http.post(
                  settings.rerank_url,
                  headers={"Authorization": f"Bearer {settings.rerank_api_key}"},
                  json={"model": settings.rerank_model, "query": query,
                        "documents": docs, "top_n": top_n},
                  timeout=settings.rerank_timeout_s,
              )
              resp.raise_for_status()
              return [(r["index"], r["relevance_score"]) for r in resp.json()["results"]]


      class LocalReranker:
          def __init__(self) -> None:
              from FlagEmbedding import FlagReranker          # 只有选本地版才导入，避免 API 版也装 torch
              self.model = FlagReranker("BAAI/bge-reranker-v2-m3", use_fp16=settings.rerank_fp16)

          async def rerank(self, query, docs, top_n):
              pairs = [[query, d] for d in docs]
              scores = await asyncio.to_thread(self.model.compute_score, pairs, normalize=True)
              ranked = sorted(enumerate(scores), key=lambda x: x[1], reverse=True)
              return ranked[:top_n]


      async def rerank_candidates(reranker: Reranker, query: str, cands: list, top_n: int, trace: dict) -> list:
          docs = [f"{c.heading_path}\n{c.content}"[: settings.rerank_max_chars] for c in cands]
          try:
              ranked = await asyncio.wait_for(reranker.rerank(query, docs, top_n),
                                              timeout=settings.rerank_timeout_s + 1)
          except Exception as e:
              log.warning("rerank degraded err=%r", e)
              trace["rerank_degraded"] = True
              return cands[:top_n]                           # 降级：沿用 RRF 顺序
          trace["rerank_degraded"] = False
          out = []
          for idx, score in ranked:
              c = cands[idx]
              c.rerank_score = float(score)
              out.append(c)
          return out
      ```

      ```python
      # app/services/rewrite.py
      import re

      from pydantic import BaseModel, ValidationError

      DEPENDENT = re.compile(r"(它|这个|那个|那|这|上面|刚才|前面|还有呢|呢$)")


      class Rewrite(BaseModel):
          standalone: str
          changed: bool


      PROMPT = """根据对话历史，把用户最新的问题改写成一个不依赖上下文、可以单独检索的完整问题。
      只补全指代和省略，不要回答问题，不要添加历史中没有的信息。
      只输出 json：{"standalone": "改写后的问题", "changed": true 或 false}"""


      def need_rewrite(question: str, history: list[dict]) -> bool:
          return bool(history) and (len(question) < 15 or bool(DEPENDENT.search(question)))


      async def rewrite(llm, question: str, history: list[dict]) -> str:
          if not need_rewrite(question, history):
              return question
          messages = [{"role": "system", "content": PROMPT}, *history[-6:],
                      {"role": "user", "content": question}]
          try:
              raw = await llm.chat(messages, temperature=0, max_tokens=200,
                                   response_format={"type": "json_object"})
              r = Rewrite.model_validate_json(raw)
          except (ValidationError, Exception):
              return question
          s = r.standalone.strip()
          if not s or len(s) > 5 * max(len(question), 10):
              return question                                  # 守护：空或异常长就不用
          return s
      ```

      **逐段读懂**

      - **`Protocol`**：结构化类型，等价于 TS 的 `interface`——只要有同签名的 `rerank` 方法就算实现，不需要继承。两种重排器可以通过配置切换。
      - **`ApiReranker` 只依赖配置里的 URL 和模型名**：百炼 OpenAI 兼容地址形如 `https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-api/v1/reranks`（以控制台为准）；Cohere、Jina 等接口结构相近但不完全相同，换厂商时先核对返回字段。
      - **`LocalReranker` 延迟导入**：FlagEmbedding 依赖 torch，体积几个 GB；只在选择本地版时才导入。`compute_score` 是同步 CPU/GPU 计算，必须 `to_thread`。
      - **`docs` 截断到 `rerank_max_chars`**：重排模型有单条输入长度上限（百炼文档：单条超限直接返回 400，不会截断），自己先截断。
      - **`wait_for` 外层超时**：即使 HTTP 客户端的超时没生效（比如本地模型卡住），整体也会在规定时间内返回。
      - **降级返回 `cands[:top_n]`**：RRF 顺序本身就是不错的排序，降级后体验只是略差；关键是 trace 里留下标记，你才能统计「降级率」。
      - **`need_rewrite` 的启发式规则**：大多数问题本身就是完整的，跳过改写能省几百毫秒。规则会漏判（比如「那报销呢」这种你没想到的说法），评测集里放几条多轮用例来检验。
      - **改写只用于检索**：调用方把 `standalone` 传给 `hybrid_search`，生成时仍用用户原话——这一点面试常被追问。
    ai_prompt: |
      在问答链路中加入查询改写（检索前）和重排（检索后），两者都必须可降级、可观测。

      ## 技术约束
      - 重排器用 `typing.Protocol` 定义接口 `async rerank(query, docs, top_n) -> list[tuple[int, float]]`，两种实现：
        - `ApiReranker`：用 httpx.AsyncClient（在 lifespan 中创建一次）POST 到配置 `rerank_url`，请求体 `{"model", "query", "documents", "top_n"}`，从返回 JSON 的 `results` 读取 `index` 与 `relevance_score`（百炼 OpenAI 兼容 `/compatible-api/v1/reranks` 格式）。
        - `LocalReranker`：`from FlagEmbedding import FlagReranker`，模型 `BAAI/bge-reranker-v2-m3`，`compute_score(pairs, normalize=True)`，用 `asyncio.to_thread` 调用；FlagEmbedding 作为可选依赖组（`uv add --optional local-rerank FlagEmbedding`），在函数内部延迟导入。
      - 配置：`reranker`（api / local / none）、`rerank_url`、`rerank_api_key`、`rerank_model`、`rerank_timeout_s`=3、`rerank_max_chars`=1000、`context_top_k`=6、`rewrite_enabled`=true、`hyde_enabled`=false。
      - 重排失败或超时：沿用 RRF 顺序取前 K，trace 记录 `rerank_degraded: true`。
      - 改写：仅当有历史且（问题少于 15 字或含指代词）时调用；最近 3 轮历史；json_object 结构化输出 + Pydantic 校验；失败、为空、长度超过原问题 5 倍时用原问题。**改写结果只用于检索，生成仍使用原问题与历史**。
      - HyDE：开启时先生成不超过 150 字的假设答案，仅用于向量通道的查询向量；关键词通道仍用独立问题。

      ## 文件
      - `app/services/rerank.py`、`app/services/rewrite.py`（见上）。
      - `app/services/pipeline.py`：把「意图 → 改写 → 混合检索 → 重排」串成 `async retrieve_for_answer(question, history, user) -> (candidates, trace)`，trace 包含 question、standalone、各步骤耗时毫秒数、每个候选的 chunk_id/vec_rank/kw_rank/rerank_score、rerank_degraded。
      - 问答接口改为调用 pipeline；`/api/search/debug` 增加 `rerank=true` 参数，展示重排前后的名次对比。
      - 会话：`POST /api/chat/stream` 支持 conversation_id，从 messages 表读取最近 3 轮作为 history；没有则新建会话。

      ## 必须写的测试
      1. 用假重排器（返回逆序）验证 `rerank_candidates` 结果顺序按分数排列，且 `rerank_score` 被写入候选。
      2. 假重排器 sleep 超过超时 → 返回 RRF 顺序前 K，trace 中 `rerank_degraded` 为 true。
      3. 用 httpx.MockTransport 模拟百炼返回 `{"results":[{"index":2,"relevance_score":0.9},{"index":0,"relevance_score":0.3}]}`，`ApiReranker` 解析正确；返回 500 时抛出并被降级逻辑捕获。
      4. `need_rewrite`：无历史返回 false；「那出国呢」有历史返回 true；「出差住宿标准是多少」有历史但完整，返回 false。
      5. FakeLLM 让改写返回 `{"standalone": ""}` 或超长文本 → 使用原问题。
      6. 断言生成阶段收到的 user 消息是原问题而不是改写结果。

      ## 验收标准
      - 在调试接口里用 5 个问题对比重排前后的前 6 名，把「重排把正确答案从第几名提到第几名」记录到 `docs/rerank_check.md`。
      - 在前端连续问「出差住宿标准是多少」「那出国呢」，trace 中第二问的 standalone 补全了「出差住宿」，回答正确。
      - 把 RERANKER 设为 none 和 api 各跑一遍，体感延迟差异写进记录（m11 会量化）。
