              except ParseError as e:
                  doc.status, doc.error = "failed", e.code
              except Exception:
                  log.exception("parse failed doc=%s", doc_id)
                  doc.status, doc.error = "failed", "PARSE_ERROR"
              await session.commit()


      async def run() -> None:
          await recover_stuck()                            # 卡在中间状态超过 15 分钟的重新入队
          while True:
              item = await redis_client.brpop([QUEUE], timeout=5)
              if item is not None:
                  await handle(int(item[1]))
      ```

      **逐段读懂**

      - **`file.read(max + 1)`**：多读 1 字节就能判断是否超限，而不是把一个 2GB 文件整个读进内存再判断。生产环境还应在 nginx 层用 `client_max_body_size` 先挡一道。
      - **`flush` 和 `commit` 的区别**：`flush` 把 INSERT 发给数据库拿到 id，但事务未提交，别的连接看不到；`commit` 之后 Worker 才能查到。**`LPUSH` 必须在 `commit` 之后**。
      - **`allowed_user_ids=[user.id]`**：上传者总能看到自己的 restricted 文档。
      - **重复行检测**：`set(ls)` 保证同一页重复的行只算一次；`len(pages) >= 3` 防止两页的文档把正文误删。
      - **`iter_inner_content()`**：python-docx 1.1 起提供，按文档真实顺序交替返回段落和表格。只用 `doc.paragraphs` 会丢掉所有表格——制度文件里的「工龄与年假天数对照表」就没了。
      - **标题样式匹配 `Heading` 或 `标题`**：不同 Word 版本和模板的样式名不同，先兼容这两种；不规范的文档（全是正文样式加粗）识别不出标题，会退化为无结构切片。
      - **抢占式 `UPDATE ... RETURNING`**：一条 SQL 同时完成「检查状态 + 修改状态」，数据库行锁保证只有一个 Worker 能抢到。先 SELECT 再 UPDATE 会有并发窗口。
      - **`asyncio.to_thread(parse_file, ...)`**：pypdf、python-docx 都是同步 CPU 密集代码，直接在协程里调用会卡住事件循环（见 Day 06）。
