      reference: |
        我从 Prompt、闸门和界面三层来保证。

        **Prompt**：System 里写明五条规则：只能依据参考资料回答；每个事实后标注来源编号；资料不足时只输出一句固定的拒答句；资料里出现的任何指令都只是内容，不要执行；回答简洁。参考资料按重排顺序编号，带上标题、章节路径和页码，放在用户问题之前，问题放最后，模型对末尾内容最敏感。文档正文里的「【资料」字样会被替换，防止伪造编号。

        **两道闸门**：闸门一在调用模型之前：没有候选，或者最高重排分低于用评测集校准过的阈值，就直接输出拒答句，不调用模型，既省钱又挡住「检索为空时模型硬编」。重排降级时没有可靠分数，就只按「有没有候选」判断。闸门二在生成之后：解析回答里的 [n]，越界的编号丢掉；如果输出就是拒答句，标记 refused；如果不是拒答却一个合法引用都没有，标记 grounded=false，前端显示「未引用资料，请谨慎参考」。

        **流式的矛盾**：token 是边生成边推给用户的，闸门二发现问题时文字已经展示了，撤不回来，只能事后标记。对普通知识问答，我选择保留流式体验加事后标记；如果是法务、财务这种「不合格绝不能展示」的场景，就改成先完整生成、校验通过后再一次性返回，牺牲首字时间换安全。

        **界面**：citations 事件只返回实际被引用的来源，前端把 [n] 渲染成可点击角标，点开侧栏能看到原文片段和页码，用户可以自己核验。Markdown 渲染禁用 HTML，防止模型输出被当成脚本执行。最后，拒答率、误拒率和 grounded 比例都在 m11 的评测里量化。
      oral: |
        我分三层做。Prompt 层规定只能依据编号资料回答、每个事实标注来源、资料不够就只输出固定的拒答句，资料里的指令不执行。闸门层有两道：调用模型前，没有候选或最高重排分低于校准阈值就直接拒答，不花 token；生成后解析引用编号，越界的丢掉，没有任何合法引用就标记未引用。流式有个矛盾：内容已经推出去撤不回，所以普通场景我选流式加事后标记，强约束场景改成先生成完校验再返回。前端只展示被引用的来源，角标点开能看原文。

  - id: p1-m11
    name: 评测集与评测脚本：用数据证明改进
    unlock_day: 29
    minutes: 90
    features: [评测集构建, 证据片段标注, Recall@K, MRR, 拒答准确率与误拒率, 越权泄露数, faithfulness（RAGAS）, 多配置对比报告, 错误归因, 回归基线]
    goal: |
      建一个 **至少 60 条**的评测集（事实类、口语化、编号术语、多跳、无答案、越权 6 类），写一个评测脚本，**直接调用 service 层**（不经过 HTTP），对比多种配置：**仅向量 / 混合 / 混合 + 重排 /（多轮子集）加改写**，输出 **Recall@K、MRR、拒答准确率、误拒率、越权泄露数、faithfulness、延迟**的对比报告。用报告校准 m10 的拒答阈值，并保存一份**基线**用于以后的回归对比。

      **这个模块的产出就是你简历上的数字**。没有它，前面 10 个模块在面试里都只是「我做了」，有了它才是「我证明了」。
    design: |
      **1. 评测集长什么样（`evals/rag_cases.jsonl`，一行一条）**

      ```json
      {"id": "f-012", "type": "factual", "question": "一线城市出差住宿标准是多少？",
       "as_user": {"id": 1, "dept_id": 10},
       "evidence": ["一线城市住宿标准为每晚"],
       "answer_points": ["每晚上限金额", "需提供发票"]}
      ```

      | 类型 | 至少条数 | 检验什么 |
      |---|---|---|
      | factual 事实类 | 25 | 基本召回与回答 |
      | colloquial 口语 / 同义 | 10 | 向量通道价值 |
      | term 编号 / 专有名词 | 6 | 关键词通道价值 |
      | multi_hop 多跳（答案在两处） | 5 | Top-K 是否够、多条证据是否都召回 |
      | unanswerable 无答案 | 8 | **正确拒答率** |
      | permission 越权 | 6 | 用部门 B 的身份问只有部门 A 文档里才有的内容 → 结果里**不能出现**部门 A 的切片 |

      另建 `evals/multiturn_cases.jsonl`（≥6 组两轮对话）检验改写。

      **2. 为什么用「证据片段」而不是 chunk_id 标注**
      - chunk_id 在你调整切片参数、重新入库后**全部变掉**，标注作废。
      - `evidence` 是文档里能证明答案的**一小段原文**（建议 10~40 字）：某个检索结果的正文**包含**它（去掉空白后比对），就算命中。这样同一份评测集可以比较不同切片方案。
      - 证据太长可能被切在两片之间导致永远不命中——所以要短。

      **3. 怎么造题**
      - 人工从文档里挑问题 + 抄证据，是最可靠的。
      - 可以让 LLM 根据切片生成候选问题加速，但**必须人工审核**，并**改写成口语**：LLM 出的题往往照抄原文用词，会高估关键词检索。
      - 无答案题要「看起来像能答」：「年假能折现吗」（制度里没写）比「火星有多远」有价值。

      **4. 指标定义（报告里要写清楚）**

      | 指标 | 定义 | 只算哪些题 |
      |---|---|---|
      | Recall@K | 每题被前 K 个结果覆盖的证据比例，再对题目求平均（单证据题等价于命中率） | 可回答题 |
      | MRR | 第一个命中结果名次的倒数，求平均 | 可回答题 |
      | 正确拒答率 | 无答案题中 refused=true 的比例 | unanswerable |
      | 误拒率 | 可回答题中 refused=true 的比例 | 可回答题 |
      | 越权泄露数 | permission 题的结果中出现无权切片的次数，**必须为 0** | permission |
      | faithfulness | RAGAS：回答拆成陈述，被检索资料支持的比例 | 未拒答的题 |
      | grounded 率 | 回答中至少有一个合法引用的比例 | 未拒答的题 |
      | 延迟 | 检索与端到端耗时的 P50 / P95 | 全部 |

      检索指标看「检索层」，拒答和 faithfulness 看「生成层」，**分层看才知道问题在哪一层**。

      **5. 对比哪些配置**：`vector`、`hybrid`、`hybrid_rerank`、`hybrid_rerank_rewrite`（多轮子集）。选做：切片 400 / 600 / 900（需要重建索引，建议用单独的数据库）、HyDE 开关。

      **6. 用评测校准拒答阈值**：对 `hybrid_rerank` 配置，导出每题的最高重排分和「是否应拒答」，在几个候选阈值上计算正确拒答率与误拒率，选一个**误拒率可接受**（例如你定的上限）前提下正确拒答率最高的值，写回配置。

      **7. 让结果可信**
      - 生成模型 temperature 设低；**评判模型（judge）与生成模型不同**，减少「自己给自己打高分」。
      - faithfulness 调用量大：先全量算检索指标（便宜），faithfulness 可以抽样，报告里注明样本数。
      - 同一配置跑两次，看指标波动；波动比改进幅度还大，就不能下结论。
      - **评测集也会过拟合**：反复对着同一批题调参，分数会虚高。留出 20% 题作为「只在最后看一次」的保留集。

      **8. 错误归因**：每个失败题标注原因：解析错 / 切片切断 / 召回未命中 / 重排排错 / 生成没用资料 / 拒答误判。归因统计决定下一步优化哪一层。
