        - {text: "说明参数 600 和 80 只是起点，要用评测集对比确定", dim: project}
      reference: |
        **切片策略**：切片的目标是每片语义完整、长度适中。太长一片里混好几个主题，向量被平均，检索不准，还浪费模型上下文；太短会丢失上下文，「上述规定」这种指代就看不懂。所以我分三层：先按标题分节，遇到标题就结束当前片，保证不跨章节；节内累积段落到 600 字就切；单个段落超长时在句末标点处切，相邻片重叠 80 字，防止答案正好被切在边界上。切分循环要保证每轮至少前进一个字，否则会死循环。表格单独处理，长表按行切并在每片重复表头。600 和 80 只是起点，我在评测里对比了不同长度再定。

        **章节路径前缀**：「满一年可休 5 天」单独看不知道在说什么，所以每片带上「员工手册 > 第三章 假期 > 年假」这样的路径。它参与 Embedding 和分词，提升检索命中；但 content 只存正文，展示给用户的引用是干净的。这是 Anthropic Contextual Retrieval 的轻量版，零模型成本。

        **入库与更新**：分词用 jieba 的搜索模式，写入 content_tokens，数据库生成列自动算 tsvector。Embedding 分批调用、按 index 排序、校验维度。关键在事务边界：**慢的 Embedding 调用在事务外做完**，然后在一个短事务里删除旧切片、插入新切片、版本加一、状态置 ready，一次提交。PostgreSQL 的 MVCC 让其他查询在提交前看到完整的旧版，提交后看到完整的新版，不会一半新一半旧，也不会有空窗期。失败就回滚，旧切片原样可用。如果把 Embedding 放进事务，事务会持续几十秒，长期占用连接和锁。每次入库或删除后 Redis 的 kb:version 加一，让答案缓存自然失效。
      oral: |
        切片我分三层：先按标题分节保证不跨章节，节内按 600 字累积，超长段落在句末切并重叠 80 字，防止答案落在边界，参数后来用评测集调过。每片带上「文档标题加章节路径」的前缀参与向量化和分词，解决切片单独看语义不完整的问题，但正文里不存前缀。入库时慢的 Embedding 在事务外做，然后在一个短事务里删旧、插新、改状态一次提交，靠 MVCC 保证检索只会看到完整的旧版或新版，失败就回滚，更新期间旧内容一直可查。

  - id: p1-m8
    name: 混合检索：向量通道 + 关键词通道 + RRF 融合（全程权限过滤）
    unlock_day: 25
    minutes: 90
    features: [向量检索, HNSW 与 iterative scan, 中文关键词检索, RRF 融合, 检索阶段权限过滤, 检索调试接口, 可选真 BM25（ParadeDB）]
    goal: |
      实现检索核心：**向量通道**（pgvector HNSW，余弦距离）和**关键词通道**（jieba + PG 全文索引）各召回 Top-30，用 **RRF（倒数排名融合）** 合并成一个排序列表。**两个通道的 SQL 都内置权限条件**，先过滤再排序。提供 `/api/search/debug` 接口，展示每个候选在两个通道里的名次——这是你面试时讲「为什么混合检索有用」的证据来源。

      然后把检索接到问答链路：kb_qa 意图 → 检索 Top-6 → 拼进 Prompt 生成（引用和拒答在 m10 完善）。
    design: |
      **1. 为什么要两个通道**（见 Day 25）

      | 问题类型 | 向量通道 | 关键词通道 |
      |---|---|---|
      | 「请假要提前几天说」（口语、同义） | 强：语义相近就能找到「休假申请需提前三个工作日」 | 弱：词对不上 |
      | 「ERP-2031 报错怎么办」（编号、专有名词） | 弱：向量对编号不敏感 | 强：精确匹配 |
      | 「差旅制度第 5 条」 | 一般 | 强 |

      两路互补，单路的盲区由另一路补上。

      **2. 向量通道要点**
      - 用 `<=>`（余弦距离）排序才能走 `vector_cosine_ops` 索引。
      - **过滤的坑**：HNSW 是「先在索引里找 ef_search 个近邻，再套用 WHERE」。默认 `ef_search=40`，如果用户只能看 10% 的文档，平均只剩 4 条。
      - **解决**：pgvector 0.8 起 `SET LOCAL hnsw.iterative_scan = relaxed_order`，结果不够时自动继续扫描（上限 `hnsw.max_scan_tuples`）；relaxed 模式结果可能略乱序，用 `MATERIALIZED` CTE 包一层再按距离排序。同时 `SET LOCAL hnsw.ef_search = 100` 提高候选数。
      - `SET LOCAL` 只在当前事务内生效，不污染连接池里的其他连接。

      **3. 关键词通道要点**
      - 查询也用 jieba 切词，过滤停用词，用 `|`（OR）连接成 `to_tsquery('simple', ...)`：中文问题词很多，用 AND 几乎匹配不到任何切片。
      - 排序用 `ts_rank_cd`（考虑词频和词之间的距离）。**它没有 IDF，不是标准 BM25**：「公司」这种到处都有的词和「年假」权重一样。缓解：停用词表里加入高频无区分度的词；或者用进阶方案。
      - **进阶（选做）：ParadeDB `pg_search` 真 BM25**。镜像 `paradedb/paradedb` 自带 pg_search 和 pgvector；索引 `CREATE INDEX ... USING paradedb (id, (content::pdb.jieba))`，查询 `WHERE content ||| :q ORDER BY pdb.score(id) DESC`。语法在 0.25 版本改过（`USING bm25` 是旧名，仍兼容），**以官方文档为准**；注意许可证是否符合你的使用场景。

      **4. 为什么用 RRF 融合**
      - 两路分数**量纲完全不同**：余弦距离 0~2 越小越好，ts_rank_cd 是 0 到几、越大越好。直接加权相加要先归一化，权重还要调。
      - RRF 只看**名次**：`score(d) = Σ 1 / (k + rank_i(d))`，`k` 通常取 60。两路都靠前的文档得分最高；只在一路出现的也有机会。
      - `k` 越大，名次差异的影响越平缓。60 是原始论文和多数实现的默认值。

      **5. Top-K 怎么定**：每路 30 → 融合后 30 → m9 重排后取 6 送给模型。在 m9 之前先直接取融合后的前 6。数字都是起点，m11 用 Recall@K 曲线确定。

      **6. 权限条件（两个通道一模一样）**：`visibility = 'public' OR (visibility = 'dept' AND dept_id = 用户部门) OR (visibility = 'restricted' AND 用户id = ANY(allowed_user_ids))`。按 id 回表取正文时**再带一次**，纵深防御。

      **7. 并发的坑**：同一个 `AsyncSession` 不能同时执行两条 SQL。可以并发的是「Embedding 接口调用」和「关键词 SQL」（只有一个用到 session）。
    data_flow: |
      ```mermaid
      flowchart TD
        Q["改写后的问题"] --> E["Embedding 问题向量"]
        Q --> TK["jieba 切词 去停用词 OR 连接"]
        U["当前用户 部门 id"] --> ACL["权限条件"]
        E --> V["向量通道 iterative scan Top-30"]
        TK --> K["关键词通道 ts_rank_cd Top-30"]
        ACL --> V
        ACL --> K
        V --> F["RRF 融合 k 等于 60"]
        K --> F
        F --> H["回表取正文 再次带权限条件"]
        H --> O["候选列表 带两路名次 供重排或生成"]
      ```

      调试接口返回示例：`[{chunk_id: 381, rrf: 0.0325, vec_rank: 2, kw_rank: 1, title: "差旅管理办法", page: 4, snippet: "..."}, {chunk_id: 77, rrf: 0.0161, vec_rank: 1, kw_rank: null, ...}]`。`kw_rank: null` 表示只被向量通道召回。
    key_code: |
      ```python
      # app/services/retrieval.py
      import asyncio
      from collections import defaultdict
      from dataclasses import dataclass

      from sqlalchemy import text
      from sqlalchemy.ext.asyncio import AsyncSession

      from app.api.deps import UserCtx
      from app.core.config import settings
      from app.services.indexing import Embedder, tokenize

      def acl(t: str = "") -> str:
          """唯一的权限条件。t 为表别名，回表 JOIN 时传 'c'。"""
          p = f"{t}." if t else ""
          return f"""({p}visibility = 'public'
              OR ({p}visibility = 'dept' AND {p}dept_id = :dept_id)
              OR ({p}visibility = 'restricted' AND :user_id = ANY({p}allowed_user_ids)))"""


      STOPWORDS = {"的", "了", "吗", "呢", "请问", "怎么", "如何", "什么", "是", "公司"}


      def to_pgvector(v: list[float]) -> str:
          return "[" + ",".join(f"{x:.6f}" for x in v) + "]"


      async def vector_search(s: AsyncSession, qvec: list[float], user: UserCtx, k: int) -> list[int]:
          await s.execute(text(f"SET LOCAL hnsw.ef_search = {int(settings.hnsw_ef_search)}"))
          await s.execute(text("SET LOCAL hnsw.iterative_scan = relaxed_order"))
          rows = await s.execute(text(f"""
              WITH cand AS MATERIALIZED (
                  SELECT id, embedding <=> CAST(:qvec AS vector) AS dist
                  FROM chunks
                  WHERE {acl()}
                  ORDER BY dist
                  LIMIT :k
              )
              SELECT id FROM cand ORDER BY dist + 0
          """), {"qvec": to_pgvector(qvec), "dept_id": user.dept_id, "user_id": user.id, "k": k})
          return [r.id for r in rows]


      async def keyword_search(s: AsyncSession, query: str, user: UserCtx, k: int) -> list[int]:
          terms = [t for t in dict.fromkeys(tokenize(query)) if t not in STOPWORDS]
          if not terms:
              return []
          rows = await s.execute(text(f"""
              SELECT id, ts_rank_cd(tsv, q) AS score
              FROM chunks, to_tsquery('simple', :tsq) AS q
              WHERE tsv @@ q AND {acl()}
              ORDER BY score DESC, id
              LIMIT :k
          """), {"tsq": " | ".join(terms), "dept_id": user.dept_id, "user_id": user.id, "k": k})
          return [r.id for r in rows]


      def rrf_fuse(rankings: list[list[int]], k: int = 60, top_n: int = 30) -> list[tuple[int, float]]:
          scores: dict[int, float] = defaultdict(float)
          for ranking in rankings:
              for rank, cid in enumerate(ranking, start=1):
                  scores[cid] += 1.0 / (k + rank)
          return sorted(scores.items(), key=lambda x: (-x[1], x[0]))[:top_n]


      @dataclass
      class Candidate:
          chunk_id: int
          rrf: float
          vec_rank: int | None
          kw_rank: int | None
          document_id: int = 0
          title: str = ""
          page: int | None = None
          heading_path: str = ""
          content: str = ""


      async def hybrid_search(s: AsyncSession, embedder: Embedder, query: str, user: UserCtx) -> list[Candidate]:
          k_each = settings.retrieve_k_each
          qvecs, kw = await asyncio.gather(embedder.embed([query]), keyword_search(s, query, user, k_each))
          vec = await vector_search(s, qvecs[0], user, k_each)       # 同一 session 不能并发，放在后面
          fused = rrf_fuse([vec, kw], k=settings.rrf_k, top_n=settings.fuse_top_n)
          vr = {cid: i for i, cid in enumerate(vec, start=1)}
          kr = {cid: i for i, cid in enumerate(kw, start=1)}
          ids = [cid for cid, _ in fused]
          rows = await s.execute(text(f"""
              SELECT c.id, c.document_id, c.page, c.heading_path, c.content, d.title
              FROM chunks c JOIN documents d ON d.id = c.document_id
              WHERE c.id = ANY(:ids) AND {acl('c')}
          """), {"ids": ids, "dept_id": user.dept_id, "user_id": user.id})
          by_id = {r.id: r for r in rows}
          return [Candidate(cid, score, vr.get(cid), kr.get(cid), by_id[cid].document_id, by_id[cid].title,
                            by_id[cid].page, by_id[cid].heading_path, by_id[cid].content)
                  for cid, score in fused if cid in by_id]
      ```

      **逐段读懂**

      - **`acl()` 只有一份**，两个通道和回表都调用它，杜绝「一个通道忘了加权限」；参数 `t` 只用于加表别名（回表时 JOIN 了 documents，列名要写成 `c.dept_id`）。用户 id、部门 id 通过**绑定参数**传入，不拼接进 SQL。
      - **`CAST(:qvec AS vector)`**：不能写成 `:qvec::vector`——SQLAlchemy 的 `text()` 用冒号识别参数，`::` 会被误解析。
      - **`SET LOCAL` 用 f-string 拼数字**：`SET` 语句不支持绑定参数，所以先 `int()` 强转，保证只能是数字，避免注入。
      - **`MATERIALIZED` CTE + `ORDER BY dist + 0`**：relaxed_order 下索引返回的结果可能略乱序，外层再按距离排一次；`+ 0` 是 pgvector 文档针对 PG17+ 给出的写法，防止优化器把外层排序优化掉。
      - **`dict.fromkeys(...)`**：去重且保持顺序；停用词去掉「怎么」「如何」这类问句词，否则会匹配到大量无关切片。
      - **`" | ".join(terms)`**：OR 语义。terms 只含字母数字汉字（`tokenize` 已过滤），不会出现 tsquery 的特殊符号导致语法错误。
      - **`rrf_fuse` 是纯函数**：不碰数据库，最好写单测。排序键 `(-score, id)` 保证同分时结果稳定，评测才可复现。
      - **`asyncio.gather(embed, keyword_search)`**：Embedding 是外部 HTTP 调用，和关键词 SQL 并行能省几十到几百毫秒；向量 SQL 必须等向量出来，而且和关键词 SQL 共用一个 session，不能并发。
      - **回表再带一次权限条件**：即使前面某处出错，这里也能拦住。`if cid in by_id` 处理「融合后到回表之间文档被删除」的情况。
    ai_prompt: |
      实现混合检索服务和调试接口，并接入问答链路。

      ## 技术约束
      - 只用 SQLAlchemy `text()` 写检索 SQL（向量与全文检索用原生 SQL 最清晰），所有用户相关值用绑定参数；向量参数用 `CAST(:qvec AS vector)`，禁止 `:qvec::vector` 写法。
      - 权限条件只定义一次（函数 `acl(alias="")` 返回 SQL 片段，alias 仅用于加表别名前缀），向量通道、关键词通道、按 id 回表三处都必须使用。
      - 向量通道：执行前 `SET LOCAL hnsw.ef_search = {配置值，int 强转}` 与 `SET LOCAL hnsw.iterative_scan = relaxed_order`；使用 MATERIALIZED CTE 并在外层 `ORDER BY dist + 0`。
      - 关键词通道：查询用 m7 的 `tokenize`，去重、去停用词（配置文件 `data/stopwords.txt`，至少含常见问句词），用 ` | ` 连接后 `to_tsquery('simple', :tsq)`，按 `ts_rank_cd` 降序、id 升序；无有效词时返回空列表。
      - 同一个 AsyncSession 不并发执行 SQL；只允许 Embedding 调用与关键词 SQL 用 asyncio.gather 并行。
      - 配置项：`retrieve_k_each`=30、`rrf_k`=60、`fuse_top_n`=30、`hnsw_ef_search`=100、`context_top_k`=6。

      ## 文件
      - `app/services/retrieval.py`：`vector_search`、`keyword_search`、`rrf_fuse(rankings, k, top_n)`（纯函数，同分按 id 升序）、`Candidate` 数据类（chunk_id、rrf、vec_rank、kw_rank、document_id、title、page、heading_path、content）、`hybrid_search(session, embedder, query, user)`。另提供 `vector_only`、`keyword_only` 两个函数（m11 评测对比要用）。
      - `GET /api/search/debug?q=...&mode=hybrid|vector|keyword`：返回候选列表（含两路名次、rrf 分数、标题、页码、正文前 120 字）。仅 dev 环境或 admin 可用。
      - 问答链路：kb_qa 意图时调用 hybrid_search，取前 `context_top_k` 条，按「[1] 标题 第 N 页 正文」格式拼进 Prompt 让模型回答（引用与拒答 m10 完善）；`meta` 事件附带候选数量；把候选的 chunk_id 与两路名次写入 `messages.trace`。

      ## 必须写的测试
      1. `rrf_fuse`：`[[1,2,3],[3,4]]` 时 3 排第一；两路都为空返回空；同分时按 id 升序；top_n 生效。
      2. 准备测试数据（FakeEmbedder 生成可控向量）：部门 10 的 dept 文档、部门 20 的 dept 文档、public 文档、指定给用户 5 的 restricted 文档。断言部门 10 的用户在三种 mode 下**都**检索不到部门 20 的切片，用户 5 能检索到 restricted，其他人不能。
      3. 关键词通道：查询「ERP-2031 报错」能命中正文含 ERP-2031 的切片（提示：编号被拆成 erp、2031 两个词也应能命中）；查询只有停用词时返回空列表且不报错。
      4. 插入 200 条其他部门切片 + 5 条本部门切片，向量检索 k=5 仍返回 5 条本部门结果（验证 iterative scan 生效；可对比关闭时的结果数并打印）。

      ## 验收标准
      - 用你已入库的真实文档，准备 5 个问题（2 个口语化、2 个含编号或专有名词、1 个条款号），在调试接口里分别看 vector、keyword、hybrid 三种模式的前 5 名，把观察记录到 `docs/retrieval_check.md`：哪些问题是单一通道救回来的。
      - 前端提问知识库问题，回答内容明显来自文档。
    tests:
      functional:
        - "调试接口用口语化问题（如「请假要提前多久说」）查询：vector 模式能找到正确制度条款，keyword 模式可能找不到"
