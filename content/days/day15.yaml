day: 15
phase: 2
title: Prompt 工程
goals:
  - 能按「身份、规则、示例、上下文」结构写出边界清晰、可测试的 System / Developer Prompt
  - 能判断什么时候用 few-shot、怎么挑示例，并避免示例与规则冲突、示例偏置等问题
  - 能说清思维链（CoT）对普通模型的作用，以及为什么推理模型要「给目标和验收标准，而不是逐步指挥」
  - 能把 Prompt 当代码管理：模板化、版本号、评测、灰度发布、锁定模型快照，并能定位「改了 Prompt 效果变差」
