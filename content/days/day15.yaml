knowledge_points:
  - id: d15-k1
    name: System Prompt 设计
    level: P0
    summary: System / Developer Prompt 是写给模型的产品规格：身份、规则、示例、上下文分区清晰，规则具体、可检验，并说明边界和兜底
    analogy: |
      OpenAI 文档自己的比喻：**developer 消息像函数定义，user 消息像函数参数**。
      换成前端视角，System Prompt 就像一个**组件的 props 契约 + 设计规范**：说清这个组件是干什么的、接受什么输入、在各种状态下长什么样、遇到异常显示什么。

      **不一样的地方**：组件契约由编译器强制执行；Prompt 只是「强烈建议」，模型可能不遵守。所以**确定性的规则（格式、权限、字数）要由代码兜底**，不能只靠 Prompt。
    why: |
      同一个模型，Prompt 写得好坏，效果可以差很多。System Prompt 是 AI 功能的「产品需求文档」，几乎每个 AI 项目都要写、要反复调。
      面试官常让你现场写或评审一段 System Prompt，看你是否懂结构、边界和可测试性，而不是只会写「你是一个专业的助手」。
    problem: |
      模型默认是「通用助手」，不知道你的业务、用户、边界和输出格式。
      模糊的 Prompt 会导致：回答风格飘忽、超出业务范围乱答、格式不稳定导致前端解析失败、遇到不知道的问题时编造（Day 11）。
    principle: |
      **一、推荐结构（OpenAI 建议的常见顺序，具体可按模型调整）**

      ```mermaid
      flowchart TD
        A["Identity 身份 目标 语气"] --> B["Instructions 规则 必须做与禁止做"]
        B --> C["Examples 示例 输入与期望输出"]
        C --> D["Context 上下文 检索资料 用户信息"]
        D --> E["user 消息 本轮问题"]
        S["稳定部分 便于缓存"] -.-> A
        S -.-> B
        S -.-> C
        V["每次变化的部分"] -.-> D
        V -.-> E
      ```

      - **稳定的放前面、变化的放后面**：既符合 OpenAI 建议（上下文通常放在靠后位置），也能命中 Prompt 缓存（Day 12）。
      - 用 **Markdown 标题**分区，用 **XML 标签**包裹资料和示例，让模型分清「规则」和「数据」。

      **二、写规则的要点**

      | 原则 | 差的写法 | 好的写法 |
      |---|---|---|
      | 具体 | 回答要简洁 | 不超过 3 句话；需要列表时最多 5 条 |
      | 说明原因 | 不要用省略号 | 回答会被语音播报，语音引擎读不出省略号，所以不要使用 |
      | 写清边界 | 只回答相关问题 | 只回答园区运营问题；其他问题回复固定话术并给出人工入口 |
      | 写清兜底 | 不知道就别乱说 | 资料中没有答案时回答「资料中未找到」，不要推测数字 |
      | 说要做什么 | 不要用 Markdown | 用纯文本段落输出 |

      Anthropic 的建议里也强调：**说明规则背后的原因**，模型能更好地泛化；告诉模型「要做什么」通常比「不要做什么」更有效。

      **三、一个示例骨架**

      ```text
      # 身份
      你是「园区运营助手」，服务对象是园区运营人员，语气专业、简洁。

      # 规则
      1. 只回答园区设备、告警、工单、能耗相关问题；其他问题回复：「这个问题我暂时帮不上，可以联系值班人员。」
      2. 涉及数字时，只使用 <context> 中的数据；没有数据时说明「未查到」，不要估算。
      3. 回答不超过 5 句话；需要步骤时用编号列表。

      # 示例
      <example> ... </example>

      # 上下文
      <context> {检索到的资料，带来源编号} </context>
      ```

      **四、别忘了的事**

      - **Prompt 不是安全边界**：权限、过滤、格式校验要在代码里做；用户输入只放在 user 中，不要拼进 developer（Prompt 注入见 Day 45）。
      - **一次只改一处，然后跑评测**：改了好几处再测，就不知道是哪处起的作用（d15-k4）。
    scenarios: |
      - **知识库问答**：规定只依据资料回答、必须带引用编号、资料不足时拒答（Day 27）。
      - **业务助手**：限定业务范围，超范围给出固定话术和人工入口。
      - **数据抽取**：规定字段、格式和缺失值写法，并配合结构化输出（Day 16）由代码校验。
    pitfalls: |
      - **误区：「你是一个专业的 XX 专家」就够了。** 身份只是开头，关键是具体规则、边界和兜底。
      - **误区：规则越多越好。** 规则互相冲突或过于琐碎，模型反而难以取舍；保持精简，按优先级排列。
      - **误区：Prompt 能保证格式和权限。** 只能提高概率，确定性约束必须由代码校验。
      - **误区：把动态内容（时间、用户名）放在开头。** 会破坏缓存，还会把关键规则挤到后面。
      - **误区：凭感觉改 Prompt。** 不跑评测，改好一个用例可能悄悄弄坏十个。
    interview_asks:
      - question: "怎么写一个好的 System Prompt？请说说你的结构和原则。"
        answer: "按身份、任务、规则、输出格式、边界来写。规则要能检查，比如「没有依据就说不知道」，不要写「尽量准确」。稳定内容放前面。用户输入和资料放在单独的块里，不要和规则拼成一段。"
      - question: "用户说「忽略以上规则」，模型照做了，System Prompt 层面和工程层面分别怎么防？"
        answer: "提示里写明用户内容只是数据，不能改规则，但这挡不住所有情况。工程上格式、权限、能不能调用工具都由代码决定。用户原文不进系统提示，危险操作必须二次校验。"
    project_example: |
      **p1 企业知识库问答** 的 developer Prompt 按「身份、规则、示例、上下文」组织：
      - 规则写清「只依据 `<context>` 回答」「每个结论后标注来源编号」「资料不足时回答未找到并建议联系对应部门」；
      - 检索片段放在 `<context>` 标签里、靠后放置，用户问题在 user 消息中；
      - 输出由代码校验：没有引用编号或引用了不存在的编号，就判为不合格并重试或拒答。
      每次修改 Prompt 都跑一遍评测集，结果用你自己的评测数据填写。
    freshness: |
      核对于 2026-11：OpenAI Prompt engineering 指南说明 developer 消息优先级高于 user 消息，并以「developer 消息像函数定义、user 消息像参数」作比喻；建议 developer 消息通常按 Identity、Instructions、Examples、Context 的顺序组织，上下文通常放在靠后位置，并结合 Markdown 与 XML 标签划分边界。Anthropic Prompting best practices 建议说明指令背后的原因、使用 XML 标签组织内容。
    sources:
      - {title: "OpenAI Docs - Prompt engineering", url: "https://developers.openai.com/api/docs/guides/prompt-engineering"}
      - {title: "Anthropic Docs - Prompting best practices", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}
  - id: d15-k2
    name: Few-shot 示例
    level: P1
    summary: 在 Prompt 里放几组「输入到期望输出」的示例，让模型照着模式做；示例要多样、与规则一致，并且数量适中
    analogy: |
      像组件库的 **Storybook**：与其写一大段文档描述按钮在各种状态下的样子，不如直接放几个典型 story，别人一看就懂。
      Few-shot 也一样：**用几个典型示例代替冗长的描述**，模型会模仿示例的格式、语气和判断标准。

      **不一样的地方**：Storybook 只是参考；模型会**过度模仿**示例——示例都很短，回答就都很短；示例里 3 个都是「紧急」，它就倾向于判「紧急」。
    why: |
      很多格式、风格、分类标准很难用文字说清，几个示例往往比十条规则更有效。
      但示例选得不好会带来偏置和冲突。面试中常问「zero-shot 和 few-shot 的区别、示例怎么选」。
    problem: |
      解决「**说不清楚，但能举例**」的需求：比如告警等级的判断尺度、客服回复的语气、抽取字段的边界情况。
      不用微调模型，只在 Prompt 里放示例，就能让模型学到你想要的模式（也叫上下文学习，in-context learning）。
    principle: |
      **一、zero-shot 与 few-shot**

      - **zero-shot**：只给指令，不给示例。简单任务、推理模型优先尝试。
      - **few-shot**：给几组示例。格式要求复杂、判断尺度难描述时使用。

      ```mermaid
      flowchart LR
        A["先写清指令 zero-shot"] --> B{"评测是否达标"}
        B -->|达标| C["保持简单"]
        B -->|格式或尺度不稳| D["加入 3 到 5 个示例"]
        D --> E{"评测是否达标"}
        E -->|达标| C
        E -->|仍不稳| F["换示例 调整规则 或用结构化输出"]
      ```

      **二、怎么挑示例**

      | 要点 | 说明 |
      |---|---|
      | 数量 | Anthropic 建议 3~5 个；太多浪费 Token，还可能让模型死记 |
      | 多样 | 覆盖不同类型、边界情况，别全是同一种 |
      | 均衡 | 分类任务中各类别都有，避免模型偏向某一类 |
      | 与规则一致 | 示例和文字规则矛盾时，模型常常跟着示例走；OpenAI 也提醒推理模型的示例要和指令高度一致 |
      | 用标签包裹 | 用 `<example>` 等标签和正文区分开，防止模型把示例内容当成本次输入 |
      | 真实 | 优先从真实数据里挑，脱敏后使用 |

      **三、一个告警分级示例**

      ```text
      <examples>
      <example>告警：3 号楼配电房温度 85°C，持续 10 分钟 → 等级：紧急；原因：配电设备高温有起火风险</example>
      <example>告警：5 号楼电梯门禁卡读卡失败 1 次 → 等级：低；原因：单次读卡失败，常见误报</example>
      <example>告警：地下车库 CO 浓度超标，风机未启动 → 等级：高；原因：人员安全风险，联动设备未响应</example>
      </examples>
      ```

      三个示例覆盖了不同等级，并且每个都带「原因」，模型会学到判断尺度，而不只是格式。

      **四、成本与缓存**

      示例每次都要发送，计入输入 Token。好在示例通常稳定不变，**放在前缀里可以命中 Prompt 缓存**（Day 12）。示例很多、很长时，可以考虑按问题动态检索最相似的几个示例。
    scenarios: |
      - **告警分级、工单分类**：用示例统一判断尺度。
      - **回复风格**：客服、营销文案用几个范例统一语气。
      - **抽取边界**：示例演示「字段缺失时写 null」「日期统一格式」等边界情况。
    pitfalls: |
      - **误区：示例越多越好。** 多了浪费 Token，还会让模型过度模仿表面特征。
      - **误区：随便挑几个就行。** 示例都是同一类，模型会偏向这一类；示例都很短，回答也会变短。
      - **误区：示例与规则冲突也没关系。** 冲突时模型常跟随示例，导致规则失效。
      - **误区：推理模型一定要 few-shot。** 推理模型往往 zero-shot 就够了，应先试零样本。
    interview_asks:
      - question: "zero-shot 和 few-shot 有什么区别？什么时候用 few-shot？"
        answer: "zero-shot 只给任务说明。few-shot 再给几个输入输出例子。格式容易飘、分类边界不清时，加两三个例子。例子要覆盖正常和边界，不要只给好说的。"
      - question: "选 few-shot 示例要注意什么？示例会带来哪些副作用？"
        answer: "例子要真实、简短、和线上分布接近，标签要正确。副作用是占 Token、模型会照例子的格式和偏见学，例子里的错误会被放大。例子也要进版本管理。"
    project_example: |
      **p2 智慧园区运营 Agent** 的告警分级：起初只用文字描述等级规则，结果「门禁读卡失败」也常被判为高等级。
      改进做法：
      - 从历史告警中挑 4 个覆盖紧急、高、中、低的真实样例，每个带判断原因，用 `<example>` 包裹；
      - 放在 developer 消息的稳定部分，命中缓存；
      - 用标注好的 100 条告警做评测，比较加示例前后的准确率和各等级的混淆情况。
      具体提升幅度用你自己的评测结果填写。
    freshness: |
      核对于 2026-11：Anthropic Prompting best practices 建议使用 3~5 个多样、相关的示例并用标签包裹，示例同样适用于开启思考的模型；OpenAI Reasoning best practices 建议推理模型先试零样本，需要时再加少量示例，并确保示例与指令高度一致。
    sources:
      - {title: "Anthropic Docs - Prompting best practices", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}
      - {title: "OpenAI Docs - Reasoning best practices", url: "https://developers.openai.com/api/docs/guides/reasoning-best-practices"}
  - id: d15-k3
    name: 思维链与推理模型的提示差异
    level: P0
    summary: 对普通模型，引导它先写出推理步骤能提升复杂任务效果；推理模型已在内部思考，应给清晰目标、约束和验收标准，而不是逐步指挥
    analogy: |
      OpenAI 文档的比喻：**推理模型像资深同事**，给目标就能自己想办法；**普通 GPT 模型像初级同事**，需要明确、具体的步骤。
      前端团队里也一样：给实习生的任务单要写清每一步；给资深工程师的是需求背景、约束和验收标准，你逐行指挥反而会限制他。

      **不一样的地方**：同事会提问澄清；模型通常不会主动问，**目标和验收标准写不清，它就按自己的理解做**。
    why: |
      「Let's think step by step」曾是最有名的 Prompt 技巧，但在推理模型上可能没用甚至有害。
      现在团队常常同时使用推理模型和普通模型，**同一套 Prompt 直接换模型，效果可能变差**。面试也常问「推理模型的 Prompt 和普通模型有什么不同」。
    problem: |
      普通模型「边写边想」：答案是逐个 Token 生成的（Day 11），如果直接让它给结论，复杂问题容易错。让它先写出中间步骤，相当于给了它「草稿纸」。
      推理模型已经内置了草稿纸（推理 Token），再要求它「一步步想」「展示推理过程」，是重复劳动，还可能干扰它自己的思考方式。
    principle: |
      **一、思维链（Chain of Thought）对普通模型**

      - 做法：在 Prompt 中要求「先分析，再给结论」，或在示例中展示推理过程。
      - 原理：让关键的中间结果先出现在上下文里，后面的 Token 能「看到」它们（Day 12 的注意力）。
      - 工程实践：如果用户不需要看过程，可以让模型把分析写在 `<thinking>` 标签里、结论写在 `<answer>` 里，代码只展示结论。

      **二、推理模型：给目标，而不是给步骤**

      ```mermaid
      flowchart TD
        Q{"用的是什么模型"} -->|普通模型| G1["写清步骤 可要求先分析再回答"]
        Q -->|推理模型| R1["写清目标 约束 验收标准"]
        G1 --> G2["给 few-shot 示例统一格式"]
        R1 --> R2["不加一步步思考之类的提示"]
        R2 --> R3["先 zero-shot 需要时加少量一致的示例"]
        R3 --> R4["用 reasoning effort 调节思考深度"]
      ```

      OpenAI《Reasoning best practices》的建议（核对于 2026-11）：
      - 用 **developer 消息**代替 system 消息；
      - 保持 Prompt **简单直接**；
      - **避免思维链提示**：不需要「think step by step」「explain your reasoning」；
      - 用 Markdown、XML 等**分隔符**划分输入；
      - **先 zero-shot**，需要时再加示例，且示例要与指令高度一致；
      - **明确约束和最终目标**，写清什么算成功；
      - 推理模型默认少用 Markdown 格式，需要时在 developer 消息第一行写 `Formatting re-enabled`。

      Anthropic 也建议：对开启思考的模型，**优先给通用的高层指令，而不是规定死的步骤**。

      **三、对比示例**

      | | 给普通模型 | 给推理模型 |
      |---|---|---|
      | 写法 | 1. 先列出所有告警；2. 按楼栋分组；3. 对每组判断是否有关联；4. 再给出结论 | 目标：找出今天可能有同一根因的告警组。约束：只用提供的数据。验收：每组说明关联依据，没有关联就说明「无」 |
      | 思考 | 要求先分析再回答 | 不需要提示，用 effort 控制深度 |

      **四、厂商差异要留意（核对于 2026-11）**

      - Anthropic：Claude 4.6 及之后，最后一轮 assistant 预填（prefill）不再支持，会返回 400；Claude 4.7 及之后用自适应思考，不再支持手动设置 `budget_tokens`。
      - 不同模型、不同快照对同一个 Prompt 的反应可能不同，**换模型就要重跑评测**（d15-k4）。
    scenarios: |
      - **复杂分析**：普通模型做多条件判断时，让它先在标签里分析，再输出结论。
      - **推理模型 Agent 规划**：只写目标、可用工具、约束和完成标准，不逐步规定动作（Day 31）。
      - **模型迁移**：从普通模型迁到推理模型时，删掉「一步步想」等提示，精简流程式规则，改写成目标和验收标准。
    pitfalls: |
      - **误区：所有模型都加「一步步思考」。** 推理模型不需要，可能更慢、更贵，甚至更差。
      - **误区：要求推理模型「展示完整推理过程」。** 推理 Token 通常不完整返回；需要依据时，让它在答案里给出「判断依据」即可。
      - **误区：步骤写得越细越好。** 对推理模型，过细的步骤会限制它找到更好的方法。
      - **误区：换模型不用改 Prompt。** 不同模型家族对 Prompt 的反应不同，必须重新评测。
    interview_asks:
      - question: "什么是思维链（CoT）？为什么它对普通模型有效？"
        answer: "就是让普通模型先写出中间步骤再给答案。步骤写出来之后，后面的 Token 能参考这些步骤，所以复杂一点的题更稳。代价是更慢、思考过程也可能是编的。"
      - question: "推理模型的 Prompt 和普通模型有什么不同？你会怎么改造旧 Prompt？"
        answer: "推理模型自己会想，不要再写「一步步思考」或规定很多思考步骤。改成说清目标、约束和答案长什么样。旧提示里的思维链要求删掉，用评测对比效果和成本。"
    code: |
      ```python
      # 普通模型：要求先分析再回答，代码只展示 <answer>
      GPT_INSTRUCTIONS = """先在 <thinking> 中逐条分析每个告警的楼栋、时间、设备，
      再在 <answer> 中给出可能同一根因的告警分组。"""

      # 推理模型：写目标、约束、验收标准，不写思考步骤
      REASONING_INSTRUCTIONS = """目标：找出今天可能有同一根因的告警分组。
      约束：只使用 <data> 中的数据，不要推测设备型号。
      验收：每组列出告警编号和关联依据；没有关联时输出「无」。"""
      ```
    project_example: |
      **p3 前端 Coding Agent** 用推理模型规划修改方案：
      - 旧 Prompt 写了 12 步「先读 package.json，再读路由，再……」，换成推理模型后反而经常卡在固定步骤里；
      - 改为：目标（修复某个 issue）、约束（只改 src 目录，不新增依赖）、验收（类型检查和相关测试通过，给出修改说明）；
      - 执行具体编辑时用普通模型，Prompt 写清明确的格式和步骤。
      两种模型各用各的 Prompt 模板，分别维护评测集，效果用你自己的测量结果填写。
    freshness: |
      核对于 2026-11：OpenAI Reasoning best practices 建议推理模型使用 developer 消息、保持提示简单直接、避免思维链提示、使用分隔符、先零样本、明确约束与最终目标，需要 Markdown 时在 developer 消息首行写 Formatting re-enabled；OpenAI Prompt engineering 指南用「资深同事与初级同事」比喻推理模型与 GPT 模型。Anthropic Prompting best practices 建议思考模型优先使用通用指令而非规定步骤，并说明 Claude 4.6 起不支持最后一轮 assistant 预填（返回 400），Claude 4.7 起使用自适应思考、手动 budget_tokens 返回 400。
    sources:
      - {title: "OpenAI Docs - Reasoning best practices", url: "https://developers.openai.com/api/docs/guides/reasoning-best-practices"}
      - {title: "OpenAI Docs - Prompt engineering", url: "https://developers.openai.com/api/docs/guides/prompt-engineering"}
      - {title: "Anthropic Docs - Prompting best practices", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}
  - id: d15-k4
    name: Prompt 模板与版本管理
    level: P1
    summary: 把 Prompt 当代码管理：模板化、类型化的变量，代码评审，评测通过再发布，灰度上线，日志记录 Prompt 版本和模型快照
    analogy: |
      像前端的 **i18n 文案文件 + Git + Feature Flag**：文案集中管理、有变更记录、通过开关逐步放量，出问题能快速回滚。
      Prompt 也应该这样：集中在模块里，用 Git 记录每次修改，评测通过后通过开关灰度发布。

      **不一样的地方**：改一个文案，影响是看得见的；改 Prompt 里的一个词，**影响是概率性的、分散的**，不跑评测根本不知道哪些用例变差了。
    why: |
      Prompt 是 AI 功能的核心逻辑，却经常散落在代码各处、被随手修改。结果是：效果突然变差没人知道原因、无法回滚、无法对比两个版本。
      面试中常问「你们怎么管理 Prompt」，这能看出你是否在生产环境做过 AI 功能。
    problem: |
      解决三个问题：**改了什么**（版本与评审）、**改了之后变好还是变差**（评测）、**出问题怎么办**（灰度与回滚）。
      还有一个隐藏变量：**模型本身也会变**。使用别名（如不带日期的模型名）时，厂商升级模型会让同一个 Prompt 表现不同。
    principle: |
      **一、Prompt 的生命周期**

      ```mermaid
      flowchart LR
        A["修改模板 提交 PR"] --> B["代码评审"]
        B --> C["跑评测集 对比旧版本"]
        C -->|变差| A
        C -->|达标| D["灰度 小比例流量"]
        D --> E["监控 质量 成本 延迟"]
        E -->|异常| F["一键回滚"]
        E -->|正常| G["全量"]
      ```

      **二、模板化：把变化的部分做成参数**

      ```python
      PROMPT_VERSION = "kb-answer@2026-11-10"

      def build_kb_prompt(chunks: list[dict], question: str) -> tuple[str, str]:
          context = "\n".join(
              f'<doc id="{c["id"]}" source="{c["source"]}">{c["text"]}</doc>' for c in chunks
          )
          instructions = KB_RULES                      # 稳定规则，放前面便于缓存
          user_input = f"<context>\n{context}\n</context>\n\n问题：{question}"
          return instructions, user_input
      ```

      - 规则与变量分开；变量用**有类型的函数参数**传入，而不是随手字符串拼接；
      - 用户输入只进 user 部分，不拼进规则；
      - 每次调用在日志里记录 **Prompt 版本、模型名和快照、usage**，出问题能定位到具体版本。

      **三、版本管理的要点**

      | 要点 | 做法 |
      |---|---|
      | 放在代码里 | Prompt 模块就近放在功能旁边，走正常的代码评审和部署流程 |
      | 评测先行 | 准备代表性用例（黄金集，Day 20），修改前后都跑，看整体分数和变差的用例 |
      | 灰度发布 | 用 Feature Flag 或配置按比例放量，监控质量、成本和延迟（Day 44） |
      | 锁定模型快照 | 生产环境固定到带版本的模型快照，升级模型视同一次变更，要先评测 |
      | 一次只改一处 | 否则无法判断是哪处修改起的作用 |

      **四、厂商动态（核对于 2026-11）**

      OpenAI 文档现在推荐「**把 Prompt 写在代码里管理**」：API 中可复用的 Prompt 对象正在弃用，自 2026-06-03 起不再主推创建，`v1/prompts` 计划于 **2026-11-30 关停**。如果项目还在用保存在平台上的 Prompt ID，需要按官方迁移指南迁回代码。
    scenarios: |
      - **多人协作**：Prompt 改动走 PR，评审时附上评测结果对比。
      - **模型升级**：厂商发布新模型时，用评测集对比新旧快照，再决定是否切换。
      - **A/B 测试**：两个 Prompt 版本按比例分流，比较用户满意度和成本。
    pitfalls: |
      - **误区：Prompt 放在数据库里让运营随时改最灵活。** 没有评审和评测，一改就可能出事；可以给运营配置化，但要有审核、评测和回滚。
      - **误区：用模型别名就能自动享受升级。** 别名背后的模型变化可能让效果变差，生产应锁定快照。
      - **误区：改好了眼前的 bad case 就发布。** 可能弄坏其他用例，必须跑完整评测集。
      - **误区：日志只记录问题和回答。** 不记录 Prompt 版本和模型版本，就无法复现和定位。
    interview_asks:
      - question: "你们是怎么管理 Prompt 的？改了 Prompt 怎么确认没有变差？"
        answer: "提示放在代码或配置里，有版本号，改动走评审。每次改动用同一份评测集跑前后对比，看准确率、拒答和成本。没有评测就不上线。"
      - question: "线上 AI 功能效果突然变差，你会怎么排查？"
        answer: "先看这次发布有没有改提示、模型名或检索。再拿几条坏例对日志：检索到了什么、实际提示是什么、模型回了什么。同时看是不是模型供应商偷偷换了版本。先回滚能回滚的变更。"
    project_example: |
      **p1 企业知识库问答** 的 Prompt 管理方案：
      - `prompts/` 模块里每个功能一个构建函数，带版本常量；
      - 评测集 50~100 条真实问题（Day 20 / Day 29），PR 必须附评测对比；
      - 通过配置按租户灰度新版本，日志记录 Prompt 版本、模型快照、usage 和引用正确率；
      - 发现问题时通过配置回滚到上一版本。
      评测分数和灰度比例用你自己的数据填写。
    freshness: |
      核对于 2026-11：OpenAI Prompt engineering 指南「Version prompts in code」一节建议把生产 Prompt 放在应用代码中管理，使用类型化参数、代码评审、测试和评测，并通过 Feature Flag 或配置灰度发布；API 中可复用的 Prompt 对象正在弃用，2026-06-03 起不再主推创建，v1/prompts 计划于 2026-11-30 关停。该指南同时建议生产环境锁定模型快照并建立评测集。
    sources:
      - {title: "OpenAI Docs - Prompt engineering", url: "https://developers.openai.com/api/docs/guides/prompt-engineering"}
test:
  - id: d15-t1
    kp: d15-k1
    type: single
    question: "下面哪条 System Prompt 规则写得最好？"
    options:
      - "请尽量简洁一些，不要啰嗦，也不要说太多无关的废话"
      - "你是世界上最专业、最严谨、最值得信赖的园区运营专家"
      - "回答不超过 5 句；资料中没有的数据回答「未查到」"
      - "不要回答错误的内容，也不要胡说八道或者编造任何信息"
    answer: [2]
    explain: |
      好的规则具体、可检验，并写清兜底：长度有明确上限，缺数据时有固定说法。
      A 太模糊，无法检验；B 只是身份描述，没有规则；D 只说不要做什么，模型不知道遇到不会的问题该怎么办。
  - id: d15-t2
    kp: d15-k1
    type: single
    question: "按 OpenAI 的建议，一条 developer 消息里各部分通常的排列顺序是？"
    options:
      - "身份、规则、示例、上下文"
      - "上下文、示例、规则、身份"
      - "规则、上下文、身份、示例"
      - "示例、身份、上下文、规则"
    answer: [0]
    explain: |
      OpenAI Prompt engineering 指南建议通常按 Identity、Instructions、Examples、Context 排列，上下文常放在靠后位置，因为每次请求的资料不同。
      这样稳定部分在前，也更容易命中 Prompt 缓存。
  - id: d15-t3
    kp: d15-k1
    type: judge
    question: "只要 System Prompt 写了「必须输出合法 JSON」，前端就可以直接 JSON.parse 模型输出，不需要做任何校验。"
    answer: false
    explain: |
      Prompt 只能提高概率，不能保证。模型仍可能输出多余文字、缺字段或截断。
      格式要配合结构化输出能力（Day 16）并由代码校验，失败时重试或降级。
  - id: d15-t4
    kp: d15-k1
    type: multi
    question: "关于 System Prompt 的写法，哪些做法是推荐的？"
    options:
      - "用 Markdown 标题分区，用 XML 标签包裹资料和示例"
      - "说明规则背后的原因，帮助模型理解和泛化"
      - "写清超出业务范围或资料不足时怎么回答"
      - "把当前时间和用户名放在第一行，方便模型注意"
    answer: [0, 1, 2]
    explain: |
      A 让模型分清规则和数据；B 是 Anthropic 推荐的做法；C 给了兜底，避免编造。
      D 会让每次请求的前缀不同、破坏缓存，动态内容应放在后面。
  - id: d15-t5
    kp: d15-k2
    type: single
    question: "告警分级任务加了 3 个 few-shot 示例，结果模型把大部分告警都判为「紧急」。检查发现 3 个示例全是紧急告警。最合适的改进是？"
    options:
      - "删掉所有示例，只保留文字规则"
      - "在规则里写「请不要总是判为紧急」"
      - "把示例增加到 30 个紧急告警，强化模式"
      - "换成覆盖各等级、带判断原因的示例"
    answer: [3]
    explain: |
      示例全是同一类会让模型偏向这一类。示例应覆盖不同等级，并写出判断原因，让模型学到尺度而不是只学到标签。
      A 失去了示例的价值；B 只能缓解；C 会加剧偏置。
  - id: d15-t6
    kp: d15-k2
    type: judge
    question: "如果 few-shot 示例的输出格式和文字规则描述的格式不一致，模型常常会跟着示例走，所以示例必须与规则保持一致。"
    answer: true
    explain: |
      示例是非常强的信号，冲突时模型往往模仿示例。OpenAI 也特别提醒，给推理模型的示例要与指令高度一致，否则效果会变差。
      修改规则时要同步检查示例。
  - id: d15-t7
    kp: d15-k2
    type: multi
    question: "关于 few-shot 示例，哪些说法正确？"
    options:
      - "示例计入输入 Token，放在稳定前缀可以命中缓存"
      - "用 example 等标签包裹，避免模型把示例当成本次输入"
      - "推理模型通常应先试 zero-shot，需要时再加示例"
      - "示例越多越好，最好放上百个覆盖所有情况"
    answer: [0, 1, 2]
    explain: |
      A 示例每次都发，但稳定内容可缓存；B 标签划分边界；C 是 OpenAI 对推理模型的建议。
      D 错：示例太多浪费 Token、增加干扰，Anthropic 建议 3~5 个；需要很多示例时应按问题动态挑选。
  - id: d15-t8
    kp: d15-k2
    type: single
    question: "什么情况下最适合使用 few-shot？"
    options:
      - "判断尺度和输出风格很难用文字说清，但能举出典型例子"
      - "需要模型获得最新的产品价格信息"
      - "需要模型严格遵守用户权限，不泄露其他部门数据"
      - "需要把首字延迟降低一半"
    answer: [0]
    explain: |
      few-shot 解决的是「说不清但能举例」的问题，比如分级尺度、回复语气、抽取边界。
      B 需要检索或工具（Day 21）；C 必须由代码做权限控制；D 示例反而增加输入、可能拖慢首字。
  - id: d15-t9
    kp: d15-k3
    type: single
    question: "团队把客服分析从普通模型换成推理模型，沿用了原来的 Prompt：「请一步步思考，并详细展示你的推理过程」。结果变慢、变贵，效果也没提升。最合理的调整是？"
    options:
      - "把「一步步思考」重复三遍，加强效果"
      - "删掉思维链提示，改写成目标、约束和验收标准"
      - "把 reasoning effort 调到最高，弥补效果"
      - "换回普通模型，推理模型不适合客服"
    answer: [1]
    explain: |
      推理模型已在内部思考，OpenAI 建议避免「think step by step」「explain your reasoning」这类提示，保持简单直接、写清目标和成功标准。
      A、C 只会更慢更贵；D 没有找到真正的问题。
  - id: d15-t10
    kp: d15-k3
    type: judge
    question: "对普通（非推理）模型，让它先写出分析步骤再给结论，往往能提升复杂问题的正确率，因为中间结果会出现在上下文里，供后续生成参考。"
    answer: true
    explain: |
      模型逐个 Token 生成，后面的 Token 能注意到前面写出的内容（Day 12）。先写出中间步骤，相当于给它一张草稿纸。
      不需要给用户看过程时，可以让它写在标签里，由代码只展示结论。
  - id: d15-t11
    kp: d15-k3
    type: single
    question: "下面两段指令分别给普通模型和推理模型使用。哪种分配更合理？"
    code: |
      # 指令 A
      目标：找出今天可能有同一根因的告警分组。
      约束：只使用 <data> 中的数据。
      验收：每组列出告警编号和关联依据；没有关联时输出「无」。

      # 指令 B
      先在 <thinking> 中逐条分析每个告警的楼栋、时间、设备，
      再在 <answer> 中给出可能同一根因的告警分组。
    options:
      - "A 给普通模型，B 给推理模型"
      - "两段都给推理模型，指令越多越好"
      - "两段都给普通模型，推理模型不需要指令"
      - "A 给推理模型，B 给普通模型"
    answer: [3]
    explain: |
      A 写的是目标、约束和验收标准，适合推理模型；B 要求先写分析过程，是给普通模型的思维链做法。
      C 错：推理模型同样需要清晰的目标和约束，只是不需要逐步指挥。
  - id: d15-t12
    kp: d15-k3
    type: multi
    question: "按 OpenAI《Reasoning best practices》，给推理模型写 Prompt 时哪些做法是推荐的？"
    options:
      - "用 developer 消息代替 system 消息"
      - "保持 Prompt 简单直接，并明确最终目标和约束"
      - "用 Markdown、XML 等分隔符划分输入的不同部分"
      - "加上「explain your reasoning」让它展示完整推理"
    answer: [0, 1, 2]
    explain: |
      A、B、C 都是官方建议。
      D 是官方明确不推荐的思维链提示：推理模型已在内部思考，不需要再要求展示推理过程。
  - id: d15-t13
    kp: d15-k4
    type: single
    question: "线上知识库问答的回答质量从某天起明显变差，但代码和 Prompt 都没有改动。生产环境用的是不带日期的模型别名。最需要怀疑的是？"
    options:
      - "用户的问题突然都变难了"
      - "Prompt 文件在服务器上被自动压缩了"
      - "别名背后的模型被厂商升级，同一 Prompt 表现变了"
      - "上下文窗口被厂商缩小了一半"
    answer: [2]
    explain: |
      模型别名会指向厂商最新的模型版本，升级后同一 Prompt 的表现可能不同。生产环境应锁定带版本的快照，升级视为一次变更，先跑评测。
      A、B、D 都缺乏依据；日志里记录模型版本能快速确认。
  - id: d15-t14
    kp: d15-k4
    type: judge
    question: "按 OpenAI 当前文档，推荐把生产 Prompt 放在应用代码中管理，API 中可复用的 Prompt 对象正在弃用。"
    answer: true
    explain: |
      OpenAI Prompt engineering 指南的「Version prompts in code」一节说明：可复用的 Prompt 对象正在弃用，v1/prompts 计划于 2026-11-30 关停，建议用代码管理 Prompt，配合评审、测试和灰度发布。
  - id: d15-t15
    kp: d15-k4
    type: single
    question: "下面的 Prompt 构建函数最主要的问题是？"
    code: |
      def build_prompt(user_text):
          return (
              f"现在时间：{datetime.now()}\n"
              f"你是园区运营助手。用户的要求：{user_text}\n"
              "规则：只回答园区相关问题，回答不超过 5 句。"
          )
    options:
      - "f-string 的性能比字符串拼接差很多"
      - "时间放在开头破坏缓存，用户输入混进规则区域"
      - "规则写得太短，应该至少写 20 条"
      - "没有使用 Markdown 标题，模型无法识别"
    answer: [1]
    explain: |
      每次请求开头的时间都不同，前缀无法命中缓存；用户输入被拼进规则所在的消息，还排在规则之前，用户可以写「忽略以下规则」来篡改。
      应把稳定规则放前面，用户输入单独放 user 消息，动态信息放后面。A、C、D 不是主要问题。
  - id: d15-t16
    kp: d15-k4
    type: multi
    question: "关于 Prompt 版本管理，哪些做法是合理的？"
    options:
      - "Prompt 改动走代码评审，并附上评测集对比结果"
      - "日志记录每次调用的 Prompt 版本和模型快照"
      - "新版本通过 Feature Flag 或配置灰度放量，异常时回滚"
      - "修好眼前的 bad case 就直接全量发布"
    answer: [0, 1, 2]
    explain: |
      A 让改动可审查、可量化；B 让问题可复现、可定位；C 控制发布风险。
      D 可能弄坏其他用例，必须先跑完整评测集。
exam:
  - id: d15-e1
    kp: d15-k1
    type: single
    question: "知识库问答经常在资料里没有答案时编造一个看似合理的数字。在 Prompt 层面最有效的修改是？"
    options:
      - "在身份描述里加上「你是非常严谨的专家」"
      - "写明只依据资料回答，资料中没有时回答「未找到」"
      - "要求模型「回答时要自信，不要犹豫」"
      - "把 temperature 设成 0，就不会再编造"
    answer: [1]
    explain: |
      给出明确的依据范围和兜底说法，模型在缺资料时才有「正确出口」；再配合代码检查引用（Day 27）。
      A 身份描述作用有限；C 反而鼓励编造；D 降低随机性，但不能消除编造。
  - id: d15-e2
    kp: d15-k2
    type: single
    question: "工单分类 Prompt 里有 4 个示例，规则写「类别只能是 设备 / 安全 / 环境 / 其他」，但其中一个示例的输出是「设施维修」。上线后模型偶尔输出「设施维修」。最直接的原因是？"
    options:
      - "模型的上下文窗口不够，没看到规则"
      - "类别太少，模型需要更多类别"
      - "temperature 太低，模型不够灵活"
      - "示例与规则冲突，模型模仿了示例的输出"
    answer: [3]
    explain: |
      示例是很强的信号，与规则冲突时模型常跟着示例走。应修正示例，让它与规则完全一致；类别校验还应由代码或结构化输出（Day 16）兜底。
      A、B、C 都不是这一现象的原因。
  - id: d15-e3
    kp: d15-k3
    type: single
    question: "用推理模型做园区能耗异常分析，旧 Prompt 有 15 条固定步骤。新模型经常卡在不适用的步骤上。按厂商建议，最合理的改法是？"
    options:
      - "改为目标、约束和验收标准，删掉固定步骤和思维链提示"
      - "把 15 条步骤改成 30 条，覆盖更多情况"
      - "要求模型在回答中逐条复述每一步的执行结果"
      - "每一步都单独调用一次推理模型"
    answer: [0]
    explain: |
      推理模型擅长自己规划路径，OpenAI 和 Anthropic 都建议给清晰的目标和约束，优先高层指令而不是规定死的步骤。
      B、C 让问题更严重；D 成本和延迟大幅增加，也失去了推理模型的优势。
  - id: d15-e4
    kp: d15-k4
    type: single
    question: "同事改了知识库 Prompt 里的一句话，修好了老板反馈的一个问题就上线了。两天后发现另一类问题的拒答率大幅上升。流程上最该补的是？"
    options:
      - "禁止任何人修改 Prompt"
      - "每次修改后让老板再试一遍"
      - "改动前后跑同一份评测集，达标后再灰度发布"
      - "把 Prompt 改回最初的版本，以后不再优化"
    answer: [2]
    explain: |
      Prompt 的影响是概率性、分散的，修好一个用例可能弄坏一批。需要固定评测集做回归，再通过灰度观察线上指标，异常可回滚。
      A、D 因噎废食；B 只看单个用例，覆盖不了其他类别。
  - id: d15-e5
    kp: d15-k1
    type: multi
    question: "关于 System Prompt 与安全，哪些说法正确？"
    options:
      - "用户输入应放在 user 消息中，不要拼进 developer 规则"
      - "权限控制应在代码里做，不能只靠 Prompt"
      - "前端不应能直接传入或修改 system 内容"
      - "System Prompt 写得足够严格就能完全防住 Prompt 注入"
    answer: [0, 1, 2]
    explain: |
      A、B、C 都是基本的工程防线：角色分离、代码层权限、前端不可篡改规则。
      D 错：Prompt 只能降低风险，注入防护需要多层措施（Day 45）。
  - id: d15-e6
    kp: d15-k3
    type: multi
    question: "关于思维链与推理模型，哪些说法正确？"
    options:
      - "对普通模型，要求先分析再回答能提升复杂任务效果"
      - "推理模型已在内部思考，不需要再加「一步步思考」"
      - "不同模型家族对同一 Prompt 的反应可能不同，换模型要重跑评测"
      - "推理模型会完整返回推理过程，可以直接展示给用户"
    answer: [0, 1, 2]
    explain: |
      A 是 CoT 的作用；B 是推理模型的提示建议；C 是模型迁移的基本要求。
      D 错：推理 Token 通常不会完整返回（Day 11），需要依据时让模型在答案中写出判断依据。
  - id: d15-e7
    kp: d15-k2
    type: judge
    question: "few-shot 示例通常稳定不变，把它们放在 Prompt 前面的稳定部分，有助于命中 Prompt 缓存、降低成本。"
    answer: true
    explain: |
      Prompt 缓存要求前缀完全一致（Day 12）。示例和规则一样是稳定内容，放在前面能被缓存；动态资料和用户问题放在后面。
  - id: d15-e8
    kp: d15-k4
    type: judge
    question: "生产环境使用不带日期的模型别名是最佳实践，因为能自动享受厂商的模型升级，且不会影响已有 Prompt 的效果。"
    answer: false
    explain: |
      OpenAI 建议生产环境锁定具体的模型快照，因为不同快照对同一 Prompt 的表现可能不同。
      升级模型应视为一次变更：先用评测集对比，再灰度切换。
  - id: d15-e9
    kp: d15-k4
    type: case
    question: |
      你接手一个已上线的 AI 客服项目：Prompt 散落在 6 个文件里，有的写在数据库中由运营随时修改；没有评测集；日志只记录问题和回答；生产环境用的是模型别名。
      最近用户投诉回答风格突然变了，但没人能说清是 Prompt 改了还是模型变了。
      作为负责人，你第一阶段最应该做的是？
    options:
      - "立刻按最新的官方最佳实践，把 6 个文件里的 Prompt 全部重写一遍"
      - "Prompt 集中进代码并加版本号，日志记版本与快照，锁定快照，建评测集"
      - "把客服模型整体换成推理模型，用更强的能力提升回答质量和风格稳定性"
      - "安排运营每天人工抽查 100 条回答，发现风格异常就手动修改数据库里的 Prompt"
    answer: [1]
    explain: |
      当前最大的问题是「不可追溯、不可度量」。先集中 Prompt 并加版本号、日志记录 Prompt 版本和模型快照、锁定快照、建立评测集，才能定位问题，后续的优化也才能被衡量。运营可编辑的部分要加审核和评测。
      A、C 在没有评测的情况下大改，风险更大；D 成本高，也无法定位原因。
interview:
  - id: d15-i1
    kp: d15-k1
    type: oral
    difficulty: 2
    question: "你是怎么写 System Prompt 的？请说说你的结构和几条最重要的原则。"
    key_points:
      - {text: "说明结构：身份、规则、示例、上下文，稳定内容在前、动态内容在后", dim: concept}
      - {text: "说明规则要具体可检验、说明原因、写清边界和兜底", dim: principle}
      - {text: "说明用 Markdown 分区、XML 标签包裹资料，区分规则和数据", dim: engineering}
      - {text: "说明 Prompt 不是安全边界，格式和权限由代码兜底，用户输入不进规则", dim: engineering}
      - {text: "结合项目说明修改 Prompt 后如何用评测验证", dim: project}
    reference: |
      **结构**：我一般按「身份、规则、示例、上下文」组织 developer 消息，这也是 OpenAI 推荐的常见顺序。身份说清服务对象和语气；规则写必须做和禁止做的事；示例展示期望的输出；上下文放检索资料等每次变化的内容，放在靠后位置。稳定内容在前，还能命中 Prompt 缓存。
      **规则的原则**：
      1. **具体可检验**：不写「简洁」，写「不超过 5 句」；
      2. **说明原因**：比如「回答会被语音播报，所以不要用省略号」，模型能更好泛化；
      3. **写清边界和兜底**：超出业务范围怎么回答、资料中没有答案怎么回答，避免编造。
      **格式**：用 Markdown 标题分区，用 XML 标签包裹资料和示例，让模型分清规则和数据。
      **工程兜底**：Prompt 只能提高概率。JSON 格式、引用编号、权限都由代码校验；用户输入只放 user 消息，不拼进规则，防止注入。
      **验证**：每次改动跑评测集，一次只改一处，对比整体指标和变差的用例。
    oral: |
      我写 System Prompt 一般分四块：身份、规则、示例、上下文。稳定的放前面，资料这种每次变化的放后面，这样还能命中缓存。
      规则我抓三点：第一要具体，比如不写「简洁」，写「不超过五句」；第二说明原因，模型知道为什么，执行得更好；第三写清边界和兜底，比如资料里没有答案就回答「未找到」，避免编造。格式上用 Markdown 分区、XML 标签包资料。
      另外我不会把 Prompt 当安全边界，JSON 格式、引用、权限都由代码校验，用户输入只放 user 消息。每次改 Prompt 都跑评测集，一次只改一处。
  - id: d15-i2
    kp: d15-k3
    type: scenario
    difficulty: 3
    question: "团队把一个合同条款分析功能从普通模型切换到推理模型，Prompt 原样沿用（包含「请一步步思考」和 20 条固定分析步骤）。上线后响应变慢、费用上涨，准确率却没有明显提升。你会怎么调整？"
    key_points:
      - {text: "说明推理模型已在内部思考，思维链提示和固定步骤多余甚至有害", dim: principle}
      - {text: "说明改写方式：目标、约束、验收标准，保持简单，先 zero-shot", dim: engineering}
      - {text: "说明用 reasoning effort 和输出长度控制成本与延迟", dim: engineering}
      - {text: "说明用评测集对比新旧 Prompt 与模型，看准确率、成本、延迟", dim: project}
      - {text: "说明是否需要推理模型要按任务判断，简单步骤可交给普通模型", dim: concept}
    reference: |
      **原因**：推理模型在回答前已经用推理 Token 思考。「一步步思考」和 20 条固定步骤一方面是重复劳动，另一方面会限制它自己的规划，还让输出更长。OpenAI 的建议是避免思维链提示、保持简单直接；Anthropic 也建议思考模型优先用高层指令而不是规定死的步骤。
      **改写**：
      - 删掉思维链提示，把 20 条步骤压缩成**目标**（找出对甲方不利的条款）、**约束**（只依据合同原文，引用条款编号）、**验收标准**（每条风险给出原文引用和理由，没有风险时说明「未发现」）；
      - 先 zero-shot 测；判断尺度不稳再加 2~3 个与规则一致的示例；
      - 用分隔符包裹合同原文，长文档放前、任务放后（Day 13）。
      **成本与延迟**：根据任务难度调 reasoning effort，从低到高试；限制输出格式和长度；监控 usage 中的推理 Token。
      **验证**：用一份标注好的合同评测集，对比「旧模型 + 旧 Prompt」「新模型 + 旧 Prompt」「新模型 + 新 Prompt」的准确率、单次成本和 P95 延迟。
      **再判断是否需要推理模型**：如果评测显示普通模型配合思维链已经足够，就保留普通模型；也可以让推理模型做难的判断，普通模型做格式整理等简单步骤。
    oral: |
      我先判断原因：推理模型本来就会在内部思考，再让它「一步步想」、再规定二十条固定步骤，是重复劳动，还会限制它自己的规划，所以又慢又贵，效果也没变好。
      我会把 Prompt 改成三块：目标是找出对甲方不利的条款；约束是只依据原文、引用条款编号；验收标准是每条风险都有原文和理由，没有就说「未发现」。先不加示例试一次，尺度不稳再加两三个一致的示例。effort 从低往高调，同时限制输出长度。
      最后用标注好的合同评测集，把旧模型旧 Prompt、新模型旧 Prompt、新模型新 Prompt 三种组合对比准确率、成本和延迟。如果普通模型已经够用，就不必上推理模型。
  - id: d15-i3
    kp: d15-k4
    type: design
    difficulty: 4
    question: "公司有 5 个 AI 功能，Prompt 散落在代码和数据库里，经常有人改了 Prompt 导致线上效果变差却没人发现。请设计一套 Prompt 管理和发布流程。"
    key_points:
      - {text: "说明 Prompt 即代码：集中模块、模板化、类型化参数、版本号、代码评审", dim: concept}
      - {text: "说明效果是概率性、分散的，必须用评测集做回归，一次只改一处", dim: principle}
      - {text: "说明灰度发布、监控、回滚，以及锁定模型快照并把升级视为变更", dim: engineering}
      - {text: "说明日志记录 Prompt 版本、模型快照、usage，便于复现与定位", dim: engineering}
      - {text: "结合项目说明落地顺序与运营可编辑部分的管控", dim: project}
    reference: |
      **原则：Prompt 即代码。** OpenAI 现在也推荐把生产 Prompt 放在应用代码中管理，平台上可复用的 Prompt 对象正在弃用，v1/prompts 计划于 2026-11-30 关停。
      **1. 集中与模板化**：每个功能一个 Prompt 模块，就近放在功能代码旁；规则与变量分离，变量用类型化参数传入；每个模板带版本号常量。
      **2. 评审与评测**：Prompt 改动走 PR；每个功能维护 50~100 条代表性用例（Day 20），CI 中跑评测并在 PR 里展示新旧对比和变差的用例；一次只改一处。
      **3. 灰度与回滚**：通过 Feature Flag 或配置按比例、按租户放量；监控质量指标（如引用正确率、拒答率、用户反馈）、成本和延迟；异常时一键回滚到上一版本（Day 44）。
      **4. 锁定模型**：生产环境锁定模型快照；模型升级视同一次变更，走同样的评测和灰度流程。
      **5. 可观测**：每次调用记录功能名、Prompt 版本、模型快照、usage、耗时；出问题时能按版本筛选、复现。
      **6. 运营可编辑的部分**：只开放话术等低风险字段，修改要审核、自动跑评测，不能直接改规则核心。
      **落地顺序**：先把 Prompt 集中并加版本号和日志（立刻能定位问题），再补评测集，最后接入灰度发布。
    oral: |
      我的核心思路是「Prompt 即代码」，OpenAI 现在也推荐这样做，平台上的 Prompt 对象都在弃用了。
      第一步，把五个功能的 Prompt 集中到各自的模块里，规则和变量分开，带版本号，改动走 PR 评审。第二步，每个功能建五十到一百条评测用例，CI 里自动跑，PR 上展示新旧对比和变差的用例，一次只改一处。第三步，用开关按比例灰度，盯质量、成本和延迟，有问题一键回滚。
      另外生产环境锁定模型快照，模型升级也走同样流程；日志记录 Prompt 版本和模型快照，出问题能直接定位。运营只能改话术这类低风险部分，而且要审核加自动评测。落地顺序是先集中加日志，再补评测，最后接灰度。
