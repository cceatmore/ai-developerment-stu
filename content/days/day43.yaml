day: 43
phase: 5
title: 可观测性：Trace、OpenTelemetry 与 Langfuse/LangSmith
goals:
  - 能画出一次 RAG 或 Agent 请求的 Trace 树，并说出 LLM Span 必须记录的字段
  - 能说明 OpenTelemetry 的组成和 GenAI 语义约定的现状（2026-11），并给出兼容新旧字段的做法
  - 能用 Langfuse 或 LangSmith 给一个 Python 应用加上 Trace、会话和 Prompt 版本关联
  - 能为 LLM 应用设计指标大盘和告警，并处理好内容采集的隐私问题
