day: 22
phase: 3
title: 文档解析：把 PDF、Word 变成干净的结构化文本
goals:
  - 能说出「解析质量决定 RAG 上限」的原因，并设计一个统一的 Block 文档模型和按文件类型路由的解析流程
  - 能识别 PDF 的四大难点（扫描件、表格、页眉页脚、多栏）并说出各自的处理思路
  - 能设计文档级和块级 metadata，并说明每个字段在引用、过滤、更新中的用途
  - 能在 pypdf、PyMuPDF、unstructured、Docling、MinerU、MarkItDown 之间做出有理由的选型
minutes: 60
resources:
  - title: "Hello-Agents 第八章 8.3.4 构建私有化 RAG 系统"
    url: "https://github.com/datawhalechina/hello-agents/blob/main/docs/chapter8/%E7%AC%AC%E5%85%AB%E7%AB%A0%20%E8%AE%B0%E5%BF%86%E4%B8%8E%E6%A3%80%E7%B4%A2.md"
    kind: repo
    lang: zh
    minutes: 15
    note: "只看 8.3.4 的「（1）多模态文档载入」：它用 MarkItDown 把各种格式统一转 Markdown，对照今天的「统一 Block 模型」思路，想想它丢掉了哪些信息"
  - title: "MinerU 官方文档"
    url: "https://opendatalab.github.io/MinerU/"
    kind: doc
    lang: zh
    minutes: 15
    note: "看首页的功能介绍和 Quick Start，重点了解它支持哪些输入格式、有哪几档解析模式、默认是否本地处理；不需要真的安装"
  - title: "Docling 官方文档"
    url: "https://docling-project.github.io/docling/"
    kind: doc
    lang: en
    minutes: 15
    note: "看首页 Features 和 Getting started 里 DocumentConverter 的三行示例，理解它输出的是带结构的 DoclingDocument，而不只是一段纯文本"
knowledge_points:
  - id: d22-k1
    name: 文档解析的本质与统一文档模型
    level: P0
    summary: 解析就是把各种格式还原成「有顺序、有结构、有出处」的文本块；统一成 Block 模型后，下游切片和检索才不用关心原始格式
    analogy: |
      像浏览器把 HTML 解析成 **DOM 树**：不管页面是手写的、SSR 的还是模板生成的，后面的 JS 都只操作统一的 DOM 节点。这里的 Block 就是「文档的 DOM 节点」，带类型（标题、段落、表格）、层级和位置。
      **不一样的地方**：HTML 本来就有标签结构，解析是确定的；PDF 本质是「在坐标上画字」，没有段落和标题的概念，结构要靠**猜**（版面分析、字号、位置），所以解析结果可能出错，必须做质量检查。
    why: |
      RAG 圈有句话：**垃圾进，垃圾出**。解析丢了表格、乱了阅读顺序、漏了扫描页，后面的切片、向量、重排、提示词再好也救不回来。
      p1 的「文档解析模块」今天解锁，它是整个知识库的地基；面试里「你们怎么处理 PDF 表格和扫描件」也是 RAG 项目的高频追问。
    problem: |
      企业资料格式五花八门：电子版 PDF、扫描件、Word、Excel、PPT、网页、TXT。
      如果每种格式各写一套下游逻辑，代码会爆炸；如果全部粗暴转成纯文本，又会丢掉标题层级、表格结构和页码，后面无法按结构切片，也无法给出引用。
    principle: |
      **一、解析要还原的三样东西**

      - **内容**：文字本身，包括扫描图片里的文字（OCR）。
      - **结构**：标题层级、段落边界、列表、表格的行列关系、阅读顺序。
      - **出处**：来自哪个文件、第几页、哪个章节，甚至页面上的坐标，后面引用和高亮要用。

      **二、统一文档模型（Block）**

      不管原始格式是什么，解析器都输出同一种结构：一个 `Document` 包含一组有序的 `Block`。

      ```mermaid
      classDiagram
        class Document {
          +doc_id
          +source_uri
          +file_hash
          +title
          +version
          +blocks
        }
        class Block {
          +block_id
          +block_type
          +text
          +page
          +heading_path
          +bbox
          +order
        }
        class TableBlock {
          +rows
          +header
          +markdown
        }
        Document "1" --> "many" Block
        Block <|-- TableBlock
      ```

      - `block_type`：title、paragraph、list、table、image、code 等，切片时按类型区别对待（表格不能拦腰切）。
      - `heading_path`：如「第三章 休假管理 / 3.2 年假」，后面会作为 chunk 的前缀提升检索效果（Day 23）。
      - `page` 和 `bbox`：引用时告诉用户在第几页，前端可以高亮原文位置（Day 27）。
      - `order`：阅读顺序，多栏 PDF 尤其重要。

      **三、按文件类型路由**

      ```mermaid
      flowchart TD
        F["上传文件"] --> T{"按文件头魔数识别真实类型"}
        T -->|"docx"| W["读段落样式和表格 python-docx"]
        T -->|"pdf"| P{"有文本层吗"}
        P -->|"有"| PT["文本抽取加版面分析"]
        P -->|"没有 扫描件"| O["OCR"]
        T -->|"txt md"| X["检测编码后按行读取"]
        T -->|"其他"| R["拒绝或转人工"]
        W --> B["统一输出 Document 和 Block 列表"]
        PT --> B
        O --> B
        X --> B
        B --> Q{"质量检查通过吗"}
        Q -->|"是"| N["进入切片"]
        Q -->|"否"| M["标记失败 记录原因"]
      ```

      - **用文件头（魔数）识别真实类型**，不要只信扩展名：用户把 .doc 改名成 .docx、把图片改名成 .pdf 的情况很常见。
      - 每种格式一个解析器，输出都是 Block 列表，**下游只认 Block**——这就是策略模式。

      **四、解析质量检查（入库前的闸门）**

      - **空文本率**：某页抽出的字符数接近 0，多半是扫描页，需要 OCR。
      - **乱码率**：大量替换字符、不可读符号，说明编码或字体映射有问题。
      - **chunk 数为 0 直接判失败**：不要让「解析出空文本」显示成「入库成功」（见 Day 21 的案例）。
      - **抽样人工核对**：新文档类型上线前，挑几份对比原文和解析结果。

      一句话：**解析不是「转成文本」，而是「还原内容、结构和出处」**，并且要能发现自己解析失败了。
    scenarios: |
      - **企业知识库入库**：同一个上传接口接收 PDF、Word、TXT，按真实类型路由到不同解析器，统一输出 Block 列表。
      - **合同审查助手**：需要保留条款编号和页码，回答时能指出「第 12 页第 5.3 条」。
      - **批量迁移旧资料**：几万份历史文件先跑一遍质量检查，把空文本、乱码文件挑出来单独处理。
    pitfalls: |
      - **只信扩展名**：改名文件导致解析器报错或输出乱码。
      - **把所有格式都粗暴转成一段纯文本**：标题层级、表格结构、页码全丢，后面无法结构化切片和引用。
      - **解析结果不落盘**：答错时无法回头看「解析出来的到底是什么」。
      - **没有质量闸门**：扫描件解析出空字符串也被当作成功入库。
      - **一个文件解析失败导致整批任务中断**：应逐个文件记录状态，失败的单独重试。
    interview_asks:
      - question: "你们的文档解析是怎么设计的？不同格式怎么统一处理？"
        answer: "每种格式一个解析器，输出同一种结构：文本块、标题层级、页码、类型。后面的切片和检索只认这个结构，不关心原来是 PDF 还是 Word。"
      - question: "你怎么发现某份文档解析失败或质量很差？"
        answer: "看解析出的文字量是不是少得离谱、是不是大量乱码、有没有整页为空。抽样打开原文对照。解析失败要有状态，不能当成空文档悄悄入库。"
      - question: "为什么解析时要保留页码和标题层级？"
        answer: "回答要能说「第几页、哪一节」。切片时也要按标题切，而不是只按字数。丢掉页码，引用就无法核对。"
    project_example: |
      **p1 企业知识库问答**的「文档解析模块」今天解锁，设计要点：
      - 上传后按文件头识别类型，路由到 `PdfParser`、`DocxParser`、`TextParser`，都实现同一个 `parse(file) -> Document` 接口。
      - 每个 Block 带 `page`、`heading_path`、`block_type`，解析结果以 JSON 存档，可在后台「查看解析结果」页面直接对照原文。
      - 质量闸门：空页率超过 30% 自动转 OCR 通道；chunk 数为 0 判失败并在前端显示原因。
      你作为前端负责人，可以顺手做一个「原文 / 解析结果」左右对照页，这是排查入库问题最好用的工具。
  - id: d22-k2
    name: PDF 四大难点：扫描件、表格、页眉页脚、多栏
    level: P0
    summary: PDF 只记录「在哪个坐标画什么字」，所以扫描件要 OCR、表格要还原行列、页眉页脚要去重、多栏要恢复阅读顺序
    analogy: |
      PDF 很像一张**用 `position: absolute` 摆满文字的页面**：每个字都有精确坐标，但没有 `<p>`、`<table>`、`<h1>` 这些语义标签。你想把它还原成语义化 HTML，就得根据位置和字号去猜哪些是标题、哪些是一行表格。
      **不一样的地方**：绝对定位的网页至少还有 DOM 文本；扫描件 PDF 连文本都没有，只有一张图片，必须先做 OCR 把图里的字认出来。
    why: |
      企业资料里 PDF 占大头，而且最难处理：老制度是扫描件、报价单是表格、论文和白皮书是双栏、每页都有页眉页脚。
      这四类问题是知识库「答不出、答错」的高发根因，也是面试官判断你是否真做过 RAG 项目的试金石。
    problem: |
      用最简单的 PDF 文本抽取，常见结果是：扫描件抽出空字符串；表格变成一串没有行列关系的数字；每个 chunk 里都混着「XX 公司内部资料 第 3 页」；双栏论文左右两栏的句子交错拼在一起。
      这些错误不会报错，只会让检索和回答悄悄变差。
    principle: |
      **一、PDF 为什么难**

      PDF 是为「打印出来长得一样」设计的格式，内部记录的是「在坐标 (x, y) 用某字体画这几个字」。它**不保存段落、标题、表格、阅读顺序**这些语义，所有结构都要事后推断。

      ```mermaid
      flowchart LR
        P["一页 PDF"] --> L["版面分析 识别区域类型"]
        L --> T1["文字区"]
        L --> T2["表格区"]
        L --> T3["图片区"]
        L --> T4["页眉页脚区"]
        T1 --> O1["按阅读顺序拼接段落"]
        T2 --> O2["还原行列 输出 Markdown 或 HTML 表格"]
        T3 --> O3["OCR 或图片描述 可选"]
        T4 --> O4["识别为重复噪声后丢弃"]
        O1 --> B["Block 列表"]
        O2 --> B
        O3 --> B
      ```

      **二、扫描件：没有文本层**

      - **识别**：某页抽出的字符很少但页面有内容（图片），就判定为扫描页。按页判断，因为一份文件可能部分扫描。
      - **处理**：走 OCR（光学字符识别）。传统方案如 Tesseract；现在主流工具（MinerU、Docling 等）内置了更强的 OCR 和版面模型，中文效果明显更好。
      - **代价**：OCR 慢、可能认错字（「己 / 已」「0 / O」），数字和金额要特别抽检。

      **三、表格：最容易被「拍平」**

      - 简单抽取会把表格变成按行或按列串起来的文字，**行列关系丢失**，「一线城市住宿 600 元」可能变成「一线城市 二线城市 600 450」。
      - **处理**：用版面模型识别表格区域，还原为 Markdown 或 HTML 表格；合并单元格、跨页表格要特别处理。
      - 切片时表格作为整体，超长表格按行拆分并**每段重复表头**（Day 23）。

      **四、页眉页脚：重复噪声**

      - 每页都有的「公司名称、机密等级、页码」会混进正文，污染向量、浪费 Token，甚至让无关 chunk 因为都含公司名而相似度偏高。
      - **处理**：统计各页顶部和底部区域的文本，**在多数页面重复出现的行**判定为页眉页脚并去除；页码用正则识别。

      **五、多栏：阅读顺序错乱**

      - 双栏排版按坐标从上到下抽取，会把左栏第一行和右栏第一行拼在一起，句子交错。
      - **处理**：版面分析先划分栏，再按「先左栏从上到下，再右栏从上到下」的顺序输出。PyMuPDF、Docling、MinerU 都有这方面的能力，但复杂版面仍要抽检。

      **六、一个实用的处理顺序**

      1. 逐页判断有无文本层，扫描页走 OCR。
      2. 版面分析，区分正文、标题、表格、图片、页眉页脚。
      3. 表格单独还原结构，页眉页脚去除。
      4. 按阅读顺序输出 Block，带页码和坐标。
      5. 质量检查：空页率、乱码率、表格数量是否合理。
    scenarios: |
      - **老制度扫描件**：十年前的纸质制度扫描入库，必须 OCR，并抽检数字和日期。
      - **报价单、费用标准表**：住宿、补贴标准都在表格里，表格拍平就会答错金额。
      - **技术白皮书**：双栏排版，阅读顺序错乱会让一个 chunk 里出现两个不相关的半句话。
      - **合同**：每页页眉都有合同编号和「保密」字样，需要去掉。
    pitfalls: |
      - **只判断整份文件有没有文本**：混合文件（前几页电子版、后面附件是扫描）会漏掉扫描页。
      - **OCR 结果不抽检**：金额、日期认错一个字，回答就是错的，而且看起来很可信。
      - **表格直接转纯文本**：行列关系丢失，问「二线城市住宿标准」时数字对不上。
      - **页眉页脚去除过度**：把在每页重复出现的正文标题（如条款名）也删了。
      - **以为工具能百分百处理复杂版面**：跨页表格、合并单元格、图文混排仍需人工抽检。
    interview_asks:
      - question: "PDF 解析有哪些常见难点？你们分别怎么处理的？"
        answer: "扫描件没有文字层，要 OCR。表格会被抽成错乱的行。页眉页脚会重复进每一页。多栏会把左右栏串成一段。分别用 OCR、表格专用解析、按位置去掉页眉页脚、按栏阅读顺序重组。"
      - question: "怎么判断一个 PDF 是扫描件？混合文件怎么办？"
        answer: "一页抽出的文字很少，但页面有图，就按扫描页处理。混合文件按页判断，有文字层的页直接抽，没有的页再 OCR。不要整本都 OCR 或整本都不 OCR。"
      - question: "表格类内容入库后检索效果差，你会怎么优化？"
        answer: "不要把表格打成一行行没有表头的文字。保留表头，按行写成「字段是值」，或整表单独成块并带上标题。查询里的数字和列名才能对上。"
    project_example: |
      在 **p1 企业知识库问答**里，《差旅费管理办法》的住宿标准是一张按城市等级划分的表格。第一版用简单文本抽取，表格被拍平，问「二线城市住宿标准」时回答了一线城市的金额。
      改进：PDF 解析改用带版面分析的工具，表格输出为 Markdown 表格并作为独立 Block；同时按页检测文本层，附件里的扫描页走 OCR。
      验证方法：在评测集里专门放 10 个「答案在表格里」的问题，改进前后对比检索命中率和回答正确率，这就是你面试时可以讲的一个具体优化案例。
  - id: d22-k3
    name: 清洗与 metadata 设计
    level: P1
    summary: 清洗去掉噪声并统一字符形式，metadata 记录来源、页码、版本、权限，是引用、过滤、增量更新的基础
    analogy: |
      metadata 就像前端打包产物里的 **source map 加文件 hash**：source map 让你从压缩代码定位回源码第几行（对应引用定位到第几页），hash 让你知道文件变没变（对应增量更新）。
      **不一样的地方**：source map 是构建工具自动生成的；RAG 的 metadata 很多要你**主动设计和补充**，比如生效日期、适用部门、权限，原文件里不一定有，漏了就只能重新入库。
    why: |
      没有 metadata，RAG 只能「搜到一段文字」，却说不出出处、过滤不了权限和版本、也不知道文件更新后该删哪些旧 chunk。
      面试官常问「你们的 chunk 表有哪些字段」，答得出 metadata 设计，说明你考虑过生产问题。
    problem: |
      解析出的原始文本有大量噪声：全角半角混用、多余空白、不可见字符、重复段落。
      同时，同一制度有新旧版本、不同部门有不同适用范围、文件会被修改，如果不在入库时记录这些信息，后期补救代价很高。
    principle: |
      **一、文本清洗做什么**

      - **字符规范化**：用 Unicode NFKC 把全角字母数字转成半角（「ＡＢＣ１２３」→「ABC123」），保证同一个词只有一种写法；**离线和在线必须用同一套规则**（见 Day 21 的契约）。
      - **编码处理**：TXT 和老系统导出的 CSV 可能是 GBK，先检测编码再解码，不要一律按 UTF-8 读。
      - **去噪**：合并多余空白和空行、去掉不可见控制字符、去掉页眉页脚和水印文字。
      - **去重**：同一份文件被重复上传，用内容 hash 判重；模板化段落（每份制度都有的「本办法由人力资源部负责解释」）可以标记为低价值。
      - **别过度清洗**：编号、单位、标点、换行结构都是有用信息，删掉会影响切片和关键词检索。

      **二、文档级 metadata**

      | 字段 | 用途 |
      |---|---|
      | `doc_id`、`source_uri`、`title` | 引用展示、跳转原文 |
      | `file_hash` | 判断文件是否变化，决定是否重新入库 |
      | `version`、`effective_date`、`status` | 只检索有效版本，避免新旧制度混用 |
      | `dept_id`、`acl`、`tenant_id` | 检索时权限过滤（Day 30） |
      | `doc_type` | 制度、手册、FAQ，可按类型调整检索策略 |

      **三、块级 metadata**

      - `page`、`bbox`：引用定位到页面位置。
      - `heading_path`：所属章节路径，用于切片前缀和展示。
      - `block_type`：段落、表格、列表，影响切片和展示方式。
      - `order`：在文档中的顺序，用于取相邻块补上下文（Day 23）。

      ```mermaid
      erDiagram
        DOCUMENT ||--o{ BLOCK : contains
        DOCUMENT {
          string doc_id
          string file_hash
          string version
          date effective_date
          string status
          string dept_id
        }
        BLOCK {
          string block_id
          string doc_id
          int page
          string heading_path
          string block_type
          int block_order
        }
      ```

      **四、为什么要在入库时就设计好**

      metadata 一旦缺失，只能**全量重新解析入库**才能补上。所以第一版就要把来源、页码、版本、权限这几个字段留好，哪怕暂时不用。
    scenarios: |
      - **新旧制度并存**：2023 版和 2025 版考勤制度都在库里，检索时只取 `status = active` 的版本。
      - **文件更新**：同名文件重新上传，对比 `file_hash` 发现变化，删除旧 chunk 后重新入库。
      - **部门隔离**：财务制度只对财务部和管理层可见，检索时按 `dept_id` 过滤。
      - **GBK 编码的 TXT**：先检测编码，避免整份文件变成乱码入库。
    pitfalls: |
      - **只存文本不存来源页码**：上线后无法做引用，只能返工。
      - **没有版本和生效日期字段**：新旧制度混用，回答引用已废止的条款。
      - **离线做了 NFKC，在线没做**：同一个型号在两边写法不同，关键词检索匹配不上。
      - **清洗时删掉了编号和标点**：「3.2.1」变成「321」，按条款号检索失败。
      - **用文件名判重**：同名不同内容、不同名同内容都会判错，应该用内容 hash。
    interview_asks:
      - question: "你们的 chunk 表有哪些 metadata 字段？分别做什么用？"
        answer: "至少有租户、文档 id、版本、页码、标题路径、来源和是否有效。它们用来过滤权限和版本、生成引用、删除时找到对应切片。没有 metadata 就只能全库乱搜。"
      - question: "制度更新后，怎么避免新旧版本同时被检索到？"
        answer: "切片带版本和生效状态。检索时只查当前生效版本。旧版本标记失效或删掉对应向量，不要只改了原文却留着旧向量。"
      - question: "文本清洗时有哪些需要注意不能过度处理的地方？"
        answer: "页眉页脚、多余空行可以去。不要去掉看起来重复但其实是编号、条款号和表格里的数字。清洗前后抽样对比，避免把正文洗没。"
    project_example: |
      **p1 企业知识库问答**的文档表包含 `doc_id、title、source_uri、file_hash、version、effective_date、status、dept_id`，块表包含 `page、heading_path、block_type、block_order`。
      实际收益：制度更新时按 `file_hash` 判断是否重跑入库，旧版本标记 `status = archived` 不再参与检索；回答引用显示「《考勤管理办法》2025 版 第 3.2 条 第 5 页」；财务制度按 `dept_id` 过滤。
      这些字段在 Day 23 切片入库、Day 30 权限与更新模块里都会直接用到。
  - id: d22-k4
    name: 解析工具选型
    level: P1
    summary: 电子版简单 PDF 用 pypdf 或 PyMuPDF，复杂版面、表格、扫描件用 Docling、MinerU 或 unstructured，选型看质量、速度、许可证和是否本地处理
    analogy: |
      像前端选图表库：简单折线图用轻量库就够，复杂交互大屏才上 ECharts 这种重型方案。解析工具也是从轻到重一个梯度。
      **不一样的地方**：图表库选错了换起来还算容易；解析工具决定了入库数据的质量，换工具意味着**全量重新解析、重新向量化**，而且重型解析工具依赖模型，对 CPU、GPU 和内存有要求。
    why: |
      解析工具更新非常快，各家都在说自己最好。会根据自己的文档类型、部署环境和许可证要求做选型，而不是跟风，是工程判断力的体现。
      面试官常问「你们用什么解析 PDF？为什么选它？」
    problem: |
      没有一个工具能完美处理所有文档：轻量库快但不懂表格和扫描件，重型工具效果好但慢、吃资源，有的许可证对商用有限制，有的默认调用云端服务涉及数据安全。
      需要按场景分层选择，并用自己的样本文档实测。
    principle: |
      **一、工具梯度（从轻到重）**

      | 工具 | 定位 | 适合 | 注意 |
      |---|---|---|---|
      | pypdf | 纯 Python 文本抽取 | 简单电子版 PDF | 不处理表格、扫描件、多栏 |
      | PyMuPDF | 快速 PDF 处理，可输出 Markdown | 电子版 PDF、需要坐标和页码 | AGPL 或商业双许可 |
      | MarkItDown | 多格式统一转 Markdown | 快速打通原型 | 结构和定位信息较粗 |
      | unstructured | 多格式分区，多种策略 | 多格式混合、需要元素类型 | 高精度策略依赖较重 |
      | Docling | 版面、表格、结构化文档模型 | 复杂版面、表格、本地部署 | 依赖模型，首次较慢 |
      | MinerU | 中文场景强，版面、表格、公式、OCR | 中文扫描件、复杂 PDF | 资源占用较高 |

      **二、选型维度**

      - **解析质量**：拿你自己的 20 份典型文档实测，重点看表格、扫描件、多栏。
      - **速度和资源**：重型工具在 CPU 上可能很慢，批量入库要估算时间。
      - **许可证**：商用项目要确认许可证，例如 PyMuPDF 是 AGPL 或商业双许可。
      - **数据安全**：是否完全本地处理，是否默认把文件发到云端 API。
      - **输出结构**：是否保留页码、坐标、标题层级、表格结构，方便映射到你的 Block 模型。

      **三、务实策略：分层路由**

      ```mermaid
      flowchart TD
        A["PDF 文件"] --> B{"有文本层且版面简单吗"}
        B -->|"是"| C["轻量解析 pypdf 或 PyMuPDF"]
        B -->|"否 有表格 多栏 扫描"| D["重型解析 Docling 或 MinerU"]
        C --> E{"质量检查通过吗"}
        E -->|"否"| D
        E -->|"是"| F["统一 Block 输出"]
        D --> F
      ```

      先用轻量方案处理大多数简单文档，质量不过关或检测到复杂版面再走重型方案，**兼顾速度和质量**。所有工具都包在同一个 `Parser` 接口后面，换工具不影响下游。
    scenarios: |
      - **内网部署的政企项目**：文档不能出网，选可完全本地运行的 Docling 或 MinerU，并确认没有默认调用远程服务。
      - **大量电子版制度 + 少量扫描附件**：主流程用 PyMuPDF，扫描页路由到 OCR 能力强的工具。
      - **快速 POC**：先用 MarkItDown 统一转 Markdown 跑通流程，再根据评测结果升级解析器。
    code: |
      ```python
      # 依赖：uv add docling pymupdf
      # 两种工具都包在同一个接口后面，下游只认 Markdown 文本（实际项目输出 Block 列表）
      from pathlib import Path


      def parse_light(path: Path) -> str:
          import pymupdf                      # PyMuPDF：快，适合电子版 PDF
          doc = pymupdf.open(path)
          return "\n\n".join(page.get_text() for page in doc)


      def parse_heavy(path: Path) -> str:
          from docling.document_converter import DocumentConverter   # Docling：版面、表格更强
          result = DocumentConverter().convert(str(path))
          return result.document.export_to_markdown()


      def parse_pdf(path: Path) -> str:
          text = parse_light(path)
          if len(text.strip()) < 50:          # 几乎没抽到字：可能是扫描件，换重型解析
              text = parse_heavy(path)
          return text
      ```
    pitfalls: |
      - **只看工具官网的效果演示就选型**：一定要用自己的文档实测。
      - **忽略许可证**：AGPL 组件用于商业闭源产品可能有合规风险，要提前确认。
      - **默认调用云端 API 而不自知**：涉密文档被发到外部服务，要确认处理位置。
      - **直接把工具输出当最终结构**：不同工具输出格式不同，应映射到自己的 Block 模型，换工具才不会牵动下游。
      - **所有文档都走重型解析**：入库速度慢一个数量级，资源成本高。
    interview_asks:
      - question: "你们用什么工具解析 PDF？为什么选它？"
        answer: "按部署约束选。能出网、版式复杂可以用效果好的解析服务；不能出网就用可内网部署的解析器，扫描件再加本地 OCR。选型看自己的样本集，不看宣传。"
      - question: "内网部署、文档不能出网的项目，解析工具怎么选？"
        answer: "解析必须在内网完成，不能把 PDF 传到外部 API。选能本地跑的解析和 OCR。效果不够就在内网加人工校对流程，而不是为了效果把文件送出去。"
      - question: "如果要换解析工具，怎么保证下游不受影响、效果不变差？"
        answer: "新工具仍输出原来的统一文档结构。拿同一批文件对比文字、标题和页码，再跑检索评测。通过后才切换。不要让切片代码依赖某个工具的私有字段。"
    project_example: |
      **p1 企业知识库问答**的解析策略：电子版制度用 PyMuPDF 快速抽取；质量检查发现空页或检测到表格密集时，改走 Docling（或 MinerU）重新解析；所有解析器实现同一个 `Parser` 接口并输出 Block 列表。
      选型依据写进项目文档：20 份样本文档的实测结果（表格还原、扫描件识别、耗时），以及许可证和是否本地处理的确认。
      面试时你可以说：「我们没有一刀切用最重的工具，而是分层路由，在入库速度和解析质量之间做了权衡」。
    freshness: |
      核对于 2026-11：
      - MinerU 最新为 4.2.1（2026-11-11）；4.0 起提供 Flash、Basic、Standard、Advanced 多档解析模式，支持 PDF、图片、Office、OFD、EPUB、HTML、CSV 等输入，默认本地处理、不自动上传文档；3.1.0 起许可证从 AGPLv3 改为基于 Apache 2.0 的 MinerU Open Source License；4.1 起要求 Python 3.11~3.14，HTTP API 有不兼容调整。
      - Docling 为 2.150.0，MIT 许可证，Python 3.10 及以上，支持本地和离线环境运行。
      - unstructured 开源版为 0.27.37（Apache-2.0），partition_pdf 有 auto、fast、hi_res、ocr_only 策略。
      - PyMuPDF 2.1 为 AGPL 3.0 或 Artifex 商业许可双授权，to_markdown 可处理多栏和阅读顺序。
      这些工具版本迭代很快，选型前请以各自官方文档和 PyPI 为准。
    sources:
      - {title: "MinerU 官方文档", url: "https://opendatalab.github.io/MinerU/"}
      - {title: "MinerU Changelog", url: "https://opendatalab.github.io/MinerU/reference/changelog/"}
      - {title: "Docling on PyPI", url: "https://pypi.org/project/docling/"}
      - {title: "Unstructured - Partitioning", url: "https://docs.unstructured.io/open-source/core-functionality/partitioning"}
test:
  - id: d22-t1
    kp: d22-k1
    type: single
    question: 为什么说「解析质量决定了 RAG 的效果上限」？
    options:
      - "解析阶段会直接决定生成模型的参数量和推理能力"
      - "解析丢掉的内容和结构，后面的检索和生成都无法凭空补回"
      - "解析越慢，后面的检索就越准确"
      - "只要解析做得好，就不需要切片和向量化"
    answer: [1]
    explain: |
      RAG 是一条流水线，解析在最上游：扫描页没 OCR、表格被拍平、阅读顺序错乱，这些内容在库里就是缺失或错误的，后面的切片、检索、重排、生成都只能在错的数据上工作。
      A 解析与模型参数无关；C 速度和准确率没有因果关系；D 解析只是第一步，后面的环节仍然必要。
  - id: d22-t2
    kp: d22-k1
    type: multi
    question: 设计统一的 Block 文档模型时，以下哪些字段对后续环节有明确价值？
    options:
      - "block_type，用于切片时区别对待表格和段落"
      - "heading_path，用于给 chunk 加章节前缀和展示出处"
      - "page，用于回答时给出页码引用"
      - "原始文件的字体名称，用于提升检索准确率"
      - "order，用于按阅读顺序取相邻块补上下文"
    answer: [0, 1, 2, 4]
    explain: |
      block_type 影响切片规则（表格不能拦腰切）；heading_path 是切片前缀和引用展示的来源；page 是引用定位的基础；order 让你能取前后相邻块。
      D 字体名称对检索没有帮助，字号可能被版面分析用来判断标题，但不需要作为 Block 的业务字段存下来。
  - id: d22-t3
    kp: d22-k1
    type: judge
    question: 判断上传文件的类型时，读取文件头的魔数比只看扩展名更可靠。
    answer: true
    explain: |
      正确。用户经常把 .doc 改名成 .docx、把图片改名成 .pdf，只看扩展名会路由到错误的解析器，导致报错或输出乱码。
      文件头魔数反映的是真实格式，例如 PDF 以 `%PDF` 开头，docx 本质是 zip 包。
  - id: d22-t4
    kp: d22-k1
    type: single
    question: 某批文档入库后，后台显示全部「成功」，但用户问其中一份文档的内容总是答不出。以下哪项质量检查最能提前发现这个问题？
    options:
      - "检查文件名是否包含中文字符"
      - "检查文件大小是否超过 10MB"
      - "检查解析出的文本长度、空页率和 chunk 数"
      - "检查上传时间是否在工作时间内"
    answer: [2]
    explain: |
      「成功」却答不出，最常见的原因是解析出了空文本或极少文本（如扫描件没走 OCR），而任务只判断有没有抛异常。检查文本长度、空页率和 chunk 数，能把这类「静默失败」变成显式失败。
      文件名、大小、上传时间都与解析是否有效无关。
  - id: d22-t5
    kp: d22-k2
    type: single
    question: 一份 PDF 前 20 页是电子版正文，后 10 页附件是扫描的盖章文件。对整份文件抽取文本后总字数很多，系统据此判断「不需要 OCR」。这会导致什么问题？
    options:
      - "前 20 页会被重复 OCR，浪费资源"
      - "整份文件会因为格式混合而解析失败"
      - "向量维度会因为文本长度不同而不一致"
      - "附件的扫描页没有文本层，内容会在库里完全缺失"
    answer: [3]
    explain: |
      扫描件判断应该**逐页**进行：某页抽出字符很少但页面有图像内容，才判定为扫描页并单独 OCR。按整份文件判断，混合文件里的扫描页会被漏掉，附件里的内容在库里就是空的。
      A 恰好相反；B 混合文件不会直接失败；C 向量维度由模型决定，与文本长度无关。
  - id: d22-t6
    kp: d22-k2
    type: multi
    question: 以下哪些现象可能是 PDF 解析质量问题导致的？
    options:
      - "一个 chunk 里左右两栏的句子交错出现"
      - "问二线城市住宿标准，回答给出了一线城市的金额"
      - "很多不相关的 chunk 都因为包含公司名和「内部资料」而相似度偏高"
      - "生成模型输出速度变慢"
    answer: [0, 1, 2]
    explain: |
      A 是多栏阅读顺序错乱；B 是表格被拍平、行列关系丢失；C 是页眉页脚没去除，重复噪声让不相关的 chunk 彼此更像。
      D 输出速度与生成模型和输出长度有关，不是解析问题的典型症状。
  - id: d22-t7
    kp: d22-k2
    type: judge
    question: PDF 文件内部保存了段落、标题和表格结构，只是需要正确的库才能读出来。
    answer: false
    explain: |
      错误。PDF 是为打印设计的版面格式，内部主要记录「在什么坐标用什么字体画什么字」，通常不保存段落、标题、表格这些语义结构（带标签的 Tagged PDF 是少数情况）。
      所以解析工具要靠版面分析、字号、位置去**推断**结构，结果可能出错，需要抽检。
  - id: d22-t8
    kp: d22-k2
    type: judge
    question: 去除页眉页脚时，可以把在多数页面同一位置重复出现的文本行判定为页眉页脚。
    answer: true
    explain: |
      正确。这是常用的启发式方法：统计每页顶部、底部区域的文本，多数页重复出现的行（公司名、机密等级）就是页眉页脚，页码可用正则识别。
      要注意别误删正文里本来就重复的有效内容，最好只在页面边缘区域判断。
  - id: d22-t9
    kp: d22-k2
    type: single
    question: 《费用标准》里有一张按城市等级和职级划分的住宿标准表。为了让检索和回答准确，表格最好怎么处理？
    options:
      - "直接删掉表格，只保留正文段落，避免干扰"
      - "识别为表格 Block，还原行列结构，作为整体参与切片"
      - "把表格里的数字全部去掉，只保留表头文字"
      - "把表格截图后不做任何文字处理，直接存图片"
    answer: [1]
    explain: |
      表格里往往就是答案本身（金额、天数）。识别表格区域并还原为 Markdown 或 HTML 表格，保留行列对应关系，切片时作为整体，过长再按行拆分并重复表头。
      A、C 丢掉了答案；D 图片无法被文本检索命中，除非额外做 OCR 或描述。
  - id: d22-t10
    kp: d22-k3
    type: single
    question: 离线入库时对文本做了 NFKC 规范化（全角转半角），在线查询时没有做。用户输入全角的「ＶＰＮ」查询，最可能出现什么情况？
    options:
      - "关键词检索匹配不上半角的 VPN，相关文档可能检索不到"
      - "向量检索会直接报错，因为全角字符无法向量化"
      - "完全没有影响，模型会自动识别全角和半角"
      - "生成模型会拒绝回答包含全角字符的问题"
    answer: [0]
    explain: |
      文本规范化是离线和在线的「契约」之一。库里存的是半角 VPN，查询是全角 ＶＰＮ，关键词检索按字面匹配会失败，向量检索也可能受影响。
      B 全角字符可以向量化，不会报错；C 关键词检索不会自动识别；D 不会因此拒答。
  - id: d22-t11
    kp: d22-k3
    type: multi
    question: 以下哪些 metadata 字段能帮助解决「新旧版本制度同时被检索到」的问题？
    options:
      - "version"
      - "effective_date"
      - "status"
      - "bbox"
      - "block_type"
    answer: [0, 1, 2]
    explain: |
      version、effective_date、status 共同描述文档的版本和有效性，检索时加 `status = 'active'` 或按生效日期过滤，就能排除已废止的旧版本。
      bbox 是页面坐标，用于高亮定位；block_type 是块类型，用于切片规则，都与版本无关。
  - id: d22-t12
    kp: d22-k3
    type: judge
    question: 判断文件是否重复上传或是否被修改，使用文件名比使用内容哈希更可靠。
    answer: false
    explain: |
      错误。同名文件可能内容不同（新版本覆盖），不同名文件可能内容相同（重复上传改了名字）。
      应该用内容哈希（如 SHA-256）判断：哈希相同说明内容没变，可以跳过入库；哈希变了就重新入库并让旧 chunk 失效。
  - id: d22-t13
    kp: d22-k3
    type: single
    question: 清洗文本时，以下哪种做法最可能损害后续检索效果？
    options:
      - "把连续的多个空行合并成一个"
      - "去掉不可见的控制字符"
      - "统一全角半角字符"
      - "删除所有标点和条款编号中的点号"
    answer: [3]
    explain: |
      条款编号「3.2.1」去掉点号变成「321」，用户按条款号检索就匹配不上；标点也帮助切片判断句子边界。清洗要去噪，但不能删掉有信息量的结构。
      A、B、C 都是常规且安全的清洗操作。
  - id: d22-t14
    kp: d22-k4
    type: single
    question: 一个政府内网项目要求文档绝对不能出网，且大量资料是中文扫描件和复杂表格。以下哪个选型思路最合适？
    options:
      - "用 pypdf 抽取文本，扫描件内容丢了就算了"
      - "调用某云厂商的在线文档解析 API，效果最好"
      - "选择可完全本地部署、OCR 和表格能力强的工具，并确认不默认调用远程服务"
      - "全部人工录入，不使用任何解析工具"
    answer: [2]
    explain: |
      两个硬约束：不能出网、扫描件和表格多。应选择 MinerU、Docling 这类可本地运行、OCR 与版面能力强的工具，并核实配置里没有默认调用远程服务。
      A 无法处理扫描件；B 违反不出网要求；D 成本不可接受。
  - id: d22-t15
    kp: d22-k4
    type: single
    question: 下面的解析函数用于入库。它的设计意图是什么？
    code: |
      def parse_pdf(path):
          text = parse_light(path)      # PyMuPDF 抽取
          if len(text.strip()) < 50:
              text = parse_heavy(path)  # Docling 版面分析加 OCR
          return text
    lang: python
    options:
      - "先用轻量工具，几乎没抽到文字时再换重型工具"
      - "把两个工具的解析结果拼接在一起，提高召回率"
      - "用重型工具的输出来校验轻量工具的结果是否正确"
      - "根据文件体积大小选择不同的解析工具，大文件走重型"
    answer: [0]
    explain: |
      这是分层路由：大多数电子版 PDF 用轻量工具很快就能处理；文本几乎为空时多半是扫描件，再交给带 OCR 和版面分析的重型工具。
      注意这里只用了「文本长度」一个信号，实际项目还应逐页判断，并检测表格、多栏等复杂版面。B、C、D 都与代码逻辑不符。
  - id: d22-t16
    kp: d22-k4
    type: multi
    question: 为商业项目选择 PDF 解析工具时，以下哪些因素需要考虑？
    options:
      - "用自己的样本文档实测表格、扫描件、多栏的解析质量"
      - "许可证是否允许在商业产品中使用"
      - "是否完全本地处理，会不会默认把文件发到云端"
      - "GitHub 星数是否最多，星数最多的效果一定最好"
      - "批量入库时的速度和资源占用"
    answer: [0, 1, 2, 4]
    explain: |
      质量、许可证、数据安全、速度资源都是实打实的选型维度，例如 PyMuPDF 是 AGPL 或商业双许可，商用闭源要注意。
      D 星数反映流行度，但不代表在你的文档类型上效果最好，必须实测。
  - id: d22-t17
    kp: d22-k4
    type: judge
    question: 把各个解析工具的原始输出直接传给切片模块，比先映射到自己定义的 Block 模型更利于后期更换工具。
    answer: false
    explain: |
      错误。不同工具的输出格式差别很大，切片模块直接依赖某个工具的输出，换工具就要改下游代码。
      先映射到自己的 Block 模型，下游只依赖这一个结构，换解析工具只需要写一个新的适配器，这是策略模式和依赖倒置的思路。
exam:
  - id: d22-e1
    kp: d22-k1
    type: single
    question: 设计多格式文档解析模块时，以下哪种架构最利于扩展和维护？
    options:
      - "所有格式统一用一个函数，用大量 if-else 分支处理每种格式"
      - "每种格式一个解析器，都输出同一种 Document 和 Block 结构，下游只依赖这个结构"
      - "所有文件先转成图片，统一走 OCR"
      - "每种格式单独建一套切片和检索流程"
    answer: [1]
    explain: |
      策略模式：PdfParser、DocxParser、TextParser 实现同一个接口，输出统一的 Block 模型。新增格式只需加一个解析器，下游切片、检索代码不用改。
      A 难以维护；C 电子版文档本来有文字，全部 OCR 又慢又会引入识别错误；D 重复建设，代码爆炸。
  - id: d22-e2
    kp: d22-k2
    type: single
    question: 一份技术白皮书是双栏排版。入库后发现很多 chunk 读起来前言不搭后语，一句话说到一半就跳到另一个话题。最可能的原因是？
    options:
      - "Embedding 模型对技术文档效果不好"
      - "切片大小设置得太小"
      - "生成模型的温度设置过高"
      - "解析时没有识别分栏，按坐标从上到下抽取导致两栏交错"
    answer: [3]
    explain: |
      双栏 PDF 如果简单地按 y 坐标从上到下抽取，左栏第一行会和右栏第一行拼在一起，句子交错。应在版面分析时先划分栏，再按栏输出阅读顺序。
      A 不会导致文本本身错乱；B 切片小会断章，但不会让句子交错；C 与入库文本无关。
  - id: d22-e3
    kp: d22-k3
    type: single
    question: 公司发布了 2025 版考勤制度，旧的 2023 版文件仍在库里。员工提问时，回答有时引用旧版条款。最根本的治理方式是？
    options:
      - "入库时记录版本、生效日期和状态，旧版标记失效，检索时只取有效版本"
      - "在 Prompt 里告诉模型「请优先使用最新制度」"
      - "把 Top-K 调大，让新旧版本都进入上下文由模型判断"
      - "直接删除向量库里所有旧数据，重新入库所有文件"
    answer: [0]
    explain: |
      版本问题要在数据层解决：metadata 里有 version、effective_date、status，新版本入库时把旧版标记为 archived，检索 SQL 带上状态过滤，模型根本看不到旧版本。
      B 模型并不知道哪段是新的；C 新旧都给模型反而更容易混用；D 代价大且无法防止下次再发生（还可能丢失需要追溯的历史版本）。
  - id: d22-e4
    kp: d22-k4
    type: single
    question: 团队想把 PDF 解析从 PyMuPDF 换成 Docling。为了确保切换后效果没有变差，最关键的做法是？
    options:
      - "直接全量切换，用户没投诉就说明没问题"
      - "比较两个工具的 GitHub 星数和更新频率"
      - "用固定的样本文档和评测问题集，对比切换前后的解析结果和检索命中率"
      - "只在新上传的文档上用 Docling，旧文档保持不变"
    answer: [2]
    explain: |
      换解析工具会影响整个下游，必须用数据验证：固定一批代表性文档（含表格、扫描件、多栏）和对应的问题集，对比解析质量和检索命中率，确认变好再全量切换并重建索引。
      A 用户不投诉不代表没变差；B 与你的文档效果无关；D 新旧两套解析结果混在一起，问题更难排查。
  - id: d22-e5
    kp: d22-k2
    type: multi
    question: 关于扫描件 PDF 的处理，以下哪些说法正确？
    options:
      - "应逐页检测是否有文本层，而不是只判断整份文件"
      - "OCR 结果中的金额、日期需要重点抽检"
      - "OCR 识别准确率已经是 100%，不需要质量检查"
      - "扫描页可以通过抽出字符很少、但页面有图像内容来识别"
      - "扫描件可以直接按电子版 PDF 处理，结果只是字少一点"
    answer: [0, 1, 3]
    explain: |
      A 混合文件要逐页判断；B OCR 可能把「0」认成「O」、「己」认成「已」，数字类内容错一个字回答就错；D 是常用的扫描页识别方法。
      C OCR 不可能 100% 准确；E 扫描件没有文本层，按电子版处理会得到空文本。
  - id: d22-e6
    kp: d22-k3
    type: multi
    question: 以下哪些 metadata 字段在入库时缺失，后期往往只能全量重新解析入库才能补上？
    options:
      - "每个块所在的页码 page"
      - "每个块所属的章节路径 heading_path"
      - "检索时使用的 Top-K 参数"
      - "每个块在页面上的坐标 bbox"
      - "生成模型的 temperature"
    answer: [0, 1, 3]
    explain: |
      页码、章节路径、坐标都只在解析时才能获得，事后只靠切好的文本无法还原，缺了就只能重新解析。
      Top-K 和 temperature 是在线查询参数，随时可以调整，与入库无关。
  - id: d22-e7
    kp: d22-k1
    type: judge
    question: 解析结果应该落盘保存（如存成 JSON），这样用户反馈答错时，可以回头查看解析出来的内容是否正确。
    answer: true
    explain: |
      正确。解析中间产物是排查入库问题的关键证据：答错时先看原文和解析结果是否一致，就能判断是不是解析阶段的问题。
      解析结果存档还能在更换切片策略时直接复用，不用重新跑耗时的解析。
  - id: d22-e8
    kp: d22-k4
    type: judge
    question: 为了保证解析质量，最好所有文档都统一使用效果最强的重型解析工具，不需要轻量工具。
    answer: false
    explain: |
      错误。重型工具（版面模型、OCR）速度慢、资源占用高，大量简单的电子版文档用轻量工具就能得到很好的结果。
      更务实的做法是分层路由：简单文档走轻量工具，质量检查不过或检测到复杂版面再走重型工具。
  - id: d22-e9
    kp: d22-k2
    type: case
    question: |
      p1 企业知识库上线后，员工问「去上海出差住宿标准是多少」，系统回答「600 元」，但实际上海属于一线城市，制度规定是 800 元。
      你查看解析结果，发现《差旅费管理办法》第 5 页的住宿标准表被解析成了一行：「城市等级 一线城市 二线城市 三线城市 住宿标准 800 600 450」。检索日志显示这个 chunk 确实排在第 1 位。
      最合理的根因判断和改进方向是？
    options:
      - "生成模型数学能力差，换一个更强的模型就能算对"
      - "检索层问题，应该加入关键词检索让「上海」被精确匹配"
      - "切片太大，应该把切片大小调小到每个 chunk 只有一句话"
      - "表格被拍平导致行列对应关系丢失，应改用带表格识别的解析并输出结构化表格"
    answer: [3]
    explain: |
      检索已经把正确 chunk 排在第 1 位，说明检索没问题；问题是这个 chunk 里的表格被拍平成一串文字，「一线城市」和「800」的对应关系丢了，模型只能猜。
      根因在解析层：应使用带版面和表格识别的工具，把表格还原为 Markdown 或 HTML 表格，保留行列关系；并在评测集中加入表格类问题回归验证。A 换模型也无法从丢失的结构里恢复对应关系；B 检索已命中；C 切小会让表格更碎。
interview:
  - id: d22-i1
    kp: d22-k2
    type: scenario
    difficulty: 2
    question: 业务方说「知识库对表格里的内容总是答错」，比如问报销标准、补贴金额经常张冠李戴。你会怎么排查和优化？
    key_points:
      - {text: "先确认问题层级：检索是否命中表格所在 chunk，再看解析结果里表格结构是否保留", dim: principle}
      - {text: "说出表格常见问题：拍平丢失行列关系、跨页表格断开、合并单元格错位", dim: concept}
      - {text: "优化手段：表格识别还原为 Markdown 或 HTML、表格作为整体切片、超长按行拆分并重复表头", dim: engineering}
      - {text: "用专门的表格类问题集对比优化前后的命中率和正确率", dim: project}
    reference: |
      **第一步：确认是哪一层的问题。** 收集 20 个表格类答错的问题，看检索日志：
      - 表格所在 chunk 没被检索到 → 检索问题，可能是表格被拍平后语义很弱，或者被切碎了。
      - 检索到了但答错 → 看这个 chunk 的原文，大概率是解析问题。

      **第二步：检查解析结果。** 对照原 PDF 看解析出来的表格，常见三种问题：
      1. **拍平**：表格变成一行文字，「一线城市」和「800」的对应关系丢失。
      2. **跨页断开**：表头在上一页，数据在下一页，下一页的 chunk 没有表头。
      3. **合并单元格错位**：数据对到了错误的行或列。

      **第三步：优化。**
      - 解析：换用带表格识别能力的工具（Docling、MinerU 等），输出 Markdown 或 HTML 表格，保留行列结构。
      - 切片：表格作为独立块，不和正文混切；超长表格按行拆分，每段都重复表头。
      - 检索：给表格 chunk 加上标题路径和表格标题前缀，比如「差旅费管理办法 / 住宿标准表」。

      **第四步：验证。** 建一个表格类问题集，对比优化前后的检索命中率和回答正确率，用数字向业务方汇报。
    oral: |
      我会先确认是哪一层的问题。捞出二十个表格类答错的问题看检索日志，如果表格所在 chunk 都检索到了还答错，基本就是解析问题。
      然后对照原 PDF 看解析结果，最常见的是表格被拍平成一行字，城市和金额对不上；还有跨页表格下半部分没有表头。
      优化上，我会换成有表格识别能力的解析工具，把表格输出成 Markdown 表格，切片时整张表作为一块，太长就按行拆并且每段重复表头，再加上表格标题做前缀。
      最后用一套专门的表格问题集对比优化前后的正确率，拿数据给业务方看。
  - id: d22-i2
    kp: d22-k1
    type: design
    difficulty: 3
    question: 请设计一个企业知识库的文档解析模块，要支持 PDF、Word、TXT，包括扫描件，并且能让运营人员知道哪些文档解析出了问题。
    key_points:
      - {text: "统一 Document 和 Block 模型，按文件头识别类型路由到不同解析器", dim: principle}
      - {text: "PDF 逐页判断文本层，扫描页走 OCR，复杂版面分层路由到重型工具", dim: engineering}
      - {text: "设计质量闸门：空页率、乱码率、chunk 数为零判失败，结果落盘可对照", dim: engineering}
      - {text: "异步任务化、逐文件记录状态和失败原因，失败可单独重试", dim: engineering}
      - {text: "结合项目说明运营后台如何展示解析状态和原文对照", dim: project}
    reference: |
      **整体结构：**
      - 上传接口只做校验和登记，写一条解析任务，返回任务 id；后台 Worker 异步执行（见 Day 09）。
      - 按**文件头魔数**识别真实类型，路由到 `PdfParser`、`DocxParser`、`TextParser`，都实现 `parse(file) -> Document`，输出统一的 Block 列表（类型、文本、页码、章节路径、坐标、顺序）。

      **各格式要点：**
      - **PDF**：逐页判断有无文本层；有文本层的用轻量工具抽取，检测到表格密集或多栏时走带版面分析的工具；扫描页走 OCR。去除页眉页脚。
      - **Word**：读段落样式（标题级别）、列表和表格，直接得到结构。
      - **TXT**：先检测编码（UTF-8 或 GBK），按空行切段。

      **质量闸门：**
      - 空页率超过阈值 → 自动转 OCR 通道重试。
      - 乱码率高 → 标记失败，提示检查编码。
      - 最终 chunk 数为 0 → 判失败，不能显示成功。

      **可观测性：**
      - 每个文件一条状态记录：待解析、解析中、成功、失败（附原因）、需人工处理。
      - 解析结果以 JSON 落盘，运营后台提供「原文 / 解析结果」对照页，可单独重试失败文件。
      - 统计解析成功率、平均耗时、OCR 占比，作为看板指标。
    oral: |
      我会把解析做成异步任务：上传接口只登记文件、写任务，后台 Worker 去解析。
      解析器按文件头识别真实类型路由，PDF、Word、TXT 各一个解析器，但都输出统一的 Block 列表，带类型、页码和章节路径，下游只认这个结构。
      PDF 我会逐页判断有没有文本层，扫描页走 OCR，表格多或者双栏的走带版面分析的工具。
      最重要的是质量闸门：空页率高自动转 OCR，chunk 数为 0 直接判失败，绝不显示成功。每个文件都有状态和失败原因，运营后台能看原文和解析结果的对照，失败的可以单独重试。
  - id: d22-i3
    kp: d22-k4
    type: scenario
    difficulty: 3
    question: 你们的知识库原来用 PyMuPDF 解析 PDF，现在有人提议全部换成某个效果更好的开源解析工具。作为负责人，你怎么评估和推进这件事？
    key_points:
      - {text: "先用固定样本文档和问题集量化对比，而不是看演示", dim: project}
      - {text: "评估维度：表格、扫描件、多栏质量，速度资源，许可证，是否本地处理", dim: concept}
      - {text: "通过统一的 Parser 接口和 Block 模型隔离变化，支持分层路由而非一刀切", dim: engineering}
      - {text: "切换涉及全量重新解析和重建索引，要规划灰度、回滚和成本", dim: engineering}
    reference: |
      **第一步：明确要解决的问题。** 先看现在的 bad case 里有多少是解析导致的（表格、扫描件、多栏），如果解析问题占比很小，换工具收益有限。

      **第二步：量化对比。** 挑 30~50 份代表性文档（电子版制度、扫描件、表格密集、双栏），用两种工具分别解析，对比：
      - 解析质量：表格还原、OCR 准确率、阅读顺序（人工抽检打分）。
      - 下游效果：用同一套问题集测检索命中率和答案正确率。
      - 成本：单份文档耗时、CPU 或 GPU 和内存占用，估算全量重跑时间。
      - 合规：许可证是否允许商用，是否完全本地处理。

      **第三步：架构上隔离变化。** 新工具实现同一个 `Parser` 接口，输出统一的 Block 模型。很可能结论是**分层路由**：简单电子版继续用 PyMuPDF，复杂版面和扫描件用新工具。

      **第四步：灰度切换。** 先对一个知识库或一类文档重新解析入库，新旧索引并存对比一周，确认指标提升再全量重建；保留旧索引作为回滚方案。
    oral: |
      我不会因为演示效果好就直接全量换。先看现在答错的问题里，解析导致的占多少，占比小的话换工具收益不大。
      然后挑几十份代表性文档，包括扫描件、表格、双栏，两个工具都跑一遍，对比解析质量、下游检索命中率和答案正确率，同时看速度、资源、许可证和是否本地处理。
      架构上新工具接到同一个 Parser 接口后面，很可能最后是分层路由，简单文档还用 PyMuPDF，复杂的才走新工具。
      切换要重新解析和重建索引，我会先灰度一个知识库，新旧对比一周，指标确实提升再全量，并保留旧索引方便回滚。
