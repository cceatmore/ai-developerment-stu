  - title: "OWASP Multi-Tenant Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html"
    kind: doc
    lang: en
    minutes: 25
    note: "看 Tenant Context、Database Isolation（RLS 与 SET LOCAL 的连接池陷阱）、Caching、Logging 四节，对应 k3 与 k4；末尾的测试清单可以直接改成你项目的跨租户回归用例"
