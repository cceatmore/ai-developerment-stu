day: 46
phase: 5
title: 鉴权与多租户：JWT 与刷新令牌、RBAC 与资源级授权、租户隔离、审计日志
goals:
  - 能写出一份完整的 JWT 校验清单，说清双令牌、轮换与重用检测怎么解决「JWT 无法吊销」
  - 能区分 401 / 403 / 404，并把「功能级权限 + 对象级权限」都落到后端，而不是只靠前端隐藏按钮
  - 能设计一个多租户 AI 平台的隔离方案：租户上下文从哪来、数据库 RLS 怎么兜底、缓存/向量/队列/配额怎么隔离
  - 能说清审计日志和应用日志、Trace 的区别，并为 Agent 工具调用设计审计字段
minutes: 75
resources:
  - title: "FastAPI 官方中文文档：OAuth2 实现密码哈希与 Bearer JWT 令牌验证"
