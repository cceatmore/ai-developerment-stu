  - title: "Python 官方教程（中文）第 9 章 类"
    url: "https://docs.python.org/zh-cn/3/tutorial/classes.html"
    kind: doc
    lang: zh
    minutes: 20
    note: "看 9.2 作用域和命名空间（LEGB、nonlocal、global 的示例）和 9.3.5 类和实例变量（共享列表的反例），正好对应闭包和类属性两个坑"
  - title: "mypy - Type hints cheat sheet"
    url: "https://mypy.readthedocs.io/en/stable/cheat_sheet_py3.html"
    kind: doc
    lang: en
    minutes: 15
    note: "当作 TS 到 Python 的类型速查表：看 Useful built-in types、Functions、Classes 三节；Forward references 一节的说法在 Python 3.14 起已部分过时（注解改为延迟求值）"
