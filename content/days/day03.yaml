day: 3
phase: 1
title: 函数、类与类型注解
goals:
  - 能读懂位置参数、关键字参数、仅限关键字参数、*args / **kwargs，并指出可变默认参数和「定义时求值」导致的 bug
  - 能用 LEGB 规则解释闭包、UnboundLocalError 和循环里 lambda 的延迟绑定
  - 能判断类属性与实例属性的共享关系，用 dataclass 定义数据对象并正确处理可变默认值
  - 能把 TS 类型对照成 Python 类型注解，并说清注解「不在运行时强制」以及 Pydantic 为什么能用它做校验
minutes: 60
resources:
