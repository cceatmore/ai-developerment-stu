day: 30
phase: 3
title: 企业知识库架构：整体链路、权限隔离、数据更新与性能成本（阶段总结）
goals:
  - 能画出企业知识库的入库、查询、评测运维三条链路，并把 Day 21~29 的内容放进对应位置
  - 能讲清 ACL 为什么必须在检索阶段由服务端过滤，并用 PostgreSQL RLS 做纵深防御，识别缓存、预览等旁路泄露
  - 能设计文档增量同步、版本切换、删除传播和 Embedding 模型更换的方案
  - 能拆解一次问答的延迟和成本，给出缓存与降本方案，并说清缓存的权限风险
