knowledge_points:
  - id: d30-k1
    name: 整体架构：三条链路与分层排障（RAG 阶段总结）
    level: P0
    summary: 企业知识库由入库、查询、评测运维三条链路组成；出问题时按链路和层次定位，而不是一上来就换模型
    analogy: |
      **像前端工程的「构建时 + 运行时 + CI」**：入库链路 ≈ 构建打包（解析、切块、向量化，离线做、可以慢）；查询链路 ≈ 运行时请求（要快、要稳）；评测运维 ≈ CI 和线上监控。

      **不一样的地方**：前端构建产物是确定的，知识库的「产物」（切块、向量、权限元数据）**质量会直接决定回答对错**，而且源文档会持续变化，入库链路要一直运转。
    why: |
      RAG 阶段学了很多零散技术：解析、切块、向量库、混合检索、Rerank、引用、评测。面试官最后一定会问「整体架构怎么设计」「效果不好怎么排查」。
      能把这些技术放到一张图里、说清每一环出问题的症状，是从「会做 Demo」到「能负责系统」的分水岭。
    problem: |
      - 技术点都知道，但讲不出它们在系统里怎么串起来。
      - 回答错了不知道从哪查，只会改 Prompt 或换模型。
      - 入库、查询、评测各自为政，改了一环不知道对其他环节的影响。
    principle: |
      **一、三条链路**

      ```mermaid
      flowchart TB
        subgraph ING["入库链路 异步"]
          S1["数据源 网盘 Wiki OA"] --> S2["同步与变更检测"]
          S2 --> S3["解析 清洗 元数据 ACL"]
          S3 --> S4["切块 父子块"]
          S4 --> S5["Embedding 与 BM25 索引"]
        end
        subgraph QRY["查询链路 实时"]
          Q1["鉴权 生成权限过滤条件"] --> Q2["改写与指代消解"]
          Q2 --> Q3["混合检索 带过滤"]
          Q3 --> Q4["RRF 融合 与 Rerank"]
          Q4 --> Q5["Prompt 组装 生成 引用校验 拒答"]
        end
        subgraph OPS["评测与运维链路"]
          O1["评测集 回归门禁"]
          O2["Trace 监控 告警"]
          O3["反馈回流"]
        end
        S5 --> Q3
        Q5 --> O2
        O3 --> O1
      ```

      **二、Day 21~29 的位置**

      | 链路 | 环节 | 对应内容 |
      |---|---|---|
      | 入库 | 解析与元数据 | Day 22 |
      | 入库 | 切块、父子块 | Day 23 |
      | 入库 / 查询 | 向量库、HNSW、元数据过滤 | Day 24 |
      | 查询 | 混合检索、RRF、Top-K | Day 25 |
      | 查询 | Rerank、改写、指代消解、HyDE | Day 26 |
      | 查询 | Prompt 组装、引用、拒答 | Day 27 |
      | 查询（进阶） | Agentic RAG、检索纠正 | Day 28 |
      | 评测 | 检索与生成指标、评测集 | Day 29 |
      | 横切 | 权限、更新、性能成本 | 今天 |

      **三、分层排障：先看 Trace，再定位层**

      | 症状 | 先看哪里 | 常见根因 |
      |---|---|---|
      | 答案引用作废制度 | 检索结果的版本元数据 | 入库没标版本或查询没过滤现行版本 |
      | 表格数字答错 | 解析结果原文 | 表格被解析成乱序文本（Day 22） |
      | 正确片段没召回 | 召回 Top-50 | 切块断开、缺关键词路、Embedding 不适配 |
      | 召回到了但没进 Prompt | Rerank 后 Top-5 | 重排或截断问题 |
      | 资料对但答错或编造 | Prompt 与回答 | 组装顺序、编号映射、拒答约束 |
      | 看到无权内容 | 过滤条件与缓存键 | ACL 未在检索阶段生效或缓存旁路 |

      **原则**：每次请求记录改写后的查询、各路召回、Rerank 分数、最终 Prompt 片段 ID、引用与耗时（Day 43）。**有 Trace 才能定位，有评测集才能确认修好且没有引入新问题。**
    scenarios: |
      - **系统设计面试**：先画三条链路，再按面试官追问展开权限、更新、成本。
      - **线上投诉排查**：拿请求 ID 调出 Trace，按上表逐层检查。
      - **新知识库接入**：先跑入库链路、抽查解析和切块质量，再补该知识库的评测样本，最后开放查询。
    pitfalls: |
      - **入库放在请求里同步做**：上传大文件时接口超时，应走任务队列（Day 09）。
      - **没有 Trace**：只能猜是哪一环出错。
      - **只盯查询链路**：很多「检索不准」其实是解析和元数据质量问题。
      - **误区：效果不好先换更强的大模型。** 多数问题出在数据、检索和组装环节，换模型成本高且治标不治本。
    interview_asks:
      - question: "请画出你的企业知识库整体架构，并说说各模块的职责。"
        answer: "入库一条线：解析、切片、嵌入、索引。问答一条线：权限、检索、重排、生成、引用。旁边是评测和日志。模型负责组织语言，权限和是否有依据由代码决定。"
      - question: "RAG 回答错了，你的排查思路是什么？"
        answer: "按入库、检索、生成三层看日志。先确认正文进库了，再确认正确切片被检到并放进提示，最后看模型是否只用了这些切片。一次只修一层，然后回归评测。"
    project_example: |
      p1 企业知识库问答到今天形成完整闭环：入库链路用任务队列异步执行解析、切块、向量化（文档状态在前端实时展示）；查询链路是鉴权 → 改写 → 混合检索 → Rerank → 带引用生成与拒答 → SSE 流式返回；评测链路由 Day 29 的评测脚本和回归门禁组成。
      每个请求有 Trace ID，管理后台可以按 ID 查看各环节结果。面试时拿这张架构图讲，并准备【填你排查过的一个真实问题及其所在环节】。
  - id: d30-k2
    name: 权限隔离：检索阶段的 ACL 过滤、RLS 纵深防御与旁路泄露
    level: P0
    summary: 权限过滤条件由服务端按登录身份生成，在检索时生效；数据库层再用 RLS 兜底；缓存、预览、历史等旁路同样要带权限
    analogy: |
      **像前端的 `v-permission` 权限指令**：它只能把按钮藏起来，真正能不能调用接口，**必须由后端校验**——否则用户打开开发者工具直接发请求就绕过了。
      RAG 也一样：「让模型别说」「前端不展示」都只是隐藏按钮，**ACL 必须在服务端检索时过滤**，无权的片段根本不该被取出来。

      **不一样的地方**：前端越权通常是拿到一条数据；RAG 里无权片段一旦进入 Prompt，**模型可能把它总结、改写后说出来**，连引用都不带，更难发现和追责。
    why: |
      企业知识库最严重的事故不是答错，而是越权泄露：普通员工问出了薪酬、人事、未公开的财务信息。权限设计是企业 RAG 面试的必考题，也是安全评审一票否决的环节。
      作为前端负责人，你对「前端隐藏不等于安全」有天然理解，能讲清它在 RAG 里的对应形式会很加分。
    problem: |
      - **后过滤**：先检索 Top-K 再按权限剔除，结果可能所剩无几，甚至开发者忘了剔除就进了 Prompt。
      - **信任客户端参数**：过滤条件里的部门、租户来自请求体，用户改个参数就越权。
      - **旁路**：检索结果缓存、引用预览链接、对话历史、日志、摘要都可能绕过权限。
    principle: |
      **一、权限在哪一层生效**

      ```mermaid
      flowchart LR
        U["用户请求 带登录令牌"] --> A["服务端鉴权 解析租户 部门 用户组"]
        A --> F["生成过滤条件 不接受客户端传入"]
        F --> R["检索 向量与关键词两路都带过滤"]
        R --> DB["数据库 RLS 兜底"]
        DB --> P["只有有权片段进入 Prompt"]
        P --> C["引用预览 再次校验权限"]
      ```

      - **预过滤**：过滤条件在检索时生效，向量检索和关键词检索**两路都要带**；
      - 片段入库时就带上 `tenant_id`、`allowed_groups`、`classification` 等 ACL 元数据（Day 22）；
      - 文档 ACL 变化时要同步更新片段元数据，撤权要尽快生效。

      **二、近似向量索引 + 过滤的坑（pgvector）**

      - pgvector 的 HNSW 索引是先按索引扫描取候选（默认 `hnsw.ef_search = 40`），**再应用 WHERE 过滤**；过滤条件很严格时，可能返回远少于 K 条。
      - 应对：0.8.0 起支持**迭代索引扫描**（`hnsw.iterative_scan`）在结果不足时继续扫描；按租户做**列表分区或分表**；对少数固定过滤值建**部分索引**。
      - 这是性能与召回问题，不是安全问题——过滤本身仍然生效，只是可能召回不足。

      **三、RLS：数据库层的纵深防御**

      ```sql
      ALTER TABLE chunks ENABLE ROW LEVEL SECURITY;
      ALTER TABLE chunks FORCE ROW LEVEL SECURITY;      -- 表所有者默认可绕过 RLS，需 FORCE
      CREATE POLICY tenant_isolation ON chunks
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);
      ```

      要点：
      - 开启 RLS 但**没有任何策略时默认拒绝**；
      - **超级用户和带 BYPASSRLS 的角色总是绕过**，应用连接要用普通角色；
      - `current_setting(..., true)` 在未设置时返回 NULL，条件不成立 → 查不到数据，**未设置即拒绝**；
      - 连接池里要用**事务级**设置（`SET LOCAL` 或 `set_config(..., true)`），否则租户值会残留到下一个复用这条连接的请求。

      **四、旁路泄露清单**

      | 旁路 | 风险 | 对策 |
      |---|---|---|
      | 检索或回答缓存 | 键只含问题文本，A 部门结果给了 B 部门 | 缓存键包含租户、权限组摘要、索引版本 |
      | 引用预览与下载 | 链接可被转发 | 打开时再次鉴权，用短时效签名链接 |
      | 对话历史 | 撤权后历史中仍有旧内容 | 历史回看时按当前权限处理引用 |
      | 摘要、GraphRAG 社区报告 | 混合了不同权限文档 | 按权限边界分别生成 |
      | 日志与 Trace | 存了完整片段 | 脱敏、限制查看权限 |
      | 提示注入 | 文档里写「忽略权限」 | 权限不靠 Prompt，靠代码与数据库（Day 45） |
    scenarios: |
      - **多租户 SaaS**：租户之间必须完全隔离，`tenant_id` 预过滤 + RLS + 按租户分区。
      - **集团内部门隔离**：HR、财务文档仅限对应用户组，`allowed_groups` 与用户组求交集。
      - **密级文档**：机密文档只对特定角色可见，引用预览时再校验并加水印。
    code: |
      ```python
      SEARCH_SQL = """
      SELECT id, doc_id, page, text, embedding <=> $1 AS dist
      FROM chunks
      WHERE allowed_groups && $2::text[]          -- 用户组与文档可见组有交集
        AND status = 'active'
      ORDER BY embedding <=> $1
      LIMIT $3
      """

      async def search_chunks(pool, user, query_vec, k: int = 50):
          async with pool.acquire() as conn:
              async with conn.transaction():           # 事务结束后设置自动失效，不污染连接池
                  await conn.execute("SELECT set_config('app.tenant_id', $1, true)", str(user.tenant_id))
                  return await conn.fetch(SEARCH_SQL, query_vec, user.group_ids, k)
          # tenant_id 与 group_ids 都来自服务端解析的登录身份，绝不读取请求体
      ```
    pitfalls: |
      - **误区：在 System Prompt 里告诉模型「不要透露无权内容」就够了。** 模型不是权限边界，片段进了 Prompt 就可能被说出来。
      - **后过滤**：检索 Top-K 后再剔除，召回不足且容易漏剔。
      - **只给向量路加过滤，忘了关键词路**。
      - **应用用表所有者或超级用户连接**：RLS 被绕过而不自知。
      - **连接池中用会话级 SET**：租户值残留，下一个请求查到别人的数据。
      - **缓存键不含权限范围**：最隐蔽的越权来源。
    interview_asks:
      - question: "企业知识库怎么做权限控制？为什么不能检索后再过滤？"
        answer: "检索时就要带上这个人能看的文档条件，没权限的根本不进候选。事后过滤会把名额占满，滤完所剩无几，也容易在日志或提示里露出标题。权限条件进查询，不进模型。"
      - question: "除了检索过滤，还有哪些地方可能泄露无权数据？"
        answer: "提示日志、引用标题、重排服务拿到的原文、缓存的答案、错误信息里的片段。这些都要按同一权限处理。缓存 key 里必须有用户或权限范围。"
      - question: "多租户场景下你怎么保证数据隔离？"
        answer: "每行有租户 id，查询强制带上，数据库行级安全再挡一层。租户 id 来自登录态，不来自模型或前端参数。缓存、队列、文件路径也同样加租户。"
    project_example: |
      p1 模块 30 的权限部分：文档上传时继承所属空间的 `allowed_groups`，片段入库写入 `tenant_id`、`allowed_groups`、`status`；查询时从 JWT 解析出用户组生成过滤条件，向量和关键词两路都带；`chunks` 表开启 RLS 并 FORCE，应用使用普通角色连接，每个事务用 `set_config` 设置租户。
      引用预览接口单独鉴权，检索缓存键包含租户、用户组摘要和索引版本。评测集中的越权样本必须全部被拒，【填你的越权样本数和测试结果】。
      前端用 `v-permission` 只控制按钮显隐，面试时可以用这个对比讲清「前端隐藏 ≠ 安全」。
    freshness: |
      核对于 2026-11：PostgreSQL 当前文档（18）说明，开启 RLS 且无策略时默认拒绝；表所有者通常绕过 RLS，可用 `ALTER TABLE ... FORCE ROW LEVEL SECURITY` 使其受约束；超级用户和带 BYPASSRLS 属性的角色总是绕过；外键等参照完整性检查也会绕过 RLS，存在隐蔽信道风险。
      pgvector 0.8.7 README 说明：近似索引下过滤在索引扫描之后执行（HNSW 默认 `ef_search` 为 40），条件严格时可能返回较少结果；0.8.0 起提供 `hnsw.iterative_scan`（strict_order / relaxed_order）与 `hnsw.max_scan_tuples`；租户隔离建议使用列表分区或分表。
    sources:
      - {title: "PostgreSQL Docs - Row Security Policies", url: "https://www.postgresql.org/docs/current/ddl-rowsecurity.html"}
      - {title: "pgvector README", url: "https://github.com/pgvector/pgvector"}
  - id: d30-k3
    name: 数据更新与版本：增量同步、版本切换、删除传播与重建索引
    level: P0
    summary: 文档会新增、修改、删除和改版；要用内容哈希做增量同步，新版本就绪后原子切换，删除要传播到所有索引和缓存
    analogy: |
      **像前端发布的「带哈希文件名 + 最后切 index.html」**：新版静态资源全部上传完成，才把入口切到新版本；用户不会看到一半新一半旧。
      文档改版也是：新版本切块、向量化全部完成，再一次性把它标为现行版本、旧版本下线。

      **不一样的地方**：前端发布几分钟，知识库重建可能要几小时、花不少 Embedding 费用；删除还要像 CDN 刷新一样，**传播到向量索引、关键词索引和各级缓存**。
    why: |
      「制度已经更新了，助手还在引用旧版」「文件删了还能搜到」是企业知识库上线后最常见的投诉，后者还可能是合规事故。
      面试官问「文档更新怎么处理」，答「重新入库」是不够的，要讲清增量、原子切换、删除传播和模型升级。
    problem: |
      - 每次全量重建，费用高、耗时长，期间检索结果不稳定。
      - 新旧版本同时可检索，回答引用了作废版本。
      - 删除只删了数据库记录，向量索引、关键词索引、缓存里还有。
      - 更换 Embedding 模型后，新旧向量混在一起不可比。
    principle: |
      **一、文档生命周期**

      ```mermaid
      stateDiagram-v2
        [*] --> Pending: 检测到新文档或内容哈希变化
        Pending --> Processing: 任务队列取出
        Processing --> Ready: 解析 切块 向量化完成
        Processing --> Failed: 解析或向量化失败
        Failed --> Pending: 重试
        Ready --> Active: 原子切换为现行版本
        Active --> Superseded: 新版本切换为现行
        Active --> Deleted: 源文档删除或撤回
        Superseded --> Deleted: 超过保留期
        Deleted --> [*]
      ```

      **二、增量同步**

      - 对每个文档记录**内容哈希**（以及来源系统的修改时间），只有哈希变化才重新处理；
      - 有条件时可以做到 chunk 级：未变化的片段复用原向量，节省 Embedding 费用；
      - 来源系统支持变更通知（Webhook）就用通知，否则定时扫描。

      **三、版本切换**

      1. 新版本在后台处理为 `Ready`，此时**不参与检索**；
      2. 一个事务里把新版本置为 `Active`、旧版本置为 `Superseded`；
      3. 检索默认只查 `Active`；需要「历史版本对比」时显式指定。
      4. 有生效日期的制度：存 `effective_from`，检索条件加 `effective_from <= 今天`，「下月生效」的新版本不会提前被引用。

      **四、删除传播**：向量表、关键词索引、父块存储、检索与回答缓存、预览文件都要删除或失效；用一个删除任务统一处理并记录完成状态，失败要重试和告警。

      **五、更换 Embedding 模型：蓝绿索引**

      - 不同模型的向量**不在同一空间**，不能混用；
      - 新建一套索引全量回填 → 用评测集对比新旧索引的检索指标 → 切换读流量 → 观察后下线旧索引；
      - 回填期间新增文档要**双写**两套索引。
    scenarios: |
      - **制度改版**：新版处理完成后在生效日自动切换为现行版本，旧版保留供对比查询。
      - **合规删除**：员工离职、合同撤回，要求 24 小时内彻底不可检索。
      - **Embedding 升级**：蓝绿索引切换，评测集通过后才切读流量。
    pitfalls: |
      - **边删边建**：重建期间旧片段已删、新片段未就绪，出现空窗期。
      - **只删数据库记录**：向量、关键词索引和缓存里还在。
      - **新旧 Embedding 混用**：相似度失去意义，召回大幅下降。
      - **误区：文档改了直接覆盖旧片段就行，不需要版本概念。** 无法回溯、无法对比，也无法处理「下月生效」。
    interview_asks:
      - question: "知识库文档更新、删除后，你怎么保证检索结果及时一致？"
        answer: "更新写出新版本切片和向量，生效后再把旧版本标失效。删除要删掉切片、向量和对象存储里的文件。不能只删了文件留下向量。任务失败要能重试，状态要可见。"
      - question: "更换 Embedding 模型时你怎么迁移？"
        answer: "新旧向量不能放在一个索引里比。全量用新模型重嵌入到新列或新表，评测通过后切换查询，再删旧数据。切换窗口内在线问答仍走旧索引。"
    project_example: |
      p1 的 `documents` 表记录 `content_hash / version / status / effective_from`，同步任务只处理哈希变化的文档；新版本处理完成后在一个事务里切换为 `active`，检索只查现行版本。
      删除走统一任务：删向量与关键词索引、清检索缓存、删预览文件，并在管理后台展示删除进度。
      前端文档列表用 SSE 展示「待处理 / 处理中 / 已就绪 / 现行 / 失败」状态，失败可一键重试。
  - id: d30-k4
    name: 性能与成本：延迟拆解、缓存设计与降本
    level: P1
    summary: 先按环节拆解 P95 延迟和单次成本，再针对最大头优化；缓存能省很多，但键必须包含权限范围和索引版本
    analogy: |
      **像前端性能优化看瀑布图**：先找最长的那一段，而不是到处微调。
      缓存键要带权限，就像 HTTP 缓存要设 `Vary: Authorization`——不然 CDN 会把 A 用户的私有页面缓存给 B 用户。

      **不一样的地方**：前端接口耗时通常稳定，RAG 里大头往往是**LLM 调用**（改写、生成首 Token），且按 Token 计费，延迟和费用是一起优化的。
    why: |
      Demo 阶段没人关心几秒一次、几分钱一次；上线后并发一高，延迟和费用就是业务方最关心的指标。
      面试中「延迟太高怎么优化」「成本怎么降」是系统设计题的标准追问，能给出拆解数据和分层方案，比泛泛说「加缓存」有说服力得多。
    problem: |
      - P95 延迟太高，不知道时间花在哪。
      - 每次都改写、都 Rerank 50 条、都塞满上下文，费用随调用量线性上涨。
      - 加了缓存后出现越权或返回过期内容。
    principle: |
      **一、延迟拆解**（示意，实际以你的 Trace 为准）

      | 环节 | 主要耗时来源 | 优化手段 |
      |---|---|---|
      | 改写与指代消解 | 一次 LLM 调用 | 独立问题跳过改写；用小模型 |
      | 查询 Embedding | 一次模型调用 | 缓存；本地部署 |
      | 混合检索 | 数据库查询 | 两路并行；索引与分区 |
      | Rerank | 候选数 × 文档长度 | 控制候选数与截断长度 |
      | 生成首 Token | 输入 Token 量 | 减少上下文；Prompt 缓存；流式输出 |

      **二、缓存分层**

      ```mermaid
      flowchart TB
        Q["请求"] --> E["Embedding 缓存 键 文本哈希 加 模型版本"]
        E --> R["检索结果缓存 键 查询 加 租户 加 权限组摘要 加 索引版本"]
        R --> P["Prompt 缓存 稳定前缀放在最前"]
        P --> A["回答缓存 仅限公共低风险问题"]
      ```

      - **Embedding 缓存**：同一文本 + 同一模型版本结果确定，最安全；
      - **检索结果缓存**：键必须包含权限范围和索引版本，文档更新或撤权后要失效；
      - **Prompt 缓存**（Day 19）：System Prompt 等稳定内容放最前，变化的资料和问题放后面，才能命中供应商的前缀缓存；
      - **回答缓存 / 语义缓存**：风险最高——相似问题不等于相同问题、权限和时效都可能不同，只用于公共 FAQ 并设短过期。

      **三、降本手段**

      1. **模型路由**：改写、分类用小模型，生成用主模型（Day 19）；
      2. **减少输入 Token**：Top-K 和截断由评测确定，不盲目塞满；
      3. **按需执行**：独立问题跳过改写，高分时跳过补救检索；
      4. **入库降本**：增量同步、chunk 级复用向量。

      **四、单次成本估算**：单次成本 ≈ 各次 LLM 调用的（输入 Token × 输入单价 + 输出 Token × 输出单价）+ Embedding + Rerank 调用费。把它和日均调用量相乘，就是业务方最关心的月度费用。全局的性能与成本治理见 Day 47。
    scenarios: |
      - **P95 超标**：Trace 显示改写占 600ms，对不含指代的问题跳过改写，P95 明显下降。
      - **费用超预算**：把改写换成小模型、Top-K 从 10 降到 5，用评测集确认正确率不降。
      - **高频 FAQ**：公共制度问答启用短期回答缓存，按索引版本失效。
    pitfalls: |
      - **缓存键只有问题文本**：跨部门、跨租户返回结果，造成越权。
      - **文档更新不失效缓存**：继续返回旧版本内容。
      - **Prompt 里把变化内容放前面**：前缀缓存永远命不中。
      - **误区：语义缓存能大幅降本，所有问题都可以用。** 「我能报多少」对不同职级答案不同，语义相近不代表答案相同。
      - **只优化平均延迟**：用户感知的是 P95 和首 Token 时间。
    interview_asks:
      - question: "RAG 的延迟主要花在哪？你怎么优化？"
        answer: "拆开看检索、重排、首字、生成。常见是检索了太多次、重排候选太多、提示太长。对症减少调用、缓存 Embedding 和重复问题、缩短证据。先有拆分数据再优化。"
      - question: "你会在 RAG 里加哪些缓存？要注意什么？"
        answer: "可以缓存查询的 Embedding、检索结果和完全相同问题的答案。key 要包含租户、权限、文档版本和模型版本。文档更新要能失效。不能把一个人的答案缓存给另一个人。"
    project_example: |
      p1 模块 30 的部署部分：Docker Compose 部署 API、Worker、PostgreSQL（pgvector）、Redis；Trace 中记录每个环节耗时和 Token 数，管理后台展示 P95 与日费用。
      缓存用 Redis：Embedding 按文本哈希 + 模型版本缓存；检索结果按查询 + 租户 + 用户组摘要 + 索引版本缓存，文档切换版本时递增索引版本使旧缓存自然失效；不做回答缓存。
      面试时说【填你优化前后的 P95 与单次成本】。
test:
  - id: d30-t1
    kp: d30-k1
    type: single
    question: 用户反馈助手引用了已经作废的 2023 版差旅制度。排查时最应该先检查哪里？
    options:
      - "生成模型的温度是否设置得过高"
      - "命中片段的版本元数据与现行版本过滤"
      - "前端引用卡片是否展示了正确的标题"
      - "Rerank 模型是否需要换成更大的版本"
    answer: [1]
    explain: |
      引用作废版本通常是入库时没标版本状态，或查询时没过滤现行版本。先看 Trace 中命中片段的版本元数据即可定位。
      A、C 与版本无关；D 即使换了 Rerank，作废版本仍在候选里。
  - id: d30-t2
    kp: d30-k1
    type: multi
    question: 下列哪些环节属于企业知识库的「入库链路」？
    options:
      - "文档同步与内容变更检测"
      - "解析、清洗并写入 ACL 等元数据"
      - "切块与向量化、建立关键词索引"
      - "文档处理失败后的重试"
      - "对用户问题做指代消解"
    answer: [0, 1, 2, 3]
    explain: |
      A~D 都是把源文档变成可检索数据的离线步骤，属于入库链路。
      E 发生在用户提问时，属于查询链路。
  - id: d30-t3
    kp: d30-k1
    type: judge
    question: 为了让用户上传文档后立刻能问答，应该在上传接口中同步完成解析、切块和向量化，处理完再返回响应。
    answer: false
    explain: |
      大文件的解析和向量化可能需要几十秒到几分钟，同步执行会导致接口超时、占用 Web 进程。应放入任务队列异步处理，前端通过状态接口或 SSE 展示处理进度。
  - id: d30-t4
    kp: d30-k1
    type: single
    question: 某问题的回答错误，团队第一反应是换更强的生成模型。按分层排障的思路，正确的第一步是？
    options:
      - "直接换成更强的模型，再看效果是否改善"
      - "修改 System Prompt，加入更多回答约束"
      - "把 Top-K 从 5 调到 20，让模型看更多资料"
      - "调出 Trace，逐层检查改写、召回、重排和最终 Prompt"
    answer: [3]
    explain: |
      不定位就改动，既可能无效，也可能引入新问题。Trace 能看出正确资料在哪一环丢失或被误用，再对症修改并用评测集验证。
      A、B、C 都是未经定位的盲改。
  - id: d30-t5
    kp: d30-k2
    type: single
    question: 某系统先做向量检索取 Top-10，再按用户权限剔除无权片段。这种做法的主要问题是？
    options:
      - "剔除后可能召回不足，且漏剔时无权片段会进入 Prompt"
      - "向量检索要多扫描一遍，整体速度会明显变慢"
      - "剔除之后的结果无法再送入 Rerank 重新排序"
      - "按权限剔除会改变向量分布，导致 Embedding 失效"
    answer: [0]
    explain: |
      后过滤有两个问题：召回不足（Top-10 里有 8 条无权，只剩 2 条），以及安全依赖于「记得剔除」这一步。应在检索时预过滤，并用数据库 RLS 兜底。
      B、C、D 与后过滤无关。
  - id: d30-t6
    kp: d30-k2
    type: single
    question: 下面的检索接口有什么安全问题？
    code: |
      @app.post("/api/search")
      async def search(req: SearchRequest, user=Depends(current_user)):
          vec = await embed(req.query)
          return await store.search(
              vec, k=10,
              filter={"tenant_id": user.tenant_id, "dept": req.dept},
          )
    options:
      - "embed 应该改为同步调用"
      - "k=10 太小，召回不足"
      - "dept 来自请求体，用户可改为其他部门绕过权限"
      - "tenant_id 应该从请求体读取以便支持多租户"
    answer: [2]
    explain: |
      过滤条件中的部门来自客户端，用户改一个参数就能检索其他部门的文档。所有权限相关条件都应从服务端解析的登录身份获取。
      A 错，异步调用是正确写法；B 是效果问题；D 恰好相反，会让租户隔离失效。
  - id: d30-t7
    kp: d30-k2
    type: multi
    question: 即使检索阶段做了正确的 ACL 过滤，下列哪些地方仍可能泄露无权内容？
    options:
      - "检索结果缓存的键只包含问题文本"
      - "引用预览链接打开时不再校验权限"
      - "日志中保存了完整片段且所有开发者都能查看"
      - "跨多份不同权限文档生成的汇总摘要"
      - "前端使用 Vue 而不是 React"
    answer: [0, 1, 2, 3]
    explain: |
      A 导致不同权限用户共享结果；B 链接可被转发；C 日志成为泄露通道；D 摘要混合了无权文档信息。
      E 与数据权限无关。
  - id: d30-t8
    kp: d30-k2
    type: judge
    question: 在 PostgreSQL 中，表的所有者默认不受该表 RLS 策略约束，需要执行 FORCE ROW LEVEL SECURITY 才会受约束；超级用户和带 BYPASSRLS 属性的角色则总是绕过 RLS。
    answer: true
    explain: |
      这是 PostgreSQL 官方文档的说明。因此应用不应使用表所有者或超级用户连接数据库，并对关键表执行 FORCE，避免 RLS 形同虚设。
  - id: d30-t9
    kp: d30-k2
    type: single
    question: 用 pgvector 的 HNSW 索引按 `tenant_id` 过滤检索小租户的数据，经常只返回 2~3 条而不是 LIMIT 10。原因和合理对策是？
    options:
      - "小租户的数据被 RLS 拦截了，应关闭 RLS"
      - "HNSW 不支持 WHERE 条件，应改用全表精确扫描"
      - "LIMIT 写得不对，应改为 LIMIT 100"
      - "过滤在索引扫描之后执行，候选中该租户很少；可开启迭代扫描或按租户分区"
    answer: [3]
    explain: |
      HNSW 先按 ef_search 取一批近邻候选再过滤，小租户在候选中占比低，过滤后就不足 K 条。pgvector 0.8.0 起支持迭代索引扫描，官方也建议用列表分区或分表做租户隔离。
      A 关闭 RLS 会破坏安全；B 错，支持 WHERE 只是先扫后滤；C 只调 LIMIT 解决不了候选数不足。
  - id: d30-t10
    kp: d30-k2
    type: single
    question: 应用通过连接池访问开启了 RLS 的表，用 `current_setting('app.tenant_id')` 区分租户。设置租户的正确方式是？
    options:
      - "每次获取连接后执行会话级 SET app.tenant_id，用完不用管"
      - "在事务内用 SET LOCAL 或 set_config(..., true) 设置，事务结束自动失效"
      - "在数据库全局配置中写死 app.tenant_id"
      - "让前端在请求头里传租户 ID，直接拼进 SQL"
    answer: [1]
    explain: |
      连接会被不同请求复用，会话级设置会残留到下一个请求，造成跨租户访问；事务级设置在事务结束时自动失效。
      C 无法区分租户；D 信任客户端且有 SQL 注入风险。
  - id: d30-t11
    kp: d30-k3
    type: single
    question: 知识库每晚同步网盘中的 5 万份文档，大多数文档没有变化。最合理的增量同步方式是？
    options:
      - "按内容哈希判断，只重新处理哈希变化的文档"
      - "每晚全量删除所有片段，再重建全部索引"
      - "只按文件名判断，文件名没变就直接跳过"
      - "每晚随机抽取 10% 的文档重新解析处理"
    answer: [0]
    explain: |
      内容哈希能准确识别内容是否变化，避免对未变化文档重复付费。
      B 成本高且重建期间检索不稳定；C 文件名不变但内容可能已修改；D 无法保证变更被处理。
  - id: d30-t12
    kp: d30-k3
    type: multi
    question: 源系统中一份文档被删除后，知识库需要同步处理哪些位置？
    options:
      - "向量表中该文档的所有片段"
      - "关键词检索索引中的对应条目"
      - "检索结果缓存与回答缓存中引用该文档的内容"
      - "引用预览用的文件副本与父块存储"
      - "所有用户的登录会话"
    answer: [0, 1, 2, 3]
    explain: |
      A~D 都是该文档内容可能残留并被检索或展示的位置，漏掉任何一处都会出现「删了还能搜到」。
      E 与文档删除无关，强制登出所有用户没有必要。
  - id: d30-t13
    kp: d30-k3
    type: judge
    question: 更换 Embedding 模型时，只需对新增文档使用新模型，旧文档保留原向量即可，检索可以正常混用。
    answer: false
    explain: |
      不同模型的向量位于不同的向量空间，维度甚至可能不同，混用时相似度没有意义。应新建一套索引全量回填，用评测集验证后再切换读流量。
  - id: d30-t14
    kp: d30-k3
    type: single
    question: 一份制度发布了新版本。为了避免检索出现「一半新一半旧」或空窗期，正确的处理顺序是？
    options:
      - "先删除旧版本所有片段，再开始处理新版本"
      - "新旧版本同时设为现行，让模型自己判断哪个新"
      - "新版本处理完成且不参与检索，再在一个事务中切换为现行并下线旧版本"
      - "边处理新版本边逐条替换旧片段"
    answer: [2]
    explain: |
      新版本先在后台处理到就绪状态，再原子切换，检索始终只看到一个完整版本。
      A 和 D 都会出现空窗或新旧混杂；B 把版本判断交给模型，容易引用作废版本。
  - id: d30-t15
    kp: d30-k4
    type: single
    question: 为检索结果加 Redis 缓存，下列哪种缓存键设计最合理？
    options:
      - "原始问题文本的哈希值"
      - "问题文本哈希 + 用户 ID + 会话 ID"
      - "问题文本哈希 + 当前日期 + 模型名"
      - "查询 + 租户 + 权限组摘要 + 索引版本"
    answer: [3]
    explain: |
      权限组摘要保证不同权限的用户不会共享结果；索引版本保证文档更新后旧缓存自然失效；同权限用户仍可共享缓存。
      A 会造成越权；B 安全但几乎无法复用，且文档更新后不失效；C 不能区分权限，也不能及时反映文档更新。
  - id: d30-t16
    kp: d30-k4
    type: multi
    question: Trace 显示 P95 延迟主要来自改写调用和生成首 Token。下列哪些优化是合理的？
    options:
      - "对不含指代、本身完整的问题跳过改写"
      - "改写使用更小更快的模型"
      - "用评测集确定更小的 Top-K，减少输入 Token"
      - "把稳定的 System Prompt 放在最前，利用供应商的前缀缓存"
      - "关闭引用校验以节省时间"
    answer: [0, 1, 2, 3]
    explain: |
      A、B 降低改写耗时；C、D 减少或加速生成前的输入处理，降低首 Token 时间。
      E 引用校验通常耗时很小，关掉它会削弱可信度，属于错误的取舍。
  - id: d30-t17
    kp: d30-k4
    type: judge
    question: 语义缓存（相似问题直接返回缓存答案）可以安全地用于企业知识库的所有问题，从而大幅降低成本。
    answer: false
    explain: |
      相似问题不等于相同问题：「我能报多少差旅费」对不同职级答案不同；权限范围、文档版本也会变化。语义缓存只适合公共、低风险的 FAQ，并且要按权限和索引版本隔离、设短过期时间。
  - id: d30-t18
    kp: d30-k4
    type: single
    question: 估算发现单次问答成本中，生成调用的输入 Token 占了大头。最直接有效的降本方向是？
    options:
      - "把生成模型的输出长度限制为 50 个 Token"
      - "用评测集确定更小的 Top-K 和片段截断长度，减少注入的资料量"
      - "取消检索，直接让模型回答"
      - "把 Embedding 模型换成更大的模型"
    answer: [1]
    explain: |
      输入 Token 主要来自注入的资料，在不降低正确率的前提下减少资料量最直接。
      A 针对的是输出而非输入，还会截断回答；C 会导致大量编造；D 与生成输入 Token 无关，还会增加入库成本。
exam:
  - id: d30-e1
    kp: d30-k2
    type: single
    question: 企业知识库中，ACL 权限控制最关键应该落在哪一层？
    options:
      - "前端根据用户角色隐藏敏感问题的输入入口"
      - "在 System Prompt 中要求模型不要回答无权内容"
      - "检索时由服务端按登录身份生成过滤条件，并由数据库 RLS 兜底"
      - "生成回答后用关键词正则过滤敏感词"
    answer: [2]
    explain: |
      权限必须在无权数据进入 Prompt 之前拦住。服务端按身份生成过滤条件是主防线，RLS 是数据库层兜底。
      A 只是隐藏入口；B 模型不是权限边界；D 事后过滤挡不住模型改写后的表述。
  - id: d30-e2
    kp: d30-k3
    type: single
    question: 新版考勤制度已发布，将于下月 1 日生效。员工今天询问考勤规定，系统应如何保证回答依据当前有效的制度？
    options:
      - "片段带生效日期元数据，检索条件只取生效日期不晚于今天的现行版本"
      - "新版发布后立即替换旧版，所有回答都用新版"
      - "两个版本都检索，让模型自己判断用哪个"
      - "等到下月 1 日再上传新版文档"
    answer: [0]
    explain: |
      用 effective_from 过滤能让新版到期自动生效，不需要人工卡时间上传。
      B 会提前引用尚未生效的规定；C 把版本判断交给模型不可靠；D 依赖人工操作，容易遗漏且无法提前准备。
  - id: d30-e3
    kp: d30-k4
    type: single
    question: 某系统 P95 延迟 4.2 秒，Trace 显示：改写 900ms、Embedding 60ms、混合检索 120ms、Rerank 300ms、生成首 Token 1.8s、生成剩余 1s。优先优化哪两项收益最大？
    options:
      - "Embedding 和混合检索"
      - "Rerank 和 Embedding"
      - "混合检索和生成剩余部分"
      - "改写和生成首 Token"
    answer: [3]
    explain: |
      改写与首 Token 合计约 2.7 秒，是最大的两段；可对完整问题跳过改写或换小模型，并通过减少输入 Token、前缀缓存降低首 Token 时间。
      其他环节耗时较小，优化收益有限；生成剩余部分在流式输出下对用户感知影响较小。
  - id: d30-e4
    kp: d30-k1
    type: single
    question: Trace 显示某问题 Rerank 后的 Top-5 中第 1 条就是正确片段，但最终回答仍然错误。问题最可能在哪一环？
    options:
      - "文档解析环节，表格被解析成了乱序文本"
      - "Prompt 组装或生成环节，如编号错位或资料被截断"
      - "混合检索的关键词路没有命中专有名词"
      - "Embedding 模型选型不适配中文制度文本"
    answer: [1]
    explain: |
      正确片段已经排在第一，说明检索和重排没问题，应检查组装后的 Prompt 是否真的包含它、编号是否对应、生成是否遵循资料。
      A、C、D 都在检索之前，与这个症状不符。
  - id: d30-e5
    kp: d30-k2
    type: multi
    question: 关于用 PostgreSQL RLS 做多租户纵深防御，下列说法正确的有？
    options:
      - "表开启 RLS 但没有任何策略时，普通角色默认查不到任何行"
      - "应用应使用普通角色连接，避免使用超级用户或带 BYPASSRLS 的角色"
      - "用 current_setting 的 missing_ok 参数，未设置租户时条件不成立，查询返回空"
      - "有了 RLS 就可以不在检索 SQL 中写租户过滤条件"
      - "RLS 会让向量检索自动变成精确检索"
    answer: [0, 1, 2]
    explain: |
      A 是默认拒绝；B 防止 RLS 被绕过；C 让「忘记设置」也安全失败。
      D 错：应用层过滤与 RLS 是两道防线，显式条件还有助于查询计划；E 与 RLS 无关。
  - id: d30-e6
    kp: d30-k3
    type: multi
    question: 用「蓝绿索引」方式更换 Embedding 模型时，合理的步骤包括哪些？
    options:
      - "新建一套索引，用新模型全量回填"
      - "回填期间新增或修改的文档同时写入新旧两套索引"
      - "用评测集对比新旧索引的检索指标"
      - "指标达标后切换读流量，观察一段时间再下线旧索引"
      - "直接在原索引上逐条覆盖为新向量"
    answer: [0, 1, 2, 3]
    explain: |
      A~D 构成完整的蓝绿切换：并行建设、双写保持一致、评测验证、可回退地切换。
      E 会在覆盖过程中新旧向量混杂，检索结果失真且无法回退。
  - id: d30-e7
    kp: d30-k2
    type: judge
    question: 用户被移出某用户组后，除了更新片段的 ACL 元数据，还需要让包含该权限范围的检索缓存失效，否则撤权不能及时生效。
    answer: true
    explain: |
      缓存中可能保存着按旧权限检索出的结果。缓存键包含权限组摘要时，用户组变化会生成新的键；同时也要清理或缩短相关缓存的有效期，保证撤权及时生效。
  - id: d30-e8
    kp: d30-k4
    type: judge
    question: 为了提高供应商的 Prompt 缓存命中率，应把每次都会变化的检索资料放在 System Prompt 的最前面。
    answer: false
    explain: |
      前缀缓存要求请求开头的内容保持一致，应把稳定的 System Prompt、工具定义放在最前，把变化的资料和问题放在后面。变化内容放最前会让缓存几乎永远命不中。
  - id: d30-e9
    kp: d30-k2
    type: case
    question: |
      某企业知识库上线一个月后，财务部员工反馈：自己问「本季度预算调整方案」时，回答中引用了一份人事部的内部文件，而他并没有该文件的权限。
      排查发现：检索 SQL 中权限过滤正确，但系统新加了检索结果缓存，缓存键是「改写后查询文本的哈希」。人事部员工此前问过几乎相同的问题。
      最合理的处理方案是？
    options:
      - "关闭整个问答系统，所有知识库改为人工查询"
      - "在 System Prompt 中要求模型不要引用其他部门的文件"
      - "清空缓存，缓存键加入租户、权限组摘要与索引版本，并把越权样本补进回归评测"
      - "让前端隐藏来自其他部门的引用卡片"
    answer: [2]
    explain: |
      根因是缓存键不含权限范围，让不同权限的用户共享了检索结果。应立即清空缓存止血，修正缓存键，并把这类场景加入评测集的越权类别，防止再犯；同时排查日志评估影响范围。
      A 过度反应；B 模型不是权限边界；D 只是隐藏，回答正文仍可能包含无权内容。
interview:
  - id: d30-i1
    kp: d30-k2
    type: scenario
    difficulty: 3
    question: 安全团队接到报告：一名普通员工在知识库助手里问出了部分高管薪酬信息。你作为系统负责人，怎么应急、排查根因并防止再次发生？
    key_points:
      - {text: "应急止血：下线相关知识库或功能、清空缓存、保留日志与 Trace 证据、评估影响范围", dim: engineering}
      - {text: "按链路排查：过滤条件来源、向量与关键词两路、缓存键、引用预览、历史与摘要、RLS 是否被绕过", dim: principle}
      - {text: "说清 ACL 原则：检索阶段服务端预过滤，RLS 兜底，模型不是权限边界", dim: concept}
      - {text: "修复后加越权样本进回归门禁，越权类要求全部拒绝，并定期审计", dim: project}
      - {text: "权限同步机制：文档 ACL 与用户组变更及时同步到片段元数据与缓存", dim: engineering}
    reference: |
      **1. 应急**：先关闭涉及该文档的检索（或下线相关知识库），清空检索与回答缓存；保留该请求的 Trace、日志作为证据；按日志排查还有哪些请求命中过该文档，评估影响范围并同步安全团队。
      **2. 排查根因**（按可能性逐项检查）：
      - 过滤条件是否来自服务端身份，有无读取请求参数；
      - 向量和关键词两路是否都带了过滤；
      - 该文档的 ACL 元数据是否正确（入库时继承错了、权限变更后未同步）；
      - 缓存键是否包含权限范围；
      - 引用预览、对话历史、汇总摘要是否绕过权限；
      - 应用连接角色是否绕过了 RLS（表所有者未 FORCE、使用了超级用户）。
      **3. 修复与预防**：主防线是检索阶段的服务端预过滤，RLS 兜底；缓存键包含租户、权限组摘要和索引版本；预览接口单独鉴权；ACL 变更触发片段元数据和缓存更新。把这次的问题样本和同类越权样本补进评测集，越权类必须 100% 拒绝才允许上线，并定期做权限审计。
    oral: |
      第一步是止血：先停掉涉及这份文档的检索，清空缓存，同时把这次请求的 Trace 和日志保留下来，查还有谁命中过，评估影响范围并同步安全团队。
      然后按链路排查：过滤条件是不是从服务端身份来的，向量和关键词两路是不是都加了过滤，这份文档入库时的权限元数据对不对，缓存键里有没有权限范围，预览和历史有没有绕过，数据库连接是不是用了能绕过 RLS 的角色。
      修复后的原则是检索阶段服务端过滤为主、RLS 兜底，绝不靠模型守权限。最后把越权样本加进回归门禁，必须全部拦住才能上线。我在项目里【填你的越权测试做法】。
  - id: d30-i2
    kp: d30-k3
    type: scenario
    difficulty: 3
    question: 业务方投诉两件事：「制度上周已经更新了，助手还在引用旧版」「有份文件已经删了，助手还能引用」。请分析可能原因，并设计一套文档更新与删除的同步方案。
    key_points:
      - {text: "分析原因：未检测到变更、新旧版本同时可检索、缓存未失效、删除未传播到所有索引", dim: principle}
      - {text: "增量同步：内容哈希或变更通知，失败重试与告警", dim: engineering}
      - {text: "版本管理：就绪后原子切换、只检索现行版本、生效日期过滤", dim: concept}
      - {text: "删除传播：向量、关键词索引、父块、缓存、预览文件统一处理并可追踪", dim: engineering}
      - {text: "可观测与验证：同步延迟监控、管理后台状态展示、版本冲突类评测样本", dim: project}
    reference: |
      **可能原因**：
      - 「引用旧版」：同步任务没检测到变更（只看文件名或修改时间）、新版处理失败没人发现、新旧版本同时可检索、检索缓存没失效；
      - 「删了还能引用」：只删了数据库记录，向量或关键词索引、缓存、预览文件还有残留。
      **方案**：
      1. **变更检测**：优先用源系统的变更通知，辅以定时扫描；按内容哈希判断是否变化。
      2. **处理与状态**：任务队列异步处理，文档状态 `Pending → Processing → Ready → Active`，失败重试并告警，管理后台展示。
      3. **版本切换**：新版本 Ready 后在一个事务中设为 Active、旧版本设为 Superseded，检索只查 Active；有生效日期的按 `effective_from <= 今天` 过滤。
      4. **删除传播**：统一删除任务处理向量、关键词索引、父块、缓存和预览文件，每一步记录完成状态。
      5. **缓存失效**：检索缓存键包含索引版本，版本切换或删除时递增，旧缓存自然失效。
      6. **验证**：监控「源系统变更到可检索」的同步延迟；评测集加入版本冲突类和已删除文档样本。
    oral: |
      这两个问题我会分开看。引用旧版，常见原因是同步没检测到变更、新版处理失败没人发现、新旧版本都能被检索，或者缓存没失效；删了还能引用，一般是只删了数据库记录，向量索引、关键词索引或者缓存里还有。
      方案上，变更检测用源系统通知加定时扫描，按内容哈希判断；处理走任务队列，状态在后台可见，失败告警。新版本处理完再在一个事务里切成现行，检索只查现行版本，有生效日期的再按日期过滤。删除用统一任务清理所有索引、缓存和预览文件，缓存键带索引版本，切换时自然失效。
      最后监控同步延迟，评测集里加版本冲突和已删除文档的样本。我在项目里【填你的同步方案和延迟数据】。
  - id: d30-i3
    kp: d30-k1
    type: design
    difficulty: 4
    question: 请从零设计一个服务万人规模企业的知识库问答系统（多部门、多种文档格式、权限复杂、制度频繁更新）。请说明整体架构、关键技术选型、权限与数据更新方案、评测与上线策略，以及性能成本控制。
    key_points:
      - {text: "三条链路架构：异步入库、实时查询、评测运维，并说明各环节职责", dim: concept}
      - {text: "检索质量：解析与元数据、父子块、混合检索加 RRF、Rerank、改写与指代消解、引用与拒答", dim: principle}
      - {text: "权限与更新：检索阶段 ACL 预过滤加 RLS、旁路防护、增量同步、版本原子切换、删除传播", dim: engineering}
      - {text: "评测与上线：分类评测集、分层指标、按类别门禁、灰度发布、Trace 与反馈回流", dim: project}
      - {text: "性能成本：延迟拆解、带权限的缓存、模型路由、Top-K 由评测决定、P95 与单次成本监控", dim: engineering}
    reference: |
      **1. 架构**：入库链路（同步 → 解析 → 元数据与 ACL → 切块 → 向量与关键词索引）走任务队列异步执行；查询链路（鉴权 → 改写 → 混合检索 → RRF → Rerank → 组装 → 生成 → 引用校验 → SSE 流式）；评测运维链路（评测集、回归门禁、Trace、监控告警、反馈回流）。
      **2. 检索质量**：版面感知解析，表格单独处理；父子块（小块检索、大块注入）；向量 + BM25 混合检索、RRF 融合；Cross-encoder Rerank 取前几条；多轮对话做指代消解；回答带编号引用并做服务端校验，资料不足时拒答。
      **3. 选型**：数据量在千万片段以内可用 PostgreSQL + pgvector，事务、权限、元数据过滤与业务数据统一，按租户或部门分区；规模更大或检索 QPS 很高时再评估专用向量库。模型按任务路由：改写用小模型，生成用主模型。
      **4. 权限**：片段携带 tenant、allowed_groups、密级；过滤条件由服务端身份生成，两路检索都带；RLS + FORCE 兜底，应用用普通角色、事务级设置租户；缓存键含权限范围，预览单独鉴权，日志脱敏。
      **5. 数据更新**：内容哈希增量同步，版本原子切换，生效日期过滤，删除统一传播；Embedding 升级用蓝绿索引。
      **6. 评测与上线**：评测集覆盖事实、多跳、表格、追问、无答案、越权、版本冲突；检索指标每次改动跑，LLM 评审指标合并前跑；越权类零容忍的分类门禁；先灰度一个部门再推广。
      **7. 性能成本**：Trace 记录各环节耗时与 Token；跳过不必要的改写、控制 Rerank 候选数与 Top-K、Prompt 前缀缓存、Embedding 与检索结果缓存；监控 P95、首 Token 时间与日费用。
    oral: |
      我会先画三条链路：入库异步走队列，负责解析、打元数据和权限、切块、建向量和关键词索引；查询链路是鉴权、改写、混合检索、Rerank、组装生成、引用校验，最后流式返回；第三条是评测和运维，包括评测集、门禁、Trace 和反馈回流。
      选型上，千万级片段以内我倾向 PostgreSQL 加 pgvector，权限、事务和元数据过滤都在一个库里，按部门分区。权限是重点：过滤条件由服务端身份生成，两路检索都带，RLS 兜底，缓存键带权限范围，预览单独鉴权。
      更新用内容哈希增量同步、版本原子切换、删除统一传播。上线前分类评测，越权必须全部拦住，先灰度一个部门。成本上靠 Trace 拆延迟，跳过不必要的改写、控制 Top-K、加带权限的缓存。我做的 p1 就是这个架构的缩小版，【填你的规模和关键指标】。
