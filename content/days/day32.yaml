day: 32
phase: 4
title: 手写 Agent 循环：ReAct 与终止条件
goals:
  - 能讲清 ReAct 中思考、行动、观察如何交替，以及观察为什么必须由代码填入真实结果
  - 能不用框架写出基于原生工具调用的最小 Agent 循环，说清消息怎么追加、tool_call_id 怎么配对
  - 能说清模型和代码各自负责什么，判断一段逻辑该放在 Prompt 里还是代码里
  - 能为循环设计最大步数、重复检测、预算、超时等终止条件和兜底，并能读代码找出缺失
minutes: 60
resources:
  - title: "Hello-Agents 第四章 智能体经典范式构建"
    url: "https://github.com/datawhalechina/hello-agents/blob/main/docs/chapter4/%E7%AC%AC%E5%9B%9B%E7%AB%A0%20%E6%99%BA%E8%83%BD%E4%BD%93%E7%BB%8F%E5%85%B8%E8%8C%83%E5%BC%8F%E6%9E%84%E5%BB%BA.md"
    kind: repo
    lang: zh
    minutes: 40
    note: "只看 4.2 ReAct（4.2.1~4.2.4）：它用文本格式加正则手写了 ReAct，4.2.4 的局限性和调试技巧值得细读；对照今天 d32-k2 的原生工具调用版本，看两者差在哪"
  - title: "Hugging Face Agents Course - Unit 1 Thought-Action-Observation Cycle"
    url: "https://huggingface.co/learn/agents-course/unit1/agent-steps-and-structure"
    kind: course
    lang: en
    minutes: 15
    note: "用天气 Agent 的例子演示一轮完整的思考-行动-观察，并把它类比成 while 循环；适合先看建立直觉，再读 d32-k1"
