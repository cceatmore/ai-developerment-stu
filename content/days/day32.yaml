knowledge_points:
  - id: d32-k1
    name: ReAct：思考、行动、观察交替
    level: P0
    summary: ReAct 让模型交替给出思考和行动，代码执行行动并把真实结果作为观察回填，循环到能回答为止
    analogy: |
      像你在浏览器 DevTools 里排查线上 bug：**先猜**「可能是接口返回空」（思考）→ **打断点或看 Network**（行动）→ **看到真实返回值**（观察）→ 根据看到的再猜下一步。
      **不一样的地方**：你能直接看到真实数据；模型**只能看到你追加进消息里的内容**。如果你不把工具的真实结果回填，它就会自己「脑补」一个看起来合理的结果，排查就变成了编故事。
    why: |
      ReAct 是几乎所有 Agent 框架默认的循环结构，LangChain 的 create_agent、HF smolagents、各家 Agent SDK 本质都是它的变体。
      「讲讲 ReAct」「ReAct 和 CoT 有什么区别」是 Agent 岗位的基础题，讲不清就很难往后聊工具、LangGraph 和多 Agent。
    problem: |
      推理和行动分开时各有缺陷：
      - **只推理（CoT 思维链）**：全靠训练数据里的知识推，推到一半事实错了也不知道，**幻觉沿着推理链传播**，而且看起来逻辑严密。
      - **只行动（Act-only）**：直接连续调工具，没有中间思考，搜到无关结果也不会调整方向。
      ReAct 把两者交织：**思考指导行动，行动的真实结果再修正思考**。
    principle: |
      **一、来源**

      ReAct（Reason + Act）出自 Yao 等人 2022 年的论文（ICLR 2023）。核心是让 LLM **交替生成推理轨迹和具体动作**：推理帮模型制定、跟踪、更新计划并处理异常；动作让模型从外部环境获取信息。

      **二、一条轨迹长什么样（园区例子）**

      ```text
      问题：DEV-000123 摄像头为什么离线？
      思考 1：先查这台设备的状态和所在区域。
      行动 1：get_device_status(device_id=DEV-000123)
      观察 1：离线，最后心跳 09:12，区域 B2
      思考 2：离线时间点附近 B2 有没有网络告警？
      行动 2：list_alarms(area=B2)
      观察 2：09:10 B2 接入交换机端口 down
      思考 3：根因基本确定，可以回答。
      最终回答：交换机端口故障导致摄像头离线，建议派网络维修工单。
      ```

      **三、三部分分别由谁产生**

      | 部分 | 谁产生 | 作用 |
      |---|---|---|
      | 思考 Thought | 模型 | 拆问题、总结上一步、决定下一步、发现走错了换方向 |
      | 行动 Action | 模型 | 选工具和参数，只是**意图**，不是执行 |
      | 观察 Observation | **你的代码** | 工具真实返回的结果，是模型**唯一可信的外部事实来源** |

      最容易忽略的一点：**观察必须由代码填写**。让模型自己续写观察，它会编造结果，等于退回 CoT 的幻觉问题。

      ```mermaid
      sequenceDiagram
        participant M as LLM
        participant R as 循环代码
        participant T as 园区接口
        M->>R: 思考加行动 get_device_status
        R->>T: 执行查询
        T-->>R: 离线 区域 B2
        R->>M: 观察追加进消息
        M->>R: 思考加行动 list_alarms B2
        R->>T: 执行查询
        T-->>R: 交换机端口 down
        R->>M: 观察追加进消息
        M->>R: 不再调用工具 给出最终回答
      ```

      **四、为什么比 CoT 和 Act-only 好**

      论文观察到：在 HotpotQA、FEVER 这类知识任务上，ReAct 的过程**更基于事实**，CoT 推理结构好但容易编造事实；在 ALFWorld、WebShop 这类交互任务上，ReAct 只用少量示例就明显超过基线。推理轨迹人类可读，**便于调试和建立信任**。

      **五、两种实现方式**

      | ReAct 概念 | 早期文本实现 | 现在的原生工具调用 |
      |---|---|---|
      | 思考 | 文本里的 Thought 行 | 模型的文字输出，或推理模型的内部推理 |
      | 行动 | 正则解析 `tool[参数]` | 结构化的 tool_calls，参数受 JSON Schema 约束 |
      | 观察 | 拼接 Observation 文本 | `role: tool` 消息，靠 tool_call_id 配对 |
      | 结束 | 解析到 Final Answer | 模型不再返回 tool_calls |

      Hello-Agents 第四章用的是文本实现，适合理解原理；**生产系统用原生工具调用**，因为文本格式经常解析失败（漏写、全角符号、多余引号），模型还可能自己续写观察。两者**循环结构完全一样**。

      **六、ReAct 的局限**

      走一步看一步：长任务里容易忘记总体目标、在局部反复尝试；每步都要调一次大模型，成本高。论文里也记录了一个 ReAct 特有的错误模式：**模型重复生成之前的思考和行动，跳不出循环**——这就是 d32-k4 要设终止条件的原因。规划和反思（Day 34）就是针对这些局限的改进。
    scenarios: |
      - **告警排障**：查设备 → 查同区域告警 → 查维保记录，每步看结果再决定下一步。
      - **数据分析**：查表结构 → 写 SQL → 执行报错 → 根据报错改 SQL 再执行。
      - **Coding Agent**：读文件 → 修改 → 跑测试 → 根据测试输出继续改（p3 项目，Day 40 起）。
    pitfalls: |
      - **误区：ReAct 是一个框架或库。** 它是一种提示和控制循环的范式，几十行代码就能手写。
      - **误区：观察可以让模型生成。** 必须由代码填入工具真实结果，否则就是幻觉。
      - **误区：原生工具调用不是 ReAct。** 它是 ReAct 循环的结构化实现，思想完全一样。
      - **误区：思考写得越长越好。** 冗长的思考占上下文、增加成本，不保证更准。
      - **混淆 ReAct 和 CoT**：CoT 只推理不与外部交互；ReAct 的关键是推理和外部反馈交替。
    interview_asks:
      - question: "讲一下 ReAct 的原理，思考、行动、观察分别是什么，由谁产生？"
        answer: "思考和行动由模型产生：它决定想什么、调哪个工具、参数是什么。观察是你的代码执行工具后送回去的结果。然后模型再看观察决定下一步。循环由代码控制，不是模型自己在跑。"
      - question: "ReAct 和 Chain-of-Thought 有什么区别？各自的问题是什么？"
        answer: "思维链只在文字里想，不接触外部事实，想错了也会继续。ReAct 会去调工具，用观察纠正。ReAct 的问题是步数和费用不可控，工具选错会一路错下去。"
      - question: "为什么现在不推荐用文本格式加正则来实现 ReAct？"
        answer: "模型一旦没按你规定的格式写，正则就拆不开，循环直接断。工具调用应该用接口提供的结构化工具调用。格式由接口约束，不要自己解析自由文本。"
    project_example: |
      **p2 智慧园区运营 Agent** 的 Day 32 模块就是手写这个循环：运营人员问「DEV-000123 为什么离线」，模型先调 get_device_status，看到区域 B2 后再调 list_alarms，发现交换机告警后给出结论。
      我们在 trace 里保留每一步模型的说明文字（相当于思考），值班长复核时能看到「它为什么去查交换机」，这比只给一个结论更容易被业务接受。
    freshness: |
      核对于 2026-11：论文信息来自 arXiv 2210.03629（ICLR 2023 版本）。论文在 HotpotQA 和 FEVER 中把 ReAct 的步数上限分别设为 7 和 5，理由是更多步数不会再提升效果；论文的错误分析里把「重复生成之前的思考和行动、跳不出循环」归为 ReAct 特有的常见推理错误。
    sources:
      - {title: "ReAct: Synergizing Reasoning and Acting in Language Models (arXiv)", url: "https://arxiv.org/abs/2210.03629"}
      - {title: "Hello-Agents 第四章 4.2 ReAct", url: "https://github.com/datawhalechina/hello-agents/blob/main/docs/chapter4/%E7%AC%AC%E5%9B%9B%E7%AB%A0%20%E6%99%BA%E8%83%BD%E4%BD%93%E7%BB%8F%E5%85%B8%E8%8C%83%E5%BC%8F%E6%9E%84%E5%BB%BA.md"}

  - id: d32-k2
    name: 不用框架手写最小 Agent 循环
    level: P0
    summary: 一个 for 循环加消息列表：调模型，有工具调用就执行并按 tool_call_id 回填结果，没有就返回答案
    analogy: |
      消息列表 `messages` 就是这个 Agent 的**全部状态**，像一个只追加不修改的 Pinia store：每一轮把模型回复和工具结果 push 进去，下一轮整个数组再发给模型。
      **不一样的地方**：前端 store 你可以随便改字段；这里的消息有**严格顺序约束**——带 tool_calls 的 assistant 消息必须在前，每个调用对应的 tool 消息必须紧跟其后，顺序错了接口直接报 400。
    why: |
      Anthropic 建议「先直接用 LLM API，很多模式几行代码就能实现」，并提醒「对框架底层的错误假设是客户出错的常见来源」。
      自己写过一遍循环，你才知道 LangChain create_agent、LangGraph 帮你做了什么（Day 36），面试被问「Agent 循环怎么实现」时也能直接讲代码，而不是只会说框架名。
    problem: |
      只会调框架时，遇到问题往往无从下手：
      - 接口报「tool message 必须跟在 tool_calls 后面」，不知道是哪一步漏了消息；
      - 模型一次返回多个工具调用，只处理了第一个；
      - 工具抛异常导致整个请求 500，前面几步白做。
      手写一遍，这些都会变成你清楚的「循环里的某一行」。
    principle: |
      **一、循环只做四件事**

      ```mermaid
      flowchart TD
        A["messages：system 加 user"] --> B["调用模型 携带 messages 和 tools"]
        B --> C{"回复里有 tool_calls 吗"}
        C -- "没有" --> D["返回 content 作为最终回答"]
        C -- "有" --> E["先追加这条 assistant 消息"]
        E --> F["逐个执行工具"]
        F --> G["每个调用追加一条 tool 消息 带 tool_call_id"]
        G --> H{"步数用完了吗"}
        H -- "没有" --> B
        H -- "用完" --> I["返回兜底话术"]
      ```

      **二、消息列表的演变（Chat Completions 格式）**

      | 轮次 | 追加的消息 | 关键字段 |
      |---|---|---|
      | 开始 | system、user | content |
      | 第 1 轮 | assistant | `tool_calls`：每项有 `id`、`function.name`、`function.arguments` |
      | 第 1 轮 | tool（每个调用一条） | `tool_call_id` 等于对应调用的 id，`content` 是字符串 |
      | 第 2 轮 | assistant | 又一批 tool_calls，或者最终的 content |

      **三、四条硬规则**

      1. **先追加 assistant 消息，再追加 tool 消息**。tool 消息必须响应它前面某条带 tool_calls 的消息，漏掉 assistant 消息是最常见的 400 错误。
      2. **每个 tool_call 都要有一条结果**。模型一次可能返回多个调用（OpenAI 文档建议默认按多个处理），漏一个下一轮就会报错。
      3. **arguments 是 JSON 字符串**，要 `json.loads`；解析可能失败，失败也要回填一条错误结果。
      4. **content 必须是字符串**，工具返回的 dict 要 `json.dumps(..., ensure_ascii=False)`。

      **四、为什么用 Chat Completions 格式**

      DeepSeek、通义等国内模型都提供 OpenAI 兼容的 Chat Completions 接口，换 `base_url` 就能切换（Day 14）。OpenAI 的 Responses API 格式不同（`function_call` / `function_call_output` 项，用 `call_id` 配对），循环结构一样。用 OpenAI 推理模型时，文档要求**带工具调用的 reasoning 项要随工具结果一起回传**，最简单的做法是把模型输出整体追加回去，具体以官方文档为准。

      **五、框架帮你做了什么**

      LangChain 的 `create_agent` 内部就是这个循环，外加：工具 Schema 自动生成、消息格式适配多家模型、中间件（调用次数上限、重试、摘要、人工审批）、checkpoint 持久化和流式输出。**循环本身没有魔法**，框架省的是这些周边工程。
    scenarios: |
      - **验证新模型**：换一个国产模型前，用这几十行循环跑一遍评测集，比先接框架更快定位兼容性问题（比如是否支持并行工具调用）。
      - **排查框架问题**：LangGraph 里报消息顺序错误时，按「assistant 带 tool_calls → tool 结果」的规则检查状态里的消息。
      - **面试手写题**：「不用框架写一个 Agent」，按本节骨架 15 分钟内可写完。
    code: |
      可运行的最小循环（OpenAI 兼容接口，换 `LLM_BASE_URL` 即可切到 DeepSeek / 通义；工具实现省略）：

      ```python
      import json
      import os

      from openai import OpenAI

      client = OpenAI(api_key=os.environ["LLM_API_KEY"], base_url=os.environ["LLM_BASE_URL"])
      MODEL = os.environ["LLM_MODEL"]
      SYSTEM = "你是园区运营助手。只依据工具结果回答；信息不足时说明需要人工确认。"

      TOOLS = [
          {"type": "function", "function": {
              "name": "get_device_status",
              "description": "按设备编号查询在线状态、最后心跳时间和所在区域。设备编号形如 DEV-000123。",
              "parameters": {"type": "object",
                             "properties": {"device_id": {"type": "string"}},
                             "required": ["device_id"]}}},
          {"type": "function", "function": {
              "name": "list_alarms",
              "description": "按区域编码查询最近 24 小时告警，最多 20 条。区域编码来自 get_device_status。",
              "parameters": {"type": "object",
                             "properties": {"area": {"type": "string"}},
                             "required": ["area"]}}},
      ]

      def get_device_status(device_id: str) -> dict: ...   # 调 IoT 平台接口
      def list_alarms(area: str) -> list[dict]: ...         # 调告警中心接口
      IMPLS = {"get_device_status": get_device_status, "list_alarms": list_alarms}

      def run_tool(call) -> str:
          name = call.function.name
          if name not in IMPLS:
              return json.dumps({"error": f"未知工具 {name}"}, ensure_ascii=False)
          try:
              args = json.loads(call.function.arguments or "{}")
              return json.dumps(IMPLS[name](**args), ensure_ascii=False, default=str)
          except Exception as exc:   # 失败也要变成结果交还模型，细节见 Day 33
              return json.dumps({"error": f"{type(exc).__name__}: {exc}"}, ensure_ascii=False)

      def run_agent(question: str, max_steps: int = 8) -> str:
          messages = [{"role": "system", "content": SYSTEM},
                      {"role": "user", "content": question}]
          for _ in range(max_steps):
              resp = client.chat.completions.create(model=MODEL, messages=messages, tools=TOOLS)
              msg = resp.choices[0].message
              if not msg.tool_calls:
                  return msg.content or ""
              messages.append(msg)                       # 规则 1：assistant 消息先进
              for call in msg.tool_calls:                # 规则 2：每个调用一条结果
                  messages.append({"role": "tool", "tool_call_id": call.id,
                                   "content": run_tool(call)})
          return "排查步骤已用完，已转人工处理。"
      ```
    pitfalls: |
      - **漏追加 assistant 消息**：直接追加 tool 消息，下一轮接口报 400。
      - **只处理 `tool_calls[0]`**：模型并行返回多个调用时，其余调用没有结果，下一轮报错。
      - **把 dict 直接当 content**：要先序列化成字符串；中文记得 `ensure_ascii=False`，否则 Token 浪费在转义上。
      - **工具异常直接抛出**：整个请求失败，前面步骤白做；应把错误作为 tool 结果回填。
      - **误区：框架里的 Agent 和手写的是两回事。** 框架内部就是同一个循环，只是多了周边工程。
    interview_asks:
      - question: "不用框架，你怎么实现一个能调工具的 Agent？关键代码是哪几行？"
        answer: "一个循环：把消息和工具发给模型，如果返回工具调用就校验并执行，把结果追加进消息，否则就把文本返回用户。循环外加最大步数。关键是这个循环和按调用 id 回填结果，不是某个框架 API。"
      - question: "模型一次返回了三个工具调用，你的代码怎么处理？"
        answer: "三条都要执行，结果按各自的 tool_call_id 写回，不能只处理第一条。只读且互不依赖的可以并发。写操作按顺序做。少回一条，下一轮接口就会报错。"
      - question: "接口报错说 tool 消息没有对应的 tool_calls，可能是什么原因？"
        answer: "你追加了工具结果，但上一条助手消息里没有对应的调用 id，或者 id 对错了。常见是历史被截断时把调用和结果拆开了。截断必须成对保留。"
    project_example: |
      **p2 智慧园区运营 Agent** 的第一个 Agent 模块就是上面这个 `run_agent`：先接 get_device_status 和 list_alarms 两个只读工具，跑通「设备离线原因」类问题。
      我们刻意先不用框架，原因有两个：一是要确认所选国产模型在并行工具调用、参数格式上的表现；二是让团队每个人都清楚消息是怎么流动的。Day 36 再把同样的逻辑迁移到 LangGraph，对比两边的代码量和可观测性。
    freshness: |
      核对于 2026-11：OpenAI API 参考中 Chat Completions 的工具结果消息为 `role: tool` 加 `tool_call_id`，assistant 消息的 `tool_calls[].function.arguments` 为 JSON 字符串；Function calling 指南写明模型一轮可能返回多个调用，可用 `parallel_tool_calls: false` 限制为零或一个；推理模型（如 GPT-5、o4-mini）在 Responses API 中返回的 reasoning 项必须随工具结果回传。openai-python 当前 README 仍同时示范 `client.chat.completions.create` 和 `client.responses.create`。LangChain 1.5.0 的 `create_agent` 即「模型在循环中调用工具」的封装。
    sources:
      - {title: "OpenAI Docs - Function calling", url: "https://platform.openai.com/docs/guides/function-calling"}
      - {title: "OpenAI API Reference - Chat", url: "https://developers.openai.com/api/reference/resources/chat"}
      - {title: "LangChain Docs - Agents", url: "https://docs.langchain.com/oss/python/langchain/agents"}

  - id: d32-k3
    name: 模型与代码的分工
    level: P1
    summary: 模型负责理解和决定下一步；执行、鉴权、参数校验、状态保存和停止都由代码负责
    analogy: |
      像前端和后端的分工：前端（模型）可以决定「用户想干什么、调哪个接口」，但**权限校验必须在后端（代码）做**，前端藏按钮只是体验优化，不是安全措施。
      **不一样的地方**：前端代码是你写的，行为确定；模型的输出可能被用户输入或检索到的文档「带偏」（提示注入），所以凡是涉及安全和钱的规则，都不能只写在 Prompt 里。
    why: |
      Agent 线上事故很多源于分工错误：把权限写在 Prompt 里、让模型传 user_id、让模型计算金额。
      面试官问「这个约束你放在哪里实现」，考的就是你有没有这条边界意识。LangChain 文档说 Agent = Model + Harness，harness 就是代码这一侧要承担的部分。
    problem: |
      分工不清时会出现：
      - 模型按用户要求传入别人的 user_id，查到了不该看的数据（越权）；
      - Prompt 写了「最多调用 5 次」，模型照样调了 12 次；
      - 金额、日期这类确定性计算交给模型，偶尔算错还很难发现。
    principle: |
      **一、分工表**

      | 职责 | 归谁 | 原因 |
      |---|---|---|
      | 理解意图、选工具、填参数 | 模型 | 需要语言理解和判断 |
      | 决定下一步、何时可以回答 | 模型（代码兜底） | 依赖中间结果 |
      | **执行工具** | 代码 | 模型只能输出意图 |
      | **身份和权限** | 代码 | 不能信任模型传来的身份 |
      | **参数校验** | 代码 | Schema 只保证格式，业务合法性要再查 |
      | 确定性计算（金额、阈值、时间） | 代码 | 结果必须准确可测 |
      | **状态保存** | 代码 | 模型无状态，记忆是你回填的消息 |
      | **停止条件** | 代码 | Prompt 里的「最多 N 次」模型可能不遵守 |

      口诀：**模型提议，代码处置**。

      **二、身份由代码注入，不让模型传**

      ```mermaid
      flowchart LR
        U["登录态 token"] --> S["后端解析出 user_id 和角色"]
        M["模型 tool_call：list_alarms area B2"] --> X["执行器"]
        S --> X
        X --> P{"该用户有权查 B2 吗"}
        P -- "有" --> T["调用告警接口"]
        P -- "无" --> E["回填错误：无权限查看该区域"]
      ```

      工具的 Schema 里**根本不出现 user_id 参数**；执行器从请求上下文拿身份，再做权限判断。模型即使被诱导「帮我查 A 园区的数据」，也查不到。

      **三、Prompt 里该写什么**

      - 写**行为指导**：什么时候用哪个工具、信息不足时怎么回答、输出格式。
      - 不写**安全保证**：权限、次数上限、金额规则写在 Prompt 里只能算「提示」，真正的约束在代码里。

      **四、判断一段逻辑放哪里**

      问自己：**这条规则被违反一次，后果能接受吗？** 不能接受就必须放代码里；能接受、而且需要灵活理解的，才交给模型。
    scenarios: |
      - **多租户园区 SaaS**：租户 ID 从登录态注入工具执行器，模型看不到也改不了。
      - **告警阈值判断**：「温度超过 60 度算高危」写在代码里，模型只负责解释告警含义。
      - **调用次数控制**：Prompt 可以提示「尽量少调用」，但真正的上限是循环里的 `max_steps`。
    pitfalls: |
      - **把权限写在 System Prompt 里**：「不要查询其他租户数据」挡不住提示注入。
      - **在工具 Schema 里暴露 user_id、tenant_id**：等于让模型决定查谁的数据。
      - **让模型做确定性计算**：工单 SLA 截止时间、费用合计都应由代码算好再给模型。
      - **反向误区：什么都写死。** 需要语言理解的判断（这条告警描述说的是什么问题）硬写规则会漏掉大量说法。
    interview_asks:
      - question: "在 Agent 里，哪些事情交给模型，哪些必须由代码做？"
        answer: "模型决定选哪个工具、草拟参数、组织给用户的话。代码做权限、参数是否合法、是否执行、步数上限和最终是否采纳。模型不能给自己授权。"
      - question: "用户身份应该怎么传给工具？能让模型传 user_id 吗？"
        answer: "不能让模型传。从登录态放到工具的执行上下文里，模型看不见也不能改。工具参数里如果有 user_id，要忽略它，以登录态为准。"
    project_example: |
      **p2 智慧园区运营 Agent** 是多租户的，同一套服务给多个园区用。我们的做法：
      - 工具 Schema 只有业务参数（设备编号、区域编码），**没有 tenant_id 和 user_id**；
      - 执行器从 JWT 中取出租户和角色（鉴权细节见 Day 46），调用接口时由代码带上租户条件；
      - 区域权限在执行器里判断，无权限时回填「无权限查看该区域」，模型会如实告诉用户；
      - 「告警超过 30 分钟未处理要升级」这条规则写在代码里计算好，以字段形式给模型。
    sources:
      - {title: "LangChain Docs - Agents（Agent = Model + Harness）", url: "https://docs.langchain.com/oss/python/langchain/agents"}
      - {title: "Anthropic - Building effective agents", url: "https://www.anthropic.com/engineering/building-effective-agents"}

  - id: d32-k4
    name: 终止条件与最大步数
    level: P0
    summary: 模型不再调用工具是唯一的自然出口，必须再用最大步数、重复检测、预算和超时兜底，并记录停止原因
    analogy: |
      像前端轮询接口：`setInterval` 查任务状态，正常情况是「状态变成完成就停」，但你一定会再加**最大轮询次数和超时**，否则后端卡住时页面会一直轮询下去。
      **不一样的地方**：轮询每次请求成本很低；Agent 每多一轮都要把**整个消息历史**重新发给模型，成本随步数快速上升，所以失控的代价大得多。
    why: |
      Agent 上线后最常见的事故是**死循环**和**成本暴涨**：模型反复调同一个工具、在两个工具之间来回跳，或者一直觉得「信息还不够」。
      面试官问「你怎么保证 Agent 一定会停」，是在考你有没有生产经验。OWASP LLM Top 10 也把这类问题归为「无限制消耗」风险（Day 45）。
    problem: |
      - 「什么时候停」默认交给模型判断，而模型的判断不可靠；
      - 工具返回错误时，模型常常原样重试同一个调用；
      - ReAct 论文记录过：模型会**重复生成之前的思考和行动，跳不出循环**；
      - 每一轮都重发全部历史，**累计输入 Token 大致随步数平方增长**，10 步的总成本约是 5 步的 4 倍。
    principle: |
      **一、终止条件分两类**

      ```mermaid
      stateDiagram-v2
        state "调用模型" as CallLLM
        state "检查护栏" as Guard
        state "执行工具" as RunTool
        state "正常完成" as Done
        state "强制停止并兜底" as Stop
        [*] --> CallLLM
        CallLLM --> Done: 不再调用工具
        CallLLM --> Guard: 有工具调用
        Guard --> Stop: 超过最大步数
        Guard --> Stop: 同一调用重复超限
        Guard --> Stop: 超时或超预算
        Guard --> RunTool: 通过
        RunTool --> CallLLM: 结果回填
        Done --> [*]
        Stop --> [*]
      ```

      - **正常终止（模型决定）**：不再返回工具调用；或调用一个显式的 `finish` / `submit_answer` 工具，结构化输出更好校验。
      - **强制终止（代码决定）**：
        - **最大步数**：最基本的兜底。ReAct 论文在 HotpotQA 和 FEVER 上分别只设了 7 步和 5 步，理由是更多步数不再提升效果。业务 Agent 一般 5~15 步。
        - **重复检测**：把「工具名 + 规范化后的参数」做成签名，同一签名出现超过 2 次就停，或者回填提示让模型换思路。
        - **预算**：累计 Token 或费用上限。
        - **总超时（deadline）**：整次任务的墙钟时间，Day 33 讲它如何分配给每一步。
        - **用户取消**：用户点「停止」或 SSE 断开时取消后端任务。

      **二、停下来之后怎么办**

      强制终止**不等于给用户报 500**：
      - 返回「已确认的部分 + 未完成的原因」，例如「已确认摄像头离线，网络告警接口暂不可用，已转人工」；
      - 记录 `stop_reason`（final / max_steps / repeated / budget / timeout / cancelled），做监控：`max_steps` 占比突然升高，通常说明某个工具或 Prompt 出问题了。

      **三、为什么成本随步数近似平方增长**

      第 n 轮的输入包含前 n-1 轮全部内容。每轮新增约 k 个 Token，n 轮累计输入约 k×n²/2。所以除了限制步数，还要控制每次工具结果的长度（Day 33）和历史长度（Day 35）。

      **四、框架里的对应物**

      - LangChain：`ModelCallLimitMiddleware`（限制模型调用次数，`exit_behavior` 默认 `end` 优雅结束）、`ToolCallLimitMiddleware`（可按单个工具限制次数）。
      - LangGraph：`recursion_limit` 限制图的执行步数（Day 36），**不要依赖默认值**。
      原理和你手写的 `for _ in range(max_steps)` 一样。
    scenarios: |
      - **告警排障 Agent**：最多 8 步；同一设备同参数查询超过 2 次就停止并转人工。
      - **SQL 分析 Agent**：生成 → 执行 → 报错 → 修正，最多修 3 次，仍失败返回错误说明和最后一版 SQL。
      - **监控看板**：按 stop_reason 统计占比，max_steps 超过 5% 就告警。
    code: |
      在 d32-k2 的循环上加重复检测、预算和停止原因：

      ```python
      import json
      import time

      def signature(call) -> str:
          args = json.loads(call.function.arguments or "{}")
          return call.function.name + json.dumps(args, sort_keys=True, ensure_ascii=False)

      def run_agent(question: str, max_steps: int = 8, max_tokens: int = 60_000,
                    deadline_s: float = 60) -> tuple[str, str]:
          messages = [{"role": "system", "content": SYSTEM}, {"role": "user", "content": question}]
          seen: dict[str, int] = {}
          used_tokens, start = 0, time.monotonic()
          for _ in range(max_steps):
              if time.monotonic() - start > deadline_s:
                  return "处理超时，已转人工。", "timeout"
              resp = client.chat.completions.create(model=MODEL, messages=messages, tools=TOOLS)
              used_tokens += resp.usage.total_tokens if resp.usage else 0
              msg = resp.choices[0].message
              if not msg.tool_calls:
                  return msg.content or "", "final"
              if used_tokens > max_tokens:
                  return "本次分析消耗过大，已转人工。", "budget"
              messages.append(msg)
              for call in msg.tool_calls:
                  sig = signature(call)
                  seen[sig] = seen.get(sig, 0) + 1
                  content = run_tool(call) if seen[sig] <= 2 else json.dumps(
                      {"error": "相同查询已执行过两次，结果不会变化，请换思路或直接回答"},
                      ensure_ascii=False)
                  messages.append({"role": "tool", "tool_call_id": call.id, "content": content})
          return "排查步骤已用完，已转人工。", "max_steps"
      ```
    pitfalls: |
      - **只靠「模型不再调用工具」终止**：`while True` 是线上死循环的头号来源。
      - **Prompt 里写「最多调用 5 次」就当作上限**：模型不保证遵守，上限必须在代码里。
      - **重复检测只比工具名**：查不同设备是正常行为；应比较「工具名 + 规范化参数」。
      - **到上限直接抛异常**：用户看到 500，已拿到的部分结果也丢了。
      - **依赖框架默认步数**：默认值往往远大于业务需要，起不到护栏作用。
    interview_asks:
      - question: "你的 Agent 如何保证一定会停下来？有哪些终止条件？"
        answer: "模型给出最终回答、步数到达上限、用户取消、重复同一调用超过次数，这几个都要停。上限是硬的，写在循环里，不依赖模型自觉。"
      - question: "怎么检测 Agent 陷入了重复调用同一个工具的循环？"
        answer: "记下最近几步的工具名和参数。同一组重复出现就停止，并把「你在重复」作为观察送回一次，仍重复就结束。不要无限让它再试。"
      - question: "到达最大步数后你返回什么给用户？"
        answer: "明确说这次没做完，并带上已经确认的结果。不要把半成品当成成功结论。该执行的写操作如果没做，就说没做。日志里留下完整轨迹。"
    project_example: |
      **p2 智慧园区运营 Agent** 的循环配置：最多 8 步、单次任务 60 秒、累计 6 万 Token；同一「工具 + 参数」最多执行 2 次，第 3 次直接回填「结果不会变化，请换思路」。
      每次结束都写 `stop_reason` 到 trace（Day 43 接 Langfuse），运营工作台上能看到「本周 max_steps 占比」。如果这个比例突然升高，我们会先看是不是某个园区的 IoT 接口挂了导致模型反复重试。
    freshness: |
      核对于 2026-11（langchain 1.5.0）：`ModelCallLimitMiddleware(thread_limit, run_limit, exit_behavior)`，`exit_behavior` 默认 `end`（优雅结束），可选 `error`；`ToolCallLimitMiddleware` 可指定 `tool_name` 单独限流，`exit_behavior` 默认 `continue`（拦截超限调用并回填错误，让模型自己收尾）。ReAct 论文步数上限 7 和 5 的依据见 d32-k1。
    sources:
      - {title: "LangChain Docs - Prebuilt middleware（Model call limit / Tool call limit）", url: "https://docs.langchain.com/oss/python/langchain/middleware/built-in"}
      - {title: "ReAct: Synergizing Reasoning and Acting in Language Models (arXiv)", url: "https://arxiv.org/abs/2210.03629"}

test:
  - id: d32-t1
    kp: d32-k1
    type: single
    question: 在 ReAct 循环中，「观察（Observation）」应该由谁产生？
    options:
      - "由模型在输出行动后继续生成，代表它预期的工具结果"
      - "由循环代码执行工具后，把工具真实返回的结果填入"
      - "由模型在下一轮的思考中自行总结得出"
      - "由 System Prompt 中预先写好的示例提供"
    answer: [1]
    explain: |
      观察是模型获取外部真实信息的唯一渠道，必须由代码执行工具后填入真实结果。
      让模型续写「预期结果」等于编造事实，退回 CoT 的幻觉问题；思考是对观察的总结而不是观察本身；Prompt 示例只用于教格式。
  - id: d32-t2
    kp: d32-k1
    type: single
    question: ReAct 相比纯 Chain-of-Thought（只推理不调用工具），最主要的改进是什么？
    options:
      - "推理步骤更短，Token 成本更低"
      - "不再需要设计 Prompt，模型会自动规划"
      - "保证每一步推理都正确，不会再出错"
      - "推理过程能被外部真实信息纠正，更基于事实"
    answer: [3]
    explain: |
      ReAct 论文的核心发现是交替推理与行动让过程更「grounded」：推理中的事实错误能被工具返回的真实观察纠正，而 CoT 只依赖模型内部知识，容易编造事实。
      ReAct 每步都调模型，通常更贵；仍需精心设计 Prompt；也不能保证每步正确，论文中仍有推理错误和循环。
  - id: d32-t3
    kp: d32-k1
    type: judge
    question: 用 OpenAI 原生 Function Calling 实现的 Agent 不属于 ReAct，因为它不再输出「Thought / Action / Observation」这样的文本。
    answer: false
    explain: |
      ReAct 的本质是「模型决策 → 代码执行 → 结果作为观察回填 → 再决策」的循环，与是否用文本格式无关。
      原生工具调用用结构化的 tool_calls 表达行动、用 tool 消息表达观察，是 ReAct 更可靠的实现方式。
  - id: d32-t4
    kp: d32-k1
    type: multi
    question: 用「文本格式 + 正则解析」实现 ReAct，在生产环境中常见的问题有哪些？
    options:
      - "模型漏写 Action 或使用全角括号，正则解析失败"
      - "不在 Action 处截断时，模型会自己续写一段伪造的 Observation"
      - "复杂的嵌套参数很难用自由文本稳定表达和解析"
      - "文本格式下模型无法进行任何推理，只能直接行动"
    answer: [0, 1, 2]
    explain: |
      文本协议靠模型自觉遵守格式，常因漏写、全角符号、多余引号导致解析失败；不截断时模型会按示例格式继续编观察；嵌套参数也难以表达。
      文本格式恰恰是把推理（Thought）显式写出来，并不妨碍推理，所以第四项错误。
  - id: d32-t5
    kp: d32-k1
    type: single
    question: ReAct 论文在错误分析中指出了一种 ReAct 特有的常见错误模式。它对工程实现最直接的启示是什么？
    options:
      - "模型会重复之前的思考和行动、跳不出循环，所以必须有代码层的终止条件"
      - "模型经常拒绝调用工具，所以要在 Prompt 里强制要求每步都调用"
      - "模型的思考太短，所以要要求模型输出更长的推理"
      - "工具结果太准确，模型会过度依赖，所以要给结果加噪声"
    answer: [0]
    explain: |
      论文把「重复生成之前的思考和行动、无法跳出循环」归为 ReAct 特有的推理错误。这意味着不能只靠模型自己决定何时停，需要最大步数、重复检测等代码层护栏。
      其他三项都不是论文的结论，强制每步调用工具或加长思考只会增加成本。
  - id: d32-t6
    kp: d32-k2
    type: single
    question: 下面的循环在第二轮调用模型时，接口返回 400 错误。最可能的原因是什么？
    code: |
      for _ in range(max_steps):
          resp = client.chat.completions.create(model=MODEL, messages=messages, tools=TOOLS)
          msg = resp.choices[0].message
          if not msg.tool_calls:
              return msg.content
          for call in msg.tool_calls:
              messages.append({"role": "tool", "tool_call_id": call.id,
                               "content": run_tool(call)})
    options:
      - "tool 消息的 content 应该是 dict 而不是字符串"
      - "每轮都应该重新创建 OpenAI 客户端"
      - "没有先把带 tool_calls 的 assistant 消息追加到 messages"
      - "max_steps 设置太小，模型来不及完成任务"
    answer: [2]
    explain: |
      tool 消息必须响应它前面某条带 tool_calls 的 assistant 消息。代码只追加了 tool 结果，没有先 `messages.append(msg)`，第二轮请求里的 tool 消息找不到对应的调用，接口直接报错。
      content 应为字符串而不是 dict；客户端复用即可；步数大小不会导致 400。
  - id: d32-t7
    kp: d32-k2
    type: single
    question: 模型在一轮回复中返回了 3 个 tool_calls，你的代码只执行并回填了第一个。下一轮会怎样？
    options:
      - "模型会自动忽略另外两个调用，继续正常推理"
      - "接口会自动为另外两个调用补上空结果"
      - "没有影响，因为 tool 消息是可选的"
      - "因为有调用缺少对应的 tool 结果，下一轮请求通常会报错"
    answer: [3]
    explain: |
      每个 tool_call 都需要一条带对应 tool_call_id 的 tool 消息。缺失结果时，多数接口会拒绝请求；即使不报错，模型也会因为缺少观察而重复发起调用。
      OpenAI 文档建议默认按「一轮可能有多个调用」来处理，接口不会自动补结果。
  - id: d32-t8
    kp: d32-k2
    type: multi
    question: 关于手写循环中消息的处理，下列说法正确的有哪些？
    options:
      - "tool_calls 里的 function.arguments 是 JSON 字符串，需要先解析再传给函数"
      - "工具返回的 dict 要序列化成字符串放进 content，中文建议 ensure_ascii=False"
      - "tool 消息靠 tool_call_id 与对应调用配对，不能只按顺序拼接"
      - "为节省 Token，执行完工具后应把 assistant 消息从 messages 中删除"
    answer: [0, 1, 2]
    explain: |
      arguments 是字符串，需要 json.loads 且可能解析失败；content 必须是字符串，ensure_ascii=False 避免中文被转义浪费 Token；结果用 tool_call_id 配对。
      删除带 tool_calls 的 assistant 消息会破坏消息顺序约束，后续请求会报错，也让模型看不到自己做过什么。
  - id: d32-t9
    kp: d32-k2
    type: judge
    question: LangChain 的 create_agent 内部本质上也是「调用模型 → 执行工具 → 回填结果 → 再调用模型」的循环，框架主要帮你做的是 Schema 生成、消息适配、中间件和持久化等周边工程。
    answer: true
    explain: |
      LangChain 文档把 Agent 定义为「模型在循环中调用工具直到任务完成」，并称循环外围的提示词、工具和中间件为 harness。
      手写循环和框架的核心逻辑一致，理解手写版本才能看懂框架报错和行为。
  - id: d32-t10
    kp: d32-k2
    type: single
    question: 同一套循环代码要从 OpenAI 切换到 DeepSeek 或通义千问，通常需要改什么？
    options:
      - "把整个循环改写成 Responses API 的格式"
      - "主要改 base_url、API Key 和模型名，Chat Completions 的消息格式基本不变"
      - "必须换成 LangChain，因为原生 SDK 不支持其他厂商"
      - "把工具定义改成纯文本描述，因为国产模型不支持 JSON Schema"
    answer: [1]
    explain: |
      DeepSeek、通义等提供 OpenAI 兼容的 Chat Completions 接口，用 OpenAI SDK 改 base_url、Key 和模型名即可。
      国产模型普遍支持 JSON Schema 形式的工具定义；不需要改成 Responses API 或引入框架。但并行调用、推理内容回传等细节要按各家文档验证。
  - id: d32-t11
    kp: d32-k3
    type: single
    question: 园区运营 Agent 有一个 list_alarms 工具。为防止查询到其他租户的告警，最稳妥的做法是？
    options:
      - "在 System Prompt 中写明「只能查询当前租户的数据」"
      - "在工具 Schema 中加 tenant_id 参数，并要求模型填写当前租户"
      - "Schema 中不出现 tenant_id，由执行器从登录态取出并在代码中带上租户条件"
      - "让模型先调用一个 get_my_tenant 工具，再把结果传给 list_alarms"
    answer: [2]
    explain: |
      身份和权限必须由代码决定。Schema 里不暴露租户参数，执行器从登录态注入，模型即使被诱导也无法改变查询范围。
      Prompt 约束挡不住提示注入；让模型填 tenant_id 或转传 get_my_tenant 的结果，本质上仍是让模型控制身份，可被篡改。
  - id: d32-t12
    kp: d32-k3
    type: judge
    question: 在 System Prompt 中写「每次任务最多调用 5 次工具」，就可以作为 Agent 的步数上限，不需要在代码中再做限制。
    answer: false
    explain: |
      Prompt 里的规则只是提示，模型可能不遵守，也可能在重试中「忘记」。真正的上限必须在循环代码里实现，例如 for 循环的最大轮次或调用次数中间件。
      凡是违反一次就不可接受的约束，都要放在代码里。
  - id: d32-t13
    kp: d32-k3
    type: multi
    question: 下列哪些逻辑**应该**由代码而不是模型负责？
    options:
      - "根据登录态确定当前用户能查看哪些区域"
      - "计算工单的 SLA 截止时间"
      - "判断用户这句话是在问告警原因还是在问客流统计"
      - "保存本次任务已经执行过的工具调用和结果"
    answer: [0, 1, 3]
    explain: |
      权限、确定性计算、状态保存都必须由代码负责：权限不能信任模型，SLA 计算要准确可测，模型本身无状态，记忆是代码回填的消息。
      判断用户意图需要语言理解，正是模型擅长的部分。
  - id: d32-t14
    kp: d32-k3
    type: single
    question: 判断一条业务规则应该写在代码里还是交给模型，下面哪个问题最关键？
    options:
      - "这条规则写成 Prompt 会不会太长"
      - "这条规则被违反一次，后果能否接受"
      - "这条规则是否在需求文档里出现过"
      - "模型是否足够聪明，能够理解这条规则"
    answer: [1]
    explain: |
      违反一次就不可接受的规则（权限、金额、安全）必须由代码强制执行；可以容忍偶尔偏差、又需要灵活理解的，才交给模型。
      Prompt 长度、是否写进文档、模型是否聪明都不能保证规则一定被遵守。
  - id: d32-t15
    kp: d32-k4
    type: multi
    question: 下面这段 Agent 循环有哪些会在线上造成严重问题的缺陷？
    code: |
      while True:
          resp = client.chat.completions.create(model=MODEL, messages=messages, tools=TOOLS)
          msg = resp.choices[0].message
          if not msg.tool_calls:
              return msg.content
          messages.append(msg)
          for call in msg.tool_calls:
              try:
                  result = IMPLS[call.function.name](**json.loads(call.function.arguments))
              except Exception:
                  continue
              messages.append({"role": "tool", "tool_call_id": call.id,
                               "content": json.dumps(result, ensure_ascii=False)})
    options:
      - "while True 没有最大步数，模型持续调用工具时循环不会结束"
      - "工具异常被 continue 吞掉，该调用没有 tool 结果，模型也不知道失败原因"
      - "每轮都把 msg 追加进 messages，会导致消息顺序错误"
      - "失败时没有任何日志，排查时看不到是哪个工具、什么参数出的错"
    answer: [0, 1, 3]
    explain: |
      没有步数上限会无限循环；异常被吞后缺少对应的 tool 结果，下一轮请求可能报错，即使不报错模型也看不到失败原因，往往原样重试形成死循环；静默吞错也让排查无从下手。
      先追加 assistant 消息再追加 tool 结果正是正确顺序，第三项不是缺陷。
  - id: d32-t16
    kp: d32-k4
    type: single
    question: 实现「重复调用检测」时，签名应该怎么构造？
    options:
      - "只用工具名，同一个工具调用超过 2 次就判定为重复"
      - "用模型回复的完整文本做签名"
      - "用 tool_call_id 做签名，同一个 id 出现两次就是重复"
      - "用工具名加规范化后的参数做签名"
    answer: [3]
    explain: |
      查不同设备的状态是正常行为，只比工具名会误判；模型回复文本每次措辞不同，起不到作用；tool_call_id 每次调用都是新的，永远不会重复。
      「工具名 + 排序后的参数」能准确识别「同样的查询又做了一次」，参数要规范化（如 sort_keys）避免顺序不同被当成不同调用。
  - id: d32-t17
    kp: d32-k4
    type: judge
    question: Agent 到达最大步数时，最好的处理是直接抛出异常返回 500，这样调用方能明确知道任务失败了。
    answer: false
    explain: |
      强制终止不等于报错。更好的做法是返回已确认的部分结论和未完成原因，必要时转人工，并记录 stop_reason 用于监控。
      直接抛 500 会丢掉已经拿到的信息，用户体验差，也无法区分是步数用完还是程序故障。
  - id: d32-t18
    kp: d32-k4
    type: single
    question: 一个 Agent 每轮新增约 2000 Token 的内容。最大步数从 5 提高到 10 后，累计输入 Token 大约会变成原来的多少？
    options:
      - "约 4 倍，因为每轮都要重发之前全部历史"
      - "约 2 倍，因为步数翻了一倍"
      - "基本不变，因为每轮只发送新增内容"
      - "约 10 倍，因为每一步都要重新发送系统提示"
    answer: [0]
    explain: |
      第 n 轮的输入包含前面所有轮的内容，累计输入约为 k×n²/2，与步数平方成正比，5 步到 10 步约为 4 倍。
      Chat Completions 每次都要发送完整历史（除非用了服务端会话状态），所以不是只发新增内容。这也是除了限步数还要控制工具结果长度的原因。

exam:
  - id: d32-e1
    kp: d32-k1
    type: single
    question: 某知识问答 Agent 的 trace 显示：模型第一步就输出了一段「搜索结果显示……」的文字并给出答案，但日志里没有任何工具被执行。最可能的问题是？
    options:
      - "工具执行太快，日志没来得及记录"
      - "模型能力太强，不需要工具就能回答"
      - "模型自己续写了观察，代码没有拦截或没有真正执行工具"
      - "最大步数设置为 1，导致工具被跳过"
    answer: [2]
    explain: |
      「搜索结果显示」却没有工具执行记录，说明这段「观察」是模型编的。常见于文本格式 ReAct 没有在 Action 处截断，或者 Prompt 示例让模型习惯了自问自答。
      这是 ReAct 最危险的失败：看似有依据，实则是幻觉。日志延迟、模型能力和步数设置都解释不了这一现象。
  - id: d32-e2
    kp: d32-k2
    type: single
    question: 你把手写循环换成推理模型（OpenAI Responses API）后，发现带工具调用的多轮任务效果明显下降。根据官方文档，最该检查的是什么？
    options:
      - "是否把模型返回的 reasoning 项随工具结果一起回传"
      - "是否把 temperature 设为 0"
      - "是否把工具数量减少到 3 个以内"
      - "是否在 Prompt 中要求模型输出 Thought"
    answer: [0]
    explain: |
      OpenAI 文档写明：推理模型在带工具调用的响应中返回的 reasoning 项，必须和工具结果一起回传，否则会丢失推理上下文。简单做法是把模型输出整体追加回输入。
      推理模型内部会思考，不需要 Prompt 要求写 Thought；temperature 和工具数量与这一问题无直接关系。
  - id: d32-e3
    kp: d32-k3
    type: single
    question: 一位同事为了让 Agent 能「代用户查询自己的工单」，在 get_my_orders 工具里加了 user_id 参数，并在 Prompt 中告诉模型「user_id 是当前登录用户的 ID：U1001」。这样设计的主要风险是？
    options:
      - "user_id 写在 Prompt 里会占用太多 Token"
      - "模型可能记错 ID，但这只是偶发的体验问题"
      - "Prompt 里的 ID 会在多轮对话中丢失，需要每轮重复"
      - "用户可以诱导模型传入别人的 user_id，造成越权查询"
    answer: [3]
    explain: |
      只要身份参数由模型填写，用户说一句「帮我查 U1002 的工单」或文档里藏一段注入，就可能越权。正确做法是 Schema 不暴露 user_id，执行器从登录态注入并校验归属。
      这不是 Token 或记忆问题，而是安全边界设计错误，后果是数据泄露，不是偶发体验问题。
  - id: d32-e4
    kp: d32-k4
    type: single
    question: 监控显示上周 Agent 的 stop_reason 中 max_steps 占比从 2% 突然升到 15%，模型和 Prompt 都没有改动。最合理的第一步排查是？
    options:
      - "立即把最大步数从 8 提高到 20"
      - "按 trace 查看这些任务最后几步在调用什么工具、返回了什么"
      - "换一个更强的模型重新上线"
      - "在 Prompt 中加一句「请尽快给出答案」"
    answer: [1]
    explain: |
      模型和 Prompt 都没变而 max_steps 激增，常见原因是某个工具开始返回错误或空结果，模型在反复重试。先看 trace 定位是哪个工具、返回了什么。
      提高上限只会让失败更贵；换模型和改 Prompt 都没有对症。
  - id: d32-e5
    kp: d32-k2
    type: multi
    question: 手写 Agent 循环时，下列哪些情况必须回填一条 tool 消息（而不是跳过）？
    options:
      - "模型请求了一个未注册的工具名"
      - "arguments 不是合法 JSON，解析失败"
      - "工具执行时抛出超时异常"
      - "工具正常执行并返回了空列表"
    answer: [0, 1, 2, 3]
    explain: |
      每个 tool_call 都必须有一条对应 tool_call_id 的结果，无论成功还是失败。未知工具、解析失败、执行异常都应回填可读的错误信息；空列表也是有效结果，应如实回填（最好说明「未查到数据」）。
      任何一种被跳过都会导致下一轮消息不完整，并让模型看不到真实情况。
  - id: d32-e6
    kp: d32-k4
    type: multi
    question: 关于 Agent 的终止条件，下列说法正确的有哪些？
    options:
      - "只设最大步数不够，单步可能很慢需要总超时，单步可能很贵需要 Token 预算"
      - "调用显式的 finish 工具结束，比「没有工具调用」更容易校验结构化结果"
      - "达到任何强制终止条件时，都应记录 stop_reason 以便监控"
      - "框架通常有默认步数上限，所以手写循环时可以不设"
    answer: [0, 1, 2]
    explain: |
      步数、时间、Token 是三个不同维度，需要互相补充；显式 finish 工具让结束信号和结果都结构化；stop_reason 是发现工具故障和 Prompt 问题的关键监控信号。
      手写循环没有任何默认上限，而且框架默认值往往远大于业务需要，不能依赖。
  - id: d32-e7
    kp: d32-k1
    type: judge
    question: 推理模型内部会进行思考，因此用它做 Agent 时不必再在 Prompt 中要求模型显式写出 Thought，但 ReAct 的「决策-执行-观察」循环结构仍然需要由代码实现。
    answer: true
    explain: |
      推理模型的思考发生在内部，不需要通过 Prompt 让它写 Thought；但模型仍然只能提议工具调用，执行工具、回填观察、判断终止都还是代码的职责。
      很多团队会让模型在调用前用一句话说明意图，便于 trace 审计，这是可选的工程实践。
  - id: d32-e8
    kp: d32-k3
    type: judge
    question: 如果工具 Schema 用了 strict 模式，参数类型和必填字段由接口保证，执行器就不需要再做任何参数校验和权限判断。
    answer: false
    explain: |
      strict 模式只保证参数符合 JSON Schema 的格式，不保证业务合法：设备编号可能不存在、日期范围可能倒置、用户可能无权访问该区域。
      业务校验和权限判断仍必须在执行器中完成（Day 33 详讲）。
  - id: d32-e9
    kp: d32-k4
    type: case
    question: |
      园区运营 Agent 上线第二周的一个晚上，IoT 平台的设备状态接口开始返回 503。第二天发现：大量排障请求跑到几十步才被网关 120 秒超时切断，当晚 Token 费用是平时的 5 倍；trace 中模型反复调用 get_device_status，参数完全相同，每次都收到「Service Unavailable」。
      代码使用 `while True` 循环，工具错误会原样回填给模型。以下哪组整改最完整、最对症？
    options:
      - "循环限 8 步；同一调用重复超 2 次就拦截并回填「接口不可用，勿重试」；工具层对 503 有限次退避重试；按停止原因告警"
      - "把网关超时从 120 秒降到 30 秒，让失控请求更早被切断，同时在前端提示用户稍后再试一次"
      - "在 System Prompt 中加入「工具返回错误时最多重试一次，之后直接告诉用户系统繁忙请稍后再查」"
      - "把工具错误从回填改为直接抛异常，让请求立刻失败、不再继续消耗 Token，并在日志里记录错误"
    answer: [0]
    explain: |
      根因有三：循环没有步数上限、没有重复检测、工具错误信息没有告诉模型「重试无用」。第一项同时补上代码层上限、重复检测、可操作的错误信息、工具层有限重试和监控告警，最完整。
      缩短网关超时只是更早切断，后端可能仍在跑，也没有给用户体面的答复；Prompt 约束不可靠；直接抛异常会让所有请求 500，丢失已拿到的部分结论。

interview:
  - id: d32-i1
    kp: d32-k2
    type: short
    difficulty: 2
    question: 如果不用任何框架，你怎么实现一个能调用工具的 Agent？请讲讲关键代码和容易出错的地方。
    key_points:
      - {text: "说明循环结构：调模型、有 tool_calls 就执行并回填、没有就返回 content", dim: concept}
      - {text: "说明消息顺序：先追加带 tool_calls 的 assistant 消息，每个调用一条带 tool_call_id 的 tool 消息", dim: principle}
      - {text: "指出 arguments 是 JSON 字符串、content 要序列化、一轮可能有多个调用", dim: engineering}
      - {text: "提到工具异常要转成结果回填、必须设最大步数和兜底", dim: engineering}
      - {text: "结合项目说明为什么先手写再迁移框架", dim: project}
    reference: |
      **核心就是一个 for 循环加一个消息列表。**
      1. messages 初始化为 system 和 user 消息；
      2. 每轮带上 messages 和 tools 调模型；
      3. 回复里没有 tool_calls，就把 content 当最终答案返回；
      4. 有 tool_calls，先把这条 assistant 消息追加进 messages，再逐个执行工具，每个调用追加一条 `role: tool` 的消息，用 tool_call_id 和调用配对；
      5. 循环有最大步数，用完返回兜底话术。

      **容易出错的地方**：
      - 忘记先追加 assistant 消息，下一轮接口报 400；
      - 只处理第一个调用，模型并行返回多个时其余没有结果；
      - arguments 是 JSON 字符串，要 json.loads，解析失败也要回填错误；
      - 工具结果要序列化成字符串，中文用 ensure_ascii=False；
      - 工具异常直接抛出会让整个请求失败，应该转成错误结果回填让模型换思路。

      **项目里**：园区运营 Agent 先用这几十行代码跑通设备离线排查，确认国产模型的并行调用和参数表现，再迁移到 LangGraph，因为那时需要 checkpoint 和人工审批。
    oral: |
      不用框架的话，核心就是一个 for 循环加一个消息列表。每轮把消息和工具定义发给模型，如果回复里没有工具调用，就直接返回内容；如果有，先把这条 assistant 消息追加进去，再逐个执行工具，每个调用追加一条 tool 消息，用 tool_call_id 对上。
      容易踩的坑有几个：忘了先追加 assistant 消息会报 400；模型一次返回多个调用要全部处理；参数是 JSON 字符串要解析；工具报错要转成结果回填，不能直接抛。最后一定要有最大步数。
      我们园区项目就是先手写这个循环跑通排障，确认模型表现后，再因为要做审批和断点恢复迁到 LangGraph。
  - id: d32-i2
    kp: d32-k4
    type: scenario
    difficulty: 3
    question: 线上反馈 Agent 偶尔「卡死」：一个请求跑了两分钟才超时，trace 显示它在反复调用同一个工具。你会怎么排查和修复？
    key_points:
      - {text: "先看 trace 中重复调用的工具名、参数和返回内容，判断是工具报错、结果为空还是结果没回填", dim: engineering}
      - {text: "检查工具结果是否真的追加进了消息历史，状态丢失会让模型以为没查过", dim: principle}
      - {text: "代码层加最大步数、重复签名检测、总超时和 Token 预算，超限给部分结论", dim: engineering}
      - {text: "改进工具错误信息，明确告诉模型重试无用或应换参数，并在工具层做有限次退避重试", dim: engineering}
      - {text: "记录 stop_reason 做监控告警，用复现用例和评测集验证修复", dim: project}
    reference: |
      **排查（按 trace 逐步看）**：
      1. **重复的是什么**：工具名、参数是否完全相同，每次返回什么。
      2. **三种常见根因**：
         - 工具一直报错（如下游 503），错误信息只写「失败」，模型以为重试会好；
         - 工具返回空结果或缺字段，模型认为「没查到」继续查；
         - **结果根本没回填进消息**（代码 bug），模型每轮都看不到已查过，只能再查。
      3. 检查循环本身：是不是 `while True`、有没有重复检测。

      **修复（分层）**：
      - **循环层**：最大步数（如 8）、重复签名检测（工具名 + 规范化参数，超过 2 次拦截并回填提示）、总超时、Token 预算；超限返回已确认的部分结论并转人工。
      - **工具层**：对 503、超时做有限次退避重试；仍失败时回填可操作的错误，比如「设备接口暂不可用，请勿重试，直接告知用户稍后再查」；空结果写明「未查到该设备，请确认编号」。
      - **监控**：记录 stop_reason，max_steps 和 repeated 占比超阈值告警。

      **验证**：用 mock 工具固定返回 503 或空结果复现，确认修复后请求在步数内体面结束；再跑评测集确认正常任务的成功率没有下降。
    oral: |
      我会先看 trace，确认它重复调的是哪个工具、参数是不是完全一样、每次返回了什么。通常是三种原因：工具一直报错但错误信息没说清楚，模型以为重试会好；工具返回空结果；或者代码 bug 导致结果没回填，模型每轮都看不到已经查过。
      修复分三层。循环层加最大步数、重复调用检测、总超时和 Token 预算，超了就给部分结论转人工。工具层对 503 做有限次重试，还失败就明确告诉模型别重试、直接告知用户。监控上记录停止原因，异常升高就告警。
      最后用 mock 工具复现这个场景，确认修复有效，再跑评测集确认正常任务没受影响。
  - id: d32-i3
    kp: d32-k3
    type: design
    difficulty: 4
    question: 如果让你不依赖框架，从零设计一个可以上生产的 Agent 运行时，你会拆成哪些模块？什么情况下你会改用 LangGraph 这类框架？
    key_points:
      - {text: "列出模块：上下文组装、模型调用层、调用解析、工具执行器、状态存储、终止控制、可观测性", dim: concept}
      - {text: "明确模型与代码的分工：身份注入、权限、参数校验、确定性计算、停止条件都在代码里", dim: principle}
      - {text: "工具执行器负责校验、超时、错误回填、结果截断，写操作需要确认和幂等", dim: engineering}
      - {text: "给出改用框架的判断：需要断点恢复、人工审批中断、复杂分支图、流式和团队协作规范时", dim: engineering}
      - {text: "结合项目说明手写版和框架版如何衔接，并用评测集对比", dim: project}
    reference: |
      **模块拆分**：
      1. **上下文组装**：系统提示 + 工具定义 + 历史消息，负责裁剪和摘要（Day 35）。
      2. **模型调用层**：超时、重试、限流、模型路由，记录 Token 用量（Day 19）。
      3. **调用解析**：读取 tool_calls，校验工具名存在、参数是合法 JSON。
      4. **工具执行器**：从登录态注入身份并鉴权；参数业务校验；单工具超时；异常转成可读错误回填；结果截断；写操作走确认和幂等键（Day 33）。
      5. **状态存储**：消息历史和中间变量，按会话持久化，支持恢复。
      6. **终止控制**：最大步数、重复检测、总超时、Token 预算、用户取消，统一产出 stop_reason 和兜底回答。
      7. **可观测性**：每步记录模型输出、工具参数、结果摘要、耗时、成本，串成 trace（Day 43）。

      **分工原则**：模型负责理解和决定下一步；身份、权限、校验、计算、停止全部在代码里。

      **什么时候改用框架**：当需要**断点恢复**（进程重启后从第 5 步继续）、**人工审批中断**（等值班长点确认再继续）、**复杂分支和子图**、统一的**流式输出**，以及团队需要统一规范时，自己维护这些成本很高，改用 LangGraph 更划算（Day 36~37）。

      **项目衔接**：园区运营 Agent 先手写循环跑通只读排障；加入工单审批后迁到 LangGraph，用 interrupt 做审批、checkpointer 做恢复。迁移前后用同一评测集对比成功率、步数和延迟，确保行为一致。
    oral: |
      我会拆成七个模块：上下文组装、模型调用层、调用解析、工具执行器、状态存储、终止控制和可观测性。原则是模型只负责理解和决定下一步，身份、权限、参数校验、计算和停止条件全在代码里。
      工具执行器是重点：身份从登录态注入，参数做业务校验，单工具有超时，异常转成可读错误回填，写操作要确认加幂等键。终止控制统一管最大步数、重复检测、超时和预算，输出停止原因。
      什么时候用框架？当我需要断点恢复、人工审批中断、复杂分支的时候，自己维护太贵。我们园区项目就是先手写跑通只读排障，加了工单审批后迁到 LangGraph，迁移前后用同一份评测集对比。
