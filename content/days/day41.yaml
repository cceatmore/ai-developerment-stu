day: 41
phase: 5
title: 评测基础：评测集、指标与错误分析
goals:
  - 能解释为什么 LLM 应用必须做评测，并说出评测驱动开发的循环
  - 能为一个 RAG 或 Agent 功能设计评测集：来源、样本字段、规模、分组与版本管理
  - 能按成本从低到高选择判定方式，并判断一次通过率变化是否可信
  - 能用错误分析把失败归因到具体组件，并据此排出修复优先级
