knowledge_points:
  - id: d41-k1
    name: 评测驱动开发：为什么 LLM 应用必须做评测
    level: P0
    summary: 没有评测，每次改 Prompt、换模型都是赌博；先用小评测集量化，再迭代
    analogy: |
      像前端的 **单元测试 + E2E + 线上 Sentry 监控** 三件套：评测集相当于一套「对 AI 功能的 E2E 用例」，每次改动都跑一遍。
      **不一样的地方**：前端用例要求 100% 通过、断言是确定的；LLM 输出不固定，评测看的是**一批样本的通过率和趋势**，断言常常要靠规则、参考答案甚至另一个模型来做。
    why: |
      2026 年 AI 应用和 Agent 岗位 JD 里「评测」出现率很高，面试官最常问的一句话是：**「你怎么证明它变好了？」**
      答不出来，说明你的项目只停留在「能跑」；答得出来，才说明你能持续迭代、能对结果负责。
    problem: |
      解决「改动之后到底变好还是变差」的问题。
      没有评测时，常见情况是：产品经理手点 5 个问题觉得还行就上线；修好一类问题，另一类问题悄悄变差，直到用户投诉才发现；换模型只凭感觉，说不清值不值得多花钱。
    principle: |
      **一、没有评测时，团队靠什么做决定？**

      靠「感觉」（业内叫 vibe check）：随手问几个问题，看着顺眼就上线。问题在于：
      - 样本太少，覆盖不了真实问题分布；
      - 没有记录，下次改动无法对比；
      - 每个人的「顺眼」标准不一样。

      **二、评测驱动开发的循环**

      吴恩达在 Agentic AI 课程 Module 4 里给出的建议是：**不要一开始就设计完美指标**，而是先做出粗糙原型，人工看一批输出，找到真正出问题的维度，再针对这些维度建评测。

      ```mermaid
      flowchart LR
        A["做出粗糙原型"] --> B["人工看 10 到 20 条输出"]
        B --> C["找出关心的失败维度"]
        C --> D["建小评测集与指标"]
        D --> E["改动 Prompt 模型 检索 工具"]
        E --> F["跑评测 对比上一版"]
        F --> G["错误分析 定位组件"]
        G --> E
        F -->|"发现新失败类型"| C
      ```

      关键点：
      - **评测集和指标本身也在迭代**，看到新失败类型就补样本、补指标。
      - 有了数字，才能回答「这次改动有没有用」，团队讨论从「我觉得」变成「数据显示」。

      **三、评测的两个分类维度**

      | | 每条样本有标准答案 | 没有逐条标准答案 |
      |---|---|---|
      | **客观（代码可判）** | 抽取的发票金额是否等于标注值 | 回答长度是否在 300 字内、JSON 是否合法 |
      | **主观（LLM 评审）** | 回答是否覆盖参考要点 | 语气是否专业、是否有同理心 |

      能用代码判的就别用模型判：**便宜、稳定、可复现**。主观维度才交给 LLM-as-Judge（见 Day 42）。

      **四、评测在测试体系里的位置**

      | 层次 | 测什么 | 何时跑 |
      |---|---|---|
      | 单元测试 | 模板渲染、解析、权限过滤（LLM 用 Mock） | 每次提交 |
      | 离线评测集 | 回答质量、检索命中、工具调用、安全用例 | 改 Prompt、模型、检索参数时 |
      | 线上监控 | 真实流量的点踩率、成本、延迟 | 持续（见 Day 43） |

      **五、公开 benchmark ≠ 你的评测集**

      MMLU、GAIA、BFCL 这类公开基准适合**粗选模型**；但你的用户问什么、你的知识库长什么样，只有业务评测集能回答。李宏毅在评估讲次里也提醒：公开榜单可能有**数据泄漏**（模型训练时见过测试题），分数不能全信。

      **不做会怎样**：系统只能靠用户投诉发现问题，团队越来越不敢改 Prompt，项目停在 Demo 水平。
    scenarios: |
      - 知识库问答上线前：用 50 条真实问题的评测集给出「正确率、引用正确率、拒答正确率」三项数字，作为上线依据。
      - 厂商发布新模型：同一评测集跑新旧两个模型，对比质量、成本、延迟，再决定是否切换。
      - 面试被问「你怎么证明效果」：拿出评测集规模、指标定义、前后对比数据，而不是「用户反馈不错」。
    pitfalls: |
      - **误区：LLM 输出不确定，所以没法测。** 确定的部分（格式、引用、工具参数）可以精确测；不确定的部分看通过率。
      - **误区：先设计完美的指标体系再动手。** 指标应在看过真实输出后逐步形成，一开始 20 条样本就能起步。
      - **误区：拿公开榜单分数代替业务评测。** 榜单和你的场景分布不同，且可能有数据泄漏。
      - **混淆：评测和单元测试。** 单元测试要求每条都过；评测看整体与分组通过率是否达标、是否比上一版好。
    interview_asks:
      - question: "你怎么证明你的 AI 功能效果好？有数据吗？"
        answer: "拿出评测集上的通过率、拒答是否正确、引用是否对，并和上一版对比。没有固定题目和评分规则，就不能说效果好。线上满意度是补充，不能代替这组数。"
      - question: "LLM 输出是不确定的，你们怎么做测试？"
        answer: "同一题可以跑多次，看成功率而不是某一次。能用规则判的用规则，比如 JSON 字段、引用 id。开放回答用固定量表的评审，并抽一部分人工复核。温度能定就定住。"
      - question: "公开榜单分数高的模型，为什么在你们的业务里不一定好？"
        answer: "榜单的题不是你的文档、你的工具、你的拒答规则。要在自己的评测集上比。榜单只用来缩小候选，最后以自己的数字为准。"
    project_example: |
      **p1 企业知识库**：在 Day 29 的检索评测基础上，把评测扩展到端到端回答。
      每次修改切片、重排或 Prompt 后，在同一份评测集上输出四个数字：检索 Recall@5、回答正确率、引用正确率、应拒答样本的拒答率，并与上一版并排展示。
      面试时可以说「这次重排上线前后，正确率从 X 到 Y」，X、Y 用你自己的评测结果填写。
  - id: d41-k2
    name: 评测集构建：来源、字段、规模与版本
    level: P0
    summary: 评测集决定评测的上限：来源要贴近真实分布，样本要有参考答案和分组标签，并像代码一样版本化
    analogy: |
      像前端的 **测试 fixtures / Mock 数据**：一份精心准备、进仓库、可复用的输入与期望输出。
      **不一样的地方**：前端 fixture 是开发者随手编的；评测集必须**贴近真实用户分布**，否则分数再高也没意义，而且要持续从线上补充。
    why: |
      评测结论是否可信，首先取决于评测集。随手写的 20 条问题往往都是「开发者觉得重要」的问题，和用户真实问法差距很大。
      面试官会追问：「评测集从哪来？多少条？怎么维护？」答得具体，评测数字才有说服力。
    problem: |
      解决「用什么数据来衡量系统」的问题：样本覆盖不到真实场景、缺少参考答案无法判定、不同版本的评测集混用导致分数不可比、评测样本被当成 few-shot 示例导致分数虚高。
    principle: |
      **一、样本长什么样**

      一条评测样本至少包含：

      | 字段 | 作用 | 例子 |
      |---|---|---|
      | `id` | 稳定标识，便于跨版本对比 | `kb-0042` |
      | `input` | 用户输入，必要时含多轮历史 | 「年假可以跨年吗？」 |
      | `expected` | 参考答案或**关键事实点** | 「可顺延至次年 3 月 31 日」 |
      | `expected_docs` / `expected_tools` | 应命中的文档或应调用的工具 | `["hr-leave-2026.pdf"]` |
      | `tags` | 分组：问题类型、难度、是否应拒答、风险 | `["policy", "should_answer"]` |
      | `source` | 来源：日志、专家、失败案例、合成 | `prod_log` |

      **关键事实点**比整段参考答案更好用：判定时只看「有没有说到、有没有说错」，不纠结措辞。

      **二、样本从哪来**

      ```mermaid
      flowchart LR
        S1["线上日志分层抽样 先脱敏"] --> P["候选池"]
        S2["业务专家编写关键场景"] --> P
        S3["历史失败案例与投诉"] --> P
        S4["对抗与安全用例"] --> P
        S5["LLM 合成 必须人工审核"] --> P
        P --> L["标注 参考要点 应命中文档 分组"]
        L --> V["评测集 v1 进仓库"]
        V --> D["dev 日常调参"]
        V --> H["holdout 留出 定期检查"]
      ```

      - **线上日志**最能反映真实分布，按问题类型分层抽样，避免全是高频简单问题。
      - **专家编写**补齐低频但高风险的场景（如离职权限回收）。
      - **失败案例**防止同样的问题复发。
      - **负样本必须有**：知识库里没有答案的问题（应拒答）、意图不清的问题（应澄清）。否则系统「编造答案」永远测不出来。
      - **合成数据**能快速扩量，但问法往往贴近文档原文而不像真实用户，答案也可能错，必须人工审核后才能进集。

      **三、多少条才够**

      - 起步 **20~50 条高质量样本**就能开工（吴恩达的建议：先粗后精）。
      - 逐步增长到 **100~300 条**，关键分组每组最好有几十条，否则一两条的波动就会让分组通过率大幅变化。
      - 低质量样本（没有参考答案、重复、标注错误）只会制造噪声，**质量优先于数量**。

      **四、版本化与防污染**

      - 评测集存为 JSONL 放进仓库，或用 Langfuse / LangSmith 的 Datasets（Langfuse 支持在指定数据集版本上运行实验）。**分数只在同一版本评测集上可比。**
      - **防污染**：评测样本不能出现在 few-shot 示例、微调数据或 System Prompt 里，否则分数虚高。
      - **留出集（holdout）**：日常调 Prompt 只看 dev 部分；holdout 定期跑一次，检查是否「对着评测集调参」过拟合。
      - 知识库内容更新时，同步更新受影响样本的参考答案，并升级评测集版本号。
    scenarios: |
      - IT 服务台机器人：从三个月日志按「账号 / VPN / 软件申请 / 硬件」分层抽 120 条，专家补 30 条高风险场景，再加 20 条应拒答和 10 条注入用例。
      - Coding Agent：收集 30 个真实需求描述，标注「完成这个需求必须读到的文件」，用来评测仓库上下文检索。
      - 政策更新后：批量查找引用旧政策的样本，更新参考要点，评测集从 v3 升到 v4。
    code: |
      评测集用 JSONL（一行一条）存放，用 Pydantic 校验字段，避免脏样本混进来：

      ```python
      import json
      from pathlib import Path

      from pydantic import BaseModel, Field


      class EvalCase(BaseModel):
          id: str
          input: str
          expected_points: list[str] = Field(default_factory=list)  # 关键事实点
          expected_docs: list[str] = Field(default_factory=list)
          tags: list[str] = Field(default_factory=list)
          should_refuse: bool = False
          source: str = "expert"


      def load_cases(path: str) -> list[EvalCase]:
          lines = Path(path).read_text(encoding="utf-8").splitlines()
          cases = [EvalCase.model_validate(json.loads(x)) for x in lines if x.strip()]
          ids = [c.id for c in cases]
          assert len(ids) == len(set(ids)), "评测集中有重复 id"
          return cases


      cases = load_cases("eval/golden_v3.jsonl")
      print(len(cases), sum(c.should_refuse for c in cases))
      ```
    pitfalls: |
      - **误区：评测集全是「能找到答案」的问题。** 没有应拒答样本，就测不出系统编造答案。
      - **误区：用 LLM 批量生成上千条直接用。** 合成样本措辞贴近文档、答案可能错，必须人工审核。
      - **误区：把上次模型输出当参考答案。** 会把模型的错误固化成「标准」。
      - **误区：评测样本顺手当 few-shot 示例。** 数据污染，分数虚高。
      - **误区：反复在同一批样本上调 Prompt，只看这一批的分数。** 会过拟合评测集，需要留出集检查。
    interview_asks:
      - question: "你的评测集是怎么构建的？有多少条？来源是什么？"
        answer: "从线上真实问题和失败案例里抽，补上该拒答和边界题。每条有来源和期望结果。规模取决于类型覆盖，先过百再按坏例长。不能只让模型自己出题自己答。"
      - question: "评测集怎么维护？知识库更新了怎么办？"
        answer: "评测集有版本。文档改了，受影响的题要改期望引用和答案，过期题标出。每次发版记录用的是哪一版题。不要默默改题还和旧分比较。"
      - question: "用 LLM 合成评测数据有什么风险？"
        answer: "题会变得整齐、简单，和用户真实问法不像，分会虚高。合成题可以补充，必须混进真实问题，并让人检查答案是不是只在文档里。"
    project_example: |
      **p3 前端 Coding Agent（仓库上下文模块）**：从团队历史需求单里挑 30 条，例如「给用户列表页加按部门筛选」，由熟悉仓库的人标注「必须读到的文件」（如 `views/UserList.vue`、`api/user.ts`、`stores/dept.ts`）。
      评测时让 Agent 的上下文检索模块只做「找文件」这一步，计算文件级 Recall@5：标注文件中有多少出现在前 5 个检索结果里。
      样本加 `tags` 区分「单文件改动 / 跨组件改动 / 需要读类型定义」，评测集存为 `eval/repo_ctx_v1.jsonl` 进仓库。
  - id: d41-k3
    name: 指标设计：判定方式、聚合与可信度
    level: P1
    summary: 能用规则判的不用模型判；看整体也看分组；样本少时小幅变化可能只是噪声
    analogy: |
      像前端的 **Lighthouse 分数 + 性能预算**：既有总分，也有 LCP、CLS 等分项，任何一个分项超预算都要报警。
      **不一样的地方**：Lighthouse 每次跑结果相对稳定；LLM 评测本身有随机性，同一版本跑两次分数也会不同，所以要看波动范围。
    why: |
      同一份评测集，用不同的判定方式和聚合方式，可能得出相反的结论。
      指标设计不好，团队会朝错误方向优化（例如为了评审分数把回答写得越来越长）。
    problem: |
      解决「怎么把一条输出判成对或错、怎么把一批结果汇总成可信结论」的问题。
      常见错误：只用 Exact Match 导致大量误判、只看整体平均掩盖关键分组退化、把随机波动当成真实提升。
    principle: |
      **一、判定方式：从便宜到昂贵**

      | 方式 | 适合 | 注意 |
      |---|---|---|
      | 规则 / 代码 | JSON 合法、字段齐全、引用 ID 存在、是否拒答、长度 | 最便宜最稳定，优先用 |
      | 归一化匹配 | 数字、短答案、选项 | 先去空格、标点、大小写再比较 |
      | 关键事实覆盖 | 开放式回答 | 逐条检查要点是否被提到、是否说错 |
      | 结构匹配 | 工具调用参数 | 比较函数名和参数，而不是比较字符串（见 Day 42） |
      | LLM 评审 | 语气、完整性、是否有依据 | 需要校准（见 Day 42） |
      | 人工 | 最终裁判 | 最贵，用来校准其他方式 |

      李宏毅在评估讲次中举过例子：问「玉山多高」，模型答「玉山高 3952 公尺」，标准答案是「3952 公尺」，**Exact Match 会判错**。所以短答案要归一化，长答案要看关键事实点。

      **二、二元判定优先**

      1~10 分的打分里，6 分和 7 分的差别谁也说不清，标注者之间、评审模型前后两次都不一致。
      更好的做法：**把质量拆成几个维度，每个维度判 pass / fail**，例如「事实正确」「引用正确」「格式正确」各判一次。

      **三、聚合：整体 + 分组 + 守护指标**

      ```mermaid
      flowchart TB
        R["逐条判定结果"] --> O["整体通过率"]
        R --> G["分组通过率 类型 难度 风险"]
        R --> X["守护指标 成本 延迟 拒答率"]
        O --> D{"发布判断"}
        G --> D
        X --> D
        D -->|"关键分组下降或守护指标超预算"| B["阻止并分析"]
        D -->|"全部达标"| P["进入灰度"]
      ```

      - **只看平均会掩盖局部退化**：整体 +3%，安全用例分组可能 -10%。
      - **守护指标**：质量提升的同时，Token、延迟、拒答率不能失控。

      **四、这次变化可信吗？**

      - 50 条样本时，**1 条样本 = 2 个百分点**。80% 到 82% 可能只是一条样本的随机波动。
      - 做法：同一版本**多跑几次**看波动范围；小幅变化看具体是哪几条样本变了；关键结论要扩充样本后再下。

      **五、Goodhart 定律**

      「当一个指标变成目标，它就不再是好指标。」把某个评分写进 KPI 后，团队可能学会「讨好评分」而不是改善体验。所以要**多指标互相制衡**，并定期用线上反馈校验离线指标。
    scenarios: |
      - 发票抽取：金额、日期用归一化后精确匹配，商品明细用字段级 F1。
      - 知识库问答：正确性用关键事实覆盖，引用用规则检查引用 ID 是否在检索结果中，拒答用 `should_refuse` 标签对照。
      - 版本对比：整体通过率、每个分组通过率、平均 Token、P95 延迟并排输出成一张表。
    code: |
      最简单也最常用的「归一化匹配」：

      ```python
      import re


      def normalize(s: str) -> str:
          s = s.strip().lower()
          return re.sub(r"[，。,.\s]", "", s)


      def quasi_exact(pred: str, gold: str) -> bool:
          return normalize(pred) == normalize(gold)


      def pass_rate(results: list[bool]) -> float:
          return sum(results) / len(results) if results else 0.0


      print(quasi_exact("3952 公尺。", "3952公尺"))  # True
      ```
    pitfalls: |
      - **误区：一律用 Exact Match。** 「3」和「三」、「玉山高 3952 公尺」和「3952 公尺」都会被误判。
      - **误区：用 1~10 分细粒度打分。** 噪声大、难校准，优先按维度二元判定。
      - **误区：整体通过率涨了就上线。** 要看关键分组和守护指标。
      - **误区：50 条样本里涨 2 个百分点就宣布显著提升。** 可能只是一条样本的波动。
    interview_asks:
      - question: "你的评测指标是怎么设计的？为什么这么设计？"
        answer: "先写用户在乎的失败：答错、该拒不拒、引用错、工具调错。每种失败一个能判定的指标。能规则判定就不用打分。指标要能指导改哪一层。"
      - question: "评测集只有 50 条，通过率涨了 2 个点，你信吗？"
        answer: "不信。50 条里 2 个点就是一题，可能是波动。先看是哪一题变了，再加大这类题或重复跑几次。小集合只适合发现明显退步，不适合宣布提升。"
      - question: "为什么不建议让评审模型打 1 到 10 分？"
        answer: "分差没有稳定含义，7 和 8 换一次就变。改成通过、不通过，或少数几个有定义的等级，并给出失败原因。判定越少，越容易和人对齐。"
    project_example: |
      **p1 企业知识库**：评测报告固定为一张表，列是新旧两个版本，行是：整体正确率、「制度类 / 流程类 / 数据类 / 应拒答」四个分组的通过率、引用正确率、平均输入 Token、P95 延迟。
      发布规则写进 README：应拒答分组不允许下降；整体下降超过阈值不合并；样本变化少于 2 条时标注「可能是波动」，需要重复运行确认。
  - id: d41-k4
    name: 错误分析：从失败样本到修复优先级
    level: P0
    summary: 逐条读失败样本的 Trace，找到第一个出错的步骤，按组件统计频次，再按收益和成本排优先级
    analogy: |
      像前端排查线上问题时用 **Sentry 的 Issue 聚合 + Performance 面板定位慢函数**：先把错误归类、看哪类最多，再下钻到具体调用栈。
      **不一样的地方**：LLM 系统的失败大多**不报错**，回答看起来很通顺但内容错了，必须有人逐条读 Trace 判断，无法完全靠自动聚合。
    why: |
      吴恩达认为，团队推进 Agent 的速度，最大的预测因素是能否坚持做**评测和错误分析**。
      没有错误分析，团队会凭直觉乱改：换更贵的模型、把 Prompt 写得越来越长，结果钱花了、问题还在。
    problem: |
      解决「知道通过率低，但不知道先修什么」的问题。
      一个 RAG 或 Agent 系统有检索、规划、工具调用、生成等多个环节，最终答案错了，可能是任何一个环节的问题，必须定位到具体组件才能有效修复。
    principle: |
      **一、流程**

      ```mermaid
      flowchart TB
        A["收集失败样本 评测失败与线上点踩"] --> B["逐条读 Trace"]
        B --> C["标注第一个出错的步骤和现象"]
        C --> D["归纳成错误类别"]
        D --> E["统计每类频次"]
        E --> F["按 频次 乘 影响 除以 修复成本 排序"]
        F --> G["修复并做组件级评测"]
        G --> H["端到端回归评测"]
        H --> A
      ```

      **二、为什么要找「第一个出错的步骤」**

      后面的错误经常是前面错误的连锁反应：检索没召回正确文档，生成必然答错；如果把它记成「生成幻觉」，就会去改错地方。

      **三、一个典型的错误分析表**

      抽 20 条失败 Trace 后得到：

      | 出错环节 | 典型现象 | 条数 |
      |---|---|---|
      | 检索 | 召回了去年的旧制度 | 9 |
      | 工具调用 | 园区编号传成了园区名称 | 6 |
      | 规划 | 没确认身份就回答了 | 3 |
      | 生成 | 文档里有答案但总结错了 | 2 |

      结论很直观：**先修检索和工具参数**，改 Prompt 措辞的收益最多只有 10%。

      **四、怎么做得快**

      - **从几条开始**：吴恩达明确说过，一开始非正式地读几条 Trace 就有价值，随着系统成熟再逐步严谨。
      - **先自由记录，再归类**：第一遍对每条失败写一句话描述现象，看完一批后再归纳成类别，不要一开始就套死分类。
      - **对照人类水平**：问自己「一个熟练员工在这一步会这么做吗？」，差距最大的步骤优先。

      **五、组件级评测**

      定位到某个组件后，单独为它建小评测：例如只评「检索是否召回正确文档」或「工具参数是否正确」。
      - 优点：**更快、更便宜、信号更清晰**，不受其他环节噪声影响。
      - 但修完后仍要跑**端到端评测**，确认整体真的变好。
      - 如果每个组件单独都不错、组合起来却差，可能是**任务拆分方式本身**需要调整（吴恩达在 The Batch 中也提到，模型变强后常常可以拆掉一些写死的步骤）。
    scenarios: |
      - 客服 Agent 通过率 70%：读 25 条失败 Trace，发现一半是订单号格式错误，加参数校验与格式化后再评测。
      - RAG 问答被投诉「答非所问」：错误分析显示多数是多轮对话中指代没消解，于是先做查询改写的组件级评测。
      - 换模型前：先做错误分析，确认问题是不是模型能力导致的，避免花冤枉钱。
    pitfalls: |
      - **误区：通过率低就直接换更强的模型。** 如果问题在检索或工具参数，换模型几乎没用。
      - **误区：只看最终答案，不看中间步骤。** 会把检索问题误判成生成问题。
      - **误区：等积累上千条失败样本再分析。** 几条 Trace 就能发现明显问题。
      - **误区：组件级评测过了就不跑端到端。** 组件之间的配合问题只有端到端能发现。
    interview_asks:
      - question: "Agent 效果不好，你怎么定位问题？"
        answer: "看失败轨迹，把错误分成选错工具、参数错、不该停、观察没用上。统计哪一类最多。最多的那一类如果能改成固定步骤或改工具说明，就不要先换模型。"
      - question: "什么是错误分析？你做过吗？结论是什么？"
        answer: "把失败样本逐条标原因，看分布，而不是看总分。例如发现一半是检索没召回，就去修检索，而不是改回答提示。结论必须来自这一批标注，不能凭印象。"
      - question: "组件级评测和端到端评测分别什么时候用？"
        answer: "改检索就跑检索指标，改工具就跑工具参数对不对。端到端看用户最终有没有得到正确答案。组件分高但端到端差，说明接口之间接坏了。两级都要有。"
    project_example: |
      **p2 智慧园区运营 Agent**：评测集中「查询告警并派单」类任务失败较多。抽 20 条失败 Trace 逐条看，记录第一个出错的步骤：
      多数是 `query_alarms` 的 `park_id` 传成了园区中文名，少数是工单类型选错，个别是回答语气问题。
      于是先增加「园区名称到编号」的解析工具，并为它建 30 条组件级评测；修复后再跑端到端评测，看整体通过率是否提升（数字用你的评测结果填写）。
test:
  - id: d41-t1
    kp: d41-k1
    type: single
    question: 按吴恩达在 Agentic AI 课程中的建议，一个新的 Agent 项目应该怎样开始做评测？
    options:
      - "先花两周设计完整指标体系和上千条评测集，再写原型"
      - "先做粗糙原型，人工看一批输出，找到失败维度后再建小评测集"
      - "先跑 MMLU 等公开榜单，分数够高再考虑做业务评测"
      - "先上线收集用户反馈，等投诉多了再根据投诉建评测集"
    answer: [1]
    explain: |
      吴恩达建议评测驱动开发：先快速做原型，人工看 10~20 条输出，找出真正会出问题的维度，再建小评测集和指标，之后随着新失败类型持续迭代。
      一开始就设计完美体系会脱离真实失败；公开榜单与业务分布不同；等投诉再建评测意味着问题已经伤害了用户。
  - id: d41-t2
    kp: d41-k1
    type: single
    question: 以下哪一项最适合用「代码可判定的客观评测」来检查，而不需要 LLM 评审？
    options:
      - "客服回答的语气是否足够有同理心"
      - "两版会议摘要哪一版更抓住重点"
      - "回答引用的文档 ID 是否都在本次检索结果中"
      - "操作说明对新员工来说是否容易理解"
    answer: [2]
    explain: |
      引用的文档 ID 是否属于本次检索结果，是集合包含关系，用几行代码就能精确判定，便宜、稳定、可复现。
      语气、重点、易懂程度都是主观维度，没有唯一标准，需要 LLM 评审或人工判断，并且要先校准。
  - id: d41-t3
    kp: d41-k1
    type: judge
    question: 公开榜单分数更高的模型，在我们自己的业务评测集上也一定表现更好，所以模型选型只需要看榜单。
    answer: false
    explain: |
      公开榜单的题目分布与你的业务问题、知识库、工具都不同，而且可能存在数据泄漏（模型训练时见过测试题），分数会虚高。
      榜单适合粗筛候选模型，最终决定要在自己的业务评测集上对比质量、成本和延迟。
  - id: d41-t4
    kp: d41-k1
    type: multi
    question: 以下哪些现象说明团队「缺少评测」？
    options:
      - "改完 Prompt 后由产品经理手点 5 个问题，觉得还行就上线"
      - "说不清这次换模型到底是变好了还是变差了"
      - "每个 PR 都会跑 Mock LLM 的单元测试和一份固定评测集"
      - "修好一类问题后另一类悄悄变差，直到用户投诉才发现"
    answer: [0, 1, 3]
    explain: |
      手点几个问题就上线、无法量化改动效果、回归问题靠投诉发现，都是没有评测集或评测没有进入流程的典型表现。
      每个 PR 跑单元测试和固定评测集恰恰是有评测的做法，不属于缺少评测。
  - id: d41-t5
    kp: d41-k1
    type: single
    question: 离线评测和传统单元测试最大的区别是什么？
    options:
      - "评测看一批样本的通过率与趋势，不要求每条都通过"
      - "评测只能靠人工来做，没有办法做成自动化流程"
      - "评测不需要任何参考答案，只有单元测试才需要"
      - "评测只在上线后跑，单元测试只在上线前跑"
    answer: [0]
    explain: |
      LLM 输出不固定，评测衡量的是一批样本的整体与分组通过率，并和上一个版本比较；单元测试要求每条断言都通过。
      评测可以用规则和 LLM 评审自动化；很多评测需要参考答案；评测在上线前作为门禁、上线后作为监控都会跑。
  - id: d41-t6
    kp: d41-k2
    type: single
    question: 关于评测集的起步规模，哪个说法最合理？
    options:
      - "至少要 5000 条，少于这个数量就没有任何统计意义"
      - "10 条就足够了，之后也不需要再扩充，避免维护成本"
      - "直接用 LLM 生成 2000 条问答，省去人工审核的时间"
      - "先用 20~50 条高质量样本起步，再按失败案例持续扩充"
    answer: [3]
    explain: |
      评测集质量优先于数量，20~50 条有参考答案、贴近真实分布的样本就能开始指导迭代，之后从失败案例和线上数据持续补充到几百条。
      一开始追求几千条会拖慢进度；只有 10 条且不扩充覆盖不足；未经审核的合成数据可能问法失真、答案出错。
  - id: d41-t7
    kp: d41-k2
    type: multi
    question: 一条评测样本应该包含哪些信息，才能支持判定和后续的分组分析？
    options:
      - "用户输入，必要时包含多轮对话历史"
      - "参考答案或必须提到的关键事实点"
      - "分组标签，如问题类型、难度、是否应拒答"
      - "上一版模型的原始输出，直接作为下次的参考答案"
    answer: [0, 1, 2]
    explain: |
      输入、参考答案或关键事实点、分组标签是评测样本的核心字段：分别用于运行系统、判定对错、按组统计。
      把模型上一版输出当参考答案会把模型的错误固化成标准，新版本改对了反而被判错。
  - id: d41-t8
    kp: d41-k2
    type: judge
    question: 把评测集里的样本拿去当 Prompt 的 few-shot 示例，会让评测分数虚高，属于数据污染。
    answer: true
    explain: |
      模型在 Prompt 里直接看到了评测题和答案，评测时等于「开卷考试」，分数不能代表对新问题的能力。
      评测样本、few-shot 示例、微调数据必须分开管理，必要时保留一份不参与日常调参的留出集来检查是否过拟合。
  - id: d41-t9
    kp: d41-k2
    type: single
    question: 某知识库问答的评测集里，全部问题都能在文档中找到答案。这会带来什么问题？
    options:
      - "没有问题，拒答能力属于安全范畴，不需要放进质量评测"
      - "测不出系统在没有答案时编造回答，拒答能力被忽略"
      - "会让检索召回率指标系统性偏低，影响检索优化方向"
      - "会让 LLM 评审成本翻倍，因为每条都要比对参考答案"
    answer: [1]
    explain: |
      评测集里没有「应拒答」的负样本，系统在知识库无答案时编造内容的行为就永远测不出来，而这恰恰是知识库最常见的严重问题。
      它不会让召回率偏低，也与评审成本无关；拒答能力是回答质量的核心部分，必须纳入评测。
  - id: d41-t10
    kp: d41-k2
    type: single
    question: 下面这段评测脚本用于挑选最好的 Prompt 版本，最大的问题是什么？
    code: |
      import json
      import random

      cases = [json.loads(x) for x in open("eval/golden.jsonl", encoding="utf-8")]
      random.shuffle(cases)
      dev, holdout = cases[:80], cases[80:]

      # 每改一版 Prompt 都在 holdout 上看分数，挑分数最高的版本上线
      best = max(prompt_versions, key=lambda p: run_eval(p, holdout))
    lang: python
    options:
      - "反复用留出集挑版本会对它过拟合，且未固定随机种子导致每次拆分不同"
      - "json.loads 无法处理中文内容，应该改成 yaml.safe_load 来读取文件"
      - "dev 只有 80 条太少，应该删除 holdout，把全部样本都用于调参"
      - "max 函数不支持 key 参数，这一行在 Python 中会直接抛出异常"
    answer: [0]
    explain: |
      留出集的意义是「不参与调参」，用来检查是否过拟合；每一版都在它上面挑最好的，它就变成了调参集，分数会虚高。另外 shuffle 没有固定种子，每次运行拆分不同，结果不可复现。
      json.loads 支持中文；max 支持 key 参数；删掉留出集会失去检查过拟合的手段。
  - id: d41-t11
    kp: d41-k3
    type: single
    question: 下面代码的输出是什么？
    code: |
      import re

      def normalize(s: str) -> str:
          s = s.strip().lower()
          return re.sub(r"[，。,.\s]", "", s)

      def quasi_exact(pred: str, gold: str) -> bool:
          return normalize(pred) == normalize(gold)

      print(quasi_exact("3952 公尺。", "3952公尺"))
      print(quasi_exact("玉山高 3952 公尺", "3952公尺"))
    lang: python
    options:
      - "True 和 True"
      - "False 和 False"
      - "True 和 False"
      - "False 和 True"
    answer: [2]
    explain: |
      第一行去掉空格和句号后两边都是「3952公尺」，返回 True；第二行归一化后是「玉山高3952公尺」，多了「玉山高」三个字，仍然不相等，返回 False。
      这说明归一化匹配只能处理格式差异，处理不了「答案包含在一句话里」的情况，长答案应改用关键事实覆盖判定。
  - id: d41-t12
    kp: d41-k3
    type: multi
    question: 为什么评测中更推荐「按维度二元判定 pass/fail」，而不是让评审打 1~10 分？
    options:
      - "二元标准更容易写清楚，标注者与评审之间更一致"
      - "1~10 分里 6 分和 7 分的差别往往说不清，噪声大"
      - "可以把质量拆成正确性、引用、格式等维度分别判定"
      - "二元判定足够简单，因此不需要人工标注来校准"
    answer: [0, 1, 2]
    explain: |
      二元判定标准清晰、一致性高，细粒度分数的相邻档位难以区分；按维度拆分后还能知道具体哪方面出问题。
      但二元判定同样可能和人工判断不一致，仍需要用人工标注样本校准评审（见 Day 42）。
  - id: d41-t13
    kp: d41-k3
    type: judge
    question: 新版本的整体通过率从 82% 升到 85%，说明每一类问题都变好了，可以直接上线。
    answer: false
    explain: |
      整体平均可能掩盖局部退化：某些分组提升明显，另一些关键分组（如安全用例、应拒答）却可能下降。
      发布前必须看分组通过率和成本、延迟等守护指标，关键分组下降应阻止发布并做错误分析。
  - id: d41-t14
    kp: d41-k3
    type: single
    question: 评测集共 50 条，新 Prompt 的通过率从 80% 变成 82%。最合理的解读是？
    options:
      - "只差 1 条样本，可能是随机波动，应多跑几次或扩充样本再判断"
      - "提升了 2 个百分点，已经足够显著，可以立即全量上线新版本"
      - "通过率提升说明新 Prompt 的成本和延迟也一定同时下降了"
      - "应把仍然失败的样本从评测集中删掉，让通过率更加稳定"
    answer: [0]
    explain: |
      50 条样本时 1 条就是 2 个百分点，LLM 输出和评审本身都有随机性，这种幅度完全可能是噪声。应重复运行看波动范围，查看具体变化的样本，必要时扩充样本。
      质量和成本没有必然关系；删除失败样本会让评测失真。
  - id: d41-t15
    kp: d41-k4
    type: single
    question: Agent 在评测集上的通过率是 70%，你有一周时间改进。按错误分析的思路，第一步应该做什么？
    options:
      - "直接换一个更强更贵的旗舰模型，再看通过率变化"
      - "把 System Prompt 写得更详细，覆盖所有能想到的情况"
      - "给 Agent 增加更多工具，让它在每一步有更多选择"
      - "抽取失败样本逐条读 Trace，按出错环节归类统计"
    answer: [3]
    explain: |
      不知道问题在哪就动手改，往往花了钱和时间却改错地方。先读失败样本的 Trace，找到第一个出错的步骤并按组件统计频次，才能知道先修什么、预期收益多大。
      换模型、加长 Prompt、加工具都是没有依据的猜测，甚至可能引入新问题。
  - id: d41-t16
    kp: d41-k4
    type: multi
    question: 错误分析时要记录「第一个出错的步骤」，原因有哪些？
    options:
      - "后面步骤的错误常常是前面错误引起的连锁反应"
      - "能把失败归因到具体组件，便于决定先修哪里"
      - "第一个出错的步骤一定是模型问题而不是工具问题"
      - "统计各组件出错频次，可以估算修复它的收益上限"
    answer: [0, 1, 3]
    explain: |
      检索没召回会导致生成必然答错，只看最后一步会误判根因；记录第一个出错步骤能准确归因，并用频次估算修复某个组件最多能提升多少。
      第一个出错的步骤可能是检索、工具实现、参数格式、数据过期等任何环节，不一定是模型问题。
  - id: d41-t17
    kp: d41-k4
    type: judge
    question: 组件级评测（例如只评检索是否召回正确文档）比端到端评测更快、更便宜、信号更清晰，但修复后仍然需要跑端到端评测确认整体效果。
    answer: true
    explain: |
      组件级评测隔离了其他环节的噪声，能快速验证某个改动是否有效；但组件之间的配合问题只有端到端评测才能发现，用户感受到的也是端到端结果。
      所以常见流程是：错误分析定位组件，组件级评测迭代修复，最后端到端回归。
  - id: d41-t18
    kp: d41-k4
    type: judge
    question: 错误分析要等积累了上千条失败样本之后才值得做，只看几条 Trace 没有意义。
    answer: false
    explain: |
      吴恩达明确指出，一开始非正式地读几条 Trace 就能发现明显问题（例如搜索关键词总是不合理），随着系统成熟再逐步走向严格的大样本分析。
      等积累上千条再分析，意味着前期一直在盲目修改。
exam:
  - id: d41-e1
    kp: d41-k2
    type: single
    question: 团队用 LLM 根据知识库文档自动生成了 500 条问答，直接作为评测集使用。最主要的风险是什么？
    options:
      - "合成问题过难，真实用户问不出来，分数会被系统性压低"
      - "问法贴近文档原文而非真实用户，答案也未经人工审核"
      - "合成样本无法打分组标签，因此做不了分组统计和门槛"
      - "样本数太多导致评测成本过高，应删减到 20 条以内"
    answer: [1]
    explain: |
      LLM 依据文档出题，问法往往直接复用文档措辞，检索会显得特别容易，分数虚高；生成的答案也可能错误，未经审核就成了错误的标准。
      合成样本完全可以打标签；难度通常偏低而非偏高；规模问题可以通过抽样解决，不是主要风险。
  - id: d41-e2
    kp: d41-k3
    type: single
    question: 客服机器人新版本在评测中整体正确率提升 4 个百分点，但平均输出 Token 增加 60%，P95 延迟增加 2.1 秒。最合理的判断方式是？
    options:
      - "正确率是唯一核心指标，其余只是参考，可以直接上线"
      - "延迟变高说明正确率提升是假象，应立即回滚到旧版本"
      - "成本和延迟是守护指标，需对照预算评估后再决定是否发布"
      - "把延迟和 Token 加权折算进正确率，合成一个总分再比较"
    answer: [2]
    explain: |
      质量提升的同时成本和延迟不能失控，它们是守护指标：要对照预算和体验要求（如首字时间、单次成本上限）判断是否可接受，必要时再优化输出长度。
      只看正确率会忽略代价；延迟变高不代表质量提升是假的；把不同量纲的指标硬合成一个总分会掩盖具体问题。
  - id: d41-e3
    kp: d41-k4
    type: single
    question: |
      错误分析结果：检索未召回 45%、工具参数格式错误 30%、回答措辞生硬 15%、其它 10%。
      修复成本估计：措辞改 Prompt 半天；参数格式加 Schema 校验约一天；检索需要改切片和重排约一周。你只有一周，最合理的安排是？
    options:
      - "先修措辞，因为成本最低，半天就能看到效果"
      - "只修检索，占比最高，其他问题都不值得处理"
      - "先换更大的模型，三类问题可能会一起被解决"
      - "先用一天修参数格式，剩余时间集中修检索"
    answer: [3]
    explain: |
      优先级要综合频次、影响和修复成本：参数格式占 30% 且一天能修，性价比最高；检索占比最大，值得投入剩余时间。
      措辞问题最多带来 15% 的收益；只修检索浪费了低成本高收益的机会；换模型对检索和参数格式问题帮助有限。
  - id: d41-e4
    kp: d41-k1
    type: single
    question: 团队把「LLM 评审给出的平均分」写进季度 KPI。三个月后分数从 3.8 升到 4.6，但用户点踩率几乎没变。最可能的原因是？
    options:
      - "点踩率的统计存在延迟，再等一个季度自然就会下降"
      - "团队在迎合评审偏好优化，指标成了目标后失去度量意义"
      - "评审模型比用户判断更准确，用户的点踩不值得参考"
      - "平均分已接近满分，剩下的点踩都是无法改进的长尾"
    answer: [1]
    explain: |
      这是 Goodhart 定律：指标变成目标后，团队会学会「讨好」评审（例如回答更长、格式更花），而不是真正改善体验。离线指标必须定期用线上反馈校验，并用多个指标互相制衡。
      其余选项都在为指标找理由，没有正视离线指标与用户体验脱节的问题。
  - id: d41-e5
    kp: d41-k2
    type: multi
    question: 关于评测集的维护，哪些做法是正确的？
    options:
      - "评测集带版本号进仓库，分数只在同一版本内比较"
      - "线上点踩样本经复核和脱敏后补充进评测集"
      - "保留不参与日常调参的留出集，定期检查过拟合"
      - "政策更新后保留旧参考答案，保证历史分数可比"
    answer: [0, 1, 2]
    explain: |
      版本化保证分数可比；线上失败案例回流让评测集跟上真实分布；留出集用来发现对评测集过拟合。
      政策更新后还用旧参考答案，会把正确的新回答判错，必须更新答案并升级评测集版本，历史分数只在旧版本内比较。
  - id: d41-e6
    kp: d41-k4
    type: multi
    question: 关于组件级评测和端到端评测，哪些说法正确？
    options:
      - "组件级评测把问题隔离到单个步骤，迭代更快更便宜"
      - "组件级评测全部通过，端到端效果就一定能够达标"
      - "各步骤单独表现好但组合后差，可能是任务拆分方式有问题"
      - "端到端评测更贴近用户体验，组件改动后仍需端到端回归"
    answer: [0, 2, 3]
    explain: |
      组件级评测信号清晰、成本低，适合针对性迭代；端到端评测反映用户真实感受，必须作为最后确认。
      各组件单独达标不代表组合起来没问题，步骤之间的信息传递和拆分方式本身可能就是瓶颈，吴恩达也提到模型变强后常需要重新设计流程。
  - id: d41-e7
    kp: d41-k3
    type: judge
    question: 如果系统用结构化输出返回了 `refused` 字段，那么「该拒答时是否拒答」可以直接用规则对照样本的 `should_refuse` 标签判定，不必交给 LLM 评审。
    answer: true
    explain: |
      是否拒答是一个结构化的二元结果，和样本标签对照即可精确判定，成本几乎为零、结果稳定。
      能用规则判的就不用模型判，LLM 评审应留给语气、完整性、依据是否充分等主观维度。
  - id: d41-e8
    kp: d41-k1
    type: judge
    question: 线上已经接入了用户点赞点踩，因此不再需要离线评测集，改动直接上线看反馈即可。
    answer: false
    explain: |
      线上反馈是事后信号：问题已经伤害了用户才被发现，而且点踩率低、噪声大，很难归因到具体改动。
      离线评测集在上线前拦截回归，线上反馈用来发现新问题并补充评测集，两者是互补关系。
  - id: d41-e9
    kp: d41-k4
    type: case
    question: |
      你负责的智慧园区运营 Agent 在 120 条评测集上通过率只有 68%。同事 A 建议直接把模型换成最贵的旗舰模型；同事 B 建议把 System Prompt 重写得更详细。
      你抽看了 25 条失败 Trace：14 条是查询设备告警时把园区编号传成了园区中文名，6 条是工单类型选错，5 条是回答语气生硬。最合理的下一步是？
    options:
      - "采纳 A，旗舰模型推理更强，参数问题自然会消失"
      - "采纳 B，把所有园区编号写进 System Prompt 让模型记住"
      - "增加名称到编号的解析工具并做组件级评测，再端到端回归"
      - "先修语气问题，因为这是用户最能直观感受到的部分"
    answer: [2]
    explain: |
      错误分析显示一半以上的失败来自工具参数（名称和编号混淆），这是确定性问题，最可靠的修法是用代码提供解析工具或参数校验，而不是指望模型记住。修复后用组件级评测快速验证，再跑端到端回归确认整体提升。
      换模型和加长 Prompt 都没有针对根因；园区编号写进 Prompt 还会随数据变化失效；语气问题只占 20%，不是优先项。
interview:
  - id: d41-i1
    kp: d41-k1
    type: scenario
    difficulty: 2
    question: 你改了一版 System Prompt，想上线。你怎么确认它没有让系统变差？
    key_points:
      - {text: "在同一版本的评测集上跑新旧两版，对比整体通过率", dim: engineering}
      - {text: "按分组对比，关键分组（应拒答、安全用例）不允许下降", dim: principle}
      - {text: "同时看 Token、延迟等守护指标，并查看结果变化的具体样本", dim: engineering}
      - {text: "考虑随机波动，小幅变化需重复运行或扩充样本再下结论", dim: principle}
      - {text: "结合项目说明评测集规模和实际对比方式", dim: project}
    reference: |
      我会用数据而不是手感来判断，分四步。
      第一，在同一版本的评测集上分别跑旧 Prompt 和新 Prompt，评测集里有真实问题、应拒答问题和安全用例，每条都有关键事实点或期望行为。
      第二，不只看整体通过率，还要按分组看：制度类、流程类、应拒答、安全用例各自的通过率。关键分组设为硬门槛，任何下降都要先分析再说。
      第三，看守护指标：平均输入输出 Token、P95 延迟、拒答率是否异常变化；再把新旧结果不一致的样本列出来逐条看，区分真退化和评审误差。
      第四，考虑随机性：评测集只有几十条时，一两条的变化就是几个百分点，我会重复跑两三次看波动范围。
      离线通过后再小流量灰度，盯点踩率和转人工率，稳定后全量。在知识库项目里，这套流程每次改 Prompt 都会跑，对比结果贴在 PR 里。
    oral: |
      我不会靠手点几个问题来判断。我的做法是在同一份评测集上跑新旧两版 Prompt，对比整体通过率，但更看重分组结果，比如应拒答和安全用例这两组不允许下降。
      同时我会看 Token 和延迟有没有明显上涨，再把新旧结果不一样的样本挑出来逐条看，确认是真变差还是评审误判。
      评测集只有几十条时，我会多跑几次看波动，避免把噪声当成提升。离线通过后再灰度一小部分流量，看点踩率稳定了才全量。我在知识库项目里每次改 Prompt 都是这个流程，对比表直接贴在 PR 里。
  - id: d41-i2
    kp: d41-k2
    type: design
    difficulty: 3
    question: 你接手一个已经上线、但没有任何评测集的 RAG 客服系统。老板要你两周内给出一份「效果到底怎么样」的报告。你怎么建评测集、定指标、出结论？
    key_points:
      - {text: "评测集来源：脱敏后的线上日志分层抽样、专家编写、历史投诉、应拒答与安全用例", dim: engineering}
      - {text: "样本字段：输入、关键事实点、应命中文档、分组标签，并版本化进仓库", dim: concept}
      - {text: "指标分层：检索 Recall@K、回答正确率、引用正确率、拒答正确率，加成本延迟", dim: principle}
      - {text: "判定方式先规则后 LLM 评审，评审用人工标注样本校准", dim: principle}
      - {text: "报告给出分组结果和错误分析，提出优先修复项", dim: project}
    reference: |
      第一周建评测集：从近三个月日志按问题类型分层抽样约 120 条并脱敏，请业务专家补 30 条高风险场景，从投诉和转人工记录里找 20 条失败案例，再加 20 条应拒答和 10 条注入、越权用例。每条样本有输入、关键事实点、应命中的文档 ID、分组标签，存为 JSONL 并打版本号。
      指标分层：检索层看 Recall@5（应命中文档是否出现在前 5）；回答层看正确率（关键事实覆盖且没说错）、引用正确率（引用 ID 属于检索结果）；行为层看应拒答样本的拒答率和不该拒答时的误拒率；守护指标看平均 Token 和 P95 延迟。
      判定方式：能用规则的用规则（引用、拒答、格式）；正确性用基于关键事实点的 LLM 评审，并先人工标注 50 条左右检查评审与人工是否一致。
      第二周跑评测并做错误分析：抽失败样本读 Trace，按「检索没召回 / 召回了但没用上 / 生成说错 / 不该答却答了」归类计数。
      报告结构：整体与分组数字、错误分类表、三个优先修复项及预期收益、评测集的局限（规模、覆盖范围）。之后这份评测集就成为每次改动的回归基线。
    oral: |
      我会先花一周把评测集建起来。从三个月的日志里按问题类型分层抽一百多条，脱敏后请业务同事补关键事实点和应该命中的文档，再加几十条高风险场景、历史投诉、应拒答和注入用例，存成 JSONL 打版本号。
      指标我分三层：检索看 Recall@5，回答看正确率和引用是否真实，行为看该拒答时有没有拒答，另外附上 Token 和延迟。能用规则判的就用规则，正确性用评审模型判，但先人工标几十条对一下准不准。
      第二周跑评测并做错误分析，把失败按检索没召回、生成说错、不该答却答了分类计数。报告给老板的是分组数字、错误分布和三个优先修复项，这份评测集之后就是每次改动的基线。
  - id: d41-i3
    kp: d41-k4
    type: scenario
    difficulty: 3
    question: Agent 上线后，业务方反馈「经常办不成事」，但系统没有任何报错。你怎么定位问题，并决定先修什么？
    key_points:
      - {text: "收集具体失败案例：点踩、转人工、业务方提供的会话，关联到 Trace", dim: engineering}
      - {text: "逐条读 Trace，记录第一个出错的步骤，归类并统计频次", dim: principle}
      - {text: "按频次、影响和修复成本排优先级，而不是直接换模型或加长 Prompt", dim: principle}
      - {text: "为问题组件建组件级评测，修复后跑端到端回归，失败样本补进评测集", dim: engineering}
      - {text: "举出项目中的错误分类结果和修复动作", dim: project}
    reference: |
      没有报错说明问题在「行为」而不是「异常」，必须看 Trace。
      第一步收集样本：从点踩、转人工记录和业务方给的会话 ID 中找出 20~30 条失败案例，通过 trace_id 找到完整调用链（每一步的模型输入输出、工具调用和参数、返回结果）。
      第二步逐条读：对每条记录第一个出错的步骤和现象，例如「意图识别错」「工具选错」「参数格式错」「工具返回空但模型编了结果」「步数用完没结束」。读完一批后归纳成类别并计数。
      第三步排优先级：按频次乘影响再除以修复成本排序。参数格式类问题通常最便宜，用 Schema 校验或解析工具就能修；规划类问题可能要调整流程拆分。
      第四步修复验证：为目标组件建小评测集做组件级评测，修复后跑端到端评测确认整体提升，把这批失败案例补进评测集防止复发。
      在园区 Agent 里我做过一次：20 条失败中一半以上是园区名称和编号混淆，加了解析工具后这类问题基本消失。
    oral: |
      没有报错说明问题出在行为上，所以我会直接去看 Trace。先从点踩、转人工和业务方给的会话里挑二三十条失败案例，找到完整的调用链。
      然后逐条看，记下第一个出错的步骤，是工具选错、参数错，还是工具返回空模型却编了结果。看完一批再归类计数，按频次、影响和修复成本排优先级，而不是上来就换模型。
      修的时候先给那个组件建一个小评测，修好后再跑端到端回归，失败样本补进评测集。我在园区 Agent 上就这样发现一半失败是园区名称和编号搞混，加了解析工具就解决了。
