day: 42
phase: 5
title: LLM-as-Judge 与轨迹评测
goals:
  - 能写出一个可复核的评审 rubric：单一维度、二元或少档位、先理由后结论、结构化输出
  - 能说出评审的主要偏差，并用人工标注样本和 Cohen's κ 校准评审是否可信
