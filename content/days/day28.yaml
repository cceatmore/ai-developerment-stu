day: 28
phase: 3
title: Agentic RAG：检索决策、多跳检索、Corrective RAG 与 GraphRAG
goals:
  - 能说清固定流水线 RAG 与 Agentic RAG 的区别，判断什么时候值得让模型决定「要不要检索、去哪检索」
  - 能设计多跳检索的执行方式，区分可并行的子问题和有依赖的子问题
  - 能解释 Corrective RAG 与 Self-RAG 的核心思想，并设计一个有次数上限的「评估-改写-重检索」循环
  - 能说出 GraphRAG 的索引与查询方式、适用问题和代价，判断项目里该不该用
