  - id: d25-t8
    kp: d25-k2
    type: single
    question: 为什么混合检索一般不直接把余弦相似度和 ts_rank 分数相加来排序？
    options:
      - "两种分数尺度和分布不同，直接相加会让某一路主导结果"
      - "PostgreSQL 不支持两个浮点数相加"
      - "余弦相似度是负数，相加后会抵消"
      - "相加后的分数超过 1 会导致排序报错"
    answer: [0]
    explain: |
      余弦相似度大致在 0 到 1，ts_rank 或 BM25 分数范围不同且随查询变化，直接相加时尺度大的一路会主导。即使归一化后加权，权重也很难对所有查询都合适，所以常用按名次融合的 RRF。
      B、D 不是事实；C 余弦相似度通常为正。
  - id: d25-t9
    kp: d25-k3
    type: single
    question: k = 60 时，文档 X 在向量结果中排第 1、关键词结果中未出现；文档 Y 在向量结果中排第 5、关键词结果中排第 3。RRF 融合后谁排在前面？
    options:
      - "X，因为它在向量检索中排第一，名次最高"
      - "两者分数相同，因为名次之和都不超过 6"
      - "无法判断，还需要知道两路的原始相似度分数"
      - "Y，两路都出现，约 0.031，高于 X 的约 0.016"
    answer: [3]
    explain: |
      X = 1/61 ≈ 0.0164；Y = 1/65 + 1/63 ≈ 0.0154 + 0.0159 ≈ 0.0313。Y 在两路都出现，总分接近 X 的两倍。
      RRF 只看名次不看原始分数，所以 C 错；这也体现了 RRF「奖励在多路都靠前」的特点。
  - id: d25-t10
    kp: d25-k3
    type: single
    question: 下面的 Python 代码想实现两路 RRF 融合。测试发现只在关键词一路出现的编号类文档永远不会出现在结果里。问题出在哪？
    code: |
      def rrf(vec_ids: list[str], kw_ids: list[str], k: int = 60) -> list[str]:
          scores = {}
          for r, doc in enumerate(vec_ids, start=1):
              if doc in kw_ids:
                  r2 = kw_ids.index(doc) + 1
                  scores[doc] = 1 / (k + r) + 1 / (k + r2)
          return sorted(scores, key=scores.get, reverse=True)
    lang: python
    options:
      - "k 取 60 太大，应该改成 1"
      - "只给两路都出现的文档打分，相当于取交集，丢掉了只在一路出现的文档"
      - "enumerate 应该从 0 开始"
      - "sorted 的 reverse 参数写反了"
    answer: [1]
    explain: |
      代码只遍历向量结果，并且只有同时出现在关键词结果里的文档才计分，等价于 SQL 里的 INNER JOIN。正确做法是遍历两路所有文档，每一路出现就累加 1/(k + 名次)，相当于 FULL OUTER JOIN。
      A k 取值不影响是否丢文档；C 名次按约定从 1 开始；D 分数越高越靠前，reverse=True 是对的。
  - id: d25-t11
    kp: d25-k3
    type: multi
    question: 关于 RRF，以下哪些说法正确？
    options:
      - "只依赖各路结果中的名次，不需要对分数做归一化"
      - "原始论文取 k = 60，且 k 在较大范围内变化时效果差别不大"
      - "k 越大，各名次之间的分差越小"
      - "RRF 分数可以直接作为判断文档是否相关的阈值"
      - "名次应从 1 开始计算"
    answer: [0, 1, 2, 4]
    explain: |
      A 是 RRF 的核心优势；B 出自 Cormack 等人的论文；C 1/(k+1) 和 1/(k+5) 在 k 大时差距更小；E 是公式约定。
      D 错：RRF 分数只代表本次查询中的综合名次，不同查询之间不可比，不能当相关性阈值。
  - id: d25-t12
    kp: d25-k3
    type: judge
    question: 在 SQL 中实现 RRF 时，应使用 FULL OUTER JOIN 合并两路结果，并用 COALESCE 把缺失一路的分数记为 0。
    answer: true
    explain: |
      正确。FULL OUTER JOIN 保证只在一路出现的文档不丢失，COALESCE 让缺失的一路贡献 0 分。pgvector-python 官方的 RRF 示例就是这样写的。
  - id: d25-t13
    kp: d25-k4
    type: single
    question: 团队在 A 模型上把相似度阈值标定为 0.78，效果很好。换成 B 模型后没改阈值，拒答率从 5% 飙升到 40%。最可能的原因是？
    options:
      - "B 模型比 A 模型差，应该换回去"
      - "向量索引在换模型后损坏了"
      - "知识库内容在换模型时丢失了"
      - "不同模型的相似度分布不同，阈值必须在新模型上重新标定"
    answer: [3]
    explain: |
      相似度阈值没有通用值，B 模型的相关段落分数可能整体只在 0.6 左右，0.78 的阈值把大量有答案的问题拒掉了。换模型后要用同一批有答案、无答案的问题重新画分数分布、重新选阈值。
      A 未必，B 模型可能只是分数尺度不同；B、C 没有证据支持。
  - id: d25-t14
    kp: d25-k4
    type: multi
    question: 关于召回数量和交给模型的数量，以下哪些说法合理？
    options:
      - "召回阶段多取一些，保证正确答案在候选中"
      - "交给模型的数量要考虑上下文预算、噪声和成本"
      - "两个数量应该始终相同，方便维护"
      - "Anthropic 实验中先召回 150 条，重排后保留 20 条"
      - "交给模型的越多越好，模型会自己找到答案"
    answer: [0, 1, 3]
    explain: |
      召回要宽、生成要窄，中间用融合和重排筛选；Anthropic 的设置是召回 150、重排后保留 20。
      C 两个阶段目标不同；E 证据太多会引入噪声、增加成本，也有长上下文退化问题（见 Day 13）。
  - id: d25-t15
    kp: d25-k4
    type: judge
    question: 当所有候选的分数都低于阈值时，最好不调用大模型，直接返回「知识库中没有找到相关内容」。
    answer: true
    explain: |
      正确。没有可靠证据时调用模型，模型很可能用自己的知识编一个答案；直接拒答既避免胡编，又节省调用成本。
      阈值要同时考虑误拒率，避免把有答案的问题也拒掉。
  - id: d25-t16
    kp: d25-k4
    type: single
    question: 某同学想用 RRF 融合后的分数做拒答阈值：分数低于 0.02 就拒答。这个方案的主要问题是？
    options:
      - "RRF 分数只反映名次，不同查询间不可比，不代表相关程度"
      - "0.02 设得太高，应该降到 0.002 才能减少误拒"
      - "RRF 分数计算开销太大，不适合放在在线链路使用"
      - "RRF 只适用于英文检索，中文场景下的分数不准确"
    answer: [0]
    explain: |
      无论问题和文档多不相关，排第 1 的文档 RRF 分数都差不多（两路都第一约 0.033），所以 RRF 分数无法区分「相关」和「只是相对最好」。阈值应基于向量相似度或重排模型的分数（Day 26）。
      B 调数值不解决本质问题；C、D 不是事实。
exam:
  - id: d25-e1
    kp: d25-k1
    type: single
    question: 团队用 PostgreSQL 默认配置对中文制度建了全文索引，发现搜「年假」几乎什么都搜不到，但搜整句原文能命中。最可能的原因和解决办法是？
    options:
      - "GIN 索引不支持中文，应改用 B-tree 索引"
      - "默认解析器把连续汉字当成一个词，应引入中文分词扩展或在应用层分词"
      - "「年假」是停用词被过滤了，应删除停用词表"
      - "全文检索不适合中文，只能用向量检索"
    answer: [1]
    explain: |
      PostgreSQL 默认解析器按空格和标点切分，「年假天数按工龄计算」整串被当成一个词，所以只有整句能匹配。解决：安装 zhparser 等中文分词扩展并创建中文配置，或者在应用层用 jieba 分词、空格拼接后用 simple 配置建索引，查询时同样分词。
      A B-tree 不适合全文检索；C「年假」不是停用词；D 配好分词后全文检索可以很好地支持中文。
  - id: d25-e2
    kp: d25-k2
    type: single
    question: 以下哪种情况最能说明「需要在向量检索之外增加关键词检索」？
    options:
      - "评测中编号、型号类问题命中率明显偏低"
      - "生成模型的回答格式经常不统一、不稳定"
      - "文档解析时表格内容经常被拍平成一行"
      - "检索接口的延迟在高峰期偶尔超过 1 秒"
    answer: [0]
    explain: |
      编号、型号类问题需要精确匹配，向量检索容易混淆相近的编号，命中率偏低正是关键词检索能补的短板。
      B 是生成层格式问题（用结构化输出）；C 是解析层问题；D 是性能问题，加一路检索反而可能更慢。
  - id: d25-e3
    kp: d25-k3
    type: single
    question: k = 60，三个文档在两路中的名次如下：P 向量第 1、关键词第 10；Q 向量第 3、关键词第 2；R 向量未出现、关键词第 1。RRF 融合后的排序是？
    options:
      - "P > Q > R"
      - "R > P > Q"
      - "Q > P > R"
      - "P > R > Q"
    answer: [2]
    explain: |
      P = 1/61 + 1/70 ≈ 0.0164 + 0.0143 = 0.0307；Q = 1/63 + 1/62 ≈ 0.0159 + 0.0161 = 0.0320；R = 1/61 ≈ 0.0164。所以 Q > P > R。
      Q 两路都靠前，综合最高；R 虽然关键词第一，但只出现在一路。
  - id: d25-e4
    kp: d25-k4
    type: single
    question: 系统设置「召回 Top-5 直接交给模型」，评测发现正确段落经常排在第 6~15 名，导致答不出。最合理的调整是？
    options:
      - "直接把交给模型的数量改成 15，保证覆盖正确段落"
      - "换一个参数量更大的生成模型，提升理解证据的能力"
      - "提高相似度阈值，减少噪声段落对模型的干扰"
      - "扩大召回到 20~50 条，经重排后再取少量给模型"
    answer: [3]
    explain: |
      正确段落在候选里但排名不够靠前，应该「召回放宽、生成收窄」：先多召回保证不漏，再通过融合和重排（Day 26）把真正相关的提到前面，最后只给模型少量高质量证据。
      A 直接给 15 条会引入大量噪声和成本；B 模型拿不到证据换多大都没用；C 阈值提高会更容易漏掉。
  - id: d25-e5
    kp: d25-k1
    type: multi
    question: 关于 BM25 的参数和直觉，以下哪些说法正确？
    options:
      - "k1 控制词频饱和，词出现很多次后加分趋于平缓"
      - "b 控制长度归一，长文档会被适当打折"
      - "IDF 让到处都出现的常见词贡献更少的分数"
      - "BM25 不需要分词，可以直接处理任何语言"
      - "BM25 会把同义词自动视为同一个词"
    answer: [0, 1, 2]
    explain: |
      k1、b、IDF 是 BM25 的三个核心直觉。
      D BM25 基于词匹配，中文必须先分词；E BM25 只做字面匹配，「带薪假」和「年假」是不同的词，同义理解要靠向量检索。
  - id: d25-e6
    kp: d25-k3
    type: multi
    question: 以下哪些是实现 RRF 时的常见错误？
    options:
      - "用 INNER JOIN 合并两路结果"
      - "两路检索使用不同的权限过滤条件"
      - "每路结果都按各自的分数生成从 1 开始的名次"
      - "把融合后的 RRF 分数当成相关性阈值"
      - "用 FULL OUTER JOIN 并对缺失一路记 0 分"
    answer: [0, 1, 3]
    explain: |
      A 会丢掉只在一路出现的文档；B 会导致无权限内容混入；D RRF 分数不同查询之间不可比。
      C 和 E 是正确做法。
  - id: d25-e7
    kp: d25-k2
    type: judge
    question: 如果评测显示问题几乎都是口语化的语义问答、很少有编号和专有名词，单用向量检索也可能足够，不一定非要上混合检索。
    answer: true
    explain: |
      正确。混合检索增加了分词、索引维护和融合的复杂度，是否值得要看评测结果。如果单向量检索的命中率已经满足要求，且问题类型以语义为主，可以先不加关键词一路。
  - id: d25-e8
    kp: d25-k4
    type: judge
    question: 相似度阈值 0.8 是业界通用的标准值，可以直接用于任何 Embedding 模型。
    answer: false
    explain: |
      错误。不同 Embedding 模型的相似度分布差别很大，同一个 0.8 在不同模型下的含义完全不同。阈值必须在自己的数据和当前模型上标定，换模型后要重新标定。
  - id: d25-e9
    kp: d25-k2
    type: case
    question: |
      p1 企业知识库已上线混合检索（向量 + 全文检索，RRF 融合）。一次安全审计发现：普通员工问「高管薪酬怎么定」，回答里引用了《高管薪酬管理办法》的片段，而这份文件只对管理层可见。
      检查代码发现：向量一路的 SQL 带有 `WHERE dept_id = ANY($3)`，关键词一路的 SQL 是后来新增的，只有 `WHERE search_tsv @@ query`；融合用的是 FULL OUTER JOIN。
      最合理的根因判断和修复是？
    options:
      - "RRF 算法有安全漏洞，应改回只用向量检索"
      - "生成模型泄露了训练数据，应在 Prompt 里禁止提到薪酬"
      - "关键词一路漏了权限过滤，FULL OUTER JOIN 保留了它独有的结果；应两路用同一过滤条件并加权限测试"
      - "FULL OUTER JOIN 导致数据泄露，应改成 INNER JOIN"
    answer: [2]
    explain: |
      无权限文档只可能从没有权限过滤的关键词一路进来，FULL OUTER JOIN 按设计保留了它独有的结果。修复：两路使用完全一致的过滤条件（最好抽成同一个函数或视图生成），并增加自动化的权限测试，用无权限账号查询敏感问题，断言结果中没有敏感文档。
      A RRF 只是融合方法；B 引用的是知识库片段，不是训练数据，Prompt 禁止不可靠；D 改成 INNER JOIN 会丢掉互补结果，而且如果向量一路也有漏洞仍会泄露，没有解决根因。
interview:
  - id: d25-i1
    kp: d25-k2
    type: scenario
    difficulty: 2
    question: 用户反馈「搜制度编号、产品型号经常搜不准，但问一般问题还行」。你会怎么分析和改进？
    key_points:
      - {text: "判断原因：向量检索对编号型号等精确字符不敏感，相近编号语义接近", dim: principle}
      - {text: "方案：增加关键词检索一路，与向量检索并行召回，用 RRF 融合", dim: engineering}
      - {text: "中文要处理分词，编号型号加入自定义词典，两路过滤一致", dim: engineering}
      - {text: "知道 PG 全文检索没有 IDF、plainto_tsquery 是 AND 等细节", dim: concept}
      - {text: "按问题类型分组评测，对比改进前后命中率", dim: project}
    reference: |
      **分析：** 一般问题还行、编号型号不准，说明问题集中在精确匹配上。向量检索比较的是语义，「HR-2025-03」和「HR-2025-04」、「E1024」和「E1025」在向量空间里几乎一样，排不开。先从日志里抽 20 个编号类 bad case 确认：正确文档是不是被相近编号的文档挤下去了。

      **改进：增加关键词检索，做混合检索。**
      - 关键词一路：PostgreSQL 全文检索。中文要先分词（zhparser 等扩展，或应用层 jieba 分词后用 simple 配置），并把制度编号、产品型号、部门名加入自定义词典，避免被切碎；离线和在线用同一套分词。
      - 查询构造：长问题不要用 plainto_tsquery（所有词 AND），改用 websearch_to_tsquery 或 OR 连接。
      - 两路并行各取 30 条，**过滤条件完全一致**，FULL OUTER JOIN 加 RRF（k = 60）融合。
      - 注意 PG 自带的 ts_rank 没有 IDF；在 RRF 里只用名次，影响有限，需要更准的 BM25 再评估 pg_textsearch 等扩展。

      **验证：** 评测集按问题类型分组（编号型号类、语义类），对比只用向量和混合检索的 Top-5 命中率，确认编号类明显提升且语义类没有下降。
    oral: |
      一般问题还行、编号不准，说明是精确匹配的问题。向量检索比的是语义，HR-2025-03 和 HR-2025-04 在向量空间里几乎一样，排不开。我会先抽二十个编号类的 bad case 确认是不是被相近编号挤下去了。
      改进就是加关键词检索做混合。中文要先分词，编号、型号放进自定义词典防止被切碎，离线在线用同一套分词；查询别用 plainto_tsquery，长问题会因为 AND 搜不到。
      两路各取三十条，过滤条件完全一样，用 RRF 融合。最后按问题类型分组评测，确认编号类命中率提升、语义类没有下降。
  - id: d25-i2
    kp: d25-k3
    type: design
    difficulty: 3
    question: 请设计 p1 企业知识库的混合检索方案，包括两路召回、融合方法、参数选择，以及如何保证权限安全。
    key_points:
      - {text: "两路召回：向量检索走 HNSW，关键词检索走中文分词加全文索引，各取若干条", dim: engineering}
      - {text: "RRF 融合：按名次求和、k 取 60、FULL OUTER JOIN、名次从 1 开始", dim: principle}
      - {text: "参数：召回宽、生成窄，阈值基于向量或重排分数并在自有数据上标定", dim: concept}
      - {text: "权限：两路使用同一过滤条件生成函数，加自动化越权测试", dim: engineering}
      - {text: "用评测集对比单路与混合、不同参数的效果", dim: project}
    reference: |
      **两路召回：**
      - 向量一路：`ORDER BY embedding <=> q LIMIT 30`，走 HNSW 索引（见 Day 24）。
      - 关键词一路：应用层 jieba 分词（加载制度编号、部门名自定义词典）后存 `search_tsv` 生成列，GIN 索引；查询同样分词，用 websearch_to_tsquery 避免 AND 零结果；取 30 条。

      **融合：** 两个 CTE 各自用 `RANK()` 生成从 1 开始的名次，FULL OUTER JOIN，`COALESCE(1.0/(60+rank), 0)` 求和，取前 20 条进入重排（Day 26）。k 取论文默认 60，在评测集上对比 20、60、100 确认差别不大。

      **参数：** 召回每路 30、融合后 20、重排后最多 5 条交给模型。阈值基于重排分数（或向量相似度），用有答案、无答案两类问题标定，换模型重标；全部低于阈值直接拒答。

      **权限安全：**
      - 过滤条件（部门、状态、租户）由**同一个函数**生成，两路 SQL 都调用，杜绝一路漏加。
      - 权限过滤在 SQL 里完成，绝不在应用层事后过滤。
      - 自动化测试：用不同角色的测试账号查询敏感问题，断言结果中没有无权限文档，作为 CI 的一部分。

      **评测：** 单向量、单关键词、混合三组对比 Top-5 命中率，按问题类型分组统计。
    oral: |
      我会做两路召回：向量走 HNSW 取三十条；关键词这路在应用层用 jieba 分词，加制度编号和部门名的词典，存成 tsvector 建 GIN 索引，也取三十条。
      融合用 RRF，两个 CTE 各自用 RANK 生成从 1 开始的名次，FULL OUTER JOIN，k 取 60，取前二十条进重排，最后最多五条给模型。阈值用重排分数，在自己的数据上标定，全部低于阈值直接拒答。
      权限是重点：过滤条件由同一个函数生成，两路都调用，避免一路漏加；再写自动化越权测试，用普通员工账号去问敏感问题，断言结果里没有管理层文件。
      最后用评测集对比单路和混合的命中率。
  - id: d25-i3
    kp: d25-k4
    type: scenario
    difficulty: 3
    question: 上线后两类投诉同时存在：一类是「明明知识库里有，系统却说没找到」，另一类是「问知识库没有的东西，系统却编了一个答案」。你怎么分析和调整 Top-K 与阈值？
    key_points:
      - {text: "识别两类问题分别是误拒和误答，对应阈值偏高与偏低或召回不足", dim: principle}
      - {text: "区分召回 K 和生成 K，误拒时先查正确段落是否在召回候选中", dim: concept}
      - {text: "用有答案和无答案两类问题标定阈值，同时看误拒率和答错率", dim: engineering}
      - {text: "阈值基于向量或重排分数而非 RRF 分数，换模型重标，结合生成层拒答约束", dim: engineering}
      - {text: "结合项目说明标定过程和调整后的指标", dim: project}
    reference: |
      **先分开看两类问题：**
      - 「有却说没找到」是**误拒**：可能是召回不足（正确段落根本不在候选里），也可能是阈值太高把它过滤了。
      - 「没有却编答案」是**误答**：阈值太低或没有阈值，无关段落被交给模型，模型硬凑答案。

      **排查误拒：** 对误拒案例查日志，正确段落是否在召回候选里：
      - 不在 → 召回问题：扩大每路召回数量，检查混合检索、切片和过滤（Day 23、24）。
      - 在，但被阈值过滤 → 阈值偏高。

      **重新标定阈值：**
      - 准备两类问题：有答案的（标注正确段落）和无答案的。
      - 统计正确段落的分数分布和无答案问题最高分的分布，选一个兼顾误拒率和答错率的阈值。
      - 阈值基于**向量相似度或重排分数**（重排分数更适合，Day 26），不能用 RRF 分数，因为它只表示名次。
      - 确认阈值和当前 Embedding、重排模型版本绑定，换模型就重标。

      **配合生成层：** 即使过了阈值，Prompt 仍要求「证据不足就说不知道」，作为第二道防线（Day 27）。

      **持续监控：** 拒答率、点踩率按天看，异常波动时检查是否换了模型或数据分布变化。
    oral: |
      这两类投诉其实是一个硬币的两面，一个是误拒、一个是误答。
      误拒我会先查日志，看正确段落在不在召回候选里：不在就是召回不够，要放宽每路召回、检查混合检索和切片；在但被过滤了，就是阈值太高。
      误答说明阈值太低，无关段落给了模型。我会准备有答案和无答案两类问题，看分数分布重新标定阈值，同时盯误拒率和答错率。阈值要用向量或重排分数，不能用 RRF 分数，而且换模型必须重标。
      另外 Prompt 里还要有证据不足就拒答的约束作为第二道防线，上线后按天监控拒答率和点踩率。
