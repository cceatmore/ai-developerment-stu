    question: 混合检索时，向量一路加了权限过滤，关键词一路可以不加，因为融合后的结果主要由向量一路决定。
    answer: false
    explain: |
      错误。RRF 会保留只在关键词一路出现的文档，如果关键词一路没加权限过滤，无权限的 chunk 可能被融合进最终结果交给模型。
