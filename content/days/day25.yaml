    kp: d25-k1
    type: judge
    question: 中文文档在应用层用 jieba 分词后存入数据库建全文索引，查询时直接用原始问题文本匹配即可，不需要再分词。
    answer: false
    explain: |
      错误。库里存的是「年假 天数 按 工龄 计算」这样的分词结果，查询如果不做同样的分词，整句会被当成一个词，匹配不上。
      离线和在线必须使用同一套分词器和同一份自定义词典，这是混合检索里的又一个「契约」。
  - id: d25-t4
    kp: d25-k1
    type: single
    question: 用户问「年假怎么算，试用期有没有，离职了怎么折算」，关键词一路用 `plainto_tsquery` 构造查询后经常返回 0 条。最可能的原因是？
    options:
      - "GIN 索引失效了，全文检索退化成无法命中任何结果"
      - "plainto_tsquery 要求所有词都出现，长问题很难全部命中"
      - "PostgreSQL 的关键词检索从根本上不支持中文内容"
      - "问题太长导致数据库连接超时，查询被中断后返回空"
    answer: [1]
    explain: |
      plainto_tsquery 在词之间插入 &（AND），问题越长、词越多，同时包含所有词的段落越少。可以改用 websearch_to_tsquery 配合 OR，或者在应用层提取关键词后用 OR 连接，再交给打分排序。
      A、D 会表现为报错或所有查询都异常；C 配好分词后是支持中文的。
  - id: d25-t5
