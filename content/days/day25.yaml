day: 25
phase: 3
title: 混合检索：BM25 关键词检索、向量检索与 RRF 融合
goals:
  - 能讲清 BM25 的三个直觉（词稀有度、词频饱和、长度归一），并说出 PostgreSQL 全文检索在中文和打分上的局限与解决办法
  - 能举例说明向量检索和关键词检索各自漏掉什么，为什么两路互补
  - 能手算 RRF 融合分数，写出 PostgreSQL 里的两路召回加 RRF 融合 SQL，并说出常见实现错误
  - 能区分「召回数量」和「交给模型的数量」，并说出相似度阈值为什么要按自己的数据标定
minutes: 60
resources:
  - title: "李宏毅 生成式 AI 与机器学习导论 2025 秋 HW2：Build a Basic RAG System"
    url: "https://speech.ee.ntu.edu.tw/~hylee/GenAI-ML/2025-fall-course-data/hw2.pdf"
    kind: course
    lang: zh
    minutes: 20
    note: "看 Retrieval 部分：作业要求同时用 BM25 和 Embedding 两路检索再合并结果，正好对应今天的混合检索；可以思考它的合并方式和 RRF 有什么不同"
  - title: "Anthropic：Introducing Contextual Retrieval"
    url: "https://www.anthropic.com/engineering/contextual-retrieval"
    kind: article
    lang: en
    minutes: 10
    note: "重读「Contextual BM25」一节和文末的实验结论：Embedding 加 BM25 优于只用 Embedding，Top-20 优于 Top-10 和 Top-5"
  - title: "pgvector-python 混合检索 RRF 示例"
    url: "https://github.com/pgvector/pgvector-python/blob/master/examples/hybrid_search/rrf.py"
    kind: repo
    lang: en
    minutes: 10
    note: "只看那段 SQL：两个 CTE 分别用 RANK() 给向量和全文检索结果排名，FULL OUTER JOIN 后用 1/(k+rank) 求和，k = 60。今天的 p1 混合检索 SQL 就是照这个结构改的"
  - title: "PostgreSQL 文档：Controlling Text Search"
    url: "https://www.postgresql.org/docs/current/textsearch-controls.html"
    kind: doc
    lang: en
    minutes: 15
    note: "看 12.3.2 Parsing Queries（plainto_tsquery 和 websearch_to_tsquery 的区别）和 12.3.3 Ranking Search Results（注意「不使用全局信息」这句话，即没有 IDF）"
knowledge_points:
  - id: d25-k1
    name: BM25 与 PostgreSQL 全文检索
    level: P1
    summary: BM25 按「词越稀有越重要、词频有上限、长文档要打折」给关键词匹配打分；PG 自带全文检索没有 IDF、中文要另配分词
    analogy: |
      像前端的**站内搜索**：用户搜「useEffect」，标题里精确含这个词的文档排最前，「the」「a」这种到处都有的词几乎不加分。BM25 就是把这套直觉变成公式。
      **不一样的地方**：前端搜索按空格就能切词；中文没有空格，「年假天数」要先**分词**成「年假 / 天数」才能匹配，分词错了（切成「年 / 假天 / 数」）就搜不到。
    why: |
      向量检索不擅长精确匹配：制度编号、产品型号、人名、专有缩写。关键词检索补上这块短板，是混合检索的一半。
      p1 的「混合检索模块」今天解锁，用的就是 PostgreSQL 全文检索；面试里讲到混合检索，常被追问「BM25 是什么」「中文怎么分词」。
    problem: |
      用户问「HR-2025-03 号文件的规定」，向量检索会找到一堆「人事文件规定」类的段落，因为语义相近；但用户要的是那个编号的文件。
      直接用 PostgreSQL 的全文检索又会遇到两个问题：中文默认不分词、自带的打分函数和 BM25 不一样。
    principle: |
      **一、BM25 的三个直觉**

      BM25 是经典的关键词相关性打分函数，可以理解成三件事：

      - **IDF（词的稀有度）**：「年假」只在少数文档出现，命中它很有价值；「公司」到处都有，命中它几乎不加分。
      - **词频饱和（参数 k1，常用 1.2 左右）**：一个词出现 1 次到 3 次，相关性明显上升；出现 30 次和 20 次差不多，防止堆砌关键词刷分。
      - **长度归一（参数 b，常用 0.75）**：长文档天然包含更多词，命中概率高，要打折，避免长文档总是排前面。

      **二、PostgreSQL 全文检索的基本用法**

      - `to_tsvector('配置', 文本)` 把文本转成词位列表，`to_tsquery` 或 `plainto_tsquery` 把查询转成查询条件，`@@` 判断是否匹配。
      - `plainto_tsquery` 会在词之间插入 `&`（**AND**），所有词都必须出现；`websearch_to_tsquery` 支持类似搜索引擎的语法（引号、OR、减号）。
      - 用 GIN 索引加速：`CREATE INDEX ON chunks USING gin (to_tsvector('配置', embed_text))`，或存一个生成列。
      - 打分用 `ts_rank` 或 `ts_rank_cd`，可以用 `setweight` 给标题、正文设置不同权重。

      **三、PG 自带打分不是 BM25**

      PostgreSQL 文档明确写道，它的排序函数**不使用任何全局信息**，也就是**没有 IDF**：常见词和稀有词命中时加分差不多。默认也不做长度归一（可以通过 normalization 参数开启）。
      在混合检索里，关键词这一路主要用来**补召回**，再用 RRF 按名次融合（本日 k3），所以 ts_rank 的分数绝对值不准影响有限；如果需要真正的 BM25，可以用扩展：
      - **pg_textsearch**（Tiger Data 开源）：`CREATE INDEX ... USING bm25(content) WITH (text_config = '...', k1 = 1.2, b = 0.75)`，用 `<@>` 运算符排序。
      - **ParadeDB pg_search**：基于 Tantivy 的 BM25 索引，语法近年有调整，以官方文档为准。

      **四、中文分词**

      ```mermaid
      flowchart TD
        T["中文文本 年假天数按工龄计算"] --> P{"用什么分词"}
        P -->|"PG 默认解析器"| D["整串连续汉字被当成一个词 搜年假匹配不上"]
        P -->|"zhparser 等中文分词扩展"| Z["年假 天数 按 工龄 计算"]
        P -->|"应用层 jieba 分词后以空格拼接"| J["用 simple 配置建 tsvector"]
        Z --> I["GIN 索引或 BM25 索引"]
        J --> I
      ```

      - PostgreSQL 默认解析器按空格和标点切分，**一整串连续汉字会被当成一个词**，搜其中的「年假」匹配不上。
      - **方案一**：安装中文分词扩展（如 zhparser），创建中文文本搜索配置；pg_textsearch 也支持搭配 zhparser 配置做中文 BM25。
      - **方案二**：在应用层用 jieba 等分词，把结果用空格拼接后存一列，用 `simple` 配置建索引；**查询时也用同一套分词**（又一个离线和在线的契约，见 Day 21）。
      - 专有名词、制度编号要加入自定义词典，否则会被切碎。
    scenarios: |
      - **制度编号、文件号查询**：「HR-2025-03」「第 3.2.1 条」，关键词检索精确命中。
      - **产品型号和错误码**：「E1024 错误」「X200 Pro 参数」，向量检索容易混淆相近型号。
      - **人名和部门名**：「张三负责的项目」，专有名词向量表达弱。
    pitfalls: |
      - **中文直接用 PG 默认配置建全文索引**：整句被当成一个词，几乎什么都搜不到，而且不报错。
      - **离线用 jieba 分词，在线查询没分词**：两边切法不一致，匹配失败。
      - **用 plainto_tsquery 处理长问题**：所有词都要出现（AND），自然语言问题经常零结果。
      - **以为 ts_rank 就是 BM25**：它没有 IDF，常见词会拉高无关文档的分数。
      - **编号、型号没加自定义词典**：「HR-2025-03」被切成几段，精确匹配失效。
    interview_asks:
      - question: "BM25 的原理是什么？和 TF-IDF 有什么区别？"
        answer: "两者都看词在这篇里出现得多不多、在全部文档里罕不罕见。BM25 对反复出现的词有饱和，不会因为重复十次就线性加分，还考虑文档长度。短标题里出现一次专有名词，不应该被长文里的重复词压过去。"
      - question: "PostgreSQL 全文检索怎么支持中文？"
        answer: "默认分词按空格和词干，中文会整段切不开。要用中文分词，比如 pg_jieba 或 zhparser，入库和查询用同一套分词。不然中文全文检索基本无效。"
      - question: "PostgreSQL 的 ts_rank 和 BM25 有什么不同？"
        answer: "ts_rank 是 Postgres 自己的相关度，不是标准 BM25。排序行为不一样，调参也不能照着 BM25 的文章搬。要讲原理可以说 BM25，要讲你库里的实现就说 ts_rank 和中文分词。"
    project_example: |
      **p1 企业知识库问答**的关键词检索：在应用层用 jieba（加载公司部门名、制度编号的自定义词典）对 `embed_text` 分词，空格拼接后存入 `search_tokens` 列，用 `simple` 配置建 GIN 索引；查询时对问题做同样的分词，用 `websearch_to_tsquery` 或 OR 连接避免 AND 导致零结果。
      上线前在评测集里专门放 15 个「编号、型号、人名」类问题，对比只用向量和加上关键词两种方式的命中率。
      如果后续需要更准的 BM25 打分，再评估 pg_textsearch 这类扩展。
    freshness: |
      核对于 2026-11：PostgreSQL 官方文档说明 ts_rank 和 ts_rank_cd 不使用全局信息（即没有 IDF），plainto_tsquery 在词之间插入 AND。Tiger Data 开源的 pg_textsearch 当前为 v1.5.x，支持 PostgreSQL 17、18，需要加入 shared_preload_libraries，提供 bm25 索引类型和 `<@>` 运算符，v1.4.0 起支持搭配 zhparser 文本搜索配置处理中文。ParadeDB pg_search 也提供 BM25，但语法近年有调整。扩展演进快，以各自官方文档为准。
    sources:
      - {title: "PostgreSQL - Controlling Text Search", url: "https://www.postgresql.org/docs/current/textsearch-controls.html"}
      - {title: "pg_textsearch (Tiger Data)", url: "https://github.com/timescale/pg_textsearch"}
      - {title: "zhparser", url: "https://github.com/amutu/zhparser"}
      - {title: "ParadeDB - BM25 in PostgreSQL", url: "https://www.paradedb.com/learn/search-in-postgresql/bm25"}
  - id: d25-k2
    name: 为什么需要混合检索
    level: P0
    summary: 向量检索懂语义但对编号、型号、专有名词不敏感，关键词检索精确但不懂同义表达；两路召回再融合，互相补漏
    analogy: |
      像前端调试同时看 **Elements 面板和 Console 搜索**：Elements 帮你按结构和样式找到「看起来像那个按钮」的元素（语义），Console 里 `document.querySelector('#submit-btn')` 精确命中 id（关键词）。只用一种都会漏。
      **不一样的地方**：调试时你自己判断用哪个；混合检索要**自动**合并两份排名不同、分数尺度也不同的结果，合并方法本身就是个问题（本日 k3）。
    why: |
      几乎所有生产级 RAG 都会用混合检索，Anthropic 的实验也显示 Embedding 加 BM25 比单用 Embedding 效果更好。
      面试里「你们为什么用混合检索」「两路结果怎么合并」是高频题，p1 的混合检索模块今天解锁。
    problem: |
      只用向量检索，用户问「E1024 错误怎么处理」，召回的可能是「E1025 错误」「E1204 错误」的段落，因为它们在向量空间里很近；只用关键词检索，用户问「怎么请带薪休假」，文档里写的是「年假」，一个词都对不上。
    principle: |
      **一、两路各自擅长什么**

      | 维度 | 向量检索 | 关键词检索（BM25） |
      |---|---|---|
      | 同义表达 | 擅长（带薪休假 ≈ 年假） | 不擅长 |
      | 精确词 | 不敏感（E1024 ≈ E1025） | 擅长 |
      | 编号、型号、人名 | 弱 | 强 |
      | 口语化长问题 | 擅长 | 一般，依赖分词 |
      | 可解释性 | 弱，只有一个分数 | 强，能看到命中了哪些词 |

      **二、混合检索的结构**

      ```mermaid
      flowchart LR
        Q["用户问题"] --> V["向量检索 Top-N"]
        Q --> K["关键词检索 Top-N"]
        V --> F["融合 RRF"]
        K --> F
        F --> R["重排 可选 见 Day 26"]
        R --> T["取 Top-K 交给模型"]
      ```

      - 两路**并行**召回，每路取 N 条（如 20~50 条），保证候选足够多。
      - **两路必须使用相同的过滤条件**（权限、状态、部门），否则融合后可能混入无权限内容。
      - 融合后通常再接重排（Day 26），最后取少量结果交给模型。

      **三、为什么不能直接把分数相加**

      - 余弦相似度一般在 0 到 1 之间，ts_rank 或 BM25 分数的范围完全不同，而且随查询变化。
      - 直接相加，分数尺度大的那一路会主导结果；归一化后加权也要调权重，换一批查询就不准。
      - 所以常用**按名次融合**的 RRF（本日 k3）。

      **四、什么时候可以不用混合检索**

      - 问题全是口语化的语义问答，几乎没有编号、型号、专有名词，单用向量检索可能够用。
      - 要用评测集对比：单向量 vs 混合，看命中率提升是否值得多一路检索的复杂度。
    scenarios: |
      - **企业制度问答**：既有「试用期能请假吗」这种语义问题，也有「HR-2025-03 号文件」这种编号查询。
      - **技术支持知识库**：错误码、版本号、命令名必须精确匹配。
      - **法律条文检索**：「第 X 条」「某某法」的精确引用加上案情的语义描述。
    pitfalls: |
      - **两路过滤条件不一致**：关键词一路忘了加权限过滤，融合后出现无权限内容。
      - **每路只取 Top-5 就融合**：候选太少，两路的互补作用发挥不出来。
      - **直接把余弦相似度和 ts_rank 分数相加**：尺度不同，一路主导。
      - **不做评测就默认混合一定更好**：分词质量差时，关键词一路可能引入噪声。
    interview_asks:
      - question: "为什么要用混合检索？向量检索有什么不足？"
        answer: "向量擅长意思接近但用词不同。它不擅长编号、人名、精确短语，这些词会被抹进向量里。关键词检索补上这一块。两路一起召回，再合并。"
      - question: "混合检索的两路结果为什么不能直接把分数相加？"
        answer: "向量距离和全文分数不是一个量纲，大小没有可比性。直接相加会被某一路的分数完全主导。要用名次融合，或各自归一之后再按评测调权重。"
      - question: "什么情况下单用向量检索就够了？"
        answer: "查询和文档都是口语化的意思匹配，没有编号、法条号、错误码这类必须精确命中的词，而且评测显示关键词路几乎没带来提升。有精确匹配需求就不要只用向量。"
    project_example: |
      **p1 企业知识库问答**的「混合检索模块」：向量一路 `ORDER BY embedding <=> q LIMIT 30`，关键词一路用 jieba 分词后的全文检索取 30 条，**两路都带同样的部门、状态过滤**，用 RRF 融合后取前 20 条交给 Day 26 的重排。
      评测对比：在 100 个问题上，单向量 Top-5 命中率和混合检索 Top-5 命中率分别是多少，编号类问题单独统计。这组数字可以直接写进简历的项目描述。
    freshness: |
      核对于 2026-11：Anthropic《Introducing Contextual Retrieval》（2024-09-19）的实验结论包括「Embedding 加 BM25 优于单用 Embedding」；文中使用的是 BM25 与向量两路检索后合并去重再重排。具体收益需在自己的数据上评测。
    sources:
      - {title: "Anthropic - Introducing Contextual Retrieval", url: "https://www.anthropic.com/engineering/contextual-retrieval"}
  - id: d25-k3
    name: RRF 倒数排名融合
    level: P0
    summary: RRF 只看每个文档在各路结果中的名次，分数为各路 1/(k+名次) 之和，k 通常取 60；不需要分数归一，简单稳健
    analogy: |
      像**综合多个榜单**：一首歌在 A 榜第 1、B 榜第 3，另一首只在 A 榜第 2、B 榜没上榜。不比较各榜的播放量（尺度不同），只看名次，在多个榜都靠前的综合排名最高。
      **不一样的地方**：音乐榜可能按名次给固定分；RRF 用 1/(k+名次)，名次越靠后分差越小，k 越大越「平均」，而且只在某一路出现的文档也能得分。
    why: |
      RRF 是混合检索最常用的融合方法，几乎所有向量数据库和搜索引擎都内置了它。实现只要几行代码，但面试常要求手算一个例子，也会追问 k 的含义和常见实现错误。
    problem: |
      向量检索给的是余弦距离，关键词检索给的是 ts_rank 或 BM25 分数，两者尺度不同、分布随查询变化，没法直接比较或相加。需要一种不依赖分数绝对值的合并方法。
    principle: |
      **一、公式**

      对每个文档 d，在每一路结果中的名次为 r（从 **1** 开始）：

      `RRF(d) = Σ 1 / (k + r)`

      - 文档只出现在某一路时，另一路不贡献分数（贡献 0）。
      - k 是平滑常数，原始论文（Cormack 等，SIGIR 2009）取 **k = 60**，并发现 k 在较大范围内变化时效果差别不大。

      **二、手算一个例子（k = 60）**

      | 文档 | 向量名次 | 关键词名次 | RRF 分数 |
      |---|---|---|---|
      | A | 1 | 1 | 1/61 + 1/61 ≈ 0.0328 |
      | C | 6 | 2 | 1/66 + 1/62 ≈ 0.0313 |
      | B | 2 | 未出现 | 1/62 ≈ 0.0161 |

      - A 两路都第一，最高。
      - C 在向量里只排第 6，但在关键词里排第 2，**两路都出现**，超过了只在向量排第 2 的 B。
      - 这就是 RRF 的特点：**奖励在多路中都靠前的文档**。

      **三、在 PostgreSQL 里实现**

      ```mermaid
      flowchart TD
        Q["查询向量和关键词"] --> S["CTE semantic 向量检索 RANK 排名 取 N 条"]
        Q --> K["CTE keyword 全文检索 RANK 排名 取 N 条"]
        S --> J["FULL OUTER JOIN 按 id 合并"]
        K --> J
        J --> C["COALESCE 1 除以 k 加 rank 缺失记 0 两路求和"]
        C --> O["按 RRF 分数降序 取 Top-K"]
      ```

      - 每一路用 `RANK() OVER (ORDER BY ...)` 生成名次，**名次从 1 开始**。
      - 用 **FULL OUTER JOIN** 合并，保证只在一路出现的文档不丢失。
      - 缺失的一路用 `COALESCE(..., 0)` 记 0 分。

      **四、k 的含义和加权**

      - k 小：头部名次的差距被放大，第 1 名和第 5 名分差大。
      - k 大：各名次分差变小，更看重「出现在多少路」。
      - 想让某一路更重要，可以给它乘一个权重，但要用评测集调。

      **五、RRF 分数不是相关性**

      RRF 分数只表示在本次查询的多路结果中的综合名次，**不同查询之间不可比**，不能直接当作「是否相关」的阈值（本日 k4）。
    scenarios: |
      - **向量 + BM25 两路融合**：最常见的混合检索。
      - **多查询改写后的结果合并**：一个问题改写成三个查询，三路结果用 RRF 合并（Day 26）。
      - **多个知识库的结果合并**：制度库和 FAQ 库分别检索，再按名次融合。
    code: |
      ```sql
      -- 参考 pgvector-python 的 hybrid_search/rrf.py：$1 查询向量，$2 分词后的查询，$3 用户可见部门
      WITH semantic AS (
          SELECT id, RANK() OVER (ORDER BY embedding <=> $1) AS rank
          FROM chunks
          WHERE dept_id = ANY($3) AND status = 'active'
          ORDER BY embedding <=> $1
          LIMIT 30
      ),
      keyword AS (
          SELECT id, RANK() OVER (ORDER BY ts_rank_cd(search_tsv, query) DESC) AS rank
          FROM chunks, websearch_to_tsquery('simple', $2) AS query
          WHERE search_tsv @@ query AND dept_id = ANY($3) AND status = 'active'   -- 两路过滤必须一致
          ORDER BY ts_rank_cd(search_tsv, query) DESC
          LIMIT 30
      )
      SELECT COALESCE(s.id, k.id) AS id,
             COALESCE(1.0 / (60 + s.rank), 0.0) + COALESCE(1.0 / (60 + k.rank), 0.0) AS rrf_score
      FROM semantic s
      FULL OUTER JOIN keyword k ON s.id = k.id
      ORDER BY rrf_score DESC
      LIMIT 20;
      ```
    pitfalls: |
      - **用 INNER JOIN 合并**：只保留两路都出现的文档，丢掉了混合检索最想要的「互补」结果。
      - **名次从 0 开始**：Python 里用 `enumerate` 默认从 0 开始，和公式约定不一致，不同实现结果对不上。
      - **两路过滤条件不同**：一路有权限过滤、一路没有。
      - **把 RRF 分数当相关性阈值**：分数只表示名次，不同查询之间不可比。
      - **每路只取很少的候选**：融合的意义被削弱。
    interview_asks:
      - question: "RRF 的公式是什么？k 有什么作用？"
        answer: "每一路按名次贡献 1 除以 k 加名次，再把两路加起来。k 通常取 60 左右。k 越大，第一名和第十名的差距越小，用来避免只相信某一路的头名。"
      - question: "请手算一个 RRF 的例子。"
        answer: "设 k 是 60。某文档在向量路排第 1，得分 1/61；在关键词路排第 2，得分 1/62。总分是这两项相加。只出现在一路的文档，另一路就是 0。按总分排序。"
      - question: "实现 RRF 时有哪些常见错误？"
        answer: "用分数代替名次、两路的 k 不一致、同一文档 id 对不齐、没出现的那一路当成很差的名次而不是 0。合并前要先按文档 id 对齐。"
    project_example: |
      **p1 企业知识库问答**的检索 SQL 就是上面这段：两个 CTE 各取 30 条、两路带同样的部门和状态过滤、FULL OUTER JOIN、k = 60，最终取 20 条进入重排。
      上线前做过两个检查：一是故意构造只在关键词一路出现的编号类问题，确认能被召回（验证没写成 INNER JOIN）；二是用评测集对比 k = 20、60、100，结果差别很小，所以保持默认 60，和论文结论一致。
    freshness: |
      核对于 2026-11：RRF 出自 Cormack、Clarke、Büttcher 的 SIGIR 2009 论文，公式为 Σ 1/(k + r(d))，论文中 k = 60 由预实验确定，且 k 在较大范围内变化时效果差异不大。pgvector-python 官方示例 hybrid_search/rrf.py 使用 RANK() 生成名次、FULL OUTER JOIN 合并、每路 LIMIT 20、k = 60。
    sources:
      - {title: "Cormack et al. - Reciprocal Rank Fusion (SIGIR 2009)", url: "https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf"}
      - {title: "pgvector-python - hybrid_search/rrf.py", url: "https://github.com/pgvector/pgvector-python/blob/master/examples/hybrid_search/rrf.py"}
  - id: d25-k4
    name: Top-K 与相似度阈值怎么定
    level: P1
    summary: 召回阶段多取保证不漏，交给模型时少给保证干净；阈值必须在自己的数据和当前模型上标定，换模型要重标
    analogy: |
      像列表页的**预加载和展示**：后台先拉 50 条做排序和筛选（召回），页面只展示最相关的 5 条（交给模型）。拉太少会漏，展示太多用户看不过来。
      **不一样的地方**：前端筛选条件是确定的；相似度阈值没有通用值，同一个 0.75 在不同 Embedding 模型下含义完全不同。
    why: |
      Top-K 和阈值直接决定「模型拿到多少、拿到什么」：太少会漏掉答案，太多会引入噪声和成本，没有阈值则无关问题也会硬塞证据导致胡编（见 Day 21）。
      面试官常问「你们 Top-K 取多少」「相似度阈值设多少、怎么定的」。
    problem: |
      Top-K 永远返回 K 条，不管是否真的相关；不同问题需要的证据数量也不同。很多项目随手设一个 K = 5 和阈值 0.8，换了 Embedding 模型后阈值就失效了，没人发现。
    principle: |
      **一、区分两个 K**

      ```mermaid
      flowchart LR
        A["每路召回 N 条 如 30"] --> B["融合后候选 如 20 到 50 条"]
        B --> C["重排 Day 26"]
        C --> D["阈值过滤"]
        D --> E["交给模型 K 条 如 3 到 8 条"]
        D -->|"全部低于阈值"| F["直接拒答 不调用模型"]
      ```

      - **召回 K（宽）**：每路多取一些，保证正确答案在候选里。Anthropic 的实验先召回 150 条，重排后保留 20 条，并发现交给模型 Top-20 优于 Top-10 和 Top-5。
      - **生成 K（窄）**：交给模型的数量受上下文预算、噪声和成本约束（见 Day 13、Day 20）。具体取多少，要看你的模型和评测结果。

      **二、阈值为什么不能照抄**

      - 不同 Embedding 模型的相似度分布差别很大：有的模型无关文本也有 0.7，有的相关文本才 0.5。
      - 阈值要**在自己的数据上标定**：取一批「有答案」和「无答案」的问题，画出正确段落和无关段落的分数分布，选一个能区分两者的值，并在换模型后重标。
      - **RRF 分数不能当阈值**：它只代表名次。阈值应该基于向量相似度或重排模型分数（Day 26 的重排分数更适合做阈值）。

      **三、阈值和拒答**

      - 过滤后为空：不调用模型，直接返回「知识库中没有找到相关内容」，省钱且避免胡编。
      - 阈值偏高会误拒有答案的问题，偏低会放进噪声，要用评测集同时看「误拒率」和「答错率」。

      **四、调参方法**

      1. 用评测集计算不同召回 N 下的 Recall@N，找到「再大收益很小」的点。
      2. 固定召回，调生成 K 和阈值，看答案正确率、拒答准确率、平均 Token 数。
      3. 把参数写入配置并记录对应的模型版本。
    scenarios: |
      - **用户问知识库里没有的内容**：所有候选低于阈值，直接拒答。
      - **复杂问题需要多段证据**：生成 K 适当放宽，配合重排保证质量。
      - **更换 Embedding 模型**：重新标定阈值，否则拒答率可能骤升或骤降。
    pitfalls: |
      - **召回 K 和生成 K 用同一个值**：要么召回不足，要么塞给模型太多。
      - **照抄网上的阈值 0.8**：换个模型就失效。
      - **用 RRF 分数做阈值**：不同查询之间不可比。
      - **只看答错率不看误拒率**：阈值调高后看似准确，其实大量有答案的问题被拒了。
      - **换模型不重标阈值**：上线后才发现拒答率异常。
    interview_asks:
      - question: "你们的 Top-K 设多少？召回阶段和生成阶段一样吗？"
        answer: "不一样。召回可以多取一些，比如几十条，留给重排。送给模型的通常是重排后的几条。最终放进提示的数量看评测，不是召回多少就塞多少。"
      - question: "相似度阈值怎么确定？换了 Embedding 模型要怎么办？"
        answer: "用评测集扫一遍阈值，看漏掉多少真证据、放进多少无关片段。换模型后分数完全不能比，阈值和索引一起重做。不要把 0.7 写成常数。"
    project_example: |
      **p1 企业知识库问答**的参数：两路各召回 30 条，RRF 融合取 20 条进入重排（Day 26），重排分数过阈值后最多取 5 条交给模型；全部低于阈值则直接返回「知识库中没有找到相关规定」。
      阈值标定：用 80 个有答案、20 个无答案的问题，统计正确段落和无关段落的分数分布，选误拒率和答错率都可接受的值，并把对应的模型版本写进配置。
      面试时你能说出「为什么是 30、20、5」和「阈值怎么来的」，比报一个数字有说服力得多。
    freshness: |
      核对于 2026-11：Anthropic《Introducing Contextual Retrieval》（2024-09-19）的实验中，重排前先召回 150 个 chunk、重排后保留前 20 个，并报告交给模型 Top-20 的效果优于 Top-10 和 Top-5。这是其实验设置下的结论，生成 K 应结合自己的模型上下文、成本和评测结果确定。
    sources:
      - {title: "Anthropic - Introducing Contextual Retrieval", url: "https://www.anthropic.com/engineering/contextual-retrieval"}
test:
  - id: d25-t1
    kp: d25-k1
    type: single
    question: BM25 中 IDF 的作用是？
    options:
      - "让出现次数越多的词得分无限增加"
      - "对长文档加分，因为长文档信息更多"
      - "统计查询中一共有多少个词"
      - "让只在少数文档中出现的稀有词命中时得分更高"
    answer: [3]
    explain: |
      IDF（逆文档频率）衡量词的稀有度：「年假」只在少数文档出现，命中它很有区分度；「公司」到处都有，命中几乎不加分。
      A 恰好相反，BM25 用 k1 让词频饱和；B 也相反，参数 b 对长文档做归一打折；C 与 IDF 无关。
  - id: d25-t2
    kp: d25-k1
    type: multi
    question: 关于 PostgreSQL 自带全文检索，以下哪些说法正确？
    options:
      - "ts_rank 和 ts_rank_cd 不使用全局信息，也就是没有 IDF"
      - "plainto_tsquery 会在词之间插入 AND，所有词都要出现"
      - "默认解析器会自动把中文按词语切分"
      - "可以用 GIN 索引加速全文检索"
      - "ts_rank 的打分与 BM25 完全相同"
    answer: [0, 1, 3]
    explain: |
      A 出自 PostgreSQL 官方文档；B plainto_tsquery 用 & 连接词，自然语言长问题容易零结果；D GIN 是全文检索的常用索引。
      C 默认解析器按空格和标点切分，连续汉字会被当成一个词，中文需要 zhparser 等扩展或在应用层分词；E ts_rank 没有 IDF，与 BM25 不同。
