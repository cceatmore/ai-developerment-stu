    question: 用户问「E1024 错误怎么处理」，只用向量检索时，排在前面的是 E1025 和 E1204 错误的处理说明。最根本的原因是？
    options:
      - "Embedding 模型的向量维度太低，区分不了细节"
      - "向量库的 HNSW 索引参数没调好，召回率太低"
      - "向量检索对精确编号不敏感，相近编号语义很接近"
      - "错误码文档内容太短，向量化时信息被丢弃了"
    answer: [2]
    explain: |
      向量检索比较的是语义，E1024、E1025、E1204 都是「某个错误码的处理说明」，语义几乎一样。精确的字符差异需要关键词检索来区分，这正是混合检索的价值。
      A、B 调整后也无法从根本上区分编号；D 短文本可以向量化。
  - id: d25-t6
