day: 48
phase: 5
title: 系统设计：答题框架、企业知识库 + Agent 平台参考架构、三条核心数据流、容量扩展与故障
goals:
  - 能用「澄清 → 估算 → 高层架构 → 深挖 → 扩展与故障 → 评测安全成本」六步回答 AI 系统设计题，并控制好 45 分钟的节奏
  - 能画出企业知识库 + Agent 平台的参考架构，说清每个组件「为什么存在、去掉会怎样」
  - 能讲清入库、问答、Agent 执行三条数据流的状态、幂等和失败恢复
  - 能做数量级估算，指出 AI 系统真正的瓶颈，并给出分阶段演进路线、超时预算和降级方案
minutes: 90
resources:
  - title: "system-design-primer 中文版：如何处理一个系统设计的面试题"
    url: "https://github.com/donnemartin/system-design-primer/blob/master/README-zh-Hans.md"
    kind: repo
    lang: zh
    minutes: 25
    note: "只看「如何处理一个系统设计的面试题」四个步骤和「粗略计算」部分，对应 k1 的答题框架和 k4 的估算；其余缓存、数据库章节按需查阅"
  - title: "Anthropic：Building effective agents"
    url: "https://www.anthropic.com/engineering/building-effective-agents"
    kind: article
    lang: en
    minutes: 20
    note: "看 workflows 与 agents 的区别和五种 workflow 模式，以及「先从最简单的方案开始」的建议，用于回答设计题里「这里为什么用固定流程而不用 Agent」"
  - title: "AWS 博客：Multi-tenant RAG with Amazon Bedrock Knowledge Bases"
    url: "https://aws.amazon.com/blogs/machine-learning/multi-tenant-rag-with-amazon-bedrock-knowledge-bases/"
