knowledge_points:
  - id: d48-k1
    name: 系统设计题答题框架（AI 版）
    level: P0
    summary: 先澄清再画图；六步走：需求约束、估算、高层架构、深挖核心组件、扩展故障取舍，最后必答评测、安全与成本
    analogy: |
      **像你主持过的前端技术方案评审**：先对齐需求和范围，再定技术选型、拆组件和状态、定性能预算，最后讲上线和监控。

      **不一样的地方：**
      - 前端方案很少需要估算规模；后端设计题**一定要估算**（用户数、请求量、数据量），因为它决定了架构复杂度。
      - 前端状态大多在浏览器里，刷新就没了；后端要回答「**状态放哪、进程挂了怎么恢复、重复执行怎么办**」。
      - AI 系统设计题比传统题多三个必答维度：**质量怎么评测、成本怎么控制、模型被注入或幻觉怎么防**。
      - 评审会是你讲、别人提意见；面试是**对话**，要主动确认假设，让面试官选择深挖方向。
    why: |
      AI 应用和 Agent 岗位的面试，几乎都有一轮系统设计：「设计一个企业知识库问答」「设计一个客服 Agent」「设计一个多租户 RAG 平台」。
      这一轮考的不是你背了多少组件，而是**能否在模糊需求下做出合理取舍并说清理由**。没有框架的人会一上来画满屏方框，然后被一个追问问倒。
    problem: |
      解决「**面对一个开放问题，45 分钟内如何有条理地给出一个可信的设计**」。
      框架让你不遗漏关键维度，也让面试官容易跟上你的思路，并在你预留的位置深挖。
    principle: |
      **一、六步框架和时间分配（以 45 分钟为例）**

      ```mermaid
      flowchart TD
        A["1 澄清需求与约束 约 6 分钟"] --> B["2 粗略估算 约 4 分钟"]
        B --> C["3 高层架构 约 8 分钟"]
        C --> D["4 深挖两到三个核心组件 约 15 分钟"]
        D --> E["5 扩展 故障 取舍 约 6 分钟"]
        E --> F["6 评测 安全 成本 上线 约 4 分钟"]
        F --> G["收尾 回顾关键取舍和演进路线"]
        D -. "面试官追问时随时回到这里" .-> D
      ```

      这和 system-design-primer 的四步（使用场景与约束 → 高层设计 → 核心组件 → 扩展设计）一致，AI 版在最后加了一步「评测、安全、成本」。

      **二、第 1 步：澄清时问什么**

      | 维度 | 典型问题 |
      |---|---|
      | 用户与场景 | 谁用？员工自助问答还是客服辅助？要不要执行动作（派单、审批）？ |
      | 规模 | 多少用户、日活比例、文档数量和格式、增长预期 |
      | 质量目标 | 准确率怎么衡量？必须给引用吗？答不出时拒答还是转人工？ |
      | 非功能 | 首字时间目标、可用性、数据能否出境、是否私有化部署 |
      | 权限与租户 | 按部门、按文档权限？单租户还是多租户 SaaS？ |
      | 边界 | 第一期**不做**什么（多语言、语音、多 Agent） |

      问完后用一两句话**复述假设**：「我按 1 万员工、日活 20%、文档 10 万份、首字 2 秒内、必须引用和按部门权限来设计，可以吗？」

      **三、第 3 步：高层架构先画「主干」**

      先画 5~7 个框：客户端、网关与鉴权、API 服务、异步任务、存储、模型网关、Agent 与工具层。**先讲数据怎么流动，再讲每个框里用什么技术**。

      **四、第 4 步：深挖讲什么**

      主动说「我建议重点讲入库流水线和 Agent 执行这两块，您看可以吗」。深挖时讲：**状态在哪、失败怎么恢复、怎么保证幂等、关键参数怎么定**。

      **五、第 6 步：AI 系统必答的三件事**

      - **评测**：离线评测集（检索 Recall@K、答案正确率、引用正确率、Agent 任务完成率）+ 线上反馈 + 回归门禁（Day 41、Day 44）；
      - **安全**：权限在模型之外（Day 46）、提示注入与工具最小权限（Day 45）、高风险动作人工审批（Day 37）；
      - **成本**：单次请求 Token 估算、缓存、路由、预算（Day 47）。

      **六、取舍的表达模板**

      「**选 A，因为当前约束是 X；代价是 Y；用 Z 缓解；当出现 W 时切换到 B。**」
      例：「向量存储先用 pgvector，因为数据量在千万级以内且需要和权限数据同库事务；代价是超大规模时检索性能不如专用向量库；用分区和过滤索引缓解；当单租户向量过亿或检索 P95 超标时迁移到专用向量库。」

      **七、Workflow 还是 Agent：AI 设计题的核心取舍**

      Anthropic 的建议是**先用最简单的方案**：步骤固定的任务用 workflow（链式、路由、并行、编排-执行、评估-优化），只有步骤无法预先确定时才用 Agent，因为 Agent 用**更高的延迟和成本换取灵活性**（见 Day 31）。知识库问答通常是 workflow；「帮我分析这周告警并派单」才需要 Agent。
    scenarios: |
      - **「设计一个企业知识库问答」**：重点在入库流水线、检索质量、权限过滤、引用与拒答、评测。
      - **「设计一个客服 Agent」**：重点在工具设计、转人工、多轮状态、幂等和审批、轨迹评测。
      - **「设计一个多租户 RAG 平台」**：重点在租户隔离模型、吵闹邻居、按租户计量和配额。
      - **「设计一个 Coding Agent」**：重点在沙箱、上下文检索、生成-测试-修复循环、PR 审查与评测。
    pitfalls: |
      - **一上来就画架构图**：没确认需求，设计和面试官想要的方向不一致。
      - **堆技术名词**：Kafka、K8s、多 Agent 全上，却说不清为什么需要。
      - **不估算**：说不出 QPS 和数据量，就无法证明架构复杂度合理。
      - **只讲正常路径**：没有失败恢复、幂等、超时和降级。
      - **漏掉评测**：AI 系统不讲怎么证明效果，面试官会认为你没做过生产。
      - **独白 40 分钟**：不给面试官插话的机会，错过了他想深挖的方向。
    interview_asks:
      - question: "给你 45 分钟设计一个企业知识库问答系统，你会怎么开始？"
        answer: "先问清用户、文档从哪来、权限、能不能出网、延迟和预算。然后定固定的入库和问答流程，标出权限在哪一步做、怎么评测、哪一步最可能慢。最后才讲用什么模型和库。不问清楚就画框，框是空的。"
      - question: "这个场景为什么用固定 workflow 而不是 Agent？什么时候你会改用 Agent？"
        answer: "知识库问答的步骤是固定的：检索、重排、生成、引用。用 workflow 更稳更便宜。只有问题经常要查多个系统、下一步取决上一步，才加 Agent，而且仍然把权限放在代码里。"
      - question: "你的设计里质量怎么评测？成本大概多少？"
        answer: "准备带出处的问题和该拒答的题，看召回、引用对不对、答案是否被资料支持。成本按一次问答的 Token 乘调用量估算，并说明缓存之后会少多少。说得出数字来自哪，而不是报一个精确到分的假数字。"
    project_example: |
      **用 p3 的 PR 审查 Agent 练一遍六步框架（本日的 p3 模块）：**
      - 澄清：审查哪些仓库、每天多少 PR、要不要自动提交修复、误报能接受多少；
      - 估算：每个 PR 的 diff 大小分布、每次审查的 Token 和耗时；
      - 架构：Webhook 进入队列 → Worker 拉取 diff 和相关文件 → 审查 workflow（规则检查 + 模型审查）→ 评论回写；
      - 深挖：上下文怎么选（diff 加调用方文件）、怎么避免重复评论（按 PR 和提交哈希幂等）；
      - 评测：用一批历史 PR 的人工评审意见做评测集，统计有效评论比例和误报（用你的评测结果填写）。
      这样你在面试里被问到「设计一个 Coding Agent」时，有一个自己真正做过的例子可以讲。
    freshness: |
      2026-11 核实：system-design-primer 中文版仍保留「如何处理一个系统设计的面试题」四步法。Anthropic《Building effective agents》发布于 2024-12，文中关于 workflow 与 agent 的划分和「先从简单方案开始」的建议仍被广泛引用，但文中提到的具体框架和工具已有更新，以各框架当前文档为准。
    sources:
      - title: "system-design-primer README-zh-Hans"
        url: "https://github.com/donnemartin/system-design-primer/blob/master/README-zh-Hans.md"
      - title: "Anthropic Building effective agents"
        url: "https://www.anthropic.com/engineering/building-effective-agents"

  - id: d48-k2
    name: 企业知识库 + Agent 平台参考架构
    level: P0
    summary: 网关鉴权、无状态 API、队列与 Worker、PostgreSQL 加 pgvector、Redis、Agent 运行时、MCP 工具层、LLM 网关、可观测性，各司其职
    analogy: |
      **像你做过的智慧园区大屏系统**：前端大屏 → nginx → Node 中间层聚合各子系统（门禁、视频、能耗）的接口 → 各子系统。参考架构里的 **API 服务像 Node 中间层，MCP 工具层像被聚合的子系统接口，LLM 网关像统一的第三方接口代理**。

      **不一样的地方：**
      - 中间层主要做聚合和转发，请求几百毫秒就结束；AI 平台的请求**又慢又贵**（几秒到几分钟、按 Token 计费），所以需要队列、限流、预算和流式。
      - 大屏的数据来源是可信的业务系统；AI 平台的「调用方」之一是**模型**，它的决策不可信，所以权限必须在模型之外执行。
      - 中间层基本无状态；Agent 执行有**长生命周期的状态**（多轮、等待审批），要持久化和可恢复。
    why: |
      这是 AI 应用和 Agent 两类岗位都会问的「标准题」。你需要一张自己能**从头画到尾、每个框都能解释为什么存在**的参考架构，面试时在它的基础上按题目裁剪。
    problem: |
      解决「**一个同时提供知识问答和业务操作的 AI 平台，由哪些组件构成、各自负责什么、怎么连接**」，并让架构满足权限、可扩展、可恢复、可观测和成本可控这几个要求。
    principle: |
      **一、参考架构**

      ```mermaid
      flowchart TB
        U["Web 与 IM 客户端"] --> GW["网关 TLS 限流 鉴权 OIDC"]
        GW --> API["FastAPI 无状态 多副本"]
        API --> R[("Redis 限流 缓存 锁")]
        API --> PG[("PostgreSQL 业务数据 权限 pgvector 检查点")]
        API --> Q["任务队列"]
        Q --> W["入库 Worker 解析 切片 向量化"]
        W --> OS[("对象存储 原始文件")]
        W --> PG
        API --> AG["Agent 运行时 LangGraph"]
        AG --> MCP["MCP 工具服务 工单 设备 OA"]
        API --> LG["LLM 网关 计量 路由 失败切换"]
        AG --> LG
        W --> LG
        LG --> M["模型厂商 或 自建推理"]
        API -.-> OB["可观测性 Trace 指标 日志 审计"]
        AG -.-> OB
      ```

      **二、每个组件为什么存在**

      | 组件 | 职责 | 去掉会怎样 |
      |---|---|---|
      | 网关 + OIDC | TLS、粗粒度限流、统一认证 | 每个服务各自实现鉴权，容易漏 |
      | FastAPI 无状态 | 问答编排、权限判断、SSE 流式 | 有状态就无法随意扩容和滚动发布 |
      | 任务队列 + Worker | 解析、切片、向量化等慢任务 | 上传大文件拖垮在线接口，失败无法重试 |
      | PostgreSQL + pgvector | 业务数据、权限、向量、Agent 检查点 | 向量和权限分库，删除和权限变更难保证一致 |
      | Redis | 限流、缓存、分布式锁、流式断点 | 限流无法跨副本，重复执行难以防止 |
      | 对象存储 | 原始文件 | 文件放数据库或本地盘，扩容和备份困难 |
      | Agent 运行时 | 多步任务、状态持久化、中断审批 | 长任务一断就从头来，无法等待人工确认 |
      | MCP 工具层 | 把业务系统封装成标准工具 | 每个 Agent 各自对接业务系统，权限和审计分散 |
      | LLM 网关 | 统一计量、限额、路由、失败切换 | 成本无法归因，厂商故障时全站不可用 |
      | 可观测性 | Trace、指标、审计 | 答错了、变慢了都无法定位 |

      **三、三条设计原则**

      1. **计算无状态，状态集中存储**：会话、Agent 检查点在 PostgreSQL，锁和限流在 Redis，任何副本都能处理任何请求；
      2. **快慢分离**：秒级的问答走同步 + 流式，分钟级的入库和批量任务走队列；
      3. **权限在模型之外**：检索时 ACL 过滤、工具服务按用户身份再授权、高风险动作审批，模型只负责「提议」。

      **四、关键选型与切换条件**

      - **pgvector 起步**：与业务数据同库，权限过滤、RLS、事务删除一次搞定（见 Day 24、Day 30）。当单表向量规模极大、带过滤检索的召回或延迟无法满足时，再考虑 Milvus、Qdrant 等专用向量库；
      - **问答用 workflow，运营任务用 Agent**：问答流程固定（改写、检索、重排、生成、引用校验），用固定流程更快、更可控；
      - **Agent 运行时**：LangGraph 的 Checkpointer 持久化每一步，支持中断等待审批后恢复（见 Day 37）；
      - **单 Agent 优先**：工具多到一个上下文放不下，或需要隔离子任务上下文时，再拆成 Supervisor + 子 Agent（见 Day 39）；
      - **MCP**：工具服务按 Streamable HTTP 暴露，独立部署和授权（见 Day 38、Day 46）。
    scenarios: |
      - **员工问制度**：网关鉴权 → API 走 RAG workflow → 流式返回带引用的答案。
      - **运营人员说「帮我把今天的高优先级告警派单」**：API 交给 Agent 运行时 → 调设备和工单 MCP 工具 → 派单前中断等待确认。
      - **管理员上传 500 份文档**：API 只写记录和投递任务，Worker 异步处理，前端轮询或订阅进度。
      - **厂商故障**：LLM 网关切换到备用模型，用户只看到轻微的质量差异。
    pitfalls: |
      - **API 进程内存里存对话历史**：多副本时请求落到别的副本就丢上下文，发布时全部丢失。
      - **在 API 请求里同步处理大文件**：上传高峰拖垮问答接口。
      - **让模型判断权限**：在系统提示里写「只回答用户有权限的内容」，一次注入就失效。
      - **一开始就上多 Agent**：调试困难、延迟和成本翻倍，却没有带来质量提升。
      - **每个服务直接调用模型厂商**：成本无法归因，限额和失败切换各写一套。
    interview_asks:
      - question: "画一下你的知识库 + Agent 平台架构，每个组件为什么需要？"
        answer: "文档入库、向量和全文索引、问答服务、工具执行、模型网关、权限、观测。网关统一管配额和模型切换，观测用来追查一次回答，权限独立于模型。少一个组件就要说明那件事由谁做。"
      - question: "为什么用 pgvector 而不是专门的向量数据库？什么时候会换？"
        answer: "业务数据、权限和向量放在一个 PostgreSQL 里，事务和运维都简单，规模没到之前够用。当向量内存、查询延迟或写入成为明确瓶颈，再拆到专用向量库，同时保留过滤条件。"
      - question: "你说权限在模型之外，具体在哪几个地方执行？"
        answer: "检索条件、工具执行、引用返回、缓存键，这几处都按登录用户过滤。模型提示不是权限边界。数据库行级安全是最后一道，防止查询忘了条件。"
      - question: "为什么需要 LLM 网关？只有一个模型厂商时还需要吗？"
        answer: "需要。网关集中做鉴权、限流、记账、超时和日志，业务服务就不用各写一遍。以后换模型或加备用，也只改网关。一个厂商不等于这些事情不存在。"
    project_example: |
      **把 p1 和 p2 合起来就是这张图：**
      - p1 提供「入库 Worker + pgvector + RAG workflow + 引用与拒答 + 流式界面」；
      - p2 提供「LangGraph Agent + Checkpointer + 审批中断 + 工单与设备 MCP server + Text2SQL 子 Agent」；
      - 两者共用网关鉴权（Day 46）、LLM 调用层与限流（Day 47）、Trace 与评测（Day 41~43）。
      面试时可以说：「这张图不是我背的，每个框都对应我项目里的一个模块。」然后让面试官挑一个框深挖。
    freshness: |
      2026-11 核实：MCP 规范最新版为 2026-07-28，远程传输为 Streamable HTTP，授权基于 OAuth 2.1 草案。pgvector 0.8 系列支持带过滤条件时的迭代索引扫描，HNSW 默认 ef_search 为 40，过滤较严时需要调整。AWS 关于多租户 RAG 的文章给出了 silo、pool、bridge 三种模式的知识库落地对比。
    sources:
      - title: "MCP Specification 2026-07-28"
        url: "https://modelcontextprotocol.io/specification/2026-07-28/index"
      - title: "pgvector README"
        url: "https://github.com/pgvector/pgvector"
      - title: "AWS Multi-tenant RAG with Amazon Bedrock Knowledge Bases"
        url: "https://aws.amazon.com/blogs/machine-learning/multi-tenant-rag-with-amazon-bedrock-knowledge-bases/"

  - id: d48-k3
    name: 三条核心数据流：入库、问答、Agent 执行
    level: P0
    summary: 入库是可重试的状态机并原子切换版本；问答是带权限过滤和引用校验的流水线；Agent 执行靠检查点、锁和幂等键保证可恢复不重复
    analogy: |
      **入库状态机像你做过的「大文件分片上传」**：上传中、合并中、成功、失败，失败可以断点续传，前端显示进度。**Agent 的检查点像表单草稿自动保存**：关掉页面再打开，能从上次的步骤继续。

      **不一样的地方：**
      - 分片上传的状态在前端和一个接口里；入库是**多个 Worker 异步处理**，消息可能重复投递，每一步都必须幂等。
      - 表单草稿丢了用户重填即可；Agent 恢复时如果重复执行了「派单」这种有副作用的动作，就是真实的业务事故。
      - 前端轮询进度只是展示；后端要保证**新版本完全就绪前，在线问答一直用旧版本**。
    why: |
      面试官深挖时最爱问的就是这三条流：「200 页 PDF 上传后到能检索经历了什么」「回答是怎么生成的」「Agent 中途挂了怎么办」。
      能讲清**状态、失败恢复和幂等**，是区分「调过 API」和「做过系统」的关键。
    problem: |
      解决三个问题：**慢任务如何可靠完成**（入库）、**在线请求如何又快又对又不越权**（问答）、**长任务如何可中断、可恢复、不重复执行副作用**（Agent）。
    principle: |
      **一、入库流：可重试的状态机**

      ```mermaid
      stateDiagram-v2
        [*] --> uploaded : 文件写入对象存储 记录入库
        uploaded --> parsing : Worker 领取任务
        parsing --> chunking : 解析成功
        chunking --> embedding : 切片完成
        embedding --> ready : 向量写入 切换活跃版本
        parsing --> failed : 格式错误或超时
        embedding --> failed : 重试次数用尽
        failed --> uploaded : 人工或自动重试
        ready --> [*]
      ```

      - **幂等**：以 `(doc_id, version)` 为单位写切片，重跑时先删除该版本已有切片再写入，或用唯一键 upsert；消息重复投递不会产生重复切片；
      - **版本原子切换**：新版本全部写完后，在一个事务里把 `documents.active_version` 改成新版本；检索只查活跃版本，旧版本延迟清理。这样更新期间在线问答不受影响；
      - **进度与失败**：状态写数据库，前端轮询或订阅；失败记录原因，便于人工处理扫描件、加密 PDF 等问题文件；
      - **公平调度**：大租户批量上传进入独立队列或按租户限速（Day 46、Day 47）。

      **二、问答流：一条固定的 workflow**

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant A as API
        participant P as PostgreSQL与pgvector
        participant L as LLM网关
        U->>A: 提问 携带会话 ID
        A->>A: 鉴权 限流 取权限范围
        A->>L: 改写问题 小模型
        A->>P: 混合检索 带租户和 ACL 过滤 只查活跃版本
        A->>A: 重排 低于阈值则拒答或澄清
        A-->>U: 推送检索进度和引用来源
        A->>L: 生成 流式
        L-->>A: token 流
        A-->>U: SSE 流式正文
        A->>A: 校验引用编号都来自检索结果
        A->>P: 保存消息 引用 usage 和 trace_id
      ```

      要点：**ACL 在检索阶段过滤**；相关性不足时**拒答而不是硬答**；生成后校验引用；保存 usage 用于成本归因。

      **三、Agent 执行流：可中断、可恢复、不重复**

      - **线程与归属**：每个会话一个 `thread_id`，首先校验它属于当前用户和租户（Day 46 的 BOLA）；
      - **检查点**：Checkpointer 在每一步后把状态写入 PostgreSQL，进程崩溃后用同一个 `thread_id` 从最后一步继续；
      - **中断审批**：派单、关闭工单等动作前 `interrupt`，HTTP 请求结束，状态落库；用户在工作台确认后，用同一 `thread_id` 恢复（Day 37）；
      - **同一线程不并发**：Redis 锁 `SET key token NX EX`，释放时**比对 token 再删除**（Lua 脚本），防止误删别人的锁；
      - **副作用幂等**：工具调用带幂等键（如 `thread_id + 步骤序号`），工单服务按幂等键去重，恢复时重复调用也只生效一次（Day 33）；
      - **边界**：最大步数、总超时、单工具超时、单任务 Token 预算（Day 47）；
      - **长任务**：超过几十秒的任务放进队列由 Worker 执行，前端通过事件流订阅进度，**生成与连接解耦**，用户刷新页面也能续上。
    scenarios: |
      - **合同库更新**：法务上传新版合同，新版本就绪前员工问到的仍是旧版，切换后旧版本延迟清理。
      - **问答相关性不足**：重排分数都低于阈值，回复「没有找到相关制度，可以联系人事」，并记录到待补充问题清单。
      - **派单审批**：Agent 生成派单计划后中断，负责人第二天上午在工作台确认，Agent 从中断处继续执行。
      - **Worker 被 K8s 驱逐**：消息重新投递，按 `(doc_id, version)` 幂等重跑，不产生重复切片。
    code: |
      ```python
      RELEASE = """
      if redis.call('GET', KEYS[1]) == ARGV[1] then
        return redis.call('DEL', KEYS[1])
      end
      return 0
      """

      @app.post("/agent/threads/{thread_id}/messages")
      async def agent_chat(thread_id: str, body: ChatIn, user=Depends(get_current_user)):
          if not await thread_belongs_to(thread_id, user.id, user.tenant_id):
              raise HTTPException(404, "not found")
          token = uuid4().hex
          lock_key = f"lock:thread:{thread_id}"
          if not await redis.set(lock_key, token, nx=True, ex=120):
              raise HTTPException(409, "thread is busy")
          try:
              config = {"configurable": {"thread_id": thread_id}, "recursion_limit": 12}
              async with asyncio.timeout(90):
                  return await graph.ainvoke({"messages": [("user", body.text)]}, config)
          finally:
              await redis.eval(RELEASE, 1, lock_key, token)
      ```
    pitfalls: |
      - **入库直接覆盖旧切片**：更新期间检索到一半新一半旧的内容，或者新版本失败后旧版本也没了。
      - **消息重投产生重复切片**：同一段内容被检索到两次，占用 TopK 名额。
      - **检索后再过滤权限**：见 Day 46，影响质量也有泄露风险。
      - **审批时让 HTTP 请求挂起等待**：连接超时、进程重启后状态全丢。
      - **释放锁不比对持有者**：任务超过锁 TTL 后，删掉了另一个请求刚拿到的锁。
      - **恢复时重复执行副作用**：检查点在工具调用之前，恢复后又派了一次单。
    interview_asks:
      - question: "一份 200 页的 PDF 从上传到能被检索，经历了哪些步骤？中途失败怎么办？"
        answer: "上传、解析、清洗、切片、嵌入、写索引，每步有状态。失败记在哪一步，可以从这一步重试，不从头上传。解析为空就停，不要把空切片写进索引。完成前问答侧看不到这份半成品。"
      - question: "文档更新时，怎么保证在线问答不受影响？"
        answer: "新版本全部入库成功后，再把「当前版本」切过去。旧版本先留着。切换是一次原子的版本指针更新。不要边删旧向量边写新向量，中间会查到一半。"
      - question: "Agent 执行到一半进程崩溃了，怎么恢复？怎么避免重复派单？"
        answer: "每步有检查点，重启后从最后一步继续。派单这种写操作带幂等键，恢复时先查已经派过没有。不能从第一步把所有工具再调一遍。"
      - question: "用户刷新页面，正在生成的回答怎么办？"
        answer: "后端任务继续，结果按会话 id 保存。前端重连后接着拉流或取已经生成的部分。不要一切刷新就新开一次模型调用。断开的那次要能取消未完成的上游请求。"
    project_example: |
      **p2 园区 Agent 的派单流程：**
      - 工作台发起「处理今天的高优先级告警」→ 校验 `thread_id` 归属 → 加线程锁；
      - Agent 调用告警查询工具和设备工具，生成派单计划，在 `dispatch_work_order` 前 `interrupt`；
      - 审批卡片展示计划，负责人确认后用同一 `thread_id` 恢复；
      - 派单工具带幂等键 `thread_id:step`，工单服务按幂等键去重；
      - Trace 里能看到每一步的工具调用和耗时，审计里能看到发起人和审批人。
      **p1 的入库**也按状态机实现，`active_version` 在事务里切换，有一组「中途杀掉 Worker」的测试用例证明能恢复。
    freshness: |
      2026-11 核实：LangGraph 生产环境推荐使用 langgraph-checkpoint-postgres 提供的 PostgresSaver / AsyncPostgresSaver 持久化，interrupt 后用同一 thread_id 恢复执行；recursion_limit 通过 config 传入以限制最大步数。具体 API 以 LangGraph 当前文档为准。
    sources:
      - title: "LangGraph Persistence"
        url: "https://docs.langchain.com/oss/python/langgraph/persistence"
      - title: "LangGraph Interrupts"
        url: "https://docs.langchain.com/oss/python/langgraph/interrupts"

  - id: d48-k4
    name: 容量估算、分阶段演进与故障设计
    level: P1
    summary: AI 系统的 QPS 往往不高，瓶颈在模型配额、成本和长连接并发；按阶段演进，内层超时小于外层，每个依赖都有降级方案
    analogy: |
      **像前端的性能预算**：首屏 JS 不超过多少 KB、LCP 不超过 2.5 秒，超了就要拆包或懒加载。后端的容量估算和超时预算也是「先定预算，再按预算设计」。

      **不一样的地方：**
      - 前端性能预算主要约束资源大小；AI 后端的预算同时约束**并发连接、上游 Token 配额和钱**。
      - 前端某个接口挂了，页面局部报错；后端一个依赖挂了，如果没有超时和降级，会**拖垮整条链路**。
    why: |
      面试官常在设计题后半段追问：「用户量涨 100 倍怎么办？」「最容易出故障的是哪几个点？」
      能用数量级估算指出**真正的瓶颈**，并给出有先后顺序的演进路线，比直接说「上 K8s、上微服务」可信得多。
    problem: |
      解决「**规模变化时先改什么、后改什么**」，以及「**任何一个依赖出故障时，系统如何有序降级而不是整体雪崩**」。
    principle: |
      **一、数量级估算（以下数字均为示例假设，面试时先和面试官确认）**

      假设 1 万员工、日活 20%、人均每天 10 次提问：
      - 每天约 2 万次提问，集中在 8 小时工作时间，平均约 0.7 QPS；高峰按平均的 5 倍估算约 3.5 QPS；
      - 每次平均 8 秒，按 Little 定律在途约 **28 个流**；
      - 每次约 4000 输入 token、500 输出 token，每天约 8000 万输入 token、1000 万输出 token，**成本和厂商 TPM 配额**才是首要约束；
      - 文档 10 万份、每份平均 50 个切片，约 500 万个向量，pgvector 单库可以承载。

      结论：**QPS 不高，CPU 不是瓶颈；瓶颈在模型配额、成本、长连接并发、检索质量**。

      **二、分阶段演进**

      ```mermaid
      flowchart LR
        A["阶段一 试点百人 单机 Compose 后台任务入库"] --> B["阶段二 全公司 API 多副本 独立 Worker 队列 PgBouncer"]
        B --> C["阶段三 多租户 RLS 按租户配额 LLM 网关 读副本"]
        C --> D["阶段四 大客户独立部署 专用向量库 多区域"]
      ```

      每一步都由**具体的信号**触发：例如入库影响问答延迟 → 拆 Worker；连接数告警 → 加 PgBouncer；租户投诉相互影响 → 按租户配额；检索 P95 超标且优化无效 → 专用向量库。

      **三、故障点与降级**

      | 依赖 | 故障表现 | 降级方案 |
      |---|---|---|
      | 模型厂商 | 超时、429、区域故障 | 网关切换备用模型（需评测过）、提示用户稍后重试 |
      | 重排服务 | 超时 | 跳过重排，用融合分数排序，记录降级标记 |
      | 向量检索 | 不可用 | 退化为关键词检索；都不可用时明确告知「暂时无法检索」，**不让模型无依据作答** |
      | Redis | 不可用 | 限流 fail-open 加本地兜底，预算 fail-closed，缓存直接回源 |
      | MCP 工具服务 | 超时 | 工具返回结构化错误给 Agent，读操作可重试，写操作不自动重试 |
      | Worker | 崩溃 | 消息重投 + 幂等重跑 |

      **四、超时预算：内层必须小于外层**

      例：SSE 总时长 60 秒 → 检索 3 秒、重排 2 秒、模型首字 10 秒、生成总时长 40 秒；Agent 单工具 10 秒、总任务 90 秒。
      **内层超时之和加重试时间要小于外层**，否则外层先超时，内层还在后台跑，既浪费钱又可能产生副作用。
    scenarios: |
      - **从试点到全公司推广**：先把入库从 API 进程拆到独立 Worker，再加副本和 PgBouncer。
      - **厂商区域故障 30 分钟**：网关自动切换到另一个厂商的模型，监控看板显示降级比例。
      - **重排服务抖动**：跳过重排，答案质量略降但服务可用，Trace 中标记降级以便事后评估影响。
    pitfalls: |
      - **按传统 Web 的思路估算**：只算 QPS 和 CPU，忽略 Token 配额和成本。
      - **一上来微服务化**：团队规模和流量都不需要，却多了部署和调试成本。
      - **内层超时大于外层**：外层已经返回错误，内层请求还在继续计费。
      - **检索失败时让模型直接回答**：等于关闭了「有依据才回答」的保护，幻觉风险最高。
      - **备用模型没评测过**：切换后质量大幅下降，用户以为系统坏了。
    interview_asks:
      - question: "1 万员工的知识库，QPS 大概多少？瓶颈在哪？"
        answer: "先按日活和每人每天几次问来估，通常远远不到 1 万 QPS，更多是几十以内。瓶颈多半在模型并发和长文档入库，不在网页本身。把假设说出来：比如 2000 人每天问 5 次，集中在上班时间。"
      - question: "从 100 人扩到 1 万人，你会按什么顺序改造？"
        answer: "先有限流、缓存、异步入库和观测。然后才是数据库索引、向量索引的内存、模型并发。不要第一步就拆成很多微服务。顺序按当时测到的瓶颈，不按架构图的完整程度。"
      - question: "模型厂商挂了怎么办？向量库挂了怎么办？"
        answer: "模型有备用，或者明确降级成「暂时不能回答」。向量库挂了，问答就失败，不改成让模型凭记忆答企业文档。入库任务排队稍后重试。两种故障都要有告警和你事先写好的降级，而不是临时想。"
    project_example: |
      **p1 部署说明里的「演进路线」一节**：写明当前阶段（单机 Compose）、下一阶段的触发信号（入库影响问答 P95、连接数告警）和改造步骤；超时预算写成配置项，并在压测报告里给出每段的 P95（用你的压测结果填写）。
      面试时可以说：「我没有一开始就上 K8s，而是写了明确的扩容触发条件。」
    freshness: |
      2026-11 核实：本节估算方法基于 Little 定律和通用容量规划思路，数字为示例假设；具体模型价格和配额以厂商当前页面为准。
    sources:
      - title: "system-design-primer README-zh-Hans 粗略计算"
        url: "https://github.com/donnemartin/system-design-primer/blob/master/README-zh-Hans.md"

test:
  - id: d48-t1
    kp: d48-k1
    type: single
    question: 面试官说：「请设计一个企业知识库问答系统。」你最合适的第一步是：
    options:
      - "先确认用户、规模、文档类型、权限要求、质量与延迟目标，再复述假设"
      - "直接画出完整架构图，展示你对各组件的熟悉程度"
      - "先比较 pgvector、Milvus、Qdrant 的优缺点"
      - "先说明你会用 LangGraph 实现多 Agent 协作"
    answer: [0]
    explain: |
      开放题的需求是模糊的，不同规模、权限和质量要求会导出完全不同的架构。先澄清并复述假设，后面的每个选择才有依据，也给面试官调整方向的机会。直接画图或比较选型，都是在没有约束的情况下做决定。
  - id: d48-t2
    kp: d48-k1
    type: multi
    question: 相比传统系统设计题，AI 系统设计题**需要额外讲清楚**哪些内容？
    options:
      - "质量怎么评测，例如检索召回率、答案正确率、引用正确率"
      - "单次请求的 Token 与成本估算及控制手段"
      - "提示注入、工具越权等模型相关的安全风险"
      - "答不出时的拒答或转人工策略"
      - "前端框架选 Vue 还是 React"
    answer: [0, 1, 2, 3]
    explain: |
      AI 系统的输出是概率性的，所以必须讲评测和拒答；成本按 Token 线性增长，规模化前必须估算；模型可以被注入、会提议越权操作，安全要单独设计。前端框架选型与系统设计的核心问题无关。
  - id: d48-t3
    kp: d48-k1
    type: judge
    question: 系统设计面试中，架构图里出现的组件和技术名词越多，越能体现候选人的能力。
    answer: false
    explain: |
      面试官考察的是取舍能力：每个组件为什么需要、去掉会怎样、代价是什么。堆砌组件却说不清理由，反而暴露缺乏实际经验，也会引来大量你答不上的追问。合适的做法是从最简单可行的架构出发，按约束逐步加组件。
  - id: d48-t4
    kp: d48-k1
    type: single
    question: 设计企业知识库问答时，面试官问：「为什么问答部分不用自主 Agent，而是固定流程？」最合理的回答是：
    options:
      - "Agent 技术还不成熟，生产环境不能使用"
      - "问答步骤基本固定，workflow 更快、更省、更可控；步骤无法预先确定时再用 Agent"
      - "固定流程的回答质量一定比 Agent 高"
      - "LangGraph 只能实现 Agent，不能实现固定流程"
    answer: [1]
    explain: |
      Anthropic 的建议是先用最简单的方案：步骤可以预先确定的任务用 workflow，Agent 用更高的延迟和成本换灵活性。Agent 在生产中已被广泛使用，固定流程也不是「一定」质量更高，LangGraph 同样可以编排固定流程。
  - id: d48-t5
    kp: d48-k1
    type: single
    question: 下面哪种表述**最符合**系统设计中「讲取舍」的要求？
    options:
      - "我们用 pgvector，因为它是现在最流行的方案"
      - "pgvector 和 Milvus 各有优缺点，看具体情况选择"
      - "用 Milvus，因为它性能最好，以后不用迁移"
      - "先用 pgvector，因数据千万级内且要与权限同库；超标时再迁专用库"
    answer: [3]
    explain: |
      好的取舍表达包含：选择、依据的约束、代价或风险、切换条件。「流行」不是理由；「各有优缺点」等于没回答；「性能最好」忽略了运维成本和与业务数据一致性的需求。
  - id: d48-t6
    kp: d48-k2
    type: single
    question: 有人提议简化架构：去掉任务队列和 Worker，文档上传后直接在 API 进程里同步完成解析、切片和向量化。最主要的问题是：
    options:
      - "API 进程不能调用 Embedding 接口"
      - "向量化结果无法写入 pgvector"
      - "慢任务占用在线服务资源，上传高峰拖慢问答，失败也难以重试"
      - "文档无法存入对象存储"
    answer: [2]
    explain: |
      解析和向量化可能需要几分钟，放在 API 进程里会占用 worker 和连接，高峰期直接影响在线问答的延迟；请求中断或进程重启时任务就丢了，没有重试和进度。队列加 Worker 实现了快慢分离和可靠重试。其他选项在技术上都可以做到。
  - id: d48-t7
    kp: d48-k2
    type: single
    question: 企业知识库起步时选择 PostgreSQL + pgvector，而不是独立的专用向量数据库，最有力的理由是：
    options:
      - "向量与业务数据、权限同库，过滤、RLS 和删除都能在一个事务里保证一致"
      - "pgvector 在任何规模下的检索性能都优于专用向量库"
      - "专用向量库不支持元数据过滤"
      - "pgvector 不需要建立任何索引"
    answer: [0]
    explain: |
      起步阶段最大的风险是一致性和权限：删除文档、撤销共享时，向量和权限分在两个系统里很难同步。同库方案能用一条 SQL 带权限过滤检索、用 RLS 兜底、用事务删除。pgvector 并非在任何规模下都更快，专用向量库也普遍支持元数据过滤，pgvector 同样需要 HNSW 等索引。
  - id: d48-t8
    kp: d48-k2
    type: multi
    question: 下列哪些做法**符合**参考架构的三条设计原则（计算无状态、快慢分离、权限在模型之外）？
    options:
      - "Agent 的会话状态由 Checkpointer 存入 PostgreSQL"
      - "批量入库走队列，问答走同步加流式"
      - "工具服务按调用者的用户身份再做一次授权"
      - "在系统提示里要求模型只回答用户有权限的内容，作为主要权限控制"
      - "为了提速，把对话历史缓存在 API 进程的内存字典里"
    answer: [0, 1, 2]
    explain: |
      状态放进数据库、慢任务进队列、工具按用户身份授权，分别对应三条原则。靠系统提示做权限控制，一次提示注入就能绕过；进程内存存历史违反无状态原则，多副本和发布时都会丢上下文。
  - id: d48-t9
    kp: d48-k2
    type: judge
    question: MCP 解决的是工具接入方式的标准化，它本身不会替你判断某个用户能否调用某个工具或操作某条数据。
    answer: true
    explain: |
      MCP 定义了 Host、Client、Server 之间如何发现和调用工具，以及 HTTP 传输下的授权流程（如校验 token 受众）。但「这个用户能不能关闭这张工单」这类业务授权，仍要在 MCP server 内部按用户身份和资源归属判断。
  - id: d48-t10
    kp: d48-k3
    type: single
    question: 入库 Worker 处理到向量化阶段时被 K8s 驱逐，消息被重新投递给另一个 Worker。为了不产生重复切片，最关键的设计是：
    options:
      - "Worker 启动时检查是否有别的 Worker 在运行，有就退出"
      - "以文档 ID 加版本为单位幂等写入，重跑时先清理该版本已有切片或用唯一键 upsert"
      - "把消息队列改成「最多投递一次」，避免重投"
      - "向量化完成后再统一给切片分配 ID"
    answer: [1]
    explain: |
      消息队列通常是「至少一次」投递，重复是常态，所以处理逻辑必须幂等：同一个文档版本无论处理几次，结果都一样。改成最多一次会导致任务丢失；检查别的 Worker 无法解决重投；最后再分配 ID 也不能阻止重复写入。
  - id: d48-t11
    kp: d48-k3
    type: single
    question: 法务更新了一份 300 页的合同，新版本入库需要 10 分钟。在这 10 分钟里，员工提问应该看到什么？
    options:
      - "什么都看不到，入库期间暂停该文档的检索"
      - "新旧内容混合，已处理完的新切片和未处理的旧切片都能被检索"
      - "只能看到已处理完的新切片"
      - "仍然检索旧版本，新版本全部就绪后在事务中原子切换"
    answer: [3]
    explain: |
      检索只查 active_version 指向的版本，新版本完全写完后在一个事务里切换，旧版本延迟清理。这样更新期间用户既不会查不到，也不会看到半新半旧的内容。新旧混合会导致前后矛盾的引用。
  - id: d48-t12
    kp: d48-k3
    type: multi
    question: 下面的 Agent 对话接口存在哪些问题？
    code: |
      @app.post("/agent/threads/{thread_id}/messages")
      async def agent_chat(thread_id: str, body: ChatIn, user=Depends(get_current_user)):
          lock_key = f"lock:thread:{thread_id}"
          await redis.set(lock_key, "1", nx=True, ex=30)
          try:
              config = {"configurable": {"thread_id": thread_id}}
              return await graph.ainvoke({"messages": [("user", body.text)]}, config)
          finally:
              await redis.delete(lock_key)
    options:
      - "没有校验 thread_id 属于当前用户，可以读写别人的会话"
      - "没有检查 set 的返回值，拿不到锁也会继续执行"
      - "finally 中无条件删除锁，任务超过 30 秒后可能删掉别人刚拿到的锁"
      - "路由应该写成普通 def，async def 不能调用 graph.ainvoke"
      - "Checkpointer 模式下不能在 config 里传 thread_id"
    answer: [0, 1, 2]
    explain: |
      thread_id 来自 URL，没有归属校验就是 BOLA；set 的 NX 结果没检查，锁形同虚设；锁的 TTL 只有 30 秒，任务超时后锁已过期被别人拿到，finally 又把它删了。应该比对 token 后再删除，并加上总超时和最大步数。async def 调用 ainvoke 正是正确用法，thread_id 也正是通过 config 传给 Checkpointer 的。
  - id: d48-t13
    kp: d48-k3
    type: judge
    question: Agent 执行到派单前需要人工审批时，最可靠的做法是让这个 HTTP 请求保持连接、一直等到审批完成再返回。
    answer: false
    explain: |
      审批可能要几小时甚至第二天，长时间挂起的连接会被网关或客户端超时断开，进程重启时状态也会丢失。正确做法是在派单前 interrupt，由 Checkpointer 把状态写入数据库，请求立即结束；审批后用同一个 thread_id 恢复执行。
  - id: d48-t14
    kp: d48-k3
    type: single
    question: 问答流程中，重排后所有片段的相关性分数都低于阈值。系统最合理的处理是：
    options:
      - "让模型根据自身知识直接回答，保证用户总能得到答案"
      - "把 TopK 从 5 扩大到 100，总能找到相关的"
      - "拒答或请用户澄清，并把问题记入待补充知识清单"
      - "直接返回分数最高的片段原文"
    answer: [2]
    explain: |
      相关性不足时硬答是幻觉的主要来源，企业场景下一个看似权威的错误答案代价很高。拒答或澄清，同时记录问题，用于补充文档或改进检索。盲目扩大 TopK 会引入大量噪声；返回不相关的原文同样没有回答问题。
  - id: d48-t15
    kp: d48-k4
    type: single
    question: 某公司 1 万员工，假设日活 20%、人均每天提问 10 次、平均每次 8 秒。根据估算，下列结论最合理的是：
    options:
      - "QPS 很高，需要立即拆分微服务并上消息中间件集群"
      - "CPU 是首要瓶颈，需要大量增加 API 副本"
      - "向量数据量太大，必须一开始就使用分布式向量库"
      - "QPS 不高，首要约束是模型配额、成本和长连接并发"
    answer: [3]
    explain: |
      每天约 2 万次提问，工作时间平均不到 1 QPS，高峰也只有几 QPS，在途约几十个流。真正要关注的是 Token 消耗带来的成本和厂商配额，以及流式长连接。照搬传统 Web 的高并发思路会过度设计。
  - id: d48-t16
    kp: d48-k4
    type: single
    question: 某接口配置：SSE 总超时 60 秒，内部调用模型的超时 120 秒并自动重试 2 次。这样配置的主要问题是：
    options:
      - "SSE 协议本身不支持保持超过 30 秒的长连接"
      - "内层超时大于外层，外层报错后内层仍在后台计费"
      - "重试 2 次太少，应该增加到 5 次以提高成功率"
      - "模型超时应设为无限，避免长回答被中途截断"
    answer: [1]
    explain: |
      超时预算要求内层超时（含重试）之和小于外层。否则用户已经看到错误，后台的模型调用还在继续消耗 Token；如果是 Agent 工具调用，还可能在用户以为失败后执行了操作。SSE 可以支持长连接；增加重试或无限超时只会让问题更严重。
  - id: d48-t17
    kp: d48-k4
    type: judge
    question: 知识库系统从 100 人试点扩展到 1 万人时，第一步应该是把系统拆分成微服务。
    answer: false
    explain: |
      扩展要由具体信号驱动。通常先做的是把入库拆到独立 Worker、API 多副本、加连接池代理、按租户限额，这些在单体服务内就能完成。微服务带来部署、调试、分布式事务的额外成本，在没有对应瓶颈时属于过度设计。
  - id: d48-t18
    kp: d48-k4
    type: multi
    question: 下列哪些降级方案是**合理**的？
    options:
      - "重排服务超时时跳过重排，用融合分数排序并标记降级"
      - "主模型故障时切换到已评测过的备用模型"
      - "向量检索不可用时退化为关键词检索，都不可用时告知用户暂时无法检索"
      - "所有检索都失败时，让模型凭训练知识直接回答"
      - "MCP 写操作工具超时后，Agent 自动重试直到成功"
    answer: [0, 1, 2]
    explain: |
      跳过重排、切换已评测的备用模型、退化到关键词检索，都在可接受的质量损失内保持服务可用。检索全部失败时让模型直接回答，会产生没有依据的答案；写操作超时后不知道是否已经执行，自动重试可能重复派单，应返回结构化错误并依赖幂等键或人工确认。

exam:
  - id: d48-e1
    kp: d48-k1
    type: single
    question: 你正在讲知识库设计，面试官插话：「假设只有 3 个人、2 周时间上线第一版。」你最合适的调整是：
    options:
      - "保持原设计不变，并向面试官说明这是长期正确的架构"
      - "所有组件换成云厂商托管服务，整体架构保持不变"
      - "收敛为单租户、固定流程的 MVP，并说明后续演进条件"
      - "放弃检索，把全部文档直接塞进长上下文模型里回答"
    answer: [2]
    explain: |
      面试官在考你能否根据约束调整范围。MVP 保留最核心的能力（入库、检索、带引用回答、权限），去掉多租户、多 Agent 等暂时不需要的复杂度，并说明何时演进。坚持原设计忽略了约束；全换托管服务不解决复杂度问题；全文塞进上下文在文档量大时成本和质量都不可控。
  - id: d48-e2
    kp: d48-k2
    type: single
    question: 设计园区运营 Agent 时，面试官问：「为什么你只用一个 Agent，而不是设计成多个 Agent 协作？」较好的回答是：
    options:
      - "单 Agent 已够用，多 Agent 更慢更贵难调试，需隔离上下文时再拆"
      - "多 Agent 是已经过时的架构，现在业界基本没人再用了"
      - "因为 LangGraph 框架本身不支持多个 Agent 之间协作"
      - "多 Agent 在任何任务上的效果都一定比单 Agent 差"
    answer: [0]
    explain: |
      多 Agent 的价值在于上下文隔离和分工（例如 Text2SQL 子 Agent 只看数据库 schema），代价是更多的模型调用、更长的延迟和更难的调试。用具体条件说明何时拆分，体现的是取舍能力。其他选项都是绝对化或错误的说法。
  - id: d48-e3
    kp: d48-k3
    type: single
    question: 用户在 Agent 生成长报告的过程中刷新了页面。为了让用户能继续看到结果而不是重新开始，较好的设计是：
    options:
      - "前端在 beforeunload 时阻止用户刷新"
      - "生成任务与 HTTP 连接解耦，结果写入存储，客户端重连后按事件 ID 续传"
      - "把 SSE 改成 WebSocket，刷新后连接不会断"
      - "刷新后让用户重新提问一次"
    answer: [1]
    explain: |
      长任务应在后台执行，进度和结果持续写入数据库或 Redis Stream，客户端重连时带上最后收到的事件 ID 续传。阻止刷新体验很差也拦不住关闭浏览器；WebSocket 刷新页面同样会断开；重新提问浪费成本，Agent 还可能重复执行操作。
  - id: d48-e4
    kp: d48-k4
    type: single
    question: 平台唯一使用的模型厂商发生区域故障，持续约 30 分钟。下列准备中最有价值的是：
    options:
      - "故障期间由工程师手动修改模型配置并重新发布"
      - "给模型调用加更多重试次数，耐心等待厂商恢复"
      - "故障期间关闭整个 AI 平台，避免产生错误回答"
      - "网关预配已评测的备用模型，按错误率自动切换"
    answer: [3]
    explain: |
      自动切换才能在分钟级恢复服务，备用模型和对应的 prompt 必须事先评测过，否则切换后质量不可控；标记降级便于监控和事后评估。手动发布太慢；增加重试会放大对故障厂商的请求；整体关闭损失过大。
  - id: d48-e5
    kp: d48-k3
    type: multi
    question: 为防止园区 Agent 在恢复或重试时重复派发工单，下列哪些措施是**有效**的？
    options:
      - "派单工具带幂等键，工单服务按幂等键去重"
      - "同一 thread_id 加分布式锁，释放时比对持有者 token"
      - "派单前 interrupt 等待确认，确认后用同一 thread_id 从检查点恢复"
      - "只依靠前端按钮点击后禁用来防重复"
      - "写操作工具超时后返回结构化错误，不自动重试"
    answer: [0, 1, 2, 4]
    explain: |
      幂等键保证副作用只生效一次，线程锁防止同一会话并发执行，检查点让恢复从中断处继续，写操作超时不自动重试避免「不知道是否成功又执行一次」。前端禁用按钮只能防止用户重复点击，挡不住消息重投、进程恢复和重试。
  - id: d48-e6
    kp: d48-k1
    type: multi
    question: 系统设计题的收尾阶段，下列哪些内容**值得**主动讲？
    options:
      - "回顾两三个关键取舍及其切换条件"
      - "上线后要监控的核心指标，如首字 P95、拒答率、引用正确率、单次成本"
      - "分阶段演进路线"
      - "当前设计的主要风险和你的应对计划"
      - "把所有组件名称再完整念一遍"
    answer: [0, 1, 2, 3]
    explain: |
      收尾的目的是让面试官记住你的判断力：关键取舍、可观测指标、演进路线、风险意识都能体现这一点。重复念组件名称没有新信息，还占用时间。
  - id: d48-e7
    kp: d48-k2
    type: judge
    question: 对于步骤固定的知识库问答，使用自主 Agent 一定比固定 workflow 的效果更好。
    answer: false
    explain: |
      Agent 的优势是处理步骤无法预知的任务，代价是更高的延迟、成本和不可预测性。步骤固定的问答用 workflow 更快、更稳定、更容易评测和调试。是否引入 Agent 应由评测结果决定，而不是默认更好。
  - id: d48-e8
    kp: d48-k4
    type: judge
    question: 设置超时时，内层调用的超时（包括重试）之和应小于外层超时，否则外层失败后内层可能还在继续执行。
    answer: true
    explain: |
      这是超时预算的基本原则。如果内层比外层长，用户已看到失败，后台请求仍在计费；如果内层是写操作，还可能在「失败」后实际执行成功，造成状态不一致。
  - id: d48-e9
    kp: d48-k2
    type: case
    question: |
      一家 5000 人的制造企业要建「知识库问答 + 设备运维 Agent」平台，要求：
      - 员工问制度和设备手册，首字 2 秒内，必须给引用，按部门权限过滤；
      - 运维人员可以让 Agent 查设备状态、创建维修工单，创建工单需负责人确认；
      - 团队 4 人，预算有限，第一期 2 个月上线。
      下列方案中最合理的是：
    options:
      - "一开始就做多 Agent 协作，每类文档一个 Agent，由 Supervisor 调度，向量库用分布式集群"
      - "所有文档塞进长上下文模型，不做检索；工单直接由模型调用接口创建"
      - "问答走固定 RAG 流程并带 ACL 过滤；运维用单 Agent 加 MCP 工具，建单前审批；PG 加 pgvector"
      - "只做问答，运维 Agent 等到第二期；问答直接复用公开聊天机器人"
    answer: [2]
    explain: |
      该方案按任务性质区分了 workflow 和 Agent，满足首字、引用、权限、审批等要求，pgvector 和单 Agent 符合 4 人 2 个月的约束，也为后续扩展留下空间。
      多 Agent 和分布式向量库在这个规模下属于过度设计；长上下文方案成本高且无法做权限过滤，模型直接建单没有审批；公开聊天机器人无法接入内部文档和权限，也不满足需求。

interview:
  - id: d48-i1
    kp: d48-k1
    type: design
    difficulty: 3
    question: 请用 40 分钟设计一个面向 1 万名员工的「企业知识库问答 + 业务 Agent」平台：员工能问制度、手册，也能让 Agent 帮忙查工单、提交报修。请按你的答题框架完整讲一遍。
    key_points:
      - {text: "先澄清并复述假设：用户规模、文档量、权限粒度、首字和质量目标、哪些动作需要审批", dim: concept}
      - {text: "给出估算：QPS 不高，瓶颈在模型配额、成本和长连接并发", dim: principle}
      - {text: "高层架构：网关鉴权、无状态 API、队列 Worker、PG 加 pgvector、Redis、Agent 运行时、MCP、LLM 网关、可观测性，并说明问答用 workflow、业务用 Agent", dim: principle}
      - {text: "深挖：入库状态机与版本切换、检索阶段 ACL 过滤与拒答、Agent 检查点与审批与幂等", dim: engineering}
      - {text: "补齐评测、安全、成本、故障降级，并给出演进路线", dim: engineering}
      - {text: "能把每个组件对应到自己的 p1 和 p2 项目模块", dim: project}
    reference: |
      **1. 澄清（复述假设）：** 1 万员工、日活约 20%；文档约 10 万份，PDF 和 Word 为主；按部门和文档权限过滤；首字 2 秒内、回答必须带引用、答不出拒答；Agent 能查工单、提交报修，**提交前需要用户确认**；单租户、私有云部署。

      **2. 估算：** 每天约 2 万次提问，高峰几 QPS，在途几十个流；每天数千万输入 token，**成本和配额是首要约束**；约 500 万个切片，pgvector 可承载。

      **3. 高层架构：** 网关 + OIDC → FastAPI 无状态多副本 → Redis（限流、缓存、锁）、PostgreSQL + pgvector（业务、权限、向量、检查点）、队列 + 入库 Worker、对象存储；LangGraph Agent 运行时通过 MCP 调工单系统；所有模型调用走 LLM 网关；Trace、指标、审计。
      **问答用固定 workflow，业务操作用 Agent**，因为前者步骤固定，后者需要按情况选择工具。

      **4. 深挖：**
      - **入库**：上传 → 解析 → 切片 → 向量化 → 就绪的状态机，`(doc_id, version)` 幂等，新版本就绪后原子切换；
      - **问答**：改写（小模型）→ 混合检索（检索阶段带 ACL 过滤）→ 重排 → 低于阈值拒答 → 先推送引用 → 流式生成 → 校验引用；
      - **Agent**：校验 thread 归属、线程锁、检查点、提交报修前 interrupt、工具带幂等键、最大步数和总超时。

      **5. 扩展与故障：** 模型故障切换备用模型；重排超时跳过；检索失败不让模型硬答；超时预算内层小于外层；演进路线：试点单机 → 独立 Worker 与多副本 → 多租户与按租户配额。

      **6. 评测、安全、成本：** 评测集覆盖检索 Recall@K、答案正确率、引用正确率、Agent 任务完成率，CI 门禁；权限在模型之外、工具最小权限、审批与审计；Token 估算、缓存前缀、小模型改写、预算告警。

      **收尾：** 关键取舍是 pgvector 起步与 workflow 优先，切换条件分别是检索性能超标和任务步骤无法预定。
    oral: |
      我会先花几分钟确认规模、权限和质量目标，然后复述假设：1 万员工、10 万份文档、按部门权限、首字 2 秒、必须引用、提交报修前要确认。
      估算下来高峰只有几 QPS，真正的约束是模型配额和成本。架构上是网关鉴权、无状态 API、队列加 Worker 入库、PostgreSQL 加 pgvector、Redis、Agent 运行时、MCP 工具和 LLM 网关。问答步骤固定，所以用 workflow；查工单、报修要按情况选工具，所以用 Agent。
      深挖我会讲三条流：入库状态机和版本原子切换，问答在检索阶段做权限过滤、相关性不够就拒答，Agent 用检查点加审批加幂等键防止重复报修。这三块分别对应我知识库项目的入库模块和园区 Agent 项目的审批模块。最后补上评测集、成本估算和故障降级。
  - id: d48-i2
    kp: d48-k3
    type: scenario
    difficulty: 3
    question: 面试官追问：「一份 200 页的扫描版 PDF 上传后，到员工能检索到它，中间发生了什么？如果处理到一半 Worker 挂了怎么办？如果这份文档是对旧版本的更新，处理期间员工提问会看到什么？」
    key_points:
      - {text: "上传只写对象存储和记录并投递任务，接口立即返回，前端看进度", dim: engineering}
      - {text: "状态机：解析含 OCR、切片、向量化、就绪，每步状态和失败原因落库", dim: principle}
      - {text: "Worker 崩溃：消息至少一次投递导致重投，按文档加版本幂等写入，重试有上限，失败进入人工处理", dim: principle}
      - {text: "更新：新版本完全就绪后在事务中切换 active_version，期间检索旧版本，旧版本延迟清理并让相关缓存失效", dim: engineering}
      - {text: "结合 p1 项目说明测试方法，例如中途杀 Worker 的用例", dim: project}
    reference: |
      **1. 上传：** API 校验权限、文件类型和大小，原始文件写入对象存储（路径带租户），创建 `documents` 记录（状态 uploaded，版本号 +1），投递入库任务，**立即返回**。前端轮询或订阅进度。

      **2. Worker 处理（状态机）：**
      - **parsing**：扫描件走 OCR，提取文字和页码，记录解析质量（例如低置信度页的比例）；
      - **chunking**：按标题结构切片，保留页码、章节、权限、版本等元数据；
      - **embedding**：批量调用 Embedding（命中缓存的跳过），写入 pgvector；
      - **ready**：在一个事务里把 `active_version` 切到新版本。
      每一步更新状态，失败记录原因。

      **3. Worker 中途崩溃：**
      - 队列是「至少一次」投递，消息会被重新投给别的 Worker；
      - 写入按 `(doc_id, version)` 幂等：重跑前清理该版本已有切片，或用唯一键 upsert；
      - 重试有上限，超过后标记 failed，进入人工处理队列（比如加密 PDF、严重模糊的扫描件）。

      **4. 更新期间的检索：**
      - 检索条件只查 `active_version`，所以处理期间员工看到的是**旧版本**，不会看到半新半旧的内容；
      - 切换后旧版本延迟清理；相关的检索和答案缓存因知识库版本号变化而失效。

      **5. 验证：** 有一组测试在 embedding 阶段杀掉 Worker，断言重跑后切片数量与一次成功时相同、检索结果不重复。
    oral: |
      上传接口只做三件事：存对象存储、建文档记录、投递任务，然后立刻返回，前端看进度。
      Worker 按状态机处理：解析，扫描件要走 OCR；切片时保留页码和权限元数据；向量化写进 pgvector；最后在事务里切换活跃版本。Worker 挂了的话，队列会重投，所以写入按文档加版本幂等，重跑前清掉这个版本已有的切片，重试超过上限就进人工处理。更新期间检索只查活跃版本，员工看到的是旧版，切换后旧版延迟清理、缓存跟着版本号失效。
      在知识库项目里，我专门写了一个在向量化阶段杀掉 Worker 的测试，验证重跑后切片数和一次成功时完全一致。
  - id: d48-i3
    kp: d48-k4
    type: design
    difficulty: 4
    question: 平台目前是一个部门 100 人试点：单机 Docker Compose，入库在 API 的后台任务里做。现在要推广到集团 1 万人、8 个子公司（数据要相互隔离），并新增设备运维 Agent。请给出分阶段的演进方案，并指出你认为最可能出故障的三个点和对策。
    key_points:
      - {text: "按信号驱动分阶段：先拆 Worker 与多副本和连接池，再做多租户隔离与按租户配额，最后才考虑独立部署和专用向量库", dim: principle}
      - {text: "多租户：子公司为租户，RLS 加事务级租户上下文，缓存、向量、队列、配额带租户，大子公司可独立", dim: engineering}
      - {text: "Agent 上线：单 Agent 加 MCP、写操作审批、幂等键、检查点、最大步数与超时", dim: engineering}
      - {text: "三个故障点及对策：模型配额与厂商故障、入库高峰拖慢问答、Agent 重复或越权执行", dim: engineering}
      - {text: "说明每一步怎么验证：压测、双租户回归、评测门禁、降级演练", dim: concept}
      - {text: "结合 p1 和 p2 的部署与演进文档说明", dim: project}
    reference: |
      **结论：** 按「先解决眼前瓶颈、再加隔离、最后才拆部署」的顺序演进，每一步都有触发信号和验证方式。

      **阶段一：撑住全集团的流量（约 1 个月）**
      - 入库从 API 后台任务拆到独立 Worker 和队列，API 多副本无状态化（会话、检查点都在 PostgreSQL）；
      - 加 PgBouncer，核对「副本 × worker × 池大小」；
      - 所有模型调用收敛到 LLM 网关：统一计量、限额、备用模型；
      - 验证：用真实问题分布压测，看首字 P95 和错误率。

      **阶段二：8 个子公司隔离**
      - 子公司作为租户，业务表和向量表开启 RLS，应用用普通角色、事务级设置租户；
      - 缓存 key、对象存储路径、队列消息、网关配额都带租户；入库队列按租户公平调度；
      - 有强合规要求的子公司可以独立库；
      - 验证：双租户越权回归测试进 CI。

      **阶段三：上线设备运维 Agent**
      - 单 Agent + 设备和工单 MCP 工具，工具按用户身份授权；
      - 写操作前审批，工具带幂等键，检查点持久化，最大步数和总超时；
      - 验证：任务评测集（完成率、工具调用正确率）、注入测试用例。

      **最可能出故障的三个点：**
      1. **模型配额与厂商故障**：推广后 Token 用量成倍增长，触发 TPM 限制或厂商故障。对策：按租户配额、缓存前缀、小模型分流、已评测的备用模型自动切换。
      2. **入库高峰拖慢问答**：推广初期各子公司集中上传历史文档。对策：入库走独立队列和独立 Embedding 配额、按租户限速、夜间批量处理。
      3. **Agent 重复执行或越权**：恢复和重试导致重复派单，或被告警文本中的注入内容带偏。对策：幂等键、线程锁、审批、工具二次授权、审计。

      **演练：** 上线前做一次降级演练：关掉重排、切换备用模型、断开 Redis，观察系统表现是否符合预期。
    oral: |
      我会按三个阶段推进，每个阶段都有触发信号和验证。
      第一阶段先撑住流量：入库拆到独立 Worker，API 多副本无状态，加 PgBouncer，模型调用全部收敛到 LLM 网关，用真实问题分布压测。第二阶段做子公司隔离：子公司就是租户，开 RLS、事务级设置租户，缓存、向量、队列、配额都带租户，双租户越权测试进 CI。第三阶段上运维 Agent：单 Agent 加 MCP 工具，写操作审批、幂等键、检查点。
      我认为最容易出事的三个点是：模型配额和厂商故障，靠按租户配额和自动切换备用模型；推广初期集中上传拖慢问答，靠独立入库队列和按租户限速；Agent 重复派单或被注入带偏，靠幂等键、审批和工具二次授权。这些在我的知识库和园区 Agent 项目文档里都写成了演进路线和降级演练清单。
