knowledge_points:
  - id: d21-k1
    name: 为什么需要 RAG
    level: P0
    summary: 模型不知道你的私有数据和最新变化；RAG 先查资料，再把相关证据交给模型回答，把闭卷考试变成开卷考试
    analogy: |
      像你写代码时**查 MDN 而不是背 API**：遇到不熟的接口，先搜文档找到那一段，再照着写。RAG 里「搜文档」是检索，「照着写」是生成。
      **不一样的地方**：你搜 MDN 时自己会判断「这段讲的是不是我要的」；RAG 的检索是按**向量相似度**挑的（见 Day 18），相似不等于正确，系统不会自己判断，所以后面几天都在补这个判断能力。
    why: |
      企业 AI 项目里最常见的需求是「**基于公司内部资料回答问题**」：制度问答、客服知识库、售前方案助手、运维手册助手，几乎都用 RAG 实现。
      面试里「为什么要 RAG」「百万上下文还要不要 RAG」是 RAG 方向的**第一道必考题**，也是你实践项目 p1 的立项理由。
    problem: |
      大模型参数里的知识有四个硬伤：**有截止日期、没有你的私有数据、不知道也会编、给不出出处**。
      最朴素的补救是「把文档全塞进 Prompt」，但企业资料动辄上千万 Token，还要管权限、版本、成本和延迟。
      RAG 解决的就是：**每次只把和问题相关的少量证据，在回答前交给模型**。
    principle: |
      **一、模型自身知识的四个缺陷**

      - **时效性**：模型知识停在训练截止日期，上个月改的报销制度它不知道。
      - **私有性**：公司内部文档从没进过训练数据，模型不可能「记得」。
      - **幻觉**：模型本质是在做「文字接龙」（见 Day 11），不知道时也会接出一段**语气很自信**的话。
      - **不可溯源**：模型说不出「这句话出自哪份文件第几页」，法务、财务场景无法接受。

      **二、为什么不能把所有文档都塞进 Prompt**

      1. **装不下**：中型企业的制度、手册、工单、合同加起来远超任何上下文窗口，而且每天在涨。
      2. **贵且慢**：按输入 Token 计费，每问一次都为全部文档付费；输入越长，首字延迟越高（见 Day 12、Day 19）。
      3. **装得下不等于用得好**：输入越长，模型越容易忽略中间内容、被无关段落干扰（lost in the middle，见 Day 13）。
      4. **权限失控**：全塞进去，普通员工也能把薪酬制度「问出来」。
      5. **版本冲突**：新旧两版制度同时在上下文里，模型可能混用。

      **三、RAG 的核心思想：闭卷变开卷**

      RAG = Retrieval-Augmented Generation，检索增强生成：

      - **Retrieval 检索**：根据问题，从知识库里找出最相关的几段（通常 3~10 段）。
      - **Augmented 增强**：把这些段落和问题一起拼进 Prompt，作为**证据**。
      - **Generation 生成**：要求模型**只依据证据**回答、标注出处，证据不足就说不知道。

      ```mermaid
      flowchart LR
        subgraph 闭卷
          Q1["用户问题"] --> M1["LLM 凭参数记忆回答"] --> A1["可能过时或编造 没有出处"]
        end
        subgraph 开卷
          Q2["用户问题"] --> R["检索知识库 Top-K"] --> P["问题加证据拼成 Prompt"] --> M2["LLM 依据证据回答"] --> A2["带引用的答案"]
        end
      ```

      **四、RAG 带来的工程收益**

      - **知识更新 = 更新知识库**：制度改了，重新入库即可，不用重训模型。
      - **可溯源**：每个答案附「来源文件 + 页码」，用户能点开核对。
      - **权限可控**：检索时按用户身份过滤，模型**根本看不到**无权限资料（Day 30 展开）。
      - **成本可控**：每次只输入几千 Token 的证据，而不是整个知识库。

      **五、RAG 不是万能的**

      - **检索不到就答不出**：RAG 的上限由检索决定，Day 22~26 都在解决「怎么检索得更准」。
      - **相似不等于正确**：向量相似只说明「话题接近」，不保证段落里有答案、版本有效（见 Day 18）。
      - **不适合全局统计**：「今年一共签了多少份合同」要遍历全部数据，应走 SQL，而不是 Top-K。
      - **不提升推理能力**：证据给对了，模型仍可能读错、算错，要靠生成约束和评测（Day 27、Day 29）。

      一句话：**RAG 用「检索」解决「模型不知道」，用「证据 + 引用」解决「模型乱说」**。
    scenarios: |
      - **企业制度问答**：员工问「试用期能不能请年假」，系统检索人事制度相关条款并附上出处。
      - **客服知识库**：根据产品手册和历史工单回答，知识每周更新也不需要重训模型。
      - **售前 / 投标助手**：从历史方案、产品白皮书里找相似案例和参数。
      - **运维助手**：根据故障手册和 Runbook 给出排查步骤，附上手册链接。
    pitfalls: |
      - **误区：上下文够大就不需要 RAG。** 装得下不等于用得好，成本、延迟、权限、版本问题都没解决。
      - **误区：RAG 能解决所有问答。** 统计、聚合、跨全部数据的问题应走结构化查询。
      - **误区：接上向量库就是 RAG 了。** 没有引用、没有「证据不足就拒答」的约束，模型照样会编。
      - **误区：检索到的段落相似度高，答案就对。** 相似度只代表话题接近。
      - **混淆：RAG 改的是模型的「输入」，微调改的是模型的「参数」。** 两者解决的问题不同（见本日 k3）。
    interview_asks:
      - question: "什么是 RAG？它解决了大模型的哪些问题？"
        answer: "先从资料库找出相关片段，再连同问题一起交给模型回答。它补上模型训练数据里没有的私有知识和新知识，也让回答能指向出处。它不保证模型一定听话，所以还要拒答和校验。"
      - question: "现在上下文窗口已经很大了，为什么还需要 RAG？"
        answer: "整库放进去又慢又贵，长文中间容易被忽略，也没法按用户权限只露出几段。RAG 先选少量相关内容。窗口用来装这几段，不是用来装全部文档。"
      - question: "哪些问题不适合用 RAG 解决？"
        answer: "需要精确计算、实时库存、跨很多文档推理才能拼出的答案，单靠检索几段不够。资料里根本没有的常识问答，检索也帮不上。这类要用工具、数据库查询或直接拒答。"
    project_example: |
      **p1 企业知识库问答**的立项理由就是本知识点：公司有人事、财务、行政制度约 3000 份，最初的想法是把员工手册整本塞进 Prompt。
      评估后发现：每次请求输入超过 10 万 Token，成本高、首字慢；新旧制度混在一起会混用；薪酬类文件所有人都能问出来。
      改为 RAG：文档解析切片入库（Day 22、23），每次只检索 5 段相关条款，回答附「制度名称 + 条款 + 页码」；制度更新只重新入库对应文件；用户答错投诉时，能定位到具体是哪段资料的问题。
      你在简历里描述 p1 时，第一句就可以讲这个「为什么不全塞」的取舍。
  - id: d21-k2
    name: RAG 两条链路：离线入库与在线问答
    level: P0
    summary: 离线链路把文档变成带 metadata 的向量；在线链路把问题变成向量去检索，再让模型依据证据回答
    analogy: |
      很像前端的**构建期和运行时**：离线入库 ≈ `vite build`（打包、切 chunk、生成 manifest），可以慢、可以重跑；在线问答 ≈ 浏览器运行时按路由懒加载，要快、要有兜底。
      两边有「契约」：build 产物的 hash 和 index.html 的引用必须一致。
      **不一样的地方**：前端契约破了会 404，一眼就看到；RAG 的契约破了（比如两边 Embedding 模型不同）**不会报错**，只是检索悄悄变差，必须靠日志和评测发现。
    why: |
      面试官最常说的一句是「**画一下你们 RAG 的架构**」。能把两条链路、每一步的产物和故障点讲清楚，说明你理解系统，而不是只会调用框架。
      后面 Day 22~30 每一天都对应这张图上的一个环节，这张图就是第 3 阶段的**地图**。
    problem: |
      RAG 出问题往往不在 LLM，而在**链路中间某一步**：解析出空文本、切片切断条款、换了 Embedding 模型没重建索引、检索没过滤权限。
      只有把链路拆清楚、每步留下中间产物，出问题时才知道看哪一步的日志。
    principle: |
      **一、为什么拆成两条链路**

      两部分的**触发时机、性能要求、失败处理方式完全不同**：

      - **离线入库（Indexing）**：文档上传或更新时触发，可以慢（分钟级），可以重试，适合放进任务队列（见 Day 09）。
      - **在线问答（Query）**：用户提问时触发，要快（通常要求几秒内出首字），失败要有兜底话术。

      ```mermaid
      flowchart LR
        subgraph 离线入库
          D["原始文档 PDF Word Excel"] --> P1["解析与清洗"] --> C["切片 Chunk"] --> M["补 metadata 来源 页码 权限 版本"] --> E1["Embedding 向量化"] --> V[("向量库 pgvector")]
        end
        subgraph 在线问答
          Q["用户问题"] --> QR["问题改写 可选"] --> E2["问题向量化 同一模型"] --> S["检索 Top-K 加权限过滤"]
          V --> S
          S --> RR["重排 可选"] --> PB["组装 Prompt"] --> L["LLM 生成"] --> A["答案加引用"]
        end
      ```

      **二、离线入库：每步产物与典型故障**

      | 步骤 | 产物 | 典型故障 | 详见 |
      |---|---|---|---|
      | 解析 | 文本 + 结构 | 扫描件无文字、表格拍平、乱码 | Day 22 |
      | 切片 | chunk 列表 | 太大语义稀释、太小断章取义 | Day 23 |
      | metadata | 来源、页码、标题路径、权限、版本 | 缺了就无法引用、无法过滤 | Day 22 |
      | 向量化 | 每个 chunk 一个向量 | 限流、超长截断、模型不一致 | Day 18 |
      | 入库 | 向量 + 原文 + metadata | 索引选错、维度不匹配 | Day 24 |

      **三、在线问答：一次请求的过程**

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant API as 问答服务
        participant EM as Embedding 服务
        participant DB as 向量库
        participant LLM as 大模型
        U->>API: 提问 携带登录身份
        API->>EM: 问题向量化
        EM-->>API: 查询向量
        API->>DB: 检索 Top-K 并按权限过滤
        DB-->>API: 片段 原文 来源 页码 分数
        API->>API: 阈值判断 去重 拼 Prompt
        API->>LLM: 系统指令 证据 问题
        LLM-->>API: 带引用编号的回答
        API-->>U: 流式返回答案和出处
      ```

      **四、两条链路之间的「契约」**

      离线和在线是两套代码，可能由两个服务执行，但必须遵守同一份约定，**否则检索悄悄变差而不报错**：

      - **同一个 Embedding 模型和版本**：查询向量和文档向量必须在同一个向量空间，换模型要**全量重建**。
      - **同一套文本预处理**：全角半角、繁简转换，离线做了在线也要做。
      - **metadata 口径一致**：离线写 `dept_id`，在线就按 `dept_id` 过滤，取值规范统一。
      - **距离度量与索引一致**：用余弦建索引，查询就用余弦运算符（Day 24）。

      **五、用链路视角排查：三步定位**

      回答错了，按顺序问三个问题：

      1. **该找的资料入库了吗？**（去库里按原文关键词搜，看解析、切片对不对）
      2. **入库了，检索到了吗？**（看日志里 Top-K 有没有正确 chunk）
      3. **检索到了，模型用对了吗？**（看 Prompt 和回答是否忠实于证据）

      分别对应**入库问题、检索问题、生成问题**，定位到哪层就改哪层。前提是：**每次请求都记录检索结果和最终 Prompt**。
    scenarios: |
      - **新项目启动**：先画两条链路图，和业务方确认文档来源、更新频率、权限模型，再分别估算离线入库耗时和在线延迟预算。
      - **线上排障**：用户反馈答错，按「入库 → 检索 → 生成」三步定位，日志里有每次请求的 chunk id、分数和 Prompt。
      - **知识更新**：制度改版时只对变化的文件重跑离线链路，并让旧版本 chunk 失效。
    pitfalls: |
      - **只建了在线链路，入库靠手工脚本**：没有重试、没有记录，文档更新后知识库悄悄过期。
      - **离线和在线用了不同的 Embedding 模型**（开发环境 A、生产环境 B），检索几乎随机，但系统不报错。
      - **metadata 只存了文本，没存来源和页码**，上线后无法做引用，只能返工重新入库。
      - **把权限过滤放在 LLM 回答之后**：模型已经看到无权限资料，过滤为时已晚。
      - **入库任务只看「有没有抛异常」判成功**：解析出 0 个 chunk 也显示成功。
    interview_asks:
      - question: "请画一下你们 RAG 系统的架构，离线和在线分别做了什么？"
        answer: "离线：解析、清洗、切片、嵌入、写入向量库和关键词索引。在线：改写问题、检索、重排、组装提示、生成、附上引用。两条链路共用同一套切片和同一套向量模型，否则对不上。"
      - question: "用户说答案错了，你怎么定位是哪个环节的问题？"
        answer: "顺着日志看：文档解析出文字了吗，检索结果里有没有正确片段，重排后它还在不在，提示里有没有，模型有没有照它说。停在第一个断掉的环节修，不要同时改切片、提示和模型。"
      - question: "离线入库和在线问答之间有哪些必须保持一致的约定？"
        answer: "Embedding 模型、维度、距离算法、切片方式和 metadata 字段。任何一边换了，另一边必须一起换。混用两套向量是常见的「突然全部答非所问」。"
    project_example: |
      **p1 企业知识库问答**就是按这两条链路拆模块的：
      - 离线：上传接口只写一条「待解析」任务，后台 Worker 依次跑解析（Day 22 模块）→ 切片入库（Day 23 模块），每步把中间产物（解析文本、chunk 列表）存档，失败可从断点重跑，并记录 chunk 数和空页率。
      - 在线：检索（Day 25 混合检索模块）→ 重排（Day 26）→ 带引用回答（Day 27），每次请求记录「问题、chunk id 与分数、最终 Prompt、回答」。
      - chunk 表上存 `embedding_model` 字段，在线服务启动时校验和配置一致，不一致直接告警。
      以后演示 p1 时，先画这张两条链路图，再讲你在每一步做了哪些防错设计。
  - id: d21-k3
    name: RAG vs 长上下文 vs 微调
    level: P1
    summary: RAG 改输入解决「知道什么」，微调改参数解决「怎么说」，长上下文适合少量文档的一次性分析
    analogy: |
      用前端打个比方：**RAG** ≈ 页面运行时调接口拿数据，数据变了页面自动是新的；**微调** ≈ 改组件源码重新发版，改的是「怎么渲染」；**长上下文直塞** ≈ 把整份 JSON 直接打进 bundle，数据少时最省事，多了 bundle 爆炸。
      **不一样的地方**：前端发版是确定性的，微调后的模型「记住多少事实」是不确定的，还删不掉。
    why: |
      老板和客户经常问「为什么不直接微调一个公司专属模型」「为什么不直接全塞进去」。
      能给出有理有据的选型，是 AI 应用工程师的核心能力，也是面试高频题。
    problem: |
      三种方案都能「让模型用上你的知识」，但成本、更新速度、可溯源性、权限控制差别很大。
      选错代价很高：微调了半个月发现制度一更新又要重训，或者长上下文方案上线后成本失控。
    principle: |
      **一、三种方案各改了什么**

      - **RAG**：不改模型，改的是**每次请求的输入**——在问题前放上检索到的证据。
      - **微调（Fine-tuning）**：用你的数据继续训练，改的是**模型参数**，让模型稳定表现某种行为、风格、格式。
      - **长上下文直塞**：不检索，把整份（或几份）文档直接放进 Prompt。

      **二、对比**

      | 维度 | RAG | 微调 | 长上下文直塞 |
      |---|---|---|---|
      | 擅长 | 大量、常变化的事实 | 固定格式、语气、领域习惯 | 少量文档的整体阅读、对比 |
      | 知识更新 | 重新入库，分钟级 | 重新训练和评估 | 换文档即可 |
      | 可溯源 | 能给出处 | 基本不能 | 能，但定位粗 |
      | 权限控制 | 检索时过滤 | 进了参数无法按人隔离 | 拼接前控制 |
      | 删除知识 | 删 chunk 即可 | 很难「遗忘」 | 不放即可 |

      **三、长上下文的合理边界**

      Anthropic 在 Contextual Retrieval 一文里给过一个务实的建议：**知识库小于约 20 万 Token（约 500 页）时，可以直接整体放进 Prompt**，配合 prompt caching（见 Day 19）降低重复请求的成本和延迟；知识库继续增长时再上检索。
      所以选型不是「RAG 永远对」，而是**看规模、更新频率和治理需求**。

      **四、为什么「用微调灌知识」通常不划算**

      - 微调更擅长改变「怎么回答」，让它准确记住大量具体数字和条款**并不稳定**，仍会幻觉。
      - 知识一变就要重训，企业知识每天都在变。
      - 合规要求删除某份资料时，参数里的知识**无法精确删除**。

      **五、组合才是常态**

      - RAG 提供事实 + 结构化输出（Day 16）约束格式，不够再考虑微调。
      - 微调 Embedding 或重排模型，提升领域检索效果（进阶优化）。
      - 两三份合同对比这种一次性任务，直接用长上下文。

      **选型口诀**：知识多且常变 → RAG；格式、语气要稳 → 结构化输出或微调；文档少且一次性 → 长上下文。
    scenarios: |
      - **客服知识库**：政策每月变化、要给出处，选 RAG。
      - **工单分类输出固定 JSON**：知识不多但格式要稳，先试结构化输出，不够再微调。
      - **法务对比两份合同**：文档少、一次性，直接长上下文。
      - **小团队内部 FAQ 只有几十页**：直接放进 System Prompt 加 prompt caching，比搭 RAG 更快上线。
    pitfalls: |
      - **误区：微调后模型就记住了公司知识，不用 RAG。** 事实记忆不稳定、无法溯源、更新要重训。
      - **误区：RAG 和微调二选一。** 实际项目常组合使用。
      - **误区：长上下文永远更好。** 只适合少量文档；大规模知识库仍需检索。
      - **误区：任何知识库都必须上 RAG。** 很小、很少更新的知识库直接塞可能更划算。
      - **忽视合规**：训练进参数的敏感数据无法按需删除。
    interview_asks:
      - question: "你们为什么用 RAG 而不是微调？"
        answer: "知识会改、要按权限给不同的人看、还要指出处。RAG 更新文档就能生效。微调贵、更新慢，也不能代替检索和权限。要稳定改语气或做分类，才考虑微调。"
      - question: "什么情况下你会建议客户做微调？什么情况下连 RAG 都不用？"
        answer: "微调适合要稳定改变语气、格式或大量重复的分类，而且有干净标注。固定规则、能写代码算的，不用 RAG 也不用模型。文档会变、要引用出处的，用 RAG 而不是微调。"
      - question: "RAG 和长上下文能不能结合使用？"
        answer: "能。检索出的证据如果本身比较长，就靠窗口装下。窗口不是用来替代检索的。先检索，再把选中的内容放进上下文。"
    project_example: |
      在 **p1 企业知识库问答**的方案评审里，你可以这样回答「为什么不微调」：制度每季度改版、回答必须给条款出处、不同部门能看的制度不同，这三条微调都做不到。
      同时说明边界：如果只是某个部门几十页的内部 FAQ，直接放进 System Prompt 并开启 prompt caching 更快上线；p1 面向全公司几千份文档，才需要完整 RAG。
      输出格式（结论 / 依据 / 出处）用 Day 16 的结构化输出约束，而不是微调。
    freshness: |
      核对于 2026-11：Anthropic 官方工程博客《Introducing Contextual Retrieval》（2024-09-19 发布，至今仍是官方页面）给出「知识库小于 200,000 Token（约 500 页）可直接整体放进 Prompt」的建议，并称 prompt caching 可使延迟降低超过 2 倍、成本最多降低 90%。这些数字是 Anthropic 在其模型和场景下的结论，具体以你所用模型的定价和评测为准。
    sources:
      - {title: "Anthropic - Introducing Contextual Retrieval", url: "https://www.anthropic.com/engineering/contextual-retrieval"}
  - id: d21-k4
    name: 手写最小 RAG：不用框架时代码长什么样
    level: P1
    summary: 最小 RAG 就四步——预先算好文档向量、问题向量化、余弦 Top-K、拼 Prompt 生成；框架只是把这四步封装了
    analogy: |
      就像学 axios 之前先用 `fetch` 手写一遍请求、拦截和错误处理，你才知道 axios 拦截器帮你省了什么。
      **不一样的地方**：fetch 写错了会报错；手写 RAG 写错了（比如排序方向反了）**照样能返回答案**，只是答案是用错误证据编的，所以必须打印检索结果看一眼。
    why: |
      本课程的学法是「**先手写最小版本，再学框架**」。手写一遍，你才能看懂 LangChain / LlamaIndex 的 Retriever、VectorStore、PromptTemplate 分别对应哪一步，出问题时也知道往哪查。
      面试官也常追问「不用框架你能实现吗」。
    problem: |
      直接上框架，十几行代码就能跑通 demo，但答错时不知道是加载、切片、检索还是 Prompt 的问题。
      手写最小版本把黑盒拆成四个看得见的步骤，每一步都能打印中间结果。
    principle: |
      **一、最小 RAG 的四步**

      ```mermaid
      flowchart TD
        A["离线 文档列表"] --> B["批量 Embedding 得到矩阵 D"]
        Q["在线 用户问题"] --> E["问题 Embedding 得到向量 q"]
        B --> S["余弦相似度 D 点乘 q"]
        E --> S
        S --> K["按分数降序取 Top-K"]
        K --> P["拼 Prompt 编号证据加规则"]
        P --> L["调用 LLM 生成带引用的回答"]
      ```

      1. **离线算好文档向量**：入库时算一次，存起来；不要每次提问都重算。
      2. **问题向量化**：必须用**同一个** Embedding 模型。
      3. **余弦 Top-K**：向量归一化后点乘就是余弦相似度（见 Day 18），按分数**降序**取前 K 个。
      4. **拼 Prompt 生成**：证据编号 + 规则（只依据资料、标注 [编号]、资料不足就说不知道）。

      **二、这个最小版本缺什么（后面几天补齐）**

      - 没有解析和切片：只能处理已经是纯文本的短段落（Day 22、23）。
      - 向量放内存、全量暴力计算：几万条以上要用向量数据库和 ANN 索引（Day 24）。
      - 只有向量检索：编号、型号类问题会漏（Day 25 混合检索）。
      - 没有阈值：无关问题也会硬塞 K 条证据（Day 25、27）。
      - 没有权限过滤、没有日志和评测（Day 29、30）。

      **三、框架帮你做了什么**

      | 手写步骤 | LangChain / LlamaIndex 里的对应概念 |
      |---|---|
      | 读文件、切片 | Document Loader、Text Splitter / Node Parser |
      | 算向量、存向量 | Embeddings、VectorStore |
      | Top-K 检索 | Retriever |
      | 拼 Prompt、调模型 | PromptTemplate、Chat Model |

      框架**不会**替你判断切片参数合不合适、阈值设多少、答案有没有幻觉，这些仍要靠评测（Day 29）。
    scenarios: |
      - **POC 第一天**：用最小 RAG 和 20 个真实问题跑一遍，先确认「检索能不能找到正确段落」，再决定要不要上更复杂的组件。
      - **排查框架黑盒**：框架版答错时，用手写版对同一问题打印 Top-K，对比是哪一步不同。
      - **面试手写题**：白板写出四步伪代码，并说出每步的生产化改进点。
    code: |
      ```python
      # 依赖：uv add openai numpy
      # 使用 OpenAI 兼容接口（DeepSeek、通义等同样适用，见 Day 14），模型名从环境变量读取
      import os

      import numpy as np
      from openai import OpenAI

      client = OpenAI(api_key=os.environ["LLM_API_KEY"], base_url=os.environ.get("LLM_BASE_URL"))
      EMBED_MODEL = os.environ["EMBED_MODEL"]
      CHAT_MODEL = os.environ["CHAT_MODEL"]


      def embed(texts: list[str]) -> np.ndarray:
          resp = client.embeddings.create(model=EMBED_MODEL, input=texts)
          vecs = np.array([d.embedding for d in resp.data], dtype=np.float32)
          return vecs / np.linalg.norm(vecs, axis=1, keepdims=True)   # 归一化后点乘即余弦


      docs = ["试用期员工不享受年假。", "年假天数按工龄计算，满 1 年不满 10 年为 5 天。", "差旅住宿标准按城市分级。"]
      doc_vecs = embed(docs)                       # 离线：只算一次


      def answer(question: str, k: int = 2) -> str:
          q = embed([question])[0]
          scores = doc_vecs @ q
          top = np.argsort(-scores)[:k]            # 降序取前 k 个
          context = "\n".join(f"[{i + 1}] {docs[j]}" for i, j in enumerate(top))
          resp = client.chat.completions.create(
              model=CHAT_MODEL,
              messages=[
                  {"role": "system", "content": "只依据资料回答并用 [编号] 标注引用；资料没有答案就回答：知识库中没有找到相关规定。"},
                  {"role": "user", "content": f"资料：\n{context}\n\n问题：{question}"},
              ],
          )
          return resp.choices[0].message.content
      ```
    pitfalls: |
      - **排序方向写反**：`np.argsort(scores)` 默认升序，直接取 `[:k]` 拿到的是**最不相关**的。
      - **每次提问都重算全部文档向量**：慢、贵，而且没必要。
      - **不归一化就点乘当余弦**：向量长度不同时排序会偏。
      - **Prompt 只放证据不放规则**：模型会用自己的知识「补全」，引用编号也可能乱标。
      - **不打印 Top-K 就看最终答案**：答错时分不清是检索错还是生成错。
    interview_asks:
      - question: "不用任何框架，你怎么实现一个最小的 RAG？"
        answer: "切文本，调 Embedding 接口得到向量，和问题向量算相似度，取前几段拼进提示，再调用聊天接口。几十行就能跑通。框架只是把这几步包起来。"
      - question: "LangChain 的 Retriever、VectorStore 分别对应 RAG 的哪一步？"
        answer: "VectorStore 负责存向量和按相似度取出。Retriever 是「给一个问题，返回几段文档」这一步，里面可以是向量库，也可以是混合检索。它们都不负责最终生成。"
      - question: "你的最小 RAG 要上生产，还需要补哪些东西？"
        answer: "权限过滤、引用、拒答、评测、日志、入库更新和删除、超时重试。最小示例只证明链路通，没有这些就不能对用户开放。"
    project_example: |
      **p1 企业知识库问答**正式开发前，先用这段最小 RAG 跑 p1 的 20 个种子问题（Day 20 学过的小型 golden set 思路）：每个问题打印 Top-3 和分数，人工看正确段落是否在里面。
      这一步会暴露后面要解决的问题：表格内容搜不到（解析问题）、「该假期」类段落排不上来（切片问题）、制度编号搜不准（需要混合检索）。
      这份「问题 → 期望段落」清单要一直保留，后续换解析器、换切片参数、换检索方案时都用它回归对比。
test:
  - id: d21-t1
    kp: d21-k1
    type: single
    question: 员工问「上个月新发的差旅制度里高铁能坐一等座吗」，没有接入 RAG 的模型回答得很自信，但内容是旧制度。最根本的原因是？
    options:
      - "温度参数设得太高，模型输出随机性太大"
      - "新制度不在训练数据里，模型只能凭参数里的旧知识接龙"
      - "Prompt 没写清楚，应该加上「请回答最新制度」"
      - "模型上下文窗口太小，装不下这个问题"
    answer: [1]
    explain: |
      模型的知识停在训练截止日期，上个月的新制度它从没见过，只能用参数里「看起来合理」的旧内容接龙，这正是 RAG 要补的时效性和私有性缺陷。
      A 温度只影响随机性，调低也变不出没学过的知识；C 提示词再强调「最新」，模型也不知道最新是什么；D 问题本身很短，和窗口大小无关。
  - id: d21-t2
    kp: d21-k1
    type: multi
    question: 与 RAG 相比，「把全部制度文档直接塞进 Prompt」有哪些真实问题？
    options:
      - "每次请求都为全部文档付费，首字延迟也明显变高"
      - "输入越长越容易忽略中间内容、被无关段落干扰"
      - "无法按用户权限隔离薪酬、合同等敏感文档"
      - "模型无法读取超过一万字的中文文本"
      - "新旧两版制度同时在上下文里，模型可能混用"
    answer: [0, 1, 2, 4]
    explain: |
      A 成本和延迟随输入 Token 增长；B 是长上下文退化（lost in the middle）；C 全塞意味着所有人都能问出敏感内容；E 新旧版本并存会混用。
      D 错：现在的模型窗口远超一万字，「读不了」不是问题，问题是「读得贵、读不准、管不住」。
  - id: d21-t3
    kp: d21-k1
    type: judge
    question: 接入 RAG 后，只要检索到的片段与问题的向量相似度足够高，模型的回答就一定是正确的。
    answer: false
    explain: |
      错误。向量相似度只说明「话题接近」，不保证片段包含答案、版本有效、有权限，例如 2021 版和 2024 版制度几乎一样、「可以」和「不可以」向量很近。
      即使证据正确，模型也可能读错或混用多段证据，所以还需要过滤、重排、生成约束和评测。
  - id: d21-t4
    kp: d21-k1
    type: single
    question: 以下哪个问题最不适合用「Top-K 检索 + 生成」的 RAG 方式回答？
    options:
      - "试用期员工能否申请年假"
      - "报销发票抬头写错了应该怎么处理"
      - "新员工入职需要准备哪些材料"
      - "今年一共签了多少份金额超过 100 万的合同"
    answer: [3]
    explain: |
      统计合同数量需要遍历全部数据再聚合，Top-K 只取最相关的几段，必然漏数；这类问题应该走 SQL 或结构化查询（实践项目 p2 在 Day 39 的 Text2SQL 子 Agent 会展开）。
      其余三个都是「答案在某几段制度里」的事实型问题，正是 RAG 擅长的。
  - id: d21-t5
    kp: d21-k2
    type: multi
    question: 以下哪些步骤属于 RAG 的「离线入库」链路？
    options:
      - "把 PDF、Word 解析成文本并清洗"
      - "切片并为每个 chunk 记录来源、页码、权限"
      - "把用户的问题转成向量"
      - "对每个 chunk 做 Embedding 并写入向量库"
      - "把检索到的片段拼进 Prompt 交给 LLM"
    answer: [0, 1, 3]
    explain: |
      离线入库发生在文档上传或更新时：解析清洗、切片加 metadata、向量化写库。
      问题向量化和拼 Prompt 都在用户提问时发生，属于在线链路。易混点是「向量化」：文档向量化在离线，问题向量化在在线，但两者必须用同一个模型。
  - id: d21-t6
    kp: d21-k2
    type: single
    question: 离线入库服务把 Embedding 模型换成了新版（输出维度和旧版相同），但只对新上传的文档用新模型，旧文档的向量没有重建。上线后最可能出现什么现象？
    options:
      - "新旧向量不在同一空间，部分文档几乎搜不到，系统却不报错"
      - "所有查询都报维度不匹配的错误，服务直接不可用"
      - "维度相同就是兼容的，检索效果完全不受影响"
      - "生成阶段的大模型会自动纠正检索偏差"
    answer: [0]
    explain: |
      不同 Embedding 模型的向量空间不同，即使维度一样，分数也不可比。在线问题用新模型编码，和旧文档向量比较几乎是随机的，而且 SQL 照常执行、不报错，这正是「契约破坏悄悄变差」。
      B 维度相同不会报错；C 维度相同不等于空间相同；D 模型拿到错误证据只会答错，纠正不了。
  - id: d21-t7
    kp: d21-k2
    type: single
    question: 用户反馈「答错了」。你查日志发现正确的制度条款不在 Top-5 里，但在数据库里按关键词能搜到这条条款原文。问题最可能出在哪一层？
    options:
      - "生成层：模型读错了给它的证据"
      - "入库层：这份文档没有被解析入库"
      - "前端层：引用卡片渲染错了段落"
      - "检索层：已经入库但没有被检索出来"
    answer: [3]
    explain: |
      按三步定位：库里能搜到原文，说明入库没问题；Top-5 里没有它，说明检索没找到；模型根本没拿到正确证据，所以不是生成层的锅。
      下一步应该看检索层：切片是否切断了关键信息、是不是编号类问题需要关键词检索、过滤条件是否误伤（Day 23~25）。
  - id: d21-t8
    kp: d21-k2
    type: judge
    question: 权限过滤可以放在 LLM 生成答案之后做：把答案里涉及无权限文档的句子删掉即可。
    answer: false
    explain: |
      错误。模型已经看到了无权限资料，内容可能被改写、概括后混进其他句子，事后很难删干净，还可能出现在日志里。
      权限必须在**检索阶段**过滤（SQL 的 WHERE 条件），让模型根本拿不到无权限的 chunk，Day 30 会详细展开。
  - id: d21-t9
    kp: d21-k2
    type: judge
    question: 在线问答每次请求都应记录检索到的 chunk id、分数和最终发给模型的 Prompt，这是区分「检索问题」和「生成问题」的前提。
    answer: true
    explain: |
      正确。没有这些记录，用户投诉答错时你只能看到最终答案，无法判断是正确证据没被检索到，还是检索到了但模型用错了。
      有了日志，才能按「入库 → 检索 → 生成」三步定位，也能把 bad case 加进评测集回归。
  - id: d21-t10
    kp: d21-k3
    type: single
    question: 以下哪个需求最适合优先考虑「微调」而不是 RAG？
    options:
      - "让客服机器人回答每月都会更新的退货政策"
      - "让模型回答员工手册里的具体条款并给出页码"
      - "让模型稳定地用公司规定的语气和固定结构输出处理意见"
      - "让模型只回答当前用户有权限看到的文档内容"
    answer: [2]
    explain: |
      微调擅长改变模型的「行为」：语气、风格、固定结构（实际项目里也可以先试结构化输出和 Prompt，不够再微调）。
      A 知识常变，微调要反复重训；B 需要页码出处，微调无法溯源；D 需要按人隔离，训练进参数的知识无法按权限控制，这三项都应该用 RAG。
  - id: d21-t11
    kp: d21-k3
    type: multi
    question: 关于「知识库较小时直接整体放进上下文」，以下哪些说法正确？
    options:
      - "Anthropic 建议知识库小于约 20 万 Token 时可以直接整体放进 Prompt"
      - "配合 prompt caching 可以明显降低重复请求的成本和延迟"
      - "知识库再大也应该直接塞，因为模型窗口会越来越大"
      - "对比两三份合同这类一次性任务，长上下文更简单"
      - "直接放进上下文天然就支持按用户权限隔离"
    answer: [0, 1, 3]
    explain: |
      A、B 来自 Anthropic Contextual Retrieval 一文的建议；D 文档少且一次性时，搭检索链路反而多余。
      C 错：知识库增长后成本、延迟、注意力稀释都会变严重；E 错：塞进去的内容所有人都能问出来，权限要在拼接前或检索时控制。
  - id: d21-t12
    kp: d21-k3
    type: judge
    question: 用几千份制度文档微调模型之后，模型就能可靠地记住其中的具体数字，并且能给出答案出自哪份文件第几页。
    answer: false
    explain: |
      错误。微调主要改变模型「怎么回答」，对大量具体事实的记忆并不稳定，仍会编造；而且参数里没有「出处」这个概念，给不出文件和页码。
      制度一更新还要重训，删除某份资料也做不到精确遗忘，这些都是 RAG 的优势。
  - id: d21-t13
    kp: d21-k3
    type: single
    question: 合规要求「某份已撤回的文件必须在当天从问答系统中下线，之后任何人都问不出来」。哪种方案最容易满足？
    options:
      - "RAG：删除或标记失效这份文件对应的全部 chunk"
      - "微调：重新训练一版模型，让它忘掉这份文件"
      - "长上下文：在 System Prompt 里加一句「不要引用该文件」"
      - "调低 temperature，减少模型说出该文件内容的概率"
    answer: [0]
    explain: |
      RAG 的知识在知识库里，删掉或标记失效对应 chunk，检索就再也拿不到，当天就能生效且可验证。
      B 重训周期长且无法保证「遗忘」；C 只是请求模型配合，内容仍在上下文里，可能被绕过；D 温度与是否泄露无关。
  - id: d21-t14
    kp: d21-k4
    type: single
    question: 下面是手写最小 RAG 的检索函数。测试发现它返回的总是最不相关的段落，原因是？
    code: |
      import numpy as np

      def top_k(query_vec: np.ndarray, doc_vecs: np.ndarray, k: int = 3):
          q = query_vec / np.linalg.norm(query_vec)
          d = doc_vecs / np.linalg.norm(doc_vecs, axis=1, keepdims=True)
          scores = d @ q
          idx = np.argsort(scores)[:k]
          return [(int(i), float(scores[i])) for i in idx]
    lang: python
    options:
      - "余弦相似度公式写错了，应该用欧氏距离"
      - "argsort 默认升序，取前 k 个是相似度最低的"
      - "向量没有归一化，点乘结果没有意义"
      - "k 取 3 太小，应该改成 10 才能覆盖正确答案"
    answer: [1]
    explain: |
      `np.argsort` 按从小到大排序，`[:k]` 取到的是分数最低的 k 个。应改为 `np.argsort(-scores)[:k]` 或 `np.argsort(scores)[::-1][:k]`。
      A 归一化后点乘就是余弦相似度，公式没错；C 代码第 4、5 行已经归一化；D 排序方向错了，K 再大也只是多拿一些不相关的。
  - id: d21-t15
    kp: d21-k4
    type: multi
    question: 从手写最小 RAG 切换到 LangChain 这类框架后，以下哪些是框架主要帮你封装好的部分？
    options:
      - "文档加载器与文本切片器"
      - "各种向量库的读写适配"
      - "检索器与 Prompt 模板的组装"
      - "判断你的切片参数和 Top-K 是否合适"
      - "自动保证回答不会出现幻觉"
    answer: [0, 1, 2]
    explain: |
      框架把 Loader、Splitter、Embeddings、VectorStore、Retriever、PromptTemplate 这些步骤标准化了，换组件更方便。
      D、E 错：参数合不合适、有没有幻觉，框架不知道你的数据，只能靠你自己的评测集（Day 29）判断。
  - id: d21-t16
    kp: d21-k4
    type: judge
    question: 最小 RAG 的 Prompt 除了放证据，还应明确要求「只依据资料回答、资料不足就说不知道、标注引用编号」，否则模型拿到资料后仍可能用自己的知识补全。
    answer: true
    explain: |
      正确。模型的默认行为是「尽量给出一个答案」，证据不完整时会用参数知识补全，看起来像有依据其实是编的。
      明确规则 + 引用编号，既能减少幻觉，也方便后续做引用校验（Day 27）。
  - id: d21-t17
    kp: d21-k4
    type: single
    question: 手写的最小 RAG 无论用户问什么，都会返回 5 条引用；问「公司火星分部的报销标准」也照样引用 5 段制度。最合理的改进是？
    options:
      - "把 k 调到 10，增加命中正确资料的概率"
      - "在 Prompt 里用更强的语气要求模型不许胡说"
      - "按自有数据标定的分数阈值过滤，过滤后为空就直接拒答"
      - "换一个参数量更大的生成模型来判断相关性"
    answer: [2]
    explain: |
      Top-K 是「找最近的 K 个」而不是「找相关的」，所以永远返回 K 条。需要一个相关性下限：分数低于阈值的丢掉，全丢了就不调 LLM、直接回答「没找到」。阈值要在自己的数据和当前模型上标定（Day 25 展开）。
      A 只会引入更多无关段落；B 有帮助但模型面对看似相关的证据仍会硬凑；D 成本高且治标不治本。
  - id: d21-t18
    kp: d21-k4
    type: judge
    question: 手写最小 RAG 时，文档向量最好在每次用户提问时实时重新计算，这样能保证用到的是最新数据。
    answer: false
    explain: |
      错误。文档向量应在离线入库时算一次并存起来，文档变化时再增量重算；每次提问都重算全部文档会让延迟和 Embedding 费用随文档数线性增长。
      保证数据最新靠的是「文档变更触发重新入库」，而不是在线重算。
exam:
  - id: d21-e1
    kp: d21-k1
    type: single
    question: 老板说：「模型已经支持百万 Token 了，把 3 万份文档分批塞进去问就行，不用做 RAG。」以下哪条反驳最切中要害？
    options:
      - "百万窗口模型的接口目前还不够稳定，容易超时"
      - "中文的 Token 消耗比英文多，百万窗口实际只够一半"
      - "分批塞也无法在一次回答里综合全部资料，且成本、延迟、权限、版本问题都没解决"
      - "长上下文模型对中文的理解能力普遍比较差"
    answer: [2]
    explain: |
      核心在于：分批意味着每批只看到一部分资料，问题的答案可能在任何一批里，你还得先知道「该问哪一批」——这本身就是检索；同时每次都为大量 Token 付费、延迟高，敏感文档无法按人隔离，新旧版本会混用。
      A、D 是不可靠的泛泛之谈；B 即使属实也只是量的问题，没触及根本。
  - id: d21-e2
    kp: d21-k2
    type: single
    question: 新版考勤制度上传一小时后，员工仍然查到旧条款。日志显示新文档入库任务状态为「成功」，但写入的 chunk 数为 0。最可能的根因和第一步排查是？
    options:
      - "检索层 Top-K 太小，第一步把 K 从 5 调到 20"
      - "生成层模型偏好旧知识，第一步加强 Prompt 约束"
      - "Embedding 服务被限流，第一步给向量化服务扩容"
      - "解析出空文本却被判为成功，第一步检查解析产物和质量校验"
    answer: [3]
    explain: |
      chunk 数为 0 说明问题在入库层：最常见的是扫描件 PDF 没有文本层，解析返回空字符串，而任务只看「有没有抛异常」就判成功。第一步应查看解析产物、空页率，并给入库任务加「chunk 数为 0 即失败」的校验（Day 22）。
      A、B 都是在新文档根本不在库里的情况下调下游；C 限流通常会报错或重试，不会表现为成功且 0 条。
  - id: d21-e3
    kp: d21-k3
    type: single
    question: 某保险公司的需求：条款每季度更新；回答必须附条款编号；不同渠道的代理人能看到的产品不同；回答固定为「结论、依据、免责提示」三段。最合理的方案是？
    options:
      - "全部用微调：把条款和回答格式一起训练进模型"
      - "RAG 检索条款并按渠道过滤，结构化输出约束三段格式"
      - "长上下文：每次请求塞入全部条款，Prompt 里规定格式"
      - "RAG 不加过滤，靠 Prompt 要求模型别提无权限产品"
    answer: [1]
    explain: |
      季度更新、要出处、要按渠道隔离，这三条都指向 RAG + 检索阶段过滤；固定三段格式用结构化输出（Day 16）就能稳定实现，不需要微调。
      A 更新要重训、给不出编号、无法隔离；C 成本高且无法按渠道隔离；D 把权限交给模型自觉，等于没有权限控制。
  - id: d21-e4
    kp: d21-k4
    type: single
    question: 团队用手写最小 RAG 验证完可行性，准备切换到框架实现。以下哪项最应该保留并继续使用？
    options:
      - "种子问题和期望段落清单，以及检索日志，用来对比切换前后效果"
      - "自己写的余弦相似度函数，因为比框架里的更快"
      - "自己封装的 HTTP 客户端，避免依赖框架的网络层"
      - "手写的 for 循环拼 Prompt，框架的模板不够灵活"
    answer: [0]
    explain: |
      手写版最大的价值不是代码，而是你沉淀下来的「问题 → 期望段落」清单和检索日志：切到框架后用同一批问题回归，才能证明效果没有变差，这就是评测意识（Day 20、Day 29）。
      B、C、D 都是实现细节，框架的实现通常更完善，没有保留的必要。
  - id: d21-e5
    kp: d21-k2
    type: multi
    question: 关于两条链路的工程设计，以下哪些做法是正确的？
    options:
      - "离线入库放进任务队列异步执行，并支持从失败步骤断点重跑"
      - "在线链路设定延迟预算，上游失败时返回明确的兜底话术"
      - "离线链路允许慢，所以不必保存解析文本等中间产物"
      - "在 chunk 上记录 embedding_model，在线服务启动时校验一致"
      - "只要 Embedding 模型相同，在线可以用和离线不同的文本规范化规则"
    answer: [0, 1, 3]
    explain: |
      A 离线任务慢且可能失败，异步 + 断点重跑是标准做法；B 在线要快、要兜底；D 让「模型不一致」从悄悄变差变成显式告警。
      C 错：没有中间产物，答错时就无法定位是解析还是切片的问题；E 错：规范化不一致会导致同一个词在两边形式不同，也是契约的一部分。
  - id: d21-e6
    kp: d21-k2
    type: multi
    question: 以下哪些现象说明问题出在「生成层」，而不是入库层或检索层？
    options:
      - "Top-5 里有正确条款，但回答混用了另一条款里的数字"
      - "正确条款连 Top-50 里都没有出现"
      - "回答里有一句话在所有证据中都找不到出处"
      - "这份文档的解析结果是一个空字符串"
      - "证据写的是「不可以」，回答却说「可以」"
    answer: [0, 2, 4]
    explain: |
      A、C、E 的共同点是：正确证据已经给到模型，但模型混用、编造或读反了，这是生成层问题，要靠 Prompt 约束、引用校验和 Faithfulness 评测解决（Day 27、29）。
      B 是检索层没找到；D 是入库层解析失败。
  - id: d21-e7
    kp: d21-k3
    type: judge
    question: 如果知识库总量只有十几万 Token 且很少更新，直接整体放进上下文并开启 prompt caching，可能比搭建完整 RAG 更划算。
    answer: true
    explain: |
      正确。Anthropic 的建议是知识库小于约 20 万 Token 时可以直接整体放进 Prompt，prompt caching 让重复部分的成本和延迟大幅下降。
      这时搭解析、切片、向量库反而增加复杂度。但如果有权限隔离需求或知识库会持续增长，仍然要考虑 RAG。
  - id: d21-e8
    kp: d21-k1
    type: judge
    question: RAG 能减少幻觉，是因为检索到的证据在推理时临时修改了模型参数，让模型「学会」了这些知识。
    answer: false
    explain: |
      错误。RAG 完全不改模型参数，它改的是**输入**：把证据放进 Prompt，模型在生成时可以「照着资料说」。
      这也是 RAG 知识更新快、能删除、能溯源的原因；改参数的是微调。
  - id: d21-e9
    kp: d21-k2
    type: case
    question: |
      p1 企业知识库上线两周，用户反馈：问「工作满 3 年年假有几天」，答案引用的是《考勤管理办法》的「第一章 总则」，内容是「为规范公司考勤管理，特制定本办法……」，没有给出具体天数。
      你查日志发现：Top-5 里有 3 条是不同制度的「总则 / 目的」段落，真正写着「满 1 年不满 10 年 5 天」的条款排在第 9 位；该条款在库中存在且解析正确。
      最合理的根因判断和处理方向是？
    options:
      - "生成层问题：模型能力不足，换参数量更大的模型就能从总则段落里推理出具体天数"
      - "检索层问题：总则段落相似度高却不含答案，应从切片、混合检索和重排治理并加入评测集"
      - "入库层问题：这份制度没有被正确解析入库，需要让业务方重新上传原始文档再重建索引"
      - "前端问题：引用卡片展示错了段落，应该修改前端的引用渲染逻辑并补充端到端测试"
    answer: [1]
    explain: |
      条款在库中且解析正确，排除入库层；正确条款排第 9 没进 Top-5，模型根本没拿到，属于检索层问题。总则段落覆盖大量制度关键词，向量上和很多问题都「像」，但不含具体答案——典型的「相似不等于正确」。
      治理方向：切片时给条款加标题路径前缀（Day 23）、混合检索让「年假」等关键词精确匹配（Day 25）、重排判断是否真正回答问题（Day 26），并把这个问题加入评测集回归。A 模型拿不到证据换多大都没用；C、D 与日志事实不符。
interview:
  - id: d21-i1
    kp: d21-k2
    type: scenario
    difficulty: 2
    question: 线上用户反馈「知识库经常答非所问」，你会怎么排查？
    key_points:
      - {text: "按入库、检索、生成三层定位：资料入库了吗、检索到了吗、模型用对了吗", dim: principle}
      - {text: "依赖每次请求的检索日志：chunk id、分数、最终 Prompt 和回答", dim: engineering}
      - {text: "收集 bad case 并标注正确出处，统计各层问题占比，而不是凭单个案例下结论", dim: engineering}
      - {text: "能说出每层的典型根因和对应手段，如扫描件空文本、总则段落抢排名、模型混用证据", dim: concept}
      - {text: "结合项目说明一次具体的定位过程和修复后的回归验证", dim: project}
    reference: |
      **第一步：收集和标注。** 从反馈和日志里捞出 20~50 个答非所问的问题，人工标注每个问题「正确答案在哪份文档哪一段」。单个案例容易误判，要看分布。

      **第二步：按三层定位。** 对每个 bad case 问三个问题：
      1. **入库了吗？** 去库里按原文关键词搜正确段落。搜不到 → 入库层：常见是扫描件没 OCR 解析出空文本、表格被拍平、编码乱码、入库任务失败却显示成功。
      2. **检索到了吗？** 看日志里的 Top-K。正确 chunk 不在里面 → 检索层：切片切断了关键信息、「总则」类段落相似度高却没答案、编号型号类问题向量检索不准、权限或版本过滤误伤。
      3. **用对了吗？** 正确 chunk 在 Prompt 里但回答错 → 生成层：模型混用多段证据、读反否定句、用自己的知识补全。

      **第三步：按占比优先修复。** 入库层补 OCR 和质量校验；检索层做结构化切片、加标题前缀、混合检索、重排、阈值拒答；生成层加「只依据证据、逐句引用、不足就拒答」的约束。

      **第四步：回归。** 把这批 bad case 加进评测集，每次改动都跑一遍 Recall@K 和答案正确率，防止修 A 坏 B。

      前提是系统有完整的检索日志，否则只能猜。
    oral: |
      我的做法是先分层，再动手。
      我会先捞出几十个答非所问的问题，标注正确答案在哪一段，然后按三层去查：资料入库了吗、检索到了吗、模型用对了吗。我们系统每次请求都记录了 chunk id、分数和最终 Prompt，所以这一步很快。
      在我做的企业知识库项目里，统计下来大部分是检索层问题，比如问年假天数，Top-5 被各个制度的「总则」段落占满，真正的条款排第 9。我们给切片加了标题路径前缀，又加了关键词检索一路，这类问题就好了。
      最后我会把这批问题加进评测集，之后每次改切片或检索都跑一遍回归。
  - id: d21-i2
    kp: d21-k2
    type: design
    difficulty: 3
    question: 老板要你一周内上线一个内部知识库问答的 MVP，你会怎么选型和排期？上线后怎么证明它有效？
    key_points:
      - {text: "先确认文档规模、格式、更新频率和权限要求，判断是否真的需要完整 RAG", dim: concept}
      - {text: "给出务实选型：PostgreSQL 加 pgvector、OpenAI 兼容接口、异步入库任务、带引用和拒答的生成", dim: engineering}
      - {text: "排期按两条链路拆：先打通最小闭环再补解析质量、混合检索和权限", dim: engineering}
      - {text: "用业务方给的真实问题建小型评测集，度量检索命中率和答案正确率，并收集线上反馈", dim: project}
      - {text: "明确 MVP 不做什么，如复杂表格、跨文档统计，并说明风险", dim: principle}
    reference: |
      **Day 1：需求澄清。** 问清四件事：文档有多少、什么格式（扫描件比例）、多久更新、有没有部门权限。同时让业务方给 50 个真实问题和期望答案出处，这是验收标准。如果资料只有几十页、没有权限要求，直接放进上下文加 prompt caching 就能上线，不必上 RAG。

      **选型（偏务实）：**
      - 存储：公司已有 PostgreSQL 就用 pgvector，向量、原文、权限在一个库，运维不增加。
      - 模型：OpenAI 兼容接口（DeepSeek、通义等），Embedding 与对话模型都从配置读取。
      - 入库：上传后写任务，后台 Worker 解析 → 切片 → 向量化，记录每份文档的状态和 chunk 数。
      - 生成：Prompt 要求只依据证据、标注引用、证据不足就拒答；接口流式返回。

      **排期：** Day 2~3 打通两条链路最小闭环（纯文本 + 电子版 PDF）；Day 4 补引用、拒答和按部门过滤；Day 5 跑评测集、修最明显的问题；Day 6~7 小范围试用并收集反馈。

      **证明有效：** 用 50 个问题测两个指标：检索命中率（正确段落是否在 Top-5）和答案正确率（人工判对错），再加线上的点赞点踩和「没找到」比例。汇报时给出数字和典型失败原因，而不是只演示几个成功案例。

      **明确不做：** 扫描件 OCR、复杂表格、跨文档统计类问题先不承诺，列为二期风险。
    oral: |
      我会先花半天把需求问清楚：文档多少、什么格式、多久更新、有没有部门权限，并让业务方给我 50 个真实问题和答案出处，这就是验收标准。
      如果资料很少，我甚至会建议直接放进上下文；量大才做 RAG。选型上我会用公司现有的 PostgreSQL 加 pgvector，模型走 OpenAI 兼容接口，入库做成后台任务。
      排期上前三天先把离线入库和在线问答的最小闭环打通，第四天补引用、拒答和部门过滤，第五天跑评测集，最后两天小范围试用。
      证明效果我会给两个数字：正确段落在 Top-5 里的比例和答案正确率，再加线上点踩率。扫描件和复杂表格我会明确列为二期，不在 MVP 里承诺。
  - id: d21-i3
    kp: d21-k3
    type: scenario
    difficulty: 3
    question: 客户坚持说：「现在有百万上下文模型了，再微调一下就是我们的专属模型，为什么还要做 RAG？」你怎么回应？
    key_points:
      - {text: "区分三种方案：RAG 改输入、微调改参数、长上下文直塞，各自擅长什么", dim: concept}
      - {text: "指出长上下文的成本、延迟、注意力稀释、权限和版本问题，以及小知识库可以直接塞的边界", dim: principle}
      - {text: "指出微调灌知识的问题：事实记忆不稳、无法溯源、更新要重训、无法精确删除", dim: principle}
      - {text: "给出组合方案：RAG 管事实与权限，结构化输出或微调管格式风格", dim: engineering}
      - {text: "用客户的需求清单和小规模对比实验来决策，而不是争论", dim: project}
    reference: |
      我不会直接否定客户，而是把问题拆开：**你要的是「模型知道我们的知识」还是「模型按我们的方式说话」？**

      **长上下文：** 如果资料只有几十页、很少变、没有权限区分，直接放进上下文配合 prompt caching 是最省事的方案，我会推荐。但如果是几千份文档：每次请求都为海量 Token 付费、首字慢；输入越长越容易漏掉中间内容；薪酬合同所有人都能问出来；新旧版本会混用。

      **微调：** 微调改的是参数，擅长让模型稳定输出某种格式、语气。但用它「灌知识」有四个问题：具体数字和条款记不牢仍会编；给不出出处；制度一改就要重训；某份文件要下线时无法让模型精确遗忘。

      **建议组合：** 事实知识放 RAG（可更新、可溯源、检索时按权限过滤）；输出格式先用结构化输出，确实不够再小规模微调；少量文档的一次性分析用长上下文。

      **怎么决策：** 列出客户的硬需求（更新频率、是否要出处、是否分权限、预算），再用 50 个真实问题做一次小对比：长上下文直塞 vs RAG，比较正确率、单次成本和延迟。用数据说话比争论有效。
    oral: |
      我会先问客户一个问题：您要的是模型「知道我们的知识」，还是模型「按我们的方式说话」？
      如果是知识，而且有几千份文档、经常更新、还要分部门权限，那长上下文每次都要为海量 Token 付费、容易漏掉中间内容、还管不住权限；微调则记不牢具体条款、给不出出处、改一次制度就要重训。
      所以我一般建议组合：事实放 RAG，格式用结构化输出，确实需要特定风格再小规模微调。当然如果资料只有几十页，我会直接建议放进上下文，没必要上 RAG。
      最后我会拿 50 个真实问题做个小对比，把正确率、成本和延迟摆出来，让客户自己选。
