day: 21
phase: 3
title: RAG 全流程：为什么要检索、两条链路与方案选型
goals:
  - 能用「闭卷变开卷」讲清为什么需要 RAG，并说出长上下文直塞替代不了它的至少四个理由
  - 能画出离线入库与在线问答两条链路，说出每一步的产物和典型故障，并按「入库 → 检索 → 生成」三步定位答错问题
  - 能根据知识规模、更新频率、溯源和权限需求，在 RAG、长上下文、微调之间给出选型理由
  - 能读懂一个不用框架的最小 RAG（向量化 → 余弦 Top-K → 拼 Prompt → 生成），并指出它缺什么
