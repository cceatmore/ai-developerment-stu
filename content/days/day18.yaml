day: 18
phase: 2
title: Embedding 与相似度
goals:
  - 能说清 Embedding 是什么、和生成模型有什么区别，以及它在 RAG 离线入库和在线检索中的位置
  - 能区分余弦相似度、点积、欧氏距离，理解归一化后三者排序一致，并会写出计算代码
  - 能按语言、部署方式、维度与成本、输入长度为项目选 Embedding 模型，知道换模型必须全量重算
  - 能举例说明「语义相似不等于答案正确」，并给出混合检索、过滤、重排等补位手段
minutes: 60
resources:
  - title: "OpenAI Docs - Vector embeddings"
    url: "https://developers.openai.com/api/docs/guides/embeddings"
    kind: doc
    lang: en
    minutes: 20
    note: "看 Embedding models 表（维度、MTEB 分数）、Reducing embedding dimensions 一节和末尾 FAQ 里关于距离函数的问答，对照 d18-k2、d18-k3"
  - title: "Hugging Face - BAAI/bge-m3 模型卡"
    url: "https://huggingface.co/BAAI/bge-m3"
    kind: doc
    lang: en
    minutes: 15
    note: "看开头的 Multi-Functionality、Multi-Linguality、Multi-Granularity 介绍和 Usage 里 dense、sparse、colbert 三种输出的示例代码，理解一个模型三种表示"
  - title: "GitHub - QwenLM/Qwen3-Embedding"
    url: "https://github.com/QwenLM/Qwen3-Embedding"
    kind: repo
    lang: en
    minutes: 10
    note: "只看 README 的模型列表（尺寸、32K 长度、维度、MRL 与指令支持）和 Usage 里 query 加 Instruct 前缀的写法"
knowledge_points:
  - id: d18-k1
    name: Embedding 是什么：把文本变成语义空间里的点
    level: P0
    summary: Embedding 模型把任意长度的文本压缩成固定长度的向量，意思相近的文本在空间中距离相近，它负责「找」而不负责「答」
    analogy: |
      想象一个 ECharts 散点图：每段文本是图上的一个点，**意思越接近，点靠得越近**。「电脑开不了机」和「笔记本无法启动」字面几乎不同，却落在相邻位置。
      对比你熟悉的 **MD5 哈希**：内容改一个字，哈希就面目全非，只能做精确匹配；Embedding 恰好相反，**小改动只让点挪一点点**。

      **不一样的地方**：散点图只有 2 维，Embedding 动辄 1024、3072 维，人看不懂每一维的含义；而且它是**有损压缩**，不能像 Base64 那样还原出原文。
    why: |
      RAG、语义搜索、FAQ 匹配、去重聚类都建立在 Embedding 上。Day 21 起的 RAG 检索质量，第一道关口就是向量表示得好不好。
      不理解它是「压缩后的语义坐标」，就会误以为向量库能精确记住每个数字、每个编号，踩到检索不准的坑。
    problem: |
      解决「**如何让程序按意思而不是按字面找文本**」：关键词搜索搜「开不了机」找不到「无法启动」，
      而把文本映射成向量后，只要算向量之间的距离，就能找到语义相近的内容，并且可以预先算好、批量存储。
    principle: |
      **一、它和生成模型不是一回事**

      | 对比项 | 生成模型（Chat） | Embedding 模型 |
      |---|---|---|
      | 输出 | 一段新文本 | 一个固定长度的数字数组 |
      | 用途 | 回答、改写、推理 | 检索、匹配、聚类、分类特征 |
      | 调用成本 | 按输入和输出 Token 计费，较慢 | 只按输入计费，便宜且快 |

      Embedding 模型通常是一个编码器：先得到每个 Token 的向量（回顾 Day 11），再**池化**成一个向量。所以不管输入 10 个字还是 2000 个字，**输出维度固定**；文本越长，单个向量承载的细节越被稀释。

      **二、在 RAG 里的两条链路**

      ```mermaid
      flowchart LR
        subgraph OFF["离线入库"]
          A["文档"] --> B["切片"] --> C["Embedding 模型"] --> D["向量库 存向量和原文"]
        end
        subgraph ON["在线检索"]
          Q["用户问题"] --> E["同一个 Embedding 模型"] --> F["问题向量"]
        end
        F --> G["相似度 Top-K"]
        D --> G
        G --> H["片段交给 LLM 生成回答"]
      ```

      - **入库和查询必须用同一个模型**（同一版本、同一维度），否则两边坐标系不同，距离没有意义（见 d18-k3）。
      - 文档向量离线算一次存起来，查询时只需给问题算一次向量，这就是它快的原因。

      **三、双塔与交叉：Embedding 和重排的分工**

      ```mermaid
      sequenceDiagram
        participant U as 问题
        participant E as Embedding 双塔
        participant V as 向量库
        participant R as 重排 交叉编码
        U->>E: 只编码问题
        E->>V: 问题向量查 Top-50
        V-->>R: 50 个候选片段
        R->>R: 问题和每个片段拼在一起逐对打分
        R-->>U: 精排后的 Top-5
      ```

      - **Embedding（bi-encoder）**：问题和文档**分别**编码，文档向量能提前算好，适合从百万条里快速初筛。
      - **重排（cross-encoder）**：问题和文档**拼在一起**打分，更准但更慢，只能处理几十条候选。bge-m3 模型卡也建议在检索后接重排（Day 26 详讲）。

      **四、不这样做会怎样**

      - 把 Embedding 当成能「理解并回答」的模型，期待它直接给答案。
      - 不切片直接把整本手册算一个向量，细节被平均掉，什么问题都「有点像」又都不够像。
    scenarios: |
      - **语义检索 / RAG 召回**：p1 企业知识库的第一步。
      - **FAQ 与工单匹配**：用户问法千变万化，标准问题只有几百条。
      - **去重与聚类**：工单、评论按语义聚成几类，发现高频问题。
      - **分类特征**：把向量作为轻量分类器的输入，比每次调用 LLM 便宜得多。
    code: |
      from openai import OpenAI

      client = OpenAI()
      resp = client.embeddings.create(
          model="text-embedding-3-small",
          input=["电脑开不了机", "笔记本无法启动", "如何申请年假"],
      )
      vectors = [item.embedding for item in resp.data]
      print(len(vectors), len(vectors[0]))  # 3 1536
    pitfalls: |
      - **误区：Embedding 能直接回答问题。** 它只输出向量，回答靠后面的生成模型。
      - **误区：向量越长保存的信息越完整，能还原原文。** 它是有损压缩，原文要另外存。
      - **整篇文档只算一个向量**：维度固定，长文本的细节被稀释，检索变得模糊（切片见 Day 23）。
      - **入库和查询用了不同模型**：不报错，但结果几乎随机。
    interview_asks:
      - question: "Embedding 是什么？它和大模型生成有什么区别？"
        answer: "Embedding 把一段文字变成一组固定长度的数字，意思接近的文本，数字也接近。它不生成回答。生成模型是接着往下写文字。检索用向量找候选，回答才用生成模型。"
      - question: "为什么 RAG 里要先用向量检索，再用重排？"
        answer: "向量检索便宜，能从几十万条里快速捞出几十条候选，但它只看各自的向量，比较粗。重排模型把问题和每一条放在一起细看，更准，也更贵，所以只用来重排这几十条。"
      - question: "为什么输入长短不同，向量维度却一样？"
        answer: "模型内部会把整段 Token 汇总成一个固定大小的向量，这是模型结构决定的。维度固定，向量库才能建索引。固定维度不等于长文的每个细节都还在。"
    project_example: |
      **p1 企业知识库**：制度文档、设备手册切片后用同一个 Embedding 模型离线入库，向量和原文、所属部门、版本号一起存。
      用户提问时先算问题向量召回 Top-50，再交给重排取 Top-5 拼进提示。上线初期有人把整份 PDF 算成一个向量，导致「年假几天」这类问题召回整本员工手册，回答抓不住重点，改为按章节切片后明显改善。
    freshness: |
      核对于 2026-11：OpenAI Embeddings 指南列出 text-embedding-3-small（默认 1536 维）与 text-embedding-3-large（默认 3072 维），输入上限 8192 Token；
      bge-m3 模型卡说明交叉编码的重排模型比双塔 Embedding 更准，建议检索后接重排。
    sources:
      - {title: "OpenAI Docs - Vector embeddings", url: "https://developers.openai.com/api/docs/guides/embeddings"}
      - {title: "Hugging Face - BAAI/bge-m3", url: "https://huggingface.co/BAAI/bge-m3"}

  - id: d18-k2
    name: 余弦、点积、欧氏距离与归一化
    level: P0
    summary: 余弦只看方向，点积同时受长度影响，欧氏看直线距离；向量归一化到长度 1 后，三者给出相同排序
    analogy: |
      把向量想成从原点出发的箭头：
      - **余弦相似度** ≈ 两支箭头的**夹角**，只看指向是否一致，不管箭头多长；
      - **点积** ≈ 夹角再乘上两支箭头的长度，长箭头天然占便宜；
      - **欧氏距离** ≈ 两个箭头尖之间的直线距离。

      **不一样的地方**：前端算距离一般在 2 维屏幕坐标里，这里是上千维；而且相似度的「好分数」没有统一标准，**0.8 在一个模型里很高，在另一个模型里可能很普通**。
    why: |
      向量库建索引时要选度量方式（pgvector、Milvus、Elasticsearch 都要选），选错或归一化不一致，召回会悄悄变差而且不报错。
      面试也常问「余弦和点积有什么区别、什么时候等价」。
    problem: |
      解决「**两个向量到底有多像，用什么数字衡量**」，以及「**为什么同一批向量换个度量排序就变了**」，
      从而正确选择向量库的距离类型、正确设置阈值。
    principle: |
      **一、三种度量**

      | 度量 | 公式（直觉版） | 越像时 | 是否受长度影响 |
      |---|---|---|---|
      | 余弦相似度 | 点积除以两个长度的乘积 | 越接近 1 | 否 |
      | 点积（内积） | 对应维相乘再相加 | 越大 | 是 |
      | 欧氏距离 | 对应维差值平方和再开方 | 越小 | 是 |

      注意方向：**余弦和点积是越大越像，欧氏距离是越小越像**，排序时写反就全错。

      **二、归一化让三者统一**

      归一化 = 把向量除以自身长度，让长度变成 1。此时：

      ```mermaid
      flowchart TD
        A["原始向量 a 和 b"] --> B["各自除以长度 得到单位向量"]
        B --> C["余弦 等于 点积"]
        B --> D["欧氏距离平方 等于 2 减 2 倍余弦"]
        C --> E["三种度量排序完全一致"]
        D --> E
        E --> F["用最便宜的点积即可"]
      ```

      - OpenAI 文档说明：它的 Embedding **已归一化到长度 1**，所以余弦可以用点积更快地算，**余弦和欧氏距离给出相同排序**；官方推荐余弦，并说明距离函数的选择通常影响不大。
      - bge-m3 用 FlagEmbedding 计算时，示例里直接用 `embeddings_1 @ embeddings_2.T` 求相似度，就是归一化向量上的点积。
      - **陷阱**：如果自己把 3072 维向量截成前 256 维，截完长度不再是 1，**必须重新归一化**，否则点积和余弦结果不一致。

      **三、阈值要校准，不能照搬**

      - 不同模型、不同维度的分数分布不同，「余弦大于 0.8 才算相关」这种数字只对某个模型和某批数据成立。
      - 正确做法：准备几十到几百条标注好的「问题 - 应命中片段」，看相关与不相关样本的分数分布，再定阈值；**换模型、改维度后重新校准**。
      - 阈值只能过滤「分数低的」，**纠正不了排序本身的错误**（见 d18-k4）。
    scenarios: |
      - **向量库建索引选距离类型**：归一化向量选内积（最快）或余弦都可以，关键是入库和查询一致。
      - **FAQ 匹配加阈值**：低于阈值返回「没有找到」，而不是硬给一个不相关答案。
      - **去重**：相似度超过校准好的阈值视为重复工单。
    code: |
      import numpy as np

      def normalize(v: np.ndarray) -> np.ndarray:
          return v / np.linalg.norm(v)

      q = normalize(np.array([0.2, 0.9, 0.1]))
      docs = np.array([[0.1, 0.8, 0.3], [0.9, 0.1, 0.2]])
      docs = docs / np.linalg.norm(docs, axis=1, keepdims=True)

      scores = docs @ q                 # 归一化后点积就是余弦
      order = np.argsort(-scores)       # 越大越像，所以取负号降序
      print(scores.round(3), order)
    pitfalls: |
      - **误区：点积和余弦永远一样。** 只有向量都归一化时才一样，否则长向量的点积天然偏大。
      - **欧氏距离当相似度用，排序方向写反**：距离越小越像。
      - **手动截断维度后不重新归一化**。
      - **照搬网上的阈值**：每个模型的分数分布不同，必须用自己的标注样本校准。
    interview_asks:
      - question: "余弦相似度和点积有什么区别？什么时候它们等价？"
        answer: "点积受向量长度影响，余弦先把长度归一，只比方向。向量已经单位化时，两者排序一样。库里用哪一种，要和生成向量时的归一化方式一致。"
      - question: "向量库里你会选哪种距离度量？为什么？"
        answer: "文本 Embedding 一般用余弦，或在向量已归一化时用点积，看模型文档。不要混用：入库用一种、查询用另一种，排序就没意义。选定后索引也按这个建。"
      - question: "相似度阈值怎么定？"
        answer: "用评测集看不同阈值下的召回和误召回，选一个平衡点。没有普适的 0.8。换模型后分数分布会变，阈值要重做，不能沿用旧数字。"
    project_example: |
      **p1 企业知识库 · FAQ 快速通道**：高频问题先走 FAQ 向量匹配，命中就直接返回标准答案，省一次 LLM 调用。
      最初照搬网上的 0.8 阈值，结果大量明显相关的问题因为分数只有 0.6 左右被漏掉。后来用 200 条标注问题画出相关与不相关的分数分布，把阈值定在两者分界处，FAQ 命中率提升且误命中率可控；换模型后重新做了一遍校准。
    freshness: |
      核对于 2026-11：OpenAI Embeddings 指南 FAQ 说明其向量归一化到长度 1，余弦可用点积更快计算，余弦与欧氏距离排序相同，推荐余弦且距离函数选择通常影响不大；
      手动截短维度时需要重新归一化。bge-m3 模型卡的 dense 示例用矩阵乘法计算相似度。
    sources:
      - {title: "OpenAI Docs - Vector embeddings（FAQ）", url: "https://developers.openai.com/api/docs/guides/embeddings"}
      - {title: "Hugging Face - BAAI/bge-m3", url: "https://huggingface.co/BAAI/bge-m3"}

  - id: d18-k3
    name: Embedding 模型选择与更换
    level: P1
    summary: 按语言覆盖、能否私有化、输入长度、维度与存储成本选模型，并用自己的数据评测；换模型等于换坐标系，必须全量重算
    analogy: |
      选 Embedding 模型像选**图标字体库**：每套字体把图标映射到自己的编码点，换一套字体，旧编码点对应的就是别的图标了。
      Embedding 也一样，**每个模型有自己的坐标系**，A 模型算的向量和 B 模型算的向量放在一起比，就像拿两套字体的编码点互相对照。

      **不一样的地方**：图标错了一眼就能看出来；向量混用**不报错、看起来有结果**，只是结果几乎随机，很难察觉。
    why: |
      模型一旦入库就有迁移成本：几十万切片要重新算向量、重建索引。选型时想清楚语言、部署、成本，能省掉一次痛苦的迁移；
      真要迁移时，知道「必须全量重算 + 并行评估 + 可回滚」，才不会出线上事故。
    problem: |
      解决「**这么多 Embedding 模型，项目该用哪个**」和「**升级模型时如何不把线上检索搞坏**」。
    principle: |
      **一、三个常见选项（核对于 2026-11）**

      | 模型 | 维度 | 最大输入 | 特点 |
      |---|---|---|---|
      | OpenAI text-embedding-3-small | 默认 1536，可调小 | 8192 Token | 云端 API，便宜 |
      | OpenAI text-embedding-3-large | 默认 3072，可调小 | 8192 Token | 云端 API，效果更好 |
      | BAAI/bge-m3 | 1024 | 8192 Token | 开源可私有化，100 多种语言，同时输出稠密、稀疏、多向量三种表示 |
      | Qwen3-Embedding 0.6B / 4B / 8B | 1024 / 2560 / 4096，可按需截短 | 32K | 开源，100 多种语言，查询端支持任务指令 |

      **二、选型看五件事**

      1. **语言**：中英混合、代码检索要看多语言能力。
      2. **部署与数据安全**：数据不能出内网，就只能选开源模型私有化（bge-m3、Qwen3-Embedding）。
      3. **维度与存储成本**：向量条数乘维度就是存储和内存开销。OpenAI 的 text-embedding-3 支持 `dimensions` 参数直接返回更短向量；官方数据是 large 缩到 256 维在 MTEB 上仍优于 1536 维的 ada-002。Qwen3-Embedding 支持 MRL，也可截短。
      4. **输入长度**：切片较长时要确认上限（8192 或 32K）。
      5. **在自己的数据上评测**：榜单只是参考，用你的问题和标注片段比较召回率（Day 29 系统讲 RAG 评测）。

      **三、两个模型的特殊用法**

      - **bge-m3**：一次推理可同时拿到稠密向量（语义）、稀疏词权重（类似关键词）和 ColBERT 多向量，**适合做混合检索**；查询端不需要加指令。模型卡推荐「混合检索 + 重排」。
      - **Qwen3-Embedding**：**查询端加一句任务指令**（官方建议用英文写，例如说明这是网页搜索任务），文档端不加；官方称不加指令效果通常下降约 1% 到 5%。

      **四、换模型 = 换坐标系**

      ```mermaid
      flowchart LR
        A["选定新模型"] --> B["新建索引 全量重算向量"]
        B --> C["用标注集对比 新旧召回率"]
        C --> D{"新模型更好"}
        D -->|是| E["灰度切流 查询改用新模型"]
        D -->|否| F["放弃 保留旧索引"]
        E --> G["观察一段时间 保留旧索引可回滚"]
      ```

      - **即使维度相同也不能混用**：两个 1024 维模型的第 1 维含义毫无关系。
      - 每条向量记录 `embedding_model` 和维度，方便排查和迁移。
    scenarios: |
      - **金融、政务、制造等数据不能出内网的项目**：bge-m3 或 Qwen3-Embedding 私有化部署。
      - **快速原型、数据可以上云**：text-embedding-3-small，按量付费，接入最简单。
      - **存储压力大的大规模知识库**：用 dimensions 或 MRL 降维，评测后决定维度。
      - **需要兼顾关键词精确匹配**：bge-m3 的稀疏输出配合稠密向量做混合检索。
    code: |
      from FlagEmbedding import BGEM3FlagModel

      model = BGEM3FlagModel("BAAI/bge-m3", use_fp16=True)
      out = model.encode(
          ["设备 E-302 报警如何处理"],
          return_dense=True, return_sparse=True, return_colbert_vecs=False,
      )
      dense = out["dense_vecs"]          # 1024 维语义向量
      sparse = out["lexical_weights"]    # 词 -> 权重，可用于关键词匹配
    pitfalls: |
      - **误区：维度相同的模型向量可以混用。** 坐标系不同，混用后不报错但结果近乎随机。
      - **只改配置里的模型名就上线**：老数据还是旧模型的向量。
      - **只看榜单排名选模型**：榜单数据和你的业务数据分布不同。
      - **Qwen3-Embedding 文档端也加指令，或查询端忘加**：官方用法是只给查询加。
      - **没记录向量来自哪个模型**：迁移时分不清哪些要重算。
    interview_asks:
      - question: "你们项目的 Embedding 模型是怎么选的？考虑了哪些因素？"
        answer: "看中文效果、维度和成本、是否能内网部署、和向量库的距离是否匹配。用自己的文档做一小批检索评测，不看广告分。还要看供应商会不会突然下线这个模型。"
      - question: "要升级 Embedding 模型，你会怎么迁移？"
        answer: "新旧向量维度和空间都不同，不能混在一个索引里比。新建一份索引，全部重嵌入，用评测对比，再切换查询。切换前旧索引留着，方便回滚。"
      - question: "向量维度越高越好吗？"
        answer: "不高。维度高可能更细，但占内存、索引更慢、更贵。小模型的低维度在你的数据上可能已经够用。用评测比，不凭维度数字选。"
    project_example: |
      **p1 企业知识库**：客户要求数据不出内网，且文档中英混合、有大量设备型号，于是选 bge-m3 私有化部署，稠密向量做语义召回，稀疏权重补关键词匹配。
      每条向量都记录模型名和维度。后来评估 Qwen3-Embedding 时，没有动线上索引，而是新建一套索引全量重算，在 300 条标注问题上对比召回率后再决定是否切流。
    freshness: |
      核对于 2026-11：OpenAI Embeddings 指南列出 text-embedding-3-small 1536 维、large 3072 维、输入上限 8192，MTEB 平均分分别为 62.3% 与 64.6%（ada-002 为 61.0%），large 缩到 256 维仍优于 ada-002；
      bge-m3 模型卡：1024 维、最长 8192、支持 100 多种语言、dense 与 sparse 与 colbert 三种检索、查询无需指令、推荐混合检索加重排；
      Qwen3-Embedding README：0.6B、4B、8B 三个尺寸，维度 1024、2560、4096，序列长度 32K，支持 MRL 和指令，建议指令用英文，不加指令效果通常下降约 1% 到 5%。
    sources:
      - {title: "OpenAI Docs - Vector embeddings", url: "https://developers.openai.com/api/docs/guides/embeddings"}
      - {title: "Hugging Face - BAAI/bge-m3", url: "https://huggingface.co/BAAI/bge-m3"}
      - {title: "GitHub - QwenLM/Qwen3-Embedding", url: "https://github.com/QwenLM/Qwen3-Embedding"}

  - id: d18-k4
    name: 相似不等于正确
    level: P1
    summary: 向量检索找的是「话题像」的片段，不保证含答案；否定、编号、版本、权限等场景需要关键词、过滤和重排补位
    analogy: |
      像前端的**模糊搜索**：输入「iphone」能联想出「iPhone 15 手机壳」，很方便；但如果用户要查订单号 `A1023`，模糊匹配把 `A1028` 排在前面就是事故。
      所以搜索框一般是「模糊联想 + 精确筛选」组合。

      **不一样的地方**：前端模糊搜索的规则是你写的，可以调；向量的「像」是模型学出来的，**你无法直接告诉它「编号必须完全一致」**，只能在检索链路外加机制。
    why: |
      RAG 答错的大头不在生成，而在检索拿错了片段。很多看起来「模型在胡说」的问题，根因是相似度高的片段其实答非所问。
      理解这一点，才能把排查方向从「换个更强的大模型」转到「改检索链路」。
    problem: |
      解决「**为什么相似度最高的片段依然可能答非所问**」，以及「**用哪些手段补上向量检索的短板**」。
    principle: |
      **一、向量检索的典型失误**

      | 场景 | 例子 | 为什么会错 |
      |---|---|---|
      | 否定 | 问「哪些情况**不能**退款」，命中「支持退款的情况」 | 两句话题几乎相同，否定词只占很小权重 |
      | 编号型号 | 查 E-302，返回 E-301、E-305 | 编号在语义空间里几乎是同一个点 |
      | 版本时间 | 问 2026 版制度，命中 2023 版 | 内容相近，年份只差几个字 |
      | 权限 | 普通员工命中高管薪酬制度 | 向量不知道谁能看 |

      **二、补位手段（链路视角）**

      ```mermaid
      flowchart LR
        Q["问题"] --> F["元数据过滤 部门 版本 权限"]
        F --> V["向量召回 语义"]
        F --> K["关键词召回 BM25 或稀疏向量"]
        V --> M["合并去重"]
        K --> M
        M --> R["重排模型 逐对判断相关性"]
        R --> L["LLM 读原文作答 找不到就说不知道"]
      ```

      - **元数据过滤**：版本、部门、权限这类**确定性条件不要交给向量**，用 where 条件先过滤（Day 24）。
      - **混合检索**：编号、型号、专有名词靠关键词或稀疏向量补（Day 25）。
      - **重排**：交叉编码逐对判断「这段是否回答了这个问题」，比单纯比相似度更准（Day 26）。
      - **生成端兜底**：提示词要求只依据给定片段回答，找不到依据就说不知道。

      **三、怎么发现问题**

      - 不要只看「回答像不像」，要**单独评估检索**：准备标注了「应命中片段」的问题集，看 Top-K 里有没有正确片段（Day 29）。
      - 有意识地在评测集中放入否定、编号、版本类问题，它们最容易暴露短板。
    scenarios: |
      - **设备手册问答**：报警码、型号必须精确匹配，向量加关键词混合检索。
      - **制度问答**：多版本并存时先按生效版本过滤。
      - **客服 FAQ**：否定类问题用重排或 LLM 二次确认是否真正回答。
      - **权限敏感的知识库**：先按用户权限过滤再检索，避免越权（Day 30）。
    pitfalls: |
      - **误区：相似度最高的片段一定包含答案。** 它只是话题最像。
      - **误区：调高阈值就能修正排序错误。** 阈值只能砍掉低分结果，排在第一的错误片段分数往往也很高。
      - **误区：换个更大的 Embedding 模型就能解决编号匹配。** 这是表示方式的局限，应加关键词通道。
      - **只评估最终回答**：分不清是检索错还是生成错。
    interview_asks:
      - question: "向量检索有哪些典型的失效场景？怎么解决？"
        answer: "专有名词、编号、精确短语，向量经常找不准。否定句、措辞差很远也会失败。解决是加关键词检索做混合，编号走精确过滤，不要只靠向量。"
      - question: "为什么相似度高的片段可能答非所问？"
        answer: "向量接近只说明用词和主题接近，不说明这段能回答这个问题。目录、总则、另一条款都可能分很高。所以后面还要重排，并让模型只根据能回答问题的证据作答。"
      - question: "你会怎么判断一个 RAG 回答错误是检索问题还是生成问题？"
        answer: "看日志里送进提示的那几段。正确证据没出现，就是检索问题。证据在里面，回答却没用或用错，就是生成问题。两类修法不同，不要一起改。"
    project_example: |
      **p1 企业知识库 · 设备手册**：用户问「E-302 报警怎么处理」，纯向量检索的 Top-1 是 E-301 的处理步骤，LLM 照着回答，差点让现场人员误操作。
      排查时单独打印了检索结果，确认是检索错而非生成错；随后启用 bge-m3 的稀疏权重做关键词通道、加重排，并把 50 条编号类问题加进评测集，此后同类问题 Top-5 命中率明显提升。
    freshness: |
      核对于 2026-11：bge-m3 模型卡推荐「混合检索 + 重排」流程，并说明重排（交叉编码）比双塔 Embedding 更准；Qwen3-Embedding 系列同时提供 Qwen3-Reranker 重排模型。
    sources:
      - {title: "Hugging Face - BAAI/bge-m3", url: "https://huggingface.co/BAAI/bge-m3"}
      - {title: "GitHub - QwenLM/Qwen3-Embedding", url: "https://github.com/QwenLM/Qwen3-Embedding"}

test:
  - id: d18-t1
    kp: d18-k1
    type: judge
    question: Embedding 模型可以像聊天模型一样，直接根据用户问题生成一段回答。
    answer: false
    explain: Embedding 模型只输出一个固定长度的数字向量，用于检索、匹配、聚类，不生成文本。RAG 里它负责「找」，回答由后面的生成模型完成。
  - id: d18-t2
    kp: d18-k1
    type: single
    question: 同一个 Embedding 模型，输入 10 个字和输入 2000 个字，得到的向量长度一样。这说明了什么？
    options:
      - "模型只编码前 100 个字，后面的内容被直接丢弃"
      - "所有 Token 的表示被池化成固定长度，长文本细节被稀释"
      - "向量长度由输入长度决定，这里只是两次恰好相同"
      - "固定长度只是存储格式，检索时向量库会自动展开"
    answer: [1]
    explain: Embedding 模型把每个 Token 的表示汇总（池化）成一个固定长度向量，所以维度和输入长度无关。代价是长文本的细节被压缩得更厉害，这也是要切片而不是整篇算一个向量的原因。在输入上限（如 8192 Token）之内不会只取前 100 字；向量库也不会展开向量。
  - id: d18-t3
    kp: d18-k1
    type: multi
    question: 下列哪些任务适合直接用 Embedding 向量来做？
    options:
      - "知识库语义检索，找出与问题相关的片段"
      - "把用户问法匹配到几百条标准 FAQ"
      - "把相似的工单聚成几类发现高频问题"
      - "根据检索到的片段写一段回答给用户"
      - "精确统计本月订单总金额"
    answer: [0, 1, 2]
    explain: 检索、匹配、聚类都是计算向量之间距离就能完成的任务。写回答要靠生成模型；精确统计金额是数据库查询的事，向量是有损的语义压缩，不能用来做精确计算。
  - id: d18-t4
    kp: d18-k1
    type: single
    question: 用前端熟悉的概念类比 Embedding，下面哪个最贴切？
    options:
      - "MD5 哈希：内容一变哈希就完全不同，适合精确去重"
      - "Base64 编码：把文本换种表示，可以无损还原回原文"
      - "散点图上的点：意思相近的文本落在空间中相近的位置"
      - "localStorage 的 key：靠完全相同的 key 取回原内容"
    answer: [2]
    explain: Embedding 的核心是「语义相近则位置相近」，小改动只让点挪动一点。MD5 恰好相反，一字之差结果面目全非；Embedding 是有损压缩，不能像 Base64 那样还原原文；它也不是靠精确 key 取值，而是按距离找最近的点。
  - id: d18-t5
    kp: d18-k2
    type: single
    question: 当所有向量都已归一化到长度 1 时，余弦相似度、点积、欧氏距离三者的关系是？
    options:
      - "余弦等于点积，三种度量给出的相似排序完全一致"
      - "余弦等于点积，但欧氏距离给出的排序可能完全相反"
      - "点积额外包含长度信息，所以比余弦的结果更准确"
      - "归一化会丢失语义信息，此时只能改用欧氏距离"
    answer: [0]
    explain: 单位向量的余弦就是点积，欧氏距离的平方等于 2 减 2 倍余弦，所以三者排序一致（欧氏是越小越像）。OpenAI 文档也说明其向量已归一化，余弦可用点积更快计算，且与欧氏距离排序相同。归一化后长度都是 1，点积不再包含额外的长度信息；归一化只改长度不改方向，不丢语义。
  - id: d18-t6
    kp: d18-k2
    type: single
    question: 运行下面的代码，输出是什么？两种度量各自认为哪个文档更像 q？
    code: |
      import numpy as np
      q = np.array([1.0, 0.0])
      docs = {"b": np.array([0.6, 0.8]), "d": np.array([0.5, 0.0])}
      for name, v in docs.items():
          dot = float(q @ v)
          cos = dot / (np.linalg.norm(q) * np.linalg.norm(v))
          print(name, round(dot, 2), round(cos, 2))
    options:
      - "b 0.6 0.6 与 d 0.5 1.0；点积认为 b 更像，余弦认为 d 更像"
      - "b 0.6 0.6 与 d 0.5 0.5；点积和余弦都认为 b 更像"
      - "b 0.6 1.0 与 d 0.5 1.0；点积和余弦都认为两者一样像"
      - "b 0.8 0.8 与 d 0.5 1.0；点积和余弦都认为 d 更像"
    answer: [0]
    explain: q 与 b 的点积是 1×0.6 加 0×0.8 等于 0.6，b 的长度为 1，所以余弦也是 0.6。q 与 d 的点积是 0.5，但 d 的长度是 0.5，余弦为 1.0，方向和 q 完全一致。点积受长度影响偏向 b，余弦只看方向偏向 d。这说明未归一化时点积和余弦可能给出不同排序。
  - id: d18-t7
    kp: d18-k2
    type: judge
    question: OpenAI 的向量已归一化，所以把 3072 维向量手动截成前 256 维后，可以直接用点积代替余弦，结果不变。
    answer: false
    explain: 截断后剩下的 256 维长度不再是 1，点积不再等于余弦。OpenAI 文档建议优先在请求时用 dimensions 参数缩短；如果手动截断，必须重新归一化。
  - id: d18-t8
    kp: d18-k2
    type: multi
    question: 关于相似度阈值，下列说法正确的是？
    options:
      - "不同模型的分数分布不同，阈值要用标注样本校准"
      - "换 Embedding 模型或改维度后，需要重新校准阈值"
      - "余弦 0.8 是业界通用的阈值，任何模型都适用"
      - "阈值只能过滤低分结果，纠正不了排序本身的错误"
      - "分数越高越说明片段含答案，阈值定得越高越好"
    answer: [0, 1, 3]
    explain: 相似度分数的绝对值依赖模型和数据，没有通用阈值，要看自己标注样本中相关与不相关的分数分布来定，换模型或维度后分布会变。阈值只能砍掉低分结果，排第一的错误片段往往分数也很高。阈值过高会大量漏召回，分数高也只说明话题像，不代表含答案。
  - id: d18-t9
    kp: d18-k2
    type: judge
    question: 余弦相似度越大表示越相似，而欧氏距离越小表示越相似，两者排序时方向不能写反。
    answer: true
    explain: 余弦和点积是相似度，越大越像；欧氏距离是距离，越小越像。向量库里选择 L2 距离时返回的是距离值，代码按降序排就会把最不相关的排在前面。
  - id: d18-t10
    kp: d18-k3
    type: single
    question: 某制造企业的知识库要求数据不出内网，文档中英混合，还希望顺带获得关键词权重做混合检索。哪个 Embedding 选择最合适？
    options:
      - "OpenAI text-embedding-3-large，榜单效果最好"
      - "BAAI/bge-m3，可私有化、多语言，并能同时输出稀疏权重"
      - "直接取某个聊天模型最后一层的隐藏状态当作向量"
      - "bge-small-en-v1.5，体积小、推理速度快"
    answer: [1]
    explain: 数据不出内网就排除了云端 API。bge-m3 开源可本地部署，支持 100 多种语言，一次推理可同时得到稠密向量和稀疏词权重，正适合混合检索。聊天模型的隐藏状态没有为检索训练过，效果不可控；英文小模型不适合中英混合。
  - id: d18-t11
    kp: d18-k3
    type: judge
    question: 两个 Embedding 模型都输出 1024 维向量，所以可以用模型 A 的向量入库，用模型 B 给查询算向量来检索。
    answer: false
    explain: 每个模型有自己的向量空间，维度相同只是数组长度一样，第 1 维在两个模型里的含义毫无关系。混用不会报错，但检索结果近乎随机。入库和查询必须是同一个模型、同一版本、同一维度。
  - id: d18-t12
    kp: d18-k3
    type: multi
    question: 线上知识库要从旧 Embedding 模型升级到新模型，下列哪些做法是必要的？
    options:
      - "用新模型对全部切片重新计算向量"
      - "新旧索引在标注集上对比召回后再切流"
      - "每条向量记录所用模型名和维度"
      - "只改配置里的模型名，新数据自然会用新模型"
      - "切流后保留旧索引一段时间，便于回滚"
    answer: [0, 1, 2, 4]
    explain: 换模型等于换坐标系，老数据必须全量重算；切换前要用标注集验证新模型确实更好；记录模型名和维度便于排查与迁移；保留旧索引保证可回滚。只改配置会造成新旧向量混在一起，查询向量与老文档不在同一空间，检索悄悄变差。
  - id: d18-t13
    kp: d18-k3
    type: single
    question: 关于 OpenAI text-embedding-3 的 dimensions 参数，下列说法与官方文档一致的是？
    options:
      - "它只能把维度调大，不能缩短，缩短需要自己截断"
      - "用它缩短得到的向量没有归一化，调用方需要再处理"
      - "可在请求时直接缩短维度，官方推荐优先用它而非事后截断"
      - "缩到 256 维后 large 的效果会明显低于 1536 维的 ada-002"
    answer: [2]
    explain: 文档说明可通过 dimensions 参数在请求时缩短向量，并推荐用这种方式；只有手动截断时才需要自己重新归一化。官方数据显示 large 缩到 256 维在 MTEB 上仍优于 1536 维的 text-embedding-ada-002。
  - id: d18-t14
    kp: d18-k3
    type: single
    question: 使用 Qwen3-Embedding 做检索时，下列做法符合官方 README 建议的是？
    options:
      - "查询端加一句英文任务指令，文档端不加，维度可按需截短"
      - "查询和文档都必须加同样的中文指令，否则无法检索"
      - "维度固定为 4096，所有尺寸都不能调整输出维度"
      - "只支持中文和英文，多语言场景要换其他模型"
    answer: [0]
    explain: Qwen3-Embedding 支持指令，官方建议给查询加任务指令（建议用英文写），文档不需要；不加指令效果通常下降约 1% 到 5%。它支持 MRL，可以按需截短维度；三个尺寸默认维度分别是 1024、2560、4096；支持 100 多种语言。
  - id: d18-t15
    kp: d18-k4
    type: single
    question: 设备手册问答中，用户问「E-302 报警怎么处理」，向量检索的前几名是 E-301 和 E-305 的处理步骤。最合理的改进是？
    options:
      - "Embedding 维度太低，换成 3072 维的模型即可解决"
      - "相似度阈值太低，把阈值提到 0.95 就能过滤掉"
      - "编号在语义上几乎相同，应加关键词通道或精确过滤再重排"
      - "切片太小，应把整本手册作为一个切片重新入库"
    answer: [2]
    explain: 编号、型号这类精确值在语义空间里几乎是同一个点，加维度、换模型都解决不了表示方式的局限。错误片段的分数本来就很高，提阈值过滤不掉。整本手册一个切片会让细节更模糊。正确做法是加 BM25 或稀疏向量的关键词通道、按编号精确过滤，再用重排确认。
  - id: d18-t16
    kp: d18-k4
    type: judge
    question: 只要相似度排名第一的片段分数足够高，就可以认为它一定包含了问题的答案。
    answer: false
    explain: 相似度衡量的是话题像不像，不是是否回答了问题。「哪些情况不能退款」和「支持退款的情况」分数可以很高，内容却相反。需要重排或 LLM 读原文判断，并在评测集中单独检查检索结果。
  - id: d18-t17
    kp: d18-k4
    type: multi
    question: 下列哪些情况，纯向量检索容易拿到「相似但不对」的片段？
    options:
      - "问题带否定，如问哪些情况不能报销"
      - "按设备编号或产品型号查询"
      - "同一制度存在多个年份版本"
      - "同义改写，如电脑开不了机与笔记本无法启动"
      - "片段只允许特定部门的人查看"
    answer: [0, 1, 2, 4]
    explain: 否定词、编号、年份在向量里权重很小，权限信息向量根本不知道，这些都要靠重排、关键词通道、元数据过滤补位。同义改写恰恰是向量检索的强项，关键词搜索反而找不到。
  - id: d18-t18
    kp: d18-k4
    type: single
    question: 为了弥补「相似不等于正确」，RAG 检索链路中最合适的补位组合是？
    options:
      - "换成更大的 Embedding 模型，并把 Top-K 调到 100 条"
      - "提高相似度阈值，只保留分数最高的那一条片段"
      - "去掉检索，让 LLM 直接凭自身知识回答问题"
      - "元数据过滤加混合检索，再重排，最后让 LLM 读原文判断"
    answer: [3]
    explain: 确定性条件用元数据过滤，精确词用关键词通道，相关性用重排逐对判断，生成端只依据原文并允许说不知道，这是针对各类失效的组合拳。单纯换模型、调大 Top-K 会把更多噪声塞进提示；只留一条会放大排序错误；去掉检索则失去企业私有知识。
exam:
  - id: d18-e1
    kp: d18-k2
    type: single
    question: 用 pgvector 存 bge-m3 的稠密向量，入库和查询时都做了归一化。选择距离类型时，下列说法正确的是？
    options:
      - "必须用欧氏距离，内积对归一化向量没有意义"
      - "内积与余弦会给出完全相反的相似排序"
      - "只能用余弦，因为内积不满足距离的数学定义"
      - "三者排序一致，可选最便宜的内积，但两端都要归一化"
    answer: [3]
    explain: 归一化后余弦等于内积，欧氏距离与余弦单调对应，三者排序一致，所以选计算最快的内积即可。前提是入库和查询两端都归一化，任何一端漏掉都会让内积受长度影响。内积排序与余弦相同而不是相反；索引能否用内积是向量库功能问题，与距离公理无关。
  - id: d18-e2
    kp: d18-k3
    type: single
    question: 一个 300 万切片的知识库用 text-embedding-3-large 默认 3072 维，向量库内存吃紧。最合理的做法是？
    options:
      - "直接取每条向量前 256 维存储，不需其他处理"
      - "用 dimensions 参数生成 1024 等较短向量，在标注集上比较召回后定维度"
      - "改用任意一个 1024 维的模型，新旧向量可以混在一起用"
      - "把多个切片拼接成一条再向量化，减少总条数"
    answer: [1]
    explain: 官方推荐用 dimensions 参数缩短维度，large 缩短后效果损失有限，但具体降到多少要在自己的标注集上评估。手动截断要重新归一化，且需全量重算；换模型不能新旧混用；拼接切片会稀释细节、降低检索精度。
  - id: d18-e3
    kp: d18-k4
    type: single
    question: FAQ 匹配中，用户问「哪些情况不能退款」，排第一的是「支持退款的情况」，分数 0.91。最合理的改进是？
    options:
      - "把阈值从 0.75 提到 0.95，过滤掉这类结果"
      - "换一个维度更高的 Embedding 模型重新入库"
      - "从 FAQ 中删除「支持退款的情况」这一条"
      - "召回候选后用重排或 LLM 判断是否真正回答，并补否定类评测"
    answer: [3]
    explain: 否定句与肯定句话题几乎相同，向量相似度天然很高，提阈值会把正确答案一起砍掉，换模型也难根治。删除 FAQ 是削足适履。应在召回后加重排或让 LLM 判断是否真正回答，并把否定类问题加入评测集持续回归。
  - id: d18-e4
    kp: d18-k1
    type: single
    question: 关于 Embedding 模型（双塔）与重排模型（交叉编码）的区别，下列说法正确的是？
    options:
      - "Embedding 把问题和文档拼在一起逐对打分，所以最准"
      - "Embedding 分别编码，文档向量可预先算好；重排逐对打分更准但更慢"
      - "重排模型输出固定维度向量，可以预先存入向量库"
      - "两者是同一种模型，只是在不同框架里的名字不同"
    answer: [1]
    explain: 双塔模型分别编码问题和文档，文档向量离线算好存起来，在线只需算问题向量，适合大规模初筛。交叉编码把问题和每个文档拼在一起打分，看得更细所以更准，但每个候选都要推理一次，只适合处理几十条。所以常见链路是向量召回加重排。
  - id: d18-e5
    kp: d18-k3
    type: multi
    question: 为项目选 Embedding 模型时，下列哪些因素需要考虑？
    options:
      - "在自己的问题和标注片段上的召回效果"
      - "数据能否出内网，是否必须私有化部署"
      - "文档的语言构成，如中英混合或代码"
      - "最大输入长度，以及维度带来的存储成本"
      - "公开榜单排第一就足够，不必另做评测"
    answer: [0, 1, 2, 3]
    explain: 自有数据评测、部署合规、语言覆盖、输入长度和存储成本都会影响选型。公开榜单是参考，但它的数据分布和你的业务不同，最终要以自己的评测为准。
  - id: d18-e6
    kp: d18-k2
    type: multi
    question: 关于 OpenAI Embeddings 指南中的说明，下列哪些是正确的？
    options:
      - "其向量已经归一化到长度 1"
      - "因此余弦相似度可以用点积更快地计算"
      - "text-embedding-3-small 默认输出 3072 维"
      - "官方推荐余弦，并说明距离函数的选择通常影响不大"
      - "缩短维度后 large 的效果一定比 small 默认维度差"
    answer: [0, 1, 3]
    explain: 文档说明向量已归一化，余弦可用点积计算，余弦与欧氏排序相同，推荐余弦且距离函数选择通常影响不大。small 默认是 1536 维，3072 维是 large。缩短后的 large 效果仍然可能很好，官方数据显示 256 维的 large 仍优于 1536 维的 ada-002，不能一概而论。
  - id: d18-e7
    kp: d18-k4
    type: judge
    question: 向量检索排序不准时，只要把相似度阈值调到合适的位置，就能纠正排序错误。
    answer: false
    explain: 阈值只决定「低于多少分不要」，不改变排序。排第一的错误片段分数往往也很高，阈值拦不住。排序问题要靠关键词通道、元数据过滤、重排等手段解决。
  - id: d18-e8
    kp: d18-k3
    type: judge
    question: bge-m3 一次推理就可以同时得到稠密向量、稀疏词权重和 ColBERT 多向量三种表示。
    answer: true
    explain: bge-m3 的 Multi-Functionality 指的就是同时支持稠密检索、稀疏检索和多向量检索，FlagEmbedding 的 encode 可通过 return_dense、return_sparse、return_colbert_vecs 参数一次取回，适合做混合检索。
  - id: d18-e9
    kp: d18-k3
    type: case
    question: |
      某企业私有化知识库用 bge-m3 入库了 50 万个切片，向量列是 1024 维。半年后团队想换 Qwen3-Embedding-4B。
      一位同事把配置中的模型名改成 Qwen3-Embedding-4B，并把输出维度截到 1024 以兼容原有向量列，重启后新上传的文档用新模型，老文档保持不动。
      之后用户陆续反馈很多问题检索不到老文档里的内容，系统没有任何报错。最合理的根因判断和处理是？
    options:
      - "新模型效果不如 bge-m3，应立即回滚并放弃这次升级"
      - "向量索引在重启时损坏，重建 HNSW 索引就能恢复"
      - "两个模型的向量空间不同，即使维度相同也不能混用，应新建索引全量重算，评测后切流并保留回滚"
      - "查询指令用了英文，把 Qwen3 的指令改成中文就能恢复"
    answer: [2]
    explain: 查询现在用新模型算向量，老文档仍是 bge-m3 的向量，两者不在同一坐标系，维度相同只是数组长度一样，所以检索老文档近乎随机且不会报错。正确做法是新建索引用新模型全量重算，在标注集上对比新旧召回，再灰度切流并保留旧索引回滚。新模型本身好不好要评测后才知道；索引损坏通常会报错或全量异常；指令语言不是这里的根因。
interview:
  - id: d18-i1
    kp: d18-k2
    type: oral
    difficulty: 2
    question: 什么是 Embedding？余弦相似度和点积有什么区别？什么情况下两者等价？
    key_points:
      - {text: "说明 Embedding 把文本映射为固定长度向量，语义相近则距离相近，负责检索不负责生成", dim: concept}
      - {text: "说明余弦只看方向，点积受长度影响，欧氏距离越小越像", dim: principle}
      - {text: "说明归一化后余弦等于点积，三种度量排序一致", dim: principle}
      - {text: "提到阈值要用标注样本校准，换模型要重新校准", dim: engineering}
      - {text: "结合项目说明度量选择或阈值校准的实际做法", dim: project}
    reference: |
      Embedding 是把一段文本映射成固定长度的向量，模型训练的目标是让意思相近的文本在向量空间中靠得近。RAG 里它负责离线把切片入库、在线把问题变成向量做召回，回答由生成模型完成。
      余弦相似度衡量两个向量的夹角，只看方向；点积是余弦乘上两个向量的长度，长度大的向量会占便宜；欧氏距离看两点的直线距离，越小越像。
      当向量都归一化到长度 1 时，余弦就等于点积，欧氏距离的平方等于 2 减 2 倍余弦，三者排序一致，所以可以用最快的内积。OpenAI 的 Embedding 本身已归一化，文档推荐余弦且说明度量选择通常影响不大；但如果手动截断维度，就要重新归一化。
      另外相似度分数没有通用阈值，要用标注样本看分数分布来定，换模型或改维度后重新校准。
    oral: |
      Embedding 就是把文本变成一个固定长度的向量，意思越近，向量越近，它负责找，不负责答。
      余弦只看两个向量的夹角，点积还会受长度影响，欧氏距离是越小越像。只要向量归一化到长度 1，余弦就等于点积，三种度量排序完全一样，所以我在向量库里一般用内积，前提是入库和查询两端都归一化。
      项目里我还踩过阈值的坑：一开始照搬 0.8，结果漏了很多相关问题，后来用 200 条标注样本看分数分布重新定阈值，换模型后也重新校准。
  - id: d18-i2
    kp: d18-k4
    type: scenario
    difficulty: 3
    question: |
      你负责的设备手册问答上线后，现场人员反馈两类问题：一是问某个报警码时，回答的是相邻报警码的处理步骤；
      二是问「哪些情况不能开机自检」时，回答成了可以开机自检的情况。业务方认为是大模型不行，要求换更贵的模型。你怎么分析和处理？
    key_points:
      - {text: "先把检索结果单独打印出来，区分检索错还是生成错", dim: engineering}
      - {text: "解释编号、否定词在向量空间中权重小，相似不等于正确", dim: principle}
      - {text: "提出关键词或稀疏通道、编号精确过滤、重排等补位手段", dim: engineering}
      - {text: "建立含编号类和否定类问题的检索评测集，改动前后对比", dim: project}
      - {text: "说明换生成模型无法解决检索拿错片段的问题", dim: concept}
    reference: |
      第一步是定位：把这些问题的检索 Top-K 单独打出来。如果 Top-1 已经是相邻报警码或相反内容的片段，那 LLM 只是照着错误材料回答，换更贵的生成模型解决不了。
      原因：向量检索衡量的是话题像不像。报警码 E-301 和 E-302 在语义空间里几乎是同一个点；否定词「不能」在整句向量里权重很小，「能」与「不能」的两段话相似度依然很高。
      处理：一是加关键词通道，用 BM25 或 bge-m3 的稀疏权重，与向量结果合并；问题中识别出报警码时直接按编号字段精确过滤。二是在召回后加重排模型，逐对判断片段是否真正回答问题。三是生成端要求只依据片段回答，找不到依据就说明。
      验证：建立检索评测集，专门放入编号类、否定类、版本类问题，标注应命中的片段，看 Top-5 命中率在改动前后的变化，后续每次改检索都跑回归。
    oral: |
      我不会先换模型，而是先把检索结果打出来看。如果排第一的片段就已经是相邻报警码，那是检索错了，生成模型只是照着念。
      根因是向量只衡量话题像不像，报警码之间、「能」和「不能」之间在向量里几乎没差别。
      我会加三层补位：识别到报警码就精确过滤，再加关键词或稀疏通道做混合检索，召回后接重排判断是否真的回答了问题。然后建一份含编号和否定问题的评测集，用 Top-5 命中率证明改动有效，也用数据跟业务方解释为什么不用换大模型。
  - id: d18-i3
    kp: d18-k3
    type: design
    difficulty: 4
    question: |
      公司要为内部知识库选 Embedding 方案：文档约 80 万个切片，中英混合，含大量设备型号；客户要求数据不出内网；未来一年内可能升级模型。
      请说明你的选型思路、存储与成本考虑、如何评测，以及将来升级模型时如何保证线上不受影响。
    key_points:
      - {text: "按私有化、多语言、输入长度、维度存储筛选候选，如 bge-m3、Qwen3-Embedding", dim: engineering}
      - {text: "利用稀疏输出或 BM25 做混合检索，补型号精确匹配", dim: principle}
      - {text: "用自建标注集比较候选模型召回，而不是只看榜单", dim: project}
      - {text: "向量记录模型名和维度，升级时新建索引全量重算、对比评测、灰度切流、保留回滚", dim: engineering}
      - {text: "说明不同模型向量即使同维度也不能混用", dim: concept}
    reference: |
      选型：数据不出内网排除云端 API，候选是开源可私有化的 bge-m3（1024 维、8192 长度、多语言，可同时输出稠密和稀疏表示）和 Qwen3-Embedding（0.6B、4B、8B，32K 长度，支持截短维度与查询指令）。型号多，需要关键词能力，bge-m3 的稀疏输出或单独的 BM25 可以补上。
      存储成本：80 万条乘维度乘每维字节数就是向量大小，1024 维 float32 约 3.3GB，还要加上索引开销；维度更高或模型更大时，要权衡 GPU 推理成本、入库耗时和内存。支持截短维度的模型可以评测不同维度的召回再决定。
      评测：从真实问题中抽 200 到 300 条，标注应命中的切片，特意包含型号类、否定类、中英混合问题；对每个候选模型和维度计算 Top-5、Top-10 命中率，同时记录查询延迟。
      升级方案：每条向量记录 embedding_model 和维度；升级时不动线上索引，用新模型新建索引全量重算，在同一评测集上对比，确认更好后灰度把查询切到新索引，保留旧索引一段时间以便回滚。不同模型即使维度相同也不能混用，查询模型与入库模型必须始终一致。
    oral: |
      我会先用硬约束筛：数据不出内网，就只看开源可私有化的模型，比如 bge-m3 和 Qwen3-Embedding。型号多，所以我倾向 bge-m3 这种能同时出稀疏权重的，或者另配 BM25 做混合检索。
      成本上算一笔账，80 万条 1024 维大约 3 个多 G，再加索引开销，维度要在召回和内存之间权衡。
      选哪个不看榜单，看自己的评测集：两三百条真实问题，专门放型号和否定类问题，比 Top-5 命中率和延迟。
      升级时最重要的一点是不同模型的向量不能混用，哪怕维度一样。所以每条向量都记模型名，升级就新建索引全量重算，评测通过再灰度切流，旧索引留着随时回滚。
