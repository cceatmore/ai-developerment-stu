day: 11
phase: 2
title: 大模型是怎么工作的
goals:
  - 能用「文字接龙 + 自回归」讲清模型从收到问题到吐出完整回答的过程，并推导出流式输出、越长越慢、无状态等工程后果
  - 能说清预训练、SFT、RLHF 各自给模型带来了什么，并据此判断一个问题该用 Prompt、RAG 还是微调解决
  - 能解释推理模型与普通模型的差别，判断什么任务值得用推理模型，以及它对成本、超时、输出上限的影响
  - 能分析幻觉和知识截止的成因，给出至少 3 种系统层面的兜底手段
minutes: 60
resources:
  - title: "李宏毅《生成式AI与机器学习导论 2025》第1讲：一堂课搞懂生成式人工智慧的原理"
    url: "https://speech.ee.ntu.edu.tw/~hylee/GenAI-ML/2025-fall.php"
    kind: video
    lang: zh
    minutes: 45
    note: "在课程页 9/12 一行点「第1講」视频，重点看「文字接龙」和「生成策略」部分，对照今天 d11-k1；同页 9/19 的延伸视频「大型語言模型是如何進行深度思考」对应 d11-k3，可选看"
  - title: "李宏毅《生成式人工智慧导论 2024》第6~8讲：大型语言模型修炼史"
    url: "https://speech.ee.ntu.edu.tw/~hylee/genai/2024-spring.php"
    kind: video
    lang: zh
    minutes: 60
    note: "课程页 3/22~4/12 三行：第6讲预训练（自我学习）、第7讲指令微调（名师指点）、第8讲 RLHF（参与实战），每讲先看前 20 分钟，对应 d11-k2 的三阶段"
  - title: "Hello-Agents 第三章 大语言模型基础"
    url: "https://github.com/datawhalechina/hello-agents/blob/main/docs/chapter3/%E7%AC%AC%E4%B8%89%E7%AB%A0%20%E5%A4%A7%E8%AF%AD%E8%A8%80%E6%A8%A1%E5%9E%8B%E5%9F%BA%E7%A1%80.md"
