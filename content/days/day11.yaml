knowledge_points:
  - id: d11-k1
    name: 文字接龙：下一个 Token 预测与自回归生成
    level: P0
    summary: 模型每一步只做一件事：根据前面所有 Token 预测下一个 Token 的概率，选一个接上，再继续预测
    analogy: |
      很像 **IDE 里的代码补全**：你敲了 `const user = await`，补全根据前文猜下一个最可能的词。
      大模型就是一个超大号补全器，并且**把自己补出来的词当成新的前文继续补**，一直补到结束。

      **不一样的地方**：
      - IDE 补全猜错了你可以不按 Tab；模型补出的 Token **立刻成为后续的前提，不会回头改**。
      - IDE 补全基本是确定的；模型是**按概率抽样**，同样的前文两次结果可能不同。
    why: |
      你用 Cursor 时看到的「逐字流出」、偶尔前后矛盾、同一个问题两次答案不一样，**全都来自这一个机制**。
      不理解它，你会把模型当成「查数据库」或「执行函数」，在系统设计时对它抱错误预期：以为它会**查证**、会**回头修改**、会**记得上次聊过什么**。
      面试里「大模型是怎么生成文本的」几乎是必问开场题。
    problem: |
      它解决的是「用一个统一的方法处理几乎所有文本任务」：翻译、摘要、问答、写代码，全部被改写成「**给定前文，续写后文**」。
      对应用开发者来说，理解它能回答这些实际问题：**为什么输出是流式的**、为什么输出越长越慢越贵、为什么模型会一本正经地胡说、为什么多轮对话要后端自己保存历史。
    principle: |
      **一、模型在做什么：给下一个 Token 打分**

      - 输入文本先被切成 **Token**（词片段，Day 13 详讲），每个 Token 对应一个整数 ID。
      - 模型（一个巨大的神经网络，内部结构见 Day 12）读入全部 Token，输出一个**概率分布**：词表里每个 Token 作为「下一个」的可能性。
      - 例：前文是「智慧园区的告警」，模型可能给出「系统」0.41、「数量」0.18、「类型」0.09……
      - **模型本身只负责打分**，从分布里挑哪个由**采样策略**决定：总挑最大的叫贪心；按概率随机抽，并用 temperature 等参数调节随机程度。

      **二、自回归：把输出接回输入，循环**

      「自回归（autoregressive）」= **每一步的输出成为下一步的输入**。

      ```mermaid
      flowchart LR
        A["输入 Token 序列"] --> B["模型前向计算"]
        B --> C["下一个 Token 的概率分布"]
        C --> D["采样选出 1 个 Token"]
        D --> E{"是结束符或达到长度上限"}
        E -->|"否"| F["把新 Token 追加到序列末尾"]
        F --> B
        E -->|"是"| G["返回完整回答"]
      ```

      生成 300 个 Token 的回答，模型大约要**循环 300 次**。这直接带来四个工程后果：

      | 机制 | 工程后果 | 你会在哪里遇到 |
      |---|---|---|
      | 逐个生成 | **天然可以流式输出** | SSE 推给前端（Day 10） |
      | 第 N 个必须等第 N-1 个 | **输出越长越慢**，输出 Token 通常也更贵 | 超时设置、成本（Day 13） |
      | 已输出的 Token 固定 | **不会回头改**，只能将错就错 | 「先给结论」时结论错了，后面会给错误结论找理由 |
      | 每步都在抽样 | **同问不同答**是正常现象 | 测试不能只跑一次 |

      **三、为什么「猜下一个词」能显得很聪明**

      要在海量文本上把下一个词猜准，模型被迫学会语法、常识、事实之间的关联、代码结构，甚至一些推理套路——因为这些都能降低预测误差。
      但要记住：**它学到的是「什么样的续写最像训练数据」，而不是「什么是真的」**。这句话是理解幻觉（d11-k4）的钥匙。

      **四、对话也是续写，模型本身无状态**

      Chat 接口里的 system / user / assistant 消息，最终会被拼成一条带特殊分隔符的长序列，模型做的仍是「续写 assistant 的下一段」。

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant S as 你的后端
        participant M as 大模型
        U->>S: 第 2 轮 那它的处理时限呢
        S->>S: 取出第 1 轮问答
        S->>M: system 加 第 1 轮 加 第 2 轮问题
        M-->>S: 续写出的回答
        S->>S: 保存本轮问答
        S-->>U: 返回回答
      ```

      **多轮对话的「记忆」完全来自你每次请求时重新发送的历史**，两次调用之间模型什么都不记得（消息结构详见 Day 14）。

      **不这样理解会怎样**：你会写出「让模型自己查一下数据库」的需求（它没有这个能力，除非给它工具，Day 17）；会以为模型记得上一次会话；会对输出长度和延迟的关系毫无概念，把接口超时设得过短。
    scenarios: |
      - **流式输出接口**：知道 Token 是逐个生成的，就会在问答、写作助手里用 SSE 边生成边推给前端，让用户一两秒内就看到第一个字。
      - **控制输出长度降成本**：分类、抽取这类任务明确要求「只输出标签」或限制长度，因为输出是串行生成的、单价更高。
      - **多轮对话服务**：后端必须按会话保存历史并在每次请求时带上，否则模型「失忆」。
      - **排查前后矛盾**：长回答后半段与前半段冲突时，知道它不会回头改，就改用「先列要点再展开」或拆成多次调用。
    pitfalls: |
      - **误区：模型先想好整段答案再输出。** 普通模型没有「整段草稿」；推理模型会先生成一段推理 Token（d11-k3），但本质仍是一个一个生成。
      - **误区：模型有记忆。** 调用时模型参数不变，「记得上文」只是因为你把上文又发了一遍。
      - **误区：temperature 设为 0 就一定逐字一致。** 随机性大幅降低，但服务端实现不保证每次完全一样，关键结果要靠校验而不是靠「一致」。
      - **混淆：输入和输出的处理方式。** 输入可以一次性并行处理，**输出必须逐个生成**——所以「长输入短输出」和「短输入长输出」的延迟特征完全不同（Day 12）。
    interview_asks:
      - question: "大语言模型是怎么生成一段回答的？请讲清一次请求的完整过程。"
        answer: "请求把已有文本交给模型，模型算出下一个 Token 的概率，按采样策略取一个，拼回去，再算下一个，直到结束符或长度上限。不是一次想好整段再吐出来。所以回答是一个 Token 一个 Token 接出来的。"
      - question: "为什么 LLM 的输出可以流式返回？为什么输出越长越慢？"
        answer: "每定下一个 Token 就可以先发给前端，不用等全文。后面的 Token 要看着前面已经生成的内容再算，输出越长，计算次数越多，总时间越长。"
      - question: "LLM 有记忆吗？多轮对话是怎么实现的？"
        answer: "模型本身不记得上一次请求。多轮是我们把历史消息再发一遍。历史越长，每次请求越贵、越慢。要控历史长度，不能无限往上堆。"
    project_example: |
      **p1 企业知识库问答**：Day 14 会写 LLM 客户端，到时候请直接按今天的结论设计——
      1. 对话接口默认走流式（SSE），前端逐字渲染，避免长回答时用户盯着空白等待；
      2. 会话历史由后端按 `session_id` 存储，每次请求时拼回去，前端只传本轮问题；
      3. 回答格式要求「先一句结论 + 引用编号，再展开」，既缩短输出长度，又方便前端先展示结论。
      上线后用日志里的输出 Token 数和耗时验证效果，**数字用你自己的测量结果填写**。
  - id: d11-k2
    name: 预训练与后训练：SFT 与 RLHF
    level: P1
    summary: 预训练给知识和语言能力，SFT 教它按指令回答，RLHF 等偏好对齐让它更有用、更安全
    analogy: |
      类比培养一个前端新人：
      - **预训练** ≈ 让他把 GitHub 上海量源码和文档都读一遍——见识广，但不知道你们团队要什么。
      - **SFT（指令微调）** ≈ 用大量「需求 → 标准实现」的样板手把手带他。
      - **RLHF（偏好对齐）** ≈ code review 打分：两份实现哪个更好，让他往「被夸的方向」靠。

      **不一样的地方**：新人读文档能记住出处、会说「我不确定」；模型只学到了**统计规律**，知识没有出处，也不会天然地承认不知道。
    why: |
      你不需要会训练模型，但要知道**模型的能力和毛病分别来自哪个阶段**：知识从哪来、为什么有截止日期、为什么会拒答、为什么会「讨好」用户。
      这决定了你遇到问题时是去改 Prompt、做 RAG、换模型，还是真的需要微调——面试官很爱问「你们为什么不微调」。
    problem: |
      一个只做过预训练的「基座模型」只会续写：你问「年假怎么请？」它可能续写出一串类似的问题，而不是回答你。
      后训练（SFT + 偏好对齐）解决的是「**从会续写到会对话、会按要求办事、会拒绝危险请求**」。理解这条链路，才能解释为什么同一模型有 base 和 instruct 两个版本、为什么不同版本风格差异很大。
    principle: |
      **三个阶段（讲到应用开发者需要的程度）**

      ```mermaid
      flowchart LR
        A["海量公开文本与代码"] --> B["预训练 文字接龙"]
        B --> C["基座模型 只会续写"]
        C --> D["SFT 指令与示范回答"]
        D --> E["会按指令回答"]
        E --> F["RLHF 等偏好对齐"]
        F --> G["对话模型 更有用更安全"]
      ```

      | 阶段 | 训练数据 | 带来什么 | 副作用 |
      |---|---|---|---|
      | **预训练** | 万亿级 Token 的网页、书、代码，做下一个 Token 预测（d11-k1） | 语言能力、世界知识、代码能力，**知识基本固化在这一步** | **知识截止**；数据里的错误和偏见也学进去 |
      | **SFT 指令微调** | 大量「指令 → 高质量回答」样例 | 听懂「三句话总结」「输出 JSON」，以回答者身份说话 | 示范数据的风格会被放大 |
      | **偏好对齐（RLHF 等）** | 人或模型对多个回答排序打分 | 更有帮助、更礼貌、会拒绝有害请求 | 可能**讨好**（顺着错误前提说）、**过度拒答**；偏好≠事实正确 |

      SFT 和偏好对齐合称**后训练（post-training）**。推理模型还会在后训练里额外用强化学习练「先思考再回答」（d11-k3）。

      **应用开发者的结论：问题出在哪，就去哪里补**

      - **知识缺失或过时**（公司制度、昨天的告警）→ 用 **RAG / 工具调用**补（Day 21、Day 17），而不是指望模型「知道」。
      - **格式、风格不稳定** → 先改 Prompt（Day 15）和结构化输出（Day 16）。
      - **领域术语、固定风格、Prompt 实在压不住的行为** → 才考虑微调；而且微调不适合注入频繁变化的事实。
      - 业务对话一定用 **instruct / chat 版本**，不要误用 base 模型。
    scenarios: |
      - **技术选型**：领导问「要不要自己微调一个模型学公司文档」，你能说明知识注入优先 RAG，微调适合固定格式、风格和术语。
      - **解释模型行为**：用户反馈模型「拒绝回答正常的消防规范问题」，你能定位到对齐阶段的安全倾向，用 System Prompt 说清业务场景来缓解。
      - **评估开源模型做私有化**：区分 base 和 instruct 版本，问答场景选后者。
    pitfalls: |
      - **误区：微调能把公司文档「教」给模型。** 微调更擅长改变行为和格式；大量事实注入效果不稳定，文档一更新还要重训，RAG 更合适。
      - **误区：RLHF 让模型更「正确」。** 它让输出更符合人类偏好，偏好不等于事实，甚至可能奖励「听起来很自信」的错误回答。
      - **混淆：base 模型与 chat 模型。** 用 base 模型做问答，会出现「把问题续写成更多问题」的现象。
      - **误区：模型知道自己的知识截止日期之后发生了什么。** 它连「现在是哪一年」都不知道，除非你在 Prompt 里告诉它。
    interview_asks:
      - question: "预训练、SFT、RLHF 分别解决什么问题？"
        answer: "预训练让模型从大量文本里学会语言和知识。SFT 用问答示例教会它按指令说话。RLHF 或类似的偏好训练让它更符合人喜欢的回答方式。应用工程师通常是选用模型，不是从头做这三步。"
      - question: "你们的知识库问答为什么用 RAG 而不是微调？"
        answer: "知识在文档里，而且会更新。RAG 检索最新文档再回答，改文档就能生效。微调贵、更新慢，还不能保证不编，也解决不了权限。文档问答默认用 RAG。"
    project_example: |
      **p2 智慧园区运营 Agent**：如果有人提议「把园区设备手册和历史工单拿去微调一个专用模型」，你可以这样拆：
      - 设备手册、消防规范是**会更新的事实** → 走 RAG，回答附出处；
      - 告警数量、工单状态是**实时数据** → 走工具调用查业务库（Day 17、Day 32）；
      - 只有「工单描述必须按园区固定模板写」这种**格式与风格**问题，在 Prompt + 结构化输出（Day 16）压不住时，才值得评估微调。
      这样回答能体现你清楚每个训练阶段解决什么，而不是一听「效果不好」就想到微调。
  - id: d11-k3
    name: 推理模型：先想再答
    level: P1
    summary: 推理模型回答前先生成一段不直接给你看的推理 Token，复杂任务更强，但更慢、更贵、更吃输出额度
    analogy: |
      像浏览器里**你看不见的预检请求（CORS preflight）**：页面上只看到一次请求的结果，但 Network 面板里其实还有额外的往返，**占时间、占带宽**。
      推理模型的推理 Token 也是这样：最终答案只有几句，但背后可能生成了上千个推理 Token，**照样计费、照样占上下文**。

      **不一样的地方**：preflight 是固定开销；推理 Token 的数量**随题目难度和 effort 设置变化**，可能从几百到几万。
    why: |
      当前主流厂商（OpenAI、Anthropic、DeepSeek、通义千问）的旗舰模型都带推理/思考能力，它们的**计费、超时、输出上限、Prompt 写法**都和普通模型不同。
      不理解就会遇到「账单暴涨」「请求超时」「返回空内容却扣了费」。另外中文「推理」一词有两个意思，面试表达时要能分清。
    problem: |
      解决两个实际问题：
      1. **术语沟通**：别人说「推理成本」「推理服务」时，通常指模型调用（Inference）的算力和费用，而不是「推理模型」。
      2. **选型与配置**：什么任务值得用推理模型、思考强度怎么设、输出上限留多少、如何估算多出来的 Token 成本。
    principle: |
      **一、两个「推理」**

      | 中文 | 英文 | 意思 |
      |---|---|---|
      | 推理（调用） | **Inference** | 用训练好的模型算出输出。你每调一次 API 就是一次 Inference，「推理集群」「推理成本」说的是它 |
      | 推理（思考） | **Reasoning** | 模型在回答前先生成一段推理过程，用来拆解问题、尝试思路、自我检查 |

      **二、推理模型怎么工作**

      本质仍是自回归（d11-k1），只是在可见答案之前**多生成了一段推理 Token**。OpenAI 等厂商不返回原始推理全文，DeepSeek、千问的思考模式会通过 `reasoning_content` 字段返回思考内容。

      ```mermaid
      sequenceDiagram
        participant App as 应用后端
        participant M as 推理模型
        App->>M: 指令与问题
        M->>M: 生成推理 Token 拆解与自检
        M-->>App: 可见答案 Token
        M-->>App: usage 含 reasoning_tokens
      ```

      **三、对工程的影响（核对 OpenAI / Anthropic 官方文档，2026-11）**

      - **计费**：推理 Token 不一定可见，但**按输出 Token 计费**，并且**占用上下文窗口**。
      - **输出上限**：OpenAI 的 `max_output_tokens` 限制的是**推理 + 可见输出的总和**。设太小，可能推理还没结束就被截断，返回 `status: incomplete`，**甚至没有任何可见文本却已产生费用**。官方建议刚开始实验时为推理和输出预留至少 25,000 Token。
      - **思考强度**：用参数调节，而不是在 Prompt 里喊「仔细想」。OpenAI 用 `reasoning.effort`（可选值随模型不同，如 none / low / medium / high / xhigh / max）；Anthropic 新模型用自适应思考 + effort；DeepSeek 用 `thinking` 开关和 `reasoning_effort`。
      - **延迟**：第一个可见 Token 到得更晚，网关和前端的超时要单独配置，前端最好显示「正在思考」。
      - **Prompt 写法**：给目标、约束、验收标准即可，不用再写「请一步一步思考」（Day 15 详讲）。

      **四、怎么选**

      - 简单分类、抽取、改写、闲聊 → 普通模型或低 effort，快且便宜。
      - 多步规划、复杂代码、需要权衡的分析、Agent 工具编排 → 推理模型或较高 effort。
      - **用评测集比较效果和成本再决定**（Day 20 讲小型 golden set），不要凭感觉「全切最强的」。
    scenarios: |
      - **成本评估**：估算月费用时必须从 usage 里统计 `reasoning_tokens`，否则预算会严重低估。
      - **超时配置**：推理模型的首个可见 Token 更晚，网关、Nginx、前端的超时要单独放宽。
      - **分级路由**：简单问题走低成本模型，复杂问题再升级到推理模型或更高 effort（Day 19 讲模型路由）。
    pitfalls: |
      - **误区：推理模型返回空 = 模型坏了。** 常见原因是输出上限太小，额度在推理阶段就耗尽，应检查 `status` 和 `incomplete_details`。
      - **误区：看不到推理过程就不收费。** 推理 Token 按输出计费。
      - **混淆：「推理成本」通常指 Inference，而不是 Reasoning。**
      - **误区：所有任务都用最强推理模型更稳。** 延迟和费用可能高出数倍，简单任务效果并不更好。
      - **误区：把思考内容直接展示给用户。** 思考内容可能包含不准确的中间结论，展示前要评估。
    interview_asks:
      - question: "推理模型和普通对话模型有什么区别？你会怎么选？"
        answer: "普通模型直接答。推理模型先在内部多想几步，再给答案，适合数学、复杂规划和多步排错，更慢更贵。提取字段、改写、分类用普通模型就够。"
      - question: "用推理模型时，成本、超时和输出上限要注意什么？"
        answer: "思考过程也算 Token，时间和钱都要按更长来估。超时要留出思考时间，输出上限太小会把答案截断。不要把推理模型用在每一步简单分类上。"
    project_example: |
      **p3 前端 Coding Agent**：「读懂一个 Vue 组件的 bug 并给出修改方案」是典型的多步推理任务，适合推理模型；而「把 ESLint 报错整理成列表」只是格式整理，用普通模型或低 effort 即可。
      设计时可以在 LLM 客户端里按任务类型配置模型和 effort，并把 `reasoning_tokens`、`status` 写进调用日志：
      - `incomplete` 比例升高 → 输出上限给小了；
      - `reasoning_tokens` 占比过高 → 考虑降低 effort 或换模型。
    freshness: |
      核对于 2026-11：OpenAI Reasoning 指南说明推理 Token 占上下文、按输出计费；`max_output_tokens` 包含推理 Token，达到上限返回 status=incomplete、reason=max_output_tokens，可能没有可见输出却已计费；建议实验初期预留至少 25,000 Token；`reasoning.effort` 可选值随模型而异（none/minimal/low/medium/high/xhigh/max）。Anthropic 文档：Claude 4.6 及之后模型用自适应思考（adaptive thinking），部分最新模型思考始终开启，`budget_tokens` 在 Claude 4.7 及以后会报 400。DeepSeek 文档：思考模式用 `thinking` 开关与 `reasoning_effort`，思考内容在 `reasoning_content` 返回。参数随版本变化，以各家最新文档为准。
    sources:
      - {title: "OpenAI Docs - Reasoning models", url: "https://developers.openai.com/api/docs/guides/reasoning"}
      - {title: "Anthropic Docs - Prompting best practices（thinking 部分）", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}
      - {title: "DeepSeek API Docs - Thinking Mode", url: "https://api-docs.deepseek.com/guides/thinking_mode"}
  - id: d11-k4
    name: 能力边界与幻觉
    level: P0
    summary: 模型追求「像真的」而不是「是真的」；它不知道训练之后的事和你的私有数据，也不擅长精确计算和自我核验
    analogy: |
      幻觉很像 TypeScript 里的 **`as any` 断言**：编译通过、看起来一切正常，运行时才发现字段根本不存在。
      模型的回答也是「语法上通顺、格式上漂亮」，但**通顺不代表事实正确**。

      **不一样的地方**：`as any` 至少是你主动写的，代码审查能看到；幻觉是模型**自己产生的、语气还很自信**，必须靠系统层面的证据和校验才能发现。
    why: |
      企业 AI 应用最大的事故来源就是**把模型输出当事实**：编造制度条款、编造接口参数、编造告警数量、编造引用。
      作为 AI 应用开发工程师，你的核心价值之一是**在系统层面兜住模型的能力边界**，而不是写个漂亮的 Prompt 祈祷它不出错。面试官非常看重这种「不信任模型」的工程意识。
    problem: |
      要回答的是：**什么问题可以直接交给模型，什么问题必须由检索、工具、规则或人来兜底**。
      不清楚边界就会出现：问「今天 3 号楼有几条告警」模型报一个数；问「我们公司年假几天」模型按常识编；让它算账差了几位；让它自查答案它说「没问题」。
    principle: |
      **一、幻觉：自信地输出不真实的内容**

      成因可以从三层理解：

      1. **机制层面**：模型按「最可能的续写」生成（d11-k1）。没有可靠知识时，概率分布依然会给出一个**看起来通顺**的 Token，它不会自动停下来说不知道。
      2. **训练与评测层面**：OpenAI 2025 年的研究指出，主流评测只看「答对率」，**瞎猜比说『不知道』得分更高**，模型因此被鼓励在不确定时猜。
      3. **数据层面**：低频事实（某个小公司的规章、某个冷门库的参数）在训练数据里出现太少，模型「记得大概样子」却记不准；私有数据则根本没见过。

      常见形态：编造事实、编造引用和链接、编造 API 参数、**顺着用户的错误前提继续推理**（「为什么 Vue 4 取消了 ref？」）。

      **二、知识截止**

      - 预训练数据有截止日期，之后的事模型不知道。不同模型截止日期不同，**以官方模型页为准**（OpenAI 模型页对每个模型都列出 Knowledge cutoff）。
      - 更隐蔽的是：模型**不知道「现在」是什么时候**，会把截止前的「最新版本」当成现在的最新——这正是 AI 写代码常用过时 API 的原因之一。
      - 企业私有数据（内部制度、设备台账、客户数据）从来不在训练集里，对模型来说**永远是「截止之后」**。

      **三、其他典型短板**

      | 短板 | 表现 | 交给谁 |
      |---|---|---|
      | 精确计算与计数 | 多位数运算、数字符个数出错（与分词有关，Day 13） | 代码或工具 |
      | 自我核验 | 让它检查自己的答案，常常只会「确认」 | 外部证据、规则校验 |
      | 实时数据 | 库存、告警、汇率只能编 | 工具调用（Day 17） |
      | 长上下文 | 中间信息容易被忽略（Day 13） | 精简上下文、检索 |
      | 一致性 | 同问不同答 | 结构化输出 + 校验（Day 16） |

      **四、应用层的应对：系统兜底，而不是只靠 Prompt**

      ```mermaid
      flowchart TD
        Q["用户问题"] --> R{"需要事实或实时数据吗"}
        R -->|"私有或最新知识"| S["RAG 检索证据 Day 21"]
        R -->|"实时数据或计算"| T["工具调用 Day 17"]
        R -->|"开放创作"| U["直接生成"]
        S --> V["要求基于证据回答并给引用"]
        T --> V
        V --> W["输出校验 格式与规则"]
        U --> W
        W --> X{"证据不足或校验失败"}
        X -->|"是"| Y["明确告知不确定或转人工"]
        X -->|"否"| Z["返回答案"]
      ```

      - **给证据**：RAG 注入原文，要求「只依据给定资料回答，资料里没有就说明」（Day 27）。
      - **给工具**：日期、告警数、库存、计算交给 API 或代码。
      - **要引用**：回答带来源编号，前端可点开核对。
      - **做校验**：结构化输出 + Pydantic 校验，关键数字与数据库比对。
      - **留退路**：证据不足时拒答或转人工。

      **不这样做会怎样**：在 System Prompt 写「不要编造」能减少一部分幻觉，但**不能消除**；没有证据和校验的系统，上线后一定会出现编造内容，而且语气非常自信。
    scenarios: |
      - **企业制度问答**：必须用 RAG 提供制度原文，回答引用条款编号；没检索到就回复「未找到相关制度」。
      - **运营数据助手**：告警数、客流量一律来自 SQL 或接口查询结果，模型只负责解释，不负责「记住」或「算」。
      - **AI 编程辅助**：生成的代码涉及第三方库时，以官方文档核对 API 是否存在、是否过时。
      - **客服机器人**：退款金额、订单状态必须来自业务接口，不能来自模型自由生成。
    pitfalls: |
      - **误区：Prompt 里写「不知道就说不知道」就能解决幻觉。** 模型并不总能意识到自己不知道，只能缓解。
      - **误区：模型说「我确定」就可信。** 语气自信程度与正确率没有可靠关系。
      - **误区：换更大的模型就没有幻觉。** 更强的模型幻觉率通常更低，但不会为零；私有知识它根本不可能知道。
      - **误区：知识截止只影响新闻类问题。** 它同样影响技术问题：库版本、API 写法、价格、模型列表都会过时。
      - **混淆：幻觉与检索失败。** RAG 答错可能是没检索到（检索问题），也可能是检索到了没用好（生成问题），排查方法不同（Day 29）。
    interview_asks:
      - question: "什么是幻觉？为什么会产生？你在项目中怎么减少幻觉？"
        answer: "幻觉是说得像真的，但没有依据。模型的目标是接下一句，不是查证。减少办法是给它检索到的资料、要求只根据资料答、答不上就拒答，并用评测看它有没有编。"
      - question: "模型的知识截止会给应用带来哪些问题？怎么解决？"
        answer: "截止日期之后的价格、制度、人事，模型训练时没见过，会用旧知识编。解决是把新事实放进检索或工具，不让它凭记忆回答会变的事实。"
      - question: "哪些任务你不会直接交给 LLM 做？为什么？"
        answer: "精确计算、权限判断、支付和库存扣减、必须稳定一致的规则。这些要代码做。模型可以提出参数，对不对由代码校验和执行。"
    project_example: |
      **p1 企业知识库问答** 的整条链路，本质上就是在给幻觉兜底：
      1. 只依据检索到的文档片段回答，每句结论带引用编号（Day 27）；
      2. 检索相关度低于阈值时直接回复「知识库中未找到」，并记录这个问题用于补文档；
      3. 用评测集统计「有依据的回答比例」（Day 29），用数字证明系统可信。
      **p2 智慧园区运营 Agent** 则是另一类：告警数、工单状态全部走工具查询，模型只做意图理解和组织语言。
    freshness: |
      核对于 2026-11：OpenAI 文章《Why language models hallucinate》（2025-09）指出以答对率为主的评测会奖励猜测；OpenAI 模型页为每个模型列出 Knowledge cutoff（例如 GPT-6 Astra 为 2026-04-30）。
    sources:
      - {title: "OpenAI - Why language models hallucinate", url: "https://openai.com/index/why-language-models-hallucinate/"}
      - {title: "OpenAI Docs - Models（含 knowledge cutoff）", url: "https://developers.openai.com/api/docs/models"}
test:
  - id: d11-t1
    kp: d11-k1
    type: single
    question: "模型针对一个问题生成了 200 个 Token 的回答。关于生成过程，哪项描述最准确？"
    options:
      - "模型大约循环 200 次，每次预测 1 个 Token 并接回输入"
      - "模型先在内部写好 200 个 Token 的草稿，再一次性返回"
      - "循环次数等于输入 Token 数，与回答长度基本无关"
      - "模型每次生成一整句，所以循环次数等于句子数"
    answer: [0]
    explain: |
      自回归生成：每一步根据已有序列预测下一个 Token，追加回去再预测，生成 200 个 Token 大约 200 步。
      B 以为有整段草稿；C 混淆了输入处理（可并行）和输出生成（必须串行）；D 错在最小生成单位是 Token 而不是句子。
  - id: d11-t2
    kp: d11-k1
    type: single
    question: "下面这段伪代码演示了大模型的生成循环。关于它，哪个说法是正确的？"
    code: |
      def generate(model, tokens, max_new=50, eos_id=0):
          for _ in range(max_new):
              probs = model.next_token_probs(tokens)   # 整个词表的概率分布
              nxt = sample(probs, temperature=0.8)      # 按概率抽一个
              if nxt == eos_id:
                  break
              tokens.append(nxt)
          return tokens
    options:
      - "同样的 tokens 调两次 generate，结果一定完全相同"
      - "模型在 next_token_probs 里已经决定了选哪个 Token"
      - "生成 N 个新 Token 大约要调用 next_token_probs N 次"
      - "max_new 只限制输入长度，不影响输出长度"
    answer: [2]
    explain: |
      循环每次只追加 1 个 Token，所以生成 N 个就要调用约 N 次模型，这就是输出越长越慢的原因。
      A 错：sample 按概率抽样且 temperature 不为 0，结果会不同；B 错：模型只输出概率分布，选哪个由 sample 决定；D 错：max_new 正是输出长度上限。
  - id: d11-t3
    kp: d11-k1
    type: judge
    question: "用户在第 2 轮说「就按刚才那个方案」，模型能理解，是因为模型在两次 API 调用之间记住了第 1 轮的内容。"
    answer: false
    explain: |
      模型本身无状态，两次调用之间不保留任何东西。它能理解「刚才」，只是因为后端（或产品层）在第 2 次请求里把第 1 轮的问答又发了一遍。
      如果后端没带历史，模型根本不知道「刚才那个方案」是什么。
  - id: d11-t4
    kp: d11-k1
    type: multi
    question: "下列哪些现象可以直接用「逐 Token 自回归生成」来解释？"
    options:
      - "回答可以边生成边通过 SSE 推给前端"
      - "同样的输入长度下，输出越长总耗时越长"
      - "模型能准确说出公司内部的制度条款"
      - "先给出的结论错了，后面的解释会为错误结论找理由"
    answer: [0, 1, 3]
    explain: |
      A：逐个生成，所以可以逐个推送；B：输出必须串行生成，越长越慢；D：已输出的 Token 成为后续前提，不会回头修改。
      C 与生成机制无关，而且模型不可能知道私有制度，这是能力边界问题（d11-k4），需要 RAG 提供证据。
  - id: d11-t5
    kp: d11-k2
    type: single
    question: "团队想让模型掌握每月都会更新的设备维保手册，以便回答运维人员提问。最合理的首选方案是？"
    options:
      - "用维保手册做一次 SFT 微调，每月重训一次"
      - "检索手册相关片段放进 Prompt，让模型依据原文回答"
      - "在 System Prompt 里写「你是熟悉维保手册的专家」"
      - "换一个参数量更大、知识更多的基座模型"
    answer: [1]
    explain: |
      频繁更新的事实性知识首选 RAG：检索原文注入上下文，更新文档即可生效，还能给出出处。
      A 微调不擅长稳定注入事实，且每月重训成本高；C 只设定角色，模型仍然没见过手册；D 基座模型更大也不可能见过企业私有文档。
  - id: d11-t6
    kp: d11-k2
    type: multi
    question: "关于预训练与后训练，以下哪些说法正确？"
    options:
      - "模型的大部分世界知识来自预训练阶段"
      - "SFT 让模型学会理解并执行「输出 JSON」「三句话总结」这类指令"
      - "RLHF 优化的是人类偏好，偏好并不等于事实正确"
      - "只做过预训练的基座模型最适合直接做客服问答"
    answer: [0, 1, 2]
    explain: |
      A、B、C 正确：预训练积累知识，SFT 教会按指令回答，RLHF 让输出更符合偏好但不保证事实，甚至可能奖励自信的错误回答。
      D 错：基座模型只会续写，常把问题续写成更多问题，业务对话应选 instruct/chat 版本。
  - id: d11-t7
    kp: d11-k2
    type: judge
    question: "模型「知识截止」的根源在预训练阶段：训练数据有截止时间，之后的事件没有进入模型参数。"
    answer: true
    explain: |
      模型的知识主要在预训练时固化进参数，训练语料截止于某个时间点，之后发生的事模型不知道。
      后训练主要改变行为和风格，不会系统性补充新知识，所以最新信息要靠 RAG 或工具在调用时提供。
  - id: d11-t8
    kp: d11-k2
    type: single
    question: "用户问「为什么 Python 4 取消了 GIL？」，模型没有指出 Python 4 并不存在，而是顺着问题编了一段原因。这种「顺着用户说」的倾向，最可能和哪个阶段有关？"
    options:
      - "预训练数据里大量出现了 Python 4 的资料"
      - "分词器把 Python 4 切成了错误的 Token"
      - "偏好对齐让模型倾向于给出让提问者满意的回答"
      - "推理模型的思考 Token 被截断导致的"
    answer: [2]
    explain: |
      偏好对齐以人类偏好为目标，可能让模型倾向「讨好」，顺着错误前提给出看似满意的回答，再叠加按最可能续写的机制，就形成了这种幻觉。
      A 不成立（Python 4 并未发布）；B 分词不会导致接受错误前提；D 与思考截断无关，普通模型同样会出现。
  - id: d11-t9
    kp: d11-k3
    type: single
    question: "同事把一个分析任务切到推理模型，`max_output_tokens` 仍保持 300。上线后不少请求返回的文本为空，但账单上有输出 Token 费用。最可能的原因是？"
    options:
      - "推理模型不支持中文，遇到中文就返回空"
      - "推理 Token 也计入输出上限，额度在推理阶段就耗尽了"
      - "空文本说明请求失败，账单上的费用是计费系统误差"
      - "推理模型必须开启流式输出才会返回文本"
    answer: [1]
    explain: |
      推理模型先生成推理 Token，它们按输出计费并计入 max_output_tokens。上限设得太小，推理还没结束就被截断，status 为 incomplete，可见文本为空但费用已产生。
      A、D 没有依据；C 错在把 incomplete 当成计费误差，实际上 Token 确实生成并计费了。
  - id: d11-t10
    kp: d11-k3
    type: judge
    question: "技术文档里说的「推理成本」「推理服务」，通常指模型调用（Inference）所需的算力和费用，而不专指推理模型的思考能力。"
    answer: true
    explain: |
      Inference 指用训练好的模型计算输出，每次 API 调用都是一次 Inference，「推理成本」通常指这部分算力与 Token 费用。
      推理模型的思考能力是 Reasoning，中文同样叫推理，阅读和面试时要按上下文区分，必要时说英文原词避免歧义。
  - id: d11-t11
    kp: d11-k3
    type: multi
    question: "以下哪些任务比较值得使用推理模型或较高的 effort？"
    options:
      - "根据报错日志和多个文件定位一个 Vue 组件的逻辑 bug"
      - "把用户留言按 5 个固定标签分类，只输出标签"
      - "为一次园区设备迁移制定分步骤计划并权衡风险"
      - "把一段中文通知翻译成英文"
    answer: [0, 2]
    explain: |
      A 需要跨文件多步推理，C 需要规划与权衡，属于推理模型擅长的复杂任务。
      B、D 是定义清晰的简单任务，普通模型或低 effort 就够了，换推理模型只会更慢更贵，效果未必更好。
  - id: d11-t12
    kp: d11-k3
    type: single
    question: "下面的代码调用推理模型做分析。从工程角度看，最需要补上的是哪一处？"
    code: |
      from openai import OpenAI

      client = OpenAI()
      resp = client.responses.create(
          model="gpt-6-astra",
          reasoning={"effort": "high"},
          input=report_text,
          max_output_tokens=500,
      )
      return resp.output_text
    options:
      - "把 effort 改成 max，让模型想得更充分"
      - "删掉 reasoning 参数，让模型自己决定是否思考"
      - "把 input 改成 messages，Responses API 不支持字符串输入"
      - "检查 resp.status 是否为 incomplete，并放宽输出上限"
    answer: [3]
    explain: |
      高 effort 下推理 Token 可能远超 500，推理阶段就耗尽额度，status 变成 incomplete、output_text 为空，代码却直接返回空串。应检查状态并放宽上限。
      A 会让问题更严重；B 回避了问题且失去对思考强度的控制；C 错误，Responses API 的 input 支持字符串。
  - id: d11-t13
    kp: d11-k4
    type: judge
    question: "只要在 System Prompt 中写明「不知道就回答不知道，禁止编造」，就能从根本上消除模型幻觉。"
    answer: false
    explain: |
      这类指令只能缓解。模型按最可能的续写生成，并不总能意识到自己不知道；训练评测方式也鼓励猜测。
      根本手段在系统层：提供检索证据、用工具取实时数据、要求引用、做输出校验，并在证据不足时拒答或转人工。
  - id: d11-t14
    kp: d11-k4
    type: single
    question: "园区运营助手直接调用大模型（没接任何业务接口）。运营问「3 号楼现在有几条未处理告警」，助手答「目前有 4 条」。这个回答的根本问题是？"
    options:
      - "Prompt 没有要求模型回答得更谨慎"
      - "模型参数量太小，换旗舰模型就能答对"
      - "实时业务数据不在模型里，它只能按续写编一个数"
      - "模型的知识截止日期太早，需要换新版本"
    answer: [2]
    explain: |
      告警数量是实时私有数据，模型无论多新多大都不可能知道，只能生成一个通顺的数字，这是能力边界问题，应通过工具调用查业务库。
      A 只能缓解语气；B 换模型仍拿不到数据；D 知识截止针对公开知识，实时私有数据永远在截止之后，换版本也没用。
  - id: d11-t15
    kp: d11-k4
    type: multi
    question: "以下哪些是从系统层面控制幻觉的有效手段？"
    options:
      - "让同一个模型再读一遍自己的答案，回答「是否正确」"
      - "检索原文注入上下文，要求回答附引用编号"
      - "数字和状态类信息通过工具查询业务系统"
      - "检索相关度低于阈值时明确告知未找到或转人工"
    answer: [1, 2, 3]
    explain: |
      B 提供证据并可核对；C 让实时数据来自系统而不是模型；D 为证据不足留退路，这些都是系统兜底。
      A 不可靠：模型自我核验常常只会确认自己，缺少外部证据时无法发现错误。
  - id: d11-t16
    kp: d11-k4
    type: judge
    question: "用 AI 生成调用第三方 SDK 的代码时出现已废弃的 API，部分原因是模型不知道「现在」是什么时候，把训练截止前的写法当成了最新写法。"
    answer: true
    explain: |
      模型知识固化在训练截止时，它也不知道当前日期，会把截止前常见的写法当成最新最佳实践。
      所以涉及库版本和 API 的代码要用官方文档核对，Coding Agent 也应把最新文档或仓库上下文提供给模型。
exam:
  - id: d11-e1
    kp: d11-k1
    type: single
    question: "产品要求「同一个问题，助手每次必须给出完全相同的答案」。基于生成机制，哪种方案最可靠？"
    options:
      - "把 temperature 设为 0，就能保证每次逐字相同"
      - "在 Prompt 里强调「每次请用完全相同的措辞回答」"
      - "改用推理模型，让它先想清楚再回答以保证一致"
      - "标准问题走答案库或缓存，模型只负责理解和改写"
    answer: [3]
    explain: |
      模型按概率抽样，即使降低随机性，服务端也不保证逐字一致。确定性内容应由代码和数据给出：标准问题命中答案库或缓存直接返回，模型只做意图理解。
      A 只能降低随机性；B 无法约束抽样；C 推理模型同样是抽样生成，不保证一致。
  - id: d11-e2
    kp: d11-k2
    type: single
    question: "售后工单分类系统输出的标签经常不在 12 个规定标签之内，团队提议微调。最合理的第一步是？"
    options:
      - "直接收集上万条历史工单做 SFT 微调"
      - "先用枚举约束的结构化输出加示例，评测后再决定是否微调"
      - "把 12 个标签写进知识库，用 RAG 检索后再分类"
      - "换成推理模型并把 effort 调到最高"
    answer: [1]
    explain: |
      这是格式与约束问题，不是知识问题。先用 Prompt 示例 + 枚举约束的结构化输出（Day 16）解决，用评测集验证，仍不达标再考虑微调。
      A 成本高且跳过了更便宜的方案；C 标签只有 12 个，直接写进 Prompt 即可，不需要检索；D 增加成本却没有针对格式约束。
  - id: d11-e3
    kp: d11-k3
    type: single
    question: "对一个日均 10 万次调用的客服系统做成本预算时，同事只用「输入 Token + 可见回答 Token」估算，模型是推理模型。这个预算最大的问题是？"
    options:
      - "漏算了推理 Token，它们按输出计费且可能远多于可见回答"
      - "没有考虑推理模型的输入 Token 价格是普通模型的十倍"
      - "推理模型按调用次数计费，不按 Token 计费"
      - "可见回答 Token 不计费，只有推理 Token 计费"
    answer: [0]
    explain: |
      推理模型的推理 Token 虽不可见，但按输出 Token 计费，数量随问题难度和 effort 变化，可能是可见回答的数倍，必须从 usage 的 reasoning_tokens 统计。
      B 价格倍数是编造的；C、D 都与实际计费方式不符：输入、输出（含推理）都按 Token 计费。
  - id: d11-e4
    kp: d11-k4
    type: single
    question: "知识库问答上线后，用户反馈「明明文档里写了，助手却回答错了」。在排查前，你首先要区分的是？"
    options:
      - "模型的 temperature 是否设置得过高"
      - "是没检索到相关片段，还是检索到了但生成时没用好"
      - "是不是用户的问题措辞不够专业"
      - "模型的知识截止日期是否早于文档发布日期"
    answer: [1]
    explain: |
      RAG 答错有两大类根因：检索没召回相关片段（检索问题），或片段在上下文里但模型没用好、甚至编造（生成问题），排查和修复方向完全不同（Day 29）。
      A 是次要因素；C 把问题推给用户；D 不相关：RAG 正是在调用时提供文档，不依赖模型的训练知识。
  - id: d11-e5
    kp: d11-k1
    type: multi
    question: "你在设计一个合同条款解读接口。哪些设计决策直接源于「逐 Token 自回归 + 模型无状态」这两个特性？"
    options:
      - "接口采用流式返回，前端逐字渲染"
      - "后端按会话保存历史，并在每次请求时拼回去"
      - "合同原文入库前做 OCR 和清洗"
      - "按输出长度单独设置较长的超时时间"
    answer: [0, 1, 3]
    explain: |
      A：逐 Token 生成才能流式推送；B：模型无状态，多轮记忆靠后端重发历史；D：输出串行生成，越长越慢，超时要按输出长度估计。
      C 是文档处理环节（Day 22）的需要，与生成机制无关。
  - id: d11-e6
    kp: d11-k4
    type: multi
    question: "以下哪些任务你不应该直接交给模型「凭自己的知识」完成？"
    options:
      - "统计本月各园区告警数并计算环比"
      - "回答员工「试用期能不能请年假」"
      - "把一段口语化的通知改写得更正式"
      - "告诉用户某个 npm 包最新版本的配置写法"
    answer: [0, 1, 3]
    explain: |
      A 是实时数据加精确计算，应交给 SQL 或代码；B 是公司私有制度，必须 RAG 提供原文；D 受知识截止影响，必须查官方文档。
      C 是纯语言改写，属于模型擅长的任务，可以直接生成。
  - id: d11-e7
    kp: d11-k3
    type: judge
    question: "推理模型的推理 Token 即使没有返回给你，也会占用上下文窗口，并在多轮对话或工具调用中影响可用的上下文空间。"
    answer: true
    explain: |
      OpenAI 和 Anthropic 文档都说明推理/思考 Token 计入上下文窗口；部分模型在后续轮次还会保留之前的思考内容。
      所以用推理模型时，上下文预算和输出上限都要为推理 Token 预留空间，不能只按可见内容计算。
  - id: d11-e8
    kp: d11-k2
    type: judge
    question: "既然偏好对齐让模型更安全，那么在 System Prompt 里写明「不得透露其他租户数据」，就可以替代后端的租户数据隔离。"
    answer: false
    explain: |
      对齐和 Prompt 只提高模型「遵守规则」的概率，不是安全边界，用户仍可能通过提示注入绕过（Day 45）。
      数据隔离必须在检索和工具层按租户过滤，模型根本拿不到其他租户的数据，才算真正的隔离。
  - id: d11-e9
    kp: d11-k4
    type: case
    question: |
      某智慧园区上线了一个「运营问答助手」，实现方式是：前端把运营人员的问题直接发给大模型，System Prompt 写着「你是园区运营专家，回答要专业、肯定、简洁」。
      上线一周出现两类投诉：一是问「B 区今天客流多少」时助手给出了具体人数，但和客流系统对不上；二是问「消防栓多久巡检一次」时助手给出的周期和园区制度不一致。
      负责人准备把模型升级到更强的旗舰版来解决。最合理的判断和做法是？
    options:
      - "升级旗舰模型即可，更强的模型幻觉更少、知识更全"
      - "把 System Prompt 改成「不确定时请说明不知道」，并保持现有架构"
      - "客流走工具查询客流系统，制度走 RAG 引用原文，并去掉要求「肯定」的措辞"
      - "把客流历史数据和园区制度整理后做一次微调"
    answer: [2]
    explain: |
      两类问题都超出模型能力边界：客流是实时数据，必须工具查询；园区制度是私有知识，必须 RAG 提供原文并引用。Prompt 要求「肯定」还会放大幻觉，应去掉。
      A 换模型拿不到实时和私有数据；B 只能缓解；D 实时数据无法靠微调获得，制度更新还要重训。
interview:
  - id: d11-i1
    kp: d11-k1
    type: oral
    difficulty: 2
    question: "请用你自己的话讲讲：大模型是怎么一步步生成一段回答的？这个机制对你设计 AI 应用的接口有什么影响？"
    key_points:
      - {text: "说明 LLM 本质是下一个 Token 的概率预测，选哪个由采样策略决定", dim: concept}
      - {text: "讲清自回归循环：预测分布、采样、追加回输入，直到结束符或长度上限", dim: principle}
      - {text: "推导出工程特性：可流式输出、输出越长越慢、同问不同答、不会回头修改", dim: principle}
      - {text: "说明模型无状态，多轮对话由后端保存并重发历史", dim: concept}
      - {text: "结合项目说明接口设计：SSE 流式、控制输出长度、后端管理会话", dim: project}
    reference: |
      大模型是在海量文本上训练出的神经网络，核心任务只有一个：**给定前面的 Token，预测下一个 Token 的概率分布**。选哪个 Token 由采样策略决定，比如按概率抽样并用 temperature 调节随机性。
      生成是**自回归**的：输入切成 Token，模型算出下一个 Token 的分布，抽一个追加到末尾，再预测下一个，直到生成结束符或达到输出上限。
      这个机制决定了几个工程特性：
      1. 天然可以**流式输出**，所以对话接口应走 SSE；
      2. 输出必须串行生成，**越长越慢**，输出单价通常也更高，所以要控制输出长度、按输出长度设超时；
      3. 每步抽样带来随机性，**同问不同答**是正常的，确定性逻辑要放到代码里；
      4. 已输出的 Token **不会回头改**，所以复杂回答可以「先列要点再展开」；
      5. 模型**无状态**，多轮记忆靠后端保存历史并在每次请求时带上。
      另外它学到的是「最像训练数据的续写」而不是事实，这也是幻觉的根源。
    oral: |
      我理解大模型本质上是一个「下一个 Token 预测器」：给它前文，它输出下一个 Token 的概率，选一个接上，再继续预测，一直循环到结束符或长度上限。
      这个机制直接影响我做接口设计。第一，它是逐个生成的，所以我在知识库问答里默认用 SSE 流式返回，前端逐字渲染；第二，输出越长越慢越贵，我会要求它先给一句结论加引用编号再展开，并按输出长度设超时；第三，它是无状态的，会话历史由后端按 session 保存，每轮拼回去，前端只传本轮问题。
      另外因为它追求的是「像真的」，所以事实类内容我一定配检索或工具兜底。
  - id: d11-i2
    kp: d11-k4
    type: scenario
    difficulty: 3
    question: |
      你负责的智慧园区运营助手上线后，运营反馈两个问题：
      1. 问「今天 3 号楼有几条未处理告警」，助手给了一个具体数字，和告警系统对不上；
      2. 问「电梯维保周期是多久」，助手给的周期和园区制度不一致，语气还很肯定。
      请分析原因，并说明你会怎么整改、怎么证明整改有效。
    key_points:
      - {text: "指出告警数是实时私有数据，模型不可能知道，只能按续写编一个数", dim: principle}
      - {text: "指出维保制度是私有知识，模型按常见说法生成，属于典型幻觉", dim: principle}
      - {text: "整改：告警类走工具调用查业务接口，模型只负责组织语言", dim: engineering}
      - {text: "整改：制度类走 RAG 并要求引用条款，检索不到时明确告知或转人工", dim: engineering}
      - {text: "用真实问题构建评测集回归，并对数字类回答做规则校验或抽检", dim: project}
    reference: |
      **原因**：两类问题都超出了模型能力边界。
      - 告警数量是**实时私有数据**，模型训练时不可能见过，也没有任何获取途径，它只是按「最像回答的续写」生成了一个通顺的数字。
      - 维保周期是**园区私有制度**，模型按训练数据里常见的说法生成，属于典型幻觉；Prompt 如果要求「专业、肯定」，还会放大自信语气。
      换更大的模型解决不了，因为问题不是能力不够，而是**数据根本不在模型里**。

      **整改**：
      1. **意图分流**：先判断问题类型，实时数据类走工具调用，制度类走 RAG。
      2. **工具调用**：模型识别意图并提取楼栋、状态等参数，后端调用告警接口拿真实数据，模型只负责把结果组织成语言（Day 17）。
      3. **RAG**：制度文档切片入库，回答只依据检索到的原文并标注条款出处；相关度不足时回复「未在现行制度中找到」并给出负责人。
      4. **校验与兜底**：回答里的数字必须来自工具返回值，可以做一致性比对；去掉 Prompt 里「肯定」之类会放大幻觉的措辞。

      **证明有效**：收集运营真实问题，标注标准答案，做成小型评测集，整改前后各跑一遍，对比数字正确率和有依据回答比例；上线后抽检并收集「答错」反馈，持续补充评测集。
    oral: |
      我会先说结论：这两个问题都不是模型不够聪明，而是数据根本不在模型里。告警数是实时数据，模型只能编一个通顺的数字；维保周期是园区自己的制度，模型按常见说法回答，就是幻觉。所以换更大的模型没用。
      整改我会做意图分流：实时数据类走工具调用，后端查告警接口，模型只负责组织语言；制度类走 RAG，只依据检索到的原文回答并标注条款，查不到就明确说没找到。同时把 Prompt 里要求「语气肯定」的话去掉。
      证明效果我会拿运营的真实问题做一个小评测集，整改前后各跑一遍，对比数字正确率和有引用的回答比例，上线后再抽检，具体数字用评测结果说话。
  - id: d11-i3
    kp: d11-k3
    type: scenario
    difficulty: 3
    question: "老板看到推理模型的宣传，要求「把我们所有的大模型调用都切到最强的推理模型，效果肯定更好」。你会怎么回应？如果确实要用，上线时要注意哪些问题？"
    key_points:
      - {text: "说明推理模型先生成推理 Token，复杂任务更强，但更慢更贵", dim: concept}
      - {text: "说明推理 Token 按输出计费并占上下文，输出上限包含推理 Token", dim: principle}
      - {text: "提出按任务复杂度分级：简单任务用普通模型或低 effort，复杂任务才升级", dim: engineering}
      - {text: "用评测集对比效果、成本、延迟后再决定，而不是凭感觉", dim: project}
      - {text: "上线注意：检查 incomplete 状态、单独放宽超时、监控 reasoning_tokens", dim: engineering}
    reference: |
      我不会直接全量切换，而是先说清代价，再用数据决策。
      **推理模型的特点**：回答前会先生成一段推理 Token，复杂的多步任务（规划、跨文件定位 bug、权衡分析）效果更好；但推理 Token **按输出计费、占上下文**，首个可见 Token 更晚，简单任务效果未必提升，成本和延迟却明显上升。
      **我的做法**：
      1. **按任务分级**：把现有调用按类型分组，比如分类、抽取、改写属于简单任务，保留普通模型或低 effort；规划、复杂分析、Agent 工具编排才候选推理模型。
      2. **评测再决定**：每类任务准备一个小评测集，对比效果、平均成本、P95 延迟，用数据给老板一个「哪些值得切」的结论。
      3. **上线注意事项**：输出上限要为推理 Token 预留足够空间（OpenAI 建议实验初期至少 25,000），并检查 `status` 是否为 `incomplete`，否则会出现空回答却计费；网关、前端超时单独放宽，前端显示「正在思考」；监控里单列 `reasoning_tokens` 和 incomplete 比例；effort 参数按任务调节，而不是一律最高。
    oral: |
      我会先肯定方向，但不建议一刀切。推理模型回答前会先生成一段看不见的推理 Token，复杂任务确实更强，但这些 Token 按输出计费、还更慢，像分类、改写这种简单任务效果基本不会更好，钱和延迟却上去了。
      所以我会把现有调用按任务分级，每类准备一个小评测集，对比效果、成本和延迟，用数据告诉老板哪些值得切。真要上线，我会注意三点：输出上限给推理留足空间并检查 incomplete 状态，不然会出现空回答还扣费；超时单独放宽，前端提示正在思考；监控里单列 reasoning tokens，effort 按任务调，不是一律最高。
