day: 13
phase: 2
title: Token 与上下文窗口
goals:
  - 能解释 Token 和 BPE 分词的原理，说明为什么不能用字数换算 Token，并知道怎么准确计数
  - 能按输入、输出、推理、缓存分别估算一次请求和一个月的费用，并指出主要的降本杠杆
  - 能说清上下文窗口里装了哪些东西，为多轮对话或长任务设计按优先级、按完整单元的截断策略
  - 能解释 lost in the middle 与 context rot，回答「百万上下文了还要不要 RAG」，并据此安排 Prompt 布局
minutes: 60
