knowledge_points:
  - id: d13-k1
    name: 分词：Token 与 Tokenizer
    level: P0
    summary: Token 是模型处理文本的最小单位，由 BPE 等算法把文本切成词表里的片段；同一段文字的 Token 数取决于具体的 tokenizer
    analogy: |
      很像 **gzip 这类字典压缩**：统计哪些片段最常一起出现，把它们合并成一个短码。高频片段一个码搞定，罕见内容拆成多个小码。
      BPE 也是这样：常见的词或字组合是 1 个 Token，生僻词、乱码、长数字串会被拆成很多个。

      **不一样的地方**：gzip 的字典随文件生成；tokenizer 的词表是**训练模型时就固定的**，每个模型（甚至同一厂商的不同代）可能不同，而且 Token 数**直接决定计费和上下文占用**。
    why: |
      **计费、上下文上限、速率限制、输出长度**全部以 Token 计，而不是字数。不会算 Token，你就没法估算成本、没法判断请求会不会超长、没法解释「为什么模型数不清字母」。
      中文应用尤其要注意：同一句中文在不同 tokenizer 下 Token 数可能差将近一倍。
    problem: |
      模型只能处理数字，需要一种方法把任意文本（中文、英文、代码、emoji）稳定地切成有限词表里的片段。
      按字切：序列太长、效率低；按词切：词表爆炸，遇到新词就没法表示。BPE 这类**子词（subword）**方法在两者之间折中：常见片段合成一个 Token，罕见内容拆成更小片段，任何文本都能表示。
    principle: |
      **一、BPE（Byte Pair Encoding）的直觉**

      1. 从最小单位开始。现代 tokenizer 多从 **UTF-8 字节**开始，所以任何文字、符号、emoji 都能处理。
      2. 统计训练语料里最常相邻出现的一对片段，合并成一个新 Token 加入词表。
      3. 不断重复，直到词表达到预定大小（例如约 10 万、20 万个）。

      结果：高频词是 1 个 Token；低频词被拆成多段。

      ```mermaid
      flowchart LR
        A["原始文本"] --> B["转为 UTF-8 字节"]
        B --> C["按合并规则反复合并相邻片段"]
        C --> D["得到 Token 片段序列"]
        D --> E["查词表得到 Token ID 列表"]
        E --> F["送入模型"]
        F --> G["模型输出 Token ID"]
        G --> H["解码回文本"]
      ```

      **二、实测：中英文差异（tiktoken 0.14.0 本地实测，2026-11）**

      | 文本 | 字符数 | cl100k_base | o200k_base |
      |---|---|---|---|
      | 大语言模型的上下文窗口有限，需要做截断。 | 20 | 22 | 13 |
      | 智慧园区今日告警 37 条，其中消防类 5 条。 | 24 | 27 | 16 |
      | The context window of a large language model is limited, so truncation is needed. | 81 | 17 | 17 |
      | strawberry | 10 | 3（str / aw / berry） | 3（st / raw / berry） |

      结论：
      - **Token 数取决于 tokenizer**：同一句中文，较新的 `o200k_base` 比 `cl100k_base` 少约 40%，因为更大的词表收录了更多中文片段。
      - **英文 1 个 Token 平均约等于几个字符**；中文可能接近「一字一 Token」，具体看编码。
      - **不同厂商、不同代际的 tokenizer 都可能不同**，换模型后要重新测。

      **三、分词带来的「怪现象」**

      - 模型数不清 `strawberry` 里有几个 r：它看到的是 2~3 个整体片段，而不是 10 个字母。
      - 要求「写 100 字」常常不准：模型以 Token 为单位生成，对字数没有精确感知。
      - 罕见词、生僻字、乱码、长数字串、Base64 会被拆成很多 Token，**既贵又更容易出错**。

      **四、怎么准确计数**

      | 方法 | 适用 | 注意 |
      |---|---|---|
      | `tiktoken` 本地估算 | OpenAI 模型的纯文本 | `gpt-4o`、`gpt-5` 系列映射到 `o200k_base`；实测 0.14.0 里 `encoding_for_model("gpt-6-astra")` 抛 KeyError，新模型尚未收录 |
      | 官方计数接口 | 发送前精确预估 | OpenAI 有 `client.responses.input_tokens.count`，Anthropic 有 token counting API，会把角色、工具定义、图片等结构开销算进去 |
      | 响应里的 `usage` | **最终准确值** | 写进日志，用于对账和监控 |

      **不这样理解会怎样**：用「字数 × 固定系数」估成本，换模型后预算偏差巨大；用错编码导致截断不准、请求超长报错；对模型数数、控字数的能力抱有不切实际的期待。
    scenarios: |
      - **成本预估**：上线前用真实样本跑 Token 计数，按目标模型估算月度费用，而不是按字数拍脑袋。
      - **发送前检查**：请求前估算 Token，超出预算就触发截断或摘要（d13-k3），避免接口报错。
      - **模型迁移**：换模型时重新测量同一批数据的 Token 数，更新成本模型和截断阈值。
      - **字数要求**：营销文案要求严格字数时，由代码校验字数并重试或截断，不依赖模型自觉。
    pitfalls: |
      - **误区：1 个汉字 = 1 个（或 2 个）Token。** 没有固定比例，取决于 tokenizer 和具体文字，必须实测。
      - **误区：本地 tiktoken 计数 = 账单。** 消息角色、格式标记、工具定义、图片都占 Token，本地只数正文会偏低。
      - **误区：所有模型共用一个编码。** 不同厂商、同厂商不同代际都可能不同，Embedding 模型和对话模型的编码也可能不同。
      - **混淆：Token ID 与 Embedding。** Token ID 只是整数编号；Embedding 是向量表示（Day 18）。
    interview_asks:
      - question: "什么是 Token？BPE 是怎么工作的？"
        answer: "Token 是模型真正读写的单位，不是汉字也不是单词。BPE 从字符开始，把经常一起出现的片段合并成新 Token。常见词一个 Token，生僻词可能被拆成好几段。"
      - question: "为什么中文和英文的 Token 数不一样？怎么准确估算一段文本的 Token 数？"
        answer: "词表按训练语料统计，英文常见单词常常一个 Token，一个汉字可能要 1 到 2 个甚至更多。按字数乘系数只是估算。准确数字要用这家模型对应的 tokenizer 算。"
      - question: "为什么大模型数不清 strawberry 里有几个 r？"
        answer: "它看到的是 Token，不是一个一个字母。strawberry 可能被切成几段，模型并没有一个「字母数组」可以去数。要精确计数就用代码，别让模型数。"
    code: |
      ```python
      import tiktoken

      enc = tiktoken.get_encoding("o200k_base")          # gpt-4o / gpt-5 系列使用的编码
      text = "大语言模型的上下文窗口有限，需要做截断。"
      print(len(text), len(enc.encode(text)))             # 实测：20 个字符，13 个 Token
      print([enc.decode([i]) for i in enc.encode("strawberry")])  # ['st', 'raw', 'berry']
      ```
      本地计数只用于估算；请求的真实用量以响应 `usage` 为准。
    project_example: |
      **p1 企业知识库问答** 的切片入库（Day 23）要按 Token 而不是字数控制 chunk 大小；LLM 客户端（Day 14）在发送前估算 Token，超过预算就裁剪检索片段。
      建议在项目里写一个 `count_tokens(text, model)` 小工具：OpenAI 模型用对应编码估算，其他厂商用官方计数接口或保守系数，并在日志里记录 usage 的真实值，**定期比对「估算 vs 实际」的误差**。
    freshness: |
      核对于 2026-11：本地安装 tiktoken 0.14.0 实测上表数据；`encoding_for_model` 对 gpt-5、gpt-4o 返回 o200k_base，对 gpt-6-astra 抛 KeyError。OpenAI Counting tokens 文档提供 `responses.input_tokens.count` 接口，并说明本地 tokenizer 不支持图片和文件等内容。
    sources:
      - {title: "OpenAI Docs - Counting tokens", url: "https://developers.openai.com/api/docs/guides/token-counting"}
      - {title: "tiktoken model.py（模型到编码的映射）", url: "https://github.com/openai/tiktoken/blob/main/tiktoken/model.py"}
  - id: d13-k2
    name: Token 计费与成本估算
    level: P0
    summary: 费用 = 输入 Token × 输入单价 + 输出 Token（含推理）× 输出单价，再扣掉缓存折扣；输出通常比输入贵数倍
    analogy: |
      像**云服务的流量计费**：入网和出网分开计价，出网更贵；CDN 命中缓存的部分更便宜。
      大模型也是输入、输出分开计价，输出贵得多；命中 Prompt 缓存（Day 12）的输入更便宜。

      **不一样的地方**：推理模型还有一部分**看不见的推理 Token**按输出计费（Day 11）；而且同样的文字，换个模型 Token 数就不同（d13-k1），不能像流量那样按字节直接算。
    why: |
      Token 计费决定了**一个 AI 功能能不能赚钱、要不要限流、该选哪个模型**。
      面试里「你怎么估算和控制 LLM 成本」是工程题必考项，答不出具体算法会显得没做过生产项目；作为前端负责人，你也会被产品和老板问「这个功能一个月要花多少钱」。
    problem: |
      要回答：**一次请求花多少钱**、**一个月花多少钱**、**钱主要花在哪里**、**怎么降**。
      只按「调用次数」估算是最常见的错误——长对话用户的单次成本可能是普通用户的几十倍，推理模型的推理 Token 也会让账单远超预期。
    principle: |
      **一、费用的组成**

      ```mermaid
      flowchart LR
        A["一次请求的费用"] --> B["输入 Token 乘 输入单价"]
        A --> C["输出 Token 乘 输出单价"]
        B --> B1["未命中缓存 全价"]
        B --> B2["命中缓存 折扣价"]
        C --> C1["可见回答"]
        C --> C2["推理 Token 不可见也计费"]
      ```

      - **输入、输出分别计价，输出单价通常是输入的数倍**。例如 OpenAI 官网（2026-11）标价：GPT-6 Astra 输入 $10 / 百万 Token、输出 $50；GPT-6.1 Sol 输入 $2、输出 $10。
      - **推理 Token 按输出计费**（Day 11）。
      - **缓存命中的输入有折扣**（Day 12）。例如 GPT-6.1 Sol 缓存命中的输入是 $0.1 / 百万（未缓存价的 5%），写入缓存按 1.25 倍计。
      - **超长输入会加价**：GPT-6.1 Sol 单次输入超过 272K Token 时，整次请求的输入按 2 倍、输出按 1.5 倍计价；Anthropic 文档提到 Haiku 5.5 超过 10 万 Token 的提示价格更高。**算长上下文成本前一定先看模型页。**

      **二、估算示例（单价取 GPT-6.1 Sol 标价，便于计算）**

      假设每天 1 万次问答，平均输入 4,000 Token（规则 + 检索片段 + 历史），平均输出 500 Token：

      | 项目 | 计算 | 每天 |
      |---|---|---|
      | 输入 | 1 万 × 4,000 = 4,000 万 Token = 40 百万 × $2 | **$80** |
      | 输出 | 1 万 × 500 = 500 万 Token = 5 百万 × $10 | **$50** |
      | 合计 | | **约 $130 / 天，约 $3,900 / 月（按 30 天）** |

      再看两个变化：
      - 如果换成推理模型，平均多出 1,500 个推理 Token：输出变成 2,000 Token，输出费用变为 $200 / 天，**总费用翻倍以上**。
      - 如果 4,000 输入里有 2,500 是稳定前缀并命中缓存，输入费用会明显下降（按缓存价计算）。

      **三、降本杠杆（按常见收益排序）**

      | 杠杆 | 做法 |
      |---|---|
      | 减少输入 | 精简 System Prompt、少放检索片段、压缩历史（d13-k3） |
      | 控制输出 | 明确格式和长度，只输出需要的字段 |
      | 用好缓存 | 稳定内容放前，提高 Prompt 缓存命中（Day 12） |
      | 选对模型 | 简单任务用小模型或低 effort，复杂任务才用强模型（Day 19 模型路由） |
      | 限流与配额 | 按用户、租户设 Token 预算，防止被刷 |

      **四、一定要监控**

      每次调用把 `usage`（输入、输出、缓存命中、推理 Token）和功能名、用户、租户一起写进日志，按天汇总。**成本异常往往来自少数长对话用户或某次 Prompt 改动**，没有监控就发现不了。
    scenarios: |
      - **功能评审**：上线前用样本数据估算单次和每月成本，判断功能是否值得做、是否需要限流或分级。
      - **模型选型**：同一评测集下对比不同模型的效果和单次成本，而不是只看单价。
      - **成本告警**：按租户统计 Token 消耗，超过日预算自动降级到便宜模型或提示用户。
    pitfalls: |
      - **误区：成本主要看输入。** 输出单价通常更高，推理模型的推理 Token 还会把输出成本推高。
      - **误区：按调用次数估算预算。** 长对话、长文档请求的 Token 数可能是普通请求的几十倍。
      - **误区：用 A 模型的 Token 数估算 B 模型的费用。** tokenizer 不同，Token 数就不同。
      - **误区：价格写死在代码里。** 价格变化频繁，应作为配置维护，并定期对账。
    interview_asks:
      - question: "你怎么估算一个 LLM 功能的成本？请举例算一下。"
        answer: "先量一次真实请求的输入和输出 Token，再乘调用量和单价。输入输出单价通常不同。比如一次 2000 输入、500 输出，一天 1 万次，就按这两个数乘对应价格加起来。还要加上重试和失败的调用。"
      - question: "有哪些降低 LLM 调用成本的手段？各自的代价是什么？"
        answer: "换更小的模型、缩短提示和历史、缓存相同问题、能用规则就不用模型。代价分别是效果可能下降、上下文变少、缓存有过期和串用户的风险、规则覆盖不了长尾。每次省钱都要用评测看效果。"
    project_example: |
      **p2 智慧园区运营 Agent** 一次任务可能循环多轮：每轮都要重发规则、工具定义和之前的工具结果，**输入 Token 随轮数累加**。
      做成本估算时不能只算「一次问答」，要算「一次任务平均几轮 × 每轮输入输出」。设计上：
      - 工具结果只返回聚合后的关键信息（Day 33）；
      - 规则和工具定义作为稳定前缀命中缓存；
      - 每个任务设最大步数和 Token 预算（Day 32），超了就停下来交给人。
      具体成本数字用你自己压测的 usage 统计填写。
    freshness: |
      核对于 2026-11：OpenAI 模型页标价 GPT-6 Astra 输入 $10/MTok、输出 $50/MTok，GPT-6.1 Sol 输入 $2/MTok、输出 $10/MTok；推理 Token 按输出计费（OpenAI Reasoning 指南）。GPT-6.1 Sol 模型页：缓存输入 $0.1/MTok（5%），缓存写入 1.25 倍；输入超过 272K Token 的请求整次按 2 倍输入价、1.5 倍输出价计费。Anthropic Context windows 文档说明 1M 窗口模型长上下文按标准价计费，Haiku 5.5 超过 10 万 Token 的提示除外。价格变化频繁，以官方定价页为准。
    sources:
      - {title: "OpenAI Docs - Models", url: "https://developers.openai.com/api/docs/models"}
      - {title: "OpenAI Docs - GPT-6.1 Sol", url: "https://developers.openai.com/api/docs/models/gpt-6.1-sol"}
      - {title: "OpenAI Docs - Reasoning models", url: "https://developers.openai.com/api/docs/guides/reasoning"}
      - {title: "Anthropic Docs - Context windows", url: "https://platform.claude.com/docs/en/build-with-claude/context-windows"}
  - id: d13-k3
    name: 上下文窗口与截断策略
    level: P0
    summary: 窗口是一次请求能容纳的 Token 总量，输入、输出、推理都算在内；超出预算时按优先级、按完整消息取舍
    analogy: |
      像前端的**虚拟列表**：屏幕只能放下有限的条目，你得决定渲染哪些。
      上下文窗口也一样，一次请求只能放下有限的 Token，你得决定**放什么、丢什么、压缩什么**。

      **不一样的地方**：虚拟列表里没渲染的条目，用户滚动还能看到；**被截掉的内容模型就完全不知道**，而且不能像截断字符串那样从中间切——切坏一条 JSON 或工具调用，请求可能直接报错。
    why: |
      多轮对话、长文档、Agent 工具调用都会让上下文持续膨胀。没有截断策略，系统迟早会遇到**请求超长报错**、**费用暴涨**或**模型忘记关键信息**。
      这是 AI 应用后端最常写、也最容易写错的代码之一，面试里常以「长对话超过上下文怎么办」的形式出现。
    problem: |
      在固定的 Token 预算内，决定**放什么、丢什么、压缩什么**，让模型在有限窗口里拿到最有用的信息。
      写错的典型后果：丢掉了本轮问题却保留了很早的寒暄；把 System Prompt 截掉导致模型「人设崩了」；把工具调用和工具结果拆散导致接口 400。
    principle: |
      **一、窗口里装了什么**

      ```mermaid
      flowchart TD
        W["上下文窗口 总 Token 上限"] --> I["输入"]
        W --> O["输出"]
        I --> I1["System 或 Developer 指令"]
        I --> I2["工具定义与 JSON Schema"]
        I --> I3["对话历史 含工具调用与结果"]
        I --> I4["检索片段 文件 图片"]
        I --> I5["本轮用户问题"]
        O --> O1["推理 Token"]
        O --> O2["可见回答"]
      ```

      Anthropic 文档明确：system prompt、所有消息（含工具结果、图片、文档）、工具定义，以及本轮输出（含思考）**都计入窗口**；命中缓存的前缀也照样占窗口。

      **二、当前量级（核对于 2026-11，以官方模型页为准）**

      | 模型 | 上下文窗口 | 单次最大输出 |
      |---|---|---|
      | OpenAI GPT-6 Astra / GPT-6.1 Sol | 约 1.05M（GPT-6.1 Sol 最大输入 922K） | 128K |
      | Anthropic 当前主力 Claude 模型 | 1M | 128K |
      | 部分旧模型、私有化小模型 | 常见 128K~200K 或更小 | 视模型而定 |

      注意：**窗口 ≠ 能输入多少**。要给输出（尤其是推理 Token）预留空间；有的平台还有额外限制，比如阿里云百炼的 Responses 兼容接口说明最大输入约为窗口的 80%。

      **三、超了会怎样（各家不同，别依赖服务端行为）**

      - Anthropic：输入本身超窗口直接 400（prompt is too long）；Claude 4.5 及更新的模型允许「输入 + max_tokens」超窗口，生成到上限时以 `model_context_window_exceeded` 停止。
      - DeepSeek 的 Responses 兼容接口：超窗口返回 400。
      - 阿里云百炼的 Responses 兼容接口：超出部分**自动截断、不报错**——你可能根本不知道内容被丢了。

      所以**应用层要自己控制**：发送前计数，超预算就按策略裁剪。

      **四、先做预算分配**

      ```text
      输入预算 = 上下文窗口 − 预留输出（含推理）− 安全余量
      输入预算 = 固定部分（指令、工具定义）+ 本轮问题 + 检索片段 + 历史
      ```

      固定部分和本轮问题**必须保留**，剩下的预算再分给检索片段和历史。

      **五、常见策略**

      | 策略 | 做法 | 代价 |
      |---|---|---|
      | 滑动窗口 | 只保留最近 N 轮或 N 个 Token | 早期关键信息（如楼栋号、订单号）会丢 |
      | 摘要压缩 | 较早的对话用模型总结成一段 | 多一次调用；摘要可能丢细节 |
      | 关键信息抽取 | 把楼栋号、偏好等存成结构化字段 | 要定义抽取规则 |
      | 检索片段裁剪 | 按相关度只保留前几条 | 可能漏掉答案所在片段 |

      **六、截断的细节**

      - **从哪头删**：历史**保留最近、删除最早**；System Prompt 和本轮问题永远不删。
      - **按完整单元删**：按消息、按片段整体移除，不要按字符截断；**工具调用和对应结果要成对保留或成对删除**，否则很多 API 会报格式错误。
      - **按 Token 计**：用对应模型的计数方式（d13-k1），不要用字符数近似。
      - **记录日志**：记下截断前后的 Token 数和丢弃了几条，方便排查「模型忘了」类问题。
    scenarios: |
      - **多轮客服**：保留最近若干轮 + 早期对话摘要 + 已抽取的关键字段（订单号、手机号）。
      - **RAG 问答**：检索 Top-20 后重排，只保留最相关的几条送入模型（Day 26）。
      - **Agent 长任务**：工具结果很长时只保留摘要或关键字段，原始结果存在外部，需要时再取（Day 35）。
    pitfalls: |
      - **误区：窗口 1M 就能输入 1M。** 输出和推理 Token 也占窗口，部分平台的输入上限还小于总窗口。
      - **误区：从最早的消息开始保留，直到满为止。** 这样会留下最早的寒暄、丢掉最近的上下文，方向反了。
      - **误区：按字符截断最后一条消息。** 可能截断 JSON、代码，甚至截掉用户真正的问题。
      - **误区：工具调用消息可以单独删。** 删掉调用而保留结果（或反过来），接口可能直接报错。
      - **误区：服务端会帮我处理超长。** 有的报错、有的静默截断，行为不一致，必须在应用层控制。
    interview_asks:
      - question: "上下文窗口是什么？一次请求里有哪些内容会占用窗口？"
        answer: "窗口是这一次请求能放进模型的总 Token 上限。系统提示、工具定义、历史、检索结果、用户问题和已经生成的回答都算。不是只算用户这一句话。"
      - question: "多轮对话超过上下文窗口怎么办？有哪些策略，各自的代价是什么？"
        answer: "可以丢掉最早的轮次，代价是忘了前面的约定。可以先摘要再带上，代价是摘要可能丢细节或写错。也可以只保留和当前问题相关的轮次。不能等接口报超长再临时截。"
      - question: "截断时哪些内容必须保留？为什么不能按字符截断？"
        answer: "系统规则、当前用户问题和最近一轮要留。按字符切会切在 Token 中间，也会把工具调用对切散。要按 Token 截，并且保证消息还是成对的。"
    project_example: |
      **p2 智慧园区运营 Agent** 的上下文组装建议分三层：
      1. **固定层**：System Prompt + 工具定义，永不裁剪；
      2. **会话记忆层**：从对话中抽取的结构化字段（当前关注的园区、楼栋、时间范围、已创建的工单号），每轮更新、体积很小；
      3. **历史层**：最近若干轮原文 + 更早对话的摘要；工具结果只保留聚合后的关键信息，调用与结果成对保留。
      运营人员聊到第 30 轮还在讨论「3 号楼」，也不会因为滑动窗口把楼栋号丢掉。记忆层的详细设计见 Day 35。
    freshness: |
      核对于 2026-11：OpenAI 模型页显示 GPT-6 Astra、GPT-6.1 Sol 上下文窗口 1.05M、最大输出 128K，GPT-6.1 Sol 模型详情页注明最大输入 922,000 Token。Anthropic Context windows 文档：当前主力模型 1M 窗口、单次最多 128K 输出；所有输入、工具定义和本轮输出（含思考）都计入窗口，缓存前缀仍占窗口；输入超窗口返回 400，Claude 4.5 及更新模型在输入加 max_tokens 超窗口时接受请求并以 model_context_window_exceeded 停止。DeepSeek Responses 兼容文档：不支持 truncation，超窗口返回 400。阿里云百炼 Responses 兼容文档：最大输入约为模型窗口的 80%，超出部分自动截断不报错。
    sources:
      - {title: "Anthropic Docs - Context windows", url: "https://platform.claude.com/docs/en/build-with-claude/context-windows"}
      - {title: "OpenAI Docs - Models", url: "https://developers.openai.com/api/docs/models"}
      - {title: "DeepSeek API Docs - Using the Responses API", url: "https://api-docs.deepseek.com/guides/responses_api.md"}
      - {title: "阿里云百炼 - 通过 OpenAI Responses 接口调用千问", url: "https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-responses"}
  - id: d13-k4
    name: 长上下文退化：lost in the middle 与 context rot
    level: P1
    summary: 窗口装得下不等于用得好；信息放在长上下文中间更容易被忽略，输入越长、干扰越多，表现越不稳定
    analogy: |
      像一个**超长的运营后台首页**：顶部和底部的信息最显眼，中间塞了几十个卡片后，用户反而找不到最重要的那个。
      模型读长上下文也有类似倾向：开头和结尾的信息用得最好，中间的容易被忽略。

      **不一样的地方**：用户可以滚动回去找；模型不会「回头再仔细看一遍」，而且**干扰内容和答案越像**，它越容易被带偏。
    why: |
      很多人以为「窗口够大就把全部资料塞进去」，结果效果反而变差。
      理解长上下文的利用规律，才能正确设计 Prompt 布局、决定检索片段数量，并回答面试高频题「百万上下文了还需要 RAG 吗」。
    problem: |
      解决「**信息给了，模型却没用上**」的问题：答案明明在上下文里，模型却说找不到，或者被相似的无关内容干扰给出错误答案。
    principle: |
      **一、Lost in the Middle（Liu 等，TACL 2024）**

      - 实验：多文档问答中，把包含答案的文档放在不同位置。
      - 发现：答案在**开头或结尾**时效果最好，在**中间**时明显下降，呈 **U 形曲线**；论文中甚至出现「答案放在中间时的准确率低于不给任何文档」的情况。

      **二、Context Rot（Chroma，2025-07）**

      Chroma 测试了 18 个模型（包括当时的 GPT-4.1、Claude 4、Gemini 2.5、Qwen3），结论：

      - **所有实验中，输入越长，表现都持续下降**，即使任务本身很简单。
      - 问题和答案的语义相似度越低，下降越快。
      - **干扰项**（看起来相关但不是答案的内容）的影响随输入变长而放大。
      - 上下文的结构也会影响表现。

      Anthropic 文档也用 context rot 描述这一现象：Token 越多，准确率和召回越可能下降，因此**上下文里放什么，和窗口有多大一样重要**。

      **三、布局建议（核对于 2026-11 的厂商文档）**

      ```mermaid
      flowchart TD
        A["稳定的角色与规则"] --> B["长资料 每篇用标签包裹并带来源"]
        B --> C["本次具体任务指令"]
        C --> D["用户问题放在最后"]
        E["相关度最高的片段"] -.-> B
        F["无关或高度相似的干扰内容"] -.->|"尽量剔除"| B
      ```

      - **Anthropic**：处理 2 万 Token 以上的长文档时，**把长文档放在提示词前面，问题放在最后**；其测试中这样做最多可提升约 30% 的回答质量。多文档时用标签包裹每篇文档及其元数据。
      - **OpenAI**：开发者消息通常按「身份、指令、示例、上下文」组织，上下文放在靠后的位置。
      - 共同点：**问题和关键指令不要淹没在资料中间**；资料要有清晰分隔和来源标注。

      **四、工程结论**

      - **少而精优于多而全**：用检索 + 重排控制送入的片段数量，剔除重复和相似干扰。
      - 长文档任务优先「先定位再精读」或「分段处理再汇总」。
      - **用自己的数据验证**：把答案放在不同位置、混入干扰项测试，确认你的模型和布局在目标长度下是否稳定。
      - 回答「百万上下文还要不要 RAG」：要。长上下文适合需要通读的少数任务，日常问答用 RAG 更快、更便宜、通常也更准，还能给出引用。
    scenarios: |
      - **RAG 片段排序**：重排后只保留前若干条，最相关的放在资料区开头或紧挨问题，问题放最后。
      - **长合同审查**：先让模型定位相关条款，再只把相关条款送入第二次调用精读。
      - **选型评估**：构造「答案在不同位置」「混入相似干扰」的测试集，而不是只看宣传的窗口大小。
    pitfalls: |
      - **误区：窗口越大，塞得越多越准。** 研究和厂商文档都表明，内容越多利用率可能越低。
      - **误区：新模型已经完全解决了这个问题。** 长上下文能力在提升，但厂商文档仍提示 context rot，要以自己场景的实测为准。
      - **误区：只有无关内容才是干扰。** 和答案很像但不是答案的内容（旧版本制度、相邻楼栋的数据）干扰更大。
      - **误区：把问题重复两遍就够了。** 重复能缓解，但替代不了精简和排序。
    interview_asks:
      - question: "什么是 lost in the middle？对 RAG 的 Prompt 设计有什么启示？"
        answer: "模型对开头和结尾记得更牢，中间的长资料容易被忽略。所以最相关的证据放两头，不要把关键句埋在一大段中间。资料少而准，比堆很多更有用。"
      - question: "现在模型都有百万 Token 上下文了，还需要 RAG 吗？"
        answer: "需要。整库塞进去又贵又慢，中间的内容还容易被忽略，也做不到按权限只给该看的片段。RAG 先找出少量相关内容，再交给模型。长窗口用来装这几段证据和历史，不是用来代替检索。"
    project_example: |
      **p1 企业知识库问答** 的「生成与引用」模块（Day 27）组装 Prompt 时：
      - 检索 + 重排后只保留少量片段，每个片段用标签包裹并带编号和来源；
      - 同一制度的新旧版本只保留现行版本，避免相似干扰；
      - 资料放前、问题放最后。
      评测（Day 29）时专门加一组用例：把答案片段放在第 1、中间、最后位置，比较命中率，用数据决定片段数量上限。
    freshness: |
      核对于 2026-11：Lost in the Middle（arXiv 2307.03172，TACL 2024）结论为 U 形曲线。Chroma《Context Rot》（2025-07）评测 18 个模型，结论为输入变长时表现持续下降、干扰项影响随长度放大。Anthropic Context windows 文档用 context rot 描述 Token 增长导致准确率和召回下降；其 Prompting best practices 建议 2 万 Token 以上长文档放前、问题放后，测试中质量最多提升约 30%。OpenAI Prompt engineering 指南建议上下文放在开发者消息靠后位置。
    sources:
      - {title: "Lost in the Middle: How Language Models Use Long Contexts", url: "https://arxiv.org/abs/2307.03172"}
      - {title: "Chroma - Context Rot", url: "https://www.trychroma.com/research/context-rot"}
      - {title: "Anthropic Docs - Prompting best practices", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}
      - {title: "OpenAI Docs - Prompt engineering", url: "https://developers.openai.com/api/docs/guides/prompt-engineering"}
test:
  - id: d13-t1
    kp: d13-k1
    type: single
    question: "同一句 20 个汉字的中文，用 cl100k_base 编码是 22 个 Token，用 o200k_base 编码是 13 个 Token。最合理的解释是？"
    options:
      - "o200k_base 会自动删掉标点符号，所以更少"
      - "两种编码的词表不同，更大的词表收录了更多中文片段"
      - "cl100k_base 计数有 bug，正确结果应该是 20"
      - "中文在任何编码下都是一字一 Token，差异来自空格"
    answer: [1]
    explain: |
      BPE 的词表在训练 tokenizer 时就固定了，o200k_base 词表更大，收录了更多常见中文组合，同一句话切出的 Token 更少。所以 Token 数必须按具体模型的 tokenizer 计算。
      A、C 没有依据；D 错在中文与 Token 没有固定比例。
  - id: d13-t2
    kp: d13-k1
    type: judge
    question: "模型经常数错 strawberry 里有几个字母 r，一个重要原因是它看到的是几个被切好的片段，而不是 10 个独立字母。"
    answer: true
    explain: |
      分词后 strawberry 只是 2~3 个 Token（如 st / raw / berry），模型处理的是这些片段的整体表示，没有逐个字母的视角，所以字符级计数容易出错。
      需要精确计数时应交给代码，而不是依赖模型。
  - id: d13-t3
    kp: d13-k1
    type: single
    question: "你在后端用 tiktoken 估算了消息正文的 Token 数，但账单上的输入 Token 总是比估算多一截。最可能的原因是？"
    options:
      - "tiktoken 只统计英文，中文部分没有算进去"
      - "厂商按字符数计费，与 Token 数无关"
      - "本地只数了正文，消息角色、格式标记、工具定义等结构开销也计入输入"
      - "账单把输出 Token 也算进了输入 Token"
    answer: [2]
    explain: |
      真实请求除了正文，还包含角色标记、消息格式、工具定义的 JSON Schema、图片等，都会计入输入 Token。精确预估应使用官方计数接口，最终以 usage 为准。
      A 错，tiktoken 能处理任何文本；B 错，厂商按 Token 计费；D 输入输出在 usage 中分开统计。
  - id: d13-t4
    kp: d13-k1
    type: multi
    question: "关于 Token 计数，下列哪些做法是正确的？"
    options:
      - "换模型后，用同一批样本重新测量 Token 数并更新预算"
      - "精确预估时调用厂商的官方计数接口，把工具定义等开销一起算进去"
      - "以响应里的 usage 作为最终准确值，写进日志用于对账"
      - "统一按「1 个汉字 = 2 个 Token」换算，简单又通用"
    answer: [0, 1, 2]
    explain: |
      A、B、C 都是推荐做法：tokenizer 随模型变化，官方接口包含结构开销，usage 是计费依据。
      D 错：汉字与 Token 没有固定比例，不同 tokenizer 差异可能接近一倍，固定系数会导致预算偏差。
  - id: d13-t5
    kp: d13-k2
    type: single
    question: "某功能每天 1 万次调用，平均输入 4,000 Token、输出 500 Token，单价为输入 $2 / 百万、输出 $10 / 百万。每天的费用约是多少？"
    options:
      - "约 $45"
      - "约 $90"
      - "约 $130"
      - "约 $450"
    answer: [2]
    explain: |
      输入：1 万 × 4,000 = 4,000 万 Token = 40 百万 × $2 = $80；输出：1 万 × 500 = 500 万 Token = 5 百万 × $10 = $50；合计约 $130。
      其他选项通常是漏算了输出、把输入输出单价用反，或单位换算出错。
  - id: d13-t6
    kp: d13-k2
    type: judge
    question: "推理模型的推理 Token 没有返回给用户，所以不计入费用，估算成本时只需统计可见回答的长度。"
    answer: false
    explain: |
      推理 Token 虽然不可见，但按输出 Token 计费，并且数量随问题难度和 effort 变化，可能是可见回答的数倍。
      估算推理模型的成本必须从 usage 的 reasoning_tokens 统计，否则预算会严重偏低。
  - id: d13-t7
    kp: d13-k2
    type: multi
    question: "以下哪些是有效的降本手段？"
    options:
      - "稳定的规则和工具定义放在前面，提高 Prompt 缓存命中"
      - "明确输出格式和长度，只让模型输出需要的字段"
      - "简单分类任务改用小模型或低 effort"
      - "在每个请求开头加入时间戳，方便统计费用"
    answer: [0, 1, 2]
    explain: |
      A 让缓存命中的输入按折扣计费；B 减少更贵的输出 Token；C 按任务复杂度选模型。
      D 反而会让每个请求的前缀不同，导致缓存失效、费用上升，时间信息应放在后面或只写日志。
  - id: d13-t8
    kp: d13-k2
    type: single
    question: "月底复盘发现 LLM 费用比预算高很多，但调用次数和预期一致。最先应该查看的是？"
    options:
      - "按用户和功能统计的输入、输出 Token 分布，找出异常长的请求"
      - "API Key 是否泄露给了其他团队使用"
      - "模型厂商是否在月中涨了价"
      - "前端是否重复发送了请求"
    answer: [0]
    explain: |
      次数一致而费用超标，说明单次请求的 Token 变多了：可能是长对话用户、Prompt 改动变长、推理 Token 增加或缓存命中下降，按维度统计 usage 能快速定位。
      B、D 会导致次数增加，与「次数一致」矛盾；C 可以核对，但通常不是首要原因。
  - id: d13-t9
    kp: d13-k3
    type: single
    question: "下面的函数用于在发送前把消息裁剪到预算内，它最严重的问题是？"
    code: |
      def fit_to_budget(system, history, question, budget, count_tokens):
          msgs = [system] + history + [question]
          while count_tokens(msgs) > budget:
              msgs.pop()          # 超了就删掉最后一条
          return msgs
    options:
      - "count_tokens 每次都重新计算，性能太差"
      - "没有把 system 放在最后，模型会忽略它"
      - "budget 应该等于整个上下文窗口大小"
      - "超预算时最先删掉的是本轮问题，接着是最近的历史"
    answer: [3]
    explain: |
      pop() 删除列表最后一个元素，也就是本轮用户问题，接着删最近的历史，恰好与正确方向相反。应固定保留 system 和本轮问题，从最早的历史开始移出，并按完整消息、成对的工具调用删除。
      A 是次要的性能问题；B 错，system 应在最前；C 错，预算要扣除输出和推理预留。
  - id: d13-t10
    kp: d13-k3
    type: judge
    question: "截断对话历史时，可以只删掉某条工具调用消息而保留它对应的工具结果，这样能省更多 Token。"
    answer: false
    explain: |
      工具调用和工具结果是成对的，只删一边会让消息结构不完整，很多 API 会直接报格式错误，模型也会困惑结果从哪来。
      截断要按完整单元进行：一组调用和结果要么一起保留，要么一起移除或合并进摘要。
  - id: d13-t11
    kp: d13-k3
    type: multi
    question: "关于上下文窗口，以下哪些说法正确？"
    options:
      - "System Prompt、工具定义、历史消息、本轮输出都计入窗口"
      - "推理模型的推理 Token 也会占用窗口"
      - "命中 Prompt 缓存的前缀不再占用窗口"
      - "有的平台超出窗口时会静默截断，所以应用层要自己控制"
    answer: [0, 1, 3]
    explain: |
      A、B：窗口包含一次请求的全部输入和输出；D：例如百炼 Responses 兼容接口会自动截断不报错，不能依赖服务端行为。
      C 错：缓存只改变计费和速度，缓存的前缀仍然计入窗口。
  - id: d13-t12
    kp: d13-k3
    type: single
    question: "运营人员在第 1 轮说「接下来都看 3 号楼」，聊到第 25 轮时 Agent 开始反复问「请问是哪栋楼」。系统用的是只保留最近 10 轮的滑动窗口。最合适的改进是？"
    options:
      - "把滑动窗口扩大到保留全部历史"
      - "把楼栋等关键信息抽取成结构化字段，每轮固定放入上下文"
      - "在 System Prompt 里写「请记住用户最早说过的楼栋」"
      - "提示用户每次提问都带上楼栋号"
    answer: [1]
    explain: |
      滑动窗口丢掉了早期关键信息。把楼栋、时间范围等抽取成体积很小的会话记忆字段，每轮固定放入，既不丢信息又不让上下文无限增长。
      A 会让上下文和费用持续膨胀；C 无效，被截掉的内容模型根本看不到；D 把系统问题推给用户。
  - id: d13-t13
    kp: d13-k4
    type: single
    question: "Lost in the Middle 论文中，把包含答案的文档放在不同位置测试，得到的规律是？"
    options:
      - "答案越靠后效果越好，放在最后一位最好"
      - "答案位置对效果没有影响，只和文档总数有关"
      - "答案在开头或结尾效果最好，放在中间时明显下降"
      - "答案越靠前效果越好，呈逐步下降的直线"
    answer: [2]
    explain: |
      论文发现了 U 形曲线：模型对开头（首因）和结尾（近因）的信息利用最好，中间位置明显下降，甚至可能低于不给文档的情况。
      A、D 只描述了一端；B 与实验结论相反，位置对效果影响显著。
  - id: d13-t14
    kp: d13-k4
    type: judge
    question: "Chroma 的 context rot 研究发现，即使任务本身很简单，输入变长时模型表现也会持续下降，而且相似干扰项的影响随长度放大。"
    answer: true
    explain: |
      该研究测试了 18 个模型，在固定问题与答案、只增加无关内容的条件下，表现随输入长度持续下降；与答案相似的干扰项影响更明显。
      这说明窗口装得下不等于用得好，上下文要少而精。
  - id: d13-t15
    kp: d13-k4
    type: multi
    question: "针对长上下文退化，以下哪些 Prompt 布局与工程做法是合理的？"
    options:
      - "长资料放在前面，用户问题放在最后"
      - "每篇资料用标签包裹并标注来源"
      - "剔除旧版本制度等与答案相似的干扰内容"
      - "把所有检索结果按文档原顺序全部拼进去，宁多勿少"
    answer: [0, 1, 2]
    explain: |
      A 是 Anthropic 对 2 万 Token 以上长文档的建议；B 让结构清晰便于定位；C 减少相似干扰，正是 context rot 研究指出的主要风险。
      D 会让上下文更长、干扰更多，相关片段还可能落在中间，效果和成本都更差。
  - id: d13-t16
    kp: d13-k4
    type: single
    question: "面试官问：「模型都支持百万 Token 上下文了，还需要 RAG 吗？」哪个回答最到位？"
    options:
      - "不需要了，把所有文档塞进上下文就能解决知识问题"
      - "需要，因为长上下文只支持英文，中文还要靠 RAG"
      - "不需要，RAG 只是上下文窗口小的时代的临时方案"
      - "需要，长输入又贵又慢且利用率下降，RAG 只放相关片段还能给引用"
    answer: [3]
    explain: |
      长上下文让少数需要通读的任务变可行，但每次全量输入成本高、首字慢，且存在 lost in the middle 和 context rot；RAG 只放相关片段，更快更省，还能给出处、做权限过滤。
      A、C 忽略了成本与退化；B 是错误事实。
exam:
  - id: d13-e1
    kp: d13-k1
    type: single
    question: "营销文案功能要求「标题严格不超过 20 个汉字」，但模型生成的标题经常超出。最可靠的做法是？"
    options:
      - "在 Prompt 里用加粗和大写反复强调 20 字限制"
      - "把 max_output_tokens 设为 20，让模型输出不了更多"
      - "换一个参数量更大的模型，它对字数更敏感"
      - "代码校验字数，超出时带着反馈重试或按规则截断"
    answer: [3]
    explain: |
      模型以 Token 为单位生成，对字数没有精确感知，Prompt 只能提高概率。字数这种确定性规则应由代码校验，不合格就重试或截断。
      A 只能缓解；B Token 与汉字没有固定比例，还可能把内容截断成半句；C 换模型也无法保证精确字数。
  - id: d13-e2
    kp: d13-k2
    type: single
    question: "团队打算把客服模型从普通模型换成推理模型，其他不变。原来每天输出费用 $50（平均 500 Token 可见回答）。若平均每次新增 1,500 个推理 Token，输出费用大约变为？"
    options:
      - "仍约 $50，推理 Token 不计费"
      - "约 $200，输出 Token 从 500 变为 2,000"
      - "约 $100，推理 Token 按输出价的一半计费"
      - "约 $75，只多收少量的推理服务费"
    answer: [1]
    explain: |
      推理 Token 按输出计费，单次输出从 500 变为 2,000 Token，是原来的 4 倍，输出费用约从 $50 变为 $200（假设单价不变）。
      A 忽略了推理 Token 计费；C、D 中的折扣和服务费都是编造的规则。
  - id: d13-e3
    kp: d13-k3
    type: single
    question: "一个 RAG 接口在大多数情况下正常，但遇到某些长问题和长历史时，回答像是「没看到前面的资料」，且接口没有报任何错误。平台是阿里云百炼的 Responses 兼容接口。最需要怀疑的是？"
    options:
      - "输入超过平台限制后被自动截断，丢掉了部分资料"
      - "模型的 temperature 过高导致忽略资料"
      - "检索服务返回了空结果"
      - "前端没有把资料渲染出来"
    answer: [0]
    explain: |
      百炼 Responses 兼容接口说明最大输入约为窗口的 80%，超出部分自动截断且不报错，长问题加长历史时最容易触发。应在应用层发送前计数并主动裁剪，日志记录 Token 数。
      B 不会表现为「没看到资料」；C 与「大多数情况正常、长输入才出问题」的规律不符；D 资料是给模型的，不需要前端渲染。
  - id: d13-e4
    kp: d13-k4
    type: single
    question: "制度问答中，知识库里同时存在《差旅报销制度》2024 版和 2026 版，检索常把两版的相似条款都放进上下文，模型偶尔引用旧版标准。最合理的改进是？"
    options:
      - "多放一些片段，让模型自己比较哪版更新"
      - "在 Prompt 里提醒模型「请注意版本」"
      - "检索时按生效状态过滤，只保留现行版本的片段"
      - "把上下文窗口更大的模型换上来"
    answer: [2]
    explain: |
      新旧版本的条款高度相似，是典型的相似干扰项，长上下文中这类干扰影响更大。应在检索阶段用元数据（生效状态、版本）过滤，从源头剔除（Day 22 元数据设计）。
      A 增加干扰；B 只能缓解；D 窗口大小不是问题所在。
  - id: d13-e5
    kp: d13-k2
    type: multi
    question: "你要给老板汇报一个新 AI 功能的月度成本预估，哪些做法能让预估更可信？"
    options:
      - "用真实样本跑目标模型的 Token 计数，而不是按字数换算"
      - "按输入、输出（含推理）、缓存命中分别计算"
      - "考虑多轮对话或 Agent 多步循环导致的输入累加"
      - "按调用次数乘以一个经验单价，简单直接"
    answer: [0, 1, 2]
    explain: |
      A 避免 tokenizer 差异带来的偏差；B 反映输入输出单价差异和推理、缓存的影响；C 覆盖多轮场景中历史重发导致的增长。
      D 忽略了单次请求 Token 数的巨大差异，长对话用户可能是普通用户的几十倍。
  - id: d13-e6
    kp: d13-k3
    type: multi
    question: "设计多轮对话的上下文裁剪策略时，哪些原则是正确的？"
    options:
      - "System Prompt 和本轮问题固定保留"
      - "历史从最早的开始移出，被移出的部分合并进摘要或记忆字段"
      - "按完整消息裁剪，工具调用与结果成对处理"
      - "为了简单，按字符数从最后一条消息的末尾截断"
    answer: [0, 1, 2]
    explain: |
      A、B、C 分别保证关键指令不丢、优先保留最近上下文、消息结构完整。
      D 会截掉用户真正的问题或切坏 JSON，而且字符数和 Token 数不对应。
  - id: d13-e7
    kp: d13-k1
    type: judge
    question: "长数字串、Base64 字符串和乱码通常会被切成很多 Token，所以把整段 Base64 图片编码当文本塞进 Prompt 既昂贵又没有意义。"
    answer: true
    explain: |
      BPE 对低频、无规律的内容只能拆成很多小片段，Token 数暴涨。图片应通过厂商支持的图片输入方式传入，或先在代码中提取需要的信息，而不是把编码当文本发送。
  - id: d13-e8
    kp: d13-k4
    type: judge
    question: "既然 lost in the middle 说明中间的信息容易被忽略，那么只要把所有资料都放在结尾、问题放在开头，就能彻底解决长上下文问题。"
    answer: false
    explain: |
      位置调整只能缓解。厂商建议的是长资料在前、问题在后；更根本的是减少输入长度和干扰项，因为 context rot 显示输入越长表现越不稳定，与位置无关的退化依然存在。
      还应该用自己的评测集验证布局效果。
  - id: d13-e9
    kp: d13-k4
    type: case
    question: |
      公司内部制度文档整理后约 80 万 Token。老板看到新模型支持约 100 万 Token 上下文，要求「别做 RAG 了，每次问答都把全部制度塞进去，省得维护检索」。
      预计每天 2,000 次问答，所选模型输入标价 $2 / 百万 Token。员工还要求答案注明出自哪份制度。
      作为负责人，你最合理的回应是？
    options:
      - "同意，窗口够用就没有技术风险，还能省掉切片、检索和重排的开发与维护工作"
      - "同意，但换成窗口更大的模型版本留出余量，并开启 Prompt 缓存降低费用"
      - "不同意，因为超过 10 万 Token 后模型就无法读取，多出的部分会被全部忽略"
      - "不同意，全量输入每天约 $3,200 且首字慢，长上下文会退化、难给引用，应坚持 RAG"
    answer: [3]
    explain: |
      每次 80 万 Token × 2,000 次 = 16 亿 Token，按 $2 / 百万约 $3,200 / 天；若模型对超长输入加价（如 GPT-6.1 Sol 超过 272K 按 2 倍计），实际还要翻倍。缓存能降一部分但仍很高，且每次 prefill 很慢；长上下文退化让答案更不稳定，引用和权限过滤也难做。RAG 只放相关片段，成本、速度、可追溯性都更好。
      A、B 忽略了成本、延迟和效果；C 是错误事实。
interview:
  - id: d13-i1
    kp: d13-k1
    type: oral
    difficulty: 2
    question: "什么是 Token？为什么同一段中文在不同模型下 Token 数不一样？你在项目里怎么估算 Token 和成本？"
    key_points:
      - {text: "说明 Token 是模型处理文本的最小单位，由 BPE 等子词算法切分", dim: concept}
      - {text: "说明 Token 数取决于 tokenizer 词表，不同模型、不同代际可能不同", dim: principle}
      - {text: "给出计数方法：本地估算、官方计数接口、以 usage 为准", dim: engineering}
      - {text: "说明费用按输入、输出分别计价，推理 Token 按输出计、缓存有折扣", dim: principle}
      - {text: "结合项目说明预算估算与 usage 监控的做法", dim: project}
    reference: |
      Token 是模型处理文本的最小单位。现代模型用 BPE 这类子词算法：从字节开始，反复把最常相邻出现的片段合并进词表，直到词表达到预定大小。高频片段是 1 个 Token，罕见内容被拆成多个。
      **Token 数取决于 tokenizer**：不同模型的词表不同。比如我本地用 tiktoken 实测，同一句 20 个字的中文，cl100k_base 是 22 个 Token，o200k_base 只有 13 个，因为更大的词表收录了更多中文片段。所以不能用字数乘固定系数估算，换模型要重新测。
      **怎么估算**：开发时用对应模型的本地 tokenizer 粗估；需要精确时调用厂商的计数接口，它会把角色、工具定义、图片等结构开销算进去；最终以响应里的 usage 为准，写进日志对账。
      **成本**：费用 = 输入 Token × 输入单价 + 输出 Token × 输出单价，输出通常贵几倍；推理模型的推理 Token 按输出计费；命中 Prompt 缓存的输入有折扣。预算要用真实样本按这几项分别算，并考虑多轮对话的输入累加。
    oral: |
      Token 是模型处理文本的最小单位，一般用 BPE 切分：把最常一起出现的片段合并成一个 Token，常见词一个 Token，生僻内容拆成好几个。
      Token 数取决于具体模型的词表。我自己用 tiktoken 测过，同一句 20 个字的中文，旧编码 22 个 Token，新编码只要 13 个，所以我从来不按字数换算，换模型就重新测。
      项目里我会这么做：开发时本地估算，上线前用官方计数接口校准，最终以响应的 usage 为准写进日志。成本按输入、输出分别算，推理模型还要算上推理 Token，再考虑缓存折扣和多轮对话的累加，每天按功能和租户汇总，异常就告警。
  - id: d13-i2
    kp: d13-k3
    type: scenario
    difficulty: 3
    question: "你做的园区运营助手支持多轮对话。用户反馈两个问题：一是聊久了以后助手「忘了」最开始说的楼栋和时间范围；二是偶尔接口直接报上下文超长错误。请给出你的上下文管理方案。"
    key_points:
      - {text: "先做 Token 预算：窗口减去输出与推理预留和安全余量", dim: principle}
      - {text: "固定保留 System Prompt、工具定义和本轮问题", dim: engineering}
      - {text: "关键信息抽取成结构化会话记忆，每轮固定放入", dim: engineering}
      - {text: "历史保留最近若干轮，更早的合并为摘要；按完整消息、工具调用成对裁剪", dim: engineering}
      - {text: "发送前计数主动裁剪，记录截断日志，用长对话用例回归验证", dim: project}
    reference: |
      **问题分析**：「忘了楼栋」是滑动窗口把早期关键信息裁掉了；「超长报错」是没有在发送前计数，历史和工具结果无限增长。
      **方案**：
      1. **Token 预算**：输入预算 = 上下文窗口 − 预留输出（含推理）− 安全余量；发送前用对应模型的计数方式计算，超了就按策略裁剪，而不是等接口报错（有的平台还会静默截断）。
      2. **分层组装**：
         - 固定层：System Prompt、工具定义、本轮问题，永不裁剪；
         - 会话记忆层：把楼栋、时间范围、关注的告警类型、已创建的工单号抽取成结构化字段，每轮更新、固定放入，体积很小；
         - 历史层：最近若干轮原文；更早的对话合并成摘要；工具结果只保留聚合后的关键信息。
      3. **裁剪规则**：历史从最早开始移出；按完整消息裁剪，工具调用和结果成对保留或成对移除；被移出的内容合并进摘要或记忆字段。
      4. **可观测**：日志记录每次请求裁剪前后的 Token 数、丢弃条数、记忆字段内容，方便排查「它为什么忘了」。
      5. **验证**：构造 30 轮以上的长对话用例，检查关键字段是否一直正确、是否还出现超长错误。
    oral: |
      这两个问题其实是同一个根因：上下文没有预算管理。忘了楼栋是滑动窗口把早期信息裁掉了，超长报错是没在发送前计数。
      我的方案是先算预算：窗口减去输出和推理的预留，再留点余量。然后分三层组装：System Prompt、工具定义和本轮问题固定保留；楼栋、时间范围、工单号这些关键信息抽成结构化的会话记忆，每轮都带上，体积很小；历史只留最近几轮原文，更早的合并成摘要，工具结果只留聚合后的结论。
      裁剪时按完整消息删，工具调用和结果成对处理。最后日志记录裁剪前后的 Token 数，再用三十轮以上的长对话用例回归，确认楼栋不会丢、也不再报错。
  - id: d13-i3
    kp: d13-k4
    type: scenario
    difficulty: 4
    question: "老板说：「现在模型都有百万 Token 上下文了，我们知识库项目还做什么 RAG？把文档全塞进去不就行了。」请你说服他，或者给出你认为合理的折中方案。"
    key_points:
      - {text: "用具体数字说明全量输入的成本和首字延迟", dim: engineering}
      - {text: "指出 lost in the middle 与 context rot：装得下不等于用得好，相似干扰影响更大", dim: principle}
      - {text: "指出 RAG 在引用溯源、权限过滤、增量更新上的优势", dim: engineering}
      - {text: "给出折中：日常问答走 RAG，需要通读的少数任务用长上下文或分段汇总", dim: concept}
      - {text: "提出用评测集对比两种方案的准确率、成本、延迟来决策", dim: project}
    reference: |
      我会先认可长上下文的价值，再用数据说明为什么日常问答仍要 RAG。
      **成本与延迟**：假设文档共 80 万 Token、每天 2,000 次问答、输入 $2 / 百万 Token，全量输入每天约 16 亿 Token、约 $3,200；而且很多模型对超长输入加价，例如 GPT-6.1 Sol 输入超过 272K 时整次按 2 倍计，实际约 $6,400，即使部分命中缓存也很高；而且每次 prefill 要处理 80 万 Token，首字延迟会很长。RAG 每次只放几千 Token 的相关片段，成本和延迟低一到两个数量级。
      **效果**：窗口装得下不等于用得好。Lost in the Middle 研究发现信息放在中间时利用率明显下降；Chroma 的 context rot 研究显示输入越长表现越不稳定，相似干扰项（比如新旧版本制度）影响更大。
      **工程能力**：RAG 能精确给出引用来源、能在检索阶段按员工权限过滤（不该看的文档根本不进上下文）、文档更新只需增量入库；全量塞入很难做到这些。
      **折中方案**：日常问答走 RAG；全文摘要、全文比对这类确实需要通读的少数任务，再用长上下文或「分段处理再汇总」。
      **怎么决策**：用一份真实问题评测集，对比两种方案的答案准确率、引用正确率、单次成本和 P95 延迟，用数据定方案。
    oral: |
      我会先认同长上下文很有用，但日常问答还是建议 RAG，理由我会用数字讲。假设文档 80 万 Token、每天两千次问答，全塞进去每天光输入就要三千多美元，首字延迟也会很长；RAG 每次只放几千 Token，成本差一两个数量级。
      效果上，研究表明窗口装得下不等于用得好，信息在中间容易被忽略，输入越长越不稳定，新旧版本制度这种相似内容干扰更大。另外 RAG 能给出引用、能按员工权限过滤、文档更新只要增量入库。
      所以我的折中是：日常问答走 RAG，全文摘要、全文比对这种少数任务再用长上下文。最后拿真实问题评测集对比两种方案的准确率、成本和延迟，用数据给老板做决定。
