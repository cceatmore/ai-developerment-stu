day: 47
phase: 5
title: 性能与成本：延迟分解与首字时间、并发与限流、缓存与 Prompt Caching、模型路由与 Token 预算
goals:
  - 能把一次 RAG 或 Agent 请求的耗时拆成若干段，说清 TTFT、ITL、端到端延迟分别由什么决定、该怎么优化
  - 能用 Little 定律估算并发，设计「用户 RPM + 租户 TPM + 上游并发」的多层限流，并正确处理 429
  - 能按「静态在前、动态在后」组织 prompt 提高厂商缓存命中，并设计带租户和权限维度的应用层缓存
  - 能写出 LLM 成本公式，用模型路由、Batch、Token 预算降本，并用评测证明质量没掉
minutes: 75
