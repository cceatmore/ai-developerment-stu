  - title: "廖雪峰 Python 教程 - 使用 dict 和 set"
    url: "https://liaoxuefeng.com/books/python/basic/dict-set/index.html"
    kind: article
    lang: zh
    minutes: 15
    note: "看哈希原理（查字典的比喻）和「再议不可变对象」两段，正好解释可哈希；注意文中「dict 顺序与放入顺序无关」已过时，Python 3.7 起保证插入顺序"
