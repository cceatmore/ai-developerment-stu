day: 2
phase: 1
title: 数据结构
goals:
  - 能按「要不要顺序、要不要去重、要不要按键查找」在 list / tuple / dict / set 之间做出选择，并说清和 Array / Object / Map / Set 的差异
  - 能判断一个对象是否可变、是否可哈希，解释为什么 list 不能做 dict 的键
  - 能读懂切片和推导式，预判 `msgs[-3:]`、字典推导式重复键等写法的结果
  - 能判断什么时候浅拷贝就够、什么时候必须深拷贝，并定位「改了副本却影响原数据」的 bug
minutes: 60
