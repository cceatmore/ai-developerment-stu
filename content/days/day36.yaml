day: 36
phase: 4
title: LangGraph 基础：State、Node、Edge、Reducer 与条件边，从手写循环迁移到图
goals:
  - 能说清 LangGraph 相比 Day 32 手写 while 循环多了什么、什么时候不值得引入
  - 能设计一个 State 并给每个字段选对 reducer（覆盖、追加、按 ID 合并），解释并行写冲突为什么报错
  - 能用 StateGraph + 条件边画出 ReAct 循环，并说清 compile、super-step、recursion_limit 的作用
  - 能判断一个需求该用 create_agent + middleware 还是手写 StateGraph
minutes: 60
