day: 8
phase: 1
title: 数据库：PostgreSQL 建模、索引与事务、SQLAlchemy 2 异步 ORM、Alembic 迁移
goals:
  - 能为一个 AI 应用设计带约束的表结构（主键、外键、唯一约束、JSONB），并用唯一约束实现幂等写入
  - 能判断一个查询该建什么索引、复合索引列怎么排，并用 EXPLAIN ANALYZE 验证
  - 能识别「读-改-写」丢失更新，并用原子 UPDATE、行锁或乐观锁修复；知道为什么不能在事务里等 LLM
  - 能用 SQLAlchemy 2 异步写法和 Alembic 完成「建模 → 生成迁移 → 审查 → 升级」，避开懒加载和重命名丢数据的坑
minutes: 60
resources:
  - title: "廖雪峰 SQL 教程：事务（含四种隔离级别）"
    url: "https://liaoxuefeng.com/books/sql/transaction/"
    kind: article
    lang: zh
    minutes: 20
    note: "看事务和 Read Committed、Repeatable Read 两个子页，理解脏读、不可重复读、幻读。注意教程用的是 MySQL（默认 Repeatable Read），PostgreSQL 默认是 Read Committed"
  - title: "PostgreSQL 中文文档：11.3 多列索引"
    url: "http://www.postgres.cn/docs/current/indexes-multicolumn.html"
    kind: doc
    lang: zh
    minutes: 10
    note: "看第三段「前导列」规则和跳过扫描的例子，对照 k2 的复合索引列顺序；最后一段「多列索引应该较少使用」也值得记住"
  - title: "SQLAlchemy 2.1 文档：Asynchronous I/O (asyncio)"
    url: "https://docs.sqlalchemy.org/en/21/orm/extensions/asyncio.html"
    kind: doc
    lang: en
    minutes: 25
    note: "只看开头的 ORM 完整示例和「Preventing Implicit IO when Using AsyncSession」一节，对应 k3 的 expire_on_commit、selectinload、AsyncAttrs 与「每个并发任务一个会话」"
  - title: "Alembic 文档：Auto Generating Migrations"
    url: "https://alembic.sqlalchemy.org/en/latest/autogenerate.html"
