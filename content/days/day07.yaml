day: 7
phase: 1
title: HTTP 与 FastAPI：状态码语义、Pydantic v2 校验、依赖注入与统一错误处理
goals:
  - 能为 AI 接口选对 HTTP 方法和状态码（401/403/409/422/429/502/503/504），并解释幂等与重试的关系
  - 能讲清一个请求在 FastAPI 里经过的环节，用 Pydantic v2 写出带约束的请求/响应模型，并解释 422 怎么产生
  - 能用 Annotated + Depends + yield 依赖管理当前用户和数据库会话，用 lifespan 管理应用级资源
  - 能设计统一错误体与异常处理器，让前端 axios 拦截器只按一种格式处理错误
minutes: 60
resources:
  - title: "FastAPI 官方中文教程：依赖项"
    url: "https://fastapi.tiangolo.com/zh/tutorial/dependencies/"
    kind: doc
    lang: zh
    minutes: 20
    note: "看「创建依赖项」和「共享 Annotated 依赖项」两节，再点进同目录的「子依赖项」看 use_cache 的说明，对应 k3 里「同一请求只调用一次」"
  - title: "FastAPI 官方中文教程：处理错误"
    url: "https://fastapi.tiangolo.com/zh/tutorial/handling-errors/"
    kind: doc
    lang: zh
    minutes: 15
    note: "重点看「覆盖请求验证异常」和「FastAPI 的 HTTPException vs Starlette 的 HTTPException」，能回答 k4：处理器为什么要注册到 Starlette 的 HTTPException、为什么不要直接 str(exc) 返回"
  - title: "FastAPI 官方中文文档：生命周期事件"
    url: "https://fastapi.tiangolo.com/zh/advanced/events/"
    kind: doc
    lang: zh
    minutes: 10
    note: "只看 Lifespan 一节和「替代事件（弃用）」开头那段，确认 on_event 是旧写法、与 lifespan 不能混用"
  - title: "MDN：HTTP 响应状态码"
    url: "https://developer.mozilla.org/zh-CN/docs/Web/HTTP/Reference/Status"
    kind: doc
    lang: zh
    minutes: 10
    note: "当字典查：对照 k1 的表格看 401/403/409/422/429/502/503/504 的定义，不用通读"
knowledge_points:
  - id: d07-k1
    name: HTTP 语义：方法、幂等与状态码
    level: P1
    summary: 方法表达「想做什么」，状态码表达「结果是什么、谁的错、能不能重试」；状态码是前后端和网关之间的契约
    analogy: |
      **你在 axios 响应拦截器里写过：401 → 刷新令牌重试、403 → 跳无权限页、5xx → 弹「服务繁忙」。** 现在你站到了另一边：**后端决定返回哪个码**，前端拦截器能不能写简单，取决于后端是否遵守语义。

      **不一样的地方：** 前端只「消费」状态码；后端还要考虑**网关、重试中间件、监控告警**都按状态码工作。比如 nginx 和 SDK 会对 502/503/504 自动重试，监控按 5xx 比例告警，业务失败返回 200 会让这些机制全部失效。
    why: |
      AI 接口有很多「非典型失败」：模型超时、供应商限流、内容被安全策略拦截、配额用完。状态码选错，前端拦截器、网关重试、监控告警都会出错。
      面试中「401 和 403 区别」「为什么不全返回 200」「怎么防止重复提交」都是高频基础题。
    problem: |
      解决「**客户端怎么不看文档也知道发生了什么、该不该重试**」的问题。
      统一的方法语义告诉中间层能否缓存、能否安全重试；统一的状态码让前端、网关、监控按类别处理错误，而不用解析每个接口各自的 `code` 字段。
    principle: |
      **一、方法：安全与幂等**

      | 方法 | 用途 | 安全（不改数据） | 幂等（多次 = 一次） |
      |---|---|---|---|
      | GET | 查询 | 是 | 是 |
      | POST | 创建 / 触发动作（如「发起一次问答」） | 否 | **否** |
      | PUT | 整体替换 | 否 | 是 |
      | PATCH | 部分更新 | 否 | 不保证 |
      | DELETE | 删除 | 否 | 是 |

      **幂等决定能不能自动重试**：GET/PUT/DELETE 网络超时后重发不会出事；POST 重发可能**重复创建、重复扣费**。解决办法是客户端带一个 `Idempotency-Key` 请求头，服务端按 key 去重（Day 09 用 Redis 实现）。

      **二、状态码：按「谁的错、能否重试」记**

      | 码 | 含义 | AI 接口里的典型场景 | 客户端该怎么做 |
      |---|---|---|---|
      | 200 / 201 | 成功 / 已创建 | 返回回答 / 新建知识库 | — |
      | 202 | 已接受，异步处理 | 上传文档后排队入库 | 轮询任务状态 |
      | 400 | 请求本身有问题 | JSON 格式错 | 修请求 |
      | 401 | **没认证**（不知道你是谁） | Token 缺失或过期 | 刷新令牌 / 重新登录 |
      | 403 | **没权限**（知道你是谁，但不许） | 普通成员删知识库 | 提示无权限 |
      | 404 | 资源不存在 | 对话 ID 不存在 | — |
      | 409 | 和当前状态冲突 | 文档还在入库中又发起删除 | 稍后再试 |
      | 422 | 格式对但内容不合契约 | `max_tokens` 超上限（FastAPI 默认） | 修参数 |
      | 429 | 请求太多 | 用户超过每分钟配额 | **按 `Retry-After` 退避** |
      | 500 | 服务端 bug | 未处理的异常 | 报错，不必重试 |
      | 502 | 网关收到上游错误响应 | LLM 供应商返回异常 | 可重试 |
      | 503 | 暂时不可用 | 过载、维护、熔断打开 | 按 `Retry-After` 重试 |
      | 504 | 网关等上游超时 | 调 LLM 30 秒没返回 | 可重试，注意幂等 |

      ```mermaid
      flowchart TD
        A["请求失败了"] --> B{"是客户端的问题吗"}
        B -- "没登录或令牌过期" --> C["401"]
        B -- "登录了但没权限" --> D["403"]
        B -- "参数不合契约" --> E["422 或 400"]
        B -- "调用太频繁" --> F["429 加 Retry-After"]
        B -- "不是 服务端或上游" --> G{"是自己代码的 bug 吗"}
        G -- "是" --> H["500 记录堆栈"]
        G -- "上游返回错误" --> I["502"]
        G -- "上游超时" --> J["504"]
        G -- "过载或熔断" --> K["503 加 Retry-After"]
      ```

      **三、为什么不要「全部 200 + code 字段」**

      - 网关、SDK 的自动重试只认状态码，200 永远不会重试；
      - 监控按 5xx 比例告警，业务错误藏在 200 里就看不见；
      - 浏览器缓存、CDN 可能缓存 200 的错误响应。
      合理做法：**状态码表达大类，响应体里的 `code` 表达业务细节**（见 k4）。

      **四、RESTful 资源设计的最低要求**

      - URL 是名词资源：`/v1/knowledge-bases/{kb_id}/documents`，动作用方法表达；
      - 有版本前缀 `/v1`，破坏性改动开 `/v2`；
      - 「发起一次问答」这类动作可以设计成创建资源：`POST /v1/conversations/{id}/messages`。
    scenarios: |
      - **令牌过期**：返回 401，前端拦截器用刷新令牌换新 token 后重放原请求（你熟悉的无感刷新）。
      - **LLM 供应商超时**：你的服务作为网关返回 504，前端提示「模型响应超时，请重试」。
      - **用户配额用完**：返回 429 + `Retry-After: 60`，前端倒计时后允许再问。
      - **上传文档**：返回 202 + task_id，入库是后台任务（Day 09），前端轮询进度。
    pitfalls: |
      - **401 和 403 混用**：没权限返回 401，前端拦截器会去刷新令牌，刷新成功再重放又是 401，陷入死循环。
      - **业务失败返回 200**：重试、监控、告警全部失效，前端每个接口都要特判 `code`。
      - **POST 接口被自动重试**：网关或 SDK 对超时的 POST 重试，导致重复创建；要么关掉对 POST 的重试，要么支持幂等键。
      - **把 500 当万能码**：上游超时、参数错误都返回 500，排查时分不清是自己的 bug 还是供应商问题。
      - **429 不带 Retry-After**：客户端只能盲目重试，反而加重限流。
    interview_asks:
      - question: "401 和 403 有什么区别？前端拦截器里分别怎么处理？"
        answer: "401 是没登录或登录失效，前端清掉本地登录态，跳登录。403 是已经知道你是谁，但没有权限，提示无权限，不要重新登录。不要两个都弹同一个「请重新登录」。"
      - question: "哪些 HTTP 方法是幂等的？POST 接口怎么防止重复提交？"
        answer: "GET、PUT、DELETE 重复做，结果应和第 1 次一样。POST 创建资源，重复就会多建一条。防重复靠客户端传一个幂等键，服务端记下这个键，第二次返回第一次的结果。"
      - question: "你的服务调用 LLM 超时，应该返回什么状态码？502 和 504 有什么区别？"
        answer: "模型服务没在时限内响应，返回 504。502 是上游给了无效响应或连接就失败了。这是上游的问题，不要返回 500 装成自己的代码崩了，也不要返回 200 再在正文里说失败。"
    project_example: |
      **p1 企业知识库**的接口约定（Day 07 骨架模块）：
      - `POST /v1/knowledge-bases/{kb_id}/documents` 上传文档返回 **202** + task_id；
      - `POST /v1/conversations/{id}/messages` 发起问答，LLM 超时返回 **504**，供应商 5xx 返回 **502**，用户超配额返回 **429 + Retry-After**；
      - 普通成员访问无权限的知识库返回 **403**，令牌过期返回 **401**。
      这份约定写进 README，前端 axios 拦截器按状态码分四类处理即可。
    sources:
      - {title: "MDN - HTTP 响应状态码", url: "https://developer.mozilla.org/zh-CN/docs/Web/HTTP/Reference/Status"}
  - id: d07-k2
    name: FastAPI 路由与 Pydantic v2 请求校验
    level: P0
    summary: 路由函数的类型注解就是接口契约；Pydantic 在进入业务代码前完成转换与校验，不合法直接返回 422
    analogy: |
      **Pydantic 模型 ≈ zod schema + `z.infer` 出来的 TS 类型，一份定义同时管校验和类型。** FastAPI 再把它自动生成 OpenAPI 文档（`/docs`），相当于 zod + swagger 一起做了。

      **不一样的地方：**
      - **默认是宽松（lax）模式**：字段是 `int`，收到字符串 `"512"` 会**自动转成 512**；zod 的 `z.number()` 默认会直接报错（要 `z.coerce.number()` 才转换）。需要严格时用 `Field(strict=True)` 或 `ConfigDict(strict=True)`。
      - zod 校验在你调用 `parse` 时发生；FastAPI 的校验在**路由函数执行之前**由框架自动完成，失败时你的函数一行都不会跑。
    why: |
      外部输入永远不可信：前端 bug、第三方误用、恶意脚本、LLM 生成的工具参数都可能格式错误。
      Pydantic 是 FastAPI 的校验引擎，也是后面结构化输出（Day 16）、Function Calling 参数 Schema（Day 17）、LangGraph State 的基础。AI 工具常常生成 Pydantic v1 的旧写法，你必须一眼认出来。
    problem: |
      解决「**在系统边界上把不可信的原始数据变成可信、类型正确的对象**」的问题。
      没有统一校验，业务代码里到处是 `body.get("max_tokens", 0)`，漏一处就是 500；不限制长度和范围，一个请求就可能把 Token 费用和上下文打爆。
    principle: |
      **一、一个请求在 FastAPI 里的旅程**

      ```mermaid
      flowchart TD
        A["客户端 HTTP 请求"] --> B["uvicorn 解析协议 转成 ASGI 调用"]
        B --> C["中间件 CORS 日志 请求 ID"]
        C --> D["路由匹配 方法加路径"]
        D -- "无匹配" --> D1["404 或 405"]
        D --> E["执行依赖 当前用户 数据库会话"]
        E --> F["从路径 查询 头 请求体提取参数"]
        F --> G["Pydantic 校验与类型转换"]
        G -- "失败" --> G1["RequestValidationError 返回 422"]
        G --> H["执行路由函数"]
        H --> I["按返回类型或 response_model 过滤并序列化"]
        I --> J["响应经中间件返回"]
      ```

      三层结构：**uvicorn**（ASGI 服务器）→ **Starlette**（路由、中间件、请求响应对象）→ **FastAPI**（按签名解析参数 + Pydantic 校验 + 依赖注入 + OpenAPI）。

      **二、参数从哪来：FastAPI 的推断规则**

      | 参数写法 | FastAPI 理解为 |
      |---|---|
      | 名字出现在路径模板里，如 `kb_id: int` 对应 `/kb/{kb_id}` | 路径参数 |
      | 简单类型且不在路径里，如 `top_k: int = 5` | 查询参数，有默认值就可选 |
      | 类型是 Pydantic 模型 | JSON 请求体 |
      | `Annotated[str, Header()]` / `Query()` / `Cookie()` | 按声明的位置取 |
      | `Annotated[User, Depends(fn)]` | 依赖（k3） |

      **注意：** `list[str]` 不写 `Query()` 会被当成**请求体**。

      **三、Pydantic v2 模型 = 数据契约**

      ```python
      from pydantic import BaseModel, ConfigDict, Field

      class AskIn(BaseModel):
          model_config = ConfigDict(extra="forbid")   # 多余字段直接报错
          question: str = Field(min_length=1, max_length=4000)
          top_k: int = Field(default=5, ge=1, le=20)
          stream: bool = False
      ```

      - 类型 + `Field` 约束（长度、范围、正则、默认值、描述）共同定义契约；
      - `@field_validator("question")` 写单字段规则，`@model_validator(mode="after")` 写跨字段规则，里面 `raise ValueError` 会汇总进 422；
      - 校验核心是 Rust 写的 pydantic-core，速度快。

      **四、422 怎么产生**

      校验失败时 FastAPI 抛 `RequestValidationError`，默认返回：

      ```json
      {"detail": [{"type": "less_than_equal", "loc": ["body", "top_k"], "msg": "Input should be less than or equal to 20", "input": 99}]}
      ```

      `loc` 精确到位置和字段，前端可以据此高亮表单项。**此时路由函数完全没有执行。**

      **五、响应模型：控制输出，防止泄露**

      返回类型注解 `-> KbOut` 或 `response_model=KbOut`，FastAPI 会按模型**过滤**输出：ORM 对象里的 `owner_token`、`cost` 等未声明字段不会返回。

      **六、v1 → v2 写法对照（AI 常生成旧写法）**

      | 用途 | v1 旧写法 | v2 当前写法 |
      |---|---|---|
      | 模型配置 | `class Config:` | `model_config = ConfigDict(...)` |
      | 转字典 / JSON | `.dict()` / `.json()` | `.model_dump()` / `.model_dump_json()` |
      | 从字典构造 | `.parse_obj()` | `.model_validate()` |
      | 从 ORM 对象构造 | `orm_mode = True` | `from_attributes=True` |
      | 校验器 | `@validator` / `@root_validator` | `@field_validator` / `@model_validator` |
    scenarios: |
      - **限制成本**：`top_k` 加 `le=20`、`question` 加 `max_length`，防止单个请求撑爆上下文和费用。
      - **防字段注入**：`extra="forbid"` 拒绝前端传入 `user_id`、`role` 这类不该由客户端决定的字段。
      - **前后端联调**：前端直接在 `/docs` 试调接口；也可以用 OpenAPI 生成 TS 类型，前后端共用一份契约。
      - **校验 LLM 输出**：同一套 Pydantic 模型校验模型生成的 JSON（Day 16），失败时触发重试。
    code: |
      ```python
      from typing import Annotated

      from fastapi import APIRouter, FastAPI, Query
      from pydantic import BaseModel, ConfigDict, Field, field_validator

      router = APIRouter(prefix="/v1", tags=["chat"])


      class AskIn(BaseModel):
          model_config = ConfigDict(extra="forbid")
          question: str = Field(min_length=1, max_length=4000)
          top_k: int = Field(default=5, ge=1, le=20)

          @field_validator("question")
          @classmethod
          def not_blank(cls, v: str) -> str:
              if not v.strip():
                  raise ValueError("question 不能只包含空白")
              return v.strip()


      class AnswerOut(BaseModel):
          answer: str
          citations: list[str]


      @router.post("/knowledge-bases/{kb_id}/ask")
      async def ask(
          kb_id: int,                                   # 路径参数
          body: AskIn,                                  # JSON 请求体
          tags: Annotated[list[str], Query()] = [],     # 列表必须显式 Query
      ) -> AnswerOut:                                   # 返回值按 AnswerOut 过滤
          return AnswerOut(answer=f"kb {kb_id}: {body.question}", citations=tags)


      app = FastAPI()
      app.include_router(router)
      ```
    pitfalls: |
      - **用 `body: dict` 接收请求体**：完全没有校验，缺字段时业务代码 KeyError 变 500，文档里也看不到字段说明。
      - **只限类型不限范围**：`max_tokens: int` 允许传 1000000，`question: str` 允许传 10MB 文本。
      - **混用 v1 写法**：`class Config`、`.dict()`、`@validator` 在 v2 里会报弃用警告或行为不同；FastAPI 已移除对 Pydantic v1 的支持。
      - **路由顺序冲突**：`/users/me` 要写在 `/users/{user_id}` 前面，否则 `me` 被当成 user_id 解析，返回 422。
      - **误区：422 是服务端 bug。** 422 是调用方不符合契约；但如果突然大量出现，多半是前后端版本不一致。
      - **生产环境开放 `/docs`**：暴露全部接口结构，应关闭（`docs_url=None`）或加鉴权。
    interview_asks:
      - question: "一个请求进入 FastAPI 后经历了哪些步骤？422 是在哪一步产生的？"
        answer: "先匹配路由，再按类型注解解析路径、查询和请求体，Pydantic 校验失败就直接 422，你的函数还没执行。过了校验才进依赖和路由函数。所以 422 是入参不合法，不是业务拒绝。"
      - question: "Pydantic v2 和 v1 写法上有哪些主要区别？"
        answer: "校验器用 field_validator，模型配置用 model_config，导出用 model_dump。v1 的 validator、class Config、dict() 不要再写。v2 默认更严格，字符串不会随便变成数字，除非你声明。"
      - question: "为什么建议声明响应模型？"
        answer: "响应模型会过滤掉没声明的字段，避免把密码哈希、内部 id 漏给前端。它也固定了返回形状，前端不用猜。不要直接返回 ORM 对象。"
    project_example: |
      **p1 企业知识库**骨架里，问答接口用 `AskIn` 约束：问题 1~4000 字、`top_k` 1~20、`extra="forbid"`；用户 ID **不在请求体里**，只从鉴权依赖获取（k3）。
      输出用 `AnswerOut`，只包含回答和引用，不包含内部检索分数和 Token 成本。
      验收标准：传 `top_k=99` 返回 422 且 `loc` 指向 `["body","top_k"]`；请求体里多传 `user_id` 返回 422；`/docs` 能看到每个字段的说明。
    freshness: |
      核对于 2026-11：
      - **FastAPI 0.162.5**（2026-11-11）；0.129 起最低 Python 3.10；0.126 移除对 Pydantic v1 的支持，0.128 移除 `pydantic.v1` 兼容层。新项目只用 Pydantic v2 写法。
      - 0.130：声明了返回类型或 response_model 时，JSON 响应由 Pydantic（Rust）直接序列化。
      - 0.151：JSON 请求体区分「显式传 null」和「没传」，默认值只在没传时生效；想用默认值的客户端应省略字段而不是传 null。
      - **Pydantic 2.14.3**（2026-11-04）；2.14 起不再支持 Python 3.9、支持 Python 3.15。v2 核心 API（`model_validate`、`model_dump`、`ConfigDict`、`field_validator`）保持稳定。
    sources:
      - {title: "FastAPI Release Notes", url: "https://fastapi.tiangolo.com/release-notes/"}
      - {title: "Pydantic Migration Guide", url: "https://pydantic.dev/docs/validation/latest/get-started/migration/"}
      - {title: "Pydantic v2.14 Release", url: "https://pydantic.dev/articles/pydantic-v2-14-release"}
