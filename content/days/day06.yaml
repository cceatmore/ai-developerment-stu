day: 6
phase: 1
title: 异步与并发：事件循环、async/await、gather 与超时、GIL 选型
goals:
  - 能解释事件循环如何用单线程服务大量请求，并判断一段代码会不会「卡住整个进程」
  - 能说清 Python 协程和 JS async 函数的关键差异（调用即执行 vs 调用只得到协程对象）
  - 能用 TaskGroup + asyncio.timeout + Semaphore 写出「并发调用、整体限时、部分失败可降级」的逻辑
  - 能根据 I/O 密集 / CPU 密集判断该用协程、线程还是进程，并准确说出 free-threaded Python 的现状
minutes: 60
