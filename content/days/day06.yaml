knowledge_points:
  - id: d06-k1
    name: 事件循环与「阻塞一处、全进程卡住」
    level: P0
    summary: asyncio 用一个线程轮流执行任务；任何不让出控制权的阻塞代码，会让同进程的所有请求一起卡住
    analogy: |
      **像浏览器主线程 / Node.js 事件循环。** 你在前端写过一个 2 秒的同步大循环，页面就整个点不动（Long Task）；Node 里用 `fs.readFileSync` 处理大文件，整个服务都不响应。asyncio 是同一个模型。

      **不一样的地方：**
      - Node 的 I/O API **默认是异步的**（`fetch`、`fs.promises`），Python **默认是同步的**：`requests`、`time.sleep`、`psycopg2` 都会阻塞，必须换成 `httpx.AsyncClient`、`asyncio.sleep`、`asyncpg` 这类异步库。
      - Node 的 libuv 会把文件 I/O 自动放到后台线程池；Python 需要你**手动** `asyncio.to_thread(...)`。
    why: |
      AI 后端大部分时间都在**等**：等 LLM（几秒到几十秒）、等向量库、等数据库。异步框架（FastAPI + httpx）正是为此而生。
      但它有一个致命前提：**每个任务都要及时让出控制权**。在 async 路由里混进一个同步调用，就是线上「所有接口一起变慢、健康检查超时、容器被反复重启」的经典事故，而且本地单人测试完全发现不了。
    problem: |
      解决「**少量线程如何同时服务大量慢连接**」的问题。
      同步模型下一个在等 LLM 的请求就占住一个线程，100 个并发就要 100 个线程；异步模型下一个线程在等待期间去处理其他请求。
      同时要让你理解它的代价：事件循环是**协作式调度**，不会强行打断正在运行的代码，所以哪些代码能放进 async 函数、哪些必须挪走，你必须自己判断。
    principle: |
      **一、先把四个词说清楚**

      | 词 | 人话 | 例子 |
      |---|---|---|
      | 同步 | 调用后**原地等**结果 | `requests.get()` 返回前线程卡住 |
      | 异步 | 发出去**先干别的**，好了再回来 | `await client.get()` |
      | 并发 | 一段时间内**交替推进**多个任务 | 一个厨师看三口锅 |
      | 并行 | 同一时刻**真正同时执行** | 三个厨师各看一口锅，需要多核 |

      **asyncio 是单线程并发，不是并行。** 它不让单个请求变快，而是让同样的资源**同时挂住更多请求**（提升吞吐量）。

      **二、事件循环每一轮在做什么**

      1. 从**就绪队列**取出任务，运行它的 Python 代码，直到它遇到一个**真正需要等待**的 `await` 挂起，或者结束；
      2. 问操作系统哪些 socket 有数据了、哪些定时器到期了（底层是 epoll / kqueue / IOCP 多路复用）；
      3. 把对应任务放回就绪队列，进入下一轮。

      ```mermaid
      flowchart TD
        A["就绪队列 取出一个任务"] --> B["运行该任务的 Python 代码"]
        B --> C{"遇到需要等待的 await"}
        C -- "是" --> D["挂起任务 登记 socket 或定时器"]
        C -- "否 任务结束" --> E["设置结果 唤醒等它的任务"]
        D --> F["询问操作系统 哪些 IO 就绪 哪些定时器到期"]
        E --> F
        F --> G["就绪任务放回队列"]
        G --> A
        B -. "time.sleep 或 requests.get" .-> H["整个循环停住 所有任务都无法推进"]
      ```

      **三、协作式调度：谁不让出，大家一起等**

      - 循环**只有一个线程**。任务 A 在跑 Python 代码时，B、C、D 都在排队。
      - A 调用 `time.sleep(5)`：线程被操作系统挂起 5 秒，**事件循环也停了**。这 5 秒里：其他请求不处理、定时器不触发（**包括 `asyncio.timeout` 的超时**）、健康检查无响应。
      - CPU 密集计算同理：在协程里做 2 秒的大文本正则清洗，这 2 秒进程对外「假死」。

      **四、FastAPI 里的三种情况**

      | 写法 | 在哪运行 | 有阻塞调用时 |
      |---|---|---|
      | `async def` + 异步库 | 事件循环线程 | 正常，高并发 |
      | `async def` + 同步阻塞库 | 事件循环线程 | **整个 worker 进程卡住** |
      | `def` + 同步阻塞库 | FastAPI 放进线程池 | 只占一个线程，线程池满了才排队 |

      所以 FastAPI 官方建议：**库不支持 await，就把路由写成普通 `def`**，而不是写 `async def` 再在里面阻塞。

      **五、修复阻塞的三种办法（按优先级）**

      1. **换异步库**：`requests` → `httpx.AsyncClient`；`psycopg2` → `asyncpg` / psycopg 3；`time.sleep` → `asyncio.sleep`。
      2. **阻塞调用丢到线程**：`await asyncio.to_thread(func, *args)`，适合换不掉的同步 SDK、文件读写。
      3. **CPU 密集丢到进程**：进程池或独立 worker（见 k4）。

      **六、怎么发现阻塞**

      - 现象特征：**所有接口同时变慢**、CPU 不高、`/healthz` 超时。
      - 开 asyncio debug 模式（`PYTHONASYNCIODEBUG=1`），单步执行超过 0.1 秒的任务会打印 `Executing <Task ...> took X seconds`。
      - `py-spy dump --pid` 看主线程卡在哪个调用；Python 3.14 起还可以 `python -m asyncio pstree PID` 看异步任务树。
    scenarios: |
      - **LLM 对话接口**：每个请求等模型 5~30 秒，用 FastAPI + `httpx.AsyncClient`，一个进程就能挂住几百个并发连接。
      - **只有同步版本的厂商 SDK**（OCR、语音识别）：用 `asyncio.to_thread` 包一层，避免卡住事件循环。
      - **上传文件落盘**：大文件写盘放到线程里，否则上传高峰期全站抖动。
      - **排查「全站变慢」告警**：先判断是不是事件循环被阻塞，再看是不是下游慢。
    code: |
      ```python
      import asyncio
      import time

      import httpx
      import requests


      async def bad(url: str) -> int:
          # 错误：同步库在 async 函数里阻塞整个事件循环
          return requests.get(url, timeout=10).status_code


      async def good(client: httpx.AsyncClient, url: str) -> int:
          # 推荐：异步库，等待期间让出控制权
          resp = await client.get(url)
          return resp.status_code


      def legacy_ocr(image: bytes) -> str:
          time.sleep(2)  # 模拟只能同步调用的第三方 SDK
          return "text"


      async def ocr(image: bytes) -> str:
          # 换不掉的同步调用：放进线程，事件循环继续服务其他请求
          return await asyncio.to_thread(legacy_ocr, image)
      ```
    pitfalls: |
      - **误区：只有我这个请求慢。** async 路由里阻塞，慢的是**同进程所有请求**，这是它和普通「接口慢」最大的区别。
      - **误区：写了 `async def` 就是异步。** 函数体里调的是 `requests`、`time.sleep`、同步 Redis 客户端，它照样阻塞，而且阻塞的是整个循环。
      - **误区：`asyncio.timeout` 能兜住阻塞代码。** 超时靠事件循环触发定时器；循环停摆时定时器根本没机会执行。
      - **误区：异步 = 更快。** 8 秒的 LLM 调用异步后还是 8 秒，提升的是吞吐量。
      - **隐藏的阻塞点**：`json.dumps` 超大对象、`pandas.read_csv` 读大文件、日志同步写网络盘。
    interview_asks:
      - question: "在 FastAPI 的 async 路由里调用 requests.get 会有什么后果？怎么修？"
        answer: "requests 是同步的，一调用就把整个事件循环卡住，别的请求一起等。要改成 httpx 的 AsyncClient 并 await；如果库只有同步版本，就放到线程池里跑，别直接堵在 async 函数里。"
      - question: "事件循环是怎么工作的？为什么单线程能撑住大量并发连接？"
        answer: "一个线程轮流处理已经就绪的任务。某个请求在等网络时，循环去处理别的请求，不等这条线程干坐着。卡住的前提是你别做耗时的同步计算或同步 IO。等待多、计算少时，单线程就能撑很多连接。"
      - question: "线上所有接口同时变慢、CPU 却不高，你怎么判断是不是事件循环被阻塞了？"
        answer: "CPU 不高说明不是算力打满，更像有人在事件循环里做同步等待。看是不是所有请求一起变慢、包括本来很快的健康检查。再查有没有在 async 路由里调用 requests、time.sleep 或大段同步解析。"
    project_example: |
      在 **p1 企业知识库问答**里，一次回答要：查权限（Redis）、向量检索（PostgreSQL）、调用 LLM（数秒）。
      如果检索用了同步 `psycopg2`、PDF 解析也写在 async 路由里，压测时连 `/healthz` 都会超时。
      正确做法：检索走 SQLAlchemy AsyncSession + asyncpg（Day 08），LLM 走共享的 `httpx.AsyncClient`（Day 14），PDF 解析放到后台任务（Day 09）。验收时用压测并发访问 `/healthz`，确认它的延迟不受问答请求影响。
    freshness: |
      核对于 2026-11（当前稳定版 Python 3.15，2026-10-09 发布）：
      - `asyncio.to_thread` 自 3.9 起可用；官方文档说明受 GIL 影响，它通常只适合让 **I/O 型**函数不阻塞。
      - Python 3.14 新增 `python -m asyncio ps PID` / `pstree PID` 查看运行中进程的异步任务。
      - asyncio 事件循环策略（policy）系统已弃用、计划在 3.16 移除；入口统一写 `asyncio.run(main())`，需要换循环实现时用 `asyncio.Runner(loop_factory=...)`。旧写法 `loop = asyncio.get_event_loop(); loop.run_until_complete(...)` 不再推荐。
    sources:
      - {title: "Python Docs - Coroutines and Tasks", url: "https://docs.python.org/3/library/asyncio-task.html"}
      - {title: "What's New in Python 3.14", url: "https://docs.python.org/3/whatsnew/3.14.html"}
      - {title: "What's New in Python 3.15", url: "https://docs.python.org/3/whatsnew/3.15.html"}
      - {title: "FastAPI - 并发 async / await", url: "https://fastapi.tiangolo.com/zh/async/"}
  - id: d06-k2
    name: 协程与 async/await 语义
    level: P0
    summary: 调用 async 函数只得到协程对象，await 才驱动它执行，并在等待点把控制权交回事件循环
    analogy: |
      **`async def` ≈ JS 的 `async function`，`await` ≈ JS 的 `await`，Task ≈ 一个已经开始跑的 Promise。**

      **最大的不一样：**
      - JS 调用 `fetchUser()` 会**立刻执行**到第一个 await，返回一个 Promise（急切）。
      - Python 调用 `fetch_user()` **一行都不执行**，只返回一个协程对象（惰性），要 `await` 或 `create_task` 才开始跑。
      - JS 忘写 await 拿到的是 pending 的 Promise，请求其实已经发出去了；Python 忘写 await，**请求根本没发**，只留下一句 `RuntimeWarning: coroutine ... was never awaited`。
    why: |
      靠 AI 写代码时最常见的异步 bug 都和 await 语义有关：漏写 await 导致「保存消息」根本没执行；在同步函数里调异步函数；以为 await 会开新线程。
      后面课程里 FastAPI 路由、LangGraph 节点、MCP 客户端到处都是 `async def`，不理解「暂停 / 恢复」就读不懂执行顺序。
    problem: |
      解决「**如何用顺序写法表达异步逻辑**」的问题。
      回调写法层层嵌套、异常难处理（就是 JS 的回调地狱）；async/await 让你从上往下写代码，在每个 `await` 处函数可以**暂停**、把线程让给别人，结果到了再从原处**恢复**，异常也能用普通 try/except 捕获。
    principle: |
      **一、协程是什么**

      协程是一种**可以暂停、之后再恢复**的函数，和 Day 05 学的生成器是近亲：生成器在 `yield` 处暂停，协程在 `await` 处暂停。

      - `async def f(): ...` 定义的是**协程函数**；
      - **调用 `f()` 不执行函数体**，只得到一个协程对象（一张「待执行的任务单」）；
      - 只有被 `await`，或被包装成 **Task** 交给事件循环，函数体才开始跑。

      **二、`await x` 做了四件事**

      1. 驱动 `x`（协程 / Task / Future）往下执行；
      2. 如果它要等 I/O，就**挂起当前协程**，控制权交回事件循环；
      3. 事件循环去运行其他就绪任务；
      4. I/O 完成后当前协程重新就绪，轮到它时**从 await 那一行恢复**，拿到结果。

      ```mermaid
      stateDiagram-v2
        state "已创建 协程对象" as Created
        state "运行中" as Running
        state "挂起 等待 IO" as Suspended
        state "已完成" as Done
        [*] --> Created: 调用 async 函数
        Created --> Running: 被 await 或包装成 Task
        Running --> Suspended: 遇到真正需要等待的 await
        Suspended --> Running: IO 完成 事件循环恢复它
        Running --> Done: return 或抛出异常
        Done --> [*]
      ```

      **三、await 不是「开线程」**

      `await` 不创建线程，也不让代码并行，它只是一个**主动让出点**。如果被 await 的协程内部没有真正的等待（比如直接 `return 1`），根本不会发生切换。

      **四、三种可等待对象**

      | 类型 | 怎么来 | 特点 |
      |---|---|---|
      | 协程对象 | 调用 `async def` 函数 | await 时才执行，只能 await 一次 |
      | Task | `asyncio.create_task(coro)` 或 `tg.create_task(coro)` | **创建后立刻被调度**，还没 await 也会跑 |
      | Future | 通常由库创建 | 代表「将来会有的结果」 |

      **关键区别：** `await coro()` 是「现在执行并等它完成」；`create_task(coro())` 是「交给事件循环跑，我先往下走」。**想并发，必须先把多个协程变成 Task。**

      ```python
      # 串行：约 2 秒
      a = await fetch("a")
      b = await fetch("b")

      # 并发：约 1 秒（两个 Task 创建时都已开始调度）
      ta = asyncio.create_task(fetch("a"))
      tb = asyncio.create_task(fetch("b"))
      a, b = await ta, await tb
      ```

      **五、async 的传染性**

      - `await` 只能写在 `async def` 里（Jupyter 和 `python -m asyncio` REPL 例外）。
      - 一个函数要等异步结果，它自己也得是 `async def`，一路向上直到入口 `asyncio.run(main())` 或框架（FastAPI 替你跑事件循环）。
      - **不要**在已经运行事件循环的地方（比如 FastAPI 路由里）再调 `asyncio.run()`，会报 `RuntimeError`。
    scenarios: |
      - **FastAPI 路由**：`async def chat()` 里 `await client.post(...)` 调 LLM，等待期间同一进程继续接其他请求。
      - **流式输出**：`async for chunk in stream:` 每拿到一段 token 就推给前端（异步生成器，Day 10 的 SSE 用到）。
      - **Agent 工具调用**：LangGraph、MCP SDK 的节点和工具函数大多是 `async def`，读懂 await 才能看懂执行顺序。
      - **排查「数据没写进去」**：日志里出现 `was never awaited`，第一反应就是漏了 await。
    code: |
      ```python
      import asyncio


      async def get_answer(q: str) -> str:
          print("开始调用模型", q)
          await asyncio.sleep(1)
          return f"answer to {q}"


      async def main() -> None:
          coro = get_answer("hi")   # 什么都没打印：只创建了协程对象
          print(type(coro))          # <class 'coroutine'>
          print(await coro)          # 现在才执行函数体

          task = asyncio.create_task(get_answer("bg"))  # 立即被调度
          await asyncio.sleep(0)     # 让出一次，后台任务开始打印
          print(await task)


      asyncio.run(main())
      ```
    pitfalls: |
      - **忘记 await**：`client.post(...)` 少写 await，拿到协程对象，后面 `.json()` 报 `AttributeError`；像 `save_message()` 这类无返回值的调用则是**静默不执行**。
      - **在同步函数里调异步函数**：直接调用只得到协程对象；在 FastAPI 里套 `asyncio.run()` 又会报事件循环已在运行。正确做法是让调用链变成 async。
      - **创建 Task 不保存引用**：事件循环只持有 Task 的弱引用，官方文档明确说可能在执行中被垃圾回收；用 TaskGroup 或把 Task 存进集合。
      - **混淆：逐个 await 不是并发。** `await a(); await b()` 是串行的。
    interview_asks:
      - question: "调用一个 async 函数但不 await，会发生什么？和 JS 有什么不同？"
        answer: "你只是创建了协程对象，函数体不会执行，结果也拿不到。Python 还会警告这个协程没被等待。JS 里不 await 的 Promise 仍会跑。Python 必须 await，或者丢给 create_task。"
      - question: "await 的时候到底发生了什么？它和多线程有什么区别？"
        answer: "await 表示这里要等 IO，先把控制权交回去，事件循环去干别的，好了再回来。全程还是一个线程，没有并行计算。多线程是多个线程可以同时被调度，适合堵在同步库上的活。"
      - question: "协程和生成器有什么关系？"
        answer: "早期协程就是用生成器做的，靠 yield 把控制权交出去。现在的 async def 是专门的协程，用 await 暂停。不要再写基于生成器的协程。生成器仍然适合「一个一个产出数据」。"
    project_example: |
      **p2 智慧园区运营 Agent** 里有一个「保存对话记录」的函数被改成了 `async def save_message()`，但工具执行完后的调用处没加 await。
      现象：Agent 多轮对话时「忘记」上一轮内容，日志里只有一条 `RuntimeWarning: coroutine 'save_message' was never awaited`。
      修复：补上 await；在 pytest 配置里把这个警告升级为错误（`filterwarnings = error::RuntimeWarning`），并开启 pyright 的 `reportUnusedCoroutine` 检查，让 CI 直接拦住同类问题。
  - id: d06-k3
    name: 并发编排：gather、TaskGroup、超时、取消与并发上限
    level: P0
    summary: 多个异步调用要一起发、统一超时、出错能收拾干净；现代写法是 TaskGroup + asyncio.timeout + Semaphore
    analogy: |
      | JS | Python | 说明 |
      |---|---|---|
      | `Promise.all` | `asyncio.gather` | 一起等，按顺序返回 |
      | `Promise.allSettled` | `gather(..., return_exceptions=True)` | 失败也当结果返回 |
      | `Promise.race` + `AbortController` | `asyncio.timeout` / `TaskGroup.cancel()` | 超时与提前结束 |
      | `p-limit` | `asyncio.Semaphore` | 并发上限 |

      **不一样的地方：**
      - JS 的 Promise **没有内置取消**，要手动把 `AbortSignal` 一层层传下去；Python 的取消是**内建的**：取消一个 Task，会在它下一次 await 处抛 `CancelledError`，httpx 请求会被中断。
      - JS 没有 TaskGroup 这种**结构化并发**：`Promise.all` 一个 reject 后，其余请求照样在跑（这点和 gather 一样）。
    why: |
      AI 应用里「同时调多个东西」非常普遍：多路检索、主备模型兜底、批量 Embedding、Agent 并行执行多个工具。
      写不好就会：一个下游挂了整个请求卡死；超时后后台请求还在偷偷跑（**继续烧 Token 费用**）；异常被吞没人知道；并发太高触发供应商 429。gather 和 TaskGroup 的区别也是面试高频题。
    problem: |
      解决三个问题：
      1. **并发执行**：多个 I/O 同时发起，总耗时接近最慢的那个，而不是相加；
      2. **生命周期管理**：一个失败时其他要不要取消？超时后怎么保证没有「孤儿任务」？
      3. **资源保护**：限制同时在飞的请求数，避免打爆 LLM 限流或数据库连接池。
    principle: |
      **一、gather：老牌的「一起等」**

      `results = await asyncio.gather(a(), b(), c())`

      - 并发执行，按**传入顺序**返回结果。
      - 默认 `return_exceptions=False`：第一个异常**立刻**抛给调用者，但**其他任务不会被取消**，继续在后台运行（官方文档原话）。LLM 场景下就是：用户已经看到报错了，另外两个模型还在计费。
      - `return_exceptions=True`：异常被当作结果放进列表，调用方**必须逐个检查**，否则异常被静默吞掉。

      **二、TaskGroup：结构化并发（3.11+）**

      ```python
      async with asyncio.TaskGroup() as tg:
          t1 = tg.create_task(call_model_a(prompt))
          t2 = tg.create_task(call_model_b(prompt))
      # 离开 async with 时，组内所有任务都已结束
      print(t1.result(), t2.result())
      ```

      - **结构化**的意思：任务的生命周期被限制在 `async with` 块内，块结束时保证所有子任务都已完成或已取消，**不会留下孤儿任务**。
      - 任一子任务抛出普通异常 → **自动取消其余任务** → 等它们退出 → 打包成 `ExceptionGroup` 抛出，用 `except*` 分类处理。
      - 想要「部分失败也继续」：在**子任务内部** try/except，把失败转成返回值（如 None）。
      - **3.15 新增 `tg.cancel()`**：目标已达成（例如已拿到第一个成功结果）时，**非异常地**提前结束整个组。

      **三、asyncio.timeout：统一超时（3.11+）**

      ```python
      try:
          async with asyncio.timeout(8):
              async with asyncio.TaskGroup() as tg:
                  ...
      except TimeoutError:
          ...  # 降级
      ```

      - 到期时**取消当前任务**，在块边界把 `CancelledError` 转换成内置 `TimeoutError`，所以**只能在 `async with` 外面捕获**。
      - 和 TaskGroup 组合：超时 → 外层任务被取消 → TaskGroup 取消所有子任务 → 干净退出。
      - 旧写法 `asyncio.wait_for(aw, timeout)` 仍可用，适合单个调用；管理一组任务时 `timeout` + TaskGroup 更清晰。

      ```mermaid
      sequenceDiagram
        participant R as 路由协程
        participant G as TaskGroup
        participant A as 主模型
        participant B as 备用模型
        R->>G: 进入 timeout 8 秒 和 TaskGroup
        G->>A: create_task 调用主模型
        G->>B: create_task 调用备用模型
        B-->>G: 2 秒返回结果
        Note over R,B: 第 8 秒主模型仍未返回 超时触发
        R->>G: 取消外层任务
        G->>A: 取消主模型请求 HTTP 连接中断
        A-->>G: 抛出 CancelledError 退出
        G-->>R: 块边界转为 TimeoutError 走降级
      ```

      **四、取消是这一切的基础**

      - 取消 = 在任务下一次 await 处抛出 `asyncio.CancelledError`。
      - 它继承自 **`BaseException`**，所以 `except Exception` 不会误吞它。**不要**写 `except BaseException` 或裸 `except:` 吞掉它，否则 TaskGroup 和 timeout 都会失灵（官方文档专门警告）。
      - 清理资源用 `try/finally`，清理完让异常继续向上传。

      **五、并发上限：Semaphore**

      对 500 段文本做 Embedding，不能一次发 500 个请求。`sem = asyncio.Semaphore(10)`，每个任务 `async with sem:` 再调用，保证同时最多 10 个在飞。
    scenarios: |
      - **主备模型兜底**：同时请求主模型和备用模型，整体 8 秒超时；主模型成功用主模型，否则用备用并标记降级。
      - **多路召回**：向量检索 + 关键词检索并发，任一路失败返回空列表，不影响另一路（Day 25 混合检索）。
      - **Agent 并行工具调用**：模型一次提议查设备、查告警两个工具（Day 17），TaskGroup 并发执行并统一超时。
      - **批量 Embedding / 批量评测**：Semaphore 限并发 + TaskGroup 管生命周期 + 单条失败记日志后跳过。
    code: |
      ```python
      import asyncio
      import logging

      logger = logging.getLogger(__name__)


      async def embed_one(sem: asyncio.Semaphore, text: str) -> list[float] | None:
          async with sem:                    # 同时最多 N 个请求在飞
              try:
                  await asyncio.sleep(0.2)   # 换成真实的 Embedding API 调用
                  return [0.1, 0.2]
              except Exception:              # 只捕获业务异常，CancelledError 会继续传播
                  logger.exception("embed failed: %s", text[:30])
                  return None


      async def embed_all(texts: list[str]) -> list[list[float] | None]:
          sem = asyncio.Semaphore(10)
          async with asyncio.timeout(60):    # 整批最多 60 秒
              async with asyncio.TaskGroup() as tg:
                  tasks = [tg.create_task(embed_one(sem, t)) for t in texts]
          return [t.result() for t in tasks]
      ```
    pitfalls: |
      - **误区：gather 出错会自动取消其他任务。** 默认不会；需要「一错全停」用 TaskGroup。
      - **`return_exceptions=True` 后不检查结果**：异常混在列表里当正常值用，后面 `.text` 报错或静默产生空回答。
      - **子任务 `except Exception: pass`**：不影响取消，但真实错误全被吞，线上只看到「结果少了一个」。至少要 `logger.exception`。
      - **超时设在错误的层级**：只给单个 HTTP 请求设 30 秒超时、重试 3 次，用户就可能等 90 秒；要有**整体预算**。
      - **不限并发**：一次性创建上千个协程同时请求，被 429 甚至封号，或打满数据库连接池。
    interview_asks:
      - question: "asyncio.gather 和 TaskGroup 有什么区别？各适合什么场景？"
        answer: "gather 可以自己决定要不要在第一个错误时取消别人。TaskGroup 是一个失败就取消同组其余任务，并等它们退出。新代码用 TaskGroup，失败时不会留下还在跑的请求。"
      - question: "并发调用 3 个模型怎么设总超时？超时后还在跑的请求会怎样？"
        answer: "用 timeout 包住整个 TaskGroup，时间到就取消组里的任务。取消后必须等它们真正退出，否则请求还占着连接。超时要设在总等待上，不要只给某一个调用设。"
      - question: "为什么不能吞掉 CancelledError？"
        answer: "取消就是靠抛 CancelledError 实现的。你把它 except Exception 吃掉，任务就取消不掉，超时和关闭都会失效。要取消就重新抛出，不要当成普通错误处理。"
      - question: "批量调用 Embedding 时怎么避免 429？"
        answer: "不要一次把全部任务扔进 gather。用信号量限制同时在飞的请求数，收到 429 就按服务端给的时间退避再试。并发上限按配额算，不按机器能开多少线程算。"
    project_example: |
      **p2 智慧园区运营 Agent** 的「园区早报」功能要同时查：设备在线率、未处理告警、今日客流三个业务接口。
      第一版用 `gather`，客流接口偶尔 500 时整份早报报错，而另外两个查询的结果被丢掉。
      改成：三个查询各自在子任务里 try/except，失败返回 None 并记录日志；外层 `asyncio.timeout(5)` + TaskGroup；早报里对缺失的部分显示「数据暂不可用」。这样单个系统故障只影响一个板块，超时后也不会留下后台请求。
    freshness: |
      核对于 2026-11（Python 3.15 为当前稳定版）：
      - `asyncio.TaskGroup`、`asyncio.timeout()` 为 **3.11 新增**；3.11 起超时抛内置 `TimeoutError`（旧代码里的 `asyncio.TimeoutError` 现在是它的别名）。
      - 3.14：`TaskGroup.create_task()` 会把 `eager_start` 等关键字参数透传给 `loop.create_task()`。
      - **3.15 新增 `TaskGroup.cancel()`**：非异常地提前结束任务组，退出 `async with` 时不抛 `CancelledError`；在 3.15 之前要实现「拿到结果就结束」，只能用自定义异常或 `as_completed`。
      - 官方文档：gather 默认不会取消其他任务；事件循环只保留 Task 的弱引用，要自己保存引用。
    sources:
      - {title: "Python Docs - Coroutines and Tasks", url: "https://docs.python.org/3/library/asyncio-task.html"}
      - {title: "What's New in Python 3.15", url: "https://docs.python.org/3/whatsnew/3.15.html"}
  - id: d06-k4
    name: GIL、线程、进程怎么选
    level: P1
    summary: 等外部用协程（换不掉的同步库用线程），算得多用进程或独立服务；GIL 让纯 Python 计算无法靠多线程用满多核
    analogy: |
      - **进程** ≈ Node 的 `cluster` / pm2 cluster 模式：`uvicorn --workers 4` 就是开 4 个独立进程，**内存不共享**。
      - **线程** ≈ Node 的 `worker_threads`，但**不一样**：Node 的 worker 之间不共享 JS 对象（靠 postMessage），Python 线程**直接共享内存**，所以要考虑加锁。
      - **把 CPU 重活移出 Web 进程** ≈ 前端把大计算丢给 Web Worker，避免卡主线程。
    why: |
      「Python 多线程是假的吗？」是 Python 后端必考题。它直接决定 AI 后端的架构：PDF 解析、文本切片、本地 Rerank 模型该放线程还是进程？为什么要开多个 uvicorn worker？为什么多 worker 下内存里的限流不准？
      面试官还常追问「Python 不是要去掉 GIL 了吗」，答旧了或答夸张了都扣分。
    problem: |
      解决「**一个任务该用哪种方式并发执行**」的选型问题。
      同样是「慢」，等网络的慢需要更多**并发等待能力**（协程），算不完的慢需要更多 **CPU 核**（进程、更多机器或 GPU）。选错会导致：CPU 吃不满、内存成倍增长、或者整个服务被一次计算拖死。
    principle: |
      **一、GIL 是什么**

      - GIL（全局解释器锁）是 **CPython 解释器**的一把互斥锁：同一进程内，**同一时刻只有一个线程在执行 Python 字节码**。
      - 它保护的是解释器内部状态（引用计数等），**不保护你的业务数据**：`counter += 1` 是多条字节码，多线程下照样会丢更新，共享数据仍要加锁。
      - **阻塞 I/O 时会释放 GIL**（socket、文件、`time.sleep`），所以**多线程对 I/O 密集有效**；NumPy 等 C 扩展在纯 C 计算时也可能释放 GIL。

      **二、三种并发方式对比**

      | 维度 | 进程 | 线程 | 协程 |
      |---|---|---|---|
      | 内存 | 各自一份，几十到几百 MB | 共享进程内存 | 一个对象，KB 级 |
      | 调度 | 操作系统 | 操作系统，抢占式 | 事件循环，协作式 |
      | 用满多核 | **能**（各自有 GIL） | 纯 Python 计算不能 | 不能（单线程） |
      | 通信 | 要序列化（pickle） | 直接共享，要加锁 | 直接共享 |
      | 典型规模 | 几个到几十个 | 几十到几百 | 成千上万 |

      **三、AI 后端的选型决策**

      ```mermaid
      flowchart TD
        A["一个新任务"] --> B{"主要时间在等外部吗"}
        B -- "是 IO 密集" --> C{"有异步库吗"}
        C -- "有" --> D["协程 await 加 Semaphore"]
        C -- "没有" --> E["asyncio.to_thread 或 def 路由"]
        B -- "否 CPU 密集" --> F{"耗时和频率"}
        F -- "毫秒级 偶尔" --> G["直接执行"]
        F -- "百毫秒以上 或批量" --> H{"必须在请求内返回吗"}
        H -- "是" --> I["进程池 run_in_executor"]
        H -- "否" --> J["任务队列 独立 worker 或推理服务"]
      ```

      **生产常态是组合**：多进程（N 个 uvicorn worker 用满多核）× 每进程一个事件循环（大量协程处理 I/O）+ 线程池（兜底同步代码）+ 独立 worker（CPU 重活，Day 09 任务队列）。

      **四、多进程的坑**

      - 进程间**不共享全局变量**：内存里的限流计数器、本地缓存每个 worker 各一份，要用 Redis 统一（Day 09）。
      - Windows/macOS 默认 `spawn` 启动子进程，入口必须放在 `if __name__ == "__main__":` 下；传给子进程的函数和参数必须能被 pickle（不能传数据库连接、httpx 客户端）。

      **五、free-threaded Python 现状（2026-11）**

      - 3.13：无 GIL 构建**实验性**；3.14：**官方支持但可选、不是默认**；3.15：保持可选，新增面向无 GIL 构建的稳定 ABI（`abi3t`）。
      - 默认安装的 Python **仍然有 GIL**；无 GIL 版本是单独的构建（如 `python3.14t`），导入未声明兼容的 C 扩展时会**自动重新启用 GIL**。
      - 对 I/O 密集的 LLM 服务收益有限；生产默认仍用标准构建，可以在 CI 里加一个无 GIL 构建的测试任务评估。
    scenarios: |
      - **部署**：`uvicorn app:app --workers 4`，4 个进程各自一个事件循环，用满 4 核。
      - **线程**：只有同步 API 的 SDK、读写本地文件、FastAPI 的 `def` 路由和同步依赖。
      - **进程 / 独立服务**：PDF 解析、OCR 后处理、本地 Embedding 或 Rerank 模型推理（模型只加载一份，还能批处理）。
      - **判断瓶颈**：对比 wall time 和 `time.process_time()`，两者接近是 CPU 密集，wall 远大于 CPU 是 I/O 密集。
    code: |
      ```python
      import asyncio
      from concurrent.futures import ProcessPoolExecutor


      def clean_text(doc: str) -> str:           # 纯 Python 计算：适合进程池
          return " ".join(doc.split())


      async def main(docs: list[str]) -> list[str]:
          loop = asyncio.get_running_loop()
          with ProcessPoolExecutor(max_workers=4) as pool:
              futs = [loop.run_in_executor(pool, clean_text, d) for d in docs]
              return await asyncio.gather(*futs)


      if __name__ == "__main__":                 # spawn 启动方式下必须有这个保护
          print(asyncio.run(main(["a  b", "c   d"])))
      ```
    pitfalls: |
      - **误区：Python 多线程没用。** 对 I/O 密集非常有效，只是纯 Python 计算无法并行。
      - **误区：有 GIL 就不用加锁。** GIL 保护解释器，不保护你的数据；「先检查再写入」照样有竞态。
      - **误区：to_thread 能加速 CPU 计算。** 标准构建下纯 Python 计算放进线程仍只用一个核，只是「不卡事件循环」。
      - **误区：Python 3.14/3.15 已经没有 GIL。** 默认构建仍有 GIL。
      - **每个 worker 加载一份本地模型**：2GB 模型开 8 个 worker 就是 16GB 内存，应拆成独立推理服务。
    interview_asks:
      - question: "什么是 GIL？有 GIL 为什么还要加锁？"
        answer: "GIL 让同一时刻只有一个线程执行 Python 字节码，所以多线程不能并行算 Python。它不保证你的两步操作是原子的。先查再改、i += 1 这种仍然要锁，否则两个线程会交错把数据写乱。"
      - question: "线程、进程、协程有什么区别？AI 后端里各用在哪？"
        answer: "协程适合大量等网络的请求，比如等模型返回。线程适合调用没有异步版本的库。进程适合真要并行的 CPU 活，比如本地解析大文件，因为进程各自有 GIL。API 主路径优先协程。"
      - question: "为什么 uvicorn 多 worker 部署时，内存里做的限流不准？"
        answer: "每个 worker 是一个进程，内存不共享。你在进程里数「每分钟 100 次」，四个 worker 实际能放过大约 400 次。限流计数要放 Redis 这类进程外的存储。"
      - question: "Python 现在还有 GIL 吗？free-threaded 是什么状态？"
        answer: "常规发行版仍然有 GIL。free-threaded 是可以关掉 GIL 的构建，3.13 起能用，但很多 C 扩展还没适配，生产默认不要开。写代码时不要假设 GIL 已经没了。"
    project_example: |
      **p1 企业知识库**的文档入库：上传接口只保存文件、创建任务、立即返回 task_id；后台 worker 用进程池解析 PDF 和切片（CPU 密集），再用协程 + Semaphore 并发调 Embedding API（I/O 密集），最后写 pgvector。
      这样上传接口快速返回，问答接口不受入库影响。部署时 Web 服务和入库 worker 分开扩容：Web 按并发连接数扩，worker 按 CPU 扩。限流计数一律放 Redis，不放进程内存。
    freshness: |
      核对于 2026-11：
      - Python 3.13：free-threaded 构建为实验性（PEP 703 第一阶段）。
      - Python 3.14：PEP 779 生效，free-threaded 构建「官方支持但仍可选」，单线程性能损失约 5%~10%；新增 `concurrent.futures.InterpreterPoolExecutor`（子解释器，每个有自己的 GIL）；macOS 以外的 Unix 平台进程池默认启动方式由 fork 改为 forkserver。
      - Python 3.15（2026-10-09）：新增 free-threaded 稳定 ABI `abi3t`（PEP 803）；官方 macOS 安装包默认安装 free-threading 支持；默认构建仍带 GIL，是否默认去掉 GIL 尚未决定。
    sources:
      - {title: "PEP 779 - Criteria for supported status for free-threaded Python", url: "https://peps.python.org/pep-0779/"}
      - {title: "Python HOWTO - free threading", url: "https://docs.python.org/3/howto/free-threading-python.html"}
      - {title: "What's New in Python 3.14", url: "https://docs.python.org/3/whatsnew/3.14.html"}
      - {title: "concurrent.futures 文档", url: "https://docs.python.org/3/library/concurrent.futures.html"}
test:
  - id: d06-t1
    kp: d06-k1
    type: single
    question: 某 FastAPI 服务上线后，30 并发时**所有接口**（包括只返回 ok 的 `/healthz`）延迟都飙到十几秒，CPU 只有 15%。最可能的原因是：
    options:
      - "数据库连接池太小，查询接口在排队等连接"
      - "某个 async def 路由里有同步阻塞调用，卡住了事件循环"
      - "LLM 供应商返回 429，触发了客户端重试"
      - "服务器内存不足，进程频繁使用交换分区"
    answer: [1]
    explain: |
      关键线索是「连不查库、不调模型的 /healthz 也一起慢」且 CPU 不高：这是事件循环被同步阻塞调用（requests、psycopg2、time.sleep）卡住的典型特征，同进程所有请求都无法被调度。
      连接池太小只会让用到数据库的接口排队；429 重试只影响调模型的接口；内存不足通常伴随 CPU 的 iowait 升高和全面抖动，不是最贴合的解释。
  - id: d06-t2
    kp: d06-k1
    type: judge
    question: 在 FastAPI 的 `async def` 路由里调用 `time.sleep(3)`，只会让当前这个请求慢 3 秒，其他请求不受影响。
    answer: false
    explain: |
      async def 路由运行在事件循环线程上。time.sleep 是同步阻塞调用，会让这个线程整体停住 3 秒，事件循环无法调度任何其他任务，同一 worker 进程的所有请求（包括健康检查）都会被卡住。
      应改成 await asyncio.sleep(3)；换不掉的同步调用用 asyncio.to_thread 包装，或把路由声明为普通 def 让 FastAPI 放进线程池。
  - id: d06-t3
    kp: d06-k1
    type: single
    question: 下面的路由里，下游接口需要 5 秒才返回。关于 `asyncio.timeout(2)` 的效果，哪个说法正确？
    code: |
      import asyncio
      import requests

      @app.get("/proxy")
      async def proxy():
          async with asyncio.timeout(2):
              resp = requests.get("http://slow.internal/api", timeout=10)
          return {"status": resp.status_code}
    options:
      - "第 2 秒时 requests 被中断，路由抛出 TimeoutError"
      - "第 2 秒时 requests 被中断，但只影响当前请求"
      - "代码无法运行，async 函数里禁止调用 requests"
      - "2 秒超时无法按时生效，且这 5 秒里同进程其他请求一起卡住"
    answer: [3]
    explain: |
      asyncio.timeout 靠事件循环在到期时触发定时器去取消任务。requests.get 是同步阻塞调用，事件循环线程被整体占住 5 秒，定时器根本没机会执行，所以超时无法按时生效，同时整个进程的其他请求也被卡住。
      前两个选项误以为超时能打断同步调用；async 函数里调用 requests 语法上完全合法，只是会阻塞，所以第三项也不对。修复是换成 httpx.AsyncClient。
  - id: d06-t4
    kp: d06-k1
    type: multi
    question: 在一个 `async def` 函数里，下列哪些写法会**阻塞事件循环**？
    options:
      - "time.sleep(1)"
      - "await asyncio.sleep(1)"
      - "requests.post(url, json=data)"
      - "用同步 for 循环对 20 万段文本做正则清洗"
      - "await client.get(url)，client 是 httpx.AsyncClient"
    answer: [0, 2, 3]
    explain: |
      time.sleep 和 requests.post 是同步阻塞 I/O，等待期间不会让出控制权；大批量正则清洗是 CPU 密集计算，执行期间同样不会让出，都会卡住整个事件循环。
      asyncio.sleep 和 httpx.AsyncClient 的 await 会在等待时挂起当前协程、把控制权交回事件循环，不会阻塞其他任务。
  - id: d06-t5
    kp: d06-k1
    type: single
    question: 项目必须使用某厂商的 OCR SDK，它只有同步版本、单次调用约 2 秒。在 async 路由里调用它，最合理的做法是：
    options:
      - "用 asyncio.create_task(ocr(img)) 把它放到后台执行"
      - "外面套一层 asyncio.timeout(3) 防止卡死"
      - "await asyncio.to_thread(ocr, img)，在线程里执行"
      - "把函数定义改成 async def ocr，就变成异步了"
    answer: [2]
    explain: |
      to_thread 会把同步函数放到线程池执行，当前协程 await 等结果，事件循环在这 2 秒里继续服务其他请求。OCR SDK 等网络或做 C 层计算时通常会释放 GIL。
      create_task 需要的是协程，同步函数不能直接这样用；timeout 无法打断同步阻塞；只改成 async def 而函数体仍是同步调用，照样阻塞事件循环。
  - id: d06-t6
    kp: d06-k2
    type: single
    question: 下面代码执行后，控制台会打印什么？
    code: |
      import asyncio

      async def work():
          print("working")
          return 1

      async def main():
          x = work()
          print("created")

      asyncio.run(main())
    options:
      - "先打印 working 再打印 created"
      - "先打印 created 再打印 working"
      - "只打印 created，并可能出现 never awaited 警告"
      - "报错，async 函数必须写在 await 后面才能调用"
    answer: [2]
    explain: |
      Python 调用 work() 只创建协程对象，函数体一行都不执行，所以不会打印 working；这个协程从未被 await 也没包装成 Task，被回收时会出现 RuntimeWarning: coroutine 'work' was never awaited。
      第一项是 JS 的直觉（JS 的 async 函数调用后立刻执行到第一个 await）；第二项误以为它在后台执行；第四项错在不 await 地调用 async 函数语法上是合法的。
  - id: d06-t7
    kp: d06-k2
    type: judge
    question: 和 JavaScript 一样，Python 调用一个 `async def` 函数时，会立刻执行函数体直到遇到第一个 await。
    answer: false
    explain: |
      这是从 JS 迁移过来最容易带的误解。JS 的 async 函数是急切的，调用后立即同步执行到第一个 await 并返回 Promise；Python 的协程是惰性的，调用只返回协程对象，函数体一行不执行，必须 await 或 create_task 后才开始运行。
      所以 Python 漏写 await 时请求根本不会发出，而 JS 漏写 await 时请求其实已经发出去了。
  - id: d06-t8
    kp: d06-k2
    type: single
    question: 假设 `fetch()` 内部 `await asyncio.sleep(1)` 后返回。下面 `main()` 的总耗时约为多少？
    code: |
      async def main():
          t1 = asyncio.create_task(fetch("a"))
          t2 = asyncio.create_task(fetch("b"))
          r1 = await t1
          r2 = await t2
          return r1, r2
    options:
      - "约 2 秒，因为先 await t1 再 await t2 是串行的"
      - "约 1 秒，两个 Task 创建时就已被调度，等待时间重叠"
      - "约 0 秒，Task 在后台运行，不需要等待"
      - "会报错，同一个事件循环里不能同时有两个 Task"
    answer: [1]
    explain: |
      create_task 会把协程包装成 Task 并立即交给事件循环调度。main 执行到 await t1 让出控制权时，t1 和 t2 都开始运行，各自的 1 秒等待是重叠的，所以总耗时约 1 秒；等 t1 完成时 t2 也差不多完成了。
      串行 2 秒的情况是 await fetch("a"); await fetch("b") 这种直接 await 协程的写法；Task 仍然需要 await 才能拿到结果；一个事件循环可以同时有成千上万个 Task。
  - id: d06-t9
    kp: d06-k2
    type: multi
    question: 关于 `await` 和 Task，下列说法正确的有：
    options:
      - "在普通 .py 模块里，await 只能写在 async def 函数内部"
      - "await 本身不会创建新线程"
      - "await 一个需要等 IO 的对象时，当前协程挂起，事件循环去运行其他任务"
      - "await 会让被等待的操作转到另一个 CPU 核上并行执行"
      - "create_task 后不保存返回的 Task 引用，任务可能在执行途中被垃圾回收"
    answer: [0, 1, 2, 4]
    explain: |
      await 是协程的主动让出点：只能出现在 async def 里（Jupyter 和 asyncio REPL 是特例），不创建线程，在等 I/O 时挂起当前协程让事件循环调度别的任务。官方文档明确说事件循环只持有 Task 的弱引用，不保存引用的 Task 可能被回收。
      await 与多核并行无关，asyncio 所有协程都在同一个线程上交替执行，所以「转到另一个核并行」是错的。
  - id: d06-t10
    kp: d06-k3
    type: single
    question: 使用 `asyncio.gather(a(), b(), c())`（默认参数）时，如果 a 先抛出异常，b 和 c 会怎样？
    options:
      - "继续在后台运行，异常已经先抛给了调用方"
      - "立即被自动取消，然后调用方收到 a 的异常"
      - "gather 会等 b、c 都结束后，再抛出 a 的异常"
      - "a 的异常被忽略，调用方拿到 b、c 的结果和一个 None"
    answer: [0]
    explain: |
      官方文档写明：return_exceptions=False（默认）时，第一个异常立即传播给 await gather 的调用方，其余可等待对象不会被取消，会继续运行。这在 LLM 场景下意味着报错已返回、其他模型请求还在后台计费。
      自动取消其余任务是 TaskGroup 的行为；等全部结束再抛不是 gather 的默认行为；把异常当结果放进列表需要显式设置 return_exceptions=True，而且放进去的是异常对象不是 None。
  - id: d06-t11
    kp: d06-k3
    type: multi
    question: 关于 `asyncio.gather` 与 `asyncio.TaskGroup`，下列说法正确的有：
    options:
      - "TaskGroup 中一个子任务抛出普通异常，会取消组内其他任务，并以 ExceptionGroup 抛出"
      - "gather 设置 return_exceptions=True 后，异常作为结果放进列表，需要调用方自行检查"
      - "TaskGroup 比 gather 快，因为它把任务分配到多个线程并行执行"
      - "离开 TaskGroup 的 async with 块时，组内所有任务都已完成或已取消"
    answer: [0, 1, 3]
    explain: |
      TaskGroup 实现结构化并发：任一子任务失败时取消其余任务并抛 ExceptionGroup，块退出时保证没有孤儿任务；gather 的 return_exceptions=True 会把异常对象放进结果列表。
      两者都在同一个事件循环线程里并发，不涉及多线程，也谈不上谁更快，区别在于错误处理和生命周期管理。
  - id: d06-t12
    kp: d06-k3
    type: judge
    question: "`asyncio.timeout()` 超时后抛出的 TimeoutError，可以在 `async with asyncio.timeout(...)` 块的内部用 try/except 捕获。"
    answer: false
    explain: |
      官方文档说明：timeout 到期时先取消当前任务，块内看到的是 CancelledError；退出上下文管理器时它才把 CancelledError 转换为 TimeoutError，所以 TimeoutError 只能在 async with 外面捕获。
      在块内写 except TimeoutError 捕获不到，如果在块内用 except BaseException 吞掉 CancelledError，反而会让超时失效。
  - id: d06-t13
    kp: d06-k3
    type: single
    question: 要对 500 段文本调用 Embedding 接口，供应商对并发有严格限制，一次性发出 500 个请求会被大量 429。最直接有效的改法是：
    options:
      - "改成 for 循环逐个 await，彻底避免并发"
      - "用 threading.Lock 包住每次调用"
      - "把 gather 换成 TaskGroup，就会自动排队"
      - "用 asyncio.Semaphore(10) 包住每次调用，限制同时在飞的请求数"
    answer: [3]
    explain: |
      Semaphore 让同时持有许可的协程最多 10 个，其余在 async with sem 处等待，既保留并发又不超过供应商限额，配合 429 退避重试就是标准做法。
      逐个 await 能避免 429 但耗时变成 500 倍；threading.Lock 是线程锁，在协程里用会阻塞事件循环且等于串行；TaskGroup 只管生命周期和错误，不限制并发数。
  - id: d06-t14
    kp: d06-k3
    type: single
    question: 同事为了「保证一个模型失败不影响其他模型」，写了下面的子任务。外层用 `asyncio.timeout(8)` 包着 TaskGroup。这段代码最严重的问题是：
    code: |
      async def call_safe(name: str, prompt: str) -> str | None:
          try:
              return await call_model(name, prompt)
          except BaseException:
              logger.warning("model %s failed", name)
              return None
    options:
      - "吞掉了 CancelledError，超时取消时子任务不退出，整体超时会失灵"
      - "BaseException 范围太小，捕获不到 HTTP 错误"
      - "return None 会让 TaskGroup 认为任务失败并取消其他任务"
      - "logger.warning 是同步调用，会阻塞事件循环"
    answer: [0]
    explain: |
      CancelledError 继承自 BaseException。超时或 TaskGroup 取消子任务时，它在 await call_model 处抛出，这里被捕获后返回 None，取消信号就丢了，官方文档专门警告这会让 TaskGroup 和 timeout 行为异常。应改成 except Exception，让取消继续传播。
      BaseException 是范围最大的基类而不是太小；正常 return None 对 TaskGroup 来说是成功完成；普通的 logging 写到控制台或本地文件开销很小，不是这里的主要问题。
  - id: d06-t15
    kp: d06-k4
    type: single
    question: 8 核服务器上，用 `ThreadPoolExecutor(max_workers=8)` 对 2000 篇 Markdown 做正则清洗和切片（纯 Python），CPU 始终只有约 100%（一个核），耗时和单线程差不多。最合理的改法是：
    options:
      - "把线程数加到 32，让更多线程同时抢 CPU"
      - "改成 asyncio.gather 并发处理每篇文档"
      - "改用 ProcessPoolExecutor，让多个进程各用一个核"
      - "每个线程里改用 asyncio.to_thread 再包一层"
    answer: [2]
    explain: |
      纯 Python 计算执行期间一直持有 GIL，同一进程里同一时刻只有一个线程在跑字节码，所以 8 个线程只用满一个核。每个进程有独立的 GIL，进程池能真正利用多核。
      加线程只会增加切换开销；asyncio 是单线程，CPU 密集任务没有等待时间可利用；to_thread 仍是线程，受同一个 GIL 限制。
  - id: d06-t16
    kp: d06-k4
    type: judge
    question: 因为 CPython 有 GIL，多个线程同时对共享变量执行 `counter += 1` 不需要加锁，结果一定正确。
    answer: false
    explain: |
      GIL 只保证单条字节码执行时不被打断，保护的是解释器内部状态而不是业务数据。counter += 1 会被编译成读取、加一、写回多条字节码，线程可能在中间被切换，导致丢失更新。
      共享可变状态仍需 threading.Lock，或改为用队列传消息；在 free-threaded 构建下这类问题会更容易暴露。
  - id: d06-t17
    kp: d06-k4
    type: multi
    question: 关于 2026-11 时 free-threaded（无 GIL）Python 的状态，下列说法正确的有：
    options:
      - "从 3.14 起它是官方支持的构建，但仍是可选的，不是默认构建"
      - "从 python.org 默认安装的 Python 3.15 已经彻底没有 GIL"
      - "在无 GIL 构建中导入未声明兼容的 C 扩展，解释器可能自动重新启用 GIL"
      - "可以用 sys._is_gil_enabled() 查看运行时 GIL 是否真的关闭"
      - "以调用 LLM 为主的 I/O 密集服务，换无 GIL 构建后吞吐会成倍提升"
    answer: [0, 2, 3]
    explain: |
      PEP 779 让 free-threaded 构建在 3.14 起正式受支持但仍可选；导入不兼容的 C 扩展会自动重新启用 GIL 并打印警告，所以要用 sys._is_gil_enabled() 确认运行时状态。
      默认构建（包括 3.15）仍然带 GIL，是否默认去掉尚未决定；I/O 密集服务的瓶颈在等待下游，GIL 在 I/O 时本来就会释放，换构建收益很有限。
  - id: d06-t18
    kp: d06-k4
    type: single
    question: 服务用 `uvicorn main:app --workers 4` 部署，在模块级字典里实现「每用户每分钟最多 20 次」限流。上线后有用户能一分钟请求 60 次以上。根本原因是：
    options:
      - "GIL 导致字典的写入操作偶尔丢失"
      - "事件循环被阻塞，计数没来得及更新"
      - "Python 字典不是线程安全的，需要加锁"
      - "4 个 worker 是 4 个独立进程，各自有一份字典"
    answer: [3]
    explain: |
      每个 uvicorn worker 是独立进程，内存不共享，同一用户的请求被分到不同进程时各自计数，实际上限接近 20 乘以 worker 数，而且表现随机。限流、会话这类跨请求状态要放到 Redis 等外部存储（Day 09）。
      GIL 和字典线程安全是单进程内多线程的问题，这里是多进程；事件循环阻塞会导致变慢，不会让计数系统性偏少。
exam:
  - id: d06-e1
    kp: d06-k1
    type: single
    question: 一个老接口里只调用同步的 psycopg2 做一次查询，团队暂时没有时间改成异步驱动。在不改查询代码的前提下，**短期止血**最合理的是：
    options:
      - "把路由从 async def 改成普通 def，让 FastAPI 放进线程池执行"
      - "保持 async def，并在查询外面套 asyncio.timeout(3)"
      - "保持 async def，用 asyncio.create_task 包装查询函数"
      - "把 uvicorn worker 数量从 4 提高到 32"
    answer: [0]
    explain: |
      FastAPI 会把普通 def 路由放到线程池执行，阻塞只占用一个线程，不会卡住事件循环，这正是官方对「库不支持 await」给出的建议；之后再迁移到 asyncpg 或 psycopg 3 异步模式。
      timeout 打断不了同步阻塞；create_task 需要协程，包同步函数没有意义；盲目加 worker 会成倍增加内存和数据库连接，并没有消除阻塞。
  - id: d06-e2
    kp: d06-k3
    type: single
    question: 业务要求「同时问三个模型，**谁先成功返回就用谁**，其余请求立即停止以节省费用」。下列实现思路最合理的是：
    options:
      - "用 asyncio.gather 等三个都返回，再取第一个非 None 的结果"
      - "用 asyncio.as_completed 遍历，拿到第一个成功结果后取消其余任务"
      - "每个模型子任务失败时抛异常，让 TaskGroup 自动取消其他任务"
      - "给每个调用分别套 asyncio.wait_for，超时时间设为 1 秒"
    answer: [1]
    explain: |
      as_completed 按完成先后产出结果，拿到第一个成功的就返回并取消其余任务（3.15 也可以在 TaskGroup 里调用 tg.cancel() 实现）。注意第一个完成的可能是失败结果，不能直接当作胜出。
      gather 要等全部完成，既慢又浪费费用；靠失败触发 TaskGroup 取消，逻辑正好反了：先失败的会把可能成功的也取消掉；固定 1 秒超时会误杀正常但稍慢的请求。
  - id: d06-e3
    kp: d06-k2
    type: single
    question: 某路由在返回响应前写了 `asyncio.create_task(write_audit_log(user, action))`，没有保存返回值。关于它的风险，最准确的是：
    options:
      - "任务可能在执行途中被垃圾回收，且它抛出的异常没人处理"
      - "这个任务会阻塞响应返回，直到日志写完"
      - "这个任务会在新线程执行，可能产生线程安全问题"
      - "响应返回后事件循环会自动取消这个任务"
    answer: [0]
    explain: |
      官方文档说明事件循环只保留 Task 的弱引用，没有其他引用的 Task 可能在完成前被回收；同时没人 await 它，异常只会在被回收时打印一句 Task exception was never retrieved。可靠做法是把 Task 存进集合并在完成回调里移除，或改用 BackgroundTasks / 任务队列（Day 09）。
      create_task 不阻塞当前协程；Task 在同一事件循环线程运行而不是新线程；请求结束也不会自动取消它。
  - id: d06-e4
    kp: d06-k4
    type: single
    question: 「上传即问」功能：用户上传 200 页 PDF，需要解析、切片、调用 Embedding API、写入向量库。下列安排最合理的是：
    options:
      - "全部在 async 路由里完成，解析和 Embedding 一起用 gather 并发"
      - "解析用 asyncio.to_thread，就能利用多核，接口同步等待全部完成"
      - "换 free-threaded Python 3.15，直接在路由里开多线程解析"
      - "接口只落盘并返回 task_id，后台 worker 用进程池解析，再用协程并发调 Embedding"
    answer: [3]
    explain: |
      解析和切片是 CPU 密集，适合进程池或独立 worker；调用 Embedding 是 I/O 密集，适合协程加并发上限；整个流程是分钟级，应该放后台任务，接口快速返回 task_id 让前端轮询进度。
      在 async 路由里解析会卡住事件循环；to_thread 在标准构建下不能让纯 Python 计算用满多核；无 GIL 构建仍是可选项，解析库可能触发重新启用 GIL，而且没解决「分钟级任务不该放在请求里」的问题。
  - id: d06-e5
    kp: d06-k3
    type: multi
    question: 关于 `asyncio.CancelledError`，下列说法正确的有：
    options:
      - "它直接继承自 BaseException，而不是 Exception"
      - "需要清理资源时，推荐用 try/finally，清理完让它继续向上传播"
      - "写 except Exception 会误吞它，导致 TaskGroup 无法取消子任务"
      - "如果子任务捕获并吞掉它，asyncio.timeout 和 TaskGroup 可能行为异常"
    answer: [0, 1, 3]
    explain: |
      CancelledError 直接继承 BaseException，所以 except Exception 捕获不到它，这正是设计意图：普通业务异常处理不会误伤取消。官方建议用 try/finally 做清理并让它继续传播；TaskGroup 和 timeout 内部依赖取消实现，吞掉它会让它们失灵。
      except Exception 不会捕获 CancelledError，所以第三项说法是错的，真正危险的是 except BaseException 和裸 except。
  - id: d06-e6
    kp: d06-k4
    type: multi
    question: 一个问答请求包含：查 Redis 鉴权、向量检索、本地 tokenizer 统计约 200 字的 token、调用 LLM 约 8 秒、解析用户附带的 30MB Excel。下列安排合理的有：
    options:
      - "Redis、向量检索、LLM 用异步客户端直接 await"
      - "200 字的 token 统计直接在协程里计算即可"
      - "30MB Excel 解析放到进程池或后台任务里"
      - "LLM 调用放进 asyncio.to_thread，避免它阻塞事件循环"
      - "全部放进 ProcessPoolExecutor 执行最稳妥"
    answer: [0, 1, 2]
    explain: |
      I/O 型调用用异步库 await 即可；200 字的 tokenizer 是毫秒级的轻量计算，直接算没问题；30MB Excel 解析是明显的 CPU 重活，要移出事件循环。
      LLM 调用如果用的是异步客户端，本身就不阻塞，再套 to_thread 只是多占线程；全部放进程池会带来序列化开销，异步客户端也无法跨进程传递，属于过度设计。
  - id: d06-e7
    kp: d06-k2
    type: judge
    question: "对于 `async def f(): return 1`，执行 `await f()` 一定会让当前协程挂起一次、把控制权交回事件循环。"
    answer: false
    explain: |
      await 只有在被等待的对象真正需要等待（比如等 I/O、等定时器、等一个未完成的 Future）时才会挂起当前协程。f 内部没有任何等待，await f() 会直接把它跑完并拿到返回值，不发生任务切换。
      这也说明 await 不是「开线程」或「强制切换」，它只是一个可能的让出点；想主动让出一次可以用 await asyncio.sleep(0)。
  - id: d06-e8
    kp: d06-k4
    type: judge
    question: 在标准（带 GIL）的 CPython 上，把一段纯 Python 的 CPU 密集计算放进 `asyncio.to_thread`，既能不卡事件循环，也能让它利用多个 CPU 核加速。
    answer: false
    explain: |
      to_thread 确实能让事件循环线程不被这段计算占住，但计算本身仍然在一个线程里持有 GIL 运行，和事件循环线程抢同一把锁，不会用到多核，官方文档也说明它通常只适合 I/O 型函数。
      需要多核加速应使用 ProcessPoolExecutor 或独立 worker 服务；只有释放 GIL 的 C 扩展或无 GIL 构建才可能在线程里真正并行。
  - id: d06-e9
    kp: d06-k3
    type: case
    question: |
      客服后端有一个「主备模型」接口：`results = await asyncio.gather(call_main(p), call_backup(p))`，然后优先取主模型结果。上线一周后发现两件事：
      1. 主模型偶尔返回 504，此时整个接口直接报 500，而备用模型其实 2 秒就成功了；
      2. 报错返回之后，日志显示主模型的重试请求还在后台继续发送，Token 账单比预期高。
      要求：主模型失败能降级到备用模型、整体最多等 8 秒、超时或返回后不再有后台请求。最合理的改法是：
    options:
      - "改成 gather(..., return_exceptions=True)，其余代码不变"
      - "给 call_main 和 call_backup 分别加 asyncio.wait_for(…, 8)，仍用 gather 汇总"
      - "子任务内部 try/except Exception 转成 None 并记录日志，外层 asyncio.timeout(8) 包住 TaskGroup，按结果选择主或备"
      - "把两个调用改成先 await call_main，失败后再 await call_backup"
    answer: [2]
    explain: |
      子任务内部捕获业务异常转成 None，主模型失败就不会连带取消备用模型；外层 timeout 加 TaskGroup 保证超时时所有未完成请求被取消，退出块后不会留下后台请求；最后按结果选主或备并记录降级。
      只加 return_exceptions 不检查结果会把异常对象当答案，且仍可能留下后台任务；分别 wait_for 后用 gather 仍有「一个异常其余继续跑」的问题；串行调用让最坏耗时变成两者相加，失去兜底的意义。
interview:
  - id: d06-i1
    kp: d06-k2
    type: short
    difficulty: 2
    question: 你是前端出身，说说 Python 的 async/await 和 JavaScript 的 async/await 有哪些关键差异？这些差异在写后端时会导致什么 bug？
    key_points:
      - {text: "指出 JS 的 async 函数调用即执行到第一个 await，Python 调用只返回协程对象、不执行", dim: concept}
      - {text: "指出 Python 默认同步、同步库与异步库是两套 API，混用会阻塞事件循环", dim: principle}
      - {text: "说明 Python 有内建取消机制（CancelledError）和 TaskGroup 结构化并发，JS 需要 AbortController 手动传递", dim: principle}
      - {text: "举出漏写 await 导致逻辑静默不执行的 bug，并给出 never awaited 警告、CI 升级警告为错误等防护手段", dim: engineering}
    reference: |
      **差异一：急切 vs 惰性。** JS 调用 async 函数会立刻同步执行到第一个 await 并返回 Promise，请求已经发出；Python 调用 async def 只得到一个协程对象，函数体一行不执行，必须 await 或包装成 Task 才运行。所以 Python 漏写 await 的后果更隐蔽：像「保存会话记录」这种无返回值的调用会静默不执行，只留下一句 RuntimeWarning: coroutine was never awaited。

      **差异二：默认同步。** Node 的 I/O API 天生异步；Python 生态默认同步，requests、psycopg2、time.sleep 都会阻塞线程，必须换成 httpx.AsyncClient、asyncpg、asyncio.sleep。在 async 函数里混用同步库，阻塞的是整个事件循环，表现为全站一起变慢。

      **差异三：取消与结构化并发。** JS Promise 没有内建取消，要把 AbortSignal 一层层传下去；Python 取消一个 Task 会在其下一个 await 处抛 CancelledError，TaskGroup 和 asyncio.timeout 都基于它实现，前提是不能吞掉 CancelledError。

      **防护手段：** 测试里把 RuntimeWarning 升级为错误；开启 pyright 的 reportUnusedCoroutine；代码评审时重点看 async 函数里有没有同步 I/O；需要并发时统一用 TaskGroup 而不是裸 create_task。
    oral: |
      我从前端转过来，踩过最大的坑就是「Python 的协程是惰性的」。JS 里调用 async 函数，请求立刻就发了；Python 里调用只是拿到一个协程对象，不 await 就什么都不发生。
      第二个差异是 Python 默认是同步的，requests、time.sleep 放在 async 函数里会把整个事件循环卡住，这在 Node 里很少遇到。第三个是 Python 有内建取消，TaskGroup 加 timeout 能把没跑完的请求干净地停掉，比 JS 手动传 AbortController 省心，但前提是不能吞 CancelledError。
      比如在园区 Agent 项目里，保存对话的函数改成 async 之后调用处没加 await，结果多轮对话丢上下文，日志里只有一条 never awaited 警告。之后我在 pytest 里把这类警告设成报错，CI 就能拦住。
  - id: d06-i2
    kp: d06-k1
    type: scenario
    difficulty: 3
    question: 团队把一个 Flask 同步服务迁移到 FastAPI，所有路由都改成了 `async def`，但调用 LLM 仍用 requests、查库仍用 psycopg2。上线后单用户测试很快，30 并发时所有接口（包括 /healthz）都要十几秒，CPU 只有 15%，K8s 还因为健康检查超时反复重启 Pod。你怎么排查和修复？
    key_points:
      - {text: "指出 async def 路由跑在事件循环线程，requests 和 psycopg2 同步阻塞会卡住整个进程", dim: principle}
      - {text: "解释所有接口一起慢且 CPU 不高的原因：线程在等 IO，但事件循环无法调度其他任务", dim: principle}
      - {text: "给出排查手段：PYTHONASYNCIODEBUG 慢回调日志、py-spy dump 看主线程栈、临时改 def 路由做对比", dim: engineering}
      - {text: "给出分层修复：换 httpx.AsyncClient 与异步驱动、短期改 def 路由或 to_thread、CPU 重活移出", dim: engineering}
      - {text: "提到修复后压测验证，并注意线程池上限、超时在阻塞时失效等新问题", dim: project}
    reference: |
      **定位原因：** FastAPI 的 async def 路由直接在事件循环线程上执行。requests.get 和 psycopg2 查询是同步阻塞调用，它们等网络时整个线程被挂起，事件循环也停住，其他请求（包括 /healthz）全部排队。CPU 只有 15% 是因为线程大部分时间在等 I/O 而不是计算，这正是事件循环被阻塞的典型特征。Flask 时代是多线程模型，阻塞只影响一个线程，所以问题没暴露。

      **排查步骤：**
      1. 设置 PYTHONASYNCIODEBUG=1，日志会出现 Executing Task took X seconds，直接指向慢协程；
      2. 用 py-spy dump 查看 worker 进程，确认主线程卡在 requests 或 psycopg2 的 socket 读；
      3. 对照实验：把一个路由临时改成 def，看并发表现是否明显改善。

      **修复（按推荐顺序）：**
      - LLM 调用改为应用级共享的 httpx.AsyncClient 并 await；数据库改为 asyncpg 加 SQLAlchemy AsyncSession；
      - 短期换不掉的模块，把路由改回 def 让 FastAPI 放进线程池，或在 async 路由里用 asyncio.to_thread 包装；
      - 健康检查只做轻量检查，不依赖下游。

      **验证：** 修复后压测，同时持续请求 /healthz 确认其延迟稳定；注意 def 路由共享默认线程池，并发更高时仍可能排队；另外原来加在 LLM 调用上的 asyncio.timeout 在阻塞期间不生效，改成异步库后要重新确认超时行为。
    oral: |
      我的结论是事件循环被同步调用卡住了。判断依据是所有接口一起慢、连 healthz 都慢，CPU 却不高，说明线程在等 IO 但事件循环没法调度别的请求。async 路由跑在事件循环线程上，requests 和 psycopg2 一阻塞，整个进程就停了。
      排查我会先开 asyncio 的 debug 模式看慢回调日志，再用 py-spy dump 看主线程卡在哪个调用上，基本几分钟就能定位。
      修法分两步：短期先把这些路由改回普通 def，让 FastAPI 放到线程池里止血；中期把 LLM 调用换成共享的 httpx 异步客户端，数据库换成 asyncpg 加 AsyncSession。改完我会压测，并且同时打 healthz，确认它不再被业务请求拖慢。
  - id: d06-i3
    kp: d06-k3
    type: design
    difficulty: 4
    question: 设计园区 Agent 的「多模型兜底」调用层：同时调用主模型和备用模型，整体最多等 8 秒；主模型成功用主模型，失败或超时但备用成功则用备用，都失败返回友好错误。另外还要支持批量场景（一次 200 个请求）不触发供应商限流。说说你用哪些 asyncio API、异常怎么处理、怎么保证超时后没有请求还在后台计费。
    key_points:
      - {text: "用 asyncio.timeout 设整体预算并在 async with 外捕获 TimeoutError，用 TaskGroup 保证退出时未完成请求被取消", dim: principle}
      - {text: "子任务内部 except Exception 转成 None 或错误对象，避免一个失败连带取消另一个，同时不吞 CancelledError", dim: principle}
      - {text: "批量场景用 Semaphore 控制并发，429 按 Retry-After 或指数退避加抖动，用 asyncio.sleep 退避", dim: engineering}
      - {text: "单次 HTTP 超时小于整体预算，客户端在应用级复用连接池", dim: engineering}
      - {text: "记录降级标记、主备成功率、耗时和费用指标，便于发现主模型持续失败", dim: project}
    reference: |
      **结构：** 外层 asyncio.timeout(8) 控制总预算，内层 asyncio.TaskGroup 同时创建 call_main 和 call_backup 两个子任务；httpx.AsyncClient 在应用启动时创建、全局复用，单次请求超时设成 6 秒左右，小于整体预算。

      **异常处理：**
      - 每个子任务内部 try/except Exception：HTTP 错误、JSON 解析失败等记录 logger.exception 后返回 None，这样主模型失败不会触发 TaskGroup 一错全停，备用模型可以继续完成。
      - 不捕获 BaseException，让 CancelledError 正常传播，否则超时取消会失效。
      - 外层 except TimeoutError：此时 TaskGroup 已取消所有未完成子任务，底层 HTTP 请求被中断，不会在后台继续计费；对已完成的 Task 可以检查 done() 且未取消后取 result()，有备用结果就用备用。

      **结果选择：** 主结果非 None 用主模型；否则备用非 None 用备用并在响应里标 degraded=true；都没有就返回「服务繁忙，请稍后再试」，状态码用 503 而不是 200 加空字符串。Python 3.15 可以在拿到主模型结果后调用 tg.cancel() 提前结束，节省备用模型费用。

      **批量场景：** 共享一个 asyncio.Semaphore(N) 限制同时在飞的请求数，N 按供应商限额估算；遇到 429 优先读 Retry-After，否则指数退避加随机抖动，退避一定用 await asyncio.sleep 而不是 time.sleep；重试次数和总时长都受整体预算约束。

      **可观测性：** 记录主备各自的成功率、P95 耗时、降级次数、429 次数和 Token 消耗，主模型降级率超过阈值就告警，避免「一直在用备用模型却没人知道」。
    oral: |
      我会用三个东西：外层 asyncio.timeout 控总时间八秒，里面 TaskGroup 同时发主模型和备用模型，批量时再加一个 Semaphore 控并发。
      关键在异常处理。每个子任务自己捕获 Exception，记日志后返回 None，这样主模型挂了不会把备用一起取消；但绝不捕获 BaseException，让取消能正常传播。超时的时候 TaskGroup 会把没回来的请求全部取消，HTTP 连接直接断，不会在后台继续烧 Token。
      结果上，主模型有结果用主模型，否则用备用并标记降级，都没有就返回 503 和友好提示。批量场景遇到 429 用 Retry-After 或者指数退避加抖动，用 asyncio.sleep 退避。
      最后我会给主备分别打成功率、耗时、降级次数的指标，降级率高了就告警。之前用 gather 的版本就出过主模型一直失败却没人发现的问题，所以监控这一步我很看重。
