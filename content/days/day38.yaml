    lang: en
    minutes: 90
    note: "免费短课。看 MCP Architecture、Creating an MCP Server、Creating an MCP Client、Adding Prompt and Resource Features 四课；课程代码用的是旧名 FastMCP，对照 k4 换成 v2 的 MCPServer"
  - title: "Hello-Agents 第十章 智能体通信协议"
    url: "https://github.com/datawhalechina/hello-agents"
    kind: repo
    lang: zh
    minutes: 30
    note: "中文。看 10.1 协议基础和 10.2 MCP 实战（含 10.2.3 传输方式），10.5 自定义 MCP 服务器可作为动手参考；书中协议版本早于 2026-07-28，会话和握手部分以 k3 为准"
  - title: "MCP Python SDK：What's new in v2"
    url: "https://py.sdk.modelcontextprotocol.io/whats-new/"
    kind: doc
    lang: en
    minutes: 20
    note: "读 FastMCP is now MCPServer、Transport configuration moved to run()、No handshake no session 三节，再看站内 Handling errors 页的 ToolError 与 MCPError 区别"
