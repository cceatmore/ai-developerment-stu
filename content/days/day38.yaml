day: 38
phase: 4
title: MCP：Host/Client/Server 架构、三大原语、stdio 与 Streamable HTTP、动手写一个 MCP Server
goals:
  - 能说清 MCP 解决的 M×N 集成问题、Host/Client/Server 各自职责，以及它和 Function Calling 的关系
  - 能为一个业务能力选对原语（Tool、Resource、Prompt），并说明各自由谁控制
  - 能对比 stdio 与 Streamable HTTP，讲清 2026-07-28 版协议去掉会话和握手后对部署的影响
  - 能用 Python SDK v2 的 MCPServer 写出带错误处理的 Server，并说出三类核心安全风险
minutes: 60
resources:
