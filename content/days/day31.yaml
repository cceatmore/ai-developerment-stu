day: 31
phase: 4
title: Agent 是什么：Agent 与 Workflow
goals:
  - 能用「下一步由谁决定」判断一个系统是 workflow 还是 Agent，并说清两者在成本、测试、调试上的差异
  - 能画出五种常见 workflow 模式（链式、路由、并行、编排-执行、评估-优化）的结构，并说出各自适用场景
  - 能用错误累积、延迟成本、合规和可评估性判断一个需求该不该用 Agent
  - 能把一个园区运营需求拆成步骤，并为每一步选择「普通代码 / 单次 LLM 调用 / Agent」
minutes: 60
resources:
  - title: "Anthropic - Building effective agents"
    url: "https://www.anthropic.com/engineering/building-effective-agents"
    kind: article
    lang: en
    minutes: 30
    note: "重点看 What are agents、When (and when not) to use agents 和五个 Workflow 小节，对照今天的 d31-k1、d31-k2；附录 Agents in practice 可跳过"
  - title: "DeepLearning.AI - Agentic AI（吴恩达）Module 1"
    url: "https://www.deeplearning.ai/courses/agentic-ai/"
    kind: course
    lang: en
    minutes: 40
    note: "只看 Module 1 的 Degrees of autonomy、Task decomposition、Agentic design patterns 三个视频（免费旁听可看视频），对应今天的自主度光谱和任务拆解 d31-k4"
knowledge_points:
  - id: d31-k1
    name: Agent 与 Workflow：控制流归谁
    level: P0
    summary: Workflow 由代码预先写好路径来编排 LLM 和工具；Agent 由 LLM 在循环里根据环境反馈自己决定下一步
    analogy: |
      **Workflow 像一个写死步骤的表单向导**：Step1 → Step2 → Step3，「下一步跳哪页」写在路由守卫和 if/else 里，你能为每条路径写单测。
      **Agent 像把「下一步跳哪个页面」交给一位会看页面状态的同事**：他看到上一页的结果，再决定去哪、去几次、什么时候提交。

      **不一样的地方**：路由跳转是**确定**的，同样输入永远走同一路径；LLM 的决策是**概率性**的，同样输入可能走出不同路径。所以 Agent 必须额外配最大步数、逐步日志和评测集，而前端向导不需要。
    why: |
      「Agent 和 workflow / RAG / 普通 LLM 应用有什么区别」是 Agent 岗位面试的开场题。答「Agent 更智能」等于零分。
      能讲清**控制流归属**，并顺带说出它带来的成本、测试、可观测性差异，面试官才会相信你做过真实项目。后面 Day 32~40 的手写循环、工具设计、LangGraph、多 Agent 都建立在这个区分上。
    problem: |
      很多团队把所有 AI 功能都叫 Agent，结果有两类问题：
      - 本来步骤固定的功能被做成 Agent，**延迟和成本翻几倍，输出还不稳定**；
      - 真正需要 Agent 的地方，却没有设计停止条件、逐步日志和工具权限，**出了问题无法复盘**。
      先分清两者，才能决定架构、预算和要补哪些工程能力。
    principle: |
      **一、两个权威定义**

      Anthropic《Building effective agents》把它们统称为 agentic systems（智能体式系统），但做了关键区分：

      - **Workflow**：LLM 和工具**通过预先定义的代码路径**来编排；
      - **Agent**：LLM **动态指挥自己的流程和工具使用**，自己掌控如何完成任务。

      Anthropic 2025 年的上下文工程文章给了更简洁的说法：**LLM 在循环中自主使用工具**。LangChain v1 文档也写「a model calling tools in a loop until a given task is complete」，并提出 **Agent = Model + Harness**（harness 指循环外围的提示词、工具和中间件）。

      判断口诀只有一句：**下一步做什么，是写在代码里的，还是模型运行时选的？**

      **二、共同积木：增强型 LLM**

      Anthropic 把「LLM + 检索 + 工具 + 记忆」叫 **augmented LLM**，它是 workflow 和 Agent 共同的积木。区别**不在有没有工具**，而在**谁来串这些积木**。

      **三、Agent 一次运行长什么样**

      ```mermaid
      flowchart TD
        A["用户任务"] --> B["组装上下文：系统提示加历史加工具清单"]
        B --> C["LLM 决策"]
        C --> D{"要调用工具吗"}
        D -- "要" --> E["运行时代码执行工具"]
        E --> F["工具结果写回消息历史"]
        F --> G{"触发停止条件了吗"}
        G -- "没有" --> B
        G -- "步数或预算用完" --> H["兜底回答或转人工"]
        D -- "不要" --> I["输出最终回答"]
      ```

      三个要点：
      - **模型只提议，代码去执行**：模型输出「我想调 get_device_status，参数 DEV-000123」（Day 17 Function Calling），真正执行、鉴权、超时都在你的代码里。
      - **每一步都要拿到环境的真实反馈（ground truth）**：工具结果、代码运行结果，模型靠它判断进展。
      - **必须有停止条件**：Anthropic 原文就提到用「最大迭代次数」等停止条件保持可控（Day 32 详讲）。

      **四、三种形态对比**

      | 形态 | 下一步谁决定 | LLM 调用次数 | 可预测性 | 出错怎么查 |
      |---|---|---|---|---|
      | 单次调用 | 代码 | 1 次 | 高 | 看一次输入输出 |
      | Workflow | **代码** | 固定 N 次 | 高 | 定位到具体节点 |
      | Agent | **模型** | 不确定 | 低 | 必须看完整轨迹（trace） |

      **五、自主度是一条光谱**

      吴恩达在 Agentic AI 课程里强调「degrees of autonomy」：不要争论「这算不算 Agent」，而是问**自主度有多高**。

      - 低：步骤全固定，LLM 只负责填内容；
      - 中：LLM 在几个预设分支里选一个（路由）；
      - 高：LLM 决定调哪些工具、调几次、何时停。

      越往高走越灵活，也越贵、越慢、越难测。**工程上不是越高越好，而是够用即止**（见 d31-k3）。

      **六、控制流交给模型后，工程上多出的五件事**

      1. 成本和延迟不确定 → 要有步数、Token、时间预算；
      2. 不能只写断言式单测 → 要用评测集统计成功率（Day 41~42）；
      3. 错误会累积 → 前一步拿错数据，后面全错；
      4. 必须记录每一步 → 模型输出、工具参数、结果、耗时（Day 43 Trace）；
      5. 安全面更大 → 提示注入可能变成真实操作（Day 45）。
    scenarios: |
      - **园区告警排查**：「B2 停车场东侧摄像头为什么一直离线」——先查设备状态，再按结果决定查网络告警还是查维保记录，步骤取决于中间结果 → **Agent**。
      - **每日告警日报**：每天 8 点汇总昨日告警并写摘要，数据源和步骤固定 → **workflow**。
      - **技术评审**：用「下一步由谁决定」这一问，快速判断方案是否被过度设计。
    code: |
      同一个需求的两种写法，对比控制流在哪里（伪代码，完整可运行的循环见 Day 32）：

      ```python
      # Workflow：步骤写死在代码里
      def daily_alarm_report(day: str) -> str:
          alarms = list_alarms(day=day)                  # 第 1 步固定
          stats = group_by_level(alarms)                 # 第 2 步固定（纯代码）
          return llm(f"根据统计写日报：{stats}")            # 第 3 步固定

      # Agent：下一步调用什么，由模型根据结果决定
      def troubleshoot(question: str, max_steps: int = 8) -> str:
          messages = [{"role": "user", "content": question}]
          for _ in range(max_steps):
              reply = llm_with_tools(messages, tools=TOOLS)
              if not reply.tool_calls:
                  return reply.content                   # 模型认为可以回答了
              for call in reply.tool_calls:
                  messages.append(run_tool(call))        # 代码执行，结果写回
          return "排查步骤已用完，已转人工"
      ```
    pitfalls: |
      - **误区：用了 Function Calling 就是 Agent。** 只调一次工具、或者调用顺序由代码写死，是「带工具的 LLM 调用」或 workflow。
      - **误区：多次调用 LLM 就是 Agent。** 代码里固定「分类 → 检索 → 生成」三次调用，仍然是 workflow（链式）。
      - **误区：模型会执行工具。** 模型只输出调用意图，执行、鉴权、超时、停止条件都在你的代码里。
      - **误区：Agent 比 workflow 高级。** Anthropic 明确建议先找最简单的方案，只有能证明效果提升时才加复杂度。
      - **混淆 agentic 与 agent**：agentic 是形容「带有模型自主决策成分」，程度可以很低，不等于完全自主。
    interview_asks:
      - question: "什么是 AI Agent？它和 workflow 的本质区别是什么？"
        answer: "workflow 的下一步由代码决定。Agent 的下一步由模型根据当前结果自己选，所以路径不固定。区别在于控制流归谁，不在于有没有调用大模型。"
      - question: "一个应用里调用了三次大模型，它是 Agent 吗？为什么？"
        answer: "不一定。三次的顺序如果是代码写死的，就是 workflow。只有模型在运行中决定下一步调用什么、要不要停，才是 Agent。"
      - question: "从普通 LLM 应用改成 Agent，工程上要额外补哪些能力？"
        answer: "工具执行、参数校验、最大步数、失败回传、状态保存和轨迹日志。没有这些，模型只是在循环里碰运气。还要有评测看它会不会停、会不会乱调工具。"
    project_example: |
      在实践项目 **p2 智慧园区运营 Agent** 里，两类需求要分开设计：
      - 「昨日告警日报」「本周客流统计」：数据源固定，写成 **workflow**，每天定时跑，结果稳定、便宜、可单测。
      - 「为什么 3 号楼门禁频繁报警」「B2 摄像头离线原因」：要先查设备、再看告警、再查工单历史，**步骤取决于中间结果**，交给 **Agent**。
      给 Agent 的部分从第一天就配好：最多 8 步、每步写 trace、创建工单这类写操作必须人工审批（Day 37）。面试时可以说：「我们不是全量上 Agent，而是只在排障这类开放问题上把控制流交给模型。」
    freshness: |
      核对于 2026-11：
      - Anthropic《Building effective agents》发布于 2024-12-19，页面顶部现已注明「文中工具生态自 2024-12 以来变化很大」，框架列表更新为 Claude Agent SDK、Strands Agents SDK、Rivet、Vellum；**workflow / agent 的定义和五种模式没有变化**，仍是业内最常引用的划分。
      - Anthropic《Effective context engineering for AI agents》（2025-09-29）把 Agent 简化定义为「LLM 在循环中自主使用工具」。
      - LangChain 1.5.0 文档 Agents 页：「An agent is a model calling tools in a loop until a given task is complete」，并写明 Agent = Model + Harness。
    sources:
      - {title: "Anthropic - Building effective agents", url: "https://www.anthropic.com/engineering/building-effective-agents"}
      - {title: "Anthropic - Effective context engineering for AI agents", url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}
      - {title: "LangChain Docs - Agents", url: "https://docs.langchain.com/oss/python/langchain/agents"}

  - id: d31-k2
    name: 五种常见 workflow 模式
    level: P0
    summary: 链式、路由、并行、编排-执行、评估-优化五种模式的骨架都由代码定，LLM 只在节点内工作
    analogy: |
      用前端异步编排来记：
      - **链式（Prompt chaining）** ↔ `fetchA().then(b).then(c)`，中间可以加校验，不通过就中断；
      - **路由（Routing）** ↔ 根据请求类型分发到不同处理函数，像 axios 拦截器里按 URL 前缀走不同逻辑；
      - **并行（Parallelization）** ↔ `Promise.all([checkA(), checkB(), checkC()])` 再汇总；
      - **编排-执行（Orchestrator-workers）** ↔ 先由一个函数**动态算出**要发哪些请求，再并发发出去；
      - **评估-优化（Evaluator-optimizer）** ↔ 表单提交前「校验 → 修改 → 再校验」的循环。

      **不一样的地方**：前端函数输出确定，LLM 节点输出每次可能不同，所以链式中间的**程序化校验（gate）**、循环的**最大轮次**都比前端更重要。
    why: |
      实际项目里纯 Agent 很少，大部分是「外层 workflow、局部 Agent」。能说出这五种模式并按场景选择，是区分「会调框架」和「会做架构」的关键。
      它们也是后面的基础：Day 34 的规划与反思就是编排-执行、评估-优化的延伸，Day 36 用 LangGraph 画图时节点和边就照这些模式来设计。
    problem: |
      没有模式库时，团队常在两个极端摇摆：
      - 把所有逻辑塞进一个大 Prompt 让模型自由发挥，**结果不可控、难调试**；
      - 所有逻辑用 if/else 写死，用户换个说法就走不通。
      五种模式给出了「哪些写死、哪些交给 LLM」的成熟组合方式，而且**每种都能用几十行代码手写**，不依赖框架。
    principle: |
      **一、五种模式一览（Anthropic 总结）**

      | 模式 | 做法 | 适合 | 园区例子 |
      |---|---|---|---|
      | **链式** Prompt chaining | 拆成固定顺序的几步，每步处理上一步输出，中间可加**程序化校验 gate** | 能干净拆成固定子任务；用延迟换准确率 | 先抽取工单要素 → 校验必填 → 再生成派单说明 |
      | **路由** Routing | 先分类，再走专门的 Prompt / 模型 / 工具 | 类别清晰、分类够准 | 运营提问分成告警、客流、能耗三类 |
      | **并行** Parallelization | **分段**：拆成独立子任务并行；**投票**：同一任务跑多次取共识 | 子任务独立；需要多视角提高置信度 | 同时查告警、工单、客流再汇总 |
      | **编排-执行** Orchestrator-workers | 中心 LLM **动态**拆任务分给 worker，再汇总 | **子任务事先无法预知** | 「排查 3 号楼异常」要查哪些子系统由编排者决定 |
      | **评估-优化** Evaluator-optimizer | 一个生成，一个按标准评估并反馈，循环改进 | **有清晰评估标准**，且反馈能带来可测提升 | 生成月报 → 按清单检查 → 修改 |

      **二、几个容易混的边界**

      - **并行 vs 编排-执行**：结构看起来很像，Anthropic 指出关键区别是**灵活性**——并行的子任务是代码预先定好的；编排-执行的子任务是编排者**根据输入临时决定**的。
      - **评估-优化 vs Agent**：评估-优化也有循环，但循环结构是代码定的（生成 → 评估 → 生成），模型不能决定去调别的工具。
      - **路由用什么分类**：可以是 LLM，也可以是传统分类模型或规则，Anthropic 原文明确说两者都行。还可以按难度路由：简单问题走小模型，难题走大模型，省成本。

      **三、编排-执行的结构**

      ```mermaid
      flowchart LR
        Q["用户任务"] --> O["编排者 LLM：拆出子任务清单"]
        O --> W1["worker 1：查门禁告警"]
        O --> W2["worker 2：查设备在线率"]
        O --> W3["worker 3：查近 7 天工单"]
        W1 --> S["编排者汇总结论"]
        W2 --> S
        W3 --> S
      ```

      子任务清单是 LLM 生成的，数量和内容每次可能不同；但「拆 → 并发执行 → 汇总」这个骨架是代码写死的。

      **四、模式可以组合**

      最常见的组合：**入口路由 + 各分支内部用链式或并行 + 少数开放分支才进 Agent**。Anthropic 强调这些模式「不是规定」，是可以拼装的积木，关键是**用评测衡量，只在能证明效果更好时才加复杂度**。

      **五、不这样做会怎样**

      - 不用路由：为一类问题优化的 Prompt 会损害另一类问题的效果（Anthropic 原文点出的问题）。
      - 链式不加 gate：第一步抽错了，后面每一步都在错误上加工。
      - 评估-优化不设最大轮次：评估者总能挑出毛病，循环停不下来。
    scenarios: |
      - **工单派发**：链式——抽取设备、位置、故障现象 → 代码校验必填和设备是否存在 → 生成派单说明。
      - **运营问答入口**：路由——告警类走告警工具链，客流类走只读 Text2SQL（Day 39），制度类走 RAG。
      - **内容安全**：并行分段——一个 LLM 调用回答问题，另一个同时检查是否有越权或敏感请求，比让同一个调用兼顾两件事效果更好。
      - **代码修改**：编排-执行——要改几个文件、每个文件怎么改，取决于任务本身。
    code: |
      五种模式都能手写，下面是链式加 gate、并行、评估-优化的骨架（`llm` 为任意 OpenAI 兼容客户端的封装，异步版用 `allm`）：

      ```python
      import asyncio

      def chain_work_order(text: str) -> str:
          fields = llm_json(f"从报修描述中抽取 device_id、location、symptom：{text}")
          missing = [k for k in ("device_id", "location", "symptom") if not fields.get(k)]
          if missing:                                   # gate：程序化校验，不通过就中断
              return f"请补充：{', '.join(missing)}"
          return llm(f"根据要素生成派单说明：{fields}")

      async def parallel_overview(area: str) -> str:
          alarms, orders, flow = await asyncio.gather(   # 分段并行：子任务由代码预定
              allm(f"总结 {area} 今日告警"),
              allm(f"总结 {area} 未完结工单"),
              allm(f"总结 {area} 今日客流"),
          )
          return await allm(f"汇总成一段运营简报：{alarms} {orders} {flow}")

      def evaluate_optimize(task: str, max_rounds: int = 3) -> str:
          draft = llm(task)
          for _ in range(max_rounds):                    # 必须有最大轮次
              review = llm_json(f"按清单检查，返回 passed 和 feedback：{draft}")
              if review["passed"]:
                  break
              draft = llm(f"根据反馈修改：{review['feedback']}\n原稿：{draft}")
          return draft
      ```
    pitfalls: |
      - **误区：编排-执行就是多 Agent。** worker 可以只是普通 LLM 调用，不一定各自有循环和工具（多 Agent 见 Day 39）。
      - **误区：并行一定更快更好。** 子任务有依赖时强行并行会拿到不完整数据；投票模式会成倍增加成本。
      - **误区：评估者用同一个 Prompt 就行。** 评估标准不清晰时，评估者给的反馈很空泛，循环只会增加成本（Day 34 详讲）。
      - **路由分类不准**：路由错了后面全错。分类器要单独评测准确率，并给「不确定」留兜底分支。
    interview_asks:
      - question: "说几种常见的 LLM workflow 模式，各适合什么场景？"
        answer: "提示链是固定几步串起来。路由是先分类再进不同分支。并行是几段互不依赖一起做再合并。编排-执行是一个步骤负责拆任务。评估-优化是生成后再检查。能写死的就别用自由 Agent。"
      - question: "并行（parallelization）和编排-执行（orchestrator-workers）有什么区别？"
        answer: "并行的子任务是你事先定好的。编排-执行由模型临时决定拆成哪些子任务、派给谁。后者更灵活，也更难测。子任务已知就用并行。"
      - question: "评估-优化模式什么时候有效，什么时候只是浪费钱？"
        answer: "有明确检查标准时有效，比如代码要能跑、JSON 要过校验。没有标准、只是让模型「再看看好不好」，经常原地打转，多花钱。检查要能失败，失败要能指出具体问题。"
    project_example: |
      **p2 智慧园区运营 Agent** 的入口就是一个组合：
      1. **路由**：先用小模型把运营人员的问题分成「告警排障 / 数据统计 / 工单操作 / 闲聊」。
      2. **数据统计**走链式：生成只读 SQL → 代码校验只含 SELECT 且只访问白名单表（gate）→ 执行 → 写结论。
      3. **区域运营简报**走并行：告警、工单、客流三路同时查，再汇总。
      4. 只有**告警排障**这种开放问题才进入 Agent 循环（Day 32 手写）。
      这样大部分请求走便宜可控的路径，Agent 只覆盖真正需要灵活性的部分。
    sources:
      - {title: "Anthropic - Building effective agents（Workflow 各小节）", url: "https://www.anthropic.com/engineering/building-effective-agents"}

  - id: d31-k3
    name: 什么时候不该用 Agent
    level: P1
    summary: 任务步骤固定、延迟敏感、强合规、高危操作或没有评测集时，用更简单的方案
    why: |
      会用 Agent 是基本功，**知道什么时候不用**才是高级工程师的判断力。面试官常问「这个需求你会用 Agent 吗」「你们为什么没用 Agent」，考的是成本意识和风险意识。
      Anthropic 原文的第一条建议就是：**先找最简单的方案，只在需要时增加复杂度，这可能意味着根本不做 agentic 系统。**
    problem: |
      Agent 用延迟、成本和不确定性去换灵活性。如果任务本身不需要灵活性，就是纯亏：
      - 用户等待从 1 秒变成十几秒；
      - Token 成本翻几倍；
      - 路径不确定，合规审计无法复现；
      - 多了模型误调用写操作的风险。
    principle: |
      **一、错误累积的直觉**

      Agent 每一步都可能出错，而且错误会往后传。假设每步成功率 95%：

      - 3 步：0.95³ ≈ 86%
      - 10 步：0.95¹⁰ ≈ 60%

      **步骤越多整体成功率越低**，Anthropic 也把「compounding errors（错误累积）」列为 Agent 的主要代价。所以能写死的步骤就别交给模型。

      **二、不该用 Agent 的六类场景**

      | 场景 | 原因 | 替代方案 |
      |---|---|---|
      | 简单问答、分类、抽取 | 一次调用就够 | 单次调用 + 结构化输出（Day 16） |
      | 步骤固定的业务流程 | 不需要模型决定路径 | workflow 或普通代码 |
      | 延迟敏感（1 秒内） | 多轮调用延迟叠加 | 单次调用、缓存、小模型 |
      | 强合规、需可复现审计 | 路径不确定 | 规则引擎 + LLM 辅助解释 |
      | 高危写操作且无人确认 | 误调用代价大 | 只生成草稿，人工执行 |
      | 没有评测集 | 无法证明更好 | 先建评测集再决定 |

      **三、渐进演进路径**

      ```mermaid
      flowchart LR
        A["单次调用加好的 Prompt"] --> B["加检索 RAG"]
        B --> C["固定 workflow"]
        C --> D["局部 Agent"]
        D --> E["多 Agent"]
      ```

      每往右走一步都要回答：**评测集上的指标提升了多少？多付出的延迟和成本值不值？** Anthropic 的原话是：很多应用里，**优化单次 LLM 调用加检索和示例，通常就够了**。

      **四、Agent 适合的信号**

      反过来，Anthropic 附录总结了 Agent 最有价值的任务特征：**既要对话又要行动、有清晰的成功标准、能形成反馈循环、有人类监督**。客服和编程 Agent 是两个典型。
    scenarios: |
      - **报修单填写**：6 个字段的信息都在用户描述里 → 单次调用 + 结构化输出抽取，前端让用户确认后提交，不需要 Agent。
      - **门禁开闸**：属于高危实时操作，LLM 最多解析意图，开闸必须走固定流程和权限校验。
      - **大屏实时指标**：要求毫秒级刷新，直接查库和缓存，LLM 不参与。
    pitfalls: |
      - **误区：上 Agent 能体现技术含量。** 面试官更看重你能否用评测数据证明架构选择。
      - **误区：Agent 不稳定就换更强的模型。** 很多时候问题是任务本身不该交给模型决策，把固定步骤写死比换模型更有效。
      - **忽略隐性成本**：Agent 需要 trace、评测集、权限控制、人工兜底，这些开发和运维成本常被低估。
      - **反向误区：一律不用 Agent。** 步骤真的依赖中间结果时，硬写 if/else 会漏掉大量分支。
    interview_asks:
      - question: "什么场景下你不会用 Agent？"
        answer: "步骤固定、要稳定延迟和成本、错了代价高的流程，比如审批通过后的记账。这些写 workflow。Agent 用在步骤事先列不全、需要按中间结果换工具的时候。"
      - question: "如果 Agent 的任务成功率只有 60%，你会怎么分析和改进？"
        answer: "先看失败轨迹：选错工具、参数错、还是不该停却停了。按错误类型改工具说明或改成固定步骤，而不是立刻换大模型。每次改动用同一评测集看成功率和步数。"
    project_example: |
      在 **p2 智慧园区运营 Agent** 立项时，产品希望「所有运营操作都通过 Agent 完成」。评估后我们只保留排障分析给 Agent：
      - 「生成本月能耗报表」改成定时 workflow；
      - 「门禁远程开闸」不进 Agent，只在工作台提供按钮，后端走权限校验；
      - 「创建工单」允许 Agent 生成草稿，但提交必须由值班长在工作台点击审批（Day 37 中断审批）。
      面试时可以讲：我们按「是否依赖中间结果、是否可逆、是否有评测集」三个问题逐项判断，而不是一刀切。
    sources:
      - {title: "Anthropic - Building effective agents（When and when not to use agents）", url: "https://www.anthropic.com/engineering/building-effective-agents"}

  - id: d31-k4
    name: 任务拆解：给每一步选合适的自主度
    level: P1
    summary: 把业务流程拆成步骤，逐步判断用普通代码、单次 LLM 调用还是交给 Agent，并先定评测方法
    analogy: |
      像拆一个复杂页面：先把页面拆成组件，判断哪些是纯展示组件（普通代码）、哪些需要调接口（工具）、哪些要根据用户操作动态决定渲染什么（Agent）。
      **不一样的地方**：组件拆错了只是难维护；Agent 的步骤拆错了，会直接表现为成功率低、成本高，而且要靠评测集才能发现。
    why: |
      吴恩达在 Agentic AI 课程第一模块专门讲「task decomposition（任务拆解）」和「evals（评测）」，认为这是做好 agentic 系统**最重要的能力**之一。
      面试里的设计题（「帮我设计一个 XX 助手」）本质就是考拆解：你能不能把模糊需求拆成可实现、可评测的步骤。
    problem: |
      拿到「做一个园区运营助手」这种需求，最常见的失败是**不拆解，直接把整个需求丢给一个 Agent**：
      - 模型要同时理解业务、选工具、做判断、写报告，任何一环弱都会拖垮整体；
      - 出错时不知道是哪一步的问题；
      - 没法逐步替换成更便宜、更稳的实现。
    principle: |
      **一、拆解的四个问题（对每一步都问一遍）**

      ```mermaid
      flowchart TD
        S["拆出的一个步骤"] --> Q1{"规则能写清楚吗"}
        Q1 -- "能" --> C["普通代码"]
        Q1 -- "不能" --> Q2{"一次 LLM 调用能完成吗"}
        Q2 -- "能" --> L["单次调用加结构化输出"]
        Q2 -- "不能" --> Q3{"后续步骤依赖中间结果吗"}
        Q3 -- "不依赖" --> W["workflow 串起来"]
        Q3 -- "依赖" --> A["交给 Agent 并设预算"]
      ```

      吴恩达课程的思路是：**先想「一个人会怎么一步步做这件事」**，把每一步写出来，再判断每一步能不能由 LLM 或工具完成；做不了的步骤就继续拆小。

      **二、拆解粒度的标准**

      - 每一步**输入输出清晰**，能单独测；
      - 每一步**一个 LLM 调用或一个工具就能完成**；
      - 能判断「这一步做对没有」——这是后面写评测的前提。

      **三、评测和拆解一起做**

      吴恩达特别强调：**尽早做一个粗糙的评测**，然后用错误分析找到最弱的那一步再改，而不是凭感觉调 Prompt（评测体系见 Day 41~42）。拆得好，错误分析才能定位到具体步骤。

      **四、拆解结果：混合架构**

      拆完通常会发现：大部分步骤是代码和单次调用，只有少数需要模型决定路径。这就自然得到「**外层 workflow + 局部 Agent**」的架构，也是 d31-k2 讲的模式组合。
    scenarios: |
      - **需求评审**：把「运营助手」拆成意图识别、数据查询、异常分析、工单草拟、审批提交五步，逐步标注实现方式。
      - **效果不好时**：按步骤统计错误，发现 70% 的失败出在「SQL 生成」这一步，就只优化这一步，而不是改整个 Prompt。
      - **面试设计题**：先说拆解，再说哪一步用 Agent，最后说如何评测，结构清晰。
    pitfalls: |
      - **误区：先选框架再拆需求。** 应该先拆解、确定哪里需要 Agent，再决定是手写循环还是用 LangGraph（Day 36）。
      - **拆得过细**：每个小判断都调一次 LLM，延迟和成本反而上升；能用代码的步骤不要交给 LLM。
      - **没有「做对没有」的判断标准**：步骤无法验证，就无法评测，也无法定位问题。
    interview_asks:
      - question: "拿到一个模糊的 AI 需求，你会怎么拆解成可实现的方案？"
        answer: "先写成输入、输出和失败时怎么办。再把任务拆成步骤，每步标清是规则、一次模型调用，还是要循环调工具。能用规则的不进模型。最后给每步定怎么验收。"
      - question: "你怎么判断一个步骤该用代码、单次 LLM 调用还是 Agent？"
        answer: "结果能精确计算或查库，用代码。分类、抽取、改写，一次调用就够。只有这一步要按观察结果反复决定下一步，才用 Agent。默认往更死的方案靠。"
    project_example: |
      **p2 智慧园区运营 Agent** 的「告警处置」需求拆解结果：

      | 步骤 | 实现 | 怎么判断做对 |
      |---|---|---|
      | 识别问题类型 | 单次调用 + 结构化输出 | 分类准确率 |
      | 查设备与告警 | 工具（只读接口） | 返回数据与系统一致 |
      | 分析根因 | **Agent**：按结果决定下一步查什么 | 人工标注的根因是否命中 |
      | 草拟工单 | 单次调用 + Schema 校验 | 必填字段完整 |
      | 提交工单 | 普通代码 + 人工审批 | 审批记录 |

      只有「分析根因」一步交给 Agent。后面 Day 32 手写的循环，就是这一格的实现。
    sources:
      - {title: "DeepLearning.AI - Agentic AI 课程大纲（Task decomposition / Evaluating agentic AI）", url: "https://www.deeplearning.ai/courses/agentic-ai/"}

test:
  - id: d31-t1
    kp: d31-k1
    type: single
    question: 以下哪个系统最符合 Anthropic 对 **Agent**（而不是 workflow）的定义？
    options:
      - "代码固定执行：向量检索 Top-5 → 拼接 Prompt → 调用 LLM 生成回答"
      - "代码依次调用 LLM 三次：分类意图、抽取参数、生成回复"
      - "LLM 根据工具结果自行决定是否继续查询、查哪个工具，直到它认为可以回答"
      - "LLM 生成一段 SQL，代码执行后直接把结果表格返回给用户"
    answer: [2]
    explain: |
      Agent 的关键是**控制流由模型在运行时决定**：调哪个工具、调几次、何时停都由 LLM 选，第三项符合。
      第一项是固定 RAG；第二项虽然调用三次 LLM，但顺序写死，属于链式 workflow；第四项只有一次工具使用，结果没有交回模型继续决策，没有循环。
  - id: d31-t2
    kp: d31-k1
    type: single
    question: 判断一个系统是 workflow 还是 Agent，最可靠的标准是什么？
    options:
      - "下一步做什么，是写在代码里，还是由模型在运行时选择"
      - "系统里调用 LLM 的次数是否超过两次"
      - "系统是否使用了 Function Calling 或 MCP 工具"
      - "系统是否基于 LangChain、LangGraph 等 Agent 框架实现"
    answer: [0]
    explain: |
      Anthropic 的划分依据是**路径是否由代码预先定义**。调用次数多、用了工具或框架都不能说明控制流归谁：
      固定调用三次 LLM 仍是 workflow；用 Function Calling 但只调一次也不是 Agent；LangGraph 也可以用来画完全固定的 workflow。
  - id: d31-t3
    kp: d31-k1
    type: judge
    question: 在 Agent 中，模型输出工具调用后，是模型自己执行了这个工具，所以工具的超时和鉴权应该写在 Prompt 里约束模型。
    answer: false
    explain: |
      模型只输出**调用意图和参数**，真正执行工具的是运行时代码。超时、鉴权、参数校验、停止条件都必须在代码里实现；
      写在 Prompt 里只是建议，模型可能不遵守，也可能被提示注入绕过。
  - id: d31-t4
    kp: d31-k1
    type: multi
    question: 把一个固定流程的 LLM 应用改造成 Agent 后，工程上**通常需要额外补**哪些能力？
    options:
      - "最大步数、Token 或时间预算等停止条件"
      - "记录每一步模型输出、工具参数和结果的 trace"
      - "用评测集统计任务成功率，而不只是断言一次输出"
      - "把所有工具都改成同步函数，避免并发问题"
    answer: [0, 1, 2]
    explain: |
      控制流交给模型后，步数和成本不确定，需要停止条件；路径不确定，排查依赖逐步 trace；输出不确定，测试要靠评测集统计。
      工具改成同步函数与 Agent 改造无关，反而会损失并发能力，不是必须项。
  - id: d31-t5
    kp: d31-k1
    type: judge
    question: Anthropic 所说的「增强型 LLM」（LLM 加检索、工具、记忆）是 workflow 和 Agent 共同的基础积木，两者的区别不在于有没有工具，而在于谁来串联这些积木。
    answer: true
    explain: |
      Anthropic 把 augmented LLM 作为所有 agentic 系统的基础积木，并假设每个 LLM 调用都能使用这些能力。
      workflow 用代码把积木串起来，Agent 让 LLM 自己决定怎么串，所以「有没有工具」不是区分标准。
  - id: d31-t6
    kp: d31-k2
    type: single
    question: 「编排-执行（orchestrator-workers）」和「并行（parallelization）」结构很像，它们最关键的区别是什么？
    options:
      - "编排-执行的 worker 必须是独立的 Agent，并行的子任务只能是普通函数"
      - "编排-执行的子任务由编排者根据输入动态决定，并行的子任务由代码预先定义"
      - "编排-执行只能串行执行子任务，并行模式才能同时执行"
      - "编排-执行不需要汇总结果，并行模式需要程序化汇总"
    answer: [1]
    explain: |
      Anthropic 原文指出两者拓扑相似，关键区别是**灵活性**：并行的子任务是预先定义的，编排-执行的子任务由中心 LLM 根据具体输入临时拆出。
      worker 可以只是普通 LLM 调用；编排-执行的子任务同样可以并发；它也需要汇总，所以其他三项都不对。
  - id: d31-t7
    kp: d31-k2
    type: single
    question: 园区运营助手要把问题分成「告警排障 / 数据统计 / 工单操作」，分别走不同的 Prompt 和工具。这属于哪种模式？它成立的前提是什么？
    options:
      - "并行模式，前提是三类问题可以同时处理"
      - "评估-优化模式，前提是有清晰的评估标准"
      - "编排-执行模式，前提是子任务无法预知"
      - "路由模式，前提是类别清晰且分类足够准确"
    answer: [3]
    explain: |
      先分类再分发到专门的下游流程，是**路由**。Anthropic 说明它适用于类别清晰、分开处理效果更好、且分类能做准（LLM 或传统分类器均可）的场景。
      并行是同时做多个子任务；评估-优化是生成加评估循环；编排-执行是动态拆子任务，都不符合。
  - id: d31-t8
    kp: d31-k2
    type: multi
    question: 关于「评估-优化（evaluator-optimizer）」模式，下列说法正确的有哪些？
    options:
      - "适用前提之一是有清晰的评估标准，迭代改进能带来可衡量的提升"
      - "生成和评估的循环结构由代码定义，模型不能自行决定去调用其他工具"
      - "必须设置最大轮次，否则评估者总能挑出问题导致循环停不下来"
      - "它和 Agent 一样，路径完全由模型决定，因此属于 Agent"
    answer: [0, 1, 2]
    explain: |
      Anthropic 给出的适用信号是「有清晰评估标准」且「反馈能带来可测改进」；它的循环骨架是代码写死的，所以仍属 workflow，第四项错误。
      评估者往往总能提出修改意见，不设最大轮次就会无限循环并持续花钱。
  - id: d31-t9
    kp: d31-k2
    type: single
    question: 下面这段代码属于哪种 workflow 模式？
    code: |
      def handle(text: str) -> str:
          fields = llm_json(f"抽取 device_id、location、symptom：{text}")
          if not fields.get("device_id"):
              return "请补充设备编号"
          draft = llm(f"生成派单说明：{fields}")
          return llm(f"把派单说明翻译成英文给外包团队：{draft}")
    options:
      - "路由：根据是否有设备编号选择不同分支"
      - "评估-优化：先生成派单说明再检查质量"
      - "链式：固定顺序的多步调用，中间带程序化校验"
      - "编排-执行：由 LLM 决定要执行哪些子任务"
    answer: [2]
    explain: |
      三次 LLM 调用顺序固定，每步处理上一步的输出，中间用代码检查 device_id（gate），是典型的**链式**。
      缺字段直接返回是 gate 中断，不是路由到专门流程；没有评估反馈循环；子任务也不是 LLM 决定的。
  - id: d31-t10
    kp: d31-k2
    type: judge
    question: 并行模式中的「投票（voting）」是把同一个任务运行多次以获得多样输出再汇总，适合需要更高置信度的判断，例如多个 Prompt 分别检查同一段代码是否有漏洞。
    answer: true
    explain: |
      Anthropic 把并行分为两种：分段（拆成独立子任务并行）和投票（同一任务多次运行）。
      代码漏洞审查、内容是否违规这类需要多视角或不同阈值平衡误报漏报的判断，正是投票的典型场景，代价是成本成倍增加。
  - id: d31-t11
    kp: d31-k3
    type: single
    question: 一个 Agent 平均每个任务要走 10 步，每步成功率约 95%。从「错误累积」的角度看，最有效的改进方向通常是什么？
    options:
      - "换一个更大的模型，把每步成功率从 95% 提高到 96%"
      - "把高频的固定步骤写成代码或合并成一个聚合工具，减少步数"
      - "提高最大步数上限，给模型更多重试机会"
      - "在 System Prompt 里强调「请认真完成每一步」"
    answer: [1]
    explain: |
      整体成功率约为单步成功率的步数次方，0.95 的 10 次方约 60%，**步数是放大器**。把固定步骤写死或合并工具能直接减少出错机会。
      单步提升 1 个百分点收益有限；提高步数上限只会让失败更慢更贵；Prompt 里的口号不能改变结构性问题。
  - id: d31-t12
    kp: d31-k3
    type: multi
    question: 以下哪些需求通常**不适合**直接做成自主 Agent？
    options:
      - "从报修描述中抽取设备、位置、现象等 6 个固定字段"
      - "大屏上每秒刷新的实时在线设备数"
      - "根据告警逐步查看设备、网络、维保记录来定位离线原因"
      - "运营人员一句话就远程打开园区大门，没有任何人工确认"
    answer: [0, 1, 3]
    explain: |
      固定字段抽取一次结构化输出就够；秒级刷新的指标直接查库和缓存，多轮 LLM 调用无法满足延迟；远程开门是高危实时操作，不能让模型自主执行。
      离线原因排查的步骤取决于中间结果，正是 Agent 的典型适用场景。
  - id: d31-t13
    kp: d31-k3
    type: judge
    question: Anthropic 建议，对很多应用来说，优化单次 LLM 调用（配合检索和上下文示例）通常就够了，agentic 系统是用延迟和成本换效果，应在确有必要时才使用。
    answer: true
    explain: |
      这是《Building effective agents》「When and when not to use agents」一节的核心观点：先找最简单的方案，只在需要时增加复杂度，有时意味着根本不做 agentic 系统。
      Agent 带来的灵活性要用评测证明值得多付出的延迟和成本。
  - id: d31-t14
    kp: d31-k3
    type: single
    question: 某团队的 Agent 在 Demo 中表现不错，产品要求立即替换线上的固定流程。你最应该先确认什么？
    options:
      - "Agent 框架是否是最新版本"
      - "Demo 里展示的几个例子是否都回答正确"
      - "模型是否支持并行工具调用"
      - "是否有评测集能对比两者的成功率、延迟和成本"
    answer: [3]
    explain: |
      Agent 的输出路径不确定，几个 Demo 例子说明不了整体效果。没有评测集就无法证明替换后更好，也无法发现回退。
      框架版本和并行调用能力都是实现细节，不能回答「该不该替换」这个架构问题。
  - id: d31-t15
    kp: d31-k4
    type: single
    question: 拆解「告警处置」流程时，「判断告警级别是否达到需要派单的阈值」这一步，规则已经在运维手册里写清楚。它最适合用什么实现？
    options:
      - "普通代码，按阈值规则判断"
      - "单次 LLM 调用，让模型读手册判断"
      - "交给 Agent，让模型决定是否需要派单"
      - "用评估-优化模式反复确认判断结果"
    answer: [0]
    explain: |
      规则能写清楚的步骤用普通代码最稳：结果确定、可单测、零 Token 成本。
      交给 LLM 会引入不必要的不确定性；交给 Agent 更是把确定性问题变成概率问题；评估-优化只会增加成本。
  - id: d31-t16
    kp: d31-k4
    type: multi
    question: 关于任务拆解，下列哪些做法是合理的？
    options:
      - "先想一个人会怎么一步步完成这件事，把步骤写出来再逐步判断实现方式"
      - "每一步的输入输出要清晰，并能判断这一步做对没有"
      - "尽早做一个粗糙的评测，用错误分析找到最弱的步骤优先改进"
      - "先选定 Agent 框架，再根据框架提供的组件去拆需求"
    answer: [0, 1, 2]
    explain: |
      吴恩达课程的拆解方法是从「人怎么做」出发，逐步判断 LLM 或工具能否完成；每步可验证才能做评测和错误分析，从而定位最弱环节。
      先选框架再拆需求是本末倒置，容易被框架的抽象带偏，把不需要的复杂度引进来。
  - id: d31-t17
    kp: d31-k4
    type: judge
    question: 任务拆解得越细越好，最好每个小判断都单独调用一次 LLM，这样每一步都更简单、整体更准确。
    answer: false
    explain: |
      拆得过细会让 LLM 调用次数和延迟、成本上升，步骤增多还会放大错误累积。
      能用代码完成的判断不应交给 LLM；拆解的目标是每一步「输入输出清晰、可验证」，而不是越碎越好。
  - id: d31-t18
    kp: d31-k4
    type: single
    question: 运营助手上线后整体效果不好。按步骤统计失败用例后，发现大部分失败集中在「生成 SQL」这一步。下一步最合理的做法是？
    options:
      - "把整个系统改成一个更自由的 Agent，让模型自己决定怎么查数据"
      - "重写所有步骤的 Prompt，统一提高要求"
      - "集中优化 SQL 生成这一步，并用这一步的专项评测验证改进"
      - "增加最大步数，让 Agent 有更多机会修正 SQL"
    answer: [2]
    explain: |
      拆解和错误分析的价值就是**定位最弱环节**。失败集中在 SQL 生成，就针对这一步改进（补表结构说明、示例、执行报错反馈等），并用专项评测确认效果。
      改成更自由的 Agent 会让问题更难定位；全量改 Prompt 没有针对性；加步数只是让失败更贵。

exam:
  - id: d31-e1
    kp: d31-k1
    type: single
    question: 下列关于「自主度光谱」的说法，哪一项最准确？
    options:
      - "只有自主度最高、能自由选择任何工具的系统才算 agentic 系统"
      - "自主度越高越先进，新项目应尽量从高自主度开始设计"
      - "自主度只取决于用了多大的模型，与系统架构无关"
      - "系统可以只在某个分支里让模型选路径，其余步骤由代码固定"
    answer: [3]
    explain: |
      吴恩达强调 agentic 是程度问题，不同部分可以有不同自主度，最常见的就是「外层固定、局部由模型决定」。
      低自主度系统也属于 agentic 系统；自主度越高越贵越难控，应够用即止；自主度由架构决定谁掌控路径，而不是模型大小。
  - id: d31-e2
    kp: d31-k2
    type: single
    question: 生成园区月报时，团队希望用「一个 LLM 回答用户问题，另一个 LLM 同时检查请求是否越权或包含敏感内容」。Anthropic 认为这样做通常比让同一个调用兼顾两件事效果更好，原因是什么？
    options:
      - "每个关注点由单独的 LLM 调用处理时，注意力更集中"
      - "两个调用一定比一个调用便宜，因为每个 Prompt 更短"
      - "这样可以让模型自主决定是否需要做安全检查"
      - "并行调用可以完全消除提示注入风险"
    answer: [0]
    explain: |
      Anthropic 在并行（分段）小节指出，对于多方面考虑的复杂任务，每个方面由单独的 LLM 调用处理时，模型的注意力更集中、表现通常更好，护栏检查就是例子。
      两个调用总成本未必更低；检查是否执行由代码决定而非模型；并行检查能降低风险但不能完全消除注入。
  - id: d31-e3
    kp: d31-k3
    type: single
    question: 财务部门要求「每张报销单的审核路径都能事后复现，并能向审计解释」。在这个约束下，对审核环节最合理的设计是？
    options:
      - "用 Agent 自主决定检查哪些项目，并保存完整 trace 供审计"
      - "固定 workflow 执行各项规则检查，LLM 只用于解释结果和处理模糊描述"
      - "完全交给 LLM 一次性给出通过或驳回结论"
      - "用评估-优化模式让两个 LLM 互相审核直到一致"
    answer: [1]
    explain: |
      强合规场景要求路径可复现，固定 workflow 加确定性规则最合适，LLM 用在需要理解语言的局部。
      Agent 即使保存 trace，每次路径也可能不同，难以向审计解释「为什么这次检查了这些项」；一次性 LLM 结论和两个 LLM 互审都无法提供确定、可复现的依据。
  - id: d31-e4
    kp: d31-k4
    type: single
    question: 设计面试题「做一个园区设备巡检助手」时，候选人一开口就说「我会用 LangGraph 搭一个多 Agent 系统」。面试官最可能追问并扣分的点是？
    options:
      - "LangGraph 的版本是不是最新的"
      - "多 Agent 之间用什么通信协议"
      - "为什么不用 LangChain 而用 LangGraph"
      - "没有先拆解需求、说明哪些步骤真正需要 Agent 以及如何评测"
    answer: [3]
    explain: |
      设计题考的是拆解和取舍：先把需求拆成步骤，判断每步用代码、单次调用还是 Agent，再说明评测方法。直接上框架和多 Agent 说明没有做取舍。
      框架版本、通信协议、框架之间的比较都是后续细节，不是这个回答最大的问题。
  - id: d31-e5
    kp: d31-k1
    type: multi
    question: 下列哪些系统中，「下一步做什么」是由**模型**在运行时决定的？
    options:
      - "Agent 根据设备状态查询结果，自己决定接下来查网络告警还是维保记录"
      - "代码先调 LLM 判断问题类别，再按类别执行预先写好的处理函数"
      - "编排者 LLM 根据任务内容拆出 2 到 5 个子任务，代码并发执行后汇总"
      - "代码固定执行：生成 SQL、校验、执行、写结论"
    answer: [0, 2]
    explain: |
      第一项是典型 Agent；第三项的子任务数量和内容由编排者 LLM 决定，虽然骨架固定，但「做哪些子任务」由模型选。
      第二项中 LLM 只输出类别，分支和处理函数都是代码预设的路由；第四项是完全固定的链式流程。
  - id: d31-e6
    kp: d31-k3
    type: multi
    question: 根据 Anthropic 的总结，下列哪些特征说明一个任务**比较适合**交给 Agent？
    options:
      - "既需要对话，又需要调用系统执行动作"
      - "有清晰的成功标准，可以判断任务是否完成"
      - "能从环境中得到反馈，形成「执行-检查-修正」的循环"
      - "步骤完全固定，并且需要每次结果都一模一样"
    answer: [0, 1, 2]
    explain: |
      Anthropic 附录总结 Agent 最有价值的任务：需要对话加行动、有清晰成功标准、能形成反馈循环、有有效的人类监督，客服和编程是典型。
      步骤固定且要求结果完全一致的任务应该用 workflow 或普通代码。
  - id: d31-e7
    kp: d31-k2
    type: judge
    question: 路由模式中的分类器必须是 LLM，因为传统分类模型无法理解自然语言请求。
    answer: false
    explain: |
      Anthropic 原文写明，分类可以由 LLM 完成，也可以由更传统的分类模型或算法完成，前提是分类足够准确。
      高频、类别稳定的场景用小模型或传统分类器往往更快更便宜；无论用哪种，都应单独评测分类准确率。
  - id: d31-e8
    kp: d31-k4
    type: judge
    question: 一个步骤如果无法定义「怎样算做对」，就很难为它写评测，也难以在错误分析中定位问题，所以拆解时应尽量让每一步都可验证。
    answer: true
    explain: |
      拆解和评测是一体的：每一步可验证，才能统计每一步的错误率，找出最弱环节优先改进。
      吴恩达课程强调先做粗糙评测、再做错误分析，前提就是步骤边界清晰、结果可判断。
  - id: d31-e9
    kp: d31-k3
    type: case
    question: |
      某智慧园区 SaaS 要上线「智能报修」功能：业主在小程序里输入一句话描述故障（如「3 栋 2 单元电梯按钮不亮」），系统生成报修单，包含楼栋、单元、设备类型、故障描述、紧急程度、联系电话 6 个字段，业主确认后提交给物业。
      产品经理提议：「做成一个 Agent，让它自己查设备台账、查历史工单、判断紧急程度、自动提交。」试运行一周发现平均响应 12 秒，偶尔出现未经业主确认就提交的工单。
      最合理的改进方案是？
    options:
      - "保留 Agent，把最大步数从 8 调到 4，并在 Prompt 中强调「提交前必须确认」"
      - "保留 Agent，换更强的模型以提高判断准确率和速度"
      - "改为单次调用加结构化输出抽取字段，紧急程度用规则判断，业主确认后由代码提交"
      - "改成多 Agent：一个负责抽取，一个负责判断紧急程度，一个负责提交"
    answer: [2]
    explain: |
      6 个字段的信息都在用户描述里，一次结构化输出即可抽取，紧急程度有明确规则就用代码；提交是写操作，必须由业主确认后由代码执行。这样延迟低、结果稳定，也不存在模型擅自提交的风险。
      减少步数和 Prompt 约束不能保证不越权提交；换模型解决不了「不该用 Agent」的结构性问题；多 Agent 进一步增加延迟和复杂度。

interview:
  - id: d31-i1
    kp: d31-k1
    type: short
    difficulty: 2
    question: Agent 和 workflow 有什么本质区别？你在项目里是怎么判断该用哪个的？
    key_points:
      - {text: "指出核心区别是控制流归属：workflow 由代码预定义路径，Agent 由模型运行时决定下一步", dim: concept}
      - {text: "说明 Agent 的代价：成本延迟不确定、错误累积、需要评测集和逐步 trace", dim: principle}
      - {text: "给出判断依据：步骤能否提前列出、是否依赖中间结果、有无可靠工具和评测集", dim: engineering}
      - {text: "结合项目说明一个用 workflow 和一个用 Agent 的具体例子", dim: project}
    reference: |
      **本质区别是「下一步做什么由谁决定」。** Anthropic 的定义是：workflow 里 LLM 和工具通过预先写好的代码路径编排；Agent 里 LLM 动态决定自己的流程和工具使用。两者都可以用工具、都可以多次调用 LLM，所以「有没有工具」「调几次」不是区分标准。

      **控制流交给模型的代价**：步数不确定，成本和延迟不确定；每一步都可能出错，错误会累积；路径不确定，不能只写断言式单测，要用评测集统计成功率，还要记录每一步的 trace 才能复盘。

      **我的判断方法**：先问一次调用加检索能不能解决；不能的话，问步骤能不能提前列出来，能就用 workflow；只有后续步骤依赖中间结果、又有可靠工具和评测集时才用 Agent，并配上步数和预算上限。

      **项目例子**：在智慧园区运营 Agent 里，「昨日告警日报」数据源固定，用定时 workflow；「B2 摄像头为什么离线」要先查设备状态，再按结果决定查网络告警还是维保记录，这部分才交给 Agent，最多 8 步，每步写 trace。
    oral: |
      我理解最本质的区别是控制流归谁。workflow 是代码把 LLM 和工具按固定路径串起来，Agent 是模型在运行时根据工具结果自己决定下一步。所以调了几次模型、有没有用工具，都不是判断标准。
      交给模型的代价是成本和延迟不确定、错误会累积，测试要靠评测集，还要逐步 trace。
      我的判断是：步骤能提前列出来就用 workflow，只有步骤依赖中间结果时才用 Agent。比如我们园区运营项目，告警日报是定时 workflow，摄像头离线排查才交给 Agent，并限制最多 8 步。
  - id: d31-i2
    kp: d31-k3
    type: scenario
    difficulty: 3
    question: 老板看了竞品演示，要求你「把园区运营系统里所有功能都改成 Agent」，包括日报生成、能耗报表、门禁开闸、告警排查和工单派发。你会怎么回应和推进？
    key_points:
      - {text: "不直接拒绝，而是按功能逐项评估：步骤是否固定、是否依赖中间结果、是否可逆", dim: concept}
      - {text: "用错误累积和延迟成本说明固定流程改 Agent 的代价", dim: principle}
      - {text: "门禁开闸、工单提交这类高危或写操作不让模型自主执行，至少要人工确认", dim: engineering}
      - {text: "先选一个开放问题场景（如告警排查）试点，用评测集对比成功率、延迟和成本再决定扩大范围", dim: project}
      - {text: "给出混合架构：入口路由，固定功能走 workflow，排障走 Agent", dim: engineering}
    reference: |
      **态度**：不直接说「不行」，而是给出可执行的评估方案，让决策基于数据。

      **逐项评估**（三个问题：步骤固定吗？依赖中间结果吗？操作可逆吗？）：
      - 日报、能耗报表：数据源和步骤固定 → 保留 workflow，可以用 LLM 写摘要，但不需要 Agent。
      - 门禁开闸：高危、实时、不可逆 → 不进 Agent，最多让 LLM 解析意图，开闸走权限校验和固定流程。
      - 工单派发：Agent 可以生成草稿，提交必须人工审批。
      - 告警排查：步骤依赖中间结果 → 最适合 Agent。

      **讲清代价**：每步 95% 成功率，10 步整体只剩约 60%；多轮调用让响应从秒级变成十几秒；固定流程改成 Agent 后结果不再稳定，审计也难复现。

      **推进方式**：先在告警排查上做试点，准备一份评测集（真实历史告警和人工标注的根因），对比现有方式和 Agent 的命中率、平均步数、延迟和成本；效果确实更好再逐步扩大。架构上采用入口路由 + workflow + 局部 Agent。
    oral: |
      我不会直接说不行，而是逐个功能评估。我会问三个问题：步骤是不是固定的、后面的步骤依不依赖中间结果、操作能不能撤销。
      按这个看，日报和能耗报表步骤固定，继续用 workflow；门禁开闸是高危操作，绝不交给模型自主执行；工单可以让 Agent 写草稿，但提交要人工审批；真正适合 Agent 的是告警排查。
      我会跟老板讲清楚代价，比如步骤一多成功率会累积下降，响应也会变慢。然后先拿告警排查做试点，用历史告警做评测集，对比命中率、延迟和成本，数据证明更好再扩大。
  - id: d31-i3
    kp: d31-k2
    type: design
    difficulty: 4
    question: 请为智慧园区设计一个「运营助手」的整体架构：运营人员可以问告警原因、查客流和能耗数据、让助手生成区域运营简报、草拟并提交工单。说明你会用哪些 workflow 模式、哪里用 Agent，以及如何控制成本和风险。
    key_points:
      - {text: "入口用路由模式按意图分流，分类器单独评测并有不确定兜底", dim: engineering}
      - {text: "数据查询用链式加 gate（只读 SQL 校验），区域简报用并行分段再汇总", dim: concept}
      - {text: "只有告警原因排查这类开放问题进入 Agent，并设最大步数、预算和 trace", dim: engineering}
      - {text: "工单提交等写操作需人工审批，身份由后端注入，工具内二次鉴权", dim: engineering}
      - {text: "说明用评测集和线上指标（解决率、转人工率、延迟、成本）驱动迭代", dim: project}
    reference: |
      **整体：入口路由 + 分支内 workflow + 局部 Agent。**

      1. **路由**：小模型或分类器把请求分成告警排查、数据查询、运营简报、工单操作、其他。分类器单独评测准确率，置信度低时追问用户。
      2. **数据查询（链式 + gate）**：生成只读 SQL → 代码校验只含 SELECT、只访问白名单视图、带 LIMIT → 执行 → LLM 写结论。gate 不通过就把错误回给生成步骤，最多重试 2 次。
      3. **运营简报（并行分段）**：告警、工单、客流、能耗四路并发查询和摘要，再由一个调用汇总；如果要提高质量，可以在最后加一轮评估-优化，最多 2 轮。
      4. **告警排查（Agent）**：唯一交给模型决定路径的部分。只读工具（查设备、查告警、查维保记录）可自主调用；最多 8 步、60 秒总超时、单次 Token 预算，超限给出部分结论并转人工。
      5. **工单操作**：Agent 或链式只生成草稿，**提交必须值班长在工作台审批**；操作人身份由后端从登录态注入，工具内部再次校验权限。

      **成本控制**：路由用小模型，大部分流量走 workflow；Agent 只覆盖排查。
      **可观测与迭代**：每个分支都记 trace；评测集覆盖五类意图；线上看解决率、转人工率、P95 延迟和单次成本，每次改动先跑评测回归。
    oral: |
      我的设计是入口路由加分支 workflow，再加局部 Agent。入口先用小模型分类，分成告警排查、数据查询、运营简报和工单操作，分类器单独评测，拿不准就追问。
      数据查询用链式，生成 SQL 后用代码校验只读和白名单，再执行；运营简报用并行，四路数据同时查再汇总。只有告警排查交给 Agent，因为下一步查什么取决于上一步结果，我会限制 8 步、设总超时和预算，超了就给部分结论转人工。
      工单只让模型写草稿，提交必须值班长审批，身份由后端注入。最后每个分支都记 trace，用评测集和线上的解决率、成本来迭代。
