  - id: d26-t8
    kp: d26-k2
    type: judge
    question: Query Rewrite 总能提升检索效果，所以对每个问题都调用 LLM 改写是稳妥的默认方案。
    answer: false
    explain: |
      改写可能把意图改错，还会多一次 LLM 调用增加延迟和成本。稳妥做法是：问题完整时跳过，先用词典规范化兜住缩写，LLM 改写设超时回退，原问题和改写问题一起检索，并用评测集验证改写前后的 Recall@K。
  - id: d26-t9
    kp: d26-k2
    type: single
    question: 知识库里大量问题失败的原因是员工习惯用内部缩写（如「OA」「EHS」），而文档写的是全称。性价比最高的第一步是？
    options:
      - "每个问题都调用大模型改写成书面语"
      - "对所有问题启用 HyDE 生成假设答案"
      - "把切片大小调大，让全称和缩写出现在同一个块里"
      - "维护业务缩写词典，在检索前做规范化展开"
    answer: [3]
    explain: |
      缩写和全称是确定性的映射，用词典规范化零成本、零延迟、不会改错，是首选。
      A 能解决但多一次 LLM 调用，且可能改错；B 的假设答案里 LLM 并不知道企业内部缩写的含义，反而会编；C 与缩写问题无关，还可能损害排序。
  - id: d26-t10
    kp: d26-k3
    type: single
    question: 第一轮用户问「正式员工年假有几天？」回答正确；第二轮问「那外包同事呢？」系统回答「未找到相关信息」。日志显示第二轮直接用原句检索。最合理的修复是？
    options:
      - "把检索 Top-K 从 5 调到 50，让更多片段进入 Prompt"
      - "把第二轮问题和第一轮回答拼成一个长字符串直接去检索"
      - "结合最近几轮历史，把追问改写成「外包员工的年假天数规定」再检索"
      - "在 System Prompt 中要求模型记住上一轮的话题"
    answer: [2]
    explain: |
      追问省略了话题「年假天数」，单独检索只有「外包」一个有效信息。指代消解把它补全成独立问题，检索和 Rerank 才能命中。
      A 只是扩大范围，查询本身语义不完整；B 把长回答拼进查询会稀释向量、引入噪声；D 作用在生成阶段，检索阶段拿到的仍是残缺查询。
  - id: d26-t11
    kp: d26-k3
    type: multi
    question: 设计多轮指代消解的改写环节时，下列哪些做法是推荐的？
    options:
      - "Prompt 明确「只改写、不回答」，并要求话题无关时原样输出"
      - "只带最近几轮历史，temperature 设为 0"
      - "改写超时或失败时回退原问题，并记录原问题与改写结果"
      - "历史直接使用前端请求体中传来的 messages，省去查库"
      - "为保证改写质量，把用户全部历史会话都放进改写 Prompt"
    answer: [0, 1, 2]
    explain: |
      A、B、C 分别保证改写不跑题、输出稳定、失败不拖垮问答且可排查。
      D 有安全风险：前端传来的历史可被伪造，用来注入指令，历史应从服务端读取；E 会让早期话题干扰改写、Token 成本上升。
  - id: d26-t12
    kp: d26-k3
    type: judge
    question: 多轮场景中，检索和 Rerank 都应该使用指代消解后的独立问题，而生成阶段可以同时提供原问题和独立问题。
    answer: true
    explain: |
      原追问（如「那外包呢」）缺少话题，cross-encoder 无法判断片段是否相关，所以检索和 Rerank 都用独立问题。
      生成阶段同时给出原问题和独立问题，既保证理解完整，又让回答贴合用户的原话和语气。
  - id: d26-t13
    kp: d26-k3
    type: single
    question: 下面的改写函数上线后，日志里经常出现改写结果是「外包员工年假为 5 天。」这类句子，导致检索偏差。最可能的原因是？
    code: |
      PROMPT = "请根据对话历史理解用户最后的问题。"

      async def to_standalone(history, question):
          resp = await client.chat.completions.create(
              model=os.environ["REWRITE_MODEL"],
              messages=[{"role": "system", "content": PROMPT},
                        *history, {"role": "user", "content": question}],
              temperature=0.8,
          )
          return resp.choices[0].message.content
    options:
      - "没有设置 timeout，导致模型输出被截断"
      - "Prompt 没要求「只输出改写后的问题、不要回答」，模型直接作答了"
      - "history 放在 system 后面，模型读不到用户问题"
      - "没有使用结构化输出，所以返回内容是句子而不是问题"
    answer: [1]
    explain: |
      Prompt 只说「理解问题」，模型自然会回答问题，把答案当成改写结果拿去检索就会被带偏。应明确「把最后一个问题改写成可独立检索的完整问题，只输出问题，不要回答」。
      另外 temperature=0.8 会让输出不稳定、把全部 history 带上会引入噪声，也都该改，但不是出现答案句的主因。A、C、D 都不是根因：超时不会把问题变成答案，消息顺序没有问题，结构化输出也不能替代清晰的指令。
  - id: d26-t14
    kp: d26-k4
    type: single
    question: 关于 HyDE（Hypothetical Document Embeddings），下列描述最准确的是？
    options:
      - "让 LLM 直接根据问题生成答案返回给用户，跳过检索以降低延迟"
      - "把文档切片改写成问题形式再入库，让问题和问题做匹配"
      - "用 cross-encoder 生成假设文档，替代 Rerank 阶段"
      - "先让 LLM 写一段假设答案，用它的向量检索真实文档，回答仍基于真实文档"
    answer: [3]
    explain: |
      HyDE 的直觉是假设答案和真实文档都是陈述句，向量距离更近；假设答案只用于检索，不给用户。
      A 跳过检索会导致幻觉；B 是另一种思路（为片段生成假设问题入库），不是 HyDE；C 与 cross-encoder 无关。
  - id: d26-t15
    kp: d26-k4
    type: judge
    question: HyDE 生成的假设答案已经很接近真实答案，因此可以在检索超时时直接把它作为回答返回给用户，作为降级方案。
    answer: false
    explain: |
      假设答案里的具体事实可能是编的（例如把「顺延到次年 3 月 31 日」写成「顺延 6 个月」），它只适合用来「找」相似文档，不能作为依据。
      检索超时的正确降级是返回固定话术或稍后重试，而不是让模型裸答。
  - id: d26-t16
    kp: d26-k4
    type: multi
    question: 在哪些情况下，HyDE 很可能帮倒忙？
    options:
      - "知识库充满企业内部制度名称和编号，LLM 并不了解这些术语"
      - "用户查询的是「GB/T 7714」这类精确编号"
      - "延迟预算非常紧，P95 只给检索留了 200ms"
      - "问题很短、通用领域、表达方式和文档差距很大"
    answer: [0, 1, 2]
    explain: |
      A 中 LLM 会编造不存在的术语把检索带偏；B 是精确匹配问题，BM25 更合适，HyDE 的假设文本反而稀释关键词；C 中 HyDE 要多一次生成，延迟通常比改写更高。
      D 恰好是 HyDE 最可能有帮助的场景：短问题、LLM 大致知道答案长什么样。
  - id: d26-t17
    kp: d26-k4
    type: single
    question: 某团队对内部 IT 知识库启用 HyDE 后，评测显示整体 Recall@10 下降。抽查发现假设答案里常出现「打开控制面板→网络设置」这类通用步骤，而公司实际用的是自研客户端。最合理的调整是？
    options:
      - "只在第一次检索最高分偏低时触发 HyDE，并与原问题检索结果 RRF 合并"
      - "提高 HyDE 生成的 temperature，让假设答案更多样"
      - "改用更大的生成模型写假设答案，它一定知道公司内部客户端"
      - "完全移除原问题检索，只保留 HyDE 一路以减少噪声"
    answer: [0]
    explain: |
      问题根源是 LLM 不了解内部系统，假设答案方向偏了。把 HyDE 降级为「低分补救」并与原问题结果融合，既保留它在部分问题上的收益，又避免整体被带偏。
      B 更随机不解决方向问题；C 再大的通用模型也不知道公司私有信息；D 恰恰放大了 HyDE 的风险。
  - id: d26-t18
    kp: d26-k1
    type: single
    question: 下列关于 Rerank 在 RAG 流水线中位置的描述，正确的是？
    options:
      - "Rerank 放在 Embedding 入库阶段，离线为每个片段打好分"
      - "Rerank 放在生成之后，用来检查回答是否正确"
      - "Rerank 放在召回与融合之后、组装 Prompt 之前，对几十个候选精排"
      - "Rerank 放在 Query Rewrite 之前，先判断问题是否需要改写"
    answer: [2]
    explain: |
      Rerank 的输入是「问题 + 候选片段」，只能在召回（含 RRF 融合）之后进行；输出的前几名再按 Token 预算进入 Prompt。
      A 错：分数依赖具体问题，无法离线计算；B 混淆了 Rerank 和生成评测（Faithfulness 见 Day 29）；D 错：Rerank 需要候选片段，改写发生在检索之前。
exam:
  - id: d26-e1
    kp: d26-k1
    type: single
    question: 评测数据显示：Recall@50 为 0.93，但送进模型的前 5 条只覆盖了 0.62 的正确片段，回答正确率偏低。下一步最该做的是？
    options:
      - "引入或调优 Rerank，提升前几名的排序质量"
      - "更换 Embedding 模型，重新向量化全库"
      - "把切片从 500 字调到 1500 字，减少片段数"
      - "把送入模型的条数从 5 条增加到 30 条"
    answer: [0]
    explain: |
      Recall@50 高说明答案已经在候选里，问题出在排序：正确片段没排进前 5。这正是 Rerank 的用武之地。
      B 和 C 针对的是召回问题，这里召回已经够好；D 能提高覆盖但成本和噪声大增，且长上下文中间的信息容易被忽略（Day 13）。
  - id: d26-e2
    kp: d26-k3
    type: single
    question: 指代消解上线后，日志显示用户从「年假」话题切换到「报销发票抬头怎么写」时，改写结果变成了「年假期间的报销发票抬头怎么写」。最合适的改进是？
    options:
      - "关闭指代消解，所有问题都用原句检索"
      - "把改写历史从 3 轮增加到 10 轮，让模型更了解上下文"
      - "改写前先用关键词判断是否换话题，换话题就清空全部会话"
      - "在改写 Prompt 中加入「与历史无关时原样输出」，并采用原问题与改写问题双路检索"
    answer: [3]
    explain: |
      根因是改写 Prompt 没处理话题切换。加入原样输出规则直接解决，双路检索则在改写仍出错时兜底。
      A 因噎废食，追问场景会大面积失败；B 历史更长反而更容易把旧话题带进来；C 用关键词判断话题切换很脆弱，清空会话也会破坏正常追问。
  - id: d26-e3
    kp: d26-k4
    type: single
    question: 以下哪个场景最适合尝试 HyDE？
    options:
      - "查询内容主要是合同编号、物料编码等精确字符串"
      - "新上线的通用技术百科，问题很短且没有任何历史问答数据"
      - "全部是企业内部自研系统的操作手册，术语外部从未公开"
      - "客服场景要求 P95 端到端延迟低于 800ms"
    answer: [1]
    explain: |
      HyDE 的优势在于零训练成本地缩小「短问句」与「陈述句文档」的表达差距，适合通用领域的冷启动。
      A 是精确匹配，BM25 更合适；C 中 LLM 不了解内部术语，假设答案会编造并带偏检索；D 的延迟预算容不下额外一次生成。
  - id: d26-e4
    kp: d26-k2
    type: single
    question: 某系统对每个问题生成 4 个改写查询，加上原问题共 5 路检索。下列哪种合并与打分方式最合理？
    options:
      - "5 路结果按向量相似度绝对值合并，直接取分数最高的 5 条进 Prompt"
      - "5 路结果用 RRF 合并去重，再用原问题对合并结果做 Rerank"
      - "只保留第一个改写查询的结果，其余作为备用"
      - "5 路结果全部拼进 Prompt，让模型自己判断哪些有用"
    answer: [1]
    explain: |
      不同查询的相似度分数不在同一尺度上，RRF 只看名次，适合合并多路结果；最终相关性要由完整的原问题来判断，所以用原问题 Rerank。
      A 跨查询比较绝对分数不可靠；C 浪费了多查询扩大召回的价值；D 成本高、噪声大，长上下文中间的内容还容易被忽略。
  - id: d26-e5
    kp: d26-k1
    type: multi
    question: 一家银行要为内部制度问答选 Rerank 方案，数据不能出公网。下列哪些考虑是合理的？
    options:
      - "只能考虑自部署的开源模型或厂商的私有化部署，而不是公网 API"
      - "用自有中文评测集比较候选模型的前 5 条命中率和延迟"
      - "注意部分开源 Reranker 权重是非商用许可，商用前要确认授权"
      - "直接选参数量最大的模型，效果一定最好且不用评测"
      - "Rerank 能补上召回遗漏，选好 Rerank 后可以去掉混合检索"
    answer: [0, 1, 2]
    explain: |
      A 是合规约束；B 是选型的核心方法；C 是真实的坑，例如 jina-reranker-v3.5 等权重为 CC-BY-NC，商用需要授权。
      D 错：大模型延迟高、效果也要实测；E 错：Rerank 只能重排候选，不能补召回，混合检索仍然必要。
  - id: d26-e6
    kp: d26-k3
    type: multi
    question: 为了能排查「改写把用户意思改错」的问题，检索日志里至少应记录哪些信息？
    options:
      - "原问题与改写后的独立问题"
      - "是否跳过改写、是否因超时回退"
      - "进入 Rerank 的候选及其分数"
      - "用户的明文登录密码，方便复现身份"
      - "改写模型名与 Prompt 版本"
    answer: [0, 1, 2, 4]
    explain: |
      A 直接看出改写是否改错；B 区分「没改」「改了」「改失败」；C 判断问题出在召回还是排序；E 让问题能对应到具体模型和 Prompt 版本，便于回归。
      D 绝不能记录，日志要脱敏，复现身份应使用用户 ID 和权限范围。
  - id: d26-e7
    kp: d26-k1
    type: judge
    question: Cohere Rerank 返回的 relevance_score 为 0.9 的文档，可以理解为比 0.45 的文档「相关程度高一倍」。
    answer: false
    explain: |
      Cohere 官方 API 文档明确说明：分数归一化到 0~1，但不能认为 0.9 比 0.45「相关两倍」。分数适合用来排序和设阈值（阈值需用评测集标定），不适合做比例运算。
  - id: d26-e8
    kp: d26-k2
    type: judge
    question: 业务缩写词典规范化不依赖 LLM，延迟几乎为零且结果确定，因此适合作为 LLM 改写之前的第一道处理。
    answer: true
    explain: |
      词典展开是确定性的字符串替换或扩展，不会改错意图、不增加调用成本。先用它兜住缩写和固定同义词，再只对口语化严重的问题启用 LLM 改写，是兼顾效果与成本的常见做法。
  - id: d26-e9
    kp: d26-k1
    type: case
    question: |
      某公司的知识库问答服务基于 FastAPI（async 路由），单进程 4 个 worker。最近在 Rerank 环节接入了本地 bge-reranker-v2-m3，代码在 async 函数里直接调用 `reranker.compute_score(pairs)`。
      上线后离线评测前 5 条命中率提升明显，但压测发现：并发 20 时，连 `/health` 健康检查接口的 P99 都从 20ms 涨到 2 秒以上，网关频繁判定实例不健康并摘除。
      导致这个现象的根因和最合理的修复是？
    options:
      - "Rerank 模型精度太高导致计算慢，应换回只用向量检索"
      - "同步的 compute_score 阻塞了事件循环，应放到线程或独立推理服务并设超时降级"
      - "健康检查接口没有加缓存，应给 /health 加 Redis 缓存"
      - "worker 数太少，把 worker 增加到 32 个就能解决"
    answer: [1]
    explain: |
      async 路由跑在事件循环上，compute_score 是同步计算密集调用，执行期间事件循环无法调度其他协程，同进程所有请求（包括 /health）都被卡住。
      正确做法是 `asyncio.to_thread` 或拆成独立 Rerank 服务，并设超时降级到 RRF 顺序。A 放弃了已验证的效果收益；C 与根因无关；D 每个 worker 各加载一份模型，显存和 CPU 争抢更严重，治标不治本。
interview:
  - id: d26-i1
    kp: d26-k3
    type: scenario
    difficulty: 2
    question: 你负责的知识库问答上线后，用户反馈「第一个问题答得挺好，接着追问就答非所问或者说找不到」。你会怎么定位和修复？
    key_points:
      - {text: "先看检索日志确认追问是否直接用原句检索，用数据定位而不是猜", dim: engineering}
      - {text: "解释追问省略话题导致检索语义残缺，召回和 Rerank 都会失败", dim: principle}
      - {text: "提出检索前做指代消解，结合最近几轮历史改写成独立问题，只改写不回答", dim: concept}
      - {text: "给出兜底：首轮跳过、超时回退、话题切换原样输出、原问题与改写双路检索", dim: engineering}
      - {text: "用多轮追问评测样本对比改写前后的 Recall@K，并抽查改写日志", dim: project}
    reference: |
      **定位**：先按请求 ID 拉检索日志，看追问轮用的查询是什么、召回了哪些片段、Rerank 最高分多少。典型现象是追问直接用「那外包呢」去检索，召回一堆无关片段，最高分低于阈值，于是拒答或答偏。
      **原因**：追问省略了话题，单独检索语义残缺；Rerank 用残缺问题打分也判断不了相关性。
      **修复**：在检索前加**指代消解**——把最近 2~3 轮对话和当前问题交给小模型，要求「改写成可独立检索的完整问题、只输出问题、与历史无关时原样输出」，temperature=0。检索和 Rerank 都用独立问题，生成时同时给原问题和独立问题。
      **兜底**：首轮或问题完整时跳过；1~2 秒超时回退原问题；原问题与独立问题双路检索后 RRF；历史只从服务端读取；日志记录原问题、改写结果、是否回退。
      **验证**：评测集加入 15~20 条多轮追问样本（含话题切换），对比开启前后的 Recall@10 和回答正确率，同时抽查改写日志。
    oral: |
      我会先看日志再动手。这类问题十有八九是追问直接拿「那外包呢」去检索了，查询里只剩「外包」两个字，召回和 Rerank 都没法判断相关性。
      修复是在检索前加一步指代消解：把最近两三轮对话和当前问题交给一个小模型，让它只输出一个能独立检索的完整问题，比如「外包员工的年假天数规定」，检索和 Rerank 都用它。
      同时做兜底：第一轮跳过、超时就用原问题、换话题就原样输出，再把原问题和改写问题双路检索合并，防止改错。在我的知识库项目里，我专门放了一批多轮追问样本做对比，追问类的召回提升是【填你的评测数字】，这样上线前就能证明有效。
  - id: d26-i2
    kp: d26-k1
    type: scenario
    difficulty: 3
    question: 引入 Rerank 后效果明显提升，但 P95 延迟从 1.2 秒涨到 2.5 秒，超过了 2 秒的 SLA。老板要求「效果不能掉，延迟要回到 SLA 内」。你怎么做？
    key_points:
      - {text: "先拆解延迟，确认 Rerank 环节占多少，以及是否阻塞了事件循环", dim: engineering}
      - {text: "说明计算量约等于候选数乘每对 Token 数，从候选数和片段长度入手", dim: principle}
      - {text: "给出手段：批量推理与 fp16、独立推理服务、超时降级、换 fast 档或小模型", dim: engineering}
      - {text: "用评测集做候选数与模型的对比实验，在效果不降的前提下选平衡点", dim: project}
      - {text: "提到流式输出降低首字延迟感知，并监控降级率", dim: engineering}
    reference: |
      **1. 先量化**：用 Trace（Day 43）把延迟拆到改写、召回、Rerank、生成各段，确认 Rerank 实际占多少；检查是不是在 async 路由里同步调用模型导致排队——这种情况增加的延迟远超模型本身耗时。
      **2. 降计算量**：cross-encoder 计算量约等于「候选数 × 每对 Token 数」。把候选从 100 降到 30~50；片段截断到合理长度；一次请求全部候选批量推理、开 fp16。
      **3. 改部署**：Rerank 拆成独立推理服务（GPU 集中、统一批处理、可单独扩容），业务侧异步调用、400ms 超时，超时回退 RRF 顺序并记录降级。
      **4. 换模型档位**：在评测集上比较大小模型（如 bge-reranker-v2-m3、Qwen3-Reranker-0.6B，或托管的 fast 档），选「前 5 条命中率不降、延迟最低」的组合。
      **5. 体验层**：生成阶段流式输出，首字延迟才是用户感知的关键。
      **6. 验证**：每次改动都回归评测集，同时看 P95 和降级率；降级率过高说明超时太紧或服务容量不够。
    oral: |
      我的思路是先量化再优化。先用 Trace 把延迟拆开，看 Rerank 到底占多少，顺便检查有没有在 async 接口里同步调模型，这种排队带来的延迟往往比模型本身还大。
      然后降计算量：Rerank 的成本基本是候选数乘片段长度，我会把候选从 100 降到 40 左右、截断长片段、批量推理开 fp16。部署上拆成独立推理服务，业务侧设 400 毫秒超时，超时就退回融合顺序。
      每一步我都会在评测集上回归，保证前 5 条命中率不掉，再看 P95 和降级率。在我的项目里，【填你的候选数和延迟对比数据】，最后在效果持平的前提下回到了 SLA 以内。
  - id: d26-i3
    kp: d26-k2
    type: design
    difficulty: 4
    question: 请设计一条完整的「检索优化流水线」，从用户问题到送进 Prompt 的片段：每一步解决什么问题、带来什么代价，以及你如何用数据决定每一步保留还是去掉？
    key_points:
      - {text: "给出顺序：指代消解与规范化、权限过滤、混合召回、RRF、Rerank、阈值判断、按预算截断", dim: concept}
      - {text: "说明每一步解决的问题与代价，例如改写多一次调用、Rerank 增加百毫秒级延迟", dim: principle}
      - {text: "设计降级：改写和 Rerank 超时都有回退路径，HyDE 只作为低分补救", dim: engineering}
      - {text: "用分层评测集做消融实验，结合 Recall@K、MRR、端到端正确率与 P95 延迟决定取舍", dim: project}
    reference: |
      **流水线**：
      1. **规范化 + 指代消解**：词典展开缩写（零成本）；多轮时小模型改写成独立问题（+几百毫秒，超时回退）。解决口语、缩写、追问。
      2. **权限与版本过滤**：服务端身份生成 WHERE（Day 24、Day 30），几乎无额外延迟，解决越权和旧版本。
      3. **混合召回**：向量 + BM25 各取 40 条并发执行（Day 25），解决编号类与语义类问题的召回。
      4. **RRF 融合**：几乎无成本。
      5. **Rerank**：cross-encoder 精排 50 条，+几十到几百毫秒或 API 费用，解决排序粗糙；超时回退 RRF 顺序。
      6. **阈值判断**：最高 Rerank 分低于阈值时可触发一次 HyDE 补救检索，仍不足则拒答（Day 27）。
      7. **按 Token 预算截断**：取 3~8 条进 Prompt（Day 27）。
      **用数据取舍**：建立分层评测集（事实、编号、多轮追问、复合问题、无答案），做**消融实验**——逐个关掉某一步，看 Recall@50、Recall@5、MRR、端到端正确率的变化，同时记录 P95 和成本。收益小于代价的步骤关闭，或只对特定类型启用（如只对多轮启用指代消解、只对低分问题启用 HyDE）。上线后用线上日志持续观察降级率和拒答率。
    oral: |
      我会按这个顺序搭：先做词典规范化，多轮时再做指代消解；然后用服务端身份生成权限和版本过滤；接着向量和 BM25 并发各取 40 条，RRF 融合；再用 Rerank 精排，最高分太低就先用 HyDE 补救一次，还不行就拒答；最后按 Token 预算取 3 到 8 条进 Prompt。
      每一步都有代价，改写多一次模型调用，Rerank 多一百毫秒左右，所以改写和 Rerank 都设了超时回退。
      至于留不留，我用分层评测集做消融：每次关掉一步，看召回、MRR 和最终正确率怎么变，再结合 P95 延迟决定。比如我的项目里指代消解只对多轮开启，HyDE 只在低分时触发，具体收益是【填你的消融实验结果】。
