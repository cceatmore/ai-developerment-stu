      - "多个查询应并发执行，否则延迟随查询数线性增长"
      - "多路结果可用 RRF 合并去重"
      - "最终 Rerank 应该用某一个改写查询打分，因为它更规范"
      - "多查询能缩小问句与陈述句的表达差距，和 HyDE 原理相同"
