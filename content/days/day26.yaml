knowledge_points:
  - id: d26-k1
    name: Cross-encoder 重排：两阶段检索
    level: P0
    summary: 先用便宜的向量或 BM25 召回几十条，再用 cross-encoder 把问题和每个片段放一起精读打分，只把最相关的几条交给模型
    analogy: |
      **像列表页和详情页**：bi-encoder 相当于列表页提前生成好的缩略图——每个片段的向量离线算好，可缓存、可建索引，查询时只比较缩略图；
      cross-encoder 相当于把问题和每个候选「一起打开详情页逐条对比」，判断更准，但每次都要实时算，所以只能对少量候选做。

      **不一样的地方**：前端详情页打开一次可以缓存，cross-encoder 的分数依赖「这一次的问题」，**换个问题就要重新算**，没法预计算。
    why: |
      Day 25 的混合检索解决了「召回」——答案大概率在前 50 条里；但真正送进模型的只有前 3~8 条，**排序质量决定答案能不能进入 Prompt**。
      Rerank 是提升排序质量性价比最高的手段之一，也是面试官区分「跑通 Demo」和「做过调优」的高频问题。
    problem: |
      - 向量检索里问题和片段**各自独立编码**，模型从没同时看过二者，只能判断「话题接近」，判断不了「这段到底有没有回答问题」。
      - 常见现象：真正回答问题的片段排在第 12 名，前 5 名是「话题相关但没有答案」的片段。
      - RRF 融合只看名次（Day 25），也不知道片段是否真的回答了问题。
    principle: |
      **一、bi-encoder 与 cross-encoder**

      | | bi-encoder（Embedding 模型） | cross-encoder（Rerank 模型） |
      |---|---|---|
      | 输入 | 问题、片段**分别**编码 | 问题和片段**拼在一起**输入 |
      | 输出 | 两个向量，再算余弦相似度 | 直接输出一个相关度分数 |
      | 能否预计算 | 片段向量可离线算好建索引 | **不能**，每次查询对每个候选重算 |
      | 适用规模 | 百万级全库检索 | 几十到几百个候选 |
      | 精度 | 粗 | 细：注意力能在问题词和片段词之间交互 |

      **二、两阶段检索流水线**

      ```mermaid
      flowchart LR
        Q["用户问题"] --> R1["召回 向量加 BM25 取 50 条"]
        R1 --> RR["Rerank 逐条打分"]
        RR --> T{"最高分低于阈值"}
        T -->|是| N["无答案分支 见 Day 27"]
        T -->|否| K["按 Token 预算取前 3 到 8 条"]
        K --> P["组装 Prompt"]
      ```

      - 第一阶段追求**召回率**（Recall@50 高，Day 29 讲指标），第二阶段追求**前几名的精确度**。
      - **Rerank 只能重排已经召回的候选，不能找回没召回的片段。** 召回漏了，Rerank 无能为力。
      - Rerank 分数比向量相似度更适合做「无答案」阈值，但**不同模型分数含义不同**：bge 原始输出是无界 logit（`normalize=True` 才做 sigmoid 到 0~1）；Cohere 返回 0~1 的校准分；Qwen3-Reranker 默认也是 logit。**阈值必须按模型重新标定。**

      **三、pointwise 与 listwise（了解）**

      - 传统 cross-encoder 是 **pointwise**：每个（问题，片段）对单独打分，互不影响。
      - 新一代如 jina-reranker-v3 / v3.5 是 **listwise**：把问题和全部候选放进同一个上下文一次打分，模型能「比较候选之间谁更好」。效果通常更好，但输入更长、受上下文长度限制。

      **四、成本与延迟**

      - 计算量 ≈ **候选数 × 每对 Token 数**。50 条在 GPU 上批量推理通常是几十到一两百毫秒，CPU 上可能到秒级——**以实测为准**。
      - 控制手段：候选数控制在 30~100；截断过长片段；批量推理 + fp16；拆成独立推理服务；设超时，超时就用 RRF 顺序降级。
      - **async 服务里不要同步调用本地模型**：`compute_score` 是同步、计算密集的，直接在 async 路由里调用会阻塞事件循环（Day 06），整个进程的请求一起变慢。用 `asyncio.to_thread` 或独立服务。
      - 托管 API（Cohere、Jina）按调用计费、有网络延迟，**数据要出域**，私有化项目要过合规评估。

      **五、常见选择（2026-11 核对）**

      | 类型 | 代表 | 要点 |
      |---|---|---|
      | 开源自部署 | BAAI `bge-reranker-v2-m3`（约 0.6B，多语言） | FlagEmbedding 的 `FlagReranker.compute_score` |
      | 开源自部署 | Qwen3-Reranker 0.6B / 4B / 8B（32K 上下文） | sentence-transformers 的 `CrossEncoder.predict` |
      | 托管 API | Cohere `rerank-v5.0-pro` / `rerank-v5.0-fast` | `POST /v2/rerank`，0~1 校准分 |
      | 托管 API | Jina `jina-reranker-v3.5`（listwise） | 模型权重是 CC-BY-NC，商用需授权 |

      选型看三件事：**中文效果用自己的评测集测**、延迟预算、数据能否出域。
    scenarios: |
      - **制度问答（p1）**：混合检索召回 50 条，bge-reranker-v2-m3 精排后取 5 条；最高分低于标定阈值时拒答。
      - **客服知识库**：QPS 高、延迟敏感，候选降到 20，用小模型或 fast 档 API，Rerank 超时 300ms 自动降级。
      - **金融/政务私有化**：数据不能出域，只能自部署开源 Rerank 模型。
      - **Agent 检索工具**：工具返回前先 Rerank，减少塞进上下文的 Token（Day 28）。
    code: |
      ```python
      import asyncio

      import cohere
      from FlagEmbedding import FlagReranker

      # 开源自部署（pip install -U FlagEmbedding）
      reranker = FlagReranker("BAAI/bge-reranker-v2-m3", use_fp16=True)

      async def rerank_local(query: str, texts: list[str]) -> list[float]:
          pairs = [[query, t] for t in texts]
          # 同步计算密集调用放到线程里，避免阻塞事件循环
          return await asyncio.to_thread(reranker.compute_score, pairs, normalize=True)

      # 托管 API（pip install cohere，读取环境变量 CO_API_KEY）
      co = cohere.ClientV2()
      resp = co.rerank(model="rerank-v5.0-fast", query="年假可以跨年吗", documents=["...", "..."], top_n=5)
      for r in resp.results:
          print(r.index, r.relevance_score)  # index 是传入 documents 列表的下标，不是 chunk_id
      ```
    pitfalls: |
      - **误区：Rerank 能提升召回率。** 它只重排候选，候选里没有的答案找不回来；召回问题要在第一阶段解决（混合检索、改写、切片）。
      - **候选数越多越好**：200 条全部 Rerank，延迟和成本线性上升，收益却很小。
      - **阈值跨模型复用**：bge 的 logit、sigmoid 后的分数、Cohere 的校准分含义都不同；Cohere 文档也明确说 0.9 不代表比 0.45「相关两倍」。
      - **在 async 服务里同步调用本地模型**，阻塞事件循环。
      - **把 API 返回的 index 当成 chunk_id**：index 是传入 documents 的下标，要映射回原候选。
      - **Rerank 用了原始追问**：多轮场景应该用改写后的完整问题打分（见 d26-k3）。
    interview_asks:
      - question: "有了向量检索为什么还需要 Rerank？bi-encoder 和 cross-encoder 有什么区别？"
        answer: "双编码器是问题和文档分开变成向量，便宜，适合全库。交叉编码器把问题和文档放在一起打分，更准，也更贵。所以先双编码器召回几十条，再用交叉编码器重排。"
      - question: "为什么不直接用 cross-encoder 对全库打分？"
        answer: "每条都要和问题一起过一遍模型，全库几十万条，延迟和成本都不可接受。它只适合最后几十条候选。"
      - question: "Rerank 会增加多少延迟？你们怎么控制、怎么降级？"
        answer: "通常比一次向量查询慢，因为要过模型。控制候选数量，比如只重排前 30。重排服务超时就退回向量顺序，并在日志里记下降级了，不要让整次问答失败。"
    project_example: |
      在 **p1 企业知识库问答** 的「重排 + 改写」模块里：混合检索（Day 25）先召回 50 条，送进 bge-reranker-v2-m3 精排，取前 5 条进 Prompt。
      Rerank 封装成 `rerank(query, candidates) -> list[Candidate]`，内部用 `asyncio.to_thread` 调模型，外层 `asyncio.wait_for` 设 400ms 超时，超时就退回 RRF 顺序并在日志里打 `rerank_fallback=true`。
      用评测集对比「有/无 Rerank」的前 5 条命中率和 P95 延迟（Day 29），用数字决定是否保留——简历里写的提升幅度用你自己的评测结果填。
    freshness: |
      核对于 2026-11：
      - Cohere 文档列出的最新 Rerank 为 `rerank-v5.0-pro`（约 2B）与 `rerank-v5.0-fast`（约 500M），32K 上下文，输出 0~1 校准分，新增 Context Focus（`relevant_spans`，返回文档内最相关片段的字符偏移）；此前有 v4.0-pro/fast（32K）和 v3.5（4K）。端点 `POST /v2/rerank`，参数 model、query、documents、top_n、max_tokens_per_doc（默认 4096），单次建议不超过 1000 个文档；结果 `results[].index` 指向原 documents 下标。Python SDK 为 `cohere.ClientV2().rerank(...)`，异步为 `AsyncClientV2`。
      - Jina 当前旗舰 `jina-reranker-v3.5`：0.6B、listwise、131K 上下文，与 v3 请求格式相同；v3.5/v3/m0/v2 权重为 CC-BY-NC 4.0，商用需授权（2026-08 起由 Elastic 销售）。API 为 `https://api.jina.ai/v1/rerank`。
      - `bge-reranker-v2-m3`（模型卡标注约 0.6B）：`FlagReranker(...).compute_score(pairs, normalize=True)`，原始分数为 logit。
      - Qwen3-Reranker 0.6B/4B/8B，32K 上下文，可用 sentence-transformers `CrossEncoder(...).predict(pairs)`，默认输出 logit，传 `activation_fn=torch.nn.Sigmoid()` 得 0~1。
      模型迭代很快，选型前以官方页面和自有评测集为准。
    sources:
      - {title: "Cohere Docs - Rerank models", url: "https://docs.cohere.com/docs/rerank"}
      - {title: "Cohere API Reference - Rerank v2", url: "https://docs.cohere.com/reference/rerank"}
      - {title: "BAAI/bge-reranker-v2-m3 模型卡", url: "https://huggingface.co/BAAI/bge-reranker-v2-m3"}
      - {title: "Qwen/Qwen3-Reranker-0.6B 模型卡", url: "https://huggingface.co/Qwen/Qwen3-Reranker-0.6B/blob/main/README.md"}
      - {title: "Jina Reranker 产品页（v3.5 与许可说明）", url: "https://jina.ai/reranker/"}
  - id: d26-k2
    name: Query Rewrite：规范化、多查询与问题分解
    level: P1
    summary: 用户怎么问 ≠ 文档怎么写；检索前先把问题改成「适合检索的样子」，再按需拆分或扩展成多个查询
    analogy: |
      **像 axios 请求拦截器**：请求发出前统一改写参数——补全 token、规范化字段名、拆成多个并发请求再合并结果。
      Query Rewrite 就是检索请求的「拦截器」：把口语、缩写、复合问题改写成检索友好的形式。

      **不一样的地方**：拦截器的改写是确定性代码，LLM 改写是**概率性**的，可能改错意思；所以必须记日志、设超时回退，最好原问题也一起检索。
    why: |
      检索的输入就是用户的问题，而用户的问题常常**短、口语化、带缩写、一句话问两件事**。
      直接拿去检索，召回质量会明显下降；而召回漏掉的东西后面 Rerank 也救不回来（d26-k1）。改写是在检索之前提升召回的主要手段。
    problem: |
      - **用词不一致**：用户说「请假」，文档写「休假管理办法」；用户说「OA」，文档写「协同办公平台」。
      - **复合问题**：「试用期能请年假吗，工资怎么算」包含两个检索意图，单次检索很难同时召回。
      - **单一表述召回不全**：同一个意思有多种说法，一个查询只覆盖其中一种。
    principle: |
      **一、四种常用改写**

      | 方法 | 做法 | 解决什么 | 代价与风险 |
      |---|---|---|---|
      | 规范化与扩展 | 业务词典展开缩写、补同义词（可不用 LLM） | 用词不一致 | 词典要维护 |
      | LLM 改写 | 让小模型把口语问题改成书面检索句 | 口语、错别字 | 一次 LLM 调用；可能改错意图 |
      | 多查询（Multi-Query） | LLM 生成 3~5 个不同角度的查询，分别检索后 RRF 合并 | 单一表述召回不全 | 检索次数翻倍、延迟上升 |
      | 问题分解 | 复合问题拆成子问题分别检索 | 一句话多意图 | 子问题质量依赖模型 |

      **二、多查询的标准做法**

      ```mermaid
      flowchart LR
        Q["原问题"] --> G["LLM 生成 3 个改写查询"]
        Q --> S0["检索 原问题"]
        G --> S1["检索 查询1"]
        G --> S2["检索 查询2"]
        G --> S3["检索 查询3"]
        S0 --> F["RRF 合并去重"]
        S1 --> F
        S2 --> F
        S3 --> F
        F --> RR["Rerank 用原问题打分"]
      ```

      要点：
      - **原问题也参与检索**，改写只是补充，降低改错的影响。
      - 多个查询**并发**执行（`asyncio.gather`），否则延迟随查询数线性增长。
      - 合并用 RRF（Day 25），最后 **Rerank 用原问题（或指代消解后的完整问题）打分**——改写查询只负责「多捞」，相关性由完整问题来判断。

      **三、问题分解 vs 多查询**

      - 多查询：**同一个意图**换多种说法，扩大召回面。
      - 问题分解：**多个意图**拆开，每个子问题各自检索，生成时把各子问题的资料合并（多跳依赖的情况见 Day 28）。

      **四、什么时候不改写**

      改写不是免费的：多一次 LLM 调用（几百毫秒到一两秒）。常见策略：
      - 问题已经完整、规范时跳过；
      - 先用**词典规范化**（零成本）兜住缩写，LLM 改写只用于口语化严重的问题；
      - 用小模型、`temperature=0`、短超时，超时回退原问题；
      - 高频问题缓存改写结果。

      **五、用数据决定留不留**：改写的收益因知识库而异，必须用评测集对比「改写前后」的 Recall@K（Day 29），并抽查改写日志。
    scenarios: |
      - **IT 服务台**：词典把「VPN 连不上」扩展为「VPN 连接失败 远程访问」，不调用 LLM。
      - **员工自助问答（p1）**：「试用期能请年假吗，工资怎么算」拆成两个子问题分别检索，资料合并后一起回答。
      - **长尾口语问题**：多查询生成 3 个改写，召回面更广，再统一 Rerank。
    pitfalls: |
      - **误区：改写一定有益。** 改写可能把意图改错（「外包」改成「外部合作」），必须记日志、用评测集验证，原问题最好一起检索。
      - **让模型「顺便回答」**：改写结果变成了答案，检索被带偏；Prompt 要强调只输出查询。
      - **多查询串行执行**：延迟成倍增加。
      - **改写失败没有降级**：LLM 超时导致整个问答失败，应回退原问题。
      - **用改写后的子查询去做 Rerank**：子查询只覆盖一个角度，打分会偏，应使用完整问题。
    interview_asks:
      - question: "你了解哪些 Query Rewrite 方法？分别解决什么问题？"
        answer: "规范化用来补全缩写和错别字。多查询是换几种问法各检一次，提高召回。问题分解是把一句话里的两个问题拆开。都要多一次模型调用，用评测决定开不开。"
      - question: "多查询检索的结果怎么合并？会带来什么代价？"
        answer: "每条问法各召回一批，再用 RRF 按文档合并。代价是检索次数和 Token 都翻倍，延迟变高。合并后还要去重。不是默认就开。"
    project_example: |
      p1 的检索入口 `retrieve(question, history, user)` 里先做两步轻量改写：
      ① 用 YAML 维护的业务词典做缩写展开（OA→协同办公平台），零成本；
      ② 只有当问题含「和、以及、还有」等连接词且长度超过阈值时，才调用小模型做问题分解，最多拆 3 个子问题，并发检索后 RRF 合并。
      每次改写把 `original / rewritten / sub_queries` 写进检索日志，评测时按问题类型对比开关前后的 Recall@10。
  - id: d26-k3
    name: 多轮指代消解：把追问补全成独立问题
    level: P0
    summary: 多轮对话里「那外包呢」「第二条呢」不能直接检索，要结合最近几轮历史改写成一个能独立检索的完整问题
    analogy: |
      **像 Vue Router 里的相对路径**：`router.push('./detail')` 必须结合当前路由才能解析成绝对路径；
      「那外包同事呢」就是相对路径，必须结合对话历史（当前路由）解析成「外包员工的年假天数规定」（绝对路径）再去请求。

      **不一样的地方**：路由解析是确定性的，LLM 改写是概率性的；用户突然换话题时，模型可能还带着旧话题「乱补」，所以要有回退和日志。
    why: |
      企业问答里**追问非常常见**（「那试用期呢」「第二条具体怎么做」），而追问往往省略主语和话题。
      直接拿追问去检索，向量里只有「外包」一个有效信息，召回会断崖式下降，表现为「第一轮答得好，第二轮就说找不到」——这是多轮 RAG 最常见的线上投诉之一。
    problem: |
      - **代词与省略**：「它」「这个」「那」「第二条」单独检索毫无意义。
      - **话题延续**：第二轮只说了变化的部分（外包），没说不变的部分（年假）。
      - **话题切换**：用户换了新话题时，改写不能硬把旧话题带进来。
    principle: |
      **一、在流水线中的位置**

      指代消解发生在**检索之前**，产出一个「独立问题（standalone question）」，后续的混合检索、Rerank 都用它。

      ```mermaid
      sequenceDiagram
        participant U as 用户
        participant S as 问答服务
        participant L as 改写小模型
        participant R as 检索与 Rerank
        U->>S: 第一轮 正式员工年假几天
        S-->>U: 回答 附引用
        U->>S: 第二轮 那外包同事呢
        S->>L: 最近 3 轮历史 加 当前问题
        L-->>S: 外包员工的年假天数规定
        S->>R: 用独立问题检索并打分
        R-->>S: 候选片段
        S-->>U: 回答 附引用
      ```

      **二、改写 Prompt 的关键约束**

      1. **只改写、不回答**：「把用户最后一个问题改写成可以独立检索的完整问题，只输出问题本身」。
      2. **话题切换就原样输出**：「如果最后一个问题与历史无关，原样返回」。
      3. **只带最近几轮**（如 3 轮）：控制 Token，避免早期话题干扰。
      4. `temperature=0`，输出稳定、可复现。

      **三、工程兜底**

      | 措施 | 原因 |
      |---|---|
      | 首轮或问题已完整时跳过 | 省一次 LLM 调用 |
      | 设 1~2 秒超时，失败回退原问题 | 改写挂了不能拖垮整个问答 |
      | 原问题 + 改写问题双路检索后 RRF | 降低改写出错的影响 |
      | 日志记录原问题与改写结果 | 排查「改写把意思改错了」 |
      | 历史由服务端保存，不信任前端传来的历史 | 防止伪造历史注入指令（Day 45） |

      **四、改写结果给谁用**

      - **检索和 Rerank**：用改写后的独立问题（原追问缺少话题，cross-encoder 也判断不了相关性）。
      - **生成**：Prompt 里同时给出原问题和独立问题，让回答贴合用户原话。

      **五、和 Day 20 上下文工程的关系**：指代消解是「为检索这一步」专门组装上下文；生成那一步的历史管理（摘要、裁剪）见 Day 20 和 Day 35。
    scenarios: |
      - **HR 助手（p1）**：「正式员工年假几天」→「那外包呢」改写为「外包员工的年假天数规定」。
      - **制度条款追问**：上一轮回答列了 5 条流程，用户问「第二条具体怎么做」，改写时要能看到上一轮回答里的条目。
      - **话题切换**：上一轮问年假，这一轮问「报销发票抬头怎么写」，改写应原样返回。
    code: |
      ```python
      import os

      from openai import AsyncOpenAI

      client = AsyncOpenAI()  # 读取环境变量 OPENAI_API_KEY
      REWRITE_PROMPT = (
          "根据对话历史，把用户最后一个问题改写成可以独立检索的完整问题，补全代词和省略的话题。"
          "如果最后一个问题与历史无关，原样输出。只输出问题本身，不要回答。"
      )

      async def to_standalone(history: list[dict], question: str) -> str:
          if not history:
              return question
          try:
              resp = await client.chat.completions.create(
                  model=os.environ["REWRITE_MODEL"],
                  messages=[{"role": "system", "content": REWRITE_PROMPT},
                            *history[-6:],                      # 最近 3 轮（每轮 user+assistant）
                            {"role": "user", "content": question}],
                  temperature=0,
                  timeout=1.5,
              )
              return (resp.choices[0].message.content or "").strip() or question
          except Exception:
              return question                                   # 超时或失败回退原问题
      ```
    pitfalls: |
      - **直接用追问检索**：最常见的多轮 bug。
      - **把全部历史都带上**：早期话题干扰改写，Token 成本上升。
      - **改写 Prompt 没写「不要回答」**：模型直接给出答案，拿答案去检索会被带偏。
      - **话题切换时硬补旧话题**：「报销发票抬头」被改成「年假相关的报销发票抬头」。
      - **Rerank 用原追问打分**：原追问缺话题，cross-encoder 判断不准。
      - **信任前端传来的 history**：攻击者可以伪造一段「助手说过的话」来注入指令。
    interview_asks:
      - question: "多轮对话中用户说「那第二条呢？」，你的 RAG 怎么检索？"
        answer: "不能拿「那第二条呢」直接去检。先用最近几轮把问题补成独立的一句，比如「年假的第二条是什么」，再用这句检索。原始短句留在对话里，检索用补全后的。"
      - question: "改写把用户意思改错了怎么办？"
        answer: "改写结果要留在日志里，能和原话对照。评测里单看改写对不对。发现改写经常改错，就只在检测到指代时才改写，或者让用户确认。不要默默用改错的句子检完全程。"
      - question: "改写结果在检索、Rerank、生成三个环节分别怎么用？"
        answer: "检索和重排用补全后的独立问题，否则指代词匹配不上。生成时把原话和改写都可以给模型，但回答要针对用户真正问的那句。三处用的文本要在日志里分开记。"
    project_example: |
      p1 的会话表保存每轮 `question / standalone_question / answer`，历史只从服务端读取。
      `retrieve()` 第一行调用 `to_standalone()`，首轮直接跳过；之后「原问题 + 独立问题」两路并发检索、RRF 合并，Rerank 和日志都用独立问题。
      评测集里专门放 15~20 条多轮追问样本（Day 29），对比开启指代消解前后的 Recall@10，并抽查改写日志里「话题切换被硬补」的情况。
  - id: d26-k4
    name: HyDE：用假设答案去检索
    level: P1
    summary: 先让 LLM 写一段「假设答案」，用它的向量去检索真实文档；假设答案只用于找资料，不给用户看
    analogy: |
      **像拿草图找组件**：想在组件库里找一个「卡片 + 头像 + 标签」的组件，与其搜关键词，不如先画个大概的草图，再拿草图去比「长得最像」的现成组件。
      HyDE 的假设答案就是草图：它和真实文档都是陈述句，向量更接近。

      **不一样的地方**：草图里的细节可能是错的（比如把「顺延到次年 3 月」写成「顺延 6 个月」），它只能用来**找**，不能拿来**交付**。
    why: |
      问题和答案的**表达形式天然不同**：问题是疑问句、很短；文档是陈述句、带专业术语。
      在没有标注数据、冷启动的新领域里，HyDE 是一个零训练成本的召回提升尝试；面试中也常和 Query Rewrite 一起被问到，要能说清原理和风险。
    problem: |
      - 「年假可以跨年用吗？」和文档里的「当年未休年假可顺延至次年 3 月 31 日」字面差别大，向量距离不够近。
      - 问题太短（「报销时限？」），向量里信息量太少。
    principle: |
      **一、流程（Gao 等，2022）**

      ```mermaid
      flowchart LR
        Q["用户问题"] --> L["LLM 写一段假设答案"]
        L --> E["对假设答案做 Embedding"]
        E --> S["向量检索真实文档"]
        S --> RR["Rerank 用原问题打分"]
        RR --> G["基于真实文档生成回答"]
      ```

      - 论文的直觉：假设答案里的**具体事实可能是错的**，但它「长得像答案」，Embedding 会把它映射到真实答案附近；检索到的真实文档负责纠正细节。
      - 可以生成多个假设答案，向量取平均，降低单次生成的随机性。

      **二、什么时候有用、什么时候有害**

      | 有用 | 有害 |
      |---|---|
      | 问题很短、表达和文档差距大 | 企业**内部术语、内部编号**，LLM 根本不知道，假设答案会编出错误术语 |
      | 通用领域知识，LLM 大致知道答案长什么样 | 编号类、精确匹配类问题（BM25 更合适，Day 25） |
      | 冷启动、没有标注数据 | 延迟敏感：多一次**生成**（比改写更长） |

      **三、风险控制**

      - 假设答案**只用于检索**，绝不出现在给用户的回答里。
      - 最好与原问题检索结果一起 RRF，而不是只用 HyDE 一路。
      - Rerank 用原问题（或独立问题）打分，防止被假设答案带偏。
      - 用评测集确认收益：HyDE 在不同知识库上效果差异很大。

      **四、和多查询的区别**：多查询生成的是「问题的不同问法」，HyDE 生成的是「答案的样子」。前者扩大召回面，后者缩小问句和文档的表达差距。
    scenarios: |
      - **新上线的技术百科**：没有历史问答日志，HyDE 作为零样本召回提升的实验项。
      - **短问题较多的客服场景**：「发票抬头？」这类问题用 HyDE 补充语义。
      - **p1 中的谨慎用法**：只对「Rerank 最高分偏低」的问题触发 HyDE 作为第二次检索。
    pitfalls: |
      - **把假设答案当成回答返回**：等于让模型裸答，幻觉直接到用户面前。
      - **对内部术语多的知识库盲目上 HyDE**：LLM 编出不存在的制度名称，检索被带偏。
      - **只用 HyDE 一路检索**：一旦假设答案方向错，整体召回下降。
      - **忽视延迟**：HyDE 要生成一段文字，通常比改写更慢。
    interview_asks:
      - question: "HyDE 的原理是什么？假设答案是错的为什么还有用？"
        answer: "先让模型写一个假想答案，用这段话去检索，而不是用短问题。假想答案的措辞往往更接近文档。就算事实是错的，用词接近仍可能把真文档检出来。最后回答必须依据检到的文档，不能依据假想答案。"
      - question: "什么场景你不会用 HyDE？"
        answer: "问题里有编号、专有名词，假想答案容易改错这些词。多一次生成也更慢。精确查找用原问题加关键词。HyDE 只在短问题、口语、评测证明有提升时用。"
    project_example: |
      p1 里 HyDE 不默认开启，而是作为「低分补救」：第一次检索后 Rerank 最高分低于阈值时，才让小模型生成一段 150 字以内的假设答案，用它再检索一次，与第一次结果 RRF 合并后重新 Rerank。
      如果补救后仍低于阈值就走拒答（Day 27）。评测时单独统计「触发 HyDE 的样本」上拒答率和正确率的变化，决定是否保留这条分支。
    sources:
      - {title: "Gao et al. 2022 - Precise Zero-Shot Dense Retrieval without Relevance Labels（HyDE）", url: "https://arxiv.org/abs/2212.10496"}
test:
  - id: d26-t1
    kp: d26-k1
    type: single
    question: 关于 bi-encoder（Embedding 模型）和 cross-encoder（Rerank 模型），下列说法正确的是？
    options:
      - "cross-encoder 精度更高，应直接替代向量检索，对全库每个片段打分"
      - "bi-encoder 的片段向量可离线预计算；cross-encoder 要把问题和片段拼在一起，每次查询都重算"
      - "cross-encoder 输出的也是向量，可以存进 pgvector 建索引加速"
      - "两者分数含义相同，向量相似度阈值可以直接用于 Rerank 分数"
    answer: [1]
    explain: |
      B 是两者的本质区别，也决定了「bi-encoder 大范围召回、cross-encoder 小范围精排」的两阶段架构。
      A 错：cross-encoder 不能预计算，对百万级片段逐一打分延迟不可接受；C 错：cross-encoder 直接输出相关度分数，不产出可索引的向量；D 错：不同模型分数分布和含义不同，阈值必须分别标定。
  - id: d26-t2
    kp: d26-k1
    type: judge
    question: 在混合检索之后引入 Rerank，召回阶段的 Recall@50（正确片段出现在前 50 个候选中的比例）会随之提高。
    answer: false
    explain: |
      Rerank 只对已经召回的 50 个候选重新排序，不会往候选集里加入新片段，所以 Recall@50 不变。
      它提高的是排在前面的质量（前 5 条命中率、MRR）。如果正确片段根本没被召回，要从召回阶段解决：混合检索、Query Rewrite、切片或 Embedding 模型。
  - id: d26-t3
    kp: d26-k1
    type: multi
    question: 团队在 FastAPI 问答服务中引入本地部署的 bge-reranker-v2-m3 后 P95 延迟超标。下列哪些措施能有效控制延迟？
    options:
      - "把候选数从 200 降到 30~50，并截断过长片段"
      - "一次请求的全部候选批量推理，开启 fp16"
      - "把同步的 compute_score 放到线程或独立推理服务，并设超时降级为 RRF 顺序"
      - "把 Rerank 放到召回之前执行，先精排全库再召回"
      - "改用更大的 bge-reranker-v2-gemma，它精度更高所以整体更快"
    answer: [0, 1, 2]
    explain: |
      A、B 直接降低计算量（候选数 × Token 数）；C 避免阻塞事件循环并保证超时可降级，都是有效措施。
      D 本末倒置：cross-encoder 不能对全库打分，必须在召回之后；E 更大的模型精度可能更高，但推理更慢，不会降低延迟。
  - id: d26-t4
    kp: d26-k1
    type: single
    question: 下面用 Cohere Rerank 精排的代码，上线后发现返回的始终是召回列表的前 3 条，排序完全没变。问题出在哪里？
    code: |
      import cohere

      co = cohere.ClientV2()

      def rerank(query: str, candidates: list) -> list:
          docs = [c.text for c in candidates]
          resp = co.rerank(model="rerank-v5.0-fast", query=query,
                           documents=docs, top_n=3)
          return [candidates[i] for i, r in enumerate(resp.results)]
    options:
      - "top_n=3 会让 API 只对前 3 个文档打分，应改为 top_n=50"
      - "ClientV2 不支持 rerank，必须用旧版 cohere.Client"
      - "用了 enumerate 的位置 i 取候选，应改为 candidates[r.index]"
      - "documents 必须传 chunk_id 而不是文本，API 才能返回正确顺序"
    answer: [2]
    explain: |
      results 已按相关度降序排列，每项的 `index` 才是它在原 documents 中的下标。用 enumerate 得到的 i 只是 0、1、2，于是永远取回原列表前 3 条。应写成 `[candidates[r.index] for r in resp.results]`。
      A 错：top_n 只限制返回条数，全部文档都会被打分；B 错：ClientV2 正是当前 v2 写法；D 错：documents 传的就是要比较的文本。
  - id: d26-t5
    kp: d26-k1
    type: judge
    question: 团队把 Rerank 模型从 bge-reranker-v2-m3（normalize=True）换成 Cohere rerank-v5.0-fast 后，原来标定好的拒答阈值 0.2 可以直接沿用，因为两者输出都在 0~1 之间。
    answer: false
    explain: |
      两者虽然都落在 0~1，但一个是 logit 经 sigmoid 映射，一个是厂商校准分，分布和含义都不同，同一个阈值在两个模型上对应的「相关程度」完全不一样。
      换模型后必须在评测集上重新标定阈值，同时回归「无答案正确拒答率」和「误拒率」两个指标。
  - id: d26-t6
    kp: d26-k2
    type: single
    question: 用户问「试用期员工能请年假吗？请假期间工资怎么算？」，单次检索只召回了年假相关片段。最对症的改写方法是？
