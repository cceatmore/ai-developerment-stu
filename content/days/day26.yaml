day: 26
phase: 3
title: 重排与查询改写：Cross-encoder 重排、Query Rewrite、多轮指代消解与 HyDE
goals:
  - 能解释 bi-encoder 与 cross-encoder 的区别，判断什么时候该加 Rerank、它能解决和不能解决什么
  - 能针对用词不一致、复合问题、多轮追问三类问题选择合适的改写方法
  - 能设计多轮指代消解的改写环节，包括 Prompt 约束、超时回退和日志
  - 能说清 HyDE 的原理、适用场景和把检索带偏的风险
