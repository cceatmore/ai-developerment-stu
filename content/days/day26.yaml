    explain: |
      这是一句话包含两个独立检索意图的复合问题，问题分解能让每个意图各自召回。
      B 和 C 仍把两个意图混在一起，向量会偏向其中一个；D 解决的是追问中的代词和省略，这里没有代词问题。
