day: 34
phase: 4
title: 规划与反思：Plan-and-Execute、Reflection 与任务分解
goals:
  - 能对比 ReAct 和 Plan-and-Execute 的控制方式，判断一个任务该「走一步看一步」还是「先规划后执行」
  - 能手写一个带重规划的 Plan-and-Execute 骨架，并说清计划为什么要做成结构化数据
  - 能解释 Reflection 什么时候有效、什么时候只是浪费钱，区分「有外部反馈的纠错」和「模型凭空自省」
  - 能把复杂任务分解成有依赖关系、可验证完成标准的子任务，并判断哪些可以并行
