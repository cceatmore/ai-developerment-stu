knowledge_points:
  - id: d34-k1
    name: Plan-and-Execute：先规划后执行
    level: P0
    summary: 先让模型生成结构化计划，再逐步执行，每步后检查计划是否仍成立，必要时重规划；适合步骤多、易遗漏的长任务
    analogy: |
      像做一个大需求时先在 Jira 上拆好子任务清单，再一个个做，做的过程中发现设计不对就回头改清单。
      Hello-Agents 的比喻更形象：**ReAct 像侦探**，根据现场线索一步步推理、随时调整方向；**Plan-and-Solve 像建筑师**，动工前先画好蓝图，再按蓝图施工。
      **不一样的地方**：人做计划会参考团队经验；模型的计划只基于它此刻看到的上下文，**一开始就可能计划错**，所以执行中必须有「计划还成立吗」的检查点。
    why: |
      ReAct 走一步看一步，长任务里容易**忘记总体目标、漏掉步骤、在局部反复尝试**（Day 32）。规划是吴恩达总结的四大 agentic 设计模式之一，也是各家编码 Agent 维护待办清单的基础。
      面试常问「ReAct 有什么局限」「你了解 Plan-and-Execute 吗」，能说清两者区别和取舍，说明你理解的不只是一种循环写法。
    problem: |
      园区月度运营报告要覆盖告警、工单、客流、能耗四块，纯 ReAct 经常出现：
      - 查完告警和工单就开始写结论，**漏掉客流和能耗**；
      - 在某一块反复查询，步数耗尽；
      - 用户看不到它打算做什么，无法提前纠正。
      先把计划写出来，既能防遗漏，也能让人在执行前审核。
    principle: |
      **一、来源：Plan-and-Solve**

      Wang 等人 2023 年的 Plan-and-Solve 论文分析了零样本思维链（「Let's think step by step」）在数学题上的错误，分成三类：计算错误、**漏步骤错误**、语义理解错误。为解决漏步骤，他们把提示改成「先理解问题并**制定计划**，再按计划逐步求解」。工程上这个思路被扩展成 Plan-and-Execute：**规划器**出计划，**执行器**逐步做。

      **二、两阶段加检查点**

      ```mermaid
      flowchart TD
        T["用户任务"] --> P["规划器：输出结构化步骤清单"]
        P --> H{"需要人审核计划吗"}
        H -- "需要" --> A["工作台展示计划 等确认"]
        H -- "不需要" --> E
        A --> E["执行器：执行当前步骤 内部可以是小 ReAct"]
        E --> C{"计划还成立吗"}
        C -- "成立 还有步骤" --> E
        C -- "不成立" --> R["重规划：只规划剩余步骤"]
        R --> E
        C -- "全部完成" --> S["汇总输出"]
      ```

      Hello-Agents 4.3 的执行器每一步都会带上**原始问题、完整计划、历史步骤与结果、当前步骤**四样东西，保证执行器既知道全局又聚焦当前。

      **三、计划要做成结构化数据**

      计划不是一段自由文本，而是一个列表，每一步有：
      - `goal`：这一步要弄清楚什么；
      - `tool_hint`：建议用哪个工具（可选）；
      - `done_when`：**怎样算完成**（这是检查点能判断的前提）；
      - `depends_on`：依赖哪些步骤（d34-k3）。

      用结构化输出（Day 16）加 Pydantic 校验，就能在代码里检查：步数是否超限、引用的工具是否存在、有没有遗漏必选板块。

      **四、和 ReAct 对比**

      | 维度 | ReAct | Plan-and-Execute |
      |---|---|---|
      | 控制方式 | 每步临时决定 | 先定清单，按清单执行 |
      | 强项 | 探索性、需要随时调整的任务 | 结构清晰、步骤多、易遗漏的任务 |
      | 弱项 | 长任务易跑偏、漏步骤 | 计划一开始就错会一路错 |
      | 可审核性 | 只能事后看 trace | **执行前就能看计划** |
      | 成本 | 每步都用大模型 | 规划用强模型，执行可以用便宜模型 |

      **五、计划的另一种形式：用代码表达计划**

      吴恩达课程 Module 5 讲了「planning with code execution」：让模型直接写一段代码（比如调用若干数据函数再汇总）作为计划，然后在沙箱里执行。好处是计划精确、可执行；代价是必须有安全的执行环境（Day 44 沙箱）。

      **六、框架帮你做了什么**

      LangChain 的 `TodoListMiddleware` 给 Agent 加一个 `write_todos` 工具和配套提示，让模型**在 ReAct 循环里自己维护待办清单**；这是「ReAct + 规划工具」的混合形态，很多编码 Agent 都这么做。用 LangGraph 时，规划器、执行器、重规划就是图里的三个节点（Day 36）。
    scenarios: |
      - **月度运营报告**：计划固定包含告警、工单、客流、能耗四块，代码校验计划里四块都在，缺了就要求重规划。
      - **跨系统排查**：先列出要检查的子系统清单给值班长看，确认后再执行，避免 Agent 去查无关系统。
      - **数据迁移类长任务**：计划写成待办清单持久化（Day 35 结构化笔记），中途中断也能接着做。
    code: |
      手写一个带重规划的 Plan-and-Execute 骨架（`llm_json` 为结构化输出封装，见 Day 16；`run_agent` 为 Day 32 的小循环）：

      ```python
      from pydantic import BaseModel, Field


      class Step(BaseModel):
          id: int
          goal: str = Field(description="这一步要弄清楚什么")
          tool_hint: str | None = Field(default=None, description="建议使用的工具名")
          done_when: str = Field(description="怎样算完成")


      class Plan(BaseModel):
          steps: list[Step] = Field(min_length=1, max_length=6)


      class Progress(BaseModel):
          decision: str = Field(description="continue、replan 或 finish 三选一")
          reason: str


      def plan_and_execute(task: str, max_replans: int = 2) -> str:
          plan = Plan.model_validate_json(llm_json(PLANNER_PROMPT, task, schema=Plan))
          results: list[str] = []
          replans, i = 0, 0
          while i < len(plan.steps):
              step = plan.steps[i]
              ctx = f"任务：{task}\n计划：{plan.model_dump_json()}\n已完成：{results}\n当前步骤：{step.goal}"
              results.append(f"步骤{step.id}：{run_agent(ctx, max_steps=4)}")
              check = Progress.model_validate_json(llm_json(CHECK_PROMPT, "\n".join(results), schema=Progress))
              if check.decision == "finish":
                  break
              if check.decision == "replan" and replans < max_replans:
                  plan = Plan.model_validate_json(llm_json(REPLAN_PROMPT, f"{task}\n{results}", schema=Plan))
                  replans, i = replans + 1, 0      # 新计划只包含剩余步骤
                  continue
              i += 1
          return llm(f"根据各步骤结果写最终回答：{results}")
      ```
    pitfalls: |
      - **误区：Plan-and-Execute 一定比 ReAct 好。** 多出的规划和检查调用同样花钱；探索性强、步骤少的任务用 ReAct 更合适。
      - **计划只是一段文字**：代码无法检查步数、工具、必选项，也无法展示给人审核。
      - **没有重规划**：第 2 步发现设备根本不在线，计划里第 3~5 步全部作废，却还在硬执行。
      - **重规划不设上限**：每步都觉得「需要重新规划」，规划本身变成了死循环。
      - **执行器看不到全局**：只给当前步骤，执行器不知道整体目标，结果难以拼接。
    interview_asks:
      - question: "ReAct 和 Plan-and-Execute 有什么区别？各适合什么场景？"
        answer: "ReAct 走一步看一步，适合下一步取决于上一步观察的任务。Plan-and-Execute 先列出计划再执行，适合步骤较多、你希望先看到计划的任务。计划错了要允许重做，不能死板执行到底。"
      - question: "计划执行到一半发现不对了，怎么办？"
        answer: "停下来，把已经完成的结果和失败原因交给规划步骤，让它改后面的计划，而不是从头无脑再来。已完成的写操作不要重做。重规划也要有次数上限。"
      - question: "为什么计划要做成结构化数据，而不是让模型写一段文字？"
        answer: "结构化计划才能知道有哪些步、依赖是什么、哪一步完成了。一段文字无法可靠地执行和恢复。每一步用状态字段，不要靠正则从段落里抠。"
    project_example: |
      **p2 智慧园区运营 Agent** 里，「生成某园区月度运营报告」用 Plan-and-Execute：
      - 规划器输出 4~6 步的结构化计划，代码校验「告警、工单、客流、能耗」四个板块都在，缺了就重规划；
      - 计划先在 Vue3 运营工作台上展示，运营经理可以删掉或增加板块再确认；
      - 每一步内部是 Day 32 的小 ReAct 循环（最多 4 步），只读工具；
      - 某个园区没有能耗接口时，检查点判定 replan，计划改成「标注能耗数据缺失」，而不是一直重试。
    freshness: |
      核对于 2026-11：Plan-and-Solve 论文为 arXiv 2305.04091（Wang 等，ACL 2023），论文把零样本思维链的错误分为计算错误、漏步骤错误和语义理解错误三类，Plan-and-Solve 针对漏步骤问题。Hello-Agents 第四章 4.3 给出了规划器加执行器的手写实现。LangChain 1.5.0 的 `TodoListMiddleware` 会自动为 Agent 提供 `write_todos` 工具和规划提示。吴恩达 Agentic AI 课程（页面标注 2026-10-30 更新）Module 5 包含 Planning workflows 与 Planning with code execution。
    sources:
      - {title: "Plan-and-Solve Prompting (arXiv)", url: "https://arxiv.org/abs/2305.04091"}
      - {title: "Hello-Agents 第四章 4.3 Plan-and-Solve", url: "https://github.com/datawhalechina/hello-agents/blob/main/docs/chapter4/%E7%AC%AC%E5%9B%9B%E7%AB%A0%20%E6%99%BA%E8%83%BD%E4%BD%93%E7%BB%8F%E5%85%B8%E8%8C%83%E5%BC%8F%E6%9E%84%E5%BB%BA.md"}
      - {title: "LangChain Docs - Prebuilt middleware（To-do list）", url: "https://docs.langchain.com/oss/python/langchain/middleware/built-in"}

  - id: d34-k2
    name: Reflection：自我纠错与外部反馈
    level: P0
    summary: 反思是「生成 → 评审 → 修改」的循环；有外部反馈（测试、执行报错、规则校验）时效果最好，凭空自省可能无效甚至变差
    analogy: |
      像前端提 PR 前的检查：自己 review 一遍代码（自省），跑一下 eslint 和 vitest（外部反馈），再根据报错改。
      **不一样的地方**：你自己 review 时有经验能发现问题；模型「自己检查自己」时，**常常看不出自己的错误，甚至把对的改错**。真正可靠的是 eslint、测试、SQL 执行结果这类**外部信号**，而不是「请再检查一遍」。
    why: |
      反思是吴恩达总结的四大 agentic 设计模式中最容易上手、收益也最明显的一个，Anthropic 的评估-优化 workflow（Day 31）也是同一思想。
      但它很容易被滥用：加一轮「请检查并改进」，成本翻倍、延迟翻倍，效果却不一定提升。面试官问「你们加反思有用吗、怎么证明」，考的是你是否理解它**什么时候有效**。
    problem: |
      - 模型第一版输出常有遗漏、格式错、逻辑漏洞，直接交付质量不够；
      - 简单地让同一个模型「再检查一遍」，它可能回答「看起来没问题」，或者把正确内容改错；
      - 反思循环没有上限，评审者总能挑出点毛病，一直改下去；
      - 改了几轮后，最后一版未必是最好的一版。
    principle: |
      **一、三种代表性做法**

      | 做法 | 核心 | 反馈来源 |
      |---|---|---|
      | **Self-Refine**（Madaan 等 2023） | 同一个模型先生成，再给自己写反馈，再按反馈修改，循环到满足停止条件 | 模型自己 |
      | **Reflexion**（Shinn 等 2023） | 任务失败后用自然语言总结「哪里做错了」，写进情景记忆，**下一次尝试**时参考，不改模型参数 | 环境的成败信号 + 模型的文字总结 |
      | **评估-优化 workflow** | 生成者和评审者分开，评审按明确标准给反馈 | 另一个调用、规则或测试 |

      Hello-Agents 4.4 把它概括为三步循环：**执行 → 反思 → 优化**，直到反思不再发现新问题或达到迭代上限。

      **二、关键结论：外部反馈比凭空自省可靠**

      Huang 等人 2023 年的论文《Large Language Models Cannot Self-Correct Reasoning Yet》专门研究了「内在自我纠错」（不借助任何外部反馈，只靠模型自己）：在推理任务上，模型**很难纠正自己，有时纠正后反而更差**；一些早期研究的提升，来自在纠错时用到了标准答案这类外部信号。论文还提醒：比较时要和**相同调用次数**的基线比（比如多采样投票），否则不公平。

      吴恩达课程 Module 2 也专门有一节「Using external feedback」：**把代码执行结果、SQL 报错、测试结果这类外部信号喂给反思步骤，效果远好于只让模型再看一遍**。

      ```mermaid
      flowchart LR
        G["生成初稿"] --> X["外部检查：执行 SQL 跑测试 规则校验"]
        X --> D{"有问题吗"}
        D -- "没有" --> OK["交付"]
        D -- "有" --> F["把具体错误交给模型修改"]
        F --> N{"达到最大轮次"}
        N -- "否" --> X
        N -- "是" --> B["返回历史最好版本并标注问题"]
      ```

      **三、什么时候值得加反思**

      Anthropic 给评估-优化列出的两个信号：**人给出反馈后输出能明显改进**，以及**模型能给出这样的反馈**。落到工程上：
      - 有**可执行的检查**：SQL 能不能执行、测试过不过、JSON 是否符合 Schema、数字是否和数据库一致 → 值得加；
      - 有**明确的评审清单**：报告必须包含四个板块、每个结论必须有数据来源 → 可以加；
      - 只有「请检查是否正确」这种模糊要求 → 大概率是浪费钱。

      **四、工程要点**

      - **最大轮次**：一般 2~3 轮；
      - **停止条件**：外部检查通过，或评审不再提出新问题；
      - **保留最好版本**：每轮打分，最后返回得分最高的，而不是默认最后一版；
      - **用评测证明**：同一评测集对比「无反思 / 有反思」的质量、成本、延迟，Hello-Agents 4.4.5 把反思称为典型的「以成本换质量」策略。

      **五、框架帮你做了什么**

      deepagents 的 `RubricMiddleware`（需 deepagents 0.6.5 及以上）让你声明「什么叫做完」的评分标准，Agent 自评并迭代，直到满足标准或达到 `max_iterations`。本质就是上面这个循环加上评分标准。
    scenarios: |
      - **Text2SQL**：生成 SQL → 只读校验加 EXPLAIN 加试执行 LIMIT 5 → 把报错原文交给模型修正，最多 3 轮（p2 Day 39 子 Agent）。
      - **运营报告**：按清单检查（四个板块齐全、每个数字有来源、和数据库一致）→ 只针对不通过项修改。
      - **代码生成**：跑 vitest 和 eslint，把失败输出交给模型修复（p3 项目的生成-测试-修复循环）。
    code: |
      带外部反馈的反思循环（以 SQL 生成为例，`check_sql` 返回问题列表）：

      ```python
      def check_sql(sql: str) -> list[str]:
          problems = []
          if not sql.lstrip().lower().startswith("select"):
              problems.append("只允许 SELECT 语句")
          problems += whitelist_violations(sql)          # 是否访问了白名单外的表
          if not problems:
              problems += explain_errors(sql)            # 数据库 EXPLAIN 的真实报错
          return problems


      def sql_with_reflection(question: str, max_rounds: int = 3) -> tuple[str, list[str]]:
          sql = llm(f"表结构：{SCHEMA}\n问题：{question}\n只输出一条只读 SQL")
          best, best_problems = sql, check_sql(sql)
          for _ in range(max_rounds):
              if not best_problems:
                  break
              sql = llm(f"这条 SQL 有问题：{best_problems}\n原 SQL：{best}\n请修正，只输出 SQL")
              problems = check_sql(sql)
              if len(problems) < len(best_problems):     # 只保留更好的版本
                  best, best_problems = sql, problems
          return best, best_problems
      ```
    pitfalls: |
      - **误区：加一轮「请检查并改进」总会更好。** 没有外部信号的自省在推理任务上可能无效甚至变差，还让成本和延迟翻倍。
      - **误区：Reflexion 让模型真的学会了。** 它只是把文字总结放进上下文或记忆，不改变模型参数，换个会话不带上这些记忆就没了。
      - **没有最大轮次**：评审者总能挑出毛病，循环停不下来。
      - **默认最后一版最好**：修改可能把对的改错，应按检查结果保留最佳版本。
      - **评审标准模糊**：「质量好不好」无法稳定判断，应写成可逐条核对的清单。
    interview_asks:
      - question: "什么是 Reflection？它一定能提升效果吗？"
        answer: "做完再让模型检查哪里不好，然后改一版。没有外部标准时，它常常觉得自己是对的，或者把对的改错。只在有测试、校验器或人工标准时才加。"
      - question: "自我反思和有外部反馈的纠错有什么区别？"
        answer: "自我反思的依据还是模型自己的话。外部反馈是测试失败、校验错误、检索对不上，这些不是它编的。优先用外部反馈。没有外部信号，反思的收益要用评测证明。"
      - question: "你怎么证明加了反思是值得的？"
        answer: "同一评测集对比开和关：成功率、花费 Token、延迟。成功率没涨就去掉。不能用单个例子说明「加了之后感觉更好」。"
    project_example: |
      **p2 智慧园区运营 Agent** 的「数据统计」分支（Day 39 会拆成 Text2SQL 子 Agent）用的就是带外部反馈的反思：
      - 生成 SQL 后先做只读和白名单校验，再用数据库 EXPLAIN 拿真实报错；
      - 把报错原文交给模型修正，最多 3 轮，保留问题最少的版本；
      - 3 轮仍失败就返回「无法生成可执行的查询」并附最后的错误，不编造数字。
      我们没有在闲聊和简单查询上加反思，因为评测显示那里只增加延迟。是否保留反思，以同一评测集上的执行成功率、答案正确率和成本对比为准。
    freshness: |
      核对于 2026-11：Self-Refine（arXiv 2303.17651）用同一个模型做生成、反馈、修改，在 7 个任务上平均约 20% 的绝对提升（论文使用 GPT-3.5 / GPT-4）；Reflexion（arXiv 2303.11366）不更新权重，把对任务反馈的文字反思存入情景记忆供后续尝试使用；Huang 等（arXiv 2310.01798）指出无外部反馈的内在自我纠错在推理任务上表现不佳、有时变差。deepagents 当前版本 0.7.35，文档注明 `RubricMiddleware` 需 deepagents 0.6.5 及以上，支持 `max_iterations`。
    sources:
      - {title: "Self-Refine: Iterative Refinement with Self-Feedback (arXiv)", url: "https://arxiv.org/abs/2303.17651"}
      - {title: "Reflexion: Language Agents with Verbal Reinforcement Learning (arXiv)", url: "https://arxiv.org/abs/2303.11366"}
      - {title: "Large Language Models Cannot Self-Correct Reasoning Yet (arXiv)", url: "https://arxiv.org/abs/2310.01798"}
      - {title: "LangChain Docs - Prebuilt middleware（Rubric grading）", url: "https://docs.langchain.com/oss/python/langchain/middleware/built-in"}

  - id: d34-k3
    name: 任务分解：依赖、并行与完成标准
    level: P1
    summary: 把大任务拆成有依赖关系的子任务图，每个子任务有可验证的完成标准，独立的子任务并行执行
    analogy: |
      像前端构建工具处理模块依赖：Vite 先分析 import 关系得到依赖图，没有依赖的模块可以并行处理，有依赖的按拓扑顺序来。
      **不一样的地方**：构建工具的依赖图是从代码里精确分析出来的；Agent 的子任务图是**模型生成的**，可能漏边、多边或循环依赖，所以代码要校验这张图。
    why: |
      Day 31 讲的是**设计时**由人拆解流程；今天讲的是**运行时**由模型拆解任务。规划（d34-k1）的质量主要取决于分解得好不好，编排-执行模式（Day 31）和多 Agent 的子 Agent 分工（Day 39）也都建立在分解之上。
    problem: |
      分解不好时的典型问题：
      - 粒度太粗：「分析园区运营情况」一步做不完，执行器又要自己再拆；
      - 粒度太细：每个小判断都是一步，调用次数和成本暴涨；
      - 没有完成标准：不知道这一步做完了没有，检查点无从判断；
      - 忽略依赖：「对比本月和上月客流」在拿到两个月数据之前就开始了；
      - 本可并行的子任务串行执行，延迟白白增加。
    principle: |
      **一、好子任务的三个标准**

      - **单一目标**：一句话说得清「这一步要得到什么」；
      - **可验证**：有 `done_when`，比如「拿到 B2 区域近 7 天告警数量和前三类告警」；
      - **大小合适**：一个小 ReAct 循环（几步工具调用）能完成。

      **二、依赖图与并行**

      ```mermaid
      flowchart LR
        A["查本月告警统计"] --> E["写告警分析"]
        B["查本月工单统计"] --> F["写工单分析"]
        C["查本月客流"] --> G["对比两月客流"]
        D["查上月客流"] --> G
        E --> H["汇总成月报"]
        F --> H
        G --> H
      ```

      A、B、C、D 互不依赖，可以并发执行（Day 31 的并行模式）；G 要等 C 和 D；H 要等全部。计划里每一步写 `depends_on`，代码按拓扑顺序调度。

      **三、代码要校验模型生成的分解**

      - 引用的依赖步骤都存在，**没有循环依赖**；
      - 步数不超过上限（例如 8 步）；
      - 必选板块都覆盖到（月报必须有四块）；
      - 每一步的建议工具在注册表里存在、当前用户有权使用。
      校验不过就带着具体问题让模型重新分解，这本身就是一次带外部反馈的反思（d34-k2）。

      **四、谁来分解**

      | 方式 | 适合 |
      |---|---|
      | 人在设计时固定分解（Day 31） | 结构稳定的任务，例如固定格式的日报 |
      | 模型运行时分解（今天） | 结构随输入变化，例如「排查 3 号楼异常」要查哪些子系统 |
      | 混合：固定骨架 + 模型填充细节 | 月报四个板块固定，每个板块内部查什么由模型定 |

      **五、分解与上下文隔离**

      子任务交给独立的执行器（或子 Agent）时，每个执行器只拿到自己需要的上下文，返回精简结果，主流程的上下文不会被大量中间数据撑爆。Anthropic 在上下文工程文章里把这称为子 Agent 架构，Day 35 和 Day 39 会展开。
    scenarios: |
      - **月报**：四个板块的数据查询并行，分析和汇总按依赖顺序。
      - **多园区对比**：每个园区一个独立子任务并行查询，最后统一对比。
      - **故障排查**：先并行查设备状态、网络告警、近期变更，再根据结果决定下一层。
    pitfalls: |
      - **误区：分解越细越好。** 步骤越多，调用越多、错误累积越严重（Day 31）。
      - **不校验依赖**：模型生成的依赖可能缺失或成环，直接执行会卡死或拿到不完整数据。
      - **没有完成标准**：检查点只能靠模型主观判断「好像做完了」。
      - **并行有副作用的子任务**：写操作子任务不能随意并行（Day 33）。
    interview_asks:
      - question: "复杂任务你会怎么分解？怎样算一个好的子任务？"
        answer: "一个子任务只有一个可检查的产出，输入明确，失败不会弄脏别的任务。太大就无法重试，太碎则来回调用更贵。先画出依赖，再决定哪些能并行。"
      - question: "哪些子任务可以并行？怎么保证顺序正确？"
        answer: "彼此不读对方产出的可以并行。有依赖的必须等前一个完成。用任务状态而不是「都丢进 gather」来保证顺序。写同一条业务数据的不能并行。"
    project_example: |
      **p2 智慧园区运营 Agent** 的月报规划器输出的每一步都带 `depends_on` 和 `done_when`：
      - 代码先校验无循环依赖、不超过 8 步、四个板块齐全；
      - 无依赖的数据查询步骤用 `asyncio.gather` 并发执行，加 Semaphore 限制最多 3 个并发，保护 IoT 平台；
      - 每个子任务只返回统计摘要（几百字），不把原始明细放回主流程。
      这样月报的数据准备阶段从串行改成并行，主流程上下文也保持精简。
    sources:
      - {title: "Anthropic - Building effective agents（Orchestrator-workers）", url: "https://www.anthropic.com/engineering/building-effective-agents"}
      - {title: "Anthropic - Effective context engineering for AI agents（Sub-agent architectures）", url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}

test:
  - id: d34-t1
    kp: d34-k1
    type: single
    question: 关于 ReAct 与 Plan-and-Execute 的区别，下列说法最准确的是？
    options:
      - "ReAct 不使用工具，Plan-and-Execute 才使用工具"
      - "ReAct 每步临时决定下一步，Plan-and-Execute 先生成步骤清单再按清单执行"
      - "Plan-and-Execute 只调用一次模型，所以一定比 ReAct 便宜"
      - "ReAct 适合长任务，Plan-and-Execute 只适合两三步的短任务"
    answer: [1]
    explain: |
      两者的根本区别在控制方式：ReAct 走一步看一步，Plan-and-Execute 先定计划再执行，必要时重规划。
      两者都可以使用工具；Plan-and-Execute 要调用规划、执行、检查多次模型，不一定更便宜；它恰恰更适合步骤多、容易遗漏的长任务。
  - id: d34-t2
    kp: d34-k1
    type: single
    question: Plan-and-Solve 论文提出「先制定计划再逐步求解」，主要是为了解决零样本思维链的哪类错误？
    options:
      - "计算错误，例如加减乘除算错"
      - "格式错误，例如输出不是 JSON"
      - "工具调用错误，例如选错工具"
      - "漏步骤错误，例如步骤多时漏掉中间推理"
    answer: [3]
    explain: |
      论文把零样本思维链的错误分为计算错误、漏步骤错误和语义理解错误三类，Plan-and-Solve 的「先规划」直接针对漏步骤问题；针对计算错误，论文另外加了更详细的指令（PS+）。
      格式和工具调用错误不是这篇论文的研究对象。
  - id: d34-t3
    kp: d34-k1
    type: single
    question: 执行计划的第 2 步时发现目标园区根本没有能耗接口，而计划第 4、5 步都依赖能耗数据。最合理的处理是？
    options:
      - "触发重规划，基于已有结果只规划剩余步骤，例如改为标注能耗数据缺失"
      - "继续按原计划执行第 3、4、5 步，失败了再说"
      - "让执行器在第 4 步一直重试，直到接口可用"
      - "直接放弃整个任务，返回失败"
    answer: [0]
    explain: |
      检查点发现计划前提不成立时应重规划，并且只规划剩余部分，已完成的结果保留。这正是 Plan-and-Execute 比「死板按蓝图施工」多出来的关键能力。
      硬执行和无限重试会浪费步数并可能卡死；直接放弃又丢掉了已完成的部分。
  - id: d34-t4
    kp: d34-k1
    type: multi
    question: 为什么建议把计划做成结构化数据（例如带 goal、done_when、depends_on 的步骤列表），而不是一段自由文本？
    options:
      - "代码可以校验步数上限、必选板块是否齐全、引用的工具是否存在"
      - "可以在执行前把计划展示在工作台上让人审核和修改"
      - "done_when 让检查点有明确依据判断这一步是否完成"
      - "结构化计划能保证模型一次就规划正确，不再需要重规划"
    answer: [0, 1, 2]
    explain: |
      结构化计划可被代码校验、可被人审核、每一步有完成标准，这些都是自由文本做不到的。
      但它不能保证计划正确，执行中仍可能发现前提不成立，需要重规划机制。
  - id: d34-t5
    kp: d34-k1
    type: judge
    question: LangChain 的 TodoListMiddleware 会给 Agent 提供一个 write_todos 工具，让模型在循环中自己维护待办清单，这属于「ReAct 加规划工具」的混合形态。
    answer: true
    explain: |
      文档说明该中间件自动为 Agent 提供 write_todos 工具和配套提示，用于复杂多步任务的规划和进度跟踪。
      模型仍在 ReAct 循环中逐步决策，只是多了一个显式维护计划的工具，兼顾灵活性和不遗漏。
  - id: d34-t6
    kp: d34-k1
    type: judge
    question: 只要用了 Plan-and-Execute，就不需要再设置最大步数，因为计划的步骤数本身就是上限。
    answer: false
    explain: |
      每个计划步骤内部的执行器可能是一个小 ReAct 循环，仍可能空转；重规划也可能反复触发。
      必须同时限制每步内部的最大步数和重规划次数，并保留总超时和预算。
  - id: d34-t7
    kp: d34-k2
    type: single
    question: 根据 Huang 等人 2023 年的研究，在不借助任何外部反馈、只让模型自己检查自己的情况下，推理任务上的自我纠错通常表现如何？
    options:
      - "几乎总能显著提升准确率，是最划算的优化"
      - "效果与多采样投票完全相同，成本也相同"
      - "模型很难纠正自己的推理，有时纠正后反而更差"
      - "只要多迭代几轮，准确率一定会收敛到 100%"
    answer: [2]
    explain: |
      论文《Large Language Models Cannot Self-Correct Reasoning Yet》发现内在自我纠错在推理任务上表现不佳，有时性能下降；部分早期研究的提升来自纠错时用到了标准答案等外部信号。
      论文还强调要与相同调用次数的基线比较，自我纠错并不比多采样投票更划算，也不存在「一定收敛」的说法。
  - id: d34-t8
    kp: d34-k2
    type: single
    question: 下面这个反思循环有什么主要问题？
    code: |
      def answer_with_reflection(question: str) -> str:
          draft = llm(question)
          while True:
              review = llm(f"请检查下面的回答是否正确，如有问题请指出：{draft}")
              if "没有问题" in review:
                  return draft
              draft = llm(f"根据意见修改：{review}\n原回答：{draft}")
    options:
      - "修改步骤应该换成更小的模型来做，否则每轮成本太高，不划算"
      - "检查和修改的顺序反了，应该先让模型修改一遍再做检查"
      - "评审提示词应该改写成英文，模型对英文指令的理解更准确"
      - "没有轮次上限，评审只是模糊自省，且默认最后一版就是最好的"
    answer: [3]
    explain: |
      while True 加上「是否包含没有问题」的判断，评审者总能挑出点毛病时就停不下来；「请检查是否正确」没有任何外部依据，自省效果不可靠，可能把对的改错；代码默认返回最后一版，没有保留最佳版本。
      模型大小、检查顺序和提示语言都不是这段代码的核心问题；用字符串包含判断停止也很脆弱，可以顺手改成结构化输出。
  - id: d34-t9
    kp: d34-k2
    type: multi
    question: 下列哪些场景**特别适合**加入带外部反馈的反思循环？
    options:
      - "Text2SQL：用数据库 EXPLAIN 和试执行的报错让模型修正 SQL"
      - "代码生成：把单元测试失败输出交给模型修复"
      - "结构化抽取：用 Schema 校验失败的具体字段让模型重新生成"
      - "闲聊回复：让模型自己判断回复是否「足够有趣」再修改"
    answer: [0, 1, 2]
    explain: |
      前三项都有客观、可执行的外部检查，反馈具体，模型能据此有针对性地修改，这正是吴恩达课程强调的 external feedback。
      「是否有趣」没有客观标准，凭模型自省只会增加成本和延迟，效果难以证明。
  - id: d34-t10
    kp: d34-k2
    type: judge
    question: Reflexion 通过把失败后的文字反思写入记忆来改进后续尝试，因此它会逐步更新模型的参数，让模型真正学会这类任务。
    answer: false
    explain: |
      Reflexion 论文明确说它不更新权重，而是把语言形式的反思存进情景记忆缓冲区，作为后续尝试的额外上下文。
      换一个会话、不带上这些记忆，模型就和原来一样。它是「上下文里的经验」，不是训练。
  - id: d34-t11
    kp: d34-k2
    type: single
    question: 团队想证明「给报告生成加一轮反思」是值得的，最合理的评估方式是？
    options:
      - "挑出几个反思后明显变好的典型例子，整理成报告给老板看"
      - "统计反思后的输出是否普遍比初稿更长、更详细、覆盖更多点"
      - "同一评测集对比有无反思的质量、成本、延迟，并对照同调用次数方案"
      - "把初稿和反思版一起交给同一个模型，问它哪一版更好"
    answer: [2]
    explain: |
      只有在同一评测集上对比，才能看出整体收益是否抵得上翻倍的成本和延迟；和相同调用次数的方案（例如多采样择优）对照，才能确认收益来自反思而不是多花的调用。
      挑例子有选择偏差；长度不代表质量；让模型评价自己回到了内在自省的问题。
  - id: d34-t12
    kp: d34-k2
    type: multi
    question: 设计一个反思循环时，下列哪些是必要的工程要点？
    options:
      - "设置最大轮次，一般两三轮"
      - "外部检查通过或评审不再提出新问题时提前结束"
      - "每轮评分，最终返回得分最高的版本而不是默认最后一版"
      - "让评审者只回答「好」或「不好」，不必说明具体问题"
    answer: [0, 1, 2]
    explain: |
      上限防止无限循环，提前结束节省成本，保留最佳版本防止「越改越差」。
      评审只给好坏判断，修改者不知道改哪里，反馈价值很低；应给出具体、可操作的问题清单。
  - id: d34-t13
    kp: d34-k3
    type: single
    question: 月报计划中有这样几步：查本月客流、查上月客流、查本月告警、对比两月客流、汇总月报。下列哪组步骤可以**并行**执行？
    options:
      - "对比两月客流和汇总月报"
      - "查本月客流、查上月客流、查本月告警"
      - "查上月客流和对比两月客流"
      - "所有步骤都可以同时执行"
    answer: [1]
    explain: |
      三个查询步骤互不依赖，可以并发；「对比两月客流」依赖两个客流查询，「汇总」依赖所有分析结果，必须按依赖顺序执行。
      把有依赖的步骤并行会拿到不完整的数据。
  - id: d34-t14
    kp: d34-k3
    type: single
    question: 下列哪个子任务的定义最好？
    options:
      - "全面分析一下整个园区本月的运营情况，并给出改进建议"
      - "调用 list_alarms 工具，把返回的所有告警记录原样保存下来"
      - "看看最近的告警情况，如果发现异常就顺便处理一下"
      - "获取 B2 区域近 7 天告警总数和前三类告警，三项都有值即完成"
    answer: [3]
    explain: |
      好的子任务要有单一目标、可验证的完成标准、大小适中。第四项目标明确、范围清晰、有 done_when。
      第一项太粗，一个子任务做不完；第二项是具体动作而不是目标，也没说要得到什么；第三项含糊无法验证。
  - id: d34-t15
    kp: d34-k3
    type: multi
    question: 模型生成了一张子任务依赖图，执行前代码应该校验哪些内容？
    options:
      - "引用的依赖步骤都存在，并且没有循环依赖"
      - "总步数不超过上限"
      - "必选板块都被覆盖到"
      - "每一步的描述都超过 100 个字"
    answer: [0, 1, 2]
    explain: |
      模型生成的依赖可能缺失或成环，直接执行会卡死；步数上限控制成本；必选项检查防遗漏。校验不过就带着具体问题让模型重新分解。
      描述长度和子任务质量无关，强制长描述只会浪费 Token。
  - id: d34-t16
    kp: d34-k3
    type: judge
    question: 把子任务交给独立的执行器，让每个执行器只拿到自己需要的上下文并返回精简结果，可以避免主流程的上下文被大量中间数据撑爆。
    answer: true
    explain: |
      Anthropic 在上下文工程文章中把这称为子 Agent 架构：子任务在干净的上下文中深入探索，只返回提炼后的摘要，主流程专注于汇总和推理。
      这也是任务分解除了「不遗漏」之外的另一个重要收益（详见 Day 35、Day 39）。
  - id: d34-t17
    kp: d34-k3
    type: judge
    question: 任务分解得越细越好，每个子任务越小，模型越不容易出错，整体成功率就越高。
    answer: false
    explain: |
      分解过细会增加调用次数、延迟和成本，步骤越多错误累积越严重（Day 31）。
      子任务应当「一个小循环能完成、有可验证的完成标准」，而不是越碎越好。

exam:
  - id: d34-e1
    kp: d34-k1
    type: single
    question: 用户要求「排查 3 号楼今天门禁频繁报警的原因」，可能涉及门禁设备、网络、刷卡记录、近期变更多个方面，且查到什么决定下一步查什么。对这个任务，下列选择最合理的是？
    options:
      - "必须用 Plan-and-Execute，先把所有排查步骤一次性规划好"
      - "用 Reflection，让模型反复检查自己的结论"
      - "以 ReAct 为主，可配合待办清单工具记录已查和待查方向"
      - "用固定 workflow，按设备、网络、刷卡、变更的顺序全部查一遍"
    answer: [2]
    explain: |
      排查是探索性任务，下一步取决于上一步结果，ReAct 更合适；方面较多时加一个待办清单工具，能防止遗漏又不失灵活。
      一次性规划容易在第一步结果出来后就失效；纯自省反思缺少外部信号；固定 workflow 会做大量无关查询。
  - id: d34-e2
    kp: d34-k2
    type: single
    question: 下列哪种反思设计最可能真正提升 Text2SQL 的执行成功率？
    options:
      - "把 SQL 交给数据库 EXPLAIN 和试执行，把真实报错交给模型修正"
      - "让同一个模型回答「这条 SQL 对吗」，回答不对就重写"
      - "让模型把同一条 SQL 用三种不同写法各写一遍"
      - "在 Prompt 末尾加上「请务必确保 SQL 正确」"
    answer: [0]
    explain: |
      数据库的真实报错是客观、具体的外部反馈，模型能据此精准修正，这就是吴恩达课程强调的 external feedback。
      纯自省可靠性差；换写法不提供错误信息；Prompt 里的口号不改变模型能力。
  - id: d34-e3
    kp: d34-k3
    type: single
    question: 规划器生成的月报计划中，步骤 3 依赖步骤 5，步骤 5 又依赖步骤 3。执行器按计划运行后一直卡住。最根本的修复是？
    options:
      - "给执行器加更长的超时"
      - "让执行器遇到等待时随机选一个步骤先执行"
      - "提高规划器的 temperature，让它多尝试几种计划"
      - "执行前校验依赖图无环，有环就带着具体问题让规划器重新生成"
    answer: [3]
    explain: |
      循环依赖是计划本身的结构错误，执行前用代码检测（拓扑排序）就能发现，并作为外部反馈交给规划器修正。
      加超时只是更晚失败；随机执行会拿到不完整数据；提高随机性不能保证消除环。
  - id: d34-e4
    kp: d34-k2
    type: single
    question: 某报告生成流程加入了「最多 3 轮评审修改」，评测显示第 2 轮之后的版本经常比第 1 轮更差。最直接的改进是？
    options:
      - "把最大轮次从 3 提高到 5"
      - "每轮按检查清单打分，最终返回得分最高的版本"
      - "去掉检查清单，让评审者自由发挥"
      - "改成每轮都从头重新生成，而不是修改上一版"
    answer: [1]
    explain: |
      修改可能把对的改错，所以不能默认最后一版最好。每轮打分并保留最佳版本，能直接避免越改越差。
      增加轮次只会放大问题；去掉清单让评审更不稳定；从头重写丢掉了已经正确的部分。
  - id: d34-e5
    kp: d34-k1
    type: multi
    question: 相比 ReAct，Plan-and-Execute 在工程上的优势有哪些？
    options:
      - "执行前可以把计划展示给人审核和修改"
      - "规划用强模型，执行步骤可以交给更便宜的模型"
      - "长任务中更不容易漏掉必选部分"
      - "计划生成后就不会出错，不需要检查点"
    answer: [0, 1, 2]
    explain: |
      计划可审核、规划与执行可用不同模型、按清单执行防遗漏，都是 Plan-and-Execute 的实际优势。
      计划一开始就可能错，或执行中前提改变，必须有检查点和重规划。
  - id: d34-e6
    kp: d34-k2
    type: multi
    question: 根据 Anthropic 对评估-优化模式的说明，下列哪些是「这个任务适合加评审修改循环」的信号？
    options:
      - "人给出具体反馈后，模型的输出能明显改进"
      - "模型自己（或另一个调用）能给出这样有用的反馈"
      - "有清晰的评估标准，迭代改进能带来可衡量的提升"
      - "任务对延迟极其敏感，必须在 1 秒内返回"
    answer: [0, 1, 2]
    explain: |
      Anthropic 给出的两个适配信号是「人能给出改进反馈且输出确实改进」和「LLM 能提供这样的反馈」，并要求有清晰的评估标准。
      评审修改循环会成倍增加延迟，不适合 1 秒级响应的任务。
  - id: d34-e7
    kp: d34-k3
    type: judge
    question: 月报的四个板块固定，但每个板块内部查哪些数据由模型决定，这是「固定骨架加模型填充细节」的混合分解方式，通常比完全交给模型分解更稳定。
    answer: true
    explain: |
      固定骨架保证必选内容不遗漏、结构可预期，模型只在板块内部发挥灵活性。
      这和 Day 31 的「外层 workflow、局部 Agent」是同一思路：能固定的部分固定，只把真正需要灵活的部分交给模型。
  - id: d34-e8
    kp: d34-k1
    type: judge
    question: Plan-and-Execute 中，执行器每一步只需要知道当前步骤的描述即可，传入原始任务和已完成结果只会浪费 Token。
    answer: false
    explain: |
      执行器只看当前步骤，就不知道整体目标，也看不到前面步骤拿到的数据，结果难以衔接。
      Hello-Agents 的实现每一步都带上原始问题、完整计划、历史步骤结果和当前步骤；需要控制长度时应摘要历史结果，而不是全部去掉。
  - id: d34-e9
    kp: d34-k2
    type: case
    question: |
      某团队给园区运营问答 Agent 的每个回答都加了一轮「自我反思」：回答生成后，用同一个模型、同一套上下文提问「请检查你的回答是否准确完整，如有问题请改进」，再输出改进版。
      上线两周后，评测集显示答案正确率没有变化（个别涉及数字的问题反而改错了），平均延迟从 4 秒变成 9 秒，Token 成本接近翻倍。
      最合理的调整方案是？
    options:
      - "把反思轮次增加到 3 轮，给模型更多发现问题和改进答案的机会"
      - "换一个更强、更贵的模型专门来做反思步骤，其余流程保持不变"
      - "让反思步骤输出更长、更细致的逐句分析，提高检查的覆盖程度"
      - "去掉通用自省，只对数字和 SQL 类回答用数据库核对、执行报错来修正"
    answer: [3]
    explain: |
      同一模型、同一上下文、只靠「请检查」的内在自省，缺少外部信号，研究表明这类自我纠错在推理上常常无效甚至变差，和本案例的表现一致。把反思只用在有客观检查的地方（数字与数据库核对、SQL 执行报错），才能用成本换来真实的质量提升。
      加轮次、换模型、写更长分析都没有引入外部反馈，只会进一步增加成本和延迟。

interview:
  - id: d34-i1
    kp: d34-k1
    type: short
    difficulty: 2
    question: ReAct 和 Plan-and-Execute 有什么区别？你会在什么场景下选哪一个？
    key_points:
      - {text: "说明 ReAct 走一步看一步，Plan-and-Execute 先生成结构化计划再执行并在检查点重规划", dim: concept}
      - {text: "说明 ReAct 长任务易跑偏漏步骤，Plan-and-Execute 计划可能一开始就错", dim: principle}
      - {text: "给出选择依据：探索性任务用 ReAct，结构清晰步骤多的任务用 Plan-and-Execute，可混合待办清单", dim: engineering}
      - {text: "结合项目说明计划审核、重规划上限或执行器内部小循环的设计", dim: project}
    reference: |
      **区别在控制方式**：
      - **ReAct**：每一步根据上一步的观察临时决定下一步。灵活，适合探索；但长任务容易忘记目标、漏步骤、在局部打转。
      - **Plan-and-Execute**：先由规划器输出结构化的步骤清单，再由执行器逐步完成，每步后检查「计划是否仍成立」，不成立就只针对剩余部分重规划。目标一致性好、可以执行前审核；但计划一开始就可能错，必须有检查点和重规划上限。

      **选择依据**：
      - 下一步强依赖上一步结果、方向不确定的任务（故障排查）→ ReAct，方面多时加一个待办清单工具防遗漏；
      - 结构清晰、步骤多、必须覆盖所有部分的任务（月度报告、跨园区对比）→ Plan-and-Execute。

      **项目里**：园区运营 Agent 的故障排查用 ReAct；月度报告用 Plan-and-Execute，计划先在工作台给运营经理确认，代码校验四个板块齐全，每一步内部是最多 4 步的小 ReAct 循环，重规划最多 2 次。
    oral: |
      我理解两者的区别在于控制方式。ReAct 是走一步看一步，每一步根据观察决定下一步，很灵活，但长任务容易漏步骤、跑偏。Plan-and-Execute 是先出一个结构化的计划，再逐步执行，每步后检查计划还成不成立，不成立就重规划剩下的部分。
      所以探索性的任务我用 ReAct，比如故障排查；结构清晰、必须覆盖全的任务用 Plan-and-Execute，比如月度运营报告。
      我们项目的月报就是这样，计划先在工作台给运营经理确认，代码检查四个板块都在，每一步内部再跑一个小的 ReAct 循环，重规划最多两次。
  - id: d34-i2
    kp: d34-k2
    type: scenario
    difficulty: 3
    question: 你给 Agent 加了一轮自我反思，成本几乎翻倍，但评测上效果没提升，个别问题还被改错了。你怎么分析原因？怎么改？
    key_points:
      - {text: "指出无外部反馈的内在自省在推理任务上常常无效甚至变差，引用相关研究结论", dim: principle}
      - {text: "检查评审标准是否模糊、是否同模型同上下文、是否默认返回最后一版", dim: engineering}
      - {text: "改为只在有客观检查的环节加反思：SQL 执行报错、测试结果、Schema 校验、数据核对", dim: engineering}
      - {text: "加最大轮次、提前停止、保留最佳版本，并与相同调用次数的方案对照评测", dim: engineering}
      - {text: "结合项目说明哪些分支保留反思、哪些去掉，用评测数据决定", dim: project}
    reference: |
      **分析原因**：
      1. **反馈来源**：如果是同一个模型、同一套上下文，只问「请检查是否正确」，这是内在自省。Huang 等人 2023 年的研究表明，在推理任务上模型很难靠自己纠错，有时反而改错；很多早期研究的提升来自用了标准答案等外部信号。
      2. **评审标准**：没有明确清单，评审只会给泛泛的意见，修改者没有方向。
      3. **版本选择**：代码默认返回最后一版，没有比较修改前后谁更好。
      4. **评估方法**：是否和相同调用次数的方案（比如采样两次择优）比较过。

      **怎么改**：
      - **只在有外部信号的地方加反思**：SQL 用 EXPLAIN 和试执行报错；数字类回答与数据库核对；结构化输出用 Schema 校验；代码跑测试。把具体错误交给模型修改。
      - **评审清单化**：每条可逐项判断，比如「每个数字有来源」「四个板块齐全」。
      - **工程约束**：最多 2~3 轮；检查通过就停；每轮打分保留最佳版本。
      - **用数据决定**：同一评测集对比无反思、有反思、相同调用次数的替代方案，看正确率、成本和延迟。

      **项目里**：园区运营 Agent 去掉了闲聊和简单查询上的反思，只在 Text2SQL 分支保留「执行报错 → 修正」的循环，最多 3 轮。
    oral: |
      我会先看反思用的是什么反馈。如果是同一个模型、同样的上下文，只问一句请检查是否正确，那是纯自省。研究已经表明，推理类任务上模型很难靠自己纠错，有时还会把对的改错，所以效果不提升很正常。另外我会看评审有没有明确清单、代码是不是默认返回最后一版。
      改法是只在有外部信号的地方加反思，比如 SQL 拿数据库的真实报错去改、数字和数据库核对、结构化输出用 Schema 校验。再加最多两三轮、检查通过就停、保留最好的版本。
      最后用同一个评测集对比有没有反思，以及相同调用次数的其他方案。我们园区项目就是只在 Text2SQL 那里保留了执行报错修正的循环，其他地方都去掉了。
  - id: d34-i3
    kp: d34-k3
    type: design
    difficulty: 4
    question: 请设计一个「园区月度运营报告」生成 Agent：需要汇总告警、工单、客流、能耗四类数据，给出同比环比和改进建议。要求数据准确、结构完整，且运营经理能在生成前调整内容范围。说明规划、执行、校验和反思怎么设计。
    key_points:
      - {text: "规划：固定四板块骨架加模型填充细节，计划结构化并带 depends_on 和 done_when，代码校验无环、步数上限、板块齐全", dim: concept}
      - {text: "人工审核：计划在工作台展示，运营经理确认或修改后再执行", dim: project}
      - {text: "执行：无依赖的数据查询并发执行并限流，每步是只读小 ReAct，子任务只返回统计摘要", dim: engineering}
      - {text: "校验与反思：数字与数据库核对、清单检查、最多两到三轮修改并保留最佳版本", dim: engineering}
      - {text: "兜底与评测：数据缺失时标注而不编造，重规划有上限；用评测集衡量数字准确率、板块完整率、成本延迟", dim: engineering}
    reference: |
      **一、规划（Plan）**
      - **固定骨架 + 模型填充**：告警、工单、客流、能耗四个板块是必选骨架；每个板块内部查哪些维度（按区域、按类型、同比环比）由规划器决定。
      - 计划为结构化数据：每步有 goal、tool_hint、depends_on、done_when。代码校验：无循环依赖、不超过 8 步、四个板块齐全、工具都在注册表里且当前用户有权限；不通过就带着问题让规划器重做。

      **二、人工审核**
      计划在 Vue3 运营工作台展示，运营经理可以删减板块、增加关注区域，确认后再执行（Day 37 用 interrupt 实现等待）。

      **三、执行（Execute）**
      - 按依赖图调度：本月和上月各类数据查询互不依赖，用 asyncio.gather 并发，Semaphore 限制并发数保护 IoT 平台；
      - 每一步是只读工具的小 ReAct 循环（最多 4 步）；
      - 子任务只返回统计摘要，不把原始明细带回主流程，避免上下文膨胀；
      - 检查点判断计划是否成立，例如某园区没有能耗数据，就重规划为「标注能耗数据缺失」，重规划最多 2 次。

      **四、校验与反思（Reflect）**
      - **外部核对**：报告中的每个数字都必须能对应到某一步的查询结果，代码逐个比对；同比环比由代码计算，不让模型算。
      - **清单检查**：四个板块齐全、每个结论有数据依据、建议与问题对应。
      - 不通过项交给模型针对性修改，最多 2~3 轮，每轮打分保留最佳版本。

      **五、兜底与评测**
      数据缺失如实标注，绝不编造；超时或超预算时输出已完成板块并注明。用历史月份做评测集，指标包括数字准确率、板块完整率、人工评分、生成耗时和成本。
    oral: |
      我会分规划、审核、执行、校验四段来设计。规划用固定骨架加模型填充，四个板块是必选的，每个板块里查什么由模型定。计划是结构化的，每步有依赖和完成标准，代码检查没有循环依赖、步数不超限、四个板块都在。
      计划先放到工作台给运营经理确认，可以删改板块。执行时没有依赖的数据查询并发跑，限流保护 IoT 平台，每步是只读的小循环，只返回统计摘要。某个园区缺能耗数据就重规划成标注缺失，最多重规划两次。
      校验是关键：同比环比由代码算，报告里每个数字都要能对上查询结果，再按清单检查，不通过的地方让模型针对性改，最多两三轮保留最好的版本。最后用历史月份做评测集，看数字准确率、完整率和成本。
