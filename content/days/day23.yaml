day: 23
phase: 3
title: 切片策略：大小、重叠、结构化切分与上下文增强
goals:
  - 能解释为什么要切片，以及 chunk 太大、太小各会导致什么问题，并给出调参的方法而不是固定数字
  - 能按文档结构切分：中文标点递归切分、按标题层级切分、表格整体处理，并给每个 chunk 加标题路径前缀
  - 能说清父子切片（小块检索、大块喂模型）和相邻块扩展解决什么问题、代价是什么
  - 能讲清 Anthropic Contextual Retrieval 的做法、收益数据和成本，并给出低成本的替代方案
minutes: 60
resources:
  - title: "Anthropic：Introducing Contextual Retrieval"
    url: "https://www.anthropic.com/engineering/contextual-retrieval"
    kind: article
    lang: en
    minutes: 20
    note: "重点读「Introducing Contextual Retrieval」「Implementing Contextual Retrieval」和「Performance improvements」三节，记住失败率从 5.7% 降到 2.9% 再到 1.9% 这组数字和它的成本前提"
  - title: "Docling：Chunking 概念文档"
    url: "https://docling-project.github.io/docling/concepts/chunking/"
    kind: doc
    lang: en
    minutes: 10
    note: "看 Hierarchical Chunker 和 Hybrid Chunker 两节，理解「先按文档结构切，再按 Token 上限拆分和合并」的思路，以及 repeat_table_header 这类表格选项"
  - title: "Hello-Agents 第八章 8.3.4 构建私有化 RAG 系统"
    url: "https://github.com/datawhalechina/hello-agents/blob/main/docs/chapter8/%E7%AC%AC%E5%85%AB%E7%AB%A0%20%E8%AE%B0%E5%BF%86%E4%B8%8E%E6%A3%80%E7%B4%A2.md"
    kind: repo
    lang: zh
    minutes: 15
    note: "只看「（2）智能分块策略」：Markdown 结构感知 + 按 Token 分块 + 重叠，对照今天的结构化切分讲法"
