knowledge_points:
  - id: d23-k1
    name: 为什么要切片：大小与重叠的权衡
    level: P0
    summary: 切片是检索的最小单位；太大语义稀释、塞不下，太小断章取义；重叠缓解边界截断但会增加冗余，参数要用评测集调
    analogy: |
      像前端做**代码分割**：整个应用打成一个 bundle，首屏要下载一大堆用不上的代码（chunk 太大，无关内容稀释）；拆得太碎，一个页面要发几十个请求，每块单独看不出完整功能（chunk 太小，断章取义）。合适的粒度要按路由和使用场景切。
      **不一样的地方**：代码分割的边界是模块，天然清晰；文本的语义边界模糊，一个条件和它的例外可能隔了两段，切错了不会报错，只会答错。
    why: |
      切片是 RAG 里**最影响效果、又最容易被忽视**的参数之一。同样的文档、同样的模型，切片方式不同，检索命中率可能差很多。
      p1 的「切片入库模块」今天解锁；面试官问「你们 chunk size 设多少，为什么」几乎是必考题，标准答案不是一个数字，而是调参方法。
    problem: |
      整篇文档做一个向量，一份 50 页的制度里讲了几十个话题，向量是这些话题的「平均」，和任何具体问题都不够像；而且整篇塞给模型也装不下、成本高。
      切得太碎又会出现「该假期不计入考勤」这种脱离上下文就看不懂的片段。需要在两者之间找到平衡。
    principle: |
      **一、为什么必须切片**

      - **向量的表达能力有限**：一个向量是一段文本语义的压缩，文本越长、话题越多，向量越「平均」，和具体问题的相似度越低。
      - **上下文预算有限**：检索结果要拼进 Prompt，chunk 太大，放几条就占满上下文，还会引入大量无关内容（见 Day 13、Day 20）。
      - **引用要精确**：chunk 越聚焦，引用越能精确到条款和页码。

      **二、chunk 大小的权衡**

      ```mermaid
      flowchart LR
        S["chunk 太小 一两句话"] --> S1["语义完整性差 指代丢失"]
        S --> S2["条件和结论被拆开"]
        M["chunk 适中 一个完整条款或小节"] --> M1["语义聚焦且自洽"]
        L["chunk 太大 整章"] --> L1["向量被多个话题稀释"]
        L --> L2["占用上下文 噪声多 成本高"]
      ```

      - **太小**：「该假期」「上述情况」这类指代脱离上下文无法理解；规则的条件在一个 chunk、例外在另一个 chunk。
      - **太大**：一个 chunk 讲了年假、病假、婚假，问年假时向量相似度不够高；即使命中，喂给模型的大部分内容也是无关的。
      - **常见起点**：几百 Token 一个 chunk（中文大约几百到一千字），重叠为 chunk 大小的 10%~20%。这只是起点，最终要按你的文档和问题调。

      **三、重叠（overlap）的作用和代价**

      - **作用**：相邻 chunk 共享一段内容，降低「关键句恰好被切在边界上」导致两边都不完整的概率。
      - **代价**：存储和向量化成本增加；检索时相邻的两个 chunk 可能同时被召回，内容重复，挤占 Top-K 名额。
      - **重叠不能替代结构化切分**：按标题和条款切好之后，重叠只是兜底手段（见本日 k2）。

      **四、怎么调参：用评测集说话**

      ```mermaid
      flowchart TD
        A["准备问题集 标注期望段落"] --> B["选几组参数 如 300 500 800 Token"]
        B --> C["分别切片入库"]
        C --> D["跑检索 计算命中率"]
        D --> E["抽查失败案例 看是太碎还是太粗"]
        E --> F{"满意吗"}
        F -->|"否"| B
        F -->|"是"| G["固定参数 记录到配置"]
      ```

      - 用 Day 20 的 golden set 思路：几十个真实问题，每个标注正确答案所在段落。
      - 对比不同参数下的**检索命中率**（正确段落是否在 Top-K 里），再看失败案例：是因为太碎（信息不全）还是太粗（被稀释）。
      - 不同文档类型可以用不同策略：FAQ 一问一答一个 chunk，长篇制度按条款切。

      **五、度量单位：用 Token 而不是字符**

      Embedding 模型和 LLM 都按 Token 计算长度和上限。按字符切时，中英文混排的 Token 数差别很大，可能超出 Embedding 模型的输入上限被**静默截断**。生产中建议用与模型匹配的 tokenizer 计算长度。
    scenarios: |
      - **员工手册入库**：先用 500 Token 加 15% 重叠作为起点，再用 50 个问题对比 300、800 两组参数的命中率。
      - **FAQ 知识库**：每个「问题 + 答案」天然是一个 chunk，不需要按长度切。
      - **合同条款**：一个条款作为一个 chunk，条款太长再按款项拆分。
    pitfalls: |
      - **照抄网上的「最佳 chunk size」**：没有通用最优值，必须用自己的文档和问题评测。
      - **按字符数硬切**：一句话被切成两半，表格被拦腰截断。
      - **重叠设得很大以为越多越安全**：存储和成本翻倍，检索结果大量重复。
      - **chunk 超过 Embedding 模型输入上限**：后半部分被静默截断，这部分内容永远检索不到。
      - **改了切片参数不重建全部数据**：新旧切法混在一起，难以评估效果。
    interview_asks:
      - question: "你们的 chunk size 设多少？为什么？怎么确定的？"
        answer: "没有万能字数。以能装下一个完整条款或段落为准，再用评测看召回。太大则不相关内容和相关内容缠在一起，太小则上下文断了。数字是评出来的，不是默认 500。"
      - question: "chunk 太大和太小分别会有什么问题？"
        answer: "太大：向量被无关句子稀释，提示里也塞进噪音。太小：条款被切断，单看这一块不知道主语。两种都会让答案变差。"
      - question: "overlap 有什么作用？是不是越大越好？"
        answer: "重叠是为了把切在边界上的句子在下一块里保留一点。太大会让同一句话出现很多次，占存储和名额。通常一小段重叠就够，要用评测看，不是越大越安全。"
    project_example: |
      **p1 企业知识库问答**的「切片入库模块」今天解锁。调参过程可以这样做：
      - 准备 50 个人事制度问题，标注答案所在条款；
      - 分别用 300、500、800 Token 切片入库，计算 Top-5 命中率；
      - 抽查失败案例：300 时「该假期」类指代问题多，800 时年假和病假被切进同一个 chunk、相似度不够；最终选 500 左右并按条款边界对齐。
      把这张对比表放进项目文档，面试时就能回答「为什么是这个数」。
  - id: d23-k2
    name: 结构化切分：按标题、段落、条款和表格切
    level: P0
    summary: 优先沿文档自身结构切分（标题、条款、段落、句子），表格整体处理，并给每个 chunk 加上标题路径前缀
    analogy: |
      像拆分一个大 Vue 组件：你会按**功能区块**（头部、列表、表单）拆子组件，而不是每 100 行硬切一刀。文档也一样，按章节、条款、段落切，每块才是一个完整的意思。
      **不一样的地方**：组件拆分有 props 显式传递依赖；文本 chunk 被切出来后，它属于哪一章、哪个制度的信息就丢了，所以要**手动把标题路径拼回 chunk 里**，相当于给它补上「props」。
    why: |
      企业文档（制度、手册、合同）结构性很强，标题和条款编号就是天然的语义边界。沿结构切分，chunk 语义完整、引用精确。
      加标题路径前缀几乎是零成本的改进，能明显缓解「chunk 脱离上下文」的问题，是面试里讲切片优化时最实用的一点。
    problem: |
      固定长度切分不看内容，经常把一个条款的条件和例外切开、把表格拦腰截断。
      即使按段落切开，「第三条 每年可享受 5 天」这样的 chunk 也看不出是哪个制度的哪种假期，问「年假几天」时相似度不高。
    principle: |
      **一、切分策略的梯度**

      | 策略 | 做法 | 适合 |
      |---|---|---|
      | 固定长度 | 每 N 个 Token 切一刀 | 无结构的纯文本兜底 |
      | 递归切分 | 按段落、换行、句号、逗号依次尝试，直到长度合适 | 一般文本 |
      | 结构切分 | 按标题层级、条款编号、Markdown 标题切 | 制度、手册、合同 |
      | 语义切分 | 按相邻句子的向量相似度变化切 | 话题切换频繁的长文 |

      实际项目常用**组合**：先按结构切出章节和条款，超长的再递归切分，太短的和同标题下的相邻块合并。Docling 的 HybridChunker 就是「先按文档结构，再按 Token 上限拆分和合并」的思路。

      **二、中文递归切分要自己加分隔符**

      LangChain 的 `RecursiveCharacterTextSplitter` 默认分隔符是 `["\n\n", "\n", " ", ""]`，是为有空格分词的英文设计的。中文没有空格，按默认配置会在找不到换行时**直接按字符硬切**，把句子切成两半。所以要加上中文句号、问号、感叹号、分号、逗号等标点。

      **三、表格整体处理**

      - 表格作为一个整体 chunk，不和前后正文混切。
      - 表格超长时按行拆分，**每段都重复表头**，否则后半段只有数字没有列名（Docling 的 HybridChunker 有 `repeat_table_header` 选项）。

      **四、标题路径前缀**

      ```mermaid
      flowchart LR
        D["解析后的 Block 带 heading_path"] --> S["按条款切分"]
        S --> P["拼接前缀 制度名 章 节"]
        P --> E["向量化 前缀加正文"]
        P --> T["存储 正文单独存 前缀单独存"]
      ```

      例如原文 chunk 是「每年可享受 5 天，满 10 年后为 10 天。」，加前缀后变成「《考勤管理办法》> 第三章 休假管理 > 3.2 年假：每年可享受 5 天，满 10 年后为 10 天。」。
      - 向量化和关键词索引都用**带前缀**的文本，问「年假几天」时就能命中。
      - 展示给用户时可以只展示正文，前缀作为出处。

      **五、稳定的 chunk_id**

      增量更新和评测都需要 chunk 有稳定的 id。推荐用 `doc_id + 版本 + 序号` 或内容的 SHA-256 生成；**不要用 Python 内置的 `hash()`**，它对字符串默认带随机种子，每次进程重启结果都不同。
    scenarios: |
      - **制度文档**：按「章 > 节 > 条」切分，每个条款一个 chunk，前缀为制度名和章节路径。
      - **Markdown 技术文档**：按 `#`、`##` 标题切，代码块不拆开。
      - **产品参数表**：表格整体一个 chunk，超长按行拆分并重复表头。
      - **无结构的会议记录**：递归切分加中文标点分隔符兜底。
    code: |
      ```python
      # 依赖：uv add langchain-text-splitters
      import hashlib

      from langchain_text_splitters import RecursiveCharacterTextSplitter

      splitter = RecursiveCharacterTextSplitter(
          chunk_size=500,          # 默认按字符计长；生产建议换成与模型匹配的 tokenizer 计长
          chunk_overlap=60,
          separators=["\n\n", "\n", "。", "！", "？", "；", "，", " ", ""],   # 中文要自己加标点
      )


      def make_chunks(doc_id: str, version: str, heading_path: str, text: str) -> list[dict]:
          chunks = []
          for i, piece in enumerate(splitter.split_text(text)):
              chunk_id = hashlib.sha256(f"{doc_id}|{version}|{i}".encode()).hexdigest()[:16]   # 不要用内置 hash()
              chunks.append({
                  "chunk_id": chunk_id,
                  "content": piece,                                  # 展示用正文
                  "embed_text": f"{heading_path}\n{piece}",          # 向量化和全文检索用带前缀的文本
                  "heading_path": heading_path,
              })
          return chunks
      ```
    pitfalls: |
      - **中文用默认分隔符**：找不到换行就按字符硬切，句子被拦腰截断。
      - **表格拆分不重复表头**：后半段只剩数字，模型无法知道每列含义。
      - **前缀只用于展示，没参与向量化**：检索效果没有任何提升。
      - **前缀太长**：每个 chunk 都带一大段相同的制度简介，反而让所有 chunk 彼此更像。
      - **用 Python 内置 `hash()` 生成 chunk_id**：进程重启后 id 全变，增量更新和评测标注全部失效。
    interview_asks:
      - question: "你们是怎么切分文档的？有没有考虑文档结构？"
        answer: "先按标题、条款、段落这些结构切，结构块仍然太长再按大小切。不从第一个字开始盲切。表格单独处理。这样每一块有自己的标题路径。"
      - question: "中文文档用 LangChain 的递归切分要注意什么？"
        answer: "默认分隔符按英文段落和空格，中文往往没有空格，会切在句子中间或几乎不切。要改成按中文标点和换行切，并检查实际切出来的块，不要用默认就上线。"
      - question: "表格类内容怎么切片？"
        answer: "整表不大就整表一块，并带上表题。大表按行切，但每一行都带表头和表题。不要按固定字数把一行切成两半。"
    project_example: |
      **p1 企业知识库问答**的切片规则：
      - 利用 Day 22 解析出的 `heading_path` 和 `block_type`，按「章 > 节 > 条」切分；超过 500 Token 的条款用加了中文标点的递归切分拆开。
      - 表格单独成块，超长时按行拆并重复表头。
      - 每个 chunk 存两份文本：`content`（展示）和 `embed_text`（带「制度名 > 章 > 节」前缀，用于向量化和全文检索）。
      - `chunk_id` 用 `doc_id + 版本 + 序号` 的 SHA-256 生成，保证评测标注长期有效。
      在评测集上对比「无前缀 / 有前缀」两组的 Top-5 命中率，是你简历上一个可量化的优化点。
    freshness: |
      核对于 2026-11：langchain-text-splitters 当前为 1.1.x，导入路径为 `from langchain_text_splitters import RecursiveCharacterTextSplitter`，默认分隔符为 `["\n\n", "\n", " ", ""]`、默认按字符计长，官方文档建议为中文、日文等无空格语言添加全角标点分隔符。Docling 的 HybridChunker 支持 `merge_peers`（合并同标题下的小块）和 `repeat_table_header` 等选项。以官方文档为准。
    sources:
      - {title: "LangChain - Recursive Text Splitter", url: "https://docs.langchain.com/oss/python/integrations/splitters/recursive_text_splitter"}
      - {title: "Docling - Chunking", url: "https://docling-project.github.io/docling/concepts/chunking/"}
  - id: d23-k3
    name: 父子切片与相邻块扩展
    level: P1
    summary: 用小块做检索保证精准，命中后返回它所在的大块或前后相邻块给模型，兼顾检索精度和上下文完整
    analogy: |
      像列表页和详情页：搜索时用**列表项的标题和摘要**匹配（小块，精准），点进去展示**完整详情页**（大块，信息全）。
      **不一样的地方**：前端详情页是固定的；父子切片里多个小块可能指向同一个父块，要去重，而且父块太大会把 Token 预算吃光。
    why: |
      「切小了检索准但信息不全，切大了信息全但检索不准」是切片的根本矛盾。父子切片是解决这个矛盾的经典手段，LangChain 和 LlamaIndex 都有对应组件（ParentDocumentRetriever、句子窗口检索等）。
      面试里讲到切片优化，能说出这个方案和它的代价，是加分项。
    problem: |
      一个条款的结论在第一句，条件和例外在后面几句。小 chunk 检索能精准命中结论句，但模型只看到结论，漏了例外；大 chunk 信息完整，但向量被稀释，排名靠后。
    principle: |
      **一、父子切片（Small-to-Big）**

      ```mermaid
      flowchart TD
        P["父块 一个完整小节 约 1500 Token"] --> C1["子块 1 约 300 Token"]
        P --> C2["子块 2"]
        P --> C3["子块 3"]
        Q["用户问题"] --> R["在子块上做向量检索"]
        R --> H["命中子块 2"]
        H --> B["通过 parent_id 取父块"]
        B --> G["父块去重后交给 LLM"]
      ```

      - **入库**：先切父块（完整小节），每个父块再切成若干子块；子块向量化入库，记录 `parent_id`；父块原文单独存储。
      - **检索**：用问题在子块上检索，精准命中。
      - **生成**：用命中子块的 `parent_id` 取父块，多个子块指向同一父块时**去重**，再把父块交给模型。

      **二、相邻块扩展（句子窗口）**

      不建立父子关系，而是命中某个 chunk 后，按 `order` 取它前后各 1~2 个相邻 chunk 一起返回。实现简单，只依赖解析时保存的顺序字段（见 Day 22）。

      **三、代价与注意事项**

      - **Token 开销变大**：Top-5 子块扩展成 5 个父块，可能有几千 Token，需要控制父块大小或减少数量。
      - **去重和排序**：多个子块命中同一父块要合并；扩展后的上下文仍要按相关性排序。
      - **引用粒度**：引用展示用子块定位（更精确），模型阅读用父块（更完整）。
    scenarios: |
      - **条款类制度**：用子块命中「年假 5 天」，把整条（含「试用期不享受」的例外）交给模型。
      - **长篇技术文档**：句子窗口检索，命中一句话后带上前后两句。
      - **FAQ**：问答本身就短小完整，不需要父子切片。
    pitfalls: |
      - **父块太大**：几个父块就占满上下文，反而引入噪声，成本上升。
      - **不去重**：同一个父块因多个子块命中被重复放进 Prompt。
      - **相邻块跨越了章节边界**：扩展时把另一个制度的内容也带进来，应限制在同一 heading_path 内。
      - **所有场景都用父子切片**：短小完整的 FAQ 增加了复杂度却没有收益。
    interview_asks:
      - question: "什么是父子切片？它解决了什么问题？"
        answer: "用小块去检索，命中后把更大的父块送给模型。小块容易匹配上具体句子，父块又有完整上下文。解决的是「检索要细、阅读要全」的矛盾。"
      - question: "父子切片有什么代价？你会怎么控制？"
        answer: "存储更多，命中不同子块可能带回同一个大父块，提示里会重复。父块要有上限，返回前按父块去重。不是所有文档都需要，结构清楚的短制度可以不用。"
    project_example: |
      在 **p1 企业知识库问答**里，「年假」条款很长：第一句讲天数，后面讲试用期、离职折算等例外。只用 300 Token 小块时，模型常常漏掉例外。
      改进：条款作为父块，子块 300 Token 做检索，命中后返回整条条款并按 `parent_id` 去重，最多取 4 个父块。
      在评测集里专门统计「含例外条件」的问题，对比改进前后的回答正确率，同时记录平均输入 Token 数的变化，说明你权衡了效果和成本。
  - id: d23-k4
    name: 上下文增强切片：Contextual Retrieval
    level: P1
    summary: 入库时为每个 chunk 生成一小段「它在全文中讲什么」的说明并拼在前面，再做向量和关键词索引，显著降低检索失败率
    analogy: |
      像给每个组件文件顶部写一段**注释**：「这是订单详情页的价格计算部分，依赖优惠券模块」。别人单独打开这个文件也能马上知道它的上下文。
      **不一样的地方**：代码注释是人写一次；Contextual Retrieval 要**调用大模型为每个 chunk 生成说明**，chunk 有几十万个时成本和耗时都要认真算。
    why: |
      这是 Anthropic 官方发布的、有量化数据支撑的检索改进方法，也是近两年 RAG 面试里被频繁提起的话题。
      理解它的原理、收益和成本，再结合你自己项目的低成本版本（标题路径前缀），能体现你对前沿方案的判断力。
    problem: |
      切片后 chunk 失去了上下文。Anthropic 举的例子：「该公司的营收比上一季度增长了 3%」——哪家公司？哪个季度？这个 chunk 单独看无法回答「ACME 公司 2023 年第二季度营收增长多少」。
    principle: |
      **一、做法**

      ```mermaid
      sequenceDiagram
        participant J as 入库任务
        participant L as 小模型
        participant E as Embedding 服务
        participant DB as 索引库
        J->>L: 整篇文档加当前 chunk 请生成简短上下文
        L-->>J: 50 到 100 Token 的说明
        J->>J: 说明拼在 chunk 前面
        J->>E: 对拼接后的文本做向量化
        J->>DB: 写入向量索引和关键词索引
      ```

      - 对每个 chunk，把**整篇文档 + 这个 chunk** 交给一个便宜的模型，让它写一段 50~100 Token 的说明（这个 chunk 在全文中讲什么）。
      - 说明拼在 chunk 前面，**同时用于向量化（Contextual Embeddings）和 BM25 关键词索引（Contextual BM25）**。

      **二、Anthropic 公布的效果（Top-20 检索失败率）**

      | 方案 | 失败率 | 相对降低 |
      |---|---|---|
      | 普通向量检索 | 5.7% | 基线 |
      | 上下文向量 | 3.7% | 35% |
      | 上下文向量 + 上下文 BM25 | 2.9% | 49% |
      | 再加重排 | 1.9% | 67% |

      **三、成本：靠 prompt caching 压下来**

      每个 chunk 都要把整篇文档发给模型，看起来很贵。但同一篇文档的多个 chunk 共享相同的文档前缀，用 prompt caching（见 Day 19）只需加载一次文档。Anthropic 按 800 Token 的 chunk、8k Token 的文档估算，一次性成本约为**每百万文档 Token 1.02 美元**。

      **四、它的边界**

      - 文章同时提到：给 chunk 加**通用的文档摘要**收益很有限，关键是**针对这个 chunk** 的说明。
      - 数据来自 Anthropic 的评测集和模型，在你的数据上收益多少需要自己评测。
      - 入库时间和成本增加，文档更新时要重新生成。

      **五、低成本替代：标题路径前缀**

      在本日 k2 讲的「制度名 > 章 > 节」前缀，本质上是**用文档结构免费生成的上下文**。结构清晰的企业制度，先用这个零成本方案；结构差、指代多的文档（会议纪要、财报叙述）再考虑调用模型生成说明。
    scenarios: |
      - **财报、研报**：大量「该公司」「本季度」指代，chunk 单独看不懂，适合生成上下文。
      - **结构清晰的制度手册**：标题路径前缀已经够用，不必为每个 chunk 调模型。
      - **知识库体量很小**：小于约 20 万 Token 可以考虑直接放进上下文（见 Day 21）。
    pitfalls: |
      - **只给向量加上下文，忘了关键词索引**：Anthropic 的数据显示两者都加效果更好。
      - **用通用文档摘要代替 chunk 专属说明**：收益有限。
      - **不开 prompt caching**：每个 chunk 都完整计费整篇文档，成本可能高出很多。
      - **照搬文章的数字当作自己系统的预期**：必须在自己的评测集上验证。
      - **生成的说明有错误**：模型可能误解 chunk，说明里引入错误信息，需要抽检。
    interview_asks:
      - question: "你了解 Anthropic 的 Contextual Retrieval 吗？它解决什么问题？"
        answer: "切片离开原文后看不出它在讲哪份文件的哪一节。做法是给每块前面加上一段短上下文，再嵌入。检索时这块自己就带着场景，少一些「这句话很像但不是这份文件」的误命中。"
      - question: "为每个 chunk 调一次大模型成本很高，怎么控制？有没有更便宜的替代方案？"
        answer: "只对长文档、标题不够用的块做。可以用小模型，或直接用已经解析出的标题路径拼一段，不必每块都叫大模型。标题路径往往就够用。"
    project_example: |
      **p1 企业知识库问答**里，人事制度结构清晰，先用零成本的标题路径前缀；对「会议纪要」这类结构差的文档，单独开一个 Contextual Retrieval 通道：用便宜模型 + prompt caching 为每个 chunk 生成说明。
      上线前在评测集上对比三组：无前缀、标题前缀、模型生成说明，记录命中率和每千份文档的入库成本，按性价比决定哪些文档类型启用。
      这样面试时你讲的不是「我用了某个新方法」，而是「我评估过它的收益和成本，然后有选择地用」。
    freshness: |
      核对于 2026-11：Anthropic 工程博客《Introducing Contextual Retrieval》发布于 2024-09-19。文中数据：Top-20 检索失败率 5.7%（基线）→ 3.7%（上下文向量，降 35%）→ 2.9%（再加上下文 BM25，降 49%）→ 1.9%（再加重排，降 67%）；上下文说明 50~100 Token；借助 prompt caching 的一次性成本约每百万文档 Token 1.02 美元（按 800 Token chunk、8k Token 文档估算）。这些数字基于 Anthropic 当时的模型和评测集，效果请在自己的数据上验证。
    sources:
      - {title: "Anthropic - Introducing Contextual Retrieval", url: "https://www.anthropic.com/engineering/contextual-retrieval"}
test:
  - id: d23-t1
    kp: d23-k1
    type: single
    question: 把一份 50 页、涵盖几十个话题的制度整篇做成一个向量入库，问「年假有几天」时检索效果很差。最主要的原因是？
    options:
      - "向量维度不够高，存不下 50 页的内容"
      - "数据库对长文本的存储有长度限制"
      - "一个向量是多个话题的平均，和具体问题的相似度被稀释"
      - "Embedding 模型无法处理中文长文档"
    answer: [2]
    explain: |
      向量是一段文本语义的压缩，文本覆盖的话题越多，向量越像「所有话题的平均」，和任何一个具体问题都不够像。而且很多 Embedding 模型有输入长度上限，超长部分会被截断。
      A 维度是固定的，问题不在维度；B 数据库能存长文本；D 不是语言问题，英文长文档同样会被稀释。
  - id: d23-t2
    kp: d23-k1
    type: multi
    question: chunk 切得过小（比如每个只有一两句话）会带来哪些问题？
    options:
      - "「该假期」「上述情况」等指代脱离上下文，无法理解"
      - "规则的条件和例外被拆到不同 chunk，模型只看到一半"
      - "单个向量包含的话题太多，相似度被稀释"
      - "chunk 数量暴增，存储和向量化成本上升"
    answer: [0, 1, 3]
    explain: |
      切得太小，语义完整性差：指代丢失、条件与结论分离；chunk 数量多，存储、向量化和检索的成本都会上升。
      C 是 chunk 太大的问题，小 chunk 话题单一，不存在稀释。
  - id: d23-t3
    kp: d23-k1
    type: judge
    question: chunk_overlap 设得越大越好，因为重叠越多，关键信息被切断的概率越低，没有明显代价。
    answer: false
    explain: |
      错误。重叠越大，chunk 数量和存储、向量化成本越高；检索时相邻 chunk 内容大量重复，可能同时被召回，挤占 Top-K 名额并浪费 Token。
      常见做法是重叠设为 chunk 大小的 10%~20%，并优先通过结构化切分对齐语义边界。
  - id: d23-t4
    kp: d23-k1
    type: single
    question: 面试官问「你们 chunk size 为什么设 500 Token」，以下哪个回答最能体现工程能力？
    options:
      - "网上的最佳实践都说 500 最好，我们就用了"
      - "用标注好的问题集对比了几组参数的命中率，并分析了失败案例后选定的"
      - "500 是 Embedding 模型的最大输入长度，所以用满"
      - "框架的默认值就是 500，没有必要修改"
    answer: [1]
    explain: |
      chunk size 没有通用最优值，和文档类型、问题类型、Embedding 模型都有关。用自己的评测集对比多组参数，并分析失败案例是太碎还是太粗，才是有依据的选型。
      A、D 照搬别人的数字；C 用满模型上限往往导致话题稀释，而且还要给前缀留余量。
  - id: d23-t5
    kp: d23-k2
    type: single
    question: 下面的代码用于切分中文制度文档。测试发现很多 chunk 的开头和结尾是半句话。最可能的原因是？
    code: |
      from langchain_text_splitters import RecursiveCharacterTextSplitter

      splitter = RecursiveCharacterTextSplitter(
          chunk_size=500,
          chunk_overlap=50,
      )
      chunks = splitter.split_text(policy_text)
    lang: python
    options:
      - "chunk_overlap 太小，应该改成 250"
      - "chunk_size 太大，应该改成 100"
      - "split_text 只能处理英文，中文要用别的函数"
      - "默认分隔符没有中文标点，找不到换行时就按字符硬切"
    answer: [3]
    explain: |
      默认分隔符是 `["\n\n", "\n", " ", ""]`。中文没有空格，一段很长的文字没有换行时，最后只能用空字符串按字符切，句子就被拦腰截断。应加上「。」「！」「？」「；」「，」等中文标点。
      A、B 调参数不能解决分隔符的问题；C split_text 可以处理中文。
  - id: d23-t6
    kp: d23-k2
    type: multi
    question: 处理文档中的表格时，以下哪些做法是合理的？
    options:
      - "表格作为整体 chunk，不和前后正文混切"
      - "超长表格按行拆分，每段都重复表头"
      - "把表格和前面的段落强制按固定长度切在一起"
      - "给表格 chunk 加上表格标题和所属章节作为前缀"
      - "删除表格中的数字，只保留文字描述"
    answer: [0, 1, 3]
    explain: |
      表格要保持行列结构完整；拆分时重复表头，后半段才知道每列含义；加上标题和章节前缀，检索时更容易命中。
      C 会把表格拦腰截断；E 表格里的数字往往就是答案。
  - id: d23-t7
    kp: d23-k2
    type: judge
    question: 给 chunk 加标题路径前缀时，前缀应该参与向量化和全文检索，而不只是用来在界面上展示出处。
    answer: true
    explain: |
      正确。前缀的价值在于让 chunk「自带上下文」：「每年可享受 5 天」加上「考勤管理办法 > 休假管理 > 年假」后，问「年假几天」才能被检索命中。
      只用于展示的话，检索效果没有任何提升。
  - id: d23-t8
    kp: d23-k2
    type: single
    question: 某同学用 `str(hash(doc_id + str(i)))` 生成 chunk_id。上线后发现每次服务重启，评测集里标注的期望 chunk_id 都对不上。原因是？
    options:
      - "Python 内置 hash 对字符串默认加随机种子，每个进程结果不同"
      - "字符串拼接导致 chunk_id 太长被数据库截断"
      - "hash 函数只能处理数字，不能处理字符串"
      - "chunk_id 应该用自增整数，任何哈希都不稳定"
    answer: [0]
    explain: |
      Python 对 str 的 hash 默认开启随机化（PYTHONHASHSEED），每次启动进程结果都不一样，用它生成 id 会导致 id 不稳定。应改用 hashlib.sha256 这类确定性哈希，或用「doc_id + 版本 + 序号」组合。
      B 不是截断问题；C hash 可以处理字符串；D SHA-256 等确定性哈希是稳定的。
  - id: d23-t9
    kp: d23-k2
    type: judge
    question: 对结构清晰的企业制度，优先按「章、节、条」切分，比按固定字符数切分更能保证 chunk 语义完整。
    answer: true
    explain: |
      正确。标题和条款编号是天然的语义边界，一个条款通常表达一个完整的规定。按结构切分后，超长的再递归拆分，太短的再合并，兼顾完整性和长度控制。
  - id: d23-t10
    kp: d23-k3
    type: single
    question: 父子切片中，「用子块检索、返回父块」的主要目的是？
    options:
      - "减少向量库里存储的向量数量"
      - "小块让检索更精准，大块让模型拿到完整上下文"
      - "让检索速度比普通切片快好几倍"
      - "避免给 chunk 添加任何 metadata"
    answer: [1]
    explain: |
      父子切片解决「小块检索准但信息不全、大块信息全但检索不准」的矛盾：子块向量聚焦，命中更精准；父块包含条件、例外等完整信息，交给模型阅读。
      A 子块数量更多，向量数反而增加；C 检索速度没有明显变化；D 需要 parent_id 这类 metadata。
  - id: d23-t11
    kp: d23-k3
    type: multi
    question: 实现父子切片或相邻块扩展时，以下哪些是需要注意的问题？
    options:
      - "多个子块命中同一父块时要去重"
      - "父块太大会迅速占满上下文，增加成本和噪声"
      - "相邻块扩展应限制在同一章节内，避免带入无关内容"
      - "父子切片后就不需要做任何评测"
    answer: [0, 1, 2]
    explain: |
      去重避免同一内容重复放进 Prompt；父块大小要控制在 Token 预算内；扩展跨越章节会把其他制度带进来。
      D 任何优化都要在评测集上验证收益和成本。
  - id: d23-t12
    kp: d23-k3
    type: judge
    question: 相邻块扩展需要依赖解析时保存的块顺序字段，才能找到命中 chunk 的前后邻居。
    answer: true
    explain: |
      正确。命中某个 chunk 后，要按同一文档内的顺序（order 或序号）取前后 1~2 块。如果入库时没有保存顺序信息，就无法实现扩展，这也是 Day 22 强调要保存块级 metadata 的原因。
  - id: d23-t13
    kp: d23-k4
    type: single
    question: Anthropic 的 Contextual Retrieval 核心做法是？
    options:
      - "检索时把用户问题改写成多个不同版本，分别检索后合并结果"
      - "用大模型为每篇文档生成一份通用摘要，用摘要替代原文入库"
      - "让大模型根据问题先生成一个假设答案，再用这个答案去检索"
      - "入库时为每个 chunk 生成专属的简短上下文，拼接后再建向量和关键词索引"
    answer: [3]
    explain: |
      Contextual Retrieval 是在入库阶段，为每个 chunk 生成 50~100 Token 的专属上下文说明，拼在 chunk 前面，同时用于向量化和 BM25 索引。
      A 是多查询改写；C 是 HyDE（Day 26 会讲，Anthropic 文中也提到测试过但效果不佳）；B 文中明确说通用文档摘要的收益有限。
  - id: d23-t14
    kp: d23-k4
    type: multi
    question: 关于 Contextual Retrieval，以下哪些说法与 Anthropic 文章一致？
    options:
      - "上下文向量 + 上下文 BM25 比只做上下文向量的失败率更低"
      - "再加上重排后，Top-20 检索失败率相对基线降低约 67%"
      - "借助 prompt caching 可以大幅降低为每个 chunk 生成上下文的成本"
      - "给每个 chunk 加同一份通用文档摘要就能达到同样效果"
      - "它不需要调用任何大模型"
    answer: [0, 1, 2]
    explain: |
      文中数据：上下文向量降 35%，再加上下文 BM25 降 49%，再加重排降 67%；同一文档的 chunk 共享文档前缀，prompt caching 让成本降到约每百万文档 Token 1.02 美元。
      D 文中明确说通用摘要收益有限；E 生成上下文正是调用模型完成的。
  - id: d23-t15
    kp: d23-k4
    type: judge
    question: 对结构清晰的制度类文档，用「制度名 > 章 > 节」作为 chunk 前缀，可以看作 Contextual Retrieval 的一种零成本简化版本。
    answer: true
    explain: |
      正确。两者思路相同：让 chunk 自带它在全文中的位置信息。标题路径从解析结果中直接获得，不需要调用模型；结构差、指代多的文档才值得花成本让模型生成说明。
  - id: d23-t16
    kp: d23-k4
    type: single
    question: 团队准备在 200 万个 chunk 上启用 Contextual Retrieval。以下哪项准备工作最重要？
    options:
      - "先在评测集和小批量数据上对比收益，并按 prompt caching 估算成本和入库时长"
      - "直接全量跑，Anthropic 已经证明了有效"
      - "换成参数量最大的模型来生成上下文，保证质量"
      - "把每个 chunk 的上下文长度提高到 1000 Token，信息越多越好"
    answer: [0]
    explain: |
      200 万个 chunk 意味着 200 万次模型调用，必须先在自己的数据上确认收益，再估算成本和时长，并确认开启 prompt caching。
      B 别人的数据不等于你的收益；C 文章用的是便宜的小模型，大模型成本高很多；D 说明太长会稀释 chunk 本身的语义，文章建议 50~100 Token。
exam:
  - id: d23-e1
    kp: d23-k1
    type: single
    question: 用 500 Token 切片时检索命中率不错，但有一类问题总是答不全：答案涉及的条件和例外分布在相邻两段。最合适的调整方向是？
    options:
      - "把 chunk size 统一降到 100 Token，让检索更精准"
      - "删除所有包含例外条件的段落，减少干扰"
      - "按条款边界切分，必要时用父块或相邻块补全上下文"
      - "把 overlap 提高到 chunk size 的 80%"
    answer: [2]
    explain: |
      问题在于语义单元（一个完整条款）被切开了。按条款边界对齐切分，再用父子切片或相邻块扩展补上下文，才能让模型同时看到条件和例外。
      A 切得更小会更碎；B 删掉例外会让回答错误；D 重叠过大成本高且检索结果大量重复，治标不治本。
  - id: d23-e2
    kp: d23-k2
    type: single
    question: 员工问「年假有几天」，检索排名第一的却是《差旅费管理办法》里的某段。查看正确的 chunk 内容是「每年可享受 5 天，满 10 年后为 10 天。」。最直接有效的改进是？
    options:
      - "把这个 chunk 删除后重新入库"
      - "给 chunk 加上「制度名 > 章 > 节」前缀并参与向量化"
      - "把 Top-K 从 5 提高到 50"
      - "换一个维度更高的 Embedding 模型"
    answer: [1]
    explain: |
      这个 chunk 里根本没有「年假」两个字，它的语义只能靠上下文推断。加上「考勤管理办法 > 休假管理 > 年假」前缀并参与向量化，问「年假」时相似度会明显提高。
      A 删除不解决问题；C 只是把更多无关内容拉进来；D 模型再强也推断不出文本里没有的信息。
  - id: d23-e3
    kp: d23-k3
    type: single
    question: 启用父子切片后，回答质量提升了，但平均每次请求的输入 Token 从 2000 涨到了 9000，成本和延迟明显上升。最合理的优化是？
    options:
      - "关闭父子切片，回到原来的小块方案"
      - "把父块大小控制在合理范围，并对命中同一父块的子块去重、限制父块数量"
      - "换一个上下文窗口更大的模型，就不用担心 Token"
      - "把 Top-K 提高到 20，让模型有更多选择"
    answer: [1]
    explain: |
      父子切片的代价就是 Token 增加，应在效果和成本间找平衡：限制父块大小（如一个完整条款而非整章）、子块命中同一父块去重、最多取几个父块。
      A 放弃了已经验证的质量收益；C 窗口大不代表成本和延迟低；D 会让 Token 更多。
  - id: d23-e4
    kp: d23-k4
    type: single
    question: 一家券商的研报知识库里，大量段落使用「该公司」「本季度」等指代，单独看无法知道说的是哪家公司、哪个季度。以下哪个方案最有针对性？
    options:
      - "把 chunk size 调到 2000 Token，让指代对象出现在同一 chunk 中"
      - "在 Prompt 里要求模型自行推断「该公司」是哪家"
      - "去掉所有包含指代的段落"
      - "入库时用模型为每个 chunk 生成包含公司名和报告期的简短上下文，用于向量和关键词索引"
    answer: [3]
    explain: |
      这正是 Contextual Retrieval 要解决的问题：chunk 缺失上下文，指代对象不明确。为每个 chunk 生成包含公司名、报告期的说明，检索时就能匹配「某公司某季度」这类问题。
      A 大 chunk 会稀释语义；B 模型拿不到证据，只能猜；C 丢失大量有效内容。
  - id: d23-e5
    kp: d23-k1
    type: multi
    question: 关于 chunk 长度的度量和上限，以下哪些说法正确？
    options:
      - "Embedding 模型按 Token 计算输入上限，超出部分可能被静默截断"
      - "中英文混排时，同样的字符数对应的 Token 数差别可能很大"
      - "按字符计长永远是安全的，因为一个字符最多一个 Token"
      - "加前缀后的总长度也要在 Embedding 模型的输入上限之内"
      - "chunk 越接近模型上限，检索效果一定越好"
    answer: [0, 1, 3]
    explain: |
      模型按 Token 计算长度，超长部分会被截断导致内容永远检索不到；中英文 Token 化差异大；前缀会占用长度，要一起算。
      C 一个字符可能对应多个 Token（如生僻字、表情符号）；E 越长越容易稀释，不是越长越好。
  - id: d23-e6
    kp: d23-k2
    type: multi
    question: 以下哪些做法属于「结构化切分」的合理实践？
    options:
      - "Markdown 文档按标题层级切分，代码块不拆开"
      - "制度按「章、节、条」切分，超长条款再递归切分"
      - "同一标题下过短的相邻小块合并成一个 chunk"
      - "无论文档类型，一律每 300 字切一刀"
      - "表格和正文混在一起按长度切分"
    answer: [0, 1, 2]
    explain: |
      结构化切分是「先按结构切，超长再拆，过短再合」，Docling 的 HybridChunker 就是这个思路，代码块和表格保持完整。
      D 是固定长度切分；E 会把表格拦腰截断。
  - id: d23-e7
    kp: d23-k3
    type: judge
    question: FAQ 类知识库每条都是简短完整的「问题 + 答案」，引入父子切片通常收益不大，反而增加复杂度。
    answer: true
    explain: |
      正确。父子切片解决的是「小块不完整」的问题，FAQ 的每条问答本身就短小完整，直接一条一个 chunk 即可。
      技术方案要匹配数据特点，而不是所有场景都上最复杂的方案。
  - id: d23-e8
    kp: d23-k4
    type: judge
    question: Contextual Retrieval 中生成的上下文只需要用于向量化，对关键词检索（BM25）没有帮助。
    answer: false
    explain: |
      错误。Anthropic 的实验显示，上下文向量把失败率降低 35%，同时加上上下文 BM25 后降低到 49%。
      说明里通常包含公司名、文档名、章节等关键词，对关键词检索同样有帮助。
  - id: d23-e9
    kp: d23-k2
    type: case
    question: |
      p1 企业知识库切片入库后，用评测集测得 Top-5 命中率只有 58%。你抽查失败案例发现三类问题：
      ① 很多 chunk 开头是半句话；② 「住宿标准表」被拆成两段，后一段只有数字没有表头；③ 「每年可享受 5 天」这类 chunk 看不出属于哪个制度、哪种假期。
      当前实现是 LangChain RecursiveCharacterTextSplitter 默认分隔符、chunk_size=500。以下哪组改进最对症？
    options:
      - "把 chunk_size 改成 1000 并把 overlap 提到 400，其他不变"
      - "加中文标点分隔符、表格整体切分并重复表头、给 chunk 加标题路径前缀参与向量化"
      - "换一个维度更高的 Embedding 模型，并把 Top-K 提高到 20"
      - "用大模型为每个 chunk 生成摘要替代原文入库"
    answer: [1]
    explain: |
      三类问题各有对应解法：① 默认分隔符不含中文标点导致硬切，加「。！？；，」；② 表格要整体处理，拆分时重复表头；③ chunk 缺少上下文，加标题路径前缀并参与向量化。
      A 只调参数解决不了分隔符和表格问题；C 换模型无法弥补切片本身的缺陷；D 摘要会丢失细节，且引用时无法对应原文。改完后要用同一评测集复测命中率。
interview:
  - id: d23-i1
    kp: d23-k1
    type: scenario
    difficulty: 2
    question: 你接手一个 RAG 项目，发现 chunk size 是前同事随手设的 1000 字符，效果一般。你会怎么确定新的切片方案？
    key_points:
      - {text: "先建立评测集：真实问题加标注的期望段落，用命中率衡量", dim: engineering}
      - {text: "分析文档结构，优先按标题、条款、段落切，表格整体处理", dim: principle}
      - {text: "对比多组参数，抽查失败案例判断是太碎还是太粗", dim: engineering}
      - {text: "用 Token 计长并考虑 Embedding 模型上限和前缀长度", dim: concept}
      - {text: "结合项目说明改进前后的指标变化和最终选型理由", dim: project}
    reference: |
      **第一步：建立评测集。** 收集 50~100 个真实问题，标注每个问题的正确答案所在段落。没有评测集，任何调参都是凭感觉。

      **第二步：分析文档特点。** 看文档有没有清晰结构（制度、手册通常有章节条款），有没有大量表格、FAQ、长段落。不同类型可以用不同策略。

      **第三步：设计候选方案。**
      - 结构化切分：按标题和条款切，超长的递归拆分（加中文标点分隔符），过短的合并。
      - 表格整体处理，拆分时重复表头。
      - 加标题路径前缀。
      - 长度用 Token 计算，几组候选值如 300、500、800，重叠 10%~20%。

      **第四步：对比与分析。** 每组方案切片入库，跑评测集计算 Top-5 命中率；抽查失败案例：是信息被切断（太碎）还是被稀释（太粗）。

      **第五步：确定并固化。** 选综合最优的方案，参数写入配置，记录对比数据。之后每次改切片策略都跑同一评测集回归。
    oral: |
      我不会直接拍一个新数字，而是先建评测集，拿几十个真实问题标好正确答案在哪一段。
      然后看文档结构，我们的制度文档章节条款很清楚，所以我会优先按条款切，超长的再用加了中文标点的递归切分，表格整体切并重复表头，再给每个 chunk 加上制度名和章节前缀。
      长度我会用 Token 算，对比三百、五百、八百几组，看 Top-5 命中率，再抽查失败案例是切太碎还是太粗。
      在我的项目里，这样改完命中率有明显提升，我会把对比表写进文档，以后改切片都用这套评测集回归。
  - id: d23-i2
    kp: d23-k3
    type: scenario
    difficulty: 3
    question: 用户反馈：问「试用期能不能请年假」，系统回答「可以，每年 5 天」，但制度里明确写了试用期不享受年假。检索日志显示命中了年假条款的第一段。你会怎么分析和解决？
    key_points:
      - {text: "判断层级：检索命中了相关条款但信息不全，根因是切片把条件和例外拆开了", dim: principle}
      - {text: "方案：按条款边界切分，或用父子切片和相邻块扩展把完整条款交给模型", dim: engineering}
      - {text: "说明代价：Token 增加，需要控制父块大小、去重和数量", dim: engineering}
      - {text: "生成层兜底：要求模型注意适用条件，证据不足时说明", dim: concept}
      - {text: "把这类含例外条件的问题加入评测集专项统计", dim: project}
    reference: |
      **分析：** 检索命中了年假条款，说明检索方向是对的；但只命中了第一段（天数），「试用期不享受」写在后面的段落里，没被一起返回。模型只看到一半证据，就给出了错误结论。根因在切片：一个完整条款被切成了多个 chunk。

      **解决：**
      1. **切片对齐语义边界**：按条款切分，一个条款尽量在一个 chunk 内。
      2. **父子切片**：条款太长时，子块用于检索，命中后返回整条条款（父块）给模型；多个子块命中同一父块去重。
      3. **相邻块扩展**：如果暂时不改切片，可以命中后取同一条款内的前后相邻块。
      4. **生成层兜底**：Prompt 要求模型先确认问题的适用条件（试用期、职级等）是否在证据里有说明，没有就提示用户。

      **代价控制：** 父块会增加 Token，限制父块大小和数量，统计平均输入 Token 的变化。

      **验证：** 把「含例外条件」的问题单独做成一个子集，对比改进前后的回答正确率。
    oral: |
      我先看日志，检索命中了年假条款，方向是对的，但只拿到第一段讲天数的部分，试用期的例外写在后面那段里没被返回，模型只看到一半证据，所以答错了。根因在切片，一个完整条款被切开了。
      解决上我会按条款边界切分，条款太长就用父子切片，小块检索、命中后把整条条款交给模型，同一条款去重。
      代价是 Token 会变多，所以我会控制父块大小和数量。另外在 Prompt 里要求模型注意适用条件。
      最后我会把这类带例外条件的问题单独做成一个评测子集，看改进前后的正确率。
  - id: d23-i3
    kp: d23-k4
    type: design
    difficulty: 3
    question: 老板看了 Anthropic Contextual Retrieval 的文章，要求在公司 50 万份文档的知识库上全面启用。你怎么评估和推进？
    key_points:
      - {text: "讲清原理：为每个 chunk 生成专属上下文，同时用于向量和 BM25", dim: concept}
      - {text: "引用文章数据但指出数据来自 Anthropic 自己的评测集，需在自有数据上验证", dim: principle}
      - {text: "估算成本和入库时长，依赖 prompt caching 和便宜模型，考虑文档更新时的重算", dim: engineering}
      - {text: "提出分层方案：结构清晰的文档用标题前缀，结构差的文档才用模型生成上下文", dim: engineering}
      - {text: "小批量试点对比命中率和成本，用数据决定推广范围", dim: project}
    reference: |
      **先讲清楚它是什么：** 入库时把整篇文档和当前 chunk 交给一个便宜的模型，生成 50~100 Token 的专属说明拼在 chunk 前，同时用于向量化和 BM25。Anthropic 的数据是 Top-20 检索失败率从 5.7% 降到 2.9%，加重排后到 1.9%。

      **再讲风险：**
      - 数据来自 Anthropic 当时的评测集和模型，在我们的数据上收益未知。
      - 50 万份文档可能对应几百万个 chunk，每个都要调一次模型：要估算费用（依赖 prompt caching，文章估算约每百万文档 Token 1.02 美元）和入库时长、限流。
      - 文档更新时要重新生成，增量链路要支持。
      - 生成的说明可能出错，需要抽检。

      **推进方案：**
      1. 选 2000 份代表性文档试点，对比三组：无前缀、标题路径前缀、模型生成上下文，看命中率和成本。
      2. 很可能的结论是**分层**：结构清晰的制度手册用零成本的标题前缀就够；会议纪要、研报这类指代多、结构差的文档才启用模型生成。
      3. 按试点结果给老板一份「收益、成本、时长」的对比表，决定推广范围，并分批执行。
    oral: |
      我会先跟老板讲清楚原理和文章数据，Top-20 失败率从 5.7% 降到 2.9%，加重排到 1.9%，确实有效。
      但也要说明风险：这是 Anthropic 自己的评测集，我们的数据收益未知；50 万份文档可能有几百万个 chunk，每个都要调一次模型，要算清费用、入库时间和限流，文档更新还要重算。
      所以我会先拿两千份文档试点，对比不加前缀、加标题路径前缀、模型生成上下文三组的命中率和成本。
      我估计结论会是分层：结构清晰的制度用标题前缀就够，指代多的会议纪要、研报才用模型生成。最后拿对比表给老板决策。
