  - id: d37-t5
    kp: d37-k1
    type: single
    question: 下面的接口上线后，用户反馈「每次追问 Agent 都不记得上一句」。原因是：
    code: |
      graph = builder.compile(checkpointer=saver)

      @app.post("/chat")
      async def chat(body: dict):
          cfg = {"configurable": {"thread_id": str(uuid.uuid4())}}
          return await graph.ainvoke(
              {"messages": [{"role": "user", "content": body["text"]}]}, cfg
          )
    options:
      - "每次请求随机生成 thread_id，每次都是新线程"
      - "ainvoke 不支持 checkpointer，必须改用 invoke"
      - "messages 应该放在 configurable 里传入"
      - "compile 时还需要额外开启 memory=True"
    answer: [0]
    explain: |
      快照按 thread_id 归档，每次随机生成就等于每次都开一个新线程，自然没有历史。应由前端传会话 ID，或后端按用户和会话生成稳定的 thread_id。
      ainvoke 完全支持 checkpointer（异步图配异步 saver）；messages 是输入不是配置；compile 没有 memory 参数。
