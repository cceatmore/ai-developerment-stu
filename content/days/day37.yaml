  - id: d37-t1
    kp: d37-k1
    type: single
    question: |
      图已挂上 checkpointer。用户第二次提问时，后端用**同一个 thread_id** 调用 `invoke({"messages": [新问题]}, cfg)`。会发生什么？
    options:
      - "清空旧状态，从头开始一次全新的执行"
      - "在上一轮最终状态上开始新一轮，新消息追加到历史"
      - "报错，因为该线程已经执行完毕不能再写入"
      - "从上一轮第一步重新回放，再处理新消息"
    answer: [1]
    explain: |
      同一 thread_id 加新输入，表示在最新快照的状态上开始新一轮。messages 用 add_messages 时新问题追加到历史后面，这就是多轮记忆。
      不会清空，也不会报错，更不会回放旧步骤；回放要显式传入历史快照的 config。
  - id: d37-t2
    kp: d37-k1
    type: judge
    question: checkpointer 只在一次 invoke 完整结束时保存一次快照，中间步骤不会保存。
    answer: false
    explain: |
      checkpointer 在每个 super-step 之后都会写一个快照，所以才能从中间某一步恢复、查看历史、做时间旅行。
      durability 设为 exit 时，中间快照会延迟到执行结束（完成、出错或中断）时才真正落盘，但快照粒度仍然是每一步。
  - id: d37-t3
    kp: d37-k1
    type: single
    question: 长任务执行到第 5 步时调用外部接口超时报错，你已修好接口。想从第 5 步接着跑、前 4 步不重跑，应该怎么调用？
    options:
      - "用同一 thread_id 重新传入原始问题"
      - "换一个新的 thread_id 重新执行"
      - "用同一 thread_id 调用 invoke(None, cfg)"
      - "调用 Command(resume=True) 恢复"
    answer: [2]
    explain: |
      传 None 表示不给新输入，从最新快照接着执行，前面已成功的步骤不会重跑。
      重新传原始问题会被当成新一轮输入；换 thread_id 是全新线程；Command(resume) 用于回答 interrupt，不是出错重试的语义。
