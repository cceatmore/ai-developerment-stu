    options:
      - "values：当时的 State"
      - "next：下一步要执行的节点，空表示已跑完"
      - "config：含 thread_id 和该快照的 checkpoint_id"
      - "该步调用 LLM 的完整 HTTP 请求和响应原文"
    answer: [0, 1, 2]
    explain: |
      快照里有 values、next、config（含 checkpoint_id）、metadata，以及待执行任务和挂起的中断。
