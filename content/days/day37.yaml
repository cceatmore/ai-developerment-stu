knowledge_points:
  - id: d37-k1
    name: Checkpointer 与 thread_id：每一步自动存快照
    level: P0
    summary: 编译时挂上 checkpointer，图每走完一个 super-step 就把状态存成快照；thread_id 决定读写哪一条快照链
    analogy: |
      **像 Git。** thread_id 像一个分支，checkpoint 像分支上的 commit，`get_state` 像看 HEAD，`get_state_history` 像 `git log`，从旧快照分叉像 `git checkout` 旧 commit 再开新分支。

      **不一样的地方：**
      - Git 要你手动 commit；LangGraph **每个 super-step 自动存**一次。
      - Git commit 只存文件；checkpoint 还存了**下一步要执行哪些节点**（`next`）和挂起的中断，所以能「接着跑」。
      - Git checkout 旧版本只是恢复文件；LangGraph 从旧快照继续会**重新执行**之后的节点（包括重新调用 LLM），结果可能和上次不同。
    why: |
      Day 36 迁移到图，真正的回报在今天。没有 checkpointer，图和手写循环一样：
      - 多轮对话要你自己存历史；
      - 进程一挂，跑到一半的任务**全丢**；
      - 没法「暂停等人」，因为暂停就意味着这次执行先结束、以后再接着跑。
      checkpoint 是**多轮记忆、断点恢复、人工审批、时间旅行**四个能力的共同地基。
    problem: |
      解决「**Agent 执行到一半时，状态和执行位置如何保存下来，以便之后在任意进程里接着跑**」的问题。
      LangGraph 的做法是：每个 super-step 结束时把 State、下一步待执行的节点、元数据一起写进 checkpointer，按 thread_id 归档。之后只要拿着同一个 thread_id 调用，就能找到最新快照继续。
    principle: |
      **一、挂上 checkpointer**

      ```python
      from langgraph.checkpoint.memory import InMemorySaver

      graph = builder.compile(checkpointer=InMemorySaver())
      cfg = {"configurable": {"thread_id": "user-42"}}
      graph.invoke({"messages": [{"role": "user", "content": "3号楼有告警吗"}]}, cfg)
      graph.invoke({"messages": [{"role": "user", "content": "那4号楼呢"}]}, cfg)
      ```

      第二次调用会**带着第一轮的状态**继续：新消息经过 add_messages 追加到历史后面。这就是多轮记忆（Day 35 讲的短期记忆）在 LangGraph 里的落地方式。

      **二、什么时候存、存了什么**

      ```mermaid
      sequenceDiagram
        participant C as 调用方
        participant G as 图运行时
        participant S as Checkpointer
        C->>G: invoke 输入 加 thread_id
        G->>S: 写快照 输入已接收
        G->>G: super-step 1 执行 agent
        G->>S: 写快照 next 为 tools
        G->>G: super-step 2 执行 tools
        G->>S: 写快照 next 为 agent
        G->>G: super-step 3 执行 agent
        G->>S: 写快照 next 为空
        G-->>C: 返回最终状态
      ```

      每个快照（`StateSnapshot`）里主要有：
      - `values`：当时的 State；
      - `next`：下一步要执行的节点，**空表示已经跑完**；
      - `config`：含 `thread_id` 和这个快照的 `checkpoint_id`；
      - `metadata`：哪一步、由哪个节点写入；
      - `tasks` / `interrupts`：待执行任务和挂起的中断。

      **三、四种调用方式，必须分清**

      | 调用 | 含义 |
      |---|---|
      | `invoke(新输入, cfg)` | 在最新状态上**开始新一轮**（多轮对话） |
      | `invoke(None, cfg)` | **不给新输入**，从最新快照接着跑，用于出错后重试 |
      | `invoke(Command(resume=值), cfg)` | **回答中断**，让暂停的节点继续（k3） |
      | `invoke(None, 历史快照的 config)` | **回放**：从某个旧快照重新执行之后的步骤（k2） |

      重点：**复用 thread_id 不等于恢复。** 传了新输入就是新一轮；想接着跑，要传 `None` 或 `Command(resume=...)`。

      **四、pending writes：失败时不重跑已成功的节点**

      同一个 super-step 里 A、B 并行，A 成功、B 抛异常。A 的输出会作为 **pending writes** 先存下来；修好问题后 `invoke(None, cfg)` 恢复，**只重跑 B**，A 不会再执行一遍。

      **五、thread_id 怎么取**

      thread_id 是你自己定的字符串。常见做法：**会话 ID**（多轮对话）或**业务单号**（一次告警处置一个线程）。不要每次请求随机生成，否则每次都是全新线程，没有任何记忆。
    scenarios: |
      - **多轮对话**：thread_id 用会话 ID，每轮只传新消息，历史由快照自动带上。
      - **长任务出错重试**：第 5 步调用外部接口超时，修好后 `invoke(None, cfg)` 从第 5 步继续，前 4 步不重跑。
      - **人工审批**：暂停时状态在快照里，审批结果回来后用同一 thread_id 恢复（k3）。
      - **排查线上问题**：用 `get_state_history` 看 Agent 每一步的状态，定位从哪一步开始走偏。
    code: |
      ```python
      import uuid
      from langgraph.checkpoint.memory import InMemorySaver

      graph = builder.compile(checkpointer=InMemorySaver())
      cfg = {"configurable": {"thread_id": "session-7f3a"}}

      graph.invoke({"messages": [{"role": "user", "content": "3号楼有告警吗"}]}, cfg)

      snap = graph.get_state(cfg)
      print(snap.values["messages"][-1].content)  # 最后一条回复
      print(snap.next)                             # () 表示这一轮已跑完

      for s in graph.get_state_history(cfg):       # 最新的快照排在最前面
          print(s.metadata["step"], s.next, s.config["configurable"]["checkpoint_id"])

      # 反例：每次请求随机 thread_id，等于每次都是新会话，没有记忆
      bad_cfg = {"configurable": {"thread_id": str(uuid.uuid4())}}
      ```
    pitfalls: |
      - **每次请求随机生成 thread_id**：快照链永远只有一轮，表现为「多轮对话没记忆」。
      - **以为复用 thread_id 就会自动恢复**：传入新输入是开始新一轮；恢复要传 `None` 或 `Command(resume=...)`。
      - **生产用 InMemorySaver**：进程重启全丢，多实例之间也不共享，只能用于开发和测试。
      - **State 里放大对象**：每个 super-step 都写一次快照，大对象会让存储量和延迟成倍增长。
      - **把 checkpoint 当长期记忆**：它按线程隔离，跨会话的用户偏好应放 Store 或业务库（见 Day 35）。
    interview_asks:
      - question: "LangGraph 的 checkpoint 存了什么？什么时候存？"
        answer: "存这一步之后的状态、走到了哪个节点、下一步是什么。每个 super-step 成功后存一次。靠它才能在进程重启后从这一步继续，而不是从头跑。"
      - question: "thread_id 有什么用？复用 thread_id 就等于断点恢复吗？"
        answer: "thread_id 是这一条对话或任务的存档钥匙。用同一个 id 会读到已有存档，所以恢复时必须用原 id。但你还要确认从哪一个检查点继续，不能随便复用别人的 id。"
      - question: "一个 super-step 里部分节点失败，恢复时会怎样？"
        answer: "这一步没成功落档，恢复会重跑这一步里的节点。所以节点必须能重入：写操作要幂等，不能假设失败就等于没做。"
    project_example: |
      **p2 智慧园区运营 Agent：** 我们用两种 thread_id：
      - 运营台聊天用**会话 ID**，支持多轮追问「那4号楼呢」；
      - 告警处置用**告警单号**（如 `alarm-20261112-001`），一个告警从查询、生成工单草稿到审批完成都在同一条快照链上。

      值班长第二天打开审批页，后端只需要拿告警单号查 `get_state`，就能看到 Agent 停在哪一步、草稿是什么。
    freshness: |
      核对日期 2026-11（langgraph 1.2.x、langgraph-checkpoint 4.x）。`InMemorySaver` 从 `langgraph.checkpoint.memory` 导入（旧名 `MemorySaver` 仍可在老代码中见到）。`get_state_history` 返回最新在前。Deep Agents、create_agent 也都通过同一套 checkpointer 实现记忆与恢复。
    sources:
      - title: "LangGraph Persistence（Checkpointers）"
        url: "https://docs.langchain.com/oss/python/langgraph/checkpointers"
  - id: d37-k2
    name: 生产持久化：存储选型、durability 与时间旅行
    level: P1
    summary: 生产用 Postgres 等持久化 checkpointer；用 durability 权衡性能和崩溃安全；用历史快照回放和分叉调试
    analogy: |
      **像前端的草稿自动保存策略。** `exit` 像「离开页面时才保存」，`async` 像「后台节流保存」，`sync` 像「每次输入都等保存成功再继续」。

      **不一样的地方：** 草稿丢了用户能重写；Agent 的快照丢了，可能意味着**工单已经建了但系统不知道**，所以要结合业务的幂等和对账一起设计。
    why: |
      开发时 InMemorySaver 一切正常，上线后才发现：Pod 重启审批全丢、多实例之间看不到彼此的线程、同步保存拖慢了响应。
      存储选型和 durability 是**从 Demo 到生产**最容易被忽略的一步，面试问「你的 Agent 怎么做容灾」时就要答到这一层。
    problem: |
      解决「**快照存在哪、多久落盘一次、出问题时怎么回看和修正**」的问题。
      checkpointer 是可插拔的，按环境选不同实现；durability 控制写入时机；时间旅行（回放、分叉、修改状态）让你能复现和修正 Agent 的历史执行。
    principle: |
      **一、checkpointer 选型**

      | 包 | 类 | 适合 |
      |---|---|---|
      | `langgraph-checkpoint` | `InMemorySaver` | 开发、单元测试 |
      | `langgraph-checkpoint-sqlite` | `SqliteSaver` / `AsyncSqliteSaver` | 单机工具、本地 Demo |
      | `langgraph-checkpoint-postgres` | `PostgresSaver` / `AsyncPostgresSaver` | **生产**、多实例共享 |

      两个必记细节：
      - Postgres 版**首次使用要调用 `.setup()`** 建表；
      - 用 `ainvoke` / `astream` 的异步图，要配 **Async 版本**的 saver。

      **二、durability：什么时候真正落盘**

      | 模式 | 行为 | 取舍 |
      |---|---|---|
      | `exit` | 整次执行结束（完成、出错、中断）才写 | 最快，中途崩溃会丢进度 |
      | `async` | 下一步执行时**后台异步**写上一步 | 性能和安全折中 |
      | `sync` | 每步写完才进入下一步 | 最安全，延迟最高 |

      调用时传入，例如 `graph.invoke(inputs, cfg, durability="sync")`。**有外部副作用的长流程（建工单、发通知）建议用 `sync`。**

      **三、一个边界：第一个快照之前就崩溃**

      请求刚进来、第一个快照还没落盘时进程挂了，这个线程在 checkpointer 里**看起来和从没开始过一样**。如果靠「有没有快照」判断任务是否存在，这次请求就静默丢了。

      解决办法：**先在业务库写一条受理记录（outbox）**，再启动图；巡检任务找出「已受理但没有快照或长时间无进展」的记录重新拉起。

      **四、时间旅行：回放与分叉**

      ```mermaid
      flowchart LR
        C1["快照1 收到问题"] --> C2["快照2 调用查询工具"]
        C2 --> C3["快照3 生成错误结论"]
        C2 -.->|"update_state 修正参数"| F1["新快照 分叉"]
        F1 --> F2["重新执行 得到新结论"]
      ```

      - **回放**：拿 `get_state_history` 里某个旧快照的 config 调 `invoke(None, 旧config)`，从那里**重新执行**后续节点。注意 LLM、API、interrupt 都会**重新发生**，不是读缓存。
      - **修改状态**：`update_state(config, 新值, as_node="某节点")` 会**新建**一个快照（分叉），不改写历史；更新同样经过 reducer；`as_node` 决定「假装是哪个节点写的」，从而影响下一步走向。

      **五、改图时的兼容性**

      快照里记着「下一步去哪个节点」。如果有线程正停在中断上，你发布新版本**把它即将进入的节点改名或删除**，恢复时就会找不到节点。增删其他节点、加字段一般没问题。
    scenarios: |
      - **多实例部署**：所有 Pod 共用 AsyncPostgresSaver，审批请求落到哪个 Pod 都能恢复。
      - **复现线上 Bad Case**：拿出问题线程的历史快照，在测试环境回放，调 Prompt 后对比结果。
      - **人工修正后继续**：模型把楼栋识别错了，运营在后台用 update_state 改正，再继续执行。
      - **防丢单**：告警受理先写业务库，巡检任务兜底拉起没有快照的任务。
    pitfalls: |
      - **生产用 InMemorySaver 或 SQLite 跑多实例**：重启丢失、实例间不共享。
      - **忘了 `setup()`**：第一次运行直接报表不存在。
      - **异步图配同步 saver**：会报错或阻塞事件循环，要用 Async 版本。
      - **以为回放读的是缓存**：回放会重新调 LLM 和外部接口，有副作用的工具会再执行一次。
      - **只靠快照判断任务是否存在**：第一个快照前崩溃的任务会静默丢失，要有业务侧受理记录。
      - **发版时重命名中断线程的下一节点**：停在审批上的线程恢复失败，改名前先处理完存量线程或保留旧节点名。
    interview_asks:
      - question: "生产环境你用什么 checkpointer？durability 怎么选？"
        answer: "用数据库持久化，不用内存。重要写操作要等检查点落盘再响应。只是聊天演示可以放松。进程一多，内存检查点会丢，也不能跨副本。"
      - question: "LangGraph 的时间旅行是什么？回放会不会重新调用模型？"
        answer: "时间旅行是从以前某个检查点把状态取出来再继续，用来调试或改一条分支。从那之后的节点会重新执行，所以会再次调用模型和工具，除非你在测试里替换掉它们。它不是免费的录像回看。"
      - question: "如何保证请求进来后、第一个快照落盘前崩溃的任务不丢？"
        answer: "先把任务写进自己的队列表再开始跑图。崩溃后扫描未完成的任务重新拉起。不能假设「图已经开始就一定有检查点」。"
    project_example: |
      **p2 智慧园区运营 Agent 的持久化方案：**
      - 开发用 InMemorySaver，测试和生产用 **AsyncPostgresSaver**，与业务库同一个 Postgres 实例的独立 schema；
      - 告警处置流程用 `durability="sync"`，因为后面有建工单这类外部副作用；运营问答用默认模式；
      - 告警受理时先写 `alarm_tasks` 表（状态为「已受理」），巡检任务每 5 分钟扫描「已受理但无快照或超过 30 分钟无进展」的记录；
      - 运营发现 Agent 结论错误时，可在后台查看历史快照并回放，作为评测集的 Bad Case 来源（见 Day 41）。
    freshness: |
      核对日期 2026-11。checkpointer 分包：langgraph-checkpoint（内存与基类）、langgraph-checkpoint-sqlite、langgraph-checkpoint-postgres（另有社区与官方维护的 MongoDB 等实现）。durability 支持 exit / async / sync 三种。官方文档明确：第一个持久快照写入前崩溃，线程与「从未开始」无法区分，需要业务侧记录兜底。
    sources:
      - title: "LangGraph Persistence（Checkpointers）"
        url: "https://docs.langchain.com/oss/python/langgraph/checkpointers"
      - title: "LangGraph Interrupts（Graph migrations 说明）"
        url: "https://docs.langchain.com/oss/python/langgraph/interrupts"
  - id: d37-k3
    name: interrupt 人工审批：暂停、恢复与节点重跑
    level: P0
    summary: 节点里调用 interrupt 暂停并把审批内容抛给调用方；之后用同一 thread_id 传 Command(resume) 恢复，节点从头重跑
    analogy: |
      **像前端的 `await showConfirmDialog()`。** 代码停在那一行，等用户点确定，返回值就是用户的选择。

      **不一样的地方：**
      - 前端弹窗时 JS 线程还活着，Promise 一直挂着；`interrupt` 是**这次执行直接结束**，状态存进快照，可能一天后在**另一个进程**里恢复。
      - 恢复时**整个节点从头重跑**，不是从 interrupt 那一行接着跑。interrupt 之前的代码会再执行一遍，所以那里不能有不可重复的副作用。
    why: |
      生产 Agent 几乎都有「**模型提议、人来拍板**」的环节：建工单、发通知、退款、执行 SQL 写操作。
      面试高频场景题「审批等了一天服务重启了，Agent 怎么从断点继续」考的就是：你知不知道 interrupt 依赖 checkpointer、恢复语义是什么、节点重跑会带来什么坑。
    problem: |
      解决「**Agent 执行到高风险操作前，如何停下来等人决定，并在任意时间、任意进程里带着人的决定继续**」的问题。
      interrupt 把「等待」从内存里的阻塞变成**持久化的暂停**：状态在快照里，审批结果作为 resume 值注入，流程按人的决定继续或终止。
    principle: |
      **一、基本用法**

      ```python
      from langgraph.types import interrupt, Command

      def approve(state: State) -> dict:
          decision = interrupt({
              "kind": "ticket_approval",
              "draft": state["ticket_draft"],
              "options": ["approve", "edit", "reject"],
          })
          if decision["action"] == "reject":
              return {"approved": False}
          draft = decision.get("draft", state["ticket_draft"])
          return {"approved": True, "ticket_draft": draft}
      ```

      - 第一次执行到 `interrupt(...)`：执行停止，payload 作为中断信息返回给调用方（`result.interrupts`）；
      - 之后调用 `graph.invoke(Command(resume={"action": "approve"}), cfg)`：节点**从头重跑**，这次 `interrupt(...)` 不再暂停，而是**直接返回 resume 的值**。

      **二、跨天、跨进程的完整流程**

      ```mermaid
      sequenceDiagram
        participant U as 运营台
        participant A as 后端实例A
        participant DB as Postgres快照
        participant B as 后端实例B
        participant M as 值班长
        U->>A: 提交告警处置 thread_id 为告警单号
        A->>DB: 每步写快照
        A-->>U: 返回 interrupts 审批卡片
        Note over A: 当天夜里 A 重启
        M->>B: 第二天点击批准
        B->>DB: 按 thread_id 读最新快照
        B->>B: Command resume 重跑 approve 节点
        B->>DB: 继续执行并写快照
        B-->>M: 工单已创建
      ```

      **三、前提条件**

      - 必须挂 **checkpointer**，生产用持久化实现；
      - 恢复时用**同一个 thread_id**；
      - payload 和 resume 值要能 **JSON 序列化**。

      **四、四条规则（官方明确列出）**

      1. **interrupt 之前的副作用必须幂等**：节点重跑时会再执行一次。最稳的做法是**把副作用和 interrupt 拆到不同节点**。
      2. **不要用裸 `try/except Exception` 包住 interrupt**：interrupt 靠抛特殊异常实现暂停，被吞掉就停不下来。
      3. **一个节点里多个 interrupt 不要改变顺序或条件跳过**：恢复时按**出现顺序**匹配 resume 值。
      4. **不要传复杂对象**：函数、连接、类实例都不能进 payload。

      **五、多个中断同时挂起**

      并行分支各自 interrupt 时，`result.interrupts` 里有多个，每个有 `id`。恢复时传映射：`Command(resume={中断1.id: 值1, 中断2.id: 值2})`。

      **六、两种更省事的写法**

      - **`HumanInTheLoopMiddleware`**（create_agent 用）：配置 `interrupt_on={"create_ticket": {"allowed_decisions": ["approve", "edit", "reject"]}}`，模型想调这个工具时自动暂停；恢复传 `Command(resume={"decisions": [{"type": "approve"}]})`。
      - **静态断点** `interrupt_before=["节点名"]`：compile 时设置，主要用于**调试**，业务审批推荐用 `interrupt()`。
    scenarios: |
      - **写操作审批**：建工单、派人、发群通知前暂停，展示草稿，支持批准、修改后批准、驳回。
      - **补充信息**：模型发现缺少关键参数（如楼层），interrupt 问用户，拿到后继续。
      - **工具调用复核**：Text2SQL 生成的 SQL 执行前让 DBA 确认（只读场景也可用于高成本查询）。
      - **多人会签**：两个并行审批分支各自 interrupt，按中断 ID 分别回填。
    code: |
      ```python
      from langgraph.types import Command

      cfg = {"configurable": {"thread_id": "alarm-20261112-001"}}

      # 第一次：跑到审批节点暂停
      result = graph.invoke({"messages": [{"role": "user", "content": "3号楼烟感报警"}]},
                            cfg, version="v2")
      if result.interrupts:
          card = result.interrupts[0].value     # 推给运营台渲染审批卡片
          save_pending_approval(card, thread_id="alarm-20261112-001")

      # 第二天，可能是另一个实例：按同一 thread_id 恢复
      result = graph.invoke(
          Command(resume={"action": "edit", "draft": {"title": "3号楼3层烟感复核"}}),
          cfg,
          version="v2",
      )
      print(result.value["approved"])
      ```
    pitfalls: |
      - **在 interrupt 前发短信、建工单**：恢复时节点重跑，副作用执行两次。拆节点，或带幂等键。
      - **在 interrupt 前调 LLM 生成草稿**：重跑时又生成一份**不同的**草稿，人批准的和最终执行的不一致。草稿应在前一个节点生成并存进 State。
      - **裸 try/except 包住 interrupt**：暂停信号被吞掉，流程直接往下走。
      - **恢复时换了 thread_id**：等于新开线程，找不到中断。
      - **用静态断点做业务审批**：拿不到结构化的审批内容，也不好携带人的决定。
      - **不给审批设超时**：线程永远挂着，要有过期策略（超时自动驳回并通知）。
    interview_asks:
      - question: "审批等了一天服务重启了，Agent 如何从断点继续？"
        answer: "interrupt 时检查点已经在库里。重启后用原来的 thread_id 读出暂停点，人审批的结果用 Command 送回去继续。审批结果本身也要落库，不能只放在内存。"
      - question: "interrupt 恢复后，节点从哪里开始执行？会带来什么问题？"
        answer: "整个节点会重跑，不是从 interrupt 那一行的下一行接着执行。所以 interrupt 前的写操作会再做一次，必须幂等，或者把写操作放在人批准之后的另一个节点。"
      - question: "HumanInTheLoopMiddleware 和自己写 interrupt 节点有什么区别？"
        answer: "中间件是在指定工具执行前自动暂停，适合「这些工具要人点头」。自己写节点适合审批的是整段计划或业务对象，不只是某个工具。简单工具审批用中间件，少写一张图。"
    project_example: |
      **p2 智慧园区运营 Agent 的工单审批：**

      图是 `draft_ticket → approve → create_ticket`，**三个节点分开**：
      - `draft_ticket` 调 LLM 生成工单草稿，写进 State；
      - `approve` 只做一件事：`interrupt` 把草稿和风险依据推给值班长；
      - `create_ticket` 拿批准后的草稿调用工单系统，**请求带幂等键（告警单号）**，即使重试也不会建两张。

      运营台审批卡片支持批准、修改后批准、驳回，超过 24 小时未处理自动驳回并在群里提醒。
    freshness: |
      核对日期 2026-11（langgraph 1.2.x、langchain 1.5.x）。`interrupt`、`Command` 从 `langgraph.types` 导入；`invoke(..., version="v2")` 返回带 `.value`、`.interrupts` 的 GraphOutput，旧写法 `result["__interrupt__"]` 仍兼容但已不推荐。langgraph 1.2.12 起 interrupt 支持 `response_schema` 校验 resume 值。HumanInTheLoopMiddleware 的决策类型为 approve / edit / reject / respond，默认按批次（batched）审批。
    sources:
      - title: "LangGraph Interrupts"
        url: "https://docs.langchain.com/oss/python/langgraph/interrupts"
      - title: "LangChain Human-in-the-loop"
        url: "https://docs.langchain.com/oss/python/langchain/human-in-the-loop"
  - id: d37-k4
    name: 流式输出：stream mode、v2 格式与推送到 Vue
    level: P1
    summary: stream 按模式输出状态、更新、token、自定义进度；v2 统一成 type/ns/data 结构，后端转成 SSE 推给前端
    analogy: |
      **像前端的 `EventSource` 按事件名分发。** 后端推 `event: token`、`event: progress`、`event: approval`，前端分别 `addEventListener`。LangGraph 的 stream mode 就是在**图内部**区分这几类事件。

      **不一样的地方：** EventSource 只能 GET、断线自动重连；Agent 对话一般用 POST + `fetch` 读流（见 Day 10）。断线后不能简单重放请求，否则会**再跑一遍 Agent**，要用 thread_id 查快照恢复界面。
    why: |
      Agent 一次任务可能跑几十秒：查设备、查告警、再总结。界面如果一直转圈，用户会以为卡死。
      流式要同时解决三件事：**逐字输出回答**、**显示「正在查询设备…」进度**、**遇到审批时弹出卡片**。这正是前端负责人在 AI 项目里最能发挥价值的地方。
    problem: |
      解决「**如何把图执行过程中的不同类型信息（token、步骤进度、状态变化、中断）实时、分类地推给前端**」的问题。
      LangGraph 的 stream 支持多种模式并可同时开启，v2 格式给每条事件打上类型标签，后端只需按类型转成 SSE 事件。
    principle: |
      **一、常用 stream mode**

      | 模式 | 每条内容 | 典型用途 |
      |---|---|---|
      | `values` | 每步之后的**完整 State** | 调试、简单界面 |
      | `updates` | 每步**哪个节点返回了什么** | 进度条、日志 |
      | `messages` | LLM 的 **token 片段** + 元数据 | 打字机效果 |
      | `custom` | 节点里用 `get_stream_writer()` 写的任意数据 | 「正在查询设备…」 |
      | `checkpoints` / `tasks` / `debug` | 快照、任务、调试事件 | 排错与可观测 |

      可以同时开：`stream_mode=["messages", "updates", "custom"]`。

      **二、v2 格式**

      传 `version="v2"` 后，**所有模式**都输出统一结构 `{"type": ..., "ns": ..., "data": ...}`：`type` 是模式名，`ns` 是子图命名空间，`data` 是内容。不用再区分「单模式返回原始数据、多模式返回元组」。

      **三、messages 模式的细节**

      - `data` 是 `(消息片段, 元数据)`；元数据里的 `langgraph_node` 告诉你 token 来自哪个节点；
      - 图里**任何地方**调用的 LLM（包括工具内部）都会流出 token，要按节点或 tags 过滤；
      - 不想流出的模型调用（如内部分类器）可以加 `nostream` 标签。

      **四、从图到浏览器**

      ```mermaid
      sequenceDiagram
        participant V as Vue 运营台
        participant F as FastAPI
        participant G as LangGraph
        V->>F: POST chat 带 thread_id 和问题
        F->>G: astream 开启 messages updates custom
        G-->>F: custom 正在查询设备
        F-->>V: event progress
        G-->>F: messages token 片段
        F-->>V: event token
        G-->>F: 执行结束
        F->>G: aget_state 检查 interrupts
        F-->>V: event approval 或 event done
      ```

      **五、更新的一层：事件流 API**

      langgraph 1.2 新增 `graph.stream_events(input, version="v3")`，返回一个可同时多方消费的流对象，按「投影」取数据：`stream.messages`（逐条消息与 token）、`stream.values`、`stream.interrupts`、`stream.output`、`stream.subgraphs`。官方推荐**新应用代码**优先用它；需要底层原始事件时再用 `stream(stream_mode=...)`。
    scenarios: |
      - **对话打字机**：messages 模式过滤 `langgraph_node == "agent"` 的 token。
      - **多步骤进度**：查询节点开头用 `get_stream_writer()` 写进度，前端显示步骤条。
      - **审批弹窗**：流结束后检查 interrupts，推 `approval` 事件，前端渲染审批卡片。
      - **子 Agent 可视化**：开启 subgraphs，用 `ns` 区分主 Agent 和子 Agent 的输出（Day 39）。
    code: |
      ```python
      import json
      from fastapi import FastAPI
      from fastapi.responses import StreamingResponse
      from langgraph.config import get_stream_writer

      app = FastAPI()


      def check_devices(state: State) -> dict:
          get_stream_writer()({"step": "正在查询设备", "building": state["building"]})
          return {"findings": [query_devices(state["building"])]}


      def sse(event: str, data: dict) -> str:
          return f"event: {event}\ndata: {json.dumps(data, ensure_ascii=False)}\n\n"


      @app.post("/chat/{thread_id}")
      async def chat(thread_id: str, body: dict):
          cfg = {"configurable": {"thread_id": thread_id}}

          async def events():
              async for part in graph.astream(
                  {"messages": [{"role": "user", "content": body["text"]}]},
                  cfg,
                  stream_mode=["messages", "custom"],
                  version="v2",
              ):
                  if part["type"] == "messages":
                      chunk, meta = part["data"]
                      if chunk.content and meta["langgraph_node"] == "agent":
                          yield sse("token", {"text": chunk.content})
                  elif part["type"] == "custom":
                      yield sse("progress", part["data"])
              snap = await graph.aget_state(cfg)
              if snap.interrupts:
                  yield sse("approval", snap.interrupts[0].value)
              yield sse("done", {})

          return StreamingResponse(events(), media_type="text/event-stream")
      ```
    pitfalls: |
      - **不过滤 messages**：内部分类器、工具里调用的 LLM token 也会混进回答。按 `langgraph_node` 或 tags 过滤，或给内部调用加 `nostream`。
      - **用 values 模式做打字机**：values 只在每步结束才给完整状态，没有 token 级粒度。
      - **前端断线就重新 POST**：会把 Agent 再跑一遍，甚至重复执行工具。应按 thread_id 调 `get_state` 恢复界面。
      - **代理缓冲**：Nginx 默认缓冲会让 SSE 一次性到达，要关闭缓冲（Day 10 讲过 `X-Accel-Buffering: no`）。
      - **混用 v1 和 v2 解析**：v1 单模式返回原始数据、多模式返回元组；升级 v2 后解析代码要同步改。
    interview_asks:
      - question: "LangGraph 有哪些 stream mode？打字机效果和进度提示分别用哪个？"
        answer: "要模型逐字输出，用消息或 Token 那一档流。要告诉用户「正在查工单」，用更新状态那一档。前端两路分开接。具体模式名以你锁定的 LangGraph 版本文档为准，不要混用旧名字。"
      - question: "Agent 流式输出过程中前端断线了，怎么处理？"
        answer: "后端取消这次运行，能停的工具就停。已经做完的写操作不回滚掉，状态留在检查点。用户回来用 thread_id 看已经做到哪，而不是再开一个新任务重做。"
    project_example: |
      **p2 智慧园区运营 Agent 的 Vue3 运营台：**
      - 后端 FastAPI 开启 `messages` + `custom`，转成 `token`、`progress`、`approval`、`done` 四类 SSE 事件；
      - 前端用 `fetch` + `ReadableStream` 解析，`progress` 驱动步骤条，`approval` 弹出审批卡片；
      - 刷新页面或断线后，前端用告警单号调 `/threads/{id}/state` 接口拿最新快照还原界面，而不是重新提交问题。

      这部分是前端背景的加分项：面试时可以讲清「流式事件协议是我设计的」。
    freshness: |
      核对日期 2026-11。stream / astream 支持 values、updates、messages、custom、checkpoints、tasks、debug 七种模式；`version="v2"`（langgraph ≥1.1）统一为 type/ns/data，v1 仍是默认值。langgraph 1.2 新增 `stream_events(version="v3")` 事件流 API，官方称其为多数应用代码的推荐方式。`get_stream_writer` 从 `langgraph.config` 导入。
    sources:
      - title: "LangGraph Streaming"
        url: "https://docs.langchain.com/oss/python/langgraph/streaming"
      - title: "LangGraph Event streaming"
        url: "https://docs.langchain.com/oss/python/langgraph/event-streaming"
