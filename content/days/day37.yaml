    url: "https://docs.langchain.com/oss/python/langgraph/interrupts"
    kind: doc
    lang: en
    minutes: 25
    note: "重点读 Resuming interrupts 和 Rules of interrupts 两节，「节点会从头重跑」「不要用裸 try/except 包 interrupt」这些坑都在这里"
  - title: "LangGraph 官方文档：Persistence（Checkpointers）"
    url: "https://docs.langchain.com/oss/python/langgraph/checkpointers"
    kind: doc
    lang: en
    minutes: 25
    note: "看 Threads、Checkpoints、Replay、Update state 和 Checkpointer libraries 几节，对照 k1、k2 里的四种调用方式和存储选型"
  - title: "LangGraph 官方文档：Streaming"
