    answer: false
    explain: |
      异步图要配异步 saver，如 AsyncPostgresSaver、AsyncSqliteSaver。用同步 saver 会报错或在事件循环里阻塞（Day 6 讲过阻塞事件循环的后果）。
  - id: d37-t8
    kp: d37-k2
    type: single
    question: 告警处置流程后半段会调用外部系统建工单，你希望每一步的快照都**确保落盘后**才进入下一步。应选哪种 durability？
    options:
      - "exit，执行结束时统一写入"
      - "sync，每步写完再继续"
      - "async，后台异步写入上一步"
      - "不用设置，默认就是每步同步写"
    answer: [1]
    explain: |
      sync 在进入下一步前同步写完快照，崩溃安全性最高，适合有外部副作用的流程。
      exit 只在结束时写，中途崩溃会丢进度；async 在下一步执行时后台写，极端情况下可能丢最后一步；默认并不是 sync。
  - id: d37-t9
    kp: d37-k2
    type: multi
    question: 关于 LangGraph 的时间旅行（回放与修改状态），哪些说法正确？
    options:
      - "get_state_history 返回的快照最新的排在最前"
      - "从旧快照回放，会重新执行后续节点和 LLM 调用"
      - "update_state 会新建快照形成分叉，而不是改写历史"
      - "update_state 写入的值会绕过 reducer 直接覆盖"
    answer: [0, 1, 2]
    explain: |
      历史按时间倒序返回；回放不是读缓存，后续节点、LLM、外部接口和 interrupt 都会重新发生；update_state 新建一个快照，历史保留。
      update_state 的值同样经过各字段的 reducer，比如对 add_messages 字段是追加或按 ID 替换，而不是直接覆盖。
  - id: d37-t10
    kp: d37-k2
    type: single
    question: 告警请求刚进入、第一个快照还没落盘时进程崩溃了。巡检任务靠「checkpointer 里有没有这个线程」判断任务是否存在。会出现什么问题，怎么防？
    options:
      - "LangGraph 会自动重放该请求，不需要处理"
      - "该线程会以报错状态出现在快照里，巡检可识别"
      - "看起来和从没开始一样会静默丢失，要先写业务受理记录"
      - "只要换成 sync 模式，这种情况就不可能发生"
    answer: [2]
    explain: |
      第一个持久快照写入前崩溃，checkpointer 里没有任何痕迹，与从未开始无法区分，官方文档也明确提到这一点。防护方法是先在业务库写受理记录（outbox），巡检任务扫描「已受理但无快照或长时间无进展」的记录重新拉起。
      sync 只保证每步写完才继续，挡不住第一步之前的崩溃；LangGraph 不会自动重放未持久化的请求。
  - id: d37-t11
    kp: d37-k3
    type: single
    question: 节点中调用了 `interrupt(payload)`。之后用 `Command(resume=value)` 恢复时，执行从哪里开始？
    options:
      - "从 interrupt 那一行的下一行继续"
      - "从整个图的 START 重新开始"
      - "跳过该节点，直接执行下一个节点"
      - "从该节点开头重跑，interrupt 直接返回 value"
    answer: [3]
    explain: |
      LangGraph 不保存函数内部的执行位置，恢复时会把整个节点从头重跑，这次 interrupt 不再暂停，而是返回 resume 的值。
      所以 interrupt 之前的代码会再执行一次，这是很多重复副作用 bug 的根源。不会从 START 重来，也不会跳过节点。
  - id: d37-t12
    kp: d37-k3
    type: single
    question: 下面的审批节点上线后，值班长反映「每张工单都收到两条通知短信」。原因是：
    code: |
      def approve(state: State) -> dict:
          sms.send(state["duty_phone"], "有新工单待审批")
          decision = interrupt({"draft": state["ticket_draft"]})
          if decision["action"] == "approve":
              return {"approved": True}
          return {"approved": False}
    options:
      - "短信服务自带重试，网络抖动时重复发送"
      - "恢复时节点从头重跑，sms.send 又执行了一次"
      - "interrupt 会让节点在暂停期间被调度两次"
      - "checkpointer 写快照失败后自动重试了节点"
    answer: [1]
    explain: |
      第一次执行发了短信并暂停；值班长批准后 Command(resume) 让节点从头重跑，sms.send 再执行一次。修复是把发短信移到前一个节点，或用幂等键保证只发一次，approve 节点只保留 interrupt。
      其余选项都不是 interrupt 的执行机制。
  - id: d37-t13
    kp: d37-k3
    type: judge
    question: |
      为了防止节点报错，用 `try: ... except Exception: ...` 把 interrupt() 调用整个包起来是安全的写法。
    answer: false
    explain: |
      interrupt 是通过抛出一个特殊异常来暂停执行的，裸 except Exception 会把它吞掉，流程就不会暂停而是直接往下走。官方规则要求不要用裸 try/except 包住 interrupt，要捕获就只捕获具体的业务异常类型。
  - id: d37-t14
    kp: d37-k3
    type: multi
    question: 要让 interrupt 跨天审批可靠工作，下列哪些是必须遵守的？
    options:
      - "编译时挂上持久化的 checkpointer"
      - "恢复时使用与暂停时相同的 thread_id"
      - "payload 和 resume 值能 JSON 序列化"
      - "恢复必须发生在暂停时的同一个进程里"
    answer: [0, 1, 2]
    explain: |
      状态在 checkpointer 里，拿同一个 thread_id 就能在任何进程里恢复，这正是跨天审批能成立的原因；payload 与 resume 值要写进快照，必须可序列化。
      恢复不需要同一个进程，多实例部署下由任意实例恢复都可以。
  - id: d37-t15
    kp: d37-k3
    type: single
    question: 使用 create_agent + HumanInTheLoopMiddleware 拦截 `create_ticket` 工具，值班长批准后，后端应该怎么恢复？
    options:
      - "Command(resume={\"decisions\": [{\"type\": \"approve\"}]})"
      - "invoke(None, cfg) 直接继续执行"
      - "重新传入用户原始问题，让模型再次决定"
      - "调用 update_state 把 approved 字段设为 True"
    answer: [0]
    explain: |
      HITL middleware 暂停时等待的是一组决策，恢复要用同一 thread_id 传入 Command(resume={"decisions": [...]})，决策类型可以是 approve、edit、reject、respond，按中断里动作的顺序给出。
      传 None、重新提问或 update_state 都不能回答这个中断。
  - id: d37-t16
    kp: d37-k4
    type: single
    question: 想在 Vue 运营台实现「回答逐字出现」的打字机效果，应该开启哪种 stream mode？
    options:
      - "values，每步输出完整 State"
      - "updates，每步输出节点的更新"
      - "debug，输出尽可能多的执行信息"
      - "messages，输出 LLM 的 token 片段"
    answer: [3]
    explain: |
      messages 模式会把 LLM 生成的 token 片段连同元数据实时流出，适合打字机效果。
      values 和 updates 都是每个节点执行完才输出一次，粒度太粗；debug 信息杂乱，不适合直接给前端。
  - id: d37-t17
    kp: d37-k4
    type: single
    question: 查询设备的节点要花 5 秒，你希望前端先显示「正在查询 3 号楼设备…」。最合适的做法是：
    options:
      - "在节点里 print 一行日志，前端轮询日志文件"
      - "节点里用 get_stream_writer 写进度，开启 custom 模式"
      - "让模型先输出一句「正在查询」，再调用工具"
      - "把进度文字写进 State，等 values 模式推送"
    answer: [1]
    explain: |
      get_stream_writer 写入的数据会出现在 custom 模式的流里，能在节点执行过程中立即推送，是官方推荐的自定义进度方式。
      轮询日志不可靠；让模型说「正在查询」浪费 token 且不可控；写进 State 要等节点结束才会随 values 推出，起不到提示作用。
  - id: d37-t18
    kp: d37-k4
    type: multi
    question: 关于 stream 的 `version="v2"` 格式，哪些说法正确？
    options:
      - "每条事件都是含 type、ns、data 的字典"
      - "同时开多个模式时，靠 type 区分事件类型"
      - "invoke 传 version=\"v2\" 返回带 value 和 interrupts 的对象"
      - "v2 已是默认值，不传 version 也是这个格式"
    answer: [0, 1, 2]
    explain: |
      v2 把所有模式统一成 type/ns/data 结构，多模式时用 type 区分，子图用 ns 区分；invoke 传 v2 返回 GraphOutput，用 .value 和 .interrupts 取值。
      v1 仍是默认值，要显式传 version="v2"，升级时解析代码也要同步修改。
  - id: d37-t19
    kp: d37-k4
    type: judge
    question: messages 模式只会流出最终回答节点的 token，工具内部或分类节点里调用的 LLM 不会出现在流里。
    answer: false
    explain: |
      图里任何位置调用的 LLM（包括工具内部、分类节点）都会产生 messages 事件。要按元数据里的 langgraph_node 或 tags 过滤，或者给不想流出的模型调用加 nostream 标签。
  - id: d37-t20
    kp: d37-k4
    type: single
    question: Agent 流式回答到一半，用户刷新了页面。下面哪种恢复方式最合理？
    options:
      - "前端自动重新 POST 同一个问题，让 Agent 再跑一遍"
      - "后端缓存所有 token，前端刷新后全部重放一次"
      - "前端用 thread_id 查询最新快照还原界面"
      - "提示用户这次对话已失效，请重新提问"
    answer: [2]
    explain: |
      快照里有完整的对话状态和下一步信息，按 thread_id 读取即可还原界面；若停在审批中断上，也能重新渲染审批卡片。
      重新 POST 会再执行一遍 Agent，可能重复调用工具；缓存全部 token 成本高且解决不了中断状态；让用户重问体验最差。
exam:
  - id: d37-e1
    kp: d37-k3
    type: single
    question: 两个并行审批分支各自调用了 interrupt，`result.interrupts` 里有两个中断。恢复时应该怎么传值？
    options:
      - "调用两次 Command(resume=值)，按顺序各回答一个"
      - "Command(resume={中断1.id: 值1, 中断2.id: 值2})"
      - "只回答第一个，第二个会自动沿用同一个值"
      - "用 update_state 分别写入两个节点的结果"
    answer: [1]
    explain: |
      多个中断同时挂起时，用中断 ID 到 resume 值的映射一次性恢复，框架按 ID 把值分别交给对应的 interrupt。逐个调用、自动沿用都不是正确语义；update_state 不能回答中断。
  - id: d37-e2
    kp: d37-k3
    type: single
    question: compile 时设置的 `interrupt_before=["create_ticket"]` 和节点里调用 `interrupt()`，主要区别是：
    options:
      - "前者是静态断点，多用于调试；后者能携带结构化审批内容"
      - "前者需要 checkpointer，后者不需要"
      - "前者会让节点从头重跑，后者从断点那一行继续"
      - "两者完全等价，只是写法不同"
    answer: [0]
    explain: |
      两者都需要 checkpointer。静态断点在节点执行前或后固定停住，适合调试单步；interrupt() 写在节点内部，能把草稿等结构化内容抛给调用方，并接收 resume 值，是业务审批的推荐写法。interrupt 恢复时节点会从头重跑，而不是从断点那一行继续。
  - id: d37-e3
    kp: d37-k2
    type: single
    question: 运营发现 Agent 在第 3 步把楼栋识别错了，想手动改成「4号楼」后让 Agent 从这里继续。正确做法是：
    options:
      - "直接改数据库里的快照记录，再 invoke(None, cfg)"
      - "用新 thread_id 重新提问，并在问题里写明是 4 号楼"
      - "update_state 修改 building 字段，再从新快照继续"
      - "Command(resume={\"building\": \"4号楼\"}) 恢复执行"
    answer: [2]
    explain: |
      update_state 会基于当前快照新建一个修正后的快照，必要时用 as_node 控制下一步走向，然后 invoke(None, 新config) 继续。直接改数据库绕过了框架，容易破坏一致性；新线程丢掉了之前的步骤；没有中断时 Command(resume) 没有对象可回答。
  - id: d37-e4
    kp: d37-k4
    type: single
    question: 关于 langgraph 1.2 新增的 `graph.stream_events(input, version="v3")`，哪个说法正确？
    options:
      - "它取代了 checkpointer，流式时不再需要持久化"
      - "它只能流出 token，拿不到最终状态和中断信息"
      - "它是 LangGraph Server 专用 API，进程内不能调用"
      - "它按 messages、values、interrupts 等投影提供数据"
    answer: [3]
    explain: |
      事件流 API 返回一个可同时被多方消费的流对象，提供 stream.messages、stream.values、stream.interrupts、stream.output、stream.subgraphs 等投影，官方推荐多数应用代码使用。它与 checkpointer 无关，也可以在进程内直接调用。
  - id: d37-e5
    kp: d37-k3
    type: multi
    question: 设计「工单审批」的 interrupt payload 时，哪些内容适合放进去？
    options:
      - "工单草稿的标题、楼层、处理人"
      - "模型给出的风险等级和依据摘要"
      - "可选的决策类型和审批截止时间"
      - "工单系统客户端对象，方便恢复后直接调用"
    answer: [0, 1, 2]
    explain: |
      payload 要能 JSON 序列化，并给审批人足够的决策信息：草稿内容、风险依据、可选动作和截止时间。客户端对象不可序列化，也不该进快照；恢复后由 create_ticket 节点自己获取客户端。
  - id: d37-e6
    kp: d37-k2
    type: multi
    question: 把 checkpoint 方案从开发环境推到生产，下列哪些是必要的考虑？
    options:
      - "换成 Postgres 等持久化共享存储，并执行 setup 建表"
      - "异步图配异步版本的 saver"
      - "State 里只放引用，避免每步写入大对象"
      - "发版前确认没有中断线程停在被改名的节点前"
      - "保留 InMemorySaver，靠多实例冗余防丢失"
    answer: [0, 1, 2, 3]
    explain: |
      持久化存储与建表、异步 saver、控制快照体积、发版兼容性都是生产化要点。InMemorySaver 每个实例各存各的，多实例冗余并不能共享或恢复快照。
  - id: d37-e7
    kp: d37-k1
    type: judge
    question: 同一个 super-step 里节点 A 成功、节点 B 失败，修复后用 invoke(None, cfg) 恢复，A 会重新执行一遍。
    answer: false
    explain: |
      A 的输出已作为 pending writes 存进 checkpointer，恢复时只重跑失败的 B。这一机制避免了已成功节点的重复执行和重复副作用，但前提是挂了 checkpointer。
  - id: d37-e8
    kp: d37-k2
    type: judge
    question: 从历史快照回放（invoke(None, 旧快照config)）时，之后的 LLM 调用会读取上次的缓存结果，所以回放结果与原来完全一致。
    answer: false
    explain: |
      回放会重新执行旧快照之后的节点，LLM、外部 API 和 interrupt 都会重新发生，结果可能不同；有副作用的工具也会再执行一次，所以回放调试最好在测试环境或用模拟工具进行。
  - id: d37-e9
    kp: d37-k3
    type: case
    question: |
      p2 的告警处置图中，`approve_ticket` 节点先调用 LLM 根据 findings 生成工单草稿，再调用工单系统「创建草稿单」拿到 draft_id，最后 `interrupt` 把草稿推给值班长。值班长批准后，系统里出现了两张草稿单，而且最终提交的工单内容和值班长看到的不一致。最合理的改造是：
    options:
      - "给 LLM 设置 temperature=0，保证两次生成的草稿内容一致"
      - "拆成生成草稿、审批、提交三个节点，审批节点只调 interrupt，提交带幂等键"
      - "把 durability 改成 sync，确保 interrupt 前的步骤不会重复执行"
      - "用 try/except 包住 interrupt，批准后跳过节点前半段的代码"
    answer: [1]
    explain: |
      恢复时节点从头重跑，LLM 重新生成了一份不同的草稿，创建草稿单也执行了两次。根本解法是把「生成草稿」「审批」「提交」拆成独立节点：草稿在前一个节点生成并写进 State，审批节点只做 interrupt，提交时用告警单号做幂等键。
      temperature=0 不能保证输出完全一致，也解决不了重复建单；durability 管的是快照何时落盘，不改变节点重跑语义；try/except 包 interrupt 会吞掉暂停信号。
interview:
  - id: d37-i1
    kp: d37-k1
    type: short
    difficulty: 2
    question: 讲讲 LangGraph 的 checkpoint 机制：存了什么、什么时候存、thread_id 起什么作用？「继续」「重试」「恢复中断」「回放」分别怎么调用？
    key_points:
      - {text: "说明每个 super-step 后保存快照，含 values、next、config、metadata 和挂起的中断", dim: principle}
      - {text: "说明 thread_id 决定读写哪条快照链，复用 thread_id 不等于恢复", dim: concept}
      - {text: "分清四种调用：新输入、传 None、Command resume、旧快照 config 回放", dim: principle}
      - {text: "提到 pending writes 让已成功节点不重跑，以及生产要用持久化 saver", dim: engineering}
    reference: |
      **存什么、何时存：** 编译时挂上 checkpointer 后，图每走完一个 super-step 就保存一个 StateSnapshot，里面有当时的 State（values）、下一步要执行的节点（next）、含 thread_id 和 checkpoint_id 的 config、步骤元数据，以及待执行任务和挂起的中断。

      **thread_id：** 快照按 thread_id 归档成一条链，相当于 Git 的分支。用会话 ID 就是多轮对话，用业务单号就是一次业务流程。要注意复用 thread_id 本身不等于恢复，关键看传什么输入。

      **四种调用：**
      - invoke(新输入, cfg)：在最新状态上开始新一轮；
      - invoke(None, cfg)：不给新输入，从最新快照接着跑，用于出错重试；
      - invoke(Command(resume=值), cfg)：回答中断；
      - invoke(None, 旧快照的 config)：回放，后续节点和 LLM 会重新执行。

      **补充：** 同一步并行节点部分失败时，成功节点的输出作为 pending writes 保存，恢复只重跑失败的节点。生产环境用 AsyncPostgresSaver 这类持久化共享存储。
    oral: |
      我理解 checkpoint 就是给 Agent 每一步自动打一个 Git commit。挂上 checkpointer 后，每个 super-step 结束都会存一份快照，里面有当时的状态、下一步要跑哪个节点，还有挂起的中断。
      thread_id 相当于分支，决定读写哪条快照链。但复用 thread_id 不等于恢复，要看传什么：传新输入是新一轮对话，传 None 是出错后接着跑，传 Command resume 是回答审批中断，传旧快照的 config 是回放。
      在园区项目里，聊天用会话 ID，告警处置用告警单号做 thread_id，生产用 Postgres 存，所以重启和多实例都没问题。
  - id: d37-i2
    kp: d37-k3
    type: scenario
    difficulty: 3
    question: 园区 Agent 生成工单草稿后等待值班长审批。值班长第二天才点「批准」，而前一天夜里服务已经重启过，而且现在是 3 个实例。请说明 Agent 如何从断点继续，以及你在设计时防了哪些坑。
    key_points:
      - {text: "说明 interrupt 暂停时状态已存进持久化 checkpointer，按告警单号作 thread_id 可在任意实例恢复", dim: principle}
      - {text: "说明恢复方式：同一 thread_id 传 Command resume，节点从头重跑、interrupt 返回审批结果", dim: principle}
      - {text: "指出节点重跑带来的重复副作用和草稿不一致，给出拆节点和幂等键方案", dim: engineering}
      - {text: "提到 durability sync、第一快照前崩溃靠受理记录兜底、审批超时策略", dim: engineering}
      - {text: "提到发版时不要改名中断线程即将进入的节点，以及前端如何恢复审批卡片", dim: project}
    reference: |
      **为什么能继续：** 审批节点调用 interrupt 时，这次执行就结束了，State 和「下一步是 approve 节点」都已写进 AsyncPostgresSaver。重启只是丢了进程内存，快照还在数据库里。thread_id 用的是告警单号，所以值班长的请求落到任何一个实例，都能按单号找到这条快照链。

      **怎么恢复：** 审批接口收到「批准」后调用 graph.ainvoke(Command(resume={"action": "approve"}), {"configurable": {"thread_id": 告警单号}})。approve 节点会从头重跑，这次 interrupt 直接返回审批结果，然后流程进入 create_ticket。

      **防的坑：**
      1. **重复副作用：** 节点重跑会把 interrupt 之前的代码再执行一遍。所以草稿生成、审批、提交拆成三个节点，审批节点只调 interrupt；提交工单带告警单号作为幂等键。
      2. **落盘时机：** 这条流程用 durability="sync"，每步写完才继续。
      3. **第一快照前崩溃：** 告警受理时先写业务表，巡检任务拉起「已受理但无快照」的记录。
      4. **超时：** 24 小时未审批自动驳回并通知，避免线程永久挂起。
      5. **发版兼容：** 有线程停在审批上时，不改名或删除 create_ticket 节点。

      **前端：** 值班长打开审批页时，按告警单号调 get_state，从 interrupts 里取出草稿渲染卡片，所以页面刷新也不丢。
    oral: |
      结论是：能无缝继续，因为暂停时状态已经在 Postgres 里了，跟进程活不活着没关系。
      我们用告警单号做 thread_id，interrupt 的时候这次执行就结束了，快照里记着状态和下一步是审批节点。第二天值班长点批准，请求不管落到哪个实例，都用同一个单号传 Command resume，审批节点从头重跑，interrupt 直接返回批准结果，然后进入建工单。
      设计时我主要防了几个坑：一是节点会重跑，所以生成草稿、审批、提交拆成三个节点，提交带幂等键，不会建两张单；二是这条流程用 sync 落盘，受理时先写业务表兜底；三是审批超过 24 小时自动驳回；四是发版时不改审批后面的节点名。
  - id: d37-i3
    kp: d37-k4
    type: design
    difficulty: 3
    question: 请为园区运营台设计 Agent 的流式交互协议：既要打字机输出，又要显示步骤进度，遇到审批要弹卡片，还要支持刷新页面后恢复。说说后端怎么从 LangGraph 取事件、事件怎么定义、前端怎么处理断线。
    key_points:
      - {text: "后端用 astream 同时开 messages 和 custom（或 stream_events v3），v2 格式按 type 分流", dim: principle}
      - {text: "定义 token、progress、approval、done、error 等 SSE 事件，并说明数据结构", dim: engineering}
      - {text: "说明 messages 要按 langgraph_node 或 tags 过滤，内部模型调用加 nostream", dim: principle}
      - {text: "断线或刷新时不重新提交，而是按 thread_id 读快照还原界面和审批卡片", dim: engineering}
      - {text: "提到 Nginx 关闭缓冲、POST 加 fetch 读流等前端落地细节", dim: project}
    reference: |
      **取事件：** FastAPI 接口用 graph.astream(输入, cfg, stream_mode=["messages", "custom"], version="v2")。messages 事件按元数据 langgraph_node 只保留回答节点的 token，意图分类这类内部模型调用加 nostream 标签。查询节点开头用 get_stream_writer 写进度。流结束后用 aget_state 检查 interrupts。新项目也可以用 stream_events(version="v3")，直接读 stream.messages 和 stream.interrupts 投影。

      **事件协议：**
      - token：{text}，打字机追加；
      - progress：{step, building}，驱动步骤条；
      - approval：{draft, risk, options, expires_at}，弹审批卡片；
      - done：{thread_id}，结束；
      - error：{code, message}，可重试或提示。

      **前端：** 对话是 POST，所以用 fetch 加 ReadableStream 按 SSE 格式解析，而不是 EventSource。Nginx 关闭缓冲，否则事件会攒在一起才到。

      **断线与刷新：** 不自动重新提交问题，否则 Agent 会重跑、工具会重复调用。前端保存 thread_id，刷新后调 /threads/{id}/state，后端返回快照中的消息和 interrupts：已完成就展示结果；停在审批就重新渲染卡片；仍在执行就显示「处理中」并轮询状态。
    oral: |
      我会把它分成取事件、定协议、做恢复三层。
      后端用 astream 同时开 messages 和 custom 两种模式，用 v2 格式按 type 分流。messages 只保留回答节点的 token，内部分类器加 nostream；查询节点用 stream writer 推进度；流结束后检查快照里有没有中断。
      对前端我定义了 token、progress、approval、done、error 五种事件，审批事件带草稿、风险依据和截止时间。因为是 POST，前端用 fetch 读流，Nginx 要关缓冲。
      最关键的是断线不重发问题。前端存 thread_id，刷新后按 thread_id 拉快照，跑完就展示结果，停在审批就重新弹卡片，这样不会让 Agent 重跑。
