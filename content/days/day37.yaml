day: 37
phase: 4
title: LangGraph 进阶：checkpoint 断点恢复、interrupt 人工审批与流式输出
goals:
  - 能说清 checkpoint 存了什么、什么时候存、thread_id 起什么作用，以及「继续、重试、恢复、回放」四种调用的区别
  - 能为生产环境选择 checkpointer 和 durability 模式，并处理「第一个快照前就崩溃」这类边界情况
  - 能用 interrupt + Command(resume) 实现跨天审批，并避开节点重跑导致的重复副作用
  - 能把 LangGraph 的流式事件通过 SSE 推给 Vue 前端，区分 token、进度和审批事件
minutes: 60
resources:
  - title: "LangChain Academy：Introduction to LangGraph（Module 3）"
    url: "https://academy.langchain.com/courses/intro-to-langgraph"
    kind: course
    lang: en
    minutes: 60
    note: "只看 Module 3：Streaming、Breakpoints、Editing State and Human Feedback、Dynamic Breakpoints、Time Travel 五课，正好对应今天四个知识点"
