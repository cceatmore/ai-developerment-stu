day: 27
phase: 3
title: 生成与引用：Prompt 组装、上下文注入、引用来源与拒答
goals:
  - 能说出 RAG Prompt 的组成和推荐顺序，并按 Token 预算完成去重、合并、截断和元数据注入
  - 能完整讲清「chunk → 短编号 → 文档与页码」的引用链路，并找出引用编号错位这类 bug
  - 能设计检索层阈值 + 生成层规则的两层拒答机制，并说明如何平衡误拒与错答
  - 能设计流式输出下的引用方案，让前端把编号渲染成可点击的来源
minutes: 60
