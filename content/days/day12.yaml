knowledge_points:
  - id: d12-k1
    name: Transformer 整体结构与 Decoder-only
    level: P1
    summary: 主流大模型是 Decoder-only Transformer：Token 变向量，经过 N 层「注意力 + 前馈网络」加工，最后输出下一个 Token 的概率
    analogy: |
      像一条 **webpack loader / Koa 中间件链**：同一份数据依次经过很多层处理，每层在上一层结果上继续加工，最后输出产物。
      Transformer 里流动的是「每个 Token 一个向量」，每层都让这些向量融合更多上下文含义。

      **不一样的地方**：loader 每个功能不同、是人写的；Transformer 的 N 层**结构完全相同**，具体「学会做什么」由训练出来的参数决定，人看不懂也没法单独改某一层。
    why: |
      Transformer 是几乎所有主流大模型的底座。面试里「讲一下 Transformer」是 LLM 岗位高频题——**不要求推公式，但要求能讲清数据怎么流、每层干什么**。
      对应用开发者，它还解释了很多实际现象：为什么有上下文长度上限、为什么 Embedding 模型和对话模型是两类东西（Day 18）、为什么输入能并行处理而输出不能。
    problem: |
      Transformer 之前的 RNN/LSTM 按顺序逐字处理：**训练没法并行**，句子一长前面的信息就逐步衰减。
      Transformer 用注意力让每个位置**直接看到**其他位置，训练时一整段文本可以并行计算，长距离依赖也更容易建模——这才让「在海量数据上训练超大模型」成为可能。
    principle: |
      **一、三种变体**

      2017 年论文《Attention Is All You Need》提出的原始 Transformer 是 **Encoder-Decoder** 结构，用于机器翻译。后来分化出三类：

      | 变体 | 代表 | 每个位置能看到 | 典型用途 |
      |---|---|---|---|
      | Encoder-only | BERT 系列 | 全文（双向） | 分类、理解、**Embedding 向量**（Day 18） |
      | **Decoder-only** | GPT、LLaMA、Qwen、DeepSeek 等 | **只能看前面**（因果） | **生成**（文字接龙，Day 11） |
      | Encoder-Decoder | T5、原始 Transformer | 编码看全文，解码看前面 | 翻译、摘要 |

      当前主流对话大模型基本是 **Decoder-only**（闭源模型不一定公开细节，这里指公开资料里的主流做法）。

      **二、Decoder-only 的数据流**

      ```mermaid
      flowchart TD
        A["输入文本"] --> B["Tokenizer 切成 Token ID"]
        B --> C["嵌入 每个 ID 变成一个向量"]
        C --> D["注入位置信息"]
        D --> E["第 1 层 注意力 加 前馈网络"]
        E --> F["第 2 层 到 第 N 层 结构相同"]
        F --> G["取最后一个位置的向量"]
        G --> H["输出头 对整个词表打分"]
        H --> I["Softmax 得到下一个 Token 的概率"]
      ```

      **三、每一层（Block）里有什么**

      1. **自注意力**：让每个 Token 去「看」其他 Token，汇总上下文信息（d12-k2）。负责**位置之间的信息交流**。
      2. **前馈网络（FFN / MLP）**：对每个位置的向量单独加工，可以粗略理解为**存储和运用知识**的地方，参数量占大头。
      3. **残差连接 + 归一化**：保证几十上百层叠起来还能稳定训练，了解即可。

      一句话直觉：**注意力负责「开会交流」，FFN 负责「各自回工位思考」**，重复 N 层后，每个位置的向量都融合了整段上下文的含义。

      **四、位置信息：注意力本身不懂顺序**

      注意力只算「谁和谁相关」，交换两个 Token 的位置，结果只是跟着交换，分不清「猫追狗」和「狗追猫」。所以要额外**注入位置信息**（原始论文用正弦余弦编码，很多开源模型用 RoPE 旋转位置编码）。
      模型训练时见过的长度有限，厂商通过长文本继续训练等方法扩展窗口，但**能装下不等于用得好**（Day 13 讲长上下文退化）。

      **五、训练和生成的区别**

      - **训练时**：整段文本一次输入，每个位置同时预测自己的下一个 Token，靠因果掩码保证不偷看后文，因此能**大规模并行**。
      - **生成时**：输入可以并行处理，但输出必须一个一个生成（Day 11），这就是 prefill 和 decode 两阶段（d12-k3）。
    scenarios: |
      - **模型选型**：知道 Embedding 模型多为 Encoder 结构、对话模型是 Decoder-only，不会拿聊天模型硬做向量检索。
      - **私有化部署沟通**：能听懂算法团队说的「层数、隐藏维度、注意力头数」，知道它们影响显存和速度。
      - **解释上下文上限**：客户问「为什么不能无限长」，能从位置信息和计算量两方面解释。
    pitfalls: |
      - **误区：Transformer 只有注意力。** 每层还有 FFN、残差和归一化，FFN 参数往往更多。
      - **误区：所有 Transformer 都能生成文本。** BERT 类 Encoder-only 模型不做自回归生成，主要用于理解和向量表示。
      - **混淆：训练时并行 ≠ 生成时并行。** 训练和输入处理可以并行，输出生成仍是逐 Token 串行。
      - **误区：窗口扩展到百万就和短文本一样好用。** 位置信息和注意力分散都会让超长输入的利用率下降。
    interview_asks:
      - question: "讲一下 Transformer 的整体架构，一个 Token 是怎么变成下一个 Token 的概率的？"
        answer: "输入 Token 先变成向量，加上位置信息，再过多层注意力和前馈网络。最后一层给出词表上每个 Token 的分数，变成概率。取一个 Token，再重复这个过程。现在的对话模型基本是只保留解码器的这种结构。"
      - question: "Transformer 相比 RNN 有什么优势？"
        answer: "RNN 要按顺序一步步算，前面忘了后面就弱。Transformer 用注意力直接看上下文里相关的位置，长距离依赖更好，训练时也能并行算整段。代价是上下文一长，注意力计算变贵。"
      - question: "Encoder-only、Decoder-only、Encoder-Decoder 有什么区别？各用在什么场景？"
        answer: "Encoder-only 适合理解，比如 BERT 做分类和向量。Decoder-only 适合从左到右生成，现在的 GPT、DeepSeek 对话模型是这种。Encoder-Decoder 适合翻译、摘要这种输入输出分开的任务。"
    project_example: |
      **p1 企业知识库问答** 里会同时用到两类模型：
      - **Embedding 模型**（多为 Encoder 结构）：把文档切片和用户问题变成向量做检索（Day 18、Day 24），小而快、可批量；
      - **对话模型**（Decoder-only）：只负责最后基于检索片段生成回答。
      面试时被问「为什么检索不直接用对话模型」，你可以用今天的架构差异回答，而不是只说「大家都这么做」。
  - id: d12-k2
    name: Attention 直觉与计算流程
    level: P0
    summary: 每个 Token 拿自己的 Query 去和所有 Token 的 Key 打分，按分数加权混合它们的 Value，得到融合上下文的新向量
    analogy: |
      像你做过的 **前端模糊搜索 + 加权合并**：拿搜索词（Query）去和每条数据的索引字段（Key）算匹配分，再按分数把数据内容（Value）**加权混在一起**作为结果。

      **不一样的地方**：
      - 搜索通常取 Top 1 或 Top N；注意力是**所有条目都参与**，只是权重不同（软选择）。
      - 搜索词和索引是现成的；Q、K、V 是同一组 Token 向量乘上**三个训练出来的矩阵**得到的。
      - 每个 Token 都要当一次「搜索者」，所以 n 个 Token 就是 n × n 次打分。
    why: |
      注意力是 Transformer 的核心，也是面试官判断你「是否只会调 API」的关键题。
      它还直接解释应用层的现象：**为什么上下文越长计算越多越贵**、为什么模型能理解代词指代、为什么用清晰的分隔和标题组织 Prompt 有帮助、为什么长文本中间的信息容易被忽略（Day 13）。
    problem: |
      同一个词在不同语境下含义不同：「告警已经处理了」和「处理一下这条告警」里的「处理」，「苹果发布新手机」和「我吃了个苹果」里的「苹果」。
      自注意力让每个 Token 根据上下文**动态地**从其他 Token 那里汇总信息，得到「结合语境」的表示，而不是一个固定不变的词向量。
    principle: |
      **一、Q / K / V：一次「检索」**

      每个 Token 的向量分别乘上三个矩阵，得到三个向量：

      | 名字 | 直觉 | 图书馆类比 |
      |---|---|---|
      | **Query（Q）** | 我想找什么信息 | 你带着的问题 |
      | **Key（K）** | 我能提供什么信息的「标签」 | 每本书的书脊标签 |
      | **Value（V）** | 被关注时我给出的实际内容 | 书的内容 |

      你拿问题（Q）对比每本书的标签（K），越匹配的书越认真读它的内容（V），最后把读到的内容按认真程度加权汇总。

      **二、计算流程（以一个 Token 为例）**

      ```mermaid
      flowchart LR
        X["每个 Token 的向量"] --> Q["乘 Wq 得到 Q"]
        X --> K["乘 Wk 得到 K"]
        X --> V["乘 Wv 得到 V"]
        Q --> S["Q 与每个 K 点积 得到相关度"]
        K --> S
        S --> D["除以 根号 d 做缩放"]
        D --> M["因果掩码 屏蔽后面的位置"]
        M --> P["Softmax 变成权重 和为 1"]
        P --> O["按权重加权求和 V"]
        V --> O
        O --> R["融合上下文的新向量"]
      ```

      面试时按步骤讲出来即可，不必推公式：

      1. **打分**：当前 Token 的 Q 与所有 Token 的 K 做点积，越大越相关。
      2. **缩放**：除以 K 维度的平方根。维度大时点积很大，Softmax 会变得极端（几乎只看一个位置），训练不稳定。
      3. **掩码**：Decoder-only 用**因果掩码**把「后面位置」的分数设为负无穷，保证预测第 i 个位置时只看到 i 之前，否则训练时等于偷看答案。
      4. **归一化**：Softmax 把分数变成和为 1 的权重。
      5. **加权求和**：用权重混合所有 V，得到这个 Token 的新表示。

      例：「工单派给了张工，因为**他**负责 3 号楼」，「他」的 Q 与「张工」的 K 匹配度高，于是「他」的新向量融入了大量「张工」的信息，完成指代理解。

      **三、多头注意力**

      - 把 Q/K/V 切成多组（多个「头」），每个头独立做一次注意力，最后拼接起来。
      - 直觉：不同的头可以关注不同关系——有的关注语法搭配，有的关注指代，有的关注相邻词。单头的加权平均会把这些关系抹平。

      **四、计算量：和长度的平方相关**

      n 个 Token 时，每个 Token 都要和所有（之前的）Token 打分，打分矩阵约 **n × n**。输入长度翻倍，这部分计算量约变为 **4 倍**。
      这是长上下文昂贵、首字延迟随输入变长而增加的根本原因之一（d12-k3、d12-k4）。

      **不理解会怎样**：你会以为上下文窗口「免费」、越长越好；面试被问到 Q/K/V 只能背公式，答不出为什么要缩放、为什么要掩码。
    scenarios: |
      - **解释长上下文成本**：给客户解释为什么一次塞 50 万 Token 的文档又慢又贵，而 RAG 只放相关片段更合适。
      - **Prompt 组织**：知道模型靠注意力在上下文里「找」相关信息，用清晰的标题、分隔标签、来源编号组织 Prompt，帮助相关内容被关注到（Day 15）。
      - **技术面试与方案评审**：能用 Q/K/V 讲清模型如何理解指代和上下文，体现原理功底。
    pitfalls: |
      - **误区：Q、K、V 是三份不同的输入。** 自注意力里它们来自同一组 Token 向量，只是乘了三个不同的可学习矩阵。
      - **误区：注意力权重就是模型做决定的「解释」。** 它能提供线索，但不能直接等同于决策原因。
      - **遗漏：讲生成模型的注意力不提因果掩码。** 说明没理解训练为什么能并行又不作弊。
      - **混淆：自注意力与交叉注意力。** 自注意力 Q/K/V 来自同一序列；Encoder-Decoder 里的交叉注意力 Q 来自解码器、K/V 来自编码器。
    interview_asks:
      - question: "讲一下自注意力机制，Q、K、V 分别是什么？"
        answer: "每个 Token 算出三组向量。Q 是我要找什么，K 是我能被别人怎么匹配，V 是匹配上之后把什么信息传过去。用 Q 和各个 K 算相关性，再按这个权重把 V 加起来。"
      - question: "为什么注意力分数要做缩放？为什么 Decoder 需要因果掩码？"
        answer: "分数不缩放时，维度一高，点积很大，softmax 会变得非 0 即 1，训练不稳定。因果掩码把后面的 Token 遮住，生成时不能偷看还没写出来的内容。"
      - question: "多头注意力有什么用？为什么上下文越长计算越贵？"
        answer: "多头是分几组各自看不同关系，比如一组看语法、一组看指代，再合并。每个 Token 要和上下文里其他 Token 算相关性，长度翻倍，这部分计算大约变成 4 倍。"
    project_example: |
      **p2 智慧园区运营 Agent** 的工具返回结果常常很长（几百条告警明细）。如果原样塞回上下文：
      - 注意力要在大量无关条目里「找」关键信息，计算量和费用都随长度上升；
      - 关键告警更容易被淹没。
      更好的做法是让工具先在代码里**过滤、聚合**（按楼栋统计、只返回未处理的前 N 条），再把精简结果交给模型——这是你后面做 Agent 工具设计（Day 33）时的一条基本原则。
  - id: d12-k3
    name: 推理过程：prefill 与 decode
    level: P0
    summary: Prefill 并行处理全部输入并产出第一个 Token，决定首字延迟；Decode 逐个生成后续 Token，决定输出速度
    analogy: |
      像一次 **SSR + 流式渲染**的页面请求：
      - **prefill** ≈ 服务器收到请求后处理到吐出第一个字节，对应 **TTFB**；处理的数据越多，TTFB 越长。
      - **decode** ≈ 之后一块一块 chunked 流式输出，每块的间隔决定「打字速度」。

      **不一样的地方**：页面流式输出的每块是现成内容；decode 的每个 Token 都要**重新跑一遍模型**，而且要读取之前所有 Token 的缓存（d12-k4），所以上下文越长，每步也会略慢。
    why: |
      「为什么首字这么慢」「为什么打字这么慢」是 AI 产品最常见的性能投诉，两者的原因和优化手段**完全不同**。
      能把延迟拆成 prefill 和 decode 两段，是区分「会用」和「懂原理」的标志，也是后面性能与成本优化（Day 19、Day 47）的基础。
    problem: |
      解决「**慢在哪里**」的定位问题：一次请求的总耗时由「等第一个字」和「后续逐字输出」两部分组成，分别受输入长度和输出长度影响。
      不拆开看，就会出现「输出慢却去压缩输入」「首字慢却去限制输出长度」这类无效优化。
    principle: |
      **一、两个阶段**

      ```mermaid
      sequenceDiagram
        participant C as 客户端
        participant S as 推理服务
        participant G as GPU
        C->>S: 发送 Prompt 共 n 个 Token
        S->>G: Prefill 一次并行计算全部输入
        G-->>S: 第 1 个输出 Token
        S-->>C: 首字到达 即 TTFT
        loop Decode 每步 1 个 Token
          S->>G: 只计算新 Token 并读取缓存
          G-->>S: 下一个 Token
          S-->>C: 流式推送
        end
      ```

      | 阶段 | 做什么 | 特点 | 主要影响 |
      |---|---|---|---|
      | **Prefill** | 并行处理全部输入，建立 KV Cache（d12-k4），产出第 1 个 Token | 计算密集，**输入越长越慢** | **首字延迟 TTFT** |
      | **Decode** | 每步生成 1 个 Token | 串行，主要受显存带宽限制 | **每 Token 间隔、输出速度** |

      **二、延迟怎么估算**

      ```text
      总耗时 ≈ TTFT + 输出 Token 数 × 每 Token 间隔
      ```

      例（数字为假设，便于计算）：TTFT 0.8 秒、每 Token 25 毫秒、输出 400 Token → 总耗时约 0.8 + 10 = **10.8 秒**。
      可以看出：**长回答的总耗时主要花在 decode**；而长输入、短输出（比如分类、抽取）的耗时主要在 prefill。

      **三、对应的优化方向**

      | 症状 | 大概率慢在 | 常见手段 |
      |---|---|---|
      | 首字迟迟不出 | Prefill | 精简 System Prompt 和检索片段、利用 Prompt 缓存（d12-k4）、换更快的模型 |
      | 打字慢、总耗时长 | Decode | 控制输出长度、流式输出改善感知、换更快的模型 |
      | 推理模型首字特别晚 | Decode（推理 Token 先生成） | 降低 effort、前端显示「正在思考」（Day 11） |

      **四、流式输出改善的是什么**

      流式（SSE，Day 10）让用户在 TTFT 后就看到内容，**感知速度**大幅提升，但**总耗时基本不变**。所以「改成流式」解决的是体验问题，解决不了「生成太长太贵」。

      **五、怎么测**

      在流式调用里记录三个时间点：发出请求、收到第一个文本增量、收到结束事件。前两者之差是 TTFT，后两者之差除以输出 Token 数约等于每 Token 间隔。把它们和 usage 一起写进日志，才能做有依据的优化。
    scenarios: |
      - **定位慢请求**：日志里拆出 TTFT 和总耗时，判断是输入太长（prefill）还是输出太长（decode）。
      - **设定超时**：网关超时按「TTFT 上限 + 最大输出 × 每 Token 间隔」估算，而不是拍一个 30 秒。
      - **选型对比**：同一批请求对比不同模型的 TTFT 和输出速度，而不是只看「总耗时」。
    pitfalls: |
      - **误区：流式输出能缩短总耗时。** 它改善的是首字等待，总生成时间基本不变。
      - **误区：输入长度只影响费用，不影响速度。** 输入越长，prefill 越久，首字越慢。
      - **混淆：TTFT 与总耗时。** 一个看「多快开始」，一个看「多久结束」，优化手段不同。
      - **误区：输出慢一定是网络问题。** 先看每 Token 间隔，大多数时候是 decode 本身的速度或输出太长。
    interview_asks:
      - question: "大模型推理分哪两个阶段？首字延迟主要受什么影响？"
        answer: "先是 prefill，把整段输入一次性算完；然后是 decode，一个 Token 一个 Token 往外吐。首字慢主要是输入太长、排队、或检索还没结束。吐字慢主要是生成阶段本身。"
      - question: "用户反馈「回答开始得很慢」和「回答打字很慢」，你分别会怎么排查？"
        answer: "开始慢看首字时间：输入 Token 数、检索耗时、排队。打字慢看每个 Token 的间隔：输出是否太长、模型是否太大、有没有在生成阶段做重活。两个指标分开看，不要只看总时长。"
    code: |
      ```python
      import os
      import time

      from openai import OpenAI

      client = OpenAI(api_key=os.environ["LLM_API_KEY"], base_url=os.getenv("LLM_BASE_URL"))

      t0 = time.perf_counter()
      ttft = None
      stream = client.responses.create(model=os.environ["LLM_MODEL"], input="介绍一下园区的消防巡检流程", stream=True)
      for event in stream:
          if event.type == "response.output_text.delta" and ttft is None:
              ttft = time.perf_counter() - t0          # 首字延迟：主要由 prefill 决定
          elif event.type == "response.completed":
              total = time.perf_counter() - t0
              out = event.response.usage.output_tokens
              print(f"TTFT={ttft:.2f}s total={total:.2f}s per_token={(total - ttft) / out * 1000:.0f}ms")
      ```
    project_example: |
      **p1 企业知识库问答** 上线前，在 LLM 客户端（Day 14）里统一记录 TTFT、总耗时、输入/输出 Token：
      - 如果 TTFT 偏高且输入 Token 很大 → 检查检索片段是不是放太多了、System Prompt 是否过长；
      - 如果总耗时长但 TTFT 正常 → 看回答是不是太啰嗦，收紧输出格式。
      这些指标后面会用在性能优化（Day 47）和简历里的项目指标上，**数字用你自己的测量结果填写**。
  - id: d12-k4
    name: KV Cache 与长上下文代价
    level: P0
    summary: KV Cache 缓存已算过 Token 的 K 和 V，生成新 Token 时不用重算；代价是显存随长度和并发线性增长，Prompt 缓存则跨请求复用相同前缀
    analogy: |
      **KV Cache ≈ Vue 的 computed 缓存**：依赖没变就直接用上次的结果，不重新计算。前面 Token 的 K、V 不会因为后面来了新 Token 而改变，所以可以缓存。

      **Prompt 缓存 ≈ HTTP / CDN 缓存**：同样的 URL 才能命中；你在 URL 后面加 `?t=时间戳`，缓存就被击穿。Prompt 开头塞一个当前时间，效果一模一样。

      **不一样的地方**：Prompt 缓存按**前缀**匹配（开头相同的部分可以复用），有最小长度要求和过期时间，命中与否要看响应里的 `cached_tokens`，不能靠猜。
    why: |
      这是 Transformer 原理和应用工程**连接最紧密**的知识点：为什么长上下文又慢又贵、为什么厂商对缓存命中的输入打折、为什么私有化部署时并发总上不去、为什么 Prompt 模板的顺序会影响费用。
      面试里能讲清 KV Cache 和 Prompt 缓存，并能落到模板设计上，会非常加分。
    problem: |
      朴素的自回归生成每产出一个新 Token，都要把前面所有 Token 重新算一遍注意力，长度为 n 时重复计算量巨大。
      KV Cache 把算过的 K、V **存下来**，新 Token 只算自己的 Q/K/V 并与缓存做注意力。Prompt 缓存则更进一步：**多个请求开头相同的部分**，连 prefill 都可以跳过。
    principle: |
      **一、为什么能缓存 K 和 V**

      因果掩码保证**前面 Token 的 K、V 不会因为后面出现新 Token 而改变**。所以生成第 101 个 Token 时，前 100 个 Token 在每一层的 K、V 都能直接复用，只需计算新 Token 自己的。

      ```mermaid
      flowchart LR
        A["Prefill 输入 n 个 Token"] --> B["每层写入 n 份 K 和 V"]
        B --> C["KV Cache 存在显存"]
        C --> D["Decode 新 Token 只算自己的 Q K V"]
        D --> E["新 Q 与缓存中全部 K 打分 加权 V"]
        E --> F["输出下一个 Token"]
        F --> G["追加新 Token 的 K V 到缓存"]
        G --> D
      ```

      **二、代价：显存**

      - 缓存大小约与「**层数 × 序列长度 × K/V 维度 × 并发请求数**」成正比。
      - 序列越长、并发越多，显存占用越大。私有化部署时，**显存常常先被 KV Cache 而不是模型参数耗尽**，表现为并发上不去。
      - 业界优化方向：多个注意力头共享 K/V（MQA、GQA）、分页管理缓存（如 vLLM 的 PagedAttention）、缓存量化等，应用开发者知道方向即可。

      **三、长上下文的四重代价**

      | 代价 | 原因 |
      |---|---|
      | **首字更慢** | prefill 要处理全部输入，注意力打分随长度平方增长（d12-k2） |
      | **每步更慢** | decode 每步都要读整个 KV Cache |
      | **显存更多** | KV Cache 随长度线性增长，挤占并发 |
      | **费用更高** | 输入按 Token 计费（Day 13），还可能效果下降（Day 13 长上下文退化） |

      **四、Prompt 缓存：跨请求复用前缀**

      - 多个请求如果**开头完全相同**（同一份 System Prompt、同一组工具定义、同一份长文档），服务端可以复用这段前缀已算好的 KV 状态，**跳过重复的 prefill**。
      - OpenAI 文档明确：Prompt 缓存存的是 **KV 张量**，复用要求**前缀完全一致**；GPT-5.6 及之后的模型最小可缓存前缀为 1,024 Token；命中部分按更低的缓存价格计费（文档称最多打折 95%，具体看模型定价）。
      - 效果：降低首字延迟 + 降低输入费用。命中情况看响应 `usage` 里的 `cached_tokens`。

      ```mermaid
      flowchart TD
        A["稳定前缀 角色 规则 输出格式 工具定义"] --> B["半稳定 租户配置"]
        B --> C["动态 检索片段"]
        C --> D["动态 会话历史"]
        D --> E["动态 当前时间 用户信息 本轮问题"]
      ```

      **模板设计原则：稳定内容在前，变化内容在后**。在开头插入时间戳、用户名、请求 ID，会让每个请求前缀都不同，缓存永远不命中。

      **五、区分三种「缓存」**

      | 名称 | 缓存什么 | 在哪 | 谁控制 |
      |---|---|---|---|
      | KV Cache | 单次请求内的 K、V | 推理服务显存 | 推理引擎自动 |
      | Prompt 缓存 | 跨请求相同前缀的 KV 状态 | 厂商服务端 | 你控制前缀是否稳定 |
      | 业务答案缓存 | 最终答案 | 你的 Redis 等 | 你完全控制（Day 19） |
    scenarios: |
      - **Prompt 模板设计**：固定的角色说明、规则、工具定义放最前且保持不变；检索结果、时间、用户问题放后面，提高缓存命中。
      - **私有化部署容量规划**：根据最大上下文长度和目标并发估算 KV Cache 显存，决定每请求最大长度和 GPU 数量。
      - **成本优化**：监控 `cached_tokens / input_tokens` 的命中率，命中率突降时排查是否有人改动了模板开头。
    pitfalls: |
      - **误区：KV Cache 是缓存「答案」。** 它缓存的是中间计算结果 K、V，和业务层的答案缓存（Redis）完全不同。
      - **误区：Prompt 缓存只要内容差不多就能命中。** 必须前缀完全一致，开头插入时间戳会让缓存全部失效。
      - **误区：命中缓存就不占上下文窗口。** 缓存只改变计费和速度，这些 Token 仍然计入窗口（Anthropic 文档明确说明）。
      - **误区：长上下文的代价只有费用。** 还有首字延迟、显存占用和效果下降。
    interview_asks:
      - question: "什么是 KV Cache？为什么能加速生成？代价是什么？"
        answer: "生成下一个 Token 时，前面 Token 的 K 和 V 不用重算，缓存下来。所以每步只算新 Token。代价是缓存占显存，上下文越长、并发越高，显存越大。"
      - question: "Prompt 缓存的原理是什么？Prompt 模板应该怎么组织才能提高命中？"
        answer: "厂商可以把相同前缀的计算结果复用。前缀必须逐字节一致才命中。所以把稳定的系统提示、工具定义放前面，把用户问题和检索结果放后面。前面一变，后面的缓存都用不上。"
      - question: "为什么长上下文又慢又贵？"
        answer: "输入越长，prefill 越慢，注意力计算和 KV Cache 都变大，输入 Token 也按量计费。长上下文不是免费的大口袋。能检索出短证据，就不要把整库塞进去。"
    project_example: |
      **p3 前端 Coding Agent** 每一轮都会发送：很长的系统规则 + 工具定义 + 仓库目录摘要 + 对话与工具结果。
      模板设计时让「系统规则 + 工具定义 + 仓库摘要」作为**固定前缀**放在最前面，每轮新增的工具结果和用户指令追加在末尾，不在开头插入时间或会话 ID。
      多轮循环中前缀能持续命中 Prompt 缓存，首字延迟和输入费用都会下降；在日志里记录 `cached_tokens` 就能验证，**命中率用你自己的观测数据填写**。
    freshness: |
      核对于 2026-11：OpenAI Prompt caching 文档说明缓存存储的是 KV 张量而非 Token 本身，复用需要前缀完全一致，建议稳定指令与共享资料放前、时间戳和用户相关内容放后；GPT-5.6 及之后模型最小可缓存前缀 1,024 Token，命中部分按缓存价计费（最多打折 95%）。Anthropic Context windows 文档说明缓存的前缀仍占用上下文窗口。缓存规则与价格随模型变化，以官方文档为准。
    sources:
      - {title: "OpenAI Docs - Prompt caching", url: "https://developers.openai.com/api/docs/guides/prompt-caching"}
      - {title: "Anthropic Docs - Context windows", url: "https://platform.claude.com/docs/en/build-with-claude/context-windows"}
test:
  - id: d12-t1
    kp: d12-k1
    type: single
    question: "关于当前主流对话大模型（如 GPT、Qwen、DeepSeek 系列）的结构，哪项描述最准确？"
    options:
      - "Encoder-only 结构，每个位置都能同时看到全文"
      - "Decoder-only 结构，每个位置只能看到它前面的内容"
      - "Encoder-Decoder 结构，先完整理解问题再生成回答"
      - "不再使用 Transformer，而是改用循环神经网络"
    answer: [1]
    explain: |
      公开资料中主流对话大模型采用 Decoder-only 结构，靠因果掩码保证每个位置只看前文，做自回归生成。
      A 是 BERT 类模型的特点，适合理解和 Embedding；C 是原始 Transformer 和 T5 的结构；D 与事实不符。
  - id: d12-t2
    kp: d12-k1
    type: judge
    question: "Transformer 每一层只有注意力机制，所以模型的大部分参数都在注意力里。"
    answer: false
    explain: |
      每层除了自注意力，还有前馈网络（FFN）、残差连接和归一化，FFN 的参数量往往占大头，粗略可理解为存储和运用知识的地方。
      注意力负责位置之间的信息交流，FFN 负责对每个位置单独加工，两者缺一不可。
  - id: d12-t3
    kp: d12-k1
    type: single
    question: "为什么 Transformer 需要额外注入位置信息？"
    options:
      - "为了让模型知道每个 Token 在词表里的编号"
      - "为了减少注意力的计算量，让长文本更快"
      - "因为输入 Token 太多时需要用位置来截断"
      - "因为注意力只算相关度，本身分不清词的先后顺序"
    answer: [3]
    explain: |
      注意力对每对 Token 计算相关度再加权求和，交换两个 Token 的位置结果只是跟着交换，本身不包含顺序信息，所以要注入位置编码，才能区分「猫追狗」和「狗追猫」。
      A 混淆了 Token ID；B 位置编码不减少计算量；C 截断是应用层策略，与位置编码无关。
  - id: d12-t4
    kp: d12-k1
    type: multi
    question: "以下关于 Transformer 训练和生成的说法，哪些正确？"
    options:
      - "训练时整段文本可以并行计算，每个位置同时预测下一个 Token"
      - "生成时输入部分可以并行处理，但输出仍要逐个生成"
      - "因果掩码让训练时每个位置看不到后面的答案"
      - "因为训练能并行，所以生成时输出也能一次性并行产出"
    answer: [0, 1, 2]
    explain: |
      A、C：训练时借助因果掩码，整段文本并行计算且不偷看后文；B：生成时输入可以一次性 prefill，输出必须自回归逐个生成。
      D 错：输出的每个 Token 依赖前一个 Token 的结果，无法并行产出，这正是输出越长越慢的原因。
  - id: d12-t5
    kp: d12-k2
    type: single
    question: "句子「工单派给了张工，因为他负责 3 号楼」中，模型能把「他」理解为「张工」。用注意力机制解释，最准确的是？"
    options:
      - "「他」的 Query 与「张工」的 Key 匹配度高，新向量融入了大量「张工」的 Value"
      - "模型在词表里查到「他」通常指代句子里的第一个人名"
      - "位置编码规定代词总是指向距离最近的名词"
      - "前馈网络单独处理「他」这个 Token 时识别出了指代关系"
    answer: [0]
    explain: |
      自注意力中，「他」用自己的 Q 和所有 Token 的 K 打分，与「张工」相关度高，Softmax 后权重大，加权求和时融入了「张工」的 V，于是表示中带上了指代信息。
      B、C 是编造的规则；D 错在 FFN 只对单个位置加工，位置之间的信息交流靠注意力。
  - id: d12-t6
    kp: d12-k2
    type: judge
    question: "在自注意力中，Q、K、V 来自同一组 Token 向量，只是分别乘了三个不同的、训练出来的矩阵。"
    answer: true
    explain: |
      自注意力的「自」就是指 Q、K、V 都来自同一序列：每个 Token 的向量乘 Wq、Wk、Wv 得到三个向量，矩阵在训练中学出来。
      交叉注意力才是 Q 来自一个序列、K/V 来自另一个序列（例如 Encoder-Decoder 结构）。
  - id: d12-t7
    kp: d12-k2
    type: single
    question: "把一次请求的输入从 1 万 Token 增加到 2 万 Token，注意力打分部分的计算量大约会怎样变化？"
    options:
      - "基本不变，因为模型参数量没变"
      - "约变为 2 倍，和输入长度成正比"
      - "约变为 4 倍，因为打分矩阵约是 n × n"
      - "减少一半，因为长文本每个 Token 分到的注意力更少"
    answer: [2]
    explain: |
      每个 Token 都要和其他 Token 打分，打分矩阵约 n × n，长度翻倍，打分计算量约变为 4 倍，这是长上下文昂贵、首字变慢的重要原因。
      A 忽略了计算量与序列长度相关；B 低估了增长；D 混淆了「注意力被分散」与「计算量」两个概念。
  - id: d12-t8
    kp: d12-k2
    type: multi
    question: "关于注意力计算中的各个步骤，哪些说法正确？"
    options:
      - "因果掩码把后面位置的分数屏蔽掉，防止训练时偷看答案"
      - "缩放是为了避免点积过大导致 Softmax 过于极端"
      - "Softmax 之后只保留权重最大的那一个 Value"
      - "多头注意力让不同的头可以关注不同类型的关系"
    answer: [0, 1, 3]
    explain: |
      A、B、D 正确：掩码保证因果性，缩放让训练更稳定，多头可以分别捕捉语法、指代、相邻关系等。
      C 错：注意力是软选择，所有 Value 按权重加权求和，并不是只取最大的一个。
  - id: d12-t9
    kp: d12-k3
    type: single
    question: "知识库问答的日志显示：首字延迟（TTFT）约 4 秒，之后输出速度正常。每次请求输入约 3 万 Token，输出约 300 Token。最应该优先优化的是？"
    options:
      - "限制输出长度，把 300 Token 压到 150"
      - "把非流式改成流式输出"
      - "换一个每秒输出 Token 更多的模型"
      - "减少输入：精简检索片段和 System Prompt，并利用前缀缓存"
    answer: [3]
    explain: |
      TTFT 主要由 prefill 决定，而 prefill 时间随输入长度增加；3 万 Token 输入是首字慢的主要原因，应减少输入并让稳定前缀命中 Prompt 缓存。
      A 影响 decode，不影响首字；B 已经能看到首字时间，说明已是流式；C 优化的是输出速度，而当前输出速度正常。
  - id: d12-t10
    kp: d12-k3
    type: single
    question: "下面的代码在流式调用里测量延迟。变量 ttft 主要反映的是哪个阶段的耗时？"
    code: |
      t0 = time.perf_counter()
      ttft = None
      stream = client.responses.create(model=MODEL, input=prompt, stream=True)
      for event in stream:
          if event.type == "response.output_text.delta" and ttft is None:
              ttft = time.perf_counter() - t0
          elif event.type == "response.completed":
              total = time.perf_counter() - t0
    options:
      - "Decode 阶段生成全部输出 Token 的时间"
      - "从发出请求到收到第一个文本增量，主要是排队、网络和 prefill"
      - "模型加载权重到显存的时间，每次请求都会发生"
      - "SSE 连接建立后服务端发送心跳的间隔"
    answer: [1]
    explain: |
      ttft 记录的是收到第一个文本增量的时刻，即首字延迟，主要由网络、排队和 prefill（并行处理全部输入）决定；total 减 ttft 才是 decode 的耗时。
      A 混淆了 ttft 和 total；C 模型权重常驻显存，不是每次加载；D 与心跳无关。
  - id: d12-t11
    kp: d12-k3
    type: judge
    question: "把非流式接口改成流式（SSE）后，一次长回答从开始到结束的总生成时间会明显缩短。"
    answer: false
    explain: |
      流式让用户在首字到达后就能看到内容，感知速度大幅提升，但模型生成全部 Token 的时间基本不变，总耗时仍约等于 TTFT 加上输出 Token 数乘以每 Token 间隔。
      要缩短总耗时，需要控制输出长度或换更快的模型。
  - id: d12-t12
    kp: d12-k3
    type: multi
    question: "关于 prefill 和 decode 两个阶段，哪些说法正确？"
    options:
      - "Prefill 并行处理全部输入，输入越长首字越慢"
      - "Decode 每步只生成 1 个 Token，输出越长总耗时越长"
      - "推理模型的推理 Token 在 decode 阶段生成，所以首个可见字会更晚"
      - "Decode 阶段可以并行一次生成全部输出，所以速度只取决于网络"
    answer: [0, 1, 2]
    explain: |
      A、B 是两个阶段的基本特征；C：推理 Token 也要逐个生成，排在可见答案之前，所以首个可见 Token 更晚。
      D 错：decode 是串行的，每个 Token 依赖前一个，速度主要受模型计算和显存带宽限制，而不是网络。
  - id: d12-t13
    kp: d12-k4
    type: single
    question: "下面是一个 Prompt 组装函数。团队发现 Prompt 缓存命中率几乎为 0，最有效的修改是？"
    code: |
      def build_instructions(user_name: str, rules: str, tools_doc: str) -> str:
          now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          return (
              f"当前时间：{now}，当前用户：{user_name}\n"
              f"{rules}\n"          # 约 3000 Token 的固定规则
              f"{tools_doc}\n"      # 约 1500 Token 的固定工具说明
          )
    options:
      - "把时间精确到天，减少前缀变化的频率"
      - "把 rules 和 tools_doc 压缩到 1000 Token 以内"
      - "把时间和用户名移到固定内容之后或本轮用户消息里"
      - "在每次请求前先发一次相同的请求预热缓存"
    answer: [2]
    explain: |
      缓存按前缀完全一致匹配，开头的秒级时间和用户名让每个请求前缀都不同。把动态信息移到固定规则和工具说明之后，前 4500 Token 就成了稳定前缀。
      A 仍会让不同用户、不同日期的前缀不同；B 压缩到太短可能低于最小可缓存长度，也没解决前缀变化；D 前缀不一致时预热也无效。
  - id: d12-t14
    kp: d12-k4
    type: judge
    question: "KV Cache 之所以可行，是因为在因果掩码下，前面 Token 的 K 和 V 不会因为后面出现新 Token 而改变。"
    answer: true
    explain: |
      因果掩码让每个位置只看前文，所以前面 Token 在各层的 K、V 一旦算出就固定不变，生成新 Token 时可以直接复用，只需计算新 Token 自己的 Q/K/V。
      这把 decode 每步的计算量从「重算整段」降到「只算一个新 Token」。
  - id: d12-t15
    kp: d12-k4
    type: single
    question: "私有化部署一个开源模型后，单个短请求很快，但把单请求上限放到 128K 并允许 50 并发后，服务频繁显存不足。最主要的原因是？"
    options:
      - "模型参数在每个请求里都会被复制一份"
      - "Tokenizer 处理长文本时占用了大量显存"
      - "Prompt 缓存把所有历史答案都存在了显存里"
      - "KV Cache 随序列长度和并发数线性增长，挤满显存"
    answer: [3]
    explain: |
      KV Cache 大小约与层数、序列长度、K/V 维度和并发数成正比，长上下文加高并发时显存常常先被它耗尽。可通过限制单请求长度、GQA 类模型、分页管理缓存等方式缓解。
      A 参数是共享的；B 分词在 CPU 上完成，占用很小；C 混淆了 Prompt 缓存与答案缓存。
  - id: d12-t16
    kp: d12-k4
    type: multi
    question: "关于 KV Cache、Prompt 缓存和业务答案缓存，哪些说法正确？"
    options:
      - "KV Cache 存的是单次请求内已算过的 K、V，不是答案"
      - "Prompt 缓存要求多个请求的开头部分完全一致才能复用"
      - "命中 Prompt 缓存的 Token 不再计入上下文窗口"
      - "业务答案缓存由你在 Redis 等系统里自行控制"
    answer: [0, 1, 3]
    explain: |
      A、B、D 正确：三者缓存的对象、位置和控制方各不相同。
      C 错：缓存只改变计费和速度，这些 Token 仍在上下文里，同样计入窗口上限，Anthropic 文档对此有明确说明。
exam:
  - id: d12-e1
    kp: d12-k1
    type: single
    question: "团队想用同一个对话大模型既做文档向量化又做回答生成，以「少维护一个模型」。从架构角度，你最合理的建议是？"
    options:
      - "可以，Decoder-only 模型最后一层输出就是最好的检索向量"
      - "可以，只要把 temperature 设为 0 输出就足够稳定"
      - "不合适，对话模型只能处理英文，检索需要中文模型"
      - "不合适，检索通常用专门训练的 Embedding 模型，生成用对话模型"
    answer: [3]
    explain: |
      Embedding 模型（多为 Encoder 结构）专门训练来让语义相近的文本向量接近，小、快、可批量；对话模型是为生成下一个 Token 训练的，直接拿来做检索向量效果和成本都不理想。
      A 的说法没有依据；B temperature 只影响采样，与向量质量无关；C 与事实不符。
  - id: d12-e2
    kp: d12-k2
    type: single
    question: "客户问：「你们的模型窗口是 100 万 Token，为什么不把 300 页合同一次塞进去对比，而要先检索条款？」结合注意力原理，最有说服力的回答是？"
    options:
      - "超过 10 万 Token 后模型会直接报错，无法处理"
      - "注意力计算随长度快速增长，首字慢、费用高，且长输入中关键信息更易被忽略"
      - "注意力只能看到最近的 4096 个 Token，前面的内容会被丢弃"
      - "合同里的表格无法被分词，必须先检索成纯文本"
    answer: [1]
    explain: |
      窗口够大只说明装得下。注意力打分随长度近似平方增长，prefill 变慢、费用上升；同时长输入中信息利用率下降，检索相关条款更快、更便宜、更准。
      A、C 与当前模型的事实不符；D 分词可以处理任何文本，表格问题是文档解析的事（Day 22）。
  - id: d12-e3
    kp: d12-k3
    type: single
    question: "一个 Agent 每轮都要把完整的历史和工具结果发给模型。随着轮数增加，用户反馈「每一轮开始回复都越来越慢」。最贴切的解释是？"
    options:
      - "每轮输入越来越长，prefill 处理时间增加，首字延迟变长"
      - "模型在多轮之后会自动切换为推理模式"
      - "Decode 阶段输出 Token 数随轮数线性增加"
      - "服务端为每个会话分配的 GPU 越来越少"
    answer: [0]
    explain: |
      模型无状态，每轮都重发全部历史，输入不断变长，prefill 要处理的 Token 越来越多，首字延迟随之上升。可通过稳定前缀命中缓存、压缩历史和工具结果缓解（Day 35）。
      B 没有依据；C 输出长度不一定随轮数增加，且影响的是总耗时而非首字；D 是臆测。
  - id: d12-e4
    kp: d12-k4
    type: single
    question: "某团队把检索到的文档片段放在 System Prompt 最前面，固定的业务规则放在后面。每个请求检索结果都不同。对 Prompt 缓存的影响是？"
    options:
      - "没有影响，缓存按整段内容的相似度匹配"
      - "影响很小，只要业务规则不变就能命中缓存"
      - "缓存基本失效，因为前缀从第一段就不同，后面的规则也无法复用"
      - "缓存会命中检索片段，因为片段来自同一个知识库"
    answer: [2]
    explain: |
      Prompt 缓存要求前缀完全一致，从开头逐段比较。检索片段每次不同且放在最前，后面即使规则完全相同也无法复用。应把固定规则放前、动态检索结果放后。
      A 缓存不是相似度匹配；B 忽略了前缀顺序；D 不同请求的片段内容并不相同。
  - id: d12-e5
    kp: d12-k3
    type: multi
    question: "你要为两个功能设置超时与优化方向：①把 2 万字会议记录总结成 5 条要点；②根据一句话需求生成 2000 字的方案初稿。哪些判断正确？"
    options:
      - "功能①耗时主要在 prefill，应优先精简输入或分段处理"
      - "功能②耗时主要在 decode，应流式输出并控制篇幅"
      - "两个功能的超时可以设成同一个固定值，因为模型相同"
      - "功能②的总耗时可按 TTFT 加上输出 Token 数乘以每 Token 间隔估算"
    answer: [0, 1, 3]
    explain: |
      长输入短输出的功能①主要花在 prefill；短输入长输出的功能②主要花在 decode，总耗时约为 TTFT 加输出 Token 数乘每 Token 间隔。
      C 错：两类请求的延迟构成完全不同，超时应按各自的输入输出规模估算。
  - id: d12-e6
    kp: d12-k4
    type: multi
    question: "要让一个多轮 Coding Agent 更好地利用 Prompt 缓存，哪些做法正确？"
    options:
      - "系统规则和工具定义放在最前面并保持不变"
      - "每轮新增的工具结果追加在末尾，不改动之前的内容"
      - "在开头写入本轮请求 ID，方便排查日志"
      - "通过响应 usage 里的 cached_tokens 观察命中情况"
    answer: [0, 1, 3]
    explain: |
      A、B 保证前缀稳定且只在尾部增长，多轮之间可持续复用；D 用实际数据验证命中率，而不是猜。
      C 错：请求 ID 每次不同，写在开头会让整段前缀无法复用，应放在日志或请求头里。
  - id: d12-e7
    kp: d12-k2
    type: judge
    question: "注意力权重可以直接当作模型做出某个判断的完整解释，因此可以把它展示给用户作为「AI 的推理依据」。"
    answer: false
    explain: |
      注意力权重能提供一些线索，但模型的输出是多层注意力和前馈网络共同作用的结果，权重本身不能等同于决策原因。
      面向用户的「依据」应该是可核对的引用来源（Day 27），而不是内部的注意力分布。
  - id: d12-e8
    kp: d12-k1
    type: judge
    question: "Encoder-only 模型（如 BERT 类）每个位置能看到全文，更适合做分类和生成 Embedding 向量，但不擅长自回归地生成长文本。"
    answer: true
    explain: |
      Encoder-only 是双向的，每个位置同时利用前后文，适合理解类任务和向量表示；它没有按因果顺序逐个预测下一个 Token 的训练目标，所以不用于自回归生成。
      这也是 RAG 系统中检索模型和生成模型分开选型的原因。
  - id: d12-e9
    kp: d12-k4
    type: case
    question: |
      某客服机器人的 System Prompt 约 6000 Token（话术规则 + 工具说明），用户问题一般只有几十个字。上线后首字延迟经常超过 3 秒，输入费用也明显高于预估。
      排查发现模板第一行是「当前时间：2026-11-12 10:23:45，客户昵称：xxx」，之后才是固定规则；日志里 usage 的 cached_tokens 一直是 0。
      最合理的根因判断和处理是？
    options:
      - "6000 Token 太长，必须把 System Prompt 删减到 500 Token 以内"
      - "开头的时间和昵称让前缀每次不同，应移到固定规则之后"
      - "模型不支持 Prompt 缓存，应换一家支持缓存的厂商"
      - "首字慢是网络问题，应该在网关上开启 HTTP 缓存"
    answer: [1]
    explain: |
      cached_tokens 为 0 且模板开头是秒级时间和昵称，说明前缀每次都不同，6000 Token 的固定规则无法复用，每次都要完整 prefill 并按全价计费。把动态信息移到固定内容之后即可。
      A 删减可能损害效果且没有解决根因；C 没有证据；D HTTP 缓存与模型的前缀缓存无关。
interview:
  - id: d12-i1
    kp: d12-k2
    type: oral
    difficulty: 2
    question: "不用公式，讲讲 Transformer 里的自注意力是怎么工作的？为什么生成模型需要因果掩码？为什么上下文越长越贵？"
    key_points:
      - {text: "用 Q/K/V 讲清：Q 与所有 K 打分、Softmax 成权重、加权求和 V", dim: principle}
      - {text: "说明作用：让每个 Token 结合上下文得到新表示，例如理解代词指代", dim: concept}
      - {text: "说明因果掩码保证只看前文，训练能并行且不偷看答案", dim: principle}
      - {text: "说明打分矩阵约 n × n，长度翻倍计算约 4 倍，推出长上下文贵", dim: principle}
      - {text: "落到工程：用 RAG 精简上下文、用清晰分隔组织 Prompt", dim: engineering}
    reference: |
      自注意力可以理解成一次「检索」：每个 Token 的向量乘上三个训练出来的矩阵，得到 Query、Key、Value。
      当前 Token 用自己的 Q 和所有 Token 的 K 做点积打分，缩放后经过 Softmax 变成和为 1 的权重，再按权重把所有 Token 的 V 加权求和，得到融合了上下文的新向量。比如「工单派给了张工，因为他负责 3 号楼」里，「他」和「张工」匹配度高，新向量里就带上了张工的信息。多头注意力是把这个过程拆成多组，各自关注不同类型的关系。
      **因果掩码**：生成模型在训练时整段文本并行输入，如果每个位置能看到后面的内容就等于偷看答案，所以要把后面位置的分数屏蔽掉，这样既能并行训练，又和生成时「只能看前文」一致。
      **为什么长上下文贵**：每个 Token 都要和其他 Token 打分，打分矩阵约 n × n，长度翻倍计算约 4 倍，首字更慢、费用更高。所以工程上我会用 RAG 只放相关片段，并用清晰的分隔和来源标签组织 Prompt，而不是把所有资料都塞进去。
    oral: |
      我一般把自注意力讲成一次「检索」。每个 Token 有三个向量：Query 是「我想找什么」，Key 是「我能提供什么的标签」，Value 是「我的实际内容」。当前 Token 拿 Query 和所有 Key 打分，Softmax 变成权重，再把所有 Value 按权重混起来，就得到结合了上下文的新表示，比如能把「他」理解成前面的「张工」。
      生成模型要加因果掩码，是为了训练时能整段并行，又不让每个位置偷看后面的答案。
      至于为什么上下文越长越贵：每个 Token 都要和其他 Token 打分，大约是 n 乘 n，长度翻倍计算就是四倍。所以我在知识库项目里坚持用检索只放相关片段，而不是把整份文档塞进去。
  - id: d12-i2
    kp: d12-k3
    type: scenario
    difficulty: 3
    question: "你负责的知识库问答上线后，用户投诉「问完要等好几秒才开始出字」，但开始出字后速度还可以。请说明你的排查思路和优化方案。"
    key_points:
      - {text: "先拆分延迟：TTFT 与每 Token 间隔分开看，判断慢在 prefill", dim: principle}
      - {text: "检查输入构成：System Prompt、检索片段数量、历史长度、工具定义各占多少 Token", dim: engineering}
      - {text: "检查 Prompt 缓存：动态内容是否在前缀、cached_tokens 是否为 0", dim: engineering}
      - {text: "给出优化：精简片段与历史、稳定前缀放前、按需换更快模型", dim: engineering}
      - {text: "用日志指标验证优化前后效果，而不是凭感觉", dim: project}
    reference: |
      **第一步：确认慢在哪个阶段。** 在 LLM 客户端里记录发请求、收到第一个文本增量、收到结束事件三个时间点和 usage。用户描述的是「开始慢、之后正常」，即 TTFT 高而每 Token 间隔正常，问题大概率在 **prefill**（处理全部输入），而不是 decode。
      **第二步：看输入构成。** 拆出 System Prompt、检索片段、对话历史、工具定义各占多少 Token。常见问题是检索 Top-K 放得太多、每个片段太长，或者历史没有裁剪。
      **第三步：看 Prompt 缓存。** 检查 usage 里的 cached_tokens。如果一直是 0，看模板开头是不是有时间戳、用户名、请求 ID，或者检索片段被放在了固定规则前面。
      **优化方案**：
      1. 稳定内容（角色、规则、输出格式、工具定义）放最前且保持不变，动态内容放后，让前缀命中缓存；
      2. 控制检索片段数量和长度，配合重排只保留最相关的（Day 26）；历史做裁剪或摘要（Day 13）；
      3. 如果输入已经精简仍然慢，再评估更快的模型或就近的部署区域。
      **验证**：对比优化前后的 TTFT 分布（P50/P95）、平均输入 Token、缓存命中率，用数据确认效果。
    oral: |
      我会先把延迟拆开。我们的 LLM 客户端会记录首字时间和总耗时，用户说开始慢、出字后正常，那就是首字延迟高，问题在 prefill，也就是处理输入这一段，跟输出长度关系不大。
      接着我会看输入构成：System Prompt、检索片段、历史各占多少 Token。常见是检索片段放太多，或者历史没裁剪。然后看 usage 里的 cached_tokens，如果一直是 0，多半是模板开头放了时间戳或者把检索结果放在了规则前面，缓存永远命中不了。
      优化就是稳定内容放前面命中缓存、检索片段控制数量、历史做裁剪，最后再考虑换更快的模型。改完我会对比首字延迟的 P50 和 P95 来验证。
  - id: d12-i3
    kp: d12-k4
    type: design
    difficulty: 4
    question: "客户要求私有化部署一个开源大模型，用于内部长文档问答，提出「单请求支持 128K 上下文、同时 50 人使用」。作为应用负责人，你会怎么评估这个需求的风险，并给出可落地的方案？"
    key_points:
      - {text: "指出 KV Cache 显存随序列长度乘并发数增长，128K 乘 50 并发是主要风险", dim: principle}
      - {text: "指出长上下文还带来首字延迟变长和信息利用率下降", dim: principle}
      - {text: "方案：用 RAG 或分段处理把常规请求压到较短上下文，长上下文只给少数场景", dim: engineering}
      - {text: "方案：限制单请求最大长度和并发、排队与超时策略，选择 GQA 等节省 KV 的模型和分页缓存的推理框架", dim: engineering}
      - {text: "用压测和评测数据确认 GPU 配置与效果，再和客户确认 SLA", dim: project}
    reference: |
      **风险评估**：
      1. **显存**：KV Cache 大小约与「层数 × 序列长度 × K/V 维度 × 并发数」成正比。128K 长度乘 50 并发，KV Cache 很可能远超模型参数本身占用的显存，表现为显存不足或并发上不去。
      2. **延迟**：prefill 要处理全部输入，128K 输入的首字延迟会明显变长，并发时还会互相排队。
      3. **效果**：窗口装得下不等于用得好，长输入中间的信息更容易被忽略（Day 13 长上下文退化）。
      **方案**：
      1. **先改需求形态**：绝大多数问答走 RAG，只把相关片段送进模型，常规请求控制在较短上下文；真正需要通读的任务（全文摘要、全文比对）用「分段处理再汇总」。
      2. **推理侧配置**：选择 GQA 等节省 KV 的模型，使用支持分页管理 KV Cache 的推理框架（如 vLLM），设置单请求最大长度和最大并发，超出排队并给出明确提示。
      3. **按场景分级**：长上下文请求走单独的队列和配额，避免拖垮普通问答。
      4. **用数据定配置**：用真实文档做压测，测不同长度、并发下的显存、TTFT、吞吐；用评测集测不同上下文长度的回答准确率；据此确定 GPU 数量，再和客户确认 SLA（比如常规问答 P95 首字时间、长文档任务的处理时长）。
    oral: |
      我会先把风险讲清楚。最大的风险是显存：KV Cache 跟序列长度乘并发数成正比，128K 乘 50 人，缓存占的显存很可能比模型参数本身还多，结果就是并发上不去。其次是首字延迟，十几万 Token 的 prefill 本身就慢；还有效果，窗口装得下不代表用得好。
      所以方案上我会先改需求形态：日常问答走 RAG，只送相关片段；需要通读全文的任务用分段处理再汇总。推理侧选节省 KV 的模型和支持分页缓存的框架，比如 vLLM，限制单请求长度和并发，长文档任务单独排队。
      最后一定用真实文档压测显存、首字时间和吞吐，再用评测集看效果，拿数据去和客户确认 GPU 配置和 SLA。
