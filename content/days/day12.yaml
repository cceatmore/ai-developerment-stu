day: 12
phase: 2
title: Transformer 直觉
goals:
  - 能画出 Decoder-only Transformer 的数据流：Token 嵌入 → 多层「注意力 + 前馈网络」→ 下一个 Token 的概率
  - 能不用公式讲清自注意力的计算流程（Q/K/V 打分、因果掩码、Softmax、加权求和），并解释为什么上下文越长计算越多
  - 能用 prefill / decode 两阶段解释首字延迟和输出速度分别受什么影响，并据此定位慢请求
  - 能解释 KV Cache 与 Prompt 缓存的原理，说出长上下文在时间、显存、费用上的代价，并让 Prompt 模板更易命中缓存
minutes: 60
